[Socket]
# Ubuntu's clamav-daemon package uses systemd socket activation. The packaged
# socket may expose only the Unix socket, so clamd can be healthy while the
# Celar contract on 127.0.0.1:3310 is unreachable. Append an explicit loopback
# TCP listener without replacing the distro-managed Unix socket.
ListenStream=127.0.0.1:3310
