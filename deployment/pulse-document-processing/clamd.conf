Foreground yes
User nobody
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
LocalSocketGroup nogroup
FixStaleSocket yes
PidFile /run/clamav/clamd.pid
LogTime yes
LogClean no
LogVerbose no
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanPE yes
StreamMaxLength 32M
MaxFileSize 32M
MaxScanSize 128M
MaxRecursion 16
MaxFiles 1000
MaxThreads 1
MaxQueue 4
MaxScanTime 30000
ReadTimeout 15
CommandReadTimeout 5
SendBufTimeout 500
SelfCheck 60
ConcurrentDatabaseReload yes
AlertExceedsMax yes
AlertEncrypted yes
