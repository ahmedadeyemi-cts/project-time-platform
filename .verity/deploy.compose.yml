# Verity Shipyard deploy topology.
#
# Images are pinned by DIGEST (WEB_IMAGE / API_IMAGE) — never by mutable tag —
# so staging and prod run byte-identical artifacts. deploy.sh validates the pinned
# values from .verity/release.env (written by scripts/verity/pin-digests.sh) and
# operator config from .verity/deploy.env.
name: projectpulse

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ProjectPulse}
      POSTGRES_USER: ${POSTGRES_USER:-projectpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .verity/deploy.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectpulse} -d ${POSTGRES_DB:-ProjectPulse}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?run scripts/verity/pin-digests.sh first}
    environment:
      ASPNETCORE_HTTP_PORTS: "5080"
      # The application identity is fixed; the provisioning administrator is never
      # interpolated into the API connection. deploy.sh validates and provisions it.
      ConnectionStrings__ProjectPulse: Host=db;Port=5432;Database=${POSTGRES_DB:-ProjectPulse};Username=ptp_runtime;Password=${RUNTIME_DB_PASSWORD:?set a separate runtime password in .verity/deploy.env};SSL Mode=Disable;Include Error Detail=false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:?run scripts/verity/pin-digests.sh first}
    environment:
      API_UPSTREAM: http://api:5080
      NGINX_RESOLVER: 127.0.0.11
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
