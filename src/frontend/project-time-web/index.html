<!doctype html>
<html lang="en" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#004b8d" />
    <title>Pulse</title>
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem('ptp-theme');
          const theme = storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      MODULE_026_NATIVE_REACT_ROUTE
      Historical overlays are intentionally absent. Module 026 and all other
      product surfaces are React-owned so body MutationObservers cannot remove,
      reparent, or duplicate nodes inside #root.
    -->
    <script type="application/projectpulse-retired">
(function () {
  // MODULE_026_NATIVE_REACT_ROUTE: the historical local-only overlay is disabled.
  return;
})();
    </script>
  </body>
</html>
