version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/src/backend/ProjectTime.Api"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/src/frontend/project-time-web"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/deployment/containers/api"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:45"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/deployment/containers/web"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
