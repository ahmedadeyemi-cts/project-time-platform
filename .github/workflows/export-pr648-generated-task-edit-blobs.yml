name: Export PR 648 Generated Task Edit Sources

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/export-pr648-generated-task-edit-blobs.yml'

permissions:
  contents: write

concurrency:
  group: export-pr648-generated-task-edit-sources
  cancel-in-progress: false

jobs:
  export:
    name: Generate and export TaskEdit source blobs
    if: >-
      github.event.pull_request.number == 648 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/deploy-pr645-module001a-module013-test-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Generate sources and export immutable Git blobs
        working-directory: src/frontend/project-time-web
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          create_blob() {
            local file="$1" response sha local_sha
            response="$(jq -Rs '{content:.,encoding:"utf-8"}' < "$file" \
              | curl -fsSL --retry 4 --retry-all-errors -X POST \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs" \
                  --data-binary @-)"
            sha="$(jq -r '.sha // empty' <<<"$response")"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || fail "GitHub did not return a valid blob SHA for $file."
            local_sha="$(git hash-object "$file")"
            [[ "$sha" == "$local_sha" ]] || fail "Remote blob differs from generated file $file."
            printf '%s\n' "$sha"
          }

          [[ -n "$GH_TOKEN" ]] || fail 'GitHub workflow token is unavailable.'
          npm ci --no-audit --no-fund
          npm run prebuild

          [[ -s src/TaskEditDrawer.jsx ]] || fail 'TaskEditDrawer.jsx was not generated.'
          [[ -s src/TaskEditSupport.js ]] || fail 'TaskEditSupport.js was not generated.'

          grep -RIn --exclude-dir=node_modules --exclude-dir=dist \
            -E 'isAssigneeEligible|TaskEditDrawer|TaskEditSupport' src scripts \
            > "$RUNNER_TEMP/task-edit-references.txt" || true

          DRAWER_SHA="$(create_blob src/TaskEditDrawer.jsx)"
          SUPPORT_SHA="$(create_blob src/TaskEditSupport.js)"
          REFERENCES_SHA="$(create_blob "$RUNNER_TEMP/task-edit-references.txt")"

          echo "TASK_EDIT_DRAWER_BLOB_SHA=$DRAWER_SHA"
          echo "TASK_EDIT_SUPPORT_BLOB_SHA=$SUPPORT_SHA"
          echo "TASK_EDIT_REFERENCES_BLOB_SHA=$REFERENCES_SHA"
          echo 'ENVIRONMENT_MUTATION=NONE'
          echo 'DEPLOYMENT_ATTEMPTED=NO'
