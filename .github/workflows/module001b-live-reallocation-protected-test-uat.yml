name: Module 001B Live Reallocation Protected-Test UAT

on:
  workflow_run:
    workflows:
      - Deploy System-wide Enterprise Reliability and Utilization to Protected Test
    branches:
      - main
    types:
      - completed

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-test
  cancel-in-progress: false

jobs:
  live-reallocation-uat:
    name: Prove submitted-time reallocation on deployed Protected Test
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: ${{ vars.PUBLIC_URL }}
      EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      TEST_LOGIN_PASSWORD: ${{ secrets.PROJECTPULSE_M087_PASSWORD }}
      EVIDENCE_DIR: /tmp/module001b-live-reallocation-uat

    steps:
      - name: Sign in to protected Test subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Enable disposable Module 001B Protected-Test fixture surface
        id: fixture_gate
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          BASE="${BASE%/}"
          [[ "$BASE" == "https://phd-west-test.onenecklab.com" ]] \
            || fail 'PUBLIC_URL is not the governed Protected-Test origin.'
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail 'The triggering deployment did not provide an exact release SHA.'

          CURRENT_SUBSCRIPTION="$(az account show --query id -o tsv --only-show-errors)"
          [[ "${CURRENT_SUBSCRIPTION,,}" == "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]] \
            || fail 'Azure login is outside the protected Test subscription.'

          API_JSON="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            -o json --only-show-errors)"
          [[ "$(jq -r '.tags.environment // empty' <<<"$API_JSON")" == test ]] \
            || fail 'The target API is not tagged Test.'
          ACTIVE_SOURCE="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$API_JSON")"
          [[ "$ACTIVE_SOURCE" == "$EXPECTED_RELEASE_SHA" ]] \
            || fail "Protected Test is not running the triggering release SHA ($ACTIVE_SOURCE != $EXPECTED_RELEASE_SHA)."

          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            --set-env-vars PROJECTPULSE_MODULE001B_PROTECTED_TEST_UAT_ENABLED=true \
            --revision-suffix "m1be-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none --only-show-errors

          AFTER_JSON="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            -o json --only-show-errors)"
          SOURCE_AFTER="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$AFTER_JSON")"
          FLAG_AFTER="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_MODULE001B_PROTECTED_TEST_UAT_ENABLED") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$AFTER_JSON")"
          [[ "$SOURCE_AFTER" == "$EXPECTED_RELEASE_SHA" ]] \
            || fail 'The source marker changed while enabling the Protected-Test fixture surface.'
          [[ "$FLAG_AFTER" == true ]] \
            || fail 'The Protected-Test fixture surface did not enable.'
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          echo 'MODULE001B_PROTECTED_TEST_FIXTURE_SURFACE=ENABLED_TEMPORARILY'

      - name: Prove live Module 001B submitted-time reallocation
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          fail() { echo "ERROR: $*" >&2; exit 1; }

          BASE="${BASE%/}"
          [[ "$BASE" == "https://phd-west-test.onenecklab.com" ]] \
            || fail 'PUBLIC_URL is not the governed Protected-Test origin.'
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail 'The triggering deployment did not provide an exact release SHA.'
          [[ ${#TEST_LOGIN_PASSWORD} -ge 12 ]] \
            || fail 'PROJECTPULSE_M087_PASSWORD is required for authenticated UAT.'

          install -d -m 0700 "$EVIDENCE_DIR"
          SESSION=''
          ENTRY_ID=''

          login() {
            local output="$1" payload status
            payload="$(mktemp)"
            chmod 0600 "$payload"
            jq -n \
              --arg username 'project.team.coordinator@ussignal.local' \
              --arg password "$TEST_LOGIN_PASSWORD" \
              '{username:$username,password:$password}' > "$payload"
            status="$(curl -sS --http1.1 --connect-timeout 30 --max-time 90 \
              -o "$output" -w '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              -H 'Content-Type: application/json' \
              -H "Origin: $BASE" \
              -H 'Sec-Fetch-Site: same-origin' \
              --data-binary @"$payload" \
              "$BASE/api/auth/local/login" || true)"
            rm -f "$payload"
            printf '%s\n' "$status"
          }

          request() {
            local method="$1" path="$2" output="$3" input="${4:-}"
            local args=(
              -sS --http1.1 --connect-timeout 30 --max-time 120
              -X "$method"
              -o "$output" -w '%{http_code}'
              -H 'Cache-Control: no-cache'
              -H "Authorization: Bearer $SESSION"
              -H "X-ProjectPulse-Session: $SESSION"
              -H 'X-ProjectPulse-Module-Number: 001B'
              -H "Origin: $BASE"
              -H 'Sec-Fetch-Site: same-origin'
            )
            if [[ -n "$input" ]]; then
              args+=( -H 'Content-Type: application/json' --data-binary @"$input" )
            fi
            curl "${args[@]}" "$BASE$path" || true
          }

          cleanup_fixture() {
            if [[ -z "$SESSION" || -z "$ENTRY_ID" ]]; then return 0; fi
            set +e
            local status
            status="$(request DELETE "/api/runtime/timesheet/steward/001b/protected-test-uat/fixture/$ENTRY_ID" \
              "$EVIDENCE_DIR/cleanup-on-exit.json")"
            echo "MODULE001B_UAT_EXIT_CLEANUP_HTTP=$status"
            set -e
            return 0
          }
          trap cleanup_fixture EXIT

          READY=false
          for attempt in $(seq 1 30); do
            health_status="$(curl -sS --max-time 30 \
              -o "$EVIDENCE_DIR/health.json" -w '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "$BASE/health?module001b-live-uat=${GITHUB_RUN_ID}-$attempt" || true)"
            if [[ "$health_status" == 200 ]] \
              && jq -e '.status == "healthy"' "$EVIDENCE_DIR/health.json" >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 5
          done
          [[ "$READY" == true ]] || fail 'Protected Test did not become healthy after enabling the fixture surface.'

          LOGIN_RESPONSE="$EVIDENCE_DIR/coordinator-login.json"
          login_status="$(login "$LOGIN_RESPONSE")"
          [[ "$login_status" == 200 ]] || fail "Coordinator login returned HTTP $login_status."
          jq -e '.provider == "LOCAL" and .mustChangePassword == false and (.sessionToken | type == "string" and length > 0)' \
            "$LOGIN_RESPONSE" >/dev/null || fail 'Coordinator login did not satisfy the session contract.'
          SESSION="$(jq -r '.sessionToken' "$LOGIN_RESPONSE")"
          echo "::add-mask::$SESSION"
          jq 'del(.sessionToken)' "$LOGIN_RESPONSE" > "$EVIDENCE_DIR/coordinator-login-redacted.json"
          rm -f "$LOGIN_RESPONSE"

          capability_status="$(request GET \
            '/api/runtime/timesheet/steward/001b/reallocation/capabilities' \
            "$EVIDENCE_DIR/capabilities.json")"
          [[ "$capability_status" == 200 ]] || fail "Module 001B capabilities returned HTTP $capability_status."
          jq -e '
            .module == "001B"
            and .allocationOnly == true
            and .submissionStatePreserved == true
            and .unsubmitRequired == false
            and .workerResubmissionRequired == false
            and .managerApprovalRequired == false
            and .projectManagerApprovalRequired == false
          ' "$EVIDENCE_DIR/capabilities.json" >/dev/null \
            || fail 'Module 001B capabilities do not preserve the approved reallocation contract.'

          fixture_status="$(request POST \
            '/api/runtime/timesheet/steward/001b/protected-test-uat/fixture' \
            "$EVIDENCE_DIR/fixture.json")"
          [[ "$fixture_status" == 201 ]] || fail "Protected-Test fixture creation returned HTTP $fixture_status."
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" '
            .status == "protected_test_fixture_ready"
            and .module == "001B"
            and .sourceCommit == $release
            and .targetEmail == "demo.engineer@ussignal.local"
            and .weekStart == "2099-12-27"
            and .workDate == "2099-12-28"
            and .expectedHours == 1.25
            and .expectedStatus == "submitted"
            and .destinationType == "non_project"
            and .disposable == true
          ' "$EVIDENCE_DIR/fixture.json" >/dev/null \
            || fail 'Protected-Test fixture did not satisfy the isolated submitted-entry contract.'

          TARGET_USER_ID="$(jq -r '.targetUserId' "$EVIDENCE_DIR/fixture.json")"
          ENTRY_ID="$(jq -r '.timeEntryId' "$EVIDENCE_DIR/fixture.json")"
          CATEGORY_ID="$(jq -r '.nonProjectTimeCategoryId' "$EVIDENCE_DIR/fixture.json")"
          [[ "$TARGET_USER_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || fail 'Fixture target user ID is invalid.'
          [[ "$ENTRY_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || fail 'Fixture time-entry ID is invalid.'
          [[ "$CATEGORY_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || fail 'Fixture destination category ID is invalid.'

          MOVE_PAYLOAD="$(mktemp)"
          jq -n \
            --arg targetUserId "$TARGET_USER_ID" \
            --arg categoryId "$CATEGORY_ID" \
            '{
              targetUserId:$targetUserId,
              destinationType:"non_project",
              assignmentId:null,
              projectId:null,
              taskId:null,
              nonProjectTimeCategoryId:$categoryId,
              reason:"Protected Test synthetic Module 001B submitted-time reallocation UAT."
            }' > "$MOVE_PAYLOAD"

          move_status="$(request POST \
            "/api/runtime/timesheet/steward/001b/reallocation/entries/$ENTRY_ID/move" \
            "$EVIDENCE_DIR/move.json" "$MOVE_PAYLOAD")"
          rm -f "$MOVE_PAYLOAD"
          [[ "$move_status" == 200 ]] || fail "Live Module 001B /move returned HTTP $move_status."
          jq -e \
            --arg entryId "$ENTRY_ID" \
            --arg targetUserId "$TARGET_USER_ID" \
            --arg categoryId "$CATEGORY_ID" '
            .status == "reallocated"
            and .module == "001B"
            and .apiContractVersion == "module001b-time-reallocation-v1-2026-08-28"
            and .entry.timeEntryId == $entryId
            and .entry.userId == $targetUserId
            and .entry.workDate == "2099-12-28"
            and .entry.hours == 1.25
            and .entry.status == "submitted"
            and .entry.nonProjectTimeCategoryId == $categoryId
            and .previousStatus == "submitted"
            and .currentStatus == "submitted"
            and .submissionStatePreserved == true
            and .userMustResubmit == false
            and .managerApprovalRequired == false
            and .projectManagerApprovalRequired == false
            and .invariants.workerUnchanged == true
            and .invariants.workDateUnchanged == true
            and .invariants.workedTimeUnchanged == true
            and .invariants.statusUnchanged == true
          ' "$EVIDENCE_DIR/move.json" >/dev/null \
            || fail 'Live Module 001B /move response violated the submitted-time reallocation contract.'

          workspace_status="$(request GET \
            "/api/runtime/timesheet/steward/v2/users/$TARGET_USER_ID/workspace?weekStart=2099-12-27" \
            "$EVIDENCE_DIR/workspace-after.json")"
          [[ "$workspace_status" == 200 ]] || fail "Persisted workspace reload returned HTTP $workspace_status."
          jq -e \
            --arg entryId "$ENTRY_ID" \
            --arg categoryId "$CATEGORY_ID" '
            .timesheet.status == "submitted"
            and any(.entries[]?;
              .timeEntryId == $entryId
              and .status == "submitted"
              and .hours == 1.25
              and .workDate == "2099-12-28"
              and .projectId == null
              and .taskId == null
              and .nonProjectTimeCategoryId == $categoryId
            )
          ' "$EVIDENCE_DIR/workspace-after.json" >/dev/null \
            || fail 'The reallocated entry did not persist with its submitted state and protected fields intact.'

          cleanup_status="$(request DELETE \
            "/api/runtime/timesheet/steward/001b/protected-test-uat/fixture/$ENTRY_ID" \
            "$EVIDENCE_DIR/cleanup.json")"
          [[ "$cleanup_status" == 200 ]] || fail "Protected-Test fixture cleanup returned HTTP $cleanup_status."
          jq -e '
            .status == "protected_test_fixture_removed"
            and .module == "001B"
            and .auditVerified == true
            and .currentEmployeeWeekMutation == false
          ' "$EVIDENCE_DIR/cleanup.json" >/dev/null \
            || fail 'Cleanup did not verify the Module 001B immutable audit evidence.'
          ENTRY_ID=''
          trap - EXIT

          logout_status="$(curl -sS --max-time 60 \
            -X POST -o "$EVIDENCE_DIR/logout.json" -w '%{http_code}' \
            -H "Authorization: Bearer $SESSION" \
            -H "X-ProjectPulse-Session: $SESSION" \
            -H 'X-ProjectPulse-Module-Number: 001B' \
            -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
            "$BASE/api/auth/session/logout" || true)"
          [[ "$logout_status" == 200 ]] || fail "Coordinator logout returned HTTP $logout_status."
          unset SESSION TEST_LOGIN_PASSWORD

          jq -n \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg triggeringRun '${{ github.event.workflow_run.id }}' \
            '{
              status:"passed",
              module:"001B",
              protectedTestRelease:$release,
              triggeringDeploymentRun:$triggeringRun,
              liveMoveHttpStatus:200,
              persistedReloadVerified:true,
              submittedStatePreserved:true,
              workerResubmissionRequired:false,
              managerApprovalRequired:false,
              projectManagerApprovalRequired:false,
              immutableAuditVerified:true,
              disposableFixtureRemoved:true,
              currentEmployeeWeekMutation:false,
              productionMutation:false
            }' > "$EVIDENCE_DIR/summary.json"

          cat "$EVIDENCE_DIR/summary.json"
          echo 'MODULE001B_LIVE_REALLOCATION_UAT=PASSED'

      - name: Disable disposable Module 001B Protected-Test fixture surface
        if: ${{ always() && steps.fixture_gate.outputs.started == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          BASE="${BASE%/}"
          CURRENT_SUBSCRIPTION="$(az account show --query id -o tsv --only-show-errors)"
          [[ "${CURRENT_SUBSCRIPTION,,}" == "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]] \
            || fail 'Azure login is outside the protected Test subscription during fixture shutdown.'

          BEFORE_JSON="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            -o json --only-show-errors)"
          [[ "$(jq -r '.tags.environment // empty' <<<"$BEFORE_JSON")" == test ]] \
            || fail 'The fixture shutdown target is not tagged Test.'
          SOURCE_BEFORE="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$BEFORE_JSON")"
          [[ "$SOURCE_BEFORE" == "$EXPECTED_RELEASE_SHA" ]] \
            || fail 'The deployed source changed before fixture shutdown.'

          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            --set-env-vars PROJECTPULSE_MODULE001B_PROTECTED_TEST_UAT_ENABLED=false \
            --revision-suffix "m1bd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none --only-show-errors

          AFTER_JSON="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            -o json --only-show-errors)"
          SOURCE_AFTER="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$AFTER_JSON")"
          FLAG_AFTER="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_MODULE001B_PROTECTED_TEST_UAT_ENABLED") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$AFTER_JSON")"
          [[ "$SOURCE_AFTER" == "$EXPECTED_RELEASE_SHA" ]] \
            || fail 'The source marker changed while disabling the Protected-Test fixture surface.'
          [[ "$FLAG_AFTER" == false ]] \
            || fail 'The Protected-Test fixture surface did not disable.'

          READY=false
          for attempt in $(seq 1 30); do
            health_status="$(curl -sS --max-time 30 \
              -o /tmp/module001b-disable-health.json -w '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "$BASE/health?module001b-fixture-disabled=${GITHUB_RUN_ID}-$attempt" || true)"
            if [[ "$health_status" == 200 ]] \
              && jq -e '.status == "healthy"' /tmp/module001b-disable-health.json >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 5
          done
          [[ "$READY" == true ]] || fail 'Protected Test did not return healthy after disabling the fixture surface.'
          echo 'MODULE001B_PROTECTED_TEST_FIXTURE_SURFACE=DISABLED'
