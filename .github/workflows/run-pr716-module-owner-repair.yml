name: Execute PR 716 Module Owner Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/run-pr716-module-owner-repair.yml'

permissions:
  contents: write

concurrency:
  group: execute-pr716-module-owner-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/module-owner-031-033-runtime-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: diagnostic/module-owner-031-033-runtime-20260818
          fetch-depth: 0
          persist-credentials: true

      - name: Extract and execute the reviewed repair payload
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/patch-pr716-module-owner-repair.yml').read_text().splitlines()
          step_marker = '      - name: Replace diagnostic with reviewed repair'
          start = source.index(step_marker)
          run_line = next(index for index in range(start + 1, len(source)) if source[index] == '        run: |')
          end = next(
              (index for index in range(run_line + 1, len(source)) if source[index].startswith('      - name:')),
              len(source),
          )
          body = []
          for line in source[run_line + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(body) + '\n'
          script = script.replace(
              '[[ "$(git rev-parse HEAD^)" == \'949b2bd1b88086ee511d06df3c74a64963cb9675\' ]] || {',
              'git merge-base --is-ancestor \'949b2bd1b88086ee511d06df3c74a64963cb9675\' HEAD || {',
              1,
          )
          script = script.replace(
              "regression_path.write_text(r'''#!/usr/bin/env bash",
              "regression_path.write_text((r'''#!/usr/bin/env bash",
              1,
          )
          script = script.replace(
              "''').replace('\\n          ', '\\n').lstrip()",
              "''').replace('\\n          ', '\\n').lstrip())",
              1,
          )
          output = Path('/tmp/pr716-owner-repair.sh')
          output.write_text(script)
          output.chmod(0o700)
          PY
          /tmp/pr716-owner-repair.sh
          rm -f .github/workflows/run-pr716-module-owner-repair.yml
          git diff --check

      - name: Commit the final repair source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add -A
          git diff --cached --quiet && {
            echo 'ERROR: The PR #716 repair produced no source changes.' >&2
            exit 1
          }
          git commit -m 'fix(module-management): restore owner catalog rows 031-033'
          git push origin HEAD:diagnostic/module-owner-031-033-runtime-20260818
