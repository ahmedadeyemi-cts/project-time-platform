name: Diagnose Module 031-033 Owner Updates on PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-module-owner-031-033-pr.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: diagnose-module-owner-031-033-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/module-owner-031-033-runtime-20260818'
    name: Capture protected-Test owner-update evidence
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE: https://phd-west-test.onenecklab.com
      EVIDENCE_DIR: /tmp/module-owner-031-033-runtime
      READ_ONLY_USER_EMAIL: jason.mosier@ussignal.local
      DIAGNOSTIC_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture the authenticated read-only owner catalog
        shell: bash
        env:
          TEST_LOGIN_PASSWORD: ${{ secrets.PROJECTPULSE_M087_PASSWORD }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          [[ "$BASE" == 'https://phd-west-test.onenecklab.com' ]] || fail 'Diagnostic is restricted to protected Test.'
          [[ ${#TEST_LOGIN_PASSWORD} -ge 12 ]] || fail 'Protected-Test login credential is unavailable.'
          install -d -m 0700 "$EVIDENCE_DIR"

          payload="$(mktemp)"
          response="$(mktemp)"
          chmod 0600 "$payload" "$response"
          jq -n --arg username "$READ_ONLY_USER_EMAIL" --arg password "$TEST_LOGIN_PASSWORD" \
            '{username:$username,password:$password}' > "$payload"
          status="$(curl -sS --http1.1 --connect-timeout 20 --max-time 90 \
            -o "$response" -w '%{http_code}' \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            -H 'Content-Type: application/json' \
            -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
            --data-binary @"$payload" "$BASE/api/auth/local/login" || true)"
          rm -f "$payload"
          [[ "$status" == 200 ]] || fail "Read-only diagnostic login returned HTTP $status."
          SESSION_TOKEN="$(jq -er '.sessionToken' "$response")"
          echo "::add-mask::$SESSION_TOKEN"
          jq 'del(.sessionToken,.token,.password)' "$response" > "$EVIDENCE_DIR/login-redacted.json"
          rm -f "$response"
          unset TEST_LOGIN_PASSWORD

          owners_status="$(curl -sS --http1.1 --connect-timeout 20 --max-time 120 \
            -o "$EVIDENCE_DIR/owners.json" -w '%{http_code}' \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            -H "Authorization: Bearer $SESSION_TOKEN" \
            -H "X-ProjectPulse-Session: $SESSION_TOKEN" \
            -H 'X-ProjectPulse-Module-Number: 012' \
            -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
            "$BASE/api/module-catalog/owners" || true)"
          [[ "$owners_status" == 200 ]] || fail "Module owner catalog returned HTTP $owners_status."
          jq -e . "$EVIDENCE_DIR/owners.json" >/dev/null
          jq '{access,policy,owners:[.owners[]? | select(.moduleNumber == "031" or .moduleNumber == "032" or .moduleNumber == "033")],ownerRecordCount:([.owners[]? | select(.moduleNumber == "031" or .moduleNumber == "032" or .moduleNumber == "033")]|length)}' \
            "$EVIDENCE_DIR/owners.json" > "$EVIDENCE_DIR/owners-031-033.json"

          curl -sS --http1.1 --connect-timeout 20 --max-time 60 -o /dev/null -X POST \
            -H "Authorization: Bearer $SESSION_TOKEN" \
            -H "X-ProjectPulse-Session: $SESSION_TOKEN" \
            -H 'X-ProjectPulse-Module-Number: 012' \
            -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
            "$BASE/api/auth/session/logout" || true
          unset SESSION_TOKEN
          jq . "$EVIDENCE_DIR/owners-031-033.json"

      - name: Sign in to protected Test subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build immutable rollback-only database diagnostic
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          ACR='${{ vars.AZURE_ACR_NAME }}'
          [[ -n "$ACR" && "$ACR" =~ ^[A-Za-z0-9]+$ ]] || fail 'AZURE_ACR_NAME is missing or invalid.'
          [[ "$DIAGNOSTIC_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail 'Diagnostic release identity is invalid.'
          CURRENT_SUBSCRIPTION="$(az account show --query id -o tsv --only-show-errors)"
          [[ "${CURRENT_SUBSCRIPTION,,}" == "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]] || fail 'Azure login is outside protected Test.'

          CONTEXT="$RUNNER_TEMP/module-owner-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT"

          cat > "$CONTEXT/diagnose.sql" <<'SQL'
          \pset pager off
          \set VERBOSITY verbose
          \set ON_ERROR_STOP off
          \echo MODULE_OWNER_DIAGNOSTIC_START

          SELECT current_database() AS database_name, current_user AS database_user, version() AS postgres_version;

          SELECT
              module_code,
              module_name,
              route_scope,
              current_state,
              is_active,
              owner_user_id,
              COALESCE(owner_revision_number, 0) AS owner_revision_number,
              owner_updated_at,
              owner_updated_by_user_id
          FROM scoped_role_policy_modules
          WHERE module_code IN ('031', '032', '033')
          ORDER BY module_code;

          SELECT
              column_name,
              data_type,
              udt_name,
              is_nullable,
              column_default
          FROM information_schema.columns
          WHERE table_schema = 'public'
            AND table_name = 'scoped_role_policy_modules'
            AND column_name IN (
                'module_code',
                'owner_user_id',
                'owner_revision_number',
                'owner_updated_at',
                'owner_updated_by_user_id'
            )
          ORDER BY ordinal_position;

          SELECT
              constraint_record.conname,
              constraint_record.contype,
              pg_get_constraintdef(constraint_record.oid, TRUE) AS definition
          FROM pg_constraint constraint_record
          WHERE constraint_record.conrelid = 'public.scoped_role_policy_modules'::regclass
          ORDER BY constraint_record.conname;

          SELECT
              trigger_record.tgname,
              pg_get_triggerdef(trigger_record.oid, TRUE) AS definition
          FROM pg_trigger trigger_record
          WHERE trigger_record.tgrelid = 'public.scoped_role_policy_modules'::regclass
            AND NOT trigger_record.tgisinternal
          ORDER BY trigger_record.tgname;

          SELECT
              module.owner_user_id,
              COALESCE(NULLIF(app_user.display_name, ''), app_user.email, '') AS display_name,
              app_user.email,
              app_user.is_active,
              COUNT(*) AS module_count
          FROM scoped_role_policy_modules module
          JOIN app_users app_user ON app_user.user_id = module.owner_user_id
          WHERE module.owner_user_id IS NOT NULL
          GROUP BY module.owner_user_id, app_user.display_name, app_user.email, app_user.is_active
          ORDER BY COUNT(*) DESC, module.owner_user_id
          LIMIT 10;

          BEGIN;

          CREATE OR REPLACE FUNCTION pg_temp.projectpulse_owner_diagnostic(
              p_module_code TEXT,
              p_include_audit BOOLEAN
          )
          RETURNS TEXT
          LANGUAGE plpgsql
          AS $diagnostic$
          DECLARE
              v_actor_user_id UUID;
              v_actor_email TEXT;
              v_previous_owner_user_id UUID;
              v_previous_revision INTEGER;
              v_next_revision INTEGER;
          BEGIN
              SELECT
                  module.owner_user_id,
                  COALESCE(NULLIF(app_user.email, ''), 'module-owner-diagnostic@protected-test.invalid')
              INTO v_actor_user_id, v_actor_email
              FROM scoped_role_policy_modules module
              JOIN app_users app_user
                ON app_user.user_id = module.owner_user_id
               AND app_user.is_active = TRUE
              WHERE module.owner_user_id IS NOT NULL
              GROUP BY module.owner_user_id, app_user.email
              ORDER BY COUNT(*) DESC, module.owner_user_id
              LIMIT 1;

              IF v_actor_user_id IS NULL THEN
                  SELECT
                      app_user.user_id,
                      COALESCE(NULLIF(app_user.email, ''), 'module-owner-diagnostic@protected-test.invalid')
                  INTO v_actor_user_id, v_actor_email
                  FROM app_users app_user
                  WHERE app_user.is_active = TRUE
                  ORDER BY app_user.user_id
                  LIMIT 1;
              END IF;

              IF v_actor_user_id IS NULL THEN
                  RAISE EXCEPTION 'No active app_users identity is available for the rollback-only diagnostic.';
              END IF;

              SELECT
                  module.owner_user_id,
                  COALESCE(module.owner_revision_number, 0)
              INTO v_previous_owner_user_id, v_previous_revision
              FROM scoped_role_policy_modules module
              WHERE module.module_code = p_module_code
                AND module.is_active = TRUE
              FOR UPDATE;

              IF NOT FOUND THEN
                  RAISE EXCEPTION 'Module % is not registered as an active scoped_role_policy_modules row.', p_module_code;
              END IF;

              v_next_revision := v_previous_revision + 1;

              UPDATE scoped_role_policy_modules
              SET owner_user_id = v_actor_user_id,
                  owner_revision_number = v_next_revision,
                  owner_updated_at = NOW(),
                  owner_updated_by_user_id = v_actor_user_id
              WHERE module_code = p_module_code
                AND is_active = TRUE;

              IF p_include_audit THEN
                  INSERT INTO scoped_role_policy_audit_events (
                      policy_version_id,
                      event_code,
                      actor_user_id,
                      actor_email,
                      reason,
                      previous_state,
                      new_state,
                      event_metadata
                  )
                  VALUES (
                      NULL,
                      'MODULE_OWNER_CHANGED',
                      v_actor_user_id,
                      v_actor_email,
                      'Rollback-only protected-Test owner diagnostic.',
                      jsonb_build_object(
                          'moduleNumber', p_module_code,
                          'ownerUserId', v_previous_owner_user_id,
                          'revision', v_previous_revision
                      ),
                      jsonb_build_object(
                          'moduleNumber', p_module_code,
                          'ownerUserId', v_actor_user_id,
                          'ownerEmail', v_actor_email,
                          'revision', v_next_revision
                      ),
                      jsonb_build_object(
                          'immutableAudit', TRUE,
                          'ownershipDoesNotGrantAccess', TRUE,
                          'rollbackOnlyDiagnostic', TRUE
                      )
                  );
              END IF;

              RETURN format(
                  'MODULE_OWNER_DIAGNOSTIC_SUCCESS module=%s stage=%s previousOwner=%s previousRevision=%s nextRevision=%s',
                  p_module_code,
                  CASE WHEN p_include_audit THEN 'update_and_audit' ELSE 'update_only' END,
                  COALESCE(v_previous_owner_user_id::TEXT, 'NULL'),
                  v_previous_revision,
                  v_next_revision
              );
          END;
          $diagnostic$;

          \echo MODULE_OWNER_DIAGNOSTIC_031_UPDATE_ONLY
          SAVEPOINT module_031_update_only;
          SELECT pg_temp.projectpulse_owner_diagnostic('031', FALSE);
          ROLLBACK TO SAVEPOINT module_031_update_only;

          \echo MODULE_OWNER_DIAGNOSTIC_031_UPDATE_AND_AUDIT
          SAVEPOINT module_031_update_audit;
          SELECT pg_temp.projectpulse_owner_diagnostic('031', TRUE);
          ROLLBACK TO SAVEPOINT module_031_update_audit;

          \echo MODULE_OWNER_DIAGNOSTIC_032_UPDATE_ONLY
          SAVEPOINT module_032_update_only;
          SELECT pg_temp.projectpulse_owner_diagnostic('032', FALSE);
          ROLLBACK TO SAVEPOINT module_032_update_only;

          \echo MODULE_OWNER_DIAGNOSTIC_032_UPDATE_AND_AUDIT
          SAVEPOINT module_032_update_audit;
          SELECT pg_temp.projectpulse_owner_diagnostic('032', TRUE);
          ROLLBACK TO SAVEPOINT module_032_update_audit;

          \echo MODULE_OWNER_DIAGNOSTIC_033_UPDATE_ONLY
          SAVEPOINT module_033_update_only;
          SELECT pg_temp.projectpulse_owner_diagnostic('033', FALSE);
          ROLLBACK TO SAVEPOINT module_033_update_only;

          \echo MODULE_OWNER_DIAGNOSTIC_033_UPDATE_AND_AUDIT
          SAVEPOINT module_033_update_audit;
          SELECT pg_temp.projectpulse_owner_diagnostic('033', TRUE);
          ROLLBACK TO SAVEPOINT module_033_update_audit;

          ROLLBACK;
          \echo MODULE_OWNER_DIAGNOSTIC_SQL_COMPLETE
          SQL

          cat > "$CONTEXT/entrypoint.sh" <<'ENTRYPOINT'
          #!/usr/bin/env sh
          set -u
          psql -X --file /opt/projectpulse-diagnostic/diagnose.sql
          sql_status=$?
          echo "MODULE_OWNER_DIAGNOSTIC_COMPLETE psqlStatus=$sql_status mutation=false"
          exit 1
          ENTRYPOINT
          chmod 0555 "$CONTEXT/entrypoint.sh"

          cat > "$CONTEXT/Dockerfile" <<'DOCKERFILE'
          FROM postgres:16-alpine
          WORKDIR /opt/projectpulse-diagnostic
          COPY diagnose.sql diagnose.sql
          COPY entrypoint.sh /usr/local/bin/projectpulse-owner-diagnostic
          RUN chmod 0444 diagnose.sql && chmod 0555 /usr/local/bin/projectpulse-owner-diagnostic
          ENTRYPOINT ["/usr/local/bin/projectpulse-owner-diagnostic"]
          DOCKERFILE

          TAG="owner-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REPOSITORY='project-health-dashboard-owner-diagnostic'
          IMAGE_TAG="$REPOSITORY:$TAG"
          az acr build \
            --registry "$ACR" \
            --image "$IMAGE_TAG" \
            --file "$CONTEXT/Dockerfile" \
            --timeout 1800 \
            "$CONTEXT" \
            > "$EVIDENCE_DIR/acr-build.log" 2>&1
          DIGEST="$(az acr repository show --name "$ACR" --image "$IMAGE_TAG" --query digest -o tsv --only-show-errors)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail 'Could not resolve the immutable diagnostic image digest.'
          IMAGE="$ACR.azurecr.io/$REPOSITORY@$DIGEST"
          {
            echo "image=$IMAGE"
            echo "image_tag=$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"
          jq -n --arg image "$IMAGE" --arg tag "$IMAGE_TAG" --arg release "$DIAGNOSTIC_RELEASE_COMMIT" \
            '{image:$image,tag:$tag,releaseCommit:$release,rollbackOnly:true,productionMutation:false}' \
            > "$EVIDENCE_DIR/diagnostic-image.json"

      - name: Run rollback-only diagnostic inside the Test private network
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          RELIABILITY_MIGRATION_IMAGE: ${{ steps.build.outputs.image }}
          RELIABILITY_MIGRATION_JOB_NAME: ownd-${{ github.run_id }}-${{ github.run_attempt }}
          AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID: ${{ vars.AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID }}
          AZURE_KEY_VAULT_URI: ${{ vars.AZURE_KEY_VAULT_URI }}
          PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME: ${{ vars.PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME }}
          PROJECTPULSE_TEST_DATABASE_HOST: ${{ vars.PROJECTPULSE_TEST_DATABASE_HOST }}
          PROJECTPULSE_TEST_DATABASE_PORT: ${{ vars.PROJECTPULSE_TEST_DATABASE_PORT }}
          PROJECTPULSE_TEST_DATABASE_NAME: ${{ vars.PROJECTPULSE_TEST_DATABASE_NAME }}
          PROJECTPULSE_TEST_DATABASE_USER: ${{ vars.PROJECTPULSE_TEST_DATABASE_USER }}
          RELIABILITY_CONTROL_SHA: ${{ github.event.pull_request.head.sha }}
          RELIABILITY_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha }}
          RELIABILITY_MIGRATION_SCOPE: module-owner-031-033-diagnostic-test
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          set +e
          bash scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh \
            > "$EVIDENCE_DIR/private-db-diagnostic.log" 2>&1
          runner_status=$?
          set -e
          cat "$EVIDENCE_DIR/private-db-diagnostic.log"
          grep -q 'MODULE_OWNER_DIAGNOSTIC_COMPLETE' "$EVIDENCE_DIR/private-db-diagnostic.log" \
            || fail 'The private database diagnostic did not reach its completion marker.'
          grep -E \
            'MODULE_OWNER_DIAGNOSTIC_(START|SQL_COMPLETE|COMPLETE|SUCCESS|031|032|033)|ERROR:|SQL state|scoped_role_policy_modules|owner_user_id|owner_revision_number' \
            "$EVIDENCE_DIR/private-db-diagnostic.log" \
            > "$EVIDENCE_DIR/private-db-diagnostic-summary.txt" || true
          jq -n --argjson wrapperStatus "$runner_status" \
            '{environment:"protected-test",rollbackOnly:true,diagnosticWrapperExitStatus:$wrapperStatus,completionMarkerObserved:true,productionMutation:false}' \
            > "$EVIDENCE_DIR/private-db-diagnostic-contract.json"

      - name: Capture recent API warning logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$EVIDENCE_DIR"
          az containerapp logs show \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name '${{ vars.AZURE_API_APP }}' \
            --type console \
            --tail 300 \
            --format text \
            > "$EVIDENCE_DIR/api-console-tail.txt" 2>&1 || true
          grep -Ei 'ModuleCatalogOwnershipModule|owner_update_failed|module ownership could not be updated' \
            "$EVIDENCE_DIR/api-console-tail.txt" \
            > "$EVIDENCE_DIR/module-owner-log-matches.txt" || true

      - name: Remove the temporary diagnostic image tag
        if: always() && steps.build.outputs.image_tag != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          az acr repository delete \
            --name '${{ vars.AZURE_ACR_NAME }}' \
            --image '${{ steps.build.outputs.image_tag }}' \
            --yes \
            --only-show-errors || true

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: module-owner-031-033-runtime-evidence
          path: /tmp/module-owner-031-033-runtime
          if-no-files-found: error
          retention-days: 1
