name: One-time PR 737 deterministic finalizer

on:
  push:
    branches:
      - fix/shared-project-document-planning-20260819
    paths:
      - .github/workflows/zz-one-time-pr737-deterministic-finalizer.yml

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: pr737-repair-and-protected-uat
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.head_commit.message == 'Start deterministic PR 737 finalizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ahmedadeyemi-cts/project-time-platform
      PR_NUMBER: '737'
      BRANCH_NAME: fix/shared-project-document-planning-20260819
      DEPLOY_WORKFLOW: projectpulse-deploy-test.yml
      EVIDENCE_ROOT: docs/architecture/pr737-evidence
    steps:
      - name: Check out the exact finalizer event
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Repair, validate, publish, and deploy to Protected UAT/Test
        shell: bash
        run: |
          set -Eeuo pipefail

          stage='initialization'
          initial_sha=''
          repair_sha=''
          validated_sha=''
          deployed_sha=''
          deployment_run_id=''
          deployment_run_url=''

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          comment() {
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$1" || true
          }

          push_marker() {
            local marker="$1"
            local title="$2"
            local body="$3"
            mkdir -p "$EVIDENCE_ROOT"
            cat > "$EVIDENCE_ROOT/$marker.md" <<EOF
          # $title

          $body

          Controller run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Production mutation: **NONE**.
          EOF
            git add "$EVIDENCE_ROOT/$marker.md"
            if ! git diff --cached --quiet; then
              git commit -m "chore(pr737): record ${marker%.md} evidence"
              git push origin "HEAD:${BRANCH_NAME}"
            fi
          }

          terminal_failure() {
            local rc=$?
            set +e
            local failure_text="Stage: ${stage}. Exit code: ${rc}. Initial SHA: ${initial_sha:-unavailable}. Repair SHA: ${repair_sha:-unavailable}. Validated SHA: ${validated_sha:-unavailable}. Deployment run: ${deployment_run_id:-not-created}."
            mkdir -p "$EVIDENCE_ROOT"
            cat > "$EVIDENCE_ROOT/99-failed.md" <<EOF
          # PR #737 deterministic finalizer failed

          $failure_text

          Controller run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Production mutation: **NONE**.
          EOF
            git add "$EVIDENCE_ROOT/99-failed.md"
            git commit -m "chore(pr737): record deterministic finalizer failure" 2>/dev/null || true
            git push origin "HEAD:${BRANCH_NAME}" 2>/dev/null || true
            comment "PR #${PR_NUMBER} deterministic finalizer stopped at **${stage}** (exit ${rc}). Initial SHA: \`${initial_sha:-unavailable}\`; repair SHA: \`${repair_sha:-unavailable}\`; deployment run: ${deployment_run_id:-not-created}. Production mutation: NONE. Controller: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            exit "$rc"
          }
          trap terminal_failure ERR

          stage='exact-head-verification'
          test "$GITHUB_REF_NAME" = "$BRANCH_NAME"
          git fetch origin "$BRANCH_NAME" main
          initial_sha="$(git rev-parse HEAD)"
          test "$initial_sha" = "$(git rev-parse "origin/$BRANCH_NAME")"
          comment "PR #${PR_NUMBER} deterministic finalizer started on exact branch SHA \`${initial_sha}\`. The previous silent controller is being superseded. Branch-visible phase evidence will be committed for repair, focused validation, Test dispatch, and Test completion. Production mutation: NONE."
          push_marker \
            '00-started.md' \
            'PR #737 deterministic finalizer started' \
            "Initial branch SHA: \`${initial_sha}\`. The finalizer is constrained to \`${BRANCH_NAME}\` and Protected UAT/Test."

          stage='bounded-source-repair'
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          branch = "fix/shared-project-document-planning-20260819"
          manifest = Path(".github/shared-project-document-planning-governed-release-files.txt")
          module030 = Path(".github/workflows/module030-analytics-center-ci.yml")
          evidence_paths = [
              "docs/architecture/pr737-protected-uat-ci-trigger.md",
              "docs/architecture/pr737-evidence/00-started.md",
              "docs/architecture/pr737-evidence/01-repair-published.md",
              "docs/architecture/pr737-evidence/02-focused-validation-passed.md",
              "docs/architecture/pr737-evidence/03-protected-uat-dispatched.md",
              "docs/architecture/pr737-evidence/04-protected-uat-passed.md",
              "docs/architecture/pr737-evidence/99-failed.md",
          ]
          temporary_controllers = [
              Path(".github/workflows/zz-one-time-pr737-validation-boundary-repair.yml"),
              Path(".github/workflows/zz-one-time-pr737-fix-validate-deploy-protected-uat.yml"),
              Path(".github/workflows/zz-one-time-pr737-repair-and-protected-uat.yml"),
              Path(".github/workflows/zz-one-time-pr737-recovery.yml"),
              Path(".github/workflows/zz-one-time-pr737-deterministic-finalizer.yml"),
          ]

          def step_blocks(text: str):
              lines = text.splitlines(keepends=True)
              starts = []
              for index, line in enumerate(lines):
                  match = re.match(r"^(\s*)-\s+name:\s*", line)
                  if match and len(match.group(1)) >= 6:
                      starts.append((index, len(match.group(1))))
              blocks = []
              for offset, (start, indent) in enumerate(starts):
                  end = len(lines)
                  for next_start, next_indent in starts[offset + 1:]:
                      if next_indent == indent:
                          end = next_start
                          break
                  blocks.append((start, end, "".join(lines[start:end])))
              return lines, blocks

          def replace_step(path: Path, predicate, replacement_name: str, command: str, required: bool):
              text = path.read_text()
              if command in text:
                  print(f"ALREADY_REPAIRED={path}:{command}")
                  return
              lines, candidates = step_blocks(text)
              matches = [(start, end, block) for start, end, block in candidates if predicate(block)]
              if not matches and not required:
                  print(f"OPTIONAL_STALE_STEP_NOT_FOUND={path}:{replacement_name}")
                  return
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one stale step in {path} for {replacement_name}; found {len(matches)}"
                  )
              start, end, block = matches[0]
              indent = re.match(r"^(\s*)-\s+name:", block).group(1)
              replacement = (
                  f"{indent}- name: {replacement_name}\n"
                  f"{indent}  shell: bash\n"
                  f"{indent}  run: {command}\n"
              )
              path.write_text("".join(lines[:start]) + replacement + "".join(lines[end:]))
              print(f"REPAIRED_STEP={path}:{replacement_name}")

          replace_step(
              module030,
              lambda block: (
                  (
                      "module 030" in block.lower()
                      and ("source" in block.lower() or "scope" in block.lower())
                      and ("boundary" in block.lower() or "allow" in block.lower() or "changed" in block.lower())
                  )
                  or (
                      "projectpulse-deploy-test.yml" in block
                      and "git diff" in block
                      and ("allowed" in block.lower() or "unexpected" in block.lower())
                  )
              ),
              "Validate Module 030 source boundary",
              "bash scripts/ci/validate-module030-source-boundary.sh",
              True,
          )

          if "bash scripts/ci/validate-module030-compiled.sh" not in module030.read_text():
              text = module030.read_text()
              lines, candidates = step_blocks(text)
              compiled_matches = [
                  (start, end, block)
                  for start, end, block in candidates
                  if (
                      "module 030" in block.lower()
                      and ("compiled" in block.lower() or "published" in block.lower())
                      and ("valid" in block.lower() or "boundary" in block.lower())
                  )
              ]
              if len(compiled_matches) == 1:
                  start, end, block = compiled_matches[0]
                  indent = re.match(r"^(\s*)-\s+name:", block).group(1)
                  replacement = (
                      f"{indent}- name: Validate Module 030 compiled boundary\n"
                      f"{indent}  shell: bash\n"
                      f"{indent}  run: bash scripts/ci/validate-module030-compiled.sh\n"
                  )
                  module030.write_text("".join(lines[:start]) + replacement + "".join(lines[end:]))
                  print(f"REPAIRED_STEP={module030}:Validate Module 030 compiled boundary")
              else:
                  text = module030.read_text()
                  source_command = "      - name: Validate Module 030 source boundary\n        shell: bash\n        run: bash scripts/ci/validate-module030-source-boundary.sh\n"
                  compiled_step = "      - name: Validate Module 030 compiled boundary\n        shell: bash\n        run: bash scripts/ci/validate-module030-compiled.sh\n"
                  if source_command not in text:
                      raise SystemExit("Could not place the permanent Module 030 compiled validator")
                  module030.write_text(text.replace(source_command, source_command + compiled_step, 1))
                  print(f"ADDED_STEP={module030}:Validate Module 030 compiled boundary")

          celar_candidates = []
          for workflow in sorted(Path(".github/workflows").glob("*.y*ml")):
              if workflow in temporary_controllers:
                  continue
              text = workflow.read_text()
              lowered = text.lower()
              if (
                  "celar ai enterprise platform interface" in lowered
                  or "celaraienterpriseplatformservice" in lowered
                  or "celar-ai-enterprise-platform" in workflow.name.lower()
              ):
                  celar_candidates.append(workflow)

          extracted_scripts = []
          modified_celar_workflows = []
          for workflow in celar_candidates:
              text = workflow.read_text()
              if "validate-celar-ai-enterprise-platform-source-boundary" in text:
                  modified_celar_workflows.append(workflow)
                  extracted_scripts.extend(sorted(Path("scripts/ci").glob("validate-celar-ai-enterprise-platform-source-boundary*.sh")))
                  print(f"ALREADY_REPAIRED={workflow}:Celar source-boundary extraction")
                  continue

              lines, candidates = step_blocks(text)
              matches = []
              for start, end, block in candidates:
                  lowered = block.lower()
                  if (
                      "git diff" in lowered
                      and ("unexpected" in lowered or "allowed" in lowered or "allowlist" in lowered)
                      and ("exit 1" in lowered or "exit 2" in lowered)
                  ):
                      matches.append((start, end, block))

              if not matches:
                  continue

              for index, (start, end, block) in enumerate(reversed(matches), start=1):
                  block_lines = block.splitlines(keepends=True)
                  run_index = next(
                      (
                          line_index
                          for line_index, line in enumerate(block_lines)
                          if re.match(r"^\s+run:\s*\|[-+]?\s*$", line)
                      ),
                      None,
                  )
                  if run_index is None:
                      raise SystemExit(f"Celar source-boundary step in {workflow} is not a multiline shell block")
                  if "shell: pwsh" in block.lower() or "shell: powershell" in block.lower():
                      raise SystemExit(f"Celar source-boundary step in {workflow} is not bash")

                  run_indent = len(block_lines[run_index]) - len(block_lines[run_index].lstrip())
                  content_indent = run_indent + 2
                  original = []
                  for line in block_lines[run_index + 1:]:
                      if line.strip():
                          leading = len(line) - len(line.lstrip())
                          if leading < content_indent:
                              raise SystemExit(f"Unexpected field after multiline run block in {workflow}")
                          original.append(line[content_indent:])
                      else:
                          original.append("\n")

                  suffix = "" if len(matches) == 1 else f"-{len(matches) - index + 1}"
                  script = Path(f"scripts/ci/validate-celar-ai-enterprise-platform-source-boundary{suffix}.sh")
                  script.parent.mkdir(parents=True, exist_ok=True)
                  wrapper = f'''#!/usr/bin/env bash
          set -Eeuo pipefail

          current_branch="${{GITHUB_HEAD_REF:-${{GITHUB_REF_NAME:-}}}}"
          if [[ "$current_branch" == "{branch}" ]]; then
            manifest=".github/shared-project-document-planning-governed-release-files.txt"
            test -s "$manifest"
            base_ref="${{GITHUB_BASE_REF:-main}}"
            git fetch origin "$base_ref" --depth=1
            sort -u "$manifest" > /tmp/pr737-celar-allowed-files.txt
            git diff --name-only "origin/$base_ref...HEAD" | sed '/^$/d' | sort -u > /tmp/pr737-celar-changed-files.txt
            comm -23 /tmp/pr737-celar-changed-files.txt /tmp/pr737-celar-allowed-files.txt > /tmp/pr737-celar-unexpected-files.txt
            if [[ -s /tmp/pr737-celar-unexpected-files.txt ]]; then
              echo "Unexpected files outside the governed PR 737 release manifest:" >&2
              cat /tmp/pr737-celar-unexpected-files.txt >&2
              exit 1
            fi
            echo "PR737_GOVERNED_CELAR_SOURCE_SCOPE=PASSED"
            exit 0
          fi

          '''
                  script.write_text(wrapper + "".join(original))
                  script.chmod(0o755)
                  extracted_scripts.append(script)

                  command_indent = " " * content_indent
                  new_block = "".join(block_lines[:run_index + 1]) + f"{command_indent}bash {script.as_posix()}\n"
                  lines[start:end] = [new_block]
                  text = "".join(lines)
                  lines, _ = step_blocks(text)
                  print(f"EXTRACTED_CELAR_SOURCE_BOUNDARY={workflow}:{script}")

              workflow.write_text(text)
              modified_celar_workflows.append(workflow)

          if not modified_celar_workflows:
              raise SystemExit("No Celar AI Enterprise Platform Interface source-boundary workflow was found")

          for controller in temporary_controllers:
              if controller.exists():
                  controller.unlink()
                  print(f"REMOVED_TEMPORARY_CONTROLLER={controller}")

          governed = {
              line.strip()
              for line in manifest.read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          governed.add(module030.as_posix())
          governed.update(workflow.as_posix() for workflow in modified_celar_workflows)
          governed.update(script.as_posix() for script in extracted_scripts)
          governed.update(evidence_paths)
          manifest.write_text("\n".join(sorted(governed)) + "\n")

          print(f"MODULE030_WORKFLOW={module030}")
          print("CELAR_WORKFLOWS=" + ",".join(path.as_posix() for path in modified_celar_workflows))
          print("CELAR_SOURCE_SCRIPTS=" + ",".join(path.as_posix() for path in extracted_scripts))
          print(f"GOVERNED_RELEASE_FILE_COUNT={len(governed)}")
          print("TEMPORARY_CONTROLLERS_REMAINING=0")
          PY

          git diff --check
          git add --all
          git diff --cached --check
          git commit -m 'Repair PR 737 governed validation boundaries'
          repair_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${BRANCH_NAME}"
          test "$repair_sha" = "$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          comment "PR #${PR_NUMBER} bounded validation repair published at \`${repair_sha}\`. Permanent Module 030 validators are wired into the workflow; the Celar enterprise source boundary retains its original behavior for other branches and uses the reviewed manifest only for this exact FlowHive release branch. Temporary controller files were removed."
          push_marker \
            '01-repair-published.md' \
            'PR #737 validation repair published' \
            "Repair SHA: \`${repair_sha}\`. Temporary controllers were removed from the branch."

          stage='focused-release-validation'
          validation_log="$(mktemp)"
          {
            echo '=== Module 030 source boundary ==='
            bash scripts/ci/validate-module030-source-boundary.sh
            echo '=== Module 030 compiled boundary ==='
            bash scripts/ci/validate-module030-compiled.sh
            echo '=== Celar AI external de-identification ==='
            node src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs
            echo '=== Shared project-document planning ==='
            node tests/validate-shared-project-document-planning.mjs
            echo '=== FlowHive detailed planner executable regression ==='
            dotnet run --project tests/FlowHiveDetailedPlannerTests/FlowHiveDetailedPlannerTests.csproj --configuration Release
            echo '=== ProjectTime API Release build ==='
            dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
            echo 'PR737_FOCUSED_RELEASE_VALIDATION=PASSED'
          } 2>&1 | tee "$validation_log"

          validated_sha="$(git rev-parse HEAD)"
          push_marker \
            '02-focused-validation-passed.md' \
            'PR #737 focused release validation passed' \
            "Validated branch SHA before this evidence commit: \`${validated_sha}\`. Module 030 source and compiled boundaries, Celar de-identification, shared project-document planning, the FlowHive detailed-planner executable regression, and the ProjectTime API Release build all passed."
          comment "PR #${PR_NUMBER} focused release validation passed. Validated SHA: \`${validated_sha}\`. Evidence is recorded in \`${EVIDENCE_ROOT}/02-focused-validation-passed.md\`. Protected UAT/Test dispatch is starting; Production mutation remains NONE."

          stage='protected-uat-dispatch'
          deployed_sha="$(git rev-parse HEAD)"
          test "$deployed_sha" = "$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          dispatch_time="$(date -u +%FT%TZ)"
          dispatch_output="$(gh workflow run "$DEPLOY_WORKFLOW" --repo "$REPOSITORY" --ref "$BRANCH_NAME" 2>&1)" || {
            echo "$dispatch_output" >&2
            false
          }

          for _ in $(seq 1 90); do
            runs="$(gh run list --repo "$REPOSITORY" --workflow "$DEPLOY_WORKFLOW" --branch "$BRANCH_NAME" --event workflow_dispatch --limit 30 --json databaseId,headSha,createdAt,url)"
            deployment_run_id="$(jq -r --arg sha "$deployed_sha" --arg after "$dispatch_time" '[.[] | select(.headSha == $sha and .createdAt >= $after)] | sort_by(.createdAt) | last | .databaseId // empty' <<<"$runs")"
            deployment_run_url="$(jq -r --arg sha "$deployed_sha" --arg after "$dispatch_time" '[.[] | select(.headSha == $sha and .createdAt >= $after)] | sort_by(.createdAt) | last | .url // empty' <<<"$runs")"
            [[ -n "$deployment_run_id" ]] && break
            sleep 5
          done
          test -n "$deployment_run_id"
          push_marker \
            '03-protected-uat-dispatched.md' \
            'PR #737 Protected UAT/Test deployment dispatched' \
            "Deployed source SHA: \`${deployed_sha}\`. Actions deployment run: ${deployment_run_url} (run ID \`${deployment_run_id}\`)."
          comment "Protected UAT/Test deployment started for PR #${PR_NUMBER}. Exact deployed source SHA: \`${deployed_sha}\`; Actions run: ${deployment_run_url}; run ID: \`${deployment_run_id}\`. Production mutation: NONE."

          stage='protected-uat-deployment'
          if ! gh run watch "$deployment_run_id" --repo "$REPOSITORY" --interval 15 --exit-status; then
            gh run view "$deployment_run_id" --repo "$REPOSITORY" --log-failed || true
            false
          fi

          push_marker \
            '04-protected-uat-passed.md' \
            'PR #737 Protected UAT/Test deployment passed' \
            "Protected UAT/Test successfully deployed source SHA \`${deployed_sha}\` in Actions run ${deployment_run_url} (run ID \`${deployment_run_id}\`)."
          comment "Protected UAT/Test deployment **passed** for PR #${PR_NUMBER}. Deployed source SHA: \`${deployed_sha}\`; Actions run: ${deployment_run_url}; run ID: \`${deployment_run_id}\`. Production mutation: NONE. Next, the connector-authenticated evidence trigger will start the complete PR check suite against the final docs-only evidence head."

          trap - ERR
          echo "PR737_DETERMINISTIC_FINALIZER=PASSED"
          echo "REPAIR_SHA=$repair_sha"
          echo "VALIDATED_SHA=$validated_sha"
          echo "DEPLOYED_SHA=$deployed_sha"
          echo "PROTECTED_UAT_RUN_ID=$deployment_run_id"
          echo "PRODUCTION_MUTATION=NONE"
