name: Apply Project Intake IResult Route Repair

on:
  push:
    branches:
      - fix/project-intake-result-execution-20260815
    paths:
      - '.github/workflows/temporary-project-intake-route-repair-20260815.yml'

permissions:
  contents: write

jobs:
  repair:
    name: Apply and validate the Project Intake IResult route repair
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/project-intake-result-execution-20260815
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Apply, validate, and publish the focused repair
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo 'ERROR: Checkout does not match the exact triggering commit.' >&2
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          module_path = Path('src/backend/ProjectTime.Api/Modules/ProjectIntakeModule.cs')
          module = module_path.read_text(encoding='utf-8')
          old_mapping = '        app.MapGet("/api/project-intake/overview", GetOverviewAsync);'
          new_mapping = '''        app.MapGet(
                      "/api/project-intake/overview",
                      (Func<HttpContext, Task<IResult>>)GetOverviewAsync);'''
          if module.count(old_mapping) != 1:
              raise SystemExit('Expected exactly one direct Project Intake overview method-group mapping.')
          module_path.write_text(module.replace(old_mapping, new_mapping), encoding='utf-8')

          validator_path = Path('tests/validate-systemwide-enterprise-reliability.mjs')
          validator = validator_path.read_text(encoding='utf-8')
          anchor = "requireText(intake, 'LoadSourceAsync', 'independent Project Intake source loading');"
          replacement = """requireText(intake, 'LoadSourceAsync', 'independent Project Intake source loading');
          rejectText(
            intake,
            'app.MapGet(\"/api/project-intake/overview\", GetOverviewAsync);',
            'Project Intake RequestDelegate binding that discards IResult'
          );
          requireText(
            intake,
            '(Func<HttpContext, Task<IResult>>)GetOverviewAsync',
            'Project Intake explicit IResult route binding'
          );"""
          if validator.count(anchor) != 1:
              raise SystemExit('Expected exactly one Project Intake validator anchor.')
          validator_path.write_text(validator.replace(anchor, replacement), encoding='utf-8')
          PY

          node tests/validate-systemwide-enterprise-reliability.mjs
          node tests/validate-utilization-role-scoping.mjs
          node tests/validate-systemwide-image-build-controller.mjs
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          bash tests/test-projectpulse-api-startup.sh
          git diff --check

          cat > "$RUNNER_TEMP/expected-files" <<'FILES'
          src/backend/ProjectTime.Api/Modules/ProjectIntakeModule.cs
          tests/validate-systemwide-enterprise-reliability.mjs
          FILES
          LC_ALL=C sort -u "$RUNNER_TEMP/expected-files" -o "$RUNNER_TEMP/expected-files"
          git diff --name-only | LC_ALL=C sort -u > "$RUNNER_TEMP/actual-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/temporary-project-intake-route-repair-20260815.yml
          git add -- \
            src/backend/ProjectTime.Api/Modules/ProjectIntakeModule.cs \
            tests/validate-systemwide-enterprise-reliability.mjs
          git diff --cached --check
          git commit -m 'Execute Project Intake overview IResult response'
          git push origin HEAD:refs/heads/fix/project-intake-result-execution-20260815

          echo 'PROJECT_INTAKE_IRESULT_ROUTE_REPAIR=PASS'
          echo 'FINAL_PR_FILES=2'
          echo 'PRODUCTION_MUTATION=NONE'
