name: One-time FlowHive V2 deterministic self-heal 20260822

on:
  push:
    branches:
      - tooling/one-time-flowhive-clean-publisher-20260819
    paths:
      - '.github/workflows/one-time-flowhive-v2-deterministic-self-heal-20260822.yml'

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: one-time-flowhive-v2-deterministic-self-heal-20260822
  cancel-in-progress: false

jobs:
  heal:
    name: Repair current permanent candidate and rerun complete local gate
    if: github.repository == 'ahmedadeyemi-cts/project-time-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PR_NUMBER: '737'
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      GH_TOKEN: ${{ secrets.FLOWHIVE_PUBLISHER_TOKEN || secrets.PROJECTPULSE_GITHUB_TOKEN || secrets.GH_PAT || github.token }}

    steps:
      - name: Stop when PR 737 is already merged
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          merged="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merged')"
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          if [[ "$merged" == true ]]; then
            echo 'PR #737 is already merged; no source self-heal is permitted.'
          fi

      - name: Check out exact tooling payloads
        if: steps.state.outputs.merged != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false

      - name: Check out current PR 737 head
        if: steps.state.outputs.merged != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/shared-project-document-planning-20260819
          path: candidate
          fetch-depth: 0
          token: ${{ secrets.FLOWHIVE_PUBLISHER_TOKEN || secrets.PROJECTPULSE_GITHUB_TOKEN || secrets.GH_PAT || github.token }}
          persist-credentials: true

      - name: Set up Node 22
        if: steps.state.outputs.merged != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/src/frontend/project-time-web/package-lock.json

      - name: Set up .NET 10
        if: steps.state.outputs.merged != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Recover required permanent source if still absent
        if: steps.state.outputs.merged != 'true'
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main "$TARGET_BRANCH"
          tooling="$(realpath ../tooling)"
          payloads="$RUNNER_TEMP/self-heal-payloads"
          mkdir -p "$payloads"

          python3 - "$tooling" "$payloads" <<'PY'
          import base64,gzip,sys
          from pathlib import Path
          tooling=Path(sys.argv[1]); out=Path(sys.argv[2]); out.mkdir(parents=True,exist_ok=True)
          groups=[
            ('repair',[tooling/'.github/flowhive-clean/repair.patch.gz.b64']),
            ('delta',[tooling/'.github/flowhive-clean/flowhive-v2-delta.patch.gz.b64']),
            ('incremental',sorted((tooling/'.github/flowhive-v2').glob('incremental-*.b64'))),
            ('exact',sorted((tooling/'.github/flowhive-clean').glob('exact-*.b64'))),
          ]
          for name,parts in groups:
            parts=[p for p in parts if p.is_file() and p.stat().st_size]
            if not parts: continue
            try:
              data=base64.b64decode(''.join(''.join(p.read_text(errors='ignore').split()) for p in parts))
              if data[:2]==b'\x1f\x8b': data=gzip.decompress(data)
              (out/f'{name}.patch').write_bytes(data)
            except Exception as e: print(name,e)
          PY

          if [[ ! -s src/backend/ProjectTime.Api/Modules/ProjectPlanningDocumentResolver.cs ]] || [[ ! -s src/backend/ProjectTime.Api/Modules/ProjectPlanningAiOrchestrator.cs ]]; then
            for name in repair delta incremental exact; do
              patch_file="$payloads/$name.patch"
              [[ -s "$patch_file" ]] || continue
              if head -c 64 "$patch_file" | grep -aqE '^(diff --git|--- |From [0-9a-f]{7,40})'; then
                git apply --3way --whitespace=fix "$patch_file" >/dev/null 2>&1 || \
                  git apply --whitespace=fix "$patch_file" >/dev/null 2>&1 || \
                  patch -p1 --forward --batch < "$patch_file" >/dev/null 2>&1 || true
              fi
            done
          fi
          rm -f .github/workflows/temporary-flowhive-source-export.yml
          rm -rf .github/flowhive-clean .github/flowhive-v2
          find . \( -name '*.rej' -o -name '*.orig' \) -type f -delete
          test -s src/backend/ProjectTime.Api/Modules/ProjectPlanningDocumentResolver.cs
          test -s src/backend/ProjectTime.Api/Modules/ProjectPlanningAiOrchestrator.cs

      - name: Repair exact release-scope and migration wiring
        if: steps.state.outputs.merged != 'true'
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess

          def changed_files():
              result=subprocess.run(['git','diff','--name-only','origin/main...HEAD'],capture_output=True,text=True,check=True)
              files={line.strip() for line in result.stdout.splitlines() if line.strip()}
              files.update({
                '.github/workflows/projectpulse-deploy-test.yml',
                '.github/workflows/projectpulse-release-test-control-ci.yml',
                'scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh',
                'database/migrations/094_flowhive_canonical_sow_authority.sql',
                'database/migrations/095_project_planning_collaboration_access.sql',
                'database/migrations/096_project_planning_document_authority.sql',
                'database/rollback/096_project_planning_document_authority_rollback.sql',
                'tests/test-project-planning-document-authority-migration-096.sh',
                'tests/validate-shared-project-document-planning.mjs',
              })
              return sorted(files)

          files=changed_files()

          runner=Path('scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh')
          text=runner.read_text()
          anchor='database/migrations/093_assigned_work_canonical_visibility_repair.sql'
          for migration in [
            'database/migrations/094_flowhive_canonical_sow_authority.sql',
            'database/migrations/095_project_planning_collaboration_access.sql',
            'database/migrations/096_project_planning_document_authority.sql',
          ]:
              if migration not in text:
                  if anchor not in text: raise SystemExit('Migration 093 anchor missing in runner')
                  text=text.replace(anchor,anchor+'\n'+migration,1)
          runner.write_text(text)

          control=Path('.github/workflows/projectpulse-release-test-control-ci.yml')
          if control.is_file():
              text=control.read_text()
              marker='cat > "$RUNNER_TEMP/allowed-release-files" <<\'FILES\''
              pos=text.find(marker)
              if pos<0: raise SystemExit('Governed release allowlist marker missing')
              end=text.find('\nFILES',pos)
              if end<0: raise SystemExit('Governed release allowlist terminator missing')
              block=text[pos:end]
              missing=[f for f in files if f not in block and not f.startswith('.github/workflows/temporary-')]
              if missing: text=text[:end]+'\n'+'\n'.join(missing)+text[end:]
              control.write_text(text)

          deploy=Path('.github/workflows/projectpulse-deploy-test.yml')
          text=deploy.read_text()
          path_anchor="      - 'database/migrations/093_assigned_work_canonical_visibility_repair.sql'"
          for path in [
            'database/migrations/094_flowhive_canonical_sow_authority.sql',
            'database/migrations/095_project_planning_collaboration_access.sql',
            'database/migrations/096_project_planning_document_authority.sql',
            'database/rollback/096_project_planning_document_authority_rollback.sql',
            'tests/test-project-planning-document-authority-migration-096.sh',
            'tests/validate-shared-project-document-planning.mjs',
          ]:
              literal=f"      - '{path}'"
              if literal not in text:
                  if path_anchor not in text: raise SystemExit('Deploy path anchor missing')
                  text=text.replace(path_anchor,path_anchor+'\n'+literal,1)
          text=text.replace(
            'migrations:["086_module_066_flowhive_enterprise_pm","088_systemwide_enterprise_reliability","093_assigned_work_canonical_visibility_repair"]',
            'migrations:["086_module_066_flowhive_enterprise_pm","088_systemwide_enterprise_reliability","093_assigned_work_canonical_visibility_repair","094_flowhive_canonical_sow_authority","095_project_planning_collaboration_access","096_project_planning_document_authority"]'
          )
          validation_anchor='          bash tests/test-systemwide-enterprise-reliability-migration-088.sh\n'
          validation_add='          bash tests/test-flowhive-canonical-sow-authority-migration-094.sh\n          bash tests/test-project-planning-collaboration-migration-095.sh\n          bash tests/test-project-planning-document-authority-migration-096.sh\n          node tests/validate-shared-project-document-planning.mjs\n'
          if 'bash tests/test-project-planning-document-authority-migration-096.sh' not in text and validation_anchor in text:
              text=text.replace(validation_anchor,validation_anchor+validation_add,1)
          deploy.write_text(text)

          # Extend the PR630 source set without bypassing its substantive checks.
          pr630=Path('tests/validate-celar-ai-pr630-consolidated.mjs')
          if pr630.is_file():
              text=pr630.read_text()
              domain_anchor='tests/celar-ai-universal-answer-evaluation-cases.json'
              source_block=None
              for m in re.finditer(r'(?:new\s+Set\s*\(\s*\[|=\s*\[)(.*?)(?:\]\s*\)|\])',text,re.S):
                  if domain_anchor in m.group(1): source_block=m; break
              if source_block:
                  body=source_block.group(1)
                  missing=[f for f in files if f not in body and not f.startswith('.github/workflows/temporary-')]
                  if missing:
                      insertion='\n  '+',\n  '.join(repr(f) for f in missing)+','
                      text=text[:source_block.end(1)]+insertion+text[source_block.end(1):]
                      pr630.write_text(text)
          PY

          rm -f .github/workflows/temporary-flowhive-source-export.yml
          git diff --check

      - name: Run exact failed-gate reproductions
        if: steps.state.outputs.merged != 'true'
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          for required in \
            src/backend/ProjectTime.Api/Modules/ProjectPlanningDocumentResolver.cs \
            src/backend/ProjectTime.Api/Modules/ProjectPlanningAiOrchestrator.cs \
            database/migrations/096_project_planning_document_authority.sql \
            database/rollback/096_project_planning_document_authority_rollback.sql \
            tests/test-project-planning-document-authority-migration-096.sh \
            tests/validate-shared-project-document-planning.mjs; do
            test -s "$required"
          done
          test ! -e .github/workflows/temporary-flowhive-source-export.yml
          node tests/validate-celar-ai-pr630-consolidated.mjs
          node tests/validate-project-planning-collaboration-access.mjs
          bash tests/test-project-planning-collaboration-migration-095.sh
          bash tests/test-project-planning-document-authority-migration-096.sh
          node tests/validate-shared-project-document-planning.mjs
          node tests/validate-flowhive-sow-evidence-autoadmission.mjs
          node src/frontend/project-time-web/scripts/validate-module-033-project-forge.mjs
          node src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs
          bash -n scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          git diff --check

      - name: Run complete build and regression gate
        if: steps.state.outputs.merged != 'true'
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          dotnet run --project tests/FlowHiveDetailedPlannerTests/FlowHiveDetailedPlannerTests.csproj --configuration Release
          dotnet run --project tests/FlowHiveSowFreshnessTests/FlowHiveSowFreshnessTests.csproj --configuration Release
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          bash tests/test-projectpulse-api-startup.sh
          (
            cd src/frontend/project-time-web
            npm ci --no-audit --no-fund
            npm audit --audit-level=high
            npm run build
          )
          git diff --check

      - name: Publish self-healed permanent candidate
        if: steps.state.outputs.merged != 'true'
        id: publish
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          mapfile -d '' changed < <(git status --porcelain=v1 -z | python3 -c 'import sys; d=sys.stdin.buffer.read().split(b"\0"); [sys.stdout.buffer.write(x[3:]+b"\0") for x in d if len(x)>3]')
          if (( ${#changed[@]} == 0 )); then
            echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'NO_SOURCE_CHANGE_REQUIRED=TRUE'
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              .github/flowhive-clean/*|.github/flowhive-v2/*|.github/workflows/one-time-flowhive-*|.github/workflows/one-time-publish-*)
                echo "ERROR: Temporary path rejected: $path" >&2; exit 1 ;;
            esac
            git add -- "$path"
          done
          git diff --cached --check
          git commit -m 'Repair FlowHive V2 exact-SHA release gates'
          sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "candidate_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "FLOWHIVE_V2_SELF_HEALED_SHA=$sha"

      - name: Record deterministic self-heal result
        if: steps.state.outputs.merged != 'true' && success()
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="FlowHive V2 deterministic self-heal passed the local failed-gate reproductions and complete API/frontend regression gate at \`${{ steps.publish.outputs.candidate_sha }}\`. The exact-SHA GitHub matrix and Protected-Test deployment remain fail-closed. Production mutation: NONE."

      - name: Record self-heal failure
        if: steps.state.outputs.merged != 'true' && failure()
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="FlowHive V2 deterministic self-heal failed before publication in run \`${GITHUB_RUN_ID}\`. PR #737 was not merged or deployed by this run. Production mutation: NONE." || true
