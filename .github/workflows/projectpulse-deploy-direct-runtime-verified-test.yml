name: ProjectPulse Deploy Direct Runtime Data Verified Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified direct runtime data application commit
        required: true
        default: 34d66764d8e84d683abd677981c79e6dbd20d94f
        type: string
      confirmation:
        description: Enter DEPLOY-DIRECT-RUNTIME-VERIFIED-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-direct-runtime-verified-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Verified direct runtime API and web test deployment
    environment: test
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_COMMIT: 34d66764d8e84d683abd677981c79e6dbd20d94f
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v7
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact application release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard exact application and control sources
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ github.ref }}' == 'refs/heads/main' ]] || { echo 'Dispatch this workflow from main.' >&2; exit 1; }
          [[ '${{ inputs.confirmation }}' == 'DEPLOY-DIRECT-RUNTIME-VERIFIED-TO-TEST' ]] || { echo 'Confirmation text does not match.' >&2; exit 1; }
          [[ '${{ inputs.release_commit }}' =~ ^[0-9a-f]{40}$ ]] || { echo 'release_commit must be a complete SHA.' >&2; exit 1; }

          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == '${{ github.sha }}' ]]
          [[ "$TARGET_COMMIT" == '${{ inputs.release_commit }}' ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || { echo 'Only the verified direct runtime application release may deploy.' >&2; exit 1; }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || { echo 'The application release is not an ancestor of the deployment controls.' >&2; exit 1; }

          test -f release/src/backend/ProjectTime.Api/Modules/RuntimeDataCompatibilityModule.cs
          test -f release/src/frontend/project-time-web/src/role-permission-model.js
          test -f release/src/frontend/project-time-web/src/role-permission-matrix-model.js
          test -f release/src/frontend/project-time-web/src/module001/PtcTimesheetManagementPortal.jsx
          test -f release/src/frontend/project-time-web/src/runtime-data-compatibility.js

          test -f control/deployment/containers/runtime-data-validator/Dockerfile
          test -f control/scripts/verify-direct-runtime-data-test.sh
          test -f control/scripts/run-direct-runtime-data-validation-job.sh
          test -f control/scripts/build-pr55-acr-image.sh
          test -f control/scripts/export-pr55-test-database-url.sh

          grep -Fq "'/api/role-policy/summary': '/api/runtime/role-policy/summary'" release/src/frontend/project-time-web/src/role-permission-model.js
          grep -Fq "'/api/role-policy/matrix': '/api/runtime/role-policy/matrix'" release/src/frontend/project-time-web/src/role-permission-matrix-model.js
          grep -Fq '/api/runtime/timesheet/steward/users?weekStart=' release/src/frontend/project-time-web/src/module001/PtcTimesheetManagementPortal.jsx
          grep -Fq '/workspace?weekStart=' release/src/frontend/project-time-web/src/module001/PtcTimesheetManagementPortal.jsx
          grep -Fq "'X-Project-Pulse-Session'" release/src/frontend/project-time-web/src/role-permission-model.js
          grep -Fq "'X-Session-Token'" release/src/frontend/project-time-web/src/module001/PtcTimesheetManagementPortal.jsx
          grep -Fq 'runtime_api_contract_incomplete' release/src/frontend/project-time-web/src/runtime-data-compatibility.js
          grep -Fq 'DIRECT_RUNTIME_DATA_VALIDATION=PASS' control/scripts/verify-direct-runtime-data-test.sh

          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Load test database connection
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        run: bash control/scripts/export-pr55-test-database-url.sh

      - name: Capture current immutable API and web images
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          RAW_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          [[ -n "$RAW_API" && -n "$RAW_WEB" && "${API_MODE,,}" == single && "${WEB_MODE,,}" == single ]]

          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Image is outside the approved ACR: $image" >&2; return 1 ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          echo "old_api_image=$(resolve_digest "$RAW_API")" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$(resolve_digest "$RAW_WEB")" >> "$GITHUB_OUTPUT"

      - name: Build immutable application and validator images
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA='${{ steps.release.outputs.target_commit }}'
          API_REPO='project-health-dashboard-api'
          WEB_REPO='project-health-dashboard-web'
          VALIDATOR_REPO='project-health-dashboard-runtime-validator'

          API_DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$API_REPO:direct-runtime-verified-$SHA" release/deployment/containers/api/Dockerfile release)"
          WEB_DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$WEB_REPO:direct-runtime-verified-$SHA" release/deployment/containers/web/Dockerfile release)"
          VALIDATOR_DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$VALIDATOR_REPO:direct-runtime-verified-$SHA" control/deployment/containers/runtime-data-validator/Dockerfile control)"

          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$API_REPO@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$WEB_REPO@$WEB_DIGEST" >> "$GITHUB_OUTPUT"
          echo "validator_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$VALIDATOR_REPO@$VALIDATOR_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify required live database data before deployment
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          RUNTIME_DATA_VALIDATION_IMAGE: ${{ steps.build.outputs.validator_image }}
          RUNTIME_DATA_VALIDATION_JOB_NAME: rtdv-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash control/scripts/run-direct-runtime-data-validation-job.sh

      - name: Deploy verified direct runtime API
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT='${{ steps.release.outputs.target_commit }}' \
            --revision-suffix "drvapi-${GITHUB_RUN_ID}" --output none

      - name: Validate protected runtime API routes
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'
          BASE="${BASE%/}"

          wait_status() {
            local url="$1" expected="$2" require_json="$3" status='' content_type=''
            for attempt in $(seq 1 30); do
              status="$(curl -sS -D /tmp/drv-headers -o /tmp/drv-body -w '%{http_code}' -H 'Cache-Control: no-cache' "$url" || true)"
              content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub(/\r/, ""); print $2}' /tmp/drv-headers | tail -1)"
              if [[ ",$expected," == *",$status,"* ]]; then
                if [[ "$require_json" == true ]]; then
                  [[ "$content_type" == application/json* ]] || { echo "$url returned non-JSON content type: $content_type" >&2; cat /tmp/drv-body >&2 || true; return 1; }
                fi
                return 0
              fi
              sleep 10
            done
            echo "$url returned $status" >&2
            cat /tmp/drv-body >&2 || true
            return 1
          }

          wait_status "$BASE/health" '200' false
          wait_status "$BASE/api/version" '200' true
          wait_status "$BASE/api/runtime/role-policy/summary" '401,403' true
          wait_status "$BASE/api/runtime/role-policy/matrix" '401,403' true
          wait_status "$BASE/api/runtime/timesheet/steward/users?weekStart=2026-07-19" '401,403' true

      - name: Deploy verified direct runtime web
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "drvweb-${GITHUB_RUN_ID}" --output none

      - name: Validate served direct-call bundle and exact images
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'
          BASE="${BASE%/}"
          READY=false

          for attempt in $(seq 1 30); do
            BUSTER="direct-runtime-verified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$attempt"
            STATUS="$(curl -sSL -H 'Cache-Control: no-cache' -o /tmp/drv-index.html -w '%{http_code}' "$BASE/?release_check=$BUSTER" || true)"
            JS="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/drv-index.html | head -1)"
            if [[ "$STATUS" == 200 && -n "$JS" ]]; then
              case "$JS" in
                http*) URL="$JS" ;;
                /*) URL="$BASE$JS" ;;
                *) URL="$BASE/$JS" ;;
              esac
              curl -sSL -H 'Cache-Control: no-cache' -o /tmp/drv-app.js "$URL?release_check=$BUSTER" || true
              if grep -Fq 'projectpulse-runtime-data-direct-auth-2026-07-25' /tmp/drv-app.js \
                && grep -Fq '/api/runtime/role-policy/summary' /tmp/drv-app.js \
                && grep -Fq '/api/runtime/role-policy/matrix' /tmp/drv-app.js \
                && grep -Fq '/api/runtime/timesheet/steward/users' /tmp/drv-app.js \
                && grep -Fq 'X-Project-Pulse-Session' /tmp/drv-app.js \
                && grep -Fq 'X-Session-Token' /tmp/drv-app.js \
                && grep -Fq 'runtime_api_contract_incomplete' /tmp/drv-app.js \
                && grep -Fq 'The server returned 0 eligible users.' /tmp/drv-app.js \
                && grep -Fq 'Requests / Service Requests' /tmp/drv-app.js \
                && grep -Fq 'Project Tasks' /tmp/drv-app.js \
                && grep -Fq 'Non-Project Time' /tmp/drv-app.js; then
                READY=true
                break
              fi
            fi
            sleep 10
          done

          [[ "$READY" == true ]] || { echo 'Verified direct runtime bundle markers were not served.' >&2; exit 1; }
          ACTIVE_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          ACTIVE_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_API" == '${{ steps.build.outputs.api_image }}' ]]
          [[ "$ACTIVE_WEB" == '${{ steps.build.outputs.web_image }}' ]]

      - name: Write verified deployment evidence
        if: success()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/direct-runtime-verified-test-deployment.json <<JSON
          {"environment":"test","releaseCommit":"${{ steps.release.outputs.target_commit }}","workflowCommit":"${{ github.sha }}","runId":"${{ github.run_id }}","apiImage":"${{ steps.build.outputs.api_image }}","webImage":"${{ steps.build.outputs.web_image }}","validatorImage":"${{ steps.build.outputs.validator_image }}","previousApiImage":"${{ steps.before.outputs.old_api_image }}","previousWebImage":"${{ steps.before.outputs.old_web_image }}","databaseChanges":"none","readOnlyDatabaseValidation":"passed","directAuthenticatedCalls":"validated","servedAssets":"validated"}
          JSON

      - name: Upload verified deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: direct-runtime-verified-test-deployment-${{ github.run_id }}
          path: evidence/direct-runtime-verified-test-deployment.json
          retention-days: 30

      - name: Roll back API and web images on failure
        if: ${{ failure() && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set +e
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.before.outputs.old_api_image }}' \
            --revision-suffix "drvrbapi-${GITHUB_RUN_ID}" --output none
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.before.outputs.old_web_image }}' \
            --revision-suffix "drvrbweb-${GITHUB_RUN_ID}" --output none
