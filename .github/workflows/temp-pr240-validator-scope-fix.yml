name: Temporary PR 240 Validator Scope Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/pr240-validator-fix-trigger'

permissions:
  contents: write

concurrency:
  group: projectpulse-temp-pr240-validator-scope-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor == 'ahmedadeyemi-cts'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact PR 240 branch
        uses: actions/checkout@v5
        with:
          ref: feature/module-011-private-document-pipeline-20260729
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Limit private-document environment guard to owned source
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED_HEAD='1328efaffacfa32571e9b7c962e4ed134cbe8cd3'
          TARGET_BRANCH='feature/module-011-private-document-pipeline-20260729'

          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]]
          git config user.name 'ProjectPulse Source Integration'
          git config user.email 'projectpulse-integration@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path

          validator = Path('src/frontend/project-time-web/scripts/validate-module-011-private-document-pipeline.mjs')
          source = validator.read_text()
          old = """const deploymentMatches = [
            ...walk('.github/workflows'),
            ...walk('scripts'),
            ...walk('deployment')
          ].filter((relative) => /(?:module[-_]?011|pulse[-_]?ai|private[-_]?document).*(?:deploy|migration|azure|entra)/i.test(relative));
          assert(
            'NO_DEPLOYMENT_OR_ENVIRONMENT_ACTION',
            deploymentMatches.length === 0,
            deploymentMatches.length === 0
              ? 'no private-document deployment, migration, Azure, or Entra action exists'
              : `unexpected environment-changing paths: ${deploymentMatches.join(', ')}`
          );
          """
          new = """const ownedPrivateDocumentPaths = [
            '.github/workflows/deep-intelligence-read-contract-ci.yml',
            '.github/workflows/private-document-pipeline-read-contract-ci.yml',
            'src/frontend/project-time-web/scripts/validate-module-011-private-document-pipeline.mjs',
            ...Object.values(paths)
          ];
          const deploymentMatches = [...new Set(ownedPrivateDocumentPaths)].filter((relative) =>
            /(?:module[-_]?011|pulse[-_]?ai|private[-_]?document).*(?:deploy|migration|azure|entra)/i.test(relative)
          );
          assert(
            'NO_DEPLOYMENT_OR_ENVIRONMENT_ACTION',
            deploymentMatches.length === 0,
            deploymentMatches.length === 0
              ? 'no environment-changing action exists in the owned private-document source scope'
              : `unexpected environment-changing owned paths: ${deploymentMatches.join(', ')}`
          );
          """
          if old not in source:
              raise SystemExit('Expected repository-wide environment guard was not found.')
          validator.write_text(source.replace(old, new))
          PY

          git diff --check
          git add src/frontend/project-time-web/scripts/validate-module-011-private-document-pipeline.mjs
          git commit -m 'Limit PR #240 environment guard to owned source scope'

      - name: Validate PR 240 source and builds
        shell: bash
        run: |
          set -Eeuo pipefail
          pushd src/frontend/project-time-web >/dev/null
          node --check scripts/validate-module-011-private-document-pipeline.mjs
          node scripts/validate-module-011-private-document-pipeline.mjs
          node scripts/validate-module-011-pulse-ai.mjs
          node scripts/validate-module-011-pulse-ai-deep-intelligence.mjs
          node scripts/validate-module-066-project-flowhive.mjs
          node scripts/validate-group-2b-provider-neutral-production-resilience.mjs
          node scripts/validate-group-3-project-financial-workspaces.mjs
          node scripts/validate-group-4-project-notification-automation.mjs
          npm ci --no-audit --no-fund
          npm run build
          popd >/dev/null
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Push corrected PR 240 head
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin HEAD:feature/module-011-private-document-pipeline-20260729
          echo "PR240_CORRECTED_HEAD=$(git rev-parse HEAD)"
