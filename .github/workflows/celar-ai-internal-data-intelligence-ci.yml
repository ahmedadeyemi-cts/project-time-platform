name: Celar AI Internal Data Intelligence CI

on:
  pull_request:
    paths:
      - 'database/migrations/080_celar_ai_internal_data_intelligence.sql'
      - 'database/migrations/081_celar_ai_private_runtime_activation.sql'
      - 'database/rollback/080_celar_ai_internal_data_intelligence_rollback.sql'
      - 'database/rollback/081_celar_ai_private_runtime_activation_rollback.sql'
      - 'src/backend/ProjectTime.Api/Ai/CelarAiInternalDataService.cs'
      - 'src/backend/ProjectTime.Api/Ai/CelarAiPublicEntityRegistry.cs'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiSystemIntelligenceContracts.cs'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiSystemIntelligenceService.cs'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiSystemKnowledgeCatalog.cs'
      - 'src/backend/ProjectTime.Api/Ai/ProjectPulseAiServiceCollectionExtensions.cs'
      - 'src/backend/ProjectTime.Api/Modules/CelarAiBrandModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/CelarAiProductionPlatformModule.cs'
      - 'tests/CelarAiInternalDataTests/**'
      - 'tests/validate-celar-ai-internal-data-intelligence.mjs'
      - 'tests/test-celar-ai-internal-data-migration-080.sh'
      - 'tests/test-celar-ai-private-runtime-activation-migration-081.sh'
      - 'tests/validate-celar-ai-opencloud-deferred-runtime.mjs'
      - 'docs/modules/module-011-pulse-ai/CELAR-AI-INTERNAL-DATA-INTELLIGENCE.md'
      - 'docs/modules/module-011-pulse-ai/ANSWER-QUALITY-AND-PRIVACY-CONTRACT.md'
      - 'scripts/release-test/verify-runtime.mjs'
      - '.github/workflows/celar-ai-internal-data-intelligence-ci.yml'
      - '.github/workflows/projectpulse-deploy-celar-ai-private-runtime-test.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: celar-ai-internal-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-public-question-validator:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/ask-celar-ai-public-questions-resilience-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/ask-celar-ai-public-questions-resilience-20260811
          fetch-depth: 2
          persist-credentials: true

      - name: Align privacy validation with governed public-only routing
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs')
          text = path.read_text(encoding='utf-8')
          old = (
              "    'PublicGeneralQuestion: plan.IntentCode == \"general_knowledge\"',\n"
              "    'PublicQuestion: plan.IntentCode == \"general_knowledge\"',\n"
          )
          new = (
              "    'var publicGeneralQuestion = plan.IntentCode == \"general_knowledge\"',\n"
              "    'SystemPrompt: publicGeneralQuestion',\n"
              "    'UserPrompt: publicGeneralQuestion ? question : privatePrompt',\n"
              "    'MaxOutputTokens: publicGeneralQuestion',\n"
              "    'PublicGeneralQuestion: publicGeneralQuestion',\n"
              "    'PublicQuestion: publicGeneralQuestion ? question : null',\n"
              "    'This general-knowledge answer used only the public question through the private Celar AI runtime.',\n"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one legacy public-question privacy marker block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('CELAR_PUBLIC_QUESTION_PRIVACY_VALIDATOR=UPDATED')
          PY

          node src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs
          git diff --check

      - name: Restore permanent workflow and publish repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git show HEAD^:.github/workflows/celar-ai-internal-data-intelligence-ci.yml > .github/workflows/celar-ai-internal-data-intelligence-ci.yml
          rm -f .github/workflows/patch-pr644-external-deidentification-validator.yml
          git config user.name 'Pulse Celar AI Repair Automation'
          git config user.email 'pulse-celar-ai-repair@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align public-question privacy validation with governed routing'
          git push origin HEAD:fix/ask-celar-ai-public-questions-resilience-20260811

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Validate internal-first source contract
        run: node tests/validate-celar-ai-internal-data-intelligence.mjs
      - name: Build API and run routing/parser contract
        run: dotnet run --project tests/CelarAiInternalDataTests/CelarAiInternalDataTests.csproj --configuration Release -p:ProjectPulseSourceRevision=1111111111111111111111111111111111111111
      - name: Test migration and guarded rollback
        run: bash tests/test-celar-ai-internal-data-migration-080.sh
      - name: Test private-runtime activation migration and guarded rollback
        run: bash tests/test-celar-ai-private-runtime-activation-migration-081.sh
      - name: Verify OpenCloud runtime remains manual and deferred
        run: node tests/validate-celar-ai-opencloud-deferred-runtime.mjs
      - name: Verify clean diff
        run: git diff --check && git diff --exit-code
