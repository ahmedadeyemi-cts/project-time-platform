name: Diagnose DeepSeek encrypted storage in Protected Test
on:
  push:
    branches: [fix/deepseek-secret-store-20260904]
permissions:
  contents: read
  id-token: write
jobs:
  schema:
    runs-on: ubuntu-24.04
    environment: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run schema-only diagnostics through the protected private-network runner
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID: ${{ vars.AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID }}
          AZURE_KEY_VAULT_URI: ${{ vars.AZURE_KEY_VAULT_URI }}
          PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME: ${{ vars.PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME }}
          PROJECTPULSE_TEST_DATABASE_HOST: ${{ vars.PROJECTPULSE_TEST_DATABASE_HOST }}
          PROJECTPULSE_TEST_DATABASE_PORT: ${{ vars.PROJECTPULSE_TEST_DATABASE_PORT }}
          PROJECTPULSE_TEST_DATABASE_NAME: ${{ vars.PROJECTPULSE_TEST_DATABASE_NAME }}
          PROJECTPULSE_TEST_DATABASE_USER: ${{ vars.PROJECTPULSE_TEST_DATABASE_USER }}
          RELIABILITY_CONTROL_SHA: ${{ github.sha }}
          RELIABILITY_RELEASE_COMMIT: ${{ github.sha }}
          RELIABILITY_MIGRATION_JOB_NAME: dskey-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          [[ "$AZURE_API_APP" == ca-phd-test-api-westus3 ]]
          context="$(mktemp -d)"
          cp tests/deepseek-secret-schema.sql "$context/schema.sql"
          cat > "$context/Dockerfile" <<'DOCKER'
          FROM postgres:16-alpine
          COPY schema.sql /schema.sql
          ENTRYPOINT ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/schema.sql"]
          DOCKER
          image="deepseek-secret-schema:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az acr build --registry "$AZURE_ACR_NAME" --image "$image" --file "$context/Dockerfile" "$context" --output none
          digest="$(az acr repository show --name "$AZURE_ACR_NAME" --image "$image" --query digest -o tsv)"
          export RELIABILITY_MIGRATION_IMAGE="$AZURE_ACR_NAME.azurecr.io/deepseek-secret-schema@$digest"
          bash scripts/release-test/run-deepseek-secret-schema-job.sh
