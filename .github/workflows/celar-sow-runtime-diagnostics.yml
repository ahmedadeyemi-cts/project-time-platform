name: Diagnose Protected Test SOW Runtime
on:
  push:
    branches: [fix/sow-phase-runtime-retry-20260906]
    paths:
      - '.github/workflows/celar-sow-runtime-diagnostics.yml'
      - 'scripts/release-test/diagnose-sow-runtime.py'
permissions:
  contents: read
concurrency:
  group: celar-sow-runtime-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'ahmedadeyemi-cts/project-time-platform'
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Diagnose synthetic SOW completion without business-data mutation
        env:
          SOW_DIAGNOSTIC_TOKEN: ${{ secrets.PROJECTPULSE_TEST_CELAR_AI_ORACLE_RUNTIME_TOKEN }}
        run: python3 scripts/release-test/diagnose-sow-runtime.py
