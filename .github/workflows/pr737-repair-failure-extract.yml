name: Extract PR 737 repair validation failure

on:
  push:
    branches:
      - ops/pr737-protected-uat-observer-20260823
    paths:
      - '.github/workflows/pr737-repair-failure-extract.yml'

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: '32692073985'
      OUTPUT_DIR: /tmp/pr737-repair-failure
    steps:
      - name: Download exact failed repair log
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$OUTPUT_DIR/logs"
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/actions/runs/$FAILED_RUN_ID/logs" \
            --output "$OUTPUT_DIR/logs.zip"
          unzip -q "$OUTPUT_DIR/logs.zip" -d "$OUTPUT_DIR/logs"
          rm -f "$OUTPUT_DIR/logs.zip"
          log_file="$(find "$OUTPUT_DIR/logs" -type f -name '*Publish permanent 080, 081, and 094 repair*.txt' -print -quit)"
          [[ -n "$log_file" && -s "$log_file" ]]
          tail -n 1200 "$log_file" > "$OUTPUT_DIR/repair-failure-tail.txt"
          grep -nEi -C 30 'Expected exactly one|ASSERTION_FAILED|AssertionError|ERROR:|##\[error\]|failed|failure|not found|does not exist|mismatch|unexpected' "$log_file" \
            > "$OUTPUT_DIR/repair-failure-extract.txt" || true
      - name: Upload exact repair failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr737-repair-failure-${{ github.run_id }}
          path: /tmp/pr737-repair-failure
          if-no-files-found: error
          retention-days: 3
