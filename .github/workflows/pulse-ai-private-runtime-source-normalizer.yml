name: Normalize Pulse AI Private Runtime Source

on:
  push:
    branches:
      - feature/module-011-private-runtime-activation-20260729
    paths:
      - .github/workflows/pulse-ai-private-runtime-source-normalizer.yml

permissions:
  contents: write

concurrency:
  group: pulse-ai-private-runtime-source-normalizer
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/module-011-private-runtime-activation-20260729
      - name: Normalize the document-runtime readiness type and remove this one-time workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE='src/backend/ProjectTime.Api/Ai/PulseAiPrivateDocumentRuntimeService.cs'
          grep -Fq 'PulseAiPrivateRuntimeReadiness' "$FILE"
          sed -i 's/PulseAiPrivateRuntimeReadiness/PulseAiPrivateDocumentRuntimeReadiness/g' "$FILE"
          ! grep -Fq 'PulseAiPrivateRuntimeReadiness' "$FILE"
          rm -f .github/workflows/pulse-ai-private-runtime-source-normalizer.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE" .github/workflows/pulse-ai-private-runtime-source-normalizer.yml
          git commit -m 'Normalize Pulse AI private document runtime readiness type'
          git push origin HEAD:feature/module-011-private-runtime-activation-20260729
