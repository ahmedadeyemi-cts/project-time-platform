name: Verify exact FlowHive control review repair
on:
  push:
    branches: ['tooling/pr874-reviewed-integration-20260907']
    paths: ['.github/flowhive-control-review-repair.py', '.github/workflows/flowhive-ci-repair-objects.yml']
permissions:
  contents: write
concurrency:
  group: flowhive-ci-repair-objects
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ahmedadeyemi-cts/project-time-platform' && github.actor == 'ahmedadeyemi-cts'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: aa7ac96a3922cb2242047007a4eb8bfb0c508fcb
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct reviewed control source without changing remote refs
        working-directory: control
        env:
          CONTROL_BASE: 55ebb51fda1917f202ce6561ed5f5e635468d01c
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install PyYAML==6.0.3
          python3 ../tools/.github/flowhive-control-review-repair.py
          git add -u
          test "$(git write-tree)" = 23cf4df9672f09e2ff26a6aac670dc3c122afce0
          test "$(git diff --cached --name-only | wc -l)" = 4
          git config user.name 'FlowHive source verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify exact PR876 identity binding and reviewed candidate refresh'
          test "$(git diff --name-only 55ebb51fda1917f202ce6561ed5f5e635468d01c HEAD | wc -l)" = 7
          node --test tests/flowhive-psa-admission.test.mjs
          python3 tests/flowhive-psa-release-workflow.test.py
          python3 tests/flowhive-psa-live-uat.test.py
          python3 tests/flowhive-psa-migration-fixture.py --digest-only
          git diff --check aa7ac96a3922cb2242047007a4eb8bfb0c508fcb HEAD
      - name: Publish checked immutable source blobs only
        working-directory: control
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          expected_tree='23cf4df9672f09e2ff26a6aac670dc3c122afce0'
          assert git('rev-parse','HEAD^{tree}')==expected_tree
          names=git('diff','--name-only','aa7ac96a3922cb2242047007a4eb8bfb0c508fcb','HEAD').splitlines()
          assert names==sorted(['.github/flowhive-psa-protected-test-candidate.json','docs/releases/FLOWHIVE-PSA-PROTECTED-TEST-ADMISSION.md','tests/flowhive-psa-admission.test.mjs','tests/flowhive-psa-release-control.mjs'])
          for name in ['.github/workflows/projectpulse-deploy-test.yml','scripts/release-test/dispatch-flowhive-psa-test.mjs']:
              assert git('rev-parse','HEAD:'+name)==git('rev-parse','55ebb51fda1917f202ce6561ed5f5e635468d01c:'+name)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'flowhive-control-review';out.mkdir()
          objects=[]
          for name in names:
              p=pathlib.Path(name);assert p.is_file() and not p.is_symlink()
              data=p.read_bytes();expected=git('rev-parse','HEAD:'+name)
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==expected
              payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              req=urllib.request.Request('https://api.github.com/repos/ahmedadeyemi-cts/project-time-platform/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:actual=json.load(response)['sha']
              assert actual==expected
              objects.append({'path':name,'sha':actual,'mode':git('ls-tree','HEAD',name).split()[0],'type':'blob'})
          (out/'objects.json').write_text(json.dumps(objects,indent=2)+'\n')
          (out/'tree').write_text(expected_tree+'\n')
          print('SOURCE_BLOBS=4 REMOTE_REF_UPDATES=0 CLOUD_MUTATIONS=0 DEPLOYMENT_DISPATCHES=0')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flowhive-control-review-verified
          path: ${{ runner.temp }}/flowhive-control-review/
          retention-days: 1
          if-no-files-found: error
