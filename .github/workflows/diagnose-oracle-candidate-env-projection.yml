name: Diagnose Current Oracle Activation v2 Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/diagnose-oracle-candidate-env-projection.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: diagnose-oracle-activation-v2-candidate
  cancel-in-progress: true

jobs:
  inspect:
    name: Capture sanitized startup evidence from Oracle activation v2
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/oracle-candidate-env-projection-20260810'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_DIR: /tmp/oracle-activation-v2-candidate-diagnostic
      TARGET_REVISION: ca-phd-test-api-westus3--caorv2-31449244620-1
      EXPECTED_RELEASE_COMMIT: 016810826d122b400950e9463f4221c9a024be6f
      EXPECTED_IMAGE: acrphdtest7825cc.azurecr.io/project-health-dashboard-api@sha256:a0cb499a1d76504e88c41fd8ab8f140e8ddfc5f5d34802a9876c0b8308336900
      ACTIVITY_WINDOW_START: '2026-08-11T01:24:00Z'
      ACTIVITY_WINDOW_END: '2026-08-11T01:38:00Z'

    steps:
      - name: Sign in read-only to protected Test
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture retained metadata and historical startup logs
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          install -d -m 0700 "$EVIDENCE_DIR"
          [[ "$(az account show --query id -o tsv --only-show-errors)" == '${{ vars.AZURE_SUBSCRIPTION_ID }}' ]] \
            || fail 'Azure login is outside protected Test.'

          RG='${{ vars.AZURE_RESOURCE_GROUP }}'
          APP='${{ vars.AZURE_API_APP }}'
          APP_JSON="$(az containerapp show -g "$RG" -n "$APP" -o json --only-show-errors)"
          [[ "$(jq -r '.tags.environment // empty' <<<"$APP_JSON")" == test ]] \
            || fail 'The API target is not tagged Test.'
          [[ "$(jq -r '.properties.configuration.activeRevisionsMode // empty' <<<"$APP_JSON" | tr '[:upper:]' '[:lower:]')" == single ]] \
            || fail 'Protected Test must remain in single-revision mode.'

          REVISION_LIST="$(az containerapp revision list -g "$RG" -n "$APP" -o json --only-show-errors)"
          CANDIDATE_ENTRY="$(jq -c --arg revision "$TARGET_REVISION" '[.[] | select(.name == $revision)] | if length == 1 then .[0] else null end' <<<"$REVISION_LIST")"
          CANDIDATE_PRESENT="$(jq -r 'if . == null then "false" else "true" end' <<<"$CANDIDATE_ENTRY")"

          if [[ "$CANDIDATE_PRESENT" == true ]]; then
            CANDIDATE_JSON="$(az containerapp revision show -g "$RG" -n "$APP" --revision "$TARGET_REVISION" -o json --only-show-errors)"
            CANDIDATE_IMAGE="$(jq -r '.properties.template.containers[0].image // empty' <<<"$CANDIDATE_JSON")"
            CANDIDATE_SOURCE="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$CANDIDATE_JSON")"
            [[ "$CANDIDATE_IMAGE" == "$EXPECTED_IMAGE" ]] || fail 'Candidate image does not match the exact PR #627 immutable digest.'
            [[ "$CANDIDATE_SOURCE" == "$EXPECTED_RELEASE_COMMIT" ]] || fail 'Candidate source marker does not match the exact PR #627 merge commit.'
            jq '{
                  name,
                  active:(.properties.active // false),
                  healthState:(.properties.healthState // null),
                  provisioningState:(.properties.provisioningState // null),
                  runningState:(.properties.runningState // null),
                  trafficWeight:(.properties.trafficWeight // 0),
                  image:(.properties.template.containers[0].image // null),
                  sourceCommit:([.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else null end)
                }' <<<"$CANDIDATE_JSON" > "$EVIDENCE_DIR/candidate.json"
          else
            jq -n --arg name "$TARGET_REVISION" '{name:$name,retained:false}' > "$EVIDENCE_DIR/candidate.json"
          fi

          jq '[.[] | {
                name,
                active:(.properties.active // false),
                healthState:(.properties.healthState // null),
                provisioningState:(.properties.provisioningState // null),
                runningState:(.properties.runningState // null),
                trafficWeight:(.properties.trafficWeight // 0),
                createdTime:(.properties.createdTime // null)
              }]' <<<"$REVISION_LIST" > "$EVIDENCE_DIR/current-revisions.json"

          az containerapp logs show -g "$RG" -n "$APP" \
            --type system --tail 300 --format text \
            > "$EVIDENCE_DIR/system-raw.log" 2>&1 || true

          az monitor activity-log list \
            --resource-group "$RG" \
            --start-time "$ACTIVITY_WINDOW_START" \
            --end-time "$ACTIVITY_WINDOW_END" \
            --max-events 200 \
            -o json --only-show-errors \
            > "$EVIDENCE_DIR/activity-raw.json" 2> "$EVIDENCE_DIR/activity-command.err" || printf '[]\n' > "$EVIDENCE_DIR/activity-raw.json"

          ENVIRONMENT_ID="$(jq -r '.properties.managedEnvironmentId // .properties.environmentId // empty' <<<"$APP_JSON")"
          WORKSPACE_ID=''
          if [[ -n "$ENVIRONMENT_ID" ]]; then
            ENVIRONMENT_JSON="$(az resource show --ids "$ENVIRONMENT_ID" -o json --only-show-errors 2>/dev/null || true)"
            WORKSPACE_ID="$(jq -r '.properties.appLogsConfiguration.logAnalyticsConfiguration.customerId // empty' <<<"$ENVIRONMENT_JSON" 2>/dev/null || true)"
          fi

          if [[ -n "$WORKSPACE_ID" ]]; then
            SYSTEM_QUERY="ContainerAppSystemLogs_CL
            | extend App=tostring(column_ifexists('ContainerAppName_s','')), Revision=tostring(column_ifexists('RevisionName_s','')), Replica=tostring(column_ifexists('ReplicaName_s','')), Reason=tostring(column_ifexists('Reason_s','')), Message=tostring(column_ifexists('Log_s',''))
            | where TimeGenerated between (datetime($ACTIVITY_WINDOW_START) .. datetime($ACTIVITY_WINDOW_END))
            | where App == '$APP' or Revision == '$TARGET_REVISION' or Message contains '$TARGET_REVISION'
            | project TimeGenerated, App, Revision, Replica, Reason, Message
            | order by TimeGenerated asc"
            CONSOLE_QUERY="ContainerAppConsoleLogs_CL
            | extend App=tostring(column_ifexists('ContainerAppName_s','')), Revision=tostring(column_ifexists('RevisionName_s','')), Replica=tostring(column_ifexists('ReplicaName_s','')), Container=tostring(column_ifexists('ContainerName_s','')), Message=tostring(column_ifexists('Log_s',''))
            | where TimeGenerated between (datetime($ACTIVITY_WINDOW_START) .. datetime($ACTIVITY_WINDOW_END))
            | where App == '$APP' or Revision == '$TARGET_REVISION'
            | project TimeGenerated, App, Revision, Replica, Container, Message
            | order by TimeGenerated asc"
            az monitor log-analytics query --workspace "$WORKSPACE_ID" --analytics-query "$SYSTEM_QUERY" -o json --only-show-errors \
              > "$EVIDENCE_DIR/log-analytics-system-raw.json" 2> "$EVIDENCE_DIR/log-analytics-system-command.err" || printf '[]\n' > "$EVIDENCE_DIR/log-analytics-system-raw.json"
            az monitor log-analytics query --workspace "$WORKSPACE_ID" --analytics-query "$CONSOLE_QUERY" -o json --only-show-errors \
              > "$EVIDENCE_DIR/log-analytics-console-raw.json" 2> "$EVIDENCE_DIR/log-analytics-console-command.err" || printf '[]\n' > "$EVIDENCE_DIR/log-analytics-console-raw.json"
          else
            printf '[]\n' > "$EVIDENCE_DIR/log-analytics-system-raw.json"
            printf '[]\n' > "$EVIDENCE_DIR/log-analytics-console-raw.json"
            printf '%s\n' 'Log Analytics workspace identifier was not exposed by the managed environment metadata.' > "$EVIDENCE_DIR/log-analytics-command.err"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('/tmp/oracle-activation-v2-candidate-diagnostic')
          patterns = [
              (re.compile(r'(?i)(authorization\s*:\s*bearer\s+)[^\s,;]+'), r'\1[REDACTED]'),
              (re.compile(r'(?i)(x-projectpulse-session\s*:\s*)[^\s,;]+'), r'\1[REDACTED]'),
              (re.compile(r'(?i)(password|passwd|client[_-]?secret|api[_-]?key|access[_-]?token|refresh[_-]?token|session[_-]?token|accountkey)(\s*[=:]\s*)[^\s,;"}]+'), r'\1\2[REDACTED]'),
              (re.compile(r'(?i)(Password=)[^;\s]+'), r'\1[REDACTED]'),
              (re.compile(r'(?i)(AccountKey=)[^;\s]+'), r'\1[REDACTED]'),
              (re.compile(r'(?i)(SharedAccessSignature=)[^;\s]+'), r'\1[REDACTED]'),
          ]

          def clean_text(text: str) -> str:
              for pattern, replacement in patterns:
                  text = pattern.sub(replacement, text)
              return text

          raw_log = root / 'system-raw.log'
          (root / 'system.log').write_text(clean_text(raw_log.read_text(encoding='utf-8', errors='replace') if raw_log.exists() else ''), encoding='utf-8')
          raw_log.unlink(missing_ok=True)

          for raw_name, safe_name in [
              ('activity-raw.json', 'activity.json'),
              ('log-analytics-system-raw.json', 'log-analytics-system.json'),
              ('log-analytics-console-raw.json', 'log-analytics-console.json'),
          ]:
              raw = root / raw_name
              try:
                  data = json.loads(raw.read_text(encoding='utf-8'))
              except Exception:
                  data = []

              def scrub(value):
                  if isinstance(value, str):
                      return clean_text(value)
                  if isinstance(value, list):
                      return [scrub(item) for item in value]
                  if isinstance(value, dict):
                      return {key: scrub(item) for key, item in value.items()}
                  return value

              (root / safe_name).write_text(json.dumps(scrub(data), indent=2, sort_keys=True), encoding='utf-8')
              raw.unlink(missing_ok=True)

          for path in root.glob('*.err'):
              path.write_text(clean_text(path.read_text(encoding='utf-8', errors='replace')), encoding='utf-8')
          PY

          jq -n \
            --arg observedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg targetRevision "$TARGET_REVISION" \
            --arg candidateRetained "$CANDIDATE_PRESENT" \
            --arg latestReadyRevision "$(jq -r '.properties.latestReadyRevisionName // empty' <<<"$APP_JSON")" \
            --arg latestRevision "$(jq -r '.properties.latestRevisionName // empty' <<<"$APP_JSON")" \
            --arg sourceCommit "$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$APP_JSON")" \
            --arg image "$(jq -r '.properties.template.containers[0].image // empty' <<<"$APP_JSON")" \
            --arg workspaceAvailable "$(if [[ -n "$WORKSPACE_ID" ]]; then echo true; else echo false; fi)" \
            --argjson candidate "$(cat "$EVIDENCE_DIR/candidate.json")" \
            --argjson currentRevisions "$(cat "$EVIDENCE_DIR/current-revisions.json")" \
            --argjson activity "$(cat "$EVIDENCE_DIR/activity.json")" \
            --argjson historicalSystemLogs "$(cat "$EVIDENCE_DIR/log-analytics-system.json")" \
            --argjson historicalConsoleLogs "$(cat "$EVIDENCE_DIR/log-analytics-console.json")" \
            '{
              status:"captured",
              observedAt:$observedAt,
              environment:"test",
              mutationPerformed:false,
              targetRevision:$targetRevision,
              candidateRetained:($candidateRetained == "true"),
              currentApplication:{latestReadyRevision:$latestReadyRevision,latestRevision:$latestRevision,sourceCommit:$sourceCommit,image:$image},
              candidate:$candidate,
              currentRevisions:$currentRevisions,
              logAnalyticsWorkspaceAvailable:($workspaceAvailable == "true"),
              activity:$activity,
              historicalSystemLogs:$historicalSystemLogs,
              historicalConsoleLogs:$historicalConsoleLogs,
              productionMutation:false
            }' > "$EVIDENCE_DIR/diagnostic-summary.json"

          echo '--- DIAGNOSTIC SUMMARY ---'
          jq '{targetRevision,candidateRetained,currentApplication,candidate,logAnalyticsWorkspaceAvailable,activityCount:(.activity|length),historicalSystemLogCount:(.historicalSystemLogs|length),historicalConsoleLogCount:(.historicalConsoleLogs|length)}' "$EVIDENCE_DIR/diagnostic-summary.json"
          echo '--- CURRENT SYSTEM FAILURE LINES ---'
          grep -Ein "$TARGET_REVISION|critical|fatal|exception|error|fail|unhealthy|startup|crash|probe|secret|configuration|invalid|denied|refused|timeout" "$EVIDENCE_DIR/system.log" | tail -n 200 || true
          echo '--- HISTORICAL SYSTEM LOGS ---'
          jq -r '.[]? | @json' "$EVIDENCE_DIR/log-analytics-system.json" | grep -Ei "$TARGET_REVISION|critical|fatal|exception|error|fail|unhealthy|startup|crash|probe|secret|configuration|invalid|denied|refused|timeout" | tail -n 200 || true
          echo '--- HISTORICAL CONSOLE LOGS ---'
          jq -r '.[]? | @json' "$EVIDENCE_DIR/log-analytics-console.json" | grep -Ei "$TARGET_REVISION|critical|fatal|exception|error|fail|unhealthy|startup|crash|probe|secret|configuration|invalid|denied|refused|timeout" | tail -n 200 || true
          echo 'READ_ONLY_DIAGNOSTIC=COMPLETE'
          echo 'TEST_MUTATION=NONE'
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Upload immutable sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oracle-activation-v2-candidate-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/oracle-activation-v2-candidate-diagnostic
          if-no-files-found: warn
          retention-days: 7

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Oracle activation-v2 startup diagnostic'
            echo
            echo '- Target revision: `ca-phd-test-api-westus3--caorv2-31449244620-1`'
            echo '- Exact application release: `016810826d122b400950e9463f4221c9a024be6f`'
            echo '- Diagnostic mode: read-only'
            echo '- Test mutation: none'
            echo '- Production mutation: none'
            if [[ -f "$EVIDENCE_DIR/diagnostic-summary.json" ]]; then
              echo '- Sanitized historical startup evidence: captured'
            else
              echo '- Sanitized startup evidence: incomplete; inspect the job log'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
