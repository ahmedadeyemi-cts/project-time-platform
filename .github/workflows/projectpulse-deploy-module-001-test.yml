name: ProjectPulse Deploy Module Availability Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified governed module availability release commit
        required: true
        default: b64f495c743c30176977d05435f838259ead2d9e
        type: string
      confirmation:
        description: Enter DEPLOY-MODULE-AVAILABILITY-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-module-availability-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded migration 042 and module availability test deployment
    environment: test
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_COMMIT: b64f495c743c30176977d05435f838259ead2d9e
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact module availability release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and module availability release
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ github.ref }}' == 'refs/heads/main' ]] || { echo 'Dispatch this workflow from main.' >&2; exit 1; }
          [[ '${{ inputs.confirmation }}' == 'DEPLOY-MODULE-AVAILABILITY-TO-TEST' ]] || { echo 'Confirmation text does not match.' >&2; exit 1; }
          [[ '${{ inputs.release_commit }}' =~ ^[0-9a-f]{40}$ ]] || { echo 'release_commit must be a complete SHA.' >&2; exit 1; }
          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == '${{ github.sha }}' ]]
          [[ "$TARGET_COMMIT" == '${{ inputs.release_commit }}' ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || { echo 'Only the verified module availability release may deploy.' >&2; exit 1; }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || { echo 'Release is not an ancestor of deployment controls.' >&2; exit 1; }

          MIGRATION='release/database/migrations/042_module_availability_controls.sql'
          BACKEND='release/src/backend/ProjectTime.Api/Modules/ModuleAvailabilityModule.cs'
          CONTROLLER='release/src/frontend/project-time-web/src/ModuleAvailabilityController.jsx'
          REGISTRY='release/src/frontend/project-time-web/src/module-availability-registry.js'
          BRIDGE='release/src/frontend/project-time-web/src/module-availability-bridge.js'
          test -f "$MIGRATION" -a -f "$BACKEND" -a -f "$CONTROLLER" -a -f "$REGISTRY" -a -f "$BRIDGE"
          grep -Fq "'042_module_availability_controls'" "$MIGRATION"
          grep -Fq 'INSERT INTO schema_migrations' "$MIGRATION"
          grep -Fq 'is_enabled boolean NOT NULL DEFAULT TRUE' "$MIGRATION"
          grep -Fq 'MapGet("/api/module-availability"' "$BACKEND"
          grep -Fq 'MapPut("/api/module-availability/{moduleNumber}"' "$BACKEND"
          grep -Fq 'actualRoles.Contains("SUPER_ADMINISTRATOR") && !isViewAs' "$BACKEND"
          grep -Fq 'effectiveRoles.Contains("SUPER_ADMINISTRATOR")' "$BACKEND"
          grep -Fq 'Enable or disable modules safely' "$CONTROLLER"
          grep -Fq 'Disabled modules are preserved' "$CONTROLLER"
          grep -Fq "moduleNumber: '001', route: 'timesheet', displayName: 'Timesheet'" "$REGISTRY"
          grep -Fq 'X-ProjectPulse-Module-Number' "$BRIDGE"
          node release/src/frontend/project-time-web/scripts/validate-module-availability.mjs
          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Load test database connection
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        run: bash control/scripts/export-pr55-test-database-url.sh

      - name: Capture current API and web images
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          RAW_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          [[ -n "$RAW_API" && -n "$RAW_WEB" && "${API_MODE,,}" == single && "${WEB_MODE,,}" == single ]]
          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in "$registry"*@sha256:*) printf '%s\n' "$image"; return;; "$registry"*:*) ;; *) return 1;; esac
            relative="${image#"$registry"}"; repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }
          OLD_API="$(resolve_digest "$RAW_API")"; OLD_WEB="$(resolve_digest "$RAW_WEB")"
          echo "old_api_image=$OLD_API" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$OLD_WEB" >> "$GITHUB_OUTPUT"

      - name: Build immutable API and web images
        id: build
        working-directory: release
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA='${{ steps.release.outputs.target_commit }}'
          API_REPO='project-health-dashboard-api'; WEB_REPO='project-health-dashboard-web'
          API_DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$API_REPO:module-availability-$SHA" deployment/containers/api/Dockerfile .)"
          WEB_DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$WEB_REPO:module-availability-$SHA" deployment/containers/web/Dockerfile .)"
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$API_REPO@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$WEB_REPO@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build checksum-pinned migration 042 image
        id: migration
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/module-availability-migrator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          install -m 0644 control/deployment/containers/module-availability-migrator/Dockerfile "$CONTEXT/Dockerfile"
          install -m 0755 control/scripts/apply-module-availability-test-migration.sh "$CONTEXT/apply-module-availability-test-migration.sh"
          install -m 0644 release/database/migrations/042_module_availability_controls.sql "$CONTEXT/migrations/042_module_availability_controls.sql"
          (
            cd "$CONTEXT/migrations"
            sha256sum 042_module_availability_controls.sql > SHA256SUMS
          )
          [[ "$(wc -l < "$CONTEXT/migrations/SHA256SUMS")" == "1" ]]
          printf '%s\n' '${{ steps.release.outputs.target_commit }}' > "$CONTEXT/release-commit"
          DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-module-availability-migrator:${{ steps.release.outputs.target_commit }}-${GITHUB_SHA:0:12}" "$CONTEXT/Dockerfile" "$CONTEXT")"
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-module-availability-migrator@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Apply and verify migration 042 inside private network
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          MODULE_AVAILABILITY_MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
          MODULE_AVAILABILITY_MIGRATION_JOB_NAME: mav-mig-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash control/scripts/run-module-availability-test-migration-job.sh

      - name: Deploy API
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT='${{ steps.release.outputs.target_commit }}' \
            --revision-suffix "mavapi-${GITHUB_RUN_ID}" --output none

      - name: Validate API and module availability routes
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          wait_status() { local url="$1" expected="$2" status=''; for i in $(seq 1 30); do status="$(curl -sS -o /tmp/response -w '%{http_code}' "$url" || true)"; [[ ",$expected," == *",$status,"* ]] && return 0; sleep 10; done; echo "$url returned $status" >&2; cat /tmp/response >&2 || true; return 1; }
          wait_status "$BASE/health" '200'
          wait_status "$BASE/api/version" '200'
          wait_status "$BASE/api/module-availability" '401'
          wait_status "$BASE/api/module-availability/audit" '401'

      - name: Deploy web
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' --revision-suffix "mavweb-${GITHUB_RUN_ID}" --output none

      - name: Validate served module availability web and active images
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"; READY=false
          for i in $(seq 1 30); do
            BUSTER="module-availability-${GITHUB_RUN_ID}-$i"
            STATUS="$(curl -sSL -H 'Cache-Control: no-cache' -o /tmp/index.html -w '%{http_code}' "$BASE/?release_check=$BUSTER" || true)"
            JS="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/index.html | head -1)"
            if [[ "$STATUS" == 200 && -n "$JS" ]]; then
              case "$JS" in http*) URL="$JS";; /*) URL="$BASE$JS";; *) URL="$BASE/$JS";; esac
              curl -sSL -H 'Cache-Control: no-cache' -o /tmp/app.js "$URL?release_check=$BUSTER" || true
              : > /tmp/app.css
              while IFS= read -r CSS; do
                [[ -n "$CSS" ]] || continue
                case "$CSS" in http*) CSS_URL="$CSS";; /*) CSS_URL="$BASE$CSS";; *) CSS_URL="$BASE/$CSS";; esac
                curl -sSL -H 'Cache-Control: no-cache' "$CSS_URL?release_check=$BUSTER" >> /tmp/app.css || true
              done < <(grep -oE 'href="[^"]+\.css"' /tmp/index.html | sed -E 's/^href="|"$//g')
              if grep -Fq 'Enable or disable modules safely' /tmp/app.js \
                && grep -Fq 'Disabled modules are preserved' /tmp/app.js \
                && grep -Fq 'X-ProjectPulse-Module-Number' /tmp/app.js \
                && grep -Fq 'Module 001' /tmp/app.js \
                && grep -Fq 'Timesheet' /tmp/app.js \
                && grep -Fq 'module-availability-switch' /tmp/app.css; then READY=true; break; fi
            fi
            sleep 10
          done
          [[ "$READY" == true ]] || { echo 'Module availability web markers were not served.' >&2; exit 1; }
          ACTIVE_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          ACTIVE_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_API" == '${{ steps.build.outputs.api_image }}' && "$ACTIVE_WEB" == '${{ steps.build.outputs.web_image }}' ]]

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/module-availability-test-deployment.json <<JSON
          {"environment":"test","releaseCommit":"${{ steps.release.outputs.target_commit }}","workflowCommit":"${{ github.sha }}","runId":"${{ github.run_id }}","migration042":"applied-and-verified","migrationImage":"${{ steps.migration.outputs.image }}","apiImage":"${{ steps.build.outputs.api_image }}","webImage":"${{ steps.build.outputs.web_image }}","previousApiImage":"${{ steps.before.outputs.old_api_image }}","previousWebImage":"${{ steps.before.outputs.old_web_image }}","defaultAvailability":"enabled","availabilityRowsChangedByMigration":false,"databaseRollback":"not-automatic-additive-migration"}
          JSON

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: module-availability-test-deployment-${{ github.run_id }}
          path: evidence/module-availability-test-deployment.json
          retention-days: 30

      - name: Roll back API and web images on failure
        if: ${{ failure() && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set +e
          echo 'Migration 042 is additive and is not automatically rolled back after application.'
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --image '${{ steps.before.outputs.old_api_image }}' --revision-suffix "mavapirb-${GITHUB_RUN_ID}" --output none
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --image '${{ steps.before.outputs.old_web_image }}' --revision-suffix "mavwebrb-${GITHUB_RUN_ID}" --output none
