name: Deploy PR478 More Menu Names to Test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pr478-more-menu-names-test.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-pr478-more-menu-names-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy PR478 More menu names to Test'
    name: Deploy exact PR478 web release to Test
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_SHA: 8e0bd5ae1dbdd41d1c57b3b2aea69fd9bb4457ca
      CONTROL_WORKFLOW_PATH: .github/workflows/deploy-pr478-more-menu-names-test.yml
    steps:
      - name: Check out deployment control
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact application release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: release
          fetch-depth: 2
          persist-credentials: false

      - name: Guard exact web-only Test release
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          CONTROL_SHA="$(git -C control rev-parse HEAD)"
          TARGET_SHA="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_SHA" == "$GITHUB_SHA" ]]
          [[ "$TARGET_SHA" == "$RELEASE_SHA" ]]
          git -C control merge-base --is-ancestor "$RELEASE_SHA" HEAD

          CHANGED_AFTER_RELEASE="$(git -C control diff --name-only "$RELEASE_SHA"...HEAD)"
          printf '%s\n' "$CHANGED_AFTER_RELEASE"
          [[ "$CHANGED_AFTER_RELEASE" == "$CONTROL_WORKFLOW_PATH" ]] || {
            echo 'Deployment-control main contains changes other than the one-time PR478 controller.' >&2
            exit 1
          }

          RELEASE_PARENT="$(git -C control rev-parse "$RELEASE_SHA^")"
          RELEASE_CHANGES="$(git -C control diff --name-only "$RELEASE_PARENT" "$RELEASE_SHA")"
          [[ -n "$RELEASE_CHANGES" ]]
          while IFS= read -r changed_path; do
            case "$changed_path" in
              src/frontend/project-time-web/*) ;;
              *)
                echo "PR478 contains a non-web change: $changed_path" >&2
                exit 1
                ;;
            esac
          done <<< "$RELEASE_CHANGES"
          PROTECTED_CHANGES="$(git -C control diff --name-only "$RELEASE_PARENT" "$RELEASE_SHA" -- \
            database \
            src/backend \
            deployment)"
          [[ -z "$PROTECTED_CHANGES" ]] || {
            echo 'PR478 is not web-only; API, database, migration, or API-container paths changed:' >&2
            printf '%s\n' "$PROTECTED_CHANGES" >&2
            exit 1
          }

          test -x control/scripts/build-pr55-acr-image.sh
          test -f release/deployment/containers/web/Dockerfile
          test -f release/src/frontend/project-time-web/scripts/inject-react-owned-more-menu.mjs
          test -f release/src/frontend/project-time-web/scripts/validate-group-1-navigation-work-consolidation.mjs
          test -f release/src/frontend/project-time-web/scripts/validate-dynamic-rbac-administration.mjs
          test -f release/src/frontend/project-time-web/scripts/validate-module-001-ptc-timer-dom-ownership.mjs
          test -f release/src/frontend/project-time-web/scripts/validate-module-availability.mjs
          test -f release/src/frontend/project-time-web/src/module-availability-registry.js
          test -f release/src/frontend/project-time-web/src/module-availability-bridge.js
          test -f release/src/frontend/project-time-web/src/intuitive-more-menu.css

          grep -Fq 'data-more-label-source="module-registry"' \
            release/src/frontend/project-time-web/scripts/inject-react-owned-more-menu.mjs
          grep -Fq '<strong className="projectpulse-more-intuitive-name">{getNavigationDisplayLabel(item)}</strong>' \
            release/src/frontend/project-time-web/scripts/inject-react-owned-more-menu.mjs
          ! grep -Fq '<strong className="projectpulse-more-intuitive-name">{item.label}</strong>' \
            release/src/frontend/project-time-web/scripts/inject-react-owned-more-menu.mjs
          grep -Fq "moduleNumber: '001', route: 'timesheet', displayName: 'Timesheet'" \
            release/src/frontend/project-time-web/src/module-availability-registry.js
          grep -Fq "moduleNumber: '002', route: 'manager-approval', displayName: 'Approval Inbox'" \
            release/src/frontend/project-time-web/src/module-availability-registry.js
          grep -Fq "const permissionReady = permissionEvidenceState === 'ready';" \
            release/src/frontend/project-time-web/src/module-availability-bridge.js
          grep -Fq "nativeFetch('/api/rbac/v1/bootstrap', request)" \
            release/src/frontend/project-time-web/src/module-availability-bridge.js
          grep -Fq "nativeFetch('/api/rbac/v1/matrix', request)" \
            release/src/frontend/project-time-web/src/module-availability-bridge.js
          grep -Fq '.projectpulse-more-intuitive .projectpulse-more-module-number' \
            release/src/frontend/project-time-web/src/intuitive-more-menu.css

          (
            cd release/src/frontend/project-time-web
            node scripts/validate-group-1-navigation-work-consolidation.mjs
            node scripts/validate-dynamic-rbac-administration.mjs
            node scripts/validate-module-001-ptc-timer-dom-ownership.mjs
            node scripts/validate-module-availability.mjs
          )

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo 'PR478_RELEASE_GUARD=PASS scope=web-only environment=test api=false database=false migration=false production=false'

      - name: Azure login for Test
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Test web uses single-revision mode
        shell: bash
        run: |
          set -Eeuo pipefail
          WEB_MODE="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query 'properties.configuration.activeRevisionsMode' \
            -o tsv)"
          [[ "${WEB_MODE,,}" == single ]]

          ACTIVE_COUNT="$(az containerapp revision list \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query 'length([?properties.active])' \
            -o tsv)"
          [[ "$ACTIVE_COUNT" == 1 ]]
          echo 'PR478_TEST_WEB_CONFIGURATION=PASS revision_mode=single active_revisions=1'

      - name: Capture immutable web rollback image
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t ACTIVE_ROWS < <(az containerapp revision list \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query '[?properties.active].[name,properties.template.containers[0].image]' \
            -o tsv)
          (( ${#ACTIVE_ROWS[@]} == 1 ))
          IFS=$'\t' read -r OLD_REVISION RAW_WEB <<< "${ACTIVE_ROWS[0]}"
          [[ -n "$OLD_REVISION" && -n "$RAW_WEB" ]]

          resolve_digest() {
            local image="$1"
            local registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/'
            local relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Image is outside the approved Test ACR: $image" >&2; return 1 ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show \
              --name '${{ vars.AZURE_ACR_NAME }}' \
              --image "$relative" \
              --query digest \
              -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          echo "old_web_image=$(resolve_digest "$RAW_WEB")" >> "$GITHUB_OUTPUT"
          echo "old_web_revision=$OLD_REVISION" >> "$GITHUB_OUTPUT"
          echo 'PR478_ROLLBACK_CAPTURE=PASS immutable=true'

      - name: Build exact immutable web image
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          WEB_REPOSITORY='project-health-dashboard-web'
          WEB_DIGEST="$(control/scripts/build-pr55-acr-image.sh \
            '${{ vars.AZURE_ACR_NAME }}' \
            "$WEB_REPOSITORY:uat478-$RELEASE_SHA" \
            release/deployment/containers/web/Dockerfile \
            release)"
          [[ "$WEB_DIGEST" == sha256:* ]]
          WEB_IMAGE='${{ vars.AZURE_ACR_NAME }}.azurecr.io/'"$WEB_REPOSITORY@$WEB_DIGEST"
          echo "web_digest=$WEB_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=$WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo "PR478_WEB_BUILD=PASS release=$RELEASE_SHA image=$WEB_IMAGE"

      - name: Deploy exact web image
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "u478web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none \
            --only-show-errors

      - name: Validate active digest and recursively served JS and CSS
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'
          BASE="${BASE%/}"
          ASSET_DIR="$RUNNER_TEMP/pr478-served-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR/files"

          READY=false
          for attempt in $(seq 1 36); do
            BUSTER="pr478-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            INDEX_STATUS="$(curl -sSL \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              -o "$ASSET_DIR/index.html" \
              -w '%{http_code}' \
              "$BASE/?release_check=$BUSTER" || true)"
            if [[ "$INDEX_STATUS" == 200 ]]; then
              : > "$ASSET_DIR/combined.js"
              : > "$ASSET_DIR/combined.css"
              : > "$ASSET_DIR/manifest.tsv"
              declare -A SEEN=()
              mapfile -t QUEUE < <(
                grep -hoE "((https://[^\"'\x60[:space:]<>]+)?/?(\./)?assets/[A-Za-z0-9._/-]+\.(js|css))" \
                  "$ASSET_DIR/index.html" | sort -u
              )
              JS_COUNT=0
              CSS_COUNT=0
              FETCH_FAILED=false

              for round in $(seq 1 8); do
                (( ${#QUEUE[@]} > 0 )) || break
                CURRENT=("${QUEUE[@]}")
                QUEUE=()
                for raw in "${CURRENT[@]}"; do
                  raw="${raw%%\?*}"
                  case "$raw" in
                    "$BASE"/assets/*) url="$raw" ;;
                    /assets/*) url="$BASE$raw" ;;
                    assets/*) url="$BASE/$raw" ;;
                    ./assets/*) url="$BASE/${raw#./}" ;;
                    *) continue ;;
                  esac
                  [[ -z "${SEEN[$url]+x}" ]] || continue
                  SEEN["$url"]=1
                  target="$ASSET_DIR/files/asset-${#SEEN[@]}"
                  if ! curl -fsSL \
                    -H 'Cache-Control: no-cache, no-store, max-age=0' \
                    -H 'Pragma: no-cache' \
                    "$url?release_check=$BUSTER" \
                    -o "$target"; then
                    FETCH_FAILED=true
                    break
                  fi
                  sha256="$(sha256sum "$target" | awk '{print $1}')"
                  printf '%s\t%s\n' "$sha256" "$url" >> "$ASSET_DIR/manifest.tsv"
                  case "$url" in
                    *.js)
                      printf '\n/* served asset: %s */\n' "$url" >> "$ASSET_DIR/combined.js"
                      sed -e '$a\' "$target" >> "$ASSET_DIR/combined.js"
                      JS_COUNT=$((JS_COUNT + 1))
                      ;;
                    *.css)
                      printf '\n/* served asset: %s */\n' "$url" >> "$ASSET_DIR/combined.css"
                      sed -e '$a\' "$target" >> "$ASSET_DIR/combined.css"
                      CSS_COUNT=$((CSS_COUNT + 1))
                      ;;
                  esac
                  mapfile -t DISCOVERED < <(
                    grep -hoE "((https://[^\"'\x60[:space:]<>]+)?/?(\./)?assets/[A-Za-z0-9._/-]+\.(js|css))" \
                      "$target" | sort -u
                  )
                  QUEUE+=("${DISCOVERED[@]}")
                done
                [[ "$FETCH_FAILED" == false ]] || break
              done

              if [[ "$FETCH_FAILED" == false && "$JS_COUNT" -ge 1 && "$CSS_COUNT" -ge 1 ]] \
                && PYTHONHASHSEED=0 python3 - "$ASSET_DIR/combined.js" "$ASSET_DIR/combined.css" <<'PY'
          import re
          import sys

          javascript = open(sys.argv[1], encoding='utf-8').read()
          css = open(sys.argv[2], encoding='utf-8').read()

          js_patterns = {
              'registry-owned More marker': r'data-more-label-source.{0,80}module-registry',
              'Timesheet registry label': r'moduleNumber:[`\"\x27]001[`\"\x27],route:[`\"\x27]timesheet[`\"\x27],displayName:[`\"\x27]Timesheet[`\"\x27]',
              'Approval Inbox registry label': r'moduleNumber:[`\"\x27]002[`\"\x27],route:[`\"\x27]manager-approval[`\"\x27],displayName:[`\"\x27]Approval Inbox[`\"\x27]',
              'permission-evidence attribute': r'data-permission-evidence',
              'RBAC bootstrap evidence': r'/api/rbac/v1/bootstrap',
              'RBAC matrix evidence': r'/api/rbac/v1/matrix',
              'fail-closed status': r'Pages remain hidden until dynamic RBAC permission evidence is verified\.',
          }
          css_patterns = {
              'enterprise More surface': r'\.enterprise-more-dropdown\.projectpulse-more-intuitive',
              'friendly-name treatment': r'\.projectpulse-more-intuitive-name',
              'module-number suppression': r'\.projectpulse-more-module-number',
              'permission loading gate': r'\[data-permission-evidence=loading\]',
              'permission unavailable gate': r'\[data-permission-evidence=unavailable\]',
              'fail-closed hiding': r'display:none!important',
          }
          missing = [name for name, pattern in js_patterns.items() if not re.search(pattern, javascript, re.S)]
          missing.extend(name for name, pattern in css_patterns.items() if not re.search(pattern, css, re.S))
          if missing:
              raise SystemExit('Missing served PR478 marker(s): ' + ', '.join(missing))
          PY
              then
                mapfile -t ACTIVE_ROWS < <(az containerapp revision list \
                  -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
                  -n '${{ vars.AZURE_WEB_APP }}' \
                  --query '[?properties.active].[name,properties.template.containers[0].image]' \
                  -o tsv)
                if (( ${#ACTIVE_ROWS[@]} == 1 )); then
                  IFS=$'\t' read -r ACTIVE_REVISION ACTIVE_IMAGE <<< "${ACTIVE_ROWS[0]}"
                  if [[ "$ACTIVE_IMAGE" == '${{ steps.build.outputs.web_image }}' ]]; then
                    READY=true
                    break
                  fi
                fi
              fi
            fi
            sleep 10
          done

          [[ "$READY" == true ]] || {
            echo 'The exact PR478 digest and recursively discovered browser assets were not active and served.' >&2
            exit 1
          }
          JS_SHA256="$(sha256sum "$ASSET_DIR/combined.js" | awk '{print $1}')"
          CSS_SHA256="$(sha256sum "$ASSET_DIR/combined.css" | awk '{print $1}')"
          echo "active_revision=$ACTIVE_REVISION" >> "$GITHUB_OUTPUT"
          echo "active_image=$ACTIVE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "asset_dir=$ASSET_DIR" >> "$GITHUB_OUTPUT"
          echo "js_count=$JS_COUNT" >> "$GITHUB_OUTPUT"
          echo "css_count=$CSS_COUNT" >> "$GITHUB_OUTPUT"
          echo "js_sha256=$JS_SHA256" >> "$GITHUB_OUTPUT"
          echo "css_sha256=$CSS_SHA256" >> "$GITHUB_OUTPUT"
          echo "PR478_LIVE_WEB=READY digest=verified revisions=single labels=Timesheet,Approval_Inbox source=module-registry permission_scope=dynamic-rbac"

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cp '${{ steps.validate.outputs.asset_dir }}/manifest.tsv' evidence/pr478-served-assets.tsv
          jq -n \
            --arg environment test \
            --arg releaseCommit "$RELEASE_SHA" \
            --arg workflowCommit "$GITHUB_SHA" \
            --arg previousWebImage '${{ steps.before.outputs.old_web_image }}' \
            --arg previousWebRevision '${{ steps.before.outputs.old_web_revision }}' \
            --arg webImage '${{ steps.build.outputs.web_image }}' \
            --arg webDigest '${{ steps.build.outputs.web_digest }}' \
            --arg activeWebRevision '${{ steps.validate.outputs.active_revision }}' \
            --arg activeWebImage '${{ steps.validate.outputs.active_image }}' \
            --arg jsSha256 '${{ steps.validate.outputs.js_sha256 }}' \
            --arg cssSha256 '${{ steps.validate.outputs.css_sha256 }}' \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson jsAssets '${{ steps.validate.outputs.js_count }}' \
            --argjson cssAssets '${{ steps.validate.outputs.css_count }}' \
            '{
              environment: $environment,
              productionChanged: false,
              apiChanged: false,
              databaseChanged: false,
              migrationApplied: false,
              releaseCommit: $releaseCommit,
              workflowCommit: $workflowCommit,
              previousWebImage: $previousWebImage,
              previousWebRevision: $previousWebRevision,
              webImage: $webImage,
              webDigest: $webDigest,
              activeWebRevision: $activeWebRevision,
              activeWebImage: $activeWebImage,
              activeDigestVerified: ($activeWebImage == $webImage),
              revisionMode: "single",
              servedAssets: {
                recursivelyDiscovered: true,
                javascriptCount: $jsAssets,
                stylesheetCount: $cssAssets,
                combinedJavascriptSha256: $jsSha256,
                combinedStylesheetSha256: $cssSha256
              },
              labels: {"001": "Timesheet", "002": "Approval Inbox"},
              labelSource: "module-registry",
              permissionScope: "dynamic-rbac-fail-closed",
              runId: $runId,
              runAttempt: $runAttempt
            }' > evidence/pr478-more-menu-names-test-deployment.json

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr478-more-menu-names-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          retention-days: 30

      - name: Roll back web only when the candidate digest is active
        if: ${{ failure() && steps.deploy_web.outputs.started == 'true' }}
        shell: bash
        run: |
          set +e
          ROLLBACK_FAILED=0
          ROLLED_BACK=false
          mapfile -t ACTIVE_ROWS < <(az containerapp revision list \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query '[?properties.active].[name,properties.template.containers[0].image]' \
            -o tsv 2>/dev/null)

          if (( ${#ACTIVE_ROWS[@]} == 1 )); then
            IFS=$'\t' read -r ACTIVE_REVISION ACTIVE_IMAGE <<< "${ACTIVE_ROWS[0]}"
            if [[ "$ACTIVE_IMAGE" == '${{ steps.build.outputs.web_image }}' ]]; then
              az containerapp update \
                -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
                -n '${{ vars.AZURE_WEB_APP }}' \
                --image '${{ steps.before.outputs.old_web_image }}' \
                --revision-suffix "u478wrb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                --output none \
                --only-show-errors || ROLLBACK_FAILED=1
              ROLLED_BACK=true
            else
              echo 'PR478_WEB_ROLLBACK=SKIPPED candidate_not_active'
            fi
          else
            echo 'PR478_WEB_ROLLBACK=SKIPPED active_revision_set_changed'
          fi

          if [[ "$ROLLED_BACK" == true ]]; then
            BASE='${{ vars.PUBLIC_URL }}'
            BASE="${BASE%/}"
            ROLLBACK_READY=false
            for attempt in $(seq 1 36); do
              mapfile -t ACTIVE_ROWS < <(az containerapp revision list \
                -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
                -n '${{ vars.AZURE_WEB_APP }}' \
                --query '[?properties.active].[name,properties.template.containers[0].image]' \
                -o tsv 2>/dev/null)
              STATUS="$(curl -sSL -o /dev/null -w '%{http_code}' \
                "$BASE/?rollback_check=pr478-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" || true)"
              if (( ${#ACTIVE_ROWS[@]} == 1 )); then
                IFS=$'\t' read -r ROLLBACK_REVISION ROLLBACK_IMAGE <<< "${ACTIVE_ROWS[0]}"
                if [[ "$ROLLBACK_IMAGE" == '${{ steps.before.outputs.old_web_image }}' && "$STATUS" == 200 ]]; then
                  ROLLBACK_READY=true
                  break
                fi
              fi
              sleep 10
            done
            [[ "$ROLLBACK_READY" == true ]] || ROLLBACK_FAILED=1
          fi
          echo "PR478_WEB_ROLLBACK=COMPLETE attempted=$ROLLED_BACK verified=$((1 - ROLLBACK_FAILED))"
          exit "$ROLLBACK_FAILED"

      - name: Publish release summary
        if: always()
        shell: bash
        run: |
          {
            echo '## PR #478 More menu application-name Test release'
            echo
            echo "- Exact application SHA: $RELEASE_SHA"
            echo '- Scope: Web only'
            echo '- Environment: Test only'
            echo '- Module 001 label: Timesheet'
            echo '- Module 002 label: Approval Inbox'
            echo '- Label source: Module registry'
            echo '- Permission filtering: Dynamic RBAC, fail closed'
            echo '- API changed: No'
            echo '- Database or migrations changed: No'
            echo '- Production changed: No'
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
