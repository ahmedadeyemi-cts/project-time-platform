name: ProjectPulse Deploy Complete Friendly Error Coverage Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified complete friendly error coverage commit
        required: true
        default: 320f6489be8ce900d4fba29d9d7728a258b638d3
        type: string
      confirmation:
        description: Enter DEPLOY-COMPLETE-FRIENDLY-ERROR-COVERAGE-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-complete-friendly-error-coverage-test
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Guarded complete friendly error coverage web-only test deployment
    environment: test
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_COMMIT: 320f6489be8ce900d4fba29d9d7728a258b638d3
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact complete friendly error coverage release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and complete friendly error coverage release
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ github.ref }}' == 'refs/heads/main' ]] || { echo 'Dispatch this workflow from main.' >&2; exit 1; }
          [[ '${{ inputs.confirmation }}' == 'DEPLOY-COMPLETE-FRIENDLY-ERROR-COVERAGE-TO-TEST' ]] || { echo 'Confirmation text does not match.' >&2; exit 1; }
          [[ '${{ inputs.release_commit }}' =~ ^[0-9a-f]{40}$ ]] || { echo 'release_commit must be a complete SHA.' >&2; exit 1; }

          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == '${{ github.sha }}' ]]
          [[ "$TARGET_COMMIT" == '${{ inputs.release_commit }}' ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || { echo 'Only the verified complete friendly error coverage release may deploy.' >&2; exit 1; }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || { echo 'Complete friendly error coverage release is not an ancestor of deployment controls.' >&2; exit 1; }

          PRESENTATION='release/src/frontend/project-time-web/src/api-error-presentation.js'
          STYLES='release/src/frontend/project-time-web/src/friendly-api-errors.css'
          VALIDATOR='release/src/frontend/project-time-web/scripts/validate-friendly-api-errors.mjs'
          PROJECT_CLOSEOUT='release/src/frontend/project-time-web/src/ProjectCloseoutCenter.jsx'
          CLOSEOUT_EMAIL='release/src/frontend/project-time-web/src/CloseoutEmailAutomationCenter.jsx'
          test -f "$PRESENTATION" -a -f "$STYLES" -a -f "$VALIDATOR" -a -f "$PROJECT_CLOSEOUT" -a -f "$CLOSEOUT_EMAIL"

          grep -Fq 'RAW_API_FAILURE_PATTERN' "$PRESENTATION"
          grep -Fq 'document.createTreeWalker' "$PRESENTATION"
          grep -Fq 'NodeFilter.SHOW_TEXT' "$PRESENTATION"
          grep -Fq 'nested user-interface error detail' "$PRESENTATION"
          grep -Fq 'installNativeDialogGuards' "$PRESENTATION"
          grep -Fq 'window.alert = (message)' "$PRESENTATION"
          grep -Fq 'window.confirm = (message)' "$PRESENTATION"
          grep -Fq 'ERROR_ATTRIBUTE_NAMES' "$PRESENTATION"
          grep -Fq 'sanitizeTechnicalAttributes' "$PRESENTATION"
          grep -Fq 'attributeFilter: ERROR_ATTRIBUTE_NAMES' "$PRESENTATION"
          grep -Fq 'This information is temporarily unavailable while access is being verified. The rest of the page is still available.' "$PRESENTATION"
          grep -Fq '.projectpulse-friendly-error.compact' "$STYLES"
          grep -Fq '.projectpulse-friendly-error.compact::marker' "$STYLES"
          grep -Fq 'Some closeout data sources were unavailable.' "$PROJECT_CLOSEOUT"
          grep -Fq '<li key={warning}>{warning}</li>' "$PROJECT_CLOSEOUT"
          grep -Fq 'loadWarnings:' "$CLOSEOUT_EMAIL"
          node "$VALIDATOR"
          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current web image
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          [[ -n "$RAW_WEB" && "${WEB_MODE,,}" == single ]]

          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) return 1 ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          echo "old_web_image=$(resolve_digest "$RAW_WEB")" >> "$GITHUB_OUTPUT"

      - name: Build immutable complete friendly error coverage web image
        id: build
        working-directory: release
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA='${{ steps.release.outputs.target_commit }}'
          REPOSITORY='project-health-dashboard-web'
          DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$REPOSITORY:friendly-error-coverage-$SHA" deployment/containers/web/Dockerfile .)"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy complete friendly error coverage web image only
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' --revision-suffix "faecov-${GITHUB_RUN_ID}" --output none

      - name: Validate served complete friendly error coverage and active image
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"; READY=false
          for attempt in $(seq 1 30); do
            BUSTER="faecov-${GITHUB_RUN_ID}-${attempt}"
            STATUS="$(curl -sSL -H 'Cache-Control: no-cache' -o /tmp/index.html -w '%{http_code}' "$BASE/?release_check=$BUSTER" || true)"
            JS="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/index.html | head -1)"
            if [[ "$STATUS" == 200 && -n "$JS" ]]; then
              case "$JS" in http*) JS_URL="$JS";; /*) JS_URL="$BASE$JS";; *) JS_URL="$BASE/$JS";; esac
              curl -sSL -H 'Cache-Control: no-cache' -o /tmp/app.js "$JS_URL?release_check=$BUSTER" || true
              : > /tmp/app.css
              while IFS= read -r CSS; do
                [[ -n "$CSS" ]] || continue
                case "$CSS" in http*) CSS_URL="$CSS";; /*) CSS_URL="$BASE$CSS";; *) CSS_URL="$BASE/$CSS";; esac
                curl -sSL -H 'Cache-Control: no-cache' "$CSS_URL?release_check=$BUSTER" >> /tmp/app.css || true
              done < <(grep -oE 'href="[^"]+\.css"' /tmp/index.html | sed -E 's/^href="|"$//g')

              if grep -Fq 'createTreeWalker' /tmp/app.js \
                && grep -Fq 'nested user-interface error detail' /tmp/app.js \
                && grep -Fq 'FriendlyNativeDialogGuards' /tmp/app.js \
                && grep -Fq 'sanitizeTechnicalAttributes' /tmp/app.js \
                && grep -Fq 'temporarily unavailable while access is being verified' /tmp/app.js \
                && grep -Fq 'projectpulse-friendly-error' /tmp/app.js \
                && grep -Fq 'projectpulse-friendly-error.compact' /tmp/app.css; then
                READY=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$READY" == true ]] || { echo 'Complete friendly error coverage interface was not served.' >&2; exit 1; }

          ACTIVE_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_WEB" == '${{ steps.build.outputs.web_image }}' ]]

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/complete-friendly-error-coverage-test.json <<JSON
          {"environment":"test","releaseCommit":"${{ steps.release.outputs.target_commit }}","workflowCommit":"${{ github.sha }}","runId":"${{ github.run_id }}","webImage":"${{ steps.build.outputs.web_image }}","previousWebImage":"${{ steps.before.outputs.old_web_image }}","nestedErrors":"covered","nativeDialogs":"covered","technicalAttributes":"covered","legacySurfaceInventory":"enforced","apiDeployment":"unchanged","diagnosticEndpoint":"unchanged","migration":"unchanged","database":"unchanged","permissions":"unchanged","moduleStates":"unchanged"}
          JSON

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: complete-friendly-error-coverage-test-${{ github.run_id }}
          path: evidence/complete-friendly-error-coverage-test.json
          retention-days: 30

      - name: Roll back web image on failure
        if: ${{ failure() && steps.deploy_web.outputs.started == 'true' }}
        shell: bash
        run: |
          set +e
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.before.outputs.old_web_image }}' --revision-suffix "faecov-rb-${GITHUB_RUN_ID}" --output none
