name: Temporary Finalize Approval P1 Hardening

on:
  push:
    branches:
      - fix/approval-workflow-intuitive-hardening-20260730
    paths:
      - .github/workflows/temp-finalize-approval-p1-hardening.yml

permissions:
  contents: write

concurrency:
  group: temporary-finalize-approval-p1-hardening
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor == 'ahmedadeyemi-cts'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/approval-workflow-intuitive-hardening-20260730
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Guard exact branch and clean source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git branch --show-current)" == "fix/approval-workflow-intuitive-hardening-20260730" ]]
          [[ -z "$(git status --porcelain)" ]]
          git diff --check origin/main...HEAD

      - name: Apply reviewed P1 corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          hardening_path = root / 'src/backend/ProjectTime.Api/Modules/ProductionApprovalWorkflowHardening.cs'
          hardening = hardening_path.read_text(encoding='utf-8')
          hardening = replace_once(
              hardening,
              '            var path = context.Request.Path.Value ?? string.Empty;\n',
              '            var path = NormalizeRequestPath(context.Request.Path.Value);\n',
              'normalize request path call')
          hardening = replace_once(
              hardening,
              '    public static WebApplication UseProductionApprovalWorkflowHardening(\n',
              '''    private static readonly HashSet<string> RetiredWorkflowApprovalActions =\n        new(StringComparer.OrdinalIgnoreCase)\n        {\n            "pm_approve",\n            "accounting_ready"\n        };\n\n    public static WebApplication UseProductionApprovalWorkflowHardening(\n''',
              'retired workflow action set')
          hardening = hardening.replace(
              'IsLegacyProjectManagerApprovalAsync(context)',
              'IsRetiredLegacyApprovalActionAsync(context)')
          hardening = hardening.replace(
              'private static async Task<bool> IsLegacyProjectManagerApprovalAsync(',
              'private static async Task<bool> IsRetiredLegacyApprovalActionAsync(')
          hardening = replace_once(
              hardening,
              '''            return string.Equals(\n                action.GetString()?.Trim(),\n                "pm_approve",\n                StringComparison.OrdinalIgnoreCase);''',
              '''            return RetiredWorkflowApprovalActions.Contains(\n                action.GetString()?.Trim() ?? string.Empty);''',
              'retire all legacy approval actions')
          hardening = replace_once(
              hardening,
              '    private static void SetApprovalHeaders(HttpContext context)\n',
              '''    private static string NormalizeRequestPath(string? value)\n    {\n        var path = string.IsNullOrWhiteSpace(value) ? "/" : value.Trim();\n        while (path.Length > 1 && path.EndsWith('/'))\n        {\n            path = path[..^1];\n        }\n        return path;\n    }\n\n    private static void SetApprovalHeaders(HttpContext context)\n''',
              'path normalization helper')
          hardening_path.write_text(hardening, encoding='utf-8')

          module_path = root / 'src/backend/ProjectTime.Api/Modules/ProductionApprovalWorkModule.cs'
          module = module_path.read_text(encoding='utf-8')

          project_manager_history = re.compile(
              r"\n[ \t]+AND NOT EXISTS \(\n"
              r"[ \t]+SELECT 1\n"
              r"[ \t]+FROM approval_records approval\n"
              r"[ \t]+WHERE approval\.time_entry_id = entry\.time_entry_id\n"
              r"[ \t]+AND approval\.approval_stage = 'project_manager'\n"
              r"[ \t]+AND approval\.approval_status = 'approved'\n"
              r"[ \t]+\)")
          module, count = project_manager_history.subn('', module)
          if count != 3:
              raise SystemExit(f'current-cycle PM history filters: expected 3 matches, found {count}')

          project_manager_insert_history = re.compile(
              r"\n[ \t]+AND NOT EXISTS \(\n"
              r"[ \t]+SELECT 1\n"
              r"[ \t]+FROM approval_records existing\n"
              r"[ \t]+WHERE existing\.time_entry_id = entry\.time_entry_id\n"
              r"[ \t]+AND existing\.approval_stage = 'project_manager'\n"
              r"[ \t]+AND existing\.approval_status = 'approved'\n"
              r"[ \t]+\)")
          module, count = project_manager_insert_history.subn('', module)
          if count != 1:
              raise SystemExit(f'current-cycle PM insert history filter: expected 1 match, found {count}')

          generic_stage_history = re.compile(
              r"\n[ \t]+AND NOT EXISTS \(\n"
              r"[ \t]+SELECT 1\n"
              r"[ \t]+FROM approval_records existing\n"
              r"[ \t]+WHERE existing\.time_entry_id = entry\.time_entry_id\n"
              r"[ \t]+AND existing\.approval_stage = @approval_stage\n"
              r"[ \t]+AND existing\.approval_status = 'approved'\n"
              r"[ \t]+\)")
          module, count = generic_stage_history.subn('', module)
          if count != 1:
              raise SystemExit(f'current-cycle generic stage history filter: expected 1 match, found {count}')

          module = replace_once(
              module,
              '''                WHERE entry.timesheet_id = @timesheet_id\n                  AND entry.work_date = @work_date\n                  AND entry.project_id IS NOT NULL\n            );''',
              '''                WHERE entry.timesheet_id = @timesheet_id\n                  AND entry.work_date = @work_date\n                  AND entry.project_id IS NOT NULL\n                  AND entry.status = 'manager_approved'\n            );''',
              'current-cycle outstanding project check')
          module = replace_once(
              module,
              '        var entryIds = new List<Guid>();\n',
              '''        // The current approval cycle is represented by the current entry status.\n        // Immutable approval_records remain history and never suppress corrected, resubmitted work.\n        var entryIds = new List<Guid>();\n''',
              'current-cycle explanatory contract')
          module_path.write_text(module, encoding='utf-8')

          operations_path = root / 'src/frontend/project-time-web/src/ApprovalExportAuditWorkflowCenter.jsx'
          operations = operations_path.read_text(encoding='utf-8')
          operations = replace_once(
              operations,
              '''              const canPmApprove = Boolean(access.canProjectApprove) && item.status === 'manager_approved';\n              const canAccountingReady = Boolean(access.canManageAccounting) && ['pm_approved', 'manager_approved'].includes(item.status);\n              const canReconcile = Boolean(access.canManageAccounting) && ['accounting_ready', 'pm_approved'].includes(item.status);''',
              '''              const canReconcile = Boolean(access.canManageAccounting) && ['accounting_ready', 'pm_approved'].includes(item.status);''',
              'remove legacy approval controls')
          operations = replace_once(
              operations,
              '''              <p className="muted">Role-scoped submitted, manager-approved, PM-approved, accounting-ready, reconciled, and locked days.</p>''',
              '''              <p className="muted">Approval decisions are completed only in Pending approval work. This view remains for reconciliation, locking, export preparation, and audit history.</p>''',
              'authoritative approval guidance')
          operations = replace_once(
              operations,
              '{(canPmApprove || canAccountingReady || canReconcile || canLock) ? (',
              '{(canReconcile || canLock) ? (',
              'workflow action panel condition')
          operations = replace_once(
              operations,
              '''                        {canPmApprove ? <button type="button" className="primary-action" onClick={() => runAction(item, 'pm_approve')}>PM approve</button> : null}\n                        {canAccountingReady ? <button type="button" className="secondary-action" onClick={() => runAction(item, 'accounting_ready')}>Mark accounting-ready</button> : null}\n''',
              '',
              'legacy workflow approval buttons')
          operations_path.write_text(operations, encoding='utf-8')

          validator_path = root / 'src/frontend/project-time-web/scripts/validate-pending-time-workflow.mjs'
          validator = validator_path.read_text(encoding='utf-8')
          validator = replace_once(
              validator,
              "const compositionGate = read('src/frontend/project-time-web/src/module001/PtcTimeStewardGate.jsx');\n",
              "const compositionGate = read('src/frontend/project-time-web/src/module001/PtcTimeStewardGate.jsx');\nconst workflowOperations = read('src/frontend/project-time-web/src/ApprovalExportAuditWorkflowCenter.jsx');\n",
              'workflow operations validator input')
          validator = replace_once(
              validator,
              '    "approval.approval_stage = \'project_manager\'",\n',
              "    'The current approval cycle is represented by the current entry status.',\n",
              'current-cycle validator token')
          validator = replace_once(
              validator,
              "    'pm_approve',\n",
              "    'pm_approve',\n    'accounting_ready',\n    'RetiredWorkflowApprovalActions',\n    'NormalizeRequestPath',\n    \"path.EndsWith('/')\",\n",
              'legacy action and slash validator tokens')
          validator = replace_once(
              validator,
              "  rejectText(productionBackend, 'INSERT INTO project_tasks', 'Non-project activity backend');\n",
              """  rejectText(productionBackend, 'INSERT INTO project_tasks', 'Non-project activity backend');\n  rejectText(productionBackend, \"approval.approval_stage = 'project_manager'\", 'Historical PM approval gating');\n  rejectText(productionBackend, \"existing.approval_stage = 'project_manager'\", 'Historical PM approval gating');\n  rejectText(productionBackend, 'existing.approval_stage = @approval_stage', 'Historical stage approval gating');\n\n  requireText(workflowOperations, 'Approval decisions are completed only in Pending approval work.', 'Post-approval operations workspace');\n  requireText(workflowOperations, \"runAction(item, 'reconcile')\", 'Post-approval operations workspace');\n  requireText(workflowOperations, \"runAction(item, 'lock')\", 'Post-approval operations workspace');\n  rejectText(workflowOperations, \"runAction(item, 'pm_approve')\", 'Post-approval operations workspace');\n  rejectText(workflowOperations, \"runAction(item, 'accounting_ready')\", 'Post-approval operations workspace');\n""",
              'post-approval workflow validation')
          validator = replace_once(
              validator,
              "console.log('LEGACY_APPROVAL_WRITES_RETIRED=PASS');\n",
              """console.log('LEGACY_APPROVAL_WRITES_RETIRED=PASS');\nconsole.log('LEGACY_ACCOUNTING_READY_RETIRED=PASS');\nconsole.log('TRAILING_SLASH_APPROVAL_GUARDS=PASS');\nconsole.log('CURRENT_SUBMISSION_CYCLE_APPROVALS=PASS');\n""",
              'new validation evidence')
          validator_path.write_text(validator, encoding='utf-8')
          PY

          git diff --check
          git diff --stat

      - name: Rebuild and validate corrected source
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          pushd src/frontend/project-time-web >/dev/null
          npm ci --no-audit --no-fund
          node ./scripts/validate-pending-time-workflow.mjs
          node ./scripts/validate-module-001-ptc-time-steward.mjs
          node ./scripts/validate-module-001-ptc-timer-dom-ownership.mjs
          node ./scripts/validate-runtime-role-policy-ptc-data.mjs
          node ./scripts/validate-role-permission-timesheet-stabilization.mjs
          npm run build
          popd >/dev/null

      - name: Commit corrected source and remove temporary runner
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/temp-finalize-approval-p1-hardening.yml
          git add -A
          git diff --cached --check
          git config user.name 'ahmedadeyemi-cts'
          git config user.email '244059331+ahmedadeyemi-cts@users.noreply.github.com'
          git commit -m 'Close approval bypasses and scope approvals to current cycle'
          git push origin HEAD:fix/approval-workflow-intuitive-hardening-20260730
