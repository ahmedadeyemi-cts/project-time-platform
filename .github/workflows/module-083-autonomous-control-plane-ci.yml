name: Validate Module 083 Autonomous Control Plane

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/module-083-autonomous-control-plane-ci.yml'
      - 'src/backend/ProjectTime.Api/Modules/FullFutureLoopAutomationFoundation.cs'
      - 'src/backend/ProjectTime.Api/Modules/FullFutureLoopAutomationModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/ReleaseDeploymentControlModule.cs'
      - 'src/frontend/project-time-web/src/FullFutureLoopCenter.jsx'
      - 'src/frontend/project-time-web/src/FullFutureLoopAutomationCenter.jsx'
      - 'src/frontend/project-time-web/src/full-future-loop-automation-center.css'
      - 'src/frontend/project-time-web/scripts/validate-module-083-autonomous-control-plane.mjs'
      - 'src/frontend/project-time-web/scripts/validate-module-083-autonomous-orchestration.mjs'
      - 'tests/FullFutureLoopAutomationPolicyTests/**'
      - 'tests/test-module-083-autonomous-control-plane-migration-083.sh'
      - 'schemas/full-future-loop/**'
      - 'config/full-future-loop/**'
      - 'database/migrations/083_module_083_autonomous_control_plane.sql'
      - 'database/rollback/083_module_083_autonomous_control_plane_rollback.sql'
      - 'docs/modules/module-083-full-future-loop/AUTONOMOUS-CONTROL-PLANE.md'
      - 'docs/modules/module-083-full-future-loop/AUTONOMOUS-ORCHESTRATION.md'
  push:
    branches:
      - feature/module-083-autonomous-control-plane-20260809
    paths:
      - '.github/workflows/module-083-autonomous-control-plane-ci.yml'
      - 'src/backend/ProjectTime.Api/Modules/FullFutureLoopAutomationFoundation.cs'
      - 'src/backend/ProjectTime.Api/Modules/FullFutureLoopAutomationModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/ReleaseDeploymentControlModule.cs'
      - 'src/frontend/project-time-web/src/FullFutureLoopCenter.jsx'
      - 'src/frontend/project-time-web/src/FullFutureLoopAutomationCenter.jsx'
      - 'src/frontend/project-time-web/src/full-future-loop-automation-center.css'
      - 'src/frontend/project-time-web/scripts/validate-module-083-autonomous-control-plane.mjs'
      - 'src/frontend/project-time-web/scripts/validate-module-083-autonomous-orchestration.mjs'
      - 'tests/FullFutureLoopAutomationPolicyTests/**'
      - 'tests/test-module-083-autonomous-control-plane-migration-083.sh'
      - 'schemas/full-future-loop/**'
      - 'config/full-future-loop/**'
      - 'database/migrations/083_module_083_autonomous_control_plane.sql'
      - 'database/rollback/083_module_083_autonomous_control_plane_rollback.sql'
      - 'docs/modules/module-083-full-future-loop/AUTONOMOUS-CONTROL-PLANE.md'
      - 'docs/modules/module-083-full-future-loop/AUTONOMOUS-ORCHESTRATION.md'

permissions:
  contents: read

concurrency:
  group: module-083-autonomous-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate bounded enterprise autonomy
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Guard source-only and dry-run boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          for required in \
            src/backend/ProjectTime.Api/Modules/FullFutureLoopAutomationFoundation.cs \
            src/backend/ProjectTime.Api/Modules/FullFutureLoopAutomationModule.cs \
            src/backend/ProjectTime.Api/Modules/ReleaseDeploymentControlModule.cs \
            src/frontend/project-time-web/src/FullFutureLoopCenter.jsx \
            src/frontend/project-time-web/src/FullFutureLoopAutomationCenter.jsx \
            src/frontend/project-time-web/src/full-future-loop-automation-center.css \
            src/frontend/project-time-web/scripts/validate-module-083-autonomous-control-plane.mjs \
            src/frontend/project-time-web/scripts/validate-module-083-autonomous-orchestration.mjs \
            tests/FullFutureLoopAutomationPolicyTests/FullFutureLoopAutomationPolicyTests.csproj \
            tests/FullFutureLoopAutomationPolicyTests/Program.cs \
            tests/test-module-083-autonomous-control-plane-migration-083.sh \
            schemas/full-future-loop/automation-policy.schema.json \
            schemas/full-future-loop/release-manifest.schema.json \
            config/full-future-loop/automation-policy.example.json \
            database/migrations/083_module_083_autonomous_control_plane.sql \
            database/rollback/083_module_083_autonomous_control_plane_rollback.sql \
            docs/modules/module-083-full-future-loop/AUTONOMOUS-CONTROL-PLANE.md \
            docs/modules/module-083-full-future-loop/AUTONOMOUS-ORCHESTRATION.md; do
            test -f "$required"
          done

          bash -n tests/test-module-083-autonomous-control-plane-migration-083.sh
          DEPLOYMENT_MUTATION_PATTERN='azure/login@|az[[:space:]]+containerapp (update|create|delete)|kubectl (apply|delete)|terraform apply|pulumi up'
          ! grep -RInE "$DEPLOYMENT_MUTATION_PATTERN" \
            src/backend/ProjectTime.Api/Modules/FullFutureLoopAutomationFoundation.cs \
            src/backend/ProjectTime.Api/Modules/FullFutureLoopAutomationModule.cs \
            src/frontend/project-time-web/src/FullFutureLoopAutomationCenter.jsx \
            tests/FullFutureLoopAutomationPolicyTests \
            config/full-future-loop \
            schemas/full-future-loop
          ! grep -RInE '(BEGIN (RSA |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]+|github_pat_|Bearer [A-Za-z0-9._-]{20,})' \
            src/backend/ProjectTime.Api/Modules/FullFutureLoopAutomationFoundation.cs \
            src/backend/ProjectTime.Api/Modules/FullFutureLoopAutomationModule.cs \
            src/frontend/project-time-web/src/FullFutureLoopAutomationCenter.jsx \
            tests/FullFutureLoopAutomationPolicyTests \
            tests/test-module-083-autonomous-control-plane-migration-083.sh \
            config/full-future-loop \
            schemas/full-future-loop \
            database/migrations/083_module_083_autonomous_control_plane.sql \
            docs/modules/module-083-full-future-loop/AUTONOMOUS-CONTROL-PLANE.md \
            docs/modules/module-083-full-future-loop/AUTONOMOUS-ORCHESTRATION.md

          grep -Fq 'CHECK (dry_run=TRUE)' database/migrations/083_module_083_autonomous_control_plane.sql
          grep -Fq 'CHECK (dry_run_only=TRUE)' database/migrations/083_module_083_autonomous_control_plane.sql
          grep -Fq "adapter_mode IN ('disabled','dry_run')" database/migrations/083_module_083_autonomous_control_plane.sql
          grep -Fq 'externalExecutionEnabled = false' src/backend/ProjectTime.Api/Modules/FullFutureLoopAutomationModule.cs
          grep -Fq 'External execution: OFF' src/frontend/project-time-web/src/FullFutureLoopAutomationCenter.jsx
          ! grep -Eq '^[[:space:]]*environment:[[:space:]]*(test|production)' .github/workflows/module-083-autonomous-control-plane-ci.yml

          echo 'MODULE_083_AUTONOMY_SOURCE_BOUNDARY=PASSED'
          echo 'EXTERNAL_MUTATIONS=NONE'
          echo 'TARGET_ENVIRONMENT_MIGRATION_EXECUTION=NONE'
          echo 'SECRETS_REQUIRED=NONE'

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-fund

      - name: Validate policy, manifest, architecture, and UI foundation
        shell: bash
        run: |
          set -Eeuo pipefail
          node src/frontend/project-time-web/scripts/validate-module-083-autonomous-control-plane.mjs

      - name: Validate durable orchestration contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node src/frontend/project-time-web/scripts/validate-module-083-autonomous-orchestration.mjs

      - name: Compile and execute deterministic policy tests
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet run \
            --project tests/FullFutureLoopAutomationPolicyTests/FullFutureLoopAutomationPolicyTests.csproj \
            --configuration Release

      - name: Validate migration 083 apply, constraints, guards, and rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/test-module-083-autonomous-control-plane-migration-083.sh

      - name: Compile complete API with autonomous orchestration
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj \
            --configuration Release \
            --no-restore || dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Prove validators do not rewrite tracked source
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          echo 'MODULE_083_AUTONOMOUS_CONTROL_PLANE_ORCHESTRATION=PASSED'
          echo 'MODULE_083_AUTONOMOUS_OPERATOR_INTERFACE=PASSED'
          echo 'MODULE_083_AUTONOMOUS_MIGRATION_083=PASSED'
          echo 'EXTERNAL_EXECUTION_ENABLED=FALSE'