name: Prepare PR1140 admission evidence content
on:
  push:
    branches: ['control/pr1140-admission-evidence-20260922']
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor == 'ahmedadeyemi-cts' && github.ref == 'refs/heads/control/pr1140-admission-evidence-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare two verified content blobs without changing any refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD^)" == 3db2919c8b872cc57303eef87e970f6eb4a29126 ]]
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          from urllib.request import Request,urlopen
          assert os.environ['GITHUB_REPOSITORY']=='ahmedadeyemi-cts/project-time-platform'
          p='.github/workflows/flowhive-psa-release-control-ci.yml'
          old='          node --test "${LAYA_ADMISSION_TEST:-tests/flowhive-psa-admission.test.mjs}"\n'
          new='''          # Preserve the exact executed test source and TAP output so a fixture
                    # failure can be correlated with this checkout, not a stale job log.
                    install -d -m 0700 "$RUNNER_TEMP/admission-source-diagnostics"
                    git rev-parse HEAD > "$RUNNER_TEMP/admission-source-diagnostics/checkout.txt"
                    sha256sum "${LAYA_ADMISSION_TEST:-tests/flowhive-psa-admission.test.mjs}" > "$RUNNER_TEMP/admission-source-diagnostics/test-sha256.txt"
                    cp -- "${LAYA_ADMISSION_TEST:-tests/flowhive-psa-admission.test.mjs}" "$RUNNER_TEMP/admission-source-diagnostics/executed-test.mjs"
                    node --test "${LAYA_ADMISSION_TEST:-tests/flowhive-psa-admission.test.mjs}" 2>&1 | tee "$RUNNER_TEMP/admission-source-diagnostics/result.tap"
          '''
          # Python block indentation is removed by YAML before execution.
          old2='      # LAYA_RELEASE_BEGIN fixture_cleanup\n'
          expression=lambda name: '$'+'{{ '+name+' }}'
          new2='''      - name: Retain exact admission source and failure diagnostics
                  if: failure()
                  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
                  with:
                    name: admission-source-diagnostics-EXPR_RUN-EXPR_ATTEMPT
                    path: EXPR_TEMP/admission-source-diagnostics
                    if-no-files-found: ignore
                    retention-days: 1
          '''.replace('EXPR_RUN',expression('github.run_id')).replace('EXPR_ATTEMPT',expression('github.run_attempt')).replace('EXPR_TEMP',expression('runner.temp'))+old2
          original=Path(p).read_text()
          assert hashlib.sha256(original.encode()).hexdigest()=='c66a738214105c49e6ffa3a7dc46a250acad35bfef2b769be4c6cc0ab97aeb21'
          assert original.count(old)==original.count(old2)==1
          output=original.replace(old,new).replace(old2,new2)
          assert hashlib.sha256(output.encode()).hexdigest()=='62d0bec002138d6c627e5c70310f74f198240e2c73a5a5ff1b9b386a83c55ed7'
          scope='tests/service-scope/release_scope.py'
          prior=Path(scope).read_text()
          assert hashlib.sha256(prior.encode()).hexdigest()=='258d04fd567678d1203cd168f7d143a8d26160bdcbd5a9ae512ecace87045088'
          anchor='\n\ndef git(*args):'
          addition='\n# Read-only failure evidence only; existing tests and their exit status are unchanged.\nREGISTRATIONS.extend('+repr([[p,old,new],[p,old2,new2]])+')\n'
          assert prior.count(anchor)==1
          revised=prior.replace(anchor,addition+anchor)
          assert hashlib.sha256(revised.encode()).hexdigest()=='f4e463937a8555f403d6beabc0627ed90a85b5ea3d429bf1690d2c24f9bba0f2'
          entries=[]
          for path,content in ((p,output),(scope,revised)):
            blob=subprocess.check_output(['git','hash-object','--stdin'],input=content.encode()).decode().strip()
            request=Request('https://api.github.com/repos/ahmedadeyemi-cts/project-time-platform/git/blobs',
              data=json.dumps({'content':content,'encoding':'utf-8'}).encode(),method='POST',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urlopen(request,timeout=30) as response: result=json.load(response)
            assert result['sha']==blob
            entries.append({'path':path,'mode':'100644','type':'blob','sha':blob})
            print('VERIFIED_CONTENT_BLOB',path,blob)
          Path(os.environ['RUNNER_TEMP'],'reviewed-blobs.json').write_text(json.dumps(entries,indent=2)+'\n')
          print('DEPLOYMENT_MUTATION=NONE REF_MUTATION=NONE')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr1140-admission-evidence-blobs-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed-blobs.json
          retention-days: 1
