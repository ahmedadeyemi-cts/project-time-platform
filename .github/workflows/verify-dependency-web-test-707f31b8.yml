name: Verify Dependency Web-Only Test Release 707f31b8

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-dependency-web-test-707f31b8.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: verify-dependency-web-test-707f31b8
  cancel-in-progress: false

jobs:
  verify:
    name: Verify immutable Test web release and unchanged API
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/dependency-web-test-707f31b8-20260801'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_SHA: 707f31b88df173d9543b292a9cc19d6ec01ca6ac
      PRIOR_API_RELEASE_SHA: 4673c185f7fe885dd202dbbd07579182be32d572
      VERIFY_BRANCH: verify/dependency-web-test-707f31b8-20260801
      VERIFY_PATH: .github/workflows/verify-dependency-web-test-707f31b8.yml

    steps:
      - name: Check out exact verification head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard read-only verification boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_HEAD_REF" == "$VERIFY_BRANCH" ]]
          [[ "$(git rev-parse HEAD)" == '${{ github.event.pull_request.head.sha }}' ]]
          git fetch origin main --no-tags
          BASE_REF="$(git merge-base origin/main HEAD)"
          [[ -n "$BASE_REF" ]]
          [[ "$BASE_REF" == "$(git rev-parse origin/main)" ]]
          CHANGED="$(git diff --name-only "$BASE_REF"...HEAD)"
          printf '%s\n' "$CHANGED"
          [[ "$CHANGED" == "$VERIFY_PATH" ]]
          git diff --check "$BASE_REF"...HEAD
          echo 'PROJECTPULSE_DEPENDENCY_VERIFIER_SOURCE_ISOLATION=PASSED'

      - name: Sign in to Azure using Test OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify immutable ACR and Container App state
        id: state
        shell: bash
        run: |
          set -Eeuo pipefail
          ACR='${{ vars.AZURE_ACR_NAME }}'
          REGISTRY="$ACR.azurecr.io"
          RESOURCE_GROUP='${{ vars.AZURE_RESOURCE_GROUP }}'
          API_APP='${{ vars.AZURE_API_APP }}'
          WEB_APP='${{ vars.AZURE_WEB_APP }}'
          WEB_TAG="dependency-web-$RELEASE_SHA"
          API_TAG="release-$PRIOR_API_RELEASE_SHA"

          resolve_current_image() {
            local image="$1"
            local relative repository digest
            case "$image" in
              "$REGISTRY/"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$REGISTRY/"*:*) ;;
              *) echo "Image is outside the approved ACR: $image" >&2; return 1 ;;
            esac
            relative="${image#"$REGISTRY/"}"
            repository="${relative%:*}"
            digest="$(az acr repository show \
              --name "$ACR" \
              --image "$relative" \
              --query digest -o tsv --only-show-errors)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s/%s@%s\n' "$REGISTRY" "$repository" "$digest"
          }

          READY=0
          for attempt in $(seq 1 120); do
            WEB_DIGEST="$(az acr repository show \
              --name "$ACR" \
              --image "project-health-dashboard-web:$WEB_TAG" \
              --query digest -o tsv --only-show-errors 2>/dev/null || true)"
            API_DIGEST="$(az acr repository show \
              --name "$ACR" \
              --image "project-health-dashboard-api:$API_TAG" \
              --query digest -o tsv --only-show-errors 2>/dev/null || true)"

            RAW_WEB="$(az containerapp show \
              -g "$RESOURCE_GROUP" -n "$WEB_APP" \
              --query 'properties.template.containers[0].image' \
              -o tsv --only-show-errors)"
            RAW_API="$(az containerapp show \
              -g "$RESOURCE_GROUP" -n "$API_APP" \
              --query 'properties.template.containers[0].image' \
              -o tsv --only-show-errors)"
            WEB_SOURCE="$(az containerapp show \
              -g "$RESOURCE_GROUP" -n "$WEB_APP" \
              --query "properties.template.containers[0].env[?name=='PROJECTPULSE_SOURCE_COMMIT'].value | [0]" \
              -o tsv --only-show-errors)"
            API_SOURCE="$(az containerapp show \
              -g "$RESOURCE_GROUP" -n "$API_APP" \
              --query "properties.template.containers[0].env[?name=='PROJECTPULSE_SOURCE_COMMIT'].value | [0]" \
              -o tsv --only-show-errors)"
            WEB_LATEST="$(az containerapp show \
              -g "$RESOURCE_GROUP" -n "$WEB_APP" \
              --query properties.latestRevisionName \
              -o tsv --only-show-errors)"
            WEB_READY_REVISION="$(az containerapp show \
              -g "$RESOURCE_GROUP" -n "$WEB_APP" \
              --query properties.latestReadyRevisionName \
              -o tsv --only-show-errors)"
            API_LATEST="$(az containerapp show \
              -g "$RESOURCE_GROUP" -n "$API_APP" \
              --query properties.latestRevisionName \
              -o tsv --only-show-errors)"
            API_READY_REVISION="$(az containerapp show \
              -g "$RESOURCE_GROUP" -n "$API_APP" \
              --query properties.latestReadyRevisionName \
              -o tsv --only-show-errors)"

            EXPECTED_WEB=''
            EXPECTED_API=''
            CURRENT_API=''
            if [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              EXPECTED_WEB="$REGISTRY/project-health-dashboard-web@$WEB_DIGEST"
            fi
            if [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              EXPECTED_API="$REGISTRY/project-health-dashboard-api@$API_DIGEST"
            fi
            CURRENT_API="$(resolve_current_image "$RAW_API" 2>/dev/null || true)"

            printf 'attempt=%s webTag=%s webImage=%s webSource=%s webReady=%s/%s apiImage=%s apiSource=%s apiReady=%s/%s\n' \
              "$attempt" "${WEB_DIGEST:-missing}" "$RAW_WEB" "${WEB_SOURCE:-missing}" \
              "$WEB_READY_REVISION" "$WEB_LATEST" "${CURRENT_API:-unresolved}" \
              "${API_SOURCE:-missing}" "$API_READY_REVISION" "$API_LATEST"

            if [[ -n "$EXPECTED_WEB" \
               && -n "$EXPECTED_API" \
               && "$RAW_WEB" == "$EXPECTED_WEB" \
               && "$WEB_SOURCE" == "$RELEASE_SHA" \
               && "$WEB_READY_REVISION" == "$WEB_LATEST" \
               && "$CURRENT_API" == "$EXPECTED_API" \
               && "$API_SOURCE" == "$PRIOR_API_RELEASE_SHA" \
               && "$API_READY_REVISION" == "$API_LATEST" ]]; then
              READY=1
              break
            fi
            sleep 10
          done

          if (( READY != 1 )); then
            echo 'The exact dependency web release did not reach the required immutable state.' >&2
            echo "Expected web image: ${EXPECTED_WEB:-unavailable}" >&2
            echo "Current web image: $RAW_WEB" >&2
            echo "Expected web source: $RELEASE_SHA" >&2
            echo "Current web source: ${WEB_SOURCE:-missing}" >&2
            echo "Expected API image: ${EXPECTED_API:-unavailable}" >&2
            echo "Current API image: ${CURRENT_API:-unresolved}" >&2
            echo "Expected API source: $PRIOR_API_RELEASE_SHA" >&2
            echo "Current API source: ${API_SOURCE:-missing}" >&2
            exit 1
          fi

          API_MODE="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" \
            --query properties.configuration.activeRevisionsMode -o tsv --only-show-errors)"
          WEB_MODE="$(az containerapp show -g "$RESOURCE_GROUP" -n "$WEB_APP" \
            --query properties.configuration.activeRevisionsMode -o tsv --only-show-errors)"
          [[ "${API_MODE,,}" == single ]]
          [[ "${WEB_MODE,,}" == single ]]

          echo "web_image=$EXPECTED_WEB" >> "$GITHUB_OUTPUT"
          echo "web_digest=$WEB_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_revision=$WEB_READY_REVISION" >> "$GITHUB_OUTPUT"
          echo "web_source=$WEB_SOURCE" >> "$GITHUB_OUTPUT"
          echo "api_image=$EXPECTED_API" >> "$GITHUB_OUTPUT"
          echo "api_digest=$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "api_revision=$API_READY_REVISION" >> "$GITHUB_OUTPUT"
          echo "api_source=$API_SOURCE" >> "$GITHUB_OUTPUT"
          echo 'PROJECTPULSE_DEPENDENCY_WEB_DIGEST_VERIFIED=YES'
          echo 'PROJECTPULSE_TEST_API_IMAGE_UNCHANGED=YES'
          echo 'PROJECTPULSE_DATABASE_MIGRATIONS_FOR_DEPENDENCY_RELEASE=NONE'

      - name: Validate public API and web responses
        id: public
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'
          BASE="${BASE%/}"
          API_READY=0
          WEB_READY=0
          API_STATUS=''
          WEB_STATUS=''

          for attempt in $(seq 1 36); do
            API_STATUS="$(curl -sS -o /tmp/projectpulse-verifier-api \
              -w '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$BASE/api/health?verify=$RELEASE_SHA&attempt=$attempt" || true)"
            case "$API_STATUS" in 200|401) API_READY=1 ;; esac

            WEB_STATUS="$(curl -sS -o /tmp/projectpulse-verifier-web \
              -w '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$BASE/?verify=$RELEASE_SHA&attempt=$attempt" || true)"
            if [[ "$WEB_STATUS" == 200 ]] \
              && test -s /tmp/projectpulse-verifier-web \
              && grep -qi '<!doctype html' /tmp/projectpulse-verifier-web; then
              WEB_READY=1
            fi

            if (( API_READY == 1 && WEB_READY == 1 )); then
              break
            fi
            sleep 5
          done

          (( API_READY == 1 )) || {
            echo "Public API validation failed with HTTP $API_STATUS" >&2
            cat /tmp/projectpulse-verifier-api >&2 || true
            exit 1
          }
          (( WEB_READY == 1 )) || {
            echo "Public web validation failed with HTTP $WEB_STATUS" >&2
            cat /tmp/projectpulse-verifier-web >&2 || true
            exit 1
          }

          WEB_BODY_SHA256="$(sha256sum /tmp/projectpulse-verifier-web | awk '{print $1}')"
          [[ "$WEB_BODY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "api_status=$API_STATUS" >> "$GITHUB_OUTPUT"
          echo "web_status=$WEB_STATUS" >> "$GITHUB_OUTPUT"
          echo "web_body_sha256=$WEB_BODY_SHA256" >> "$GITHUB_OUTPUT"
          echo 'PROJECTPULSE_DEPENDENCY_API_HEALTH=PASSED'
          echo 'PROJECTPULSE_DEPENDENCY_WEB_RESPONSE=PASSED'

      - name: Create checksummed verification evidence
        shell: bash
        env:
          WEB_IMAGE: ${{ steps.state.outputs.web_image }}
          WEB_DIGEST: ${{ steps.state.outputs.web_digest }}
          WEB_REVISION: ${{ steps.state.outputs.web_revision }}
          WEB_SOURCE: ${{ steps.state.outputs.web_source }}
          API_IMAGE: ${{ steps.state.outputs.api_image }}
          API_DIGEST: ${{ steps.state.outputs.api_digest }}
          API_REVISION: ${{ steps.state.outputs.api_revision }}
          API_SOURCE: ${{ steps.state.outputs.api_source }}
          API_STATUS: ${{ steps.public.outputs.api_status }}
          WEB_STATUS: ${{ steps.public.outputs.web_status }}
          WEB_BODY_SHA256: ${{ steps.public.outputs.web_body_sha256 }}
        run: |
          set -Eeuo pipefail
          mkdir -p verification-evidence
          python3 - <<'PY' > verification-evidence/dependency-web-test-verification.json
          import json
          import os
          from datetime import datetime, timezone

          print(json.dumps({
              'environment': 'test',
              'releaseSha': os.environ['RELEASE_SHA'],
              'sourcePullRequests': [391, 392],
              'deploymentScope': 'web-only',
              'databaseMigrations': [],
              'apiBuilt': False,
              'apiDeployed': False,
              'apiImageUnchanged': True,
              'apiImage': os.environ['API_IMAGE'],
              'apiDigest': os.environ['API_DIGEST'],
              'apiRevision': os.environ['API_REVISION'],
              'apiSourceCommit': os.environ['API_SOURCE'],
              'expectedPriorApiReleaseSha': os.environ['PRIOR_API_RELEASE_SHA'],
              'webImage': os.environ['WEB_IMAGE'],
              'webDigest': os.environ['WEB_DIGEST'],
              'webRevision': os.environ['WEB_REVISION'],
              'webSourceCommit': os.environ['WEB_SOURCE'],
              'apiHttpStatus': int(os.environ['API_STATUS']),
              'webHttpStatus': int(os.environ['WEB_STATUS']),
              'webResponseBodySha256': os.environ['WEB_BODY_SHA256'],
              'verificationWorkflowRunId': os.environ['GITHUB_RUN_ID'],
              'verificationWorkflowRunAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'verifiedAt': datetime.now(timezone.utc).isoformat(),
          }, indent=2, sort_keys=True))
          PY
          sha256sum verification-evidence/dependency-web-test-verification.json \
            > verification-evidence/SHA256SUMS
          sha256sum --check verification-evidence/SHA256SUMS
          echo 'PROJECTPULSE_DEPENDENCY_VERIFICATION_EVIDENCE=CHECKSUMMED'

      - name: Upload immutable verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: projectpulse-dependency-web-test-verification-${{ github.run_id }}
          path: verification-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verification summary
        shell: bash
        run: |
          {
            echo '## ProjectPulse dependency web-only Test verification'
            echo
            echo "- Exact application source: \`$RELEASE_SHA\`"
            echo '- Source PRs: #391 and #392'
            echo '- Web image deployed by immutable ACR digest: passed'
            echo '- Web source-commit marker: passed'
            echo '- Web revision readiness: passed'
            echo '- API immutable image unchanged from prior consolidated release: passed'
            echo '- API source-commit marker unchanged: passed'
            echo '- API image built or deployed by dependency release: no'
            echo '- Database migrations: none'
            echo '- Public API health: passed'
            echo '- Public web response: passed'
            echo '- Checksummed verification evidence: uploaded'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign out of Azure
        if: always()
        shell: bash
        run: az logout || true
