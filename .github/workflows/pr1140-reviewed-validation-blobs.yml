name: Prepare reviewed PR1140 validation blobs
on:
  push:
    branches: ['control/pr1140-validation-blobs-20260922']
permissions:
  contents: write
jobs:
  content-only:
    if: github.actor == 'ahmedadeyemi-cts' && github.ref == 'refs/heads/control/pr1140-validation-blobs-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify fixed source edits and create content-addressed blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD^)" == 5e21e97d24c547ce0bc0c5a4e54ad5e30c267d46 ]]
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess
          from pathlib import Path
          from urllib.request import Request, urlopen
          encoded = ''''''
          # Transfer data only: bounded line edits with exact before/after hashes.
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '423bc6d4a3a9b63907a0313e6aec4ba066ed5751df9bb780fb861918f60cedb8'
          expected = {
              '.github/module025-service-scope-files.txt',
              '.github/workflows/celar-ai-ask-operations-ci.yml',
              '.github/workflows/flowhive-psa-release-control-ci.yml',
              '.github/workflows/module-management-owner-drawer-ci.yml',
              '.github/workflows/module025-service-scope-ci.yml',
              'docs/production-readiness/foundation/initialization-review.json',
              'scripts/ci/validate-celar-ai-enterprise-source-boundary.sh',
              'scripts/release-test/validate-protected-test-controller-branches.sh',
              'tests/flowhive-migration-package.test.py',
              'tests/flowhive-psa-admission.test.mjs',
              'tests/module025-generation-feedback.test.mjs',
              'tests/module064-migration-rollout.test.py',
              'tests/service-scope/release_scope.py',
          }
          assert os.environ['GITHUB_REPOSITORY'] == 'ahmedadeyemi-cts/project-time-platform'
          assert os.environ['GITHUB_EVENT_NAME'] == 'push'
          rows = json.loads(raw)
          assert len(rows) == len(expected) and {row['path'] for row in rows} == expected
          prepared = []
          for row in rows:
              path = Path(row['path'])
              assert not path.is_symlink() and path.resolve().is_relative_to(Path.cwd())
              before = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None) == row['before'], str(path)
              lines = before.decode().splitlines(keepends=True) if before is not None else []
              edits = row['edits']
              assert edits == sorted(edits, key=lambda e:e['start'])
              end = 0
              for edit in edits:
                  assert end <= edit['start'] <= edit['end'] <= len(lines)
                  end = edit['end']
              for edit in reversed(edits):
                  lines[edit['start']:edit['end']] = edit['text'].splitlines(keepends=True)
              content = ''.join(lines).encode()
              assert hashlib.sha256(content).hexdigest() == row['after'], str(path)
              expected_blob = subprocess.check_output(['git','hash-object','--stdin'],input=content).decode().strip()
              prepared.append((row, content, expected_blob))
          entries = []
          for row, content, expected_blob in prepared:
              request = Request('https://api.github.com/repos/ahmedadeyemi-cts/project-time-platform/git/blobs',
                  data=json.dumps({'content':content.decode(),'encoding':'utf-8'}).encode(), method='POST',
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urlopen(request,timeout=30) as response:
                  result=json.load(response)
              assert result['sha'] == expected_blob
              entries.append({'path':row['path'],'mode':row['mode'],'type':'blob','sha':expected_blob})
              print('VERIFIED_CONTENT_BLOB',row['path'],expected_blob)
          Path(os.environ['RUNNER_TEMP'],'pr1140-reviewed-blobs.json').write_text(json.dumps(entries,indent=2)+'\n')
          print('BRANCH_MUTATION=NONE UAT_MUTATION=NONE PRODUCTION_MUTATION=NONE')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr1140-reviewed-blobs-${{ github.run_id }}
          path: ${{ runner.temp }}/pr1140-reviewed-blobs.json
          retention-days: 1
