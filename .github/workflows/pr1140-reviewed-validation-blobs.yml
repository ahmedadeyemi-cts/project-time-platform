name: Prepare reviewed PR1140 validation blobs
on:
  push:
    branches: ['control/pr1140-validation-blobs-20260922']
permissions:
  contents: write
jobs:
  content-only:
    if: github.actor == 'ahmedadeyemi-cts' && github.ref == 'refs/heads/control/pr1140-validation-blobs-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run exact reviewed content transformations without expression substitution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD^)" == bef9628836270f830a9f850255281fb7e485f3e8 ]]
          python3 - <<'PY'
          import subprocess
          # The parent contains the readable, previously reviewed transformations.
          # Reading that immutable Git blob prevents Actions from interpolating
          # expressions that belong to the generated target workflow instead.
          ref = 'bef9628836270f830a9f850255281fb7e485f3e8'
          path = '.github/workflows/pr1140-reviewed-validation-blobs.yml'
          source = subprocess.check_output(['git', 'show', ref + ':' + path])
          digest = subprocess.check_output(['git', 'hash-object', '--stdin'], input=source).decode().strip()
          assert digest == '5bed5603c2eda7a09a2cfbac1e1bdcd7715b71c4'
          start = "          python3 - <<'PY'\n"
          end = "          PY\n"
          text = source.decode()
          assert text.count(start) == 1 and text.count(end) == 1
          body = text.split(start, 1)[1].split(end, 1)[0]
          lines = body.splitlines(keepends=True)
          assert all(not line.strip() or line.startswith('          ') for line in lines)
          program = ''.join(line[10:] if line.startswith('          ') else line for line in lines)
          # That fixed program checks all input/output hashes before creating
          # content-addressed blobs. It cannot merge, deploy, or update refs.
          exec(compile(program, path + '@' + ref, 'exec'), {'__name__': '__main__'})
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr1140-reviewed-blobs-${{ github.run_id }}
          path: ${{ runner.temp }}/pr1140-reviewed-blobs.json
          retention-days: 1
