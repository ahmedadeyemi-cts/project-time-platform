name: Apply FlowHive Enterprise PM Source Package

on:
  push:
    branches: [feature/module-066-flowhive-enterprise-pm-20260813]
    paths:
      - .github/workflows/flowhive-enterprise-source-patcher.yml

permissions:
  contents: write

concurrency:
  group: flowhive-enterprise-source-patcher
  cancel-in-progress: false

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/module-066-flowhive-enterprise-pm-20260813
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Apply deterministic enterprise source patch
        run: python3 scripts/module-066-enterprise/patch-flowhive-enterprise.py

      - name: Validate Migration 086 source contract
        run: bash tests/test-module-066-flowhive-enterprise-pm-migration-086.sh

      - name: Validate complete Module 066 source contract
        run: node src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs

      - name: Build complete API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Build complete frontend
        working-directory: src/frontend/project-time-web
        run: |
          npm ci
          npm run build

      - name: Commit integrated source and remove one-time patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/flowhive-enterprise-source-patcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete FlowHive enterprise project management experience'
          git push origin HEAD:feature/module-066-flowhive-enterprise-pm-20260813
