name: Publish Module 001A Request-Family-Only Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-module001a-request-family-only.yml'

permissions:
  contents: write

concurrency:
  group: publish-module001a-request-family-only-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/module001a-request-family-only-20260818'
    name: Repair, validate, and publish Module 001A scope
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '10.0.x'

      - name: Apply guarded request-family-only repair
        id: repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          backend_path = Path('src/backend/ProjectTime.Api/Modules/Module001AEngineerTaskCloseoutModule.cs')
          validator_path = Path('src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs')
          uat_path = Path('scripts/release-test/run-assigned-work-protected-test-uat.sh')
          marker_path = Path('/tmp/module001a-request-family-repair-changed')

          backend = backend_path.read_text()
          validator = validator_path.read_text()
          uat = uat_path.read_text()

          def block(*lines: str) -> str:
              return '\n'.join(lines)

          def replace_exact(source: str, old: str, new: str, label: str, expected: int = 1) -> str:
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} occurrence(s), found {count}.')
              return source.replace(old, new, expected)

          if 'MODULE001A_REQUEST_FAMILY_ONLY_V3' in backend:
              marker_path.write_text('false')
              raise SystemExit(0)

          constant_anchor = block(
              '    private static readonly HashSet<string> Module001ATerminalProjectStatuses = new(StringComparer.OrdinalIgnoreCase)',
              '    {',
              '        "closed", "complete", "completed", "done", "cancelled", "canceled", "archived"',
              '    };',
              '',
              '    public static WebApplication MapModule001AEngineerTaskCloseoutEndpoints'
          )
          constant_replacement = block(
              '    private static readonly HashSet<string> Module001ATerminalProjectStatuses = new(StringComparer.OrdinalIgnoreCase)',
              '    {',
              '        "closed", "complete", "completed", "done", "cancelled", "canceled", "archived"',
              '    };',
              '',
              '    private const string Module001ARequestFamilyOnlyContract = "MODULE001A_REQUEST_FAMILY_ONLY_V3";',
              '',
              '    public static WebApplication MapModule001AEngineerTaskCloseoutEndpoints'
          )
          backend = replace_exact(backend, constant_anchor, constant_replacement, 'Module 001A contract anchor')

          broad_eligibility = block(
              '              AND (',
              "                    regexp_replace(lower(COALESCE(p.work_type, '')), '[^a-z0-9]+', '', 'g') IN (",
              "                        'servicerequest', 'sr', 'presales', 'presale', 'pres',",
              "                        'internal', 'internalproject', 'internaltask'",
              '                    )',
              "                 OR p.project_code ~* '^(SR|PRES|INT)-'",
              "                 OR lower(COALESCE(NULLIF(to_jsonb(pt)->>'work_task_category', ''), '')) = 'service_request_task'",
              "                 OR NULLIF(to_jsonb(pt)->>'service_request_number', '') IS NOT NULL",
              '              )'
          )
          strict_eligibility = block(
              "              -- Canonical request-family labels remain 'servicerequest', 'presales', and 'internal';",
              '              -- the durable SR-/PRES-/INT- project code is the sole Module 001A eligibility authority.',
              "              AND p.project_code ~* '^(SR|PRES|INT)-'"
          )
          backend = replace_exact(
              backend,
              broad_eligibility,
              strict_eligibility,
              'Broad Module 001A eligibility block',
              expected=2
          )

          backend = replace_exact(
              backend,
              block(
                  '            FROM module001a_engineer_task_closeout_events event',
                  '            LEFT JOIN app_users actor ON actor.user_id = event.actor_user_id'
              ),
              block(
                  '            FROM module001a_engineer_task_closeout_events event',
                  '            JOIN projects request_project ON request_project.project_id = event.project_id',
                  '            LEFT JOIN app_users actor ON actor.user_id = event.actor_user_id'
              ),
              'Module 001A event source anchor'
          )
          backend = replace_exact(
              backend,
              block(
                  '            WHERE event.engineer_user_id = @engineer_user_id',
                  '            ORDER BY event.occurred_at DESC'
              ),
              block(
                  '            WHERE event.engineer_user_id = @engineer_user_id',
                  "              AND request_project.project_code ~* '^(SR|PRES|INT)-'",
                  '            ORDER BY event.occurred_at DESC'
              ),
              'Module 001A event filter anchor'
          )

          backend = replace_exact(
              backend,
              block(
                  '            status = "engineer_task_closeout_loaded",',
                  '            generatedAt = DateTimeOffset.UtcNow,'
              ),
              block(
                  '            status = "engineer_task_closeout_loaded",',
                  '            eligibilityContract = Module001ARequestFamilyOnlyContract,',
                  '            generatedAt = DateTimeOffset.UtcNow,'
              ),
              'Module 001A response contract anchor'
          )
          backend = replace_exact(
              backend,
              block(
                  '                eligibleWorkTypes = new[] { "Service Request", "Pre-Sales", "Internal" },',
                  '                closeEffect = "The assignment is removed from Module 001 and new or increased time is blocked.",'
              ),
              block(
                  '                eligibleWorkTypes = new[] { "Service Request", "Pre-Sales", "Internal" },',
                  '                identifierAuthority = "durable_project_code_prefix",',
                  '                eligibleIdentifiers = new[] { "SR-", "PRES-", "INT-" },',
                  '                projectTasksExcluded = true,',
                  '                closeEffect = "The assignment is removed from Module 001 and new or increased time is blocked.",'
              ),
              'Module 001A workflow contract anchor'
          )

          backend = replace_exact(
              backend,
              block(
                  '    private static string Module001ARequestType(string projectCode, string workType)',
                  '    {',
                  '        var code = (projectCode ?? string.Empty).Trim().ToUpperInvariant();',
                  '        var normalized = new string((workType ?? string.Empty).Where(char.IsLetterOrDigit).ToArray()).ToLowerInvariant();',
                  '        if (code.StartsWith("SR-", StringComparison.Ordinal) || normalized is "servicerequest" or "sr") return "Service Request";',
                  '        if (code.StartsWith("PRES-", StringComparison.Ordinal) || normalized is "presales" or "presale" or "pres") return "Pre-Sales";',
                  '        return "Internal";',
                  '    }'
              ),
              block(
                  '    private static string Module001ARequestType(string projectCode, string workType)',
                  '    {',
                  '        _ = workType;',
                  '        var code = (projectCode ?? string.Empty).Trim().ToUpperInvariant();',
                  '        if (code.StartsWith("SR-", StringComparison.Ordinal)) return "Service Request";',
                  '        if (code.StartsWith("PRES-", StringComparison.Ordinal)) return "Pre-Sales";',
                  '        if (code.StartsWith("INT-", StringComparison.Ordinal)) return "Internal";',
                  '        return "Unsupported";',
                  '    }'
              ),
              'Module 001A request-type classifier'
          )

          validator_anchor = block(
              "requireText(closeout, 'pa.effective_start_date DESC', 'Module 001A recent assignment ordering');",
              'requireText(closeout, "CASE WHEN p.project_code ~* \'^(SR|PRES|INT)-\' THEN p.project_code ELSE \'\' END", \'Module 001A durable request reference\');',
              '',
              "const workspace = read('src/backend/ProjectTime.Api/Modules/ProjectWorkspaceModule019Repair.cs');"
          )
          validator_replacement = block(
              "requireText(closeout, 'pa.effective_start_date DESC', 'Module 001A recent assignment ordering');",
              'requireText(closeout, "CASE WHEN p.project_code ~* \'^(SR|PRES|INT)-\' THEN p.project_code ELSE \'\' END", \'Module 001A durable request reference\');',
              "requireText(closeout, 'MODULE001A_REQUEST_FAMILY_ONLY_V3', 'Module 001A strict request-family contract');",
              "requireText(closeout, 'identifierAuthority = \"durable_project_code_prefix\"', 'Module 001A durable identifier authority');",
              "requireText(closeout, 'projectTasksExcluded = true', 'Module 001A project-task exclusion contract');",
              "requireText(closeout, 'JOIN projects request_project ON request_project.project_id = event.project_id', 'Module 001A request-only event history');",
              'requireText(closeout, "AND request_project.project_code ~* \'^(SR|PRES|INT)-\'", \'Module 001A request-only event filter\');',
              "requireText(closeout, 'return \"Unsupported\";', 'Module 001A fail-closed request classification');",
              'const strictEligibilityOccurrences = closeout.split("AND p.project_code ~* \'^(SR|PRES|INT)-\'").length - 1;',
              'if (strictEligibilityOccurrences !== 2) {',
              '  failures.push(`Module 001A request-family eligibility: expected 2 strict project-code filters, found ${strictEligibilityOccurrences}`);',
              '}',
              '[',
              '  "regexp_replace(lower(COALESCE(p.work_type, \'\')), \'[^a-z0-9]+\', \'\', \'g\') IN (",',
              '  "OR lower(COALESCE(NULLIF(to_jsonb(pt)->>\'work_task_category\', \'\'), \'\')) = \'service_request_task\'",',
              '  "OR NULLIF(to_jsonb(pt)->>\'service_request_number\', \'\') IS NOT NULL"',
              '].forEach((legacyEligibility) => rejectText(',
              '  closeout,',
              '  legacyEligibility,',
              "  'Module 001A must not admit project tasks through work-type or task metadata fallbacks'",
              '));',
              '',
              "const workspace = read('src/backend/ProjectTime.Api/Modules/ProjectWorkspaceModule019Repair.cs');"
          )
          validator = replace_exact(
              validator,
              validator_anchor,
              validator_replacement,
              'Focused Module 001A validator anchor'
          )
          validator = replace_exact(
              validator,
              "console.log('module001a_route_reachability=standalone_mount_before_legacy_exclusion');",
              block(
                  "console.log('module001a_route_reachability=standalone_mount_before_legacy_exclusion');",
                  "console.log('module001a_eligibility=request_family_codes_only');"
              ),
              'Focused Module 001A validator result marker'
          )

          uat = replace_exact(
              uat,
              block(
                  '    .module == "001A"',
                  '    and .status == "engineer_task_closeout_loaded"',
                  '    and .access.effectiveUserId == $userId',
                  '    and ([.active[]?, .history[]? | select(',
                  '      .projectCode == $sr',
                  '      and .engineerUserId == $userId',
                  '      and .requestType == "Service Request"',
                  '      and .serviceRequestNumber == $sr',
                  '      and .canClose == true',
                  '    )] | length) >= 1'
              ),
              block(
                  '    .module == "001A"',
                  '    and .status == "engineer_task_closeout_loaded"',
                  '    and .eligibilityContract == "MODULE001A_REQUEST_FAMILY_ONLY_V3"',
                  '    and .workflow.identifierAuthority == "durable_project_code_prefix"',
                  '    and .workflow.projectTasksExcluded == true',
                  '    and .access.effectiveUserId == $userId',
                  '    and ([.active[]?, .history[]?',
                  '      | select((((.projectCode // "") | test("^(SR|PRES|INT)-"; "i")) | not))',
                  '    ] | length) == 0',
                  '    and ([.active[]?, .history[]? | select(',
                  '      .projectCode == $sr',
                  '      and .engineerUserId == $userId',
                  '      and .requestType == "Service Request"',
                  '      and .serviceRequestNumber == $sr',
                  '      and .canClose == true',
                  '    )] | length) >= 1'
              ),
              'Protected-Test Module 001A request-family assertion'
          )
          uat = replace_exact(
              uat,
              block(
                  '    module001aEngineerCloseout:true,',
                  '    module001aVisibleRequestReference:true,',
                  '    module019EngineeringWorkspace:true,'
              ),
              block(
                  '    module001aEngineerCloseout:true,',
                  '    module001aVisibleRequestReference:true,',
                  '    module001aRequestFamilyOnly:true,',
                  '    module001aProjectTasksExcluded:true,',
                  '    module019EngineeringWorkspace:true,'
              ),
              'Protected-Test UAT evidence contract'
          )
          uat = replace_exact(
              uat,
              'requestFamilies:["Service Request","Presales","Internal"]',
              'requestFamilies:["Service Request","Pre-Sales","Internal"]',
              'Protected-Test request-family labels'
          )
          uat = replace_exact(
              uat,
              "echo 'ASSIGNED_WORK_PROTECTED_TEST_UAT=PASS identity=jason.mosier@ussignal.local serviceRequest=SR-8C81ACA3 modules=001,001A,019 week=2026-08-16..2026-08-22'",
              "echo 'ASSIGNED_WORK_PROTECTED_TEST_UAT=PASS identity=jason.mosier@ussignal.local serviceRequest=SR-8C81ACA3 modules=001,001A,019 module001aRequestFamilyOnly=true projectTasksExcluded=true week=2026-08-16..2026-08-22'",
              'Protected-Test UAT completion marker'
          )

          backend_path.write_text(backend)
          validator_path.write_text(validator)
          uat_path.write_text(uat)
          marker_path.write_text('true')
          PY
          echo "changed=$(cat /tmp/module001a-request-family-repair-changed)" >> "$GITHUB_OUTPUT"

      - name: Validate focused source and protected-Test UAT contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          node src/frontend/project-time-web/scripts/validate-module-001a-engineer-request-closeout.mjs
          bash -n scripts/release-test/run-assigned-work-protected-test-uat.sh
          git diff --check

      - name: Build API
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Audit and build complete frontend
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm audit --audit-level=high
          npm run build

      - name: Commit and push reviewed repair source
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add \
            src/backend/ProjectTime.Api/Modules/Module001AEngineerTaskCloseoutModule.cs \
            src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs \
            scripts/release-test/run-assigned-work-protected-test-uat.sh
          git diff --cached --quiet && {
            echo 'ERROR: Module 001A request-family-only repair produced no source change.' >&2
            exit 1
          }
          git commit -m 'fix(module001a): exclude project tasks from Engineer closeout'
          git push origin HEAD:fix/module001a-request-family-only-20260818
