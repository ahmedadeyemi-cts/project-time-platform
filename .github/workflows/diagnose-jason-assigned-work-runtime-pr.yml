name: Diagnose Jason Assigned Work Runtime on PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-jason-assigned-work-runtime-pr.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-jason-assigned-work-runtime-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/jason-assigned-work-runtime-20260818'
    name: Capture protected-Test assigned-work evidence
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: https://phd-west-test.onenecklab.com
      EVIDENCE_DIR: /tmp/jason-assigned-work-runtime
      JASON_EMAIL: jason.mosier@ussignal.local
      WEEK_START: '2026-08-16'
      REPORTED_SERVICE_REQUEST: SR-8C81ACA3

    steps:
      - name: Authenticate and capture read-only runtime contracts
        shell: bash
        env:
          TEST_LOGIN_PASSWORD: ${{ secrets.PROJECTPULSE_M087_PASSWORD }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          [[ "$BASE" == 'https://phd-west-test.onenecklab.com' ]] || fail 'Diagnostic is restricted to protected Test.'
          [[ ${#TEST_LOGIN_PASSWORD} -ge 12 ]] || fail 'Protected-Test login credential is unavailable.'
          install -d -m 0700 "$EVIDENCE_DIR"

          payload="$(mktemp)"
          response="$(mktemp)"
          chmod 0600 "$payload" "$response"
          jq -n --arg username "$JASON_EMAIL" --arg password "$TEST_LOGIN_PASSWORD" '{username:$username,password:$password}' > "$payload"
          login_status="$(curl -sS --max-time 90 -o "$response" -w '%{http_code}' \
            -H 'Cache-Control: no-cache' -H 'Content-Type: application/json' \
            -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
            --data-binary @"$payload" "$BASE/api/auth/local/login" || true)"
          rm -f "$payload"
          [[ "$login_status" == 200 ]] || fail "Jason login returned HTTP $login_status."
          SESSION_TOKEN="$(jq -er '.sessionToken' "$response")"
          echo "::add-mask::$SESSION_TOKEN"
          jq 'del(.sessionToken,.token,.password)' "$response" > "$EVIDENCE_DIR/jason-login-redacted.json"
          rm -f "$response"
          unset TEST_LOGIN_PASSWORD

          auth_get() {
            local name="$1" module="$2" path="$3" output="$4" status
            status="$(curl -sS --http1.1 --connect-timeout 20 --max-time 120 \
              -o "$output" -w '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H "Authorization: Bearer $SESSION_TOKEN" \
              -H "X-ProjectPulse-Session: $SESSION_TOKEN" \
              -H "X-ProjectPulse-Module-Number: $module" \
              -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
              "$BASE$path" || true)"
            jq -n --arg name "$name" --arg module "$module" --arg path "$path" --arg status "$status" \
              '{name:$name,module:$module,path:$path,httpStatus:$status}' >> "$EVIDENCE_DIR/http-status.ndjson"
            printf '%s' "$status"
          }

          auth_get security-context 001 '/api/security/context' "$EVIDENCE_DIR/security-context.json" >/dev/null
          auth_get legacy-available-tasks 001 "/api/assignments/available-tasks?weekStart=$WEEK_START" "$EVIDENCE_DIR/available-tasks.json" >/dev/null
          auth_get canonical-work-queue 001 "/api/timesheet/work-queue?weekStart=$WEEK_START" "$EVIDENCE_DIR/timesheet-work-queue.json" >/dev/null
          auth_get timesheet-week 001 "/api/timesheets/week?weekStart=$WEEK_START" "$EVIDENCE_DIR/timesheet-week.json" >/dev/null
          auth_get engineer-task-closeout 001A '/api/engineer-task-closeout/overview' "$EVIDENCE_DIR/engineer-task-closeout.json" >/dev/null
          auth_get engineering-workspace 019 '/api/project-workspace/overview' "$EVIDENCE_DIR/project-workspace.json" >/dev/null

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/jason-assigned-work-runtime')
          sr = 'SR-8C81ACA3'

          def load(name):
              path = root / name
              if not path.exists():
                  return None, 'missing'
              raw = path.read_bytes()
              if not raw:
                  return None, 'empty'
              try:
                  return json.loads(raw), 'json'
              except Exception:
                  return raw.decode('utf-8', errors='replace'), 'non_json'

          def tasks_from(payload):
              if not isinstance(payload, dict):
                  return []
              value = payload.get('tasks')
              return value if isinstance(value, list) else []

          def sr_matches(items):
              matches = []
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  values = [
                      item.get('projectCode'), item.get('serviceRequestNumber'),
                      item.get('requestNumber'), item.get('projectNumber')
                  ]
                  if sr in [str(value or '') for value in values]:
                      matches.append(item)
              return matches

          security, security_shape = load('security-context.json')
          available, available_shape = load('available-tasks.json')
          queue, queue_shape = load('timesheet-work-queue.json')
          week, week_shape = load('timesheet-week.json')
          closeout, closeout_shape = load('engineer-task-closeout.json')
          workspace, workspace_shape = load('project-workspace.json')

          available_tasks = tasks_from(available)
          queue_tasks = tasks_from(queue)
          closeout_rows = []
          if isinstance(closeout, dict):
              closeout_rows = [*(closeout.get('active') or []), *(closeout.get('history') or [])]
          workspace_rows = []
          if isinstance(workspace, dict):
              workspace_rows = [*(workspace.get('projects') or []), *(workspace.get('assignments') or [])]

          summary = {
              'environment': 'protected-test',
              'identity': 'jason.mosier@ussignal.local',
              'serviceRequest': sr,
              'authenticatedUserId': security.get('userId') if isinstance(security, dict) else None,
              'roles': security.get('roles') if isinstance(security, dict) else None,
              'responseShapes': {
                  'security': security_shape,
                  'legacyAvailableTasks': available_shape,
                  'canonicalWorkQueue': queue_shape,
                  'timesheetWeek': week_shape,
                  'closeout': closeout_shape,
                  'workspace': workspace_shape,
              },
              'counts': {
                  'legacyAvailableTasks': len(available_tasks),
                  'legacyAvailableTaskMatches': len(sr_matches(available_tasks)),
                  'canonicalWorkQueue': len(queue_tasks),
                  'canonicalWorkQueueMatches': len(sr_matches(queue_tasks)),
                  'closeoutRows': len(closeout_rows),
                  'closeoutMatches': len(sr_matches(closeout_rows)),
                  'workspaceRows': len(workspace_rows),
                  'workspaceMatches': len(sr_matches(workspace_rows)),
              },
              'mutation': False,
          }
          (root / 'diagnostic-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

          curl -sS --max-time 60 -o /dev/null -X POST \
            -H "Authorization: Bearer $SESSION_TOKEN" -H "X-ProjectPulse-Session: $SESSION_TOKEN" \
            -H 'X-ProjectPulse-Module-Number: 001' -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
            "$BASE/api/auth/session/logout" || true
          unset SESSION_TOKEN

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jason-assigned-work-runtime-evidence
          path: /tmp/jason-assigned-work-runtime
          if-no-files-found: error
          retention-days: 1
