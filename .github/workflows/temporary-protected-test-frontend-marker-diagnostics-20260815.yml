name: Temporary Protected-Test Frontend Marker Diagnostics

on:
  push:
    branches:
      - fix/protected-test-sow-customer-marker-20260815
    paths:
      - '.github/workflows/temporary-protected-test-frontend-marker-diagnostics-20260815.yml'

permissions:
  contents: read

jobs:
  diagnose:
    name: Build and report exact frontend markers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/protected-test-sow-customer-marker-20260815
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Build production frontend and report markers
        shell: bash
        working-directory: src/frontend/project-time-web
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run build

          BUNDLE="$RUNNER_TEMP/protected-test-frontend-bundle.txt"
          REPORT="$RUNNER_TEMP/protected-test-frontend-marker-report.json"
          find dist/assets -type f \( -name '*.js' -o -name '*.css' \) -print0 \
            | xargs -0 cat > "$BUNDLE"

          jq -n '{markers:[],allPresent:true}' > "$REPORT"
          for marker in \
            'pulse-display-utility-dock' \
            'Evidence score' \
            'Project Cost Alerts' \
            'Data incomplete' \
            'Select or type a customer' \
            'FlowHive enterprise workspace is not ready' \
            'Login, logout & sessions'; do
            if grep -Fq "$marker" "$BUNDLE"; then
              present=true
              echo "FRONTEND_MARKER=PASS value=$marker"
            else
              present=false
              echo "FRONTEND_MARKER=FAIL value=$marker"
            fi
            jq --arg marker "$marker" --argjson present "$present" \
              '.markers += [{marker:$marker,present:$present}] | .allPresent = (.allPresent and $present)' \
              "$REPORT" > "$REPORT.tmp"
            mv "$REPORT.tmp" "$REPORT"
          done

          cp "$REPORT" "$GITHUB_WORKSPACE/protected-test-frontend-marker-report.json"
          {
            echo '## Protected-Test frontend marker diagnostics'
            echo
            jq -r '.markers[] | "- \(.marker): \(if .present then "PASS" else "FAIL" end)"' "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload marker report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-test-frontend-marker-report-${{ github.run_id }}
          path: protected-test-frontend-marker-report.json
          if-no-files-found: error
          retention-days: 2
