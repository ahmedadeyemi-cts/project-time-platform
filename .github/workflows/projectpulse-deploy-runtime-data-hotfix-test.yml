name: ProjectPulse Deploy Runtime Data Hotfix Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified runtime data hotfix commit
        required: true
        default: 62bf874ae3a184554bc52960ef878a2f39ab67ef
        type: string
      confirmation:
        description: Enter DEPLOY-RUNTIME-DATA-HOTFIX-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-runtime-data-hotfix-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded runtime data API and web test deployment
    environment: test
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_COMMIT: 62bf874ae3a184554bc52960ef878a2f39ab67ef
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact runtime data hotfix
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and hotfix release
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ github.ref }}' == 'refs/heads/main' ]] || { echo 'Dispatch this workflow from main.' >&2; exit 1; }
          [[ '${{ inputs.confirmation }}' == 'DEPLOY-RUNTIME-DATA-HOTFIX-TO-TEST' ]] || { echo 'Confirmation text does not match.' >&2; exit 1; }
          [[ '${{ inputs.release_commit }}' =~ ^[0-9a-f]{40}$ ]] || { echo 'release_commit must be a complete SHA.' >&2; exit 1; }

          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == '${{ github.sha }}' ]]
          [[ "$TARGET_COMMIT" == '${{ inputs.release_commit }}' ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || { echo 'Only the verified runtime data hotfix may deploy.' >&2; exit 1; }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || { echo 'The hotfix is not an ancestor of the deployment-control commit.' >&2; exit 1; }

          test -f release/src/backend/ProjectTime.Api/Modules/RuntimeDataCompatibilityModule.cs
          test -f release/src/frontend/project-time-web/src/api-json-response.js
          test -f release/src/frontend/project-time-web/src/runtime-data-compatibility.js
          test -f release/src/frontend/project-time-web/src/module001/PtcRuntimeTaskCatalog.jsx
          test -f release/src/frontend/project-time-web/scripts/validate-runtime-role-policy-ptc-data.mjs

          grep -Fq '/api/runtime/role-policy/summary' release/src/backend/ProjectTime.Api/Modules/RuntimeDataCompatibilityModule.cs
          grep -Fq '/api/runtime/role-policy/matrix' release/src/backend/ProjectTime.Api/Modules/RuntimeDataCompatibilityModule.cs
          grep -Fq '/api/runtime/timesheet/steward/users' release/src/backend/ProjectTime.Api/Modules/RuntimeDataCompatibilityModule.cs
          grep -Fq 'PtcManagedRoleAliases' release/src/backend/ProjectTime.Api/Modules/RuntimeDataCompatibilityModule.cs
          grep -Fq 'Requests / Service Requests' release/src/backend/ProjectTime.Api/Modules/RuntimeDataCompatibilityModule.cs
          grep -Fq 'Project Tasks' release/src/backend/ProjectTime.Api/Modules/RuntimeDataCompatibilityModule.cs
          grep -Fq 'Non-Project Time' release/src/backend/ProjectTime.Api/Modules/RuntimeDataCompatibilityModule.cs
          grep -Fq 'runtime_api_non_json_response' release/src/frontend/project-time-web/src/runtime-data-compatibility.js
          grep -Fq 'unwrapApiPayload' release/src/frontend/project-time-web/src/api-json-response.js
          grep -Fq '<PtcRuntimeTaskCatalog />' release/src/frontend/project-time-web/src/main.jsx

          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current immutable API and web images
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          RAW_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          [[ -n "$RAW_API" && -n "$RAW_WEB" && "${API_MODE,,}" == single && "${WEB_MODE,,}" == single ]]

          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Image is outside the approved ACR: $image" >&2; return 1 ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          echo "old_api_image=$(resolve_digest "$RAW_API")" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$(resolve_digest "$RAW_WEB")" >> "$GITHUB_OUTPUT"

      - name: Build immutable runtime data API and web images
        id: build
        working-directory: release
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA='${{ steps.release.outputs.target_commit }}'
          API_REPO='project-health-dashboard-api'
          WEB_REPO='project-health-dashboard-web'
          API_DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$API_REPO:runtime-data-$SHA" deployment/containers/api/Dockerfile .)"
          WEB_DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$WEB_REPO:runtime-data-$SHA" deployment/containers/web/Dockerfile .)"
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$API_REPO@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$WEB_REPO@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy runtime data API
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT='${{ steps.release.outputs.target_commit }}' \
            --revision-suffix "rtdataapi-${GITHUB_RUN_ID}" --output none

      - name: Validate runtime API routes and JSON protection
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'
          BASE="${BASE%/}"

          wait_status() {
            local url="$1" expected="$2" status='' content_type=''
            for attempt in $(seq 1 30); do
              status="$(curl -sS -D /tmp/runtime-headers -o /tmp/runtime-body -w '%{http_code}' -H 'Cache-Control: no-cache' "$url" || true)"
              content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub(/\r/, ""); print $2}' /tmp/runtime-headers | tail -1)"
              if [[ ",$expected," == *",$status,"* ]]; then
                if [[ "$status" == 200 || "$status" == 401 || "$status" == 403 ]]; then
                  [[ "$content_type" == application/json* ]] || { echo "$url returned non-JSON content type: $content_type" >&2; return 1; }
                fi
                return 0
              fi
              sleep 10
            done
            echo "$url returned $status" >&2
            cat /tmp/runtime-body >&2 || true
            return 1
          }

          wait_status "$BASE/health" '200'
          wait_status "$BASE/api/version" '200'
          wait_status "$BASE/api/runtime/role-policy/summary" '401,403'
          wait_status "$BASE/api/runtime/role-policy/matrix" '401,403'
          wait_status "$BASE/api/runtime/timesheet/steward/users?weekStart=2026-07-19" '401,403'

      - name: Deploy runtime data web
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "rtdataweb-${GITHUB_RUN_ID}" --output none

      - name: Validate served runtime data assets and exact images
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'
          BASE="${BASE%/}"
          READY=false

          for attempt in $(seq 1 30); do
            BUSTER="runtime-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$attempt"
            STATUS="$(curl -sSL -H 'Cache-Control: no-cache' -o /tmp/runtime-index.html -w '%{http_code}' "$BASE/?release_check=$BUSTER" || true)"
            JS="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/runtime-index.html | head -1)"
            if [[ "$STATUS" == 200 && -n "$JS" ]]; then
              case "$JS" in
                http*) URL="$JS" ;;
                /*) URL="$BASE$JS" ;;
                *) URL="$BASE/$JS" ;;
              esac
              curl -sSL -H 'Cache-Control: no-cache' -o /tmp/runtime-app.js "$URL?release_check=$BUSTER" || true
              if grep -Fq 'projectpulse-runtime-data-2026-07-25' /tmp/runtime-app.js \
                && grep -Fq '/api/runtime/role-policy/summary' /tmp/runtime-app.js \
                && grep -Fq '/api/runtime/timesheet/steward/users' /tmp/runtime-app.js \
                && grep -Fq 'Requests / Service Requests' /tmp/runtime-app.js \
                && grep -Fq 'Project Tasks' /tmp/runtime-app.js \
                && grep -Fq 'Non-Project Time' /tmp/runtime-app.js \
                && grep -Fq 'runtime_api_non_json_response' /tmp/runtime-app.js; then
                READY=true
                break
              fi
            fi
            sleep 10
          done

          [[ "$READY" == true ]] || { echo 'Runtime data hotfix markers were not served.' >&2; exit 1; }
          ACTIVE_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          ACTIVE_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_API" == '${{ steps.build.outputs.api_image }}' ]]
          [[ "$ACTIVE_WEB" == '${{ steps.build.outputs.web_image }}' ]]

      - name: Write runtime data hotfix deployment evidence
        if: success()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/runtime-data-hotfix-test-deployment.json <<JSON
          {"environment":"test","releaseCommit":"${{ steps.release.outputs.target_commit }}","workflowCommit":"${{ github.sha }}","runId":"${{ github.run_id }}","apiImage":"${{ steps.build.outputs.api_image }}","webImage":"${{ steps.build.outputs.web_image }}","previousApiImage":"${{ steps.before.outputs.old_api_image }}","previousWebImage":"${{ steps.before.outputs.old_web_image }}","databaseChanges":"none","runtimeAliases":"validated","servedAssets":"validated"}
          JSON

      - name: Upload runtime data hotfix deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-data-hotfix-test-deployment-${{ github.run_id }}
          path: evidence/runtime-data-hotfix-test-deployment.json
          retention-days: 30

      - name: Roll back API and web images on failure
        if: ${{ failure() && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set +e
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.before.outputs.old_api_image }}' \
            --revision-suffix "rtapirb-${GITHUB_RUN_ID}" --output none
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.before.outputs.old_web_image }}' \
            --revision-suffix "rtwebrb-${GITHUB_RUN_ID}" --output none
