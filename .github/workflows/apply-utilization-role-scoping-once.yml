name: Apply Utilization Role Scoping Once

on:
  push:
    branches:
      - fix/utilization-role-scoping-20260814

permissions:
  contents: read

concurrency:
  group: apply-utilization-role-scoping-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/utilization-role-scoping-20260814
          fetch-depth: 0

      - name: Verify reviewed base and concurrent work boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 94949b43b999146b07b10956b1f128e4619ebb82 HEAD
          test "$(git merge-base 94949b43b999146b07b10956b1f128e4619ebb82 HEAD)" = 94949b43b999146b07b10956b1f128e4619ebb82
          git diff --check 94949b43b999146b07b10956b1f128e4619ebb82...HEAD

      - name: Reconcile guarded patch anchors with reviewed main
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_utilization_role_scoping.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          slash = chr(92)

          yearly_matches = [
              index
              for index, line in enumerate(lines)
              if 'yearly-status' in line and "r'app" in line
          ]
          if len(yearly_matches) != 1:
              raise SystemExit(f'Expected one yearly regex line, found {len(yearly_matches)}')

          yearly_index = yearly_matches[0]
          if yearly_index + 1 >= len(lines) or 'source-projects' not in lines[yearly_index + 1]:
              raise SystemExit('The yearly endpoint closing anchor is not adjacent to the opening regex line')

          lines[yearly_index] = (
              "        r'app" + slash + ".MapGet" + slash
              + "(\"/api/utilization/yearly-status\",[" + slash + "s" + slash
              + "S]*?" + slash + "n" + slash + "}" + slash + ");'"
          )
          lines[yearly_index + 1] = (
              "        r'" + slash + "s*app" + slash + ".MapGet" + slash
              + "(\"/api/project-allocation-info/source-projects\"'"
          )

          count_matches = [
              index for index, line in enumerate(lines)
              if 'if block.count(role_filter) != 2:' in line
          ]
          if len(count_matches) != 1:
              raise SystemExit(f'Expected one role-filter count guard, found {len(count_matches)}')
          count_index = count_matches[0]
          lines[count_index] = lines[count_index].replace('!= 2', '!= 1')
          lines[count_index + 1] = lines[count_index + 1].replace('expected two anchors', 'expected one anchor')

          replace_start = next(
              (
                  index for index, line in enumerate(lines)
                  if line.strip() == 'block = block.replace('
                  and index + 1 < len(lines)
                  and lines[index + 1].strip() == 'role_filter,'
              ),
              None
          )
          if replace_start is None:
              raise SystemExit('Role-filter replacement block was not found')

          replacement_count_index = next(
              (
                  index for index in range(replace_start + 1, min(replace_start + 8, len(lines)))
                  if lines[index].strip() == '2,'
              ),
              None
          )
          if replacement_count_index is None:
              raise SystemExit('Role-filter replacement count was not found')
          lines[replacement_count_index] = lines[replacement_count_index].replace('2,', '1,')

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('PATCHER_ANCHOR_RECONCILIATION=PASS')
          PY

      - name: Apply guarded source repair
        run: python .github/scripts/apply_utilization_role_scoping.py

      - name: Validate source contracts
        run: node tests/validate-utilization-role-scoping.mjs

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Build frontend and run existing Module 003 validation
        working-directory: src/frontend/project-time-web
        run: |
          npm ci --no-audit --no-fund
          npm run validate:modules003004-rolling-years
          npm run build

      - name: Prepare exact validated source bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git diff -- \
            src/backend/ProjectTime.Api/Program.cs \
            src/frontend/project-time-web/src/EngineeringTeamLeadUtilizationPanel.jsx \
            src/frontend/project-time-web/src/GlobalViewAsDrawer.jsx \
            src/frontend/project-time-web/src/App.jsx \
            tests/validate-utilization-role-scoping.mjs \
            .github/workflows/utilization-role-scoping-ci.yml \
            > utilization-role-scoping.patch
          sha256sum \
            src/backend/ProjectTime.Api/Program.cs \
            src/frontend/project-time-web/src/EngineeringTeamLeadUtilizationPanel.jsx \
            src/frontend/project-time-web/src/GlobalViewAsDrawer.jsx \
            src/frontend/project-time-web/src/App.jsx \
            tests/validate-utilization-role-scoping.mjs \
            .github/workflows/utilization-role-scoping-ci.yml \
            > utilization-role-scoping.sha256

      - name: Upload exact validated source bundle
        uses: actions/upload-artifact@v4
        with:
          name: utilization-role-scoping-generated-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            src/backend/ProjectTime.Api/Program.cs
            src/frontend/project-time-web/src/EngineeringTeamLeadUtilizationPanel.jsx
            src/frontend/project-time-web/src/GlobalViewAsDrawer.jsx
            src/frontend/project-time-web/src/App.jsx
            tests/validate-utilization-role-scoping.mjs
            .github/workflows/utilization-role-scoping-ci.yml
            utilization-role-scoping.patch
            utilization-role-scoping.sha256
