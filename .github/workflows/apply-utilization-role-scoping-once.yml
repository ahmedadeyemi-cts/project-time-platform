name: Apply Utilization Role Scoping Once

on:
  push:
    branches:
      - fix/utilization-role-scoping-20260814

permissions:
  contents: write

concurrency:
  group: apply-utilization-role-scoping-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/utilization-role-scoping-20260814
          fetch-depth: 0

      - name: Verify reviewed base and concurrent work boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 94949b43b999146b07b10956b1f128e4619ebb82 HEAD
          test "$(git merge-base 94949b43b999146b07b10956b1f128e4619ebb82 HEAD)" = 94949b43b999146b07b10956b1f128e4619ebb82
          git diff --check 94949b43b999146b07b10956b1f128e4619ebb82...HEAD

      - name: Normalize guarded patcher regex literals
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_utilization_role_scoping.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          slash = chr(92)
          doubled = slash * 2
          updated = 0

          for index, line in enumerate(lines):
              is_target = (
                  ('yearly-status' in line and "r'app" in line)
                  or ('source-projects' in line and line.lstrip().startswith("r'"))
                  or ('const loadUsers = useCallback' in line and "r'" in line)
                  or ('const timers = ' in line and "r'  useEffect" in line)
              )
              if not is_target:
                  continue
              if doubled not in line:
                  raise SystemExit(f'Expected doubled regex escapes were not found on line {index + 1}')
              lines[index] = line.replace(doubled, slash)
              updated += 1

          if updated != 4:
              raise SystemExit(f'Expected to normalize four regex lines, normalized {updated}')

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('PATCHER_REGEX_NORMALIZATION=PASS')
          PY

      - name: Apply guarded source repair
        run: python .github/scripts/apply_utilization_role_scoping.py

      - name: Validate source contracts
        run: node tests/validate-utilization-role-scoping.mjs

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Build frontend and run existing Module 003 validation
        working-directory: src/frontend/project-time-web
        run: |
          npm ci --no-audit --no-fund
          npm run validate:modules003004-rolling-years
          npm run build

      - name: Commit only reviewed source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            src/backend/ProjectTime.Api/Program.cs \
            src/frontend/project-time-web/src/EngineeringTeamLeadUtilizationPanel.jsx \
            src/frontend/project-time-web/src/GlobalViewAsDrawer.jsx \
            src/frontend/project-time-web/src/App.jsx \
            tests/validate-utilization-role-scoping.mjs \
            .github/workflows/utilization-role-scoping-ci.yml

          git rm \
            .github/scripts/apply_utilization_role_scoping.py \
            .github/workflows/apply-utilization-role-scoping-once.yml

          git diff --cached --check
          git commit -m 'Fix utilization role scoping and self calculations'
          git push origin HEAD:fix/utilization-role-scoping-20260814
