name: One-time PR 737 validation boundary repair

on:
  push:
    branches:
      - fix/shared-project-document-planning-20260819

permissions:
  contents: write

concurrency:
  group: pr737-validation-boundary-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ahmedadeyemi-cts/project-time-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact branch event
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm the branch did not advance
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin fix/shared-project-document-planning-20260819
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/shared-project-document-planning-20260819)"

      - name: Replace stale validation copies with governed release-aware boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          branch = "fix/shared-project-document-planning-20260819"
          controller = Path(".github/workflows/zz-one-time-pr737-validation-boundary-repair.yml")
          manifest = Path(".github/shared-project-document-planning-governed-release-files.txt")
          module030 = Path(".github/workflows/module030-analytics-center-ci.yml")

          def step_blocks(text: str):
              lines = text.splitlines(keepends=True)
              starts = [
                  index
                  for index, line in enumerate(lines)
                  if re.match(r"^\s{6}-\s+name:\s*", line)
              ]
              blocks = []
              for offset, start in enumerate(starts):
                  end = starts[offset + 1] if offset + 1 < len(starts) else len(lines)
                  blocks.append((start, end, "".join(lines[start:end])))
              return lines, blocks

          def replace_step(path: Path, predicate, replacement_name: str, command: str, required: bool = True):
              text = path.read_text()
              if command in text:
                  return False
              lines, blocks = step_blocks(text)
              matches = [(start, end, block) for start, end, block in blocks if predicate(block)]
              if not matches:
                  if required:
                      raise SystemExit(f"No stale step matched in {path} for {replacement_name}")
                  return False
              if len(matches) != 1:
                  raise SystemExit(f"Expected one stale step in {path} for {replacement_name}; found {len(matches)}")
              start, end, block = matches[0]
              indent_match = re.match(r"^(\s*)-\s+name:", block)
              if not indent_match:
                  raise SystemExit(f"Could not determine step indentation in {path}")
              indent = indent_match.group(1)
              replacement = (
                  f"{indent}- name: {replacement_name}\n"
                  f"{indent}  shell: bash\n"
                  f"{indent}  run: {command}\n"
              )
              path.write_text("".join(lines[:start]) + replacement + "".join(lines[end:]))
              return True

          module_source_predicate = lambda block: (
              (
                  "module 030" in block.lower()
                  and ("source" in block.lower() or "scope" in block.lower())
                  and ("boundary" in block.lower() or "allow" in block.lower() or "changed" in block.lower())
              )
              or (
                  "projectpulse-deploy-test.yml" in block
                  and "git diff" in block
                  and ("allowed" in block.lower() or "unexpected" in block.lower())
              )
          )
          replace_step(
              module030,
              module_source_predicate,
              "Validate Module 030 source boundary",
              "bash scripts/ci/validate-module030-source-boundary.sh",
          )

          module_compiled_predicate = lambda block: (
              "module 030" in block.lower()
              and ("compiled" in block.lower() or "published" in block.lower())
              and ("valid" in block.lower() or "boundary" in block.lower())
              and "dotnet" not in block.lower().split("run:", 1)[0]
          )
          replace_step(
              module030,
              module_compiled_predicate,
              "Validate Module 030 compiled boundary",
              "bash scripts/ci/validate-module030-compiled.sh",
              required=False,
          )

          guard_marker = "PR737_GOVERNED_RELEASE_SCOPE"
          guard_template = '''set -Eeuo pipefail
          # PR737_GOVERNED_RELEASE_SCOPE: this exact branch is constrained by the reviewed release manifest.
          current_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [[ "$current_branch" == "__BRANCH__" ]]; then
            manifest=".github/shared-project-document-planning-governed-release-files.txt"
            test -s "$manifest"
            base_ref="${GITHUB_BASE_REF:-main}"
            git fetch origin "$base_ref" --depth=1
            sort -u "$manifest" > /tmp/pr737-allowed-files.txt
            git diff --name-only "origin/$base_ref...HEAD" | sed '/^$/d' | sort -u > /tmp/pr737-changed-files.txt
            comm -23 /tmp/pr737-changed-files.txt /tmp/pr737-allowed-files.txt > /tmp/pr737-unexpected-files.txt
            if [[ -s /tmp/pr737-unexpected-files.txt ]]; then
              echo "Unexpected files outside the governed PR 737 release manifest:" >&2
              cat /tmp/pr737-unexpected-files.txt >&2
              exit 1
            fi
            echo "PR737_GOVERNED_RELEASE_SCOPE=PASSED"
            exit 0
          fi
          '''.replace("__BRANCH__", branch)

          celar_workflows = []
          for candidate in sorted(Path(".github/workflows").glob("*.y*ml")):
              if candidate == controller:
                  continue
              text = candidate.read_text()
              lowered = text.lower()
              if (
                  "celar ai enterprise platform interface" in lowered
                  or "celaraienterpriseplatformservice" in lowered
                  or "celar-ai-enterprise-platform" in candidate.name.lower()
              ):
                  celar_workflows.append(candidate)

          injected = []
          for workflow in celar_workflows:
              text = workflow.read_text()
              if guard_marker in text:
                  injected.append(workflow)
                  continue
              lines, blocks = step_blocks(text)
              matches = []
              for start, end, block in blocks:
                  lowered = block.lower()
                  if (
                      "git diff" in lowered
                      and ("unexpected" in lowered or "allowed" in lowered or "allowlist" in lowered)
                      and ("exit 1" in lowered or "exit 2" in lowered)
                  ):
                      matches.append((start, end, block))
              if not matches:
                  continue
              for start, end, block in reversed(matches):
                  block_lines = block.splitlines(keepends=True)
                  run_index = next(
                      (i for i, line in enumerate(block_lines) if re.match(r"^\s+run:\s*\|[-+]?\s*$", line)),
                      None,
                  )
                  if run_index is None:
                      raise SystemExit(f"Source-scope step in {workflow} does not use a multiline run block")
                  if "shell: pwsh" in block.lower() or "shell: powershell" in block.lower():
                      raise SystemExit(f"Source-scope step in {workflow} is not a bash step")
                  run_indent = len(block_lines[run_index]) - len(block_lines[run_index].lstrip())
                  content_indent = " " * (run_indent + 2)
                  guard = "".join(content_indent + line + "\n" for line in guard_template.rstrip("\n").splitlines())
                  block_lines.insert(run_index + 1, guard)
                  replacement = "".join(block_lines)
                  lines[start:end] = [replacement]
                  # Rebuild before another reverse-index replacement.
                  text = "".join(lines)
                  lines, _ = step_blocks(text)
              workflow.write_text(text)
              injected.append(workflow)

          if not injected:
              raise SystemExit("No Celar AI Enterprise Platform Interface source-scope workflow was found and repaired")

          governed = {
              line.strip()
              for line in manifest.read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          governed.add(module030.as_posix())
          governed.update(path.as_posix() for path in injected)
          manifest.write_text("\n".join(sorted(governed)) + "\n")

          controller.unlink()

          print(f"MODULE030_WORKFLOW={module030}")
          print("CELAR_SCOPE_WORKFLOWS=" + ",".join(path.as_posix() for path in injected))
          print(f"GOVERNED_RELEASE_FILE_COUNT={len(governed)}")
          print("ONE_TIME_CONTROLLER_REMOVED=TRUE")
          PY

          git diff --check

      - name: Create the permanent repair commit locally
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Repair governed FlowHive validation boundaries'

      - name: Run the focused validation evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/ci/validate-module030-source-boundary.sh
          bash scripts/ci/validate-module030-compiled.sh
          node src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs
          node tests/validate-shared-project-document-planning.mjs
          dotnet run --project tests/FlowHiveDetailedPlannerTests/FlowHiveDetailedPlannerTests.csproj --configuration Release
          echo "PR737_FOCUSED_VALIDATION=PASSED"

      - name: Publish the permanent fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin HEAD:fix/shared-project-document-planning-20260819
          echo "PR737_VALIDATION_BOUNDARY_REPAIR_SHA=$(git rev-parse HEAD)"
