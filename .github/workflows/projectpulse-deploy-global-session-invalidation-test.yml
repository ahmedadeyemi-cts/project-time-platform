name: ProjectPulse Emergency Restore Pre-Session-Invalidation Web Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact last known login-capable web release
        required: true
        default: 9ba6d676189ebca39f408c3bc7a71aa652cea8bf
        type: string
      confirmation:
        description: Enter RESTORE-PRE-SESSION-INVALIDATION-WEB-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-emergency-login-web-restore-test
  cancel-in-progress: false

jobs:
  restore-web:
    name: Guarded emergency web-only login restoration
    environment: test
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_COMMIT: 9ba6d676189ebca39f408c3bc7a71aa652cea8bf

    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact rollback release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and exact rollback release
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          [[ "$WORKFLOW_SOURCE_REF" == 'refs/heads/main' ]] || {
            echo 'Dispatch this workflow from main.' >&2
            exit 1
          }
          [[ "$DISPATCH_CONFIRMATION" == 'RESTORE-PRE-SESSION-INVALIDATION-WEB-TO-TEST' ]] || {
            echo 'The emergency restore confirmation text does not match.' >&2
            exit 1
          }
          [[ "$DISPATCH_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release_commit must be a complete 40-character SHA.' >&2
            exit 1
          }

          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == "$WORKFLOW_SOURCE_SHA" ]]
          [[ "$TARGET_COMMIT" == "$DISPATCH_RELEASE_COMMIT" ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || {
            echo 'Only the approved pre-session-invalidation rollback release may deploy.' >&2
            exit 1
          }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || {
            echo 'The rollback release is not an ancestor of the deployment controls.' >&2
            exit 1
          }

          SOURCE='release/src/frontend/project-time-web/src/projectpulse-authoritative-api.js'
          test -f "$SOURCE"
          test -f release/src/frontend/project-time-web/src/AuditHistoryPanel.jsx
          test -f release/src/frontend/project-time-web/src/UserAdministrationPanel.jsx
          test -f control/scripts/build-pr55-acr-image.sh
          test -f control/scripts/wait-containerapp-ready-revision.sh

          grep -Fq 'projectpulse-authoritative-xhr-v1' "$SOURCE"
          grep -Fq "window.localStorage.getItem('projectPulseAuthSession')" "$SOURCE"
          grep -Fq "request.setRequestHeader('X-ProjectPulse-Session', token);" "$SOURCE"
          grep -Fq "request.setRequestHeader('X-Project-Pulse-Session', token);" "$SOURCE"
          grep -Fq "request.setRequestHeader('X-Session-Token', token);" "$SOURCE"
          ! grep -Fq 'projectpulse-authoritative-session-invalidation-v1' "$SOURCE"
          ! grep -Fq 'projectpulse:session-invalidated' "$SOURCE"
          ! grep -Fq 'invalidateProjectPulseSession' "$SOURCE"
          ! grep -Fq 'window.location.reload();' "$SOURCE"

          grep -Fq '/api/admin/audit-history/events' release/src/frontend/project-time-web/src/AuditHistoryPanel.jsx
          grep -Fq 'Manager team scope' release/src/frontend/project-time-web/src/UserAdministrationPanel.jsx

          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current immutable web image
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail

          RAW_WEB_IMAGE="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query 'properties.template.containers[0].image' -o tsv)"
          WEB_MODE="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query 'properties.configuration.activeRevisionsMode' -o tsv)"

          [[ -n "$RAW_WEB_IMAGE" ]]
          [[ "${WEB_MODE,,}" == 'single' ]]

          resolve_digest() {
            local image="$1"
            local registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/'
            local relative repository digest

            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Web image is outside the approved ACR: $image" >&2; return 1 ;;
            esac

            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show \
              --name '${{ vars.AZURE_ACR_NAME }}' \
              --image "$relative" \
              --query digest -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          CURRENT_WEB_IMAGE="$(resolve_digest "$RAW_WEB_IMAGE")"
          echo "current_web_image=$CURRENT_WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo "CAPTURED_CURRENT_WEB_IMAGE=$CURRENT_WEB_IMAGE"

      - name: Build exact rollback web candidate
        id: build
        shell: bash
        working-directory: release
        run: |
          set -Eeuo pipefail
          TARGET_COMMIT='${{ steps.release.outputs.target_commit }}'
          WEB_REPOSITORY='project-health-dashboard-web'
          WEB_DIGEST="$(
            ../control/scripts/build-pr55-acr-image.sh \
              '${{ vars.AZURE_ACR_NAME }}' \
              "$WEB_REPOSITORY:emergency-login-restore-$TARGET_COMMIT" \
              deployment/containers/web/Dockerfile \
              .
          )"
          [[ "$WEB_DIGEST" == sha256:* ]]
          WEB_IMAGE='${{ vars.AZURE_ACR_NAME }}.azurecr.io/'"$WEB_REPOSITORY@$WEB_DIGEST"
          echo "web_image=$WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo "IMMUTABLE_ROLLBACK_WEB_CANDIDATE=$WEB_IMAGE"

      - name: Restore pre-session-invalidation web candidate only
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          SUFFIX="loginrestore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REVISION='${{ vars.AZURE_WEB_APP }}'"--$SUFFIX"
          echo 'started=true' >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "$SUFFIX" \
            --output none

      - name: Wait for exact restored web revision
        shell: bash
        run: |
          bash control/scripts/wait-containerapp-ready-revision.sh \
            '${{ vars.AZURE_RESOURCE_GROUP }}' \
            '${{ vars.AZURE_WEB_APP }}' \
            '${{ steps.deploy_web.outputs.revision }}' \
            '${{ steps.build.outputs.web_image }}' 60 10

      - name: Validate served rollback bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_URL='${{ vars.PUBLIC_URL }}'
          BASE_URL="${BASE_URL%/}"
          READY=false
          LAST_STATUS='not-requested'
          LAST_JS='not-resolved'

          absolute_asset_url() {
            local path="$1"
            case "$path" in
              http://*|https://*) printf '%s\n' "$path" ;;
              /*) printf '%s%s\n' "$BASE_URL" "$path" ;;
              *) printf '%s/%s\n' "$BASE_URL" "$path" ;;
            esac
          }

          for attempt in $(seq 1 30); do
            BUSTER="loginrestore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            STATUS="$(curl --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              --output /tmp/login-restore-index.html \
              --write-out '%{http_code}' \
              "$BASE_URL/?release_check=$BUSTER" || true)"
            LAST_STATUS="$STATUS"

            if [[ "$STATUS" == '200' ]]; then
              JS_PATH="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/login-restore-index.html | head -1)"
              LAST_JS="$JS_PATH"
              if [[ -n "$JS_PATH" ]]; then
                JS_URL="$(absolute_asset_url "$JS_PATH")"
                JS_STATUS="$(curl --silent --show-error --location \
                  --header 'Cache-Control: no-cache' \
                  --header 'Pragma: no-cache' \
                  --output /tmp/login-restore-app.js \
                  --write-out '%{http_code}' \
                  "$JS_URL?release_check=$BUSTER" || true)"
                LAST_STATUS="html=$STATUS,js=$JS_STATUS"

                if [[ "$JS_STATUS" == '200' ]] \
                  && grep -Fq 'projectpulse-authoritative-xhr-v1' /tmp/login-restore-app.js \
                  && grep -Fq 'projectPulseAuthSession' /tmp/login-restore-app.js \
                  && grep -Fq 'X-ProjectPulse-Session' /tmp/login-restore-app.js \
                  && grep -Fq 'X-Project-Pulse-Session' /tmp/login-restore-app.js \
                  && grep -Fq 'X-Session-Token' /tmp/login-restore-app.js \
                  && grep -Fq '/api/admin/audit-history/events' /tmp/login-restore-app.js \
                  && grep -Fq 'Manager team scope' /tmp/login-restore-app.js \
                  && ! grep -Fq 'projectpulse-authoritative-session-invalidation-v1' /tmp/login-restore-app.js \
                  && ! grep -Fq 'projectpulse:session-invalidated' /tmp/login-restore-app.js; then
                  READY=true
                  echo "PRE_SESSION_INVALIDATION_WEB_RESTORED attempt=$attempt js=$JS_PATH"
                  break
                fi
              fi
            fi

            (( attempt < 30 )) && sleep 10
          done

          [[ "$READY" == true ]] || {
            echo "Pre-session-invalidation bundle did not become ready: status=$LAST_STATUS js=$LAST_JS" >&2
            exit 1
          }

          ACTIVE_WEB_IMAGE="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_WEB_IMAGE" == '${{ steps.build.outputs.web_image }}' ]] || {
            echo "Active web image mismatch: expected=${{ steps.build.outputs.web_image }} actual=$ACTIVE_WEB_IMAGE" >&2
            exit 1
          }

          echo 'EMERGENCY_LOGIN_WEB_RESTORE_VALIDATION=PASS'

      - name: Write emergency restore evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cat > evidence/emergency-login-web-restore-test.json <<JSON
          {
            "environment": "test",
            "releaseCommit": "${{ steps.release.outputs.target_commit }}",
            "workflowCommit": "${{ github.sha }}",
            "runId": "${{ github.run_id }}",
            "restoredWebImage": "${{ steps.build.outputs.web_image }}",
            "replacedWebImage": "${{ steps.before.outputs.current_web_image }}",
            "globalSessionInvalidation": "absent-from-restored-bundle",
            "apiDeployment": "unchanged",
            "migrations": "unchanged",
            "database": "unchanged",
            "servedAssetValidation": "passed"
          }
          JSON

      - name: Upload emergency restore evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-login-web-restore-test-${{ github.run_id }}
          path: evidence/emergency-login-web-restore-test.json
          retention-days: 30

      - name: Restore current web image if emergency rollback fails
        if: ${{ failure() && steps.deploy_web.outputs.started == 'true' }}
        shell: bash
        run: |
          set +e
          SUFFIX="loginrestorefail-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ROLLBACK_REVISION='${{ vars.AZURE_WEB_APP }}'"--$SUFFIX"
          echo 'Emergency login rollback failed. Restoring the image captured before this run.' >&2

          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.before.outputs.current_web_image }}' \
            --revision-suffix "$SUFFIX" \
            --output none

          bash control/scripts/wait-containerapp-ready-revision.sh \
            '${{ vars.AZURE_RESOURCE_GROUP }}' \
            '${{ vars.AZURE_WEB_APP }}' \
            "$ROLLBACK_REVISION" \
            '${{ steps.before.outputs.current_web_image }}' 60 10
