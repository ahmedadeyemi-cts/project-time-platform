name: ProjectPulse Deploy Authoritative Session and Theme Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified authoritative session and theme release
        required: true
        default: 54a0b678b86dde32c409d20aa3751ce0293f079d
        type: string
      confirmation:
        description: Enter DEPLOY-AUTHORITATIVE-SESSION-THEME-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-global-session-invalidation-test
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Guarded authoritative session and theme web-only deployment
    environment: test
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_COMMIT: 54a0b678b86dde32c409d20aa3751ce0293f079d

    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact source release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and exact release
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          [[ "$WORKFLOW_SOURCE_REF" == 'refs/heads/main' ]] || {
            echo 'Dispatch this workflow from main.' >&2
            exit 1
          }
          [[ "$DISPATCH_CONFIRMATION" == 'DEPLOY-AUTHORITATIVE-SESSION-THEME-TO-TEST' ]] || {
            echo 'The deployment confirmation text does not match.' >&2
            exit 1
          }
          [[ "$DISPATCH_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release_commit must be a complete 40-character SHA.' >&2
            exit 1
          }

          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == "$WORKFLOW_SOURCE_SHA" ]]
          [[ "$TARGET_COMMIT" == "$DISPATCH_RELEASE_COMMIT" ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || {
            echo 'Only the verified authoritative session and theme release may deploy.' >&2
            exit 1
          }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || {
            echo 'The source release is not an ancestor of the deployment controls.' >&2
            exit 1
          }

          TRANSPORT='release/src/frontend/project-time-web/src/projectpulse-authoritative-api.js'
          THEME_JS='release/src/frontend/project-time-web/src/admin-experience-theme.js'
          THEME_CSS='release/src/frontend/project-time-web/src/admin-experience-theme.css'
          RUNTIME_TEST='release/src/frontend/project-time-web/scripts/test-authoritative-session-transport-theme-runtime.mjs'
          STATIC_VALIDATOR='release/src/frontend/project-time-web/scripts/validate-global-session-invalidation.mjs'
          MODULE_VALIDATOR='release/src/frontend/project-time-web/scripts/validate-modules-008-009-admin-experience.mjs'

          for required in \
            "$TRANSPORT" \
            "$THEME_JS" \
            "$THEME_CSS" \
            "$RUNTIME_TEST" \
            "$STATIC_VALIDATOR" \
            "$MODULE_VALIDATOR" \
            release/src/frontend/project-time-web/src/AuditHistoryPanel.jsx \
            release/src/frontend/project-time-web/src/UserAdministrationPanel.jsx \
            control/scripts/build-pr55-acr-image.sh \
            control/scripts/wait-containerapp-ready-revision.sh; do
            test -f "$required"
          done

          grep -Fq 'projectpulse-authoritative-xhr-v1' "$TRANSPORT"
          grep -Fq 'function installProtectedFetchReadinessGate()' "$TRANSPORT"
          grep -Fq 'function globalXhrBridgeCanSupplyToken(token)' "$TRANSPORT"
          grep -Fq 'globalXhrBridgeToken() === token' "$TRANSPORT"
          grep -Fq 'if (token && !globalXhrBridgeCanSupplyToken(token))' "$TRANSPORT"
          grep -Fq "error.code = 'session_not_ready';" "$TRANSPORT"
          grep -Fq "error.code = 'session_transport_conflict';" "$TRANSPORT"
          ! grep -Fq 'projectpulse-authoritative-session-invalidation-v1' "$TRANSPORT"
          ! grep -Fq 'projectpulse:session-invalidated' "$TRANSPORT"
          ! grep -Fq 'invalidateProjectPulseSession' "$TRANSPORT"
          ! grep -Fq 'window.location.reload();' "$TRANSPORT"

          grep -Fq 'dataset.projectpulseThemeControl' "$THEME_JS"
          grep -Fq 'STRAY_THEME_TEXT' "$THEME_JS"
          grep -Fq 'Switch to ${target} mode' "$THEME_JS"
          grep -Fq "[data-projectpulse-theme-control='true']" "$THEME_CSS"
          grep -Fq "content: 'Dark mode'" "$THEME_CSS"
          grep -Fq "content: 'Light mode'" "$THEME_CSS"

          (
            cd release/src/frontend/project-time-web
            node scripts/validate-global-session-invalidation.mjs
            node scripts/test-authoritative-session-transport-theme-runtime.mjs
            node scripts/validate-modules-008-009-admin-experience.mjs
          )

          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current immutable web image
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail

          RAW_WEB_IMAGE="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query 'properties.template.containers[0].image' -o tsv)"
          WEB_MODE="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query 'properties.configuration.activeRevisionsMode' -o tsv)"

          [[ -n "$RAW_WEB_IMAGE" ]]
          [[ "${WEB_MODE,,}" == 'single' ]]

          resolve_digest() {
            local image="$1"
            local registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/'
            local relative repository digest

            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Web image is outside the approved ACR: $image" >&2; return 1 ;;
            esac

            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show \
              --name '${{ vars.AZURE_ACR_NAME }}' \
              --image "$relative" \
              --query digest -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          CURRENT_WEB_IMAGE="$(resolve_digest "$RAW_WEB_IMAGE")"
          echo "current_web_image=$CURRENT_WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo "CAPTURED_CURRENT_WEB_IMAGE=$CURRENT_WEB_IMAGE"

      - name: Build exact web candidate
        id: build
        shell: bash
        working-directory: release
        run: |
          set -Eeuo pipefail
          TARGET_COMMIT='${{ steps.release.outputs.target_commit }}'
          WEB_REPOSITORY='project-health-dashboard-web'
          WEB_DIGEST="$(
            ../control/scripts/build-pr55-acr-image.sh \
              '${{ vars.AZURE_ACR_NAME }}' \
              "$WEB_REPOSITORY:authoritative-session-theme-$TARGET_COMMIT" \
              deployment/containers/web/Dockerfile \
              .
          )"
          [[ "$WEB_DIGEST" == sha256:* ]]
          WEB_IMAGE='${{ vars.AZURE_ACR_NAME }}.azurecr.io/'"$WEB_REPOSITORY@$WEB_DIGEST"
          echo "web_image=$WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo "IMMUTABLE_WEB_CANDIDATE=$WEB_IMAGE"

      - name: Deploy web candidate only
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          SUFFIX="sesstheme-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REVISION='${{ vars.AZURE_WEB_APP }}'"--$SUFFIX"
          echo 'started=true' >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "$SUFFIX" \
            --output none

      - name: Wait for exact web revision
        shell: bash
        run: |
          bash control/scripts/wait-containerapp-ready-revision.sh \
            '${{ vars.AZURE_RESOURCE_GROUP }}' \
            '${{ vars.AZURE_WEB_APP }}' \
            '${{ steps.deploy_web.outputs.revision }}' \
            '${{ steps.build.outputs.web_image }}' 60 10

      - name: Validate served session and theme assets
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_URL='${{ vars.PUBLIC_URL }}'
          BASE_URL="${BASE_URL%/}"
          READY=false
          LAST_STATUS='not-requested'
          LAST_JS='not-resolved'
          LAST_CSS='not-resolved'

          absolute_asset_url() {
            local path="$1"
            case "$path" in
              http://*|https://*) printf '%s\n' "$path" ;;
              /*) printf '%s%s\n' "$BASE_URL" "$path" ;;
              *) printf '%s/%s\n' "$BASE_URL" "$path" ;;
            esac
          }

          for attempt in $(seq 1 30); do
            BUSTER="sesstheme-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            HTML_STATUS="$(curl --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              --output /tmp/session-theme-index.html \
              --write-out '%{http_code}' \
              "$BASE_URL/?release_check=$BUSTER" || true)"
            LAST_STATUS="html=$HTML_STATUS"

            if [[ "$HTML_STATUS" == '200' ]]; then
              JS_PATH="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/session-theme-index.html | head -1)"
              CSS_PATH="$(sed -nE 's/.*href="([^"]+\.css)".*/\1/p' /tmp/session-theme-index.html | head -1)"
              LAST_JS="$JS_PATH"
              LAST_CSS="$CSS_PATH"

              if [[ -n "$JS_PATH" && -n "$CSS_PATH" ]]; then
                JS_URL="$(absolute_asset_url "$JS_PATH")"
                CSS_URL="$(absolute_asset_url "$CSS_PATH")"
                JS_STATUS="$(curl --silent --show-error --location \
                  --header 'Cache-Control: no-cache' \
                  --header 'Pragma: no-cache' \
                  --output /tmp/session-theme-app.js \
                  --write-out '%{http_code}' \
                  "$JS_URL?release_check=$BUSTER" || true)"
                CSS_STATUS="$(curl --silent --show-error --location \
                  --header 'Cache-Control: no-cache' \
                  --header 'Pragma: no-cache' \
                  --output /tmp/session-theme-app.css \
                  --write-out '%{http_code}' \
                  "$CSS_URL?release_check=$BUSTER" || true)"
                LAST_STATUS="html=$HTML_STATUS,js=$JS_STATUS,css=$CSS_STATUS"

                if [[ "$JS_STATUS" == '200' && "$CSS_STATUS" == '200' ]] \
                  && grep -Fq 'projectpulse-authoritative-xhr-v1' /tmp/session-theme-app.js \
                  && grep -Fq 'session_not_ready' /tmp/session-theme-app.js \
                  && grep -Fq 'session_transport_conflict' /tmp/session-theme-app.js \
                  && grep -Fq 'projectPulseAuthSession' /tmp/session-theme-app.js \
                  && grep -Fq 'X-ProjectPulse-Session' /tmp/session-theme-app.js \
                  && grep -Fq '/api/admin/audit-history/events' /tmp/session-theme-app.js \
                  && grep -Fq 'Manager team scope' /tmp/session-theme-app.js \
                  && grep -Fq 'projectpulse-theme-control' /tmp/session-theme-app.js \
                  && grep -Fq 'projectpulseThemeControl' /tmp/session-theme-app.js \
                  && ! grep -Fq 'projectpulse-authoritative-session-invalidation-v1' /tmp/session-theme-app.js \
                  && ! grep -Fq 'projectpulse:session-invalidated' /tmp/session-theme-app.js \
                  && grep -Fq 'data-projectpulse-theme-control' /tmp/session-theme-app.css \
                  && grep -Fq 'Dark mode' /tmp/session-theme-app.css \
                  && grep -Fq 'Light mode' /tmp/session-theme-app.css \
                  && grep -Fq 'backdrop-filter' /tmp/session-theme-app.css; then
                  READY=true
                  echo "AUTHORITATIVE_SESSION_THEME_ASSETS_READY attempt=$attempt js=$JS_PATH css=$CSS_PATH"
                  break
                fi
              fi
            fi

            (( attempt < 30 )) && sleep 10
          done

          [[ "$READY" == true ]] || {
            echo "Session/theme assets did not become ready: status=$LAST_STATUS js=$LAST_JS css=$LAST_CSS" >&2
            exit 1
          }

          ACTIVE_WEB_IMAGE="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_WEB_IMAGE" == '${{ steps.build.outputs.web_image }}' ]] || {
            echo "Active web image mismatch: expected=${{ steps.build.outputs.web_image }} actual=$ACTIVE_WEB_IMAGE" >&2
            exit 1
          }

          echo 'AUTHORITATIVE_SESSION_THEME_WEB_VALIDATION=PASS'

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cat > evidence/authoritative-session-theme-test-deployment.json <<JSON
          {
            "environment": "test",
            "releaseCommit": "${{ steps.release.outputs.target_commit }}",
            "workflowCommit": "${{ github.sha }}",
            "runId": "${{ github.run_id }}",
            "webImage": "${{ steps.build.outputs.web_image }}",
            "previousWebImage": "${{ steps.before.outputs.current_web_image }}",
            "sessionRuntimeHarness": "passed-before-deployment",
            "servedJavaScriptValidation": "passed",
            "servedThemeCssValidation": "passed",
            "apiDeployment": "unchanged",
            "migrations": "unchanged",
            "database": "unchanged"
          }
          JSON

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-session-theme-test-${{ github.run_id }}
          path: evidence/authoritative-session-theme-test-deployment.json
          retention-days: 30

      - name: Restore captured web image on failure
        if: ${{ failure() && steps.deploy_web.outputs.started == 'true' }}
        shell: bash
        run: |
          set +e

          ACTIVE_WEB_IMAGE="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query 'properties.template.containers[0].image' -o tsv 2>/dev/null)"

          if [[ "$ACTIVE_WEB_IMAGE" != '${{ steps.build.outputs.web_image }}' ]]; then
            echo "Rollback skipped because another image is active: $ACTIVE_WEB_IMAGE" >&2
            exit 0
          fi

          SUFFIX="sessthemerb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ROLLBACK_REVISION='${{ vars.AZURE_WEB_APP }}'"--$SUFFIX"
          echo 'Session/theme deployment failed. Restoring the captured web image.' >&2

          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.before.outputs.current_web_image }}' \
            --revision-suffix "$SUFFIX" \
            --output none

          bash control/scripts/wait-containerapp-ready-revision.sh \
            '${{ vars.AZURE_RESOURCE_GROUP }}' \
            '${{ vars.AZURE_WEB_APP }}' \
            "$ROLLBACK_REVISION" \
            '${{ steps.before.outputs.current_web_image }}' 60 10
