name: Build unified Celar context routing repair

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-unified-celar-context-routing-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.event.pull_request.head.ref == 'fix/unified-celar-context-routing-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Apply direct source patch
        run: python3 scripts/temporary/apply_unified_celar_context_routing.py

      - name: Validate Ask Celar public and internal classification
        run: |
          node tests/validate-celar-ai-internal-data-intelligence.mjs
          dotnet run \
            --project tests/CelarAiInternalDataTests/CelarAiInternalDataTests.csproj \
            --configuration Release \
            -p:ProjectPulseSourceRevision=1111111111111111111111111111111111111111

      - name: Validate shared routing and privacy contracts
        run: |
          node src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs
          (
            cd src/frontend/project-time-web
            node scripts/validate-module-033-project-forge.mjs
            node scripts/validate-celar-ai-enterprise-platform.mjs
            node scripts/validate-celar-ai-external-deidentification.mjs
            node scripts/validate-celar-ai-unified-chat-attachments.mjs
            node scripts/validate-module-001-ai-task-grounding.mjs
          )

      - name: Build API Release
        run: |
          dotnet build \
            src/backend/ProjectTime.Api/ProjectTime.Api.csproj \
            --configuration Release \
            -p:ProjectPulseSourceRevision=1111111111111111111111111111111111111111

      - name: Validate exact source boundary
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/backend/ProjectTime.Api/Ai/PulseAiSystemKnowledgeCatalog.cs',
              'tests/CelarAiInternalDataTests/Program.cs',
              'src/backend/ProjectTime.Api/Modules/CelarAiProductionPlatformModule.cs',
              'src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagService.cs',
              'tests/validate-celar-ai-internal-data-intelligence.mjs',
              'src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs',
              'src/frontend/project-time-web/scripts/validate-module-033-project-forge.mjs',
              'docs/modules/module-011-pulse-ai/UNIFIED-CELAR-CONTEXT-ROUTING.md',
              '.github/workflows/bootstrap-unified-celar-context-routing.yml',
              '.github/workflows/bootstrap-unified-celar-context-routing-pr.yml',
              'scripts/temporary/apply_unified_celar_context_routing.py',
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
              if len(line) >= 4
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected files after validation: {sorted(unexpected)}')
          print('UNIFIED_CELAR_CONTEXT_ROUTING_SOURCE_BOUNDARY=PASS')
          PY

      - name: Commit validated source and remove temporary publisher
        shell: bash
        run: |
          rm .github/workflows/bootstrap-unified-celar-context-routing.yml
          rm .github/workflows/bootstrap-unified-celar-context-routing-pr.yml
          rm scripts/temporary/apply_unified_celar_context_routing.py
          rmdir scripts/temporary 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix unified Celar context routing"
          git push origin HEAD:fix/unified-celar-context-routing-20260808
