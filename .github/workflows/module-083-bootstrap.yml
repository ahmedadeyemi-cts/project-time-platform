name: Bootstrap Module 083 Integration

on:
  push:
    branches:
      - 'feature/module-083-full-future-loop-20260809'
    paths:
      - '.github/workflows/module-083-bootstrap.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/module-083-bootstrap.yml'
      - '.module083-bootstrap/**'

permissions:
  contents: write

concurrency:
  group: module-083-bootstrap-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/module-083-full-future-loop-20260809
          fetch-depth: 0
          persist-credentials: true

      - name: Restore packaged Module 083 source
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .module083-bootstrap/payload-part-* | base64 --decode > /tmp/module083-large-files.tar.gz
          echo '6436b287d5813f3b7b07ac8acfda51852be0fd76e98f68b4bcba3c074ad6b4c3  /tmp/module083-large-files.tar.gz' | sha256sum -c -
          tar -xzf /tmp/module083-large-files.tar.gz -C .
          rm -rf .module083-bootstrap

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-fund

      - name: Apply the idempotent Module 083 integration
        run: node src/frontend/project-time-web/scripts/inject-module-083-full-future-loop.mjs

      - name: Regenerate the authoritative Module 001 application source
        working-directory: src/frontend/project-time-web
        run: node ./scripts/generate-module-001-integrated-app.mjs

      - name: Validate integrated Module 083 source
        run: node src/frontend/project-time-web/scripts/validate-module-083-full-future-loop.mjs

      - name: Commit integrated source and remove this one-time bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/module-083-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes were required.'
            exit 0
          fi
          git commit -m 'Integrate Module 083 into the Pulse runtime'
          git push origin HEAD:feature/module-083-full-future-loop-20260809
