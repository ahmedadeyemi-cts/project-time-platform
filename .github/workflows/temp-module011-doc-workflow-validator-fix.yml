name: Temporary Module 011 Documentation Workflow Validator Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/module011-doc-validator-cleanup-trigger'

permissions:
  contents: write

concurrency:
  group: projectpulse-temp-module011-doc-validator-cleanup
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor == 'ahmedadeyemi-cts'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact cleanup branch
        uses: actions/checkout@v5
        with:
          ref: chore/remove-temporary-integration-workflows-20260729
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Merge current main and correct Module 011 documentation-workflow classification
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED_HEAD='9b0961cf4e8ff717da5d65802af54378ec6cd5d6'
          TARGET_BRANCH='chore/remove-temporary-integration-workflows-20260729'
          HELPER='.github/workflows/temp-module011-doc-workflow-validator-fix.yml'

          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]]
          git config user.name 'ProjectPulse Source Integration'
          git config user.email 'projectpulse-integration@users.noreply.github.com'
          git fetch origin main "$TARGET_BRANCH" --no-tags
          git merge --no-ff origin/main -m 'Reconcile temporary-workflow cleanup with documentation publication'

          python3 - <<'PY'
          from pathlib import Path

          validator = Path('src/frontend/project-time-web/scripts/validate-module-011-pulse-ai.mjs')
          source = validator.read_text()
          old = """const pulseAiDeploymentWorkflows = walk('.github/workflows').filter((relative) => /(?:module[-_]?011|pulse[-_]?ai)/i.test(relative));
          assert(
            'NO_DEPLOYMENT_WORKFLOW',
            pulseAiDeploymentWorkflows.length === 0,
            pulseAiDeploymentWorkflows.length === 0
              ? 'no Module 011 deployment or environment-changing workflow exists'
              : `unexpected workflow paths: ${pulseAiDeploymentWorkflows.join(', ')}`
          );
          """
          new = """const pulseAiWorkflowPaths = walk('.github/workflows').filter((relative) =>
            /(?:module[-_]?011|pulse[-_]?ai)/i.test(relative)
          );
          const documentationPublicationWorkflow = '.github/workflows/publish-pulse-ai-architecture-v1-1.yml';
          const documentationWorkflowSource = exists(documentationPublicationWorkflow)
            ? read(documentationPublicationWorkflow)
            : '';
          const pulseAiEnvironmentWorkflows = pulseAiWorkflowPaths.filter((relative) => {
            if (relative === documentationPublicationWorkflow) {
              return /azure\\/login|projectpulse-deploy-|az\\s+containerapp|run[-_ ]?migration|provider[-_ ]?secret|vector[-_ ]?index/i
                .test(documentationWorkflowSource);
            }
            return /(?:deploy|migration|azure|entra|container)/i.test(relative);
          });
          assert(
            'NO_DEPLOYMENT_WORKFLOW',
            pulseAiEnvironmentWorkflows.length === 0,
            pulseAiEnvironmentWorkflows.length === 0
              ? 'no Module 011 deployment or environment-changing workflow exists; documentation publication is source-only'
              : `unexpected environment-changing workflow paths: ${pulseAiEnvironmentWorkflows.join(', ')}`
          );
          assert(
            'ARCHITECTURE_WORKFLOW_DOCUMENTATION_ONLY',
            !exists(documentationPublicationWorkflow)
              || (
                documentationWorkflowSource.includes('docs/modules/module-011-pulse-ai/architecture/v1.1/')
                && documentationWorkflowSource.includes('PULSE_AI_ARCHITECTURE_DOCUMENT_VALIDATION=PASSED')
                && !/azure\\/login|projectpulse-deploy-|az\\s+containerapp|run[-_ ]?migration|provider[-_ ]?secret|vector[-_ ]?index/i
                  .test(documentationWorkflowSource)
              ),
            exists(documentationPublicationWorkflow)
              ? 'the architecture workflow is limited to documentation generation, validation, checksums, and branch publication'
              : 'no architecture publication workflow is present in this build context'
          );
          """
          if old not in source:
              raise SystemExit('Expected broad Module 011 workflow assertion was not found.')
          validator.write_text(source.replace(old, new))
          PY

          git rm "$HELPER"
          git add src/frontend/project-time-web/scripts/validate-module-011-pulse-ai.mjs
          git diff --cached --check
          git commit -m 'Allow source-only Pulse AI architecture publication workflow'

      - name: Validate exact cleanup scope and frontend build
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD | sort)
          cat > /tmp/expected-cleanup-files.txt <<'EOF'
          .github/workflows/current-integration-bundle-temp.yml
          .github/workflows/temp-current-integration-bundle-v2.yml
          .github/workflows/temp-module011-doc-workflow-validator-fix.yml
          .github/workflows/temp-pr221-reconcile.yml
          .github/workflows/temp-pr238-validator-repair.yml
          .github/workflows/temp-pr240-reconcile.yml
          .github/workflows/temp-pr240-validator-scope-fix.yml
          src/frontend/project-time-web/scripts/validate-module-011-pulse-ai.mjs
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/expected-cleanup-files.txt
          sort -o /tmp/expected-cleanup-files.txt /tmp/expected-cleanup-files.txt
          diff -u /tmp/expected-cleanup-files.txt <(printf '%s\n' "${CHANGED[@]}")

          for removed in \
            .github/workflows/current-integration-bundle-temp.yml \
            .github/workflows/temp-current-integration-bundle-v2.yml \
            .github/workflows/temp-module011-doc-workflow-validator-fix.yml \
            .github/workflows/temp-pr221-reconcile.yml \
            .github/workflows/temp-pr238-validator-repair.yml \
            .github/workflows/temp-pr240-reconcile.yml \
            .github/workflows/temp-pr240-validator-scope-fix.yml; do
            test ! -e "$removed"
          done

          pushd src/frontend/project-time-web >/dev/null
          node --check scripts/validate-module-011-pulse-ai.mjs
          node scripts/validate-module-011-pulse-ai.mjs
          npm ci --no-audit --no-fund
          npm run build
          popd >/dev/null
          git diff --check origin/main...HEAD

      - name: Push corrected cleanup branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin HEAD:chore/remove-temporary-integration-workflows-20260729
          echo "CLEANUP_CORRECTED_HEAD=$(git rev-parse HEAD)"
