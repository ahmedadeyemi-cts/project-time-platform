name: Diagnose Jason Assigned Work Runtime

on:
  push:
    branches:
      - diagnostic/jason-assigned-work-runtime-20260818
    paths:
      - '.github/workflows/diagnose-jason-assigned-work-runtime.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-jason-assigned-work-runtime
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture protected-Test assigned-work evidence
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: https://phd-west-test.onenecklab.com
      EVIDENCE_DIR: /tmp/jason-assigned-work-runtime
      JASON_EMAIL: jason.mosier@ussignal.local
      WEEK_START: '2026-08-16'
      REPORTED_SERVICE_REQUEST: SR-8C81ACA3

    steps:
      - name: Authenticate as Jason and capture read-only runtime contracts
        shell: bash
        env:
          TEST_LOGIN_PASSWORD: ${{ secrets.PROJECTPULSE_M087_PASSWORD }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          [[ "$BASE" == 'https://phd-west-test.onenecklab.com' ]] || fail 'Diagnostic is restricted to protected Test.'
          [[ ${#TEST_LOGIN_PASSWORD} -ge 12 ]] || fail 'Protected-Test login credential is unavailable.'
          install -d -m 0700 "$EVIDENCE_DIR"

          LOGIN_PAYLOAD="$(mktemp)"
          LOGIN_RESPONSE="$(mktemp)"
          chmod 0600 "$LOGIN_PAYLOAD" "$LOGIN_RESPONSE"
          jq -n --arg username "$JASON_EMAIL" --arg password "$TEST_LOGIN_PASSWORD" \
            '{username:$username,password:$password}' > "$LOGIN_PAYLOAD"
          LOGIN_STATUS="$(curl -sS --max-time 90 -o "$LOGIN_RESPONSE" -w '%{http_code}' \
            -H 'Cache-Control: no-cache' -H 'Content-Type: application/json' \
            -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
            --data-binary @"$LOGIN_PAYLOAD" "$BASE/api/auth/local/login" || true)"
          rm -f "$LOGIN_PAYLOAD"
          [[ "$LOGIN_STATUS" == 200 ]] || {
            jq 'del(.sessionToken,.token,.password)' "$LOGIN_RESPONSE" > "$EVIDENCE_DIR/login-failure-redacted.json" 2>/dev/null || true
            fail "Jason login returned HTTP $LOGIN_STATUS."
          }
          jq -e '.provider == "LOCAL" and .mustChangePassword == false and (.sessionToken | type == "string" and length > 0)' \
            "$LOGIN_RESPONSE" >/dev/null || fail 'Jason login response did not satisfy the session contract.'
          SESSION_TOKEN="$(jq -r '.sessionToken' "$LOGIN_RESPONSE")"
          echo "::add-mask::$SESSION_TOKEN"
          jq 'del(.sessionToken,.token,.password)' "$LOGIN_RESPONSE" > "$EVIDENCE_DIR/jason-login-redacted.json"
          rm -f "$LOGIN_RESPONSE"
          unset TEST_LOGIN_PASSWORD

          auth_get() {
            local name="$1" module="$2" path="$3" output="$4"
            local status
            status="$(curl -sS --http1.1 --connect-timeout 20 --max-time 120 \
              -o "$output" -w '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H "Authorization: Bearer $SESSION_TOKEN" \
              -H "X-ProjectPulse-Session: $SESSION_TOKEN" \
              -H "X-ProjectPulse-Module-Number: $module" \
              -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
              "$BASE$path" || true)"
            jq -n --arg name "$name" --arg module "$module" --arg path "$path" --arg status "$status" \
              '{name:$name,module:$module,path:$path,httpStatus:$status}' >> "$EVIDENCE_DIR/http-status.ndjson"
            if [[ "$status" == 200 ]]; then
              jq -e . "$output" >/dev/null || fail "$name returned invalid JSON."
            fi
            printf '%s' "$status"
          }

          SECURITY_STATUS="$(auth_get 'security-context' '001' '/api/security/context' "$EVIDENCE_DIR/security-context.json")"
          WORK_QUEUE_STATUS="$(auth_get 'timesheet-work-queue' '001' "/api/timesheet/work-queue?weekStart=$WEEK_START" "$EVIDENCE_DIR/timesheet-work-queue.json")"
          WEEKLY_LINES_STATUS="$(auth_get 'timesheet-weekly-lines' '001' "/api/timesheet/weekly-lines?weekStart=$WEEK_START" "$EVIDENCE_DIR/timesheet-weekly-lines.json")"
          CLOSEOUT_STATUS="$(auth_get 'engineer-task-closeout' '001A' '/api/engineer-task-closeout/overview' "$EVIDENCE_DIR/engineer-task-closeout.json")"
          WORKSPACE_STATUS="$(auth_get 'engineering-workspace' '019' '/api/project-workspace/overview' "$EVIDENCE_DIR/project-workspace.json")"
          REGISTER_STATUS="$(auth_get 'work-register' '055C' '/api/work-register/overview' "$EVIDENCE_DIR/work-register.json")"

          JASON_USER_ID="$(jq -r '.userId // empty' "$EVIDENCE_DIR/security-context.json" 2>/dev/null || true)"
          WORK_QUEUE_COUNT="$(jq -r '.count // (.tasks | length) // -1' "$EVIDENCE_DIR/timesheet-work-queue.json" 2>/dev/null || echo -1)"
          WORK_QUEUE_MATCH="$(jq -r --arg sr "$REPORTED_SERVICE_REQUEST" '[.tasks[]? | select((.projectCode // "") == $sr or (.serviceRequestNumber // "") == $sr or ((.projectCode // "") | contains($sr)))] | length' "$EVIDENCE_DIR/timesheet-work-queue.json" 2>/dev/null || echo -1)"
          CLOSEOUT_ACTIVE_COUNT="$(jq -r '.summary.activeCount // (.active | length) // -1' "$EVIDENCE_DIR/engineer-task-closeout.json" 2>/dev/null || echo -1)"
          CLOSEOUT_MATCH="$(jq -r --arg sr "$REPORTED_SERVICE_REQUEST" '[.active[]?, .history[]? | select((.projectCode // "") == $sr or (.serviceRequestNumber // "") == $sr)] | length' "$EVIDENCE_DIR/engineer-task-closeout.json" 2>/dev/null || echo -1)"
          WORKSPACE_PROJECT_COUNT="$(jq -r '.summary.projectCount // (.projects | length) // -1' "$EVIDENCE_DIR/project-workspace.json" 2>/dev/null || echo -1)"
          WORKSPACE_ASSIGNMENT_COUNT="$(jq -r '.summary.assignmentCount // (.assignments | length) // -1' "$EVIDENCE_DIR/project-workspace.json" 2>/dev/null || echo -1)"
          WORKSPACE_MATCH="$(jq -r --arg sr "$REPORTED_SERVICE_REQUEST" '[.projects[]?, .assignments[]? | select((.projectCode // "") == $sr or (.serviceRequestNumber // "") == $sr)] | length' "$EVIDENCE_DIR/project-workspace.json" 2>/dev/null || echo -1)"
          REGISTER_MATCH="$(jq -r --arg sr "$REPORTED_SERVICE_REQUEST" '[.workItems[]? | select((.projectCode // "") == $sr or (.projectNumber // "") == $sr or (.serviceRequestNumber // "") == $sr)] | length' "$EVIDENCE_DIR/work-register.json" 2>/dev/null || echo -1)"

          jq -n \
            --arg identity "$JASON_EMAIL" \
            --arg userId "$JASON_USER_ID" \
            --arg serviceRequest "$REPORTED_SERVICE_REQUEST" \
            --arg securityStatus "$SECURITY_STATUS" \
            --arg workQueueStatus "$WORK_QUEUE_STATUS" \
            --arg weeklyLinesStatus "$WEEKLY_LINES_STATUS" \
            --arg closeoutStatus "$CLOSEOUT_STATUS" \
            --arg workspaceStatus "$WORKSPACE_STATUS" \
            --arg registerStatus "$REGISTER_STATUS" \
            --argjson workQueueCount "$WORK_QUEUE_COUNT" \
            --argjson workQueueMatch "$WORK_QUEUE_MATCH" \
            --argjson closeoutActiveCount "$CLOSEOUT_ACTIVE_COUNT" \
            --argjson closeoutMatch "$CLOSEOUT_MATCH" \
            --argjson workspaceProjectCount "$WORKSPACE_PROJECT_COUNT" \
            --argjson workspaceAssignmentCount "$WORKSPACE_ASSIGNMENT_COUNT" \
            --argjson workspaceMatch "$WORKSPACE_MATCH" \
            --argjson registerMatch "$REGISTER_MATCH" \
            '{
              environment:"protected-test",
              identity:$identity,
              authenticatedUserId:$userId,
              serviceRequest:$serviceRequest,
              http:{security:$securityStatus,workQueue:$workQueueStatus,weeklyLines:$weeklyLinesStatus,closeout:$closeoutStatus,workspace:$workspaceStatus,workRegister:$registerStatus},
              counts:{workQueue:$workQueueCount,workQueueServiceRequestMatch:$workQueueMatch,closeoutActive:$closeoutActiveCount,closeoutServiceRequestMatch:$closeoutMatch,workspaceProjects:$workspaceProjectCount,workspaceAssignments:$workspaceAssignmentCount,workspaceServiceRequestMatch:$workspaceMatch,workRegisterServiceRequestMatch:$registerMatch},
              mutation:false
            }' > "$EVIDENCE_DIR/diagnostic-summary.json"

          LOGOUT_STATUS="$(curl -sS --max-time 60 -o "$EVIDENCE_DIR/logout.json" -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $SESSION_TOKEN" -H "X-ProjectPulse-Session: $SESSION_TOKEN" \
            -H 'X-ProjectPulse-Module-Number: 001' -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
            "$BASE/api/auth/session/logout" || true)"
          jq -n --arg status "$LOGOUT_STATUS" '{httpStatus:$status}' > "$EVIDENCE_DIR/logout-status.json"
          unset SESSION_TOKEN
          jq . "$EVIDENCE_DIR/diagnostic-summary.json"

      - name: Upload sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jason-assigned-work-runtime-evidence
          path: /tmp/jason-assigned-work-runtime
          if-no-files-found: error
          retention-days: 1
