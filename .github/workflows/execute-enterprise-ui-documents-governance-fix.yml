name: Execute Enterprise UI Documents and Governance Corrections

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/execute-enterprise-ui-documents-governance-fix.yml'
      - 'scripts/apply-enterprise-ui-documents-governance-fix.py'
      - 'src/frontend/project-time-web/scripts/validate-project-workspace-document-download.mjs'
  push:
    branches:
      - fix/enterprise-ui-documents-governance-20260809
    paths:
      - '.github/workflows/execute-enterprise-ui-documents-governance-fix.yml'
      - 'scripts/apply-enterprise-ui-documents-governance-fix.py'
      - 'src/frontend/project-time-web/scripts/validate-project-workspace-document-download.mjs'

permissions:
  contents: write

concurrency:
  group: execute-enterprise-ui-documents-governance-fix
  cancel-in-progress: false

jobs:
  execute:
    name: Execute, validate, and commit bounded corrections
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out exact correction branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/enterprise-ui-documents-governance-20260809
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded source corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-enterprise-ui-documents-governance-fix.py')
          source = path.read_text(encoding='utf-8')

          old_risk = 'risk.residual_impact_score,risk.residual_exposure'
          new_risk = 'risk.risk_status,risk.residual_probability_score,risk.residual_impact_score,risk.residual_exposure'
          risk_count = source.count(old_risk)
          if risk_count != 2:
              raise SystemExit(f'Expected two Module 082 patch literals, found {risk_count}.')
          source = source.replace(old_risk, new_risk)

          old_surface = '<div className="billing-readiness-center"'
          new_surface = '<section className="billing-readiness-center"'
          surface_count = source.count(old_surface)
          if surface_count != 1:
              raise SystemExit(f'Expected one Module 039 presentation anchor, found {surface_count}.')
          source = source.replace(old_surface, new_surface)

          terminal_guard = 'if conditional_count < 4:'
          if source.count(terminal_guard) != 1:
              raise SystemExit('Expected one Module 019 terminal-state count guard.')
          source = source.replace(terminal_guard, 'if conditional_count < 2:', 1)

          path.write_text(source, encoding='utf-8')
          PY
          python3 -m py_compile scripts/apply-enterprise-ui-documents-governance-fix.py
          python3 scripts/apply-enterprise-ui-documents-governance-fix.py
          git diff --check

      - name: Validate focused contracts and full builds
        shell: bash
        run: |
          set -Eeuo pipefail
          node src/frontend/project-time-web/scripts/validate-enterprise-ui-documents-governance.mjs
          node src/frontend/project-time-web/scripts/validate-module-081-lab-equipment-tracker.mjs
          node src/frontend/project-time-web/scripts/validate-module-082-project-risk-register.mjs
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          npm --prefix src/frontend/project-time-web ci
          npm --prefix src/frontend/project-time-web run build
          git diff --check

      - name: Commit validated corrections and remove temporary executors
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/apply-enterprise-ui-documents-governance-fix.yml \
            .github/workflows/execute-enterprise-ui-documents-governance-fix.yml \
            scripts/apply-enterprise-ui-documents-governance-fix.py
          git add -A
          git diff --cached --check
          git config user.name 'Pulse Enterprise Automation'
          git config user.email 'pulse-enterprise-automation@users.noreply.github.com'
          git commit -m 'fix: harden enterprise UI, documents, and governance'
          git push origin HEAD:fix/enterprise-ui-documents-governance-20260809
