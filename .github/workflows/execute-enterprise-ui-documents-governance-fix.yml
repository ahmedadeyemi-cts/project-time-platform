name: Execute Enterprise UI Documents and Governance Corrections

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/execute-enterprise-ui-documents-governance-fix.yml'
      - '.github/workflows/apply-enterprise-ui-documents-governance-fix.yml'
  push:
    branches:
      - fix/enterprise-ui-documents-governance-20260809
    paths:
      - '.github/workflows/execute-enterprise-ui-documents-governance-fix.yml'

permissions:
  contents: write

concurrency:
  group: execute-enterprise-ui-documents-governance-fix
  cancel-in-progress: false

jobs:
  execute:
    name: Execute, validate, and commit bounded corrections
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out exact correction branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/enterprise-ui-documents-governance-20260809
          fetch-depth: 0
          persist-credentials: true

      - name: Execute reviewed patch and validation scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/apply-enterprise-ui-documents-governance-fix.yml")
            steps = workflow.fetch("jobs").fetch("patch").fetch("steps")
            ["Apply bounded source corrections", "Validate focused contracts and full builds"].each do |name|
              step = steps.find { |candidate| candidate["name"] == name }
              abort("Missing reviewed workflow step: #{name}") unless step && step["run"]
              path = "/tmp/#{name.downcase.gsub(/[^a-z0-9]+/, "-")}.sh"
              File.write(path, "set -Eeuo pipefail\n" + step["run"])
              system("bash", path) or abort("Reviewed step failed: #{name}")
            end
          '

      - name: Commit validated corrections and remove temporary executors
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/apply-enterprise-ui-documents-governance-fix.yml \
            .github/workflows/execute-enterprise-ui-documents-governance-fix.yml
          git add -A
          git diff --cached --check
          git config user.name 'Pulse Enterprise Automation'
          git config user.email 'pulse-enterprise-automation@users.noreply.github.com'
          git commit -m 'fix: harden enterprise UI, documents, and governance'
          git push origin HEAD:fix/enterprise-ui-documents-governance-20260809
