name: User Guide Coverage CI

on:
  pull_request:
    paths:
      - '.github/workflows/user-guide-coverage-ci.yml'
      - 'src/frontend/project-time-web/src/**'
      - 'src/frontend/project-time-web/scripts/*guide*'
      - 'src/frontend/project-time-web/package*.json'
      - 'docs/user-guide/**'

permissions:
  contents: read

concurrency:
  group: user-guide-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate authored module and role coverage
        working-directory: src/frontend/project-time-web
        run: |
          node scripts/validate-user-guide.mjs --output "$RUNNER_TEMP/user-guide-evidence/coverage.json"
          node scripts/export-user-guide.mjs --output "$RUNNER_TEMP/user-guide-evidence/PULSE-USER-GUIDE.md"
      - name: Build the complete frontend and preserve source stability
        working-directory: src/frontend/project-time-web
        run: |
          npm ci
          npm run build
          git diff --exit-code
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/user-guide-node" --no-audit --no-fund --save-exact esbuild@0.25.12
          python3 -m venv "$RUNNER_TEMP/user-guide-venv"
          "$RUNNER_TEMP/user-guide-venv/bin/pip" install playwright==1.55.0
          "$RUNNER_TEMP/user-guide-venv/bin/python" -m playwright install --with-deps chromium firefox
      - name: Build the isolated generated-guide browser fixture
        working-directory: src/frontend/project-time-web
        run: |
          USER_GUIDE_ESBUILD_MODULE="$RUNNER_TEMP/user-guide-node/node_modules/esbuild" \
            node scripts/build-user-guide-browser-fixture.mjs --output "$RUNNER_TEMP/user-guide-fixture"
          git diff --exit-code
      - name: Verify generated guide, role boundaries, search, print and theme contrast
        working-directory: src/frontend/project-time-web
        run: |
          "$RUNNER_TEMP/user-guide-venv/bin/python" scripts/validate-user-guide-browser.py \
            --fixture "$RUNNER_TEMP/user-guide-fixture" --output "$RUNNER_TEMP/user-guide-evidence/browser"
      - name: Retain guide reference and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: user-guide-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/user-guide-evidence
          if-no-files-found: error
          retention-days: 7
