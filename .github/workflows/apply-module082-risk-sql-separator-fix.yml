name: Apply Module 082 Risk SQL Separator Correction

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/apply-module082-risk-sql-separator-fix.yml'
  push:
    branches:
      - fix/module082-risk-sql-separator-20260810
    paths:
      - '.github/workflows/apply-module082-risk-sql-separator-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-module082-risk-sql-separator-fix
  cancel-in-progress: false

jobs:
  patch:
    name: Patch, validate, and commit Module 082 SQL correction
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact source branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/module082-risk-sql-separator-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact SQL token-boundary correction and regression guard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          backend_path = Path('src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs')
          backend = backend_path.read_text(encoding='utf-8')
          old = 'var sql = ScopedProjectsCte + RiskSelect + $"""'
          new = 'var sql = ScopedProjectsCte + RiskSelect + "\\n" + $"""'
          count = backend.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one ambiguous RiskSelect concatenation, found {count}.')
          backend = backend.replace(old, new, 1)
          if 'RiskSelect + $"""' in backend:
              raise SystemExit('Ambiguous RiskSelect concatenation remains.')
          backend_path.write_text(backend, encoding='utf-8')

          validator_path = Path('src/frontend/project-time-web/scripts/validate-module-082-project-risk-register.mjs')
          validator = validator_path.read_text(encoding='utf-8')
          anchor = "test('RUNTIME_READINESS',backend.includes('077_module_082_enterprise_project_risk_register')&&backend.includes('RuntimeReadyAsync')&&backend.includes('dataReady'));"
          addition = "test('RISK_SQL_TOKEN_BOUNDARY',backend.includes('RiskSelect + \\\"\\\\n\\\" + $\\\"\\\"\\\"')&&!backend.includes('RiskSelect + $\\\"\\\"\\\"'));"
          if validator.count(anchor) != 1:
              raise SystemExit('Module 082 validator readiness anchor was not unique.')
          if 'RISK_SQL_TOKEN_BOUNDARY' in validator:
              raise SystemExit('Module 082 SQL token-boundary test already exists.')
          validator = validator.replace(anchor, anchor + '\n' + addition, 1)
          validator_path.write_text(validator, encoding='utf-8')
          PY

          grep -Fq 'RiskSelect + "\n" + $"""' src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs
          ! grep -Fq 'RiskSelect + $"""' src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs
          grep -Fq 'RISK_SQL_TOKEN_BOUNDARY' src/frontend/project-time-web/scripts/validate-module-082-project-risk-register.mjs
          git diff --check

      - name: Validate focused contract and production builds
        shell: bash
        run: |
          set -Eeuo pipefail
          node src/frontend/project-time-web/scripts/validate-module-082-project-risk-register.mjs
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          npm --prefix src/frontend/project-time-web ci
          npm --prefix src/frontend/project-time-web run build
          git diff --check

      - name: Commit corrected source and remove one-time diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/apply-module082-risk-sql-separator-fix.yml \
            .github/workflows/diagnose-module082-risk-test.yml
          git add -A
          git diff --cached --check
          git config user.name 'Pulse Enterprise Automation'
          git config user.email 'pulse-enterprise-automation@users.noreply.github.com'
          git commit -m 'fix: preserve Module 082 risk SQL token boundary'
          git push origin HEAD:fix/module082-risk-sql-separator-20260810
