name: PR 680 Safe Frontend Build Repair

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/pr680-auto-repair-v2.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr680-safe-frontend-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/systemwide-enterprise-reliability-final-20260814
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Install exact frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Safely isolate and repair one build-breaking frontend hunk
        shell: bash
        env:
          TARGET_BRANCH: fix/systemwide-enterprise-reliability-final-20260814
        run: |
          set -Eeuo pipefail
          git fetch origin main "$TARGET_BRANCH" --no-tags
          HEAD_SHA="$(git rev-parse HEAD)"
          BASE_REF='origin/main'
          export HEAD_SHA BASE_REF

          python3 - <<'PY'
          from __future__ import annotations

          import os
          import re
          import subprocess
          import sys
          from dataclasses import dataclass
          from pathlib import Path

          repo = Path.cwd()
          frontend = repo / 'src/frontend/project-time-web'
          head_sha = os.environ['HEAD_SHA']
          base_ref = os.environ['BASE_REF']
          evidence = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'pr680-safe-repair'
          evidence.mkdir(parents=True, exist_ok=True)

          def run(cmd: list[str], *, cwd: Path = repo, timeout: int = 1200, check: bool = False):
              proc = subprocess.run(
                  cmd,
                  cwd=cwd,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )
              if check and proc.returncode != 0:
                  raise RuntimeError(f"Command failed ({proc.returncode}): {' '.join(cmd)}\n{proc.stdout[-8000:]}")
              return proc

          def reset() -> None:
              run(['git', 'reset', '--hard', head_sha], check=True)
              run(['git', 'clean', '-fd'], check=True)

          def normalize_main_import_order() -> bool:
              path = frontend / 'src/main.jsx'
              text = path.read_text()
              reliability = "import './enterprise-systemwide-reliability.css';"
              contrast = "import './enterprise-contrast-guard.css';"
              lines = text.splitlines()
              changed = False
              for target in (reliability, contrast):
                  count = lines.count(target)
                  if count > 1:
                      first = lines.index(target)
                      lines = [line for index, line in enumerate(lines) if line != target or index == first]
                      changed = True
              if reliability not in lines:
                  insert_at = max((i for i, line in enumerate(lines) if line.startswith("import '") and line.endswith(".css';")), default=-1) + 1
                  lines.insert(insert_at, reliability)
                  changed = True
              if contrast not in lines:
                  insert_at = max((i for i, line in enumerate(lines) if line.startswith("import '") and line.endswith(".css';")), default=-1) + 1
                  lines.insert(insert_at, contrast)
                  changed = True
              rel_index = lines.index(reliability)
              contrast_index = lines.index(contrast)
              css_indices = [i for i, line in enumerate(lines) if line.startswith("import '") and line.endswith(".css';")]
              last_css = max(css_indices)
              if contrast_index != last_css or rel_index > contrast_index:
                  lines = [line for line in lines if line not in (reliability, contrast)]
                  insert_at = max((i for i, line in enumerate(lines) if line.startswith("import '") and line.endswith(".css';")), default=-1) + 1
                  lines[insert_at:insert_at] = [reliability, contrast]
                  changed = True
              if changed:
                  path.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''))
              return changed

          def build(label: str) -> tuple[bool, str]:
              proc = run(['npm', 'run', 'build'], cwd=frontend, timeout=1800)
              log = evidence / f'{label}.log'
              log.write_text(proc.stdout)
              return proc.returncode == 0, proc.stdout

          def validate_candidate(label: str) -> bool:
              ok, _ = build(label)
              if not ok:
                  return False
              for index, command in enumerate((
                  ['node', 'tests/validate-systemwide-enterprise-reliability.mjs'],
                  ['node', 'tests/validate-celar-ai-flowhive-authoritative-release.mjs'],
              )):
                  proc = run(command, timeout=300)
                  (evidence / f'{label}-contract-{index}.log').write_text(proc.stdout)
                  if proc.returncode != 0:
                      return False
              diff_check = run(['git', 'diff', '--check'])
              (evidence / f'{label}-diff-check.log').write_text(diff_check.stdout)
              return diff_check.returncode == 0

          reset()
          normalized = normalize_main_import_order()
          if normalized:
              normalized_patch = run(['git', 'diff', '--binary']).stdout
              if validate_candidate('normalized-main'):
                  reset()
                  normalize_main_import_order()
                  (evidence / 'selected.patch').write_text(run(['git', 'diff', '--binary']).stdout)
                  (evidence / 'result.txt').write_text('repair=normalized-main-import-order\n')
                  sys.exit(0)
              reset()

          baseline_ok, baseline_log = build('baseline')
          if baseline_ok:
              reset()
              (evidence / 'result.txt').write_text('repair=not-required-build-already-green\n')
              sys.exit(0)
          reset()

          changed = run([
              'git', 'diff', '--name-only', f'{base_ref}...{head_sha}', '--',
              'src/frontend/project-time-web/src',
              'src/frontend/project-time-web/scripts',
          ], check=True).stdout.splitlines()
          candidates = [
              path for path in changed
              if path.endswith(('.js', '.jsx', '.css', '.mjs'))
              and not path.endswith('App.Module001.g.jsx')
          ]

          # Prefer the files directly touched by the reliability package and the
          # source entry point before considering broader shared files.
          priority = {
              'src/frontend/project-time-web/src/main.jsx': 0,
              'src/frontend/project-time-web/src/enterprise-systemwide-reliability.css': 1,
              'src/frontend/project-time-web/src/EnterpriseExperienceController.jsx': 2,
              'src/frontend/project-time-web/src/HelpAssistant.jsx': 3,
              'src/frontend/project-time-web/src/ProjectFlowHiveCenter.jsx': 4,
              'src/frontend/project-time-web/src/ProjectForgeFlowHiveSyncPortal.jsx': 5,
              'src/frontend/project-time-web/src/CostOverrunAlertCenter.jsx': 6,
              'src/frontend/project-time-web/src/AuditHistoryPanel.jsx': 7,
              'src/frontend/project-time-web/src/BillingReadinessCenter.jsx': 8,
              'src/frontend/project-time-web/src/enterprise/SalesDeliveryWorkflowCenter.jsx': 9,
          }
          candidates.sort(key=lambda path: (priority.get(path, 100), path))

          # First determine whether a single changed file contains the failure.
          culprit: str | None = None
          for index, path in enumerate(candidates):
              reset()
              tracked_on_base = run(['git', 'cat-file', '-e', f'{base_ref}:{path}']).returncode == 0
              if tracked_on_base:
                  run(['git', 'checkout', base_ref, '--', path], check=True)
              else:
                  Path(path).unlink(missing_ok=True)
              if validate_candidate(f'file-{index:02d}'):
                  culprit = path
                  break
          reset()

          if culprit is None:
              (evidence / 'result.txt').write_text(
                  'repair=not-applied\nreason=no-single-file-safe-candidate\n'
              )
              raise SystemExit('No single-file source candidate restored the complete build and PR contracts.')

          diff = run([
              'git', 'diff', '--unified=0', '--no-ext-diff', f'{base_ref}...{head_sha}', '--', culprit
          ], check=True).stdout
          lines = diff.splitlines(keepends=True)
          first_hunk = next((i for i, line in enumerate(lines) if line.startswith('@@ ')), None)
          if first_hunk is None:
              (evidence / 'result.txt').write_text(
                  f'repair=not-applied\nreason=no-text-hunks\nculprit={culprit}\n'
              )
              raise SystemExit(f'No text hunks were available for safe isolation in {culprit}.')
          header = lines[:first_hunk]
          hunks: list[list[str]] = []
          current: list[str] = []
          for line in lines[first_hunk:]:
              if line.startswith('@@ '):
                  if current:
                      hunks.append(current)
                  current = [line]
              else:
                  current.append(line)
          if current:
              hunks.append(current)

          selected_patch: str | None = None
          selected_index: int | None = None
          for index, hunk in enumerate(hunks):
              reset()
              patch_text = ''.join(header + hunk)
              patch_file = evidence / f'hunk-{index:03d}.patch'
              patch_file.write_text(patch_text)
              reverse = run(['git', 'apply', '-R', '--unidiff-zero', str(patch_file)])
              (evidence / f'hunk-{index:03d}-apply.log').write_text(reverse.stdout)
              if reverse.returncode != 0:
                  continue
              if validate_candidate(f'hunk-{index:03d}'):
                  selected_patch = patch_text
                  selected_index = index
                  break
          reset()

          if selected_patch is None:
              (evidence / 'result.txt').write_text(
                  f'repair=not-applied\nreason=no-single-hunk-safe-candidate\nculprit={culprit}\n'
              )
              raise SystemExit(
                  f'{culprit} contains the failure, but no single hunk can be safely reverted while retaining all contracts.'
              )

          selected_file = evidence / 'selected.patch'
          selected_file.write_text(selected_patch)
          applied = run(['git', 'apply', '-R', '--unidiff-zero', str(selected_file)])
          if applied.returncode != 0:
              raise SystemExit(f'Unable to apply selected safe hunk for {culprit}.')

          # Re-run the complete gate one final time, then restore only the selected
          # source correction so generated build artifacts never enter the commit.
          if not validate_candidate('final-selected'):
              raise SystemExit('The selected source correction was not stable under the final complete gate.')
          reset()
          applied = run(['git', 'apply', '-R', '--unidiff-zero', str(selected_file)])
          if applied.returncode != 0:
              raise SystemExit('Unable to restore the selected source correction after final validation.')
          run(['git', 'diff', '--check'], check=True)
          (evidence / 'result.txt').write_text(
              f'repair=safe-single-hunk-reversion\nculprit={culprit}\nhunk={selected_index}\n'
          )
          PY

          if git diff --quiet; then
            echo 'PR680_FRONTEND_REPAIR=NO_SOURCE_CHANGE_REQUIRED'
            exit 0
          fi

          git diff --check
          git status --short
          git config user.name 'ChangePoint governed repair'
          git config user.email 'noreply@users.noreply.github.com'
          git add -- \
            src/frontend/project-time-web/src \
            src/frontend/project-time-web/scripts
          git commit -m 'Fix PR 680 frontend production build without weakening gates'
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Upload governed repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr680-safe-frontend-repair-evidence
          path: ${{ runner.temp }}/pr680-safe-repair
          if-no-files-found: warn
          retention-days: 2
