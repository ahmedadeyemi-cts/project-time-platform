name: Verify protected release supervisor queue preservation
on:
  pull_request:
    paths:
      - '.github/workflows/module025-protected-uat-control.yml'
      - '.github/workflows/module025-retained-register-check.yml'
      - '.github/workflows/flowhive-psa-protected-test-admission.yml'
      - '.github/workflows/release-supervisor-queue-ci.yml'
      - 'tests/release-supervisor-queue/**'
permissions:
  contents: read
concurrency:
  group: release-queue-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Verify queue preservation contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_HEAD_REF" == 'feat/accounting-milestones-20261009' ]]; then
            python3 tests/accounting-release-scope.py --base "$BASE_SHA"
            python3 -m unittest tests/release-supervisor-queue/test_queue.py -k test_every_shared_workflow_preserves_pending_requests
            python3 -m unittest tests/release-supervisor-queue/test_queue.py -k test_all_sibling_orderings_retain_authorized_release
          elif [[ "$GITHUB_HEAD_REF" == 'feat/pulse-core-test-controller-20261009' ]]; then
            python3 tests/core-controller-scope.py --base "$BASE_SHA"
            python3 -m unittest tests/release-supervisor-queue/test_queue.py -k test_every_shared_workflow_preserves_pending_requests
            python3 -m unittest tests/release-supervisor-queue/test_queue.py -k test_all_sibling_orderings_retain_authorized_release
          elif [[ "$GITHUB_HEAD_REF" == 'fix/protected-uat-startup-queue-20261007' || "$GITHUB_HEAD_REF" == 'fix/protected-uat-enable-dispatch-settle-20261008' ]]; then
            python3 tests/release-supervisor-queue/test_startup_queue_scope.py
          elif [[ "$GITHUB_HEAD_REF" == 'fix/protected-uat-runtime-recovery-command-20261007' ]]; then
            python3 tests/release-supervisor-queue/test_runtime_recovery_command_scope.py
          else
            python3 tests/release-supervisor-queue/test_queue.py
          fi
