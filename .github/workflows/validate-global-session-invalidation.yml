name: Validate Module 008 Stability, Authoritative Fallback and Theme Dock

on:
  push:
    branches:
      - 'hotfix/module-008-stable-route-authoritative-fallback-theme-dock-*'
  pull_request:
    paths:
      - 'src/frontend/project-time-web/src/projectpulse-authoritative-api.js'
      - 'src/frontend/project-time-web/src/AuditHistoryPanel.jsx'
      - 'src/frontend/project-time-web/src/admin-experience-theme.css'
      - 'src/frontend/project-time-web/scripts/validate-global-session-invalidation.mjs'
      - 'src/frontend/project-time-web/scripts/test-authoritative-session-transport-theme-runtime.mjs'
      - 'src/frontend/project-time-web/scripts/validate-modules-008-009-admin-experience.mjs'
      - '.github/workflows/validate-global-session-invalidation.yml'

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate stable Module 008, native response recovery and icon dock
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce isolated source scope or bounded regression mode
        shell: bash
        run: |
          set -Eeuo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch origin main --no-tags
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${CHANGED[@]}"

          ALLOWED=(
            '.github/workflows/validate-global-session-invalidation.yml'
            'src/frontend/project-time-web/scripts/validate-global-session-invalidation.mjs'
            'src/frontend/project-time-web/scripts/test-authoritative-session-transport-theme-runtime.mjs'
            'src/frontend/project-time-web/scripts/validate-modules-008-009-admin-experience.mjs'
            'src/frontend/project-time-web/src/projectpulse-authoritative-api.js'
            'src/frontend/project-time-web/src/AuditHistoryPanel.jsx'
            'src/frontend/project-time-web/src/admin-experience-theme.css'
          )

          [[ "${#CHANGED[@]}" -gt 0 ]] || {
            echo 'No changed files were found for validation.' >&2
            exit 1
          }

          if [[ "$BRANCH" == hotfix/module-008-stable-route-authoritative-fallback-theme-dock-* ]]; then
            for changed in "${CHANGED[@]}"; do
              MATCH=false
              for allowed in "${ALLOWED[@]}"; do
                [[ "$changed" == "$allowed" ]] && MATCH=true
              done
              [[ "$MATCH" == true ]] || {
                echo "Unexpected changed file: $changed" >&2
                exit 1
              }
            done

            PROTECTED='^(src/frontend/project-time-web/src/(App|main|UserAdministrationPanel|MicrosoftIntegrationPortal)\.jsx|src/backend/|database/|\.github/workflows/projectpulse-deploy-|scripts/validate-runtime-direct-timer-recovery-test-deployment\.sh)'
            if printf '%s\n' "${CHANGED[@]}" | grep -E "$PROTECTED"; then
              echo 'Protected module, backend, migration, shared entry point, or deployment source changed.' >&2
              exit 1
            fi

            echo 'MODULE_008_NATIVE_FALLBACK_THEME_SOURCE_ISOLATION=PASSED'
          elif [[ "$BRANCH" == feature/enterprise-operations-ux-* || "$BRANCH" == fix/modules-081-082-theme-recovery-* ]]; then
            DIRECT_MODULE_008='^(\.github/workflows/validate-global-session-invalidation\.yml|src/frontend/project-time-web/scripts/(validate-global-session-invalidation|test-authoritative-session-transport-theme-runtime|validate-modules-008-009-admin-experience)\.mjs|src/frontend/project-time-web/src/(projectpulse-authoritative-api\.js|AuditHistoryPanel\.jsx|admin-experience-theme\.css))$'
            DIRECT_CHANGED="$(printf '%s\n' "${CHANGED[@]}" | grep -E "$DIRECT_MODULE_008" || true)"
            [[ -n "$DIRECT_CHANGED" ]] || {
              echo 'The Module 008 regression workflow requires at least one owned contract or runtime change.' >&2
              exit 1
            }
            if printf '%s\n' "${CHANGED[@]}" | grep -E '^(\.github/workflows/projectpulse-deploy-|scripts/validate-runtime-direct-timer-recovery-test-deployment\.sh)'; then
              echo 'The Module 008 regression workflow cannot validate a deployment-control change.' >&2
              exit 1
            fi
            echo "MODULE_008_NATIVE_FALLBACK_THEME_REGRESSION=PASSED branch=$BRANCH"
          else
            echo "Module 008's bounded multi-file regression mode is restricted to a reviewed enterprise operations or Modules 081/082 theme-recovery branch family. Unexpected branch: $BRANCH" >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Build API compatibility baseline
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate authoritative native fallback
        working-directory: src/frontend/project-time-web
        run: npm run validate:global-session-invalidation

      - name: Execute response recovery and theme runtime harness
        working-directory: src/frontend/project-time-web
        run: node scripts/test-authoritative-session-transport-theme-runtime.mjs

      - name: Validate stable Module 008 and unchanged Module 009 contract
        working-directory: src/frontend/project-time-web
        run: npm run validate:modules008009

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Publish exact-commit stability status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          API_ROOT: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            STATE=success
            DESCRIPTION='Stable Module 008, native response recovery and icon dock passed.'
          else
            STATE=failure
            DESCRIPTION='Module 008 stability, response recovery or theme dock validation failed.'
          fi

          PAYLOAD="$(jq -nc \
            --arg state "$STATE" \
            --arg context 'module-008/native-fallback-theme-dock' \
            --arg description "$DESCRIPTION" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$PAYLOAD" \
            "$API_ROOT/repos/$REPOSITORY/statuses/$COMMIT_SHA"
