name: Validate Authoritative Session Transport and Theme

on:
  push:
    branches:
      - 'hotfix/authoritative-session-transport-and-theme-*'
  pull_request:
    paths:
      - 'src/frontend/project-time-web/src/projectpulse-authoritative-api.js'
      - 'src/frontend/project-time-web/scripts/validate-global-session-invalidation.mjs'
      - 'src/frontend/project-time-web/scripts/test-authoritative-session-transport-theme-runtime.mjs'
      - 'src/frontend/project-time-web/src/admin-experience-theme.js'
      - 'src/frontend/project-time-web/src/admin-experience-theme.css'
      - '.github/workflows/validate-global-session-invalidation.yml'

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate safe session transport and modern theme control
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce isolated source scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${CHANGED[@]}"

          ALLOWED=(
            '.github/workflows/validate-global-session-invalidation.yml'
            'src/frontend/project-time-web/scripts/validate-global-session-invalidation.mjs'
            'src/frontend/project-time-web/scripts/test-authoritative-session-transport-theme-runtime.mjs'
            'src/frontend/project-time-web/src/projectpulse-authoritative-api.js'
            'src/frontend/project-time-web/src/admin-experience-theme.js'
            'src/frontend/project-time-web/src/admin-experience-theme.css'
          )

          [[ "${#CHANGED[@]}" -gt 0 ]] || {
            echo 'No changed files were found for validation.' >&2
            exit 1
          }

          for changed in "${CHANGED[@]}"; do
            MATCH=false
            for allowed in "${ALLOWED[@]}"; do
              [[ "$changed" == "$allowed" ]] && MATCH=true
            done
            [[ "$MATCH" == true ]] || {
              echo "Unexpected changed file: $changed" >&2
              exit 1
            }
          done

          PROTECTED='^(src/frontend/project-time-web/src/(App|main|UserAdministrationPanel|AuditHistoryPanel|MicrosoftIntegrationPortal)\.jsx|src/backend/|database/|\.github/workflows/projectpulse-deploy-|scripts/validate-runtime-direct-timer-recovery-test-deployment\.sh)'
          if printf '%s\n' "${CHANGED[@]}" | grep -E "$PROTECTED"; then
            echo 'Protected module, backend, migration, shared entry point, or deployment source changed.' >&2
            exit 1
          fi

          echo 'AUTHORITATIVE_SESSION_THEME_SOURCE_ISOLATION=PASSED'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Build API compatibility baseline
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate authoritative session transport
        working-directory: src/frontend/project-time-web
        run: npm run validate:global-session-invalidation

      - name: Execute session and theme runtime regression harness
        working-directory: src/frontend/project-time-web
        run: node scripts/test-authoritative-session-transport-theme-runtime.mjs

      - name: Validate Modules 008 and 009 theme contract
        working-directory: src/frontend/project-time-web
        run: npm run validate:modules008009

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Publish exact-commit session and theme status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          API_ROOT: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            STATE=success
            DESCRIPTION='Executable session transport and modern theme regression checks passed.'
          else
            STATE=failure
            DESCRIPTION='Authoritative session transport or theme runtime validation failed.'
          fi

          PAYLOAD="$(jq -nc \
            --arg state "$STATE" \
            --arg context 'session-theme/authoritative-transport' \
            --arg description "$DESCRIPTION" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$PAYLOAD" \
            "$API_ROOT/repos/$REPOSITORY/statuses/$COMMIT_SHA"
