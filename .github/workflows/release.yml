name: Release

# Verity Shipyard release pipeline.
#
# Triggered by a semver tag (e.g. v0.1.0) cut with `verity release cut`.
# Builds each image ONCE, scans it with Trivy, pushes it to GHCR, and records
# the resulting digests in a GitHub Release. Those digests are the byte-identical
# artifact promoted from staging to prod (pinned via scripts/verity/pin-digests.sh;
# never hand-copied).
#
# This workflow only builds/scans/publishes artifacts. It does NOT deploy — the
# deploy step is deploy.sh, run against a target environment after digests exist.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write        # create the GitHub Release
  packages: write        # push images to GHCR
  security-events: write # upload Trivy SARIF to the Security tab

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Fail the release on fixable CRITICAL/HIGH image vulnerabilities.
  # Relax by editing TRIVY_SEVERITY or setting TRIVY_EXIT_CODE=0 below.
  TRIVY_SEVERITY: "CRITICAL,HIGH"
  TRIVY_EXIT_CODE: "1"

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      web_digest: ${{ steps.web.outputs.digest }}
      api_digest: ${{ steps.api.outputs.digest }}
    steps:
      - name: Checkout (at the tag)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Derive version + image refs
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner_repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${owner_repo}/web" >> "$GITHUB_OUTPUT"
          echo "api_image=${REGISTRY}/${owner_repo}/api" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- web (nginx + built SPA) ----
      - name: Build & push web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployment/containers/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.web_image }}:latest
          provenance: false

      - name: Trivy scan web
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.web_image }}@${{ steps.web.outputs.digest }}
          format: sarif
          output: trivy-web.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          ignore-unfixed: true

      # ---- api (.NET) ----
      - name: Build & push api
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployment/containers/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.api_image }}:latest
          provenance: false

      - name: Trivy scan api
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.api_image }}@${{ steps.api.outputs.digest }}
          format: sarif
          output: trivy-api.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: .

      # ---- emit the pinned digest manifest ----
      - name: Write release digest manifest
        id: manifest
        run: |
          cat > release-digests.json <<EOF
          {
            "version": "${{ steps.meta.outputs.version }}",
            "tag": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "images": {
              "web": "${{ steps.meta.outputs.web_image }}@${{ steps.web.outputs.digest }}",
              "api": "${{ steps.meta.outputs.api_image }}@${{ steps.api.outputs.digest }}"
            }
          }
          EOF
          cat release-digests.json

      - name: Publish GitHub Release with digest manifest
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-digests.json
