name: Release

# Verity Shipyard release pipeline.
#
# Triggered by a semver tag (e.g. v0.1.0) cut with `verity release cut`.
# Builds each image ONCE, scans it with Trivy, pushes it to GHCR, and records
# the resulting digests in a GitHub Release. Those digests are the byte-identical
# artifact promoted from staging to prod (pinned via scripts/verity/pin-digests.sh;
# never hand-copied).
#
# This workflow only builds/scans/publishes artifacts. It does NOT deploy — the
# deploy step is deploy.sh, run against a target environment after digests exist.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Fail the release on fixable CRITICAL/HIGH image vulnerabilities.
  # Relax by editing TRIVY_SEVERITY or setting TRIVY_EXIT_CODE=0 below.
  TRIVY_SEVERITY: "CRITICAL,HIGH"
  TRIVY_EXIT_CODE: "1"

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      web_digest: ${{ steps.web.outputs.digest }}
      api_digest: ${{ steps.api.outputs.digest }}
      web_image: ${{ steps.meta.outputs.web_image }}
      api_image: ${{ steps.meta.outputs.api_image }}
    steps:
      - name: Checkout (at the tag)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Derive version + image refs
        id: meta
        run: |
          python3 - <<'PY_TAG'
          import os, re
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', os.environ['GITHUB_REF_NAME']):
              raise SystemExit('Invalid release tag')
          PY_TAG
          version="${GITHUB_REF_NAME#v}"
          owner_repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${owner_repo}/web" >> "$GITHUB_OUTPUT"
          echo "api_image=${REGISTRY}/${owner_repo}/api" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- web (nginx + built SPA) ----
      - name: Build & push web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployment/containers/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.web_image }}:latest
          provenance: false

      - name: Trivy scan web
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.web_image }}@${{ steps.web.outputs.digest }}
          format: sarif
          output: trivy-web.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          ignore-unfixed: true

      # ---- api (.NET) ----
      - name: Build & push api
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployment/containers/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.api_image }}:latest
          provenance: false

      - name: Trivy scan api
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.api_image }}@${{ steps.api.outputs.digest }}
          format: sarif
          output: trivy-api.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: .

  publish-release:
    needs: build-scan-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WEB_IMAGE: ${{ needs.build-scan-publish.outputs.web_image }}
      API_IMAGE: ${{ needs.build-scan-publish.outputs.api_image }}
      WEB_DIGEST: ${{ needs.build-scan-publish.outputs.web_digest }}
      API_DIGEST: ${{ needs.build-scan-publish.outputs.api_digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # This fresh runner never checks out or executes build/source dependencies.
      - name: Validate provenance and publish immutable digest manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_RELEASE'
          import json, os, re, subprocess
          from pathlib import Path
          env = os.environ
          tag, commit, repo = env['GITHUB_REF_NAME'], env['GITHUB_SHA'], env['GITHUB_REPOSITORY']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Invalid release tag')
          if not re.fullmatch(r'[0-9a-f]{40}', commit): raise SystemExit('Invalid source identity')
          images = {}
          for component in ('web', 'api'):
              image, digest = env[component.upper()+'_IMAGE'], env[component.upper()+'_DIGEST']
              if image != 'ghcr.io/'+repo.lower()+'/'+component or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise SystemExit('Invalid immutable image identity')
              images[component] = image+'@'+digest
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/'+repo+'/'+path]))
          obj = api('git/ref/tags/'+tag)['object']
          for _ in range(5):
              if obj['type'] == 'commit': break
              if obj['type'] != 'tag' or not re.fullmatch(r'[0-9a-f]{40}', obj['sha']):
                  raise SystemExit('Invalid tag object')
              obj = api('git/tags/'+obj['sha'])['object']
          if obj['type'] != 'commit' or obj['sha'] != commit:
              raise SystemExit('Release tag changed after the build')
          manifest = {'version':tag[1:], 'tag':tag, 'commit':commit, 'images':images}
          Path('release-digests.json').write_text(json.dumps(manifest, indent=2)+'\n')
          PY_RELEASE
          gh release create "$GITHUB_REF_NAME" release-digests.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes
