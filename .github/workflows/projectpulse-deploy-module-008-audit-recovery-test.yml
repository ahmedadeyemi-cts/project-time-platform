name: ProjectPulse Deploy Module 008 Audit Recovery Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified Module 008 audit-route recovery release
        required: true
        default: 9ba6d676189ebca39f408c3bc7a71aa652cea8bf
        type: string
      confirmation:
        description: Enter DEPLOY-MODULE-008-AUDIT-RECOVERY-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-test
  queue: max
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Guarded Module 008 web-only test deployment
    environment: test
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_COMMIT: 9ba6d676189ebca39f408c3bc7a71aa652cea8bf

    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact Module 008 release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and exact Module 008 release
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          [[ "$WORKFLOW_SOURCE_REF" == 'refs/heads/main' ]] || {
            echo 'Dispatch this workflow from main.' >&2
            exit 1
          }
          [[ "$DISPATCH_CONFIRMATION" == 'DEPLOY-MODULE-008-AUDIT-RECOVERY-TO-TEST' ]] || {
            echo 'The deployment confirmation text does not match.' >&2
            exit 1
          }
          [[ "$DISPATCH_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release_commit must be a complete 40-character SHA.' >&2
            exit 1
          }

          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == "$WORKFLOW_SOURCE_SHA" ]]
          [[ "$TARGET_COMMIT" == "$DISPATCH_RELEASE_COMMIT" ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || {
            echo 'Only the verified Module 008 audit-route recovery release may deploy.' >&2
            exit 1
          }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || {
            echo 'The Module 008 release is not an ancestor of the deployment controls.' >&2
            exit 1
          }

          test -f release/src/frontend/project-time-web/src/AuditHistoryPanel.jsx
          test -f release/src/frontend/project-time-web/scripts/validate-modules-008-009-admin-experience.mjs
          test -f control/scripts/build-pr55-acr-image.sh
          test -f control/scripts/wait-containerapp-ready-revision.sh

          grep -Fq '/api/admin/audit-history/events' release/src/frontend/project-time-web/src/AuditHistoryPanel.jsx
          grep -Fq "readStoredJson('projectPulseViewAsUser')" release/src/frontend/project-time-web/src/AuditHistoryPanel.jsx
          grep -Fq 'if (!readProjectPulseAuthSession() || readModule008ViewAsUser())' release/src/frontend/project-time-web/src/AuditHistoryPanel.jsx
          grep -Fq "host.setAttribute('data-module-008-route-recovery-host', 'true')" release/src/frontend/project-time-web/src/AuditHistoryPanel.jsx
          grep -Fq 'root.render(<AuditHistoryPanel recoveryMode />)' release/src/frontend/project-time-web/src/AuditHistoryPanel.jsx
          ! grep -Fq 'window.setTimeout(synchronize, 50)' release/src/frontend/project-time-web/src/AuditHistoryPanel.jsx
          ! grep -Fq 'retryTimer' release/src/frontend/project-time-web/src/AuditHistoryPanel.jsx

          (
            cd release/src/frontend/project-time-web
            node scripts/validate-modules-008-009-admin-experience.mjs
          )

          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current immutable web image
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail

          RAW_WEB_IMAGE="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query 'properties.template.containers[0].image' -o tsv)"
          WEB_MODE="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query 'properties.configuration.activeRevisionsMode' -o tsv)"

          [[ -n "$RAW_WEB_IMAGE" ]]
          [[ "${WEB_MODE,,}" == 'single' ]]

          resolve_digest() {
            local image="$1"
            local registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/'
            local relative repository digest

            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Web image is outside the approved ACR: $image" >&2; return 1 ;;
            esac

            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show \
              --name '${{ vars.AZURE_ACR_NAME }}' \
              --image "$relative" \
              --query digest -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          OLD_WEB_IMAGE="$(resolve_digest "$RAW_WEB_IMAGE")"
          echo "old_web_image=$OLD_WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo "CAPTURED_WEB_ROLLBACK_IMAGE=$OLD_WEB_IMAGE"

      - name: Build exact Module 008 web candidate
        id: build
        shell: bash
        working-directory: release
        run: |
          set -Eeuo pipefail
          TARGET_COMMIT='${{ steps.release.outputs.target_commit }}'
          WEB_REPOSITORY='project-health-dashboard-web'
          WEB_DIGEST="$(
            ../control/scripts/build-pr55-acr-image.sh \
              '${{ vars.AZURE_ACR_NAME }}' \
              "$WEB_REPOSITORY:module-008-audit-recovery-$TARGET_COMMIT" \
              deployment/containers/web/Dockerfile \
              .
          )"
          [[ "$WEB_DIGEST" == sha256:* ]]
          WEB_IMAGE='${{ vars.AZURE_ACR_NAME }}.azurecr.io/'"$WEB_REPOSITORY@$WEB_DIGEST"
          echo "web_image=$WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo "IMMUTABLE_WEB_CANDIDATE=$WEB_IMAGE"

      - name: Deploy Module 008 web candidate only
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          SUFFIX="aud008-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REVISION='${{ vars.AZURE_WEB_APP }}'"--$SUFFIX"
          echo 'started=true' >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "$SUFFIX" \
            --output none

      - name: Wait for exact Module 008 web revision
        shell: bash
        run: |
          bash control/scripts/wait-containerapp-ready-revision.sh \
            '${{ vars.AZURE_RESOURCE_GROUP }}' \
            '${{ vars.AZURE_WEB_APP }}' \
            '${{ steps.deploy_web.outputs.revision }}' \
            '${{ steps.build.outputs.web_image }}' 60 10

      - name: Validate served Module 008 recovery assets
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_URL='${{ vars.PUBLIC_URL }}'
          BASE_URL="${BASE_URL%/}"
          READY=false
          LAST_STATUS='not-requested'
          LAST_JS='not-resolved'

          absolute_asset_url() {
            local path="$1"
            case "$path" in
              http://*|https://*) printf '%s\n' "$path" ;;
              /*) printf '%s%s\n' "$BASE_URL" "$path" ;;
              *) printf '%s/%s\n' "$BASE_URL" "$path" ;;
            esac
          }

          for attempt in $(seq 1 30); do
            BUSTER="aud008-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            STATUS="$(curl --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              --output /tmp/aud008-index.html \
              --write-out '%{http_code}' \
              "$BASE_URL/?release_check=$BUSTER" || true)"
            LAST_STATUS="$STATUS"

            if [[ "$STATUS" == '200' ]]; then
              JS_PATH="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/aud008-index.html | head -1)"
              LAST_JS="$JS_PATH"
              if [[ -n "$JS_PATH" ]]; then
                JS_URL="$(absolute_asset_url "$JS_PATH")"
                JS_STATUS="$(curl --silent --show-error --location \
                  --header 'Cache-Control: no-cache' \
                  --header 'Pragma: no-cache' \
                  --output /tmp/aud008-app.js \
                  --write-out '%{http_code}' \
                  "$JS_URL?release_check=$BUSTER" || true)"
                LAST_STATUS="html=$STATUS,js=$JS_STATUS"

                if [[ "$JS_STATUS" == '200' ]] \
                  && grep -Fq '/api/admin/audit-history/events' /tmp/aud008-app.js \
                  && grep -Fq 'projectPulseViewAsUser' /tmp/aud008-app.js \
                  && grep -Fq 'projectPulseAuthSession' /tmp/aud008-app.js \
                  && grep -Fq 'data-module-008-route-recovery-host' /tmp/aud008-app.js \
                  && grep -Fq 'X-ProjectPulse-Session' /tmp/aud008-app.js \
                  && grep -Fq 'Manager team scope' /tmp/aud008-app.js; then
                  READY=true
                  echo "MODULE_008_RECOVERY_ASSETS_READY attempt=$attempt js=$JS_PATH"
                  break
                fi
              fi
            fi

            (( attempt < 30 )) && sleep 10
          done

          [[ "$READY" == true ]] || {
            echo "Module 008 recovery assets did not become ready: status=$LAST_STATUS js=$LAST_JS" >&2
            exit 1
          }

          ACTIVE_WEB_IMAGE="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_WEB_IMAGE" == '${{ steps.build.outputs.web_image }}' ]] || {
            echo "Active web image mismatch: expected=${{ steps.build.outputs.web_image }} actual=$ACTIVE_WEB_IMAGE" >&2
            exit 1
          }

          echo 'MODULE_008_RECOVERY_WEB_VALIDATION=PASS'

      - name: Write Module 008 deployment evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cat > evidence/module-008-audit-recovery-test-deployment.json <<JSON
          {
            "environment": "test",
            "releaseCommit": "${{ steps.release.outputs.target_commit }}",
            "workflowCommit": "${{ github.sha }}",
            "runId": "${{ github.run_id }}",
            "webImage": "${{ steps.build.outputs.web_image }}",
            "previousWebImage": "${{ steps.before.outputs.old_web_image }}",
            "apiDeployment": "unchanged",
            "migrations": "unchanged",
            "module009": "unchanged",
            "viewAsIsolation": "verified-in-source-and-served-assets",
            "servedAssetValidation": "passed"
          }
          JSON

      - name: Upload Module 008 deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: module-008-audit-recovery-test-${{ github.run_id }}
          path: evidence/module-008-audit-recovery-test-deployment.json
          retention-days: 30

      - name: Roll back web image on failure
        if: ${{ failure() && steps.deploy_web.outputs.started == 'true' }}
        shell: bash
        run: |
          set +e
          SUFFIX="aud008rb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ROLLBACK_REVISION='${{ vars.AZURE_WEB_APP }}'"--$SUFFIX"
          echo 'Module 008 web deployment failed. Restoring the captured immutable web image.' >&2

          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.before.outputs.old_web_image }}' \
            --revision-suffix "$SUFFIX" \
            --output none

          bash control/scripts/wait-containerapp-ready-revision.sh \
            '${{ vars.AZURE_RESOURCE_GROUP }}' \
            '${{ vars.AZURE_WEB_APP }}' \
            "$ROLLBACK_REVISION" \
            '${{ steps.before.outputs.old_web_image }}' 60 10
