name: Temporary Sync Role Access Renumber References

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-sync-role-access-renumber-references.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temp-sync-role-access-renumber-references-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/super-administrator-permanent-full-control-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize reviewed references
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('src/frontend/project-time-web/scripts/validate-role-workspace-entra-crm-governance.mjs'),
              Path('src/frontend/project-time-web/scripts/validate-module-069-qualifications.mjs'),
              Path('docs/modules/module-069-qualifications-certifications/README.md'),
              Path('docs/modules/module-069-qualifications-certifications/SECURITY-AND-OPERATIONS.md'),
          ]

          replacements = [
              ('database/migrations/061_super_administrator_permanent_full_control.sql', 'database/migrations/062_super_administrator_permanent_full_control.sql'),
              ('database/rollback/061_super_administrator_permanent_full_control_rollback.sql', 'database/rollback/062_super_administrator_permanent_full_control_rollback.sql'),
              ('tests/test-super-administrator-permanent-full-control-migration-061.sh', 'tests/test-super-administrator-permanent-full-control-migration-062.sh'),
              ("'061_super_administrator_permanent_full_control'", "'062_super_administrator_permanent_full_control'"),
              ('SUPER_ADMINISTRATOR_PERMANENT_FULL_CONTROL_MIGRATION_061', 'SUPER_ADMINISTRATOR_PERMANENT_FULL_CONTROL_MIGRATION_062'),
              ('role_access_repair_061_assignment_changes', 'role_access_repair_062_assignment_changes'),
              ('role_access_repair_061_permission_changes', 'role_access_repair_062_permission_changes'),
              ('migration061', 'migration062Admin'),
              ('rollback061', 'rollback062Admin'),
              ('test061', 'test062Admin'),
              ('migration 061 test', 'migration 062 administrator test'),
              ('migration 061', 'migration 062 administrator authority'),
              ('Migration 061', 'Migration 062'),
              ('database/migrations/062_project_management_billing_role_access_repair.sql', 'database/migrations/063_project_management_billing_role_access_repair.sql'),
              ('database/rollback/062_project_management_billing_role_access_repair_rollback.sql', 'database/rollback/063_project_management_billing_role_access_repair_rollback.sql'),
              ('tests/test-project-management-billing-role-access-migration-062.sh', 'tests/test-project-management-billing-role-access-migration-063.sh'),
              ("'062_project_management_billing_role_access_repair'", "'063_project_management_billing_role_access_repair'"),
              ('PROJECT_MANAGEMENT_BILLING_ROLE_ACCESS_MIGRATION_062', 'PROJECT_MANAGEMENT_BILLING_ROLE_ACCESS_MIGRATION_063'),
              ('role_access_repair_062_permission_grants', 'role_access_repair_063_permission_grants'),
              ('role_access_repair_062_permission_removals', 'role_access_repair_063_permission_removals'),
              ('migration062', 'migration063PmBilling'),
              ('rollback062', 'rollback063PmBilling'),
              ('test062', 'test063PmBilling'),
              ('MIGRATION_062_', 'MIGRATION_063_'),
              ('ROLLBACK_062_', 'ROLLBACK_063_'),
              ('Module 069 self-service; migration 062', 'Module 069 self-service; migration 063'),
              ('Migration 062 changes RBAC', 'Migration 063 changes RBAC'),
              ('migration 062 changes RBAC', 'migration 063 changes RBAC'),
          ]

          for file in files:
              content = file.read_text(encoding='utf-8')
              original = content
              for old, new in replacements:
                  content = content.replace(old, new)
              if content != original:
                  file.write_text(content, encoding='utf-8')

          print('ROLE_ACCESS_RENUMBER_REFERENCES_SYNCHRONIZED=PASS')
          PY

      - name: Validate references and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -R -n -F 'database/migrations/061_super_administrator_permanent_full_control.sql' \
            src/frontend/project-time-web/scripts docs/modules/module-069-qualifications-certifications
          ! grep -R -n -F 'database/migrations/062_project_management_billing_role_access_repair.sql' \
            src/frontend/project-time-web/scripts docs/modules/module-069-qualifications-certifications
          ! grep -R -n -F 'PROJECT_MANAGEMENT_BILLING_ROLE_ACCESS_MIGRATION_062' \
            src/frontend/project-time-web/scripts docs/modules/module-069-qualifications-certifications
          test -f database/migrations/062_super_administrator_permanent_full_control.sql
          test -f database/migrations/063_project_management_billing_role_access_repair.sql
          (cd src/frontend/project-time-web && node ./scripts/validate-role-workspace-access-matrix.mjs)
          git diff --check

      - name: Publish synchronized references
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/frontend/project-time-web/scripts/validate-role-workspace-entra-crm-governance.mjs \
            src/frontend/project-time-web/scripts/validate-module-069-qualifications.mjs \
            docs/modules/module-069-qualifications-certifications/README.md \
            docs/modules/module-069-qualifications-certifications/SECURITY-AND-OPERATIONS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'ROLE_ACCESS_RENUMBER_REFERENCES_ALREADY_CURRENT=YES'
            exit 0
          fi
          git commit -m 'Synchronize role access migration 062 and 063 references'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          echo 'ROLE_ACCESS_RENUMBER_REFERENCES_PUBLISHED=YES'
