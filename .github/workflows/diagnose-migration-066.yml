name: Diagnose PR 447 Exact Failures

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-migration-066.yml'
      - 'database/migrations/066_immutable_project_numbers.sql'
      - 'database/rollback/066_immutable_project_numbers_rollback.sql'
      - 'tests/test-immutable-project-numbers-migration-066.sh'

permissions:
  contents: read

jobs:
  migration:
    if: github.event.pull_request.head.ref == 'diagnose/uat-447-migration-066'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run migration 066 lifecycle and preserve complete output
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/migration-066-evidence
          bash -x tests/test-immutable-project-numbers-migration-066.sh \
            > /tmp/migration-066-evidence/test.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/migration-066-evidence/exit-code.txt
          cp database/migrations/066_immutable_project_numbers.sql /tmp/migration-066-evidence/
          cp database/rollback/066_immutable_project_numbers_rollback.sql /tmp/migration-066-evidence/
          cp tests/test-immutable-project-numbers-migration-066.sh /tmp/migration-066-evidence/
          cat /tmp/migration-066-evidence/test.log
          exit "$status"

      - name: Upload complete migration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-066-diagnostics-${{ github.run_id }}
          path: /tmp/migration-066-evidence
          retention-days: 3

  frontend-generated-diff:
    if: github.event.pull_request.head.ref == 'diagnose/uat-447-migration-066'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Build and capture every tracked-source mutation
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/frontend-diff-evidence
          cd src/frontend/project-time-web
          npm ci --no-audit --no-fund > /tmp/frontend-diff-evidence/npm-ci.log 2>&1
          ci_status=$?
          if [[ "$ci_status" -eq 0 ]]; then
            npm run build > /tmp/frontend-diff-evidence/build.log 2>&1
            build_status=$?
          else
            build_status=99
          fi
          cd ../../..
          git status --short > /tmp/frontend-diff-evidence/status.txt
          git diff --name-status > /tmp/frontend-diff-evidence/name-status.txt
          git diff --binary > /tmp/frontend-diff-evidence/tracked-source.patch
          git diff > /tmp/frontend-diff-evidence/tracked-source.txt
          printf 'npm_ci=%s\nbuild=%s\n' "$ci_status" "$build_status" > /tmp/frontend-diff-evidence/exit-codes.txt
          cat /tmp/frontend-diff-evidence/status.txt
          cat /tmp/frontend-diff-evidence/name-status.txt
          exit "$build_status"

      - name: Upload complete frontend mutation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-generated-diff-${{ github.run_id }}
          path: /tmp/frontend-diff-evidence
          retention-days: 3
