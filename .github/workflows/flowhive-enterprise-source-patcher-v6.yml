name: Complete FlowHive Enterprise PM Source Package v6

on:
  push:
    branches: [feature/module-066-flowhive-enterprise-pm-20260813]
    paths:
      - .github/workflows/flowhive-enterprise-source-patcher-v6.yml

permissions:
  contents: write

concurrency:
  group: flowhive-enterprise-source-patcher
  cancel-in-progress: false

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/module-066-flowhive-enterprise-pm-20260813
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Apply deterministic enterprise source patch
        run: python3 scripts/module-066-enterprise/patch-flowhive-enterprise.py

      - name: Apply customer-share renderer and validator correction
        run: python3 scripts/module-066-enterprise/fix-customer-share-renderer.py

      - name: Register generated JSX repair immediately before Vite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/frontend/project-time-web/package.json')
          value = path.read_text(encoding='utf-8')
          old = '&& npm run validate:role-workspace-entra-crm-governance && vite build"'
          new = '&& npm run validate:role-workspace-entra-crm-governance && node ./scripts/repair-module-066-generated-jsx.mjs && vite build"'
          if new in value:
              print('MODULE_066_BUILD_REPAIR_WIRING=ALREADY_PRESENT')
          elif old in value:
              path.write_text(value.replace(old, new, 1), encoding='utf-8')
              print('MODULE_066_BUILD_REPAIR_WIRING=ADDED')
          else:
              raise SystemExit('Could not locate the final Vite build anchor in package.json.')
          PY

      - name: Validate Migration 086 source contract
        run: bash tests/test-module-066-flowhive-enterprise-pm-migration-086.sh

      - name: Validate complete Module 066 source contract
        run: node src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs

      - name: Build complete API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Build complete frontend
        working-directory: src/frontend/project-time-web
        run: |
          npm ci
          npm run build

      - name: Verify generated source is repaired after full build lifecycle
        working-directory: src/frontend/project-time-web
        run: node ./scripts/repair-module-066-generated-jsx.mjs

      - name: Commit integrated source and remove one-time patchers
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/flowhive-enterprise-source-patcher.yml \
            .github/workflows/flowhive-enterprise-source-patcher-v2.yml \
            .github/workflows/flowhive-enterprise-source-patcher-v3.yml \
            .github/workflows/flowhive-enterprise-source-patcher-v4.yml \
            .github/workflows/flowhive-enterprise-source-patcher-v5.yml \
            .github/workflows/flowhive-enterprise-source-patcher-v6.yml \
            scripts/module-066-enterprise/patch-flowhive-enterprise.py \
            scripts/module-066-enterprise/fix-customer-share-renderer.py \
            scripts/module-066-enterprise/fix-planner-phase-tag.py
          rmdir scripts/module-066-enterprise 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete FlowHive enterprise project management experience'
          git push origin HEAD:feature/module-066-flowhive-enterprise-pm-20260813
