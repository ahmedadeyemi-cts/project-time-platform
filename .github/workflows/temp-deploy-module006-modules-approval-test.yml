name: Temporary Deploy Module 006, Modules Directory, and Approval Workflow to Test

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/deploy-module006-modules-approval-test-trigger'

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-module006-modules-approval-test
  cancel-in-progress: false

env:
  EXPECTED_RELEASE_COMMIT: 7df1bad3d4f37f92e91f5b202c83e31b94d6f983
  EXPECTED_TRIGGER_BRANCH: release/run-module006-modules-approval-test-20260730
  REQUIRED_CONFIRMATION: DEPLOY-MODULE006-MODULES-APPROVAL-7DF1BA-TO-TEST

jobs:
  deploy:
    if: github.actor == 'ahmedadeyemi-cts'
    name: Deploy exact Module 006, Modules directory, and approval release to Test
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out exact deployment trigger
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: trigger
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact deployment controls
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact cumulative source release
        uses: actions/checkout@v5
        with:
          ref: 7df1bad3d4f37f92e91f5b202c83e31b94d6f983
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Guard trigger, controls, and exact source release
        id: guard
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$BASE_REF" == main ]]
          [[ "$HEAD_REF" == "$EXPECTED_TRIGGER_BRANCH" ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C control rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ "$(git -C release rev-parse HEAD)" == "$EXPECTED_RELEASE_COMMIT" ]]
          git -C control merge-base --is-ancestor "$EXPECTED_RELEASE_COMMIT" HEAD

          TRIGGER_FILE='trigger/.github/deploy-module006-modules-approval-test-trigger'
          test -f "$TRIGGER_FILE"
          [[ "$(sed -n 's/^operation=//p' "$TRIGGER_FILE" | tail -1)" == deploy ]]
          [[ "$(sed -n 's/^release_commit=//p' "$TRIGGER_FILE" | tail -1)" == "$EXPECTED_RELEASE_COMMIT" ]]
          [[ "$(sed -n 's/^confirmation=//p' "$TRIGGER_FILE" | tail -1)" == "$REQUIRED_CONFIRMATION" ]]

          mapfile -t CHANGED < <(git -C trigger diff --name-only "$BASE_SHA...HEAD" | sort)
          diff -u \
            <(printf '%s\n' '.github/deploy-module006-modules-approval-test-trigger') \
            <(printf '%s\n' "${CHANGED[@]}")

          for required in \
            control/scripts/temp-run-module006-modules-approval-test-deployment.sh \
            control/scripts/build-pr55-acr-image.sh \
            control/scripts/wait-containerapp-ready-revision.sh \
            release/src/frontend/project-time-web/src/ProjectRegisterCenter.jsx \
            release/src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx \
            release/src/frontend/project-time-web/scripts/validate-module-006-toyota-hyundai-pipelines.mjs \
            release/src/frontend/project-time-web/scripts/validate-modules-directory-page.mjs \
            release/src/frontend/project-time-web/scripts/validate-pending-time-workflow.mjs \
            release/src/backend/ProjectTime.Api/Modules/ProductionApprovalWorkModule.cs; do
            test -f "$required"
          done
          bash -n control/scripts/temp-run-module006-modules-approval-test-deployment.sh
          git -C control diff --check "$EXPECTED_RELEASE_COMMIT...HEAD"
          echo "control_commit=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo 'MODULE006_MODULES_APPROVAL_DEPLOYMENT_GUARD=PASS'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: release/src/frontend/project-time-web/package-lock.json

      - name: Rebuild and revalidate exact source before Azure changes
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build release/src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          pushd release/src/frontend/project-time-web >/dev/null
          npm ci --no-audit --no-fund
          npm run prebuild
          npm run validate:module006-pipelines
          npm run validate:modules-directory
          npm run validate:module-availability
          npm run validate:superadmin-sso-expense-module006
          npm run validate:pending-time-workflow
          npm run build
          popd >/dev/null
          docker build \
            --file release/deployment/containers/web/Dockerfile \
            --tag "projectpulse-module006-modules-approval:${EXPECTED_RELEASE_COMMIT}" \
            release
          echo 'MODULE006_MODULES_APPROVAL_SOURCE_REVALIDATION=PASS'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build, deploy, validate, and preserve rollback evidence
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: >-
          bash control/scripts/temp-run-module006-modules-approval-test-deployment.sh
          control
          release
          "$EXPECTED_RELEASE_COMMIT"

      - name: Record immutable workflow evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p control/evidence
          cat > control/evidence/module006-modules-approval-test-workflow.json <<JSON
          {
            "environment": "test",
            "releaseCommit": "$EXPECTED_RELEASE_COMMIT",
            "controlCommit": "${{ steps.guard.outputs.control_commit }}",
            "workflowRunId": "$GITHUB_RUN_ID",
            "workflowRunAttempt": "$GITHUB_RUN_ATTEMPT",
            "apiWebDeployment": "succeeded",
            "databaseMigrationApplied": false,
            "module006WorkbookSnapshot": true,
            "authoritativeModuleNumbers": true,
            "superAdministratorFullControl": true,
            "approvalWorkflowHardening": true,
            "privateWorkerEnabled": false,
            "privateRagEnabled": false,
            "vectorIndexCreated": false,
            "privateModelConfigured": false,
            "providerCredentialsChanged": false,
            "productionChanged": false,
            "authenticatedUat": "required"
          }
          JSON
          echo 'MODULE006_MODULES_APPROVAL_TEST_WORKFLOW=COMPLETE'

      - name: Upload deployment diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module006-modules-approval-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            control/evidence/
            ${{ runner.temp }}/module006-modules-approval-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30
