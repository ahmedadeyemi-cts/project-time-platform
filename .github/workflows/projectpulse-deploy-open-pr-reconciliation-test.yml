name: ProjectPulse Deploy Open PR Reconciliation Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified source release containing all reconciled open PR work
        required: true
        default: b24ea3db7d0c839d03804975e87b7929dba8c7f6
        type: string
      confirmation:
        description: Enter DEPLOY-OPEN-PR-RECONCILIATION-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-open-pr-reconciliation-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded reconciled source, migration 049, API, and web test deployment
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_RELEASE_COMMIT: b24ea3db7d0c839d03804975e87b7929dba8c7f6

    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact reconciled source release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and exact reconciled release
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          [[ "$WORKFLOW_SOURCE_REF" == 'refs/heads/main' ]] || {
            echo 'Dispatch this workflow from main.' >&2
            exit 1
          }
          [[ "$DISPATCH_CONFIRMATION" == 'DEPLOY-OPEN-PR-RECONCILIATION-TO-TEST' ]] || {
            echo 'The deployment confirmation text does not match.' >&2
            exit 1
          }
          [[ "$DISPATCH_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release_commit must be a complete 40-character SHA.' >&2
            exit 1
          }

          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == "$WORKFLOW_SOURCE_SHA" ]]
          [[ "$TARGET_COMMIT" == "$DISPATCH_RELEASE_COMMIT" ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || {
            echo 'Only the verified open-PR reconciliation source release may deploy.' >&2
            exit 1
          }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || {
            echo 'The source release is not an ancestor of the deployment controls.' >&2
            exit 1
          }

          SELL_MODULE='release/src/backend/ProjectTime.Api/Modules/CustomerDirectorySellSyncModule.cs'
          REGISTRAR='release/src/backend/ProjectTime.Api/Modules/GlobalMailConfigurationModule.cs'
          MORE_BRIDGE='release/src/frontend/project-time-web/src/module-availability-bridge.js'
          MORE_REGISTRY='release/src/frontend/project-time-web/src/module-availability-registry.js'
          ADMIN_RUNTIME='release/src/frontend/project-time-web/src/AdminRuntimeStabilityPortal.jsx'
          CUSTOMER_UI='release/src/frontend/project-time-web/src/CustomerDirectoryCenter.jsx'
          MIGRATION='release/database/migrations/049_module_021_sell_customer_sync.sql'

          for required in \
            "$SELL_MODULE" \
            "$REGISTRAR" \
            "$MORE_BRIDGE" \
            "$MORE_REGISTRY" \
            "$ADMIN_RUNTIME" \
            "$CUSTOMER_UI" \
            "$MIGRATION" \
            release/src/backend/ProjectTime.Api/ProjectTime.Api.csproj \
            release/tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj \
            release/tests/test-projectpulse-api-startup.sh \
            release/src/frontend/project-time-web/scripts/validate-admin-runtime-stability.mjs \
            release/src/frontend/project-time-web/scripts/validate-group-1-navigation-work-consolidation.mjs \
            release/src/frontend/project-time-web/scripts/validate-modules-021-026-sell-customer-sync.mjs \
            control/deployment/containers/pr55-migrator/Dockerfile \
            control/scripts/apply-open-pr-reconciliation-test-migration-049.sh \
            control/scripts/run-open-pr-reconciliation-test-migration-job.sh \
            control/scripts/build-pr55-acr-image.sh \
            control/scripts/export-pr55-test-database-url.sh \
            control/scripts/wait-containerapp-ready-revision.sh; do
            test -f "$required"
          done

          grep -Fq '049_module_021_sell_customer_sync' "$SELL_MODULE"
          grep -Fq '/api/customers/sell/status' "$SELL_MODULE"
          grep -Fq '/api/customers/sell/preview' "$SELL_MODULE"
          grep -Fq '/api/customers/sell/import' "$SELL_MODULE"
          grep -Fq 'MapCustomerDirectorySellSyncEndpoints' "$REGISTRAR"
          grep -Fq 'X-ProjectPulse-View-As-User' "$MORE_BRIDGE"
          grep -Fq 'Search module number or page name' "$MORE_BRIDGE"
          grep -Fq "lifecycle: 'retired'" "$MORE_REGISTRY"
          grep -Fq "'work-task-builder': 'work-register'" "$MORE_REGISTRY"
          grep -Fq 'Project creation and project/task management moved to Modules 055D and 055C.' "$MORE_REGISTRY"
          grep -Fq 'Module 010 Preview, Import, filtering, and selection controls remain visible' "$ADMIN_RUNTIME"
          grep -Fq '/api/customers/sell/status' "$CUSTOMER_UI"
          grep -Fq 'CREATE TABLE IF NOT EXISTS customer_directory_source_links' "$MIGRATION"
          grep -Fq 'CREATE TABLE IF NOT EXISTS customer_directory_sync_runs' "$MIGRATION"
          grep -Fq "'049_module_021_sell_customer_sync'" "$MIGRATION"

          (
            cd release
            test -d src/backend/ProjectTime.Api
            dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
            dotnet run \
              --project tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj \
              --configuration Release
            bash tests/test-projectpulse-api-startup.sh
          )

          (
            cd release/src/frontend/project-time-web
            npm ci --no-audit --no-fund
            node scripts/validate-admin-runtime-stability.mjs
            node scripts/validate-group-1-navigation-work-consolidation.mjs
            node scripts/validate-modules-021-026-sell-customer-sync.mjs
            npm run validate:microsoft-connection
            npm run validate:microsoft-sso-runtime
            npm run build
          )

          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'OPEN_PR_RECONCILIATION_SOURCE_VALIDATION=PASS'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify live API database configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t ENV_NAMES < <(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            --query 'properties.template.containers[0].env[].name' -o tsv)
          printf '%s\n' "${ENV_NAMES[@]}" | sort -u > /tmp/open-pr-reconciliation-api-env-names
          for name in PTP_DB_HOST PTP_DB_PORT PTP_DB_NAME PTP_DB_USER PTP_DB_PASSWORD; do
            grep -Fxq "$name" /tmp/open-pr-reconciliation-api-env-names || {
              echo "Missing required API environment variable: $name" >&2
              exit 1
            }
          done
          echo 'OPEN_PR_RECONCILIATION_DATABASE_CONFIGURATION=COMPLETE'

      - name: Load test database connection
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        run: bash control/scripts/export-pr55-test-database-url.sh

      - name: Capture current immutable API and web images
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_API_IMAGE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          RAW_WEB_IMAGE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          [[ -n "$RAW_API_IMAGE" && -n "$RAW_WEB_IMAGE" ]]
          [[ "${API_MODE,,}" == 'single' && "${WEB_MODE,,}" == 'single' ]]

          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Image is outside approved ACR: $image" >&2; return 1 ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          CURRENT_API_IMAGE="$(resolve_digest "$RAW_API_IMAGE")"
          CURRENT_WEB_IMAGE="$(resolve_digest "$RAW_WEB_IMAGE")"
          [[ -n "$CURRENT_API_IMAGE" && -n "$CURRENT_WEB_IMAGE" ]]
          echo "current_api_image=$CURRENT_API_IMAGE" >> "$GITHUB_OUTPUT"
          echo "current_web_image=$CURRENT_WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo "CAPTURED_CURRENT_API_IMAGE=$CURRENT_API_IMAGE"
          echo "CAPTURED_CURRENT_WEB_IMAGE=$CURRENT_WEB_IMAGE"

      - name: Build exact immutable API and web candidates
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA='${{ steps.release.outputs.target_commit }}'
          API_REPOSITORY='project-health-dashboard-api'
          WEB_REPOSITORY='project-health-dashboard-web'
          API_DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$API_REPOSITORY:open-pr-reconciliation-$SHA" release/deployment/containers/api/Dockerfile release)"
          WEB_DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$WEB_REPOSITORY:open-pr-reconciliation-$SHA" release/deployment/containers/web/Dockerfile release)"
          [[ "$API_DIGEST" == sha256:* && "$WEB_DIGEST" == sha256:* ]]
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$API_REPOSITORY@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$WEB_REPOSITORY@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build checksum-pinned migration 049 image
        id: migration
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/open-pr-reconciliation-migrator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          install -m 0644 control/deployment/containers/pr55-migrator/Dockerfile "$CONTEXT/Dockerfile"
          install -m 0755 control/scripts/apply-open-pr-reconciliation-test-migration-049.sh "$CONTEXT/apply-pr55-test-migrations.sh"
          install -m 0644 release/database/migrations/049_module_021_sell_customer_sync.sql "$CONTEXT/migrations/049_module_021_sell_customer_sync.sql"
          (
            cd "$CONTEXT/migrations"
            sha256sum 049_module_021_sell_customer_sync.sql > SHA256SUMS
          )
          printf '%s\n' '${{ steps.release.outputs.target_commit }}' > "$CONTEXT/release-commit"
          DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-open-pr-reconciliation-migrator:${{ steps.release.outputs.target_commit }}-${GITHUB_SHA:0:12}" "$CONTEXT/Dockerfile" "$CONTEXT")"
          [[ "$DIGEST" == sha256:* ]]
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-open-pr-reconciliation-migrator@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Apply or verify migration 049 inside the private network
        id: migrate
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          OPEN_PR_RECONCILIATION_MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
          OPEN_PR_RECONCILIATION_MIGRATION_JOB_NAME: opr049-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          bash control/scripts/run-open-pr-reconciliation-test-migration-job.sh
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Deploy exact API candidate
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          SUFFIX="oprrapi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REVISION='${{ vars.AZURE_API_APP }}'"--$SUFFIX"
          echo 'started=true' >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --image '${{ steps.build.outputs.api_image }}' --revision-suffix "$SUFFIX" --output none

      - name: Wait for exact API revision
        shell: bash
        run: bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_API_APP }}' '${{ steps.deploy_api.outputs.revision }}' '${{ steps.build.outputs.api_image }}' 60 10

      - name: Validate public API readiness and protected reconciled routes
        id: validate_api
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          DIR=/tmp/open-pr-reconciliation-api; mkdir -p "$DIR"

          probe() {
            local name="$1" method="$2" path="$3" expected="$4" body="${5:-}" status='' type=''
            for attempt in $(seq 1 36); do
              local separator='?'; [[ "$path" == *\?* ]] && separator='&'
              local url="$BASE$path${separator}release_check=oprr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
              local args=(-sS -L -X "$method" -D "$DIR/$name.headers" -o "$DIR/$name.body" -w '%{http_code}' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache')
              if [[ -n "$body" ]]; then args+=(-H 'Content-Type: application/json' --data "$body"); fi
              status="$(curl "${args[@]}" "$url" || true)"
              type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub(/\r/, ""); print $2}' "$DIR/$name.headers" 2>/dev/null | tail -1)"
              if [[ ",$expected," == *",$status,"* && "$type" == application/json* ]]; then
                jq -e 'type == "object"' "$DIR/$name.body" >/dev/null
                return 0
              fi
              sleep 10
            done
            echo "$path did not reach expected status $expected with JSON." >&2
            cat "$DIR/$name.body" >&2 || true
            return 1
          }

          probe health GET '/health' '200'
          probe version GET '/api/version' '200'
          probe sell-status GET '/api/customers/sell/status' '401'
          probe sell-preview POST '/api/customers/sell/preview' '401' '{}'
          probe sell-import POST '/api/customers/sell/import' '401' '{}'
          probe sell-runs GET '/api/customers/sell/runs' '401'
          probe role-summary GET '/api/runtime/v2/role-policy/summary' '401'
          probe audit-history GET '/api/admin/audit-history/events' '401'
          probe module065-sso POST '/api/microsoft-integration/sso-apply-profile' '401' '{}'
          probe module065-services POST '/api/microsoft-integration/services-apply-profile' '401' '{}'
          probe module065-mail-test POST '/api/microsoft-integration/mail-runtime/test' '401,403' '{}'

          READY="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.latestReadyRevisionName' -o tsv)"
          [[ "$READY" == '${{ steps.deploy_api.outputs.revision }}' ]]
          ACTIVE_IMAGE="$(az containerapp revision show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --revision "$READY" --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_IMAGE" == '${{ steps.build.outputs.api_image }}' ]]
          echo "ready_revision=$READY" >> "$GITHUB_OUTPUT"
          echo 'OPEN_PR_RECONCILIATION_API_VALIDATION=PASS'

      - name: Deploy exact web candidate
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          SUFFIX="oprrweb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REVISION='${{ vars.AZURE_WEB_APP }}'"--$SUFFIX"
          echo 'started=true' >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --image '${{ steps.build.outputs.web_image }}' --revision-suffix "$SUFFIX" --output none

      - name: Wait for exact web revision
        shell: bash
        run: bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_WEB_APP }}' '${{ steps.deploy_web.outputs.revision }}' '${{ steps.build.outputs.web_image }}' 60 10

      - name: Validate served More menu, Module 011 retirement, SELL sync, and admin runtime assets
        id: validate_web
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          READY=false
          for attempt in $(seq 1 36); do
            BUSTER="oprr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            HTML_STATUS="$(curl -sS -L -H 'Cache-Control: no-cache, no-store' -o /tmp/oprr-index.html -w '%{http_code}' "$BASE/?release_check=$BUSTER" || true)"
            if [[ "$HTML_STATUS" == '200' ]]; then
              JS_PATH="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/oprr-index.html | head -1)"
              CSS_PATH="$(sed -nE 's/.*href="([^"]+\.css)".*/\1/p' /tmp/oprr-index.html | head -1)"
              [[ "$JS_PATH" == http* ]] && JS_URL="$JS_PATH" || JS_URL="$BASE${JS_PATH/#\//\/}"
              [[ "$CSS_PATH" == http* ]] && CSS_URL="$CSS_PATH" || CSS_URL="$BASE${CSS_PATH/#\//\/}"
              JS_STATUS="$(curl -sS -L -H 'Cache-Control: no-cache, no-store' -o /tmp/oprr-app.js -w '%{http_code}' "$JS_URL?release_check=$BUSTER" || true)"
              CSS_STATUS="$(curl -sS -L -H 'Cache-Control: no-cache, no-store' -o /tmp/oprr-app.css -w '%{http_code}' "$CSS_URL?release_check=$BUSTER" || true)"
              if [[ "$JS_STATUS" == '200' && "$CSS_STATUS" == '200' ]] \
                && grep -Fq 'Search module number or page name' /tmp/oprr-app.js \
                && grep -Fq 'X-ProjectPulse-View-As-User' /tmp/oprr-app.js \
                && grep -Fq 'Project creation and project/task management moved to Modules 055D and 055C.' /tmp/oprr-app.js \
                && grep -Fq '/api/customers/sell/status' /tmp/oprr-app.js \
                && grep -Fq '/api/customers/sell/preview' /tmp/oprr-app.js \
                && grep -Fq '/api/admin/audit-history/events' /tmp/oprr-app.js \
                && grep -Fq 'module_065_services_profile_not_active' /tmp/oprr-app.js \
                && grep -Fq 'projectpulse-more-menu-tools' /tmp/oprr-app.css \
                && grep -Fq 'microsoft-mail-transport-readiness' /tmp/oprr-app.css; then
                READY=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$READY" == true ]]
          REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.latestReadyRevisionName' -o tsv)"
          [[ "$REVISION" == '${{ steps.deploy_web.outputs.revision }}' ]]
          ACTIVE_IMAGE="$(az containerapp revision show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --revision "$REVISION" --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_IMAGE" == '${{ steps.build.outputs.web_image }}' ]]
          echo "ready_revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo 'OPEN_PR_RECONCILIATION_WEB_VALIDATION=PASS'

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/open-pr-reconciliation-test-deployment.json <<JSON
          {
            "environment": "test",
            "releaseCommit": "${{ steps.release.outputs.target_commit }}",
            "workflowCommit": "${{ github.sha }}",
            "runId": "${{ github.run_id }}",
            "apiImage": "${{ steps.build.outputs.api_image }}",
            "webImage": "${{ steps.build.outputs.web_image }}",
            "migrationImage": "${{ steps.migration.outputs.image }}",
            "previousApiImage": "${{ steps.before.outputs.current_api_image }}",
            "previousWebImage": "${{ steps.before.outputs.current_web_image }}",
            "apiRevision": "${{ steps.validate_api.outputs.ready_revision }}",
            "webRevision": "${{ steps.validate_web.outputs.ready_revision }}",
            "migration049": "applied-or-verified",
            "operationalRows": "preserved-by-guard",
            "sellExternalApiCalledByDeployment": false,
            "providerCredentialsChanged": false,
            "module011DataDeleted": false,
            "rollbackImageResolution": "fail-closed",
            "imageRollbackOnFailure": "candidate-only",
            "migrationRollbackOnFailure": "not-automatic-additive-schema-remains",
            "smokeTests": "passed"
          }
          JSON

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: open-pr-reconciliation-test-${{ github.run_id }}
          path: evidence/open-pr-reconciliation-test-deployment.json
          retention-days: 30

      - name: Restore captured web and API images on failure
        if: ${{ failure() && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set +e
          if [[ '${{ steps.deploy_web.outputs.started }}' == 'true' ]]; then
            ACTIVE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv 2>/dev/null)"
            if [[ "$ACTIVE" == '${{ steps.build.outputs.web_image }}' ]]; then
              SUFFIX="oprrwebrb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              REVISION='${{ vars.AZURE_WEB_APP }}'"--$SUFFIX"
              az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --image '${{ steps.before.outputs.current_web_image }}' --revision-suffix "$SUFFIX" --output none
              bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_WEB_APP }}' "$REVISION" '${{ steps.before.outputs.current_web_image }}' 60 10
            else
              echo "Web rollback skipped because another image is active: $ACTIVE" >&2
            fi
          fi
          if [[ '${{ steps.deploy_api.outputs.started }}' == 'true' ]]; then
            ACTIVE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv 2>/dev/null)"
            if [[ "$ACTIVE" == '${{ steps.build.outputs.api_image }}' ]]; then
              SUFFIX="oprrapirb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              REVISION='${{ vars.AZURE_API_APP }}'"--$SUFFIX"
              az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --image '${{ steps.before.outputs.current_api_image }}' --revision-suffix "$SUFFIX" --output none
              bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_API_APP }}' "$REVISION" '${{ steps.before.outputs.current_api_image }}' 60 10
            else
              echo "API rollback skipped because another image is active: $ACTIVE" >&2
            fi
          fi
