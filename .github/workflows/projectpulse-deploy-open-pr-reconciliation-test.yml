name: ProjectPulse Deploy Open PR Reconciliation Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified source release containing all reconciled open PR work
        required: true
        default: b24ea3db7d0c839d03804975e87b7929dba8c7f6
        type: string
      confirmation:
        description: Enter DEPLOY-OPEN-PR-RECONCILIATION-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-open-pr-reconciliation-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded reconciled source, migration 049, API, and web test deployment
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_RELEASE_COMMIT: b24ea3db7d0c839d03804975e87b7929dba8c7f6

    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact reconciled source release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and validate exact reconciled release
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$WORKFLOW_SOURCE_REF" == 'refs/heads/main' ]] || {
            echo 'Dispatch this workflow from main.' >&2
            exit 1
          }
          [[ "$DISPATCH_CONFIRMATION" == 'DEPLOY-OPEN-PR-RECONCILIATION-TO-TEST' ]] || {
            echo 'The deployment confirmation text does not match.' >&2
            exit 1
          }
          [[ "$DISPATCH_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release_commit must be a complete 40-character SHA.' >&2
            exit 1
          }

          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == "$WORKFLOW_SOURCE_SHA" ]]
          [[ "$TARGET_COMMIT" == "$DISPATCH_RELEASE_COMMIT" ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || {
            echo 'Only the verified open-PR reconciliation source release may deploy.' >&2
            exit 1
          }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || {
            echo 'The source release is not an ancestor of the deployment controls.' >&2
            exit 1
          }

          SELL_MODULE='release/src/backend/ProjectTime.Api/Modules/CustomerDirectorySellSyncModule.cs'
          REGISTRAR='release/src/backend/ProjectTime.Api/Modules/GlobalMailConfigurationModule.cs'
          MORE_BRIDGE='release/src/frontend/project-time-web/src/module-availability-bridge.js'
          MORE_REGISTRY='release/src/frontend/project-time-web/src/module-availability-registry.js'
          ADMIN_RUNTIME='release/src/frontend/project-time-web/src/AdminRuntimeStabilityPortal.jsx'
          CUSTOMER_UI='release/src/frontend/project-time-web/src/CustomerDirectoryCenter.jsx'
          MIGRATION='release/database/migrations/049_module_021_sell_customer_sync.sql'

          for required in \
            "$SELL_MODULE" "$REGISTRAR" "$MORE_BRIDGE" "$MORE_REGISTRY" \
            "$ADMIN_RUNTIME" "$CUSTOMER_UI" "$MIGRATION" \
            release/src/backend/ProjectTime.Api/ProjectTime.Api.csproj \
            release/tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj \
            release/tests/test-projectpulse-api-startup.sh \
            release/src/frontend/project-time-web/scripts/validate-admin-runtime-stability.mjs \
            release/src/frontend/project-time-web/scripts/validate-group-1-navigation-work-consolidation.mjs \
            release/src/frontend/project-time-web/scripts/validate-modules-021-026-sell-customer-sync.mjs \
            control/scripts/apply-open-pr-reconciliation-test-migration-049.sh \
            control/scripts/run-open-pr-reconciliation-test-migration-job.sh \
            control/scripts/run-open-pr-reconciliation-test-deployment.sh; do
            test -f "$required"
          done

          grep -Fq '049_module_021_sell_customer_sync' "$SELL_MODULE"
          grep -Fq '/api/customers/sell/status' "$SELL_MODULE"
          grep -Fq '/api/customers/sell/preview' "$SELL_MODULE"
          grep -Fq '/api/customers/sell/import' "$SELL_MODULE"
          grep -Fq 'MapCustomerDirectorySellSyncEndpoints' "$REGISTRAR"
          grep -Fq 'X-ProjectPulse-View-As-User' "$MORE_BRIDGE"
          grep -Fq 'Search module number or page name' "$MORE_BRIDGE"
          grep -Fq "lifecycle: 'retired'" "$MORE_REGISTRY"
          grep -Fq "'work-task-builder': 'work-register'" "$MORE_REGISTRY"
          grep -Fq 'Project creation and project/task management moved to Modules 055D and 055C.' "$MORE_REGISTRY"
          grep -Fq 'Synchronization history is consolidated in Module 008' "$ADMIN_RUNTIME"
          grep -Fq '/api/customers/sell/status' "$CUSTOMER_UI"
          grep -Fq 'CREATE TABLE IF NOT EXISTS customer_directory_source_links' "$MIGRATION"
          grep -Fq 'CREATE TABLE IF NOT EXISTS customer_directory_sync_runs' "$MIGRATION"
          grep -Fq "'049_module_021_sell_customer_sync'" "$MIGRATION"

          (
            cd release
            dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
            dotnet run \
              --project tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj \
              --configuration Release
            bash tests/test-projectpulse-api-startup.sh
          )

          (
            cd release/src/frontend/project-time-web
            npm ci --no-audit --no-fund
            node scripts/validate-admin-runtime-stability.mjs
            node scripts/validate-group-1-navigation-work-consolidation.mjs
            node scripts/validate-modules-021-026-sell-customer-sync.mjs
            npm run validate:microsoft-connection
            npm run validate:microsoft-sso-runtime
            npm run build
          )

          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'OPEN_PR_RECONCILIATION_SOURCE_VALIDATION=PASS'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify live API database configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t ENV_NAMES < <(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            --query 'properties.template.containers[0].env[].name' -o tsv)
          printf '%s\n' "${ENV_NAMES[@]}" | sort -u > /tmp/open-pr-reconciliation-api-env-names
          for name in PTP_DB_HOST PTP_DB_PORT PTP_DB_NAME PTP_DB_USER PTP_DB_PASSWORD; do
            grep -Fxq "$name" /tmp/open-pr-reconciliation-api-env-names || {
              echo "Missing required API environment variable: $name" >&2
              exit 1
            }
          done
          echo 'OPEN_PR_RECONCILIATION_DATABASE_CONFIGURATION=COMPLETE'

      - name: Load test database connection
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        run: bash control/scripts/export-pr55-test-database-url.sh

      - name: Build, migrate, deploy, validate, and preserve rollback evidence
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: >-
          bash control/scripts/run-open-pr-reconciliation-test-deployment.sh
          control
          release
          '${{ steps.release.outputs.target_commit }}'

      - name: Upload immutable deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: open-pr-reconciliation-test-${{ github.run_id }}
          path: control/evidence/open-pr-reconciliation-test-deployment.json
          retention-days: 30
