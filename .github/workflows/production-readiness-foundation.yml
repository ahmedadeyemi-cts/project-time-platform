name: Production Readiness Foundation (offline)

on:
  pull_request:
    paths:
      - 'scripts/production-readiness/**'
      - 'docs/production-readiness/foundation/**'
      - 'tests/production-readiness/**'
      - 'database/migrations/**'
      - 'database/demo/**'
      - 'database/seed-data/**'
      - 'deployment/rocky-linux/**'
      - '.github/workflows/production-readiness-foundation.yml'

permissions:
  contents: read

jobs:
  offline-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test catalog drift, declared separation and preparation checks
        run: python3 -m unittest discover -s tests/production-readiness -p 'test_*.py' -v
      - name: Inventory initialization SQL without executing it
        run: python3 scripts/production-readiness/check_foundation.py --inventory > "$RUNNER_TEMP/production-initialization-inventory.json"
