name: Finalize Current-Main Protected-Test Controller

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/finalize-pr648-current-main-controller.yml'

permissions:
  contents: write

concurrency:
  group: finalize-current-main-protected-test-controller
  cancel-in-progress: false

jobs:
  finalize:
    name: Export one exact current-main release controller
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/deploy-current-main-protected-test-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_CONTROLLER_COMMIT: b46903c70e86e02fe30884cf7e536d2acafa69a4
      SOURCE_CONTROLLER_PATH: .github/workflows/deploy-pr645-module001a-module013-test.yml
      CONTROLLER: .github/workflows/deploy-current-main-protected-test.yml
      SELF: .github/workflows/finalize-pr648-current-main-controller.yml
      OLD_RELEASE_COMMIT: 2cef6fc8e15948db2b0c645967323a4bedff0aa7
      TARGET_RELEASE_COMMIT: 654af0e469f1fba348f7f7dcbac0fde4c5346a59

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build, validate, and export the protected-Test controller blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          [[ "$GITHUB_REPOSITORY" == 'ahmedadeyemi-cts/project-time-platform' ]] || fail 'Unexpected repository.'
          [[ "$(git rev-parse HEAD)" == '${{ github.event.pull_request.head.sha }}' ]] || fail 'Checkout is not the exact PR head.'
          [[ -f "$SELF" ]] || fail 'Finalizer workflow is missing.'
          [[ ! -e "$CONTROLLER" ]] || fail 'Final controller already exists unexpectedly.'
          [[ -n "$GH_TOKEN" ]] || fail 'GitHub workflow token is unavailable.'

          git fetch origin main --no-tags
          [[ "$(git rev-parse origin/main)" == "$TARGET_RELEASE_COMMIT" ]] || fail 'Main moved; refusing to pin an obsolete release.'

          SOURCE_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$SOURCE_CONTROLLER_PATH?ref=$SOURCE_CONTROLLER_COMMIT"
          curl -fsSL --retry 4 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$SOURCE_URL" \
            | jq -r '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > "$RUNNER_TEMP/source-controller.yml"
          [[ -s "$RUNNER_TEMP/source-controller.yml" ]] || fail 'Reviewed source controller could not be retrieved.'
          grep -Fq 'name: Deploy PR 645 Module 001A and Module 013 to Protected Test' "$RUNNER_TEMP/source-controller.yml" \
            || fail 'Retrieved source controller is not the reviewed deployment workflow.'

          python3 - <<'PY'
          import os
          from pathlib import Path

          source_path = Path(os.environ['RUNNER_TEMP']) / 'source-controller.yml'
          new_path = Path(os.environ['CONTROLLER'])
          old_sha = os.environ['OLD_RELEASE_COMMIT']
          target_sha = os.environ['TARGET_RELEASE_COMMIT']
          text = source_path.read_text(encoding='utf-8')

          old_pin_count = text.count(old_sha)
          if old_pin_count != 4:
              raise SystemExit(f'Expected exactly four reviewed release pins, found {old_pin_count}.')

          text = text.replace(old_sha, target_sha)
          replacements = {
              'name: Deploy PR 645 Module 001A and Module 013 to Protected Test':
                  'name: Deploy Current Pulse Main 654af0e to Protected Test',
              'Validate exact PR 645 protected-Test release controller':
                  'Validate exact current-main protected-Test release controller',
              '.github/workflows/deploy-pr645-module001a-module013-test.yml':
                  '.github/workflows/deploy-current-main-protected-test.yml',
              'The combined PR #645 and startup-fix release is not an ancestor of this controller.':
                  'The pinned current-main release is not an ancestor of this controller.',
              'The exact release is not contained in current main.':
                  'The pinned release is not contained in current main.',
              '/tmp/pr645-module001a-module013-test-evidence':
                  '/tmp/pulse-current-main-654af0e-test-evidence',
              'pr645-module001a-module013-':
                  'pulse-current-main-654af0e-',
              'Deploy PR #645 Module 001A and Module 013 to protected Test':
                  'Deploy current Pulse main 654af0e to protected Test',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          validation_anchor = '          node tests/validate-module001a-viewas-module013-operations.mjs\n'
          validation_additions = (
              '          node tests/validate-celar-ai-public-question-resilience.mjs\n'
              '          node tests/validate-celar-ai-pr630-consolidated.mjs\n'
              '          node src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs\n'
          )
          if validation_anchor not in text:
              raise SystemExit('Focused source-validation anchor is missing.')
          if 'node tests/validate-celar-ai-public-question-resilience.mjs' not in text:
              text = text.replace(validation_anchor, validation_anchor + validation_additions, 1)

          deploy_anchor = '          (cd release && node tests/validate-module001a-viewas-module013-operations.mjs)\n'
          deploy_additions = (
              '          (cd release && node tests/validate-celar-ai-public-question-resilience.mjs)\n'
              '          (cd release && node tests/validate-celar-ai-pr630-consolidated.mjs)\n'
              '          (cd release && node src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs)\n'
          )
          if deploy_anchor not in text:
              raise SystemExit('Focused deployment-validation anchor is missing.')
          if '(cd release && node tests/validate-celar-ai-public-question-resilience.mjs)' not in text:
              text = text.replace(deploy_anchor, deploy_anchor + deploy_additions, 1)

          required = (
              f'TARGET_RELEASE_COMMIT: {target_sha}',
              f'ref: {target_sha}',
              'environment: test',
              'PROJECTPULSE_TEST_UAT_SESSION',
              'PRODUCTION_MUTATION=NONE',
              'validate-celar-ai-public-question-resilience.mjs',
              'validate-celar-ai-pr630-consolidated.mjs',
              'validate-celar-ai-external-deidentification.mjs',
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('Final controller is missing markers: ' + ', '.join(missing))
          if old_sha in text:
              raise SystemExit('Obsolete release pin remains in the final controller.')
          if 'workflow_dispatch:' in text:
              raise SystemExit('Manual deployment trigger is not permitted.')

          new_path.write_text(text, encoding='utf-8')
          PY

          git diff --check -- "$CONTROLLER"
          [[ "$(grep -Fc "$TARGET_RELEASE_COMMIT" "$CONTROLLER")" -eq 4 ]] || fail 'Current-main release pin cardinality is incorrect.'
          [[ "$(grep -Fc 'validate-celar-ai-public-question-resilience.mjs' "$CONTROLLER")" -eq 2 ]] || fail 'Public-question validator cardinality is incorrect.'
          [[ "$(grep -Fc 'validate-celar-ai-pr630-consolidated.mjs' "$CONTROLLER")" -eq 2 ]] || fail 'Consolidated validator cardinality is incorrect.'
          [[ "$(grep -Fc 'validate-celar-ai-external-deidentification.mjs' "$CONTROLLER")" -eq 2 ]] || fail 'Privacy validator cardinality is incorrect.'

          LOCAL_BLOB_SHA="$(git hash-object "$CONTROLLER")"
          REMOTE_BLOB_SHA="$(jq -Rs '{content:.,encoding:"utf-8"}' < "$CONTROLLER" \
            | curl -fsSL --retry 4 --retry-all-errors -X POST \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs" \
                --data-binary @- \
            | jq -r '.sha')"
          [[ "$REMOTE_BLOB_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'GitHub did not return a valid controller blob SHA.'
          [[ "$REMOTE_BLOB_SHA" == "$LOCAL_BLOB_SHA" ]] || fail 'Remote controller blob differs from the validated local file.'

          echo "CONTROLLER_BLOB_SHA=$REMOTE_BLOB_SHA"
          echo "CONTROLLER_PATH=$CONTROLLER"
          echo "TARGET_RELEASE_COMMIT=$TARGET_RELEASE_COMMIT"
          echo 'FINAL_PR_DIFF_EXPECTED=.github/workflows/deploy-current-main-protected-test.yml'
