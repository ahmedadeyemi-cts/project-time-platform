name: Diagnose Module 083 Protected Test Deployment Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/module083-deployment-run-observer.yml'

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  statuses: write

concurrency:
  group: module083-deployment-run-observer
  cancel-in-progress: false

jobs:
  diagnose:
    name: Capture Module 083 deployment startup evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_RUN_ID: '31329214801'
      TARGET_CONTROL_COMMIT: 4d80605e130346323fa7d5df33dc5cf27fbd1ab3
      TARGET_PR: '587'
      STATUS_CONTEXT: projectpulse/module083-test-run-locator
    steps:
      - name: Read exact run, jobs, checks, and annotations
        id: diagnose
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          RUN_META="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID"
          )"
          [[ "$(jq -r '.id' <<<"$RUN_META")" == "$TARGET_RUN_ID" ]]
          [[ "$(jq -r '.head_sha' <<<"$RUN_META")" == "$TARGET_CONTROL_COMMIT" ]]
          [[ "$(jq -r '.event' <<<"$RUN_META")" == push ]]
          [[ "$(jq -r '.path' <<<"$RUN_META" | cut -d@ -f1)" == '.github/workflows/projectpulse-deploy-module083-test.yml' ]]

          RUN_JOBS="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/jobs?filter=all&per_page=100"
          )"

          CHECK_SUITE_ID="$(jq -r '.check_suite_id // empty' <<<"$RUN_META")"
          CHECK_RUNS='{"total_count":0,"check_runs":[]}'
          if [[ "$CHECK_SUITE_ID" =~ ^[0-9]+$ ]]; then
            CHECK_RUNS="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/check-suites/$CHECK_SUITE_ID/check-runs?filter=latest&per_page=100"
            )"
          fi

          ANNOTATIONS='[]'
          while IFS= read -r CHECK_RUN_ID; do
            [[ "$CHECK_RUN_ID" =~ ^[0-9]+$ ]] || continue
            CURRENT="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID/annotations?per_page=100"
            )"
            ANNOTATIONS="$(jq -c --argjson current "$CURRENT" '. + $current' <<<"$ANNOTATIONS")"
          done < <(jq -r '.check_runs[]?.id' <<<"$CHECK_RUNS")

          DIAGNOSTIC_FILE="$RUNNER_TEMP/module083-deployment-diagnostic.json"
          jq -n \
            --argjson run "$(jq '{id,name,display_title,path,event,status,conclusion,run_number,run_attempt,head_sha,created_at,updated_at,check_suite_id,html_url}' <<<"$RUN_META")" \
            --argjson jobs "$(jq '{total_count,jobs:[.jobs[]? | {id,name,status,conclusion,started_at,completed_at,html_url}]}' <<<"$RUN_JOBS")" \
            --argjson checks "$(jq '{total_count,check_runs:[.check_runs[]? | {id,name,status,conclusion,details_url,started_at,completed_at,output:{title:.output.title,summary:.output.summary,text:.output.text}}]}' <<<"$CHECK_RUNS")" \
            --argjson annotations "$ANNOTATIONS" \
            '{run:$run,jobs:$jobs,checks:$checks,annotations:$annotations}' \
            > "$DIAGNOSTIC_FILE"

          RUN_STATUS="$(jq -r '.run.status' "$DIAGNOSTIC_FILE")"
          RUN_CONCLUSION="$(jq -r '.run.conclusion // "pending"' "$DIAGNOSTIC_FILE")"
          JOB_COUNT="$(jq -r '.jobs.total_count // 0' "$DIAGNOSTIC_FILE")"
          CHECK_COUNT="$(jq -r '.checks.total_count // 0' "$DIAGNOSTIC_FILE")"
          ANNOTATION_COUNT="$(jq -r '.annotations | length' "$DIAGNOSTIC_FILE")"
          FIRST_MESSAGE="$(jq -r '[.annotations[]?.message, .checks.check_runs[]?.output.title, .checks.check_runs[]?.output.summary] | map(select(type == "string" and length > 0)) | .[0] // "no_diagnostic_message"' "$DIAGNOSTIC_FILE")"
          MESSAGE_SLUG="$(printf '%s' "$FIRST_MESSAGE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-55)"
          [[ -n "$MESSAGE_SLUG" ]] || MESSAGE_SLUG='no-diagnostic-message'

          echo "run_status=$RUN_STATUS" >> "$GITHUB_OUTPUT"
          echo "run_conclusion=$RUN_CONCLUSION" >> "$GITHUB_OUTPUT"
          echo "job_count=$JOB_COUNT" >> "$GITHUB_OUTPUT"
          echo "check_count=$CHECK_COUNT" >> "$GITHUB_OUTPUT"
          echo "annotation_count=$ANNOTATION_COUNT" >> "$GITHUB_OUTPUT"
          echo "message_slug=$MESSAGE_SLUG" >> "$GITHUB_OUTPUT"

          BODY_FILE="$RUNNER_TEMP/module083-deployment-diagnostic.md"
          {
            echo '<!-- module083-deployment-startup-diagnostic -->'
            echo '## Module 083 protected Test deployment diagnostic'
            echo
            printf -- '- Run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$TARGET_RUN_ID"
            printf -- '- Status: `%s`\n' "$RUN_STATUS"
            printf -- '- Conclusion: `%s`\n' "$RUN_CONCLUSION"
            printf -- '- Jobs: `%s`\n' "$JOB_COUNT"
            printf -- '- Check runs: `%s`\n' "$CHECK_COUNT"
            printf -- '- Annotations: `%s`\n' "$ANNOTATION_COUNT"
            echo
            echo '```json'
            jq . "$DIAGNOSTIC_FILE"
            echo '```'
            echo
            echo 'This diagnostic performed no deployment, migration, secret, infrastructure, Test, Production, or private-runtime action.'
          } > "$BODY_FILE"

          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments" \
            -f body="$(cat "$BODY_FILE")" >/dev/null
          cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish machine-readable diagnostic statuses
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ steps.diagnose.outputs.run_status }}
          RUN_CONCLUSION: ${{ steps.diagnose.outputs.run_conclusion }}
          JOB_COUNT: ${{ steps.diagnose.outputs.job_count }}
          CHECK_COUNT: ${{ steps.diagnose.outputs.check_count }}
          ANNOTATION_COUNT: ${{ steps.diagnose.outputs.annotation_count }}
          MESSAGE_SLUG: ${{ steps.diagnose.outputs.message_slug }}
        run: |
          set -Eeuo pipefail
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID"
          STATE='failure'
          [[ "$RUN_STATUS" != completed ]] && STATE='pending'
          [[ "$RUN_STATUS" == completed && "$RUN_CONCLUSION" == success ]] && STATE='success'

          publish() {
            local context="$1" description="$2"
            gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/statuses/$TARGET_CONTROL_COMMIT" \
              -f state="$STATE" \
              -f context="$context" \
              -f description="${description:0:140}" \
              -f target_url="$RUN_URL" >/dev/null
          }

          publish "$STATUS_CONTEXT" "Module 083 Test run $TARGET_RUN_ID: ${RUN_STATUS:-unknown}/${RUN_CONCLUSION:-unknown}"
          publish "projectpulse/module083-run-${RUN_STATUS:-unknown}-${RUN_CONCLUSION:-unknown}-jobs-${JOB_COUNT:-0}" "Exact deployment run state and job count"
          publish "projectpulse/module083-checks-${CHECK_COUNT:-0}-annotations-${ANNOTATION_COUNT:-0}" "Check-run and annotation counts"
          publish "projectpulse/module083-diagnostic-${MESSAGE_SLUG:-unavailable}" "First available startup diagnostic"

          echo "MODULE_083_RUN_STATUS=${RUN_STATUS:-unknown}"
          echo "MODULE_083_RUN_CONCLUSION=${RUN_CONCLUSION:-unknown}"
          echo "MODULE_083_RUN_JOB_COUNT=${JOB_COUNT:-0}"
          echo "MODULE_083_CHECK_COUNT=${CHECK_COUNT:-0}"
          echo "MODULE_083_ANNOTATION_COUNT=${ANNOTATION_COUNT:-0}"
          echo 'DEPLOYMENT_ACTIONS=NONE'
          echo 'MIGRATION_ACTIONS=NONE'
          echo 'PRODUCTION_CHANGES=NONE'