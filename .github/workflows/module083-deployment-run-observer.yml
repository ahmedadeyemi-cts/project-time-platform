name: Observe Module 083 Protected Test Candidate Promotion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/module083-deployment-run-observer.yml'

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: module083-deployment-run-observer
  cancel-in-progress: false

jobs:
  observe:
    name: Locate and verify exact Module 083 candidate promotion
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_WORKFLOW: .github/workflows/projectpulse-promote-module083-candidate-test.yml
      TARGET_CONTROL_COMMIT: 4883cc2f93df312bb3e767a5d41d6cc98d5a8f51
      STATUS_CONTEXT: projectpulse/module083-candidate-promotion
      EXPECTED_ARTIFACT_PREFIX: module-083-candidate-promotion-

    steps:
      - name: Locate exact push-triggered promotion run
        id: locate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          RUN_ID=''
          RUN_URL=''

          for poll in $(seq 1 60); do
            RUNS="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/actions/runs?event=push&branch=main&per_page=100"
            )"
            TARGET="$(
              jq -c \
                --arg sha "$TARGET_CONTROL_COMMIT" \
                --arg path "$TARGET_WORKFLOW" '
                  [.workflow_runs[]
                    | select(
                        .head_sha == $sha
                        and .event == "push"
                        and ((.path | split("@")[0]) == $path)
                      )]
                  | sort_by(.created_at)
                  | reverse
                  | .[0] // {}
                ' <<<"$RUNS"
            )"
            RUN_ID="$(jq -r '.id // empty' <<<"$TARGET")"
            RUN_URL="$(jq -r '.html_url // empty' <<<"$TARGET")"
            [[ -n "$RUN_ID" ]] && break
            sleep 10
          done

          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || {
            echo 'The exact Module 083 candidate promotion run was not found.' >&2
            exit 1
          }
          [[ -n "$RUN_URL" ]]

          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_CONTROL_COMMIT" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Module 083 Test promotion run $RUN_ID is being verified" \
            -f target_url="$RUN_URL" >/dev/null

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "TARGET_RUN_ID=$RUN_ID"
          echo "TARGET_RUN_URL=$RUN_URL"

      - name: Wait for completion and verify immutable evidence
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          RUN_URL: ${{ steps.locate.outputs.run_url }}
        run: |
          set -Eeuo pipefail
          TARGET=''
          CONCLUSION=''

          for poll in $(seq 1 480); do
            TARGET="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            )"
            [[ "$(jq -r '.head_sha' <<<"$TARGET")" == "$TARGET_CONTROL_COMMIT" ]]
            [[ "$(jq -r '.event' <<<"$TARGET")" == push ]]
            [[ "$(jq -r '.path' <<<"$TARGET" | cut -d@ -f1)" == "$TARGET_WORKFLOW" ]]

            STATUS="$(jq -r '.status' <<<"$TARGET")"
            ATTEMPT="$(jq -r '.run_attempt' <<<"$TARGET")"
            echo "TARGET_POLL=$poll STATUS=$STATUS ATTEMPT=$ATTEMPT"
            if [[ "$STATUS" == completed ]]; then
              CONCLUSION="$(jq -r '.conclusion // "unknown"' <<<"$TARGET")"
              break
            fi
            sleep 15
          done

          [[ -n "$CONCLUSION" ]] || CONCLUSION=timed_out
          ATTEMPT="$(jq -r '.run_attempt // 0' <<<"$TARGET")"

          JOBS="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100"
          )"
          jq -r '.jobs[] | [.id,.name,.status,(.conclusion // "none")] | @tsv' <<<"$JOBS" \
            | sed 's/^/TARGET_JOB=/'

          ARTIFACTS="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100"
          )"
          ARTIFACT_NAME="$(
            jq -r --arg prefix "$EXPECTED_ARTIFACT_PREFIX" '
              [.artifacts[]
                | select(.expired == false and (.name | startswith($prefix)))]
              | sort_by(.created_at)
              | reverse
              | .[0].name // empty
            ' <<<"$ARTIFACTS"
          )"
          ARTIFACT_DIGEST="$(
            jq -r --arg name "$ARTIFACT_NAME" '
              [.artifacts[] | select(.name == $name)]
              | .[0].digest // empty
            ' <<<"$ARTIFACTS"
          )"

          STATE=failure
          [[ "$CONCLUSION" == success && -n "$ARTIFACT_NAME" ]] && STATE=success
          DESCRIPTION="Module 083 Test promotion $RUN_ID attempt $ATTEMPT: $CONCLUSION"
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_CONTROL_COMMIT" \
            -f state="$STATE" \
            -f context="$STATUS_CONTEXT" \
            -f description="${DESCRIPTION:0:140}" \
            -f target_url="$RUN_URL" >/dev/null

          echo "TARGET_RUN_CONCLUSION=$CONCLUSION"
          echo "TARGET_RUN_ATTEMPT=$ATTEMPT"
          echo "TARGET_ARTIFACT_NAME=${ARTIFACT_NAME:-none}"
          echo "TARGET_ARTIFACT_DIGEST=${ARTIFACT_DIGEST:-none}"

          [[ "$CONCLUSION" == success ]]
          [[ -n "$ARTIFACT_NAME" ]]
          echo 'MODULE_083_CANDIDATE_PROMOTION_OBSERVER=PASSED'
