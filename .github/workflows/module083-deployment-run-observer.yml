name: Locate Corrected Module 083 Protected Test Deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/module083-deployment-run-observer.yml'

permissions:
  actions: read
  contents: read
  issues: write
  statuses: write

concurrency:
  group: module083-deployment-run-observer
  cancel-in-progress: false

jobs:
  locate:
    name: Publish corrected Module 083 deployment run identity
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_WORKFLOW: projectpulse-deploy-module083-test-v2.yml
      TARGET_CONTROL_COMMIT: 2e67aa894a67d1ef0ded78e7c6270c9c52903743
      TARGET_PR: '593'
      STATUS_CONTEXT: projectpulse/module083-v2-test-run-locator
    steps:
      - name: Locate exact push-triggered deployment run
        id: locate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          EXPECTED_PATH=".github/workflows/$TARGET_WORKFLOW"
          EXACT_RUN=''
          RUNS=''

          for attempt in $(seq 1 60); do
            RUNS="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?event=push&branch=main&per_page=50"
            )"
            EXACT_RUN="$(
              jq -c \
                --arg sha "$TARGET_CONTROL_COMMIT" \
                --arg expected "$EXPECTED_PATH" '
                  [.workflow_runs[]
                    | select(
                        .head_sha == $sha
                        and .event == "push"
                        and ((.path // "") | split("@")[0]) == $expected
                      )]
                  | sort_by(.created_at)
                  | reverse
                  | .[0] // empty
                ' <<<"$RUNS"
            )"
            [[ -n "$EXACT_RUN" ]] && break
            sleep 10
          done

          if [[ -n "$EXACT_RUN" ]]; then
            RUN_ID="$(jq -r '.id' <<<"$EXACT_RUN")"
            RUN_URL="$(jq -r '.html_url' <<<"$EXACT_RUN")"
            RUN_STATUS="$(jq -r '.status' <<<"$EXACT_RUN")"
            RUN_CONCLUSION="$(jq -r '.conclusion // "pending"' <<<"$EXACT_RUN")"
            RUN_ATTEMPT="$(jq -r '.run_attempt' <<<"$EXACT_RUN")"
            RUN_CREATED="$(jq -r '.created_at' <<<"$EXACT_RUN")"
            RUN_PATH="$(jq -r '.path' <<<"$EXACT_RUN")"

            [[ "$RUN_ID" =~ ^[0-9]+$ ]]
            [[ "$RUN_URL" == "https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" ]]
            [[ "${RUN_PATH%%@*}" == "$EXPECTED_PATH" ]]

            {
              echo 'found=true'
              echo "run_id=$RUN_ID"
              echo "run_url=$RUN_URL"
              echo "run_status=$RUN_STATUS"
              echo "run_conclusion=$RUN_CONCLUSION"
              echo "run_attempt=$RUN_ATTEMPT"
              echo "run_created=$RUN_CREATED"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'found=false'
              echo 'run_id='
              echo 'run_url='
              echo 'run_status=not_found'
              echo 'run_conclusion=not_found'
              echo 'run_attempt=0'
              echo 'run_created='
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish locator on merged PR 593
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOUND: ${{ steps.locate.outputs.found }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          RUN_URL: ${{ steps.locate.outputs.run_url }}
          RUN_STATUS: ${{ steps.locate.outputs.run_status }}
          RUN_CONCLUSION: ${{ steps.locate.outputs.run_conclusion }}
          RUN_ATTEMPT: ${{ steps.locate.outputs.run_attempt }}
          RUN_CREATED: ${{ steps.locate.outputs.run_created }}
        run: |
          set -Eeuo pipefail
          BODY_FILE="$RUNNER_TEMP/module083-v2-run-locator.md"
          {
            echo '<!-- module083-v2-deployment-run-locator -->'
            if [[ "$FOUND" == true ]]; then
              echo '## Corrected Module 083 protected Test deployment located'
              echo
              printf -- '- Run ID: `%s`\n' "$RUN_ID"
              printf -- '- Attempt: `%s`\n' "$RUN_ATTEMPT"
              printf -- '- Status at observation: `%s`\n' "$RUN_STATUS"
              printf -- '- Conclusion at observation: `%s`\n' "$RUN_CONCLUSION"
              printf -- '- Created: `%s`\n' "$RUN_CREATED"
              printf -- '- Control commit: `%s`\n' "$TARGET_CONTROL_COMMIT"
              printf -- '- Run: %s\n' "$RUN_URL"
            else
              echo '## Corrected Module 083 protected Test deployment was not located'
              echo
              printf -- '- Expected workflow: `%s`\n' "$TARGET_WORKFLOW"
              printf -- '- Expected control commit: `%s`\n' "$TARGET_CONTROL_COMMIT"
            fi
            echo
            echo 'This observer performs no deployment, migration, secret, infrastructure, Test, Production, or private-runtime mutation.'
          } > "$BODY_FILE"

          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments" \
            -f body="$(cat "$BODY_FILE")" >/dev/null
          cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish immutable locator status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOUND: ${{ steps.locate.outputs.found }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          RUN_URL: ${{ steps.locate.outputs.run_url }}
          RUN_STATUS: ${{ steps.locate.outputs.run_status }}
          RUN_CONCLUSION: ${{ steps.locate.outputs.run_conclusion }}
          RUN_ATTEMPT: ${{ steps.locate.outputs.run_attempt }}
        run: |
          set -Eeuo pipefail
          STATE='failure'
          TARGET_URL="https://github.com/$GITHUB_REPOSITORY/actions"
          DESCRIPTION='Corrected Module 083 Test deployment run not found'

          if [[ "$FOUND" == true && "$RUN_ID" =~ ^[0-9]+$ ]]; then
            TARGET_URL="$RUN_URL"
            DESCRIPTION="Module 083 v2 run $RUN_ID: $RUN_STATUS/$RUN_CONCLUSION (attempt $RUN_ATTEMPT)"
            if [[ "$RUN_STATUS" != completed ]]; then
              STATE='pending'
            elif [[ "$RUN_CONCLUSION" == success ]]; then
              STATE='success'
            else
              STATE='failure'
            fi
          fi

          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_CONTROL_COMMIT" \
            -f state="$STATE" \
            -f context="$STATUS_CONTEXT" \
            -f description="${DESCRIPTION:0:140}" \
            -f target_url="$TARGET_URL" >/dev/null

          echo "MODULE_083_V2_TARGET_RUN_FOUND=${FOUND:-false}"
          echo "MODULE_083_V2_TARGET_RUN_ID=${RUN_ID:-none}"
          echo 'DEPLOYMENT_ACTIONS=NONE'
          echo 'MIGRATION_ACTIONS=NONE'
          echo 'PRODUCTION_CHANGES=NONE'
