name: Locate Module 083 Protected Test Deployment Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/module083-deployment-run-observer.yml'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: module083-deployment-run-observer
  cancel-in-progress: false

jobs:
  locate:
    name: Publish Module 083 deployment run identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_WORKFLOW: projectpulse-deploy-module083-test.yml
      TARGET_CONTROL_COMMIT: 4d80605e130346323fa7d5df33dc5cf27fbd1ab3
      TARGET_PR: '587'
    steps:
      - name: Inspect repository workflow runs and publish diagnostics
        id: locate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          EXPECTED_PATH=".github/workflows/$TARGET_WORKFLOW"
          RUNS="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs?event=push&branch=main&per_page=100"
          )"

          EXACT_RUN="$(
            jq -c \
              --arg sha "$TARGET_CONTROL_COMMIT" \
              --arg expected "$EXPECTED_PATH" '
                [.workflow_runs[]
                  | select(
                      .head_sha == $sha
                      and .event == "push"
                      and ((.path // "") | split("@")[0]) == $expected
                    )]
                | sort_by(.created_at)
                | reverse
                | .[0] // empty
              ' <<<"$RUNS"
          )"

          LATEST_MATCHING="$(
            jq -r \
              --arg expected "$EXPECTED_PATH" '
                [.workflow_runs[]
                  | select(((.path // "") | split("@")[0]) == $expected)]
                | sort_by(.created_at)
                | reverse
                | .[0:5][]
                | "- Run `\(.id)` — status `\(.status)` — conclusion `\(.conclusion // "pending")` — head `\(.head_sha)` — attempt `\(.run_attempt)` — \(.html_url)"
              ' <<<"$RUNS"
          )"

          BODY_FILE="$RUNNER_TEMP/module083-deployment-run-observer.md"
          {
            echo '<!-- module083-deployment-run-observer -->'
            if [[ -n "$EXACT_RUN" ]]; then
              RUN_ID="$(jq -r '.id' <<<"$EXACT_RUN")"
              RUN_URL="$(jq -r '.html_url' <<<"$EXACT_RUN")"
              RUN_STATUS="$(jq -r '.status' <<<"$EXACT_RUN")"
              RUN_CONCLUSION="$(jq -r '.conclusion // "pending"' <<<"$EXACT_RUN")"
              RUN_ATTEMPT="$(jq -r '.run_attempt' <<<"$EXACT_RUN")"
              RUN_CREATED="$(jq -r '.created_at' <<<"$EXACT_RUN")"
              RUN_PATH="$(jq -r '.path' <<<"$EXACT_RUN")"

              [[ "$RUN_ID" =~ ^[0-9]+$ ]]
              [[ "$RUN_URL" == "https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" ]]
              [[ "${RUN_PATH%%@*}" == "$EXPECTED_PATH" ]]

              echo '## Module 083 protected Test deployment run located'
              echo
              printf -- '- Run ID: `%s`\n' "$RUN_ID"
              printf -- '- Attempt: `%s`\n' "$RUN_ATTEMPT"
              printf -- '- Status at observation: `%s`\n' "$RUN_STATUS"
              printf -- '- Conclusion at observation: `%s`\n' "$RUN_CONCLUSION"
              printf -- '- Created: `%s`\n' "$RUN_CREATED"
              printf -- '- Exact control commit: `%s`\n' "$TARGET_CONTROL_COMMIT"
              printf -- '- Run: %s\n' "$RUN_URL"
              echo
              echo 'The exact run can now be monitored through the GitHub Actions job and artifact APIs.'

              echo 'found=true' >> "$GITHUB_OUTPUT"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
            else
              echo '## Module 083 protected Test deployment run was not located'
              echo
              printf -- '- Expected workflow: `%s`\n' "$EXPECTED_PATH"
              printf -- '- Expected control commit: `%s`\n' "$TARGET_CONTROL_COMMIT"
              printf -- '- Repository push runs inspected: `%s`\n' "$(jq -r '.workflow_runs | length' <<<"$RUNS")"
              echo
              if [[ -n "$LATEST_MATCHING" ]]; then
                echo '### Most recent runs registered for the target workflow'
                echo
                printf '%s\n' "$LATEST_MATCHING"
              else
                echo 'No push run for the target workflow was present in the 100 most recent main-branch push runs. The controller may not have registered or triggered.'
              fi
              echo
              echo 'This diagnostic performed no deployment or migration action.'

              echo 'found=false' >> "$GITHUB_OUTPUT"
              echo 'run_id=' >> "$GITHUB_OUTPUT"
              echo 'run_url=' >> "$GITHUB_OUTPUT"
            fi
            echo
            echo 'This observer performs no deployment, migration, secret, infrastructure, Production, or private-runtime action.'
          } > "$BODY_FILE"

          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments" \
            -f body="$(cat "$BODY_FILE")" >/dev/null

          cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm observer boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'MODULE_083_DEPLOYMENT_RUN_OBSERVER=PASSED'
          echo 'TARGET_RUN_FOUND=${{ steps.locate.outputs.found }}'
          echo 'DEPLOYMENT_ACTIONS=NONE'
          echo 'MIGRATION_ACTIONS=NONE'
          echo 'PRODUCTION_CHANGES=NONE'