name: Command PR602 Protected Test Release Controller V3

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: command-pr602-test-release-controller-v3
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and validate PR602 Test controller V3
    if: github.event.issue.number == 602 && github.event.comment.body == '/apply-pr602-test-release-controller-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR602 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: release/test-pr600-pr601-1d1afbdc-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Patch the one-time protected Test controller
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/projectpulse-deploy-test.yml')
          source = path.read_text(encoding='utf-8')

          old_full = 'b0aedc706c3fe33b97b91a1b0074a20578c82b64'
          new_full = '1d1afbdc6b6e34190087287325806ed274c822c9'
          old_short = 'b0aedc70'
          new_short = '1d1afbdc'

          if old_full not in source:
              raise SystemExit('Old release SHA was not found in the Test controller.')
          source = source.replace(old_full, new_full)
          source = source.replace(old_short, new_short)

          current_name = 'name: ProjectPulse Test-Only Module 081/082 and Theme Recovery 1d1afbdc'
          if current_name in source:
              source = source.replace(
                  current_name,
                  'name: ProjectPulse Test Release 1d1afbdc - Enterprise Governance and Oracle Bridge',
                  1,
              )

          permissions = 'permissions:\n  id-token: write\n  contents: read'
          if 'actions: write' not in source:
              if permissions not in source:
                  raise SystemExit('Test controller permissions anchor was not found.')
              source = source.replace(permissions, permissions + '\n  actions: write', 1)

          queue_marker = 'Queue protected Oracle runtime activation'
          github_token_marker = 'GH_TOKEN: ' + '$' + '{{ github.token }}'
          if queue_marker not in source:
              anchor = '\n      - name: Restore prior images and source marker on failure\n'
              if anchor not in source:
                  raise SystemExit('Test rollback anchor was not found.')
              dispatch_step = f'''
      - name: {queue_marker}
        if: success()
        shell: bash
        env:
          {github_token_marker}
        run: |
          set -Eeuo pipefail
          gh workflow run celar-ai-oracle-test-runtime-deploy.yml \\
            --repo "$GITHUB_REPOSITORY" \\
            --ref main \\
            -f release_commit="$GITHUB_SHA" \\
            -f approval_reference="ORACLE-TEST-PR600-PR601-20260810" \\
            -f confirmation="DEPLOY-CELAR-AI-ORACLE-RUNTIME-TO-TEST"
          echo 'ORACLE_RUNTIME_WORKFLOW_QUEUED=true'
'''
              source = source.replace(anchor, '\n' + dispatch_step + anchor, 1)

          required = (
              new_full,
              'actions: write',
              github_token_marker,
              'celar-ai-oracle-test-runtime-deploy.yml',
              'ORACLE-TEST-PR600-PR601-20260810',
              'DEPLOY-CELAR-AI-ORACLE-RUNTIME-TO-TEST',
              'MIGRATIONS_APPLIED=NONE',
              'MIGRATION_081=NOT_APPLIED',
              'OPEN_CLOUD_PRIVATE_RUNTIME=DEFERRED',
          )
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit('Missing Test controller markers: ' + ', '.join(missing))
          if old_full in source or old_short in source:
              raise SystemExit('Old release references remain in the Test controller.')
          if source.count(queue_marker) != 1:
              raise SystemExit('Oracle activation queue step must occur exactly once.')

          path.write_text(source, encoding='utf-8')
          PY

          rm -f .github/workflows/prepare-pr600-pr601-test-release-controller.yml
          rm -rf .github/pr602-command-smoke
          grep -Fq 'TARGET_RELEASE_COMMIT: 1d1afbdc6b6e34190087287325806ed274c822c9' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'gh workflow run celar-ai-oracle-test-runtime-deploy.yml' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'ORACLE-TEST-PR600-PR601-20260810' .github/workflows/projectpulse-deploy-test.yml
          ! grep -Fq 'b0aedc706c3fe33b97b91a1b0074a20578c82b64' .github/workflows/projectpulse-deploy-test.yml
          git diff --check

      - name: Commit the validated PR602 controller
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'Pulse Test Release Automation'
          git config user.email 'pulse-test-release-automation@users.noreply.github.com'
          git commit -m 'ci: deploy merged enterprise and Oracle runtime release to Test'
          git push origin HEAD:release/test-pr600-pr601-1d1afbdc-20260810
