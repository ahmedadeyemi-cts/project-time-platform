name: Temporary Normalize Pulse AI Validator Compatibility

on:
  push:
    branches:
      - feature/module-011-system-intelligence-troubleshooting-20260730
      - feature/module-011-celar-ai-runtime-rebrand-20260730
    paths:
      - .github/workflows/temp-normalize-pulse-ai-validator-compatibility.yml
  pull_request:
    paths:
      - .github/workflows/temp-normalize-pulse-ai-validator-compatibility.yml

permissions:
  contents: write

concurrency:
  group: temp-normalize-pulse-ai-validator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Normalize the historical deep-intelligence validator
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/project-time-web/scripts/validate-module-011-pulse-ai-deep-intelligence.mjs')
          text = path.read_text(encoding='utf-8')

          old_help = """assert(
            'GLOBAL_HELP',
            includesAll(source.help, [
              "'/api/pulse-ai/v1/help-search/plan'",
              'DetailedAssistantAnswer',
              'Automatic multi-tool execution is not yet enabled',
              'fallbackAnswer',
              'retired Work Task Builder no longer owns project or task creation'
            ]),
            'global Help renders detailed guidance and a corrected fallback'
          );"""
          new_help = """const legacyGlobalHelp = includesAll(source.help, [
            "'/api/pulse-ai/v1/help-search/plan'",
            'DetailedAssistantAnswer',
            'Automatic multi-tool execution is not yet enabled',
            'fallbackAnswer',
            'retired Work Task Builder no longer owns project or task creation'
          ]);
          const currentSystemHelp = includesAll(source.help, [
            "'/api/pulse-ai/v1/help-search/plan'",
            'function SystemAnswer',
            'LegacyPlanAnswer',
            'System intelligence is not active in this runtime',
            "'/api/pulse-ai/v1/system/questions'"
          ]) || includesAll(source.help, [
            "'/api/pulse-ai/v1/help-search/plan'",
            'function SystemAnswer',
            'LegacyPlanAnswer',
            "'/api/celar-ai/v1/chat'"
          ]);
          assert(
            'GLOBAL_HELP',
            legacyGlobalHelp || currentSystemHelp,
            'global Help renders comprehensive system answers and a source-grounded compatibility fallback'
          );"""
          if old_help in text:
              text = text.replace(old_help, new_help)
          elif 'const currentSystemHelp =' not in text:
              raise SystemExit('Deep-intelligence Help compatibility anchor is missing.')

          old_migration = """const migrations = walk('database/migrations')
            .filter((relative) => /(?:module[-_]?011|pulse[-_]?ai|deep[-_]?intelligence)/i.test(relative));
          assert(
            'NO_MIGRATION',
            migrations.length === 0,
            migrations.length === 0 ? 'no Module 011 migration exists' : migrations.join(', ')
          );"""
          new_migration = """const reviewedLaterMigrations = new Set([
            'database/migrations/052_document_intelligence_runtime.sql',
            'database/migrations/053_intelligence_answer_orchestration.sql',
            'database/migrations/054_pulse_ai_system_intelligence_conversations.sql'
          ]);
          const migrations = walk('database/migrations')
            .filter((relative) => /(?:module[-_]?011|pulse[-_]?ai|deep[-_]?intelligence|document_intelligence_runtime|intelligence_answer_orchestration)/i.test(relative));
          const unexpectedMigrations = migrations.filter((relative) => !reviewedLaterMigrations.has(relative));
          assert(
            'KNOWN_LATER_MIGRATIONS_ONLY',
            unexpectedMigrations.length === 0,
            unexpectedMigrations.length === 0
              ? 'the read-only deep-intelligence foundation is preserved while reviewed later phases use migrations 052, 053, and 054'
              : unexpectedMigrations.join(', ')
          );"""
          if old_migration in text:
              text = text.replace(old_migration, new_migration)
          elif 'const reviewedLaterMigrations =' not in text:
              raise SystemExit('Deep-intelligence migration compatibility anchor is missing.')

          path.write_text(text, encoding='utf-8')
          print('PULSE_AI_DEEP_INTELLIGENCE_VALIDATOR_NORMALIZATION=PASSED')
          PY
          node --check src/frontend/project-time-web/scripts/validate-module-011-pulse-ai-deep-intelligence.mjs
          git diff --check

      - name: Commit the normalized validator
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/project-time-web/scripts/validate-module-011-pulse-ai-deep-intelligence.mjs
          if git diff --cached --quiet; then
            echo 'PULSE_AI_DEEP_VALIDATOR_ALREADY_NORMALIZED=YES'
            exit 0
          fi
          git commit -m 'Reconcile deep intelligence validation with functional later phases'
          git push origin "HEAD:${TARGET_BRANCH}"
