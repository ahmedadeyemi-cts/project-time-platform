name: Temporary Normalize Pulse AI Validator Compatibility

on:
  push:
    branches:
      - feature/module-011-system-intelligence-troubleshooting-20260730
      - feature/module-011-celar-ai-runtime-rebrand-20260730
    paths:
      - .github/workflows/temp-normalize-pulse-ai-validator-compatibility.yml

permissions:
  contents: write

concurrency:
  group: temp-normalize-pulse-ai-validator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Normalize validators for reviewed later phases
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          private_path = Path('src/frontend/project-time-web/scripts/validate-module-011-private-document-pipeline.mjs')
          private_text = private_path.read_text(encoding='utf-8')
          old_private = """const migrationMatches = walk('database/migrations').filter((relative) => /(?:module[-_]?011|pulse[-_]?ai|private[-_]?document|vector[-_]?index)/i.test(relative));
          assert(
            'NO_MIGRATION',
            migrationMatches.length === 0,
            migrationMatches.length === 0
              ? 'no Module 011 private-document, embedding, or vector-index migration exists'
              : `unexpected migration paths: ${migrationMatches.join(', ')}`
          );"""
          new_private = """const allowedLaterMigrations = new Set([
            'database/migrations/052_document_intelligence_runtime.sql',
            'database/migrations/053_intelligence_answer_orchestration.sql',
            'database/migrations/054_pulse_ai_system_intelligence_conversations.sql'
          ]);
          const migrationMatches = walk('database/migrations').filter((relative) => /(?:module[-_]?011|pulse[-_]?ai|private[-_]?document|vector[-_]?index|document_intelligence_runtime|intelligence_answer_orchestration)/i.test(relative));
          const unexpectedMigrations = migrationMatches.filter((relative) => !allowedLaterMigrations.has(relative));
          assert(
            'KNOWN_LATER_MIGRATIONS_ONLY',
            unexpectedMigrations.length === 0,
            unexpectedMigrations.length === 0
              ? 'the historical preview remains read-only while reviewed migrations 052, 053, and 054 support later separately gated phases'
              : `unexpected migration paths: ${unexpectedMigrations.join(', ')}`
          );"""
          if old_private in private_text:
              private_text = private_text.replace(old_private, new_private)
              private_path.write_text(private_text, encoding='utf-8')
          elif 'KNOWN_LATER_MIGRATIONS_ONLY' not in private_text:
              raise SystemExit('Private document validator migration anchor was not found.')

          system_path = Path('src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs')
          system_text = system_path.read_text(encoding='utf-8')
          old_system = """  && s.documentation.includes('owning endpoint remains the authorization authority'),"""
          new_system = """  && (
            s.documentation.includes('owning endpoint remains the authorization authority')
            || s.documentation.includes('The owning endpoint still applies its own authorization before returning evidence')
          ),"""
          if old_system in system_text:
              system_text = system_text.replace(old_system, new_system)
              system_path.write_text(system_text, encoding='utf-8')
          elif 'The owning endpoint still applies its own authorization before returning evidence' not in system_text:
              raise SystemExit('System-intelligence authorization marker was not found.')

          print('PULSE_AI_VALIDATOR_COMPATIBILITY_NORMALIZATION=PASSED')
          PY
          node --check src/frontend/project-time-web/scripts/validate-module-011-private-document-pipeline.mjs
          node --check src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs
          git diff --check

      - name: Commit normalized validators
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/frontend/project-time-web/scripts/validate-module-011-private-document-pipeline.mjs \
            src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs
          if git diff --cached --quiet; then
            echo 'PULSE_AI_VALIDATORS_ALREADY_NORMALIZED=YES'
            exit 0
          fi
          git commit -m 'Reconcile Pulse AI validators with reviewed later phases'
          git push origin "HEAD:${GITHUB_REF_NAME}"
