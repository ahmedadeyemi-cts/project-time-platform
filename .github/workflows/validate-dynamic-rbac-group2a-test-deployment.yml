name: Validate Dynamic RBAC and Group 2A Test Deployment

on:
  push:
    branches:
      - 'release/dynamic-rbac-group2a-test-deployment-*'
  pull_request:
    paths:
      - '.github/workflows/projectpulse-deploy-dynamic-rbac-group2a-test.yml'
      - '.github/workflows/validate-dynamic-rbac-group2a-test-deployment.yml'
      - 'scripts/run-dynamic-rbac-group2a-test-deployment.sh'
      - 'scripts/validate-dynamic-rbac-group2a-test-deployment.sh'

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate guarded dynamic RBAC and Group 2A test deployment controls
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce exact deployment-control scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          # DEPLOYMENT_CONCURRENCY_GOVERNANCE_SCOPE_START
          if [[ "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" == security/environment-deployment-concurrency-* ]]; then
            node scripts/validate-deployment-concurrency-governance.mjs --base-ref origin/main
            echo 'DEPLOYMENT_CONCURRENCY_GOVERNANCE_SCOPE=PASS'
            exit 0
          fi
          # DEPLOYMENT_CONCURRENCY_GOVERNANCE_SCOPE_END
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${CHANGED[@]}"

          ALLOWED=(
            '.github/workflows/projectpulse-deploy-dynamic-rbac-group2a-test.yml'
            '.github/workflows/validate-dynamic-rbac-group2a-test-deployment.yml'
            'scripts/run-dynamic-rbac-group2a-test-deployment.sh'
            'scripts/validate-dynamic-rbac-group2a-test-deployment.sh'
          )

          [[ "${#CHANGED[@]}" -eq 4 ]] || {
            echo "Expected exactly four deployment-control files; found ${#CHANGED[@]}." >&2
            exit 1
          }

          for changed in "${CHANGED[@]}"; do
            MATCH=false
            for allowed in "${ALLOWED[@]}"; do
              [[ "$changed" == "$allowed" ]] && MATCH=true
            done
            [[ "$MATCH" == true ]] || {
              echo "Unexpected changed file: $changed" >&2
              exit 1
            }
          done

          echo 'DYNAMIC_RBAC_GROUP2A_DEPLOYMENT_SCOPE=PASS'

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/run-dynamic-rbac-group2a-test-deployment.sh
          bash -n scripts/validate-dynamic-rbac-group2a-test-deployment.sh
          echo 'DYNAMIC_RBAC_GROUP2A_SHELL_SYNTAX=PASS'

      - name: Validate deployment-control contract
        shell: bash
        run: bash scripts/validate-dynamic-rbac-group2a-test-deployment.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Build dynamic RBAC API release
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Execute central authorization tests
        run: >-
          dotnet run
          --project tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj
          --configuration Release

      - name: Verify API startup and route registration
        run: bash tests/test-projectpulse-api-startup.sh

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate dynamic RBAC package
        working-directory: src/frontend/project-time-web
        run: npm run validate:dynamic-rbac

      - name: Validate Module 012 dynamic administration
        working-directory: src/frontend/project-time-web
        run: npm run validate:module012

      - name: Validate Module 037 dynamic matrix
        working-directory: src/frontend/project-time-web
        run: npm run validate:module037

      - name: Validate name-only permission-aware More navigation
        working-directory: src/frontend/project-time-web
        run: node scripts/validate-group-1-navigation-work-consolidation.mjs

      - name: Validate Group 2A provider-neutral operations
        working-directory: src/frontend/project-time-web
        run: node scripts/validate-group-2a-provider-neutral-platform-operations.mjs

      - name: Validate Module 068 compatibility
        working-directory: src/frontend/project-time-web
        run: npm run validate:module068

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Validate production web-container build context
        run: >-
          docker build
          --file deployment/containers/web/Dockerfile
          --tag dynamic-rbac-group2a-web:${{ github.sha }}
          .

      - name: Publish exact-commit deployment-control status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          API_ROOT: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            STATE=success
            DESCRIPTION='Dynamic RBAC, Group 2A, API, frontend, container, rollback, and deployment guards passed.'
          else
            STATE=failure
            DESCRIPTION='Dynamic RBAC and Group 2A deployment-control validation failed.'
          fi

          PAYLOAD="$(jq -nc \
            --arg state "$STATE" \
            --arg context 'dynamic-rbac-group2a/deployment-controls' \
            --arg description "$DESCRIPTION" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$PAYLOAD" \
            "$API_ROOT/repos/$REPOSITORY/statuses/$COMMIT_SHA"
