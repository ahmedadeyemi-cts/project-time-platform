name: Prepare FlowHive Enterprise Migration 086 Validator Update

on:
  push:
    branches: [feature/module-066-flowhive-enterprise-pm-20260813]
    paths:
      - .github/workflows/flowhive-enterprise-validator-applicability-fix.yml

permissions:
  contents: write

concurrency:
  group: flowhive-enterprise-validator-applicability-fix
  cancel-in-progress: false

jobs:
  prepare-patched-validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/module-066-flowhive-enterprise-pm-20260813
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare the exact patched validator as non-executable source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/celar-ai-enterprise-platform-ci.yml')
          value = source.read_text(encoding='utf-8')
          marker = "            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=COORDINATED_FLOWHIVE_DOCUMENT_BRIDGE' >> \"$GITHUB_ENV\"\n"
          block = (
              "          elif [[ \"$HEAD_BRANCH\" == feature/module-066-flowhive-enterprise-pm-* ]]; then\n"
              "            ALLOWED_DATABASE='^(database/migrations/086_module_066_flowhive_enterprise_pm\\.sql|database/rollback/086_module_066_flowhive_enterprise_pm_rollback\\.sql)$'\n"
              "            test -f tests/test-module-066-flowhive-enterprise-pm-migration-086.sh\n"
              "            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=FLOWHIVE_ENTERPRISE_PM' >> \"$GITHUB_ENV\"\n"
          )
          if block in value:
              patched = value
              print('FLOWHIVE_ENTERPRISE_VALIDATOR_MODE=ALREADY_PRESENT')
          elif value.count(marker) == 1:
              patched = value.replace(marker, marker + block, 1)
              print('FLOWHIVE_ENTERPRISE_VALIDATOR_MODE=PREPARED')
          else:
              raise SystemExit('Could not locate the FlowHive AI planner validation-mode marker exactly once.')

          target = Path('tmp/flowhive-enterprise/celar-ai-enterprise-platform-ci.patched.yml')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(patched, encoding='utf-8')
          PY

          PATCHED='tmp/flowhive-enterprise/celar-ai-enterprise-platform-ci.patched.yml'
          grep -Fq 'feature/module-066-flowhive-enterprise-pm-*' "$PATCHED"
          grep -Fq '086_module_066_flowhive_enterprise_pm' "$PATCHED"
          grep -Fq 'FLOWHIVE_ENTERPRISE_PM' "$PATCHED"
          git diff --check -- "$PATCHED"

      - name: Publish only the non-executable patched copy
        shell: bash
        run: |
          set -Eeuo pipefail
          PATCHED='tmp/flowhive-enterprise/celar-ai-enterprise-platform-ci.patched.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PATCHED"
          git diff --cached --check
          git commit -m 'Prepare FlowHive Migration 086 validator update'
          git push origin HEAD:feature/module-066-flowhive-enterprise-pm-20260813
