name: Register FlowHive Enterprise Migration 086 Validation Mode

on:
  push:
    branches: [feature/module-066-flowhive-enterprise-pm-20260813]
    paths:
      - .github/workflows/flowhive-enterprise-validator-applicability-fix.yml

permissions:
  contents: write

concurrency:
  group: flowhive-enterprise-validator-applicability-fix
  cancel-in-progress: false

jobs:
  patch-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/module-066-flowhive-enterprise-pm-20260813
          fetch-depth: 0
          persist-credentials: true

      - name: Register the FlowHive enterprise Migration 086 validation mode
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/celar-ai-enterprise-platform-ci.yml')
          value = path.read_text(encoding='utf-8')
          marker = "            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=COORDINATED_FLOWHIVE_DOCUMENT_BRIDGE' >> \"$GITHUB_ENV\"\n"
          block = (
              "          elif [[ \"$HEAD_BRANCH\" == feature/module-066-flowhive-enterprise-pm-* ]]; then\n"
              "            ALLOWED_DATABASE='^(database/migrations/086_module_066_flowhive_enterprise_pm\\\\.sql|database/rollback/086_module_066_flowhive_enterprise_pm_rollback\\\\.sql)$'\n"
              "            test -f tests/test-module-066-flowhive-enterprise-pm-migration-086.sh\n"
              "            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=FLOWHIVE_ENTERPRISE_PM' >> \"$GITHUB_ENV\"\n"
          )
          if block in value:
              print('FLOWHIVE_ENTERPRISE_VALIDATOR_MODE=ALREADY_PRESENT')
          elif value.count(marker) == 1:
              path.write_text(value.replace(marker, marker + block, 1), encoding='utf-8')
              print('FLOWHIVE_ENTERPRISE_VALIDATOR_MODE=ADDED')
          else:
              raise SystemExit('Could not locate the FlowHive AI planner validation-mode marker exactly once.')
          PY

          grep -Fq 'feature/module-066-flowhive-enterprise-pm-*' .github/workflows/celar-ai-enterprise-platform-ci.yml
          grep -Fq '086_module_066_flowhive_enterprise_pm' .github/workflows/celar-ai-enterprise-platform-ci.yml
          grep -Fq 'FLOWHIVE_ENTERPRISE_PM' .github/workflows/celar-ai-enterprise-platform-ci.yml
          git diff --check

      - name: Commit validator applicability correction and remove this one-time workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/flowhive-enterprise-validator-applicability-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Register FlowHive enterprise Migration 086 validation mode'
          git push origin HEAD:feature/module-066-flowhive-enterprise-pm-20260813
