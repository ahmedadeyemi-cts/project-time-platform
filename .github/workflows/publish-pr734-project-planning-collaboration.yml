name: Publish PR 734 Project Planning Collaboration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-pr734-project-planning-collaboration.yml'
      - 'scripts/release-test/finalize-pr734-source.py'

permissions:
  contents: write

concurrency:
  group: publish-pr734-project-planning-collaboration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/project-planning-collaboration-access-20260818'
    name: Integrate and validate project planning collaboration
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '10.0.x'

      - name: Apply guarded source integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/release-test/finalize-pr734-source.py

      - name: Validate focused access contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/validate-project-planning-collaboration-access.mjs
          node src/frontend/project-time-web/scripts/validate-module-033-project-forge.mjs
          node src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs
          git diff --check

      - name: Build API
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install, audit, and build frontend
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run build

      - name: Commit and push reviewed source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'

          # Preserve the temporary workflow; it is removed through the repository
          # API after the generated application source is verified.
          git restore --source=HEAD --staged --worktree .github/workflows

          git add -A
          git diff --cached --quiet && {
            echo 'ERROR: PR 734 publisher produced no application source change.' >&2
            exit 1
          }
          git commit -m 'feat(planning): add project-scoped FlowHive and Forge collaboration'
          git push origin HEAD:feature/project-planning-collaboration-access-20260818
