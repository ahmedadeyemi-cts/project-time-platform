name: Finalize Successful Protected UAT for PR794

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: protected-uat-pr794-merged-main-relaunch
  cancel-in-progress: false

jobs:
  authorize_ghost_retirement:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 794 &&
      github.actor == 'ahmedadeyemi-cts' &&
      github.event.comment.body == 'FINALIZE PROTECTED UAT RUN 33666500248 RETIRE RUN 33654881418 SHA 2e257966dd51eab8d9f6431cf9b8fbded7ae458a'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      exact_ghost_only: ${{ steps.preflight.outputs.exact_ghost_only }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_WORKFLOW_ID: '315562561'
      DEPLOY_WORKFLOW_PATH: .github/workflows/projectpulse-deploy-test.yml
      RETIRED_RUN_ID: '33654881418'
      RETIRED_RUN_ATTEMPT: '1'
      RETIRED_RUN_CREATED_AT: '2026-09-02T16:26:03Z'
      RETIRED_RELEASE_SHA: 3d02b4cb62683b96554186f9d3a782fc1f21ca54
      RETIRED_RELEASE_BRANCH: fix/shared-project-document-planning-20260819
    steps:
      - name: Check out exact current main for concurrency inventory
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Authorize only the exact pending ghost for concurrency retirement
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$GITHUB_SHA" == "$actual_main" ]] || { echo 'Retirement preflight is not on exact current main.' >&2; exit 1; }
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')" == 'disabled_manually' ]] || {
            echo 'Protected-Test deployment workflow is not disabled.' >&2
            exit 1
          }
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RETIRED_RELEASE_BRANCH}" --jq '.object.sha')"
          [[ "$branch_sha" == "$RETIRED_RELEASE_SHA" ]] || { echo 'Legacy candidate changed.' >&2; exit 1; }

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}")"
          jq -e --arg path "$DEPLOY_WORKFLOW_PATH" --arg sha "$RETIRED_RELEASE_SHA" --arg branch "$RETIRED_RELEASE_BRANCH" --arg created "$RETIRED_RUN_CREATED_AT" --argjson id "$RETIRED_RUN_ID" --argjson attempt "$RETIRED_RUN_ATTEMPT" --argjson workflow "$DEPLOY_WORKFLOW_ID" '
            .id == $id and .run_attempt == $attempt and .workflow_id == $workflow and .path == $path
            and .event == "workflow_dispatch" and .head_branch == $branch and .head_sha == $sha and .created_at == $created
            and .status == "queued" and .conclusion == null
          ' <<<"$run_json" >/dev/null || { echo 'Ghost run identity mismatch before concurrency retirement.' >&2; exit 1; }
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}/jobs?filter=all&per_page=100" --jq '.total_count')" == '0' ]] || {
            echo 'Ghost materialized a job before concurrency retirement.' >&2
            exit 1
          }

          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | while IFS= read -r -d '' workflow; do
                if grep -Eq '^  group:[[:space:]]*projectpulse-deploy-test[[:space:]]*$' "$workflow"; then
                  printf '%s\n' "${workflow#./}"
                fi
              done \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/protected-test-workflows"
          grep -Fxq "$DEPLOY_WORKFLOW_PATH" "$RUNNER_TEMP/protected-test-workflows" || {
            echo 'Protected-Test deployment workflow was absent from the concurrency inventory.' >&2
            exit 1
          }
          jq -Rn '[inputs | select(length > 0)]' < "$RUNNER_TEMP/protected-test-workflows" > "$RUNNER_TEMP/protected-test-workflows.json"

          : > "$RUNNER_TEMP/active-runs.ndjson"
          for run_status in queued in_progress waiting requested pending; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=${run_status}&per_page=100" \
              --jq '.workflow_runs[]' >> "$RUNNER_TEMP/active-runs.ndjson"
          done
          if [[ -s "$RUNNER_TEMP/active-runs.ndjson" ]]; then
            jq -s 'unique_by(.id)' "$RUNNER_TEMP/active-runs.ndjson" > "$RUNNER_TEMP/active-runs.json"
          else
            printf '[]\n' > "$RUNNER_TEMP/active-runs.json"
          fi
          jq --argjson protected "$(cat "$RUNNER_TEMP/protected-test-workflows.json")" \
            'map(select(.path as $path | $protected | index($path)))' \
            "$RUNNER_TEMP/active-runs.json" > "$RUNNER_TEMP/active-protected-test-runs.json"
          jq -e --arg path "$DEPLOY_WORKFLOW_PATH" --arg sha "$RETIRED_RELEASE_SHA" --arg branch "$RETIRED_RELEASE_BRANCH" --arg created "$RETIRED_RUN_CREATED_AT" --argjson id "$RETIRED_RUN_ID" --argjson attempt "$RETIRED_RUN_ATTEMPT" --argjson workflow "$DEPLOY_WORKFLOW_ID" '
            length == 1
            and .[0].id == $id and .[0].run_attempt == $attempt and .[0].workflow_id == $workflow and .[0].path == $path
            and .[0].event == "workflow_dispatch" and .[0].head_branch == $branch and .[0].head_sha == $sha and .[0].created_at == $created
            and .[0].status == "queued" and .[0].conclusion == null
          ' "$RUNNER_TEMP/active-protected-test-runs.json" >/dev/null || {
            echo 'The exact ghost is not the sole active owner of the Protected-Test concurrency group.' >&2
            cat "$RUNNER_TEMP/active-protected-test-runs.json" >&2
            exit 1
          }
          echo 'exact_ghost_only=true' >> "$GITHUB_OUTPUT"
          echo 'FINALIZED_PROTECTED_UAT_CONCURRENCY_PREFLIGHT=exact_ghost_only'

  finalize:
    needs: authorize_ghost_retirement
    if: >-
      needs.authorize_ghost_retirement.result == 'success' &&
      needs.authorize_ghost_retirement.outputs.exact_ghost_only == 'true' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 794 &&
      github.actor == 'ahmedadeyemi-cts' &&
      github.event.comment.body == 'FINALIZE PROTECTED UAT RUN 33666500248 RETIRE RUN 33654881418 SHA 2e257966dd51eab8d9f6431cf9b8fbded7ae458a'
    concurrency:
      group: projectpulse-deploy-test
      queue: single
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_WORKFLOW_ID: '315562561'
      DEPLOY_WORKFLOW_PATH: .github/workflows/projectpulse-deploy-test.yml
      SUCCESSFUL_RUN_ID: '33666500248'
      SUCCESSFUL_RUN_ATTEMPT: '1'
      SUCCESSFUL_RUN_CREATED_AT: '2026-09-02T18:19:31Z'
      SUCCESSFUL_RELEASE_SHA: 2e257966dd51eab8d9f6431cf9b8fbded7ae458a
      SUCCESSFUL_ARTIFACT_NAME: systemwide-enterprise-reliability-test-evidence-33666500248-1
      RETIRED_RUN_ID: '33654881418'
      RETIRED_RUN_ATTEMPT: '1'
      RETIRED_RUN_CREATED_AT: '2026-09-02T16:26:03Z'
      RETIRED_RELEASE_SHA: 3d02b4cb62683b96554186f9d3a782fc1f21ca54
      RETIRED_RELEASE_BRANCH: fix/shared-project-document-planning-20260819
    steps:
      - name: Check out exact current main for post-lock inventory
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Revalidate every shared-group owner after concurrency acquisition
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$GITHUB_SHA" == "$actual_main" ]] || { echo 'Post-lock inventory is not on exact current main.' >&2; exit 1; }

          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | while IFS= read -r -d '' workflow; do
                if grep -Eq '^  group:[[:space:]]*projectpulse-deploy-test[[:space:]]*$' "$workflow"; then
                  printf '%s\n' "${workflow#./}"
                fi
              done \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/protected-test-workflows"
          jq -Rn '[inputs | select(length > 0)]' < "$RUNNER_TEMP/protected-test-workflows" > "$RUNNER_TEMP/protected-test-workflows.json"

          workflow_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100")"
          jq -c '[.[].workflows[]] | unique_by(.id)' <<<"$workflow_pages" > "$RUNNER_TEMP/repository-workflows.json"
          jq --argjson protected "$(cat "$RUNNER_TEMP/protected-test-workflows.json")" \
            'map(select(.path as $path | $protected | index($path)))' \
            "$RUNNER_TEMP/repository-workflows.json" > "$RUNNER_TEMP/protected-test-workflow-metadata.json"
          expected_workflow_count="$(jq -r 'length' "$RUNNER_TEMP/protected-test-workflows.json")"
          actual_workflow_count="$(jq -r 'length' "$RUNNER_TEMP/protected-test-workflow-metadata.json")"
          [[ "$expected_workflow_count" -gt 0 && "$actual_workflow_count" == "$expected_workflow_count" ]] || {
            echo "Shared-group workflow inventory mismatch: expected=$expected_workflow_count actual=$actual_workflow_count" >&2
            exit 1
          }

          : > "$RUNNER_TEMP/shared-group-runs.ndjson"
          while IFS= read -r workflow_id; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
              --jq '.workflow_runs[]' >> "$RUNNER_TEMP/shared-group-runs.ndjson"
          done < <(jq -r '.[].id' "$RUNNER_TEMP/protected-test-workflow-metadata.json")
          if [[ -s "$RUNNER_TEMP/shared-group-runs.ndjson" ]]; then
            jq -s 'unique_by(.id)' "$RUNNER_TEMP/shared-group-runs.ndjson" > "$RUNNER_TEMP/shared-group-runs.json"
          else
            printf '[]\n' > "$RUNNER_TEMP/shared-group-runs.json"
          fi
          jq -e --arg created "$SUCCESSFUL_RUN_CREATED_AT" --argjson success "$SUCCESSFUL_RUN_ID" --argjson retired "$RETIRED_RUN_ID" '
            ([.[] | select(.id != $success and .id != $retired and (
              .created_at >= $created or ((.run_started_at // .created_at) >= $created)
            ))] | length) == 0
            and ([.[] | select(.status != "completed" and .id != $retired)] | length) == 0
          ' "$RUNNER_TEMP/shared-group-runs.json" >/dev/null || {
            echo 'Another shared-group Protected-Test workflow ran or remained active after the successful UAT.' >&2
            jq --arg created "$SUCCESSFUL_RUN_CREATED_AT" --argjson success "$SUCCESSFUL_RUN_ID" --argjson retired "$RETIRED_RUN_ID" \
              '[.[] | select((.status != "completed" and .id != $retired) or (.id != $success and .id != $retired and (.created_at >= $created or ((.run_started_at // .created_at) >= $created)))) | {id,path,status,conclusion,created_at,run_started_at,run_attempt}]' \
              "$RUNNER_TEMP/shared-group-runs.json" >&2
            exit 1
          }
          echo 'FINALIZED_PROTECTED_UAT_POST_LOCK_SHARED_GROUP=exact_success_and_ghost_only'

      - name: Seal workflow and verify exact successful UAT evidence
        id: evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')"
          case "$workflow_state" in
            active)
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}/disable" >/dev/null
              ;;
            disabled_manually)
              ;;
            *)
              echo "Unexpected deployment workflow state before finalization: $workflow_state" >&2
              exit 1
              ;;
          esac
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')" == 'disabled_manually' ]]

          actual_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$GITHUB_SHA" == "$actual_main" ]] || { echo 'Finalizer is not on exact current main.' >&2; exit 1; }
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SUCCESSFUL_RELEASE_SHA}...${actual_main}")"
          [[ "$(jq -r '.status' <<<"$comparison")" == 'ahead' ]] || { echo 'Successful runtime is not an ancestor of main.' >&2; exit 1; }
          jq -r '.files[].filename' <<<"$comparison" | LC_ALL=C sort -u > "$RUNNER_TEMP/changed-files"
          cat > "$RUNNER_TEMP/allowed-files" <<'FILES'
          .github/workflows/projectpulse-release-test-control-ci-reregistered.yml
          .github/workflows/projectpulse-release-test-control-ci.yml
          .github/workflows/protected-uat-celar-ai-pr782-workflow-control.yml
          FILES
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/allowed-files"
          LC_ALL=C sort -u "$RUNNER_TEMP/allowed-files" -o "$RUNNER_TEMP/allowed-files"
          cmp -s "$RUNNER_TEMP/allowed-files" "$RUNNER_TEMP/changed-files" || {
            echo 'Unexpected runtime drift exists after the successful release.' >&2
            diff -u "$RUNNER_TEMP/allowed-files" "$RUNNER_TEMP/changed-files" >&2 || true
            exit 1
          }

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SUCCESSFUL_RUN_ID}")"
          jq -e --arg path "$DEPLOY_WORKFLOW_PATH" --arg sha "$SUCCESSFUL_RELEASE_SHA" --arg created "$SUCCESSFUL_RUN_CREATED_AT" --argjson id "$SUCCESSFUL_RUN_ID" --argjson attempt "$SUCCESSFUL_RUN_ATTEMPT" --argjson workflow "$DEPLOY_WORKFLOW_ID" '
            .id == $id and .run_attempt == $attempt and .workflow_id == $workflow and .path == $path
            and .event == "push" and .head_branch == "main" and .head_sha == $sha and .created_at == $created
            and .status == "completed" and .conclusion == "success"
          ' <<<"$run_json" >/dev/null || { echo 'Successful run identity mismatch.' >&2; exit 1; }

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SUCCESSFUL_RUN_ID}/jobs?filter=latest&per_page=100")"
          jq -e '
            .total_count == 1 and .jobs[0].name == "Validate, migrate, deploy, and verify protected Test"
            and .jobs[0].status == "completed" and .jobs[0].conclusion == "success"
          ' <<<"$jobs_json" >/dev/null || { echo 'Successful job identity mismatch.' >&2; exit 1; }
          required_steps=(
            'Guard exact source and validate release'
            'Sign in to protected Test subscription'
            'Snapshot protected Test and preserve rollback contract'
            'Build immutable API, web, and migration images'
            'Apply and verify Migrations 086, 088, 093, 094, 095, 096, and 097 inside Test private network'
            'Deploy immutable Test API image'
            'Deploy immutable Test web image'
            'Run protected-Test authenticated functional UAT'
            'Run protected-Test assigned-work visibility UAT'
            'Run protected-Test utilization role-scoping UAT'
            'Upload protected-Test deployment evidence'
            'Publish protected-Test release summary'
          )
          for step_name in "${required_steps[@]}"; do
            jq -e --arg name "$step_name" '([.jobs[0].steps[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length) == 1' <<<"$jobs_json" >/dev/null || {
              echo "Missing successful step: $step_name" >&2
              exit 1
            }
          done
          jq -e '([.jobs[0].steps[] | select(.name == "Restore exact prior Test images after application failure" and .conclusion == "skipped")] | length) == 1' <<<"$jobs_json" >/dev/null

          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SUCCESSFUL_RUN_ID}/artifacts?per_page=100")"
          jq -e --arg name "$SUCCESSFUL_ARTIFACT_NAME" --arg sha "$SUCCESSFUL_RELEASE_SHA" --argjson id "$SUCCESSFUL_RUN_ID" '
            .total_count == 1 and ([.artifacts[] | select(
              .name == $name and .expired == false and .size_in_bytes > 0 and (.digest | startswith("sha256:"))
              and .workflow_run.id == $id and .workflow_run.head_sha == $sha
            )] | length) == 1
          ' <<<"$artifacts_json" >/dev/null || { echo 'Evidence artifact mismatch.' >&2; exit 1; }
          run_url="$(jq -r '.html_url' <<<"$run_json")"
          artifact_id="$(jq -r '.artifacts[0].id' <<<"$artifacts_json")"
          artifact_digest="$(jq -r '.artifacts[0].digest' <<<"$artifacts_json")"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "FINALIZED_PROTECTED_UAT_RUN_ID=$SUCCESSFUL_RUN_ID"
          echo "FINALIZED_PROTECTED_UAT_ARTIFACT_DIGEST=$artifact_digest"

      - name: Force-retire exact zero-job ghost deployment
        id: retired
        shell: bash
        run: |
          set -Eeuo pipefail
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RETIRED_RELEASE_BRANCH}" --jq '.object.sha')"
          [[ "$branch_sha" == "$RETIRED_RELEASE_SHA" ]] || { echo 'Legacy candidate changed.' >&2; exit 1; }
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}")"
          jq -e --arg path "$DEPLOY_WORKFLOW_PATH" --arg sha "$RETIRED_RELEASE_SHA" --arg branch "$RETIRED_RELEASE_BRANCH" --arg created "$RETIRED_RUN_CREATED_AT" --argjson id "$RETIRED_RUN_ID" --argjson attempt "$RETIRED_RUN_ATTEMPT" --argjson workflow "$DEPLOY_WORKFLOW_ID" '
            .id == $id and .run_attempt == $attempt and .workflow_id == $workflow and .path == $path
            and .event == "workflow_dispatch" and .head_branch == $branch and .head_sha == $sha and .created_at == $created
          ' <<<"$run_json" >/dev/null || { echo 'Ghost run identity mismatch.' >&2; exit 1; }
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}/jobs?filter=latest&per_page=100" --jq '.total_count')" == '0' ]]
          cancelled=false
          status="$(jq -r '.status' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
          if [[ "$status" == 'completed' && "$conclusion" == 'cancelled' ]]; then
            cancelled=true
          elif [[ "$status" == 'queued' && -z "$conclusion" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}/cancel" >/dev/null || true
            for attempt in $(seq 1 60); do
              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}")"
              [[ "$(jq -r '.run_attempt' <<<"$run_json")" == "$RETIRED_RUN_ATTEMPT" ]] || exit 1
              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
              if [[ "$status" == 'completed' ]]; then
                [[ "$conclusion" == 'cancelled' ]] || exit 1
                cancelled=true
                break
              fi
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}/force-cancel" >/dev/null || true
              sleep 2
            done
          else
            echo "Ghost run entered an unexpected terminal state: status=$status conclusion=${conclusion:-null}" >&2
            exit 1
          fi
          [[ "$cancelled" == true ]] || { echo 'Ghost cancellation was not verified.' >&2; exit 1; }
          post_cancel_jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}/jobs?filter=all&per_page=100")"
          jq -e '.total_count == 0 and (.jobs | length) == 0' <<<"$post_cancel_jobs_json" >/dev/null || {
            echo 'Ghost materialized one or more jobs during cancellation; finalization failed closed.' >&2
            exit 1
          }
          retired_url="$(jq -r '.html_url' <<<"$run_json")"
          echo "retired_url=$retired_url" >> "$GITHUB_OUTPUT"
          echo 'FINALIZED_PROTECTED_UAT_GHOST_CONCLUSION=cancelled'

      - name: Verify sealed exhaustive deployment ledger
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')" == 'disabled_manually' ]]
          : > "$RUNNER_TEMP/shared-group-runs.ndjson"
          while IFS= read -r workflow_id; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
              --jq '.workflow_runs[]' >> "$RUNNER_TEMP/shared-group-runs.ndjson"
          done < <(jq -r '.[].id' "$RUNNER_TEMP/protected-test-workflow-metadata.json")
          jq -s 'unique_by(.id)' "$RUNNER_TEMP/shared-group-runs.ndjson" > "$RUNNER_TEMP/shared-group-runs.json"
          runs_json="$(jq -c '{workflow_runs: .}' "$RUNNER_TEMP/shared-group-runs.json")"
          [[ "$(jq -r '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs_json")" == '0' ]]
          [[ "$(jq -r --arg created "$SUCCESSFUL_RUN_CREATED_AT" --argjson success "$SUCCESSFUL_RUN_ID" --argjson retired "$RETIRED_RUN_ID" '[.workflow_runs[] | select(.id != $success and .id != $retired and (.created_at >= $created or ((.run_started_at // .created_at) >= $created)))] | length' <<<"$runs_json")" == '0' ]]
          jq -e --argjson success "$SUCCESSFUL_RUN_ID" --argjson retired "$RETIRED_RUN_ID" '
            ([.workflow_runs[] | select(.id == $success and .run_attempt == 1 and .status == "completed" and .conclusion == "success")] | length) == 1
            and ([.workflow_runs[] | select(.id == $retired and .run_attempt == 1 and .status == "completed" and .conclusion == "cancelled")] | length) == 1
          ' <<<"$runs_json" >/dev/null
          echo 'FINALIZED_PROTECTED_UAT_WORKFLOW_STATE=disabled_manually'
          echo 'FINALIZED_PROTECTED_UAT_SHARED_GROUP_POST_SUCCESS_DEPLOYMENTS=none'
          echo 'FINALIZED_PROTECTED_UAT_POST_SUCCESS_DEPLOYMENTS=none'

      - name: Reassert disabled Protected-Test workflow
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')"
          case "$workflow_state" in
            active)
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}/disable" >/dev/null
              ;;
            disabled_manually)
              ;;
            *)
              echo "Unexpected deployment workflow state during final sealing: $workflow_state" >&2
              exit 1
              ;;
          esac
          unexpected_active_seen=false
          for sweep in $(seq 1 5); do
            pages_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}/runs?per_page=100")"
            runs_json="$(jq -c '{workflow_runs: [.[].workflow_runs[]]}' <<<"$pages_json")"
            mapfile -t active_run_ids < <(jq -r '.workflow_runs[] | select(.status != "completed") | .id' <<<"$runs_json")
            if (( ${#active_run_ids[@]} == 0 )); then
              break
            fi
            unexpected_active_seen=true
            for active_run_id in "${active_run_ids[@]}"; do
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${active_run_id}/cancel" >/dev/null || true
              terminal=false
              for attempt in $(seq 1 60); do
                active_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${active_run_id}")"
                if [[ "$(jq -r '.status' <<<"$active_run_json")" == 'completed' ]]; then
                  terminal=true
                  break
                fi
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${active_run_id}/force-cancel" >/dev/null || true
                sleep 2
              done
              [[ "$terminal" == true ]] || { echo "Active deployment $active_run_id did not reach a terminal state." >&2; exit 1; }
            done
          done
          pages_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}/runs?per_page=100")"
          runs_json="$(jq -c '{workflow_runs: [.[].workflow_runs[]]}' <<<"$pages_json")"
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')" == 'disabled_manually' ]]
          [[ "$(jq -r '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs_json")" == '0' ]]
          [[ "$(jq -r --arg created "$SUCCESSFUL_RUN_CREATED_AT" --argjson id "$SUCCESSFUL_RUN_ID" '[.workflow_runs[] | select(.created_at >= $created and .id != $id)] | length' <<<"$runs_json")" == '0' ]]
          [[ "$(jq -r --arg created "$SUCCESSFUL_RUN_CREATED_AT" --argjson success "$SUCCESSFUL_RUN_ID" '[.workflow_runs[] | select(.id != $success and ((.run_started_at // .created_at) >= $created))] | length' <<<"$runs_json")" == '0' ]]
          jq -e --argjson success "$SUCCESSFUL_RUN_ID" --argjson retired "$RETIRED_RUN_ID" '
            ([.workflow_runs[] | select(.id == $success and .run_attempt == 1 and .status == "completed" and .conclusion == "success")] | length) == 1
            and ([.workflow_runs[] | select(.id == $retired and .run_attempt == 1 and .status == "completed" and .conclusion == "cancelled")] | length) == 1
          ' <<<"$runs_json" >/dev/null
          if [[ "$unexpected_active_seen" == true ]]; then
            echo 'Unexpected active deployments were terminally cancelled; finalization refuses success.' >&2
            exit 1
          fi
          echo 'FINALIZED_PROTECTED_UAT_FINAL_WORKFLOW_STATE=disabled_manually'
          echo 'FINALIZED_PROTECTED_UAT_FINAL_ACTIVE_DEPLOYMENTS=none'

      - name: Record successful finalization evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "Protected-Test UAT completed and finalization succeeded.\n\n- Successful deployment: ${{ steps.evidence.outputs.run_url }}\n- Release SHA: \`$SUCCESSFUL_RELEASE_SHA\`\n- Evidence artifact: \`$SUCCESSFUL_ARTIFACT_NAME\` (ID ${{ steps.evidence.outputs.artifact_id }}, digest \`${{ steps.evidence.outputs.artifact_digest }}\`)\n- Module 001B assigned-work/live-reallocation UAT: passed\n- Utilization role-scoping UAT: passed\n- Retired zero-job ghost: ${{ steps.retired.outputs.retired_url }}\n- Deployment workflow: \`disabled_manually\`\n- Legacy candidate ref restoration: pending\n- Production mutation: none\n- Module 025 mutation: none"

      - name: Record failed finalization evidence
        if: failure()
        shell: bash
        run: |
          set +e
          final_workflow_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state' 2>/dev/null || true)"
          final_active_count="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}/runs?per_page=100" 2>/dev/null | jq -r '[.[].workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || true)"
          if [[ "$final_workflow_state" == 'disabled_manually' && "$final_active_count" == '0' ]]; then
            sealing_status='verified disabled_manually with zero active deployments'
          else
            sealing_status="NOT VERIFIED (workflow state ${final_workflow_state:-unavailable}, active deployments ${final_active_count:-unavailable}); manual sealing required immediately; active-run cancellation required immediately"
          fi
          gh pr comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "Protected-Test UAT finalization failed.\n\n- Successful deployment under verification: \`$SUCCESSFUL_RUN_ID\`\n- Ghost under retirement: \`$RETIRED_RUN_ID\`\n- Deployment workflow sealing: $sealing_status\n- Production mutation: none\n- Module 025 mutation: none"
