name: One-Time Protected UAT Workflow Control for PR790

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: protected-uat-pr790-workflow-control
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'ahmedadeyemi-cts' &&
      github.event.comment.body == 'DEPLOY PROTECTED UAT PR790 cb4dbe53371120239a9aa1bcb7f8467df5643e55'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_WORKFLOW: projectpulse-deploy-test.yml
      EXPECTED_RELEASE_SHA: cb4dbe53371120239a9aa1bcb7f8467df5643e55
      CONTROL_WORKFLOW_PATH: .github/workflows/protected-uat-celar-ai-pr782-workflow-control.yml
      AUTHORIZED_CANDIDATE_BRANCH: fix/shared-project-document-planning-20260819
    steps:
      - name: Verify immutable repaired release boundary
        id: boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_RELEASE_SHA}...${actual_main}")"
          status="$(jq -r '.status' <<<"$comparison")"
          [[ "$status" == 'ahead' || "$status" == 'identical' ]] || {
            echo "Main no longer descends from the repaired release source: $status" >&2
            exit 1
          }
          mapfile -t changed_files < <(jq -r '.files[].filename' <<<"$comparison")
          printf '%s\n' "${changed_files[@]}" | sed '/^$/d' | LC_ALL=C sort -u > "$RUNNER_TEMP/changed-files"
          printf '%s\n' "$CONTROL_WORKFLOW_PATH" | LC_ALL=C sort -u > "$RUNNER_TEMP/allowed-files"
          cmp -s "$RUNNER_TEMP/changed-files" "$RUNNER_TEMP/allowed-files" || {
            echo 'Unexpected source drift exists between the repaired runtime and current main:' >&2
            diff -u "$RUNNER_TEMP/allowed-files" "$RUNNER_TEMP/changed-files" >&2 || true
            exit 1
          }
          echo "controller_main_sha=$actual_main" >> "$GITHUB_OUTPUT"
          echo "PROTECTED_UAT_REPAIRED_RUNTIME_SHA=$EXPECTED_RELEASE_SHA"
          echo "PROTECTED_UAT_CONTROLLER_MAIN_SHA=$actual_main"

      - name: Verify externally pinned governed candidate ref
        id: pin
        shell: bash
        run: |
          set -Eeuo pipefail
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${AUTHORIZED_CANDIDATE_BRANCH}" --jq '.object.sha')"
          [[ "$branch_sha" == "$EXPECTED_RELEASE_SHA" ]] || {
            echo "Governed candidate ref is not pinned to repaired runtime. Expected $EXPECTED_RELEASE_SHA, found $branch_sha" >&2
            exit 1
          }
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/enable" >/dev/null
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}" --jq '.state')"
          [[ "$state" == 'active' ]] || { echo "Deployment workflow is not active: $state" >&2; exit 1; }
          echo "PROTECTED_UAT_EXTERNALLY_PINNED_RELEASE_REF=$AUTHORIZED_CANDIDATE_BRANCH"
          echo "PROTECTED_UAT_EXTERNALLY_PINNED_RELEASE_SHA=$EXPECTED_RELEASE_SHA"

      - name: Dispatch exact governed Protected Test deployment
        id: dispatch
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run "$DEPLOY_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
            --ref "$AUTHORIZED_CANDIDATE_BRANCH" \
            -f release_sha="$EXPECTED_RELEASE_SHA" \
            -f release_branch="$AUTHORIZED_CANDIDATE_BRANCH"

          run_id=''
          run_url=''
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$DEPLOY_WORKFLOW" \
              --branch "$AUTHORIZED_CANDIDATE_BRANCH" --event workflow_dispatch --limit 30 \
              --json databaseId,headSha,createdAt \
              --jq "map(select(.headSha == \"$EXPECTED_RELEASE_SHA\")) | sort_by(.createdAt) | last | .databaseId // empty")"
            if [[ -n "$run_id" ]]; then
              run_url="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
              break
            fi
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo 'The governed Protected Test deployment run was not created.' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "PROTECTED_UAT_DEPLOYMENT_RUN_ID=$run_id"
          echo "PROTECTED_UAT_DEPLOYMENT_RUN_URL=$run_url"

      - name: Watch Protected Test deployment through completion
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run watch '${{ steps.dispatch.outputs.run_id }}' --repo "$GITHUB_REPOSITORY" --interval 10 --exit-status

      - name: Disable Protected Test deployment workflow after attempt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/disable" >/dev/null
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}" --jq '.state')"
          [[ "$state" == 'disabled_manually' ]] || { echo "Deployment workflow did not return to disabled state: $state" >&2; exit 1; }
          echo "PROTECTED_UAT_DEPLOY_WORKFLOW_STATE=$state"

      - name: Record successful deployment evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "Protected UAT deployment completed successfully.\n\n- Repaired runtime source: \`$EXPECTED_RELEASE_SHA\`\n- Controller main: \`${{ steps.boundary.outputs.controller_main_sha }}\`\n- Governed deployment run: ${{ steps.dispatch.outputs.run_url }}\n- Deployment workflow: returned to \`disabled_manually\`\n- Governed candidate ref restoration: pending external release-supervisor restoration\n- Production mutation: none"

      - name: Record failed deployment evidence
        if: failure()
        shell: bash
        run: |
          set +e
          run_url='${{ steps.dispatch.outputs.run_url }}'
          [[ -n "$run_url" ]] || run_url='Deployment run was not created.'
          gh pr comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "Protected UAT deployment failed or could not be dispatched.\n\n- Repaired runtime source: \`$EXPECTED_RELEASE_SHA\`\n- Controller main: \`${{ steps.boundary.outputs.controller_main_sha }}\`\n- Evidence: $run_url\n- Deployment workflow disable was attempted automatically.\n- Governed candidate ref restoration: pending external release-supervisor restoration\n- Production mutation: none"
