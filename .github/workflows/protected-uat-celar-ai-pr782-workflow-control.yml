name: One-Time Protected UAT Queue Recovery for PR794

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: protected-uat-pr794-queue-recovery
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 794 &&
      github.actor == 'ahmedadeyemi-cts' &&
      github.event.comment.body == 'RESUME PROTECTED UAT PR794 RUN 33654881418 SHA 3d02b4cb62683b96554186f9d3a782fc1f21ca54'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_WORKFLOW: projectpulse-deploy-test.yml
      EXPECTED_RELEASE_SHA: 3d02b4cb62683b96554186f9d3a782fc1f21ca54
      EXPECTED_RUN_ID: '33654881418'
      EXPECTED_RUN_ATTEMPT: '1'
      EXPECTED_RUN_CREATED_AT: '2026-09-02T16:26:03Z'
      CONTROL_WORKFLOW_PATH: .github/workflows/protected-uat-celar-ai-pr782-workflow-control.yml
      AUTHORIZED_CANDIDATE_BRANCH: fix/shared-project-document-planning-20260819
    steps:
      - name: Verify immutable reviewed PR794 recovery boundary
        id: boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_RELEASE_SHA}...${actual_main}")"
          status="$(jq -r '.status' <<<"$comparison")"
          [[ "$status" == 'ahead' || "$status" == 'identical' ]] || {
            echo "Main no longer descends from the reviewed PR794 release source: $status" >&2
            exit 1
          }
          mapfile -t changed_files < <(jq -r '.files[].filename' <<<"$comparison")
          printf '%s\n' "${changed_files[@]}" | sed '/^$/d' | LC_ALL=C sort -u > "$RUNNER_TEMP/changed-files"
          printf '%s\n' "$CONTROL_WORKFLOW_PATH" | LC_ALL=C sort -u > "$RUNNER_TEMP/allowed-files"
          cmp -s "$RUNNER_TEMP/changed-files" "$RUNNER_TEMP/allowed-files" || {
            echo 'Unexpected source drift exists between the reviewed PR794 runtime and current main:' >&2
            diff -u "$RUNNER_TEMP/allowed-files" "$RUNNER_TEMP/changed-files" >&2 || true
            exit 1
          }
          echo "controller_main_sha=$actual_main" >> "$GITHUB_OUTPUT"
          echo "PROTECTED_UAT_RECOVERY_RUNTIME_SHA=$EXPECTED_RELEASE_SHA"
          echo "PROTECTED_UAT_RECOVERY_CONTROLLER_MAIN_SHA=$actual_main"

      - name: Verify pinned ref and exact queued deployment
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${AUTHORIZED_CANDIDATE_BRANCH}" --jq '.object.sha')"
          [[ "$branch_sha" == "$EXPECTED_RELEASE_SHA" ]] || {
            echo "Governed candidate ref is not pinned to reviewed PR794 runtime. Expected $EXPECTED_RELEASE_SHA, found $branch_sha" >&2
            exit 1
          }

          expected_workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}" --jq '.id')"
          [[ "$expected_workflow_id" =~ ^[0-9]+$ ]] || {
            echo "Could not resolve the governed deployment workflow ID: $expected_workflow_id" >&2
            exit 1
          }
          workflow_run_pages_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/runs?per_page=100")"
          workflow_runs_json="$(jq -c '{workflow_runs: [.[].workflow_runs[]]}' <<<"$workflow_run_pages_json")"
          mapfile -t preexisting_active_run_ids < <(
            jq -r --argjson expected_run_id "$EXPECTED_RUN_ID" '
              .workflow_runs[]
              | select(.id != $expected_run_id and .status != "completed")
              | .id
            ' <<<"$workflow_runs_json"
          )
          (( ${#preexisting_active_run_ids[@]} == 0 )) || {
            echo "Unrelated active deployment runs already exist: ${preexisting_active_run_ids[*]}" >&2
            exit 1
          }
          jq -c '[.workflow_runs[] | {id, run_attempt}]' <<<"$workflow_runs_json" \
            > "$RUNNER_TEMP/protected-uat-deployment-run-baseline.json"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}")"
          jq -e \
            --arg expected_sha "$EXPECTED_RELEASE_SHA" \
            --arg expected_branch "$AUTHORIZED_CANDIDATE_BRANCH" \
            --arg created_at "$EXPECTED_RUN_CREATED_AT" \
            --argjson expected_run_id "$EXPECTED_RUN_ID" \
            --argjson expected_run_attempt "$EXPECTED_RUN_ATTEMPT" \
            --argjson expected_workflow_id "$expected_workflow_id" \
            '.id == $expected_run_id
             and .run_attempt == $expected_run_attempt
             and .workflow_id == $expected_workflow_id
             and .event == "workflow_dispatch"
             and .head_sha == $expected_sha
             and .head_branch == $expected_branch
             and .created_at == $created_at
             and (.status == "queued" or .status == "in_progress")' <<<"$run_json" >/dev/null || {
            echo 'The recovery target no longer matches the exact governed queued deployment.' >&2
            jq '{id, workflow_id, event, head_sha, head_branch, created_at, status, conclusion, html_url}' <<<"$run_json" >&2 || true
            exit 1
          }
          run_url="$(jq -r '.html_url' <<<"$run_json")"
          [[ "$run_url" == "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}" ]] || {
            echo "Unexpected recovery run URL: $run_url" >&2
            exit 1
          }
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "PROTECTED_UAT_RECOVERY_RUN_ID=$EXPECTED_RUN_ID"
          echo "PROTECTED_UAT_RECOVERY_RUN_URL=$run_url"

      - name: Re-enable deployment workflow for queued job materialization
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/enable" >/dev/null
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}" --jq '.state')"
          [[ "$state" == 'active' ]] || { echo "Deployment workflow is not active: $state" >&2; exit 1; }
          echo "PROTECTED_UAT_RECOVERY_WORKFLOW_STATE=$state"

      - name: Wait for exact queued deployment job to materialize
        shell: bash
        run: |
          set -Eeuo pipefail
          materialized=false
          for attempt in $(seq 1 24); do
            workflow_run_pages_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/runs?per_page=100")"
          workflow_runs_json="$(jq -c '{workflow_runs: [.[].workflow_runs[]]}' <<<"$workflow_run_pages_json")"
            mapfile -t unexpected_run_ids < <(
              jq -r \
                --slurpfile baseline "$RUNNER_TEMP/protected-uat-deployment-run-baseline.json" \
                --argjson expected_run_id "$EXPECTED_RUN_ID" \
                --argjson expected_run_attempt "$EXPECTED_RUN_ATTEMPT" '
                  .workflow_runs[]
                  | . as $run
                  | select(
                      if $run.id == $expected_run_id then
                        $run.run_attempt != $expected_run_attempt
                      else
                        ($baseline[0]
                          | map(select(.id == $run.id and .run_attempt == $run.run_attempt))
                          | length) == 0
                      end
                    )
                  | .id
                ' <<<"$workflow_runs_json"
            )
            if (( ${#unexpected_run_ids[@]} > 0 )); then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/disable" >/dev/null
              for unexpected_run_id in "${unexpected_run_ids[@]}"; do
                if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${unexpected_run_id}/cancel" >/dev/null; then
                  echo "Cancellation requested for unexpected run ${unexpected_run_id}."
                else
                  echo "Initial cancellation request failed for unexpected run ${unexpected_run_id}; verification will retry." >&2
                fi
              done
              cancellation_verified=true
              for unexpected_run_id in "${unexpected_run_ids[@]}"; do
                run_cancelled=false
                for cancel_attempt in $(seq 1 30); do
                  if ! unexpected_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${unexpected_run_id}")"; then
                    echo "Could not inspect unexpected run ${unexpected_run_id} on attempt ${cancel_attempt}." >&2
                  else
                    unexpected_status="$(jq -r '.status' <<<"$unexpected_run_json")"
                    unexpected_conclusion="$(jq -r '.conclusion // ""' <<<"$unexpected_run_json")"
                    if [[ "$unexpected_status" == 'completed' ]]; then
                      if [[ "$unexpected_conclusion" == 'cancelled' ]]; then
                        run_cancelled=true
                      else
                        echo "Unexpected run ${unexpected_run_id} completed as ${unexpected_conclusion:-unknown}, not cancelled." >&2
                      fi
                      break
                    fi
                    if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${unexpected_run_id}/cancel" >/dev/null; then
                      echo "Cancellation retry failed for unexpected run ${unexpected_run_id} on attempt ${cancel_attempt}." >&2
                    fi
                  fi
                  sleep 2
                done
                if [[ "$run_cancelled" != true ]]; then
                  cancellation_verified=false
                fi
              done
              [[ "$cancellation_verified" == true ]] || {
                echo "One or more unexpected deployment runs could not be verified as cancelled: ${unexpected_run_ids[*]}" >&2
                exit 1
              }
              echo "Unexpected deployment runs appeared during recovery and were verified cancelled: ${unexpected_run_ids[*]}" >&2
              exit 1
            fi
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}")"
            run_status="$(jq -r '.status' <<<"$run_json")"
            run_conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}/jobs?filter=latest&per_page=100")"
            job_count="$(jq -r '.total_count' <<<"$jobs_json")"
            echo "PROTECTED_UAT_RECOVERY_POLL attempt=$attempt status=$run_status conclusion=${run_conclusion:-none} jobs=$job_count"
            if [[ "$job_count" =~ ^[0-9]+$ ]] && (( job_count > 0 )); then
              materialized=true
              break
            fi
            [[ "$run_status" != 'completed' ]] || {
              echo "The exact deployment completed without materializing a job: ${run_conclusion:-unknown}" >&2
              exit 1
            }
            sleep 5
          done
          [[ "$materialized" == true ]] || {
            echo 'The exact queued deployment did not materialize a job within two minutes.' >&2
            exit 1
          }
          echo 'PROTECTED_UAT_RECOVERY_JOB_MATERIALIZED=true'

      - name: Seal deployment workflow after job materialization
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/disable" >/dev/null
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}" --jq '.state')"
          [[ "$state" == 'disabled_manually' ]] || { echo "Deployment workflow did not seal after recovery: $state" >&2; exit 1; }
          workflow_run_pages_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/runs?per_page=100")"
          workflow_runs_json="$(jq -c '{workflow_runs: [.[].workflow_runs[]]}' <<<"$workflow_run_pages_json")"
          mapfile -t unexpected_run_ids < <(
            jq -r \
              --slurpfile baseline "$RUNNER_TEMP/protected-uat-deployment-run-baseline.json" \
              --argjson expected_run_id "$EXPECTED_RUN_ID" \
              --argjson expected_run_attempt "$EXPECTED_RUN_ATTEMPT" '
                .workflow_runs[]
                | . as $run
                | select(
                    if $run.id == $expected_run_id then
                      $run.run_attempt != $expected_run_attempt
                    else
                      ($baseline[0]
                        | map(select(.id == $run.id and .run_attempt == $run.run_attempt))
                        | length) == 0
                    end
                  )
                | .id
              ' <<<"$workflow_runs_json"
          )
          if (( ${#unexpected_run_ids[@]} > 0 )); then
            for unexpected_run_id in "${unexpected_run_ids[@]}"; do
              if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${unexpected_run_id}/cancel" >/dev/null; then
                echo "Cancellation requested for unexpected run ${unexpected_run_id}."
              else
                echo "Initial cancellation request failed for unexpected run ${unexpected_run_id}; verification will retry." >&2
              fi
            done
            cancellation_verified=true
            for unexpected_run_id in "${unexpected_run_ids[@]}"; do
              run_cancelled=false
              for cancel_attempt in $(seq 1 30); do
                if ! unexpected_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${unexpected_run_id}")"; then
                  echo "Could not inspect unexpected run ${unexpected_run_id} on attempt ${cancel_attempt}." >&2
                else
                  unexpected_status="$(jq -r '.status' <<<"$unexpected_run_json")"
                  unexpected_conclusion="$(jq -r '.conclusion // ""' <<<"$unexpected_run_json")"
                  if [[ "$unexpected_status" == 'completed' ]]; then
                    if [[ "$unexpected_conclusion" == 'cancelled' ]]; then
                      run_cancelled=true
                    else
                      echo "Unexpected run ${unexpected_run_id} completed as ${unexpected_conclusion:-unknown}, not cancelled." >&2
                    fi
                    break
                  fi
                  if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${unexpected_run_id}/cancel" >/dev/null; then
                    echo "Cancellation retry failed for unexpected run ${unexpected_run_id} on attempt ${cancel_attempt}." >&2
                  fi
                fi
                sleep 2
              done
              if [[ "$run_cancelled" != true ]]; then
                cancellation_verified=false
              fi
            done
            [[ "$cancellation_verified" == true ]] || {
              echo "One or more unexpected deployment runs could not be verified as cancelled: ${unexpected_run_ids[*]}" >&2
              exit 1
            }
            echo "Unexpected deployment runs appeared before the recovery window sealed and were verified cancelled: ${unexpected_run_ids[*]}" >&2
            exit 1
          fi
          echo "PROTECTED_UAT_RECOVERY_WORKFLOW_SEALED=$state"

      - name: Monitor exact recovered deployment through completion
        shell: bash
        run: |
          set -Eeuo pipefail
          for monitor_attempt in $(seq 1 1440); do
            workflow_run_pages_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/runs?per_page=100")"
          workflow_runs_json="$(jq -c '{workflow_runs: [.[].workflow_runs[]]}' <<<"$workflow_run_pages_json")"
            mapfile -t unexpected_run_ids < <(
              jq -r \
                --slurpfile baseline "$RUNNER_TEMP/protected-uat-deployment-run-baseline.json" \
                --argjson expected_run_id "$EXPECTED_RUN_ID" \
                --argjson expected_run_attempt "$EXPECTED_RUN_ATTEMPT" '
                  .workflow_runs[]
                  | . as $run
                  | select(
                      if $run.id == $expected_run_id then
                        $run.run_attempt != $expected_run_attempt
                      else
                        ($baseline[0]
                          | map(select(.id == $run.id and .run_attempt == $run.run_attempt))
                          | length) == 0
                      end
                    )
                  | .id
                ' <<<"$workflow_runs_json"
            )
            (( ${#unexpected_run_ids[@]} == 0 )) || {
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/disable" >/dev/null
              echo "Unexpected deployment run or rerun detected during the governed watch: ${unexpected_run_ids[*]}" >&2
              exit 1
            }

            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}")"
            run_attempt="$(jq -r '.run_attempt' <<<"$run_json")"
            [[ "$run_attempt" == "$EXPECTED_RUN_ATTEMPT" ]] || {
              echo "The governed deployment run attempt changed from $EXPECTED_RUN_ATTEMPT to $run_attempt." >&2
              exit 1
            }
            run_status="$(jq -r '.status' <<<"$run_json")"
            run_conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            echo "PROTECTED_UAT_RECOVERY_WATCH attempt=$monitor_attempt status=$run_status conclusion=${run_conclusion:-none}"
            if [[ "$run_status" == 'completed' ]]; then
              [[ "$run_conclusion" == 'success' ]] || {
                echo "The exact recovered deployment completed as ${run_conclusion:-unknown}." >&2
                exit 1
              }
              echo 'PROTECTED_UAT_RECOVERY_DEPLOYMENT_COMPLETED=success'
              exit 0
            fi
            sleep 10
          done
          echo 'The exact recovered deployment exceeded the four-hour governed watch.' >&2
          exit 1

      - name: Reassert disabled Protected Test workflow and reject all non-target attempts
        if: always()
        shell: bash
        run: |
          set -Euo pipefail
          cleanup_failed=false
          unexpected_seen=false
          sealed=false
          for seal_attempt in $(seq 1 5); do
            if gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/disable" >/dev/null; then
              if state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}" --jq '.state')" \
                 && [[ "$state" == 'disabled_manually' ]]; then
                sealed=true
                break
              fi
            fi
            echo "Deployment workflow seal attempt ${seal_attempt} failed; retrying." >&2
            sleep 2
          done
          if [[ "$sealed" != true ]]; then
            cleanup_failed=true
            echo 'Deployment workflow could not be verified as disabled.' >&2
          fi

          if [[ -f "$RUNNER_TEMP/protected-uat-deployment-run-baseline.json" ]]; then
            for audit_attempt in $(seq 1 3); do
              if ! workflow_run_pages_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/runs?per_page=100")" \
                 || ! workflow_runs_json="$(jq -c '{workflow_runs: [.[].workflow_runs[]]}' <<<"$workflow_run_pages_json")"; then
                cleanup_failed=true
                echo "Could not list deployment runs during cleanup audit ${audit_attempt}." >&2
                sleep 2
                continue
              fi
              unexpected_file="$RUNNER_TEMP/unexpected-runs-${audit_attempt}"
              if ! jq -r \
                --slurpfile baseline "$RUNNER_TEMP/protected-uat-deployment-run-baseline.json" \
                --argjson expected_run_id "$EXPECTED_RUN_ID" \
                --argjson expected_run_attempt "$EXPECTED_RUN_ATTEMPT" '
                  .workflow_runs[]
                  | . as $run
                  | select(
                      if $run.id == $expected_run_id then
                        $run.run_attempt != $expected_run_attempt
                      else
                        ($baseline[0]
                          | map(select(.id == $run.id and .run_attempt == $run.run_attempt))
                          | length) == 0
                      end
                    )
                  | .id
                ' <<<"$workflow_runs_json" > "$unexpected_file"; then
                cleanup_failed=true
                echo "Could not evaluate deployment-run baseline during cleanup audit ${audit_attempt}." >&2
                sleep 2
                continue
              fi
              mapfile -t unexpected_run_ids < "$unexpected_file"
              if (( ${#unexpected_run_ids[@]} > 0 )); then
                unexpected_seen=true
                for unexpected_run_id in "${unexpected_run_ids[@]}"; do
                  if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${unexpected_run_id}/cancel" >/dev/null; then
                    echo "Cancellation requested for unexpected run ${unexpected_run_id}."
                  else
                    echo "Initial cancellation request failed for unexpected run ${unexpected_run_id}; verification will retry." >&2
                  fi
                done
                cancellation_verified=true
                for unexpected_run_id in "${unexpected_run_ids[@]}"; do
                  run_cancelled=false
                  for cancel_attempt in $(seq 1 30); do
                    if ! unexpected_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${unexpected_run_id}")"; then
                      echo "Could not inspect unexpected run ${unexpected_run_id} on attempt ${cancel_attempt}." >&2
                    else
                      unexpected_status="$(jq -r '.status' <<<"$unexpected_run_json")"
                      unexpected_conclusion="$(jq -r '.conclusion // ""' <<<"$unexpected_run_json")"
                      if [[ "$unexpected_status" == 'completed' ]]; then
                        if [[ "$unexpected_conclusion" == 'cancelled' ]]; then
                          run_cancelled=true
                        else
                          echo "Unexpected run ${unexpected_run_id} completed as ${unexpected_conclusion:-unknown}, not cancelled." >&2
                        fi
                        break
                      fi
                      if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${unexpected_run_id}/cancel" >/dev/null; then
                        echo "Cancellation retry failed for unexpected run ${unexpected_run_id} on attempt ${cancel_attempt}." >&2
                      fi
                    fi
                    sleep 2
                  done
                  if [[ "$run_cancelled" != true ]]; then
                    cancellation_verified=false
                  fi
                done
                if [[ "$cancellation_verified" != true ]]; then
                  cleanup_failed=true
                  echo "One or more unexpected deployment runs could not be verified as cancelled: ${unexpected_run_ids[*]}" >&2
                fi
              fi
              sleep 2
            done
          fi

          [[ "$cleanup_failed" == false ]] || exit 1
          [[ "$unexpected_seen" == false ]] || {
            echo 'Unexpected deployment attempts were detected and cancelled; the recovery boundary is failed closed.' >&2
            exit 1
          }
          echo 'PROTECTED_UAT_RECOVERY_FINAL_WORKFLOW_STATE=disabled_manually'
          echo 'PROTECTED_UAT_RECOVERY_NON_TARGET_ATTEMPTS=none'

      - name: Record successful recovery evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "Protected UAT queue recovery completed successfully.\n\n- Reviewed PR794 runtime source: \`$EXPECTED_RELEASE_SHA\`\n- Recovery controller main: \`${{ steps.boundary.outputs.controller_main_sha }}\`\n- Adopted governed deployment run: ${{ steps.target.outputs.run_url }}\n- Duplicate deployment dispatched: no\n- Deployment workflow: re-enabled only for job materialization, then sealed as \`disabled_manually\`\n- Governed candidate ref restoration: pending external release-supervisor restoration\n- Production mutation: none"

      - name: Record failed recovery evidence
        if: failure()
        shell: bash
        run: |
          set +e
          run_url='${{ steps.target.outputs.run_url }}'
          [[ -n "$run_url" ]] || run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}"
          gh pr comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "Protected UAT queue recovery failed.\n\n- Reviewed PR794 runtime source: \`$EXPECTED_RELEASE_SHA\`\n- Recovery controller main: \`${{ steps.boundary.outputs.controller_main_sha }}\`\n- Adopted governed deployment run: $run_url\n- Duplicate deployment dispatched: no\n- Deployment workflow disable was attempted automatically.\n- Governed candidate ref restoration: pending external release-supervisor restoration\n- Production mutation: none"
