name: One-Time Protected UAT Workflow Control for Celar AI PR782

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: protected-uat-celar-ai-pr782-workflow-control
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'ahmedadeyemi-cts' &&
      (github.event.comment.body == 'ENABLE PROTECTED UAT PR782 9494bdaf00c1e9d99144ca9ab9f11fbd29772a7d' ||
       github.event.comment.body == 'DISABLE PROTECTED UAT PR782 9494bdaf00c1e9d99144ca9ab9f11fbd29772a7d' ||
       github.event.comment.body == 'DEPLOY PROTECTED UAT PR782 9494bdaf00c1e9d99144ca9ab9f11fbd29772a7d')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_WORKFLOW: projectpulse-deploy-test.yml
      EXPECTED_RELEASE_SOURCE_SHA: 9494bdaf00c1e9d99144ca9ab9f11fbd29772a7d
      CONTROL_WORKFLOW_PATH: .github/workflows/protected-uat-celar-ai-pr782-workflow-control.yml
      LAUNCH_MARKER_PATH: src/backend/ProjectTime.Api/release-markers/protected-uat-pr782-launch-20260901.md
      AUTHORIZED_CANDIDATE_BRANCH: fix/shared-project-document-planning-20260819
    steps:
      - name: Verify immutable reviewed release boundary
        if: github.event.comment.body != 'DISABLE PROTECTED UAT PR782 9494bdaf00c1e9d99144ca9ab9f11fbd29772a7d'
        id: boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_RELEASE_SOURCE_SHA}...${actual_main}")"
          status="$(jq -r '.status' <<<"$comparison")"
          [[ "$status" == 'ahead' || "$status" == 'identical' ]] || {
            echo "Main no longer descends from the reviewed release source: $status" >&2
            exit 1
          }
          mapfile -t changed_files < <(jq -r '.files[].filename' <<<"$comparison")
          printf '%s\n' "${changed_files[@]}" | LC_ALL=C sort -u > "$RUNNER_TEMP/changed-files"
          cat > "$RUNNER_TEMP/allowed-files" <<FILES
          $CONTROL_WORKFLOW_PATH
          $LAUNCH_MARKER_PATH
          FILES
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/allowed-files"
          LC_ALL=C sort -u "$RUNNER_TEMP/allowed-files" -o "$RUNNER_TEMP/allowed-files"
          cmp -s "$RUNNER_TEMP/changed-files" "$RUNNER_TEMP/allowed-files" || {
            echo 'Unexpected source drift exists between the reviewed Celar AI release and current main:' >&2
            diff -u "$RUNNER_TEMP/allowed-files" "$RUNNER_TEMP/changed-files" >&2 || true
            exit 1
          }
          echo "main_sha=$actual_main" >> "$GITHUB_OUTPUT"
          echo "PROTECTED_UAT_REVIEWED_SOURCE_SHA=$EXPECTED_RELEASE_SOURCE_SHA"
          echo "PROTECTED_UAT_CONTROLLED_MAIN_SHA=$actual_main"

      - name: Apply enable or disable control
        if: github.event.comment.body != 'DEPLOY PROTECTED UAT PR782 9494bdaf00c1e9d99144ca9ab9f11fbd29772a7d'
        id: control
        shell: bash
        run: |
          set -Eeuo pipefail
          command='${{ github.event.comment.body }}'
          if [[ "$command" == ENABLE\ PROTECTED\ UAT\ PR782\ "$EXPECTED_RELEASE_SOURCE_SHA" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/enable" >/dev/null
            expected_state='active'
            action='enabled'
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/disable" >/dev/null
            expected_state='disabled_manually'
            action='disabled'
          fi
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}" --jq '.state')"
          [[ "$state" == "$expected_state" ]] || {
            echo "Protected UAT workflow state mismatch: expected $expected_state, found $state" >&2
            exit 1
          }
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "PROTECTED_UAT_DEPLOY_WORKFLOW_ACTION=$action"
          echo "PROTECTED_UAT_DEPLOY_WORKFLOW_STATE=$state"

      - name: Verify externally pinned governed candidate ref
        if: github.event.comment.body == 'DEPLOY PROTECTED UAT PR782 9494bdaf00c1e9d99144ca9ab9f11fbd29772a7d'
        id: pin
        shell: bash
        run: |
          set -Eeuo pipefail
          main_sha='${{ steps.boundary.outputs.main_sha }}'
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Reviewed main SHA is unavailable.' >&2; exit 1; }
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${AUTHORIZED_CANDIDATE_BRANCH}" --jq '.object.sha')"
          [[ "$branch_sha" == "$main_sha" ]] || {
            echo "Governed candidate ref is not pinned to reviewed main. Expected $main_sha, found $branch_sha" >&2
            exit 1
          }
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/enable" >/dev/null
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}" --jq '.state')"
          [[ "$state" == 'active' ]] || { echo "Deployment workflow is not active: $state" >&2; exit 1; }
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "PROTECTED_UAT_EXTERNALLY_PINNED_RELEASE_REF=$AUTHORIZED_CANDIDATE_BRANCH"
          echo "PROTECTED_UAT_EXTERNALLY_PINNED_RELEASE_SHA=$main_sha"

      - name: Dispatch exact governed Protected Test deployment
        if: github.event.comment.body == 'DEPLOY PROTECTED UAT PR782 9494bdaf00c1e9d99144ca9ab9f11fbd29772a7d'
        id: dispatch
        shell: bash
        run: |
          set -Eeuo pipefail
          main_sha='${{ steps.pin.outputs.main_sha }}'
          gh workflow run "$DEPLOY_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
            --ref "$AUTHORIZED_CANDIDATE_BRANCH" \
            -f release_sha="$main_sha" \
            -f release_branch="$AUTHORIZED_CANDIDATE_BRANCH"

          run_id=''
          run_url=''
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$DEPLOY_WORKFLOW" \
              --branch "$AUTHORIZED_CANDIDATE_BRANCH" --event workflow_dispatch --limit 30 \
              --json databaseId,headSha,createdAt \
              --jq "map(select(.headSha == \"$main_sha\")) | sort_by(.createdAt) | last | .databaseId // empty")"
            if [[ -n "$run_id" ]]; then
              run_url="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
              break
            fi
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo 'The governed Protected Test deployment run was not created.' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "PROTECTED_UAT_DEPLOYMENT_RUN_ID=$run_id"
          echo "PROTECTED_UAT_DEPLOYMENT_RUN_URL=$run_url"

      - name: Watch Protected Test deployment through completion
        if: github.event.comment.body == 'DEPLOY PROTECTED UAT PR782 9494bdaf00c1e9d99144ca9ab9f11fbd29772a7d'
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run watch '${{ steps.dispatch.outputs.run_id }}' --repo "$GITHUB_REPOSITORY" --interval 10 --exit-status

      - name: Disable Protected Test deployment workflow after attempt
        if: always() && github.event.comment.body == 'DEPLOY PROTECTED UAT PR782 9494bdaf00c1e9d99144ca9ab9f11fbd29772a7d'
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/disable" >/dev/null
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}" --jq '.state')"
          [[ "$state" == 'disabled_manually' ]] || { echo "Deployment workflow did not return to disabled state: $state" >&2; exit 1; }
          echo "PROTECTED_UAT_DEPLOY_WORKFLOW_STATE=$state"

      - name: Record successful deployment evidence
        if: success() && github.event.comment.body == 'DEPLOY PROTECTED UAT PR782 9494bdaf00c1e9d99144ca9ab9f11fbd29772a7d'
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "Protected UAT deployment completed successfully.\n\n- Reviewed Celar AI release source: \`$EXPECTED_RELEASE_SOURCE_SHA\`\n- Deployed merged main: \`${{ steps.pin.outputs.main_sha }}\`\n- Governed deployment run: ${{ steps.dispatch.outputs.run_url }}\n- Deployment workflow: returned to \`disabled_manually\`\n- Governed candidate ref restoration: pending external release-supervisor restoration\n- Production mutation: none"

      - name: Record failed deployment evidence
        if: failure() && github.event.comment.body == 'DEPLOY PROTECTED UAT PR782 9494bdaf00c1e9d99144ca9ab9f11fbd29772a7d'
        shell: bash
        run: |
          set +e
          run_url='${{ steps.dispatch.outputs.run_url }}'
          [[ -n "$run_url" ]] || run_url='Deployment run was not created.'
          gh pr comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "Protected UAT deployment failed or could not be dispatched.\n\n- Reviewed Celar AI release source: \`$EXPECTED_RELEASE_SOURCE_SHA\`\n- Attempted merged main: \`${{ steps.pin.outputs.main_sha }}\`\n- Evidence: $run_url\n- Deployment workflow disable was attempted automatically.\n- Governed candidate ref restoration: pending external release-supervisor restoration\n- Production mutation: none"

      - name: Record workflow-control evidence
        if: success() && github.event.comment.body != 'DEPLOY PROTECTED UAT PR782 9494bdaf00c1e9d99144ca9ab9f11fbd29772a7d'
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "Protected UAT deployment workflow control completed.\n\n- Reviewed release source: \`$EXPECTED_RELEASE_SOURCE_SHA\`\n- Workflow: \`$DEPLOY_WORKFLOW\`\n- Action: \`${{ steps.control.outputs.action }}\`\n- Verified state: \`${{ steps.control.outputs.state }}\`\n- Production mutation: none"
