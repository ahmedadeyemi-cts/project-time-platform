name: Finalize Successful Protected UAT for PR794

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: Internal durable cleanup mode
        required: true
        type: string
      source_run_id:
        description: Authorized source finalizer run
        required: true
        type: string
      source_run_attempt:
        description: Authorized source finalizer attempt
        required: true
        type: string
      source_head_sha:
        description: Exact main SHA of the source finalizer
        required: true
        type: string
      restore_workflow_ids:
        description: Exact comma-separated originally active shared-group owners
        required: false
        type: string

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Restore Protected-Test fences for finalizer {0}', inputs.source_run_id)
      || format('Finalize Protected UAT from PR #{0}', github.event.issue.number) }}

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  restore_fence_watchdog:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'restore-protected-uat-fences'
    runs-on: ubuntu-24.04
    # Covers the 50-minute source/cancellation window, the 68.4-minute maximum
    # retry backoff for 36 enable-and-verify pairs, and API/inventory overhead.
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
      RESTORE_WORKFLOW_IDS: ${{ inputs.restore_workflow_ids }}
      DEPLOY_WORKFLOW_ID: '315562561'
      DEPLOY_WORKFLOW_PATH: .github/workflows/projectpulse-deploy-test.yml
    steps:
      - name: Check out exact current main for durable fence restoration
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Arm durable fence restoration watchdog
        id: arm
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ && "$SOURCE_RUN_ATTEMPT" =~ ^[0-9]+$ && "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Invalid source-finalizer restoration identity.' >&2
            exit 1
          }
          actual_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$GITHUB_SHA" == "$actual_main" && "$SOURCE_HEAD_SHA" == "$actual_main" ]] || {
            echo 'Fence restoration watchdog is not pinned to exact current main.' >&2
            exit 1
          }
          current_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          source_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_RUN_ATTEMPT}")"
          current_workflow_id="$(jq -r '.workflow_id' <<<"$current_run_json")"
          jq -e --arg sha "$SOURCE_HEAD_SHA" --arg actor 'ahmedadeyemi-cts' --argjson id "$SOURCE_RUN_ID" --argjson attempt "$SOURCE_RUN_ATTEMPT" --argjson workflow "$current_workflow_id" '
            .id == $id and .run_attempt == $attempt and .workflow_id == $workflow
            and .event == "issue_comment" and .head_branch == "main" and .head_sha == $sha
            and .actor.login == $actor and (.status == "queued" or .status == "in_progress")
          ' <<<"$source_run_json" >/dev/null || {
            echo 'Fence restoration watchdog source run is not the exact active authorized finalizer.' >&2
            exit 1
          }

          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | while IFS= read -r -d '' workflow; do
                if grep -Eq '^  group:[[:space:]]*projectpulse-deploy-test[[:space:]]*$' "$workflow"; then
                  printf '%s\n' "${workflow#./}"
                fi
              done \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/watchdog-protected-test-workflows"
          jq -Rn '[inputs | select(length > 0)]' < "$RUNNER_TEMP/watchdog-protected-test-workflows" > "$RUNNER_TEMP/watchdog-protected-test-workflows.json"
          workflow_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100")"
          jq -c '[.[].workflows[]] | unique_by(.id)' <<<"$workflow_pages" > "$RUNNER_TEMP/watchdog-repository-workflows.json"
          jq --argjson protected "$(cat "$RUNNER_TEMP/watchdog-protected-test-workflows.json")" \
            'map(select(.path as $path | $protected | index($path)))' \
            "$RUNNER_TEMP/watchdog-repository-workflows.json" > "$RUNNER_TEMP/watchdog-protected-test-workflow-metadata.json"
          expected_workflow_count="$(jq -r 'length' "$RUNNER_TEMP/watchdog-protected-test-workflows.json")"
          actual_workflow_count="$(jq -r 'length' "$RUNNER_TEMP/watchdog-protected-test-workflow-metadata.json")"
          [[ "$expected_workflow_count" -gt 0 && "$actual_workflow_count" == "$expected_workflow_count" ]] || {
            echo "Watchdog shared-group inventory mismatch: expected=$expected_workflow_count actual=$actual_workflow_count" >&2
            exit 1
          }
          jq -e 'all(.[]; .state == "active" or .state == "disabled_manually" or .state == "disabled_inactivity")' \
            "$RUNNER_TEMP/watchdog-protected-test-workflow-metadata.json" >/dev/null
          jq -r --argjson deploy "$DEPLOY_WORKFLOW_ID" '.[] | select(.id != $deploy and .state == "active") | .id' \
            "$RUNNER_TEMP/watchdog-protected-test-workflow-metadata.json" | LC_ALL=C sort -n -u > "$RUNNER_TEMP/watchdog-expected-restore-workflow-ids"
          expected_restore_workflow_ids="$(paste -sd, "$RUNNER_TEMP/watchdog-expected-restore-workflow-ids")"
          [[ "$RESTORE_WORKFLOW_IDS" == "$expected_restore_workflow_ids" ]] || {
            echo 'Watchdog restoration set differs from the exact originally active shared-group owners.' >&2
            echo "expected=$expected_restore_workflow_ids actual=$RESTORE_WORKFLOW_IDS" >&2
            exit 1
          }
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')" == 'disabled_manually' ]]
          echo "DURABLE_PROTECTED_UAT_FENCE_WATCHDOG=armed source_run=$SOURCE_RUN_ID owners=$actual_workflow_count"

      - name: Restore Protected-Test fences after source finalizer terminates
        if: always() && steps.arm.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          gh_api_retry() {
            local retry output
            for retry in $(seq 1 12); do
              if output="$(gh api "$@" 2>&1)"; then
                printf '%s' "$output"
                return 0
              fi
              echo "GitHub API attempt $retry/12 failed; retrying restoration-critical operation." >&2
              sleep "$((retry < 6 ? retry : 6))"
            done
            echo "$output" >&2
            return 1
          }
          source_terminal=false
          source_authorization_timeout_minutes=10
          source_finalizer_timeout_minutes=20
          source_cleanup_margin_minutes=10
          source_cancellation_budget_minutes=10
          watchdog_poll_interval_seconds=5
          watchdog_wait_deadline_epoch=$((
            $(date +%s)
            + (source_authorization_timeout_minutes + source_finalizer_timeout_minutes + source_cleanup_margin_minutes) * 60
          ))
          while (( $(date +%s) < watchdog_wait_deadline_epoch )); do
            source_run_json="$(gh_api_retry "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_RUN_ATTEMPT}")"
            [[ "$(jq -r '.run_attempt' <<<"$source_run_json")" == "$SOURCE_RUN_ATTEMPT" ]] || exit 1
            if [[ "$(jq -r '.status' <<<"$source_run_json")" == 'completed' ]]; then
              source_terminal=true
              break
            fi
            sleep "$watchdog_poll_interval_seconds"
          done
          if [[ "$source_terminal" != true ]]; then
            echo 'Source finalizer exceeded the durable fence deadline; cancelling it before restoration.' >&2
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/cancel" >/dev/null || true
            source_cancel_deadline_epoch=$(( $(date +%s) + source_cancellation_budget_minutes * 60 ))
            while (( $(date +%s) < source_cancel_deadline_epoch )); do
              source_run_json="$(gh_api_retry "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_RUN_ATTEMPT}")"
              if [[ "$(jq -r '.status' <<<"$source_run_json")" == 'completed' ]]; then
                source_terminal=true
                break
              fi
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/force-cancel" >/dev/null || true
              sleep 2
            done
          fi
          [[ "$source_terminal" == true ]] || {
            echo 'Source finalizer is not terminal; watchdog refuses to reopen Protected-Test admissions.' >&2
            exit 1
          }

          workflow_state="$(gh_api_retry "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')"
          case "$workflow_state" in
            active)
              gh_api_retry --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}/disable" >/dev/null
              ;;
            disabled_manually)
              ;;
            *)
              echo "Unexpected deployment workflow state during watchdog restoration: $workflow_state" >&2
              exit 1
              ;;
          esac
          restored_count=0
          IFS=',' read -r -a workflow_ids <<<"$RESTORE_WORKFLOW_IDS"
          for workflow_id in "${workflow_ids[@]}"; do
            [[ -n "$workflow_id" ]] || continue
            [[ "$workflow_id" =~ ^[0-9]+$ && "$workflow_id" != "$DEPLOY_WORKFLOW_ID" ]] || exit 1
            jq -e --argjson id "$workflow_id" 'any(.[]; .id == $id)' "$RUNNER_TEMP/watchdog-protected-test-workflow-metadata.json" >/dev/null
            gh_api_retry --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/enable" >/dev/null
            restored_count=$((restored_count + 1))
          done
          for workflow_id in "${workflow_ids[@]}"; do
            [[ -n "$workflow_id" ]] || continue
            [[ "$(gh_api_retry "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}" --jq '.state')" == 'active' ]] || {
              echo "Durable watchdog failed to restore shared-group workflow $workflow_id." >&2
              exit 1
            }
          done
          [[ "$(gh_api_retry "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')" == 'disabled_manually' ]]
          source_run_json="$(gh_api_retry "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_RUN_ATTEMPT}")"
          source_status="$(jq -r '.status' <<<"$source_run_json")"
          source_conclusion="$(jq -r '.conclusion // "unavailable"' <<<"$source_run_json")"
          source_url="$(jq -r '.html_url' <<<"$source_run_json")"
          watchdog_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh pr comment 794 --repo "$GITHUB_REPOSITORY" --body "Protected-Test admission-fence cleanup completed by the independently armed watchdog.\n\n- Source finalizer: $source_url (status \`$source_status\`, conclusion \`$source_conclusion\`)\n- Watchdog: $watchdog_url\n- Originally active shared-group workflows restored: \`$restored_count\`\n- Protected-Test deployment workflow: \`disabled_manually\`\n- Atomic finalization evidence, when present, was recorded before admissions reopened\n- Production mutation: none\n- Module 025 mutation: none"
          echo "FINALIZED_PROTECTED_UAT_SHARED_GROUP_FENCES_RESTORED=$restored_count"
          echo "DURABLE_PROTECTED_UAT_FENCE_WATCHDOG=completed source_terminal=$source_terminal"

  authorize_ghost_retirement:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 794 &&
      github.actor == 'ahmedadeyemi-cts' &&
      github.event.comment.body == 'FINALIZE PROTECTED UAT RUN 33666500248 RETIRE RUN 33654881418 SHA 2e257966dd51eab8d9f6431cf9b8fbded7ae458a'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: protected-uat-pr794-merged-main-relaunch
      cancel-in-progress: false
    outputs:
      exact_ghost_only: ${{ steps.preflight.outputs.exact_ghost_only }}
      restore_workflow_ids: ${{ steps.preflight.outputs.restore_workflow_ids }}
      watchdog_run_id: ${{ steps.preflight.outputs.watchdog_run_id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_WORKFLOW_ID: '315562561'
      DEPLOY_WORKFLOW_PATH: .github/workflows/projectpulse-deploy-test.yml
      RETIRED_RUN_ID: '33654881418'
      RETIRED_RUN_ATTEMPT: '1'
      RETIRED_RUN_CREATED_AT: '2026-09-02T16:26:03Z'
      RETIRED_RELEASE_SHA: 3d02b4cb62683b96554186f9d3a782fc1f21ca54
      RETIRED_RELEASE_BRANCH: fix/shared-project-document-planning-20260819
    steps:
      - name: Check out exact current main for concurrency inventory
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Authorize only the exact pending ghost for concurrency retirement
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$GITHUB_SHA" == "$actual_main" ]] || { echo 'Retirement preflight is not on exact current main.' >&2; exit 1; }
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')" == 'disabled_manually' ]] || {
            echo 'Protected-Test deployment workflow is not disabled.' >&2
            exit 1
          }
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RETIRED_RELEASE_BRANCH}" --jq '.object.sha')"
          [[ "$branch_sha" == "$RETIRED_RELEASE_SHA" ]] || { echo 'Legacy candidate changed.' >&2; exit 1; }

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}")"
          jq -e --arg path "$DEPLOY_WORKFLOW_PATH" --arg sha "$RETIRED_RELEASE_SHA" --arg branch "$RETIRED_RELEASE_BRANCH" --arg created "$RETIRED_RUN_CREATED_AT" --argjson id "$RETIRED_RUN_ID" --argjson attempt "$RETIRED_RUN_ATTEMPT" --argjson workflow "$DEPLOY_WORKFLOW_ID" '
            .id == $id and .run_attempt == $attempt and .workflow_id == $workflow and .path == $path
            and .event == "workflow_dispatch" and .head_branch == $branch and .head_sha == $sha and .created_at == $created
            and .status == "queued" and .conclusion == null
          ' <<<"$run_json" >/dev/null || { echo 'Ghost run identity mismatch before concurrency retirement.' >&2; exit 1; }
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}/jobs?filter=all&per_page=100" --jq '.total_count')" == '0' ]] || {
            echo 'Ghost materialized a job before concurrency retirement.' >&2
            exit 1
          }

          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | while IFS= read -r -d '' workflow; do
                if grep -Eq '^  group:[[:space:]]*projectpulse-deploy-test[[:space:]]*$' "$workflow"; then
                  printf '%s\n' "${workflow#./}"
                fi
              done \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/protected-test-workflows"
          grep -Fxq "$DEPLOY_WORKFLOW_PATH" "$RUNNER_TEMP/protected-test-workflows" || {
            echo 'Protected-Test deployment workflow was absent from the concurrency inventory.' >&2
            exit 1
          }
          jq -Rn '[inputs | select(length > 0)]' < "$RUNNER_TEMP/protected-test-workflows" > "$RUNNER_TEMP/protected-test-workflows.json"

          workflow_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100")"
          jq -c '[.[].workflows[]] | unique_by(.id)' <<<"$workflow_pages" > "$RUNNER_TEMP/repository-workflows.json"
          jq --argjson protected "$(cat "$RUNNER_TEMP/protected-test-workflows.json")" \
            'map(select(.path as $path | $protected | index($path)))' \
            "$RUNNER_TEMP/repository-workflows.json" > "$RUNNER_TEMP/protected-test-workflow-metadata.json"
          expected_workflow_count="$(jq -r 'length' "$RUNNER_TEMP/protected-test-workflows.json")"
          actual_workflow_count="$(jq -r 'length' "$RUNNER_TEMP/protected-test-workflow-metadata.json")"
          [[ "$expected_workflow_count" -gt 0 && "$actual_workflow_count" == "$expected_workflow_count" ]] || {
            echo "Shared-group workflow inventory mismatch before fencing: expected=$expected_workflow_count actual=$actual_workflow_count" >&2
            exit 1
          }

          : > "$RUNNER_TEMP/restore-workflow-ids"
          while IFS=$'\t' read -r workflow_id workflow_state workflow_path; do
            case "$workflow_state" in
              active)
                [[ "$workflow_id" != "$DEPLOY_WORKFLOW_ID" ]] || {
                  echo 'Protected-Test deployment workflow unexpectedly became active before fencing.' >&2
                  exit 1
                }
                printf '%s\n' "$workflow_id" >> "$RUNNER_TEMP/restore-workflow-ids"
                ;;
              disabled_manually|disabled_inactivity)
                ;;
              *)
                echo "Unexpected shared-group workflow state before watchdog arming: id=$workflow_id path=$workflow_path state=$workflow_state" >&2
                exit 1
                ;;
            esac
          done < <(jq -r '.[] | [.id, .state, .path] | @tsv' "$RUNNER_TEMP/protected-test-workflow-metadata.json")
          LC_ALL=C sort -n -u "$RUNNER_TEMP/restore-workflow-ids" -o "$RUNNER_TEMP/restore-workflow-ids"
          restore_workflow_ids="$(paste -sd, "$RUNNER_TEMP/restore-workflow-ids")"

          current_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          finalizer_workflow_id="$(jq -r '.workflow_id' <<<"$current_run_json")"
          [[ "$finalizer_workflow_id" =~ ^[0-9]+$ ]]
          watchdog_title="Restore Protected-Test fences for finalizer ${GITHUB_RUN_ID}"
          watchdog_dispatch_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg ref main \
            --arg mode restore-protected-uat-fences \
            --arg source_run_id "$GITHUB_RUN_ID" \
            --arg source_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_head_sha "$GITHUB_SHA" \
            --arg restore_workflow_ids "$restore_workflow_ids" \
            '{ref: $ref, inputs: {mode: $mode, source_run_id: $source_run_id, source_run_attempt: $source_run_attempt, source_head_sha: $source_head_sha, restore_workflow_ids: $restore_workflow_ids}}' \
            > "$RUNNER_TEMP/watchdog-dispatch.json"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${finalizer_workflow_id}/dispatches" \
            --input "$RUNNER_TEMP/watchdog-dispatch.json" >/dev/null
          watchdog_run_id=''
          watchdog_armed=false
          for attempt in $(seq 1 90); do
            watchdog_runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${finalizer_workflow_id}/runs?event=workflow_dispatch&per_page=100")"
            watchdog_run_id="$(jq -r --arg title "$watchdog_title" --arg sha "$GITHUB_SHA" --arg dispatched "$watchdog_dispatch_at" '
              [.workflow_runs[] | select(.display_title == $title and .head_sha == $sha and .created_at >= $dispatched)]
              | sort_by(.created_at) | last | .id // empty
            ' <<<"$watchdog_runs_json")"
            if [[ "$watchdog_run_id" =~ ^[0-9]+$ ]]; then
              watchdog_jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${watchdog_run_id}/jobs?filter=latest&per_page=100")"
              if jq -e '([.jobs[].steps[]? | select(.name == "Arm durable fence restoration watchdog" and .status == "completed" and .conclusion == "success")] | length) == 1' <<<"$watchdog_jobs_json" >/dev/null; then
                watchdog_armed=true
                break
              fi
              watchdog_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${watchdog_run_id}")"
              if [[ "$(jq -r '.status' <<<"$watchdog_run_json")" == 'completed' ]]; then
                echo "Durable fence watchdog terminated before arming: run=$watchdog_run_id conclusion=$(jq -r '.conclusion' <<<"$watchdog_run_json")" >&2
                exit 1
              fi
            fi
            sleep 2
          done
          [[ "$watchdog_armed" == true ]] || {
            echo 'Durable fence watchdog did not arm before the admission fence deadline.' >&2
            exit 1
          }

          fence_handoff=false
          restore_fenced_workflows_on_exit() {
            local exit_code=$?
            [[ "$fence_handoff" == true ]] && return "$exit_code"
            set +e
            while IFS= read -r workflow_id; do
              [[ "$workflow_id" =~ ^[0-9]+$ ]] || continue
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/enable" >/dev/null
            done < "$RUNNER_TEMP/restore-workflow-ids"
            return "$exit_code"
          }
          trap restore_fenced_workflows_on_exit EXIT
          while IFS= read -r workflow_id; do
            workflow_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}" --jq '.state')"
            case "$workflow_state" in
              active)
                gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable" >/dev/null
                ;;
              disabled_manually)
                ;;
              *)
                echo "Unexpected originally-active workflow state during fencing: id=$workflow_id state=$workflow_state" >&2
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/restore-workflow-ids"
          while IFS= read -r workflow_id; do
            [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}" --jq '.state')" == 'disabled_manually' ]] || {
              echo "Failed to fence shared-group workflow $workflow_id." >&2
              exit 1
            }
          done < "$RUNNER_TEMP/restore-workflow-ids"
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')" == 'disabled_manually' ]]
          while IFS= read -r workflow_id; do
            [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}" --jq '.state')" == disabled_* ]] || {
              echo "Shared-group workflow $workflow_id remained open after atomic admission fencing." >&2
              exit 1
            }
          done < <(jq -r '.[].id' "$RUNNER_TEMP/protected-test-workflow-metadata.json")

          : > "$RUNNER_TEMP/active-runs.ndjson"
          for run_status in queued in_progress waiting requested pending; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=${run_status}&per_page=100" \
              --jq '.workflow_runs[]' >> "$RUNNER_TEMP/active-runs.ndjson"
          done
          if [[ -s "$RUNNER_TEMP/active-runs.ndjson" ]]; then
            jq -s 'unique_by(.id)' "$RUNNER_TEMP/active-runs.ndjson" > "$RUNNER_TEMP/active-runs.json"
          else
            printf '[]\n' > "$RUNNER_TEMP/active-runs.json"
          fi
          jq --argjson protected "$(cat "$RUNNER_TEMP/protected-test-workflows.json")" \
            'map(select(.path as $path | $protected | index($path)))' \
            "$RUNNER_TEMP/active-runs.json" > "$RUNNER_TEMP/active-protected-test-runs.json"
          jq -e --arg path "$DEPLOY_WORKFLOW_PATH" --arg sha "$RETIRED_RELEASE_SHA" --arg branch "$RETIRED_RELEASE_BRANCH" --arg created "$RETIRED_RUN_CREATED_AT" --argjson id "$RETIRED_RUN_ID" --argjson attempt "$RETIRED_RUN_ATTEMPT" --argjson workflow "$DEPLOY_WORKFLOW_ID" '
            length == 1
            and .[0].id == $id and .[0].run_attempt == $attempt and .[0].workflow_id == $workflow and .[0].path == $path
            and .[0].event == "workflow_dispatch" and .[0].head_branch == $branch and .[0].head_sha == $sha and .[0].created_at == $created
            and .[0].status == "queued" and .[0].conclusion == null
          ' "$RUNNER_TEMP/active-protected-test-runs.json" >/dev/null || {
            echo 'The exact ghost is not the sole active owner of the Protected-Test concurrency group.' >&2
            cat "$RUNNER_TEMP/active-protected-test-runs.json" >&2
            exit 1
          }
          echo 'exact_ghost_only=true' >> "$GITHUB_OUTPUT"
          echo "restore_workflow_ids=$restore_workflow_ids" >> "$GITHUB_OUTPUT"
          echo "watchdog_run_id=$watchdog_run_id" >> "$GITHUB_OUTPUT"
          fence_handoff=true
          echo "FINALIZED_PROTECTED_UAT_CONCURRENCY_PREFLIGHT=exact_ghost_only fenced=$actual_workflow_count watchdog=$watchdog_run_id"

  finalize:
    needs: authorize_ghost_retirement
    if: >-
      needs.authorize_ghost_retirement.result == 'success' &&
      needs.authorize_ghost_retirement.outputs.exact_ghost_only == 'true' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 794 &&
      github.actor == 'ahmedadeyemi-cts' &&
      github.event.comment.body == 'FINALIZE PROTECTED UAT RUN 33666500248 RETIRE RUN 33654881418 SHA 2e257966dd51eab8d9f6431cf9b8fbded7ae458a'
    concurrency:
      group: projectpulse-deploy-test
      queue: single
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_WORKFLOW_ID: '315562561'
      DEPLOY_WORKFLOW_PATH: .github/workflows/projectpulse-deploy-test.yml
      SUCCESSFUL_RUN_ID: '33666500248'
      SUCCESSFUL_RUN_ATTEMPT: '1'
      SUCCESSFUL_RUN_CREATED_AT: '2026-09-02T18:19:31Z'
      SUCCESSFUL_RELEASE_SHA: 2e257966dd51eab8d9f6431cf9b8fbded7ae458a
      SUCCESSFUL_ARTIFACT_NAME: systemwide-enterprise-reliability-test-evidence-33666500248-1
      RETIRED_RUN_ID: '33654881418'
      RETIRED_RUN_ATTEMPT: '1'
      RETIRED_RUN_CREATED_AT: '2026-09-02T16:26:03Z'
      RETIRED_RELEASE_SHA: 3d02b4cb62683b96554186f9d3a782fc1f21ca54
      RETIRED_RELEASE_BRANCH: fix/shared-project-document-planning-20260819
    steps:
      - name: Check out exact current main for post-lock inventory
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Revalidate every shared-group owner after concurrency acquisition
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$GITHUB_SHA" == "$actual_main" ]] || { echo 'Post-lock inventory is not on exact current main.' >&2; exit 1; }

          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | while IFS= read -r -d '' workflow; do
                if grep -Eq '^  group:[[:space:]]*projectpulse-deploy-test[[:space:]]*$' "$workflow"; then
                  printf '%s\n' "${workflow#./}"
                fi
              done \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/protected-test-workflows"
          jq -Rn '[inputs | select(length > 0)]' < "$RUNNER_TEMP/protected-test-workflows" > "$RUNNER_TEMP/protected-test-workflows.json"

          workflow_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100")"
          jq -c '[.[].workflows[]] | unique_by(.id)' <<<"$workflow_pages" > "$RUNNER_TEMP/repository-workflows.json"
          jq --argjson protected "$(cat "$RUNNER_TEMP/protected-test-workflows.json")" \
            'map(select(.path as $path | $protected | index($path)))' \
            "$RUNNER_TEMP/repository-workflows.json" > "$RUNNER_TEMP/protected-test-workflow-metadata.json"
          expected_workflow_count="$(jq -r 'length' "$RUNNER_TEMP/protected-test-workflows.json")"
          actual_workflow_count="$(jq -r 'length' "$RUNNER_TEMP/protected-test-workflow-metadata.json")"
          [[ "$expected_workflow_count" -gt 0 && "$actual_workflow_count" == "$expected_workflow_count" ]] || {
            echo "Shared-group workflow inventory mismatch: expected=$expected_workflow_count actual=$actual_workflow_count" >&2
            exit 1
          }
          jq -e 'all(.[]; (.state | startswith("disabled_")))' "$RUNNER_TEMP/protected-test-workflow-metadata.json" >/dev/null || {
            echo 'One or more shared-group workflows escaped the preflight admission fence.' >&2
            jq '[.[] | select((.state | startswith("disabled_")) | not) | {id,path,state}]' "$RUNNER_TEMP/protected-test-workflow-metadata.json" >&2
            exit 1
          }

          : > "$RUNNER_TEMP/shared-group-runs.ndjson"
          while IFS= read -r workflow_id; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
              --jq '.workflow_runs[]' >> "$RUNNER_TEMP/shared-group-runs.ndjson"
          done < <(jq -r '.[].id' "$RUNNER_TEMP/protected-test-workflow-metadata.json")
          if [[ -s "$RUNNER_TEMP/shared-group-runs.ndjson" ]]; then
            jq -s 'unique_by(.id)' "$RUNNER_TEMP/shared-group-runs.ndjson" > "$RUNNER_TEMP/shared-group-runs.json"
          else
            printf '[]\n' > "$RUNNER_TEMP/shared-group-runs.json"
          fi
          jq -e --arg created "$SUCCESSFUL_RUN_CREATED_AT" --argjson success "$SUCCESSFUL_RUN_ID" --argjson retired "$RETIRED_RUN_ID" '
            ([.[] | select(.id != $success and .id != $retired and (
              .created_at >= $created or ((.run_started_at // .created_at) >= $created)
            ))] | length) == 0
            and ([.[] | select(.status != "completed" and .id != $retired)] | length) == 0
          ' "$RUNNER_TEMP/shared-group-runs.json" >/dev/null || {
            echo 'Another shared-group Protected-Test workflow ran or remained active after the successful UAT.' >&2
            jq --arg created "$SUCCESSFUL_RUN_CREATED_AT" --argjson success "$SUCCESSFUL_RUN_ID" --argjson retired "$RETIRED_RUN_ID" \
              '[.[] | select((.status != "completed" and .id != $retired) or (.id != $success and .id != $retired and (.created_at >= $created or ((.run_started_at // .created_at) >= $created)))) | {id,path,status,conclusion,created_at,run_started_at,run_attempt}]' \
              "$RUNNER_TEMP/shared-group-runs.json" >&2
            exit 1
          }
          echo 'FINALIZED_PROTECTED_UAT_POST_LOCK_SHARED_GROUP=exact_success_and_ghost_only'

      - name: Seal workflow and verify exact successful UAT evidence
        id: evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')"
          case "$workflow_state" in
            active)
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}/disable" >/dev/null
              ;;
            disabled_manually)
              ;;
            *)
              echo "Unexpected deployment workflow state before finalization: $workflow_state" >&2
              exit 1
              ;;
          esac
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')" == 'disabled_manually' ]]

          actual_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$GITHUB_SHA" == "$actual_main" ]] || { echo 'Finalizer is not on exact current main.' >&2; exit 1; }
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SUCCESSFUL_RELEASE_SHA}...${actual_main}")"
          [[ "$(jq -r '.status' <<<"$comparison")" == 'ahead' ]] || { echo 'Successful runtime is not an ancestor of main.' >&2; exit 1; }
          jq -r '.files[].filename' <<<"$comparison" | LC_ALL=C sort -u > "$RUNNER_TEMP/changed-files"
          cat > "$RUNNER_TEMP/allowed-files" <<'FILES'
          .github/workflows/projectpulse-release-test-control-ci-reregistered.yml
          .github/workflows/projectpulse-release-test-control-ci.yml
          .github/workflows/protected-uat-celar-ai-pr782-workflow-control.yml
          FILES
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/allowed-files"
          LC_ALL=C sort -u "$RUNNER_TEMP/allowed-files" -o "$RUNNER_TEMP/allowed-files"
          cmp -s "$RUNNER_TEMP/allowed-files" "$RUNNER_TEMP/changed-files" || {
            echo 'Unexpected runtime drift exists after the successful release.' >&2
            diff -u "$RUNNER_TEMP/allowed-files" "$RUNNER_TEMP/changed-files" >&2 || true
            exit 1
          }

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SUCCESSFUL_RUN_ID}")"
          jq -e --arg path "$DEPLOY_WORKFLOW_PATH" --arg sha "$SUCCESSFUL_RELEASE_SHA" --arg created "$SUCCESSFUL_RUN_CREATED_AT" --argjson id "$SUCCESSFUL_RUN_ID" --argjson attempt "$SUCCESSFUL_RUN_ATTEMPT" --argjson workflow "$DEPLOY_WORKFLOW_ID" '
            .id == $id and .run_attempt == $attempt and .workflow_id == $workflow and .path == $path
            and .event == "push" and .head_branch == "main" and .head_sha == $sha and .created_at == $created
            and .status == "completed" and .conclusion == "success"
          ' <<<"$run_json" >/dev/null || { echo 'Successful run identity mismatch.' >&2; exit 1; }

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SUCCESSFUL_RUN_ID}/jobs?filter=latest&per_page=100")"
          jq -e '
            .total_count == 1 and .jobs[0].name == "Validate, migrate, deploy, and verify protected Test"
            and .jobs[0].status == "completed" and .jobs[0].conclusion == "success"
          ' <<<"$jobs_json" >/dev/null || { echo 'Successful job identity mismatch.' >&2; exit 1; }
          required_steps=(
            'Guard exact source and validate release'
            'Sign in to protected Test subscription'
            'Snapshot protected Test and preserve rollback contract'
            'Build immutable API, web, and migration images'
            'Apply and verify Migrations 086, 088, 093, 094, 095, 096, and 097 inside Test private network'
            'Deploy immutable Test API image'
            'Deploy immutable Test web image'
            'Run protected-Test authenticated functional UAT'
            'Run protected-Test assigned-work visibility UAT'
            'Run protected-Test utilization role-scoping UAT'
            'Upload protected-Test deployment evidence'
            'Publish protected-Test release summary'
          )
          for step_name in "${required_steps[@]}"; do
            jq -e --arg name "$step_name" '([.jobs[0].steps[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length) == 1' <<<"$jobs_json" >/dev/null || {
              echo "Missing successful step: $step_name" >&2
              exit 1
            }
          done
          jq -e '([.jobs[0].steps[] | select(.name == "Restore exact prior Test images after application failure" and .conclusion == "skipped")] | length) == 1' <<<"$jobs_json" >/dev/null

          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SUCCESSFUL_RUN_ID}/artifacts?per_page=100")"
          jq -e --arg name "$SUCCESSFUL_ARTIFACT_NAME" --arg sha "$SUCCESSFUL_RELEASE_SHA" --argjson id "$SUCCESSFUL_RUN_ID" '
            .total_count == 1 and ([.artifacts[] | select(
              .name == $name and .expired == false and .size_in_bytes > 0 and (.digest | startswith("sha256:"))
              and .workflow_run.id == $id and .workflow_run.head_sha == $sha
            )] | length) == 1
          ' <<<"$artifacts_json" >/dev/null || { echo 'Evidence artifact mismatch.' >&2; exit 1; }
          run_url="$(jq -r '.html_url' <<<"$run_json")"
          artifact_id="$(jq -r '.artifacts[0].id' <<<"$artifacts_json")"
          artifact_digest="$(jq -r '.artifacts[0].digest' <<<"$artifacts_json")"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "FINALIZED_PROTECTED_UAT_RUN_ID=$SUCCESSFUL_RUN_ID"
          echo "FINALIZED_PROTECTED_UAT_ARTIFACT_DIGEST=$artifact_digest"

      - name: Force-retire exact zero-job ghost deployment
        id: retired
        shell: bash
        run: |
          set -Eeuo pipefail
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RETIRED_RELEASE_BRANCH}" --jq '.object.sha')"
          [[ "$branch_sha" == "$RETIRED_RELEASE_SHA" ]] || { echo 'Legacy candidate changed.' >&2; exit 1; }
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}")"
          jq -e --arg path "$DEPLOY_WORKFLOW_PATH" --arg sha "$RETIRED_RELEASE_SHA" --arg branch "$RETIRED_RELEASE_BRANCH" --arg created "$RETIRED_RUN_CREATED_AT" --argjson id "$RETIRED_RUN_ID" --argjson attempt "$RETIRED_RUN_ATTEMPT" --argjson workflow "$DEPLOY_WORKFLOW_ID" '
            .id == $id and .run_attempt == $attempt and .workflow_id == $workflow and .path == $path
            and .event == "workflow_dispatch" and .head_branch == $branch and .head_sha == $sha and .created_at == $created
          ' <<<"$run_json" >/dev/null || { echo 'Ghost run identity mismatch.' >&2; exit 1; }
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}/jobs?filter=latest&per_page=100" --jq '.total_count')" == '0' ]]
          cancelled=false
          status="$(jq -r '.status' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
          if [[ "$status" == 'completed' && "$conclusion" == 'cancelled' ]]; then
            cancelled=true
          elif [[ "$status" == 'queued' && -z "$conclusion" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}/cancel" >/dev/null || true
            for attempt in $(seq 1 60); do
              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}")"
              [[ "$(jq -r '.run_attempt' <<<"$run_json")" == "$RETIRED_RUN_ATTEMPT" ]] || exit 1
              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
              if [[ "$status" == 'completed' ]]; then
                [[ "$conclusion" == 'cancelled' ]] || exit 1
                cancelled=true
                break
              fi
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}/force-cancel" >/dev/null || true
              sleep 2
            done
          else
            echo "Ghost run entered an unexpected terminal state: status=$status conclusion=${conclusion:-null}" >&2
            exit 1
          fi
          [[ "$cancelled" == true ]] || { echo 'Ghost cancellation was not verified.' >&2; exit 1; }
          post_cancel_jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETIRED_RUN_ID}/jobs?filter=all&per_page=100")"
          jq -e '.total_count == 0 and (.jobs | length) == 0' <<<"$post_cancel_jobs_json" >/dev/null || {
            echo 'Ghost materialized one or more jobs during cancellation; finalization failed closed.' >&2
            exit 1
          }
          retired_url="$(jq -r '.html_url' <<<"$run_json")"
          echo "retired_url=$retired_url" >> "$GITHUB_OUTPUT"
          echo 'FINALIZED_PROTECTED_UAT_GHOST_CONCLUSION=cancelled'

      - name: Verify sealed exhaustive deployment ledger
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')" == 'disabled_manually' ]]
          : > "$RUNNER_TEMP/shared-group-runs.ndjson"
          while IFS= read -r workflow_id; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
              --jq '.workflow_runs[]' >> "$RUNNER_TEMP/shared-group-runs.ndjson"
          done < <(jq -r '.[].id' "$RUNNER_TEMP/protected-test-workflow-metadata.json")
          jq -s 'unique_by(.id)' "$RUNNER_TEMP/shared-group-runs.ndjson" > "$RUNNER_TEMP/shared-group-runs.json"
          runs_json="$(jq -c '{workflow_runs: .}' "$RUNNER_TEMP/shared-group-runs.json")"
          [[ "$(jq -r '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs_json")" == '0' ]]
          [[ "$(jq -r --arg created "$SUCCESSFUL_RUN_CREATED_AT" --argjson success "$SUCCESSFUL_RUN_ID" --argjson retired "$RETIRED_RUN_ID" '[.workflow_runs[] | select(.id != $success and .id != $retired and (.created_at >= $created or ((.run_started_at // .created_at) >= $created)))] | length' <<<"$runs_json")" == '0' ]]
          jq -e --argjson success "$SUCCESSFUL_RUN_ID" --argjson retired "$RETIRED_RUN_ID" '
            ([.workflow_runs[] | select(.id == $success and .run_attempt == 1 and .status == "completed" and .conclusion == "success")] | length) == 1
            and ([.workflow_runs[] | select(.id == $retired and .run_attempt == 1 and .status == "completed" and .conclusion == "cancelled")] | length) == 1
          ' <<<"$runs_json" >/dev/null
          echo 'FINALIZED_PROTECTED_UAT_WORKFLOW_STATE=disabled_manually'
          echo 'FINALIZED_PROTECTED_UAT_SHARED_GROUP_POST_SUCCESS_DEPLOYMENTS=none'
          echo 'FINALIZED_PROTECTED_UAT_POST_SUCCESS_DEPLOYMENTS=none'

      - name: Reassert disabled Protected-Test workflow
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')"
          case "$workflow_state" in
            active)
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}/disable" >/dev/null
              ;;
            disabled_manually)
              ;;
            *)
              echo "Unexpected deployment workflow state during final sealing: $workflow_state" >&2
              exit 1
              ;;
          esac
          unexpected_active_seen=false
          for sweep in $(seq 1 5); do
            pages_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}/runs?per_page=100")"
            runs_json="$(jq -c '{workflow_runs: [.[].workflow_runs[]]}' <<<"$pages_json")"
            mapfile -t active_run_ids < <(jq -r '.workflow_runs[] | select(.status != "completed") | .id' <<<"$runs_json")
            if (( ${#active_run_ids[@]} == 0 )); then
              break
            fi
            unexpected_active_seen=true
            for active_run_id in "${active_run_ids[@]}"; do
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${active_run_id}/cancel" >/dev/null || true
              terminal=false
              for attempt in $(seq 1 60); do
                active_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${active_run_id}")"
                if [[ "$(jq -r '.status' <<<"$active_run_json")" == 'completed' ]]; then
                  terminal=true
                  break
                fi
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${active_run_id}/force-cancel" >/dev/null || true
                sleep 2
              done
              [[ "$terminal" == true ]] || { echo "Active deployment $active_run_id did not reach a terminal state." >&2; exit 1; }
            done
          done
          pages_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}/runs?per_page=100")"
          runs_json="$(jq -c '{workflow_runs: [.[].workflow_runs[]]}' <<<"$pages_json")"
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state')" == 'disabled_manually' ]]
          [[ "$(jq -r '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs_json")" == '0' ]]
          [[ "$(jq -r --arg created "$SUCCESSFUL_RUN_CREATED_AT" --argjson id "$SUCCESSFUL_RUN_ID" '[.workflow_runs[] | select(.created_at >= $created and .id != $id)] | length' <<<"$runs_json")" == '0' ]]
          [[ "$(jq -r --arg created "$SUCCESSFUL_RUN_CREATED_AT" --argjson success "$SUCCESSFUL_RUN_ID" '[.workflow_runs[] | select(.id != $success and ((.run_started_at // .created_at) >= $created))] | length' <<<"$runs_json")" == '0' ]]
          jq -e --argjson success "$SUCCESSFUL_RUN_ID" --argjson retired "$RETIRED_RUN_ID" '
            ([.workflow_runs[] | select(.id == $success and .run_attempt == 1 and .status == "completed" and .conclusion == "success")] | length) == 1
            and ([.workflow_runs[] | select(.id == $retired and .run_attempt == 1 and .status == "completed" and .conclusion == "cancelled")] | length) == 1
          ' <<<"$runs_json" >/dev/null
          if [[ "$unexpected_active_seen" == true ]]; then
            echo 'Unexpected active deployments were terminally cancelled; finalization refuses success.' >&2
            exit 1
          fi
          echo 'FINALIZED_PROTECTED_UAT_FINAL_WORKFLOW_STATE=disabled_manually'
          echo 'FINALIZED_PROTECTED_UAT_FINAL_ACTIVE_DEPLOYMENTS=none'

      - name: Reinventory current main and record atomic success while fenced
        id: atomic_ledger
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_main_start="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$actual_main_start" == "$GITHUB_SHA" ]] || {
            echo "Main advanced before atomic success reporting: expected=$GITHUB_SHA actual=$actual_main_start" >&2
            exit 1
          }
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | while IFS= read -r -d '' workflow; do
                if grep -Eq '^  group:[[:space:]]*projectpulse-deploy-test[[:space:]]*$' "$workflow"; then
                  printf '%s\n' "${workflow#./}"
                fi
              done \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/protected-test-workflows-final"
          jq -Rn '[inputs | select(length > 0)]' < "$RUNNER_TEMP/protected-test-workflows-final" > "$RUNNER_TEMP/protected-test-workflows-final.json"
          final_workflow_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100")"
          jq -c '[.[].workflows[]] | unique_by(.id)' <<<"$final_workflow_pages" > "$RUNNER_TEMP/repository-workflows-final.json"
          jq --argjson protected "$(cat "$RUNNER_TEMP/protected-test-workflows-final.json")" \
            'map(select(.path as $path | $protected | index($path)))' \
            "$RUNNER_TEMP/repository-workflows-final.json" > "$RUNNER_TEMP/protected-test-workflow-metadata-final.json"
          final_expected_workflow_count="$(jq -r 'length' "$RUNNER_TEMP/protected-test-workflows-final.json")"
          final_actual_workflow_count="$(jq -r 'length' "$RUNNER_TEMP/protected-test-workflow-metadata-final.json")"
          [[ "$final_expected_workflow_count" -gt 0 && "$final_actual_workflow_count" == "$final_expected_workflow_count" ]] || {
            echo "Final current-main shared-group inventory mismatch: expected=$final_expected_workflow_count actual=$final_actual_workflow_count" >&2
            exit 1
          }
          jq -S '[.[] | {id,path}] | sort_by(.id)' "$RUNNER_TEMP/protected-test-workflow-metadata.json" > "$RUNNER_TEMP/protected-test-owner-identities-initial.json"
          jq -S '[.[] | {id,path}] | sort_by(.id)' "$RUNNER_TEMP/protected-test-workflow-metadata-final.json" > "$RUNNER_TEMP/protected-test-owner-identities-final.json"
          cmp -s "$RUNNER_TEMP/protected-test-owner-identities-initial.json" "$RUNNER_TEMP/protected-test-owner-identities-final.json" || {
            echo 'Current-main shared-group owner inventory changed during finalization.' >&2
            diff -u "$RUNNER_TEMP/protected-test-owner-identities-initial.json" "$RUNNER_TEMP/protected-test-owner-identities-final.json" >&2 || true
            exit 1
          }
          jq -e 'all(.[]; (.state | startswith("disabled_")))' "$RUNNER_TEMP/protected-test-workflow-metadata-final.json" >/dev/null || {
            echo 'A freshly reinventoried shared-group owner escaped the admission fence.' >&2
            exit 1
          }
          while IFS= read -r workflow_id; do
            workflow_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}" --jq '.state')"
            [[ "$workflow_state" == disabled_* ]] || {
              echo "Shared-group workflow $workflow_id escaped the admission fence before final ledger verification." >&2
              exit 1
            }
          done < <(jq -r '.[].id' "$RUNNER_TEMP/protected-test-workflow-metadata-final.json")
          : > "$RUNNER_TEMP/shared-group-runs-final.ndjson"
          while IFS= read -r workflow_id; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
              --jq '.workflow_runs[]' >> "$RUNNER_TEMP/shared-group-runs-final.ndjson"
          done < <(jq -r '.[].id' "$RUNNER_TEMP/protected-test-workflow-metadata-final.json")
          jq -s 'unique_by(.id)' "$RUNNER_TEMP/shared-group-runs-final.ndjson" > "$RUNNER_TEMP/shared-group-runs-final.json"
          jq -e --arg created "$SUCCESSFUL_RUN_CREATED_AT" --argjson success "$SUCCESSFUL_RUN_ID" --argjson retired "$RETIRED_RUN_ID" '
            ([.[] | select(.status != "completed")] | length) == 0
            and ([.[] | select(.id != $success and .id != $retired and (
              .created_at >= $created or ((.run_started_at // .created_at) >= $created)
            ))] | length) == 0
            and ([.[] | select(.id == $success and .run_attempt == 1 and .status == "completed" and .conclusion == "success")] | length) == 1
            and ([.[] | select(.id == $retired and .run_attempt == 1 and .status == "completed" and .conclusion == "cancelled")] | length) == 1
          ' "$RUNNER_TEMP/shared-group-runs-final.json" >/dev/null || {
            echo 'Shared-group Protected-Test ledger changed immediately before success reporting.' >&2
            exit 1
          }
          while IFS= read -r workflow_id; do
            [[ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}" --jq '.state')" == disabled_* ]] || {
              echo "Fresh shared-group owner $workflow_id reopened before atomic success reporting." >&2
              exit 1
            }
          done < <(jq -r '.[].id' "$RUNNER_TEMP/protected-test-workflow-metadata-final.json")
          actual_main_end="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$actual_main_end" == "$GITHUB_SHA" ]] || {
            echo "Main advanced during atomic success verification: expected=$GITHUB_SHA actual=$actual_main_end" >&2
            exit 1
          }
          shared_owner_count="$(jq -r 'length' "$RUNNER_TEMP/protected-test-workflow-metadata-final.json")"
          echo "shared_owner_count=$shared_owner_count" >> "$GITHUB_OUTPUT"
          echo "FINALIZED_PROTECTED_UAT_ATOMIC_FENCED_LEDGER=quiescent owners=$shared_owner_count"
          watchdog_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ needs.authorize_ghost_retirement.outputs.watchdog_run_id }}"
          gh pr comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "Protected-Test UAT evidence and zero-job ghost retirement were atomically sealed while every shared-group admission remained fenced.\n\n- Successful deployment: ${{ steps.evidence.outputs.run_url }}\n- Release SHA: \`$SUCCESSFUL_RELEASE_SHA\`\n- Evidence artifact: \`$SUCCESSFUL_ARTIFACT_NAME\` (ID ${{ steps.evidence.outputs.artifact_id }}, digest \`${{ steps.evidence.outputs.artifact_digest }}\`)\n- Module 001B assigned-work/live-reallocation UAT: passed\n- Utilization role-scoping UAT: passed\n- Retired zero-job ghost: ${{ steps.retired.outputs.retired_url }}\n- Deployment workflow: \`disabled_manually\`\n- Exact current main: \`$actual_main_end\`\n- Fresh atomic shared-group ledger owners verified: \`$shared_owner_count\`\n- Independently armed fence-restoration watchdog: $watchdog_url\n- Admission fences: held until this source finalizer reaches a terminal state; the watchdog then restores exactly the originally active owners\n- Legacy candidate ref restoration: pending\n- Production mutation: none\n- Module 025 mutation: none"

      - name: Record failed finalization evidence
        if: failure()
        shell: bash
        run: |
          set +e
          final_workflow_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}" --jq '.state' 2>/dev/null || true)"
          final_active_count="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW_ID}/runs?per_page=100" 2>/dev/null | jq -r '[.[].workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || true)"
          if [[ "$final_workflow_state" == 'disabled_manually' && "$final_active_count" == '0' ]]; then
            sealing_status='verified disabled_manually with zero active deployments'
          else
            sealing_status="NOT VERIFIED (workflow state ${final_workflow_state:-unavailable}, active deployments ${final_active_count:-unavailable}); manual sealing required immediately; active-run cancellation required immediately"
          fi
          gh pr comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "Protected-Test UAT finalization failed.\n\n- Successful deployment under verification: \`$SUCCESSFUL_RUN_ID\`\n- Ghost under retirement: \`$RETIRED_RUN_ID\`\n- Deployment workflow sealing: $sealing_status\n- Production mutation: none\n- Module 025 mutation: none"
