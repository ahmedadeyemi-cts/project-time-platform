name: Patch PR 648 Release Validation Context

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/patch-pr648-release-validation-context.yml'

permissions:
  contents: write

concurrency:
  group: patch-pr648-release-validation-context
  cancel-in-progress: false

jobs:
  patch:
    name: Validate PR 630 from the pinned application release
    if: >-
      github.event.pull_request.number == 648 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/deploy-pr645-module001a-module013-test-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEAD_BRANCH: release/deploy-pr645-module001a-module013-test-20260811
      CONTROLLER: .github/workflows/deploy-pulse-current-main-654af0e-test.yml
      SELF: .github/workflows/patch-pr648-release-validation-context.yml
      TARGET_RELEASE_COMMIT: 654af0e469f1fba348f7f7dcbac0fde4c5346a59

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Correct validation context and remove this patch control
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == '${{ github.event.pull_request.head.sha }}' ]] || fail 'Checkout is not the exact PR head.'
          [[ "$(git rev-parse origin/main)" == "$TARGET_RELEASE_COMMIT" ]] || fail 'Main moved; refusing to patch an obsolete release controller.'
          test -f "$CONTROLLER"
          test -f "$SELF"

          python3 - <<'PY'
          import os
          from pathlib import Path

          controller = Path(os.environ['CONTROLLER'])
          source = controller.read_text(encoding='utf-8')
          old = '          node tests/validate-celar-ai-pr630-consolidated.mjs\n'
          new = (
              '          PR630_WORKTREE="$RUNNER_TEMP/pr630-release"\n'
              '          git worktree add --detach "$PR630_WORKTREE" "$TARGET_RELEASE_COMMIT"\n'
              '          (cd "$PR630_WORKTREE" && node tests/validate-celar-ai-pr630-consolidated.mjs)\n'
              '          git worktree remove "$PR630_WORKTREE" --force\n'
          )
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one PR 630 validation command in the PR job; found {source.count(old)}.')
          source = source.replace(old, new, 1)
          controller.write_text(source, encoding='utf-8')
          Path(os.environ['SELF']).unlink()
          PY

          grep -Fq 'git worktree add --detach "$PR630_WORKTREE" "$TARGET_RELEASE_COMMIT"' "$CONTROLLER"
          grep -Fq '(cd "$PR630_WORKTREE" && node tests/validate-celar-ai-pr630-consolidated.mjs)' "$CONTROLLER"
          grep -Fq '(cd release && node tests/validate-celar-ai-pr630-consolidated.mjs)' "$CONTROLLER"
          [[ ! -e "$SELF" ]] || fail 'Patch workflow did not remove itself.'

          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Validate PR 630 from pinned release context'
          git push origin "HEAD:${HEAD_BRANCH}"
