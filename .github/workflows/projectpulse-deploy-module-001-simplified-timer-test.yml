name: ProjectPulse Deploy Simplified Module Availability Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified simplified module availability commit
        required: true
        default: f4c76842f6803582895544f9eede473a70c13927
        type: string
      confirmation:
        description: Enter DEPLOY-SIMPLIFIED-MODULE-AVAILABILITY-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-simplified-module-availability-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded simplified module availability API and web test deployment
    environment: test
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_COMMIT: f4c76842f6803582895544f9eede473a70c13927
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact simplified module availability release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and exact release
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ github.ref }}' == 'refs/heads/main' ]] || { echo 'Dispatch this workflow from main.' >&2; exit 1; }
          [[ '${{ inputs.confirmation }}' == 'DEPLOY-SIMPLIFIED-MODULE-AVAILABILITY-TO-TEST' ]] || { echo 'Confirmation text does not match.' >&2; exit 1; }
          [[ '${{ inputs.release_commit }}' =~ ^[0-9a-f]{40}$ ]] || { echo 'release_commit must be a complete SHA.' >&2; exit 1; }
          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == '${{ github.sha }}' ]]
          [[ "$TARGET_COMMIT" == '${{ inputs.release_commit }}' ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || { echo 'Only the verified simplified module availability release may deploy.' >&2; exit 1; }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || { echo 'Release is not an ancestor of deployment controls.' >&2; exit 1; }

          OVERRIDES='release/src/backend/ProjectTime.Api/Modules/ModuleAvailabilityOverridesModule.cs'
          PROJECT='release/src/backend/ProjectTime.Api/ProjectTime.Api.csproj'
          DIRECTORY='release/src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx'
          CONTROLLER='release/src/frontend/project-time-web/src/ModuleAvailabilityController.jsx'
          CSS='release/src/frontend/project-time-web/src/module-availability.css'
          VALIDATOR='release/src/frontend/project-time-web/scripts/validate-module-availability.mjs'
          test -f "$OVERRIDES" -a -f "$PROJECT" -a -f "$DIRECTORY" -a -f "$CONTROLLER" -a -f "$CSS" -a -f "$VALIDATOR"
          grep -Fq '/api/module-availability/overrides' "$OVERRIDES"
          grep -Fq 'Only persisted overrides are returned; missing rows mean Enabled.' "$OVERRIDES"
          grep -Fq 'missingOverrideBehavior = "ENABLED"' "$OVERRIDES"
          grep -Fq 'app.MapModuleAvailabilityOverrideEndpoints();' "$PROJECT"
          grep -Fq "fetch('/api/module-availability/overrides'" "$DIRECTORY"
          grep -Fq "method: 'PUT'" "$DIRECTORY"
          grep -Fq 'Missing overrides default to Enabled' "$DIRECTORY"
          grep -Fq 'Toggle controls require SUPER_ADMINISTRATOR' "$DIRECTORY"
          grep -Fq "if (route === 'timesheet') return 'Timesheet'" "$DIRECTORY"
          grep -Fq 'Existing module cards remain available' "$DIRECTORY"
          grep -Fq "fetch('/api/module-availability/overrides'" "$CONTROLLER"
          grep -Fq 'clearAvailabilityNavigationState' "$CONTROLLER"
          ! grep -Fq 'createPortal' "$CONTROLLER"
          ! grep -Fq 'module-availability-governed' "$CONTROLLER"
          ! grep -Fq '.module-availability-governed > .modules-directory-grid' "$CSS"
          node "$VALIDATOR"
          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current API and web images
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          RAW_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          [[ -n "$RAW_API" && -n "$RAW_WEB" && "${API_MODE,,}" == single && "${WEB_MODE,,}" == single ]]
          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in "$registry"*@sha256:*) printf '%s\n' "$image"; return;; "$registry"*:*) ;; *) return 1;; esac
            relative="${image#"$registry"}"; repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }
          echo "old_api_image=$(resolve_digest "$RAW_API")" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$(resolve_digest "$RAW_WEB")" >> "$GITHUB_OUTPUT"

      - name: Build immutable simplified module availability API and web images
        id: build
        working-directory: release
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA='${{ steps.release.outputs.target_commit }}'
          API_REPO='project-health-dashboard-api'
          WEB_REPO='project-health-dashboard-web'
          API_DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$API_REPO:module-availability-simple-$SHA" deployment/containers/api/Dockerfile .)"
          WEB_DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$WEB_REPO:module-availability-simple-$SHA" deployment/containers/web/Dockerfile .)"
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$API_REPO@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$WEB_REPO@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy simplified module availability API image
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT='${{ steps.release.outputs.target_commit }}' \
            --revision-suffix "mavsapi-${GITHUB_RUN_ID}" --output none

      - name: Validate API health and protected availability routes
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          wait_status() {
            local method="$1" url="$2" payload="$3" expected="$4" status=''
            for attempt in $(seq 1 30); do
              if [[ "$method" == GET ]]; then
                status="$(curl -sS -o /tmp/response -w '%{http_code}' "$url" || true)"
              else
                status="$(curl -sS -X "$method" -H 'Content-Type: application/json' -d "$payload" -o /tmp/response -w '%{http_code}' "$url" || true)"
              fi
              [[ ",$expected," == *",$status,"* ]] && return 0
              sleep 10
            done
            echo "$method $url returned $status" >&2
            cat /tmp/response >&2 || true
            return 1
          }
          wait_status GET "$BASE/health" '' '200'
          wait_status GET "$BASE/api/version" '' '200'
          wait_status GET "$BASE/api/module-availability/overrides" '' '401,403'
          wait_status GET "$BASE/api/module-availability" '' '401,403'
          wait_status PUT "$BASE/api/module-availability/001" '{"isEnabled":true,"expectedRevision":0,"reason":"unauthenticated rollout probe"}' '401,403'

      - name: Deploy simplified module availability web image
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' --revision-suffix "mavsweb-${GITHUB_RUN_ID}" --output none

      - name: Validate served existing-directory controls and active images
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"; READY=false
          for attempt in $(seq 1 30); do
            BUSTER="mavs-${GITHUB_RUN_ID}-${attempt}"
            STATUS="$(curl -sSL -H 'Cache-Control: no-cache' -o /tmp/index.html -w '%{http_code}' "$BASE/?release_check=$BUSTER" || true)"
            JS="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/index.html | head -1)"
            if [[ "$STATUS" == 200 && -n "$JS" ]]; then
              case "$JS" in http*) JS_URL="$JS";; /*) JS_URL="$BASE$JS";; *) JS_URL="$BASE/$JS";; esac
              curl -sSL -H 'Cache-Control: no-cache' -o /tmp/app.js "$JS_URL?release_check=$BUSTER" || true
              : > /tmp/app.css
              while IFS= read -r CSS; do
                [[ -n "$CSS" ]] || continue
                case "$CSS" in http*) CSS_URL="$CSS";; /*) CSS_URL="$BASE$CSS";; *) CSS_URL="$BASE/$CSS";; esac
                curl -sSL -H 'Cache-Control: no-cache' "$CSS_URL?release_check=$BUSTER" >> /tmp/app.css || true
              done < <(grep -oE 'href="[^"]+\.css"' /tmp/index.html | sed -E 's/^href="|"$//g')
              if grep -Fq '/api/module-availability/overrides' /tmp/app.js \
                && grep -Fq 'Missing overrides default to Enabled' /tmp/app.js \
                && grep -Fq 'Toggle controls require SUPER_ADMINISTRATOR' /tmp/app.js \
                && grep -Fq 'Module availability controls' /tmp/app.js \
                && grep -Fq 'Existing module cards remain available' /tmp/app.js \
                && grep -Fq 'Timesheet' /tmp/app.js \
                && ! grep -Fq 'Module availability returned no module inventory' /tmp/app.js \
                && grep -Fq 'modules-directory-availability-bar' /tmp/app.css \
                && grep -Fq 'module-availability-switch' /tmp/app.css \
                && ! grep -Fq 'module-availability-governed' /tmp/app.css; then
                READY=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$READY" == true ]] || { echo 'Simplified module availability interface was not served.' >&2; exit 1; }
          ACTIVE_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          ACTIVE_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_API" == '${{ steps.build.outputs.api_image }}' && "$ACTIVE_WEB" == '${{ steps.build.outputs.web_image }}' ]]

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/simplified-module-availability-test.json <<JSON
          {"environment":"test","releaseCommit":"${{ steps.release.outputs.target_commit }}","workflowCommit":"${{ github.sha }}","runId":"${{ github.run_id }}","apiImage":"${{ steps.build.outputs.api_image }}","webImage":"${{ steps.build.outputs.web_image }}","previousApiImage":"${{ steps.before.outputs.old_api_image }}","previousWebImage":"${{ steps.before.outputs.old_web_image }}","migration042":"unchanged","database":"unchanged","moduleStates":"unchanged"}
          JSON

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simplified-module-availability-test-${{ github.run_id }}
          path: evidence/simplified-module-availability-test.json
          retention-days: 30

      - name: Roll back API and web images on failure
        if: ${{ failure() && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set +e
          if [[ '${{ steps.deploy_api.outputs.started }}' == 'true' ]]; then
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
              --image '${{ steps.before.outputs.old_api_image }}' --revision-suffix "mavsapi-rb-${GITHUB_RUN_ID}" --output none
          fi
          if [[ '${{ steps.deploy_web.outputs.started }}' == 'true' ]]; then
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
              --image '${{ steps.before.outputs.old_web_image }}' --revision-suffix "mavsweb-rb-${GITHUB_RUN_ID}" --output none
          fi
