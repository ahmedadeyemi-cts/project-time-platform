name: ProjectPulse Deploy Module Availability Result Fix API Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified module availability result-execution fix commit
        required: true
        default: 84190aa026ba67eec9966850d2710ff458b6a7a1
        type: string
      confirmation:
        description: Enter DEPLOY-MODULE-AVAILABILITY-RESULT-FIX-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-module-availability-result-fix-api-test
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Guarded module availability result fix API-only test deployment
    environment: test
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_COMMIT: 84190aa026ba67eec9966850d2710ff458b6a7a1
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact result-execution fix release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and exact result-execution fix
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ github.ref }}' == 'refs/heads/main' ]] || { echo 'Dispatch this workflow from main.' >&2; exit 1; }
          [[ '${{ inputs.confirmation }}' == 'DEPLOY-MODULE-AVAILABILITY-RESULT-FIX-TO-TEST' ]] || { echo 'Confirmation text does not match.' >&2; exit 1; }
          [[ '${{ inputs.release_commit }}' =~ ^[0-9a-f]{40}$ ]] || { echo 'release_commit must be a complete SHA.' >&2; exit 1; }
          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == '${{ github.sha }}' ]]
          [[ "$TARGET_COMMIT" == '${{ inputs.release_commit }}' ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || { echo 'Only the verified result-execution fix may deploy.' >&2; exit 1; }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || { echo 'Release is not an ancestor of deployment controls.' >&2; exit 1; }

          OVERRIDES='release/src/backend/ProjectTime.Api/Modules/ModuleAvailabilityOverridesModule.cs'
          VALIDATOR='release/src/frontend/project-time-web/scripts/validate-module-availability.mjs'
          test -f "$OVERRIDES" -a -f "$VALIDATOR"
          grep -Fq '(Func<HttpContext, Task<IResult>>)GetOverridesAsync' "$OVERRIDES"
          grep -Fq 'discard the returned IResult' "$OVERRIDES"
          ! grep -Fq 'app.MapGet("/api/module-availability/overrides", GetOverridesAsync);' "$OVERRIDES"
          node "$VALIDATOR"
          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current API image
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          [[ -n "$RAW_API" && "${API_MODE,,}" == single ]]
          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in "$registry"*@sha256:*) printf '%s\n' "$image"; return;; "$registry"*:*) ;; *) return 1;; esac
            relative="${image#"$registry"}"; repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }
          echo "old_api_image=$(resolve_digest "$RAW_API")" >> "$GITHUB_OUTPUT"

      - name: Build immutable module availability result fix API image
        id: build
        working-directory: release
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA='${{ steps.release.outputs.target_commit }}'
          API_REPO='project-health-dashboard-api'
          API_DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$API_REPO:module-availability-result-fix-$SHA" deployment/containers/api/Dockerfile .)"
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$API_REPO@$API_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy module availability result fix API image only
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT='${{ steps.release.outputs.target_commit }}' \
            --revision-suffix "mavrfapi-${GITHUB_RUN_ID}" --output none

      - name: Validate API health and non-empty protected response
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          READY=false
          for attempt in $(seq 1 30); do
            HEALTH="$(curl -sS -o /tmp/health -w '%{http_code}' "$BASE/health" || true)"
            VERSION="$(curl -sS -o /tmp/version -w '%{http_code}' "$BASE/api/version" || true)"
            STATUS="$(curl -sS -D /tmp/override-headers -o /tmp/override-response -w '%{http_code}' "$BASE/api/module-availability/overrides" || true)"
            if [[ "$HEALTH" == 200 && "$VERSION" == 200 ]] \
              && [[ "$STATUS" == 401 || "$STATUS" == 403 ]] \
              && grep -Eqi '^content-type:[[:space:]]*application/json' /tmp/override-headers \
              && [[ -s /tmp/override-response ]] \
              && grep -Eq 'session_required|forbidden' /tmp/override-response; then
              READY=true
              break
            fi
            sleep 10
          done
          if [[ "$READY" != true ]]; then
            echo 'The protected override endpoint did not return a non-empty JSON response.' >&2
            echo "health=$HEALTH version=$VERSION override=$STATUS" >&2
            cat /tmp/override-headers >&2 || true
            cat /tmp/override-response >&2 || true
            exit 1
          fi
          ACTIVE_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_API" == '${{ steps.build.outputs.api_image }}' ]]

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/module-availability-result-fix-api-test.json <<JSON
          {"environment":"test","releaseCommit":"${{ steps.release.outputs.target_commit }}","workflowCommit":"${{ github.sha }}","runId":"${{ github.run_id }}","apiImage":"${{ steps.build.outputs.api_image }}","previousApiImage":"${{ steps.before.outputs.old_api_image }}","webDeployment":"unchanged","migration042":"unchanged","database":"unchanged","moduleStates":"unchanged"}
          JSON

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: module-availability-result-fix-api-test-${{ github.run_id }}
          path: evidence/module-availability-result-fix-api-test.json
          retention-days: 30

      - name: Roll back API image on failure
        if: ${{ failure() && steps.deploy_api.outputs.started == 'true' }}
        shell: bash
        run: |
          set +e
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.before.outputs.old_api_image }}' --revision-suffix "mavrfapi-rb-${GITHUB_RUN_ID}" --output none
