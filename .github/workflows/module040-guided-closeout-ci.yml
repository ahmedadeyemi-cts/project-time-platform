name: Validate Module 040 Guided Project Closeout

on:
  pull_request:
    paths:
      - '.github/workflows/module040-guided-closeout-ci.yml'
      - 'src/frontend/project-time-web/src/ProjectCloseoutCenter.jsx'
      - 'src/frontend/project-time-web/src/project-closeout-center.css'
      - 'src/frontend/project-time-web/scripts/validate-module-040-guided-closeout.mjs'
      - 'src/frontend/project-time-web/src/App.jsx'
      - 'src/backend/ProjectTime.Api/Modules/WorkLifecycleModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/FinancialOperationsRecoveryModule.cs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module040-guided-closeout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guided-closeout-contract:
    name: Guided closeout source and production build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json
      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci
      - name: Validate Module 040 contract
        working-directory: src/frontend/project-time-web
        run: node ./scripts/validate-module-040-guided-closeout.mjs
      - name: Build complete frontend
        working-directory: src/frontend/project-time-web
        run: npm run build
      - name: Confirm guided closeout in production bundle
        working-directory: src/frontend/project-time-web
        run: |
          cat dist/assets/*.js > /tmp/module040-guided-closeout.js
          cat dist/assets/*.css > /tmp/module040-guided-closeout.css
          grep -Fq 'Exactly what happens next' /tmp/module040-guided-closeout.js
          grep -Fq 'Required Project Manager confirmations' /tmp/module040-guided-closeout.js
          grep -Fq '.module040-guided-closeout' /tmp/module040-guided-closeout.css
          echo 'MODULE_040_PRODUCTION_BUNDLE=PASS'

  api-release-build:
    name: Work-to-Cash API Release build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore API
        run: dotnet restore src/backend/ProjectTime.Api/ProjectTime.Api.csproj
      - name: Build API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --no-restore