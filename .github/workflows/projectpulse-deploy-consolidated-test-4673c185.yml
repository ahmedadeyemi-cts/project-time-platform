name: Diagnose Consolidated Test ACR Build 4673c185

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/projectpulse-deploy-consolidated-test-4673c185.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: diagnose-consolidated-test-acr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Read failed ACR build logs without modifying Azure
    if: github.event.pull_request.head.ref == 'observe/consolidated-test-release-4673c185-20260801'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sign in to Azure using Test OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read all three immutable image build records
        shell: bash
        run: |
          set -Eeuo pipefail
          for run_id in dsbp dsbq dsbn; do
            echo "PROJECTPULSE_ACR_RUN_BEGIN=$run_id"
            az acr task show-run \
              --registry '${{ vars.AZURE_ACR_NAME }}' \
              --run-id "$run_id" \
              --output json \
              --only-show-errors
            echo "PROJECTPULSE_ACR_LOG_BEGIN=$run_id"
            az acr task logs \
              --registry '${{ vars.AZURE_ACR_NAME }}' \
              --run-id "$run_id" \
              --only-show-errors || true
            echo "PROJECTPULSE_ACR_LOG_END=$run_id"
          done
