name: Resume Corrected Consolidated Test Release 574b4b5d

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/projectpulse-deploy-consolidated-test-4673c185.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-resumed-test-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Rebuild migration image only and complete Test deployment
    if: github.event.pull_request.head.ref == 'observe/consolidated-test-release-4673c185-20260801'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RELEASE_SHA: 574b4b5da7c4acb4734c87b1ff6a45930c57ea33
      FEATURE_BASE_SHA: 4673c185f7fe885dd202dbbd07579182be32d572
      API_IMAGE: ${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-api@sha256:aabd47a0aff5e2cf62f89670eb1d722000871b90f0326507b8ac5ded9547334d
      WEB_IMAGE: ${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-web@sha256:a98904a162c6584705801ffdbdba8cb0f0f97a1e4324ca49f8ca345842baa038

    steps:
      - name: Check out exact corrected release source
        uses: actions/checkout@v5
        with:
          ref: 574b4b5da7c4acb4734c87b1ff6a45930c57ea33
          path: release
          fetch-depth: 1
          persist-credentials: false

      - name: Guard exact source and successful immutable application images
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_HEAD_REF" == 'observe/consolidated-test-release-4673c185-20260801' ]]
          [[ "$(git -C release rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$API_IMAGE" == '${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-api@sha256:'* ]]
          [[ "$WEB_IMAGE" == '${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-web@sha256:'* ]]
          for required in \
            release/deployment/containers/pr55-migrator/Dockerfile \
            release/scripts/build-pr55-acr-image.sh \
            release/scripts/export-pr55-test-database-url.sh \
            release/database/migrations/054_pulse_ai_system_intelligence_conversations.sql \
            release/database/migrations/055_analytics_center.sql \
            release/database/migrations/056_role_workspace_entra_crm_governance.sql \
            release/database/migrations/056a_role_workspace_permission_scope_guard.sql \
            release/database/migrations/057_module_001_multi_timer_document_grounded_ai.sql; do
            test -f "$required"
          done
          git -C release diff --check
          echo 'PROJECTPULSE_API_IMAGE_REUSE=GUARDED'
          echo 'PROJECTPULSE_WEB_IMAGE_REUSE=GUARDED'

      - name: Sign in to Azure using Test OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify reused images and capture current Test release
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          ACR='${{ vars.AZURE_ACR_NAME }}'
          API_RELATIVE="${API_IMAGE#"$ACR.azurecr.io/"}"
          WEB_RELATIVE="${WEB_IMAGE#"$ACR.azurecr.io/"}"
          [[ "$(az acr repository show --name "$ACR" --image "$API_RELATIVE" --query digest -o tsv --only-show-errors)" == "${API_IMAGE##*@}" ]]
          [[ "$(az acr repository show --name "$ACR" --image "$WEB_RELATIVE" --query digest -o tsv --only-show-errors)" == "${WEB_IMAGE##*@}" ]]

          resolve_digest() {
            local image="$1"
            local registry="$ACR.azurecr.io/"
            local relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Image is outside the approved Test ACR: $image" >&2; return 1 ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name "$ACR" --image "$relative" --query digest -o tsv --only-show-errors)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          RAW_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          RAW_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors)"
          [[ "${API_MODE,,}" == single && "${WEB_MODE,,}" == single ]]

          echo "old_api_image=$(resolve_digest "$RAW_API")" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$(resolve_digest "$RAW_WEB")" >> "$GITHUB_OUTPUT"
          echo 'PROJECTPULSE_PREVIOUS_TEST_RELEASE=CAPTURED'

      - name: Load the private Test database connection
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        run: bash release/scripts/export-pr55-test-database-url.sh

      - name: Build corrected migration image only
        id: migration_build
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x release/scripts/build-pr55-acr-image.sh
          CONTEXT="$RUNNER_TEMP/projectpulse-migrator-fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          install -m 0644 release/deployment/containers/pr55-migrator/Dockerfile "$CONTEXT/Dockerfile"
          printf '%s\n' "$RELEASE_SHA" > "$CONTEXT/release-commit"

          for migration in \
            054_pulse_ai_system_intelligence_conversations.sql \
            055_analytics_center.sql \
            056_role_workspace_entra_crm_governance.sql \
            056a_role_workspace_permission_scope_guard.sql \
            057_module_001_multi_timer_document_grounded_ai.sql; do
            install -m 0644 "release/database/migrations/$migration" "$CONTEXT/migrations/$migration"
          done

          cat > "$CONTEXT/apply-pr55-test-migrations.sh" <<'MIGRATION_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOT="${1:?release root is required}"
          DATABASE_URL="${PROJECTPULSE_TEST_DATABASE_URL:?database URL is required}"
          cd "$ROOT"
          sha256sum -c database/migrations/SHA256SUMS
          [[ "$(cat .projectpulse-release-commit)" == '574b4b5da7c4acb4734c87b1ff6a45930c57ea33' ]]
          [[ "$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT CASE WHEN to_regclass('public.schema_migrations') IS NOT NULL THEN '1' ELSE '0' END")" == '1' ]]

          while IFS='|' read -r migration_id migration_file; do
            present="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM schema_migrations WHERE migration_id = '$migration_id'")"
            case "$present" in
              0)
                echo "PROJECTPULSE_MIGRATION_APPLYING=$migration_id"
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -f "database/migrations/$migration_file"
                ;;
              1)
                echo "PROJECTPULSE_MIGRATION_ALREADY_APPLIED=$migration_id"
                ;;
              *)
                echo "Unexpected schema_migrations count for $migration_id: $present" >&2
                exit 1
                ;;
            esac
            verified="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM schema_migrations WHERE migration_id = '$migration_id'")"
            [[ "$verified" == 1 ]]
            echo "PROJECTPULSE_MIGRATION_VERIFIED=$migration_id"
          done <<'MIGRATIONS'
          054_pulse_ai_system_intelligence_conversations|054_pulse_ai_system_intelligence_conversations.sql
          055_analytics_center|055_analytics_center.sql
          056_role_workspace_entra_crm_governance|056_role_workspace_entra_crm_governance.sql
          056a_role_workspace_permission_scope_guard|056a_role_workspace_permission_scope_guard.sql
          057_module_001_multi_timer_document_grounded_ai|057_module_001_multi_timer_document_grounded_ai.sql
          MIGRATIONS

          echo 'PROJECTPULSE_CONSOLIDATED_MIGRATIONS=APPLIED_OR_VERIFIED'
          unset DATABASE_URL
          MIGRATION_SCRIPT
          chmod 0555 "$CONTEXT/apply-pr55-test-migrations.sh"

          (
            cd "$CONTEXT"
            sha256sum migrations/*.sql \
              | sed 's#  migrations/#  database/migrations/#' \
              > migrations/SHA256SUMS
          )

          MIGRATION_DIGEST="$(
            release/scripts/build-pr55-acr-image.sh \
              '${{ vars.AZURE_ACR_NAME }}' \
              "project-health-dashboard-release-migrator:release-${RELEASE_SHA}-fixed-${GITHUB_RUN_ID}" \
              "$CONTEXT/Dockerfile" \
              "$CONTEXT"
          )"
          MIGRATION_DIGEST="$(tr -d '\r\n' <<<"$MIGRATION_DIGEST")"
          [[ "$MIGRATION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          MIGRATION_IMAGE='${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-release-migrator@'"$MIGRATION_DIGEST"
          echo "migration_image=$MIGRATION_IMAGE" >> "$GITHUB_OUTPUT"
          echo "PROJECTPULSE_CORRECTED_MIGRATION_IMAGE=$MIGRATION_IMAGE"

      - name: Apply or verify migrations 054 through 057
        shell: bash
        env:
          MIGRATION_IMAGE: ${{ steps.migration_build.outputs.migration_image }}
        run: |
          set -Eeuo pipefail
          DATABASE_URL="${PROJECTPULSE_TEST_DATABASE_URL:?Test database URL is required}"
          printf '::add-mask::%s\n' "${DATABASE_URL//%/%25}"
          RESOURCE_GROUP='${{ vars.AZURE_RESOURCE_GROUP }}'
          API_APP='${{ vars.AZURE_API_APP }}'
          ACR_NAME='${{ vars.AZURE_ACR_NAME }}'
          JOB_NAME="ppmig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ENVIRONMENT_ID="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.managedEnvironmentId -o tsv --only-show-errors)"
          [[ -n "$ENVIRONMENT_ID" ]]
          [[ "$MIGRATION_IMAGE" == "$ACR_NAME.azurecr.io/"*@sha256:* ]]

          REGISTRY_USERNAME='00000000-0000-0000-0000-000000000000'
          REGISTRY_PASSWORD="$(az acr login --name "$ACR_NAME" --expose-token --query accessToken -o tsv --only-show-errors)"
          [[ -n "$REGISTRY_PASSWORD" ]]
          printf '::add-mask::%s\n' "$REGISTRY_PASSWORD"

          JOB_CREATED=0
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            unset DATABASE_URL REGISTRY_PASSWORD
            if (( JOB_CREATED == 1 )); then
              az containerapp job delete -g "$RESOURCE_GROUP" -n "$JOB_NAME" --yes --output none --only-show-errors || true
            fi
            exit "$status"
          }
          trap cleanup EXIT INT TERM

          az containerapp job create \
            -g "$RESOURCE_GROUP" \
            -n "$JOB_NAME" \
            --environment "$ENVIRONMENT_ID" \
            --trigger-type Manual \
            --replica-timeout 1800 \
            --replica-retry-limit 0 \
            --replica-completion-count 1 \
            --parallelism 1 \
            --image "$MIGRATION_IMAGE" \
            --cpu 0.25 \
            --memory 0.5Gi \
            --registry-server "$ACR_NAME.azurecr.io" \
            --registry-username "$REGISTRY_USERNAME" \
            --registry-password "$REGISTRY_PASSWORD" \
            --secrets "projectpulse-db-url=$DATABASE_URL" \
            --env-vars PROJECTPULSE_TEST_DATABASE_URL=secretref:projectpulse-db-url \
            --tags projectpulse-scope=resumed-consolidated-test projectpulse-release="$RELEASE_SHA" \
            --output none --only-show-errors
          JOB_CREATED=1
          unset REGISTRY_PASSWORD DATABASE_URL

          EXECUTION_NAME="$(az containerapp job start -g "$RESOURCE_GROUP" -n "$JOB_NAME" --query name -o tsv --only-show-errors)"
          [[ -n "$EXECUTION_NAME" ]]
          STATUS=''
          for attempt in $(seq 1 180); do
            STATUS="$(az containerapp job execution list -g "$RESOURCE_GROUP" -n "$JOB_NAME" --query "[?name=='$EXECUTION_NAME'].properties.status | [0]" -o tsv --only-show-errors)"
            case "$STATUS" in
              Succeeded) break ;;
              Failed|Canceled) break ;;
            esac
            sleep 5
          done
          if [[ "$STATUS" != Succeeded ]]; then
            az containerapp job logs show -g "$RESOURCE_GROUP" -n "$JOB_NAME" --execution "$EXECUTION_NAME" --container "$JOB_NAME" --tail 400 --only-show-errors >&2 || true
            echo "Migration execution ended with status: $STATUS" >&2
            exit 1
          fi
          echo 'PROJECTPULSE_MIGRATIONS_054_055_056_056A_057=APPLIED_OR_VERIFIED'

      - name: Deploy immutable API image
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            --image "$API_IMAGE" \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT="$RELEASE_SHA" \
            --revision-suffix "relapi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none --only-show-errors

      - name: Validate API image and public health
        shell: bash
        run: |
          set -Eeuo pipefail
          CURRENT="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          [[ "$CURRENT" == "$API_IMAGE" ]]
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          for attempt in $(seq 1 36); do
            STATUS="$(curl -sS -o /tmp/projectpulse-api-health -w '%{http_code}' -H 'Cache-Control: no-cache, no-store, max-age=0' "$BASE/api/health?release=$RELEASE_SHA&attempt=$attempt" || true)"
            case "$STATUS" in
              200|401) echo 'PROJECTPULSE_RESUMED_API=HEALTHY'; exit 0 ;;
            esac
            sleep 5
          done
          cat /tmp/projectpulse-api-health >&2 || true
          exit 1

      - name: Deploy corrected immutable web image
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image "$WEB_IMAGE" \
            --set-env-vars PROJECTPULSE_SOURCE_COMMIT="$RELEASE_SHA" \
            --revision-suffix "relweb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none --only-show-errors

      - name: Validate web image and public response
        shell: bash
        run: |
          set -Eeuo pipefail
          CURRENT="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          [[ "$CURRENT" == "$WEB_IMAGE" ]]
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          for attempt in $(seq 1 36); do
            STATUS="$(curl -sS -o /tmp/projectpulse-web-home -w '%{http_code}' -H 'Cache-Control: no-cache, no-store, max-age=0' "$BASE/?release=$RELEASE_SHA&attempt=$attempt" || true)"
            if [[ "$STATUS" == 200 ]]; then
              test -s /tmp/projectpulse-web-home
              echo 'PROJECTPULSE_RESUMED_WEB=HEALTHY'
              exit 0
            fi
            sleep 5
          done
          cat /tmp/projectpulse-web-home >&2 || true
          exit 1

      - name: Preserve immutable Test release evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-evidence
          cat > release-evidence/resumed-consolidated-test-release.json <<JSON
          {
            "environment": "test",
            "releaseSha": "$RELEASE_SHA",
            "featureBaseSha": "$FEATURE_BASE_SHA",
            "apiImage": "$API_IMAGE",
            "webImage": "$WEB_IMAGE",
            "migrationImage": "${{ steps.migration_build.outputs.migration_image }}",
            "migrations": ["054", "055", "056", "056A", "057"],
            "workflowRunId": "$GITHUB_RUN_ID",
            "workflowRunAttempt": "$GITHUB_RUN_ATTEMPT"
          }
          JSON

      - name: Upload release evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: projectpulse-resumed-test-${{ github.run_id }}
          path: release-evidence/resumed-consolidated-test-release.json
          retention-days: 30

      - name: Roll back API and web images on deployment failure
        if: failure() && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true')
        shell: bash
        run: |
          set +e
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --image '${{ steps.before.outputs.old_api_image }}' --revision-suffix "rbapi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
          API_ROLLBACK=$?
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --image '${{ steps.before.outputs.old_web_image }}' --revision-suffix "rbweb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
          WEB_ROLLBACK=$?
          echo "PROJECTPULSE_API_ROLLBACK_EXIT=$API_ROLLBACK"
          echo "PROJECTPULSE_WEB_ROLLBACK_EXIT=$WEB_ROLLBACK"
          exit 1

      - name: Publish deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Resumed ProjectPulse consolidated Test release'
            echo
            echo "- Exact main release: \`$RELEASE_SHA\`"
            echo '- Reused successful immutable API image: passed'
            echo '- Reused successful corrected web image: passed'
            echo '- Rebuilt only corrected migration image: passed'
            echo '- Migrations 054, 055, 056, 056A, and 057: applied or verified'
            echo '- API immutable image and public health: passed'
            echo '- Web immutable image and public response: passed'
            echo '- Automatic image rollback guard: armed'
          } >> "$GITHUB_STEP_SUMMARY"
