name: ProjectPulse Consolidated Test Release Observer 4673c185

on:
  push:
    branches:
      - 'deploy/consolidated-test-4673c185-20260801'
    paths:
      - '.github/workflows/projectpulse-deploy-consolidated-test-4673c185.yml'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: projectpulse-consolidated-test-observer-${{ github.sha }}
  cancel-in-progress: false

jobs:
  observe:
    name: Publish hidden branch-run status to issue 387
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Observe the preceding consolidated deployment run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ISSUE: '387'
          RELEASE_SHA: 4673c185f7fe885dd202dbbd07579182be32d572
          DEPLOYMENT_TRIGGER_SHA: a1fde0d24f5eca9bf0482ba24a749b17403f74e1
        run: |
          set -Eeuo pipefail

          API_ROOT="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          WORKFLOW_FILE='projectpulse-deploy-consolidated-test-4673c185.yml'
          BRANCH='deploy/consolidated-test-4673c185-20260801'
          AUTH_HEADER="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT_HEADER='Accept: application/vnd.github+json'
          VERSION_HEADER='X-GitHub-Api-Version: 2022-11-28'

          post_comment() {
            local body="$1"
            jq -n --arg body "$body" '{body:$body}' \
              | curl --fail-with-body --silent --show-error \
                  -X POST \
                  -H "$AUTH_HEADER" \
                  -H "$ACCEPT_HEADER" \
                  -H "$VERSION_HEADER" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  "$API_ROOT/issues/$EVIDENCE_ISSUE/comments" >/dev/null
          }

          list_runs() {
            curl --fail-with-body --silent --show-error \
              --get \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$VERSION_HEADER" \
              --data-urlencode "branch=$BRANCH" \
              --data-urlencode 'event=push' \
              --data-urlencode 'per_page=30' \
              "$API_ROOT/actions/workflows/$WORKFLOW_FILE/runs"
          }

          RUNS="$(list_runs)"
          PRIOR_RUN_ID="$(
            jq -r \
              --argjson current "$GITHUB_RUN_ID" \
              --arg trigger "$DEPLOYMENT_TRIGGER_SHA" \
              '[.workflow_runs[] | select(.id != $current) | select(.head_sha == $trigger)] | sort_by(.created_at) | last | .id // empty' \
              <<<"$RUNS"
          )"

          if [[ -z "$PRIOR_RUN_ID" ]]; then
            AVAILABLE="$(jq -r '[.workflow_runs[] | {id, head_sha, status, conclusion, html_url}]' <<<"$RUNS")"
            post_comment "### Deployment observer — no matching branch run\n\nNo preceding Actions run was registered for trigger commit \`$DEPLOYMENT_TRIGGER_SHA\`. The observer did **not** deploy or alter Azure.\n\nAvailable branch runs:\n\n\`\`\`json\n$AVAILABLE\n\`\`\`"
            echo 'PROJECTPULSE_PRIOR_DEPLOYMENT_RUN=NOT_FOUND'
            exit 0
          fi

          get_run() {
            curl --fail-with-body --silent --show-error \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$VERSION_HEADER" \
              "$API_ROOT/actions/runs/$PRIOR_RUN_ID"
          }

          RUN="$(get_run)"
          STATUS="$(jq -r '.status' <<<"$RUN")"
          CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RUN")"
          RUN_URL="$(jq -r '.html_url' <<<"$RUN")"
          CREATED_AT="$(jq -r '.created_at' <<<"$RUN")"
          UPDATED_AT="$(jq -r '.updated_at' <<<"$RUN")"

          post_comment "### Consolidated Test deployment located\n\n- Release source: \`$RELEASE_SHA\`\n- Trigger commit: \`$DEPLOYMENT_TRIGGER_SHA\`\n- Actions run: **$PRIOR_RUN_ID**\n- Status: **$STATUS**\n- Conclusion: **${CONCLUSION:-pending}**\n- Started: \`$CREATED_AT\`\n- Last update: \`$UPDATED_AT\`\n- Run: $RUN_URL\n\nThe observer is following this existing run and will not start a duplicate deployment."

          for attempt in $(seq 1 720); do
            RUN="$(get_run)"
            STATUS="$(jq -r '.status' <<<"$RUN")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RUN")"
            [[ "$STATUS" == 'completed' ]] && break
            sleep 10
          done

          if [[ "$STATUS" != 'completed' ]]; then
            post_comment "### Consolidated Test deployment observation timed out\n\nActions run **$PRIOR_RUN_ID** did not reach a terminal state within the observer window. No duplicate deployment was started.\n\nRun: $RUN_URL"
            exit 1
          fi

          JOBS="$(
            curl --fail-with-body --silent --show-error \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$VERSION_HEADER" \
              "$API_ROOT/actions/runs/$PRIOR_RUN_ID/jobs?per_page=100"
          )"
          JOB_SUMMARY="$(
            jq -r '[.jobs[] | {name, status, conclusion, started_at, completed_at, steps:[.steps[] | {name, status, conclusion}]}]' <<<"$JOBS"
          )"
          ARTIFACTS="$(
            curl --fail-with-body --silent --show-error \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$VERSION_HEADER" \
              "$API_ROOT/actions/runs/$PRIOR_RUN_ID/artifacts?per_page=100" \
              | jq -r '[.artifacts[] | {name, expired, size_in_bytes, archive_download_url}]'
          )"

          UPDATED_AT="$(jq -r '.updated_at' <<<"$RUN")"
          post_comment "### Consolidated Test deployment completed\n\n- Release source: \`$RELEASE_SHA\`\n- Actions run: **$PRIOR_RUN_ID**\n- Final conclusion: **$CONCLUSION**\n- Completed/updated: \`$UPDATED_AT\`\n- Run: $RUN_URL\n\n#### Jobs and step conclusions\n\n\`\`\`json\n$JOB_SUMMARY\n\`\`\`\n\n#### Release artifacts\n\n\`\`\`json\n$ARTIFACTS\n\`\`\`"

          if [[ "$CONCLUSION" != 'success' ]]; then
            echo "PROJECTPULSE_CONSOLIDATED_DEPLOYMENT_CONCLUSION=$CONCLUSION" >&2
            exit 1
          fi

          echo 'PROJECTPULSE_CONSOLIDATED_DEPLOYMENT_CONCLUSION=success'
