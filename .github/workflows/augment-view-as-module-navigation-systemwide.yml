          ## System invariant

          A module shown to an Engineer, Project Manager, or another effective View-As identity must open without being silently redirected to Dashboard. A module that is explicitly inactive or explicitly denied by Module 012 must not expose an active Open action.

          ## Shared authority

          The browser combines the current effective identity, Module 012 grants and denials, the complete active/inactive module lifecycle catalog, backend-declared legacy fallbacks, persisted Module Availability state, and the owning endpoint authorization. Missing dynamic-catalog registration is not treated as denial; unconfigured modules retain their established endpoint and legacy authorization.

          Sidebar navigation, More, the Modules directory, module clicks, and direct hash routes consume the same published effective-user state. View-As never inherits the actual administrator's permanent Full Control.

          ## Route behavior

          Permission refreshes are sequenced, and stale responses for a previous View-As identity are discarded. Hash changes do not create redundant permission requests. Explicitly denied or inactive routes remain selected behind a blocking, body-owned access explanation; Pulse does not conceal the mismatch by changing the route to Dashboard. When the optional navigation catalog is unavailable, the owning server endpoint remains authoritative.

          ## Security boundary

          This client policy improves consistency and usability but does not replace server authorization. Backend module, record, field, project, role, and read-only View-As controls remain authoritative. No role grants, database migrations, or permission expansions are introduced by this repair.
          ''')
