name: Complete systemwide View-As module navigation repair

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: complete-view-as-module-navigation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.event.pull_request.head.ref == 'fix/view-as-module-navigation-continuity-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Apply complete systemwide repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          def replace_once(relative, old, new):
              path = root / relative
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1))

          def insert_before_once(relative, marker, addition):
              path = root / relative
              text = path.read_text()
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one insertion marker, found {count}")
              path.write_text(text.replace(marker, addition + marker, 1))

          def insert_after_once(relative, marker, addition):
              path = root / relative
              text = path.read_text()
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one insertion marker, found {count}")
              path.write_text(text.replace(marker, marker + addition, 1))

          policy = 'src/frontend/project-time-web/src/module-navigation-access-policy.js'
          replace_once(
              policy,
              '''  const deniedModuleNumbers = new Set(retired);
            if (!actualSessionPermanentFullControl) {
              for (const moduleCode of inactiveDynamicModuleNumbers) deniedModuleNumbers.add(moduleCode);
              for (const moduleCode of explicitDeniedModuleNumbers) deniedModuleNumbers.add(moduleCode);
            }

            return {
              deniedModuleNumbers: sorted(deniedModuleNumbers),
              explicitDeniedModuleNumbers: sorted(explicitDeniedModuleNumbers),
              explicitGrantedModuleNumbers: sorted(explicitGrantedModuleNumbers),
              activeDynamicModuleNumbers: sorted(activeDynamicModuleNumbers),
              inactiveDynamicModuleNumbers: sorted(inactiveDynamicModuleNumbers),
              legacyFallbackModuleNumbers: sorted(legacyFallbackModuleNumbers),
              unregisteredLegacyModuleNumbers: sorted(unregisteredLegacyModuleNumbers),
              applicationModuleNumbers: sorted(applicationModuleNumbers),
              actualSessionPermanentFullControl: Boolean(actualSessionPermanentFullControl)
            };''',
              '''  const deniedModuleNumbers = new Set(retired);
            const deniedModuleReasons = new Map(
              [...retired].map((moduleCode) => [moduleCode, 'module_retired'])
            );
            if (!actualSessionPermanentFullControl) {
              for (const moduleCode of inactiveDynamicModuleNumbers) {
                deniedModuleNumbers.add(moduleCode);
                deniedModuleReasons.set(moduleCode, 'module_inactive');
              }
              for (const moduleCode of explicitDeniedModuleNumbers) {
                deniedModuleNumbers.add(moduleCode);
                deniedModuleReasons.set(moduleCode, 'explicit_role_module_deny');
              }
            }

            return {
              deniedModuleNumbers: sorted(deniedModuleNumbers),
              deniedModuleReasons: Object.fromEntries(
                [...deniedModuleReasons.entries()].sort(([left], [right]) =>
                  left.localeCompare(right, undefined, { numeric: true, sensitivity: 'base' })
                )
              ),
              explicitDeniedModuleNumbers: sorted(explicitDeniedModuleNumbers),
              explicitGrantedModuleNumbers: sorted(explicitGrantedModuleNumbers),
              activeDynamicModuleNumbers: sorted(activeDynamicModuleNumbers),
              inactiveDynamicModuleNumbers: sorted(inactiveDynamicModuleNumbers),
              legacyFallbackModuleNumbers: sorted(legacyFallbackModuleNumbers),
              unregisteredLegacyModuleNumbers: sorted(unregisteredLegacyModuleNumbers),
              applicationModuleNumbers: sorted(applicationModuleNumbers),
              actualSessionPermanentFullControl: Boolean(actualSessionPermanentFullControl)
            };'''
          )

          bridge = 'src/frontend/project-time-web/src/module-availability-bridge.js'
          replace_once(
              bridge,
              "const BODY_NOTICE_ID = 'projectpulse-module-011-retirement-notice';\nconst RETIRED_MODULE_NUMBERS = new Set(",
              "const BODY_NOTICE_ID = 'projectpulse-module-011-retirement-notice';\nconst ROUTE_ACCESS_NOTICE_ID = 'projectpulse-route-access-notice';\nconst RETIRED_MODULE_NUMBERS = new Set("
          )
          replace_once(
              bridge,
              "  let deniedModuleNumbers = new Set(RETIRED_MODULE_NUMBERS);\n  let permissionEvidenceState = sessionToken() ? 'loading' : 'anonymous';",
              "  let deniedModuleNumbers = new Set(RETIRED_MODULE_NUMBERS);\n  let deniedModuleReasons = new Map(\n    [...RETIRED_MODULE_NUMBERS].map((moduleNumber) => [moduleNumber, 'module_retired'])\n  );\n  let permissionEvidenceState = sessionToken() ? 'loading' : 'anonymous';"
          )
          replace_once(
              bridge,
              "  let moreSearchValue = '';\n  let refreshSequence = 0;",
              "  let moreSearchValue = '';\n  let refreshSequence = 0;\n  let lastRouteDecisionKey = '';"
          )
          replace_once(
              bridge,
              '''  function restoreModulesDirectoryAction(element) {
            if (!isModulesDirectoryOwned(element)) return false;
            element.hidden = false;
            element.removeAttribute('hidden');
            element.removeAttribute('aria-hidden');
            element.removeAttribute(HIDDEN_ATTRIBUTE);
            element.removeAttribute('data-module-availability-hidden');
            return true;
          }''',
              '''  function leaveModulesDirectoryToReact(element) {
            // The directory consumes the published effective-user navigation state
            // and owns its card/action DOM. The bridge must never force an Open
            // action visible after React has classified it as denied or pending.
            return isModulesDirectoryOwned(element);
          }'''
          )
          path = root / bridge
          text = path.read_text().replace('restoreModulesDirectoryAction(element)', 'leaveModulesDirectoryToReact(element)')
          if 'restoreModulesDirectoryAction' in text:
              raise SystemExit('Modules directory forced-visibility helper remains in the shared bridge.')
          path.write_text(text)
          replace_once(
              bridge,
              "    const declared = element.getAttribute?.('data-route');\n    if (declared) return rawModuleRoute(declared);",
              "    const declared = element.getAttribute?.('data-module-open-route')\n      || element.getAttribute?.('data-route');\n    if (declared) return rawModuleRoute(declared);"
          )

          route_helpers = r'''  function removeRouteAccessNotice() {
            const notice = document.getElementById(ROUTE_ACCESS_NOTICE_ID);
            if (notice?.parentElement === document.body) notice.remove();
            lastRouteDecisionKey = '';
          }

          function moduleAccessDecision(module) {
            if (!module) return { state: 'unmanaged', allowed: true, reasonCode: '' };
            const moduleNumber = String(module.moduleNumber || '').trim().toUpperCase();
            if (RETIRED_MODULE_NUMBERS.has(moduleNumber)) {
              return { state: 'denied', allowed: false, reasonCode: 'module_retired' };
            }
            if (permissionEvidenceState === 'loading') {
              return {
                state: 'checking',
                allowed: false,
                reasonCode: 'permission_evidence_loading'
              };
            }
            if (permissionEvidenceState !== 'ready') {
              // Client navigation is not an authorization boundary. When the
              // optional catalog cannot be loaded, keep the route and let the
              // owning server endpoint enforce its established authorization.
              return {
                state: 'server_authoritative',
                allowed: true,
                reasonCode: 'server_endpoint_authorization_only'
              };
            }
            if (deniedModuleNumbers.has(moduleNumber)) {
              return {
                state: 'denied',
                allowed: false,
                reasonCode: deniedModuleReasons.get(moduleNumber) || 'module_access_denied'
              };
            }
            return { state: 'allowed', allowed: true, reasonCode: '' };
          }

          function routeAccessReason(decision) {
            switch (decision.reasonCode) {
              case 'explicit_role_module_deny':
                return 'The effective user has an explicit Module Access denial for this workspace.';
              case 'module_inactive':
                return 'This module is explicitly inactive in the governed module lifecycle catalog.';
              case 'permission_evidence_loading':
                return 'Pulse is verifying the selected effective user before opening this workspace.';
              default:
                return 'This workspace is not available to the current effective user.';
            }
          }

          function showRouteAccessNotice(module, decision) {
            if (!module || decision.allowed) {
              removeRouteAccessNotice();
              return;
            }

            let notice = document.getElementById(ROUTE_ACCESS_NOTICE_ID);
            if (!notice) {
              notice = document.createElement('aside');
              notice.id = ROUTE_ACCESS_NOTICE_ID;
              notice.className = 'projectpulse-route-access-notice';
              notice.dataset.projectpulseBodyOwned = 'true';
              notice.setAttribute('role', 'dialog');
              notice.setAttribute('aria-modal', 'true');
              notice.setAttribute('aria-labelledby', 'projectpulse-route-access-title');

              const card = document.createElement('div');
              card.className = 'projectpulse-route-access-card';
              const eyebrow = document.createElement('span');
              eyebrow.className = 'projectpulse-route-access-eyebrow';
              eyebrow.textContent = 'Effective-user access';
              const title = document.createElement('h2');
              title.id = 'projectpulse-route-access-title';
              const detail = document.createElement('p');
              detail.className = 'projectpulse-route-access-detail';
              const continuity = document.createElement('p');
              continuity.className = 'projectpulse-route-access-continuity';
              continuity.textContent = 'The selected route was preserved. Pulse did not silently redirect you to Dashboard.';
              const actions = document.createElement('div');
              actions.className = 'projectpulse-route-access-actions';
              const modulesLink = document.createElement('a');
              modulesLink.href = '#modules';
              modulesLink.textContent = 'Open authorized modules';
              const dashboardLink = document.createElement('a');
              dashboardLink.href = '#dashboard';
              dashboardLink.textContent = 'Return to Dashboard';
              dashboardLink.className = 'secondary';
              actions.append(modulesLink, dashboardLink);
              card.append(eyebrow, title, detail, continuity, actions);
              notice.append(card);
              document.body.append(notice);
            }

            notice.dataset.moduleNumber = String(module.moduleNumber || '');
            notice.dataset.route = String(module.route || '');
            notice.dataset.state = decision.state;
            notice.dataset.reasonCode = decision.reasonCode;
            const title = notice.querySelector('#projectpulse-route-access-title');
            const detail = notice.querySelector('.projectpulse-route-access-detail');
            const identity = `Module ${module.moduleNumber} — ${module.displayName}`;
            title.textContent = decision.state === 'checking'
              ? `Checking access to ${identity}`
              : `${identity} is not available`;
            detail.textContent = routeAccessReason(decision);
          }

          function publishRouteDenied(module, decision) {
            const decisionKey = [
              module?.moduleNumber,
              module?.route,
              decision?.state,
              decision?.reasonCode,
              effectiveActor.isViewAs
            ].join('|');
            if (decisionKey === lastRouteDecisionKey) return;
            lastRouteDecisionKey = decisionKey;
            window.dispatchEvent(new CustomEvent('projectpulse:permission-route-denied', {
              detail: {
                moduleNumber: module.moduleNumber,
                route: module.route,
                state: decision.state,
                reasonCode: decision.reasonCode,
                isViewAs: effectiveActor.isViewAs,
                redirectedToDashboard: false
              }
            }));
          }

          function guardModuleNavigation(event) {
            const element = event.target?.closest?.('[data-module-open-route], button[data-route], a[href]');
            if (!element) return;
            const route = routeOf(element).split('?')[0];
            const module = moduleForRoute(route);
            if (!module) return;
            const decision = moduleAccessDecision(module);
            if (decision.allowed) {
              removeRouteAccessNotice();
              return;
            }

            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            showRouteAccessNotice(module, decision);
            publishRouteDenied(module, decision);
            if (decision.state === 'checking') void refreshPermissions();
          }

          '''
          insert_before_once(bridge, '  function enforceRouteBoundary() {\n', route_helpers)
          replace_once(
              bridge,
              '''  function enforceRouteBoundary() {
            if (permissionEvidenceState === 'loading') return;
            const rawRoute = rawModuleRoute(window.location.hash || '#dashboard') || 'dashboard';
            const retired = retiredModuleForRoute(rawRoute);
            if (retired) {
              window.sessionStorage.setItem(RETIRED_ROUTE_NOTICE_KEY, 'true');
              if (rawRoute !== 'work-register') window.location.replace('#work-register');
              return;
            }

            const currentModule = moduleForRoute(rawRoute);
            if (currentModule && deniedModuleNumbers.has(currentModule.moduleNumber.toUpperCase())) {
              window.location.hash = '#dashboard';
              window.dispatchEvent(new CustomEvent('projectpulse:permission-route-denied', {
                detail: { moduleNumber: currentModule.moduleNumber, route: currentModule.route }
              }));
            }
          }''',
              '''  function enforceRouteBoundary() {
            if (permissionEvidenceState === 'loading') return;
            const rawRoute = rawModuleRoute(window.location.hash || '#dashboard') || 'dashboard';
            const retired = retiredModuleForRoute(rawRoute);
            if (retired) {
              removeRouteAccessNotice();
              window.sessionStorage.setItem(RETIRED_ROUTE_NOTICE_KEY, 'true');
              if (rawRoute !== 'work-register') window.location.replace('#work-register');
              return;
            }

            const currentModule = moduleForRoute(rawRoute);
            if (!currentModule) {
              removeRouteAccessNotice();
              return;
            }
            const decision = moduleAccessDecision(currentModule);
            if (decision.allowed) {
              removeRouteAccessNotice();
              return;
            }
            showRouteAccessNotice(currentModule, decision);
            publishRouteDenied(currentModule, decision);
          }'''
          )
          replace_once(
              bridge,
              "      deniedModuleNumbers: [...deniedModuleNumbers],\n      explicitDeniedModuleNumbers:",
              "      deniedModuleNumbers: [...deniedModuleNumbers],\n      deniedModuleReasons: Object.fromEntries(deniedModuleReasons),\n      explicitDeniedModuleNumbers:"
          )
          route_api = r'''  window.ProjectPulseRouteAccess = {
            decisionForRoute(route) {
              const module = moduleForRoute(route);
              return { module, ...moduleAccessDecision(module) };
            },
            refresh() {
              return refreshPermissions();
            },
            get state() {
              return window.__projectPulseEffectiveNavigation || null;
            }
          };

          '''
          insert_before_once(bridge, '  async function refreshPermissions() {\n', route_api)
          replace_once(
              bridge,
              "    deniedModuleNumbers = new Set(RETIRED_MODULE_NUMBERS);\n    permissionEvidenceState = 'anonymous';",
              "    deniedModuleNumbers = new Set(RETIRED_MODULE_NUMBERS);\n    deniedModuleReasons = new Map(\n      [...RETIRED_MODULE_NUMBERS].map((moduleNumber) => [moduleNumber, 'module_retired'])\n    );\n    permissionEvidenceState = 'anonymous';"
          )
          replace_once(
              bridge,
              "  deniedModuleNumbers = new Set(RETIRED_MODULE_NUMBERS);\n  effectiveActor = {",
              "  deniedModuleNumbers = new Set(RETIRED_MODULE_NUMBERS);\n  deniedModuleReasons = new Map(\n    [...RETIRED_MODULE_NUMBERS].map((moduleNumber) => [moduleNumber, 'module_retired'])\n  );\n  effectiveActor = {"
          )
          replace_once(
              bridge,
              "    deniedModuleNumbers = new Set(navigationAccess.deniedModuleNumbers);\n    permissionEvidenceState = 'ready';",
              "    deniedModuleNumbers = new Set(navigationAccess.deniedModuleNumbers);\n    deniedModuleReasons = new Map(\n      Object.entries(navigationAccess.deniedModuleReasons || {})\n    );\n    permissionEvidenceState = 'ready';"
          )
          replace_once(
              bridge,
              "    deniedModuleNumbers = new Set(RETIRED_MODULE_NUMBERS);\n    permissionEvidenceState = 'unavailable';",
              "    deniedModuleNumbers = new Set(RETIRED_MODULE_NUMBERS);\n    deniedModuleReasons = new Map(\n      [...RETIRED_MODULE_NUMBERS].map((moduleNumber) => [moduleNumber, 'module_retired'])\n    );\n    permissionEvidenceState = 'unavailable';"
          )
          replace_once(
              bridge,
              "    document.addEventListener('click', (event) => {\n      if (event.target.closest?.('.enterprise-more-button')) scheduleApply();\n    }, true);",
              "    document.addEventListener('click', guardModuleNavigation, true);\n    document.addEventListener('click', (event) => {\n      if (event.target.closest?.('.enterprise-more-button')) scheduleApply();\n    }, true);"
          )

          portal = 'src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx'
          replace_once(
              portal,
              '''function addAuthorizedModule(modules, seenRoutes, anchor, groupName) {
            const href = anchor.getAttribute('href') || '';''',
              '''function addAuthorizedModule(modules, seenRoutes, anchor, groupName) {
            if (anchor.hidden
                || anchor.getAttribute('aria-hidden') === 'true'
                || anchor.getAttribute('data-projectpulse-permission-hidden') === 'true'
                || anchor.getAttribute('data-module-availability-hidden') === 'true') return;
            const href = anchor.getAttribute('href') || '';'''
          )
          replace_once(
              portal,
              '''function effectiveModuleState(module, availability) {
            const stored = availability.states.get(module.moduleNumber);
            return {
              ...module,
              isEnabled: stored?.isEnabled !== false,
              revision: Number(stored?.revision || 0),
              reason: stored?.reason || '',
              updatedAt: stored?.updatedAt || null
            };
          }

          export default function ModulesDirectoryPortal() {''',
              '''function effectiveModuleState(module, availability, navigationAuthority) {
            const stored = availability.states.get(module.moduleNumber);
            const moduleNumber = cleanText(module.moduleNumber).toUpperCase();
            const denied = new Set(navigationAuthority?.deniedModuleNumbers || []);
            const navigationState = cleanText(navigationAuthority?.state) || 'loading';
            return {
              ...module,
              isEnabled: stored?.isEnabled !== false,
              revision: Number(stored?.revision || 0),
              reason: stored?.reason || '',
              updatedAt: stored?.updatedAt || null,
              permissionDenied: navigationState === 'ready' && denied.has(moduleNumber),
              permissionPending: navigationState === 'loading',
              permissionReason: navigationAuthority?.deniedModuleReasons?.[moduleNumber] || ''
            };
          }

          function readEffectiveNavigationAuthority() {
            const state = window.__projectPulseEffectiveNavigation;
            if (state && typeof state === 'object') return state;
            return {
              state: window.localStorage.getItem('projectPulseAuthSession') ? 'loading' : 'anonymous',
              isViewAs: Boolean(window.localStorage.getItem('projectPulseViewAsUser')),
              deniedModuleNumbers: [],
              deniedModuleReasons: {}
            };
          }

          export default function ModulesDirectoryPortal() {'''
          )
          replace_once(
              portal,
              "  const [statusMessage, setStatusMessage] = useState('');\n  const refreshTimer = useRef(null);",
              "  const [statusMessage, setStatusMessage] = useState('');\n  const [navigationAuthority, setNavigationAuthority] = useState(readEffectiveNavigationAuthority);\n  const refreshTimer = useRef(null);"
          )
          insert_after_once(
              portal,
              '''  useEffect(() => {
            const handleHashChange = () => setRoute(currentRoute());
            window.addEventListener('hashchange', handleHashChange);
            return () => window.removeEventListener('hashchange', handleHashChange);
          }, []);
          ''',
              '''
          useEffect(() => {
            const updateAuthority = (event) => {
              const next = event?.detail && typeof event.detail === 'object'
                ? event.detail
                : readEffectiveNavigationAuthority();
              setNavigationAuthority(next);
            };
            updateAuthority();
            window.addEventListener('projectpulse:permission-navigation-updated', updateAuthority);
            return () => window.removeEventListener('projectpulse:permission-navigation-updated', updateAuthority);
          }, []);
          '''
          )
          replace_once(
              portal,
              '''  const enrichedModules = useMemo(
            () => directoryModules.map((module) => effectiveModuleState(module, availability)),
            [directoryModules, availability]
          );''',
              '''  const enrichedModules = useMemo(
            () => directoryModules.map((module) => effectiveModuleState(module, availability, navigationAuthority)),
            [directoryModules, availability, navigationAuthority]
          );'''
          )
          replace_once(
              portal,
              '''    return enrichedModules.filter((module) => {
              if (availability.loaded && !isSuperAdministrator && !module.isEnabled) return false;''',
              '''    return enrichedModules.filter((module) => {
              if (module.permissionDenied) return false;
              if (availability.loaded && !isSuperAdministrator && !module.isEnabled) return false;'''
          )
          replace_once(
              portal,
              '''      enrichedModules
                .filter((module) => !availability.loaded || isSuperAdministrator || module.isEnabled)
                .map((module) => module.group)''',
              '''      enrichedModules
                .filter((module) => !module.permissionDenied)
                .filter((module) => !availability.loaded || isSuperAdministrator || module.isEnabled)
                .map((module) => module.group)'''
          )
          replace_once(
              portal,
              '''      {availability.access?.isViewAs ? (
                <div className="module-availability-notice warning">View-As is read-only. Exit preview to change module availability.</div>
              ) : null}
              {statusMessage ?''',
              '''      {availability.access?.isViewAs ? (
                <div className="module-availability-notice warning">View-As is read-only. Exit preview to change module availability.</div>
              ) : null}
              {navigationAuthority.state === 'loading' ? (
                <div className="module-availability-notice warning" role="status">
                  Checking module access for the current effective user. Open actions are paused until verification completes.
                </div>
              ) : navigationAuthority.state === 'unavailable' ? (
                <div className="module-availability-notice warning" role="status">
                  The optional navigation catalog is unavailable. Existing server endpoint authorization remains authoritative, and Pulse will not redirect this View-As session to Dashboard.
                </div>
              ) : null}
              {statusMessage ?'''
          )
          replace_once(
              portal,
              '''                {/* MODULE_065_REACT_OWNED_OPEN_ACTION */}
                {module.moduleNumber === '065' ? (
                  <button''',
              '''                {/* MODULE_065_REACT_OWNED_OPEN_ACTION */}
                {module.permissionPending ? (
                  <button
                    type="button"
                    className="modules-directory-open-link modules-directory-open-button"
                    data-module-open-route={module.route}
                    disabled
                    aria-label={`Access verification pending for Module ${module.moduleNumber} — ${module.label}`}
                  >
                    Checking access…
                  </button>
                ) : module.moduleNumber === '065' ? (
                  <button'''
          )
          replace_once(
              portal,
              '''                    className="modules-directory-open-link modules-directory-open-button"
                    aria-label={`Open Module ${module.moduleNumber} — ${module.label}`}''',
              '''                    className="modules-directory-open-link modules-directory-open-button"
                    data-module-open-route={module.route}
                    aria-label={`Open Module ${module.moduleNumber} — ${module.label}`}'''
          )

          css = 'src/frontend/project-time-web/src/module-availability.css'
          css_path = root / css
          css_text = css_path.read_text()
          if 'SYSTEMWIDE_VIEW_AS_MODULE_NAVIGATION_CONTINUITY' in css_text:
              raise SystemExit('Systemwide View-As navigation styles already exist.')
          css_addition = r'''

          /* SYSTEMWIDE_VIEW_AS_MODULE_NAVIGATION_CONTINUITY */
          .modules-directory-open-button:disabled {
            color: var(--muted) !important;
            cursor: wait !important;
            opacity: 0.72 !important;
            text-decoration: none !important;
          }

          .projectpulse-route-access-notice {
            position: fixed;
            inset: 0;
            z-index: 12050;
            display: grid;
            place-items: center;
            padding: 1.25rem;
            background: color-mix(in srgb, #0f172a 74%, transparent);
            backdrop-filter: blur(6px);
          }

          .projectpulse-route-access-card {
            display: grid;
            gap: 0.85rem;
            width: min(640px, 100%);
            padding: clamp(1.25rem, 3vw, 2rem);
            border: 1px solid var(--border);
            border-radius: 22px;
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 28px 80px color-mix(in srgb, #0f172a 38%, transparent);
          }

          .projectpulse-route-access-eyebrow {
            color: #0b6f7d;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
          }

          .projectpulse-route-access-card h2,
          .projectpulse-route-access-card p {
            margin: 0;
          }

          .projectpulse-route-access-detail,
          .projectpulse-route-access-continuity {
            color: var(--muted);
            line-height: 1.55;
          }

          .projectpulse-route-access-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
          }

          .projectpulse-route-access-actions a {
            display: inline-flex;
            align-items: center;
            min-height: 42px;
            padding: 0.65rem 0.9rem;
            border: 1px solid transparent;
            border-radius: 0.75rem;
            background: #0b6f7d;
            color: #fff;
            font-weight: 850;
            text-decoration: none;
          }

          .projectpulse-route-access-actions a.secondary {
            border-color: var(--border);
            background: var(--surface-strong);
            color: var(--text);
          }
          '''
          css_path.write_text(css_text.rstrip() + css_addition + '\n')

