name: Diagnose PR459 Post-Deploy Module 011 and 065

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr459-postdeploy-source-diagnostic.yml'
      - 'src/**'
      - 'tests/**'
      - 'database/**'
      - 'deployment/**'

permissions:
  contents: read

jobs:
  export-source:
    if: github.event.pull_request.head.ref == 'fix/pr459-postdeploy-module011-065-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/pr459-postdeploy-diagnostic
          git rev-parse HEAD > /tmp/pr459-postdeploy-diagnostic/head.txt
          git status --short > /tmp/pr459-postdeploy-diagnostic/status.txt
          git archive --format=tar.gz --output=/tmp/pr459-postdeploy-diagnostic/repository-source.tar.gz HEAD
          {
            echo '=== App route mount ==='
            grep -n -C 12 "activeRoute === 'work-task-builder'" src/frontend/project-time-web/src/App.jsx || true
            echo '=== App authority helper ==='
            grep -n -C 30 'LIVE_AUTHENTICATED_ROUTE_AUTHORITY_START' src/frontend/project-time-web/src/App.jsx || true
            echo '=== Page context ==='
            grep -n -C 8 "work-task-builder" src/frontend/project-time-web/src/PageContextGuide.jsx || true
            echo '=== Module 065 directory/link ==='
            grep -n -C 12 'modules-directory-open-link' src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx || true
            echo '=== Post-render RBAC guard ==='
            grep -n -C 25 'SUPER_ADMINISTRATOR_ROLE_CODES' src/frontend/project-time-web/src/module-availability-bridge.js || true
            echo '=== Celar AI production injector ==='
            grep -n -C 20 'CELAR_AI_PRODUCTION_PLATFORM_INTEGRATION' src/frontend/project-time-web/scripts/inject-celar-ai-production-platform.mjs || true
          } > /tmp/pr459-postdeploy-diagnostic/focused-source.txt
          sha256sum /tmp/pr459-postdeploy-diagnostic/* > /tmp/pr459-postdeploy-diagnostic/SHA256SUMS.txt

      - name: Upload diagnostic source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr459-postdeploy-source-${{ github.run_id }}
          path: /tmp/pr459-postdeploy-diagnostic
          retention-days: 3
