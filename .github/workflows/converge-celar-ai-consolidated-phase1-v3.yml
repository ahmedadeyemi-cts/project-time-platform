name: Converge Celar AI Consolidated Phase 1 v3

on:
  push:
    branches:
      - feature/ask-celar-ai-troubleshooting-defect-automation-20260810
    paths:
      - '.github/workflows/converge-celar-ai-consolidated-phase1-v3.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: converge-celar-ai-consolidated-phase1-v3
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      CELAR_AI_CONSOLIDATED_PACKAGE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact consolidated branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feature/ask-celar-ai-troubleshooting-defect-automation-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Apply, validate, and publish Phase 1 source
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG=/tmp/celar-phase1-v3.log
          : > "$LOG"
          report_failure() {
            local code=$?
            if [[ $code -eq 0 ]]; then return 0; fi
            python3 - "$code" "$LOG" <<'PY'
          import json, pathlib, sys
          code = sys.argv[1]
          log = pathlib.Path(sys.argv[2]).read_text(errors='replace')[-12000:]
          body = f"""## Celar AI consolidated Phase 1 convergence failed

Exit code: `{code}`

The branch was not deployed or merged. The source publisher stopped at the first failing validation.

<details><summary>Failure log tail</summary>

```text
{log}
```
</details>
"""
          pathlib.Path('/tmp/pr-comment.json').write_text(json.dumps({'body': body}))
          PY
            gh api -X POST repos/ahmedadeyemi-cts/project-time-platform/issues/630/comments --input /tmp/pr-comment.json >/dev/null || true
            exit "$code"
          }
          trap report_failure EXIT

          {
            echo '=== Prepatch deterministic planner block ==='
            python3 - <<'PY'
          from pathlib import Path
          path = Path('src/backend/ProjectTime.Api/Ai/CelarAiUniversalAnswerReliability.cs')
          value = path.read_text()
          start = value.find('        var matchedTools = CelarAiUniversalToolCatalog.Match(normalized, intent, 16).ToList();\n')
          end = value.find('        var deterministic = RequiresDeterministicCalculation(', start)
          if start < 0 or end <= start:
              raise SystemExit(f'PLANNER_BLOCK_NOT_FOUND start={start} end={end}')
          replacement = '''        var matchedTools = CelarAiUniversalToolCatalog.Match(normalized, intent, 16).ToList();
        AddIntentDefaults(intent, normalized, matchedTools);
        AddRequiredTools(questionClass, attachmentCount, matchedTools);
        var selection = CelarAiDeterministicIntentPolicy.Select(
            normalized,
            intent,
            questionClass,
            attachmentCount,
            matchedTools);
        var tools = selection.SelectedTools.ToArray();
'''
          path.write_text(value[:start] + replacement + value[end:])
          PY

            echo '=== Extract and run Phase 1 patch ==='
            awk '
              /python3 - <<.PY./ {capture=1; next}
              capture && /^          PY$/ {exit}
              capture {sub(/^          /, ""); print}
            ' .github/workflows/converge-celar-ai-consolidated-phase1.yml > /tmp/celar-phase1.py
            python3 -m py_compile /tmp/celar-phase1.py
            python3 /tmp/celar-phase1.py

            echo '=== Source syntax checks ==='
            node --check src/frontend/project-time-web/scripts/inject-celar-ai-ask-operations.mjs
            node --check tests/validate-celar-ai-universal-answer-reliability.mjs
            node --check tests/validate-celar-ai-ask-operations-source.mjs
            git diff --check

            echo '=== Reliability source validator ==='
            node tests/validate-celar-ai-universal-answer-reliability.mjs

            echo '=== Operations source validator ==='
            node tests/validate-celar-ai-ask-operations-source.mjs

            echo '=== Reliability behavior tests ==='
            dotnet run --project tests/CelarAiUniversalAnswerReliabilityTests/CelarAiUniversalAnswerReliabilityTests.csproj --configuration Release

            echo '=== Operations policy tests ==='
            dotnet run --project tests/CelarAiOperationsPolicyTests/CelarAiOperationsPolicyTests.csproj --configuration Release

            echo '=== Migration 084 lifecycle tests ==='
            chmod +x tests/test-module-076-celar-ai-defect-operations-migration-084.sh
            tests/test-module-076-celar-ai-defect-operations-migration-084.sh

            echo '=== Full API build ==='
            dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

            echo '=== Full frontend build ==='
            pushd src/frontend/project-time-web >/dev/null
            npm ci --no-audit --no-fund
            npm run build
            popd >/dev/null

            echo '=== Remove temporary convergence and diagnostic controls ==='
            rm -f \
              .github/workflows/converge-celar-ai-consolidated-phase1.yml \
              .github/workflows/converge-celar-ai-consolidated-phase1-v3.yml \
              .github/workflows/diagnose-celar-ai-consolidated-phase1.yml \
              .github/workflows/diagnose-celar-ai-consolidated-phase1-v2.yml

            git config user.name 'Pulse Celar AI Consolidation Automation'
            git config user.email 'pulse-celar-ai-consolidation@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'feat: consolidate deterministic Celar AI reliability and operations governance'
            git push origin HEAD:feature/ask-celar-ai-troubleshooting-defect-automation-20260810
          } 2>&1 | tee "$LOG"

          trap - EXIT
          python3 <<'PY'
          import json, pathlib
          body = """## Celar AI consolidated Phase 1 convergence passed

The deterministic intent/tool policy, adapter registry, capability manifest, evidence receipts, typed evidence policy, server-side operational router, effective-user read scope, split monitor controls, and stable incident fingerprint changes passed their source, behavior, migration, API, and frontend checks and were committed to PR #630.

No Test or Production deployment occurred. Migration 084 was validated only against the disposable CI PostgreSQL service.
"""
          pathlib.Path('/tmp/pr-comment.json').write_text(json.dumps({'body': body}))
          PY
          gh api -X POST repos/ahmedadeyemi-cts/project-time-platform/issues/630/comments --input /tmp/pr-comment.json >/dev/null
