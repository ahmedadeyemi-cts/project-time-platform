name: Temporary Current Integration Bundle V2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/current-integration-bundle-v2-trigger'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch all branches and pull-request heads
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin --prune --no-tags \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/pull/*/head:refs/remotes/pull/*'
          git show-ref | sort > current-integration-v2-refs.txt
          git bundle create current-integration-v2.bundle --all
          git bundle verify current-integration-v2.bundle
          sha256sum current-integration-v2.bundle current-integration-v2-refs.txt > SHA256SUMS

      - name: Upload exact current integration bundle
        uses: actions/upload-artifact@v4
        with:
          name: current-integration-v2-${{ github.run_id }}
          path: |
            current-integration-v2.bundle
            current-integration-v2-refs.txt
            SHA256SUMS
          retention-days: 1
