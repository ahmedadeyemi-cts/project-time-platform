name: ProjectPulse Test-Only Module 083 Full Future Loop eedf635

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/projectpulse-deploy-module083-test.yml'
      - 'scripts/release-test/apply-module-083-full-future-loop-082.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectpulse-deploy-module083-test.yml'
      - 'scripts/release-test/apply-module-083-full-future-loop-082.sh'

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-test
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    name: Validate guarded Module 083 Test controller
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate controller and migration boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .github/workflows/projectpulse-deploy-module083-test.yml
          test -f scripts/release-test/apply-module-083-full-future-loop-082.sh
          test -f scripts/release-test/run-migration-job.sh
          test -f database/migrations/082_module_083_full_future_loop.sql
          test -f src/backend/ProjectTime.Api/Modules/FullFutureLoopModule.cs
          test -f src/frontend/project-time-web/src/FullFutureLoopCenter.jsx
          test -f src/frontend/project-time-web/src/pulse-shell-frontend-compatibility.js
          test -f src/frontend/project-time-web/src/pulse-shell-frontend-compatibility.css
          bash -n scripts/release-test/apply-module-083-full-future-loop-082.sh
          bash -n scripts/release-test/run-migration-job.sh
          grep -Fq 'TARGET_RELEASE_COMMIT: eedf635ea53f527c9cefa2b7bc6fb1e1e5f190f5' .github/workflows/projectpulse-deploy-module083-test.yml
          grep -Fq '082_module_083_full_future_loop.sql' scripts/release-test/apply-module-083-full-future-loop-082.sh
          node src/frontend/project-time-web/scripts/validate-module-083-full-future-loop.mjs
          git diff --exit-code
          echo 'MODULE_083_TEST_CONTROLLER_VALIDATION=PASSED'
          echo 'MIGRATION_SCOPE=082_MODULE_083_ONLY'
          echo 'PRODUCTION_CHANGES=NONE'

  deploy:
    name: Apply migration 082 and deploy Module 083 to protected Test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TARGET_RELEASE_COMMIT: eedf635ea53f527c9cefa2b7bc6fb1e1e5f190f5
      EVIDENCE_DIR: ${{ runner.temp }}/module083-test-evidence

    steps:
      - name: Check out deployment controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact application release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: eedf635ea53f527c9cefa2b7bc6fb1e1e5f190f5
          path: release
          fetch-depth: 1
          persist-credentials: false

      - name: Guard exact source, migration, and Test-only boundary
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ github.event_name }}' == push ]]
          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          RELEASE_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == '${{ github.sha }}' ]]
          [[ "$RELEASE_COMMIT" == "$TARGET_RELEASE_COMMIT" ]]
          git -C control merge-base --is-ancestor "$RELEASE_COMMIT" "$CONTROL_COMMIT"

          test -f release/database/migrations/082_module_083_full_future_loop.sql
          test -f release/src/backend/ProjectTime.Api/Modules/FullFutureLoopModule.cs
          test -f release/src/frontend/project-time-web/src/FullFutureLoopCenter.jsx
          test -f release/src/frontend/project-time-web/src/full-future-loop-center.css
          test -f release/src/frontend/project-time-web/src/pulse-shell-frontend-compatibility.js
          test -f release/src/frontend/project-time-web/src/pulse-shell-frontend-compatibility.css
          test -f release/src/frontend/project-time-web/scripts/validate-module-083-full-future-loop.mjs
          test -f control/scripts/release-test/apply-module-083-full-future-loop-082.sh
          test -f control/scripts/release-test/run-migration-job.sh
          test -f control/deployment/containers/pr55-migrator/Dockerfile
          test -f control/scripts/build-pr55-acr-image.sh
          test -f control/scripts/wait-containerapp-ready-revision.sh

          bash -n control/scripts/release-test/apply-module-083-full-future-loop-082.sh
          bash -n control/scripts/release-test/run-migration-job.sh
          grep -Fq 'MapFullFutureLoopEndpoints' release/src/backend/ProjectTime.Api/Modules/FullFutureLoopModule.cs
          grep -Fq 'endpoints.MapFullFutureLoopEndpoints();' release/src/backend/ProjectTime.Api/Modules/ReleaseDeploymentControlModule.cs
          grep -Fq "route: 'full-future-loop'" release/src/frontend/project-time-web/src/App.jsx
          grep -Fq "import './pulse-shell-frontend-compatibility.js';" release/src/frontend/project-time-web/src/main.jsx
          grep -Fq "import './pulse-shell-frontend-compatibility.css';" release/src/frontend/project-time-web/src/main.jsx
          (cd release && node src/frontend/project-time-web/scripts/validate-module-083-full-future-loop.mjs)
          git -C release diff --exit-code

          install -d -m 0700 "$EVIDENCE_DIR"
          jq -n \
            --arg controlCommit "$CONTROL_COMMIT" \
            --arg releaseCommit "$RELEASE_COMMIT" \
            --arg migration 082_module_083_full_future_loop \
            '{controlCommit:$controlCommit,releaseCommit:$releaseCommit,migration:$migration,environment:"test",productionChanges:false,privateRuntimeActivation:false}' \
            > "$EVIDENCE_DIR/release-boundary.json"

          echo "control_commit=$CONTROL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'MIGRATION_SCOPE=082_MODULE_083_ONLY'
          echo 'OPEN_CLOUD_PRIVATE_RUNTIME=DEFERRED'
          echo 'PRODUCTION_CHANGES=NONE'

      - name: Sign in to the protected Test subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve protected Test contracts and prove UAT session
        id: contract
        shell: bash
        env:
          UAT_SESSION: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          current_env() {
            jq -r --arg name "$1" '[.properties.template.containers[0].env[]? | select(.name == $name) | .value // empty] | if length == 1 then .[0] else empty end' <<<"$API_JSON"
          }
          current_secret_ref() {
            jq -r --arg name "$1" '[.properties.template.containers[0].env[]? | select(.name == $name) | .secretRef // empty] | if length == 1 then .[0] else empty end' <<<"$API_JSON"
          }
          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) fail "Rollback image is outside the approved ACR: $image" ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv --only-show-errors)"
            [[ "$digest" == sha256:* ]] || fail "Could not resolve rollback digest for $image."
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          CURRENT_SUBSCRIPTION="$(az account show --query id -o tsv --only-show-errors)"
          [[ "${CURRENT_SUBSCRIPTION,,}" == "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]] || fail 'Azure login is outside Test.'
          API_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          WEB_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' -o json --only-show-errors)"
          [[ "$(jq -r '.tags.environment // empty' <<<"$API_JSON")" == test ]] || fail 'The API is not tagged as Test.'
          [[ "$(jq -r '.tags.environment // empty' <<<"$WEB_JSON")" == test ]] || fail 'The web app is not tagged as Test.'
          [[ "$(jq -r '.properties.configuration.activeRevisionsMode' <<<"$API_JSON" | tr '[:upper:]' '[:lower:]')" == single ]] || fail 'The API is not in single-revision mode.'
          [[ "$(jq -r '.properties.configuration.activeRevisionsMode' <<<"$WEB_JSON" | tr '[:upper:]' '[:lower:]')" == single ]] || fail 'The web app is not in single-revision mode.'
          [[ -n "$UAT_SESSION" ]] || fail 'PROJECTPULSE_TEST_UAT_SESSION is required.'

          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          [[ "$BASE" == https://phd-west-test.onenecklab.com ]] || fail 'The public origin is not the protected Test site.'
          HTTP_STATUS="$(curl -sS --max-time 45 -o "$EVIDENCE_DIR/preflight-readiness.json" -w '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            -H "Authorization: Bearer $UAT_SESSION" \
            -H "X-ProjectPulse-Session: $UAT_SESSION" \
            -H 'X-ProjectPulse-Module-Number: 011' \
            "$BASE/api/celar-ai/v1/production/readiness")"
          [[ "$HTTP_STATUS" == 200 ]] || fail 'The Test UAT session is expired or unauthorized.'

          DATABASE_HOST="$(current_env PTP_DB_HOST)"
          DATABASE_PORT="$(current_env PTP_DB_PORT)"
          DATABASE_NAME="$(current_env PTP_DB_NAME)"
          DATABASE_USER="$(current_env PTP_DB_USER)"
          PASSWORD_SECRET_REF="$(current_secret_ref PTP_DB_PASSWORD)"
          OLD_SOURCE_COMMIT="$(current_env PROJECTPULSE_SOURCE_COMMIT)"
          [[ "$DATABASE_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}[A-Za-z0-9]$ ]]
          [[ "$DATABASE_PORT" =~ ^[0-9]{1,5}$ ]] && (( DATABASE_PORT >= 1 && DATABASE_PORT <= 65535 ))
          [[ "$DATABASE_NAME" =~ ^[A-Za-z_][A-Za-z0-9_]{0,62}$ ]]
          [[ "$DATABASE_USER" =~ ^[A-Za-z_][A-Za-z0-9_]{0,62}$ ]]
          [[ -n "$PASSWORD_SECRET_REF" ]] || fail 'The database password secret reference is absent.'
          [[ "$OLD_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail 'The currently deployed Test source commit is not an exact commit.'

          SECRET_JSON="$(az containerapp secret list -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          KEY_VAULT_SECRET_URI="$(jq -r --arg name "$PASSWORD_SECRET_REF" '[.[] | select(.name == $name) | .keyVaultUrl // empty] | if length == 1 then .[0] else empty end' <<<"$SECRET_JSON")"
          MIGRATOR_IDENTITY="$(jq -r --arg name "$PASSWORD_SECRET_REF" '[.[] | select(.name == $name) | .identity // empty] | if length == 1 then .[0] else empty end' <<<"$SECRET_JSON")"
          [[ "$KEY_VAULT_SECRET_URI" =~ ^https://[a-z0-9-]+\.vault\.azure\.net/secrets/[A-Za-z0-9-]+(/[0-9A-Fa-f]{32})?$ ]] || fail 'The database password is not an exact Key Vault reference.'
          [[ "${MIGRATOR_IDENTITY,,}" =~ ^/subscriptions/[^/]+/resourcegroups/[^/]+/providers/microsoft\.managedidentity/userassignedidentities/[^/]+$ ]] || fail 'The migrator identity is invalid.'
          jq -e --arg identity "$MIGRATOR_IDENTITY" '(.identity.userAssignedIdentities // {}) | keys | map(ascii_downcase) | index($identity | ascii_downcase) != null' <<<"$API_JSON" >/dev/null || fail 'The migrator identity is not assigned to the Test API.'

          jq '[.properties.template.containers[0].env[]? | select(.name | test("^PROJECTPULSE_(PRIVATE_|PULSE_AI_PRIVATE_|PULSE_AI_DOCUMENT_|PULSE_AI_CLAMAV|UPLOAD_ROOT)"))] | sort_by(.name)' <<<"$API_JSON" > "$EVIDENCE_DIR/private-runtime-before.json"
          RAW_API_IMAGE="$(jq -r '.properties.template.containers[0].image' <<<"$API_JSON")"
          RAW_WEB_IMAGE="$(jq -r '.properties.template.containers[0].image' <<<"$WEB_JSON")"
          OLD_API_IMAGE="$(resolve_digest "$RAW_API_IMAGE")"
          OLD_WEB_IMAGE="$(resolve_digest "$RAW_WEB_IMAGE")"

          echo "old_api_image=$OLD_API_IMAGE" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$OLD_WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo "old_source_commit=$OLD_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "migrator_identity=$MIGRATOR_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "key_vault_uri=${KEY_VAULT_SECRET_URI%%/secrets/*}" >> "$GITHUB_OUTPUT"
          echo "database_password_secret_name=${KEY_VAULT_SECRET_URI#*/secrets/}" >> "$GITHUB_OUTPUT"
          echo "database_host=$DATABASE_HOST" >> "$GITHUB_OUTPUT"
          echo "database_port=$DATABASE_PORT" >> "$GITHUB_OUTPUT"
          echo "database_name=$DATABASE_NAME" >> "$GITHUB_OUTPUT"
          echo "database_user=$DATABASE_USER" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg publicUrl "$BASE" \
            --arg oldSourceCommit "$OLD_SOURCE_COMMIT" \
            --arg oldApiImage "$OLD_API_IMAGE" \
            --arg oldWebImage "$OLD_WEB_IMAGE" \
            '{environment:"test",publicUrl:$publicUrl,oldSourceCommit:$oldSourceCommit,oldApiImage:$oldApiImage,oldWebImage:$oldWebImage,uatSessionValidated:true}' \
            > "$EVIDENCE_DIR/test-contract.json"

      - name: Build checksum-pinned Module 083 migration 082 image
        id: migration
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/module083-082-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          install -m 0644 control/deployment/containers/pr55-migrator/Dockerfile "$CONTEXT/Dockerfile"
          install -m 0755 control/scripts/release-test/apply-module-083-full-future-loop-082.sh "$CONTEXT/apply-pr55-test-migrations.sh"
          install -m 0644 release/database/migrations/082_module_083_full_future_loop.sql "$CONTEXT/migrations/082_module_083_full_future_loop.sql"
          (cd "$CONTEXT/migrations" && sha256sum 082_module_083_full_future_loop.sql > SHA256SUMS)
          printf '%s\n' "$TARGET_RELEASE_COMMIT" > "$CONTEXT/release-commit"
          DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-module083-082:$TARGET_RELEASE_COMMIT-${GITHUB_RUN_ID}" "$CONTEXT/Dockerfile" "$CONTEXT")"
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-module083-082@$DIGEST" >> "$GITHUB_OUTPUT"
          jq -n --arg image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-module083-082@$DIGEST" '{migrationImage:$image,checksumPinned:true,migration:"082_module_083_full_future_loop"}' > "$EVIDENCE_DIR/migration-image.json"

      - name: Apply and verify migration 082 inside the private Test network
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID: ${{ steps.contract.outputs.migrator_identity }}
          AZURE_KEY_VAULT_URI: ${{ steps.contract.outputs.key_vault_uri }}
          PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME: ${{ steps.contract.outputs.database_password_secret_name }}
          PROJECTPULSE_TEST_DATABASE_HOST: ${{ steps.contract.outputs.database_host }}
          PROJECTPULSE_TEST_DATABASE_PORT: ${{ steps.contract.outputs.database_port }}
          PROJECTPULSE_TEST_DATABASE_NAME: ${{ steps.contract.outputs.database_name }}
          PROJECTPULSE_TEST_DATABASE_USER: ${{ steps.contract.outputs.database_user }}
          MAIN_RELEASE_CONTROL_SHA: ${{ steps.release.outputs.control_commit }}
          MAIN_RELEASE_EXPECTED_RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          MAIN_RELEASE_MIGRATION_SCOPE: module-083-full-future-loop-082-test
          MAIN_RELEASE_MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
        run: |
          set -Eeuo pipefail
          MAIN_RELEASE_MIGRATION_JOB_NAME="ffl82-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-a" MAIN_RELEASE_MIGRATION_MODE=apply bash control/scripts/release-test/run-migration-job.sh
          MAIN_RELEASE_MIGRATION_JOB_NAME="ffl82-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-v" MAIN_RELEASE_MIGRATION_MODE=verify bash control/scripts/release-test/run-migration-job.sh
          jq -n --arg status verified --arg migration 082_module_083_full_future_loop '{status:$status,migration:$migration,privateNetworkExecution:true,temporaryJobsCleaned:true}' > "$EVIDENCE_DIR/migration-verification.json"

      - name: Build immutable API and web images from eedf635
        id: build
        shell: bash
        working-directory: release
        run: |
          set -Eeuo pipefail
          API_DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-api:module083-$TARGET_RELEASE_COMMIT-${GITHUB_RUN_ID}" deployment/containers/api/Dockerfile .)"
          WEB_DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-web:module083-$TARGET_RELEASE_COMMIT-${GITHUB_RUN_ID}" deployment/containers/web/Dockerfile .)"
          API_IMAGE="${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-api@$API_DIGEST"
          WEB_IMAGE="${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-web@$WEB_DIGEST"
          echo "api_image=$API_IMAGE" >> "$GITHUB_OUTPUT"
          echo "web_image=$WEB_IMAGE" >> "$GITHUB_OUTPUT"
          jq -n --arg apiImage "$API_IMAGE" --arg webImage "$WEB_IMAGE" --arg releaseCommit "$TARGET_RELEASE_COMMIT" '{apiImage:$apiImage,webImage:$webImage,releaseCommit:$releaseCommit,immutableDigests:true}' > "$EVIDENCE_DIR/release-images.json"

      - name: Deploy API image without private-runtime activation
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_SOURCE_COMMIT="$TARGET_RELEASE_COMMIT" \
            --revision-suffix "ffl83a-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none --only-show-errors
          REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
          bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_API_APP }}' "$REVISION" '${{ steps.build.outputs.api_image }}' 60 10
          AFTER_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          SOURCE_COMMIT_AFTER="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$AFTER_JSON")"
          [[ "$SOURCE_COMMIT_AFTER" == "$TARGET_RELEASE_COMMIT" ]]
          jq '[.properties.template.containers[0].env[]? | select(.name | test("^PROJECTPULSE_(PRIVATE_|PULSE_AI_PRIVATE_|PULSE_AI_DOCUMENT_|PULSE_AI_CLAMAV|UPLOAD_ROOT)"))] | sort_by(.name)' <<<"$AFTER_JSON" > "$EVIDENCE_DIR/private-runtime-after.json"
          diff -u "$EVIDENCE_DIR/private-runtime-before.json" "$EVIDENCE_DIR/private-runtime-after.json"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy web image
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "ffl83w-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none --only-show-errors
          REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
          bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_WEB_APP }}' "$REVISION" '${{ steps.build.outputs.web_image }}' 60 10
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Validate Module 083 complete loop and Pulse shell on Test
        id: uat
        shell: bash
        env:
          UAT_SESSION: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          require_json() {
            local file="$1" label="$2"
            [[ -s "$file" ]] || fail "$label returned an empty response."
            jq -e . "$file" >/dev/null 2>&1 || fail "$label returned invalid JSON."
          }
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          auth083=(-H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" -H 'X-ProjectPulse-Module-Number: 083')
          auth082=(-H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" -H 'X-ProjectPulse-Module-Number: 082')

          READY=false
          for attempt in $(seq 1 36); do
            if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$BASE/health?module083=$GITHUB_RUN_ID-$attempt" >/dev/null; then
              READY=true
              break
            fi
            sleep 10
          done
          [[ "$READY" == true ]] || fail 'The public Test health endpoint did not become ready.'

          CAPABILITIES_FILE="$EVIDENCE_DIR/module-083-capabilities.json"
          CAPABILITIES_STATUS="$(curl -sS --max-time 60 -o "$CAPABILITIES_FILE" -w '%{http_code}' -H 'Cache-Control: no-cache' "${auth083[@]}" "$BASE/api/full-future-loop/capabilities")"
          [[ "$CAPABILITIES_STATUS" == 200 ]] || fail 'Module 083 capabilities are unavailable.'
          require_json "$CAPABILITIES_FILE" 'Module 083 capabilities'
          jq -e '
            .module == "083" and
            .route == "full-future-loop" and
            .contractVersion == "083-full-future-loop-sandbox-v1" and
            .mode == "safe_persistent_sandbox" and
            (.boundaries | length) >= 7
          ' "$CAPABILITIES_FILE" >/dev/null || fail 'Module 083 capability contract is incomplete.'

          ACCESS_FILE="$EVIDENCE_DIR/module-083-access.json"
          ACCESS_STATUS="$(curl -sS --max-time 60 -o "$ACCESS_FILE" -w '%{http_code}' -H 'Cache-Control: no-cache' "${auth083[@]}" "$BASE/api/full-future-loop/access")"
          [[ "$ACCESS_STATUS" == 200 ]] || { cat "$ACCESS_FILE" >&2 || true; fail 'Module 083 access is unavailable.'; }
          require_json "$ACCESS_FILE" 'Module 083 access'
          jq -e '
            .module == "083" and
            .contractVersion == "083-full-future-loop-sandbox-v1" and
            .status == "ready" and
            .dataReady == true and
            .scope.isViewAs == false and
            .permissions.canView == true and
            .permissions.canRunSandbox == true and
            .permissions.canManage == true and
            .safety.environment == "sandbox" and
            .safety.productionMutationEnabled == false and
            .safety.githubMutationEnabled == false and
            .safety.cloudMutationEnabled == false and
            .safety.secretAccessEnabled == false
          ' "$ACCESS_FILE" >/dev/null || fail 'Module 083 did not resolve a ready, manageable sandbox scope.'

          SUMMARY_FILE="$EVIDENCE_DIR/module-083-summary-before.json"
          SUMMARY_STATUS="$(curl -sS --max-time 60 -o "$SUMMARY_FILE" -w '%{http_code}' -H 'Cache-Control: no-cache' "${auth083[@]}" "$BASE/api/full-future-loop/summary")"
          [[ "$SUMMARY_STATUS" == 200 ]] || fail 'Module 083 summary is unavailable.'
          require_json "$SUMMARY_FILE" 'Module 083 summary'

          CREATE_FILE="$EVIDENCE_DIR/module-083-created-loop.json"
          CREATE_PAYLOAD="$(jq -nc \
            --arg title "Release UAT $GITHUB_RUN_ID" \
            --arg description "Automated protected Test verification for Module 083 release $TARGET_RELEASE_COMMIT." \
            --arg sourceCommit "$TARGET_RELEASE_COMMIT" \
            '{title:$title,description:$description,changeType:"major",selectiveGovernance:true,sourceRepository:"ahmedadeyemi-cts/project-time-platform",sourceBranch:"main",sourceCommit:$sourceCommit}')"
          CREATE_STATUS="$(curl -sS --max-time 90 -o "$CREATE_FILE" -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'Content-Type: application/json' -H "Origin: $BASE" "${auth083[@]}" -d "$CREATE_PAYLOAD" "$BASE/api/full-future-loop/loops")"
          [[ "$CREATE_STATUS" == 201 ]] || { cat "$CREATE_FILE" >&2 || true; fail 'Module 083 could not create a protected Test loop.'; }
          require_json "$CREATE_FILE" 'Module 083 create loop'
          LOOP_ID="$(jq -r '.loop.loopId // empty' "$CREATE_FILE")"
          [[ "$LOOP_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || fail 'Module 083 did not return a loop identifier.'
          jq -e '.status == "created" and .loop.currentStage == "governance_pending" and .loop.environment == "sandbox" and .loop.canRun == true' "$CREATE_FILE" >/dev/null || fail 'The created Module 083 loop is not in the governed initial state.'

          RUN_FILE="$EVIDENCE_DIR/module-083-complete-loop.json"
          RUN_STATUS="$(curl -sS --max-time 180 -o "$RUN_FILE" -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'Content-Type: application/json' -H "Origin: $BASE" "${auth083[@]}" -d '{}' "$BASE/api/full-future-loop/loops/$LOOP_ID/run-full-sandbox")"
          [[ "$RUN_STATUS" == 200 ]] || { cat "$RUN_FILE" >&2 || true; fail 'The Module 083 complete sandbox loop failed.'; }
          require_json "$RUN_FILE" 'Module 083 complete loop'
          jq -e '
            .status == "full_sandbox_loop_completed" and
            .loop.currentStage == "verified_closed" and
            .loop.currentStatus == "closed" and
            .loop.environment == "sandbox" and
            (.actionsExecuted | length) == 10 and
            .safety.productionMutationEnabled == false and
            .safety.githubMutationEnabled == false and
            .safety.deploymentControllerExecutionEnabled == false and
            .safety.cloudMutationEnabled == false and
            .safety.secretAccessEnabled == false
          ' "$RUN_FILE" >/dev/null || fail 'The Module 083 full-loop result violated the expected closed sandbox contract.'

          AGENT_FILE="$EVIDENCE_DIR/module-083-agent-keep.json"
          AGENT_PAYLOAD='{"question":"What is the current state and what can Agent Keep access?","openSupportIssue":false}'
          AGENT_STATUS="$(curl -sS --max-time 90 -o "$AGENT_FILE" -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'Content-Type: application/json' -H "Origin: $BASE" "${auth083[@]}" -d "$AGENT_PAYLOAD" "$BASE/api/full-future-loop/loops/$LOOP_ID/agent-keep")"
          [[ "$AGENT_STATUS" == 200 ]] || fail 'Module 083 Agent Keep guidance failed.'
          require_json "$AGENT_FILE" 'Module 083 Agent Keep'
          jq -e '.status == "agent_keep_answered" and .issueOpened == false and (.answer | contains("cannot read private source")) and (.restrictions | length) >= 4' "$AGENT_FILE" >/dev/null || fail 'Agent Keep exceeded or failed to explain its evidence boundary.'

          HISTORY_FILE="$EVIDENCE_DIR/module-083-history.json"
          HISTORY_STATUS="$(curl -sS --max-time 90 -o "$HISTORY_FILE" -w '%{http_code}' -H 'Cache-Control: no-cache' "${auth083[@]}" "$BASE/api/full-future-loop/loops/$LOOP_ID/history")"
          [[ "$HISTORY_STATUS" == 200 ]] || fail 'Module 083 immutable history is unavailable.'
          require_json "$HISTORY_FILE" 'Module 083 history'
          jq -e '
            .module == "083" and
            .immutable == true and
            (.events | length) >= 11 and
            (.artifacts | length) >= 13 and
            all(.artifacts[]; .isReadOnly == true) and
            any(.events[]; .eventCode == "verify_close" and .toStage == "verified_closed") and
            any(.artifacts[]; .artifactCode == "complete_sandbox_run" and .status == "passed")
          ' "$HISTORY_FILE" >/dev/null || fail 'Module 083 append-only event and artifact evidence is incomplete.'

          MODULE_082_FILE="$EVIDENCE_DIR/module-082-postrelease-access.json"
          MODULE_082_STATUS="$(curl -sS --max-time 60 -o "$MODULE_082_FILE" -w '%{http_code}' -H 'Cache-Control: no-cache' "${auth082[@]}" "$BASE/api/project-risk-register/access")"
          [[ "$MODULE_082_STATUS" == 200 ]] || { cat "$MODULE_082_FILE" >&2 || true; fail 'Module 082 browser-context release compatibility failed.'; }
          require_json "$MODULE_082_FILE" 'Module 082 access'
          jq -e '.module == "082" and .status == "ready" and .dataReady == true and .scope.isViewAs == false' "$MODULE_082_FILE" >/dev/null || fail 'Module 082 effective scope is not ready after the release.'

          PORTAL_HTML="$EVIDENCE_DIR/test-portal.html"
          FRONTEND_BUNDLE="$EVIDENCE_DIR/test-portal-assets.txt"
          curl -fsS --max-time 60 -H 'Cache-Control: no-cache' "$BASE/?module083=$GITHUB_RUN_ID" > "$PORTAL_HTML"
          mapfile -t FRONTEND_ASSETS < <(grep -oE '(src|href)="[^"]+\.(js|css)(\?[^"]*)?"' "$PORTAL_HTML" | sed -E 's/^(src|href)="([^"]+)"$/\2/' | sort -u)
          [[ "${#FRONTEND_ASSETS[@]}" -gt 0 ]] || fail 'The Test portal did not expose frontend assets.'
          : > "$FRONTEND_BUNDLE"
          for asset in "${FRONTEND_ASSETS[@]}"; do
            case "$asset" in
              /assets/*) curl -fsS --max-time 90 -H 'Cache-Control: no-cache' "$BASE$asset" >> "$FRONTEND_BUNDLE" ;;
              *) fail "Unexpected frontend asset path: $asset" ;;
            esac
          done
          grep -Fq 'full-future-loop' "$FRONTEND_BUNDLE" || fail 'The deployed bundle does not contain the Module 083 route.'
          grep -Fq 'Full Future Loop' "$FRONTEND_BUNDLE" || fail 'The deployed bundle does not contain the Module 083 navigation label.'
          grep -Fq 'pulse-header-theme-switcher' "$FRONTEND_BUNDLE" || fail 'The labeled header appearance switcher is absent.'
          grep -Fq 'data-pulse-theme-choice' "$FRONTEND_BUNDLE" || fail 'The Light/Dark appearance choices are absent.'
          grep -Fq 'ptp-theme' "$FRONTEND_BUNDLE" || fail 'The persistent appearance preference is absent.'
          grep -Fq 'X-ProjectPulse-Module-Number' "$FRONTEND_BUNDLE" || fail 'The governed frontend module-context bridge is absent.'
          grep -Fq '/api/project-risk-register' "$FRONTEND_BUNDLE" || fail 'The Module 082 browser-context bridge is absent.'
          grep -Fq 'enterprise-top-bar' "$FRONTEND_BUNDLE" || fail 'The white enterprise top-bar presentation authority is absent.'

          FINAL_SUMMARY_FILE="$EVIDENCE_DIR/module-083-summary-after.json"
          curl -fsS --max-time 60 -H 'Cache-Control: no-cache' "${auth083[@]}" "$BASE/api/full-future-loop/summary" > "$FINAL_SUMMARY_FILE"
          jq -e '.kpis.totalLoops >= 1 and .kpis.verifiedClosed >= 1 and .kpis.activeLoops >= 0' "$FINAL_SUMMARY_FILE" >/dev/null || fail 'Module 083 summary did not reflect the completed Test loop.'

          jq -n \
            --arg releaseCommit "$TARGET_RELEASE_COMMIT" \
            --arg loopId "$LOOP_ID" \
            --arg apiRevision '${{ steps.deploy_api.outputs.revision }}' \
            --arg webRevision '${{ steps.deploy_web.outputs.revision }}' \
            --argjson frontendAssetCount "${#FRONTEND_ASSETS[@]}" \
            '{status:"passed",releaseCommit:$releaseCommit,loopId:$loopId,apiRevision:$apiRevision,webRevision:$webRevision,frontendAssetCount:$frontendAssetCount,module083Ready:true,completeLoopVerified:true,module082Ready:true,pulseShellVerified:true,productionChanges:false}' \
            > "$EVIDENCE_DIR/final-uat-summary.json"

      - name: Roll back Test images after a release-blocking failure
        if: ${{ failure() && steps.contract.outcome == 'success' && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ '${{ steps.deploy_api.outputs.started }}' == true ]]; then
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
              --image '${{ steps.contract.outputs.old_api_image }}' \
              --set-env-vars PROJECTPULSE_SOURCE_COMMIT='${{ steps.contract.outputs.old_source_commit }}' \
              --revision-suffix "ffl83rba-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --output none --only-show-errors
            API_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
            bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_API_APP }}' "$API_REVISION" '${{ steps.contract.outputs.old_api_image }}' 60 10
          fi
          if [[ '${{ steps.deploy_web.outputs.started }}' == true ]]; then
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
              --image '${{ steps.contract.outputs.old_web_image }}' \
              --revision-suffix "ffl83rbw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --output none --only-show-errors
            WEB_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
            bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_WEB_APP }}' "$WEB_REVISION" '${{ steps.contract.outputs.old_web_image }}' 60 10
          fi
          jq -n \
            --arg oldSourceCommit '${{ steps.contract.outputs.old_source_commit }}' \
            '{status:"images_rolled_back",oldSourceCommit:$oldSourceCommit,migration082Retained:true,reason:"additive backward-compatible schema retained for diagnosis"}' \
            > "$EVIDENCE_DIR/rollback-summary.json"
          echo 'TEST_IMAGES_ROLLED_BACK=TRUE'
          echo 'MIGRATION_082_RETAINED=TRUE'

      - name: Upload protected Test deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-083-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/module083-test-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Module 083 protected Test release'
            echo
            echo "- Release commit: \`$TARGET_RELEASE_COMMIT\`"
            echo '- Migration scope: `082_module_083_full_future_loop` only'
            echo '- Environment: Test only'
            echo '- Production changes: none'
            echo '- Private-runtime activation: none'
            if [[ -f "$EVIDENCE_DIR/final-uat-summary.json" ]]; then
              echo '- UAT: passed'
              echo '- Module 083 complete sandbox loop: verified'
              echo '- Module 082 browser context and Pulse shell: verified'
            else
              echo '- UAT: did not complete successfully; inspect the evidence artifact and rollback summary'
            fi
          } >> "$GITHUB_STEP_SUMMARY"