name: PR 680 Safe Frontend Build Repair V3

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/pr680-auto-repair-v3.yml

permissions:
  contents: write

concurrency:
  group: pr680-safe-frontend-repair-v3
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/systemwide-enterprise-reliability-final-20260814
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Install exact frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Isolate only the build-breaking hunk and preserve required contracts
        shell: bash
        env:
          TARGET_BRANCH: fix/systemwide-enterprise-reliability-final-20260814
        run: |
          set -Eeuo pipefail
          git fetch origin main "$TARGET_BRANCH" --no-tags
          HEAD_SHA="$(git rev-parse HEAD)"
          BASE_REF='origin/main'
          export HEAD_SHA BASE_REF

          python3 - <<'PY'
          from __future__ import annotations

          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          repo = Path.cwd()
          frontend = repo / 'src/frontend/project-time-web'
          head_sha = os.environ['HEAD_SHA']
          base_ref = os.environ['BASE_REF']
          evidence = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'pr680-safe-repair-v3'
          evidence.mkdir(parents=True, exist_ok=True)

          def run(cmd: list[str], *, cwd: Path = repo, timeout: int = 1800):
              return subprocess.run(
                  cmd,
                  cwd=cwd,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )

          def require(cmd: list[str], *, cwd: Path = repo, timeout: int = 1800):
              proc = run(cmd, cwd=cwd, timeout=timeout)
              if proc.returncode != 0:
                  raise SystemExit(f"Command failed ({proc.returncode}): {' '.join(cmd)}\n{proc.stdout[-10000:]}")
              return proc

          def reset() -> None:
              require(['git', 'reset', '--hard', head_sha])
              require(['git', 'clean', '-fd'])

          def normalize_main() -> bool:
              path = frontend / 'src/main.jsx'
              original = path.read_text()
              reliability = "import './enterprise-systemwide-reliability.css';"
              contrast = "import './enterprise-contrast-guard.css';"
              lines = original.splitlines()
              deduped = []
              seen = set()
              for line in lines:
                  if line in (reliability, contrast):
                      if line in seen:
                          continue
                      seen.add(line)
                  deduped.append(line)
              lines = deduped
              lines = [line for line in lines if line not in (reliability, contrast)]
              css_positions = [i for i, line in enumerate(lines) if line.startswith("import '") and line.endswith(".css';")]
              insert_at = (max(css_positions) + 1) if css_positions else 0
              lines[insert_at:insert_at] = [reliability, contrast]
              updated = '\n'.join(lines) + ('\n' if original.endswith('\n') else '')
              if updated != original:
                  path.write_text(updated)
                  return True
              return False

          def full_build(label: str) -> tuple[bool, str]:
              proc = run(['npm', 'run', 'build'], cwd=frontend, timeout=2100)
              (evidence / f'{label}.log').write_text(proc.stdout)
              return proc.returncode == 0, proc.stdout

          def release_contracts(label: str) -> bool:
              commands = (
                  ['node', 'tests/validate-systemwide-enterprise-reliability.mjs'],
                  ['node', 'tests/validate-celar-ai-flowhive-authoritative-release.mjs'],
                  ['bash', 'scripts/validate-module-033-project-forge-interactive.sh'],
              )
              for index, command in enumerate(commands):
                  proc = run(command, timeout=600)
                  (evidence / f'{label}-contract-{index}.log').write_text(proc.stdout)
                  if proc.returncode != 0:
                      return False
              check = run(['git', 'diff', '--check'])
              (evidence / f'{label}-diff-check.log').write_text(check.stdout)
              return check.returncode == 0

          def complete_candidate(label: str) -> bool:
              ok, _ = full_build(label)
              return ok and release_contracts(label)

          reset()
          if normalize_main() and complete_candidate('normalized-main'):
              reset()
              normalize_main()
              (evidence / 'selected.patch').write_text(require(['git', 'diff', '--binary']).stdout)
              (evidence / 'result.txt').write_text('repair=normalized-main-import-order\n')
              sys.exit(0)
          reset()

          baseline_ok, baseline_log = full_build('baseline')
          if baseline_ok:
              reset()
              (evidence / 'result.txt').write_text('repair=not-required-build-already-green\n')
              sys.exit(0)
          reset()

          changed = require([
              'git', 'diff', '--name-only', f'{base_ref}...{head_sha}', '--',
              'src/frontend/project-time-web/src',
              'src/frontend/project-time-web/scripts',
          ]).stdout.splitlines()
          candidates = [
              path for path in changed
              if path.endswith(('.js', '.jsx', '.css', '.mjs'))
              and not path.endswith('App.Module001.g.jsx')
          ]
          priority = {
              'src/frontend/project-time-web/src/main.jsx': 0,
              'src/frontend/project-time-web/src/enterprise-systemwide-reliability.css': 1,
              'src/frontend/project-time-web/src/EnterpriseExperienceController.jsx': 2,
              'src/frontend/project-time-web/src/HelpAssistant.jsx': 3,
              'src/frontend/project-time-web/src/ProjectFlowHiveCenter.jsx': 4,
              'src/frontend/project-time-web/src/ProjectForgeFlowHiveSyncPortal.jsx': 5,
              'src/frontend/project-time-web/src/CostOverrunAlertCenter.jsx': 6,
              'src/frontend/project-time-web/src/AuditHistoryPanel.jsx': 7,
              'src/frontend/project-time-web/src/BillingReadinessCenter.jsx': 8,
              'src/frontend/project-time-web/src/enterprise/SalesDeliveryWorkflowCenter.jsx': 9,
              'src/frontend/project-time-web/scripts/repair-module-066-generated-jsx.mjs': 10,
          }
          candidates.sort(key=lambda path: (priority.get(path, 100), path))

          # Whole-file reversion is diagnostic only. It is never selected for
          # commit and therefore cannot remove a required feature wholesale.
          culprit = None
          for index, path in enumerate(candidates):
              reset()
              on_base = run(['git', 'cat-file', '-e', f'{base_ref}:{path}']).returncode == 0
              if on_base:
                  require(['git', 'checkout', base_ref, '--', path])
              else:
                  Path(path).unlink(missing_ok=True)
              ok, _ = full_build(f'locate-file-{index:02d}')
              if ok:
                  culprit = path
                  break
          reset()
          if culprit is None:
              (evidence / 'result.txt').write_text('repair=not-applied\nreason=no-single-file-build-candidate\n')
              raise SystemExit('No single changed frontend file isolated the build failure.')

          diff = require([
              'git', 'diff', '--unified=0', '--no-ext-diff', f'{base_ref}...{head_sha}', '--', culprit
          ]).stdout
          lines = diff.splitlines(keepends=True)
          first_hunk = next((i for i, line in enumerate(lines) if line.startswith('@@ ')), None)
          if first_hunk is None:
              raise SystemExit(f'No text hunks were available for {culprit}.')
          header = lines[:first_hunk]
          hunks = []
          current = []
          for line in lines[first_hunk:]:
              if line.startswith('@@ '):
                  if current:
                      hunks.append(current)
                  current = [line]
              else:
                  current.append(line)
          if current:
              hunks.append(current)

          selected = None
          selected_index = None
          for index, hunk in enumerate(hunks):
              reset()
              patch_text = ''.join(header + hunk)
              patch_file = evidence / f'hunk-{index:03d}.patch'
              patch_file.write_text(patch_text)
              apply = run(['git', 'apply', '-R', '--unidiff-zero', str(patch_file)])
              (evidence / f'hunk-{index:03d}-apply.log').write_text(apply.stdout)
              if apply.returncode != 0:
                  continue
              if complete_candidate(f'hunk-{index:03d}'):
                  selected = patch_text
                  selected_index = index
                  break
          reset()
          if selected is None:
              (evidence / 'result.txt').write_text(
                  f'repair=not-applied\nreason=no-single-hunk-contract-safe-candidate\nculprit={culprit}\n'
              )
              raise SystemExit(f'No individual hunk in {culprit} can be reverted while preserving every required contract.')

          selected_file = evidence / 'selected.patch'
          selected_file.write_text(selected)
          require(['git', 'apply', '-R', '--unidiff-zero', str(selected_file)])
          if not complete_candidate('final-selected'):
              raise SystemExit('Selected hunk was not stable under the final complete gate.')

          # Remove build-generated mutations and restore only the validated source correction.
          reset()
          require(['git', 'apply', '-R', '--unidiff-zero', str(selected_file)])
          require(['git', 'diff', '--check'])
          (evidence / 'result.txt').write_text(
              f'repair=safe-single-hunk-reversion\nculprit={culprit}\nhunk={selected_index}\n'
          )
          PY

          if git diff --quiet; then
            echo 'PR680_FRONTEND_REPAIR_V3=NO_SOURCE_CHANGE_REQUIRED'
            exit 0
          fi
          git diff --check
          git status --short
          git config user.name 'ChangePoint governed repair'
          git config user.email 'noreply@users.noreply.github.com'
          git add -- src/frontend/project-time-web/src src/frontend/project-time-web/scripts
          git commit -m 'Fix PR 680 frontend build while preserving release contracts'
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Upload governed repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr680-safe-frontend-repair-v3-evidence
          path: ${{ runner.temp }}/pr680-safe-repair-v3
          if-no-files-found: warn
          retention-days: 2
