name: Validate Test-Only Unified Celar Routing Release 9c34c6c3

on:
  pull_request:
    paths:
      - '.github/workflows/projectpulse-deploy-test.yml'
      - '.github/workflows/projectpulse-release-test-control-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact 9c34c6c3 Test release controller
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed release controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source pin, no-migration boundary, UAT, and rollback
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -Eeuo pipefail
          CONTROLLER='.github/workflows/projectpulse-deploy-test.yml'
          VALIDATOR='.github/workflows/projectpulse-release-test-control-ci.yml'
          SOURCE='9c34c6c3a6151a04e2b9b76840c95dc10a9f438e'

          git fetch origin "$BASE_REF" --no-tags
          cat > "$RUNNER_TEMP/expected-release-files" <<'EOF'
          .github/workflows/projectpulse-deploy-test.yml
          .github/workflows/projectpulse-release-test-control-ci.yml
          EOF
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/expected-release-files"
          git diff --name-only "origin/$BASE_REF...HEAD" | LC_ALL=C sort > "$RUNNER_TEMP/actual-release-files"
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-release-files" "$RUNNER_TEMP/expected-release-files"
          diff -u "$RUNNER_TEMP/expected-release-files" "$RUNNER_TEMP/actual-release-files"

          grep -Fq "TARGET_RELEASE_COMMIT: $SOURCE" "$CONTROLLER"
          grep -Fq "ref: $SOURCE" "$CONTROLLER"
          grep -Fq 'branches: [main]' "$CONTROLLER"
          grep -Fq "'.github/workflows/projectpulse-deploy-test.yml'" "$CONTROLLER"
          grep -Fq 'group: projectpulse-deploy-test' "$CONTROLLER"
          grep -Fq 'queue: max' "$CONTROLLER"
          grep -Fq 'cancel-in-progress: false' "$CONTROLLER"
          grep -Fq 'environment: test' "$CONTROLLER"
          grep -Fq 'MIGRATIONS_APPLIED=NONE' "$CONTROLLER"
          grep -Fq 'MIGRATION_081=NOT_APPLIED' "$CONTROLLER"
          grep -Fq 'OPEN_CLOUD_PRIVATE_RUNTIME=DEFERRED' "$CONTROLLER"
          grep -Fq 'Deploy API image without migrations or private-runtime activation' "$CONTROLLER"
          grep -Fq 'privateRuntimeConfigurationChanged:false' "$CONTROLLER"
          grep -Fq 'migrationsApplied:[]' "$CONTROLLER"
          grep -Fq 'migration081:"not_applied"' "$CONTROLLER"
          grep -Fq 'openCloudPrivateRuntime:"deferred"' "$CONTROLLER"
          grep -Fq 'PROJECTPULSE_TEST_UAT_SESSION' "$CONTROLLER"
          grep -Fq 'celar-readiness-summary.json' "$CONTROLLER"
          grep -Fq 'public-officeholder and default-route contract' "$CONTROLLER"
          grep -Fq 'Who is the US President?' "$CONTROLLER"
          grep -Fq 'Who is the president of Acme Corp?' "$CONTROLLER"
          grep -Fq 'Working on training' "$CONTROLLER"
          grep -Fq 'project_flowhive_plan' "$CONTROLLER"
          grep -Fq 'project_forge_plan_estimate' "$CONTROLLER"
          grep -Fq 'projectEvidenceReady == true' "$CONTROLLER"
          grep -Fq 'every(.result.flowHivePlan.tasks[]; (.citationIds | length) > 0)' "$CONTROLLER"
          grep -Fq 'rawPrivateContextSentToExternalProvider == false' "$CONTROLLER"
          grep -Fq 'externalProviderReceivesPrivateDocumentText == false' "$CONTROLLER"
          grep -Fq 'Restore prior images and source marker on failure' "$CONTROLLER"
          grep -Fq 'PROJECTPULSE_SOURCE_COMMIT did not match the pinned unified-routing release.' "$CONTROLLER"

          ! grep -Eq 'run-migration-job|apply-celar-ai|psql|database/migrations|\.sql' "$CONTROLLER"
          ! grep -Fq '081_celar_ai_private_runtime_activation' "$CONTROLLER"
          ! grep -Fq 'az keyvault' "$CONTROLLER"
          ! grep -Fq 'PROJECTPULSE_TEST_DATABASE_URL' "$CONTROLLER"
          ! grep -Fq 'PROJECTPULSE_PRIVATE_MODEL_ENDPOINT' "$CONTROLLER"
          ! grep -Fq 'PROJECTPULSE_PULSE_AI_CLAMAV' "$CONTROLLER"
          ! grep -Fq 'workflow_dispatch:' "$CONTROLLER"
          ! grep -Fq '.competency.currentPassRate == 1' "$CONTROLLER"

          git merge-base --is-ancestor "$SOURCE" HEAD
          node scripts/validate-deployment-concurrency-governance.mjs --verify-repository
          node scripts/validate-deployment-concurrency-governance.mjs --base-ref "origin/$BASE_REF" --verify-pr
          git diff --check "origin/$BASE_REF...HEAD"
          echo 'UNIFIED_CELAR_ROUTING_9C34C6C3_TEST_RELEASE_CONTROL=PASSED'
