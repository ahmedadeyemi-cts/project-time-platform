name: Validate Current Pulse Protected-Test Release Control

on:
  pull_request:
    paths:
      - '.github/workflows/projectpulse-deploy-test.yml'
      - '.github/workflows/projectpulse-release-test-control-ci.yml'
      - '.github/workflows/celar-ai-oracle-test-runtime-ci.yml'
      - 'tests/validate-celar-ai-oracle-test-runtime.mjs'
      - '.github/workflows/*test*.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact 654af0e protected-Test controller and governance cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out proposed release controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source pin, approved scope, UAT, preservation, and rollback
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          CONTROLLER='.github/workflows/projectpulse-deploy-test.yml'
          SOURCE='654af0e469f1fba348f7f7dcbac0fde4c5346a59'

          git fetch origin "$BASE_REF" --no-tags
          [[ "$(git rev-parse "origin/$BASE_REF")" == "$SOURCE" ]] \
            || fail 'The protected-Test release is no longer based on exact current main 654af0e.'
          git merge-base --is-ancestor "$SOURCE" HEAD \
            || fail 'The pinned application release is not an ancestor of the proposed controller.'

          mapfile -t changed < <(git diff --name-only "origin/$BASE_REF...HEAD" | LC_ALL=C sort)
          (( ${#changed[@]} > 0 )) || fail 'No protected-Test release-control changes were found.'
          for file in "${changed[@]}"; do
            case "$file" in
              .github/workflows/celar-ai-oracle-test-runtime-activation-v2.yml|\
              .github/workflows/celar-ai-oracle-test-runtime-ci.yml|\
              .github/workflows/celar-ai-oracle-test-runtime-deploy.yml|\
              .github/workflows/inspect-module082-risk-failure-test.yml|\
              .github/workflows/module-083-autonomous-control-plane-ci.yml|\
              .github/workflows/projectpulse-deploy-enterprise-governance-fixed-v2-test.yml|\
              .github/workflows/projectpulse-deploy-enterprise-governance-test.yml|\
              .github/workflows/projectpulse-deploy-test.yml|\
              .github/workflows/projectpulse-promote-enterprise-governance-test-v2.yml|\
              .github/workflows/projectpulse-promote-enterprise-governance-test.yml|\
              .github/workflows/projectpulse-release-test-control-ci.yml|\
              .github/workflows/repair-pr644-final-validation-v2.yml|\
              .github/workflows/rerun-celar-ai-oracle-test-after-reference-fix.yml|\
              tests/validate-celar-ai-oracle-test-runtime.mjs)
                ;;
              *) fail "Protected-Test consolidation changed an unapproved file: $file" ;;
            esac
          done

          for obsolete in \
            .github/workflows/celar-ai-oracle-test-runtime-activation-v2.yml \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml \
            .github/workflows/inspect-module082-risk-failure-test.yml \
            .github/workflows/module-083-autonomous-control-plane-ci.yml \
            .github/workflows/projectpulse-deploy-enterprise-governance-fixed-v2-test.yml \
            .github/workflows/projectpulse-deploy-enterprise-governance-test.yml \
            .github/workflows/projectpulse-promote-enterprise-governance-test-v2.yml \
            .github/workflows/projectpulse-promote-enterprise-governance-test.yml \
            .github/workflows/repair-pr644-final-validation-v2.yml \
            .github/workflows/rerun-celar-ai-oracle-test-after-reference-fix.yml; do
            [[ ! -e "$obsolete" ]] || fail "Obsolete release helper remains: $obsolete"
          done

          for marker in \
            'name: Deploy Pulse Current Main 654af0e to Protected Test' \
            "TARGET_RELEASE_COMMIT: $SOURCE" \
            "ref: $SOURCE" \
            'branches: [main]' \
            "'.github/workflows/projectpulse-deploy-test.yml'" \
            'group: projectpulse-deploy-test' \
            'queue: max' \
            'cancel-in-progress: false' \
            'environment: test' \
            'id-token: write' \
            'MIGRATIONS_APPLIED=NONE' \
            'PRODUCTION_MUTATION=NONE' \
            'migrationsApplied:[]' \
            'productionMutation:false' \
            'privateRuntimeConfigurationMutation:false' \
            'PROJECTPULSE_TEST_UAT_SESSION' \
            'private-runtime-before.json' \
            'private-runtime-after.json' \
            'diff -u "$EVIDENCE_DIR/private-runtime-before.json" "$EVIDENCE_DIR/private-runtime-after.json"' \
            'X-ProjectPulse-Module-Number: $module' \
            '081|module081-access.json|/api/lab-equipment-tracker/access' \
            '082|module082-access.json|/api/project-risk-register/access' \
            '/api/lab-equipment-tracker/access' \
            '/api/project-risk-register/access' \
            '/api/lab-equipment-tracker/summary' \
            '/api/project-risk-register/summary' \
            '.permissions.canManage == true' \
            'projectpulse-floating-theme-toggle' \
            'ptp-theme' \
            'projectpulse-theme-control' \
            'validate-module001a-viewas-module013-operations.mjs' \
            'validate-module-083-autonomous-control-plane.mjs' \
            'validate-module-083-autonomous-orchestration.mjs' \
            'validate-celar-ai-public-question-resilience.mjs' \
            'validate-celar-ai-pr630-consolidated.mjs' \
            'validate-celar-ai-external-deidentification.mjs' \
            'What is the capital of Jordan?' \
            'rawPrivateContextSentToExternalProvider == false' \
            'externalProviderReceivedAttachmentContent == false' \
            'Restore exact prior Test images after failure'; do
            grep -Fq "$marker" "$CONTROLLER" || fail "Controller is missing required marker: $marker"
          done

          ! grep -Eq 'run-migration-job|apply-celar-ai|psql|database/migrations|\.sql' "$CONTROLLER" \
            || fail 'The Test controller contains a database or migration execution path.'
          ! grep -Fq 'workflow_dispatch:' "$CONTROLLER" \
            || fail 'The registered Test deployment controller must remain main-push-only.'
          ! grep -Fq 'environment: production' "$CONTROLLER" \
            || fail 'The Test controller contains a Production environment binding.'
          ! grep -Fq 'az keyvault' "$CONTROLLER" \
            || fail 'The Test controller contains a Key Vault mutation.'
          ! grep -Fq 'PROJECTPULSE_TEST_CELAR_AI_ORACLE_RUNTIME_TOKEN' "$CONTROLLER" \
            || fail 'The Test controller contains an Oracle runtime credential mutation.'
          ! grep -Fq 'PROJECTPULSE_PRIVATE_MODEL_ENDPOINT=' "$CONTROLLER" \
            || fail 'The Test controller mutates the private inference endpoint.'

          node tests/validate-celar-ai-oracle-test-runtime.mjs
          node scripts/validate-deployment-concurrency-governance.mjs --verify-repository
          node scripts/validate-deployment-concurrency-governance.mjs --base-ref "origin/$BASE_REF" --verify-pr
          git diff --check "origin/$BASE_REF...HEAD"
          echo 'CURRENT_PULSE_654AF0E_PROTECTED_TEST_CONTROL=PASSED'
