name: Validate Modules 081 082 001A and Celar AI Test Deployment

on:
  pull_request:
    paths:
      - .github/workflows/projectpulse-deploy-test.yml
      - .github/workflows/projectpulse-release-test-control-ci.yml
      - deployment/releases/test/modules-081-082-001a-celar-ai-1892c6d-20260807.json
      - scripts/apply-modules-081-082-001a-celar-ai-test-migrations.sh
      - scripts/run-modules-081-082-001a-celar-ai-test-migration-job.sh
      - scripts/verify-modules-081-082-001a-celar-ai-test-runtime.mjs

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact guarded Test release controls
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed release controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source pins, migration safety, and runtime evidence contract
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOY=.github/workflows/projectpulse-deploy-test.yml
          VALIDATE=.github/workflows/projectpulse-release-test-control-ci.yml
          MANIFEST=deployment/releases/test/modules-081-082-001a-celar-ai-1892c6d-20260807.json
          APPLY=scripts/apply-modules-081-082-001a-celar-ai-test-migrations.sh
          RUNNER=scripts/run-modules-081-082-001a-celar-ai-test-migration-job.sh
          VERIFY=scripts/verify-modules-081-082-001a-celar-ai-test-runtime.mjs
          SOURCE=1892c6d0187edc367a57b8cee2e868417dd9a01a

          bash -n "$APPLY"
          bash -n "$RUNNER"
          node --check "$VERIFY"

          grep -Fq "EXPECTED_SOURCE_SHA: $SOURCE" "$DEPLOY"
          grep -Fq "ref: $SOURCE" "$DEPLOY"
          grep -Fq 'DEPLOY-1892C6D-MODULES-081-082-001A-CELAR-AI-TO-TEST' "$DEPLOY"
          grep -Fq 'group: projectpulse-deploy-test' "$DEPLOY"
          grep -Fq 'cancel-in-progress: false' "$DEPLOY"
          grep -Fq 'environment: test' "$DEPLOY"
          grep -Fq 'QUIESCENT_TEST_BASELINE=VERIFIED' "$DEPLOY"
          grep -Fq 'API_PREDEPLOY_CAS=PASSED' "$DEPLOY"
          grep -Fq 'WEB_PREDEPLOY_CAS=PASSED' "$DEPLOY"
          grep -Fq 'DATABASE_ROLLBACK=NOT_EXECUTED_SCHEMA_STAYS_FORWARD' "$DEPLOY"
          grep -Fq 'applicationRollbackAttempted' "$DEPLOY"
          grep -Fq 'modules-081-082-001a-celar-ai-1892c6d-20260807.json' "$DEPLOY"
          grep -Fq '076_module_081_lab_equipment_tracker.sql' "$DEPLOY"
          grep -Fq '077_module_082_enterprise_project_risk_register.sql' "$DEPLOY"
          grep -Fq '078_module_001a_engineer_request_closeout.sql' "$DEPLOY"
          ! grep -Eq 'psql.*database/rollback|\\i .*database/rollback' "$DEPLOY"
          ! grep -Fq 'az keyvault secret show' "$DEPLOY"
          ! grep -Fq 'PROJECTPULSE_TEST_DATABASE_URL' "$DEPLOY"
          test ! -e .github/workflows/projectpulse-deploy-pulse-login-test.yml

          grep -Fq "EXPECTED_RELEASE_COMMIT=\"$SOURCE\"" "$APPLY"
          grep -Fq 'DATABASE_IDENTITY=TEST_SENTINEL_VERIFIED' "$APPLY"
          grep -Fq 'Refusing partial, duplicate, or out-of-order 076-078 migration state.' "$APPLY"
          grep -Fq 'A superseded migration 076 identity is present' "$APPLY"
          grep -Fq 'Core business row counts changed' "$APPLY"
          grep -Fq 'MODULES_081_082_001A_MIGRATIONS_076_078=VERIFIED' "$APPLY"
          grep -Fq 'PSQL_TARGET=()' "$APPLY"
          grep -Fq 'psql "${PSQL_TARGET[@]}"' "$APPLY"
          grep -Fq 'PGDATABASE does not match the protected Test database name' "$APPLY"

          grep -Fq "EXPECTED_RELEASE_COMMIT=\"$SOURCE\"" "$RUNNER"
          grep -Fq 'modules-081-082-001a-celar-ai-test' "$RUNNER"
          grep -Fq 'keyVaultUrl' "$RUNNER"
          grep -Fq 'validate_job_ownership' "$RUNNER"
          grep -Fq 'PREFLIGHT_CONFIRMED_404=1' "$RUNNER"
          grep -Fq '{name: "PGPASSWORD", secretRef: "main-release-db-password"}' "$RUNNER"
          grep -Fq '{name: "PGSSLMODE", value: "verify-full"}' "$RUNNER"
          ! grep -Fq 'PROJECTPULSE_TEST_DATABASE_URL' "$RUNNER"

          grep -Fq "const expectedSource = \"$SOURCE\"" "$VERIFY"
          grep -Fq 'const expectedBase = "https://phd-west-test.onenecklab.com"' "$VERIFY"
          grep -Fq 'releaseJson.sourceSha === sourceSha' "$VERIFY"
          grep -Fq 'Module 081 capability contract is incorrect.' "$VERIFY"
          grep -Fq 'Module 082 capability contract is incorrect.' "$VERIFY"
          grep -Fq 'Module 001A protected route returned unexpected' "$VERIFY"
          grep -Fq 'Celar AI private-runtime route returned unexpected' "$VERIFY"
          grep -Fq 'Served application bundle is missing' "$VERIFY"
          grep -Fq 'pending_user_session_validation' "$VERIFY"
          grep -Fq 'redirect: "manual"' "$VERIFY"

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("deployment/releases/test/modules-081-082-001a-celar-ai-1892c6d-20260807.json").read_text())
          assert manifest["schemaVersion"] == 1
          assert manifest["releaseName"] == "modules-081-082-001a-celar-ai-1892c6d-20260807"
          assert manifest["environment"] == "test"
          assert manifest["sourceSha"] == "1892c6d0187edc367a57b8cee2e868417dd9a01a"
          assert manifest["modules081082001aIncluded"] is True
          assert manifest["celarAiPrivateRagUxIncluded"] is True
          assert manifest["requiredPriorLedger"] == [
              "074_module_066_project_flowhive_production",
              "075_pulse_product_rebrand",
          ]
          assert [item["id"] for item in manifest["migrations"]] == [
              "076_module_081_lab_equipment_tracker",
              "077_module_082_enterprise_project_risk_register",
              "078_module_001a_engineer_request_closeout",
          ]
          assert len({item["path"] for item in manifest["migrations"]}) == 3
          assert len({item["blobSha"] for item in manifest["migrations"]}) == 3
          assert len({item["sha256"] for item in manifest["migrations"]}) == 3
          assert manifest["deployment"]["applicationRollbackOnFailure"] is True
          assert manifest["deployment"]["databaseRollbackOnFailure"] is False
          PY

          printf '%s  %s\n' \
            0fd7addecfb43c8d7341c6882e02affd3b6c6f4eb8eea49c4b7aa086270ae47d database/migrations/076_module_081_lab_equipment_tracker.sql \
            22725eb63bb57d82f23f431d6a7c007740b758040c16b294590947901072dada database/migrations/077_module_082_enterprise_project_risk_register.sql \
            de2e814fb3a96fc45bb9e15e7074b1b88b1c9d13b4b0b2cc9191379bcdc97162 database/migrations/078_module_001a_engineer_request_closeout.sql \
            | sha256sum --check --strict

          test "$(git rev-parse HEAD:database/migrations/076_module_081_lab_equipment_tracker.sql)" = df4d79de5f912fc7fcd4b5af70c5e084929b5c21
          test "$(git rev-parse HEAD:database/migrations/077_module_082_enterprise_project_risk_register.sql)" = 37fb39bcdd9aaa7ce1b88ffd87559026096eed11
          test "$(git rev-parse HEAD:database/migrations/078_module_001a_engineer_request_closeout.sql)" = fc95ebb7976209ba9e1f362cfdebf2897334a178
          node scripts/validate-deployment-concurrency-governance.mjs --verify-repository
          git diff --check
          echo "MODULES_081_082_001A_CELAR_AI_TEST_DEPLOYMENT_CONTROL=PASSED"
