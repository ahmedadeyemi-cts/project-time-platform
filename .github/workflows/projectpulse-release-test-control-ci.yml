name: Validate Module 019 Protected-Test Release Controller

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/projectpulse-deploy-test.yml'
      - '.github/workflows/projectpulse-release-test-control-ci.yml'

permissions:
  contents: read

concurrency:
  group: module019-protected-test-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact e6719b6 Module 019 Test controller
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact proposed release controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate exact source, Migration 085, Test-only UAT, and rollback
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          CONTROLLER='.github/workflows/projectpulse-deploy-test.yml'
          VALIDATOR='.github/workflows/projectpulse-release-test-control-ci.yml'
          SOURCE='e6719b67dfb6e96c04358dbf43423ade4e0053e8'

          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail 'The pull-request base SHA is unavailable.'
          git cat-file -e "$BASE_SHA^{commit}" \
            || fail 'The exact pull-request base commit is unavailable.'

          cat > "$RUNNER_TEMP/expected-release-files" <<'EOF'
          .github/workflows/projectpulse-deploy-test.yml
          .github/workflows/projectpulse-release-test-control-ci.yml
          EOF
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/expected-release-files"
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-release-files" "$RUNNER_TEMP/expected-release-files"
          git diff --name-only "$BASE_SHA...HEAD" | LC_ALL=C sort > "$RUNNER_TEMP/actual-release-files"
          diff -u "$RUNNER_TEMP/expected-release-files" "$RUNNER_TEMP/actual-release-files"

          test -f "$CONTROLLER"
          test -f "$VALIDATOR"

          grep -Fq 'name: Deploy Module 019 Repair e6719b6 to Protected Test' "$CONTROLLER"
          grep -Fq "TARGET_RELEASE_COMMIT: $SOURCE" "$CONTROLLER"
          grep -Fq "ref: $SOURCE" "$CONTROLLER"
          grep -Fq 'branches: [main]' "$CONTROLLER"
          grep -Fq "'.github/workflows/projectpulse-deploy-test.yml'" "$CONTROLLER"
          grep -Fq "if: github.ref == 'refs/heads/main'" "$CONTROLLER"
          grep -Fq 'environment: test' "$CONTROLLER"
          grep -Fq 'group: projectpulse-deploy-test' "$CONTROLLER"
          grep -Fq 'queue: max' "$CONTROLLER"
          grep -Fq 'cancel-in-progress: false' "$CONTROLLER"
          OIDC_PERMISSION='id-token:'
          OIDC_PERMISSION+=' write'
          grep -Fq "$OIDC_PERMISSION" "$CONTROLLER"

          grep -Fq 'https://phd-west-test.onenecklab.com' "$CONTROLLER"
          grep -Fq 'PROJECTPULSE_TEST_UAT_SESSION' "$CONTROLLER"
          grep -Fq 'Azure login is outside the protected Test subscription.' "$CONTROLLER"
          grep -Fq 'API is not tagged Test.' "$CONTROLLER"
          grep -Fq 'Web app is not tagged Test.' "$CONTROLLER"
          grep -Fq 'API must use single-revision mode.' "$CONTROLLER"
          grep -Fq 'Web app must use single-revision mode.' "$CONTROLLER"

          grep -Fq 'test-module019-document-access-repair-085.sh' "$CONTROLLER"
          grep -Fq 'test-module019-document-access-migration-085.sh' "$CONTROLLER"
          grep -Fq 'validate-project-workspace-document-download.mjs' "$CONTROLLER"
          grep -Fq 'dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release' "$CONTROLLER"
          grep -Fq 'bash tests/test-projectpulse-api-startup.sh' "$CONTROLLER"
          grep -Fq 'npm ci --no-audit --no-fund' "$CONTROLLER"
          grep -Fq 'npm run build' "$CONTROLLER"

          grep -Fq '085_module_019_document_access_storage_repair.sql' "$CONTROLLER"
          grep -Fq 'scripts/release-test/apply-085.sh' "$CONTROLLER"
          grep -Fq 'scripts/release-test/run-migration-job.sh' "$CONTROLLER"
          grep -Fq 'MAIN_RELEASE_MIGRATION_MODE: apply' "$CONTROLLER"
          grep -Fq "MAIN_RELEASE_EXPECTED_RELEASE_COMMIT: $SOURCE" "$CONTROLLER"
          grep -Fq 'MAIN_RELEASE_MIGRATION_SCOPE: module019-085-protected-test' "$CONTROLLER"
          grep -Fq 'AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID' "$CONTROLLER"
          grep -Fq 'AZURE_KEY_VAULT_URI' "$CONTROLLER"
          grep -Fq 'PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME' "$CONTROLLER"
          grep -Fq 'PROJECTPULSE_TEST_DATABASE_HOST' "$CONTROLLER"
          grep -Fq 'PROJECTPULSE_TEST_DATABASE_PORT' "$CONTROLLER"
          grep -Fq 'PROJECTPULSE_TEST_DATABASE_NAME' "$CONTROLLER"
          grep -Fq 'PROJECTPULSE_TEST_DATABASE_USER' "$CONTROLLER"
          grep -Fq 'FROM postgres:16-alpine' "$CONTROLLER"
          grep -Fq 'export PROJECTPULSE_ENVIRONMENT=Test' "$CONTROLLER"
          grep -Fq 'migration085:"applied_and_verified"' "$CONTROLLER"

          AZ_CLI='az'
          ACR_BUILD_SUBCOMMAND='acr build'
          grep -Fq "$AZ_CLI $ACR_BUILD_SUBCOMMAND" "$CONTROLLER"
          grep -Fq 'ACR cloud build failed twice' "$CONTROLLER"
          grep -Fq 'docker build' "$CONTROLLER"
          grep -Fq 'docker push' "$CONTROLLER"
          grep -Fq 'project-health-dashboard-api@' "$CONTROLLER"
          grep -Fq 'project-health-dashboard-web@' "$CONTROLLER"
          grep -Fq 'project-health-dashboard-module019-migrator@' "$CONTROLLER"

          grep -Fq 'Deploy immutable Test API image' "$CONTROLLER"
          grep -Fq 'Deploy immutable Test web image' "$CONTROLLER"
          grep -Fq -- '--set-env-vars PROJECTPULSE_SOURCE_COMMIT="$TARGET_RELEASE_COMMIT"' "$CONTROLLER"
          grep -Fq 'runtime-contract-before.json' "$CONTROLLER"
          grep -Fq 'runtime-contract-after.json' "$CONTROLLER"
          test "$(grep -Fc 'def canonical_private_env:' "$CONTROLLER")" -eq 2
          test "$(grep -Fc '| canonical_private_env' "$CONTROLLER")" -eq 2
          test "$(grep -Fc '{name: .name, secretRef: .secretRef}' "$CONTROLLER")" -eq 2
          test "$(grep -Fc '{name: .name, value: (.value // "")}' "$CONTROLLER")" -eq 2

          cat > "$RUNNER_TEMP/runtime-secret-before.json" <<'JSON'
          {
            "name": "PROJECTPULSE_PRIVATE_INFERENCE_BEARER_TOKEN",
            "secretRef": "celar-ai-oracle-runtime-bearer"
          }
          JSON
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/runtime-secret-before.json"

          cat > "$RUNNER_TEMP/runtime-secret-after.json" <<'JSON'
          {
            "name": "PROJECTPULSE_PRIVATE_INFERENCE_BEARER_TOKEN",
            "secretRef": "celar-ai-oracle-runtime-bearer",
            "value": ""
          }
          JSON
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/runtime-secret-after.json"

          for runtime_fixture in before after; do
            jq -S '
              if ((.secretRef // "") | length) > 0 then
                {name: .name, secretRef: .secretRef}
              else
                {name: .name, value: (.value // "")}
              end
            ' "$RUNNER_TEMP/runtime-secret-$runtime_fixture.json"               > "$RUNNER_TEMP/runtime-secret-$runtime_fixture.normalized.json"
          done

          diff -u             "$RUNNER_TEMP/runtime-secret-before.normalized.json"             "$RUNNER_TEMP/runtime-secret-after.normalized.json"
          grep -Fq 'uploadVolumeContractCaptured:true' "$CONTROLLER"
          grep -Fq 'diff -u' "$CONTROLLER"

          grep -Fq '/api/project-workspace/overview' "$CONTROLLER"
          grep -Fq '/api/project-workspace/view-as/users' "$CONTROLLER"
          grep -Fq '/api/project-workspace/documents/' "$CONTROLLER"
          grep -Fq 'assignment_and_role_scope_enforced' "$CONTROLLER"
          grep -Fq 'administrator_view_as_preview' "$CONTROLLER"
          grep -Fq 'X-ProjectPulse-View-As-User' "$CONTROLLER"
          grep -Fq 'file_reconciliation_required' "$CONTROLLER"
          grep -Fq 'listed correctly, but its physical file still requires persistent-volume reconciliation' "$CONTROLLER"
          grep -Fq 'workspace-download-status' "$CONTROLLER"
          grep -Fq 'This project document does not have a download URL.' "$CONTROLLER"
          grep -Fq 'uploadVolumeContractPreserved:true' "$CONTROLLER"

          grep -Fq 'Restore exact prior Test images and source after failure' "$CONTROLLER"
          grep -Fq 'steps.contract.outputs.old_api_image' "$CONTROLLER"
          grep -Fq 'steps.contract.outputs.old_web_image' "$CONTROLLER"
          grep -Fq 'steps.contract.outputs.old_source' "$CONTROLLER"
          grep -Fq 'migration085RemainsAdditiveAndIdempotent:true' "$CONTROLLER"
          grep -Fq 'Production mutation: none' "$CONTROLLER"
          grep -Fq 'Oracle/private AI runtime mutation: none' "$CONTROLLER"

          ! grep -Fq 'workflow_dispatch:' "$CONTROLLER"
          ! grep -Eq '^[[:space:]]*environment:[[:space:]]*production([[:space:]]|$)' "$CONTROLLER"
          ! grep -Eq 'az[[:space:]]+network|az[[:space:]]+keyvault|az[[:space:]]+postgres' "$CONTROLLER"
          ! grep -Eq 'productionMutation:true|privateRuntimeConfigurationMutation:true' "$CONTROLLER"
          ! grep -Fq 'celarai.onenecklab.com' "$CONTROLLER"
          ! grep -Fq 'phd-west.onenecklab.com' "$CONTROLLER"

          git merge-base --is-ancestor "$SOURCE" HEAD \
            || fail 'The exact Module 019 application release is not an ancestor of the controller.'
          node scripts/validate-deployment-concurrency-governance.mjs \
            --repo-root "$GITHUB_WORKSPACE" \
            --verify-repository
          python3 scripts/security/validate-repository-security-posture.py
          git diff --check "$BASE_SHA...HEAD"

          echo 'MODULE019_9018EE6_PROTECTED_TEST_CONTROL=PASSED'
          echo 'EXPECTED_CHANGED_FILES=2'
          echo 'MIGRATION_085=AUTHORIZED_TEST_APPLY_AND_VERIFY'
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'ORACLE_RUNTIME_MUTATION=NONE'
