name: Validate Current Main Test Release Control

on:
  pull_request:
    paths:
      - .github/workflows/projectpulse-deploy-test.yml
      - .github/workflows/projectpulse-release-test-control-ci.yml
      - deployment/containers/release-test/api.Dockerfile
      - deployment/releases/test/current-main-acae6fda-20260805.json
      - scripts/release-test/apply-071-073.sh
      - scripts/release-test/run-migration-job.sh
      - scripts/release-test/verify-runtime.mjs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed release controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate guarded Test release controls
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/release-test/apply-071-073.sh
          bash -n scripts/release-test/run-migration-job.sh
          node --check scripts/release-test/verify-runtime.mjs
          grep -Fq 'item?.feature === feature' scripts/release-test/verify-runtime.mjs
          grep -Fq 'must be configured together for automated authenticated UAT' scripts/release-test/verify-runtime.mjs
          grep -Fq 'PENDING_USER_SESSION_VALIDATION' scripts/release-test/verify-runtime.mjs
          grep -Fq 'officialUsSignalLogo' scripts/release-test/verify-runtime.mjs
          grep -Fq 'profilePicturePersistence' scripts/release-test/verify-runtime.mjs
          grep -Fq 'externalProviderReadiness' scripts/release-test/verify-runtime.mjs
          grep -Fq 'result.status === 401' scripts/release-test/verify-runtime.mjs
          grep -Fq 'redirect: "manual"' scripts/release-test/verify-runtime.mjs
          grep -Fq 'celar_ai_chat_attachments_accepted' scripts/release-test/verify-runtime.mjs
          grep -Fq 'celar_ai_chat_attachment_revoked' scripts/release-test/verify-runtime.mjs
          grep -Fq 'canonical_task_created' scripts/release-test/verify-runtime.mjs
          grep -Fq 'canonical_task_archived' scripts/release-test/verify-runtime.mjs
          grep -Fq 'keyVaultUrl' scripts/release-test/run-migration-job.sh
          grep -Fq 'identity: $identity' scripts/release-test/run-migration-job.sh
          grep -Fq 'CREATE_ATTEMPTED=1' scripts/release-test/run-migration-job.sh
          grep -Fq 'START_ATTEMPTED=1' scripts/release-test/run-migration-job.sh
          grep -Fq 'PREFLIGHT_CONFIRMED_404=1' scripts/release-test/run-migration-job.sh
          grep -Fq 'validate_job_ownership' scripts/release-test/run-migration-job.sh
          grep -Fq 'stop_nonterminal_executions' scripts/release-test/run-migration-job.sh
          grep -Fq 'PROJECTPULSE_TEST_DATABASE_NAME' scripts/release-test/run-migration-job.sh
          ! grep -Fq 'PROJECTPULSE_TEST_FORGE_PROJECT_ID' scripts/release-test/run-migration-job.sh
          grep -Fq 'DATABASE_IDENTITY=TEST_SENTINEL_VERIFIED' scripts/release-test/apply-071-073.sh
          grep -Fq 'PSQL_TARGET=()' scripts/release-test/apply-071-073.sh
          grep -Fq 'psql "${PSQL_TARGET[@]}"' scripts/release-test/apply-071-073.sh
          grep -Fq 'PGDATABASE does not match the protected Test database name' scripts/release-test/apply-071-073.sh
          grep -Fq "current_database() <> current_setting('projectpulse.release.expected_database')" scripts/release-test/apply-071-073.sh
          grep -Fq 'Refusing partial, duplicate, or mixed 071-073 ledger state' scripts/release-test/apply-071-073.sh
          grep -Fq 'MAIN_RELEASE_TARGET_LEDGER=COMPLETE_RECONCILING' scripts/release-test/apply-071-073.sh
          ! grep -Fq "find \"\$MIGRATION_ROOT\" -maxdepth" scripts/release-test/apply-071-073.sh
          ! grep -Fq 'run: bash control/scripts/export-pr55-test-database-url.sh' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'containerapp secret list' .github/workflows/projectpulse-deploy-test.yml
          ! grep -Fq 'keyvault secret show --id "$KEY_VAULT_SECRET_URI"' .github/workflows/projectpulse-deploy-test.yml
          ! grep -Fq 'keyvault show --name' .github/workflows/projectpulse-deploy-test.yml
          ! grep -Fq 'keyvault show --name' scripts/release-test/run-migration-job.sh
          grep -Fq 'DATABASE_PASSWORD_SECRET_NAME="${KEY_VAULT_SECRET_URI#*/secrets/}"' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME must be an exact secret name with an optional version' scripts/release-test/run-migration-job.sh
          grep -Fq 'main-release-db-password' scripts/release-test/run-migration-job.sh
          grep -Fq '{name: "PGPASSWORD", secretRef: "main-release-db-password"}' scripts/release-test/run-migration-job.sh
          grep -Fq '{name: "PGSSLMODE", value: "verify-full"}' scripts/release-test/run-migration-job.sh
          ! grep -Fq 'main-release-db-url' scripts/release-test/run-migration-job.sh
          ! grep -Fq 'PROJECTPULSE_TEST_DATABASE_URL' scripts/release-test/run-migration-job.sh
          grep -Fq 'steps.contract.outputs.migrator_identity' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'steps.contract.outputs.database_password_secret_name' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'steps.contract.outputs.database_host' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'steps.contract.outputs.database_port' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'steps.contract.outputs.database_user' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'MIGRATOR_IDENTITY_LOWER="${MIGRATOR_IDENTITY,,}"' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq '^/subscriptions/[^/]+/resourcegroups/[^/]+/providers/microsoft\.managedidentity/userassignedidentities/[^/]+$' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'MIGRATOR_IDENTITY_LOWER="${MIGRATOR_IDENTITY,,}"' scripts/release-test/run-migration-job.sh
          ! grep -Fq 'vars.AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID' .github/workflows/projectpulse-deploy-test.yml
          ! grep -Fq 'vars.PROJECTPULSE_DATABASE_URL_SECRET_NAME' .github/workflows/projectpulse-deploy-test.yml
          ! grep -Fq 'vars.PROJECTPULSE_TEST_DATABASE_NAME' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'old_api_env_b64' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'extension.use_dynamic_install=no' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'REQUIRED_CONTAINERAPP_EXTENSION_VERSION=1.3.0b4' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'QUIESCENT_TEST_BASELINE=VERIFIED' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'API_PREDEPLOY_CAS=PASSED' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'WEB_PREDEPLOY_CAS=PASSED' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'candidate_revision' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'touch /tmp/current-main-release-rollback-attempted' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq '"applicationRollbackAttempted": $ROLLBACK_ATTEMPTED' .github/workflows/projectpulse-deploy-test.yml
          if grep -F '"applicationRollbackAttempted":' .github/workflows/projectpulse-deploy-test.yml | grep -Fq 'failure()'; then
            echo 'Release evidence must not call failure() from a run block.' >&2
            exit 1
          fi
          grep -Fq 'PROJECTPULSE_TEST_DATABASE_NAME' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'PROJECTPULSE_AI_RELEASE_PHASE=' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'steps.contract.outputs.phase' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'OFFICIAL_LOGO_SHA=f28a48b72d16d5a2d0377d559ba0a549f4486309cc6e09a285a32840e0df806b' .github/workflows/projectpulse-deploy-test.yml
          grep -Fq 'configurationAuthority === "database_managed_active"' scripts/release-test/verify-runtime.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("deployment/releases/test/current-main-acae6fda-20260805.json").read_text())
          assert manifest["schemaVersion"] == 1
          assert manifest["releaseName"] == "current-main-acae6fda-20260805-r7"
          assert manifest["environment"] == "test"
          assert manifest["aiReleasePhase"] == "disabled"
          assert manifest["routingAuthority"] == "database_managed_active"
          assert manifest["sourceSha"] == "acae6fda08e6d58dfb1e63b5eef4828877fd5523"
          assert manifest["flowHiveIncluded"] is False
          assert manifest["migration074Included"] is False
          assert [item["id"] for item in manifest["migrations"]] == [
              "071_ai_runtime_production_hardening",
              "072_celar_ai_conversation_attachments",
              "073_module_033_project_forge_interactive",
          ]
          assert manifest["requiredPriorLedger"] == [
              "052_pulse_ai_private_document_runtime",
              "053_pulse_ai_private_rag_orchestration",
              "054_pulse_ai_system_intelligence_conversations",
              "061_celar_ai_capability_routing",
              "070_module_033_project_forge",
          ]
          assert len({item["path"] for item in manifest["migrations"]}) == 3
          assert len({item["sha256"] for item in manifest["migrations"]}) == 3
          PY
          printf '%s  %s\n' \
            108f898a0f5e7f76833d42741ba1caa9a0f1ff427db17728cf5a5008a91ee6e7 database/migrations/071_ai_runtime_production_hardening.sql \
            b1a898d72916027f02f7ea5578facd7d9149436b2db9e11dca833d74a7cecf1f database/migrations/072_celar_ai_conversation_attachments.sql \
            e4280b1f020f9aaed4376da4d6e687706ba9805e70bc2adb8cb23ffdb30ec4c6 database/migrations/073_module_033_project_forge_interactive.sql \
            | sha256sum --check --strict
          node scripts/validate-deployment-concurrency-governance.mjs --verify-repository
          git diff --check
          echo "CURRENT_MAIN_TEST_RELEASE_CONTROL=PASSED"
