name: Validate Governed Protected-Test Release Controller

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/module-loading-assignment-propagation-ci.yml'
      - '.github/workflows/projectpulse-deploy-test.yml'
      - '.github/workflows/projectpulse-release-test-control-ci.yml'
      - '.github/workflows/runtime-navigation-work-register-responsive-ci.yml'
      - '.github/workflows/systemwide-enterprise-reliability-ci.yml'
      - '.github/workflows/systemwide-enterprise-reliability-test-deployment.yml'
      - 'scripts/release-test/run-assigned-work-protected-test-uat.sh'
      - 'scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh'
      - 'scripts/release-test/run-utilization-role-scoping-protected-test-uat.sh'
      - 'src/backend/ProjectTime.Api/Modules/Module001AEngineerTaskCloseoutModule.cs'
      - 'src/backend/ProjectTime.Api/Program.cs'
      - 'src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs'
      - 'src/frontend/project-time-web/scripts/validate-modules-directory-page.mjs'
      - 'src/frontend/project-time-web/src/App.jsx'
      - 'src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx'
      - 'src/frontend/project-time-web/src/background-request-role-gate.js'
      - 'src/frontend/project-time-web/src/module-availability-bridge.js'
      - 'tests/validate-utilization-role-scoping.mjs'
      - 'tests/validate-systemwide-image-build-controller.mjs'
      - 'tests/validate-systemwide-enterprise-reliability.mjs'

permissions:
  contents: read

concurrency:
  group: governed-protected-test-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate governed Test controller, exact scope, and rollback boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact proposed release controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Validate governed protected-Test controller
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          CONTROLLER='.github/workflows/projectpulse-deploy-test.yml'
          RETIRED_CONTROLLER='.github/workflows/systemwide-enterprise-reliability-test-deployment.yml'
          UTILIZATION_UAT='scripts/release-test/run-utilization-role-scoping-protected-test-uat.sh'
          ASSIGNED_WORK_UAT='scripts/release-test/run-assigned-work-protected-test-uat.sh'
          SHARED_PLANNING_MANIFEST='.github/shared-project-document-planning-governed-release-files.txt'
          HEAD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"

          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'The pull-request base SHA is unavailable.'
          git cat-file -e "$BASE_SHA^{commit}" || fail 'The exact pull-request base commit is unavailable.'

          cat > "$RUNNER_TEMP/allowed-release-files" <<'FILES'
          .github/workflows/module-loading-assignment-propagation-ci.yml
          .github/workflows/projectpulse-deploy-test.yml
          .github/workflows/projectpulse-release-test-control-ci.yml
          .github/workflows/runtime-navigation-work-register-responsive-ci.yml
          .github/workflows/systemwide-enterprise-reliability-ci.yml
          .github/workflows/systemwide-enterprise-reliability-test-deployment.yml
          scripts/release-test/run-assigned-work-protected-test-uat.sh
          scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          scripts/release-test/run-utilization-role-scoping-protected-test-uat.sh
          src/backend/ProjectTime.Api/Modules/Module001AEngineerTaskCloseoutModule.cs
          src/backend/ProjectTime.Api/Program.cs
          src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          src/frontend/project-time-web/scripts/validate-modules-directory-page.mjs
          src/frontend/project-time-web/src/App.jsx
          src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx
          src/frontend/project-time-web/src/background-request-role-gate.js
          src/frontend/project-time-web/src/module-availability-bridge.js
          tests/validate-utilization-role-scoping.mjs
          tests/validate-systemwide-image-build-controller.mjs
          tests/validate-systemwide-enterprise-reliability.mjs
          FILES
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/allowed-release-files"
          LC_ALL=C sort -u "$RUNNER_TEMP/allowed-release-files" -o "$RUNNER_TEMP/allowed-release-files"

          cat > "$RUNNER_TEMP/exact-runtime-repair-files" <<'FILES'
          .github/workflows/projectpulse-deploy-test.yml
          .github/workflows/runtime-navigation-work-register-responsive-ci.yml
          src/backend/ProjectTime.Api/Modules/ProjectManagementWorkRegisterScope.cs
          src/frontend/project-time-web/scripts/validate-runtime-navigation-work-register-responsive.mjs
          src/frontend/project-time-web/src/App.jsx
          src/frontend/project-time-web/src/ApprovalMailbox.jsx
          src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx
          src/frontend/project-time-web/src/approval-access-navigation-compatibility.js
          src/frontend/project-time-web/src/module-directory-authority.js
          src/frontend/project-time-web/src/unified-project-financial-workspace.css
          FILES
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/exact-runtime-repair-files"
          LC_ALL=C sort -u "$RUNNER_TEMP/exact-runtime-repair-files" -o "$RUNNER_TEMP/exact-runtime-repair-files"

          cat > "$RUNNER_TEMP/exact-assigned-work-repair-files" <<'FILES'
          .github/workflows/module-loading-assignment-propagation-ci.yml
          .github/workflows/projectpulse-deploy-test.yml
          .github/workflows/projectpulse-release-test-control-ci.yml
          scripts/release-test/run-assigned-work-protected-test-uat.sh
          src/backend/ProjectTime.Api/Modules/Module001AEngineerTaskCloseoutModule.cs
          src/backend/ProjectTime.Api/Program.cs
          src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          src/frontend/project-time-web/src/App.jsx
          FILES
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/exact-assigned-work-repair-files"
          LC_ALL=C sort -u "$RUNNER_TEMP/exact-assigned-work-repair-files" -o "$RUNNER_TEMP/exact-assigned-work-repair-files"

          cat > "$RUNNER_TEMP/exact-pr719-module-directory-owner-001a-files" <<'FILES'
          .github/workflows/module-loading-assignment-propagation-ci.yml
          .github/workflows/module-management-owner-drawer-ci.yml
          .github/workflows/projectpulse-release-test-control-ci.yml
          .github/workflows/runtime-navigation-work-register-responsive-ci.yml
          scripts/release-test/run-assigned-work-protected-test-uat.sh
          src/backend/ProjectTime.Api/Modules/Module001AEngineerTaskCloseoutModule.cs
          src/backend/ProjectTime.Api/Modules/ModuleCatalogOwnershipModule.cs
          src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          src/frontend/project-time-web/scripts/validate-modules-directory-page.mjs
          src/frontend/project-time-web/src/EngineerTaskCloseoutCenter.jsx
          src/frontend/project-time-web/src/ModuleManagementTableView.jsx
          src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx
          src/frontend/project-time-web/src/background-request-role-gate.js
          tests/validate-module-management-owner-drawer.mjs
          FILES
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/exact-pr719-module-directory-owner-001a-files"
          LC_ALL=C sort -u "$RUNNER_TEMP/exact-pr719-module-directory-owner-001a-files" -o "$RUNNER_TEMP/exact-pr719-module-directory-owner-001a-files"

          cat > "$RUNNER_TEMP/exact-modules-directory-authority-starvation-files" <<'FILES'
          .github/workflows/module-loading-assignment-propagation-ci.yml
          .github/workflows/projectpulse-release-test-control-ci.yml
          .github/workflows/runtime-navigation-work-register-responsive-ci.yml
          src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          src/frontend/project-time-web/scripts/validate-modules-directory-page.mjs
          src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx
          src/frontend/project-time-web/src/background-request-role-gate.js
          src/frontend/project-time-web/src/module-availability-bridge.js
          FILES
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/exact-modules-directory-authority-starvation-files"
          LC_ALL=C sort -u "$RUNNER_TEMP/exact-modules-directory-authority-starvation-files" -o "$RUNNER_TEMP/exact-modules-directory-authority-starvation-files"

          git fetch --no-tags origin main
          CURRENT_BASE_SHA="$(git merge-base origin/main HEAD)"
          [[ "$CURRENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'Current main merge-base is unavailable.'
          git diff --name-only "$CURRENT_BASE_SHA...HEAD" | LC_ALL=C sort -u > "$RUNNER_TEMP/actual-release-files"
          if [[ "$HEAD_BRANCH" == fix/shared-project-document-planning-* ]]; then
            test -s "$SHARED_PLANNING_MANIFEST" || fail 'The shared project-document planning release manifest is missing.'
            grep -Ev '^[[:space:]]*(#|$)' "$SHARED_PLANNING_MANIFEST" | LC_ALL=C sort -u > "$RUNNER_TEMP/shared-project-document-planning-files"
            cmp -s "$SHARED_PLANNING_MANIFEST" "$RUNNER_TEMP/shared-project-document-planning-files"               || fail 'The shared project-document planning release manifest must be sorted, unique, and comment-free.'
            while IFS= read -r required_file; do
              test -f "$required_file" || fail "Governed shared-planning artifact is missing: $required_file"
            done < "$RUNNER_TEMP/shared-project-document-planning-files"
            cmp -s "$RUNNER_TEMP/actual-release-files" "$RUNNER_TEMP/shared-project-document-planning-files" || {
              echo 'The clean FlowHive/Forge PR differs from its exact governed release manifest.' >&2
              diff -u "$RUNNER_TEMP/shared-project-document-planning-files" "$RUNNER_TEMP/actual-release-files" >&2 || true
              exit 1
            }
            if grep -E '(^|/)(temporary-flowhive|temporary_.*flowhive|flowhive-repair|dispatch-trigger|repair\.patch|patch-[0-9]+\.b64|one-time-flowhive-clean)' "$RUNNER_TEMP/actual-release-files"; then
              fail 'Temporary recovery or publisher artifacts are forbidden from the clean release.'
            fi
            echo 'EXACT_SHARED_PROJECT_DOCUMENT_PLANNING_SCOPE=PASSED'
          elif [[ "${{ github.event.pull_request.number }}" == '734' && -f .github/flowhive-pr734-governed-release-files.txt ]]; then
            grep -Ev '^[[:space:]]*(#|$)' .github/flowhive-pr734-governed-release-files.txt | LC_ALL=C sort -u > "$RUNNER_TEMP/flowhive-pr734-files"
            cmp -s "$RUNNER_TEMP/actual-release-files" "$RUNNER_TEMP/flowhive-pr734-files" || {
              echo 'PR #734 governed release scope differs from its exact reviewed manifest.' >&2
              diff -u "$RUNNER_TEMP/flowhive-pr734-files" "$RUNNER_TEMP/actual-release-files" >&2 || true
              exit 1
            }
            echo 'FLOWHIVE_PR734_GOVERNED_RELEASE_SCOPE=PASSED'
          elif cmp -s "$RUNNER_TEMP/actual-release-files" "$RUNNER_TEMP/exact-runtime-repair-files"; then
            echo 'EXACT_RUNTIME_REPAIR_SCOPE=PASSED'
          elif cmp -s "$RUNNER_TEMP/actual-release-files" "$RUNNER_TEMP/exact-assigned-work-repair-files"; then
            echo 'EXACT_ASSIGNED_WORK_REPAIR_SCOPE=PASSED'
          elif cmp -s "$RUNNER_TEMP/actual-release-files" "$RUNNER_TEMP/exact-pr719-module-directory-owner-001a-files"; then
            echo 'EXACT_PR719_MODULE_DIRECTORY_OWNER_001A_SCOPE=PASSED'
          elif cmp -s "$RUNNER_TEMP/actual-release-files" "$RUNNER_TEMP/exact-modules-directory-authority-starvation-files"; then
            echo 'EXACT_MODULES_DIRECTORY_AUTHORITY_STARVATION_SCOPE=PASSED'
          else
            comm -23 "$RUNNER_TEMP/actual-release-files" "$RUNNER_TEMP/allowed-release-files" > "$RUNNER_TEMP/unexpected-release-files"
            [[ ! -s "$RUNNER_TEMP/unexpected-release-files" ]] || {
              echo 'Unexpected files in governed Test controller PR:' >&2
              cat "$RUNNER_TEMP/unexpected-release-files" >&2
              exit 1
            }
          fi

          test -f "$CONTROLLER" || fail 'The governed protected-Test controller is missing.'
          test ! -e "$RETIRED_CONTROLLER" || fail 'The unregistered duplicate protected-Test controller was not retired.'
          test -f "$UTILIZATION_UAT" || fail 'The utilization role-scoping UAT script is missing.'
          test -f "$ASSIGNED_WORK_UAT" || fail 'The assigned-work UAT script is missing.'
          bash -n scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          bash -n "$UTILIZATION_UAT"
          bash -n "$ASSIGNED_WORK_UAT"

          grep -Fq 'name: Deploy System-wide Enterprise Reliability and Utilization to Protected Test' "$CONTROLLER"
          grep -Fq 'branches: [main]' "$CONTROLLER"
          grep -Fq "if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'" "$CONTROLLER"
          grep -Fq 'release_sha:' "$CONTROLLER"
          grep -Fq 'release_branch:' "$CONTROLLER"
          TARGET_BRANCH_MARKER='TARGET_RELEASE_BRANCH: $'
          TARGET_BRANCH_MARKER+="{{ github.event_name == 'workflow_dispatch' && inputs.release_branch || 'main' }}"
          grep -Fq "$TARGET_BRANCH_MARKER" "$CONTROLLER"
          grep -Fq 'Only the authorized FlowHive V2 candidate branch may use pre-merge Protected-Test deployment.' "$CONTROLLER"
          grep -Fq 'environment: test' "$CONTROLLER"
          grep -Fq 'group: projectpulse-deploy-test' "$CONTROLLER"
          grep -Fq 'queue: max' "$CONTROLLER"
          grep -Fq 'cancel-in-progress: false' "$CONTROLLER"
          TARGET_MARKER='TARGET_RELEASE_COMMIT: $'
          TARGET_MARKER+="{{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}"
          CHECKOUT_MARKER='ref: $'
          CHECKOUT_MARKER+="{{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}"
          grep -Fq "$TARGET_MARKER" "$CONTROLLER"
          grep -Fq "$CHECKOUT_MARKER" "$CONTROLLER"
          grep -Fq 'https://phd-west-test.onenecklab.com' "$CONTROLLER"
          grep -Fq 'PROJECTPULSE_M087_PASSWORD' "$CONTROLLER"
          grep -Fq 'Build immutable API, web, and migration images' "$CONTROLLER"
          grep -Fq 'Apply and verify Migrations 086, 088, 093, 094, 095, and 096 inside Test private network' "$CONTROLLER"
          grep -Fq 'database/migrations/093_assigned_work_canonical_visibility_repair.sql' "$CONTROLLER"
          grep -Fq 'MIGRATION_093=APPLIED_AND_VERIFIED' "$CONTROLLER"
          grep -Fq 'MIGRATION_094=APPLIED_AND_VERIFIED' scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          grep -Fq 'MIGRATION_095=APPLIED_AND_VERIFIED' scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          grep -Fq 'MIGRATION_096=APPLIED_AND_VERIFIED' scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          grep -Fq '096_project_planning_document_authority.sql' scripts/release-test/build-and-run-project-planning-document-authority-migration-job.sh
          grep -Fq 'src/backend/ProjectTime.Api/Modules/ProjectPlanningDocumentResolver.cs' "$CONTROLLER"
          grep -Fq 'src/backend/ProjectTime.Api/Modules/ProjectPlanningAiOrchestrator.cs' "$CONTROLLER"
          grep -Fq 'src/backend/ProjectTime.Api/Modules/ProjectFlowHiveAiPlannerOrchestrationModule.cs' "$CONTROLLER"
          grep -Fq 'node tests/validate-shared-project-document-planning.mjs' "$CONTROLLER"
          grep -Fq 'FLOWHIVE_AI_PLANNER_UAT=PASSED' "$CONTROLLER"
          grep -Fq 'PROJECT_FORGE_AI_PLANNER_UAT=PASSED' "$CONTROLLER"
          grep -Fq 'CELAR_AI_STABILITY_UAT=PASSED' "$CONTROLLER"
          grep -Fq 'migration094:"applied_and_verified"' "$CONTROLLER"
          grep -Fq 'migration095:"applied_and_verified"' "$CONTROLLER"
          grep -Fq 'migration096:"applied_and_verified"' "$CONTROLLER"
          grep -Fq 'Deploy immutable Test API image' "$CONTROLLER"
          grep -Fq 'Deploy immutable Test web image' "$CONTROLLER"
          grep -Fq 'Run protected-Test authenticated functional UAT' "$CONTROLLER"
          grep -Fq 'Run protected-Test assigned-work visibility UAT' "$CONTROLLER"
          grep -Fq 'Run protected-Test utilization role-scoping UAT' "$CONTROLLER"
          grep -Fq 'assignedWorkUat:true' "$CONTROLLER"
          grep -Fq 'Restore exact prior Test images after application failure' "$CONTROLLER"
          grep -Fq 'steps.contract.outputs.old_api_image' "$CONTROLLER"
          grep -Fq 'steps.contract.outputs.old_web_image' "$CONTROLLER"
          grep -Fq 'steps.contract.outputs.old_source' "$CONTROLLER"
          grep -Fq 'Production mutation: none' "$CONTROLLER"
          grep -Fq 'Oracle/private AI runtime mutation: none' "$CONTROLLER"

          ! grep -Fq 'full_imae' "$CONTROLLER"
          ! grep -Eq 'local[[:space:]]+repository="\$1".*image="\$repository:' "$CONTROLLER"
          ! grep -Eq '^[[:space:]]*environment:[[:space:]]*production([[:space:]]|$)' "$CONTROLLER"
          ! grep -Fq 'celarai.onenecklab.com' "$CONTROLLER"
          ! grep -Fq 'phd-west.onenecklab.com' "$CONTROLLER"
          ! grep -Eq 'productionMutation:true|privateRuntimeConfigurationMutation:true' "$CONTROLLER" "$UTILIZATION_UAT" "$ASSIGNED_WORK_UAT"

          node src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          node tests/validate-utilization-role-scoping.mjs
          node tests/validate-systemwide-image-build-controller.mjs
          node tests/validate-systemwide-enterprise-reliability.mjs
          node scripts/validate-deployment-concurrency-governance.mjs --repo-root "$GITHUB_WORKSPACE" --verify-repository
          node scripts/validate-deployment-concurrency-governance.mjs --repo-root "$GITHUB_WORKSPACE" --self-test
          python3 scripts/security/validate-repository-security-posture.py
          git diff --check "$BASE_SHA...HEAD"

          echo 'GOVERNED_PROTECTED_TEST_CONTROLLER=PASSED'
          echo 'ASSIGNED_WORK_VISIBILITY_SOURCE=PASSED'
          echo 'UTILIZATION_ROLE_SCOPING_SOURCE=PASSED'
          echo 'SYSTEMWIDE_ENTERPRISE_RELIABILITY_SOURCE=PASSED'
          echo 'SYSTEMWIDE_IMAGE_BUILD_CONTROLLER=PASSED'
          echo 'MIGRATIONS_086_088_093_094_095_096=AUTHORIZED_TEST_APPLY_AND_VERIFY'
          echo 'SHARED_PROJECT_DOCUMENT_PLANNING=AUTHORIZED_TEST_RELEASE'
          echo 'FLOWHIVE_FORGE_CELAR_AUTHENTICATED_UAT=REQUIRED'
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'ORACLE_RUNTIME_MUTATION=NONE'
