name: Patch Module 025 integration

on:
  push:
    branches:
      - feature/module-025-sow-gsd-workspace-20260830
    paths:
      - .module025/run

permissions:
  contents: write

jobs:
  patch-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/module-025-sow-gsd-workspace-20260830
      - name: Reconstruct Module 025 sources
        shell: bash
        run: |
          mkdir -p src/frontend/project-time-web/src/enterprise
          mkdir -p src/backend/ProjectTime.Api/Modules
          cat .module025/parts/ui.* | base64 -d | gzip -d > src/frontend/project-time-web/src/enterprise/SowGsdWorkspace.jsx
          cat .module025/parts/api.* | base64 -d | gzip -d > src/backend/ProjectTime.Api/Modules/SowGsdWorkspaceModule.cs
      - name: Wire Module 025 workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          sales = Path('src/frontend/project-time-web/src/enterprise/SalesDeliveryWorkflowCenter.jsx')
          text = sales.read_text()
          import_line = "import SowGsdWorkspace from './SowGsdWorkspace';\n"
          if import_line not in text:
              marker = "import './sales-delivery-workflow-center.css';\n"
              if marker not in text:
                  raise SystemExit('SalesDeliveryWorkflowCenter import marker not found')
              text = text.replace(marker, marker + import_line, 1)
          start = text.find('function SowGenerator() {')
          end = text.find('function AiTimeEntry() {')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('SowGenerator/AiTimeEntry boundary not found')
          text = text[:start] + "function SowGenerator() {\n  return <SowGsdWorkspace />;\n}\n\n" + text[end:]
          sales.write_text(text)

          analytics = Path('src/backend/ProjectTime.Api/AnalyticsCenterModule.g.cs')
          text = analytics.read_text()
          hook = '        endpoints.MapSowGsdWorkspaceEndpoints();\n'
          if hook not in text:
              method = 'public static IEndpointRouteBuilder MapAnalyticsCenterEndpoints('
              start = text.find(method)
              if start < 0:
                  raise SystemExit('Analytics endpoint method not found')
              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit('Analytics endpoint method brace not found')
              text = text[:brace + 1] + '\n' + hook.rstrip('\n') + text[brace + 1:]
          analytics.write_text(text)
          PY
      - name: Commit completed source integration
        shell: bash
        run: |
          rm -rf .module025
          rm -f .github/workflows/patch-module025.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build Module 025 SOW and GSD workspace"
          git push origin HEAD:feature/module-025-sow-gsd-workspace-20260830
