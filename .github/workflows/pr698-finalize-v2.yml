name: PR 698 Finalize Against Current Main V2

on:
  push:
    branches:
      - fix/classic-appearance-celar-controls-20260815
    paths:
      - .github/workflows/pr698-finalize-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr698-finalize-current-main-v2
  cancel-in-progress: false

jobs:
  finalize:
    name: Build validated PR 698 source artifact
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_MAIN_SHA: 823fae340a731ba92c5266349ad759493b5629a8

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/classic-appearance-celar-controls-20260815
          fetch-depth: 0

      - name: Verify and merge exact current main locally
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"
          if [[ "$actual_main" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "Current main moved: expected $EXPECTED_MAIN_SHA, found $actual_main" >&2
            exit 1
          fi
          git config user.name 'PR 698 validation builder'
          git config user.email 'pr698-validation@users.noreply.github.com'
          git merge --no-ff --no-commit origin/main
          echo "PR698_MAIN_SYNCHRONIZATION=PASS main=$actual_main"

      - name: Recover and materialize reviewed staged source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64
          import re

          source = Path('.github/workflows/pr698-finalize.yml').read_text(encoding='utf-8')
          match = re.search(
              r"cat > /tmp/pr698-payload\.b64 <<'PAYLOAD'\n(?P<payload>.*?)\n\s*PAYLOAD\n",
              source,
              flags=re.S,
          )
          if not match:
              raise RuntimeError('Unable to locate the reviewed PR 698 payload.')
          compact = ''.join(match.group('payload').split())
          missing_padding = (-len(compact)) % 4
          padded = compact + ('=' * missing_padding)
          decoded = base64.b64decode(padded, validate=False)
          if not decoded.startswith(b'\x1f\x8b'):
              raise RuntimeError('Recovered payload is not a gzip archive.')
          Path('/tmp/pr698-payload.tar.gz').write_bytes(decoded)
          print(
              f'PR698_PAYLOAD_RECOVERY=PASS encoded={len(compact)} '
              f'padding={missing_padding} decoded={len(decoded)}'
          )
          PYCODE
          tar -tzf /tmp/pr698-payload.tar.gz >/tmp/pr698-payload-files.txt
          tar -xzf /tmp/pr698-payload.tar.gz
          python3 -m py_compile scripts/pr698_table_module_management_patch.py
          python3 -m py_compile scripts/pr698_finalize_source.py
          echo PR698_STAGED_PAYLOAD=PASS

      - name: Apply Table, ownership, Module 001A, Account Center, and Workspace source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr698_table_module_management_patch.py
          python3 scripts/pr698_finalize_source.py
          rm -f .github/workflows/pr698-finalize.yml
          rm -f .github/workflows/pr698-finalize-v2.yml
          rm -f scripts/pr698_table_module_management_patch.py
          rm -f scripts/pr698_finalize_source.py
          git add -A
          git diff --cached --check
          echo PR698_FINAL_SOURCE_STAGED=PASS

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate repository security posture
        run: python3 scripts/security/validate-repository-security-posture.py

      - name: Build API
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/backend/ProjectTime.Api/ProjectTime.Api.csproj
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --no-restore

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci

      - name: Validate focused contracts
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -euo pipefail
          node --check ./scripts/inject-celar-ai-ask-operations.mjs
          node --check ./scripts/validate-account-center.mjs
          node --check ./scripts/validate-workspace-navigation.mjs
          node --check ./scripts/validate-enterprise-ui-polish.mjs
          node --check ./scripts/validate-module-001a-engineer-request-closeout.mjs
          node --check ./scripts/validate-pr698-table-module-management.mjs
          node --check ./scripts/validate-module-071-oncall-scheduling.mjs
          node --check ./scripts/validate-module-072-oneassist-routing-directory.mjs
          node --check ./src/module-navigation-access-policy.js
          node --check ./src/role-permission-model.js
          node ./scripts/validate-account-center.mjs
          node ./scripts/validate-workspace-navigation.mjs
          node ./scripts/validate-enterprise-ui-polish.mjs
          node ./scripts/validate-module-001a-engineer-request-closeout.mjs
          node ./scripts/validate-pr698-table-module-management.mjs
          node ./scripts/validate-module-071-oncall-scheduling.mjs
          node ./scripts/validate-module-072-oneassist-routing-directory.mjs
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as ET
          ET.parse('src/assets/module-006-customer-brands.svg')
          print('MODULE_006_CUSTOMER_BRANDS_SVG=PASS')
          PYCODE

      - name: Run complete frontend production build
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Confirm build did not mutate staged product source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --check
          echo PR698_CLEAN_SOURCE=PASS

      - name: Package exact validated source delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          import tarfile

          root = Path.cwd()
          out = Path('/tmp/pr698-final-artifact')
          out.mkdir(parents=True, exist_ok=True)

          def names(diff_filter):
              raw = subprocess.check_output([
                  'git', 'diff', '--cached', '--name-only', '-z',
                  f'--diff-filter={diff_filter}', 'origin/main'
              ])
              return [item.decode('utf-8') for item in raw.split(b'\0') if item]

          present = names('ACMRTUXB')
          deleted = names('D')
          (out / 'base-main-sha.txt').write_text(
              subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip() + '\n',
              encoding='utf-8'
          )
          (out / 'source-head-before-sync.txt').write_text(
              subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() + '\n',
              encoding='utf-8'
          )
          (out / 'changed-files.txt').write_text('\n'.join(present) + ('\n' if present else ''), encoding='utf-8')
          (out / 'deleted-files.txt').write_text('\n'.join(deleted) + ('\n' if deleted else ''), encoding='utf-8')
          (out / 'diff-stat.txt').write_text(
              subprocess.check_output(['git', 'diff', '--cached', '--stat', 'origin/main'], text=True),
              encoding='utf-8'
          )
          (out / 'validation-results.txt').write_text(
              'PR698_MAIN_SYNCHRONIZATION=PASS\n'
              'REPOSITORY_SECURITY_POSTURE=PASS\n'
              'API_RELEASE_BUILD=PASS\n'
              'ACCOUNT_CENTER=PASS\n'
              'WORKSPACE_NAVIGATION=PASS\n'
              'TABLE_MODULE_MANAGEMENT=PASS\n'
              'MODULE_001A_ROLE_CATALOG=PASS\n'
              'CELAR_AI_FOLLOWUP=PASS\n'
              'ONCALL_ONEASSIST=PASS\n'
              'FRONTEND_PRODUCTION_BUILD=PASS\n'
              'CLEAN_SOURCE=PASS\n',
              encoding='utf-8'
          )

          archive = Path('/tmp/pr698-final-source.tar.gz')
          with tarfile.open(archive, 'w:gz') as tar:
              for relative in present:
                  path = root / relative
                  if not path.is_file():
                      raise RuntimeError(f'Validated source file missing: {relative}')
                  tar.add(path, arcname=f'files/{relative}', recursive=False)
              for manifest in sorted(out.iterdir()):
                  tar.add(manifest, arcname=f'manifest/{manifest.name}', recursive=False)

          print(f'PR698_ARTIFACT=PASS files={len(present)} deleted={len(deleted)} archive={archive}')
          PYCODE

      - name: Upload validated final source
        uses: actions/upload-artifact@v4
        with:
          name: pr698-final-source-v2-823fae340a731ba92c5266349ad759493b5629a8
          path: /tmp/pr698-final-source.tar.gz
          if-no-files-found: error
          retention-days: 7
