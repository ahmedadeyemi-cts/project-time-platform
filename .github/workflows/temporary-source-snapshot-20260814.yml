name: Temporary Source Snapshot 20260814

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/temporary-source-snapshot-20260814.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Celar AI and FlowHive reconciliation source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/celar-authoritative-flowhive-current-main-20260813
          fetch-depth: 0
          persist-credentials: false
      - name: Create source archive outside checkout
        run: tar --exclude=.git -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/celar-flowhive-source.tgz" .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: celar-flowhive-reconciliation-source-20260814
          path: ${{ runner.temp }}/celar-flowhive-source.tgz
          if-no-files-found: error
          retention-days: 1
