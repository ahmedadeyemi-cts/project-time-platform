name: Validate Group 1 Navigation and Work Consolidation

on:
  push:
    branches:
      - 'feature/group-1-permission-aware-more-menu-work-consolidation-*'
  pull_request:
    paths:
      - 'src/frontend/project-time-web/src/module-availability-registry.js'
      - 'src/frontend/project-time-web/src/module-availability-bridge.js'
      - 'src/frontend/project-time-web/src/permission-aware-more-menu.css'
      - 'src/frontend/project-time-web/scripts/validate-group-1-navigation-work-consolidation.mjs'
      - '.github/workflows/group1-navigation-work-consolidation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated Group 1 scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$CHANGED"

          ALLOWED='^(\.github/workflows/group1-navigation-work-consolidation-ci\.yml|src/frontend/project-time-web/src/module-availability-registry\.js|src/frontend/project-time-web/src/module-availability-bridge\.js|src/frontend/project-time-web/src/permission-aware-more-menu\.css|src/frontend/project-time-web/scripts/validate-group-1-navigation-work-consolidation\.mjs)$'
          UNEXPECTED="$(grep -Ev "$ALLOWED" <<<"$CHANGED" || true)"
          if [[ -n "$UNEXPECTED" ]]; then
            echo 'Unexpected Group 1 source scope:' >&2
            printf '%s\n' "$UNEXPECTED" >&2
            exit 1
          fi

          if grep -E '^(database/|src/backend/|\.github/workflows/projectpulse-deploy-|src/frontend/project-time-web/src/(CrmErpIntegrationCenter|CustomerDirectoryCenter|customer-directory-sell-sync|crm-erp-integration-center))' <<<"$CHANGED"; then
            echo 'Group 1 overlaps a database, deployment, backend, or PR #187 reserved surface.' >&2
            exit 1
          fi

          echo 'GROUP1_SOURCE_ISOLATION=PASSED'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Build ProjectTime API compatibility baseline
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Check navigation source syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check src/frontend/project-time-web/src/module-availability-registry.js
          node --check src/frontend/project-time-web/src/module-availability-bridge.js
          node --check src/frontend/project-time-web/scripts/validate-group-1-navigation-work-consolidation.mjs

      - name: Validate Group 1 contract
        working-directory: src/frontend/project-time-web
        run: node ./scripts/validate-group-1-navigation-work-consolidation.mjs

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build
