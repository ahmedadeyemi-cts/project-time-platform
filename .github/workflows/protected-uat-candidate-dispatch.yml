name: Dispatch Approved Protected UAT Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/shared-project-document-planning-governed-release-files.txt'
      - '.github/workflows/projectpulse-deploy-test.yml'
      - '.github/workflows/protected-uat-candidate-dispatch.yml'

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: protected-uat-candidate-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch exact green candidate to Protected Test
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'fix/shared-project-document-planning-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Wait for exact candidate release gates
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() {
            echo "ERROR: $*" >&2
            exit 1
          }

          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'The candidate SHA is invalid.'
          [[ "$HEAD_BRANCH" == fix/shared-project-document-planning-* ]] \
            || fail 'The candidate branch is outside the governed shared-planning release family.'

          pr_json="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/pulls/$PR_NUMBER"
          )"
          jq -e \
            --arg sha "$HEAD_SHA" \
            --arg branch "$HEAD_BRANCH" \
            '.state == "open" and
             .draft == false and
             .base.ref == "main" and
             .head.sha == $sha and
             .head.ref == $branch and
             .head.repo.full_name == .base.repo.full_name' \
            <<<"$pr_json" >/dev/null \
            || fail 'The pull request no longer represents the exact governed candidate.'

          required_workflows=(
            'ProjectPulse Repository Security Posture'
            'Validate Governed Protected-Test Release Controller'
            'ProjectPulse CI'
            'Validate UAT Functional Completion'
            'FlowHive Detailed Planner CI'
            'Validate Shared FlowHive and Project Forge Document Planning'
            'Validate Module 033 Project Forge'
            'Validate Module 030 Analytics Center'
            'Validate Module 030 Analytics Enterprise Experience'
            'Validate Celar AI Enterprise Platform Interface'
            'Validate Pulse AI Private Document Pipeline'
            'Validate Project Planning Collaboration Access'
            'System-wide Enterprise Reliability CI'
          )

          declare -A rerun_requested=()

          rerun_infrastructure_failure() {
            local workflow_name="$1" run_id="$2" run_attempt="$3" reason="$4"
            local retry_key="${run_id}:${run_attempt}" response_file http_status

            all_green=0
            pending+=("$workflow_name=$reason-attempt-$run_attempt")

            if (( run_attempt >= 4 )); then
              fail "Required exact-SHA workflow exhausted infrastructure retries: $workflow_name ($reason; attempt $run_attempt)."
            fi

            if (( rerun_dispatched == 1 )) || [[ -n "${rerun_requested[$retry_key]:-}" ]]; then
              return 0
            fi

            response_file="$RUNNER_TEMP/protected-uat-rerun-${run_id}-${run_attempt}.json"
            http_status="$(
              curl --silent --show-error \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --request POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$API_ROOT/actions/runs/$run_id/rerun"
            )"

            if [[ "$http_status" != '201' && "$http_status" != '202' ]]; then
              cat "$response_file" >&2 || true
              fail "Could not re-run infrastructure-failed exact-SHA workflow $workflow_name; GitHub returned HTTP $http_status."
            fi

            rerun_requested["$retry_key"]=1
            rerun_dispatched=1
            echo "PROTECTED_UAT_INFRASTRUCTURE_RERUN workflow=$workflow_name runId=$run_id priorAttempt=$run_attempt reason=$reason"
          }

          deadline=$((SECONDS + 5100))
          all_green=0
          while (( SECONDS < deadline )); do
            runs="$(
              curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$API_ROOT/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100"
            )"

            all_green=1
            pending=()
            rerun_dispatched=0
            for workflow_name in "${required_workflows[@]}"; do
              run_row="$(
                jq -r --arg name "$workflow_name" '
                  [.workflow_runs[] | select(.name == $name)]
                  | sort_by(.created_at)
                  | last
                  | if . == null
                    then ["", "missing", "", "0"]
                    else [(.id | tostring), .status, (.conclusion // ""), ((.run_attempt // 1) | tostring)]
                    end
                  | @tsv
                ' <<<"$runs"
              )"
              IFS=$'\t' read -r run_id run_status run_conclusion run_attempt <<<"$run_row"
              run_attempt="${run_attempt:-0}"
              state="${run_status}:${run_conclusion}"

              case "$state" in
                completed:success)
                  ;;
                completed:startup_failure)
                  rerun_infrastructure_failure "$workflow_name" "$run_id" "$run_attempt" 'startup_failure'
                  ;;
                completed:cancelled)
                  rerun_infrastructure_failure "$workflow_name" "$run_id" "$run_attempt" 'cancelled_before_gate_completion'
                  ;;
                completed:failure)
                  jobs="$(
                    curl --fail-with-body --silent --show-error \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      -H 'Accept: application/vnd.github+json' \
                      -H 'X-GitHub-Api-Version: 2022-11-28' \
                      "$API_ROOT/actions/runs/$run_id/jobs?per_page=100"
                  )"
                  executed_step_count="$(jq '[.jobs[]? | ((.steps // []) | length)] | add // 0' <<<"$jobs")"
                  if (( executed_step_count == 0 )); then
                    rerun_infrastructure_failure "$workflow_name" "$run_id" "$run_attempt" 'failure_without_executed_steps'
                  else
                    fail "Required exact-SHA workflow failed after executing validation steps: $workflow_name ($state; run $run_id; executedSteps=$executed_step_count)"
                  fi
                  ;;
                completed:*)
                  fail "Required exact-SHA workflow failed: $workflow_name ($state; run $run_id)"
                  ;;
                *)
                  all_green=0
                  pending+=("$workflow_name=$state")
                  ;;
              esac
            done

            if (( all_green )); then
              break
            fi

            printf 'Exact-SHA release gates still running: %s\n' "${pending[*]}"
            sleep 30
          done

          (( all_green )) || fail 'The exact candidate did not reach the governed green state.'

          pr_json="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/pulls/$PR_NUMBER"
          )"
          jq -e \
            --arg sha "$HEAD_SHA" \
            --arg branch "$HEAD_BRANCH" \
            '.state == "open" and .head.sha == $sha and .head.ref == $branch' \
            <<<"$pr_json" >/dev/null \
            || fail 'The candidate moved after validation.'

          echo "PROTECTED_UAT_EXACT_SHA_GATES=PASSED"
          echo "PRODUCTION_MUTATION=NONE"

      - name: Dispatch exact candidate through the protected Test controller
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() {
            echo "ERROR: $*" >&2
            exit 1
          }

          existing="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/runs?event=workflow_dispatch&per_page=30"
          )"

          if jq -e --arg sha "$HEAD_SHA" '
            .workflow_runs[]
            | select(.head_sha == $sha)
            | select(
                .status == "queued" or
                .status == "in_progress" or
                (.status == "completed" and .conclusion == "success")
              )
          ' <<<"$existing" >/dev/null; then
            echo "PROTECTED_UAT_DISPATCH=ALREADY_PRESENT"
            echo "PRODUCTION_MUTATION=NONE"
            exit 0
          fi

          payload="$(
            jq -nc \
              --arg ref "$HEAD_BRANCH" \
              --arg sha "$HEAD_SHA" \
              '{ref: $ref, inputs: {release_sha: $sha, release_branch: $ref}}'
          )"

          http_status="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/protected-uat-dispatch-response.json" \
              --write-out '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/dispatches"
          )"

          if [[ "$http_status" != '204' ]]; then
            cat "$RUNNER_TEMP/protected-uat-dispatch-response.json" >&2 || true
            fail "Protected-Test workflow dispatch failed with HTTP $http_status."
          fi

          echo "PROTECTED_UAT_DISPATCH=ACCEPTED"
          echo "PROTECTED_UAT_RELEASE_SHA=$HEAD_SHA"
          echo "PROTECTED_UAT_RELEASE_BRANCH=$HEAD_BRANCH"
          echo "PRODUCTION_MUTATION=NONE"
