name: Dispatch Approved Protected UAT Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/shared-project-document-planning-governed-release-files.txt'
      - '.github/workflows/projectpulse-deploy-test.yml'
      - '.github/workflows/protected-uat-candidate-dispatch.yml'

permissions:
  actions: write
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: protected-uat-candidate-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Activate worker and dispatch exact green candidate to Protected Test
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'fix/shared-project-document-planning-')
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Wait for exact candidate release gates
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() {
            echo "ERROR: $*" >&2
            exit 1
          }

          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'The candidate SHA is invalid.'
          [[ "$HEAD_BRANCH" == fix/shared-project-document-planning-* ]] \
            || fail 'The candidate branch is outside the governed shared-planning release family.'

          pr_json="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/pulls/$PR_NUMBER"
          )"
          jq -e \
            --arg sha "$HEAD_SHA" \
            --arg branch "$HEAD_BRANCH" \
            '.state == "open" and
             .draft == false and
             .base.ref == "main" and
             .head.sha == $sha and
             .head.ref == $branch and
             .head.repo.full_name == .base.repo.full_name' \
            <<<"$pr_json" >/dev/null \
            || fail 'The pull request no longer represents the exact governed candidate.'

          required_workflows=(
            'ProjectPulse Repository Security Posture'
            'Validate Governed Protected-Test Release Controller'
            'ProjectPulse CI'
            'Validate UAT Functional Completion'
            'FlowHive Detailed Planner CI'
            'Validate Shared FlowHive and Project Forge Document Planning'
            'Validate Module 033 Project Forge'
            'Validate Module 030 Analytics Center'
            'Validate Module 030 Analytics Enterprise Experience'
            'Validate Celar AI Enterprise Platform Interface'
            'Validate Pulse AI Private Document Pipeline'
            'Validate Project Planning Collaboration Access'
            'System-wide Enterprise Reliability CI'
          )

          deadline=$((SECONDS + 5100))
          all_green=0
          while (( SECONDS < deadline )); do
            runs="$(
              curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$API_ROOT/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100"
            )"

            all_green=1
            pending=()
            for workflow_name in "${required_workflows[@]}"; do
              state="$(
                jq -r --arg name "$workflow_name" '
                  [.workflow_runs[] | select(.name == $name)]
                  | sort_by(.created_at)
                  | last
                  | if . == null
                    then "missing:"
                    else "\(.status):\(.conclusion // "")"
                    end
                ' <<<"$runs"
              )"

              case "$state" in
                completed:success)
                  ;;
                completed:*)
                  fail "Required exact-SHA workflow failed: $workflow_name ($state)"
                  ;;
                *)
                  all_green=0
                  pending+=("$workflow_name=$state")
                  ;;
              esac
            done

            if (( all_green )); then
              break
            fi

            printf 'Exact-SHA release gates still running: %s\n' "${pending[*]}"
            sleep 30
          done

          (( all_green )) || fail 'The exact candidate did not reach the governed green state.'

          pr_json="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/pulls/$PR_NUMBER"
          )"
          jq -e \
            --arg sha "$HEAD_SHA" \
            --arg branch "$HEAD_BRANCH" \
            '.state == "open" and .head.sha == $sha and .head.ref == $branch' \
            <<<"$pr_json" >/dev/null \
            || fail 'The candidate moved after validation.'

          echo "PROTECTED_UAT_EXACT_SHA_GATES=PASSED"
          echo "PRODUCTION_MUTATION=NONE"

      - name: Sign in to protected Test subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Activate the private document worker in protected Test
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() {
            echo "ERROR: $*" >&2
            exit 1
          }

          CURRENT_SUBSCRIPTION="$(az account show --query id -o tsv --only-show-errors)"
          [[ "${CURRENT_SUBSCRIPTION,,}" == "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]] \
            || fail 'Azure login is outside the protected Test subscription.'

          API_JSON="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            -o json \
            --only-show-errors)"

          [[ "$(jq -r '.tags.environment // empty' <<<"$API_JSON")" == test ]] \
            || fail 'The API application is not tagged as Test.'
          [[ "$(jq -r '.properties.configuration.activeRevisionsMode // empty' <<<"$API_JSON" | tr '[:upper:]' '[:lower:]')" == single ]] \
            || fail 'The protected Test API must use single-revision mode.'

          BASE='${{ vars.PUBLIC_URL }}'
          BASE="${BASE%/}"
          [[ "$BASE" == https://phd-west-test.onenecklab.com ]] \
            || fail 'The configured public origin is not protected Test.'

          BEFORE_IMAGE="$(jq -r '.properties.template.containers[0].image // empty' <<<"$API_JSON")"
          BEFORE_SOURCE="$(jq -r '
            [.properties.template.containers[0].env[]?
             | select(.name == "PROJECTPULSE_SOURCE_COMMIT")
             | .value // empty]
            | if length == 1 then .[0] else empty end
          ' <<<"$API_JSON")"
          [[ -n "$BEFORE_IMAGE" ]] || fail 'The current Test API image is unavailable.'
          [[ "$BEFORE_SOURCE" =~ ^[0-9a-f]{40}$ ]] || fail 'The current Test source marker is invalid.'

          WORKER_COUNT="$(jq '
            [.properties.template.containers[0].env[]?
             | select(.name == "PROJECTPULSE_PULSE_AI_PRIVATE_RUNTIME_WORKER_ENABLED")]
            | length
          ' <<<"$API_JSON")"
          (( WORKER_COUNT <= 1 )) || fail 'The worker setting is duplicated.'

          if (( WORKER_COUNT == 1 )); then
            WORKER_SECRET_REF="$(jq -r '
              [.properties.template.containers[0].env[]?
               | select(.name == "PROJECTPULSE_PULSE_AI_PRIVATE_RUNTIME_WORKER_ENABLED")]
              | .[0].secretRef // empty
            ' <<<"$API_JSON")"
            [[ -z "$WORKER_SECRET_REF" ]] \
              || fail 'The worker setting must not be secret-backed.'

            WORKER_VALUE="$(jq -r '
              [.properties.template.containers[0].env[]?
               | select(.name == "PROJECTPULSE_PULSE_AI_PRIVATE_RUNTIME_WORKER_ENABLED")]
              | .[0].value // empty
            ' <<<"$API_JSON" | tr '[:upper:]' '[:lower:]')"
          else
            WORKER_VALUE=''
          fi

          if [[ "$WORKER_VALUE" != true ]]; then
            az containerapp update \
              -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
              -n '${{ vars.AZURE_API_APP }}' \
              --set-env-vars PROJECTPULSE_PULSE_AI_PRIVATE_RUNTIME_WORKER_ENABLED=true \
              --revision-suffix "fhw-${GITHUB_RUN_ID}" \
              --output none \
              --only-show-errors
          fi

          AFTER_JSON="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            -o json \
            --only-show-errors)"

          AFTER_IMAGE="$(jq -r '.properties.template.containers[0].image // empty' <<<"$AFTER_JSON")"
          AFTER_SOURCE="$(jq -r '
            [.properties.template.containers[0].env[]?
             | select(.name == "PROJECTPULSE_SOURCE_COMMIT")
             | .value // empty]
            | if length == 1 then .[0] else empty end
          ' <<<"$AFTER_JSON")"
          AFTER_WORKER_COUNT="$(jq '
            [.properties.template.containers[0].env[]?
             | select(.name == "PROJECTPULSE_PULSE_AI_PRIVATE_RUNTIME_WORKER_ENABLED")]
            | length
          ' <<<"$AFTER_JSON")"
          AFTER_WORKER_VALUE="$(jq -r '
            [.properties.template.containers[0].env[]?
             | select(.name == "PROJECTPULSE_PULSE_AI_PRIVATE_RUNTIME_WORKER_ENABLED")]
            | .[0].value // empty
          ' <<<"$AFTER_JSON" | tr '[:upper:]' '[:lower:]')"
          AFTER_WORKER_SECRET_REF="$(jq -r '
            [.properties.template.containers[0].env[]?
             | select(.name == "PROJECTPULSE_PULSE_AI_PRIVATE_RUNTIME_WORKER_ENABLED")]
            | .[0].secretRef // empty
          ' <<<"$AFTER_JSON")"

          [[ "$AFTER_IMAGE" == "$BEFORE_IMAGE" ]] \
            || fail 'Worker activation unexpectedly changed the API image.'
          [[ "$AFTER_SOURCE" == "$BEFORE_SOURCE" ]] \
            || fail 'Worker activation unexpectedly changed the source marker.'
          [[ "$AFTER_WORKER_COUNT" == 1 && "$AFTER_WORKER_VALUE" == true && -z "$AFTER_WORKER_SECRET_REF" ]] \
            || fail 'The protected Test private document worker did not activate cleanly.'

          HEALTH_READY=0
          for attempt in $(seq 1 36); do
            STATUS="$(curl -sS --max-time 30 \
              -o "$RUNNER_TEMP/protected-test-worker-health.json" \
              -w '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "$BASE/health?private_worker_activation=$GITHUB_RUN_ID-$attempt" || true)"
            if [[ "$STATUS" == 200 ]] \
              && jq -e '.status == "healthy"' "$RUNNER_TEMP/protected-test-worker-health.json" >/dev/null 2>&1; then
              HEALTH_READY=1
              break
            fi
            sleep 10
          done
          (( HEALTH_READY )) || fail 'Protected Test did not become healthy after worker activation.'

          {
            echo '## Protected Test private document worker'
            echo
            echo '- Environment: Protected Test only'
            echo '- Worker activation: enabled'
            echo "- Existing API image preserved: \`$AFTER_IMAGE\`"
            echo "- Existing source marker preserved: \`$AFTER_SOURCE\`"
            echo '- Production mutation: none'
          } >> "$GITHUB_STEP_SUMMARY"

          echo 'PROTECTED_TEST_PRIVATE_DOCUMENT_WORKER=ENABLED'
          echo 'PROTECTED_TEST_APPLICATION_IMAGE_MUTATION=NONE'
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Dispatch exact candidate through the protected Test controller
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() {
            echo "ERROR: $*" >&2
            exit 1
          }

          existing="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/runs?event=workflow_dispatch&per_page=30"
          )"

          if jq -e --arg sha "$HEAD_SHA" '
            .workflow_runs[]
            | select(.head_sha == $sha)
            | select(
                .status == "queued" or
                .status == "in_progress" or
                (.status == "completed" and .conclusion == "success")
              )
          ' <<<"$existing" >/dev/null; then
            echo "PROTECTED_UAT_DISPATCH=ALREADY_PRESENT"
            echo "PRODUCTION_MUTATION=NONE"
            exit 0
          fi

          payload="$(
            jq -nc \
              --arg ref "$HEAD_BRANCH" \
              --arg sha "$HEAD_SHA" \
              '{ref: $ref, inputs: {release_sha: $sha, release_branch: $ref}}'
          )"

          http_status="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/protected-uat-dispatch-response.json" \
              --write-out '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/dispatches"
          )"

          if [[ "$http_status" != '204' ]]; then
            cat "$RUNNER_TEMP/protected-uat-dispatch-response.json" >&2 || true
            fail "Protected-Test workflow dispatch failed with HTTP $http_status."
          fi

          echo "PROTECTED_UAT_DISPATCH=ACCEPTED"
          echo "PROTECTED_UAT_RELEASE_SHA=$HEAD_SHA"
          echo "PROTECTED_UAT_RELEASE_BRANCH=$HEAD_BRANCH"
          echo "PRODUCTION_MUTATION=NONE"
