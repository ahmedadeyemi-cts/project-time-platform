name: Validate Oracle Celar GitOps and Recovery Package

on:
  pull_request:
    paths:
      - 'deployment/oracle-celar/**'
      - '.github/workflows/celar-ai-oracle-gitops-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celar-oracle-gitops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate syntax and governed manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in deployment/oracle-celar/{bootstrap,deploy,gitops,health-check,backup,restore,ollama-update}.sh; do
            bash -n "$script"
          done
          python3 -m py_compile deployment/oracle-celar/gateway/gateway.py deployment/oracle-celar/gateway/wsgi.py
          jq -e '
            .schema == 1 and
            .environment == "protected-test-oracle-celar" and
            .hostname == "celarai.onenecklab.com" and
            .architecture == "arm64" and
            .gatewayVersion == "1.1.0" and
            .gatewayBind == "127.0.0.1:8787" and
            .generationModel == "gemma3:4b" and
            .reasoningModel == "qwen3:4b-instruct" and
            .fastGeneralModel == "llama3.2:3b" and
            .embeddingModel == "embeddinggemma" and
            .embeddingDimension == 768 and
            .ocrModel == "tesseract-5-eng" and
            .localGenerationModels == ["gemma3:4b","qwen3:4b-instruct","llama3.2:3b"] and
            .structuredGenerationOrder == ["gemma3:4b","qwen3:4b-instruct","llama3.2:3b"] and
            .generalGenerationOrder == ["qwen3:4b-instruct","llama3.2:3b","gemma3:4b"] and
            .ollamaHost == "127.0.0.1:11434" and
            .clamavHost == "127.0.0.1" and .clamavPort == 3310 and
            .maxUploadBytes > 0 and .maxOcrPages > 0 and
            .maxOcrImagePixels > 0 and .maxOcrImageEdge > 0 and .pdfRasterMaxEdge > 0
          ' deployment/oracle-celar/release.json >/dev/null

      - name: Validate gateway and local specialist policy
        shell: bash
        run: |
          set -Eeuo pipefail
          GATEWAY=deployment/oracle-celar/gateway/gateway.py
          WSGI=deployment/oracle-celar/gateway/wsgi.py
          UNIT=deployment/oracle-celar/systemd/celar-ai-gateway.service
          CADDY=deployment/oracle-celar/caddy/Caddyfile

          python3 - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('deployment/oracle-celar/gateway/gateway.py').read_text())
          routes = set()
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  for dec in node.decorator_list:
                      if isinstance(dec, ast.Call) and isinstance(dec.func, ast.Attribute) and dec.func.attr in {'get','post'} and dec.args:
                          arg = dec.args[0]
                          if isinstance(arg, ast.Constant) and isinstance(arg.value, str):
                              routes.add((dec.func.attr.upper(), arg.value))
          expected = {('GET','/health'),('POST','/v1/chat/completions'),('POST','/v1/embeddings'),('POST','/v1/extract'),('POST','/v1/scan')}
          if routes != expected:
              raise SystemExit(f'Unexpected gateway routes: {sorted(routes)}')
          PY

          ! grep -Fq '/train' "$GATEWAY"
          grep -Fq 'hmac.compare_digest' "$GATEWAY"
          grep -Fq 'private_pulse_runtime_only' "$GATEWAY"
          grep -Fq 'STRUCTURED_ORDER' "$WSGI"
          grep -Fq 'GENERAL_ORDER' "$WSGI"
          grep -Fq 'X-Celar-Local-Model' "$WSGI"
          grep -Fq 'if status < 500' "$WSGI"
          grep -Fq 'fcntl.LOCK_EX | fcntl.LOCK_NB' "$WSGI"
          grep -Fq 'MAX_OCR_IMAGE_PIXELS' "$WSGI"
          grep -Fq 'PDF_RASTER_MAX_EDGE' "$WSGI"
          grep -Fq '"-scale-to", str(PDF_RASTER_MAX_EDGE)' "$WSGI"
          grep -Fq 'image.verify()' "$WSGI"

          grep -Fq 'reverse_proxy 127.0.0.1:8787' "$CADDY"
          grep -Fq 'disable_http_challenge' "$CADDY"
          grep -Fq 'User=celar-ai' "$UNIT"
          grep -Fq 'TemporaryFileSystem=/tmp:rw,nosuid,nodev,noexec,size=768M' "$UNIT"
          grep -Fq 'LimitAS=1536M' "$UNIT"
          grep -Fq 'LimitFSIZE=64M' "$UNIT"
          grep -Fq 'MemoryMax=2G' "$UNIT"
          grep -Fq 'NoNewPrivileges=true' "$UNIT"

      - name: Reject secrets and unsafe exposure
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -RInE --exclude='README.md' --exclude='backup.env.example' '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ssh-ed25519 AAAA)' deployment/oracle-celar; then
            echo 'Embedded private key material is prohibited.' >&2; exit 1
          fi
          if grep -RInE '(0\.0\.0\.0:11434|0\.0\.0\.0.*3310|TCPAddr[[:space:]]+0\.0\.0\.0|0\.0\.0\.0:8787)' deployment/oracle-celar; then
            echo 'A private service would be publicly exposed.' >&2; exit 1
          fi
          DEPLOY=deployment/oracle-celar/deploy.sh
          HEALTH=deployment/oracle-celar/health-check.sh
          grep -Fq 'CELAR_REASONING_MODEL=$REASONING_MODEL' "$DEPLOY"
          grep -Fq 'CELAR_FAST_GENERAL_MODEL=$FAST_GENERAL_MODEL' "$DEPLOY"
          grep -Fq 'systemctl restart ollama.service' "$DEPLOY"
          grep -Fq 'systemctl restart celar-ai-gateway.service' "$DEPLOY"
          grep -Fq 'systemctl restart caddy.service' "$DEPLOY"
          grep -Fq -- '--config "$AUTH_CONFIG"' "$HEALTH"
          if grep -Fq 'Authorization: Bearer $RUNTIME_TOKEN' "$HEALTH"; then
            echo 'Runtime token must not appear in curl argv.' >&2; exit 1
          fi

      - name: Validate backup, rollback, and acceptance invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          BACKUP=deployment/oracle-celar/backup.sh
          UPDATE=deployment/oracle-celar/ollama-update.sh
          HEALTH=deployment/oracle-celar/health-check.sh
          grep -Fq 'fetch --no-tags --prune origin main' deployment/oracle-celar/gitops.sh
          grep -Fq 'restic backup' "$BACKUP"
          grep -Fq 'restic restore' deployment/oracle-celar/restore.sh
          grep -Fq -- "--exclude='/var/lib/celar-ai/recovery'" "$BACKUP"
          grep -Fq 'mapfile -t GENERATION_MODELS' "$UPDATE"
          grep -Fq 'for model in "${GENERATION_MODELS[@]}" "$EMBEDDING_MODEL"' "$UPDATE"
          grep -Fq 'install -m "$OLD_BINARY_MODE" "$BACKUP_BINARY" "$OLD_BINARY"' "$UPDATE"
          ! grep -Fq 'chmod 0700 "$BACKUP_BINARY"' "$UPDATE"
          grep -Fq '"$HEALTH_CHECK"' "$UPDATE"
          grep -Fq 'CELAR_OLLAMA_UPDATE=PASS' "$UPDATE"
          grep -Fq 'PUBLIC_HTTPS_AUTH_BOUNDARY=PASS' "$HEALTH"
          grep -Fq 'LOCAL_REASONING_ROUTE=PASS' "$HEALTH"
          grep -Fq 'LOCAL_STRUCTURED_ROUTE=PASS' "$HEALTH"
          grep -Fq 'LOCAL_FAST_FALLBACK_PRESENT=PASS' "$HEALTH"
          grep -Fq 'EMBEDDING_GATEWAY=PASS' "$HEALTH"
          grep -Fq 'MALWARE_GATEWAY=PASS' "$HEALTH"
          grep -Fq 'OCR_GATEWAY=PASS' "$HEALTH"
          git diff --check "${{ github.event.pull_request.base.sha || github.sha }}"..HEAD || git diff --check
