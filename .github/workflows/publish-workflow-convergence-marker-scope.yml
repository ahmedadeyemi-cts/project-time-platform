name: Publish workflow-convergence marker-scope blobs

on:
  push:
    branches:
      - 'fix/remaining-release-train-specialized-workflow-convergence-20260801-dependency-applicability'
    paths:
      - '.github/workflows/publish-workflow-convergence-marker-scope.yml'

permissions:
  contents: write

concurrency:
  group: workflow-convergence-marker-scope-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Generate and verify workflow-convergence marker scope
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changes = (
              (
                  Path('.github/workflows/celar-ai-runtime-rebrand-ci.yml'),
                  'CELAR_AI_RUNTIME_REBRAND_VALIDATION_MODE',
                  'CELAR_AI_DEPENDENCY_ONLY_FRONTEND_BUILD=PASSED',
              ),
              (
                  Path('.github/workflows/pulse-ai-system-intelligence-ci.yml'),
                  'PULSE_AI_SYSTEM_INTELLIGENCE_VALIDATION_MODE',
                  'PULSE_AI_SYSTEM_INTELLIGENCE_DEPENDENCY_ONLY_FRONTEND_BUILD=PASSED',
              ),
          )

          for path, mode_var, success_marker in changes:
              text = path.read_text(encoding='utf-8')
              old = (
                  '          if [[ "$STATUS" != \'0\' ]]; then exit "$STATUS"; fi\n'
                  '          if [[ "${PROJECTPULSE_DEPENDENCY_ONLY:-false}" == \'true\' ]]; then\n'
                  '            test -s dist/index.html'
              )
              new = (
                  '          if [[ "$STATUS" != \'0\' ]]; then exit "$STATUS"; fi\n'
                  f'          if [[ "${{PROJECTPULSE_DEPENDENCY_ONLY:-false}}" == \'true\' || "${{{mode_var}:-}}" == \'WORKFLOW_CONVERGENCE\' ]]; then\n'
                  '            test -s dist/index.html'
              )
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one compiled-output applicability target, found {count}')
              text = text.replace(old, new, 1)
              if success_marker not in text:
                  raise SystemExit(f'{path}: compiled-output success marker missing after patch')
              path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          mkdir -p .github/generated
          cp .github/workflows/celar-ai-runtime-rebrand-ci.yml \
             .github/generated/celar-ai-runtime-rebrand-ci.workflow-convergence.yml.txt
          cp .github/workflows/pulse-ai-system-intelligence-ci.yml \
             .github/generated/pulse-ai-system-intelligence-ci.workflow-convergence.yml.txt

          # Only ordinary snapshots are committed by the workflow token. The
          # repository API maps them to workflow paths in a separate atomic commit.
          git checkout -- \
            .github/workflows/celar-ai-runtime-rebrand-ci.yml \
            .github/workflows/pulse-ai-system-intelligence-ci.yml
          git diff --check

      - name: Commit verified ordinary blob snapshots
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/generated/
          mapfile -t CHANGED < <(git diff --cached --name-only | LC_ALL=C sort)
          printf '%s\n' "${CHANGED[@]}"
          [[ "${#CHANGED[@]}" == 2 ]]
          [[ "${CHANGED[0]}" == '.github/generated/celar-ai-runtime-rebrand-ci.workflow-convergence.yml.txt' ]]
          [[ "${CHANGED[1]}" == '.github/generated/pulse-ai-system-intelligence-ci.workflow-convergence.yml.txt' ]]
          git commit -m 'CI: publish verified workflow-convergence marker-scope blobs'
          git push origin "HEAD:${GITHUB_REF_NAME}"
