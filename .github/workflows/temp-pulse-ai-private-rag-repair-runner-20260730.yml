name: Temporary Pulse AI Private RAG Repair Runner 2026-07-30

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: temp-pulse-ai-private-rag-repair-runner-20260730
  cancel-in-progress: false

jobs:
  repair-validate-and-push:
    if: >-
      github.actor == 'ahmedadeyemi-cts' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/pulse-ai-private-rag-post-merge-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out exact repair PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Verify exact source and protected boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          CURRENT_MAIN="$(git rev-parse origin/main)"
          EXPECTED_REPAIR_BASE='b579a56140e302c96ca4af363611fa1e2a9b9734'
          git cat-file -e "$EXPECTED_REPAIR_BASE^{commit}"
          [[ "$(git merge-base "$CURRENT_MAIN" HEAD)" == "$EXPECTED_REPAIR_BASE" ]] || {
            echo "Repair branch no longer has the reviewed broken-main base $EXPECTED_REPAIR_BASE." >&2
            exit 1
          }
          [[ "$(git merge-base "$EXPECTED_REPAIR_BASE" HEAD)" == "$EXPECTED_REPAIR_BASE" ]]
          test -s scripts/repair-pulse-ai-private-rag-post-merge-20260730.py
          for protected in \
            '.github/workflows/projectpulse-deploy-runtime-direct-timer-recovery-test.yml' \
            '.github/workflows/validate-runtime-direct-timer-recovery-deployment.yml' \
            'scripts/validate-runtime-direct-timer-recovery-test-deployment.sh'; do
            git diff --quiet "$EXPECTED_REPAIR_BASE"...HEAD -- "$protected"
          done
          echo "PULSE_AI_REPAIR_CURRENT_MAIN=$CURRENT_MAIN"
          echo "PULSE_AI_REPAIR_BASE=$EXPECTED_REPAIR_BASE"
          echo "PULSE_AI_REPAIR_HEAD=$(git rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Apply deterministic private RAG source repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/repair-pulse-ai-private-rag-post-merge-20260730.py
          python scripts/repair-pulse-ai-private-rag-post-merge-20260730.py
          python - <<'PY'
          from pathlib import Path

          validator = Path('src/frontend/project-time-web/scripts/validate-module-011-private-rag-orchestration.mjs')
          validator_text = validator.read_text(encoding='utf-8')
          old_order = "timesheet.indexOf('_privateRag.GenerateTimesheetAsync') < timesheet.indexOf('_router.GenerateAsync')"
          new_order = "timesheet.indexOf('GeneratePrivateRagAsync(request') < timesheet.indexOf('_router.GenerateAsync')"
          if old_order in validator_text:
              validator_text = validator_text.replace(old_order, new_order, 1)
              validator.write_text(validator_text, encoding='utf-8')
          elif new_order not in validator_text:
              raise SystemExit('Expected the Timesheet private-first ordering validator marker exactly once.')

          migration_test = Path('tests/test-pulse-ai-private-rag-migration-053.sh')
          migration_text = migration_test.read_text(encoding='utf-8')
          old_boolean = 'assert_eq false "$(value "SELECT training_candidate FROM pulse_ai_answer_feedback LIMIT 1;")" feedback_not_training_by_default'
          new_boolean = 'assert_eq f "$(value "SELECT training_candidate FROM pulse_ai_answer_feedback LIMIT 1;")" feedback_not_training_by_default'
          if old_boolean in migration_text:
              migration_text = migration_text.replace(old_boolean, new_boolean, 1)
              migration_test.write_text(migration_text, encoding='utf-8')
          elif new_boolean not in migration_text:
              raise SystemExit('Expected the migration 053 boolean assertion exactly once.')
          PY
          git diff --check

      - name: Validate private RAG and preserved Module 011 contracts
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check ./scripts/validate-module-011-private-rag-orchestration.mjs
          node ./scripts/validate-module-011-private-rag-orchestration.mjs
          node ./scripts/validate-module-011-private-runtime-activation.mjs
          node ./scripts/validate-module-011-private-document-pipeline.mjs
          node ./scripts/validate-module-011-pulse-ai-deep-intelligence.mjs
          node ./scripts/validate-module-011-pulse-ai.mjs
          node ./scripts/validate-module-066-project-flowhive.mjs

      - name: Test migrations 052 and 053 locally
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x tests/test-pulse-ai-private-document-runtime-migration-052.sh
          chmod +x tests/test-pulse-ai-private-rag-migration-053.sh
          tests/test-pulse-ai-private-document-runtime-migration-052.sh
          tests/test-pulse-ai-private-rag-migration-053.sh

      - name: Build ProjectTime API Release
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet restore src/backend/ProjectTime.Api/ProjectTime.Api.csproj
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --no-restore

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run build
          cat dist/assets/*.js > /tmp/pulse-ai-private-rag-repair.js
          cat dist/assets/*.css > /tmp/pulse-ai-private-rag-repair.css
          for marker in \
            'Live Private RAG for Timesheet, Help/Search & FlowHive' \
            'Private RAG Readiness' \
            'Timesheet Suggestion' \
            'FlowHive Draft' \
            'Answer Audit & Feedback' \
            'Private source citations'; do
            grep -Fq "$marker" /tmp/pulse-ai-private-rag-repair.js
          done
          grep -Fq '.pulse-ai-rag-workbench' /tmp/pulse-ai-private-rag-repair.css

      - name: Validate production web-container build context
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build \
            --file deployment/containers/web/Dockerfile \
            --tag "projectpulse-private-rag-repair:${GITHUB_SHA}" \
            .

      - name: Commit and push validated source repair
        shell: bash
        env:
          TARGET_BRANCH: fix/pulse-ai-private-rag-post-merge-20260730
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagService.cs \
            src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagRepository.cs \
            src/backend/ProjectTime.Api/Ai/ProjectPulseAiServiceCollectionExtensions.cs \
            src/backend/ProjectTime.Api/Modules/PulseAiPrivateRuntimeModule.cs \
            src/backend/ProjectTime.Api/ProjectPulseAiTimeEntrySuggestionService.cs \
            src/frontend/project-time-web/src/WorkTaskBuilderPanel.jsx \
            src/frontend/project-time-web/scripts/validate-module-011-private-rag-orchestration.mjs \
            tests/test-pulse-ai-private-rag-migration-053.sh
          if git diff --cached --quiet; then
            echo 'PULSE_AI_PRIVATE_RAG_REPAIR_ALREADY_CURRENT=YES'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Repair Pulse AI private RAG integration after stacked merge'
          git push origin "HEAD:$TARGET_BRANCH"
          echo 'PULSE_AI_PRIVATE_RAG_REPAIR_PUSHED=YES'

      - name: Publish repair evidence
        shell: bash
        run: |
          {
            echo '## Pulse AI private RAG post-merge repair'
            echo
            echo '- Deterministic repair script: passed'
            echo '- Migrations 052/053 local apply, rollback, and reapply: passed'
            echo '- API Release build: passed'
            echo '- Complete frontend production build: passed'
            echo '- Web-container build context: passed'
            echo '- Connected migration execution: none'
            echo '- Deployment: none'
            echo '- Private worker, OCR, embeddings, inference, vector index, provider routing, Azure, and Production changes: none'
          } >> "$GITHUB_STEP_SUMMARY"
