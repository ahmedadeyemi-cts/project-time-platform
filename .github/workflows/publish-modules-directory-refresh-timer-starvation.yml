name: Publish Modules Directory Non-Starving Refresh Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-modules-directory-refresh-timer-starvation.yml'
      - 'scripts/release-test/finalize-modules-directory-refresh-timer-starvation.py'

permissions:
  contents: write

concurrency:
  group: publish-modules-directory-refresh-timer-starvation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/modules-directory-refresh-timer-starvation-20260818'
    name: Repair, validate, and publish Modules refresh scheduling
    runs-on: ubuntu-24.04
    timeout-minutes: 80

    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '10.0.x'

      - name: Apply guarded non-starving refresh repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/release-test/finalize-modules-directory-refresh-timer-starvation.py

      - name: Validate focused Modules contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          (
            cd src/frontend/project-time-web
            node scripts/validate-modules-directory-page.mjs
          )
          git diff --check

      - name: Build API
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install, audit, and build complete frontend
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run build

      - name: Commit and push reviewed application source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add \
            src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx \
            src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs \
            src/frontend/project-time-web/scripts/validate-modules-directory-page.mjs \
            scripts/release-test/finalize-modules-directory-refresh-timer-starvation.py
          git diff --cached --quiet && {
            echo 'ERROR: Modules refresh-timer repair produced no application source change.' >&2
            exit 1
          }
          git commit -m 'fix(modules): prevent directory refresh timer starvation'
          git push origin HEAD:fix/modules-directory-refresh-timer-starvation-20260818
