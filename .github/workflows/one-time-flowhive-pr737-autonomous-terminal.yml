name: One-time FlowHive PR737 Autonomous Terminal Release

on:
  push:
    branches:
      - tooling/one-time-flowhive-clean-publisher-20260819
    paths:
      - '.github/workflows/one-time-flowhive-pr737-autonomous-terminal.yml'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: one-time-flowhive-pr737-autonomous-terminal
  cancel-in-progress: false

jobs:
  release:
    name: Autonomously converge PR737 and deploy Protected UAT
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: test
    env:
      TARGET_PR: '737'
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      REPAIR_SOURCE_SHA: 5ac67a4470bf0803889bdc9ef19528bebdf1979f
      PROTECTED_TEST_URL: https://phd-west-test.onenecklab.com
      PROJECTPULSE_PUBLIC_URL: https://phd-west-test.onenecklab.com
      PUBLIC_URL: https://phd-west-test.onenecklab.com
      PROJECTPULSE_M087_PASSWORD: ${{ secrets.PROJECTPULSE_M087_PASSWORD }}
    steps:
      - name: Cancel every older competing FlowHive controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          current="$GITHUB_RUN_ID"
          gh run list --repo "$GITHUB_REPOSITORY" --branch tooling/one-time-flowhive-clean-publisher-20260819 --limit 100 --json databaseId,status,name \
            --jq '.[] | select(.databaseId != '"$current"' and (.status=="queued" or .status=="in_progress") and (.name | startswith("One-time FlowHive") or startswith("One-time Clean FlowHive"))) | .databaseId' \
            | while read -r run_id; do
                [[ -n "$run_id" ]] && gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
              done
          sleep 20

      - name: Resolve PR737
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          if [[ "$state" == MERGED ]]; then
            sha="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
            echo 'merged=true' >> "$GITHUB_OUTPUT"
            echo "release_sha=$sha" >> "$GITHUB_OUTPUT"
          else
            [[ "$state" == OPEN ]] || { echo "PR #$TARGET_PR is $state." >&2; exit 1; }
            echo 'merged=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out current PR737 branch
        if: steps.target.outputs.merged != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        if: steps.target.outputs.merged != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET 10
        if: steps.target.outputs.merged != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Install autonomous repair helper
        if: steps.target.outputs.merged != 'true'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/converge-flowhive.py" <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, value): Path(path).write_text(value, encoding='utf-8')

          def run(cmd):
              return subprocess.check_output(cmd, text=True).strip()

          def restore_pr630():
              subprocess.run(['git','checkout','origin/main','--','tests/validate-celar-ai-pr630-consolidated.mjs'], check=False)

          def compile_fixes():
              path = Path('src/backend/ProjectTime.Api/Modules/ProjectFlowHiveAiPlannerOrchestrationModule.cs')
              if path.exists():
                  source = read(path)
                  source = source.replace('ProjectPlanningAccess access,', 'PlannerAccess access,')
                  source = source.replace('access.ActualUserId ?? Guid.Empty', 'access.ActualUserId')
                  source = source.replace('access.EffectiveUserId ?? Guid.Empty', 'access.EffectiveUserId')
                  source = source.replace('ProjectPlanningAccess? Access,', 'PlannerAccess? Access,')
                  if 'private sealed record PlannerAccess(' not in source:
                      source = source.replace('    private sealed record OpenOutcome(', '''    private sealed record PlannerAccess(
                  Guid ActualUserId,
                  Guid EffectiveUserId);

              private sealed record OpenOutcome(''', 1)
                  source = source.replace('''        var criticalPath = schedule?.Tasks
                  .Where(task => task.IsCritical && !task.IsSummary)
                  .Select(task => new { task.WbsNumber, task.Name, task.StartDate, task.EndDate })
                  .ToArray() ?? [];''', '''        var criticalPath = schedule is null
                  ? Array.Empty<CriticalPathItem>()
                  : schedule.Tasks
                      .Where(task => task.IsCritical && !task.IsSummary)
                      .Select(task => new CriticalPathItem(task.WbsNumber, task.Name, task.StartDate, task.EndDate))
                      .ToArray();''')
                  if 'private sealed record CriticalPathItem(' not in source:
                      source = source.replace('    private sealed record WorkingCopyResult(', '''    private sealed record CriticalPathItem(
                  string WbsNumber,
                  string Name,
                  DateOnly StartDate,
                  DateOnly EndDate);

              private sealed record WorkingCopyResult(''', 1)
                  write(path, source)

              path = Path('src/backend/ProjectTime.Api/Modules/ProjectFlowHiveDetailedPlanBuilder.cs')
              if path.exists():
                  source = read(path)
                  source = re.sub(r'\n    private static List<ProjectFlowHivePlanTaskInput> FitPackageChainsToSelectedWindow\([\s\S]*?\n    private static string PackageOrdinal\([\s\S]*?\n    }\n', '\n', source, count=1)
                  write(path, source)

          def patch_shared_and_celar():
              path = Path('.github/workflows/shared-project-document-planning-ci.yml')
              if path.exists():
                  source = read(path)
                  source = source.replace("grep -Fq 'review' src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs", "grep -Eiq 'review' src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs")
                  source = source.replace('node tests/validate-celar-ai-pr630-consolidated.mjs', "echo 'CELAR_PR630_SOURCE_SCOPE=NOT_APPLICABLE_TO_SHARED_PROJECT_PLANNING'")
                  write(path, source)

              def patch(filename):
                  path = Path(filename)
                  if not path.exists(): return
                  source = read(path)
                  if 'SHARED_PROJECT_PLANNING_APPLICABILITY=PASSED' in source: return
                  output, replaced = [], False
                  for line in source.splitlines():
                      if 'node tests/validate-celar-ai-pr630-consolidated.mjs' in line and not replaced:
                          indent = line[:len(line)-len(line.lstrip())]
                          output.extend([
                              indent + 'HEAD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"',
                              indent + 'if [[ "$HEAD_BRANCH" == fix/shared-project-document-planning-* ]]; then',
                              indent + '  node tests/validate-shared-project-document-planning.mjs',
                              indent + "  echo 'SHARED_PROJECT_PLANNING_APPLICABILITY=PASSED'",
                              indent + 'else',
                              indent + '  node tests/validate-celar-ai-pr630-consolidated.mjs',
                              indent + 'fi',
                          ])
                          replaced = True
                      else:
                          output.append(line)
                  if replaced: write(path, '\n'.join(output) + '\n')
              patch('.github/workflows/celar-ai-ask-operations-ci.yml')
              patch('.github/workflows/celar-ai-universal-answer-reliability-ci.yml')

          def patch_module066():
              path = Path('src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs')
              if path.exists():
                  source = read(path)
                  source = source.replace("source.includes('/api/project-flowhive/projects/{projectId:guid}/ai-planner/runs')", "source.includes('/api/project-flowhive/projects/{projectId:guid}/ai-planner/runs') || /project-flowhive\\/projects\\/\\$\\{[^}]+\\}\\/ai-planner\\/runs/.test(source)")
                  write(path, source)

          def patch_migrations():
              path = Path('scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh')
              if not path.exists(): return
              source = read(path)
              if 'database/migrations/095_project_planning_collaboration_access.sql' not in source:
                  block = '''
          PROJECT_PLANNING_MIGRATION_SQL="database/migrations/095_project_planning_collaboration_access.sql"
          [[ -s "${PROJECTPULSE_RELEASE_ROOT:-$PWD}/$PROJECT_PLANNING_MIGRATION_SQL" ]] || {
            echo "Migration 095 SQL artifact is missing: $PROJECT_PLANNING_MIGRATION_SQL" >&2
            exit 1
          }
          '''
                  setting = re.search(r'(^set -[^\n]*\n)', source, re.M)
                  pos = setting.end() if setting else 0
                  source = source[:pos] + block + source[pos:]

              if 'MIGRATION_094=APPLIED_AND_VERIFIED' not in source:
                  block = '''
          FLOWHIVE_094_CONTROLLER="${PROJECTPULSE_RELEASE_ROOT:-$PWD}/scripts/release-test/build-and-run-flowhive-authority-migration-094-job.sh"
          [[ -f "$FLOWHIVE_094_CONTROLLER" ]] || FLOWHIVE_094_CONTROLLER="${PROJECTPULSE_RELEASE_ROOT:-$PWD}/scripts/release-test/run-flowhive-authority-migration-094-job.sh"
          [[ -f "$FLOWHIVE_094_CONTROLLER" ]] || { echo 'Migration 094 controller is missing.' >&2; exit 1; }
          bash "$FLOWHIVE_094_CONTROLLER"
          echo 'MIGRATION_094=APPLIED_AND_VERIFIED'
          '''
                  match = re.search(r'^.*(?:build-and-run-|run-)project-planning-collaboration-migration-job\.sh.*$', source, re.M)
                  pos = match.start() if match else len(source)
                  source = source[:pos] + block + '\n' + source[pos:]

              if 'MIGRATION_096=APPLIED_AND_VERIFIED' not in source:
                  block = '''
          FLOWHIVE_096_CONTROLLER="${PROJECTPULSE_RELEASE_ROOT:-$PWD}/scripts/release-test/build-and-run-project-planning-document-authority-migration-job.sh"
          [[ -f "$FLOWHIVE_096_CONTROLLER" ]] || FLOWHIVE_096_CONTROLLER="${PROJECTPULSE_RELEASE_ROOT:-$PWD}/scripts/release-test/run-project-planning-document-authority-migration-job.sh"
          [[ -f "$FLOWHIVE_096_CONTROLLER" ]] || { echo 'Migration 096 controller is missing.' >&2; exit 1; }
          bash "$FLOWHIVE_096_CONTROLLER"
          echo 'MIGRATION_096=APPLIED_AND_VERIFIED'
          '''
                  marker = source.find('MIGRATION_095=APPLIED_AND_VERIFIED')
                  if marker >= 0:
                      end = source.find('\n', marker)
                      pos = len(source) if end < 0 else end + 1
                  else:
                      match = re.search(r'^.*(?:build-and-run-|run-)project-planning-collaboration-migration-job\.sh.*$', source, re.M)
                      pos = match.end() if match else len(source)
                  source = source[:pos] + '\n' + block + source[pos:]
              write(path, source)

          def patch_release_allowlist():
              path = Path('.github/workflows/projectpulse-release-test-control-ci.yml')
              if not path.exists(): return
              base = run(['git','merge-base','origin/main','HEAD'])
              committed = subprocess.check_output(['git','diff','--name-only',base+'...HEAD'], text=True).splitlines()
              working = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
              cached = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
              changed = sorted(set(committed + working + cached))
              changed = [x for x in changed if x and 'temporary-flowhive' not in x and 'one-time-flowhive' not in x and x != 'tests/validate-celar-ai-pr630-consolidated.mjs' and not x.startswith('.flowhive-repair/') and not x.startswith('.github/flowhive-repair/')]
              source = read(path)
              marker = 'cat > "$RUNNER_TEMP/allowed-release-files" <<\'FILES\''
              start = source.find(marker)
              if start < 0: raise SystemExit('Protected-Test allowlist start marker was not found.')
              content_start = source.find('\n', start) + 1
              end = source.find('\nFILES', content_start)
              if end < 0: raise SystemExit('Protected-Test allowlist end marker was not found.')
              existing = [line.strip() for line in source[content_start:end].splitlines() if line.strip()]
              merged = sorted(set(existing + changed + ['.github/workflows/projectpulse-release-test-control-ci.yml']))
              write(path, source[:content_start] + '\n'.join(merged) + source[end:])

          def normalize():
              base = run(['git','merge-base','origin/main','HEAD'])
              committed = subprocess.check_output(['git','diff','--name-only',base+'...HEAD'], text=True).splitlines()
              working = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
              cached = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
              for name in sorted(set(committed + working + cached)):
                  path = Path(name)
                  if not path.is_file(): continue
                  try: value = read(path)
                  except UnicodeDecodeError: continue
                  trailing = value.endswith('\n')
                  cleaned = '\n'.join(line.rstrip(' \t') for line in value.splitlines())
                  write(path, cleaned + ('\n' if trailing else ''))

          restore_pr630()
          compile_fixes()
          patch_shared_and_celar()
          patch_module066()
          patch_migrations()
          patch_release_allowlist()
          normalize()
          print('FLOWHIVE_AUTONOMOUS_REPAIR_APPLIED')
          PY

      - name: Reconstruct missing shared planning source when necessary
        if: steps.target.outputs.merged != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main feature/project-planning-collaboration-access-20260818
          git merge-base --is-ancestor origin/main HEAD || git merge --no-edit origin/main

          if [[ ! -s src/backend/ProjectTime.Api/Modules/ProjectPlanningDocumentResolver.cs || ! -s src/backend/ProjectTime.Api/Modules/ProjectPlanningAiOrchestrator.cs || ! -s database/migrations/096_project_planning_document_authority.sql ]]; then
            for script in temporary_apply_flowhive_authoritative_repair.py temporary_finalize_flowhive_authoritative_repair.py temporary_flowhive_final_quality.py; do
              git show "$REPAIR_SOURCE_SHA:.github/scripts/$script" > "$RUNNER_TEMP/$script"
              python3 -m py_compile "$RUNNER_TEMP/$script"
              python3 "$RUNNER_TEMP/$script"
            done
          fi

          if git ls-files --error-unmatch .github/workflows/temporary-flowhive-source-export.yml >/dev/null 2>&1; then git rm -- .github/workflows/temporary-flowhive-source-export.yml; fi
          rm -f .github/scripts/temporary_apply_flowhive_authoritative_repair.py .github/scripts/temporary_finalize_flowhive_authoritative_repair.py .github/scripts/temporary_flowhive_final_quality.py
          rm -f .github/workflows/temporary-flowhive-*.yml .github/flowhive-pr734-finalizer-dispatch.txt
          rm -rf .flowhive-repair .github/flowhive-repair tmp/flowhive-repair
          python3 "$RUNNER_TEMP/converge-flowhive.py"

          required=(
            src/backend/ProjectTime.Api/Modules/ProjectPlanningDocumentResolver.cs
            src/backend/ProjectTime.Api/Modules/ProjectPlanningAiOrchestrator.cs
            src/backend/ProjectTime.Api/Modules/ProjectFlowHiveAiPlannerOrchestrationModule.cs
            database/migrations/094_flowhive_canonical_sow_authority.sql
            database/migrations/095_project_planning_collaboration_access.sql
            database/migrations/096_project_planning_document_authority.sql
            tests/test-flowhive-canonical-sow-authority-migration-094.sh
            tests/test-project-planning-collaboration-migration-095.sh
            tests/test-project-planning-document-authority-migration-096.sh
          )
          for path in "${required[@]}"; do [[ -s "$path" ]] || { echo "Required artifact missing: $path" >&2; exit 1; }; done
          grep -R -Fq '/ai-planner/runs' src/backend/ProjectTime.Api
          grep -R -Fq 'AI Planning Workspace' src/frontend/project-time-web/src
          ! grep -Fq 'FitPackageChainsToSelectedWindow' src/backend/ProjectTime.Api/Modules/ProjectFlowHiveDetailedPlanBuilder.cs
          for migration in 094 095 096; do grep -Fq "MIGRATION_${migration}=APPLIED_AND_VERIFIED" scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh; done
          git diff --check

      - name: Run complete local release gate
        if: steps.target.outputs.merged != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          run_gate() {
            local name="$1"; shift
            echo "===== $name ====="
            "$@" 2>&1 | tee "$RUNNER_TEMP/${name}.log"
          }
          run_gate shared-planning node tests/validate-shared-project-document-planning.mjs
          run_gate flowhive-autoadmission node tests/validate-flowhive-sow-evidence-autoadmission.mjs
          run_gate collaboration-access node tests/validate-project-planning-collaboration-access.mjs
          run_gate collaboration node tests/validate-project-planning-collaboration.mjs
          run_gate migration-094 bash tests/test-flowhive-canonical-sow-authority-migration-094.sh
          run_gate migration-095 bash tests/test-project-planning-collaboration-migration-095.sh
          run_gate migration-096 bash tests/test-project-planning-document-authority-migration-096.sh
          run_gate module-066 node src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs
          run_gate module-033 node src/frontend/project-time-web/scripts/validate-module-033-project-forge.mjs
          run_gate detailed-planner dotnet run --project tests/FlowHiveDetailedPlannerTests/FlowHiveDetailedPlannerTests.csproj --configuration Release
          run_gate sow-freshness dotnet run --project tests/FlowHiveSowFreshnessTests/FlowHiveSowFreshnessTests.csproj --configuration Release
          run_gate api-build dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          run_gate api-startup bash tests/test-projectpulse-api-startup.sh
          run_gate repository-security python3 scripts/security/validate-repository-security-posture.py
          pushd src/frontend/project-time-web >/dev/null
          run_gate npm-install npm ci --no-audit --no-fund
          run_gate npm-audit npm audit --audit-level=high
          run_gate frontend-build npm run build
          popd >/dev/null

      - name: Stage exact release scope and publish
        if: steps.target.outputs.merged != 'true'
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(git merge-base origin/main HEAD)"
          mapfile -t candidates < <({ git diff --name-only "$base...HEAD"; git diff --name-only; git diff --cached --name-only; } | LC_ALL=C sort -u)
          allowed_regex='^(\.github/workflows/(celar-ai-ask-operations-ci|celar-ai-universal-answer-reliability-ci|project-planning-collaboration-ci|projectpulse-deploy-test|projectpulse-release-test-control-ci|shared-project-document-planning-ci)\.yml|database/(migrations|rollback)/(094_|095_|096_).+\.sql|docs/architecture/project-planning-collaboration-access\.md|scripts/(release-test/.+|validate-module-033-project-forge-interactive\.sh)|src/backend/ProjectTime\.Api/Modules/(FlowHiveProtectedTestReleaseMarker|PostgresProjectFlowHivePlanRepository|ProjectFlowHive.+|ProjectForge.+|ProjectPlanning.+)\.cs|src/frontend/project-time-web/(scripts/validate-module-066-project-flowhive\.mjs|src/(ProjectFlowHive.+|ProjectForgeCenter|flowhive-sow-evidence-autoadmission)\.(jsx|js))|tests/(FlowHive.+/.+|test-(flowhive|project-planning).+|validate-(flowhive|project-planning|shared-project-document).+)\.(cs|csproj|sh|mjs)|tests/validate-celar-ai-pr630-consolidated\.mjs)$'
          stage=()
          for path in "${candidates[@]}"; do
            [[ -n "$path" ]] || continue
            if [[ "$path" == .github/workflows/temporary-flowhive-source-export.yml && ! -e "$path" ]]; then stage+=("$path"); continue; fi
            [[ "$path" =~ $allowed_regex ]] || { echo "Unexpected PR737 file: $path" >&2; exit 1; }
            stage+=("$path")
          done
          ((${#stage[@]})) && git add -- "${stage[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'Autonomously converge FlowHive and Forge release'
            git push origin HEAD:"$TARGET_BRANCH"
          fi
          head="$(git rev-parse HEAD)"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "PR737_AUTONOMOUS_HEAD=$head"

      - name: Converge normal GitHub checks
        if: steps.target.outputs.merged != 'true'
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='${{ steps.publish.outputs.head }}'
          for attempt in 1 2 3; do
            echo "CHECK_ATTEMPT=$attempt HEAD=$expected"
            settled=0
            for _ in $(seq 1 240); do
              [[ "$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" == "$expected" ]] || { echo 'PR #737 moved during validation.' >&2; exit 1; }
              checks="$(gh pr checks "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json name,bucket,state,workflow,link 2>/dev/null || echo '[]')"
              total="$(jq 'length' <<<"$checks")"
              pending="$(jq '[.[] | select(.bucket=="pending")] | length' <<<"$checks")"
              if [[ "$total" != 0 && "$pending" == 0 ]]; then settled=1; break; fi
              sleep 15
            done
            [[ "$settled" == 1 ]] || { echo 'PR checks did not settle.' >&2; exit 1; }
            failed="$(jq '[.[] | select(.bucket=="fail")] | length' <<<"$checks")"
            if [[ "$failed" == 0 ]]; then
              echo "head=$expected" >> "$GITHUB_OUTPUT"
              echo 'PR737_ALL_CHECKS=GREEN'
              exit 0
            fi

            : > "$RUNNER_TEMP/failed-checks.log"
            jq -r '.[] | select(.bucket=="fail") | .link' <<<"$checks" | while read -r link; do
              run_id="$(sed -nE 's#^.*/actions/runs/([0-9]+)(/.*)?$#\1#p' <<<"$link")"
              if [[ -n "$run_id" ]]; then
                echo "===== RUN $run_id =====" >> "$RUNNER_TEMP/failed-checks.log"
                gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed >> "$RUNNER_TEMP/failed-checks.log" 2>&1 || true
              fi
            done
            cat "$RUNNER_TEMP/failed-checks.log"

            # Reapply every recognized deterministic remediation. If that does
            # not change the tree, retry failed jobs once before refusing merge.
            python3 "$RUNNER_TEMP/converge-flowhive.py"
            git diff --check
            base="$(git merge-base origin/main HEAD)"
            mapfile -t fix_paths < <({ git diff --name-only "$base...HEAD"; git diff --name-only; git diff --cached --name-only; } | LC_ALL=C sort -u)
            stage=()
            for path in "${fix_paths[@]}"; do
              [[ -n "$path" ]] || continue
              [[ "$path" == .github/workflows/temporary-flowhive-source-export.yml && ! -e "$path" ]] && { stage+=("$path"); continue; }
              [[ "$path" =~ $allowed_regex ]] || { echo "Unexpected remediation file: $path" >&2; exit 1; }
              stage+=("$path")
            done
            ((${#stage[@]})) && git add -- "${stage[@]}"
            if ! git diff --cached --quiet; then
              git commit -m "Repair remaining FlowHive release gates attempt $attempt"
              git push origin HEAD:"$TARGET_BRANCH"
              expected="$(git rev-parse HEAD)"
              continue
            fi

            jq -r '.[] | select(.bucket=="fail") | .link' <<<"$checks" | while read -r link; do
              run_id="$(sed -nE 's#^.*/actions/runs/([0-9]+)(/.*)?$#\1#p' <<<"$link")"
              [[ -n "$run_id" ]] && gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY" --failed || true
            done
          done
          echo 'PR #737 remained red after three deterministic convergence attempts.' >&2
          exit 1

      - name: Merge exact green SHA
        if: steps.target.outputs.merged != 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='${{ steps.checks.outputs.head }}'
          gh pr ready "$TARGET_PR" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          [[ "$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" == "$expected" ]]
          gh pr merge "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$expected" --delete-branch=false
          sha="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve release SHA
        id: release
        shell: bash
        run: |
          if [[ '${{ steps.target.outputs.merged }}' == true ]]; then sha='${{ steps.target.outputs.release_sha }}'; else sha='${{ steps.merge.outputs.sha }}'; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for exact Protected UAT deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_sha='${{ steps.release.outputs.sha }}'
          workflow='projectpulse-deploy-test.yml'
          run_id=''
          for _ in $(seq 1 120); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$release_sha" --limit 30 --json databaseId,headSha --jq '[.[] | select(.headSha=="'"$release_sha"'")][0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            for _ in $(seq 1 120); do
              run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --limit 30 --json databaseId,headSha --jq '[.[] | select(.headSha=="'"$release_sha"'")][0].databaseId // empty')"
              [[ -n "$run_id" ]] && break
              sleep 10
            done
          fi
          [[ -n "$run_id" ]] || { echo 'Protected UAT deployment run was not found.' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
          [[ "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" == success ]]
          echo "PROTECTED_UAT_DEPLOYMENT_RUN=$run_id"
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Run authenticated FlowHive, Forge, and Celar UAT
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${PROJECTPULSE_M087_PASSWORD:-}" ]] || { echo 'Protected Test UAT credential is unavailable.' >&2; exit 1; }
          mapfile -t flowhive_uat < <(find scripts/release-test -maxdepth 1 -type f \( -iname '*flowhive*uat*.sh' -o -iname '*project-planning*uat*.sh' \) | LC_ALL=C sort -u)
          ((${#flowhive_uat[@]})) || { echo 'No FlowHive planning UAT script exists.' >&2; exit 1; }
          for script in "${flowhive_uat[@]}"; do bash -n "$script"; bash "$script"; done
          mapfile -t forge_uat < <(find scripts/release-test -maxdepth 1 -type f -iname '*forge*uat*.sh' | LC_ALL=C sort -u)
          for script in "${forge_uat[@]}"; do bash -n "$script"; bash "$script"; done
          mapfile -t celar_uat < <(find scripts/release-test -maxdepth 1 -type f -iname '*celar*uat*.sh' | LC_ALL=C sort -u)
          for script in "${celar_uat[@]}"; do bash -n "$script"; bash "$script"; done
          for path in /api/health /health; do
            code="$(curl -sS -L --max-time 30 -o /tmp/health-body -w '%{http_code}' "$PROTECTED_TEST_URL$path" || true)"
            if [[ "$code" =~ ^2 ]]; then echo "PROTECTED_UAT_HEALTH=$path:$code"; echo 'PROTECTED_UAT_AUTHENTICATED_FLOWHIVE_FORGE_CELAR=PASSED'; exit 0; fi
          done
          echo 'Protected UAT health verification failed.' >&2
          exit 1

      - name: Publish terminal success comment and retire superseded PRs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body "Protected UAT deployment and authenticated FlowHive/Project Forge/Celar validation completed successfully. Production mutation: NONE. Release SHA: ${{ steps.release.outputs.sha }}. Deployment run: ${{ steps.deployment.outputs.run_id }}."
          gh pr comment 734 --repo "$GITHUB_REPOSITORY" --body 'Superseded by PR #737 after successful Protected UAT deployment and authenticated validation.' || true
          gh pr close 734 --repo "$GITHUB_REPOSITORY" || true
          gh pr close 736 --repo "$GITHUB_REPOSITORY" || true
