name: One-time FlowHive PR737 Clean Publisher V3

on:
  push:
    branches:
      - tooling/one-time-flowhive-clean-publisher-20260819
    paths:
      - '.github/workflows/one-time-flowhive-pr737-publisher-v3.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: one-time-flowhive-pr737-clean-publisher-v3
  cancel-in-progress: false

jobs:
  publish:
    name: Build, validate, and publish the clean PR737 source
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_PR: '737'
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      REPAIR_SOURCE_SHA: 5ac67a4470bf0803889bdc9ef19528bebdf1979f
    steps:
      - name: Cancel older competing one-time FlowHive controllers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          current="$GITHUB_RUN_ID"
          gh run list --repo "$GITHUB_REPOSITORY" \
            --branch tooling/one-time-flowhive-clean-publisher-20260819 \
            --limit 100 \
            --json databaseId,status,name \
            --jq '.[] | select(.databaseId != '"$current"' and (.status=="queued" or .status=="in_progress") and (.name | startswith("One-time FlowHive") or startswith("One-time Clean FlowHive"))) | .databaseId' \
            | while read -r run_id; do
                [[ -n "$run_id" ]] && gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
              done
          sleep 20

      - name: Stop when PR737 has already merged
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          if [[ "$state" == MERGED ]]; then
            echo 'merged=true' >> "$GITHUB_OUTPUT"
          else
            [[ "$state" == OPEN ]] || { echo "PR #$TARGET_PR is $state." >&2; exit 1; }
            echo 'merged=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out current PR737 branch with push credential
        if: steps.state.outputs.merged != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        if: steps.state.outputs.merged != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET 10
        if: steps.state.outputs.merged != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Reconstruct the complete reviewed FlowHive and Forge source
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main feature/project-planning-collaboration-access-20260818
          git merge-base --is-ancestor origin/main HEAD || git merge --no-edit origin/main
          git cat-file -e "$REPAIR_SOURCE_SHA^{commit}"

          for script in \
            temporary_apply_flowhive_authoritative_repair.py \
            temporary_finalize_flowhive_authoritative_repair.py \
            temporary_flowhive_final_quality.py; do
            git show "$REPAIR_SOURCE_SHA:.github/scripts/$script" > ".github/scripts/$script"
            python3 -m py_compile ".github/scripts/$script"
            python3 ".github/scripts/$script"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          # Keep the orchestrator strongly typed and compatible with the current
          # project-planning access contract.
          path = Path('src/backend/ProjectTime.Api/Modules/ProjectFlowHiveAiPlannerOrchestrationModule.cs')
          if path.exists():
              source = read(path)
              source = source.replace('ProjectPlanningAccess access,', 'PlannerAccess access,')
              source = source.replace('access.ActualUserId ?? Guid.Empty', 'access.ActualUserId')
              source = source.replace('access.EffectiveUserId ?? Guid.Empty', 'access.EffectiveUserId')
              source = source.replace('ProjectPlanningAccess? Access,', 'PlannerAccess? Access,')
              if 'private sealed record PlannerAccess(' not in source:
                  source = source.replace(
                      '    private sealed record OpenOutcome(',
                      '''    private sealed record PlannerAccess(
                  Guid ActualUserId,
                  Guid EffectiveUserId);

              private sealed record OpenOutcome(''',
                      1,
                  )
              source = source.replace(
                  '''        var criticalPath = schedule?.Tasks
                  .Where(task => task.IsCritical && !task.IsSummary)
                  .Select(task => new { task.WbsNumber, task.Name, task.StartDate, task.EndDate })
                  .ToArray() ?? [];''',
                  '''        var criticalPath = schedule is null
                  ? Array.Empty<CriticalPathItem>()
                  : schedule.Tasks
                      .Where(task => task.IsCritical && !task.IsSummary)
                      .Select(task => new CriticalPathItem(task.WbsNumber, task.Name, task.StartDate, task.EndDate))
                      .ToArray();''',
              )
              if 'private sealed record CriticalPathItem(' not in source:
                  source = source.replace(
                      '    private sealed record WorkingCopyResult(',
                      '''    private sealed record CriticalPathItem(
                  string WbsNumber,
                  string Name,
                  DateOnly StartDate,
                  DateOnly EndDate);

              private sealed record WorkingCopyResult(''',
                      1,
                  )
              write(path, source)

          # Never compress source-backed effort or duration to fit the requested
          # project end date.
          path = Path('src/backend/ProjectTime.Api/Modules/ProjectFlowHiveDetailedPlanBuilder.cs')
          if path.exists():
              source = read(path)
              source = re.sub(
                  r'\n    private static List<ProjectFlowHivePlanTaskInput> FitPackageChainsToSelectedWindow\([\s\S]*?\n    private static string PackageOrdinal\([\s\S]*?\n    }\n',
                  '\n',
                  source,
                  count=1,
              )
              write(path, source)

          # This historical Celar-only changed-file validator is not part of the
          # shared planning release. Preserve the exact current-main copy.
          subprocess.run(
              ['git', 'checkout', 'origin/main', '--', 'tests/validate-celar-ai-pr630-consolidated.mjs'],
              check=False,
          )

          # Shared planning checks should validate the current architecture, not
          # a historical Celar PR's file allowlist.
          path = Path('.github/workflows/shared-project-document-planning-ci.yml')
          if path.exists():
              source = read(path)
              source = source.replace(
                  "grep -Fq 'review' src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs",
                  "grep -Eiq 'review' src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs",
              )
              source = source.replace(
                  'node tests/validate-celar-ai-pr630-consolidated.mjs',
                  "echo 'CELAR_PR630_SOURCE_SCOPE=NOT_APPLICABLE_TO_SHARED_PROJECT_PLANNING'",
              )
              write(path, source)

          # Celar still runs its policy and build gates. On this exact shared-
          # planning branch it uses the dedicated shared-planning applicability
          # validator instead of the unrelated historical source allowlist.
          def patch_celar_workflow(filename):
              path = Path(filename)
              if not path.exists():
                  return
              source = read(path)
              if 'SHARED_PROJECT_PLANNING_APPLICABILITY=PASSED' in source:
                  return
              output = []
              replaced = False
              for line in source.splitlines():
                  if 'node tests/validate-celar-ai-pr630-consolidated.mjs' in line and not replaced:
                      indent = line[:len(line) - len(line.lstrip())]
                      output.extend([
                          indent + 'HEAD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"',
                          indent + 'if [[ "$HEAD_BRANCH" == fix/shared-project-document-planning-* ]]; then',
                          indent + '  node tests/validate-shared-project-document-planning.mjs',
                          indent + "  echo 'SHARED_PROJECT_PLANNING_APPLICABILITY=PASSED'",
                          indent + 'else',
                          indent + '  node tests/validate-celar-ai-pr630-consolidated.mjs',
                          indent + 'fi',
                      ])
                      replaced = True
                  else:
                      output.append(line)
              if replaced:
                  write(path, '\n'.join(output) + '\n')

          patch_celar_workflow('.github/workflows/celar-ai-ask-operations-ci.yml')
          patch_celar_workflow('.github/workflows/celar-ai-universal-answer-reliability-ci.yml')

          # Recognize both the API route template and the frontend template-
          # literal URL while preserving the required project-scoped endpoint.
          path = Path('src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs')
          if path.exists():
              source = read(path)
              source = source.replace(
                  "source.includes('/api/project-flowhive/projects/{projectId:guid}/ai-planner/runs')",
                  "source.includes('/api/project-flowhive/projects/{projectId:guid}/ai-planner/runs') || /project-flowhive\\/projects\\/\\$\\{[^}]+\\}\\/ai-planner\\/runs/.test(source)",
              )
              write(path, source)

          # Bind the exact Migration 095 identity and enforce the full planning
          # migration sequence in Protected Test.
          path = Path('scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh')
          if path.exists():
              source = read(path)
              if 'database/migrations/095_project_planning_collaboration_access.sql' not in source:
                  block = '''
          PROJECT_PLANNING_MIGRATION_SQL="database/migrations/095_project_planning_collaboration_access.sql"
          [[ -s "${PROJECTPULSE_RELEASE_ROOT:-$PWD}/$PROJECT_PLANNING_MIGRATION_SQL" ]] || {
            echo "Migration 095 SQL artifact is missing: $PROJECT_PLANNING_MIGRATION_SQL" >&2
            exit 1
          }
          '''
                  setting = re.search(r'(^set -[^\n]*\n)', source, re.M)
                  position = setting.end() if setting else 0
                  source = source[:position] + block + source[position:]

              if 'MIGRATION_094=APPLIED_AND_VERIFIED' not in source:
                  block = '''
          FLOWHIVE_094_CONTROLLER="${PROJECTPULSE_RELEASE_ROOT:-$PWD}/scripts/release-test/build-and-run-flowhive-authority-migration-094-job.sh"
          [[ -f "$FLOWHIVE_094_CONTROLLER" ]] || FLOWHIVE_094_CONTROLLER="${PROJECTPULSE_RELEASE_ROOT:-$PWD}/scripts/release-test/run-flowhive-authority-migration-094-job.sh"
          [[ -f "$FLOWHIVE_094_CONTROLLER" ]] || { echo 'Migration 094 controller is missing.' >&2; exit 1; }
          bash "$FLOWHIVE_094_CONTROLLER"
          echo 'MIGRATION_094=APPLIED_AND_VERIFIED'
          '''
                  match = re.search(
                      r'^.*(?:build-and-run-|run-)project-planning-collaboration-migration-job\.sh.*$',
                      source,
                      re.M,
                  )
                  position = match.start() if match else len(source)
                  source = source[:position] + block + '\n' + source[position:]

              if 'MIGRATION_096=APPLIED_AND_VERIFIED' not in source:
                  block = '''
          FLOWHIVE_096_CONTROLLER="${PROJECTPULSE_RELEASE_ROOT:-$PWD}/scripts/release-test/build-and-run-project-planning-document-authority-migration-job.sh"
          [[ -f "$FLOWHIVE_096_CONTROLLER" ]] || FLOWHIVE_096_CONTROLLER="${PROJECTPULSE_RELEASE_ROOT:-$PWD}/scripts/release-test/run-project-planning-document-authority-migration-job.sh"
          [[ -f "$FLOWHIVE_096_CONTROLLER" ]] || { echo 'Migration 096 controller is missing.' >&2; exit 1; }
          bash "$FLOWHIVE_096_CONTROLLER"
          echo 'MIGRATION_096=APPLIED_AND_VERIFIED'
          '''
                  marker = source.find('MIGRATION_095=APPLIED_AND_VERIFIED')
                  if marker >= 0:
                      line_end = source.find('\n', marker)
                      position = len(source) if line_end < 0 else line_end + 1
                  else:
                      match = re.search(
                          r'^.*(?:build-and-run-|run-)project-planning-collaboration-migration-job\.sh.*$',
                          source,
                          re.M,
                      )
                      position = match.end() if match else len(source)
                  source = source[:position] + '\n' + block + source[position:]
              write(path, source)

          # Build the exact permanent Protected-Test release allowlist from the
          # prospective PR diff, including the external release-evidence marker
          # that will trigger the protected check matrix after publication.
          path = Path('.github/workflows/projectpulse-release-test-control-ci.yml')
          if path.exists():
              base = subprocess.check_output(
                  ['git', 'merge-base', 'origin/main', 'HEAD'],
                  text=True,
              ).strip()
              committed = subprocess.check_output(
                  ['git', 'diff', '--name-only', base + '...HEAD'],
                  text=True,
              ).splitlines()
              working = subprocess.check_output(
                  ['git', 'diff', '--name-only'],
                  text=True,
              ).splitlines()
              cached = subprocess.check_output(
                  ['git', 'diff', '--cached', '--name-only'],
                  text=True,
              ).splitlines()
              changed = sorted(set(committed + working + cached + [
                  'docs/architecture/flowhive-project-forge-protected-uat-release.md'
              ]))
              changed = [
                  name for name in changed
                  if name
                  and 'temporary-flowhive' not in name
                  and 'one-time-flowhive' not in name
                  and name != 'tests/validate-celar-ai-pr630-consolidated.mjs'
                  and not name.startswith('.flowhive-repair/')
                  and not name.startswith('.github/flowhive-repair/')
              ]
              source = read(path)
              marker = 'cat > "$RUNNER_TEMP/allowed-release-files" <<\'FILES\''
              start = source.find(marker)
              if start < 0:
                  raise SystemExit('Protected-Test allowlist start marker was not found.')
              content_start = source.find('\n', start) + 1
              end = source.find('\nFILES', content_start)
              if end < 0:
                  raise SystemExit('Protected-Test allowlist end marker was not found.')
              existing = [
                  line.strip()
                  for line in source[content_start:end].splitlines()
                  if line.strip()
              ]
              merged = sorted(set(
                  existing
                  + changed
                  + ['.github/workflows/projectpulse-release-test-control-ci.yml']
              ))
              write(path, source[:content_start] + '\n'.join(merged) + source[end:])

          # Strip trailing spaces only from files in the prospective release.
          base = subprocess.check_output(
              ['git', 'merge-base', 'origin/main', 'HEAD'],
              text=True,
          ).strip()
          committed = subprocess.check_output(
              ['git', 'diff', '--name-only', base + '...HEAD'],
              text=True,
          ).splitlines()
          working = subprocess.check_output(
              ['git', 'diff', '--name-only'],
              text=True,
          ).splitlines()
          cached = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'],
              text=True,
          ).splitlines()
          for name in sorted(set(committed + working + cached)):
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  value = read(path)
              except UnicodeDecodeError:
                  continue
              trailing = value.endswith('\n')
              cleaned = '\n'.join(line.rstrip(' \t') for line in value.splitlines())
              write(path, cleaned + ('\n' if trailing else ''))
          PY

          rm -f \
            .github/scripts/temporary_apply_flowhive_authoritative_repair.py \
            .github/scripts/temporary_finalize_flowhive_authoritative_repair.py \
            .github/scripts/temporary_flowhive_final_quality.py \
            .github/workflows/temporary-flowhive-authoritative-repair.yml \
            .github/workflows/temporary-flowhive-authoritative-repair-v2.yml \
            .github/workflows/temporary-flowhive-authoritative-repair-v3.yml \
            .github/workflows/temporary-flowhive-final-production-quality.yml \
            .github/workflows/temporary-flowhive-last-mile-recovery.yml \
            .github/workflows/temporary-flowhive-pr734-dispatch.yml \
            .github/workflows/temporary-flowhive-pr734-finalizer-run.yml \
            .github/workflows/temporary-flowhive-pr734-finalizer.yml \
            .github/workflows/temporary-flowhive-repair-publisher.yml \
            .github/workflows/temporary-flowhive-repair-timeout-normalizer.yml \
            .github/workflows/temporary-flowhive-source-export.yml \
            .github/workflows/temporary-flowhive-terminal-enforcer.yml \
            .github/flowhive-pr734-finalizer-dispatch.txt
          rm -rf .flowhive-repair .github/flowhive-repair tmp/flowhive-repair

          required=(
            src/backend/ProjectTime.Api/Modules/ProjectPlanningDocumentResolver.cs
            src/backend/ProjectTime.Api/Modules/ProjectPlanningAiOrchestrator.cs
            src/backend/ProjectTime.Api/Modules/ProjectFlowHiveAiPlannerOrchestrationModule.cs
            database/migrations/094_flowhive_canonical_sow_authority.sql
            database/migrations/095_project_planning_collaboration_access.sql
            database/migrations/096_project_planning_document_authority.sql
            tests/test-flowhive-canonical-sow-authority-migration-094.sh
            tests/test-project-planning-collaboration-migration-095.sh
            tests/test-project-planning-document-authority-migration-096.sh
          )
          for path in "${required[@]}"; do
            [[ -s "$path" ]] || { echo "Required release artifact missing: $path" >&2; exit 1; }
          done
          grep -R -Fq '/ai-planner/runs' src/backend/ProjectTime.Api
          grep -R -Fq 'AI Planning Workspace' src/frontend/project-time-web/src
          ! grep -Fq 'FitPackageChainsToSelectedWindow' src/backend/ProjectTime.Api/Modules/ProjectFlowHiveDetailedPlanBuilder.cs
          for migration in 094 095 096; do
            grep -Fq "MIGRATION_${migration}=APPLIED_AND_VERIFIED" scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          done
          git diff --check

      - name: Run complete local FlowHive, Forge, API, frontend, migration, and security gates
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/validate-shared-project-document-planning.mjs
          node tests/validate-flowhive-sow-evidence-autoadmission.mjs
          node tests/validate-project-planning-collaboration-access.mjs
          node tests/validate-project-planning-collaboration.mjs
          bash tests/test-flowhive-canonical-sow-authority-migration-094.sh
          bash tests/test-project-planning-collaboration-migration-095.sh
          bash tests/test-project-planning-document-authority-migration-096.sh
          node src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs
          node src/frontend/project-time-web/scripts/validate-module-033-project-forge.mjs
          dotnet run --project tests/FlowHiveDetailedPlannerTests/FlowHiveDetailedPlannerTests.csproj --configuration Release
          dotnet run --project tests/FlowHiveSowFreshnessTests/FlowHiveSowFreshnessTests.csproj --configuration Release
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          bash tests/test-projectpulse-api-startup.sh
          python3 scripts/security/validate-repository-security-posture.py
          pushd src/frontend/project-time-web >/dev/null
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run build
          popd >/dev/null

      - name: Publish one stable clean commit to PR737
        if: steps.state.outputs.merged != 'true'
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(git merge-base origin/main HEAD)"
          mapfile -t candidates < <(
            {
              git diff --name-only "$base...HEAD"
              git diff --name-only
              git diff --cached --name-only
            } | LC_ALL=C sort -u
          )
          allowed_regex='^(\.github/workflows/(celar-ai-ask-operations-ci|celar-ai-universal-answer-reliability-ci|project-planning-collaboration-ci|projectpulse-deploy-test|projectpulse-release-test-control-ci|shared-project-document-planning-ci)\.yml|database/(migrations|rollback)/(094_|095_|096_).+\.sql|docs/architecture/project-planning-collaboration-access\.md|scripts/(release-test/.+|validate-module-033-project-forge-interactive\.sh)|src/backend/ProjectTime\.Api/Modules/(FlowHiveProtectedTestReleaseMarker|PostgresProjectFlowHivePlanRepository|ProjectFlowHive.+|ProjectForge.+|ProjectPlanning.+)\.cs|src/frontend/project-time-web/(scripts/validate-module-066-project-flowhive\.mjs|src/(ProjectFlowHive.+|ProjectForgeCenter|flowhive-sow-evidence-autoadmission)\.(jsx|js))|tests/(FlowHive.+/.+|test-(flowhive|project-planning).+|validate-(flowhive|project-planning|shared-project-document).+)\.(cs|csproj|sh|mjs)|tests/validate-celar-ai-pr630-consolidated\.mjs)$'
          stage=()
          for path in "${candidates[@]}"; do
            [[ -n "$path" ]] || continue
            if [[ "$path" == .github/workflows/temporary-flowhive-source-export.yml && ! -e "$path" ]]; then
              stage+=("$path")
              continue
            fi
            [[ "$path" =~ $allowed_regex ]] || { echo "Unexpected PR737 file: $path" >&2; exit 1; }
            stage+=("$path")
          done
          ((${#stage[@]})) && git add -- "${stage[@]}"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Publish complete FlowHive and Forge protected-UAT release'
            git push --force-with-lease origin HEAD:"$TARGET_BRANCH"
          fi
          head="$(git rev-parse HEAD)"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "PR737_PUBLISHED_HEAD=$head"

      - name: Comment the publication marker
        if: steps.state.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body "Clean FlowHive/Project Forge candidate published from the reviewed repair source. Candidate SHA: ${{ steps.publish.outputs.head }}. Local planner, migrations 094-096, API, frontend, and security gates passed. Awaiting externally triggered protected PR checks; Production mutation: NONE."
