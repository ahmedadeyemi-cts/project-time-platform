name: Celar AI Source Snapshot Temporary

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/celar-ai-source-snapshot-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=bin --exclude=obj \
            -czf /tmp/project-time-platform-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: celar-ai-source-snapshot-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/project-time-platform-source.tar.gz
          if-no-files-found: error
          retention-days: 1
