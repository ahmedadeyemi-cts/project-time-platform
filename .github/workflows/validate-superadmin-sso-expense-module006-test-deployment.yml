name: Validate Super Admin, SSO, Expense Billing, and Module 006 Test Deployment

on:
  push:
    branches:
      - 'release/superadmin-sso-expense-module006-test-*'
  pull_request:
    paths:
      - '.github/workflows/projectpulse-deploy-superadmin-sso-expense-module006-test.yml'
      - '.github/workflows/validate-superadmin-sso-expense-module006-test-deployment.yml'
      - 'scripts/run-superadmin-sso-expense-module006-test-deployment.sh'
      - 'scripts/validate-superadmin-sso-expense-module006-test-deployment.sh'

permissions:
  contents: read

jobs:
  validate:
    name: Validate guarded Super Administrator, SSO, expense billing, and Module 006 controls
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce exact four-file deployment-control scope
        shell: bash
        run: |
          set -Eeuo pipefail
          # DEPLOYMENT_CONCURRENCY_GOVERNANCE_SCOPE_START
          GOVERNANCE_BASE_SHA='${{ github.event.pull_request.base.sha }}'
          git fetch origin "$GOVERNANCE_BASE_SHA" --no-tags
          git cat-file -e "$GOVERNANCE_BASE_SHA^{commit}"
          git show "$GOVERNANCE_BASE_SHA:scripts/validate-deployment-concurrency-governance.mjs" > "${RUNNER_TEMP}/trusted-deployment-concurrency-validator.mjs"
          set +e
          node "${RUNNER_TEMP}/trusted-deployment-concurrency-validator.mjs" --repo-root "${GITHUB_WORKSPACE}" --base-ref "$GOVERNANCE_BASE_SHA" --classify-bootstrap-scope
          governance_status=$?
          set -e
          if [[ $governance_status -eq 0 ]]; then
            echo 'DEPLOYMENT_CONCURRENCY_GOVERNANCE_SCOPE=PASS'
            exit 0
          fi
          if [[ $governance_status -ne 2 ]]; then
            exit "$governance_status"
          fi
          # DEPLOYMENT_CONCURRENCY_GOVERNANCE_SCOPE_END
          git fetch origin main --no-tags
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${CHANGED[@]}"

          ALLOWED=(
            '.github/workflows/projectpulse-deploy-superadmin-sso-expense-module006-test.yml'
            '.github/workflows/validate-superadmin-sso-expense-module006-test-deployment.yml'
            'scripts/run-superadmin-sso-expense-module006-test-deployment.sh'
            'scripts/validate-superadmin-sso-expense-module006-test-deployment.sh'
          )

          [[ "${#CHANGED[@]}" -eq 4 ]] || {
            echo "Expected exactly four deployment-control files; found ${#CHANGED[@]}." >&2
            exit 1
          }

          for changed in "${CHANGED[@]}"; do
            match=false
            for allowed in "${ALLOWED[@]}"; do
              [[ "$changed" == "$allowed" ]] && match=true
            done
            [[ "$match" == true ]] || {
              echo "Unexpected changed file: $changed" >&2
              exit 1
            }
          done

          echo 'SUPERADMIN_SSO_EXPENSE_MODULE006_DEPLOYMENT_SCOPE=PASS'

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/run-superadmin-sso-expense-module006-test-deployment.sh
          bash -n scripts/validate-superadmin-sso-expense-module006-test-deployment.sh
          echo 'SUPERADMIN_SSO_EXPENSE_MODULE006_SHELL_SYNTAX=PASS'

      - name: Validate static deployment-control contract
        shell: bash
        run: bash scripts/validate-superadmin-sso-expense-module006-test-deployment.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Build ProjectTime API
        id: api_build
        shell: bash
        run: |
          set +e
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release > superadmin-sso-expense-module006-api-build.log 2>&1
          status=$?
          tail -n 180 superadmin-sso-expense-module006-api-build.log
          exit "$status"

      - name: Upload API build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superadmin-sso-expense-module006-api-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: superadmin-sso-expense-module006-api-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Reproduce empty 200 and verify explicit IResult execution
        run: >-
          dotnet run
          --project tests/ProjectTime.Api.RouteResultExecutionTests/ProjectTime.Api.RouteResultExecutionTests.csproj
          --configuration Release

      - name: Execute central authorization tests
        run: >-
          dotnet run
          --project tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj
          --configuration Release

      - name: Verify API startup and route registration
        run: bash tests/test-projectpulse-api-startup.sh

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate Super Administrator and Module 026 authority
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/validate-superadmin-sso-expense-module006-package.mjs
          node scripts/validate-module-026-crm-erp-integrations.mjs
          node scripts/validate-modules-021-026-sell-customer-sync.mjs
          node scripts/validate-dynamic-rbac-administration.mjs
          node scripts/validate-module-012-scoped-role-admin.mjs
          node scripts/validate-module-037-effective-matrix.mjs

      - name: Validate Microsoft SSO and runtime continuity
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/validate-microsoft-integration-authoritative-connection.mjs
          node scripts/validate-microsoft-sso-runtime-wiring.mjs
          node scripts/validate-admin-runtime-stability.mjs
          node scripts/validate-friendly-api-errors.mjs

      - name: Validate expense billing and Module 003 continuity
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/validate-module-005-project-expense-upload.mjs
          node scripts/validate-modules-003-004-rolling-years.mjs
          node scripts/validate-group-1-navigation-work-consolidation.mjs
          node scripts/validate-group-2a-provider-neutral-platform-operations.mjs
          node scripts/validate-module-068-system-architecture.mjs

      - name: Build complete frontend production bundle
        id: frontend_build
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set +e
          npm run build > superadmin-sso-expense-module006-frontend-build.log 2>&1
          status=$?
          tail -n 240 superadmin-sso-expense-module006-frontend-build.log
          exit "$status"

      - name: Upload frontend build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superadmin-sso-expense-module006-frontend-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/frontend/project-time-web/superadmin-sso-expense-module006-frontend-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Validate complete split frontend asset set
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          cat dist/assets/*.js > /tmp/superadmin-sso-expense-module006.js
          cat dist/assets/*.css > /tmp/superadmin-sso-expense-module006.css
          for marker in \
            'Edit connection' \
            'Add CRM platform' \
            '/billing-context' \
            '/billing-acknowledgement' \
            'non-invasive-v2' \
            'Choose a project only when expense context is needed' \
            'Deleted and superseded uploads are excluded.' \
            'Toyota & Hyundai Pipeline' \
            'engineering-utilization-manager-table' \
            '/api/rbac/v1/bootstrap' \
            '/api/platform-operations/overview'; do
            grep -Fq "$marker" /tmp/superadmin-sso-expense-module006.js
          done
          for marker in \
            '.expense-cross-module-launcher' \
            '.expense-cross-module-shell.is-open' \
            '.expense-cross-acknowledgement' \
            '.engineering-utilization-table-wrap' \
            '.engineering-utilization-table thead th' \
            '.projectpulse-more-intuitive-name'; do
            grep -Fq "$marker" /tmp/superadmin-sso-expense-module006.css
          done
          echo 'SUPERADMIN_SSO_EXPENSE_MODULE006_SPLIT_ASSETS=PASS'
