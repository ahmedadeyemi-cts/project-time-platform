name: System-wide Enterprise Reliability CI

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/systemwide-enterprise-reliability-ci.yml'
      - 'database/migrations/086_module_066_flowhive_enterprise_pm.sql'
      - 'database/migrations/088_systemwide_enterprise_reliability.sql'
      - 'database/rollback/088_systemwide_enterprise_reliability_rollback.sql'
      - 'deployment/rocky-linux/apply-remaining-psa-module-api-patch.sh'
      - 'src/backend/ProjectTime.Api/**'
      - 'src/frontend/project-time-web/**'
      - 'tests/CelarAiAuthoritativePublicFactTests/**'
      - 'tests/test-module-066-flowhive-enterprise-pm-migration-086.sh'
      - 'tests/test-systemwide-enterprise-reliability-migration-088.sh'
      - 'tests/validate-systemwide-enterprise-reliability.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: systemwide-enterprise-reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate API, UI, migrations, audit, FlowHive, and Celar AI
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Validate source and migration contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/validate-systemwide-enterprise-reliability.mjs
          node tests/validate-celar-ai-flowhive-authoritative-release.mjs
          bash tests/test-module-066-flowhive-enterprise-pm-migration-086.sh
          bash tests/test-systemwide-enterprise-reliability-migration-088.sh
          git diff --check

      - name: Run authoritative public-fact reliability tests
        run: dotnet run --project tests/CelarAiAuthoritativePublicFactTests/CelarAiAuthoritativePublicFactTests.csproj --configuration Release

      - name: Build complete API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Audit and build complete frontend
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run build

      - name: Ensure validation did not mutate reviewed source
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git diff --exit-code

      - name: Publish validation boundary
        run: |
          echo 'SYSTEMWIDE_ENTERPRISE_RELIABILITY=SOURCE_VALIDATED'
          echo 'MIGRATION_086=CONTRACT_VALIDATED'
          echo 'MIGRATION_088=CONTRACT_VALIDATED'
          echo 'PROTECTED_TEST_DEPLOYMENTS=0'
          echo 'PRODUCTION_MUTATIONS=0'
