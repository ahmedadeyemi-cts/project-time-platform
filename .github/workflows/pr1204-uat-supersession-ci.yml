name: PR1204 exact never-started UAT recovery
on:
  pull_request:
    paths:
      - '.github/workflows/pr1204-uat-supersession-ci.yml'
      - '.github/workflows/module025-protected-uat-control.yml'
      - 'scripts/release-test/validate-protected-test-controller-branches.sh'
      - 'scripts/release-test/verify-pr1204-uat-supersession.py'
      - 'tests/test-pr1204-uat-supersession.py'
      - 'tests/pr1204-uat-supersession-scope.py'
      - 'docs/pr1204-protected-uat-supersession.md'
permissions:
  contents: read
concurrency:
  group: pr1204-orphan-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact nine-file source boundary
        if: github.head_ref == 'fix/pr1204-uat-supersession-20260928'
        run: python3 tests/pr1204-uat-supersession-scope.py
      - name: Execute new and retained offline negative recovery cases
        run: |
          python3 tests/test-pr1204-uat-supersession.py -v
          python3 tests/test-protected-uat-main-ci.py
          python3 tests/test-pr1151-uat-supersession.py
          python3 tests/test-pr1139-uat-recovery.py
          python3 tests/test-pr1140-uat-recovery.py
          python3 tests/test-pr1140-migration-retry-recovery.py
          node tests/module025-deployment-startup-recovery.test.mjs
          node tests/validate-systemwide-image-build-controller.mjs
      - name: Require source stability
        run: git diff --exit-code
