name: Repair PR 630 Operations Policy

on:
  push:
    branches:
      - feature/ask-celar-ai-troubleshooting-defect-automation-20260810
    paths:
      - .github/workflows/repair-pr630-operations-policy.yml

permissions:
  contents: write

concurrency:
  group: repair-pr630-operations-policy
  cancel-in-progress: false

jobs:
  repair:
    name: Correct intent and credential redaction, then remove this workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: c6251525ca790099357528f8f3eb0da03929f922
      HEAD_BRANCH: feature/ask-celar-ai-troubleshooting-defect-automation-20260810
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact repository, branch, and parent
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == 'ahmedadeyemi-cts/project-time-platform' ]]
          [[ "$GITHUB_REF_NAME" == "$HEAD_BRANCH" ]]
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Correct deterministic troubleshooting and redaction policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/backend/ProjectTime.Api/Ai/CelarAiOperationsContracts.cs')
          text = source.read_text(encoding='utf-8')

          old_signals = '''            "troubleshoot",
            "diagnose",
            "why is",
            "why did",
            "not working",
            "unavailable",
            "timeout",
            "failed",
            "broken",
            "error",
            "health check",
            "service status");'''
          new_signals = '''            "troubleshoot",
            "diagnose",
            "diagnostic",
            "diagnostics",
            "why is",
            "why did",
            "not working",
            "unavailable",
            "timeout",
            "timed out",
            "failed",
            "broken",
            "error",
            "health check",
            "service status");'''
          if text.count(old_signals) != 1:
              raise SystemExit(f'{source}: expected one troubleshooting signal block, found {text.count(old_signals)}')
          text = text.replace(old_signals, new_signals)

          old_redaction = '''        clean = Regex.Replace(
            clean,
            @"(?i)(authorization|proxy-authorization|cookie|set-cookie|x-projectpulse-session|api[-_ ]?key|token|password|secret)\\s*[:=]\\s*[^\\s,;]+",
            "$1=[REDACTED]",
            RegexOptions.CultureInvariant);
        clean = Regex.Replace(
            clean,
            @"(?i)bearer\\s+[a-z0-9._~+/=-]{8,}",
            "Bearer [REDACTED]",
            RegexOptions.CultureInvariant);'''
          new_redaction = '''        clean = Regex.Replace(
            clean,
            @"(?i)\\b(authorization|proxy-authorization)\\s*[:=]\\s*(?:bearer\\s+)?[^\\s,;]+",
            "$1=[REDACTED]",
            RegexOptions.CultureInvariant);
        clean = Regex.Replace(
            clean,
            @"(?i)\\b(cookie|set-cookie|x-projectpulse-session|api[-_ ]?key|token|password|secret)\\s*[:=]\\s*[^\\s,;]+",
            "$1=[REDACTED]",
            RegexOptions.CultureInvariant);
        clean = Regex.Replace(
            clean,
            @"(?i)\\bbearer\\s+[a-z0-9._~+/=-]{8,}",
            "Bearer [REDACTED]",
            RegexOptions.CultureInvariant);'''
          if text.count(old_redaction) != 1:
              raise SystemExit(f'{source}: expected one credential-redaction block, found {text.count(old_redaction)}')
          text = text.replace(old_redaction, new_redaction)
          source.write_text(text, encoding='utf-8')
          PY

          rm -- .github/workflows/repair-pr630-operations-policy.yml
          git diff --check
          git diff --exit-code -- . \
            ':!src/backend/ProjectTime.Api/Ai/CelarAiOperationsContracts.cs' \
            ':!.github/workflows/repair-pr630-operations-policy.yml'

      - name: Validate focused policy tests
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Run focused policy tests
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet run \
            --project tests/CelarAiOperationsPolicyTests/CelarAiOperationsPolicyTests.csproj \
            --configuration Release

      - name: Commit bounded policy correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add -- \
            src/backend/ProjectTime.Api/Ai/CelarAiOperationsContracts.cs \
            .github/workflows/repair-pr630-operations-policy.yml
          git commit -m 'Correct Ask Celar AI troubleshooting and bearer redaction policy'
          git push origin "HEAD:${HEAD_BRANCH}"
