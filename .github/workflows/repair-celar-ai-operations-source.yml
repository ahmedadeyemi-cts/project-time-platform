name: Repair Ask Celar AI Operations Source

on:
  push:
    branches:
      - feature/ask-celar-ai-troubleshooting-defect-automation-20260810
    paths:
      - '.github/workflows/repair-celar-ai-operations-source.yml'

permissions:
  contents: write

concurrency:
  group: repair-celar-ai-operations-source
  cancel-in-progress: false

jobs:
  repair:
    name: Apply scoped security, recovery, and runtime corrections
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact stacked branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feature/ask-celar-ai-troubleshooting-defect-automation-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          module_path = Path('src/backend/ProjectTime.Api/Modules/CelarAiOperationsModule.cs')
          module = module_path.read_text()
          unsafe_map = '''        group.MapGet("/defects/matches",
              (Func<HttpContext, PulseAiSystemIntelligenceService, CelarAiDefectOrchestrationService, string?, string?, string?, string?, CancellationToken, Task<IResult>>)FindMatchingDefectsAsync);
'''
          if unsafe_map in module:
              module = module.replace(unsafe_map, '', 1)
          elif 'CelarAiDefectOrchestrationService, string?, string?, string?, string?, CancellationToken' in module:
              raise SystemExit('CELAR_AIOPS_REPAIR_UNSAFE_MATCH_ROUTE_ANCHOR_CHANGED')
          module_path.write_text(module)

          service_path = Path('src/backend/ProjectTime.Api/Ai/CelarAiDefectOrchestrationService.cs')
          service = service_path.read_text()
          replacements = {
              'openMachineDefects = reader.GetInt32(0);': 'openMachineDefects = checked((int)reader.GetInt64(0));',
              'pendingNotifications = reader.GetInt32(1);': 'pendingNotifications = checked((int)reader.GetInt64(1));',
              'policyCount = reader.GetInt32(2);': 'policyCount = checked((int)reader.GetInt64(2));',
              'var count = reader.GetInt32(0);': 'var count = checked((int)reader.GetInt64(0));'
          }
          for before, after in replacements.items():
              if before in service:
                  service = service.replace(before, after, 1)
              elif after not in service:
                  raise SystemExit(f'CELAR_AIOPS_REPAIR_MISSING_ANCHOR={before}')

          old_fingerprint = '''        var fingerprint = Fingerprint(
              policy.Environment,
              policy.ComponentCode,
              evidence.ProbeCode,
              evidence.FailureCode,
              CelarAiOperationsPolicy.ReleaseSha());'''
          new_fingerprint = '''        // Stable across failure and recovery probes for one policy and release.
          // Individual failure codes remain in occurrence evidence and metadata.
          var fingerprint = Fingerprint(
              policy.Environment,
              policy.ComponentCode,
              policy.PolicyCode,
              CelarAiOperationsPolicy.ReleaseSha());'''
          if old_fingerprint in service:
              service = service.replace(old_fingerprint, new_fingerprint, 1)
          elif new_fingerprint not in service:
              raise SystemExit('CELAR_AIOPS_REPAIR_FINGERPRINT_ANCHOR_CHANGED')

          rate_anchor = '''        if (await AutomaticDefectRateLimitReachedAsync(connection, transaction, policy.MaximumNewDefectsPerHour, cancellationToken))
              return null;'''
          flapping_marker = 'automatic_defect_reopened_after_recovery'
          if flapping_marker not in service:
              if service.count(rate_anchor) != 1:
                  raise SystemExit('CELAR_AIOPS_REPAIR_RATE_ANCHOR_NOT_UNIQUE')
              flapping = '''        var recentlyResolved = await FindRecentResolvedByFingerprintAsync(
              connection,
              transaction,
              policy.Environment,
              fingerprint,
              evidence.ObservedAt.AddSeconds(-policy.FlappingWindowSeconds),
              cancellationToken);
          if (recentlyResolved is not null)
          {
              var nextFlappingCount = recentlyResolved.FlappingCount + 1;
              var escalate = nextFlappingCount >= policy.FlappingReopenThreshold;
              await using var reopen = new NpgsqlCommand("""
                  UPDATE module076_defects
                  SET status='Reopened',date_resolved=NULL,
                      occurrence_count=occurrence_count+1,
                      flapping_count=flapping_count+1,
                      priority=CASE
                          WHEN @escalate=FALSE THEN priority
                          WHEN priority='Low' THEN 'Medium'
                          WHEN priority='Medium' THEN 'High'
                          ELSE 'Critical'
                      END,
                      last_observed_at=@observed,updated_at=NOW(),
                      revision_number=revision_number+1
                  WHERE defect_id=@id
                    AND machine_created=TRUE
                    AND status='Resolved';
                  """, connection, transaction);
              reopen.Parameters.AddWithValue("escalate", escalate);
              reopen.Parameters.AddWithValue("observed", evidence.ObservedAt);
              reopen.Parameters.AddWithValue("id", recentlyResolved.DefectId);
              if (await reopen.ExecuteNonQueryAsync(cancellationToken) == 1)
              {
                  await InsertOccurrenceAsync(connection, transaction, recentlyResolved.DefectId, fingerprint, evidence, cancellationToken);
                  await InsertCommentAsync(
                      connection,
                      transaction,
                      recentlyResolved.DefectId,
                      "monitor_occurrence",
                      $"The same governed incident recurred during the {policy.FlappingWindowSeconds}-second flapping window. Failure: {evidence.FailureCode}.",
                      cancellationToken);
                  await InsertEventAsync(
                      connection,
                      transaction,
                      recentlyResolved.DefectId,
                      "automatic_defect_reopened_after_recovery",
                      "Resolved",
                      "Reopened",
                      escalate
                          ? "The recurring incident crossed the flapping escalation threshold."
                          : "The recurring incident reopened the existing machine-created defect.",
                      null,
                      null,
                      new
                      {
                          policy.PolicyCode,
                          nextFlappingCount,
                          policy.FlappingReopenThreshold,
                          priorityEscalated = escalate
                      },
                      cancellationToken);
                  var reopened = await FindDefectByIdAsync(connection, transaction, recentlyResolved.DefectId, cancellationToken)
                      ?? recentlyResolved;
                  await QueueNotificationAsync(
                      connection,
                      transaction,
                      reopened,
                      escalate ? "defect_escalated" : "defect_reopened",
                      "active_manager_role_group_and_default_assignee",
                      $"{(escalate ? "defect_escalated" : "defect_reopened")}:{reopened.DefectNumber}:{reopened.RevisionNumber}",
                      cancellationToken);
                  return reopened;
              }
          }

'''
              service = service.replace(rate_anchor, flapping + rate_anchor, 1)

          helper_anchor = '''    private static async Task<IReadOnlyList<CelarAiDefectRecord>> ReadDefectsAsync(
'''
          helper_marker = 'FindRecentResolvedByFingerprintAsync'
          if service.count(helper_marker) == 1:
              if service.count(helper_anchor) != 1:
                  raise SystemExit('CELAR_AIOPS_REPAIR_HELPER_ANCHOR_NOT_UNIQUE')
              helper = '''    private static async Task<CelarAiDefectRecord?> FindRecentResolvedByFingerprintAsync(
          NpgsqlConnection connection,
          NpgsqlTransaction transaction,
          string environment,
          string fingerprint,
          DateTimeOffset since,
          CancellationToken cancellationToken)
      {
          await using var command = new NpgsqlCommand(
              DefectSelect + """
               WHERE d.environment=@environment
                 AND d.fingerprint=@fingerprint
                 AND d.machine_created=TRUE
                 AND d.status='Resolved'
                 AND d.date_resolved>=@since
               ORDER BY d.date_resolved DESC
               LIMIT 1;
              """,
              connection,
              transaction);
          command.Parameters.AddWithValue("environment", environment);
          command.Parameters.AddWithValue("fingerprint", fingerprint);
          command.Parameters.AddWithValue("since", since);
          var rows = await ReadDefectsAsync(command, cancellationToken);
          return rows.FirstOrDefault();
      }

'''
              service = service.replace(helper_anchor, helper + helper_anchor, 1)
          elif service.count(helper_marker) < 2:
              raise SystemExit('CELAR_AIOPS_REPAIR_RECENT_RESOLVED_HELPER_MISSING')

          service_path.write_text(service)
          PY

          rm -f .github/workflows/repair-celar-ai-operations-source.yml
          git diff --check
          node --check src/frontend/project-time-web/scripts/inject-celar-ai-ask-operations.mjs

      - name: Commit validated corrections and remove temporary control
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Pulse Celar AI Operations Automation'
          git config user.email 'pulse-celar-ai-operations@users.noreply.github.com'
          git add -A
          git commit -m 'fix: scope defect matching and complete recovery controls'
          git push origin HEAD:feature/ask-celar-ai-troubleshooting-defect-automation-20260810
