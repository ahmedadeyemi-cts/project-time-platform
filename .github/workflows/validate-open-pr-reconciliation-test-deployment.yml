name: Validate Open PR Reconciliation Test Deployment

on:
  push:
    branches:
      - 'release/open-pr-reconciliation-test-deployment-*'
      - 'release/repin-open-pr-reconciliation-test-deployment-*'
      - 'release/repin-migration-049-role-compatible-test-*'
  pull_request:
    paths:
      - '.github/workflows/projectpulse-deploy-open-pr-reconciliation-test.yml'
      - '.github/workflows/validate-open-pr-reconciliation-test-deployment.yml'
      - 'scripts/apply-open-pr-reconciliation-test-migration-049.sh'
      - 'scripts/run-open-pr-reconciliation-test-migration-job.sh'
      - 'scripts/run-open-pr-reconciliation-test-deployment.sh'
      - 'scripts/validate-open-pr-reconciliation-test-deployment.sh'

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate guarded role-compatible reconciled release deployment controls
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: projectpulse_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projectpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce exact deployment-control scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${CHANGED[@]}"

          ALLOWED=(
            '.github/workflows/projectpulse-deploy-open-pr-reconciliation-test.yml'
            '.github/workflows/validate-open-pr-reconciliation-test-deployment.yml'
            'scripts/apply-open-pr-reconciliation-test-migration-049.sh'
            'scripts/run-open-pr-reconciliation-test-migration-job.sh'
            'scripts/run-open-pr-reconciliation-test-deployment.sh'
            'scripts/validate-open-pr-reconciliation-test-deployment.sh'
          )

          [[ "${#CHANGED[@]}" -eq 6 ]] || {
            echo "Expected exactly six deployment-control files; found ${#CHANGED[@]}." >&2
            exit 1
          }

          for changed in "${CHANGED[@]}"; do
            MATCH=false
            for allowed in "${ALLOWED[@]}"; do
              [[ "$changed" == "$allowed" ]] && MATCH=true
            done
            [[ "$MATCH" == true ]] || {
              echo "Unexpected changed file: $changed" >&2
              exit 1
            }
          done

          echo 'OPEN_PR_RECONCILIATION_DEPLOYMENT_SCOPE=PASS'

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/apply-open-pr-reconciliation-test-migration-049.sh
          bash -n scripts/run-open-pr-reconciliation-test-migration-job.sh
          bash -n scripts/run-open-pr-reconciliation-test-deployment.sh
          bash -n scripts/validate-open-pr-reconciliation-test-deployment.sh
          echo 'OPEN_PR_RECONCILIATION_SHELL_SYNTAX=PASS'

      - name: Validate deployment-control contract
        shell: bash
        run: bash scripts/validate-open-pr-reconciliation-test-deployment.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Build reconciled API source
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Execute authorization tests
        run: >-
          dotnet run
          --project tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj
          --configuration Release

      - name: Verify API startup and route registration
        run: bash tests/test-projectpulse-api-startup.sh

      - name: Test migration 049 with absent and optional compatibility roles
        env:
          PROJECTPULSE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/projectpulse_test
        run: bash tests/test-module-021-sell-customer-sync-049.sh

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate admin runtime stability
        working-directory: src/frontend/project-time-web
        run: node scripts/validate-admin-runtime-stability.mjs

      - name: Validate permission-aware More menu and Module 011 retirement
        working-directory: src/frontend/project-time-web
        run: node scripts/validate-group-1-navigation-work-consolidation.mjs

      - name: Validate Modules 021 and 026 SELL synchronization
        working-directory: src/frontend/project-time-web
        run: node scripts/validate-modules-021-026-sell-customer-sync.mjs

      - name: Validate provider-neutral Modules 013 016 and 068
        working-directory: src/frontend/project-time-web
        run: node scripts/validate-group-2a-provider-neutral-platform-operations.mjs

      - name: Validate Module 068 architecture compatibility
        working-directory: src/frontend/project-time-web
        run: node scripts/validate-module-068-system-architecture.mjs

      - name: Validate Microsoft authoritative connection
        working-directory: src/frontend/project-time-web
        run: npm run validate:microsoft-connection

      - name: Validate Microsoft SSO runtime
        working-directory: src/frontend/project-time-web
        run: npm run validate:microsoft-sso-runtime

      - name: Build frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Publish exact-commit deployment-control status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          API_ROOT: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            STATE=success
            DESCRIPTION='Role-compatible migration 049, complete source, API, frontend, rollback, and deployment guards passed.'
          else
            STATE=failure
            DESCRIPTION='Open-PR reconciliation deployment-control validation failed.'
          fi

          PAYLOAD="$(jq -nc \
            --arg state "$STATE" \
            --arg context 'open-pr-reconciliation/deployment-controls' \
            --arg description "$DESCRIPTION" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$PAYLOAD" \
            "$API_ROOT/repos/$REPOSITORY/statuses/$COMMIT_SHA"
