name: Diagnose PR 648 Generated Task Edit Build Failure

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/diagnose-pr648-generated-task-edit.yml'

permissions:
  contents: write

concurrency:
  group: diagnose-pr648-generated-task-edit
  cancel-in-progress: false

jobs:
  patch:
    name: Instrument generated TaskEdit source failure and remove helper
    if: >-
      github.event.pull_request.number == 648 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/deploy-pr645-module001a-module013-test-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEAD_BRANCH: release/deploy-pr645-module001a-module013-test-20260811
      CONTROLLER: .github/workflows/deploy-pulse-current-main-654af0e-test.yml
      SELF: .github/workflows/diagnose-pr648-generated-task-edit.yml

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Instrument the existing one-file release controller
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == 'ahmedadeyemi-cts/project-time-platform' ]]
          [[ "$(git rev-parse HEAD)" == '${{ github.event.pull_request.head.sha }}' ]]
          [[ -f "$CONTROLLER" ]]
          [[ -f "$SELF" ]]

          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['CONTROLLER'])
          text = path.read_text(encoding='utf-8')
          old = """      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: |
          npm ci --no-audit --no-fund
          npm run build
"""
          new = """      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          if ! npm run build; then
            echo '===== GENERATED_TASK_EDIT_DRAWER_START ====='
            if [[ -f src/TaskEditDrawer.jsx ]]; then
              nl -ba src/TaskEditDrawer.jsx | sed -n '1,320p'
            else
              echo 'TaskEditDrawer.jsx was not generated.'
            fi
            echo '===== GENERATED_TASK_EDIT_DRAWER_END ====='
            echo '===== GENERATED_TASK_EDIT_SUPPORT_START ====='
            if [[ -f src/TaskEditSupport.js ]]; then
              nl -ba src/TaskEditSupport.js | sed -n '1,360p'
            else
              echo 'TaskEditSupport.js was not generated.'
            fi
            echo '===== GENERATED_TASK_EDIT_SUPPORT_END ====='
            echo '===== GENERATED_TASK_EDIT_REFERENCES_START ====='
            grep -RIn --exclude-dir=node_modules --exclude-dir=dist \
              -E 'isAssigneeEligible|TaskEditDrawer|TaskEditSupport' src scripts || true
            echo '===== GENERATED_TASK_EDIT_REFERENCES_END ====='
            exit 1
          fi
"""
          if old not in text:
              raise SystemExit('Frontend build step anchor was not found exactly once.')
          if text.count(old) != 1:
              raise SystemExit(f'Frontend build step anchor count was {text.count(old)}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f "$SELF"
          git add -A
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only origin/main | sed '/^$/d')
          [[ "${#changed[@]}" -eq 1 ]]
          [[ "${changed[0]}" == "$CONTROLLER" ]]
          grep -Fq 'GENERATED_TASK_EDIT_DRAWER_START' "$CONTROLLER"
          grep -Fq 'GENERATED_TASK_EDIT_SUPPORT_START' "$CONTROLLER"
          git commit -m 'Diagnose generated TaskEdit frontend build failure'
          git push origin "HEAD:${HEAD_BRANCH}"
