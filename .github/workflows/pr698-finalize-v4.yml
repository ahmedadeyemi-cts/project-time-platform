name: PR 698 Finalize Validated Product Source V4

on:
  push:
    branches:
      - fix/classic-appearance-celar-controls-20260815
    paths:
      - .github/workflows/pr698-finalize-v4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr698-finalize-product-v4
  cancel-in-progress: false

jobs:
  finalize:
    name: Validate and publish exact-main PR 698 product source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_MAIN_SHA: 823fae340a731ba92c5266349ad759493b5629a8
      EXPECTED_PAYLOAD_SHA256: 507587a7fd5ba34d104a688b4f524399e35be62ac713cbda078d12d56c7aa539
      TARGET_BRANCH: fix/classic-appearance-celar-controls-20260815

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/classic-appearance-celar-controls-20260815
          fetch-depth: 0

      - name: Reconcile with exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"
          if [[ "$actual_main" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "Current main moved: expected $EXPECTED_MAIN_SHA, found $actual_main" >&2
            exit 1
          fi
          git config user.name 'PR 698 release builder'
          git config user.email 'pr698-release@users.noreply.github.com'
          git merge --no-ff --no-commit origin/main
          test "$(git rev-parse MERGE_HEAD)" = "$EXPECTED_MAIN_SHA"
          git commit -m 'chore: reconcile PR 698 with exact current main'
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          echo "PR698_CURRENT_MAIN_RECONCILED=$actual_main"

      - name: Verify reviewed finalizer payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr698-finalizer /tmp/pr698-deferred
          cat .github/pr698-payload/chunk-*.b64 > /tmp/pr698-finalizer/payload.b64
          base64 --decode /tmp/pr698-finalizer/payload.b64 > /tmp/pr698-finalizer/payload.tar.gz
          actual_payload_sha="$(sha256sum /tmp/pr698-finalizer/payload.tar.gz | awk '{print $1}')"
          if [[ "$actual_payload_sha" != "$EXPECTED_PAYLOAD_SHA256" ]]; then
            echo "PR 698 payload checksum mismatch: expected $EXPECTED_PAYLOAD_SHA256, found $actual_payload_sha" >&2
            exit 1
          fi
          tar -tzf /tmp/pr698-finalizer/payload.tar.gz > /tmp/pr698-finalizer/payload-files.txt
          tar -xzf /tmp/pr698-finalizer/payload.tar.gz -C /tmp/pr698-finalizer
          python3 -m py_compile /tmp/pr698-finalizer/apply_pr698_account_center.py
          python3 -m py_compile /tmp/pr698-finalizer/apply_pr698_table_module_management.py
          python3 -m py_compile /tmp/pr698-finalizer/apply_workspace_navigation.py
          echo "PR698_FINALIZER_PAYLOAD=PASS sha256=$actual_payload_sha"

      - name: Apply reviewed Account Center and Workspace Directory source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr698-finalizer/account-stage/tools
          cp /tmp/pr698-finalizer/apply_pr698_account_center.py /tmp/pr698-finalizer/account-stage/tools/
          python3 /tmp/pr698-finalizer/account-stage/tools/apply_pr698_account_center.py "$GITHUB_WORKSPACE"
          python3 /tmp/pr698-finalizer/apply_pr698_table_module_management.py
          python3 /tmp/pr698-finalizer/apply_workspace_navigation.py

      - name: Converge current generated source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          web_root = Path('src/frontend/project-time-web')
          scripts_root = web_root / 'scripts'
          policy_path = web_root / 'src' / 'module-navigation-access-policy.js'
          declaration = 'const actionCode = canonicalRoleCode(grant?.actionCode ?? grant?.ActionCode);'
          action_filter = "if (!['MODULE_ACCESS', 'MODULE_VIEW'].includes(actionCode)) continue;"
          legacy_expression = "canonicalRoleCode(grant?.actionCode ?? grant?.ActionCode) !== 'MODULE_ACCESS'"
          legacy_line = re.compile(
              r'^(?P<indent>\s*)"canonicalRoleCode\(grant\?\.actionCode \?\? grant\?\.ActionCode\) !== \'MODULE_ACCESS\'",\s*$',
              re.MULTILINE,
          )

          changed = []
          for path in sorted(scripts_root.glob('validate-*.mjs')):
              text = path.read_text(encoding='utf-8')
              if legacy_expression not in text:
                  continue

              def replace(match):
                  indent = match.group('indent')
                  return (
                      f"{indent}'{declaration}',\n"
                      f'{indent}"{action_filter}",'
                  )

              updated, count = legacy_line.subn(replace, text)
              if count == 0:
                  raise RuntimeError(
                      f'Found retired navigation contract in {path}, but its validator line could not be normalized.'
                  )
              path.write_text(updated, encoding='utf-8')
              changed.append(f'{path}:{count}')

          remaining = []
          for path in sorted(scripts_root.glob('validate-*.mjs')):
              if legacy_expression in path.read_text(encoding='utf-8'):
                  remaining.append(str(path))
          if remaining:
              raise RuntimeError(f'Retired one-code validator contract remains: {remaining}')

          policy = policy_path.read_text(encoding='utf-8')
          for required in (declaration, action_filter, "effect === 'DENY'", 'explicitDeniedModuleNumbers.add(moduleCode)'):
              if required not in policy:
                  raise RuntimeError(f'Shared navigation policy missing current contract: {required}')
          if legacy_expression in policy:
              raise RuntimeError('Shared navigation policy regressed to the retired one-code contract.')

          print(
              'PR698_WORKSPACE_NAVIGATION_VALIDATORS=PASS '
              f'normalized={len(changed)} files={";".join(changed) if changed else "none"} '
              'actions=MODULE_ACCESS,MODULE_VIEW explicitDeny=preserved'
          )
          PYCODE

          python3 - <<'PYCODE'
          from pathlib import Path

          path = Path('src/frontend/project-time-web/src/WorkspaceNavigationPortal.jsx')
          text = path.read_text(encoding='utf-8')
          legacy_declaration = 'function QuickLauncher('
          legacy_usage = '<QuickLauncher'
          current_declaration = 'function WorkspaceQuickLauncher('
          current_usage = '<WorkspaceQuickLauncher'

          if legacy_declaration in text:
              if text.count(legacy_declaration) != 1:
                  raise RuntimeError('Legacy QuickLauncher declaration count is ambiguous')
              text = text.replace(legacy_declaration, current_declaration, 1)
          if legacy_usage in text:
              text = text.replace(legacy_usage, current_usage)
          if legacy_declaration in text or legacy_usage in text:
              raise RuntimeError('Legacy QuickLauncher component reference remains')
          if text.count(current_declaration) != 1 or text.count(current_usage) < 1:
              raise RuntimeError('WorkspaceQuickLauncher declaration and usage did not converge')
          path.write_text(text, encoding='utf-8')
          print(f'PR698_WORKSPACE_QUICK_LAUNCHER_CONTRACT=PASS usages={text.count(current_usage)}')
          PYCODE

          python3 - <<'PYCODE'
          from pathlib import Path

          path = Path('src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx')
          text = path.read_text(encoding='utf-8')
          legacy = 'Module availability returned an invalid override response. Existing modules remain available.'
          current = 'Module availability returned an invalid override response. Existing module cards remain available.'
          if legacy in text:
              text = text.replace(legacy, current, 1)
          if current not in text:
              raise RuntimeError('Existing Modules directory continuity marker did not converge')
          path.write_text(text, encoding='utf-8')
          print('PR698_MODULE_DIRECTORY_AVAILABILITY_CONTINUITY=PASS behavior=fail-open-existing-cards')
          PYCODE

          python3 - <<'PYCODE'
          from pathlib import Path

          path = Path('src/backend/ProjectTime.Api/Modules/ModuleCatalogOwnershipModule.cs')
          text = path.read_text(encoding='utf-8')
          legacy = 'ownerUserId = reader.IsDBNull(1) ? null : reader.GetGuid(1),'
          current = 'ownerUserId = reader.IsDBNull(1) ? (Guid?)null : reader.GetGuid(1),'
          if legacy in text:
              text = text.replace(legacy, current, 1)
          if current not in text:
              raise RuntimeError('Nullable owner GUID expression did not converge')
          path.write_text(text, encoding='utf-8')
          print('PR698_NULLABLE_OWNER_GUID_FIX=PASS')
          PYCODE

      - name: Preserve deferred workflow update and stage product source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr698-deferred
          git diff -- .github/workflows > /tmp/pr698-deferred/deferred-workflow.patch || true
          cp .github/workflows/enterprise-ui-polish-ci.yml /tmp/pr698-deferred/enterprise-ui-polish-ci.yml
          sha256sum /tmp/pr698-deferred/enterprise-ui-polish-ci.yml > /tmp/pr698-deferred/enterprise-ui-polish-ci.sha256

          git restore --source=HEAD --staged --worktree -- .github/workflows
          git clean -fd -- .github/workflows
          git restore --source=HEAD --staged --worktree -- .github/pr698-payload
          git clean -fd -- .github/pr698-payload
          rm -f scripts/pr698_module001a_catalog_patch.py

          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -qE '^\.github/(workflows/|pr698-payload/)'; then
            echo 'The Actions token must not publish temporary workflow or payload changes.' >&2
            git diff --cached --name-only | grep -E '^\.github/(workflows/|pr698-payload/)' >&2 || true
            exit 1
          fi
          git diff --cached --name-only > /tmp/pr698-deferred/product-files.txt
          echo PR698_FINAL_PRODUCT_SOURCE_STAGED=PASS

      - name: Validate repository security posture without temporary branch writer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr698-finalize-v4.yml
          python3 scripts/security/validate-repository-security-posture.py
          git restore --source=HEAD --worktree -- .github/workflows/pr698-finalize-v4.yml
          echo PR698_REPOSITORY_SECURITY=PASS

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build API
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/backend/ProjectTime.Api/ProjectTime.Api.csproj
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --no-restore
          echo PR698_API_BUILD=PASS

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci

      - name: Validate focused release contracts
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -euo pipefail
          node --check ./scripts/inject-celar-ai-ask-operations.mjs
          node --check ./scripts/validate-account-center.mjs
          node --check ./scripts/validate-workspace-navigation.mjs
          node --check ./scripts/validate-enterprise-ui-polish.mjs
          node --check ./scripts/validate-module-001a-engineer-request-closeout.mjs
          node --check ./scripts/validate-pr698-table-module-management.mjs
          node --check ./scripts/validate-module-071-oncall-scheduling.mjs
          node --check ./scripts/validate-module-072-oneassist-routing-directory.mjs
          node --check ./scripts/validate-modules-064-074-ui-authority.mjs
          node --check ./src/module-navigation-access-policy.js
          node --check ./src/role-permission-model.js
          node ./scripts/validate-account-center.mjs
          node ./scripts/validate-workspace-navigation.mjs
          node ./scripts/validate-enterprise-ui-polish.mjs
          node ./scripts/validate-module-001a-engineer-request-closeout.mjs
          node ./scripts/validate-pr698-table-module-management.mjs
          node ./scripts/validate-module-071-oncall-scheduling.mjs
          node ./scripts/validate-module-072-oneassist-routing-directory.mjs
          node ./scripts/validate-modules-064-074-ui-authority.mjs
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as ET
          ET.parse('src/assets/module-006-customer-brands.svg')
          print('MODULE_006_CUSTOMER_BRANDS_SVG=PASS')
          PYCODE

      - name: Run complete frontend production build
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Confirm exact validated product source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --check
          test -s /tmp/pr698-deferred/product-files.txt
          if git diff --cached --name-only | grep -qE '^\.github/(workflows/|pr698-payload/)'; then
            echo 'Temporary workflow or payload changes entered the product commit.' >&2
            exit 1
          fi
          echo PR698_CLEAN_VALIDATED_SOURCE=PASS

      - name: Upload deferred workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr698-deferred-workflow-and-product-manifest
          path: /tmp/pr698-deferred
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push validated product source
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat: deliver Account Center and Workspace Directory'
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          final_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "PR698_VALIDATED_PRODUCT_COMMIT=$final_sha"
