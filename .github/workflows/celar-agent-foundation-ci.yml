name: Celar role-scoped agent foundation
on:
  pull_request:
    paths:
      - 'src/backend/ProjectTime.Api/Agents/**'
      - 'src/frontend/project-time-web/src/agents/**'
      - 'tests/AgentFoundationTests/**'
      - 'tests/agent-foundation/**'
      - 'docs/agent-foundation/**'
      - '.github/workflows/celar-agent-foundation-ci.yml'
  push:
    branches: ['feature/celar-role-agent-foundation-20260923']
permissions:
  contents: read
concurrency:
  group: celar-agent-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify additive scope, Module 064 bridge and disabled rollout boundaries
        run: python3 tests/agent-foundation/source_boundaries.py
      - name: Build actual API including agent foundation
        run: dotnet build src/backend/ProjectTime.Api --configuration Release
      - name: Exercise bounded runtime with synthetic authority, storage and tools
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet run --project tests/AgentFoundationTests --configuration Release -p:BuildProjectReferences=false 2>&1 | tee "$RUNNER_TEMP/agent-foundation-tests.txt"
      - name: Verify role-scoped presentation and stale-context rejection
        run: node --test tests/agent-foundation/workspace.test.mjs
      - name: Install locked frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci
      - name: Compile unmounted assistant component and build actual frontend
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          ./node_modules/.bin/esbuild src/agents/WorkAssistantPanel.jsx --bundle --external:react --outfile="$RUNNER_TEMP/agent-foundation-panel.js"
          npm run build
      - name: Verify build left tracked source unchanged
        run: git diff --exit-code
      - name: Retain synthetic runtime test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-foundation-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-foundation-tests.txt
          if-no-files-found: ignore
          retention-days: 7
