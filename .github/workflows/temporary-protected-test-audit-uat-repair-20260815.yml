name: Apply Protected-Test Audit UAT Contract Repair

on:
  push:
    branches:
      - fix/protected-test-audit-uat-contract-20260815
    paths:
      - '.github/workflows/temporary-protected-test-audit-uat-repair-20260815.yml'

permissions:
  contents: write

jobs:
  repair:
    name: Apply and validate the Protected-Test audit UAT contract repair
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/protected-test-audit-uat-contract-20260815
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Apply, validate, and publish focused repair
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo 'ERROR: Checkout does not match the exact triggering commit.' >&2
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/projectpulse-deploy-test.yml')
          validator_path = Path('tests/validate-systemwide-enterprise-reliability.mjs')

          workflow = workflow_path.read_text(encoding='utf-8')
          validator = validator_path.read_text(encoding='utf-8')

          old_assertions = '''          jq -e '[.events[]? | .eventType] | any(. == "login_succeeded" or . == "login_failed" or . == "logout_succeeded")' "$EVIDENCE_DIR/audit-authentication.json" >/dev/null || fail 'Audit history did not expose authentication outcomes.'
          jq -e '[.events[]? | .eventType] | any(. == "login_failed")' "$EVIDENCE_DIR/audit-authentication.json" >/dev/null || fail 'Failed login was not visible in Audit History.'
          jq -e '[.events[]? | .eventType] | any(. == "logout_succeeded")' "$EVIDENCE_DIR/audit-authentication.json" >/dev/null || fail 'Logout was not visible in Audit History.'
'''

          new_assertions = '''          jq -e '\n            .status == "audit_history_loaded"\n            and (.centralAudit.available == true)\n            and ((.events // []) | type == "array")\n            and ((.events // []) | length > 0)\n          ' "$EVIDENCE_DIR/audit-authentication.json" >/dev/null || fail 'Audit History did not return an available authentication event collection.'
          jq -e '\n            any(.events[]?;\n              (.details.event_type // "") == "login_succeeded"\n              or (((.eventType // "") | ascii_downcase) == "login succeeded")\n            )\n          ' "$EVIDENCE_DIR/audit-authentication.json" >/dev/null || fail 'Successful login was not visible in Audit History.'
          jq -e '\n            any(.events[]?;\n              (.details.event_type // "") == "login_failed"\n              or (((.eventType // "") | ascii_downcase) == "login failed")\n            )\n          ' "$EVIDENCE_DIR/audit-authentication.json" >/dev/null || fail 'Failed login was not visible in Audit History.'
          jq -e '\n            any(.events[]?;\n              (.details.event_type // "") == "logout_succeeded"\n              or (.details.login_result // "") == "logout_success"\n              or (.details.revoked_reason // "") == "user_logout"\n              or (((.eventType // "") | ascii_downcase) == "logout succeeded")\n            )\n          ' "$EVIDENCE_DIR/audit-authentication.json" >/dev/null || fail 'Logout was not visible in Audit History.'
'''

          if workflow.count(old_assertions) != 1:
              raise SystemExit(f'Expected exactly one legacy audit assertion block; found {workflow.count(old_assertions)}.')
          workflow = workflow.replace(old_assertions, new_assertions, 1)

          anchor = ''']) requireText(deployment, marker, 'role-correct Opportunity Directory UAT');

const authGetStart'''
          validator_block = ''']) requireText(deployment, marker, 'role-correct Opportunity Directory UAT');

for (const marker of [
  '.status == "audit_history_loaded"',
  '.centralAudit.available == true',
  '.details.event_type // ""',
  '.details.login_result // ""',
  '.details.revoked_reason // ""',
  '"logout_success"',
  '"user_logout"'
]) requireText(deployment, marker, 'Audit History response-contract UAT');
rejectText(
  deployment,
  '[.events[]? | .eventType] | any(. == "login_succeeded"',
  'display-label-only Audit History UAT'
);

const auditResponseFixture = {
  status: 'audit_history_loaded',
  centralAudit: { available: true },
  events: [
    { eventType: 'Login Succeeded', details: { event_type: 'login_succeeded' } },
    { eventType: 'Login Failed', details: { event_type: 'login_failed' } },
    { eventType: 'Auth Login Events', details: { login_result: 'logout_success' } },
    { eventType: 'Auth Sessions', details: { revoked_reason: 'user_logout' } }
  ]
};
const auditEvents = auditResponseFixture.events;
if (!auditEvents.some((event) => event.details?.event_type === 'login_succeeded')) {
  throw new Error('Audit response fixture is missing login_succeeded evidence.');
}
if (!auditEvents.some((event) => event.details?.event_type === 'login_failed')) {
  throw new Error('Audit response fixture is missing login_failed evidence.');
}
if (!auditEvents.some((event) =>
  event.details?.event_type === 'logout_succeeded'
  || event.details?.login_result === 'logout_success'
  || event.details?.revoked_reason === 'user_logout'
)) {
  throw new Error('Audit response fixture is missing logout evidence.');
}

const authGetStart'''

          if validator.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one validator insertion anchor; found {validator.count(anchor)}.')
          validator = validator.replace(anchor, validator_block, 1)

          workflow_path.write_text(workflow, encoding='utf-8')
          validator_path.write_text(validator, encoding='utf-8')
          PY

          bash -n <(
            sed -n \
              '/          login() {/,/          unset COORDINATOR_SESSION TEST_LOGIN_PASSWORD/p' \
              .github/workflows/projectpulse-deploy-test.yml
          )

          cat > "$RUNNER_TEMP/audit-authentication-fixture.json" <<'JSON'
          {
            "status": "audit_history_loaded",
            "centralAudit": { "available": true },
            "events": [
              { "eventType": "Login Succeeded", "details": { "event_type": "login_succeeded" } },
              { "eventType": "Login Failed", "details": { "event_type": "login_failed" } },
              { "eventType": "Auth Login Events", "details": { "login_result": "logout_success" } },
              { "eventType": "Auth Sessions", "details": { "revoked_reason": "user_logout" } }
            ]
          }
          JSON

          jq -e '
            .status == "audit_history_loaded"
            and (.centralAudit.available == true)
            and ((.events // []) | type == "array")
            and ((.events // []) | length > 0)
          ' "$RUNNER_TEMP/audit-authentication-fixture.json" >/dev/null
          jq -e 'any(.events[]?; (.details.event_type // "") == "login_succeeded" or (((.eventType // "") | ascii_downcase) == "login succeeded"))' "$RUNNER_TEMP/audit-authentication-fixture.json" >/dev/null
          jq -e 'any(.events[]?; (.details.event_type // "") == "login_failed" or (((.eventType // "") | ascii_downcase) == "login failed"))' "$RUNNER_TEMP/audit-authentication-fixture.json" >/dev/null
          jq -e 'any(.events[]?; (.details.event_type // "") == "logout_succeeded" or (.details.login_result // "") == "logout_success" or (.details.revoked_reason // "") == "user_logout" or (((.eventType // "") | ascii_downcase) == "logout succeeded"))' "$RUNNER_TEMP/audit-authentication-fixture.json" >/dev/null

          node --check tests/validate-systemwide-enterprise-reliability.mjs
          node tests/validate-systemwide-enterprise-reliability.mjs
          node tests/validate-systemwide-image-build-controller.mjs
          node tests/validate-utilization-role-scoping.mjs
          git diff --check

          cat > "$RUNNER_TEMP/expected-files" <<'FILES'
          .github/workflows/projectpulse-deploy-test.yml
          tests/validate-systemwide-enterprise-reliability.mjs
          FILES
          LC_ALL=C sort -u "$RUNNER_TEMP/expected-files" -o "$RUNNER_TEMP/expected-files"
          git diff --name-only | LC_ALL=C sort -u > "$RUNNER_TEMP/actual-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/temporary-protected-test-audit-uat-repair-20260815.yml
          git add -- \
            .github/workflows/projectpulse-deploy-test.yml \
            tests/validate-systemwide-enterprise-reliability.mjs
          git diff --cached --check
          git commit -m 'Align Protected-Test audit UAT with response contract'
          git push origin HEAD:refs/heads/fix/protected-test-audit-uat-contract-20260815

          echo 'PROTECTED_TEST_AUDIT_UAT_CONTRACT_REPAIR=PASS'
          echo 'FINAL_PR_FILES=2'
          echo 'APPLICATION_SOURCE_CHANGE=NONE'
          echo 'PRODUCTION_MUTATION=NONE'
