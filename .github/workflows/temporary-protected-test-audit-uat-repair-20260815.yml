name: Apply Protected-Test Audit UAT Contract Repair

on:
  push:
    branches:
      - fix/protected-test-audit-uat-contract-20260815
    paths:
      - '.github/workflows/temporary-protected-test-audit-uat-repair-20260815.yml'

permissions:
  contents: write

jobs:
  repair:
    name: Apply and validate the Protected-Test audit UAT contract repair
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/protected-test-audit-uat-contract-20260815
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Apply, validate, and publish focused repair
        shell: bash
        run: python3 .github/scripts/apply-protected-test-audit-uat-repair-20260815.py
