name: Inspect Corrected Module 081 and 082 Test Deployment

on:
  pull_request:
    paths:
      - '.github/workflows/projectpulse-inspect-test-retry.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: Monitor exact protected Test deployment without mutation
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      TARGET_WORKFLOW: projectpulse-deploy-test.yml
      TARGET_CONTROL_COMMIT: af5fad6f4feaebe983caceb7a53b8d923d20d3f8
      TARGET_RELEASE_COMMIT: b0aedc706c3fe33b97b91a1b0074a20578c82b64
      EXPECTED_ARTIFACT_PREFIX: modules-081-082-theme-b0aedc70-test-

    steps:
      - name: Locate and monitor the exact push-triggered Test deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          RUN_ID=''
          for poll in $(seq 1 60); do
            RUNS="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?branch=main&event=push&per_page=100"
            )"
            RUN_ID="$(
              jq -r --arg sha "$TARGET_CONTROL_COMMIT" '
                [.workflow_runs[] | select(.head_sha == $sha and .event == "push")]
                | sort_by(.created_at)
                | reverse
                | .[0].id // empty
              ' <<<"$RUNS"
            )"
            [[ -n "$RUN_ID" ]] && break
            sleep 10
          done
          [[ -n "$RUN_ID" ]] || {
            echo 'The exact Test deployment run was not found.' >&2
            exit 1
          }

          echo "TARGET_RUN_ID=$RUN_ID"
          TARGET=''
          CONCLUSION=''
          for poll in $(seq 1 480); do
            TARGET="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            )"
            [[ "$(jq -r '.head_sha' <<<"$TARGET")" == "$TARGET_CONTROL_COMMIT" ]]
            [[ "$(jq -r '.event' <<<"$TARGET")" == push ]]
            [[ "$(jq -r '.path' <<<"$TARGET" | cut -d@ -f1)" == ".github/workflows/$TARGET_WORKFLOW" ]]

            STATUS="$(jq -r '.status' <<<"$TARGET")"
            ATTEMPT="$(jq -r '.run_attempt' <<<"$TARGET")"
            echo "TARGET_POLL=$poll STATUS=$STATUS ATTEMPT=$ATTEMPT"
            if [[ "$STATUS" == completed ]]; then
              CONCLUSION="$(jq -r '.conclusion // "unknown"' <<<"$TARGET")"
              break
            fi
            sleep 15
          done

          [[ -n "$CONCLUSION" ]] || CONCLUSION='timed_out'
          echo "TARGET_RUN_ATTEMPT=$(jq -r '.run_attempt // 0' <<<"$TARGET")"
          echo "TARGET_RUN_STATUS=$(jq -r '.status // "unknown"' <<<"$TARGET")"
          echo "TARGET_RUN_CONCLUSION=$CONCLUSION"
          echo "TARGET_RUN_CREATED_AT=$(jq -r '.created_at // "none"' <<<"$TARGET")"
          echo "TARGET_RUN_UPDATED_AT=$(jq -r '.updated_at // "none"' <<<"$TARGET")"
          echo "TARGET_RUN_URL=$(jq -r '.html_url // "none"' <<<"$TARGET")"

          JOBS="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100"
          )"
          jq -r '.jobs[] | [.id, .name, .status, (.conclusion // "none")] | @tsv' <<<"$JOBS" \
            | sed 's/^/TARGET_JOB=/'

          JOB_ID="$(jq -r '.jobs[0].id // empty' <<<"$JOBS")"
          if [[ -n "$JOB_ID" ]]; then
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" \
              > "$RUNNER_TEMP/target-job.log"

            echo '--- MODULE 081/082 ACCESS SUMMARIES ---'
            grep -E '\{"module":"08[12]","contractVersion":"08[12]-enterprise-v1"' \
              "$RUNNER_TEMP/target-job.log" \
              | tail -n 10 \
              || true

            echo '--- THEME AND RELEASE EVIDENCE ---'
            grep -n -E 'themeRecovery|projectpulse-floating-theme-toggle|ptp-theme|projectpulse-theme-control|api_image=|web_image=|revision=|Candidate revision|Rollback revision|TARGET_RELEASE_COMMIT' \
              "$RUNNER_TEMP/target-job.log" \
              | tail -n 120 \
              || true

            echo '--- FAILURE CONTEXT, IF ANY ---'
            grep -n -E 'ERROR:|empty response body|invalid JSON response body|did not resolve|remained unavailable|expired or unauthorized|Restore prior images' \
              "$RUNNER_TEMP/target-job.log" \
              | tail -n 120 \
              || true
          fi

          ARTIFACT_NAME=''
          for poll in $(seq 1 12); do
            ARTIFACTS="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100"
            )"
            ARTIFACT_NAME="$(
              jq -r --arg prefix "$EXPECTED_ARTIFACT_PREFIX" '
                [.artifacts[]
                  | select(.expired == false and (.name | startswith($prefix)))]
                | sort_by(.created_at)
                | reverse
                | .[0].name // empty
              ' <<<"$ARTIFACTS"
            )"
            [[ -n "$ARTIFACT_NAME" || "$CONCLUSION" != success ]] && break
            sleep 5
          done

          echo "TARGET_ARTIFACT_NAME=${ARTIFACT_NAME:-none}"
          if [[ -n "$ARTIFACT_NAME" ]]; then
            jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name) | [.id, .name, (.expired | tostring)] | @tsv' <<<"$ARTIFACTS" \
              | sed 's/^/TARGET_ARTIFACT=/'
          fi

          [[ "$CONCLUSION" == success ]]
          [[ -n "$ARTIFACT_NAME" ]]
          echo "CORRECTED_TEST_DEPLOYMENT_INSPECTION=PASSED"
