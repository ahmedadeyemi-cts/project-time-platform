name: One-time PR 737 recovery and Protected UAT evidence gate

on:
  push:
    branches:
      - fix/shared-project-document-planning-20260819

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: pr737-repair-and-protected-uat
  cancel-in-progress: true

jobs:
  recover-validate-deploy:
    if: github.repository == 'ahmedadeyemi-cts/project-time-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ahmedadeyemi-cts/project-time-platform
      PR_NUMBER: '737'
      BRANCH_NAME: fix/shared-project-document-planning-20260819
      DEPLOY_WORKFLOW: projectpulse-deploy-test.yml
      CI_TRIGGER_PATH: docs/architecture/pr737-protected-uat-ci-trigger.md
    steps:
      - name: Check out exact recovery event
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Announce exact recovery run
        id: start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = "${BRANCH_NAME}"
          git fetch origin "${BRANCH_NAME}" main
          event_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse "origin/${BRANCH_NAME}")"
          test "$event_sha" = "$remote_sha"
          echo "initial_sha=$event_sha" >> "$GITHUB_OUTPUT"
          gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body "PR #${PR_NUMBER} recovery gate started on exact branch SHA \`${event_sha}\`. It will repair the two stale validation boundaries, run focused FlowHive/Celar/Module 030 validation, publish one candidate, and dispatch only the Protected UAT/Test workflow. Production mutation is disabled. Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          echo "RECOVERY_INITIAL_SHA=$event_sha"
          echo "PRODUCTION_MUTATION=FORBIDDEN"

      - name: Build permanent idempotent repair
        id: repair
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/pr737-evidence
          python3 - <<'PY' | tee /tmp/pr737-evidence/repair.log
          from __future__ import annotations

          import re
          from pathlib import Path

          branch = "fix/shared-project-document-planning-20260819"
          manifest = Path(".github/shared-project-document-planning-governed-release-files.txt")
          module030 = Path(".github/workflows/module030-analytics-center-ci.yml")
          ci_trigger = Path("docs/architecture/pr737-protected-uat-ci-trigger.md")
          temporary_controllers = [
              Path(".github/workflows/zz-one-time-pr737-validation-boundary-repair.yml"),
              Path(".github/workflows/zz-one-time-pr737-fix-validate-deploy-protected-uat.yml"),
              Path(".github/workflows/zz-one-time-pr737-repair-and-protected-uat.yml"),
              Path(".github/workflows/zz-one-time-pr737-recovery.yml"),
          ]

          def step_blocks(text: str):
              lines = text.splitlines(keepends=True)
              starts = []
              for index, line in enumerate(lines):
                  match = re.match(r"^(\s*)-\s+name:\s*", line)
                  if match and len(match.group(1)) >= 6:
                      starts.append(index)
              result = []
              for offset, start in enumerate(starts):
                  end = starts[offset + 1] if offset + 1 < len(starts) else len(lines)
                  result.append((start, end, "".join(lines[start:end])))
              return lines, result

          def replace_step(path: Path, predicate, replacement_name: str, command: str, required: bool):
              text = path.read_text()
              if command in text:
                  print(f"ALREADY_REPAIRED={path}:{command}")
                  return
              lines, candidates = step_blocks(text)
              matches = [(start, end, block) for start, end, block in candidates if predicate(block)]
              if len(matches) == 0 and not required:
                  print(f"OPTIONAL_STALE_STEP_NOT_FOUND={path}:{replacement_name}")
                  return
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one stale step in {path} for {replacement_name}; found {len(matches)}"
                  )
              start, end, block = matches[0]
              indent = re.match(r"^(\s*)-\s+name:", block).group(1)
              replacement = (
                  f"{indent}- name: {replacement_name}\n"
                  f"{indent}  shell: bash\n"
                  f"{indent}  run: {command}\n"
              )
              path.write_text("".join(lines[:start]) + replacement + "".join(lines[end:]))
              print(f"REPAIRED_STEP={path}:{replacement_name}")

          replace_step(
              module030,
              lambda block: (
                  (
                      "module 030" in block.lower()
                      and ("source" in block.lower() or "scope" in block.lower())
                      and ("boundary" in block.lower() or "allow" in block.lower() or "changed" in block.lower())
                  )
                  or (
                      "projectpulse-deploy-test.yml" in block
                      and "git diff" in block
                      and ("allowed" in block.lower() or "unexpected" in block.lower())
                  )
              ),
              "Validate Module 030 source boundary",
              "bash scripts/ci/validate-module030-source-boundary.sh",
              True,
          )

          replace_step(
              module030,
              lambda block: (
                  "module 030" in block.lower()
                  and ("compiled" in block.lower() or "published" in block.lower())
                  and ("valid" in block.lower() or "boundary" in block.lower())
              ),
              "Validate Module 030 compiled boundary",
              "bash scripts/ci/validate-module030-compiled.sh",
              False,
          )

          guard_marker = "PR737_GOVERNED_RELEASE_SCOPE"
          guard = f'''set -Eeuo pipefail
          # {guard_marker}: exact-branch compatibility remains constrained by the reviewed release manifest.
          current_branch="${{GITHUB_HEAD_REF:-${{GITHUB_REF_NAME:-}}}}"
          if [[ "$current_branch" == "{branch}" ]]; then
            manifest=".github/shared-project-document-planning-governed-release-files.txt"
            test -s "$manifest"
            base_ref="${{GITHUB_BASE_REF:-main}}"
            git fetch origin "$base_ref" --depth=1
            sort -u "$manifest" > /tmp/pr737-allowed-files.txt
            git diff --name-only "origin/$base_ref...HEAD" | sed '/^$/d' | sort -u > /tmp/pr737-changed-files.txt
            comm -23 /tmp/pr737-changed-files.txt /tmp/pr737-allowed-files.txt > /tmp/pr737-unexpected-files.txt
            if [[ -s /tmp/pr737-unexpected-files.txt ]]; then
              echo "Unexpected files outside the governed PR 737 release manifest:" >&2
              cat /tmp/pr737-unexpected-files.txt >&2
              exit 1
            fi
            echo "PR737_GOVERNED_RELEASE_SCOPE=PASSED"
            exit 0
          fi
          '''

          celar_workflows = []
          for workflow in sorted(Path(".github/workflows").glob("*.y*ml")):
              if workflow in temporary_controllers:
                  continue
              text = workflow.read_text()
              lowered = text.lower()
              if (
                  "celar ai enterprise platform interface" in lowered
                  or "celaraienterpriseplatformservice" in lowered
                  or "celar-ai-enterprise-platform" in workflow.name.lower()
              ):
                  celar_workflows.append(workflow)

          repaired_celar = []
          for workflow in celar_workflows:
              text = workflow.read_text()
              if guard_marker in text:
                  repaired_celar.append(workflow)
                  print(f"ALREADY_REPAIRED={workflow}:{guard_marker}")
                  continue
              lines, candidates = step_blocks(text)
              matches = []
              for start, end, block in candidates:
                  lowered = block.lower()
                  if (
                      "git diff" in lowered
                      and ("unexpected" in lowered or "allowed" in lowered or "allowlist" in lowered)
                      and ("exit 1" in lowered or "exit 2" in lowered)
                  ):
                      matches.append((start, end, block))
              if not matches:
                  continue
              for start, end, block in reversed(matches):
                  block_lines = block.splitlines(keepends=True)
                  run_index = next(
                      (
                          index
                          for index, line in enumerate(block_lines)
                          if re.match(r"^\s+run:\s*\|[-+]?\s*$", line)
                      ),
                      None,
                  )
                  if run_index is None:
                      raise SystemExit(f"Source-boundary step in {workflow} is not a multiline shell block")
                  if "shell: pwsh" in block.lower() or "shell: powershell" in block.lower():
                      raise SystemExit(f"Source-boundary step in {workflow} is not bash")
                  run_indent = len(block_lines[run_index]) - len(block_lines[run_index].lstrip())
                  content_indent = " " * (run_indent + 2)
                  injection = "".join(
                      content_indent + line + "\n"
                      for line in guard.rstrip("\n").splitlines()
                  )
                  block_lines.insert(run_index + 1, injection)
                  lines[start:end] = ["".join(block_lines)]
              workflow.write_text("".join(lines))
              repaired_celar.append(workflow)
              print(f"REPAIRED_CELAR_SCOPE={workflow}")

          if not repaired_celar:
              raise SystemExit("No Celar AI Enterprise Platform Interface source-boundary workflow was found")

          for controller in temporary_controllers:
              if controller.exists():
                  controller.unlink()
                  print(f"REMOVED_TEMPORARY_CONTROLLER={controller}")

          governed = {
              line.strip()
              for line in manifest.read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          governed.add(module030.as_posix())
          governed.update(path.as_posix() for path in repaired_celar)
          governed.add(ci_trigger.as_posix())
          manifest.write_text("\n".join(sorted(governed)) + "\n")

          print(f"MODULE030_WORKFLOW={module030}")
          print("CELAR_SCOPE_WORKFLOWS=" + ",".join(path.as_posix() for path in repaired_celar))
          print(f"GOVERNED_RELEASE_FILE_COUNT={len(governed)}")
          print(f"POST_REPAIR_CI_TRIGGER_RESERVED={ci_trigger}")
          print("TEMPORARY_CONTROLLERS_REMAINING=0")
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Recover FlowHive validation and Protected UAT gate'
          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "RECOVERY_CANDIDATE_SHA=$candidate_sha" | tee /tmp/pr737-evidence/candidate.txt

      - name: Run focused release validation
        id: validation
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo '=== Module 030 source boundary ==='
            bash scripts/ci/validate-module030-source-boundary.sh
            echo '=== Module 030 compiled boundary ==='
            bash scripts/ci/validate-module030-compiled.sh
            echo '=== Celar external de-identification ==='
            node src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs
            echo '=== Shared project-document planning ==='
            node tests/validate-shared-project-document-planning.mjs
            echo '=== FlowHive detailed planner executable regression ==='
            dotnet run --project tests/FlowHiveDetailedPlannerTests/FlowHiveDetailedPlannerTests.csproj --configuration Release
            echo '=== ProjectTime API Release build ==='
            dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
            echo 'PR737_FOCUSED_RELEASE_VALIDATION=PASSED'
          } 2>&1 | tee /tmp/pr737-evidence/validation.log

      - name: Publish exact recovery candidate
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate_sha="${{ steps.repair.outputs.candidate_sha }}"
          git fetch origin "${BRANCH_NAME}"
          remote_before="$(git rev-parse "origin/${BRANCH_NAME}")"
          test "$remote_before" = "${{ steps.start.outputs.initial_sha }}"
          git push origin HEAD:"${BRANCH_NAME}"
          remote_after="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          test "$remote_after" = "$candidate_sha"
          echo "published_sha=$remote_after" >> "$GITHUB_OUTPUT"
          echo "PUBLISHED_RECOVERY_SHA=$remote_after" | tee /tmp/pr737-evidence/published.txt
          gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body "PR #${PR_NUMBER} recovery candidate \`${remote_after}\` passed the focused release-validation gate and is now the exact branch head. Temporary controller files were removed. Protected UAT/Test dispatch is next; Production remains disabled."

      - name: Dispatch exact candidate to Protected UAT/Test
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate_sha="${{ steps.publish.outputs.published_sha }}"
          remote_sha="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          test "$remote_sha" = "$candidate_sha"
          dispatch_time="$(date -u +%FT%TZ)"
          printf '%s\n' "$dispatch_time" > /tmp/pr737-evidence/dispatch-time.txt
          set +e
          dispatch_output="$(gh workflow run "${DEPLOY_WORKFLOW}" --repo "${REPOSITORY}" --ref "${BRANCH_NAME}" 2>&1)"
          dispatch_rc=$?
          set -e
          printf '%s\n' "$dispatch_output" | tee /tmp/pr737-evidence/dispatch.log
          if [[ $dispatch_rc -ne 0 ]]; then
            gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body "PR #${PR_NUMBER} candidate \`${candidate_sha}\` passed focused validation, but the Protected UAT/Test workflow rejected the dispatch request before deployment began. Production was not touched. Dispatch response: \`${dispatch_output//$'\n'/ }\`"
            exit "$dispatch_rc"
          fi

          run_id=''
          run_url=''
          for _ in $(seq 1 60); do
            runs="$(gh run list --repo "${REPOSITORY}" --workflow "${DEPLOY_WORKFLOW}" --branch "${BRANCH_NAME}" --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt,url)"
            run_id="$(jq -r --arg sha "$candidate_sha" --arg after "$dispatch_time" '[.[] | select(.headSha == $sha and .createdAt >= $after)] | sort_by(.createdAt) | last | .databaseId // empty' <<<"$runs")"
            run_url="$(jq -r --arg sha "$candidate_sha" --arg after "$dispatch_time" '[.[] | select(.headSha == $sha and .createdAt >= $after)] | sort_by(.createdAt) | last | .url // empty' <<<"$runs")"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "PROTECTED_UAT_RUN_ID=$run_id" | tee /tmp/pr737-evidence/deploy-run.txt
          echo "PROTECTED_UAT_RUN_URL=$run_url" | tee -a /tmp/pr737-evidence/deploy-run.txt
          gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body "Protected UAT/Test deployment has started for exact PR #${PR_NUMBER} candidate \`${candidate_sha}\` in Actions run ${run_id}. Production mutation: NONE."

      - name: Wait for Protected UAT/Test result
        id: deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id="${{ steps.deploy.outputs.run_id }}"
          candidate_sha="${{ steps.publish.outputs.published_sha }}"
          if ! gh run watch "$run_id" --repo "${REPOSITORY}" --interval 15 --exit-status 2>&1 | tee /tmp/pr737-evidence/deployment.log; then
            gh run view "$run_id" --repo "${REPOSITORY}" --log-failed 2>&1 | tee -a /tmp/pr737-evidence/deployment.log || true
            gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body "Protected UAT/Test deployment run ${run_id} failed for exact candidate \`${candidate_sha}\`. No Production workflow was dispatched. The failed-step evidence is in the Actions run."
            exit 1
          fi
          echo "PROTECTED_UAT_DEPLOYMENT=PASSED" | tee -a /tmp/pr737-evidence/deployment.log
          gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body "Protected UAT/Test deployment run ${run_id} completed successfully for exact PR #${PR_NUMBER} candidate \`${candidate_sha}\`. Production mutation: NONE. The reserved governed CI-trigger file can now be added to start the complete PR check suite without changing runtime code."

      - name: Publish terminal evidence comment
        if: always()
        shell: bash
        run: |
          repair='${{ steps.repair.outcome }}'
          validation='${{ steps.validation.outcome }}'
          publish='${{ steps.publish.outcome }}'
          deploy='${{ steps.deploy.outcome }}'
          deployment='${{ steps.deployment.outcome }}'
          candidate='${{ steps.repair.outputs.candidate_sha }}'
          run_id='${{ steps.deploy.outputs.run_id }}'
          body="PR #${PR_NUMBER} recovery-gate terminal evidence — candidate: \`${candidate:-not-published}\`; repair: ${repair}; focused validation: ${validation}; publish: ${publish}; Test dispatch: ${deploy}; Test deployment: ${deployment}; deployment run: ${run_id:-not-created}; Production mutation: NONE. Controller run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body "$body" || true
          printf '%s\n' "$body"
