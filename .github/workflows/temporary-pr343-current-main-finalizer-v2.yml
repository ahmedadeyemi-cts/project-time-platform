name: Temporary PR 343 Current-Main Finalizer V2

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/pr343-finalizer-v2-trigger.txt'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temporary-pr343-current-main-finalizer-v2
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/module-011-celar-ai-runtime-rebrand-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out exact Celar AI source head
        uses: actions/checkout@v4
        with:
          repository: ahmedadeyemi-cts/project-time-platform
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconcile current main and create the reviewed merge commit
        id: reconcile
        shell: bash
        run: |
          set -Eeuo pipefail

          REQUIRED_PRE_TRIGGER_HEAD='aab281b66d2e4c4e82e7f8e66a2ad2e465ed2cc3'
          REQUIRED_MAIN_ANCESTOR='c2e7b7b4e34dc8ab51ffda1d79fa307286d6da18'
          TARGET_BRANCH='feature/module-011-celar-ai-runtime-rebrand-20260730'
          FINALIZER_PATH='.github/workflows/temporary-pr343-current-main-finalizer-v2.yml'
          TRIGGER_PATH='.github/pr343-finalizer-v2-trigger.txt'

          test "$(git rev-parse HEAD^)" = "$REQUIRED_PRE_TRIGGER_HEAD"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$TRIGGER_PATH"
          grep -Fqx "EXPECTED_PRE_TRIGGER_HEAD=$REQUIRED_PRE_TRIGGER_HEAD" "$TRIGGER_PATH"
          grep -Fqx "EXPECTED_MAIN_ANCESTOR=$REQUIRED_MAIN_ANCESTOR" "$TRIGGER_PATH"

          git fetch origin main --no-tags
          git merge-base --is-ancestor "$REQUIRED_MAIN_ANCESTOR" origin/main
          MAIN_DELTA="$(git diff --name-only "$REQUIRED_MAIN_ANCESTOR"...origin/main)"
          printf '%s\n' "$MAIN_DELTA"
          UNEXPECTED_MAIN="$(grep -Fvx "$FINALIZER_PATH" <<<"$MAIN_DELTA" || true)"
          if [[ -n "$UNEXPECTED_MAIN" ]]; then
            echo 'Current main moved outside the reviewed V2-finalizer-only delta:' >&2
            printf '%s\n' "$UNEXPECTED_MAIN" >&2
            exit 1
          fi

          git config user.name 'projectpulse-celar-main-finalizer'
          git config user.email 'projectpulse-celar-main-finalizer@users.noreply.github.com'

          set +e
          git merge --no-commit --no-ff origin/main > /tmp/pr343-finalizer-v2-merge.log 2>&1
          MERGE_STATUS=$?
          set -e
          cat /tmp/pr343-finalizer-v2-merge.log

          mapfile -t ACTUAL_CONFLICTS < <(git diff --name-only --diff-filter=U | sort)
          EXPECTED_CONFLICTS=(
            '.github/workflows/pulse-ai-help-chat-usability-ci.yml'
            '.github/workflows/pulse-ai-system-intelligence-ci.yml'
            'docs/modules/module-011-pulse-ai/SYSTEM-INTELLIGENCE-AND-TROUBLESHOOTING.md'
            'src/backend/ProjectTime.Api/Ai/ProjectPulseAiServiceCollectionExtensions.cs'
            'src/backend/ProjectTime.Api/Ai/PulseAiSystemIntelligenceService.cs'
            'src/backend/ProjectTime.Api/Ai/PulseAiSystemToolExecutor.cs'
            'src/backend/ProjectTime.Api/ProjectTime.Api.csproj'
            'src/frontend/project-time-web/package.json'
            'src/frontend/project-time-web/scripts/inject-pulse-ai-system-chat-group7-compatibility.mjs'
            'src/frontend/project-time-web/scripts/validate-module-011-pulse-ai.mjs'
            'src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs'
          )
          mapfile -t EXPECTED_CONFLICTS < <(printf '%s\n' "${EXPECTED_CONFLICTS[@]}" | sort)

          if [[ "$MERGE_STATUS" == '0' ]]; then
            echo 'The reviewed reconciliation expected conflicts, but Git reported a clean merge.' >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "${ACTUAL_CONFLICTS[@]}")" != "$(printf '%s\n' "${EXPECTED_CONFLICTS[@]}")" ]]; then
            echo 'The conflict set changed from the reviewed reconciliation evidence.' >&2
            echo 'Expected:' >&2
            printf '%s\n' "${EXPECTED_CONFLICTS[@]}" >&2
            echo 'Actual:' >&2
            printf '%s\n' "${ACTUAL_CONFLICTS[@]}" >&2
            exit 1
          fi

          # Current main remains authoritative for the reviewed security,
          # permission, trusted-origin, migration, container-mirror, Analytics,
          # and shared compatibility corrections.
          git checkout --theirs -- "${EXPECTED_CONFLICTS[@]}"
          git add -- "${EXPECTED_CONFLICTS[@]}"

          rm -f \
            '.github/workflows/temporary-pr328-main-reconciliation-analysis.yml' \
            '.github/pr343-reconciliation-trigger.txt' \
            '.github/pr343-finalizer-trigger.txt' \
            "$TRIGGER_PATH"

          python - <<'PY'
          import json
          from pathlib import Path

          project = Path('src/backend/ProjectTime.Api/ProjectTime.Api.csproj')
          project_text = project.read_text()
          pulse_registration = 'print &quot;app.MapPulseAiSystemIntelligenceEndpoints();&quot;;'
          celar_registration = 'print &quot;app.MapCelarAiBrandEndpoints();&quot;;'
          if project_text.count(pulse_registration) != 1:
              raise SystemExit('Expected one Pulse AI system endpoint registration anchor.')
          if celar_registration not in project_text:
              project_text = project_text.replace(
                  pulse_registration,
                  f'{pulse_registration} {celar_registration}',
                  1)
          if project_text.count(celar_registration) != 1:
              raise SystemExit('Celar AI endpoint registration must appear exactly once.')
          project.write_text(project_text)

          package_path = Path('src/frontend/project-time-web/package.json')
          package = json.loads(package_path.read_text())
          scripts = package.setdefault('scripts', {})
          injector = 'node ./scripts/inject-celar-ai-runtime-rebrand.mjs'
          validator = 'npm run validate:celar-ai-runtime-rebrand'

          predev = scripts['predev']
          if injector not in predev:
              predev = f'{predev} && {injector}'
          scripts['predev'] = predev

          build = scripts['build']
          celar_build = f'{injector} && {validator}'
          if celar_build not in build:
              marker = ' && vite build'
              if build.count(marker) != 1:
                  raise SystemExit('Expected one Vite build anchor in package.json.')
              build = build.replace(marker, f' && {celar_build}{marker}', 1)
          scripts['build'] = build
          scripts['validate:celar-ai-runtime-rebrand'] = 'node ./scripts/validate-celar-ai-runtime-rebrand.mjs'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          dockerfile = Path('deployment/containers/web/Dockerfile')
          docker_text = dockerfile.read_text()
          celar_copy = '''COPY src/backend/ProjectTime.Api/Modules/CelarAiBrandModule.cs \\
               src/backend/ProjectTime.Api/Modules/CelarAiBrandModule.cs

          '''
          anchor = '''COPY src/backend/ProjectTime.Api/Modules/AiProviderConfigurationModule.cs \\
               src/backend/ProjectTime.Api/Modules/AiProviderConfigurationModule.cs

          '''
          if 'Modules/CelarAiBrandModule.cs' not in docker_text:
              if docker_text.count(anchor) != 1:
                  raise SystemExit('Expected one Module 064 Dockerfile copy anchor.')
              docker_text = docker_text.replace(anchor, anchor + celar_copy, 1)
          if docker_text.count('Modules/CelarAiBrandModule.cs') != 2:
              raise SystemExit('Celar AI module Dockerfile copy must have source and destination exactly once.')
          dockerfile.write_text(docker_text)

          workflow_path = Path('.github/workflows/celar-ai-runtime-rebrand-ci.yml')
          workflow = workflow_path.read_text()
          start_marker = '      - name: Verify exact stacked source isolation\n'
          end_marker = '      - uses: actions/setup-dotnet@v4\n'
          start = workflow.find(start_marker)
          end = workflow.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Celar AI workflow isolation step anchors are missing.')

          replacement = '''      - name: Verify exact current-main source isolation
            shell: bash
            run: |
              set -Eeuo pipefail
              BASE_BRANCH="${GITHUB_BASE_REF:-main}"
              git fetch origin "$BASE_BRANCH" --no-tags
              BASE_REF="$(git merge-base "origin/$BASE_BRANCH" HEAD)"
              test -n "$BASE_REF"
              test "$BASE_REF" = "$(git rev-parse "origin/$BASE_BRANCH")"
              CHANGED="$(git diff --name-only "$BASE_REF"...HEAD)"
              printf '%s\\n' "$CHANGED"

              ALLOWED='^(\\.github/workflows/(celar-ai-runtime-rebrand-ci|pulse-ai-system-intelligence-ci|pulse-ai-help-chat-usability-ci)\\.yml|docs/modules/module-011-pulse-ai/(CELAR-AI-RUNTIME-REBRAND|SYSTEM-INTELLIGENCE-AND-TROUBLESHOOTING)\\.md|src/backend/ProjectTime\\.Api/Ai/(CelarAiBrandProfile|PulseAiProductKnowledgeCatalog|ProjectPulseAiServiceCollectionExtensions|PulseAiSystemIntelligenceService|PulseAiSystemToolExecutor)\\.cs|src/backend/ProjectTime\\.Api/Modules/CelarAiBrandModule\\.cs|src/backend/ProjectTime\\.Api/ProjectTime\\.Api\\.csproj|src/frontend/project-time-web/package\\.json|src/frontend/project-time-web/scripts/(inject-celar-ai-runtime-rebrand|inject-pulse-ai-system-chat-group7-compatibility|validate-celar-ai-runtime-rebrand|validate-module-011-pulse-ai|validate-group-1-navigation-work-consolidation|validate-module-011-private-document-pipeline|validate-module-011-pulse-ai-deep-intelligence|validate-module-011-system-intelligence-package|validate-pulse-ai-help-chat-usability)\\.mjs|src/frontend/project-time-web/src/(CelarAiProviderBridgePanel\\.jsx|celar-ai-provider-bridge-panel\\.css|module-availability-registry\\.js|HelpAssistant\\.jsx|PulseAiSystemIntelligenceWorkbench\\.jsx|WorkTaskBuilderPanel\\.jsx|pulse-ai-system-chat\\.css|pulse-ai-system-intelligence-workbench\\.css)|deployment/containers/web/Dockerfile)$'
              UNEXPECTED="$(grep -Ev "$ALLOWED" <<<"$CHANGED" || true)"
              if [[ -n "$UNEXPECTED" ]]; then
                echo 'Unexpected Celar AI current-main source scope:' >&2
                printf '%s\\n' "$UNEXPECTED" >&2
                exit 1
              fi

              for protected in \\
                '.github/workflows/projectpulse-deploy-runtime-direct-timer-recovery-test.yml' \\
                '.github/workflows/validate-runtime-direct-timer-recovery-deployment.yml' \\
                'scripts/validate-runtime-direct-timer-recovery-test-deployment.sh'; do
                ! grep -Fxq "$protected" <<<"$CHANGED"
              done

              OTHER_DEPLOYMENT="$(grep -E '^deployment/' <<<"$CHANGED" | grep -Fvx 'deployment/containers/web/Dockerfile' || true)"
              if [[ -n "$OTHER_DEPLOYMENT" ]]; then
                echo 'Unexpected deployment source changed by the Celar AI package:' >&2
                printf '%s\\n' "$OTHER_DEPLOYMENT" >&2
                exit 1
              fi

              ! grep -E '^(database/|scripts/.*deploy|\\.github/workflows/projectpulse-deploy-|src/backend/ProjectTime\\.Api/Ai/(ProjectPulseAiConfiguration|ProjectPulseAiRemoteProviders|ProjectPulseAiSecretStore)\\.cs|src/backend/ProjectTime\\.Api/Modules/AiProviderConfigurationModule\\.cs)' <<<"$CHANGED"
              git diff --check "$BASE_REF"...HEAD -- \\
                '.github/workflows/celar-ai-runtime-rebrand-ci.yml' \\
                'deployment/containers/web/Dockerfile' \\
                'src/backend/ProjectTime.Api/ProjectTime.Api.csproj' \\
                'src/frontend/project-time-web/package.json'
              echo "CELAR_AI_RUNTIME_REBRAND_BASE=$BASE_REF"
              echo 'CELAR_AI_RUNTIME_REBRAND_SOURCE_ISOLATION=PASSED'

          '''
          workflow = workflow[:start] + replacement + workflow[end:]
          workflow_path.write_text(workflow)
          PY

          git add -A
          # Validate only the newly composed text files. Current main contains
          # separately reviewed architecture Markdown/PDF assets whose intentional
          # formatting must not be re-linted as part of this runtime reconciliation.
          git diff --check --cached -- \
            '.github/workflows/celar-ai-runtime-rebrand-ci.yml' \
            'deployment/containers/web/Dockerfile' \
            'src/backend/ProjectTime.Api/ProjectTime.Api.csproj' \
            'src/frontend/project-time-web/package.json'

          git diff --cached --name-status
          git commit -m 'Reconcile Celar AI runtime rebrand with current main'
          echo "merge_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Validate reconciled Celar AI source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check src/frontend/project-time-web/scripts/inject-celar-ai-runtime-rebrand.mjs
          node --check src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs
          node src/frontend/project-time-web/scripts/validate-module-011-pulse-ai.mjs
          node src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs
          node src/frontend/project-time-web/scripts/validate-module-011-pulse-ai-deep-intelligence.mjs
          node src/frontend/project-time-web/scripts/validate-module-011-private-document-pipeline.mjs
          node src/frontend/project-time-web/scripts/validate-pulse-ai-help-chat-usability.mjs
          chmod +x tests/test-pulse-ai-system-intelligence-migration-054.sh
          tests/test-pulse-ai-system-intelligence-migration-054.sh

      - name: Build reconciled ProjectTime API
        shell: bash
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Build reconciled frontend
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Validate clean production web-container context
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --hard HEAD
          docker build \
            --file deployment/containers/web/Dockerfile \
            --tag "projectpulse-celar-current-main:${{ github.event.pull_request.head.sha }}" \
            .

      - name: Push the validated reconciliation commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET_BRANCH='feature/module-011-celar-ai-runtime-rebrand-20260730'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Publish finalizer evidence to PR #343
        if: always()
        uses: actions/github-script@v7
        env:
          MERGE_COMMIT: ${{ steps.reconcile.outputs.merge_commit }}
          MAIN_SHA: ${{ steps.reconcile.outputs.main_sha }}
          FINALIZER_STATUS: ${{ job.status }}
        with:
          script: |
            const marker = '<!-- pr343-current-main-finalizer-v2 -->';
            const success = process.env.FINALIZER_STATUS === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## PR #343 current-main finalizer V2',
              '',
              `- Result: **${success ? 'validated and pushed' : 'failed closed'}**`,
              `- Main reconciled: \`${process.env.MAIN_SHA || 'not recorded'}\``,
              `- Local reconciliation commit: \`${process.env.MERGE_COMMIT || 'not created'}\``,
              `- Workflow run: ${runUrl}`,
              '',
              success
                ? 'The exact conflict set was resolved with current main authoritative for shared security and compatibility files. Celar endpoint registration, build wiring, source contracts, migration 054 regression, API build, frontend build, and clean web-container build all passed before the branch was updated.'
                : 'The branch was not pushed. Review the workflow run before changing the conflict-resolution plan.',
              '',
              'No migration was applied to Test or Production, and no Azure, provider, credential, project, financial, Timesheet, or permission mutation was performed.'
            ].join('\n');

            const parameters = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            };
            const comments = await github.paginate(github.rest.issues.listComments, parameters);
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({ ...parameters, body });
            }
