name: PR 208 One-Time Source Correction

on:
  push:
    branches:
      - 'fix/modules-010-065-environment-runtime-sync-mail-20260728'
    paths:
      - '.github/workflows/pr208-one-time-source-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/modules-010-065-environment-runtime-sync-mail-20260728
          fetch-depth: 0

      - name: Apply exact source correction and remove this workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/backend/ProjectTime.Api/Modules/MicrosoftDirectorySyncModule.cs')
          text = path.read_text()
          old = """nextScheduledAt = profile.Enabled
                          ? last.LastSyncAt?.AddHours(profile.FrequencyHours) ?? DateTimeOffset.UtcNow
                          : null,"""
          new = """nextScheduledAt = profile.Enabled
                          ? last.LastSyncAt?.AddHours(profile.FrequencyHours) ?? DateTimeOffset.UtcNow
                          : (DateTimeOffset?)null,"""
          if text.count(old) != 1:
              raise SystemExit('Expected nullable timestamp expression was not found exactly once.')
          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/pr208-one-time-source-patch.yml
          git config user.name 'ProjectPulse Source Reconciler'
          git config user.email 'projectpulse-source-reconciler@users.noreply.github.com'
          git add src/backend/ProjectTime.Api/Modules/MicrosoftDirectorySyncModule.cs .github/workflows/pr208-one-time-source-patch.yml
          git commit -m 'Fix nullable automatic sync timestamp'
          git push origin HEAD:fix/modules-010-065-environment-runtime-sync-mail-20260728
