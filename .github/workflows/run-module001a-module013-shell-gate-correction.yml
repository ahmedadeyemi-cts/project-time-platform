name: Run Module 001A and Module 013 Ownership-Safe Correction

on:
  push:
    branches:
      - fix/module001a-viewas-module013-operations-current-main-20260811
    paths:
      - .github/workflows/run-module001a-module013-shell-gate-correction.yml

permissions:
  contents: write

concurrency:
  group: run-module001a-module013-shell-gate-correction
  cancel-in-progress: false

jobs:
  correct-source-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/module001a-viewas-module013-operations-current-main-20260811
          fetch-depth: 0
          persist-credentials: true

      - name: Apply ownership-safe shell gate
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == 'ahmedadeyemi-cts/project-time-platform' ]]
          [[ "$(git branch --show-current)" == 'fix/module001a-viewas-module013-operations-current-main-20260811' ]]
          [[ "$(git rev-parse HEAD^)" == 'c5107fb5fe44697b6e89e7c7d585c5ee831d052a' ]]
          git fetch origin main --no-tags
          git checkout origin/main -- src/frontend/project-time-web/src/ai/AiProviderReadinessController.jsx
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/frontend/project-time-web/src/App.jsx',
              '      <AiProviderReadinessController authSession={authSession} />',
              '      {!localViewAsIsActive() ? <AiProviderReadinessController authSession={authSession} /> : null}',
              'shared-shell provider readiness View-As gate')

          validator = Path('tests/validate-module001a-viewas-module013-operations.mjs')
          text = validator.read_text(encoding='utf-8')
          text = text.replace(
              "const provider = read('src/frontend/project-time-web/src/ai/AiProviderReadinessController.jsx');\n",
              '',
              1)
          old = "requireText(provider, 'viewAsActive()', 'View-As provider-monitoring boundary');"
          new = "requireText(app, '!localViewAsIsActive() ? <AiProviderReadinessController authSession={authSession} /> : null', 'View-As provider-monitoring boundary');"
          if text.count(old) != 1:
              raise SystemExit(f'focused validator provider boundary: expected one anchor, found {text.count(old)}')
          validator.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node tests/validate-module001a-viewas-module013-operations.mjs
          git diff --check

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Build API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --nologo

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Build frontend
        working-directory: src/frontend/project-time-web
        run: |
          npm ci
          npm run build

      - name: Commit bounded correction
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/validate-module001a-viewas-module013-operations.mjs
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'src/frontend/project-time-web/src/App.jsx',
              'src/frontend/project-time-web/src/ai/AiProviderReadinessController.jsx',
              'tests/validate-module001a-viewas-module013-operations.mjs',
          }
          actual = set(filter(None, subprocess.check_output(
              ['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines()))
          if actual != expected:
              raise SystemExit(
                  'Unexpected correction scope.\nExpected:\n' + '\n'.join(sorted(expected))
                  + '\nActual:\n' + '\n'.join(sorted(actual)))
          PY
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add -- \
            src/frontend/project-time-web/src/App.jsx \
            src/frontend/project-time-web/src/ai/AiProviderReadinessController.jsx \
            tests/validate-module001a-viewas-module013-operations.mjs
          git commit -m 'Keep View-As provider readiness gating in the shared shell'
          git push origin HEAD:fix/module001a-viewas-module013-operations-current-main-20260811
