name: Temporary Clean Celar AI Oracle Integration Staging

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-build-celar-ai-oracle-test-integration.yml'

permissions:
  contents: write

concurrency:
  group: temporary-celar-ai-oracle-test-integration-cleaner
  cancel-in-progress: true

jobs:
  clean:
    name: Remove temporary payload files from the isolated branch
    if: github.head_ref == 'feature/celar-ai-oracle-test-external-https-runtime-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the isolated branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feature/celar-ai-oracle-test-external-https-runtime-20260809
          fetch-depth: 0
          persist-credentials: true

      - name: Remove temporary payloads and push the cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d scripts/.temporary-celar-ai-oracle-patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r scripts/.temporary-celar-ai-oracle-patch
          git diff --cached --check
          git commit -m 'chore: remove temporary Oracle integration staging payloads'
          git push origin HEAD:feature/celar-ai-oracle-test-external-https-runtime-20260809
