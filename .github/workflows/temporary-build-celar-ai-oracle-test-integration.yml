name: Temporary Finalize Celar AI Oracle Test Integration

on:
  push:
    branches:
      - feature/celar-ai-oracle-test-external-https-runtime-20260809
    paths:
      - '.github/workflows/temporary-build-celar-ai-oracle-test-integration.yml'

permissions:
  contents: write

concurrency:
  group: temporary-celar-ai-oracle-test-integration-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    name: Install final workflows and remove temporary staging
    if: github.ref == 'refs/heads/feature/celar-ai-oracle-test-external-https-runtime-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the isolated branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feature/celar-ai-oracle-test-external-https-runtime-20260809
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Reconstruct the reviewed deployment and CI workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          cat scripts/.temporary-celar-ai-oracle-patch/deploy-part* \
            | tr -d '\n' \
            | base64 -d \
            | gzip -d \
            > .github/workflows/projectpulse-deploy-celar-ai-private-runtime-test.yml
          cat scripts/.temporary-celar-ai-oracle-patch/ci-part* \
            | tr -d '\n' \
            | base64 -d \
            | gzip -d \
            > .github/workflows/celar-ai-oracle-test-runtime-ci.yml

      - name: Validate final Test-only source and workflow contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' \
            .github/workflows/projectpulse-deploy-celar-ai-private-runtime-test.yml
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' \
            .github/workflows/celar-ai-oracle-test-runtime-ci.yml
          node tests/validate-celar-ai-oracle-test-runtime.mjs
          node tests/validate-celar-ai-opencloud-deferred-runtime.mjs
          node src/frontend/project-time-web/scripts/validate-celar-ai-release-scoped-runtime.mjs
          dotnet run \
            --project tests/CelarAiOracleExternalRuntimeTests/CelarAiOracleExternalRuntimeTests.csproj \
            --configuration Release \
            -p:ProjectPulseSourceRevision=1111111111111111111111111111111111111111
          git diff --check

      - name: Commit final workflows and delete temporary staging
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/projectpulse-deploy-celar-ai-private-runtime-test.yml \
            .github/workflows/celar-ai-oracle-test-runtime-ci.yml
          git rm -r scripts/.temporary-celar-ai-oracle-patch
          git rm .github/workflows/temporary-build-celar-ai-oracle-test-integration.yml
          git diff --cached --check
          git commit -m 'ci: add guarded Oracle Celar AI deployment for Test'
          git push origin HEAD:feature/celar-ai-oracle-test-external-https-runtime-20260809
