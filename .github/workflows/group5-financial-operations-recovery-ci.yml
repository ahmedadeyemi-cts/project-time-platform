name: Validate Group 5 Financial Operations Recovery

on:
  push:
    branches:
      - 'feature/group-5-financial-reports-closeout-billing-recovery-*'
  pull_request:
    paths:
      - '.github/workflows/group5-financial-operations-recovery-ci.yml'
      - 'database/migrations/051_financial_operations_reporting_recovery.sql'
      - 'database/rollback/051_financial_operations_reporting_recovery_rollback.sql'
      - 'docs/modules/group-5-financial-operations/README.md'
      - 'src/backend/ProjectTime.Api/Modules/FinancialOperationsContracts.cs'
      - 'src/backend/ProjectTime.Api/Modules/FinancialOperationsRecoveryModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/FinancialOperationsReportEngine.cs'
      - 'src/backend/ProjectTime.Api/Modules/FinancialOperationsRepository.cs'
      - 'src/backend/ProjectTime.Api/Modules/FinancialOperationsSourceLoader.cs'
      - 'src/backend/ProjectTime.Api/Modules/FinancialOperationsWorkItemFactory.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectFinancialTruthReportingBridge.cs'
      - 'src/backend/ProjectTime.Api/ProjectTime.Api.csproj'
      - 'src/frontend/project-time-web/package.json'
      - 'src/frontend/project-time-web/package-lock.json'
      - 'src/frontend/project-time-web/scripts/inject-group-5-financial-operations-recovery.mjs'
      - 'src/frontend/project-time-web/scripts/validate-group-5-financial-operations-recovery.mjs'
      - 'src/frontend/project-time-web/src/FinancialOperationsRecoveryWorkspace.jsx'
      - 'src/frontend/project-time-web/src/financial-operations-recovery-workspace.css'
      - 'tests/test-financial-operations-migration-051.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: group5-financial-operations-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Group 5 ownership or regression applicability
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          HEAD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch origin "$BASE_BRANCH" --no-tags
          CHANGED="$(git diff --name-only "origin/$BASE_BRANCH"...HEAD)"
          printf '%s\n' "$CHANGED"

          OWNED_BRANCH='false'
          ANALYTICS_COMPATIBILITY_BRANCH='false'
          CENTRAL_SECURITY_BRANCH='false'
          if [[ "$HEAD_BRANCH" == feature/group-5-financial-reports-closeout-billing-recovery-* ]]; then
            OWNED_BRANCH='true'
          elif [[ "$HEAD_BRANCH" == feature/module-030-analytics-center-* ]]; then
            ANALYTICS_COMPATIBILITY_BRANCH='true'
          elif [[ "$HEAD_BRANCH" == security/repository-posture-* ]]; then
            CENTRAL_SECURITY_BRANCH='true'
          fi

          ALLOWED='^(\.github/workflows/group5-financial-operations-recovery-ci\.yml|database/migrations/051_financial_operations_reporting_recovery\.sql|database/rollback/051_financial_operations_reporting_recovery_rollback\.sql|docs/modules/group-5-financial-operations/README\.md|src/backend/ProjectTime.Api/Modules/(FinancialOperationsContracts|FinancialOperationsRecoveryModule|FinancialOperationsReportEngine|FinancialOperationsRepository|FinancialOperationsSourceLoader|FinancialOperationsWorkItemFactory|ProjectFinancialTruthReportingBridge)\.cs|src/backend/ProjectTime.Api/ProjectTime.Api\.csproj|src/frontend/project-time-web/package(-lock)?\.json|src/frontend/project-time-web/scripts/(inject-group-5-financial-operations-recovery|validate-group-5-financial-operations-recovery)\.mjs|src/frontend/project-time-web/src/(FinancialOperationsRecoveryWorkspace\.jsx|financial-operations-recovery-workspace\.css)|tests/test-financial-operations-migration-051\.sh)$'
          GROUP5_RUNTIME_OWNED='^(database/migrations/051_financial_operations_reporting_recovery\.sql|database/rollback/051_financial_operations_reporting_recovery_rollback\.sql|docs/modules/group-5-financial-operations/README\.md|src/backend/ProjectTime.Api/Modules/(FinancialOperationsContracts|FinancialOperationsRecoveryModule|FinancialOperationsReportEngine|FinancialOperationsRepository|FinancialOperationsSourceLoader|FinancialOperationsWorkItemFactory|ProjectFinancialTruthReportingBridge)\.cs|src/frontend/project-time-web/scripts/(inject-group-5-financial-operations-recovery|validate-group-5-financial-operations-recovery)\.mjs|src/frontend/project-time-web/src/(FinancialOperationsRecoveryWorkspace\.jsx|financial-operations-recovery-workspace\.css)|tests/test-financial-operations-migration-051\.sh)$'
          ANALYTICS_COMPATIBILITY='^src/frontend/project-time-web/scripts/validate-group-5-financial-operations-recovery\.mjs$'
          CENTRAL_GROUP5_CONVERGENCE='^src/frontend/project-time-web/src/FinancialOperationsRecoveryWorkspace\.jsx$'

          if [[ "$OWNED_BRANCH" == 'true' ]]; then
            UNEXPECTED="$(grep -Ev "$ALLOWED" <<<"$CHANGED" || true)"
            if [[ -n "$UNEXPECTED" ]]; then
              echo 'Unexpected Group 5 source scope:' >&2
              printf '%s\n' "$UNEXPECTED" >&2
              exit 1
            fi

            if grep -E '^(deployment/|\.github/workflows/projectpulse-deploy-|scripts/.*deploy|src/frontend/project-time-web/src/(App|main)\.|src/frontend/project-time-web/src/module-availability-registry\.js|src/frontend/project-time-web/src/.*[Cc]ertify|src/backend/ProjectTime.Api/Modules/Module038)' <<<"$CHANGED"; then
              echo 'Group 5 overlaps deployment, canonical App/registry source, or Module 038 Certify source.' >&2
              exit 1
            fi

            echo 'GROUP_5_VALIDATION_MODE=OWNED_SOURCE' >> "$GITHUB_ENV"
            echo 'GROUP_5_SOURCE_ISOLATION=PASSED'
          elif [[ "$CENTRAL_SECURITY_BRANCH" == 'true' ]]; then
            DIRECT_GROUP5_CHANGES="$(grep -E "$GROUP5_RUNTIME_OWNED" <<<"$CHANGED" || true)"
            UNAPPROVED_GROUP5="$(grep -Ev "$CENTRAL_GROUP5_CONVERGENCE" <<<"$DIRECT_GROUP5_CHANGES" || true)"
            if [[ -n "$UNAPPROVED_GROUP5" ]]; then
              echo 'The central security posture branch changed Group 5 source outside the reviewed canonical-source convergence boundary:' >&2
              printf '%s\n' "$UNAPPROVED_GROUP5" >&2
              exit 1
            fi

            echo 'GROUP_5_VALIDATION_MODE=CENTRAL_SECURITY_CONVERGENCE' >> "$GITHUB_ENV"
            echo 'GROUP_5_CENTRAL_SECURITY_CONVERGENCE=PASSED'
          else
            DIRECT_GROUP5_CHANGES="$(grep -E "$GROUP5_RUNTIME_OWNED" <<<"$CHANGED" || true)"
            if [[ "$ANALYTICS_COMPATIBILITY_BRANCH" == 'true' ]]; then
              DIRECT_GROUP5_CHANGES="$(grep -Ev "$ANALYTICS_COMPATIBILITY" <<<"$DIRECT_GROUP5_CHANGES" || true)"
            fi
            if [[ -n "$DIRECT_GROUP5_CHANGES" ]]; then
              echo 'Group 5-owned runtime source may only be changed from the isolated Group 5 branch family:' >&2
              printf '%s\n' "$DIRECT_GROUP5_CHANGES" >&2
              exit 1
            fi

            echo 'GROUP_5_VALIDATION_MODE=REGRESSION' >> "$GITHUB_ENV"
            echo 'GROUP_5_REGRESSION_APPLICABILITY=PASSED'
          fi

          for protected in \
            '.github/workflows/projectpulse-deploy-runtime-direct-timer-recovery-test.yml' \
            '.github/workflows/validate-runtime-direct-timer-recovery-deployment.yml' \
            'scripts/validate-runtime-direct-timer-recovery-test-deployment.sh'; do
            if grep -Fxq "$protected" <<<"$CHANGED"; then
              echo "Protected deployment file changed: $protected" >&2
              exit 1
            fi
          done

          git diff --check "origin/$BASE_BRANCH"...HEAD

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Check Group 5 JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check src/frontend/project-time-web/scripts/inject-group-5-financial-operations-recovery.mjs
          node --check src/frontend/project-time-web/scripts/validate-group-5-financial-operations-recovery.mjs

      - name: Test migration 051 apply idempotence permissions evidence and rollback
        shell: bash
        run: bash tests/test-financial-operations-migration-051.sh

      - name: Validate Group 5 source contract
        working-directory: src/frontend/project-time-web
        shell: bash
        run: node ./scripts/validate-group-5-financial-operations-recovery.mjs

      - name: Build ProjectTime API
        shell: bash
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate Group 3 Group 4 work-to-cash and Module 038 regression dependencies
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run validate:group3-project-financial-workspaces
          npm run validate:group4-project-notifications
          npm run validate:work-to-cash-lifecycle
          npm run validate:work-to-cash-lock-order
          npm run validate:module005
          npm run validate:superadmin-sso-expense-module006
          npm run validate:modules021026
          npm run validate:module065
          npm run validate:group5-financial-operations

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        shell: bash
        run: npm run build

      - name: Revalidate Group 5 and Analytics coexistence after production build
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          node ./scripts/validate-group-5-financial-operations-recovery.mjs
          if [[ -f ./scripts/validate-analytics-center.mjs ]]; then
            node ./scripts/validate-analytics-center.mjs
          fi

          git -C ../../.. diff --check
          git -C ../../.. add -A
          trap 'git -C ../../.. reset --mixed >/dev/null 2>&1 || true' EXIT
          npm run prebuild
          git -C ../../.. diff --check
          git -C ../../.. diff --exit-code
          git -C ../../.. reset --mixed
          trap - EXIT

          echo 'GROUP_5_GENERATED_SOURCE_CONVERGENCE=PASSED'
          echo 'GROUP_5_AND_ANALYTICS_POST_BUILD_VALIDATION=PASSED'
          echo "GROUP_5_VALIDATION_MODE=${GROUP_5_VALIDATION_MODE:-UNKNOWN}"

      - name: Capture Group 5 validation evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "sha=${GITHUB_SHA}"
            echo 'git_status_begin'
            git status --short
            echo 'git_status_end'
          } > artifacts/group5-workflow-evidence.txt
          exit 0

      - name: Upload Group 5 validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: group5-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/group5-workflow-evidence.txt
          if-no-files-found: warn
          retention-days: 7
