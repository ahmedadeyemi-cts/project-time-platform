name: Validate Group 5 Financial Operations Recovery

on:
  push:
    branches:
      - 'feature/group-5-financial-reports-closeout-billing-recovery-*'
  pull_request:
    paths:
      - '.github/workflows/group5-financial-operations-recovery-ci.yml'
      - 'database/migrations/051_financial_operations_reporting_recovery.sql'
      - 'database/rollback/051_financial_operations_reporting_recovery_rollback.sql'
      - 'docs/modules/group-5-financial-operations/README.md'
      - 'src/backend/ProjectTime.Api/Modules/FinancialOperationsContracts.cs'
      - 'src/backend/ProjectTime.Api/Modules/FinancialOperationsRecoveryModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/FinancialOperationsReportEngine.cs'
      - 'src/backend/ProjectTime.Api/Modules/FinancialOperationsRepository.cs'
      - 'src/backend/ProjectTime.Api/Modules/FinancialOperationsSourceLoader.cs'
      - 'src/backend/ProjectTime.Api/Modules/FinancialOperationsWorkItemFactory.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectFinancialTruthReportingBridge.cs'
      - 'src/backend/ProjectTime.Api/ProjectTime.Api.csproj'
      - 'src/frontend/project-time-web/package.json'
      - 'src/frontend/project-time-web/package-lock.json'
      - 'src/frontend/project-time-web/scripts/inject-group-5-financial-operations-recovery.mjs'
      - 'src/frontend/project-time-web/scripts/validate-group-5-financial-operations-recovery.mjs'
      - 'src/frontend/project-time-web/src/FinancialOperationsRecoveryWorkspace.jsx'
      - 'src/frontend/project-time-web/src/financial-operations-recovery-workspace.css'
      - 'tests/test-financial-operations-migration-051.sh'
      - 'tests/test-uat-functional-completion-contract.sh'
      - 'tests/validate-uat-followup-modules.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: group5-financial-operations-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Group 5 ownership or reusable UAT applicability
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          HEAD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch origin "$BASE_BRANCH" --no-tags
          CHANGED="$(git diff --name-only "origin/$BASE_BRANCH"...HEAD)"
          printf '%s\n' "$CHANGED"

          OWNED_BRANCH='false'
          CENTRAL_SECURITY_BRANCH='false'
          PR467_UAT='false'
          UAT_FOLLOWUP='false'
          UAT_COMPLETION='false'
          if [[ "$HEAD_BRANCH" == feature/group-5-financial-reports-closeout-billing-recovery-* ]]; then
            OWNED_BRANCH='true'
          elif [[ "$HEAD_BRANCH" == security/repository-posture-* ]]; then
            CENTRAL_SECURITY_BRANCH='true'
          elif [[ "$HEAD_BRANCH" == fix/uat-modules-005-006-039-work-identifiers-* ]]; then
            PR467_UAT='true'
          elif [[ "$HEAD_BRANCH" == fix/uat-followup-modules-005-006-039-055c-065-* ]]; then
            UAT_FOLLOWUP='true'
          elif [[ -s tests/test-uat-functional-completion-contract.sh ]] \
            && grep -Fq 'UAT_FUNCTIONAL_COMPLETION_CONTRACT=PASS' tests/test-uat-functional-completion-contract.sh; then
            UAT_COMPLETION='true'
          fi

          GROUP5_RUNTIME='^(database/migrations/051_financial_operations_reporting_recovery\.sql|database/rollback/051_financial_operations_reporting_recovery_rollback\.sql|docs/modules/group-5-financial-operations/README\.md|src/backend/ProjectTime.Api/Modules/(FinancialOperationsContracts|FinancialOperationsRecoveryModule|FinancialOperationsReportEngine|FinancialOperationsRepository|FinancialOperationsSourceLoader|FinancialOperationsWorkItemFactory|ProjectFinancialTruthReportingBridge)\.cs|src/frontend/project-time-web/scripts/(inject-group-5-financial-operations-recovery|validate-group-5-financial-operations-recovery)\.mjs|src/frontend/project-time-web/src/(FinancialOperationsRecoveryWorkspace\.jsx|financial-operations-recovery-workspace\.css)|tests/test-financial-operations-migration-051\.sh)$'
          # Compatibility alias retained for reusable validators that still inspect
          # the historical ownership marker. Both names resolve to the same allowlist.
          GROUP5_RUNTIME_OWNED="$GROUP5_RUNTIME"
          OWNED_ALLOWED='^(\.github/workflows/group5-financial-operations-recovery-ci\.yml|database/migrations/051_financial_operations_reporting_recovery\.sql|database/rollback/051_financial_operations_reporting_recovery_rollback\.sql|docs/modules/group-5-financial-operations/README\.md|src/backend/ProjectTime.Api/Modules/(FinancialOperationsContracts|FinancialOperationsRecoveryModule|FinancialOperationsReportEngine|FinancialOperationsRepository|FinancialOperationsSourceLoader|FinancialOperationsWorkItemFactory|ProjectFinancialTruthReportingBridge)\.cs|src/backend/ProjectTime.Api/ProjectTime.Api\.csproj|src/frontend/project-time-web/package(-lock)?\.json|src/frontend/project-time-web/scripts/(inject-group-5-financial-operations-recovery|validate-group-5-financial-operations-recovery)\.mjs|src/frontend/project-time-web/src/(FinancialOperationsRecoveryWorkspace\.jsx|financial-operations-recovery-workspace\.css)|tests/test-financial-operations-migration-051\.sh)$'
          PR467_ALLOWED='^(src/frontend/project-time-web/scripts/(inject-group-5-financial-operations-recovery|validate-group-5-financial-operations-recovery)\.mjs|src/frontend/project-time-web/src/(FinancialOperationsRecoveryWorkspace\.jsx|financial-operations-recovery-workspace\.css))$'
          UAT_FOLLOWUP_ALLOWED='^src/frontend/project-time-web/src/FinancialOperationsRecoveryWorkspace\.jsx$'
          UAT_ALLOWED='^src/frontend/project-time-web/scripts/(inject-group-5-financial-operations-recovery|validate-group-5-financial-operations-recovery)\.mjs$'
          CENTRAL_GROUP5_CONVERGENCE='^src/frontend/project-time-web/src/FinancialOperationsRecoveryWorkspace\.jsx$'

          if [[ "$OWNED_BRANCH" == 'true' ]]; then
            UNEXPECTED="$(grep -Ev "$OWNED_ALLOWED" <<<"$CHANGED" || true)"
            [[ -z "$UNEXPECTED" ]] || {
              echo 'Unexpected Group 5 source scope:' >&2
              printf '%s\n' "$UNEXPECTED" >&2
              exit 1
            }
            echo 'GROUP_5_VALIDATION_MODE=OWNED_SOURCE' >> "$GITHUB_ENV"
            echo 'GROUP_5_SOURCE_ISOLATION=PASSED'
          elif [[ "$CENTRAL_SECURITY_BRANCH" == 'true' ]]; then
            DIRECT_GROUP5="$(grep -E "$GROUP5_RUNTIME" <<<"$CHANGED" || true)"
            UNAPPROVED_GROUP5="$(grep -Ev "$CENTRAL_GROUP5_CONVERGENCE" <<<"$DIRECT_GROUP5" || true)"
            [[ -z "$UNAPPROVED_GROUP5" ]] || {
              echo 'The central security posture branch changed Group 5 source outside the reviewed canonical-source convergence boundary:' >&2
              printf '%s\n' "$UNAPPROVED_GROUP5" >&2
              exit 1
            }
            echo 'GROUP_5_VALIDATION_MODE=CENTRAL_SECURITY_CONVERGENCE' >> "$GITHUB_ENV"
            echo 'GROUP_5_CENTRAL_SECURITY_CONVERGENCE=PASSED'
          elif [[ "$PR467_UAT" == 'true' ]]; then
            DIRECT_GROUP5="$(grep -E "$GROUP5_RUNTIME" <<<"$CHANGED" || true)"
            UNAPPROVED="$(grep -Ev "$PR467_ALLOWED" <<<"$DIRECT_GROUP5" || true)"
            [[ -z "$UNAPPROVED" ]] || {
              echo 'PR #467 changed Group 5 runtime source outside its reviewed Module 039 convergence boundary:' >&2
              printf '%s\n' "$UNAPPROVED" >&2
              exit 1
            }
            echo 'GROUP_5_VALIDATION_MODE=PR467_UAT_REPAIR' >> "$GITHUB_ENV"
            echo 'GROUP_5_PR467_UAT_REPAIR=PASSED'
            python3 tests/validate-pr467-uat-repairs.py
          elif [[ "$UAT_FOLLOWUP" == 'true' ]]; then
            DIRECT_GROUP5="$(grep -E "$GROUP5_RUNTIME" <<<"$CHANGED" || true)"
            UNAPPROVED="$(grep -Ev "$UAT_FOLLOWUP_ALLOWED" <<<"$DIRECT_GROUP5" || true)"
            [[ -z "$UNAPPROVED" ]] || {
              echo 'The reviewed UAT follow-up changed Group 5 source outside the Module 039 compact-render boundary:' >&2
              printf '%s\n' "$UNAPPROVED" >&2
              exit 1
            }
            echo 'GROUP_5_VALIDATION_MODE=UAT_FOLLOWUP_MODULE039' >> "$GITHUB_ENV"
            echo 'GROUP_5_UAT_FOLLOWUP_MODULE039=PASSED'
            python3 tests/validate-uat-followup-modules.py
          elif [[ "$UAT_COMPLETION" == 'true' ]]; then
            DIRECT_GROUP5="$(grep -E "$GROUP5_RUNTIME" <<<"$CHANGED" || true)"
            UNAPPROVED="$(grep -Ev "$UAT_ALLOWED" <<<"$DIRECT_GROUP5" || true)"
            [[ -z "$UNAPPROVED" ]] || {
              echo 'The reusable UAT completion package changed unapproved Group 5 runtime source:' >&2
              printf '%s\n' "$UNAPPROVED" >&2
              exit 1
            }
            echo 'GROUP_5_VALIDATION_MODE=UAT_COMPATIBILITY' >> "$GITHUB_ENV"
            echo 'GROUP_5_UAT_COMPATIBILITY=PASSED'
            bash tests/test-uat-functional-completion-contract.sh
          else
            DIRECT_GROUP5="$(grep -E "$GROUP5_RUNTIME" <<<"$CHANGED" || true)"
            [[ -z "$DIRECT_GROUP5" ]] || {
              echo 'Group 5-owned runtime source may only be changed from the isolated Group 5 branch family or a validated reusable UAT completion package:' >&2
              printf '%s\n' "$DIRECT_GROUP5" >&2
              exit 1
            }
            echo 'GROUP_5_VALIDATION_MODE=REGRESSION' >> "$GITHUB_ENV"
            echo 'GROUP_5_REGRESSION_APPLICABILITY=PASSED'
          fi

          for protected in \
            '.github/workflows/projectpulse-deploy-runtime-direct-timer-recovery-test.yml' \
            '.github/workflows/validate-runtime-direct-timer-recovery-deployment.yml' \
            'scripts/validate-runtime-direct-timer-recovery-test-deployment.sh'; do
            if grep -Fxq "$protected" <<<"$CHANGED"; then
              echo "Protected deployment file changed: $protected" >&2
              exit 1
            fi
          done

          git diff --check "origin/$BASE_BRANCH"...HEAD

      - name: Validate repository security posture
        run: python3 scripts/security/validate-repository-security-posture.py

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Check Group 5 JavaScript syntax
        run: |
          node --check src/frontend/project-time-web/scripts/inject-group-5-financial-operations-recovery.mjs
          node --check src/frontend/project-time-web/scripts/validate-group-5-financial-operations-recovery.mjs

      - name: Test migration 051 lifecycle
        run: bash tests/test-financial-operations-migration-051.sh

      - name: Validate Group 5 source contract
        working-directory: src/frontend/project-time-web
        run: node ./scripts/validate-group-5-financial-operations-recovery.mjs

      - name: Build ProjectTime API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate affected work-to-cash dependencies
        working-directory: src/frontend/project-time-web
        run: |
          npm run validate:group3-project-financial-workspaces
          npm run validate:group4-project-notifications
          npm run validate:work-to-cash-lifecycle
          npm run validate:work-to-cash-lock-order
          npm run validate:module005
          npm run validate:module065
          npm run validate:group5-financial-operations
          node ./scripts/validate-module-040-guided-closeout.mjs

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Prove generated-source convergence
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s dist/index.html
          git -C ../../.. diff --check
          git -C ../../.. diff --exit-code
          npm run prebuild
          git -C ../../.. diff --check
          git -C ../../.. diff --exit-code
          echo 'GROUP_5_GENERATED_SOURCE_CONVERGENCE=PASSED'

      - name: Capture Group 5 validation evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "sha=${GITHUB_SHA}"
            echo "mode=${GROUP_5_VALIDATION_MODE:-UNKNOWN}"
            echo 'git_status_begin'
            git status --short
            echo 'git_status_end'
          } > artifacts/group5-workflow-evidence.txt
          exit 0

      - name: Upload Group 5 validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: group5-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/group5-workflow-evidence.txt
          if-no-files-found: warn
          retention-days: 7
