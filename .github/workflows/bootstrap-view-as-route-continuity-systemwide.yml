          ]) requireText(directory, token, 'Modules directory route continuity');
          requireText(directory, "anchor.getAttribute('aria-hidden') === 'true'", 'hidden sidebar entry exclusion');
          requireText(css, 'SYSTEMWIDE_VIEW_AS_ROUTE_CONTINUITY', 'route-access presentation boundary');
          requireText(css, '.projectpulse-route-access-notice', 'route-access modal styling');

          const frontendModules = new Set(
            [...registry.matchAll(/moduleNumber:\s*'([^']+)'/g)].map((match) => match[1].toUpperCase())
          );
          const foundationSection = catalogFoundation.match(/FROM jsonb_array_elements\('\[(.*?)\]'::jsonb\) AS module_row/s)?.[1] || '';
          const foundationModules = new Set(
            [...foundationSection.matchAll(/\["([^"]+)"/g)].map((match) => match[1].toUpperCase())
          );
          const reconciledModules = new Set(
            [...reconciliation.matchAll(/\('([0-9A-Z]+)',\s*'[^']+',\s*'[^']+'/g)].map((match) => match[1].toUpperCase())
          );
          const completeCatalog = new Set([...foundationModules, ...reconciledModules]);
          const missing = [...frontendModules].filter((moduleNumber) => !completeCatalog.has(moduleNumber));
          assert.deepEqual(missing, [], `Dynamic RBAC catalog is missing frontend modules: ${missing.join(', ')}`);

          for (const moduleNumber of ['001A', '031', '032', '033', '081', '082']) {
            requireText(reconciliation, `'${moduleNumber}'`, `migration 082 module ${moduleNumber}`);
          }
          for (const token of [
            'projectpulse_082_route_catalog_previous',
            'ON CONFLICT (module_code) DO UPDATE',
            "'082_view_as_route_authority_catalog'"
          ]) requireText(reconciliation, token, 'migration 082 reconciliation contract');
          for (const token of [
            'Rollback refused:',
            'existed_before = TRUE',
            'existed_before = FALSE'
          ]) requireText(rollback, token, 'migration 082 guarded rollback');
          requireText(migrationTest, 'VIEW_AS_ROUTE_AUTHORITY_MIGRATION_082=PASS', 'migration 082 executable test');
          requireText(packageJson, 'validate:view-as-route-continuity', 'validator registration');
          requireText(packageJson, 'npm run validate:view-as-route-continuity', 'production build wiring');

          console.log(`VIEW_AS_ROUTE_CONTINUITY=PASS frontendModules=${frontendModules.size} catalogModules=${completeCatalog.size} silentDashboardRedirect=false`);
          EOF

          mkdir -p docs/security
          cat > docs/security/VIEW-AS-ROUTE-CONTINUITY.md <<'EOF'
          # View-As Route Continuity

          ## Invariant

          A module shown as available to the current effective user must open without a silent redirect to Dashboard. A module that is not available must not present an active Open action. Direct links to a denied module retain the selected route and display an explicit, blocking access explanation.

          ## Shared authority

          The browser loads the effective View-As identity from `/api/security/me` and the database-backed Module 012/037 policy catalog. One published navigation state drives sidebar visibility, the More menu, the Modules directory, click interception, and direct-hash route protection.

          Authorization states are:

          - `checking`: access evidence is loading; navigation is paused.
          - `allowed`: the module is active and not explicitly denied to any effective role.
          - `denied`: the module is retired, inactive/missing from the catalog, or explicitly denied.
          - `unavailable`: authorization evidence could not be loaded; navigation fails closed without changing the route.

          View-As never inherits the actual administrator's permanent full-control bypass. Read-only View-As restrictions and all backend endpoint authorization remain unchanged.

          ## Catalog reconciliation

          Migration 082 reconciles active frontend modules that were introduced after the original scoped-RBAC catalog: 001A, 031, 032, 033, 081, and 082. It does not create grants or expand roles. Unconfigured pairs continue through existing endpoint and legacy permission authorization; explicit Module 012 denials remain authoritative.

          ## User experience

          Pulse no longer changes a denied or unverifiable route to `#dashboard`. It blocks interaction with a clear explanation and provides an explicit link to the authorized Modules directory. This makes permission defects visible and diagnosable instead of appearing as broken navigation.
          EOF

          cat > database/migrations/082_view_as_route_authority_catalog.sql <<'EOF'
          -- ProjectPulse migration 082
          -- Reconcile every active frontend module omitted from the original
          -- database-backed Module 012/037 catalog. This fixes View-As route
          -- decisions without creating role grants or bypassing endpoint policy.
          BEGIN;

          DO $projectpulse082_prerequisite$
          BEGIN
              IF to_regclass('public.schema_migrations') IS NULL
                 OR to_regclass('public.scoped_role_policy_modules') IS NULL
                 OR to_regclass('public.scoped_role_policy_grants') IS NULL THEN
                  RAISE EXCEPTION 'Migration 082 requires the scoped RBAC foundation from migration 040.';
              END IF;
          END;
          $projectpulse082_prerequisite$;

          CREATE TABLE IF NOT EXISTS projectpulse_082_route_catalog_previous (
              module_code TEXT PRIMARY KEY,
              existed_before BOOLEAN NOT NULL,
              module_name TEXT NULL,
              route_scope TEXT NULL,
              current_state TEXT NULL,
              permission_notes TEXT NULL,
              source_url TEXT NULL,
              is_active BOOLEAN NULL,
              created_at TIMESTAMPTZ NULL
          );

          INSERT INTO projectpulse_082_route_catalog_previous (
              module_code, existed_before, module_name, route_scope, current_state,
              permission_notes, source_url, is_active, created_at
          )
          SELECT module_code, TRUE, module_name, route_scope, current_state,
                 permission_notes, source_url, is_active, created_at
          FROM scoped_role_policy_modules
          WHERE module_code = ANY(ARRAY['001A','031','032','033','081','082'])
          ON CONFLICT (module_code) DO NOTHING;

          INSERT INTO projectpulse_082_route_catalog_previous (module_code, existed_before)
          SELECT module_code, FALSE
          FROM unnest(ARRAY['001A','031','032','033','081','082']) AS module_code
          WHERE NOT EXISTS (
              SELECT 1 FROM scoped_role_policy_modules existing
              WHERE existing.module_code = module_code
          )
          ON CONFLICT (module_code) DO NOTHING;

          INSERT INTO scoped_role_policy_modules (
              module_code, module_name, route_scope, current_state,
              permission_notes, source_url, is_active
          ) VALUES
              ('001A', 'Engineer Request Closeout', 'engineer-task-closeout', 'Installed', 'Effective-user route visibility remains governed by existing role and endpoint permissions.', '082_view_as_route_authority_catalog', TRUE),
              ('031', 'Financial Operations Workbench', 'financial-operations-workbench', 'Installed', 'Effective-user route visibility remains governed by existing role and endpoint permissions.', '082_view_as_route_authority_catalog', TRUE),
              ('032', 'Notification Delivery Monitor', 'notification-delivery-monitor', 'Installed', 'Effective-user route visibility remains governed by existing role and endpoint permissions.', '082_view_as_route_authority_catalog', TRUE),
              ('033', 'Project Forge', 'project-forge', 'Installed', 'Effective-user route visibility remains governed by existing role and endpoint permissions.', '082_view_as_route_authority_catalog', TRUE),
              ('081', 'Lab Equipment Tracker', 'lab-equipment-tracker', 'Installed', 'Effective-user route visibility remains governed by existing role and endpoint permissions.', '082_view_as_route_authority_catalog', TRUE),
              ('082', 'Enterprise Project Risk Register', 'project-risk-register', 'Installed', 'Effective-user route visibility remains governed by existing role and endpoint permissions.', '082_view_as_route_authority_catalog', TRUE)
          ON CONFLICT (module_code) DO UPDATE
          SET module_name = EXCLUDED.module_name,
              route_scope = EXCLUDED.route_scope,
              current_state = EXCLUDED.current_state,
              permission_notes = CASE
                  WHEN scoped_role_policy_modules.permission_notes = '' THEN EXCLUDED.permission_notes
                  ELSE scoped_role_policy_modules.permission_notes
              END,
              source_url = CASE
                  WHEN scoped_role_policy_modules.source_url = '' THEN EXCLUDED.source_url
                  ELSE scoped_role_policy_modules.source_url
              END,
              is_active = TRUE;

          INSERT INTO schema_migrations(migration_id, description, applied_at)
          VALUES (
              '082_view_as_route_authority_catalog',
              'Reconcile active frontend modules 001A, 031, 032, 033, 081, and 082 with the dynamic scoped-RBAC catalog so View-As route authority does not treat installed modules as missing',
              NOW()
          )
          ON CONFLICT (migration_id) DO NOTHING;

          COMMIT;
          EOF

          cat > database/rollback/082_view_as_route_authority_catalog_rollback.sql <<'EOF'
          BEGIN;

          DO $projectpulse082_rollback_guard$
          BEGIN
              IF to_regclass('public.projectpulse_082_route_catalog_previous') IS NULL THEN
                  RAISE EXCEPTION 'Rollback refused: migration 082 catalog snapshot is unavailable.';
              END IF;

              IF EXISTS (
                  SELECT 1
                  FROM scoped_role_policy_grants grant_row
                  JOIN projectpulse_082_route_catalog_previous previous
                    ON previous.module_code = grant_row.module_code
                  WHERE previous.existed_before = FALSE
              ) THEN
                  RAISE EXCEPTION 'Rollback refused: scoped role-policy grants reference a module introduced by migration 082.';
              END IF;
          END;
          $projectpulse082_rollback_guard$;

          UPDATE scoped_role_policy_modules current
          SET module_name = previous.module_name,
              route_scope = previous.route_scope,
              current_state = previous.current_state,
              permission_notes = previous.permission_notes,
              source_url = previous.source_url,
              is_active = previous.is_active,
              created_at = previous.created_at
          FROM projectpulse_082_route_catalog_previous previous
          WHERE current.module_code = previous.module_code
            AND previous.existed_before = TRUE;

          DELETE FROM scoped_role_policy_modules current
          USING projectpulse_082_route_catalog_previous previous
          WHERE current.module_code = previous.module_code
            AND previous.existed_before = FALSE;

          DROP TABLE projectpulse_082_route_catalog_previous;

          DELETE FROM schema_migrations
          WHERE migration_id = '082_view_as_route_authority_catalog';

          COMMIT;
          EOF

          cat > tests/test-view-as-route-authority-migration-082.sh <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          CONTAINER="projectpulse-view-as-route-082-${GITHUB_RUN_ID:-local}-$$"
          DB_USER="projectpulse"
          DB_NAME="projectpulse"
          DB_PASSWORD="projectpulse-test-only"
          MIGRATION="/workspace/database/migrations/082_view_as_route_authority_catalog.sql"
          ROLLBACK="/workspace/database/rollback/082_view_as_route_authority_catalog_rollback.sql"

          cleanup() { docker rm -f "$CONTAINER" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          psql_exec() { docker exec -i -e PGPASSWORD="$DB_PASSWORD" "$CONTAINER" psql -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME" "$@"; }
          value() { psql_exec -Atqc "$1" | tr -d '\r'; }
          assert_eq() { local expected="$1" actual="$2" label="$3"; [[ "$actual" == "$expected" ]] || { echo "ASSERTION_FAILED $label expected=$expected actual=$actual" >&2; exit 1; }; echo "ASSERTION_PASSED $label=$actual"; }
          expect_failure() { local label="$1" expected="$2" log="/tmp/view-as-route-$1.log"; shift 2; if "$@" >"$log" 2>&1; then echo "ASSERTION_FAILED expected_failure=$label" >&2; exit 1; fi; grep -Fq "$expected" "$log" || { cat "$log" >&2; exit 1; }; echo "ASSERTION_PASSED $label=REJECTED"; }

          docker run --detach --rm --name "$CONTAINER" \
            -e POSTGRES_USER="$DB_USER" -e POSTGRES_PASSWORD="$DB_PASSWORD" -e POSTGRES_DB="$DB_NAME" \
            -v "$ROOT:/workspace:ro" postgres:16-alpine >/dev/null
          for attempt in $(seq 1 60); do
            psql_exec -Atqc 'SELECT 1' >/dev/null 2>&1 && break
            [[ "$attempt" != 60 ]] || { docker logs "$CONTAINER" >&2 || true; exit 1; }
            sleep 1
          done

          psql_exec <<'SQL'
          CREATE TABLE schema_migrations(migration_id TEXT PRIMARY KEY, description TEXT NOT NULL DEFAULT '', applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW());
          CREATE TABLE scoped_role_policy_modules(
            module_code TEXT PRIMARY KEY,
            module_name TEXT NOT NULL,
            route_scope TEXT NOT NULL,
            current_state TEXT NOT NULL,
            permission_notes TEXT NOT NULL DEFAULT '',
            source_url TEXT NOT NULL DEFAULT '',
            is_active BOOLEAN NOT NULL DEFAULT TRUE,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE TABLE scoped_role_policy_grants(
            scoped_role_policy_grant_id UUID PRIMARY KEY,
            module_code TEXT NOT NULL REFERENCES scoped_role_policy_modules(module_code)
          );
          INSERT INTO scoped_role_policy_modules(module_code,module_name,route_scope,current_state,permission_notes,source_url,is_active)
          VALUES('033','Legacy Forge','legacy-forge','Draft','','legacy-source',FALSE);
          SQL

          psql_exec -f "$MIGRATION" >/dev/null
          first_applied="$(value "SELECT applied_at FROM schema_migrations WHERE migration_id='082_view_as_route_authority_catalog'")"
          psql_exec -f "$MIGRATION" >/dev/null
          assert_eq "$first_applied" "$(value "SELECT applied_at FROM schema_migrations WHERE migration_id='082_view_as_route_authority_catalog'")" migration_082_idempotent_ledger
          assert_eq 6 "$(value "SELECT COUNT(*) FROM scoped_role_policy_modules WHERE module_code = ANY(ARRAY['001A','031','032','033','081','082']) AND is_active=TRUE")" complete_active_catalog
          assert_eq project-forge "$(value "SELECT route_scope FROM scoped_role_policy_modules WHERE module_code='033'")" project_forge_route_reconciled
          assert_eq 6 "$(value "SELECT COUNT(*) FROM projectpulse_082_route_catalog_previous")" rollback_snapshot_complete

          psql_exec -qc "INSERT INTO scoped_role_policy_grants VALUES('10000000-0000-0000-0000-000000000001','031')"
          expect_failure guarded_rollback 'Rollback refused:' psql_exec -f "$ROLLBACK"
          psql_exec -qc "DELETE FROM scoped_role_policy_grants"
          psql_exec -f "$ROLLBACK" >/dev/null

          assert_eq legacy-forge "$(value "SELECT route_scope FROM scoped_role_policy_modules WHERE module_code='033'")" existing_module_restored
          assert_eq f "$(value "SELECT is_active FROM scoped_role_policy_modules WHERE module_code='033'")" existing_module_state_restored
          assert_eq 0 "$(value "SELECT COUNT(*) FROM scoped_role_policy_modules WHERE module_code = ANY(ARRAY['001A','031','032','081','082'])")" introduced_modules_removed
          assert_eq 0 "$(value "SELECT COUNT(*) FROM schema_migrations WHERE migration_id='082_view_as_route_authority_catalog'")" migration_ledger_removed
          echo 'VIEW_AS_ROUTE_AUTHORITY_MIGRATION_082=PASS'
          EOF
          chmod +x tests/test-view-as-route-authority-migration-082.sh

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci

      - name: Validate focused route continuity contracts
        working-directory: src/frontend/project-time-web
        run: |
          node scripts/validate-view-as-route-continuity.mjs
          node scripts/validate-module-availability.mjs
          node scripts/validate-modules-directory-page.mjs

      - name: Validate migration 082 and guarded rollback
        run: bash tests/test-view-as-route-authority-migration-082.sh

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Validate live route authority after production build
        working-directory: src/frontend/project-time-web
        run: |
          node scripts/validate-live-ui-route-authority.mjs
          node scripts/validate-view-as-route-continuity.mjs

      - name: Validate exact source boundary
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/frontend/project-time-web/src/module-availability-bridge.js',
              'src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx',
              'src/frontend/project-time-web/src/module-availability.css',
              'src/frontend/project-time-web/package.json',
              'src/frontend/project-time-web/scripts/validate-view-as-route-continuity.mjs',
              'database/migrations/082_view_as_route_authority_catalog.sql',
              'database/rollback/082_view_as_route_authority_catalog_rollback.sql',
              'tests/test-view-as-route-authority-migration-082.sh',
              'docs/security/VIEW-AS-ROUTE-CONTINUITY.md',
              '.github/workflows/bootstrap-view-as-route-continuity-systemwide.yml',
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
              if len(line) >= 4
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected files after validation: {sorted(unexpected)}')
          required = allowed - {'.github/workflows/bootstrap-view-as-route-continuity-systemwide.yml'}
          missing = required - changed
          if missing:
              raise SystemExit(f'Expected files were not changed: {sorted(missing)}')
          PY

      - name: Commit validated repair and remove publisher
        shell: bash
        run: |
          rm .github/workflows/bootstrap-view-as-route-continuity-systemwide.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
