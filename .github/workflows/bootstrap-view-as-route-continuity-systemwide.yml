              r'''      const nextActiveModuleNumbers = new Set(matrix.modules
        .map((module) => String(module?.moduleCode || '').trim().toUpperCase())
        .filter(Boolean));
      const nextDenied = new Set(RETIRED_MODULE_NUMBERS);
      const nextDeniedReasons = new Map(
        [...RETIRED_MODULE_NUMBERS].map((moduleNumber) => [moduleNumber, 'module_retired'])
      );

      if (!actualSuperAdministrator) {
        for (const module of PROJECTPULSE_MODULES) {
          const number = String(module.moduleNumber || '').trim().toUpperCase();
          if (number && !nextActiveModuleNumbers.has(number)) {
            nextDenied.add(number);
            nextDeniedReasons.set(number, 'module_not_registered_or_inactive');
          }
        }

        matrix.grants
          .filter((grant) => roleSet.has(canonicalRoleCode(grant.roleCode)))
          .filter((grant) => String(grant.actionCode || '').toUpperCase() === 'MODULE_ACCESS')
          .filter((grant) => String(grant.grantEffect || '').toUpperCase() === 'DENY')
          .forEach((grant) => {
            const moduleNumber = String(grant.moduleCode || '').toUpperCase();
            nextDenied.add(moduleNumber);
