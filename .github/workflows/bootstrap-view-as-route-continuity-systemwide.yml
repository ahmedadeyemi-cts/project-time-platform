              "      {availability.access?.isViewAs ? (\n        <div className=\"module-availability-notice warning\">View-As is read-only. Exit preview to change module availability.</div>\n      ) : null}\n      {!permissionEvidenceReady ? (\n        <div className=\"module-availability-notice warning\" role=\"status\">\n          {navigationAuthority.state === 'loading'\n            ? 'Checking module access for the current effective user. Open actions are paused until verification completes.'\n            : 'Module access could not be verified. Pulse kept the current route in place and paused module opening instead of redirecting to Dashboard.'}\n        </div>\n      ) : null}\n      {statusMessage ?"
