name: Bootstrap systemwide View-As route continuity repair

on:
  push:
    branches:
      - fix/view-as-route-continuity-systemwide-20260808

permissions:
  contents: write

concurrency:
  group: bootstrap-view-as-route-continuity-systemwide
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/view-as-route-continuity-systemwide-20260808
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Apply shared route authority repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          def replace_once(relative, old, new):
              path = root / relative
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1))

          def insert_before_once(relative, marker, addition):
              path = root / relative
              text = path.read_text()
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one insertion marker, found {count}")
              path.write_text(text.replace(marker, addition + marker, 1))

          def regex_replace_once(relative, pattern, replacement):
              path = root / relative
              text = path.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one regex replacement target, found {count}")
              path.write_text(updated)

          bridge = "src/frontend/project-time-web/src/module-availability-bridge.js"
          replace_once(
              bridge,
              "const BODY_NOTICE_ID = 'projectpulse-module-011-retirement-notice';\nconst RETIRED_MODULE_NUMBERS = new Set(",
              "const BODY_NOTICE_ID = 'projectpulse-module-011-retirement-notice';\nconst ROUTE_ACCESS_NOTICE_ID = 'projectpulse-route-access-notice';\nconst RETIRED_MODULE_NUMBERS = new Set("
          )
          replace_once(
              bridge,
              "  let deniedModuleNumbers = new Set(RETIRED_MODULE_NUMBERS);\n  let permissionEvidenceState = sessionToken() ? 'loading' : 'anonymous';",
              "  let activeModuleNumbers = new Set();\n  let deniedModuleNumbers = new Set(RETIRED_MODULE_NUMBERS);\n  let deniedModuleReasons = new Map(\n    [...RETIRED_MODULE_NUMBERS].map((moduleNumber) => [moduleNumber, 'module_retired'])\n  );\n  let permissionEvidenceState = sessionToken() ? 'loading' : 'anonymous';"
          )

          insert_before_once(
              bridge,
              "  function enforceRouteBoundary() {\n",
              r'''  function removeRouteAccessNotice() {
    const notice = document.getElementById(ROUTE_ACCESS_NOTICE_ID);
    if (notice?.parentElement === document.body) notice.remove();
  }

  function moduleAccessDecision(module) {
    if (!module) return { state: 'unmanaged', allowed: true, reasonCode: '' };
    const moduleNumber = String(module.moduleNumber || '').trim().toUpperCase();
    if (RETIRED_MODULE_NUMBERS.has(moduleNumber)) {
      return { state: 'denied', allowed: false, reasonCode: 'module_retired' };
    }
    if (permissionEvidenceState !== 'ready') {
      return {
        state: permissionEvidenceState === 'loading' ? 'checking' : 'unavailable',
        allowed: false,
        reasonCode: permissionEvidenceState === 'loading'
          ? 'permission_evidence_loading'
          : 'permission_evidence_unavailable'
      };
    }
    if (deniedModuleNumbers.has(moduleNumber)) {
      return {
        state: 'denied',
        allowed: false,
        reasonCode: deniedModuleReasons.get(moduleNumber) || 'module_access_denied'
      };
    }
    return { state: 'allowed', allowed: true, reasonCode: '' };
  }

  function showRouteAccessNotice(module, decision) {
    if (!module || decision.allowed) {
      removeRouteAccessNotice();
      return;
    }

    let notice = document.getElementById(ROUTE_ACCESS_NOTICE_ID);
    if (!notice) {
      notice = document.createElement('aside');
      notice.id = ROUTE_ACCESS_NOTICE_ID;
      notice.className = 'projectpulse-route-access-notice';
      notice.setAttribute('role', 'dialog');
      notice.setAttribute('aria-modal', 'true');
      notice.setAttribute('aria-labelledby', 'projectpulse-route-access-title');

      const card = document.createElement('div');
      card.className = 'projectpulse-route-access-card';
      const eyebrow = document.createElement('span');
      eyebrow.className = 'projectpulse-route-access-eyebrow';
      eyebrow.textContent = 'View-As route protection';
      const title = document.createElement('h2');
      title.id = 'projectpulse-route-access-title';
      const detail = document.createElement('p');
      detail.className = 'projectpulse-route-access-detail';
      const actions = document.createElement('div');
      actions.className = 'projectpulse-route-access-actions';
      const modulesLink = document.createElement('a');
      modulesLink.href = '#modules';
      modulesLink.textContent = 'Open authorized modules';
      const dismiss = document.createElement('button');
      dismiss.type = 'button';
      dismiss.textContent = 'Stay on this page';
      dismiss.addEventListener('click', removeRouteAccessNotice);
      actions.append(modulesLink, dismiss);
      card.append(eyebrow, title, detail, actions);
      notice.append(card);
      document.body.append(notice);
    }

    notice.dataset.moduleNumber = String(module.moduleNumber || '');
    notice.dataset.route = String(module.route || '');
    notice.dataset.reasonCode = decision.reasonCode;
    const title = notice.querySelector('#projectpulse-route-access-title');
    const detail = notice.querySelector('.projectpulse-route-access-detail');
    const identity = `Module ${module.moduleNumber} — ${module.displayName}`;
    if (decision.state === 'checking') {
      title.textContent = `Checking access to ${identity}`;
      detail.textContent = 'Pulse is verifying the selected View-As identity. The route was not changed and no Dashboard redirect occurred.';
    } else if (decision.state === 'unavailable') {
      title.textContent = `Access could not be verified for ${identity}`;
      detail.textContent = 'The authorization service is temporarily unavailable. Pulse kept the selected route in place and blocked module interaction rather than silently returning to Dashboard.';
    } else {
      title.textContent = `${identity} is not available to this View-As identity`;
      detail.textContent = 'This module is excluded by the effective user’s module catalog or an explicit role policy. Select an authorized module or exit View-As to use your own access.';
    }
  }

  function publishRouteDenied(module, decision) {
    window.dispatchEvent(new CustomEvent('projectpulse:permission-route-denied', {
      detail: {
        moduleNumber: module.moduleNumber,
        route: module.route,
        state: decision.state,
        reasonCode: decision.reasonCode,
        isViewAs: effectiveActor.isViewAs,
        redirectedToDashboard: false
      }
    }));
  }

  function routeFromNavigationElement(element) {
    const declared = element?.getAttribute?.('data-module-open-route')
      || element?.getAttribute?.('data-route');
    if (declared) return rawModuleRoute(declared).split('?')[0];
    const href = element?.getAttribute?.('href');
    if (!href) return '';
    try {
      return rawModuleRoute(new URL(href, window.location.href).hash).split('?')[0];
    } catch {
      return rawModuleRoute(href).split('?')[0];
    }
  }

  function guardModuleNavigation(event) {
    const element = event.target?.closest?.('[data-module-open-route], button[data-route], a[href]');
    if (!element) return;
    const route = routeFromNavigationElement(element);
    const module = moduleForRoute(route);
    if (!module) return;
    const decision = moduleAccessDecision(module);
    if (decision.allowed) return;

    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    showRouteAccessNotice(module, decision);
    publishRouteDenied(module, decision);
    if (decision.state === 'checking' || decision.state === 'unavailable') {
      void refreshPermissions();
    }
  }

'''
          )

          regex_replace_once(
              bridge,
              r"  function enforceRouteBoundary\(\) \{.*?\n  \}\n\n  function publishNavigationState\(\) \{",
              r'''  function enforceRouteBoundary() {
    const rawRoute = rawModuleRoute(window.location.hash || '#dashboard') || 'dashboard';
    const retired = retiredModuleForRoute(rawRoute);
    if (retired) {
      window.sessionStorage.setItem(RETIRED_ROUTE_NOTICE_KEY, 'true');
      if (rawRoute !== 'work-register') window.location.replace('#work-register');
      return;
    }

    const currentModule = moduleForRoute(rawRoute);
    if (!currentModule) {
      removeRouteAccessNotice();
      return;
    }

    const decision = moduleAccessDecision(currentModule);
    if (decision.allowed) {
      removeRouteAccessNotice();
      return;
    }

    // Never hide an authorization mismatch by silently changing the selected
    // route to Dashboard. Keep the route, block interaction, and explain the
    // effective-user decision so View-As remains predictable and auditable.
    showRouteAccessNotice(currentModule, decision);
    publishRouteDenied(currentModule, decision);
  }

  function publishNavigationState() {'''
