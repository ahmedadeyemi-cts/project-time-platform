name: Apply Celar AI President Identity Extraction Repair

on:
  push:
    branches:
      - fix/celar-ai-president-identity-extraction-20260815
    paths:
      - '.github/workflows/temporary-celar-ai-president-extraction-repair-20260815.yml'

permissions:
  contents: write

jobs:
  repair:
    name: Apply and validate the Celar AI President extraction repair
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/celar-ai-president-identity-extraction-20260815
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Apply, validate, and publish focused repair
        shell: bash
        run: python3 .github/scripts/apply-celar-ai-president-extraction-repair-20260815.py
