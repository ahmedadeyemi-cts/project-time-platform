name: Remaining PR Release Train

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/remaining-pr-release-train-trigger.txt'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: projectpulse-remaining-pr-release-train
  cancel-in-progress: true

jobs:
  reconcile-validate-and-merge:
    if: >-
      github.actor == 'ahmedadeyemi-cts' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/run-remaining-pr-release-train-20260731-attempt-5'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out live main release controls
        uses: actions/checkout@v5
        with:
          ref: main
          path: repo
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Check out exact release-train trigger
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: trigger
          fetch-depth: 1
          persist-credentials: false

      - name: Capture exact control and trigger pins
        id: pins
        shell: bash
        run: |
          set -Eeuo pipefail
          control_sha="$(git -C repo rev-parse HEAD)"
          trigger_sha="$(git -C trigger rev-parse HEAD)"
          remote_main_sha="$(git -C repo ls-remote origin refs/heads/main | awk '{print $1}')"

          test -n "$control_sha"
          test -n "$trigger_sha"
          test -n "$remote_main_sha"
          test "$trigger_sha" = "${{ github.event.pull_request.head.sha }}"

          if [[ "$control_sha" != "$remote_main_sha" ]]; then
            echo "::error::Live main advanced while the release controls were being pinned: checkout=$control_sha remote=$remote_main_sha"
            exit 1
          fi

          echo "control_sha=$control_sha" >> "$GITHUB_OUTPUT"
          echo "trigger_sha=$trigger_sha" >> "$GITHUB_OUTPUT"

      - name: Publish observable release-train run
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- remaining-pr-release-train-run -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Remaining PR release train started',
              '',
              `- Workflow run: ${runUrl}`,
              `- Trigger head: \`${{ steps.pins.outputs.trigger_sha }}\``,
              `- Main/control SHA pinned by checkout: \`${{ steps.pins.outputs.control_sha }}\``,
              '- Required merge order: `#330 → #333 → #338`',
              '',
              'The controller fails closed before a branch update or merge whenever an exact-head, migration, build, dependency, source-cleanliness, container, or merge gate fails.'
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repo/src/frontend/project-time-web/package-lock.json

      - name: Reconcile, validate, and merge PRs 330, 333, and 338 in order
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TRAIN_TRIGGER: ${{ github.workspace }}/trigger/.github/remaining-pr-release-train-trigger.txt
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 --decode .github/scripts/remaining_pr_release_train.py.gz.b64 | gzip -d > "$RUNNER_TEMP/remaining_pr_release_train.py"
          python3 "$RUNNER_TEMP/remaining_pr_release_train.py"

      - name: Capture exact failed reconciliation diagnostics
        if: failure()
        working-directory: repo
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          {
            echo '=== git status --short ==='
            git status --short
            echo
            echo '=== git diff --cached --check ==='
            git diff --cached --check
            echo
            echo '=== git diff --check ==='
            git diff --check
            echo
            echo '=== staged filenames ==='
            git diff --cached --name-status
            echo
            echo '=== unstaged filenames ==='
            git diff --name-status
            echo
            echo '=== current branch and HEAD ==='
            git branch --show-current
            git rev-parse HEAD
          } > artifacts/remaining-pr-release-train-diagnostics.txt 2>&1
          cat artifacts/remaining-pr-release-train-diagnostics.txt
          exit 0

      - name: Upload immutable release-train evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-pr-release-train-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            repo/artifacts/remaining-pr-release-train.json
            repo/artifacts/remaining-pr-release-train-diagnostics.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Close the one-time trigger PR after successful release train
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });
