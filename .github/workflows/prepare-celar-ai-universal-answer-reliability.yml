name: Prepare Ask Celar AI Universal Answer Reliability

on:
  push:
    branches:
      - feature/celar-ai-universal-answer-reliability-20260810
    paths:
      - '.github/workflows/prepare-celar-ai-universal-answer-reliability.yml'

permissions:
  contents: write

concurrency:
  group: prepare-celar-ai-universal-answer-reliability
  cancel-in-progress: false

jobs:
  prepare:
    name: Integrate, validate, commit, and remove temporary builder
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feature/celar-ai-universal-answer-reliability-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Apply the exact reviewed integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path_value, old, new, label):
              path = Path(path_value)
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          reliability = 'src/backend/ProjectTime.Api/Ai/CelarAiUniversalAnswerReliability.cs'
          replace_once(
              reliability,
              '''        var diagnosticSignal = CelarAiUniversalToolCatalog.HasDiagnosticSignal(normalized)
                      || intent is "troubleshooting" or "api_inventory" or "release_and_deployment"
                          or "observability" or "security";
                  var procedureSignal = CelarAiUniversalToolCatalog.HasProcedureSignal(normalized)
                      || intent is "product_help" or "procedure" or "platform_identity";
                  var architectureSignal = intent == "future_enhancement"
                      || normalized.Contains("design a future", StringComparison.Ordinal)
                      || normalized.Contains("architecture", StringComparison.Ordinal)
                      || normalized.Contains("enhancement", StringComparison.Ordinal);
          ''',
              '''        var diagnosticSignal = intent is "troubleshooting" or "api_inventory" or "release_and_deployment"
                      or "observability" or "security"
                      || (intent.Length == 0 && CelarAiUniversalToolCatalog.HasDiagnosticSignal(normalized));
                  var procedureSignal = intent is "product_help" or "procedure" or "platform_identity"
                      || (intent.Length == 0 && CelarAiUniversalToolCatalog.HasProcedureSignal(normalized));
                  var architectureSignal = intent == "future_enhancement"
                      || normalized.Contains("design a future", StringComparison.Ordinal)
                      || normalized.Contains("architecture", StringComparison.Ordinal)
                      || normalized.Contains("enhancement", StringComparison.Ordinal);
                  var crossDomainSignal = documentSignal
                      && ((includeRepositoryContext
                              && intent is "projects_and_delivery" or "financial_and_reporting" or "documents_and_rag")
                          || ContainsAny(normalized,
                              "current project", "project task", "task", "assigned", "active assignment",
                              "current forecast", "billed", "risk", "resource request", "flowhive",
                              "project forge", "current delivery plan", "timeline", "capacity", "budget",
                              "cost", "schedule", "milestone", "estimated hours"));
          ''',
              'question signal policy')
          replace_once(reliability, ': documentSignal && structuredSignal', ': crossDomainSignal', 'cross-domain precedence')
          replace_once(
              reliability,
              '''        var matchedTools = CelarAiUniversalToolCatalog.Match(normalized, intent, 16).ToList();
                  AddRequiredTools(questionClass, attachmentCount, matchedTools);
          ''',
              '''        var matchedTools = CelarAiUniversalToolCatalog.Match(normalized, intent, 16).ToList();
                  AddIntentDefaults(intent, normalized, matchedTools);
                  AddRequiredTools(questionClass, attachmentCount, matchedTools);
          ''',
              'intent-default tool planning')
          replace_once(
              reliability,
              '            .Concat(privateCitations > 0 ? ["private_citation"] : Array.Empty<string>())',
              '            .Concat(privateCitations > 0 ? new[] { "private_citation" } : Array.Empty<string>())',
              'target-typed citation collection')
          replace_once(
              reliability,
              '''        if (plan.QuestionClass is CelarAiAnswerQuestionClass.DocumentEvidence
                          or CelarAiAnswerQuestionClass.CrossDomain
                      && privateCitations == 0
          ''',
              '''        if ((plan.QuestionClass is CelarAiAnswerQuestionClass.DocumentEvidence
                          or CelarAiAnswerQuestionClass.CrossDomain)
                      && privateCitations == 0
          ''',
              'document class pattern precedence')
          replace_once(
              reliability,
              '''        if (result.ModelProvider is CelarAiCapabilityTargets.Claude or CelarAiCapabilityTargets.OpenAi
                      && plan.QuestionClass is not CelarAiAnswerQuestionClass.PublicCurrent
          ''',
              '''        if ((string.Equals(result.ModelProvider, CelarAiCapabilityTargets.Claude, StringComparison.OrdinalIgnoreCase)
                          || string.Equals(result.ModelProvider, CelarAiCapabilityTargets.OpenAi, StringComparison.OrdinalIgnoreCase))
                      && plan.QuestionClass is not CelarAiAnswerQuestionClass.PublicCurrent
          ''',
              'external provider comparison')
          replace_once(
              reliability,
              '        var passed = blockers == 0 && score >= 0.75m;',
              '        var passed = blockers == 0 && reviews == 0 && score >= 0.75m;',
              'review finding promotion gate')
          replace_once(
              reliability,
              '            ReviewRequired: !passed || plan.QuestionClass == CelarAiAnswerQuestionClass.ArchitectureEnhancement,',
              '            ReviewRequired: !passed || reviews > 0 || plan.QuestionClass == CelarAiAnswerQuestionClass.ArchitectureEnhancement,',
              'review-required projection')
          replace_once(
              reliability,
              '        var modes = questionClass switch',
              '        List<CelarAiEvidenceMode> modes = questionClass switch',
              'evidence-mode target type')
          replace_once(
              reliability,
              '''    private static bool ContainsAny(string value, IEnumerable<string> signals) =>
                  signals.Any(signal => value.Contains(signal, StringComparison.OrdinalIgnoreCase));

          ''',
              '',
              'redundant ContainsAny overload')
          replace_once(
              reliability,
              '''    private static void AddRequiredTools(
                  CelarAiAnswerQuestionClass questionClass,
          ''',
              '''    private static void AddIntentDefaults(
                  string intent,
                  string normalized,
                  List<CelarAiUniversalToolCapability> tools)
              {
                  void Add(string code)
                  {
                      var tool = CelarAiUniversalToolCatalog.Tools.FirstOrDefault(value => value.Code == code);
                      if (tool is not null && tools.All(value => value.Code != code)) tools.Add(tool);
                  }

                  switch (intent)
                  {
                      case "identity_and_permissions":
                          Add("effective_identity");
                          Add("role_permission_evidence");
                          Add("people_directory");
                          break;
                      case "projects_and_delivery":
                          Add("project_portfolio");
                          Add("project_assignments");
                          Add("people_directory");
                          if (ContainsAny(normalized, "task", "work assigned", "remaining hours")) Add("task_assignments");
                          if (ContainsAny(normalized, "resource request", "unfilled", "staffing request")) Add("resource_requests");
                          break;
                      case "timesheets_and_approvals":
                          Add("timesheet_status");
                          if (ContainsAny(normalized, "approval", "approve", "declined", "locked", "correction")) Add("approval_status");
                          if (ContainsAny(normalized, "capacity", "utilization", "workload", "forecast", "remaining hours")) Add("capacity_utilization");
                          if (ContainsAny(normalized, "engineer", "employee", "team")) Add("team_scope");
                          break;
                      case "financial_and_reporting":
                          Add("project_financial_truth");
                          if (ContainsAny(normalized, "expense", "billing", "invoice", "reconciliation", "billable")) Add("expense_billing");
                          if (ContainsAny(normalized, "contract", "rate", "block of hours", "block-of-hours", "balance", "commercial")) Add("commercial_contracts");
                          if (ContainsAny(normalized, "opportunity", "pipeline", "future work")) Add("commercial_pipeline");
                          break;
                      case "documents_and_rag":
                          Add("project_documents");
                          Add("private_retrieval");
                          break;
                      case "troubleshooting":
                      case "api_inventory":
                      case "release_and_deployment":
                      case "observability":
                      case "security":
                          Add("system_diagnostics");
                          if (ContainsAny(normalized, "error", "defect", "bug", "known issue")) Add("defect_tracker");
                          if (ContainsAny(normalized, "api", "endpoint", "route")) Add("live_api_inventory");
                          if (ContainsAny(normalized, "deployment", "release", "rollback", "commit")) Add("release_deployment");
                          if (ContainsAny(normalized, "oracle runtime", "private runtime", "ollama ready", "ocr ready")) Add("oracle_runtime_readiness");
                          if (ContainsAny(normalized, "backup", "recovery", "slo", "replication", "monitoring")) Add("observability");
                          if (ContainsAny(normalized, "who changed", "audit", "changed the")) Add("audit_history");
                          if (ContainsAny(normalized, "retention", "classification", "revocation")) Add("data_governance");
                          if (ContainsAny(normalized, "secret", "token", "private port", "security", "tls", "exposed")) Add("security_posture");
                          break;
                      case "product_help":
                      case "procedure":
                      case "platform_identity":
                          Add("product_knowledge");
                          break;
                      case "general_knowledge":
                          Add("governed_public_information");
                          break;
                      case "future_enhancement":
                          Add("product_knowledge");
                          Add("live_api_inventory");
                          break;
                  }
              }

              private static void AddRequiredTools(
                  CelarAiAnswerQuestionClass questionClass,
          ''',
              'intent-default tool method')

          catalog = 'src/backend/ProjectTime.Api/Ai/CelarAiUniversalToolCatalog.cs'
          replace_once(
              catalog,
              '"deliverable", "acceptance criteria", "customer responsibility", "citation", "page", "section");',
              '"deliverable", "acceptance criteria", "customer responsibility", "citation", "cited", "page", "section");',
              'document signals')
          replace_once(
              catalog,
              '"latest version", "today\'s", "today ", "right now", "current weather", "this month",',
              '"latest version", "latest stable version", "today\'s", "today ", "right now", "current weather", "this month",',
              'current public signals')
          replace_once(
              catalog,
              '["team", "department", "reports to", "manager for", "team scope"]',
              '["team", "department", "reports to", "manager for", "team scope", "engineer", "employee"]',
              'team signals')
          replace_once(
              catalog,
              '["permission", "access", "role", "403", "forbidden", "module visibility", "full control"]',
              '["permission", "access", "role", "403", "forbidden", "module visibility", "modules can", "effective user view", "full control"]',
              'permission signals')
          replace_once(
              catalog,
              '["contract", "rate card", "block of hours", "commercial assumption", "quote", "opportunity"]',
              '["contract", "rate card", "block of hours", "block-of-hours", "balance", "commercial assumption", "quote", "opportunity"]',
              'commercial signals')

          corpus_path = Path('tests/celar-ai-universal-answer-evaluation-cases.json')
          corpus = json.loads(corpus_path.read_text(encoding='utf-8'))
          age_by_class = {
              'StructuredOperational': 3600,
              'DocumentEvidence': 86400,
              'CrossDomain': 3600,
              'ProductProcedure': 2592000,
              'RuntimeDiagnostic': 1800,
              'ArchitectureEnhancement': 604800,
              'PublicCurrent': 3600,
              'PublicStable': 2592000,
              'Unknown': 3600,
          }
          for case in corpus['cases']:
              case['maximumEvidenceAgeSeconds'] = age_by_class[case['expectedQuestionClass']]
          corpus_path.write_text(json.dumps(corpus, indent=2) + '\n', encoding='utf-8')

          replace_once(
              'src/backend/ProjectTime.Api/Ai/ProjectPulseAiServiceCollectionExtensions.cs',
              '''        services.AddSingleton<CelarAiInternalDataService>();
                  services.AddSingleton<CelarAiPeopleAndGuidanceService>();
          ''',
              '''        services.AddSingleton<CelarAiInternalDataService>();
                  services.AddSingleton<CelarAiUniversalAnswerReliabilityService>();
                  services.AddSingleton<CelarAiPeopleAndGuidanceService>();
          ''',
              'service registration')

          production = 'src/backend/ProjectTime.Api/Modules/CelarAiProductionPlatformModule.cs'
          replace_once(
              production,
              '''    public static IEndpointRouteBuilder MapCelarAiProductionPlatformEndpoints(this IEndpointRouteBuilder endpoints)
              {
                  endpoints.MapGet("/api/celar-ai/v1/production/readiness",
          ''',
              '''    public static IEndpointRouteBuilder MapCelarAiProductionPlatformEndpoints(this IEndpointRouteBuilder endpoints)
              {
                  endpoints.MapCelarAiUniversalAnswerReliabilityEndpoints();
                  endpoints.MapGet("/api/celar-ai/v1/production/readiness",
          ''',
              'endpoint map')
          replace_once(
              production,
              '(Func<CelarAiProductionChatRequest, HttpContext, PulseAiSystemIntelligenceService, PulseAiSystemIntelligenceRepository, CelarAiInternalDataService, CelarAiPeopleAndGuidanceService, CelarAiCapabilityRoutingStore, CancellationToken, Task<IResult>>)ChatAsync);',
              '(Func<CelarAiProductionChatRequest, HttpContext, PulseAiSystemIntelligenceService, PulseAiSystemIntelligenceRepository, CelarAiInternalDataService, CelarAiPeopleAndGuidanceService, CelarAiUniversalAnswerReliabilityService, CelarAiCapabilityRoutingStore, CancellationToken, Task<IResult>>)ChatAsync);',
              'chat route delegate')
          replace_once(
              production,
              '''        CelarAiInternalDataService internalData,
                  CelarAiPeopleAndGuidanceService peopleAndGuidance,
                  CelarAiCapabilityRoutingStore routing,
          ''',
              '''        CelarAiInternalDataService internalData,
                  CelarAiPeopleAndGuidanceService peopleAndGuidance,
                  CelarAiUniversalAnswerReliabilityService universalReliability,
                  CelarAiCapabilityRoutingStore routing,
          ''',
              'chat reliability injection')
          replace_once(
              production,
              '''        var intentPlan = ResolveIntentPlan(question, intent);
                  context.Items[PulseAiSystemIntelligencePolicy.ResolvedIntentContextItem] = intentPlan;
                  PulseAiSystemQuestionResult result;
          ''',
              '''        var intentPlan = ResolveIntentPlan(question, intent);
                  context.Items[PulseAiSystemIntelligencePolicy.ResolvedIntentContextItem] = intentPlan;
                  var reliabilityPlan = universalReliability.Plan(
                      question,
                      intent.Code,
                      request.ProjectCode,
                      request.ProjectName,
                      request.ModuleCode,
                      request.IncludeRepositoryContext,
                      attachmentIds.Length);
                  PulseAiSystemQuestionResult result;
          ''',
              'chat evidence plan')
          replace_once(
              production,
              '''        result = EnforceAnswer(result, intent, question);
                  var trust = Trust(result, intent);
          ''',
              '''        result = EnforceAnswer(result, intent, question);
                  var reliabilityEnforcement = universalReliability.Enforce(
                      result,
                      reliabilityPlan,
                      request.IncludeSourceCitations,
                      request.IncludeAssumptions);
                  result = reliabilityEnforcement.Result;
                  var trust = Trust(result, intent);
          ''',
              'post-answer quality gate')
          replace_once(
              production,
              '''            decision = intent,
                  trust,
                  result = result.ToPublicResponse(),
          ''',
              '''            decision = intent,
                  trust,
                  reliability = universalReliability.ToPublicEvidence(
                      reliabilityPlan,
                      reliabilityEnforcement.Assessment),
                  result = result.ToPublicResponse(),
          ''',
              'sanitized reliability response')

          ui = 'src/frontend/project-time-web/src/CelarAiProductionPlatform.jsx'
          replace_once(
              ui,
              '''import { useCallback, useEffect, useMemo, useState } from 'react';
          import CelarAiEnterprisePlatform from './CelarAiEnterprisePlatform.jsx';
          ''',
              '''import { useCallback, useEffect, useMemo, useState } from 'react';
          import CelarAiAnswerReliabilityWorkbench from './CelarAiAnswerReliabilityWorkbench.jsx';
          import CelarAiEnterprisePlatform from './CelarAiEnterprisePlatform.jsx';
          ''',
              'frontend import')
          replace_once(
              ui,
              '''  ['tools', 'Tools & Coverage', 'Live APIs, governed tools, troubleshooting, and system coverage'],
            ['datasets', 'Datasets', 'Reviewed immutable training and evaluation inputs'],
          ''',
              '''  ['tools', 'Tools & Coverage', 'Live APIs, governed tools, troubleshooting, and system coverage'],
            ['reliability', 'Answer Reliability', 'Authoritative tools, evidence planning, freshness, citations, and fail-closed quality gates'],
            ['datasets', 'Datasets', 'Reviewed immutable training and evaluation inputs'],
          ''',
              'frontend tab')
          replace_once(
              ui,
              '''    if (activeTab === 'tools') return <PulseAiSystemIntelligenceWorkbench />;
              if (activeTab === 'datasets') return <DatasetWorkspace data={records.datasets} refresh={refresh} canManage={canManage} />;
          ''',
              '''    if (activeTab === 'tools') return <PulseAiSystemIntelligenceWorkbench />;
              if (activeTab === 'reliability') return <CelarAiAnswerReliabilityWorkbench />;
              if (activeTab === 'datasets') return <DatasetWorkspace data={records.datasets} refresh={refresh} canManage={canManage} />;
          ''',
              'frontend mount')

          validator = 'tests/validate-celar-ai-universal-answer-reliability.mjs'
          replace_once(
              validator,
              '''const allowed = new Set(Object.values(files));
          const unexpected = changed.filter((value) => !allowed.has(value));
          ''',
              '''const allowed = new Set(Object.values(files));
          if (process.env.CELAR_UAR_PREPARE === '1') {
            allowed.add('.github/workflows/prepare-celar-ai-universal-answer-reliability.yml');
          }
          const unexpected = changed.filter((value) => !allowed.has(value));
          ''',
              'temporary builder source-isolation allowance')
          PY

          rm -f .github/workflows/prepare-celar-ai-universal-answer-reliability.yml
          git diff --check

      - name: Validate source contract and frozen 120-question corpus
        env:
          CELAR_UAR_PREPARE: '1'
        run: node tests/validate-celar-ai-universal-answer-reliability.mjs

      - name: Run deterministic answer reliability behavior tests
        run: dotnet run --project tests/CelarAiUniversalAnswerReliabilityTests/CelarAiUniversalAnswerReliabilityTests.csproj --configuration Release

      - name: Preserve named-person internal-data behavior
        run: dotnet run --project tests/CelarAiInternalDataTests/CelarAiInternalDataTests.csproj --configuration Release

      - name: Build complete API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install frontend dependencies and build complete production bundle
        working-directory: src/frontend/project-time-web
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit only the validated source package
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'Celar AI Reliability Automation'
          git config user.email 'celar-ai-reliability-automation@users.noreply.github.com'
          git commit -m 'feat: add exhaustive Ask Celar AI universal answer reliability'
          git push origin HEAD:feature/celar-ai-universal-answer-reliability-20260810
