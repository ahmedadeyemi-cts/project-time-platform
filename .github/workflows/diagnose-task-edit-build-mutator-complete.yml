name: Diagnose Complete TaskEdit Build Mutator Chain

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/diagnose-task-edit-build-mutator-complete.yml'

permissions:
  contents: write

concurrency:
  group: diagnose-complete-task-edit-build-mutator
  cancel-in-progress: false

jobs:
  diagnose:
    name: Continue until TaskEdit sources are created
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/task-edit-build-mutator-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Execute every build command until TaskEdit appears
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          npm ci --no-audit --no-fund
          npm run prebuild

          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const commands = packageJson.scripts.build.split(' && ');
          const diagnosisPath = path.join(process.env.RUNNER_TEMP, 'task-edit-complete-diagnosis.json');
          const drawerPath = path.join('src', 'TaskEditDrawer.jsx');
          const supportPath = path.join('src', 'TaskEditSupport.js');
          const failures = [];
          const state = () => ({
            drawer: fs.existsSync(drawerPath),
            support: fs.existsSync(supportPath),
            drawerBytes: fs.existsSync(drawerPath) ? fs.statSync(drawerPath).size : 0,
            supportBytes: fs.existsSync(supportPath) ? fs.statSync(supportPath).size : 0,
          });

          let diagnosis = null;
          console.log(`TASK_EDIT_INITIAL=${JSON.stringify(state())}`);
          for (let index = 0; index < commands.length; index += 1) {
            const command = commands[index].trim();
            const before = state();
            console.log(`BUILD_CHAIN_STEP=${index + 1} COMMAND=${command}`);
            const result = spawnSync('/bin/bash', ['-lc', command], {
              cwd: process.cwd(),
              env: process.env,
              stdio: 'inherit',
            });
            const after = state();
            if (result.status !== 0) {
              failures.push({ step: index + 1, command, exitStatus: result.status });
              console.log(`BUILD_CHAIN_NON_TASK_FAILURE_STEP=${index + 1} STATUS=${result.status}`);
            }
            console.log(`TASK_EDIT_STATE_AFTER_STEP=${index + 1} drawer=${after.drawer} support=${after.support}`);
            if (!before.drawer && !before.support && (after.drawer || after.support)) {
              diagnosis = {
                status: 'sources_created',
                step: index + 1,
                command,
                commandExitStatus: result.status,
                before,
                after,
                priorFailures: failures.slice(),
              };
              break;
            }
          }

          diagnosis ||= {
            status: 'not_created',
            commandsExecuted: commands.length,
            final: state(),
            failures,
          };
          fs.writeFileSync(diagnosisPath, JSON.stringify(diagnosis, null, 2));
          console.log(`TASK_EDIT_CREATION_STATUS=${diagnosis.status}`);
          console.log(`TASK_EDIT_CREATION_STEP=${diagnosis.step ?? 'NONE'}`);
          console.log(`TASK_EDIT_CREATION_COMMAND=${diagnosis.command ?? 'NONE'}`);
          console.log(`TASK_EDIT_PRIOR_FAILURE_COUNT=${failures.length}`);
          NODE

      - name: Export complete diagnosis and generated sources
        working-directory: src/frontend/project-time-web
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          create_blob() {
            local file="$1" response sha local_sha
            response="$(jq -Rs '{content:.,encoding:"utf-8"}' < "$file" \
              | curl -fsSL --retry 4 --retry-all-errors -X POST \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs" \
                  --data-binary @-)"
            sha="$(jq -r '.sha // empty' <<<"$response")"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || fail "GitHub did not return a valid blob SHA for $file."
            local_sha="$(git hash-object "$file")"
            [[ "$sha" == "$local_sha" ]] || fail "Remote blob differs from $file."
            printf '%s\n' "$sha"
          }

          DIAGNOSIS="$RUNNER_TEMP/task-edit-complete-diagnosis.json"
          [[ -s "$DIAGNOSIS" ]] || fail 'Complete TaskEdit diagnosis was not produced.'
          echo "TASK_EDIT_COMPLETE_DIAGNOSIS_BLOB_SHA=$(create_blob "$DIAGNOSIS")"

          if [[ -s src/TaskEditDrawer.jsx ]]; then
            echo "TASK_EDIT_DRAWER_BLOB_SHA=$(create_blob src/TaskEditDrawer.jsx)"
          else
            echo 'TASK_EDIT_DRAWER_BLOB_SHA=ABSENT'
          fi

          if [[ -s src/TaskEditSupport.js ]]; then
            echo "TASK_EDIT_SUPPORT_BLOB_SHA=$(create_blob src/TaskEditSupport.js)"
          else
            echo 'TASK_EDIT_SUPPORT_BLOB_SHA=ABSENT'
          fi

          echo 'ENVIRONMENT_MUTATION=NONE'
          echo 'DEPLOYMENT_ATTEMPTED=NO'
