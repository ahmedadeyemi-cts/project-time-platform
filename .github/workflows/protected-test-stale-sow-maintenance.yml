name: Protected Test stale SOW maintenance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dry-run reports stale SOWs; apply deletes only the verified stale set.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: 'Apply only: type DELETE STALE TEST SOWS'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: protected-test-stale-sow-maintenance-dispatch
  queue: max
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    steps:
      - name: Check out exact main source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify maintenance dispatch boundary
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
          [[ "$DISPATCH_MODE" == dry-run || "$DISPATCH_MODE" == apply ]]
          if [[ "$DISPATCH_MODE" == apply ]]; then
            [[ "$DISPATCH_CONFIRMATION" == 'DELETE STALE TEST SOWS' ]]
          fi
      - name: Dispatch governed Protected Test controller
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_REPOSITORY"
          before="$RUNNER_TEMP/stale-sow-before-runs.txt"
          gh run list -R "$repo" --workflow projectpulse-deploy-test.yml --limit 100             --json databaseId --jq '.[].databaseId' | sort -n > "$before"

          gh workflow run projectpulse-deploy-test.yml -R "$repo" --ref main             -f qualification_provider=none             -f acceptance_scope=full             -f recover_private_runtime=false             -f release_sha="$GITHUB_SHA"             -f release_branch=main             -f stale_sow_cleanup_mode="$DISPATCH_MODE"             -f stale_sow_cleanup_confirmation="$DISPATCH_CONFIRMATION"

          child=''
          for attempt in $(seq 1 60); do
            while IFS= read -r candidate; do
              if [[ -n "$candidate" ]] && ! grep -Fxq "$candidate" "$before"; then
                child="$candidate"
                break
              fi
            done < <(gh run list -R "$repo" --workflow projectpulse-deploy-test.yml               --branch main --event workflow_dispatch --limit 50               --json databaseId,headSha               --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | .databaseId")
            [[ -n "$child" ]] && break
            sleep 2
          done
          [[ -n "$child" ]]
          echo "child_run_id=$child" >> "$GITHUB_OUTPUT"
          echo "Governed Protected Test child run: $child" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$child" -R "$repo" --exit-status --interval 10
