name: Protected Test stale SOW maintenance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dry-run reports stale SOWs; apply deletes only the verified stale set.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: 'Apply only: type DELETE STALE TEST SOWS'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: protected-test-stale-sow-maintenance-dispatch
  queue: max
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    steps:
      - name: Check out exact main source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify maintenance dispatch boundary
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
          [[ "$DISPATCH_MODE" == dry-run || "$DISPATCH_MODE" == apply ]]
          if [[ "$DISPATCH_MODE" == apply ]]; then
            [[ "$DISPATCH_CONFIRMATION" == 'DELETE STALE TEST SOWS' ]]
          fi
      - name: Dispatch governed Protected Test supervisor
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_REPOSITORY"
          supervisor_workflow='module025-protected-uat-control.yml'
          expected_title="Protected Test stale SOW $GITHUB_RUN_ID $GITHUB_SHA"
          before="$RUNNER_TEMP/stale-sow-before-supervisor-runs.txt"
          gh run list -R "$repo" --workflow "$supervisor_workflow" --limit 100 \
            --json databaseId --jq '.[].databaseId' | sort -n > "$before"

          gh workflow run "$supervisor_workflow" -R "$repo" --ref main \
            -f stale_sow_cleanup_mode="$DISPATCH_MODE" \
            -f stale_sow_cleanup_confirmation="$DISPATCH_CONFIRMATION" \
            -f stale_sow_request_id="$GITHUB_RUN_ID"

          supervisor_run=''
          for attempt in $(seq 1 90); do
            while IFS=$'\t' read -r candidate title; do
              if [[ -n "$candidate" && "$title" == "$expected_title" ]] \
                 && ! grep -Fxq "$candidate" "$before"; then
                supervisor_run="$candidate"
                break
              fi
            done < <(gh run list -R "$repo" --workflow "$supervisor_workflow" \
              --branch main --event workflow_dispatch --limit 50 \
              --json databaseId,headSha,displayTitle \
              --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | [.databaseId,.displayTitle] | @tsv")
            [[ -n "$supervisor_run" ]] && break
            sleep 2
          done
          [[ "$supervisor_run" =~ ^[0-9]+$ ]]
          echo "supervisor_run_id=$supervisor_run" >> "$GITHUB_OUTPUT"
          echo "Governed Protected Test supervisor run: $supervisor_run" >> "$GITHUB_STEP_SUMMARY"

          conclusion=''
          deadline_epoch=$(( $(date +%s) + 240 * 60 ))
          while (( $(date +%s) < deadline_epoch )); do
            run_json="$(gh api "repos/${repo}/actions/runs/${supervisor_run}")"
            jq -e \
              --argjson id "$supervisor_run" \
              --arg sha "$GITHUB_SHA" \
              --arg title "$expected_title" '
                .id == $id
                and .path == ".github/workflows/module025-protected-uat-control.yml"
                and .event == "workflow_dispatch"
                and .head_branch == "main"
                and .head_sha == $sha
                and .display_title == $title
              ' <<<"$run_json" >/dev/null
            run_status="$(jq -r '.status' <<<"$run_json")"
            if [[ "$run_status" == completed ]]; then
              conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
              break
            fi
            sleep 15
          done
          [[ "$conclusion" == success ]]
