name: Apply Celar AI v2 chat route hotfix

on:
  push:
    branches:
      - fix/celar-ai-system-version-v2-route-20260803

permissions:
  contents: write

concurrency:
  group: apply-celar-ai-v2-chat-route-hotfix
  cancel-in-progress: false

jobs:
  patch-validate-and-commit:
    if: github.actor == 'ahmedadeyemi-cts' && !contains(github.event.head_commit.message, '[celar-v2-route-applied]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out isolated hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/celar-ai-system-version-v2-route-20260803
          fetch-depth: 0

      - name: Apply the minimal build-route correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          injector_path = Path('src/frontend/project-time-web/scripts/inject-celar-ai-runtime-rebrand.mjs')
          injector = injector_path.read_text(encoding='utf-8')
          start_marker = '  // Production builds use the v2 intent-first route.'
          end_marker = "\n\n  content = replaceRequired(\n    content,\n    `      const result = payload.result;`,"
          start = injector.find(start_marker)
          end = injector.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('CELAR_AI_V2_ROUTE_PATCH_MISSING_INJECTOR_ANCHOR')

          replacement = r'''  // The checked-in HelpAssistant source can already be on either the original
          // system-question route or the v1 Celar compatibility route. Development
          // and production builds must converge both states on the v2 intent-first route.
          if (!content.includes(`const path = '/api/celar-ai/v2/chat';`)) {
            const v1Route = `      const path = '/api/celar-ai/v1/chat';`;
            const legacyRoute = `      const path = conversationId
                ? \`/api/pulse-ai/v1/system/conversations/\${encodeURIComponent(conversationId)}/messages\`
                : '/api/pulse-ai/v1/system/questions';`;
            const v2Route = `      const path = '/api/celar-ai/v2/chat'; // compatibility: /api/celar-ai/v1/chat`;

            if (content.includes(v1Route)) {
              content = content.replace(v1Route, v2Route);
            } else {
              content = replaceRequired(content, legacyRoute, v2Route, 'help_celar_chat_route_v2');
            }
          }'''
          injector = injector[:start] + replacement + injector[end:]
          injector_path.write_text(injector, encoding='utf-8')

          validator_path = Path('src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs')
          validator = validator_path.read_text(encoding='utf-8')
          old_route_check = '''    && (
                help.includes("const path = '/api/celar-ai/v2/chat';")
                || help.includes("const path = '/api/celar-ai/v1/chat';")
              )'''
          new_route_check = '''    && help.includes("const path = '/api/celar-ai/v2/chat';")
              && !help.includes("const path = '/api/celar-ai/v1/chat';")'''
          if old_route_check not in validator:
              raise SystemExit('CELAR_AI_V2_ROUTE_PATCH_MISSING_VALIDATOR_ROUTE_ANCHOR')
          validator = validator.replace(old_route_check, new_route_check, 1)

          old_evidence = "the global chat preserves the Group 7 Help & Search title under the Celar AI brand and submits through the v2 production or v1 compatibility endpoint"
          new_evidence = "the global chat preserves the Group 7 Help & Search title under the Celar AI brand and submits through the v2 intent-first production endpoint"
          if old_evidence not in validator:
              raise SystemExit('CELAR_AI_V2_ROUTE_PATCH_MISSING_VALIDATOR_EVIDENCE_ANCHOR')
          validator = validator.replace(old_evidence, new_evidence, 1)
          validator_path.write_text(validator, encoding='utf-8')

          print('CELAR_AI_V2_ROUTE_SOURCE_PATCH=PASS')
          PY

      - name: Validate the production transformation and frontend build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd src/frontend/project-time-web
          npm ci --no-audit --no-fund
          node ./scripts/inject-celar-ai-runtime-rebrand.mjs
          grep -F "const path = '/api/celar-ai/v2/chat';" src/HelpAssistant.jsx
          if grep -Fq "const path = '/api/celar-ai/v1/chat';" src/HelpAssistant.jsx; then
            echo 'CELAR_AI_V1_CHAT_ROUTE_STILL_ACTIVE=FAILED'
            exit 1
          fi
          node ./scripts/validate-celar-ai-runtime-rebrand.mjs
          npm run build

      - name: Retain only the two intended source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          allowed_one='src/frontend/project-time-web/scripts/inject-celar-ai-runtime-rebrand.mjs'
          allowed_two='src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs'

          while IFS= read -r changed; do
            case "$changed" in
              "$allowed_one"|"$allowed_two") ;;
              *) git restore --worktree -- "$changed" ;;
            esac
          done < <(git diff --name-only)

          git clean -fd
          git diff --check
          git diff -- "$allowed_one" "$allowed_two"

          changed_count="$(git diff --name-only -- "$allowed_one" "$allowed_two" | wc -l | tr -d ' ')"
          test "$changed_count" = '2'

      - name: Remove temporary workflow and commit validated hotfix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email '244059331+ahmedadeyemi-cts@users.noreply.github.com'
          git rm .github/workflows/apply-celar-ai-v2-chat-route-hotfix.yml
          git add \
            src/frontend/project-time-web/scripts/inject-celar-ai-runtime-rebrand.mjs \
            src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs
          git diff --cached --check
          git commit -m 'Fix Celar AI system-version requests to use v2 intent routing [celar-v2-route-applied]'
          git push origin HEAD:fix/celar-ai-system-version-v2-route-20260803
