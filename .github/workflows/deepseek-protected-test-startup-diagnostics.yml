name: Diagnose Protected Test API startup
on:
  push:
    branches: [diagnostics/deepseek-protected-test-20260904]
    paths: [.github/workflows/deepseek-protected-test-startup-diagnostics.yml]
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: test
    timeout-minutes: 10
    steps:
      - name: Sign in to protected Test
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read Test revision and startup diagnostics
        shell: bash
        env:
          TEST_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          TEST_API_APP: ${{ vars.AZURE_API_APP }}
        run: |
          set -Eeuo pipefail
          [[ "$TEST_API_APP" == ca-phd-test-api-westus3 ]]
          [[ "$(az containerapp show -g "$TEST_RESOURCE_GROUP" -n "$TEST_API_APP" --query tags.environment -o tsv)" == test ]]
          az containerapp show -g "$TEST_RESOURCE_GROUP" -n "$TEST_API_APP" --query "properties.template.containers[0].env[?starts_with(name, 'PROJECTPULSE_AI_SECRET_ENCRYPTION')].{name:name,reference:secretRef}" -o json
          az containerapp show -g "$TEST_RESOURCE_GROUP" -n "$TEST_API_APP" --query "properties.configuration.secrets[].{name:name,keyVaultUrl:keyVaultUrl}" -o json
          az containerapp show -g "$TEST_RESOURCE_GROUP" -n "$TEST_API_APP" --query '{latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName,state:properties.provisioningState,mode:properties.configuration.activeRevisionsMode,traffic:properties.configuration.ingress.traffic,scale:properties.template.scale,probes:properties.template.containers[0].probes}' -o json
          az containerapp revision list -g "$TEST_RESOURCE_GROUP" -n "$TEST_API_APP" --query '[?properties.active].{name:name,state:properties.provisioningState,health:properties.healthState,running:properties.runningState,replicas:properties.replicas,traffic:properties.trafficWeight,image:properties.template.containers[0].image}' -o json
          mapfile -t revisions < <(az containerapp revision list -g "$TEST_RESOURCE_GROUP" -n "$TEST_API_APP" --query '[?properties.active].name' -o tsv)
          for revision in "${revisions[@]}"; do
            echo "DIAGNOSTIC_REVISION=$revision"
            az containerapp replica list -g "$TEST_RESOURCE_GROUP" -n "$TEST_API_APP" --revision "$revision" -o json || true
            mapfile -t replicas < <(az containerapp replica list -g "$TEST_RESOURCE_GROUP" -n "$TEST_API_APP" --revision "$revision" --query '[].name' -o tsv)
            : > /tmp/startup-console.jsonl
            for replica in "${replicas[@]}"; do
              az containerapp logs show -g "$TEST_RESOURCE_GROUP" -n "$TEST_API_APP" --revision "$revision" --replica "$replica" --container "$TEST_API_APP" --type console --tail 300 --format json >> /tmp/startup-console.jsonl 2>&1 || true
            done
            python3 - <<'PY'
          import re
          for line in open('/tmp/startup-console.jsonl'):
              if re.search(r'exception|error|failed|fatal|crit:| at ProjectTime| at Microsoft| at Npgsql| at System', line, re.I):
                  if re.search(r'password|bearer |api.?key|connection.?string|token=|authorization:', line, re.I):
                      print('SENSITIVE_STARTUP_LINE_OMITTED')
                  else:
                      print(line[:1800].rstrip())
          PY
          done
          az containerapp logs show -g "$TEST_RESOURCE_GROUP" -n "$TEST_API_APP" --type system --tail 80 --format json || true
          echo 'PROTECTED_TEST_DIAGNOSTICS_READ_ONLY=COMPLETE'
