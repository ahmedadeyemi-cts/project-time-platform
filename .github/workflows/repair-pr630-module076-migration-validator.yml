name: Repair PR 630 Module 076 Migration Validator

on:
  push:
    branches:
      - feature/ask-celar-ai-troubleshooting-defect-automation-20260810
    paths:
      - .github/workflows/repair-pr630-module076-migration-validator.yml

permissions:
  contents: write

concurrency:
  group: repair-pr630-module076-migration-validator
  cancel-in-progress: false

jobs:
  repair:
    name: Approve reviewed Migration 084 and remove this workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: 76343f84c99c36f74e963c9e37d858e68eb3b6e2
      HEAD_BRANCH: feature/ask-celar-ai-troubleshooting-defect-automation-20260810
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact repository, branch, and parent
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == 'ahmedadeyemi-cts/project-time-platform' ]]
          [[ "$GITHUB_REF_NAME" == "$HEAD_BRANCH" ]]
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Update bounded Module 076 validation contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          validator = Path('src/frontend/project-time-web/scripts/validate-module-076-defect-tracker.mjs')
          text = validator.read_text(encoding='utf-8')
          start_marker = 'const prohibitedArtifacts = ['
          end_marker = 'const failed = assertions.filter((assertion) => !assertion.condition);'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Module 076 legacy artifact-gate anchors were not found')
          existing = text[start:end]
          required = (
              "filesBelow(path.join(repositoryRoot, 'database'))",
              "filesBelow(path.join(repositoryRoot, 'deployment'))",
              'MODULE_076_NO_DATABASE_OR_DEPLOYMENT_ARTIFACT',
          )
          if not all(value in existing for value in required):
              raise SystemExit('Module 076 legacy artifact gate did not match the reviewed contract')

          replacement = r'''const approvedModule076DatabaseArtifacts = new Set([
  'database/migrations/084_module_076_celar_ai_defect_operations.sql',
  'database/rollback/084_module_076_celar_ai_defect_operations_rollback.sql'
]);
const prohibitedArtifacts = [
  ...filesBelow(path.join(repositoryRoot, 'database')),
  ...filesBelow(path.join(repositoryRoot, 'deployment'))
].filter((filePath) => {
  const relative = path.relative(repositoryRoot, filePath).replaceAll('\\', '/');
  if (!/(?:module[-_]?076|defect[-_]?tracker)/i.test(path.basename(filePath))) return false;
  return !approvedModule076DatabaseArtifacts.has(relative);
});

assertInvariant(
  'MODULE_076_NO_UNAPPROVED_DATABASE_OR_DEPLOYMENT_ARTIFACT',
  prohibitedArtifacts.length === 0
    && [...approvedModule076DatabaseArtifacts].every((relative) => fs.existsSync(path.join(repositoryRoot, relative))),
  prohibitedArtifacts.length === 0
    ? 'only the reviewed Migration 084 forward/rollback pair exists; no Module 076 deployment artifact exists'
    : prohibitedArtifacts.map((filePath) => path.relative(repositoryRoot, filePath)).join(', ')
);

'''
          validator.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          consolidated = Path('tests/validate-celar-ai-pr630-consolidated.mjs')
          text = consolidated.read_text(encoding='utf-8')
          approved_line = "  'src/frontend/project-time-web/scripts/validate-module-076-defect-tracker.mjs'"
          if approved_line not in text:
              anchor = "  'src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs'\n]);"
              updated = "  'src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs',\n" + approved_line + "\n]);"
              if text.count(anchor) != 1:
                  raise SystemExit('PR630 exact-source allowlist anchor did not match exactly')
              text = text.replace(anchor, updated)
          consolidated.write_text(text, encoding='utf-8')
          PY

          node src/frontend/project-time-web/scripts/validate-module-076-defect-tracker.mjs
          rm -- .github/workflows/repair-pr630-module076-migration-validator.yml
          node tests/validate-celar-ai-pr630-consolidated.mjs
          git diff --check
          git diff --exit-code -- . \
            ':!src/frontend/project-time-web/scripts/validate-module-076-defect-tracker.mjs' \
            ':!tests/validate-celar-ai-pr630-consolidated.mjs' \
            ':!.github/workflows/repair-pr630-module076-migration-validator.yml'

      - name: Commit bounded validator correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add -- \
            src/frontend/project-time-web/scripts/validate-module-076-defect-tracker.mjs \
            tests/validate-celar-ai-pr630-consolidated.mjs \
            .github/workflows/repair-pr630-module076-migration-validator.yml
          git commit -m 'Approve only Module 076 Migration 084 in validation'
          git push origin "HEAD:${HEAD_BRANCH}"
