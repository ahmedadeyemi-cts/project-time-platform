name: Publish systemwide View-As route continuity repair from PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-view-as-route-continuity-systemwide
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.event.pull_request.head.ref == 'fix/view-as-route-continuity-systemwide-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Extract and apply reviewed source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/bootstrap-view-as-route-continuity-systemwide.yml').read_text()
          start_marker = "      - name: Apply shared route authority repair\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Install frontend dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-view-as-route-continuity.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-view-as-route-continuity.sh

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci

      - name: Validate focused route continuity contracts
        working-directory: src/frontend/project-time-web
        run: |
          node scripts/validate-view-as-route-continuity.mjs
          node scripts/validate-module-availability.mjs
          node scripts/validate-modules-directory-page.mjs

      - name: Validate migration 082 and guarded rollback
        run: bash tests/test-view-as-route-authority-migration-082.sh

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Validate live route authority after production build
        working-directory: src/frontend/project-time-web
        run: |
          node scripts/validate-live-ui-route-authority.mjs
          node scripts/validate-view-as-route-continuity.mjs

      - name: Validate exact source boundary
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess

          production_files = {
              'src/frontend/project-time-web/src/module-availability-bridge.js',
              'src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx',
              'src/frontend/project-time-web/src/module-availability.css',
              'src/frontend/project-time-web/package.json',
              'src/frontend/project-time-web/package-lock.json',
              'src/frontend/project-time-web/scripts/validate-view-as-route-continuity.mjs',
              'database/migrations/082_view_as_route_authority_catalog.sql',
              'database/rollback/082_view_as_route_authority_catalog_rollback.sql',
              'tests/test-view-as-route-authority-migration-082.sh',
              'docs/security/VIEW-AS-ROUTE-CONTINUITY.md',
          }
          temporary_publishers = {
              '.github/workflows/bootstrap-view-as-route-continuity-systemwide.yml',
              '.github/workflows/bootstrap-view-as-route-continuity-pr.yml',
          }
          allowed = production_files | temporary_publishers
          required = production_files - {'src/frontend/project-time-web/package-lock.json'}

          tracked = subprocess.check_output(
              ['git', 'diff', '--name-only', '--relative', 'HEAD'],
              text=True,
          ).splitlines()
          untracked = subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard'],
              text=True,
          ).splitlines()
          changed = {
              path.strip()
              for path in [*tracked, *untracked]
              if path.strip()
          }

          print(f'VIEW_AS_ROUTE_CHANGED_FILES={sorted(changed)}')
          print(f'VIEW_AS_ROUTE_ALLOWED_FILES={sorted(allowed)}')
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected files after validation: {sorted(unexpected)}')
          missing = required - changed
          if missing:
              raise SystemExit(f'Expected files were not changed: {sorted(missing)}')
          PY

      - name: Commit validated repair and remove temporary publishers
        shell: bash
        run: |
          rm -f \
            .github/workflows/bootstrap-view-as-route-continuity-systemwide.yml \
            .github/workflows/bootstrap-view-as-route-continuity-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/frontend/project-time-web/src/module-availability-bridge.js \
            src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx \
            src/frontend/project-time-web/src/module-availability.css \
            src/frontend/project-time-web/package.json \
            src/frontend/project-time-web/package-lock.json \
            src/frontend/project-time-web/scripts/validate-view-as-route-continuity.mjs \
            database/migrations/082_view_as_route_authority_catalog.sql \
            database/rollback/082_view_as_route_authority_catalog_rollback.sql \
            tests/test-view-as-route-authority-migration-082.sh \
            docs/security/VIEW-AS-ROUTE-CONTINUITY.md \
            .github/workflows/bootstrap-view-as-route-continuity-systemwide.yml \
            .github/workflows/bootstrap-view-as-route-continuity-pr.yml
          git commit -m "Fix systemwide View-As route continuity"
          git push origin HEAD:fix/view-as-route-continuity-systemwide-20260808
