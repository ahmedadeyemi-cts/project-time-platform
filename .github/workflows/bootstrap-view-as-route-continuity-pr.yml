name: Publish systemwide View-As route continuity repair from PR

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-view-as-route-continuity-systemwide
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.event.pull_request.head.ref == 'fix/view-as-route-continuity-systemwide-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Extract and apply reviewed source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/bootstrap-view-as-route-continuity-systemwide.yml').read_text()
          start_marker = "      - name: Apply shared route authority repair\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Install frontend dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-view-as-route-continuity.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-view-as-route-continuity.sh

      - name: Tighten migration provenance and rollback coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          migration_path = Path('database/migrations/082_view_as_route_authority_catalog.sql')
          migration = migration_path.read_text()
          pattern = re.compile(
              r"SELECT\s+module_code,\s+FALSE\s+"
              r"FROM\s+unnest\(ARRAY\['001A','031','032','033','081','082'\]\)\s+AS\s+module_code\s+"
              r"WHERE\s+NOT\s+EXISTS\s*\(\s*"
              r"SELECT\s+1\s+FROM\s+scoped_role_policy_modules\s+existing\s+"
              r"WHERE\s+existing\.module_code\s*=\s*module_code\s*\)",
              re.DOTALL,
          )
          replacement = """SELECT desired.module_code, FALSE
          FROM unnest(ARRAY['001A','031','032','033','081','082']) AS desired(module_code)
          WHERE NOT EXISTS (
              SELECT 1 FROM scoped_role_policy_modules existing
              WHERE existing.module_code = desired.module_code
          )"""
          migration, count = pattern.subn(replacement, migration, count=1)
          if count != 1:
              raise SystemExit(f'Expected one migration snapshot alias target, found {count}')
          migration_path.write_text(migration)

          test_path = Path('tests/test-view-as-route-authority-migration-082.sh')
          test = test_path.read_text()
          marker = '''assert_eq 6 "$(value "SELECT COUNT(*) FROM projectpulse_082_route_catalog_previous")" rollback_snapshot_complete
'''
          addition = marker + '''assert_eq 5 "$(value "SELECT COUNT(*) FROM projectpulse_082_route_catalog_previous WHERE existed_before=FALSE")" introduced_snapshot_count
assert_eq t "$(value "SELECT existed_before FROM projectpulse_082_route_catalog_previous WHERE module_code='033'")" existing_snapshot_identity
assert_eq f "$(value "SELECT existed_before FROM projectpulse_082_route_catalog_previous WHERE module_code='031'")" introduced_snapshot_identity
'''
          if test.count(marker) != 1:
              raise SystemExit(f'Expected one rollback snapshot assertion marker, found {test.count(marker)}')
          test_path.write_text(test.replace(marker, addition, 1))
          PY

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci

      - name: Validate focused route continuity contracts
        working-directory: src/frontend/project-time-web
        run: |
          node scripts/validate-view-as-route-continuity.mjs
          node scripts/validate-module-availability.mjs
          node scripts/validate-modules-directory-page.mjs

      - name: Validate migration 082 and guarded rollback
        run: bash tests/test-view-as-route-authority-migration-082.sh

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Validate live route authority after production build
        working-directory: src/frontend/project-time-web
        run: |
          node scripts/validate-live-ui-route-authority.mjs
          node scripts/validate-view-as-route-continuity.mjs

      - name: Validate exact source boundary
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/frontend/project-time-web/src/module-availability-bridge.js',
              'src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx',
              'src/frontend/project-time-web/src/module-availability.css',
              'src/frontend/project-time-web/package.json',
              'src/frontend/project-time-web/scripts/validate-view-as-route-continuity.mjs',
              'database/migrations/082_view_as_route_authority_catalog.sql',
              'database/rollback/082_view_as_route_authority_catalog_rollback.sql',
              'tests/test-view-as-route-authority-migration-082.sh',
              'docs/security/VIEW-AS-ROUTE-CONTINUITY.md',
              '.github/workflows/bootstrap-view-as-route-continuity-systemwide.yml',
              '.github/workflows/bootstrap-view-as-route-continuity-pr.yml',
              '.github/workflows/bootstrap-view-as-route-continuity-final.yml',
              '.github/view-as-route-continuity-trigger.txt',
              '.github/view-as-route-continuity-trigger-2.txt',
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
              if len(line) >= 4
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected files after validation: {sorted(unexpected)}')
          required = {
              'src/frontend/project-time-web/src/module-availability-bridge.js',
              'src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx',
              'src/frontend/project-time-web/src/module-availability.css',
              'src/frontend/project-time-web/package.json',
              'src/frontend/project-time-web/scripts/validate-view-as-route-continuity.mjs',
              'database/migrations/082_view_as_route_authority_catalog.sql',
              'database/rollback/082_view_as_route_authority_catalog_rollback.sql',
              'tests/test-view-as-route-authority-migration-082.sh',
              'docs/security/VIEW-AS-ROUTE-CONTINUITY.md',
          }
          missing = required - changed
          if missing:
              raise SystemExit(f'Expected files were not changed: {sorted(missing)}')
          PY

      - name: Commit validated repair and remove temporary controls
        shell: bash
        run: |
          rm -f \
            .github/workflows/bootstrap-view-as-route-continuity-systemwide.yml \
            .github/workflows/bootstrap-view-as-route-continuity-pr.yml \
            .github/workflows/bootstrap-view-as-route-continuity-final.yml \
            .github/view-as-route-continuity-trigger.txt \
            .github/view-as-route-continuity-trigger-2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/frontend/project-time-web/src/module-availability-bridge.js \
            src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx \
            src/frontend/project-time-web/src/module-availability.css \
            src/frontend/project-time-web/package.json \
            src/frontend/project-time-web/scripts/validate-view-as-route-continuity.mjs \
            database/migrations/082_view_as_route_authority_catalog.sql \
            database/rollback/082_view_as_route_authority_catalog_rollback.sql \
            tests/test-view-as-route-authority-migration-082.sh \
            docs/security/VIEW-AS-ROUTE-CONTINUITY.md \
            .github/workflows/bootstrap-view-as-route-continuity-systemwide.yml \
            .github/workflows/bootstrap-view-as-route-continuity-pr.yml \
            .github/workflows/bootstrap-view-as-route-continuity-final.yml \
            .github/view-as-route-continuity-trigger.txt \
            .github/view-as-route-continuity-trigger-2.txt
          git commit -m "Fix systemwide View-As route continuity"
          git push origin HEAD:fix/view-as-route-continuity-systemwide-20260808
