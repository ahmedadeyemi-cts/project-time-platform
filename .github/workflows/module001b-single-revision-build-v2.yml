name: Validate Module 001B Single-Revision Repair V2

on:
  push:
    branches:
      - fix/module001b-single-revision-convergence-20260830
    paths:
      - '.github/workflows/module001b-single-revision-build-v2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/module001b-single-revision-convergence-20260830
          fetch-depth: 0
      - name: Apply validate and publish target blob
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"
          bash -n scripts/release-test/run-assigned-work-protected-test-uat.sh
          grep -Fq 'module001b_wait_single_revision_converged() {' scripts/release-test/run-assigned-work-protected-test-uat.sh
          grep -Fq 'MODULE001B_SINGLE_REVISION_CONVERGED' scripts/release-test/run-assigned-work-protected-test-uat.sh
          if grep -Fq 'az containerapp ingress traffic set' scripts/release-test/run-assigned-work-protected-test-uat.sh; then exit 1; fi
          if grep -Fq -- '--revision-weight' scripts/release-test/run-assigned-work-protected-test-uat.sh; then exit 1; fi
          git diff --check
          SCRIPT_B64="$(base64 -w0 scripts/release-test/run-assigned-work-protected-test-uat.sh)"
          SCRIPT_SHA="$(jq -n --arg content "$SCRIPT_B64" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq '.sha')"
          echo "MODULE001B_SINGLE_REVISION_SCRIPT_BLOB_SHA=$SCRIPT_SHA"
          echo 'MODULE001B_SINGLE_REVISION_PATCH_VALIDATED=true'
