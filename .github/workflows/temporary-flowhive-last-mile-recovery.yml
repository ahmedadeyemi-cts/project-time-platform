name: Temporary FlowHive Last-Mile Recovery

on:
  push:
    branches:
      - feature/project-planning-collaboration-access-20260818
    paths:
      - '.github/workflows/temporary-flowhive-last-mile-recovery.yml'

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: temporary-flowhive-last-mile-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out control branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preserve any deterministic repair scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/flowhive-recovery"
          for file in \
            .github/scripts/temporary_apply_flowhive_authoritative_repair.py \
            .github/scripts/temporary_finalize_flowhive_authoritative_repair.py \
            .github/scripts/temporary_flowhive_final_quality.py; do
            [[ ! -f "$file" ]] || install -m 0600 "$file" "$RUNNER_TEMP/flowhive-recovery/$(basename "$file")"
          done
          for file in "$RUNNER_TEMP/flowhive-recovery"/temporary_*authoritative_repair.py; do
            [[ -f "$file" ]] || continue
            sed -i 's|ROOT = Path(__file__).resolve().parents\[2\]|ROOT = Path.cwd()|' "$file"
          done

      - name: Wait for older FlowHive automation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 240); do
            ACTIVE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=feature/project-planning-collaboration-access-20260818&per_page=100" \
              --jq '[.workflow_runs[] | select(.id != '${{ github.run_id }}') | select(.name | startswith("Temporary FlowHive")) | select(.status != "completed")] | length')"
            echo "OLDER_ACTIVE_FLOWHIVE_RUNS=$ACTIVE"
            [[ "$ACTIVE" == 0 ]] && exit 0
            sleep 15
          done
          echo 'ERROR: Older FlowHive automation remained active too long.' >&2
          exit 1

      - name: Resolve main completion and recovery source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          STATUS_SUCCESS="$(gh api "repos/$GITHUB_REPOSITORY/commits/$MAIN_SHA/status" \
            --jq 'any(.statuses[]; .context == "flowhive/protected-uat-end-to-end" and .state == "success")')"
          git checkout --detach "$MAIN_SHA"
          SOURCE_READY=true
          for file in \
            src/backend/ProjectTime.Api/Modules/ProjectFlowHiveAiPlannerOrchestrationModule.cs \
            src/backend/ProjectTime.Api/Modules/CelarAiTransientFailureMiddleware.cs \
            scripts/release-test/build-and-run-flowhive-authority-migration-094-job.sh; do
            [[ -f "$file" ]] || SOURCE_READY=false
          done
          grep -R -Fq 'AI Planning Workspace' src/frontend/project-time-web/src 2>/dev/null || SOURCE_READY=false
          grep -R -Fq 'ProjectFlowHivePlanMilestoneInput' src/backend/ProjectTime.Api 2>/dev/null || SOURCE_READY=false
          grep -Fq 'FLOWHIVE_AUTHENTICATED_AI_PLANNER_UAT' scripts/release-test/verify-runtime.mjs 2>/dev/null || SOURCE_READY=false
          if [[ "$SOURCE_READY" == true && "$STATUS_SUCCESS" == true ]]; then
            echo 'already_complete=true' >> "$GITHUB_OUTPUT"
            echo "target_branch=" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
            echo 'FLOWHIVE_ALREADY_COMPLETE=TRUE'
            exit 0
          fi

          OPEN_JSON="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search 'FlowHive in:title' --json number,headRefName,headRefOid,updatedAt \
            --jq 'sort_by(.updatedAt) | reverse | .[0] // {}')"
          OPEN_PR="$(jq -r '.number // empty' <<<"$OPEN_JSON")"
          OPEN_BRANCH="$(jq -r '.headRefName // empty' <<<"$OPEN_JSON")"
          if [[ "$OPEN_PR" =~ ^[0-9]+$ && -n "$OPEN_BRANCH" ]]; then
            git fetch --no-tags origin "$OPEN_BRANCH"
            git checkout -B "$OPEN_BRANCH" "origin/$OPEN_BRANCH"
            TARGET_BRANCH="$OPEN_BRANCH"
            PR_NUMBER="$OPEN_PR"
          else
            TARGET_BRANCH='fix/flowhive-last-mile-recovery-20260819'
            git checkout -B "$TARGET_BRANCH" origin/main
            PR_NUMBER=''
          fi
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-edit origin/main
          fi
          echo 'already_complete=false' >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "FLOWHIVE_RECOVERY_TARGET=$TARGET_BRANCH PR=${PR_NUMBER:-new}"

      - name: Stop when completion is already proven
        if: steps.source.outputs.already_complete == 'true'
        run: |
          echo 'FLOWHIVE_TERMINAL_COMPLETION_ALREADY_PROVEN=TRUE'
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Set up Node 22
        if: steps.source.outputs.already_complete != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET 10
        if: steps.source.outputs.already_complete != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Apply missing deterministic repair layers
        if: steps.source.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f src/backend/ProjectTime.Api/Modules/ProjectFlowHiveAiPlannerOrchestrationModule.cs ]]; then
            test -f "$RUNNER_TEMP/flowhive-recovery/temporary_apply_flowhive_authoritative_repair.py"
            test -f "$RUNNER_TEMP/flowhive-recovery/temporary_finalize_flowhive_authoritative_repair.py"
            python3 "$RUNNER_TEMP/flowhive-recovery/temporary_apply_flowhive_authoritative_repair.py"
            python3 "$RUNNER_TEMP/flowhive-recovery/temporary_finalize_flowhive_authoritative_repair.py"
          fi
          if ! grep -R -Fq 'ProjectFlowHivePlanMilestoneInput' src/backend/ProjectTime.Api; then
            test -f "$RUNNER_TEMP/flowhive-recovery/temporary_flowhive_final_quality.py"
            python3 "$RUNNER_TEMP/flowhive-recovery/temporary_flowhive_final_quality.py"
          fi

      - name: Apply stable integration corrections
        if: steps.source.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          def read(path): return Path(path).read_text()
          def write(path,value): Path(path).write_text(value)
          path='src/backend/ProjectTime.Api/Modules/ProjectFlowHiveAiPlannerOrchestrationModule.cs'
          source=read(path)
          source=source.replace('ProjectPlanningAccess access,','PlannerAccess access,')
          source=source.replace('access.ActualUserId ?? Guid.Empty','access.ActualUserId')
          source=source.replace('access.EffectiveUserId ?? Guid.Empty','access.EffectiveUserId')
          source=source.replace('ProjectPlanningAccess? Access,','PlannerAccess? Access,')
          source=source.replace('        return new OpenOutcome(connection, access, null);','''        return new OpenOutcome(
            connection,
            new PlannerAccess(access.ActualUserId ?? Guid.Empty, access.EffectiveUserId ?? Guid.Empty),
            null);''')
          if 'private sealed record PlannerAccess(' not in source:
              source=source.replace('    private sealed record OpenOutcome(','''    private sealed record PlannerAccess(Guid ActualUserId, Guid EffectiveUserId);

    private sealed record OpenOutcome(''',1)
          source=source.replace('                reader.GetInt32(14),\n                reader.GetInt32(15)));','                reader.GetInt32(14),\n                reader.GetInt32(15)) { ProjectId = projectId });')
          source=source.replace('                           OR c.citation_anchor ILIKE \'%service%\'))','''                           OR c.citation_anchor ILIKE '%service%'
                           OR c.chunk_text ILIKE '%scope of services%'
                           OR c.chunk_text ILIKE '%in scope%'
                           OR c.chunk_text ILIKE '%out of scope%'
                           OR c.chunk_text ILIKE '%deliverable%'
                           OR c.chunk_text ILIKE '%responsibilit%'))''')
          source=source.replace('''            await reader.ReadAsync(cancellationToken);
            if (!reader.GetBoolean(0) || !reader.GetBoolean(1))
            {
                await connection.DisposeAsync();''','''            await reader.ReadAsync(cancellationToken);
            var migrationReady = reader.GetBoolean(0);
            var runTableReady = reader.GetBoolean(1);
            await reader.CloseAsync();
            if (!migrationReady || !runTableReady)
            {
                await connection.DisposeAsync();''')
          write(path,source)
          path='src/backend/ProjectTime.Api/Modules/ProjectFlowHiveDetailedPlanBuilder.cs'
          source=re.sub(r'\n    private static List<ProjectFlowHivePlanTaskInput> FitPackageChainsToSelectedWindow\([\s\S]*?\n    private static string PackageOrdinal\([\s\S]*?\n    }\n','\n',read(path),count=1)
          write(path,source)
          path='scripts/release-test/verify-runtime.mjs'
          source=re.sub(r'const expectedSource = "[0-9a-f]{40}";','const expectedSource = (process.env.SOURCE_SHA || "").trim();',read(path),count=1)
          write(path,source)
          path='tests/validate-celar-ai-pr630-consolidated.mjs'
          write(path,read(path).replace('/api/project-flowhive/projects/${selectedProjectId}/ai-planner/runs','/api/project-flowhive/ai/production-generate'))
          PY
          chmod 0755 scripts/release-test/*.sh

      - name: Remove temporary artifacts
        if: steps.source.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/scripts/temporary*.py .github/workflows/temporary-flowhive-*.yml .github/flowhive-pr734-finalizer-dispatch.txt
          rm -rf .flowhive-repair tmp/flowhive-repair

      - name: Run the complete validation matrix
        if: steps.source.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -R -Fq '/ai-planner/runs' src/backend/ProjectTime.Api src/frontend/project-time-web/src
          grep -R -Fq 'AI Planning Workspace' src/frontend/project-time-web/src
          grep -R -Fq 'ProjectFlowHivePlanMilestoneInput' src/backend/ProjectTime.Api
          grep -Fq 'FLOWHIVE_AUTHENTICATED_AI_PLANNER_UAT' scripts/release-test/verify-runtime.mjs
          ! grep -Fq 'FitPackageChainsToSelectedWindow' src/backend/ProjectTime.Api/Modules/ProjectFlowHiveDetailedPlanBuilder.cs
          ! grep -Fq 'window.fetch = async' src/frontend/project-time-web/src/flowhive-sow-evidence-autoadmission.js
          bash -n scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          bash -n scripts/release-test/build-and-run-flowhive-authority-migration-094-job.sh
          bash -n scripts/release-test/run-flowhive-authority-migration-094-job.sh
          bash -n scripts/release-test/build-and-run-project-planning-collaboration-migration-job.sh
          bash -n scripts/release-test/run-project-planning-collaboration-migration-job.sh
          node tests/validate-flowhive-sow-evidence-autoadmission.mjs
          node tests/validate-project-planning-collaboration-access.mjs
          node tests/validate-project-planning-collaboration.mjs
          node tests/validate-celar-ai-pr630-consolidated.mjs
          node tests/validate-systemwide-enterprise-reliability.mjs
          node tests/validate-systemwide-image-build-controller.mjs
          node src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs
          python3 scripts/security/validate-repository-security-posture.py
          bash tests/test-flowhive-canonical-sow-authority-migration-094.sh
          bash tests/test-project-planning-collaboration-migration-095.sh
          dotnet run --project tests/FlowHiveDetailedPlannerTests/FlowHiveDetailedPlannerTests.csproj --configuration Release
          dotnet run --project tests/FlowHiveSowFreshnessTests/FlowHiveSowFreshnessTests.csproj --configuration Release
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          bash tests/test-projectpulse-api-startup.sh
          (cd src/frontend/project-time-web && npm ci --no-audit --no-fund && npm audit --audit-level=high && npm run build)
          git diff --check origin/main

      - name: Publish recovered source and resolve PR
        if: steps.source.outputs.already_complete != 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.source.outputs.target_branch }}
          EXISTING_PR: ${{ steps.source.outputs.pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'ERROR: Recovery produced no publishable diff.' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete FlowHive last-mile production-quality recovery'
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push -u origin "HEAD:$TARGET_BRANCH"
          PR_NUMBER="$EXISTING_PR"
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$TARGET_BRANCH" \
              --title 'Complete FlowHive last-mile production-quality recovery' \
              --body 'Completes the server-owned FlowHive AI Planner, source-backed milestones/resources, uncompressed scheduling, Migration 094/095 Protected-Test release, and authenticated FlowHive/Celar UAT. No Production mutation.' --draft
            PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --state open --json number --jq '.[0].number')"
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Wait for green exact-head checks and merge
        if: steps.source.outputs.already_complete != 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.publish.outputs.release_sha }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          READY=0
          for attempt in $(seq 1 240); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_SHA&per_page=100" > "$RUNNER_TEMP/runs.json"
            BAD="$(jq '[.workflow_runs[] | select(.status == "completed") | select((.conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped") | not)] | length' "$RUNNER_TEMP/runs.json")"
            [[ "$BAD" == 0 ]] || exit 1
            TOTAL="$(jq '.workflow_runs | length' "$RUNNER_TEMP/runs.json")"
            PENDING="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' "$RUNNER_TEMP/runs.json")"
            if (( TOTAL > 0 )) && [[ "$PENDING" == 0 ]]; then READY=1; break; fi
            sleep 20
          done
          (( READY == 1 )) || exit 1
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
          RESPONSE="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" -f sha="$RELEASE_SHA" -f merge_method='merge' -f commit_title='Complete FlowHive last-mile production-quality recovery (#'$PR_NUMBER')' -f commit_message='Merge after exact-head source, migration, security, API, and frontend validation. Protected-Test authenticated UAT follows; Production mutation remains prohibited.')"
          echo "$RESPONSE" | jq -e '.merged == true and (.sha | length == 40)' >/dev/null
          echo "merge_sha=$(echo "$RESPONSE" | jq -r '.sha')" >> "$GITHUB_OUTPUT"

      - name: Resolve exact release SHA
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Dispatch or reuse exact Protected-Test deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.release.outputs.main_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/projectpulse-deploy-test.yml/runs?branch=main&per_page=50" --jq --arg sha "$MAIN_SHA" '.workflow_runs | map(select(.head_sha == $sha)) | sort_by(.created_at) | last | .id // empty')"
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            gh workflow run projectpulse-deploy-test.yml --repo "$GITHUB_REPOSITORY" --ref main
            for _ in $(seq 1 60); do
              RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/projectpulse-deploy-test.yml/runs?branch=main&per_page=50" --jq --arg sha "$MAIN_SHA" '.workflow_runs | map(select(.head_sha == $sha)) | sort_by(.created_at) | last | .id // empty')"
              [[ "$RUN_ID" =~ ^[0-9]+$ ]] && break
              sleep 5
            done
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Require Protected-Test success and publish terminal status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.deployment.outputs.run_id }}
          MAIN_SHA: ${{ steps.release.outputs.main_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          CONCLUSION=''
          for _ in $(seq 1 480); do
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')"
            CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion // empty')"
            echo "Protected-Test run $RUN_ID: status=$STATUS conclusion=${CONCLUSION:-pending}"
            [[ "$STATUS" == completed ]] && break
            sleep 30
          done
          STATE=success
          DESCRIPTION='Migrations 094/095, FlowHive AI Planner, and Celar authenticated UAT passed.'
          if [[ "$CONCLUSION" != success ]]; then
            STATE=failure
            DESCRIPTION='FlowHive Protected UAT deployment or authenticated UAT failed.'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$MAIN_SHA" \
            -f state="$STATE" -f context='flowhive/protected-uat-end-to-end' \
            -f description="$DESCRIPTION" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          [[ "$CONCLUSION" == success ]] || { gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed || true; exit 1; }
          echo 'PROTECTED_TEST_DEPLOYMENT=SUCCESS'
          echo 'MIGRATION_094=APPLIED_AND_VERIFIED'
          echo 'MIGRATION_095=APPLIED_AND_VERIFIED'
          echo 'FLOWHIVE_AUTHENTICATED_AI_PLANNER_UAT=SUCCESS'
          echo 'CELAR_AI_AUTHENTICATED_UAT=SUCCESS'
          echo 'PRODUCTION_MUTATION=NONE'
