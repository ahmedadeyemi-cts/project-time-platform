name: Normalize Pulse AI Private RAG Source

on:
  push:
    branches:
      - feature/module-011-private-rag-orchestration-20260729
    paths:
      - .github/workflows/pulse-ai-private-rag-source-normalizer.yml

permissions:
  contents: write

concurrency:
  group: pulse-ai-private-rag-source-normalizer
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/module-011-private-rag-orchestration-20260729
      - name: Register RAG endpoints, normalize citation persistence, and remove this workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          module = Path('src/backend/ProjectTime.Api/Modules/PulseAiPrivateRuntimeModule.cs')
          text = module.read_text()
          marker = '''        endpoints.MapPost(
              "/api/pulse-ai/v1/documents/runtime/jobs/{jobId:guid}/retry",
              (Func<Guid, PulseAiRetryDocumentJobRequest, HttpContext, PulseAiPrivateDocumentRuntimeService, CancellationToken, Task<IResult>>)RetryAsync);
          return endpoints;'''
          replacement = '''        endpoints.MapPost(
              "/api/pulse-ai/v1/documents/runtime/jobs/{jobId:guid}/retry",
              (Func<Guid, PulseAiRetryDocumentJobRequest, HttpContext, PulseAiPrivateDocumentRuntimeService, CancellationToken, Task<IResult>>)RetryAsync);
          endpoints.MapPulseAiPrivateRagEndpoints();
          return endpoints;'''
          if text.count(marker) != 1:
              raise SystemExit('Expected private runtime endpoint registration marker exactly once.')
          module.write_text(text.replace(marker, replacement))

          repo = Path('src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagRepository.cs')
          text = repo.read_text()
          text = re.sub(
              r'''(?ms)\s*var chunk = citation\.CitationId > 0\s*\? query\.CorrelationId\s*:\s*string\.Empty;\s*''',
              '\n',
              text,
              count=1
          )
          old_where = '''                    WHERE ch.chunk_id = @chunk_id
                      ON CONFLICT (pulse_ai_answer_run_id, rank_order) DO NOTHING;'''
          new_where = '''                    WHERE ch.project_intake_document_id = @document_id
                      AND ch.source_sha256 = @source_sha256
                      AND ch.text_sha256 = @text_sha256
                      AND ch.is_active = TRUE
                    ORDER BY ch.processed_at DESC
                    LIMIT 1
                    ON CONFLICT (pulse_ai_answer_run_id, rank_order) DO NOTHING;'''
          if text.count(old_where) != 1:
              raise SystemExit('Expected citation chunk lookup exactly once.')
          text = text.replace(old_where, new_where)
          old_param = '''                citationCommand.Parameters.AddWithValue("combined_score", citation.RelevanceScore);
                  citationCommand.Parameters.AddWithValue("chunk_id", FindChunkId(citation, answer));
                  await citationCommand.ExecuteNonQueryAsync(cancellationToken);
                  rank++;
                  _ = chunk;'''
          new_param = '''                citationCommand.Parameters.AddWithValue("combined_score", citation.RelevanceScore);
                  citationCommand.Parameters.AddWithValue("document_id", citation.DocumentId);
                  citationCommand.Parameters.AddWithValue("source_sha256", citation.SourceSha256);
                  citationCommand.Parameters.AddWithValue("text_sha256", citation.TextSha256);
                  await citationCommand.ExecuteNonQueryAsync(cancellationToken);
                  rank++;'''
          if text.count(old_param) != 1:
              raise SystemExit('Expected citation parameter block exactly once.')
          repo.write_text(text.replace(old_param, new_param))
          PY
          grep -Fq 'endpoints.MapPulseAiPrivateRagEndpoints();' src/backend/ProjectTime.Api/Modules/PulseAiPrivateRuntimeModule.cs
          grep -Fq 'ch.project_intake_document_id = @document_id' src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagRepository.cs
          ! grep -Fq 'FindChunkId(citation, answer)' src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagRepository.cs
          rm -f .github/workflows/pulse-ai-private-rag-source-normalizer.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/backend/ProjectTime.Api/Modules/PulseAiPrivateRuntimeModule.cs src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagRepository.cs .github/workflows/pulse-ai-private-rag-source-normalizer.yml
          git commit -m 'Register private RAG endpoints and normalize citation persistence'
          git push origin HEAD:feature/module-011-private-rag-orchestration-20260729
