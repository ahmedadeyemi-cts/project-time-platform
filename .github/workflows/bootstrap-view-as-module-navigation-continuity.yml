name: Build View-As module navigation continuity repair

on:
  push:
    branches:
      - fix/view-as-module-navigation-continuity-20260808

permissions:
  contents: write

concurrency:
  group: view-as-module-navigation-continuity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/view-as-module-navigation-continuity-20260808
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Apply shared View-As navigation repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          def replace_once(relative, old, new):
              path = root / relative
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1))

          policy = r'''function asArray(value) {
            if (Array.isArray(value)) return value;
            if (value && typeof value !== 'string' && typeof value[Symbol.iterator] === 'function') {
              return [...value];
            }
            return value == null ? [] : [value];
          }

          function canonicalRoleCode(value) {
            return String(value || '')
              .trim()
              .toUpperCase()
              .replace(/[^A-Z0-9]+/g, '_')
              .replace(/^_+|_+$/g, '');
          }

          function canonicalModuleCode(value) {
            return String(value || '')
              .trim()
              .toUpperCase()
              .replace(/[^A-Z0-9]+/g, '');
          }

          function moduleCodeOf(value) {
            return canonicalModuleCode(
              value?.moduleCode
              ?? value?.ModuleCode
              ?? value?.moduleNumber
              ?? value?.ModuleNumber
              ?? value
            );
          }

          function roleCodeOf(value) {
            return canonicalRoleCode(value?.roleCode ?? value?.RoleCode ?? value);
          }

          function sorted(values) {
            return [...new Set(values)].sort((left, right) =>
              left.localeCompare(right, undefined, { numeric: true, sensitivity: 'base' })
            );
          }

          function isActiveModule(module) {
            const value = module?.isActive ?? module?.IsActive;
            return value !== false && String(value ?? 'true').toLowerCase() !== 'false';
          }

          export function resolveModuleNavigationAccess({
            applicationModules = [],
            dynamicModules = [],
            grants = [],
            legacyFallback = [],
            actorRoleCodes = [],
            actualSessionPermanentFullControl = false,
            retiredModuleNumbers = []
          } = {}) {
            const applicationModuleNumbers = new Set(
              asArray(applicationModules).map(moduleCodeOf).filter(Boolean)
            );
            const activeDynamicModuleNumbers = new Set();
            const inactiveDynamicModuleNumbers = new Set();
            for (const module of asArray(dynamicModules)) {
              const moduleCode = moduleCodeOf(module);
              if (!moduleCode) continue;
              (isActiveModule(module)
                ? activeDynamicModuleNumbers
                : inactiveDynamicModuleNumbers).add(moduleCode);
            }

            const retired = new Set(
              asArray(retiredModuleNumbers).map(moduleCodeOf).filter(Boolean)
            );
            const roleSet = new Set(
              asArray(actorRoleCodes).map(roleCodeOf).filter(Boolean)
            );
            const explicitDeniedModuleNumbers = new Set();
            const explicitGrantedModuleNumbers = new Set();

            if (!actualSessionPermanentFullControl) {
              for (const grant of asArray(grants)) {
                if (!roleSet.has(roleCodeOf(grant))) continue;
                if (canonicalRoleCode(grant?.actionCode ?? grant?.ActionCode) !== 'MODULE_ACCESS') continue;
                const moduleCode = moduleCodeOf(grant);
                if (!moduleCode) continue;
                const effect = canonicalRoleCode(
                  grant?.grantEffect
                  ?? grant?.GrantEffect
                  ?? grant?.effect
                  ?? grant?.Effect
                );
                if (effect === 'DENY' || grant?.explicitDeny === true || grant?.ExplicitDeny === true) {
                  explicitDeniedModuleNumbers.add(moduleCode);
                  continue;
                }
                if (effect === 'GRANT' || effect === 'ALLOW' || grant?.granted === true || grant?.Granted === true) {
                  explicitGrantedModuleNumbers.add(moduleCode);
                }
              }
            }

            const legacyFallbackModuleNumbers = new Set();
            for (const fallback of asArray(legacyFallback)) {
              if (!roleSet.has(roleCodeOf(fallback))) continue;
              const moduleCode = moduleCodeOf(fallback);
              if (moduleCode) legacyFallbackModuleNumbers.add(moduleCode);
            }

            const unregisteredLegacyModuleNumbers = new Set(
              [...applicationModuleNumbers].filter((moduleCode) =>
                !activeDynamicModuleNumbers.has(moduleCode)
                && !inactiveDynamicModuleNumbers.has(moduleCode)
                && !retired.has(moduleCode)
              )
            );

            const deniedModuleNumbers = new Set(retired);
            if (!actualSessionPermanentFullControl) {
              for (const moduleCode of inactiveDynamicModuleNumbers) deniedModuleNumbers.add(moduleCode);
              for (const moduleCode of explicitDeniedModuleNumbers) deniedModuleNumbers.add(moduleCode);
            }

            return {
              deniedModuleNumbers: sorted(deniedModuleNumbers),
              explicitDeniedModuleNumbers: sorted(explicitDeniedModuleNumbers),
              explicitGrantedModuleNumbers: sorted(explicitGrantedModuleNumbers),
              activeDynamicModuleNumbers: sorted(activeDynamicModuleNumbers),
              inactiveDynamicModuleNumbers: sorted(inactiveDynamicModuleNumbers),
              legacyFallbackModuleNumbers: sorted(legacyFallbackModuleNumbers),
              unregisteredLegacyModuleNumbers: sorted(unregisteredLegacyModuleNumbers),
              applicationModuleNumbers: sorted(applicationModuleNumbers),
              actualSessionPermanentFullControl: Boolean(actualSessionPermanentFullControl)
            };
          }
          '''
          (root / 'src/frontend/project-time-web/src/module-navigation-access-policy.js').write_text(policy)

          validator = r'''import { readFileSync } from 'node:fs';
          import { dirname, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import {
            PROJECTPULSE_MODULES,
            RETIRED_PROJECTPULSE_MODULES,
            moduleForRoute
          } from '../src/module-availability-registry.js';
          import { resolveModuleNavigationAccess } from '../src/module-navigation-access-policy.js';

          const scriptDirectory = dirname(fileURLToPath(import.meta.url));
          const repositoryRoot = resolve(scriptDirectory, '../../../..');
          const read = (relative) => readFileSync(resolve(repositoryRoot, relative), 'utf8');
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          const applicationCodes = PROJECTPULSE_MODULES.map((module) => module.moduleNumber.toUpperCase());
          const retiredCodes = RETIRED_PROJECTPULSE_MODULES.map((module) => module.moduleNumber.toUpperCase());
          assert(applicationCodes.length > 50, 'The complete application module registry must be evaluated.');
          assert(new Set(applicationCodes).size === applicationCodes.length, 'Application module numbers must be unique.');

          for (const module of PROJECTPULSE_MODULES) {
            const resolved = moduleForRoute(`#${module.route}`);
            assert(resolved?.moduleNumber === module.moduleNumber, `Route ${module.route} must resolve to Module ${module.moduleNumber}.`);
          }

          const dynamicModules = [
            { moduleCode: '001', isActive: true },
            { moduleCode: '002', isActive: true },
            { moduleCode: '019', isActive: true },
            { moduleCode: '030', isActive: true },
            { moduleCode: '033', isActive: true },
            { moduleCode: '066', isActive: true },
            { moduleCode: '081', isActive: false }
          ];
          const grants = [
            { roleCode: 'ENGINEER', moduleCode: '001', actionCode: 'MODULE_ACCESS', grantEffect: 'GRANT' },
            { roleCode: 'ENGINEER', moduleCode: '030', actionCode: 'MODULE_ACCESS', grantEffect: 'DENY' },
            { roleCode: 'ENGINEER', moduleCode: '081', actionCode: 'MODULE_ACCESS', grantEffect: 'GRANT' },
            { roleCode: 'PROJECT_MANAGEMENT', moduleCode: '030', actionCode: 'MODULE_ACCESS', grantEffect: 'GRANT' }
          ];
          const legacyFallback = ['002', '019', '033', '066'].map((moduleCode) => ({
            roleCode: 'ENGINEER',
            moduleCode,
            actionCode: 'LEGACY_FALLBACK',
            conditions: { legacyAuthorizationPreserved: true }
          }));

          const engineerPreview = resolveModuleNavigationAccess({
            applicationModules: PROJECTPULSE_MODULES,
            dynamicModules,
            grants,
            legacyFallback,
            actorRoleCodes: ['ENGINEER'],
            actualSessionPermanentFullControl: false,
            retiredModuleNumbers: retiredCodes
          });
          const engineerDenied = new Set(engineerPreview.deniedModuleNumbers);
          assert(engineerDenied.has('030'), 'An explicit effective-role MODULE_ACCESS denial must block navigation.');
          assert(engineerDenied.has('081'), 'An explicitly inactive dynamic module must remain blocked even when a grant exists.');
          assert(!engineerDenied.has('001'), 'An explicit effective-role grant must remain navigable.');
          for (const moduleCode of ['002', '019', '033', '066']) {
            assert(!engineerDenied.has(moduleCode), `Legacy fallback Module ${moduleCode} must remain endpoint-authorized.`);
          }
          for (const moduleCode of engineerPreview.unregisteredLegacyModuleNumbers) {
            assert(!engineerDenied.has(moduleCode), `Unregistered Module ${moduleCode} must not be converted into a client-side denial.`);
          }
          for (const moduleCode of retiredCodes) {
            assert(engineerDenied.has(moduleCode), `Retired Module ${moduleCode} must remain blocked.`);
          }

          const projectManagerPreview = resolveModuleNavigationAccess({
            applicationModules: PROJECTPULSE_MODULES,
            dynamicModules,
            grants,
            legacyFallback,
            actorRoleCodes: ['PROJECT_MANAGEMENT'],
            actualSessionPermanentFullControl: false,
            retiredModuleNumbers: retiredCodes
          });
          assert(!new Set(projectManagerPreview.deniedModuleNumbers).has('030'), 'A denial assigned only to another role must not leak into the PM preview.');

          const actualAdministrator = resolveModuleNavigationAccess({
            applicationModules: PROJECTPULSE_MODULES,
            dynamicModules,
            grants,
            legacyFallback,
            actorRoleCodes: ['SUPER_ADMINISTRATOR'],
            actualSessionPermanentFullControl: true,
            retiredModuleNumbers: retiredCodes
          });
          const administratorDenied = new Set(actualAdministrator.deniedModuleNumbers);
          assert(!administratorDenied.has('030'), 'Own-session permanent Full Control must override role-policy denials.');
          assert(!administratorDenied.has('081'), 'Own-session permanent Full Control preserves administrative inspection of inactive dynamic modules.');
          for (const moduleCode of retiredCodes) {
            assert(administratorDenied.has(moduleCode), `Statically retired Module ${moduleCode} must remain retired.`);
          }

          const classificationCoverage = new Set([
            ...engineerPreview.activeDynamicModuleNumbers,
            ...engineerPreview.inactiveDynamicModuleNumbers,
            ...engineerPreview.unregisteredLegacyModuleNumbers,
            ...retiredCodes
          ]);
          for (const moduleCode of applicationCodes) {
            assert(classificationCoverage.has(moduleCode), `Module ${moduleCode} must have an explicit navigation classification.`);
          }

          const bridge = read('src/frontend/project-time-web/src/module-availability-bridge.js');
          assert(bridge.includes("nativeFetch('/api/rbac/v1/modules?includeInactive=true'"), 'The bridge must load active and inactive dynamic module lifecycle evidence.');
          assert(bridge.includes('resolveModuleNavigationAccess'), 'The bridge must use the shared access policy.');
          assert(bridge.includes('const sequence = ++refreshSequence;'), 'Permission refreshes must be sequenced.');
          assert(bridge.includes('sequence !== refreshSequence'), 'Stale View-As permission responses must be discarded.');
          assert(bridge.includes("window.addEventListener('hashchange', applyVisibility);"), 'Route changes must not start redundant permission refreshes.');
          assert(!bridge.includes('!activeModuleNumbers.has(number)'), 'Missing dynamic-catalog registration must never become an automatic denial.');
          assert(!bridge.includes("window.addEventListener('hashchange', () => {\n    applyVisibility();\n    void refreshPermissions();"), 'Hash navigation must not race a second permission request.');

          const backend = read('src/backend/ProjectTime.Api/DynamicRbacAdministrationModule.g.cs');
          assert(backend.includes('includeInactive'), 'The dynamic RBAC API must expose inactive lifecycle evidence.');
          assert(backend.includes('legacyAuthorizationPreserved = true'), 'The backend legacy-fallback contract must remain explicit.');
          assert(backend.includes('Existing endpoint authorization remains in effect'), 'Unconfigured RBAC pairs must remain on endpoint authorization.');

          console.log(`VIEW_AS_MODULE_NAVIGATION_REGISTRY_COUNT=${applicationCodes.length}`);
          console.log(`VIEW_AS_MODULE_NAVIGATION_UNREGISTERED_LEGACY_COUNT=${engineerPreview.unregisteredLegacyModuleNumbers.length}`);
          console.log('VIEW_AS_MODULE_NAVIGATION_CONTINUITY=PASS explicit-deny=true inactive=true legacy-fallback=true unregistered-legacy=true race-safe=true');
          '''
          (root / 'src/frontend/project-time-web/scripts/validate-view-as-module-navigation.mjs').write_text(validator)

          bridge_path = root / 'src/frontend/project-time-web/src/module-availability-bridge.js'
          bridge = bridge_path.read_text()
          bridge = bridge.replace(
              "} from './module-availability-registry.js';\nimport './permission-aware-more-menu.css';",
              "} from './module-availability-registry.js';\nimport { resolveModuleNavigationAccess } from './module-navigation-access-policy.js';\nimport './permission-aware-more-menu.css';",
              1
          )
          bridge = bridge.replace(
              "  let moreSearchValue = '';\n",
              "  let moreSearchValue = '';\n  let refreshSequence = 0;\n",
              1
          )
          bridge = bridge.replace(
              "  function enforceRouteBoundary() {\n    const rawRoute = rawModuleRoute(window.location.hash || '#dashboard') || 'dashboard';",
              "  function enforceRouteBoundary() {\n    if (permissionEvidenceState === 'loading') return;\n    const rawRoute = rawModuleRoute(window.location.hash || '#dashboard') || 'dashboard';",
              1
          )
          bridge = bridge.replace(
              "      deniedModuleNumbers: [...deniedModuleNumbers],\n      retiredModuleNumbers: [...RETIRED_MODULE_NUMBERS],",
              "      deniedModuleNumbers: [...deniedModuleNumbers],\n      explicitDeniedModuleNumbers: [...(effectiveActor.explicitDeniedModuleNumbers || [])],\n      explicitGrantedModuleNumbers: [...(effectiveActor.explicitGrantedModuleNumbers || [])],\n      activeDynamicModuleNumbers: [...(effectiveActor.activeDynamicModuleNumbers || [])],\n      inactiveDynamicModuleNumbers: [...(effectiveActor.inactiveDynamicModuleNumbers || [])],\n      legacyFallbackModuleNumbers: [...(effectiveActor.legacyFallbackModuleNumbers || [])],\n      unregisteredLegacyModuleNumbers: [...(effectiveActor.unregisteredLegacyModuleNumbers || [])],\n      retiredModuleNumbers: [...RETIRED_MODULE_NUMBERS],",
              1
          )

          refresh = r'''  async function refreshPermissions() {
            const sequence = ++refreshSequence;
            const requestedViewAsUserId = activeViewAs()?.userId || '';
            const token = sessionToken();
            if (!token) {
              deniedModuleNumbers = new Set(RETIRED_MODULE_NUMBERS);
              permissionEvidenceState = 'anonymous';
              effectiveActor = { roleCodes: [], isViewAs: false, permanentFullControl: false };
              applyVisibility();
              publishNavigationState();
              return;
            }

            // Clear stale decisions before requesting the next effective identity.
            // The More menu remains hidden while loading, and server endpoints remain
            // authoritative, but a prior user's denial cannot redirect the new user.
            permissionEvidenceState = 'loading';
            deniedModuleNumbers = new Set(RETIRED_MODULE_NUMBERS);
            effectiveActor = {
              roleCodes: [],
              isViewAs: Boolean(requestedViewAsUserId),
              permanentFullControl: false,
              authoritySource: 'permission_refresh_pending',
              explicitDeniedModuleNumbers: [],
              explicitGrantedModuleNumbers: [],
              activeDynamicModuleNumbers: [],
              inactiveDynamicModuleNumbers: [],
              legacyFallbackModuleNumbers: [],
              unregisteredLegacyModuleNumbers: []
            };
            applyVisibility();
            publishNavigationState();

            try {
              const request = {
                method: 'GET',
                cache: 'no-store',
                credentials: 'include',
                headers: permissionHeaders()
              };
              const [bootstrapResponse, matrixResponse, securityResponse, moduleCatalogResponse] = await Promise.all([
                nativeFetch('/api/rbac/v1/bootstrap', request),
                nativeFetch('/api/rbac/v1/matrix', request),
                nativeFetch('/api/security/me', request),
                nativeFetch('/api/rbac/v1/modules?includeInactive=true', request)
              ]);
              if (!bootstrapResponse.ok || !matrixResponse.ok || !moduleCatalogResponse.ok) {
                throw new Error('Dynamic RBAC navigation evidence could not be loaded.');
              }

              const [bootstrap, matrix, security, moduleCatalog] = await Promise.all([
                bootstrapResponse.json(),
                matrixResponse.json(),
                securityResponse.ok ? securityResponse.json() : Promise.resolve({}),
                moduleCatalogResponse.json()
              ]);
              if (!Array.isArray(bootstrap?.roles)
                  || !Array.isArray(bootstrap?.modules)
                  || !Array.isArray(matrix?.roles)
                  || !Array.isArray(matrix?.modules)
                  || !Array.isArray(matrix?.grants)
                  || !Array.isArray(matrix?.legacyFallback)
                  || !Array.isArray(moduleCatalog?.modules)) {
                throw new Error('Dynamic RBAC navigation evidence was incomplete.');
              }

              const currentViewAsUserId = activeViewAs()?.userId || '';
              if (sequence !== refreshSequence || currentViewAsUserId !== requestedViewAsUserId) return;

              const viewAs = activeViewAs();
              const serverViewAs = security?.isViewAs === true;
              const effectiveViewAs = Boolean(viewAs) || serverViewAs;
              let actorRoles = normalizedRoleCodes(bootstrap?.actor?.roleCodes);
              if (actorRoles.length === 0) {
                actorRoles = normalizedRoleCodes(
                  security?.roles?.map((role) => role?.roleCode ?? role?.roleName)
                );
              }
              if (effectiveViewAs && actorRoles.length === 0) actorRoles = normalizedRoleCodes(viewAs?.roleCodes);
              const actualSuperAdministrator = !effectiveViewAs && (
                security?.permanentFullControl === true
                || bootstrap?.actor?.permanentFullControl === true
                || actorRoles.some((roleCode) => SUPER_ADMINISTRATOR_ROLE_CODES.has(roleCode))
              );
              const navigationAccess = resolveModuleNavigationAccess({
                applicationModules: PROJECTPULSE_MODULES,
                dynamicModules: moduleCatalog.modules,
                grants: matrix.grants,
                legacyFallback: matrix.legacyFallback,
                actorRoleCodes: actorRoles,
                actualSessionPermanentFullControl: actualSuperAdministrator,
                retiredModuleNumbers: RETIRED_MODULE_NUMBERS
              });

              deniedModuleNumbers = new Set(navigationAccess.deniedModuleNumbers);
              permissionEvidenceState = 'ready';
              effectiveActor = {
                roleCodes: actorRoles,
                isViewAs: effectiveViewAs,
                permanentFullControl: actualSuperAdministrator,
                authoritySource: security?.authoritySource
                  || bootstrap?.actor?.authoritySource
                  || (actualSuperAdministrator
                    ? 'actual_session_super_administrator'
                    : 'published_rbac_matrix_with_legacy_fallback'),
                explicitDeniedModuleNumbers: navigationAccess.explicitDeniedModuleNumbers,
                explicitGrantedModuleNumbers: navigationAccess.explicitGrantedModuleNumbers,
                activeDynamicModuleNumbers: navigationAccess.activeDynamicModuleNumbers,
                inactiveDynamicModuleNumbers: navigationAccess.inactiveDynamicModuleNumbers,
                legacyFallbackModuleNumbers: navigationAccess.legacyFallbackModuleNumbers,
                unregisteredLegacyModuleNumbers: navigationAccess.unregisteredLegacyModuleNumbers
              };
              applyVisibility();
              publishNavigationState();
            } catch {
              const currentViewAsUserId = activeViewAs()?.userId || '';
              if (sequence !== refreshSequence || currentViewAsUserId !== requestedViewAsUserId) return;
              deniedModuleNumbers = new Set(RETIRED_MODULE_NUMBERS);
              permissionEvidenceState = 'unavailable';
              effectiveActor = {
                roleCodes: [],
                isViewAs: Boolean(activeViewAs()),
                permanentFullControl: false,
                authoritySource: 'server_endpoint_authorization_only',
                explicitDeniedModuleNumbers: [],
                explicitGrantedModuleNumbers: [],
                activeDynamicModuleNumbers: [],
                inactiveDynamicModuleNumbers: [],
                legacyFallbackModuleNumbers: [],
                unregisteredLegacyModuleNumbers: []
              };
              applyVisibility();
              publishNavigationState();
            }
          }
          '''
          pattern = re.compile(r"  async function refreshPermissions\(\) \{.*?\n  \}\n\n  const boot = \(\) => \{", re.DOTALL)
          bridge, count = pattern.subn(refresh + "\n  const boot = () => {", bridge, count=1)
          if count != 1:
              raise SystemExit(f'module-availability-bridge.js: refreshPermissions replacement count={count}')
          bridge = bridge.replace(
              "  window.addEventListener('hashchange', () => {\n    applyVisibility();\n    void refreshPermissions();\n  });",
              "  window.addEventListener('hashchange', applyVisibility);",
              1
          )
          if bridge.count("nativeFetch('/api/rbac/v1/modules?includeInactive=true'") != 1:
              raise SystemExit('module lifecycle endpoint was not wired exactly once')
          if '!activeModuleNumbers.has(number)' in bridge:
              raise SystemExit('legacy false-deny loop remains in navigation bridge')
          bridge_path.write_text(bridge)

          replace_once(
              'src/frontend/project-time-web/scripts/validate-module-012-scoped-role-admin.mjs',
              '''  "nativeFetch('/api/rbac/v1/matrix'",
            "actionCode || '').toUpperCase() === 'MODULE_ACCESS'",''',
              '''  "nativeFetch('/api/rbac/v1/matrix'",
            "nativeFetch('/api/rbac/v1/modules?includeInactive=true'",
            'resolveModuleNavigationAccess',
            'const sequence = ++refreshSequence;',
            'sequence !== refreshSequence',
            "window.addEventListener('hashchange', applyVisibility);",
            'inactiveDynamicModuleNumbers',
            'legacyFallbackModuleNumbers',
            'unregisteredLegacyModuleNumbers',
            "actionCode || '').toUpperCase() === 'MODULE_ACCESS'",'''
          )
          replace_once(
              'src/frontend/project-time-web/scripts/validate-module-012-scoped-role-admin.mjs',
              '''requireAll(compatibility, [''',
              '''rejectAll(navigation, [
            '!activeModuleNumbers.has(number)',
            "window.addEventListener('hashchange', () => {\\n    applyVisibility();\\n    void refreshPermissions();"
          ], 'View-As navigation false-deny and refresh-race contract');

          requireAll(compatibility, ['''
          )

          replace_once(
              'src/frontend/project-time-web/scripts/validate-group-1-navigation-work-consolidation.mjs',
              '''assert('DYNAMIC_MODULE_LIFECYCLE', bridge.includes('activeModuleNumbers')
            && bridge.includes('!activeModuleNumbers.has(number)')
            && bridge.includes('PROJECTPULSE_MODULES'),
          'More navigation removes pages that are not in the active dynamic RBAC module catalog');''',
              '''assert('DYNAMIC_MODULE_LIFECYCLE', bridge.includes("nativeFetch('/api/rbac/v1/modules?includeInactive=true'")
            && bridge.includes('inactiveDynamicModuleNumbers')
            && bridge.includes('legacyFallbackModuleNumbers')
            && bridge.includes('unregisteredLegacyModuleNumbers')
            && bridge.includes('resolveModuleNavigationAccess')
            && !bridge.includes('!activeModuleNumbers.has(number)'),
          'More navigation hides explicitly retired or inactive modules while preserving backend-authorized legacy and unregistered routes');'''
          )

          replace_once(
              'src/frontend/project-time-web/scripts/validate-dynamic-rbac-administration.mjs',
              '''console.log('DYNAMIC_RBAC_ADMINISTRATION_PACKAGE=PASS moduleCounts=69,70,71 superAdmin=permanent-full-control group2a=preserved moreMenu=react-owned-name-only');''',
              '''await import('./validate-view-as-module-navigation.mjs');

          console.log('DYNAMIC_RBAC_ADMINISTRATION_PACKAGE=PASS moduleCounts=69,70,71 superAdmin=permanent-full-control group2a=preserved moreMenu=react-owned-name-only viewAsNavigation=continuous');'''
          )
          PY

      - name: Validate focused View-As and RBAC contracts
        working-directory: src/frontend/project-time-web
        run: |
          node --check src/module-navigation-access-policy.js
          node --check src/module-availability-bridge.js
          node --check scripts/validate-view-as-module-navigation.mjs
          node scripts/validate-view-as-module-navigation.mjs
          node scripts/validate-dynamic-rbac-administration.mjs
          node scripts/validate-module-012-scoped-role-admin.mjs
          node scripts/validate-group-1-navigation-work-consolidation.mjs

      - name: Build API Release
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release -p:ProjectPulseSourceRevision=1111111111111111111111111111111111111111

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: |
          npm ci
          npm run build

      - name: Validate exact source boundary
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/frontend/project-time-web/src/module-availability-bridge.js',
              'src/frontend/project-time-web/src/module-navigation-access-policy.js',
              'src/frontend/project-time-web/scripts/validate-view-as-module-navigation.mjs',
              'src/frontend/project-time-web/scripts/validate-dynamic-rbac-administration.mjs',
              'src/frontend/project-time-web/scripts/validate-module-012-scoped-role-admin.mjs',
              'src/frontend/project-time-web/scripts/validate-group-1-navigation-work-consolidation.mjs',
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
              if len(line) >= 4
          }
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected:
              raise SystemExit(f'Unexpected files after validation: {sorted(unexpected)}')
          if missing:
              raise SystemExit(f'Expected repair files were not changed: {sorted(missing)}')
          PY

      - name: Commit validated source and remove temporary publisher
        shell: bash
        run: |
          rm .github/workflows/bootstrap-view-as-module-navigation-continuity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix View-As module navigation continuity"
          git push origin HEAD:fix/view-as-module-navigation-continuity-20260808
