name: Apply Celar Oracle Embedding Compatibility on Current Main

on:
  push:
    branches:
      - fix/celar-oracle-embedding-current-main-20260810
    paths:
      - '.github/workflows/apply-celar-oracle-embedding-current-main.yml'
      - 'scripts/patch-celar-oracle-workflow-current-main.py'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiPrivateEmbeddingClient.cs'
      - 'tests/CelarAiOracleExternalRuntimeTests/Program.cs'
      - 'tests/validate-celar-ai-oracle-test-runtime.mjs'

permissions:
  contents: write

concurrency:
  group: apply-celar-oracle-embedding-current-main
  cancel-in-progress: false

jobs:
  finalize:
    name: Patch, validate, and commit Oracle compatibility
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/celar-oracle-embedding-current-main-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact correction branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/celar-oracle-embedding-current-main-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the bounded activation-workflow correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/patch-celar-oracle-workflow-current-main.py
          python3 scripts/patch-celar-oracle-workflow-current-main.py
          grep -Fq 'ORACLE_EMBEDDING_RESPONSE=VALID' .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          grep -Fq 'math.isfinite' .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          grep -Fq 'bash scripts/build-pr55-acr-image.sh' .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          ! grep -Fq "'.data | length == 1" .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          git diff --check

      - name: Install checksum-pinned actionlint
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 4 --retry-all-errors \
            -o "$RUNNER_TEMP/actionlint.tar.gz" \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -verbose .github/workflows/celar-ai-oracle-test-runtime-deploy.yml

      - name: Validate runtime contracts and production builds
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet run --project tests/CelarAiOracleExternalRuntimeTests/CelarAiOracleExternalRuntimeTests.csproj --configuration Release
          node tests/validate-celar-ai-oracle-test-runtime.mjs
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          npm --prefix src/frontend/project-time-web ci
          npm --prefix src/frontend/project-time-web run build

          # The repository-security validator must inspect the intended permanent tree,
          # not this temporary same-repository publisher with contents:write.
          rm -f \
            .github/workflows/apply-celar-oracle-embedding-current-main.yml \
            scripts/patch-celar-oracle-workflow-current-main.py
          python3 scripts/security/validate-repository-security-posture.py
          git diff --check

      - name: Commit validated permanent source
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'Pulse Enterprise Automation'
          git config user.email 'pulse-enterprise-automation@users.noreply.github.com'
          git commit -m 'fix: accept Oracle embedding response variants safely'
          git push origin HEAD:fix/celar-oracle-embedding-current-main-20260810
