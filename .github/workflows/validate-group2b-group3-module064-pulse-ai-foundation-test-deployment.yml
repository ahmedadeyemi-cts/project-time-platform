name: Validate Group 2B, Group 3, Module 064, and Pulse AI Foundation Test Deployment

on:
  push:
    branches:
      - 'release/group2b-group3-module064-pulse-ai-foundation-test-*'
  pull_request:
    paths:
      - '.github/workflows/projectpulse-deploy-group2b-group3-module064-pulse-ai-foundation-test.yml'
      - '.github/workflows/validate-group2b-group3-module064-pulse-ai-foundation-test-deployment.yml'
      - 'scripts/run-group2b-group3-module064-pulse-ai-foundation-test-deployment.sh'
      - 'scripts/validate-group2b-group3-module064-pulse-ai-foundation-test-deployment.sh'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce exact four-file deployment-control scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD)
          ALLOWED=(
            '.github/workflows/projectpulse-deploy-group2b-group3-module064-pulse-ai-foundation-test.yml'
            '.github/workflows/validate-group2b-group3-module064-pulse-ai-foundation-test-deployment.yml'
            'scripts/run-group2b-group3-module064-pulse-ai-foundation-test-deployment.sh'
            'scripts/validate-group2b-group3-module064-pulse-ai-foundation-test-deployment.sh'
          )
          [[ "${#CHANGED[@]}" -eq 4 ]]
          for changed in "${CHANGED[@]}"; do
            printf '%s\n' "${ALLOWED[@]}" | grep -Fxq "$changed"
          done
          echo 'GROUP2B_GROUP3_MODULE064_PULSE_AI_FOUNDATION_DEPLOYMENT_SCOPE=PASS'

      - name: Validate shell syntax and static contract
        shell: bash
        run: |
          bash -n scripts/run-group2b-group3-module064-pulse-ai-foundation-test-deployment.sh
          bash -n scripts/validate-group2b-group3-module064-pulse-ai-foundation-test-deployment.sh
          bash scripts/validate-group2b-group3-module064-pulse-ai-foundation-test-deployment.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Build ProjectTime API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate source package contracts
        working-directory: src/frontend/project-time-web
        run: |
          node scripts/validate-group-2b-provider-neutral-production-resilience.mjs
          node scripts/validate-group-3-project-financial-workspaces.mjs
          node scripts/validate-module-064-shared-ai.mjs
          node scripts/validate-module-011-pulse-ai.mjs

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build
