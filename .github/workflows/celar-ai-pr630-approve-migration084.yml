name: Approve PR 630 Migration 084 in Celar Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/celar-ai-pr630-approve-migration084.yml

permissions:
  contents: write

concurrency:
  group: celar-ai-pr630-approve-migration084
  cancel-in-progress: false

jobs:
  repair:
    name: Update bounded migration allowlists and remove this workflow
    if: >-
      github.event.pull_request.number == 630 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/ask-celar-ai-troubleshooting-defect-automation-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEAD_BRANCH: feature/ask-celar-ai-troubleshooting-defect-automation-20260810
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact repository, branch, and event head
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == 'ahmedadeyemi-cts/project-time-platform' ]]
          [[ "$(git rev-parse HEAD)" == '${{ github.event.pull_request.head.sha }}' ]]
          [[ "$(git rev-parse origin/${HEAD_BRANCH})" == '${{ github.event.pull_request.head.sha }}' ]]

      - name: Approve only reviewed Migration 084 artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          validator = Path('src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs')
          text = validator.read_text(encoding='utf-8')
          old_migration = "  'database/migrations/081_celar_ai_private_runtime_activation.sql'\n]);"
          new_migration = "  'database/migrations/081_celar_ai_private_runtime_activation.sql',\n  'database/migrations/084_module_076_celar_ai_defect_operations.sql'\n]);"
          old_rollback = "  'database/rollback/081_celar_ai_private_runtime_activation_rollback.sql'\n]);"
          new_rollback = "  'database/rollback/081_celar_ai_private_runtime_activation_rollback.sql',\n  'database/rollback/084_module_076_celar_ai_defect_operations_rollback.sql'\n]);"
          if text.count(old_migration) != 1 or text.count(old_rollback) != 1:
              raise SystemExit('runtime-rebrand migration allowlist anchors did not match exactly')
          text = text.replace(old_migration, new_migration).replace(old_rollback, new_rollback)
          validator.write_text(text, encoding='utf-8')

          consolidated = Path('tests/validate-celar-ai-pr630-consolidated.mjs')
          text = consolidated.read_text(encoding='utf-8')
          old_exact = "const allowedExact = new Set(['src/backend/ProjectTime.Api/Directory.Build.targets']);"
          new_exact = "const allowedExact = new Set([\n  'src/backend/ProjectTime.Api/Directory.Build.targets',\n  'src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs'\n]);"
          if text.count(old_exact) != 1:
              raise SystemExit('PR630 source-scope allowlist anchor did not match exactly')
          consolidated.write_text(text.replace(old_exact, new_exact), encoding='utf-8')
          PY

          node src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs
          rm -- .github/workflows/celar-ai-pr630-approve-migration084.yml
          git diff --check
          git diff --exit-code -- . \
            ':!src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs' \
            ':!tests/validate-celar-ai-pr630-consolidated.mjs' \
            ':!.github/workflows/celar-ai-pr630-approve-migration084.yml'

      - name: Commit bounded validation correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add -- \
            src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs \
            tests/validate-celar-ai-pr630-consolidated.mjs \
            .github/workflows/celar-ai-pr630-approve-migration084.yml
          git commit -m 'Approve Module 076 Migration 084 in Celar validation'
          git push origin "HEAD:${HEAD_BRANCH}"
