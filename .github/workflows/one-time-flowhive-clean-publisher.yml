name: One-time FlowHive Clean Publisher

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-time-flowhive-clean-publisher.yml'
      - '.github/flowhive-clean/repair.patch.gz.b64'
  push:
    branches:
      - tooling/one-time-flowhive-clean-publisher-20260819
    paths:
      - '.github/workflows/one-time-flowhive-clean-publisher.yml'
      - '.github/flowhive-clean/repair.patch.gz.b64'

permissions:
  contents: write

concurrency:
  group: one-time-flowhive-clean-publisher-20260819
  cancel-in-progress: false

jobs:
  publish:
    name: Publish one clean shared planning commit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAIN_SHA: 9006561f49793d227b36f2848e230c55298213b1
      DURABLE_SOURCE_SHA: af375ce3a6642b4e831ac22474d9fc871f2e4ec3
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      PATCH_SHA256: c09f0ff5662ada8f893fb2a29dd0e73ad5be239fee9fbb1065e75466b75b9842
    steps:
      - name: Check out publisher branch with push credential
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build, validate, and publish exact clean tree
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          [[ "$GITHUB_REPOSITORY" == ahmedadeyemi-cts/project-time-platform ]] || fail 'Unexpected repository.'
          case "$GITHUB_EVENT_NAME" in
            push) [[ "$GITHUB_REF" == refs/heads/tooling/one-time-flowhive-clean-publisher-20260819 ]] || fail 'Unexpected publisher branch.' ;;
            pull_request) [[ "$GITHUB_HEAD_REF" == tooling/one-time-flowhive-clean-publisher-20260819 ]] || fail 'Unexpected publisher PR branch.' ;;
            *) fail 'Unexpected workflow event.' ;;
          esac

          git fetch origin main --no-tags
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          [[ "$ACTUAL_MAIN" == "$MAIN_SHA" ]] || fail "main changed from the reviewed SHA: $ACTUAL_MAIN"
          git cat-file -e "$DURABLE_SOURCE_SHA^{commit}" || fail 'Durable source commit is unavailable.'

          base64 --decode .github/flowhive-clean/repair.patch.gz.b64 | gzip --decompress > /tmp/flowhive-functional.patch
          [[ "$(sha256sum /tmp/flowhive-functional.patch | awk '{print $1}')" == "$PATCH_SHA256" ]] || fail 'Repair patch digest mismatch.'

          git checkout --detach "$DURABLE_SOURCE_SHA"
          git apply --index --binary --check /tmp/flowhive-functional.patch
          git apply --index --binary /tmp/flowhive-functional.patch

          for forbidden in \
            .flowhive-repair \
            .github/flowhive-repair \
            .github/flowhive-pr734-finalizer-dispatch.txt \
            .github/scripts/temporary_apply_flowhive_authoritative_repair.py \
            .github/scripts/temporary_finalize_flowhive_authoritative_repair.py \
            .github/scripts/temporary_flowhive_final_quality.py \
            .github/workflows/temporary-flowhive-authoritative-repair.yml \
            .github/workflows/temporary-flowhive-authoritative-repair-v2.yml \
            .github/workflows/temporary-flowhive-authoritative-repair-v3.yml \
            .github/workflows/temporary-flowhive-final-production-quality.yml \
            .github/workflows/temporary-flowhive-last-mile-recovery.yml \
            .github/workflows/temporary-flowhive-pr734-dispatch.yml \
            .github/workflows/temporary-flowhive-pr734-finalizer-run.yml \
            .github/workflows/temporary-flowhive-pr734-finalizer.yml \
            .github/workflows/temporary-flowhive-repair-publisher.yml \
            .github/workflows/temporary-flowhive-repair-timeout-normalizer.yml \
            .github/workflows/temporary-flowhive-source-export.yml \
            .github/workflows/temporary-flowhive-terminal-enforcer.yml; do
            [[ ! -e "$forbidden" ]] || fail "Forbidden recovery artifact remains: $forbidden"
          done

          bash -n scripts/release-test/run-project-document-planning-protected-test-uat.sh
          bash -n scripts/release-test/run-project-planning-collaboration-migration-job.sh
          bash -n scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          node tests/validate-project-planning-collaboration-access.mjs
          node tests/validate-shared-project-document-planning.mjs
          node tests/validate-flowhive-sow-evidence-autoadmission.mjs
          bash tests/test-project-planning-collaboration-migration-095.sh
          python3 scripts/security/validate-repository-security-posture.py
          git diff --cached --check

          TREE_SHA="$(git write-tree)"
          CLEAN_COMMIT="$(printf '%s\n\n%s\n' \
            'Unify FlowHive and Project Forge document-grounded AI planning' \
            'Resolve each project’s existing Work Register SOW, GSD, design, and supporting documents through one private planning pipeline; generate detailed Plan, Design, Implement, Validate, and Release tasks with preserved estimates, dependencies, critical path, citations, working-copy controls, migrations, and protected-Test UAT.' \
            | git commit-tree "$TREE_SHA" -p "$MAIN_SHA")"

          expected="$(mktemp)"
          actual="$(mktemp)"
          cat > "$expected" <<'FILES'
          .github/workflows/project-planning-collaboration-ci.yml
          .github/workflows/projectpulse-deploy-test.yml
          .github/workflows/projectpulse-release-test-control-ci.yml
          database/migrations/095_project_planning_collaboration_access.sql
          database/migrations/096_project_planning_document_authority.sql
          database/rollback/095_project_planning_collaboration_access_rollback.sql
          database/rollback/096_project_planning_document_authority_rollback.sql
          docs/architecture/project-planning-collaboration-access.md
          scripts/release-test/run-project-document-planning-protected-test-uat.sh
          scripts/release-test/run-project-planning-collaboration-migration-job.sh
          scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          scripts/validate-module-033-project-forge-interactive.sh
          src/backend/ProjectTime.Api/Ai/CelarAiEnterprisePlatformContracts.cs
          src/backend/ProjectTime.Api/Ai/CelarAiEnterprisePlatformService.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagContracts.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagRepository.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagService.cs
          src/backend/ProjectTime.Api/Ai/PulseAiSystemIntelligenceService.cs
          src/backend/ProjectTime.Api/Modules/CelarAiProductionPlatformModule.cs
          src/backend/ProjectTime.Api/Modules/PostgresProjectFlowHivePlanRepository.cs
          src/backend/ProjectTime.Api/Modules/ProjectFlowHiveDetailedPlanBuilder.cs
          src/backend/ProjectTime.Api/Modules/ProjectFlowHiveEnterpriseModule.cs
          src/backend/ProjectTime.Api/Modules/ProjectFlowHiveModule.cs
          src/backend/ProjectTime.Api/Modules/ProjectFlowHivePlanningContracts.cs
          src/backend/ProjectTime.Api/Modules/ProjectForgeInteractiveModule.cs
          src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs
          src/backend/ProjectTime.Api/Modules/ProjectPlanningAccessResolver.cs
          src/backend/ProjectTime.Api/Modules/ProjectPlanningAiOrchestrator.cs
          src/backend/ProjectTime.Api/Modules/ProjectPlanningCollaborationModule.cs
          src/backend/ProjectTime.Api/Modules/ProjectPlanningDocumentResolver.cs
          src/frontend/project-time-web/scripts/inject-celar-ai-production-platform.mjs
          src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs
          src/frontend/project-time-web/scripts/validate-celar-ai-production-platform.mjs
          src/frontend/project-time-web/scripts/validate-celar-ai-production-readiness.mjs
          src/frontend/project-time-web/scripts/validate-module-033-project-forge.mjs
          src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs
          src/frontend/project-time-web/scripts/validate-production-consistency.mjs
          src/frontend/project-time-web/src/ProjectFlowHiveCenter.jsx
          src/frontend/project-time-web/src/ProjectFlowHiveEnterprisePanels.jsx
          src/frontend/project-time-web/src/ProjectForgeCenter.jsx
          src/frontend/project-time-web/src/flowhive-sow-evidence-autoadmission.js
          tests/FlowHiveDetailedPlannerTests/Program.cs
          tests/test-project-planning-collaboration-migration-095.sh
          tests/test-project-planning-document-authority-migration-096.sh
          tests/validate-celar-ai-pr630-consolidated.mjs
          tests/validate-flowhive-sow-evidence-autoadmission.mjs
          tests/validate-project-planning-collaboration-access.mjs
          tests/validate-shared-project-document-planning.mjs
          FILES
          sed -i 's/^          //' "$expected"
          git diff --name-only "$MAIN_SHA" "$CLEAN_COMMIT" | sort > "$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual" || fail 'Clean release manifest does not match the reviewed file set.'

          git push origin "$CLEAN_COMMIT:refs/heads/$TARGET_BRANCH" --force
          printf 'CLEAN_BRANCH=%s\nCLEAN_COMMIT=%s\n' "$TARGET_BRANCH" "$CLEAN_COMMIT"
