name: Prepare PR 716 Module Owner Repair

on:
  push:
    branches:
      - diagnostic/module-owner-031-033-runtime-20260818
    paths:
      - '.github/workflows/patch-pr716-module-owner-repair.yml'

permissions:
  contents: write

concurrency:
  group: patch-pr716-module-owner-repair
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'ahmedadeyemi-cts/project-time-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: diagnostic/module-owner-031-033-runtime-20260818
          fetch-depth: 0
          persist-credentials: true

      - name: Replace diagnostic with reviewed repair
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD^)" == '949b2bd1b88086ee511d06df3c74a64963cb9675' ]] || {
            echo 'ERROR: PR #716 branch ancestry changed before the repair patch executed.' >&2
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          migration_path = Path('database/migrations/093_assigned_work_canonical_visibility_repair.sql')
          validator_path = Path('src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs')
          workflow_path = Path('.github/workflows/module-loading-assignment-propagation-ci.yml')
          regression_path = Path('tests/test-module-catalog-owner-repair-migration-093.sh')
          diagnostic_path = Path('.github/workflows/diagnose-module-owner-031-033-pr.yml')
          publisher_path = Path('.github/workflows/patch-pr716-module-owner-repair.yml')

          migration = migration_path.read_text()
          if 'module_catalog_reconciliation_093_owner_repair_evidence' in migration:
              raise SystemExit('Migration 093 already contains the owner-catalog repair block.')

          migration = migration.replace(
              '-- Complete the non-Super-Administrator Modules-page repair and make Module 055C\n'
              '-- assignments canonical for Modules 019, 001A, and 001.\n',
              '-- Complete the non-Super-Administrator Modules-page and owner-catalog repair,\n'
              '-- and make Module 055C assignments canonical for Modules 019, 001A, and 001.\n',
              1,
          )

          owner_repair = r'''
-- Migration 089 was registered in some environments before Modules 031, 032,
-- and 033 were added to its canonical catalog. Those environments can render
-- the frontend modules while lacking the scoped_role_policy_modules rows that
-- the owner-update API locks and updates. Reconcile the three canonical rows
-- without replacing an existing owner or owner revision.
CREATE TABLE IF NOT EXISTS module_catalog_reconciliation_093_owner_repair_evidence (
    module_code TEXT PRIMARY KEY,
    was_present BOOLEAN NOT NULL,
    previous_module_name TEXT NULL,
    previous_route_scope TEXT NULL,
    previous_current_state TEXT NULL,
    previous_permission_notes TEXT NULL,
    previous_source_url TEXT NULL,
    previous_is_active BOOLEAN NULL,
    previous_owner_user_id UUID NULL,
    previous_owner_revision_number INTEGER NULL,
    repaired_owner_user_id UUID NULL,
    repaired_owner_revision_number INTEGER NULL,
    recorded_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

CREATE TEMP TABLE projectpulse093_required_owner_catalog (
    module_code TEXT PRIMARY KEY,
    module_name TEXT NOT NULL,
    route_scope TEXT NOT NULL,
    module_group TEXT NOT NULL
) ON COMMIT DROP;

INSERT INTO projectpulse093_required_owner_catalog (
    module_code,
    module_name,
    route_scope,
    module_group
)
VALUES
    ('031', 'Financial Operations Workbench', 'financial-operations-workbench', 'Reports & Workflow'),
    ('032', 'Notification Delivery Monitor', 'notification-delivery-monitor', 'Reports & Workflow'),
    ('033', 'Project Forge', 'project-forge', 'Project Delivery');

INSERT INTO module_catalog_reconciliation_093_owner_repair_evidence (
    module_code,
    was_present,
    previous_module_name,
    previous_route_scope,
    previous_current_state,
    previous_permission_notes,
    previous_source_url,
    previous_is_active,
    previous_owner_user_id,
    previous_owner_revision_number
)
SELECT
    required.module_code,
    existing.module_code IS NOT NULL,
    existing.module_name,
    existing.route_scope,
    existing.current_state,
    existing.permission_notes,
    existing.source_url,
    existing.is_active,
    existing.owner_user_id,
    existing.owner_revision_number
FROM projectpulse093_required_owner_catalog required
LEFT JOIN scoped_role_policy_modules existing
  ON upper(existing.module_code) = required.module_code
ON CONFLICT (module_code) DO NOTHING;

INSERT INTO scoped_role_policy_modules (
    module_code,
    module_name,
    route_scope,
    current_state,
    permission_notes,
    source_url,
    is_active
)
SELECT
    required.module_code,
    required.module_name,
    required.route_scope,
    'Installed',
    'Canonical Pulse module catalog entry · ' || required.module_group || '. Reconciled by Migration 093.',
    'src/frontend/project-time-web/src/module-availability-registry.js',
    TRUE
FROM projectpulse093_required_owner_catalog required
ON CONFLICT (module_code) DO UPDATE
SET module_name = EXCLUDED.module_name,
    route_scope = EXCLUDED.route_scope,
    current_state = EXCLUDED.current_state,
    permission_notes = EXCLUDED.permission_notes,
    source_url = EXCLUDED.source_url,
    is_active = TRUE;

DO $projectpulse093_assign_repaired_catalog_owner$
DECLARE
    default_owner_user_id UUID;
BEGIN
    SELECT module.owner_user_id
    INTO default_owner_user_id
    FROM scoped_role_policy_modules module
    JOIN app_users owner_user
      ON owner_user.user_id = module.owner_user_id
     AND owner_user.is_active = TRUE
    WHERE module.is_active = TRUE
      AND module.owner_user_id IS NOT NULL
      AND upper(module.module_code) NOT IN ('031', '032', '033')
    GROUP BY module.owner_user_id
    ORDER BY COUNT(*) DESC, module.owner_user_id
    LIMIT 1;

    IF default_owner_user_id IS NOT NULL THEN
        UPDATE scoped_role_policy_modules module
        SET owner_user_id = default_owner_user_id,
            owner_revision_number = COALESCE(module.owner_revision_number, 0) + 1,
            owner_updated_at = NOW(),
            owner_updated_by_user_id = default_owner_user_id
        FROM module_catalog_reconciliation_093_owner_repair_evidence evidence
        WHERE upper(module.module_code) = evidence.module_code
          AND evidence.was_present = FALSE
          AND evidence.repaired_owner_revision_number IS NULL
          AND module.owner_user_id IS NULL;
    END IF;

    UPDATE module_catalog_reconciliation_093_owner_repair_evidence evidence
    SET repaired_owner_user_id = module.owner_user_id,
        repaired_owner_revision_number = COALESCE(module.owner_revision_number, 0)
    FROM scoped_role_policy_modules module
    WHERE upper(module.module_code) = evidence.module_code
      AND evidence.repaired_owner_revision_number IS NULL;
END;
$projectpulse093_assign_repaired_catalog_owner$;

DO $projectpulse093_verify_owner_catalog_repair$
DECLARE
    invalid_modules TEXT[];
BEGIN
    SELECT array_agg(required.module_code ORDER BY required.module_code)
    INTO invalid_modules
    FROM projectpulse093_required_owner_catalog required
    LEFT JOIN scoped_role_policy_modules module
      ON upper(module.module_code) = required.module_code
    WHERE module.module_code IS NULL
       OR module.is_active IS DISTINCT FROM TRUE
       OR module.module_name IS DISTINCT FROM required.module_name
       OR module.route_scope IS DISTINCT FROM required.route_scope;

    IF invalid_modules IS NOT NULL THEN
        RAISE EXCEPTION
            'Migration 093 module catalog repair did not restore active canonical row(s): %',
            array_to_string(invalid_modules, ', ');
    END IF;
END;
$projectpulse093_verify_owner_catalog_repair$;
'''.strip('\n')

          anchor = (
              'CREATE INDEX IF NOT EXISTS ix_scoped_role_policy_modules_owner\n'
              '    ON scoped_role_policy_modules(owner_user_id, is_active, module_code);\n\n'
              '-- Preserve the canonical project_assignments contract consumed directly by:'
          )
          if migration.count(anchor) != 1:
              raise SystemExit('Could not locate the unique Migration 093 owner-index insertion anchor.')
          migration = migration.replace(
              anchor,
              'CREATE INDEX IF NOT EXISTS ix_scoped_role_policy_modules_owner\n'
              '    ON scoped_role_policy_modules(owner_user_id, is_active, module_code);\n\n'
              + owner_repair
              + '\n\n-- Preserve the canonical project_assignments contract consumed directly by:',
              1,
          )

          migration = migration.replace(
              "'Resolve UUID and durable task-code assignments from Module 055C into canonical project assignments for Modules 019, 001A, and 001, with lifecycle resynchronization and optional module-owner storage repair',",
              "'Restore canonical owner-catalog rows for Modules 031, 032, and 033 and resolve UUID and durable task-code assignments from Module 055C into canonical project assignments for Modules 019, 001A, and 001, with lifecycle resynchronization',",
              1,
          )
          migration_path.write_text(migration)

          validator = validator_path.read_text()
          marker_anchor = "  'ADD COLUMN IF NOT EXISTS owner_user_id',\n"
          owner_markers = (
              "  'module_catalog_reconciliation_093_owner_repair_evidence',\n"
              "  'projectpulse093_required_owner_catalog',\n"
              "  \"('031', 'Financial Operations Workbench', 'financial-operations-workbench', 'Reports & Workflow')\",\n"
              "  \"('032', 'Notification Delivery Monitor', 'notification-delivery-monitor', 'Reports & Workflow')\",\n"
              "  \"('033', 'Project Forge', 'project-forge', 'Project Delivery')\",\n"
              "  'evidence.was_present = FALSE',\n"
              "  'GROUP BY module.owner_user_id',\n"
              "  'ORDER BY COUNT(*) DESC, module.owner_user_id',\n"
              "  'module catalog repair did not restore active canonical row(s)',\n"
          )
          if validator.count(marker_anchor) != 1:
              raise SystemExit('Could not locate the Migration 093 validator marker anchor.')
          validator = validator.replace(marker_anchor, marker_anchor + owner_markers, 1)

          workflow_marker = (
              "requireText(\n"
              "  workflow,\n"
              "  'node src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs',\n"
              "  'focused CI validator execution'\n"
              ");\n"
          )
          workflow_assertions = workflow_marker + (
              "requireText(\n"
              "  workflow,\n"
              "  'tests/test-module-catalog-owner-repair-migration-093.sh',\n"
              "  'focused CI owner-catalog regression path'\n"
              ");\n"
              "requireText(\n"
              "  workflow,\n"
              "  'bash tests/test-module-catalog-owner-repair-migration-093.sh',\n"
              "  'focused CI owner-catalog regression execution'\n"
              ");\n"
          )
          if validator.count(workflow_marker) != 1:
              raise SystemExit('Could not locate the focused workflow validator anchor.')
          validator = validator.replace(workflow_marker, workflow_assertions, 1)

          test_read_anchor = "const timesheet = read('src/backend/ProjectTime.Api/Modules/Module001TimesheetEnhancementModule.cs');\n"
          test_read_block = (
              "const ownerCatalogRegression = read('tests/test-module-catalog-owner-repair-migration-093.sh');\n"
              "[\n"
              "  'owner_repair_target_count',\n"
              "  'inserted_modules_inherit_default_owner',\n"
              "  'preexisting_owner_preserved',\n"
              "  'rerun_preserves_changed_owner',\n"
              "  'repair_evidence_preserved'\n"
              "].forEach((contract) => requireText(\n"
              "  ownerCatalogRegression,\n"
              "  contract,\n"
              "  'Migration 093 owner-catalog executable regression'\n"
              "));\n\n"
          )
          if validator.count(test_read_anchor) != 1:
              raise SystemExit('Could not locate the validator executable-test insertion anchor.')
          validator = validator.replace(test_read_anchor, test_read_block + test_read_anchor, 1)

          validator = validator.replace(
              "console.log('modules_019_001a_001_shared_assignment_authority=true');",
              "console.log('modules_019_001a_001_shared_assignment_authority=true');\n"
              "console.log('module_owner_catalog_031_032_033_repaired=true');",
              1,
          )
          validator_path.write_text(validator)

          workflow = workflow_path.read_text()
          path_anchor = "      - 'database/migrations/093_assigned_work_canonical_visibility_repair.sql'\n"
          if workflow.count(path_anchor) != 1:
              raise SystemExit('Could not locate the Migration 093 focused workflow path anchor.')
          workflow = workflow.replace(
              path_anchor,
              path_anchor + "      - 'tests/test-module-catalog-owner-repair-migration-093.sh'\n",
              1,
          )
          workflow = workflow.replace('    timeout-minutes: 30\n', '    timeout-minutes: 45\n', 1)
          step_anchor = (
              '      - name: Validate focused source contracts\n'
              '        run: node src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs\n\n'
          )
          if workflow.count(step_anchor) != 1:
              raise SystemExit('Could not locate the focused source validation step anchor.')
          workflow = workflow.replace(
              step_anchor,
              step_anchor
              + '      - name: Execute Migration 093 owner-catalog regression\n'
                '        shell: bash\n'
                '        run: bash tests/test-module-catalog-owner-repair-migration-093.sh\n\n',
              1,
          )
          workflow_path.write_text(workflow)

          regression_path.write_text(r'''#!/usr/bin/env bash
          set -Eeuo pipefail

          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          CONTAINER="projectpulse-owner-catalog-093-${GITHUB_RUN_ID:-local}-$$"
          DB_USER="projectpulse"
          DB_NAME="projectpulse"
          DB_PASSWORD="projectpulse-test-only"
          MIGRATION="/workspace/database/migrations/093_assigned_work_canonical_visibility_repair.sql"

          cleanup() { docker rm -f "$CONTAINER" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          psql_exec() { docker exec -i -e PGPASSWORD="$DB_PASSWORD" "$CONTAINER" psql -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME" "$@"; }
          value() { psql_exec -Atqc "$1" | tr -d '\r'; }
          assert_eq() {
            local expected="$1" actual="$2" label="$3"
            [[ "$actual" == "$expected" ]] || {
              echo "ASSERTION_FAILED $label expected=$expected actual=$actual" >&2
              exit 1
            }
            echo "ASSERTION_PASSED $label=$actual"
          }

          docker run --detach --rm --name "$CONTAINER" \
            -e POSTGRES_USER="$DB_USER" \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            -e POSTGRES_DB="$DB_NAME" \
            -v "$ROOT:/workspace:ro" \
            postgres:16-alpine >/dev/null

          for attempt in $(seq 1 60); do
            psql_exec -Atqc 'SELECT 1' >/dev/null 2>&1 && break
            [[ "$attempt" != 60 ]] || {
              docker logs "$CONTAINER" >&2 || true
              exit 1
            }
            sleep 1
          done

          psql_exec <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;

          CREATE TABLE schema_migrations (
              migration_id TEXT PRIMARY KEY,
              description TEXT NOT NULL DEFAULT '',
              applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );

          CREATE TABLE app_users (
              user_id UUID PRIMARY KEY,
              email TEXT NOT NULL UNIQUE,
              display_name TEXT NOT NULL,
              is_active BOOLEAN NOT NULL DEFAULT TRUE
          );

          CREATE TABLE projects (
              project_id UUID PRIMARY KEY,
              status TEXT NOT NULL DEFAULT 'active'
          );

          CREATE TABLE project_tasks (
              task_id UUID PRIMARY KEY,
              project_id UUID NOT NULL REFERENCES projects(project_id),
              task_code TEXT NOT NULL,
              is_active BOOLEAN NOT NULL DEFAULT TRUE,
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );

          CREATE TABLE project_assignments (
              project_assignment_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
              project_id UUID NOT NULL REFERENCES projects(project_id),
              task_id UUID NOT NULL REFERENCES project_tasks(task_id),
              user_id UUID NOT NULL REFERENCES app_users(user_id),
              assigned_by_user_id UUID NULL REFERENCES app_users(user_id),
              effective_start_date DATE NOT NULL DEFAULT CURRENT_DATE,
              effective_end_date DATE NULL,
              allocation_percent NUMERIC(7,2) NULL,
              UNIQUE (project_id, task_id, user_id, effective_start_date)
          );

          CREATE TABLE work_register_task_assignment_history (
              work_register_task_assignment_history_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
              project_id UUID NOT NULL REFERENCES projects(project_id),
              task_id_text TEXT NOT NULL,
              assigned_user_id UUID NULL REFERENCES app_users(user_id),
              changed_by_user_id UUID NULL REFERENCES app_users(user_id),
              assignment_status TEXT NOT NULL DEFAULT 'active',
              effective_start_date DATE NULL,
              effective_end_date DATE NULL,
              allocated_hours NUMERIC(10,2) NULL,
              allocation_percent NUMERIC(7,2) NULL,
              change_reason TEXT NULL,
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );

          CREATE TABLE scoped_role_policy_modules (
              module_code TEXT PRIMARY KEY,
              module_name TEXT NOT NULL,
              route_scope TEXT NOT NULL,
              current_state TEXT NOT NULL,
              permission_notes TEXT NOT NULL DEFAULT '',
              source_url TEXT NOT NULL DEFAULT '',
              is_active BOOLEAN NOT NULL DEFAULT TRUE,
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              owner_user_id UUID NULL,
              owner_revision_number INTEGER NOT NULL DEFAULT 0,
              owner_updated_at TIMESTAMPTZ NULL,
              owner_updated_by_user_id UUID NULL
          );

          INSERT INTO app_users (user_id, email, display_name, is_active)
          VALUES
              ('10000000-0000-0000-0000-000000000001', 'default.owner@example.test', 'Default Owner', TRUE),
              ('10000000-0000-0000-0000-000000000002', 'existing.owner@example.test', 'Existing Owner', TRUE);

          INSERT INTO scoped_role_policy_modules (
              module_code,
              module_name,
              route_scope,
              current_state,
              permission_notes,
              source_url,
              is_active,
              owner_user_id,
              owner_revision_number,
              owner_updated_at,
              owner_updated_by_user_id
          )
          VALUES
              ('001', 'Timesheet', 'timesheet', 'Installed', '', 'fixture', TRUE,
               '10000000-0000-0000-0000-000000000001', 4, NOW(), '10000000-0000-0000-0000-000000000001'),
              ('002', 'Approval Inbox', 'manager-approval', 'Installed', '', 'fixture', TRUE,
               '10000000-0000-0000-0000-000000000001', 4, NOW(), '10000000-0000-0000-0000-000000000001'),
              ('033', 'Legacy Forge Label', 'legacy-forge', 'Legacy', 'legacy', 'fixture', FALSE,
               '10000000-0000-0000-0000-000000000002', 7, NOW(), '10000000-0000-0000-0000-000000000002');
          SQL

          psql_exec -f "$MIGRATION" >/dev/null

          assert_eq 3 "$(value "SELECT COUNT(*) FROM scoped_role_policy_modules WHERE module_code IN ('031','032','033') AND is_active=TRUE")" owner_repair_target_count
          assert_eq 3 "$(value "SELECT COUNT(*) FROM scoped_role_policy_modules WHERE (module_code,module_name,route_scope) IN (('031','Financial Operations Workbench','financial-operations-workbench'),('032','Notification Delivery Monitor','notification-delivery-monitor'),('033','Project Forge','project-forge'))")" canonical_catalog_metadata
          assert_eq 2 "$(value "SELECT COUNT(*) FROM scoped_role_policy_modules WHERE module_code IN ('031','032') AND owner_user_id='10000000-0000-0000-0000-000000000001' AND owner_revision_number=1")" inserted_modules_inherit_default_owner
          assert_eq '10000000-0000-0000-0000-000000000002|7' "$(value "SELECT owner_user_id::TEXT || '|' || owner_revision_number::TEXT FROM scoped_role_policy_modules WHERE module_code='033'")" preexisting_owner_preserved
          assert_eq 2 "$(value "SELECT COUNT(*) FROM module_catalog_reconciliation_093_owner_repair_evidence WHERE was_present=FALSE")" missing_rows_recorded
          assert_eq 1 "$(value "SELECT COUNT(*) FROM module_catalog_reconciliation_093_owner_repair_evidence WHERE module_code='033' AND was_present=TRUE")" preexisting_row_recorded

          psql_exec -qc "UPDATE scoped_role_policy_modules SET owner_user_id='10000000-0000-0000-0000-000000000002', owner_revision_number=2, owner_updated_at=NOW(), owner_updated_by_user_id='10000000-0000-0000-0000-000000000002' WHERE module_code='031'"
          psql_exec -f "$MIGRATION" >/dev/null

          assert_eq '10000000-0000-0000-0000-000000000002|2' "$(value "SELECT owner_user_id::TEXT || '|' || owner_revision_number::TEXT FROM scoped_role_policy_modules WHERE module_code='031'")" rerun_preserves_changed_owner
          assert_eq '10000000-0000-0000-0000-000000000001|1' "$(value "SELECT repaired_owner_user_id::TEXT || '|' || repaired_owner_revision_number::TEXT FROM module_catalog_reconciliation_093_owner_repair_evidence WHERE module_code='031'")" repair_evidence_preserved
          assert_eq 1 "$(value "SELECT COUNT(*) FROM schema_migrations WHERE migration_id='093_assigned_work_canonical_visibility_repair'")" migration_registered_once
          assert_eq 3 "$(value "SELECT COUNT(*) FROM module_catalog_reconciliation_093_owner_repair_evidence")" repair_evidence_exact_scope

          echo 'MODULE_CATALOG_OWNER_REPAIR_MIGRATION_093=PASS'
          ''').replace('\n          ', '\n').lstrip()

          if diagnostic_path.exists():
              diagnostic_path.unlink()
          publisher_path.unlink()
          PY

          chmod 0755 tests/test-module-catalog-owner-repair-migration-093.sh
          node --check src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          node src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          bash -n tests/test-module-catalog-owner-repair-migration-093.sh
          bash tests/test-module-catalog-owner-repair-migration-093.sh
          git diff --check

      - name: Commit final PR repair source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add -A
          git diff --cached --quiet && {
            echo 'ERROR: The PR #716 repair patch produced no changes.' >&2
            exit 1
          }
          git commit -m 'fix(module-management): restore owner catalog rows 031-033'
          git push origin HEAD:diagnostic/module-owner-031-033-runtime-20260818
