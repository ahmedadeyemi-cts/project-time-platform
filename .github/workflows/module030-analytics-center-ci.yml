name: Validate Module 030 Analytics Center

on:
  push:
    branches:
      - 'feature/module-030-analytics-center-*'
      - 'feature/analytics-center-enterprise-experience-*'
      - 'fix/module030-regression-validator-*'
      - 'fix/module030-enterprise-regression-mode-*'
  pull_request:
    paths:
      - '.github/workflows/module030-analytics-center-ci.yml'
      - '.github/workflows/module030-analytics-enterprise-experience-ci.yml'
      - '.github/workflows/group5-financial-operations-recovery-ci.yml'
      - '.github/workflows/pulse-ai-help-chat-usability-ci.yml'
      - 'database/migrations/055_analytics_center.sql'
      - 'database/migrations/060_analytics_center_enterprise_experience.sql'
      - 'database/rollback/055_analytics_center_rollback.sql'
      - 'database/rollback/060_analytics_center_enterprise_experience_rollback.sql'
      - 'docs/modules/module-030-analytics-center/README.md'
      - 'docs/modules/module-030-analytics-enterprise-experience/README.md'
      - 'src/backend/ProjectTime.Api/Directory.Build.targets'
      - 'src/backend/ProjectTime.Api/Modules/AnalyticsCenter*.cs'
      - 'src/backend/ProjectTime.Api/Modules/AnalyticsBrandedExportBuilder.cs'
      - 'src/backend/ProjectTime.Api/Modules/Module065AnalyticsAttachmentDelivery.cs'
      - 'src/backend/ProjectTime.Api/Modules/EnterpriseReporting*.cs'
      - 'src/backend/ProjectTime.Api/ProjectTime.Api.csproj'
      - 'src/frontend/project-time-web/package.json'
      - 'src/frontend/project-time-web/scripts/inject-analytics-center.mjs'
      - 'src/frontend/project-time-web/scripts/inject-group-4-project-notification-automation.mjs'
      - 'src/frontend/project-time-web/scripts/validate-analytics-center.mjs'
      - 'src/frontend/project-time-web/scripts/validate-group-5-financial-operations-recovery.mjs'
      - 'src/frontend/project-time-web/src/AnalyticsCenter.jsx'
      - 'src/frontend/project-time-web/src/analytics/AnalyticsMultiSelect.jsx'
      - 'src/frontend/project-time-web/src/analytics-center.css'
      - 'tests/test-analytics-center-migration-055.sh'
      - 'tests/test-analytics-center-enterprise-migration-060.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module030-analytics-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify Module 030 ownership or run regression mode
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          HEAD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch origin "$BASE_BRANCH" --no-tags
          BASE_REF="$(git merge-base "origin/$BASE_BRANCH" HEAD)"
          test -n "$BASE_REF"
          CHANGED="$(git diff --name-only "$BASE_REF"...HEAD)"
          printf '%s\n' "$CHANGED"

          for protected in \
            '.github/workflows/projectpulse-deploy-runtime-direct-timer-recovery-test.yml' \
            '.github/workflows/validate-runtime-direct-timer-recovery-deployment.yml' \
            'scripts/validate-runtime-direct-timer-recovery-test-deployment.sh'; do
            if grep -Fxq "$protected" <<<"$CHANGED"; then
              echo "Protected deployment file changed: $protected" >&2
              exit 1
            fi
          done

          if [[ "$HEAD_BRANCH" == feature/module-030-analytics-center-* ]]; then
            ALLOWED='^(\.github/workflows/(module030-analytics-center-ci|group5-financial-operations-recovery-ci|pulse-ai-help-chat-usability-ci)\.yml|database/migrations/055_analytics_center\.sql|database/rollback/055_analytics_center_rollback\.sql|docs/modules/module-030-analytics-center/README\.md|src/backend/ProjectTime.Api/Modules/(AnalyticsCenter(Contracts|DirectoryLoader|Module)|EnterpriseReporting(Contracts|Catalog|Engine|SourceLoader|Repository|Module))\.cs|src/backend/ProjectTime.Api/ProjectTime.Api\.csproj|src/frontend/project-time-web/package\.json|src/frontend/project-time-web/scripts/(inject-analytics-center|inject-group-4-project-notification-automation|validate-analytics-center|validate-group-5-financial-operations-recovery)\.mjs|src/frontend/project-time-web/src/(AnalyticsCenter\.jsx|analytics-center\.css)|tests/test-analytics-center-migration-055\.sh)$'
            UNEXPECTED="$(grep -Ev "$ALLOWED" <<<"$CHANGED" || true)"
            if [[ -n "$UNEXPECTED" ]]; then
              echo 'Unexpected Module 030 Analytics Center source scope:' >&2
              printf '%s\n' "$UNEXPECTED" >&2
              exit 1
            fi
            echo 'ANALYTICS_CENTER_VALIDATION_MODE=OWNED_SOURCE' >> "$GITHUB_ENV"
            echo 'ANALYTICS_CENTER_SOURCE_ISOLATION=PASSED'
          elif [[ "$HEAD_BRANCH" == feature/analytics-center-enterprise-experience-* ]]; then
            ALLOWED='^(\.github/workflows/(module030-analytics-center-ci|module030-analytics-enterprise-experience-ci)\.yml|database/migrations/060_analytics_center_enterprise_experience\.sql|database/rollback/060_analytics_center_enterprise_experience_rollback\.sql|docs/modules/module-030-analytics-enterprise-experience/README\.md|src/backend/ProjectTime.Api/Directory\.Build\.targets|src/backend/ProjectTime.Api/Modules/(AnalyticsBrandedExportBuilder|AnalyticsCenterEnterpriseContracts|AnalyticsCenterEnterpriseExperienceModule|AnalyticsCenterExperienceScope|AnalyticsCenterScheduler|AnalyticsCenterScheduleRepository|AnalyticsCenterScheduleService|Module065AnalyticsAttachmentDelivery)\.cs|src/frontend/project-time-web/scripts/validate-analytics-center\.mjs|src/frontend/project-time-web/src/AnalyticsCenter\.jsx|src/frontend/project-time-web/src/analytics/AnalyticsMultiSelect\.jsx|src/frontend/project-time-web/src/analytics-center\.css|tests/test-analytics-center-enterprise-migration-060\.sh)$'
            UNEXPECTED="$(grep -Ev "$ALLOWED" <<<"$CHANGED" || true)"
            if [[ -n "$UNEXPECTED" ]]; then
              echo 'Unexpected Analytics enterprise extension scope:' >&2
              printf '%s\n' "$UNEXPECTED" >&2
              exit 1
            fi
            echo 'ANALYTICS_CENTER_VALIDATION_MODE=ENTERPRISE_EXTENSION' >> "$GITHUB_ENV"
            echo 'ANALYTICS_CENTER_ENTERPRISE_SOURCE_ISOLATION=PASSED'
          else
            DIRECT_ANALYTICS="$(grep -E '^(database/(migrations/(055_analytics_center|060_analytics_center_enterprise_experience)\.sql|rollback/(055_analytics_center_rollback|060_analytics_center_enterprise_experience_rollback)\.sql)|docs/modules/module-030-analytics[^/]*/README\.md|src/backend/ProjectTime\.Api/Modules/(AnalyticsCenter|AnalyticsBrandedExportBuilder|Module065AnalyticsAttachmentDelivery|EnterpriseReporting).*\.cs|src/frontend/project-time-web/scripts/(inject-analytics-center|validate-analytics-center)\.mjs|src/frontend/project-time-web/src/(AnalyticsCenter\.jsx|analytics/AnalyticsMultiSelect\.jsx|analytics-center\.css)|tests/test-analytics-center.*\.sh)$' <<<"$CHANGED" || true)"
            if [[ -n "$DIRECT_ANALYTICS" ]]; then
              echo 'An unrelated branch directly changes Module 030-owned source:' >&2
              printf '%s\n' "$DIRECT_ANALYTICS" >&2
              exit 1
            fi
            echo 'ANALYTICS_CENTER_VALIDATION_MODE=REGRESSION' >> "$GITHUB_ENV"
            echo "ANALYTICS_CENTER_REGRESSION_MODE=PASS branch=$HEAD_BRANCH"
          fi

          DEPLOYMENT_OVERLAP="$(grep -E '^(deployment/|\.github/workflows/projectpulse-deploy-|scripts/.*deploy)' <<<"$CHANGED" || true)"
          if [[ "$HEAD_BRANCH" == release/consolidated-enterprise-validation-* ]]; then
            DEPLOYMENT_OVERLAP="$(grep -Fvx 'deployment/containers/web/Dockerfile' <<<"$DEPLOYMENT_OVERLAP" || true)"
          fi
          if [[ -n "$DEPLOYMENT_OVERLAP" ]]; then
            echo 'Analytics Center validation detected deployment-control overlap:' >&2
            printf '%s\n' "$DEPLOYMENT_OVERLAP" >&2
            exit 1
          fi
          if [[ "$HEAD_BRANCH" == feature/module-030-analytics-center-* || "$HEAD_BRANCH" == feature/analytics-center-enterprise-experience-* ]] && \
             grep -E '^(src/frontend/project-time-web/src/(App|main)\.|src/frontend/project-time-web/src/module-availability-registry\.js)' <<<"$CHANGED"; then
            echo 'Analytics-owned source overlaps canonical generated integration files.' >&2
            exit 1
          fi
          if grep -Fxq 'database/migrations/054_enterprise_reporting_center.sql' <<<"$CHANGED"; then
            echo 'Migration 054 is owned by another PR and must not be reused.' >&2
            exit 1
          fi
          git diff --check "$BASE_REF"...HEAD

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Check Analytics Center JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check src/frontend/project-time-web/scripts/inject-analytics-center.mjs
          node --check src/frontend/project-time-web/scripts/inject-group-4-project-notification-automation.mjs
          node --check src/frontend/project-time-web/scripts/validate-analytics-center.mjs
          node --check src/frontend/project-time-web/scripts/validate-group-5-financial-operations-recovery.mjs

      - name: Test migration 055 apply idempotence immutability rollback and reapply
        shell: bash
        run: bash tests/test-analytics-center-migration-055.sh

      - name: Test migration 060 when the enterprise package is present
        if: ${{ hashFiles('database/migrations/060_analytics_center_enterprise_experience.sql') != '' }}
        shell: bash
        run: bash tests/test-analytics-center-enterprise-migration-060.sh

      - name: Validate Analytics Center source contract
        working-directory: src/frontend/project-time-web
        shell: bash
        run: node ./scripts/validate-analytics-center.mjs

      - name: Build ProjectTime API in Release mode
        shell: bash
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate Analytics Center dependencies
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run validate:group3-project-financial-workspaces
          npm run validate:group5-financial-operations
          npm run validate:group6-enterprise-presentation
          npm run validate:group7-ai-help-system-guide
          npm run validate:work-register-055c-055d
          npm run validate:module005
          npm run validate:module069
          npm run validate:module071
          npm run validate:module072
          npm run validate:module075
          npm run validate:module076
          npm run validate:module077
          npm run validate:module078
          npm run validate:module079
          npm run validate:module080
          npm run validate:analytics-center

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        shell: bash
        run: npm run build

      - name: Validate compiled Analytics Center markers
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          cat dist/assets/*.js > /tmp/analytics-center.js
          cat dist/assets/*.css > /tmp/analytics-center.css

          require_marker() {
            local file="$1"
            local marker="$2"
            local kind="$3"
            if ! grep -aFq -- "$marker" "$file"; then
              echo "MISSING_${kind}_MARKER=$marker" >&2
              exit 1
            fi
          }

          if grep -Fq '.analytics-enterprise-shell' src/analytics-center.css; then
            echo 'ANALYTICS_CENTER_COMPILED_PROFILE=ENTERPRISE'
            for marker in \
              'Analytics Center' \
              'Back to Modules' \
              'Back to Dashboard' \
              'Recently Viewed Dashboards & Reports' \
              'Report Library' \
              'Set criteria' \
              'All customers' \
              'All projects' \
              'All engineers' \
              'All Project Managers' \
              'All teams' \
              'Preview report' \
              'Run & save' \
              'Scheduled Reports' \
              'US Signal PDF' \
              '/api/analytics/v2/overview' \
              '/api/analytics/v2/schedules'; do
              require_marker /tmp/analytics-center.js "$marker" COMPILED_JS
            done
            for marker in \
              '.analytics-enterprise-shell' \
              '.analytics-sidebar' \
              '.analytics-kpi-grid' \
              '.analytics-report-categories' \
              '.analytics-filter-grid' \
              '.analytics-multiselect-menu' \
              '.analytics-schedule-panel'; do
              require_marker /tmp/analytics-center.css "$marker" COMPILED_CSS
            done
          else
            echo 'ANALYTICS_CENTER_COMPILED_PROFILE=BASE'
            for marker in \
              'Analytics Center' \
              'Set criteria' \
              'All customers' \
              'All projects' \
              'All engineers' \
              'All Project Managers' \
              'All teams' \
              'Preview report' \
              'Run & save' \
              'Analytics run history' \
              '/api/analytics/catalog' \
              '/api/analytics/filter-options'; do
              require_marker /tmp/analytics-center.js "$marker" COMPILED_JS
            done
            for marker in \
              '.analytics-center' \
              '.analytics-build-layout' \
              '.analytics-filter-grid' \
              '.analytics-source-grid' \
              '.analytics-history-list'; do
              require_marker /tmp/analytics-center.css "$marker" COMPILED_CSS
            done
          fi

          for forbidden in \
            'selectedEngineerSummaryText' \
            '030Q Reporting Readiness Closeout' \
            'Build Export Layout' \
            'Save Report Definition Preview'; do
            if grep -aFq -- "$forbidden" /tmp/analytics-center.js; then
              echo "Legacy Analytics marker remains in compiled bundle: $forbidden" >&2
              exit 1
            fi
          done
          echo 'ANALYTICS_CENTER_FRONTEND_BUILD=PASSED'

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Module 030 Analytics Center validation'
            echo
            echo "- Validation mode: ${ANALYTICS_CENTER_VALIDATION_MODE:-UNKNOWN}"
            echo '- Active compiled profile: base or enterprise, selected from checked-out source'
            echo '- Consolidated releases may change only the static web-container Dockerfile; deployment controls remain prohibited.'
            echo '- Migration 055 regression: executed'
            echo '- Migration 060 regression: executed when present'
            echo '- API and complete frontend builds: executed'
          } >> "$GITHUB_STEP_SUMMARY"
