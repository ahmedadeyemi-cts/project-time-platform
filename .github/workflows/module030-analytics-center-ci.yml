name: Validate Module 030 Analytics Center

on:
  push:
    branches:
      - 'feature/module-030-analytics-center-*'
  pull_request:
    paths:
      - '.github/workflows/module030-analytics-center-ci.yml'
      - 'database/migrations/055_analytics_center.sql'
      - 'database/rollback/055_analytics_center_rollback.sql'
      - 'docs/modules/module-030-analytics-center/README.md'
      - 'src/backend/ProjectTime.Api/Modules/AnalyticsCenter*.cs'
      - 'src/backend/ProjectTime.Api/Modules/EnterpriseReporting*.cs'
      - 'src/backend/ProjectTime.Api/ProjectTime.Api.csproj'
      - 'src/frontend/project-time-web/package.json'
      - 'src/frontend/project-time-web/scripts/inject-analytics-center.mjs'
      - 'src/frontend/project-time-web/scripts/validate-analytics-center.mjs'
      - 'src/frontend/project-time-web/src/AnalyticsCenter.jsx'
      - 'src/frontend/project-time-web/src/analytics-center.css'
      - 'tests/test-analytics-center-migration-055.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module030-analytics-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated Module 030 Analytics Center source scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$CHANGED"

          ALLOWED='^(\.github/workflows/module030-analytics-center-ci\.yml|database/migrations/055_analytics_center\.sql|database/rollback/055_analytics_center_rollback\.sql|docs/modules/module-030-analytics-center/README\.md|src/backend/ProjectTime.Api/Modules/(AnalyticsCenter(Contracts|DirectoryLoader|Module)|EnterpriseReporting(Contracts|Catalog|Engine|SourceLoader|Repository|Module))\.cs|src/backend/ProjectTime.Api/ProjectTime.Api\.csproj|src/frontend/project-time-web/package\.json|src/frontend/project-time-web/scripts/(inject-analytics-center|validate-analytics-center)\.mjs|src/frontend/project-time-web/src/(AnalyticsCenter\.jsx|analytics-center\.css)|tests/test-analytics-center-migration-055\.sh)$'
          UNEXPECTED="$(grep -Ev "$ALLOWED" <<<"$CHANGED" || true)"
          if [[ -n "$UNEXPECTED" ]]; then
            echo 'Unexpected Module 030 Analytics Center source scope:' >&2
            printf '%s\n' "$UNEXPECTED" >&2
            exit 1
          fi

          for protected in \
            '.github/workflows/projectpulse-deploy-runtime-direct-timer-recovery-test.yml' \
            '.github/workflows/validate-runtime-direct-timer-recovery-deployment.yml' \
            'scripts/validate-runtime-direct-timer-recovery-test-deployment.sh'; do
            if grep -Fxq "$protected" <<<"$CHANGED"; then
              echo "Protected deployment file changed: $protected" >&2
              exit 1
            fi
          done

          if grep -E '^(deployment/|\.github/workflows/projectpulse-deploy-|scripts/.*deploy|src/frontend/project-time-web/src/(App|main)\.|src/frontend/project-time-web/src/module-availability-registry\.js)' <<<"$CHANGED"; then
            echo 'Analytics Center source overlaps deployment or canonical generated integration files.' >&2
            exit 1
          fi

          if grep -Fxq 'database/migrations/054_enterprise_reporting_center.sql' <<<"$CHANGED"; then
            echo 'Migration 054 is owned by another open PR and must not be reused.' >&2
            exit 1
          fi

          git diff --check origin/main...HEAD
          echo 'ANALYTICS_CENTER_SOURCE_ISOLATION=PASSED'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Check Analytics Center JavaScript syntax
        run: |
          set -Eeuo pipefail
          node --check src/frontend/project-time-web/scripts/inject-analytics-center.mjs
          node --check src/frontend/project-time-web/scripts/validate-analytics-center.mjs

      - name: Test migration 055
        id: migration
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bash tests/test-analytics-center-migration-055.sh > analytics-migration-055.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-center-migration-055-${{ github.run_id }}-${{ github.run_attempt }}
          path: analytics-migration-055.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce migration 055 result
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS='${{ steps.migration.outputs.exit_code }}'
          if [[ "$STATUS" != '0' ]]; then
            cat analytics-migration-055.log >&2
            exit "$STATUS"
          fi
          cat analytics-migration-055.log

      - name: Validate Analytics Center source contract
        id: source_contract
        continue-on-error: true
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set +e
          node ./scripts/validate-analytics-center.mjs > analytics-center-source-contract.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload source-contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-center-source-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/frontend/project-time-web/analytics-center-source-contract.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Analytics Center source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS='${{ steps.source_contract.outputs.exit_code }}'
          if [[ "$STATUS" != '0' ]]; then
            cat src/frontend/project-time-web/analytics-center-source-contract.log >&2
            exit "$STATUS"
          fi
          cat src/frontend/project-time-web/analytics-center-source-contract.log

      - name: Build ProjectTime API
        id: api_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release > analytics-center-api-build.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload API diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-center-api-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: analytics-center-api-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce API build
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS='${{ steps.api_build.outputs.exit_code }}'
          if [[ "$STATUS" != '0' ]]; then
            tail -n 240 analytics-center-api-build.log >&2
            exit "$STATUS"
          fi
          tail -n 60 analytics-center-api-build.log
          echo 'ANALYTICS_CENTER_API_BUILD=PASSED'

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate Analytics Center dependencies
        working-directory: src/frontend/project-time-web
        run: |
          set -Eeuo pipefail
          npm run validate:group3-project-financial-workspaces
          npm run validate:group5-financial-operations
          npm run validate:group6-enterprise-presentation
          npm run validate:group7-ai-help-system-guide
          npm run validate:work-register-055c-055d
          npm run validate:module005
          npm run validate:module069
          npm run validate:module071
          npm run validate:module072
          npm run validate:module075
          npm run validate:module076
          npm run validate:module077
          npm run validate:module078
          npm run validate:module079
          npm run validate:module080
          npm run validate:analytics-center

      - name: Build complete frontend production bundle
        id: frontend_build
        continue-on-error: true
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set +e
          npm run build > analytics-center-frontend-build.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-center-frontend-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/frontend/project-time-web/analytics-center-frontend-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce frontend build and compiled markers
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS='${{ steps.frontend_build.outputs.exit_code }}'
          if [[ "$STATUS" != '0' ]]; then
            tail -n 240 analytics-center-frontend-build.log >&2
            exit "$STATUS"
          fi

          cat dist/assets/*.js > /tmp/analytics-center.js
          cat dist/assets/*.css > /tmp/analytics-center.css
          for marker in \
            'Analytics Center' \
            'Select report' \
            'Set criteria' \
            'All customers' \
            'All projects' \
            'All engineers' \
            'All Project Managers' \
            'All teams' \
            'Preview report' \
            'Run & save' \
            'Analytics run history' \
            '/api/analytics/catalog' \
            '/api/analytics/filter-options'; do
            grep -Fq "$marker" /tmp/analytics-center.js
          done
          for forbidden in \
            'selectedEngineerSummaryText' \
            '030Q Reporting Readiness Closeout' \
            'Build Export Layout' \
            'Save Report Definition Preview'; do
            if grep -Fq "$forbidden" /tmp/analytics-center.js; then
              echo "Legacy Analytics marker remains in compiled bundle: $forbidden" >&2
              exit 1
            fi
          done
          for marker in \
            '.analytics-center' \
            '.analytics-build-layout' \
            '.analytics-report-cards' \
            '.analytics-filter-grid' \
            '.analytics-source-grid' \
            '.analytics-history-list'; do
            grep -Fq "$marker" /tmp/analytics-center.css
          done
          tail -n 60 analytics-center-frontend-build.log
          echo 'ANALYTICS_CENTER_FRONTEND_BUILD=PASSED'
