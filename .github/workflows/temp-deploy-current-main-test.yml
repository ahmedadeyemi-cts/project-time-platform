name: Temporary Deploy Current Main to Test

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/deploy-current-main-test-trigger'

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-current-main-test-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == 'ahmedadeyemi-cts'
    name: Verify migrations and deploy exact current main to Test
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      EXPECTED_RELEASE_COMMIT: 289628ded2ec91ea0710d3cb7ee7cf16bca1f012
      EXPECTED_TRIGGER_BRANCH: release/run-current-main-test-deployment-20260730
      REQUIRED_CONFIRMATION: DEPLOY-CURRENT-MAIN-289628-TO-TEST

    steps:
      - name: Check out exact deployment trigger
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: trigger
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact deployment controls
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact cumulative source release
        uses: actions/checkout@v5
        with:
          ref: 289628ded2ec91ea0710d3cb7ee7cf16bca1f012
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Guard trigger, control scope, and exact source release
        id: guard
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$BASE_REF" == main ]]
          [[ "$HEAD_REF" == "$EXPECTED_TRIGGER_BRANCH" ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C control rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ "$(git -C release rev-parse HEAD)" == "$EXPECTED_RELEASE_COMMIT" ]]

          TRIGGER_FILE='trigger/.github/deploy-current-main-test-trigger'
          test -f "$TRIGGER_FILE"
          [[ "$(sed -n 's/^operation=//p' "$TRIGGER_FILE" | tail -1)" == deploy ]]
          [[ "$(sed -n 's/^release_commit=//p' "$TRIGGER_FILE" | tail -1)" == "$EXPECTED_RELEASE_COMMIT" ]]
          [[ "$(sed -n 's/^confirmation=//p' "$TRIGGER_FILE" | tail -1)" == "$REQUIRED_CONFIRMATION" ]]

          mapfile -t TRIGGER_CHANGED < <(git -C trigger diff --name-only "$BASE_SHA...HEAD" | sort)
          diff -u \
            <(printf '%s\n' '.github/deploy-current-main-test-trigger') \
            <(printf '%s\n' "${TRIGGER_CHANGED[@]}")

          git -C control merge-base --is-ancestor "$EXPECTED_RELEASE_COMMIT" HEAD
          mapfile -t CONTROL_CHANGED < <(git -C control diff --name-only "$EXPECTED_RELEASE_COMMIT...HEAD" | sort)
          cat > /tmp/expected-current-main-control-files.txt <<'EOF'
          .github/workflows/temp-apply-current-main-migrations-test.yml
          .github/workflows/temp-deploy-current-main-test.yml
          scripts/temp-apply-current-main-migrations-test.sh
          scripts/temp-run-current-main-migration-job.sh
          scripts/temp-run-current-main-test-deployment.sh
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/expected-current-main-control-files.txt
          sort -o /tmp/expected-current-main-control-files.txt /tmp/expected-current-main-control-files.txt
          diff -u /tmp/expected-current-main-control-files.txt <(printf '%s\n' "${CONTROL_CHANGED[@]}")

          for file in \
            release/database/migrations/051a_pending_approval_day_status_lifecycle.sql \
            release/database/migrations/052_document_intelligence_runtime.sql \
            release/database/migrations/053_intelligence_answer_orchestration.sql \
            release/src/backend/ProjectTime.Api/Modules/PendingApprovalWorkModule.cs \
            release/src/backend/ProjectTime.Api/Modules/PulseAiPrivateRuntimeModule.cs \
            release/src/backend/ProjectTime.Api/Modules/PulseAiPrivateRagModule.cs \
            release/src/frontend/project-time-web/src/ProjectRegisterCenter.jsx \
            release/src/frontend/project-time-web/scripts/validate-pending-time-workflow.mjs \
            release/src/frontend/project-time-web/scripts/validate-module-011-private-runtime-activation.mjs \
            release/src/frontend/project-time-web/scripts/validate-module-011-private-rag-orchestration.mjs \
            release/src/frontend/project-time-web/scripts/validate-module-006-toyota-hyundai-pipelines.mjs \
            control/scripts/temp-apply-current-main-migrations-test.sh \
            control/scripts/temp-run-current-main-migration-job.sh \
            control/scripts/temp-run-current-main-test-deployment.sh; do
            test -f "$file"
          done

          bash -n control/scripts/temp-apply-current-main-migrations-test.sh
          bash -n control/scripts/temp-run-current-main-migration-job.sh
          bash -n control/scripts/temp-run-current-main-test-deployment.sh
          git -C control diff --check "$EXPECTED_RELEASE_COMMIT...HEAD"
          echo "control_commit=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo 'CURRENT_MAIN_DEPLOYMENT_GUARD=PASS'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: release/src/frontend/project-time-web/package-lock.json

      - name: Rebuild and revalidate the exact source before Azure changes
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build release/src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          pushd release/src/frontend/project-time-web >/dev/null
          node scripts/validate-pending-time-workflow.mjs
          node scripts/validate-module-011-private-runtime-activation.mjs
          node scripts/validate-module-011-private-rag-orchestration.mjs
          node scripts/validate-module-006-toyota-hyundai-pipelines.mjs
          node scripts/validate-superadmin-sso-expense-module006-package.mjs
          npm ci --no-audit --no-fund
          npm run build
          popd >/dev/null
          docker build \
            --file release/deployment/containers/web/Dockerfile \
            --tag "projectpulse-current-main-web:${EXPECTED_RELEASE_COMMIT}" \
            release
          echo 'CURRENT_MAIN_PRE_DEPLOYMENT_SOURCE_REVALIDATION=PASS'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Load Test database connection from the current API Container App
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        run: bash control/scripts/export-pr55-test-database-url.sh

      - name: Build checksum-pinned migration verification image
        id: migration
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/current-main-migration-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          install -m 0644 control/deployment/containers/pr55-migrator/Dockerfile "$CONTEXT/Dockerfile"
          install -m 0755 control/scripts/temp-apply-current-main-migrations-test.sh "$CONTEXT/apply-pr55-test-migrations.sh"
          install -m 0644 release/database/migrations/051a_pending_approval_day_status_lifecycle.sql "$CONTEXT/migrations/051a_pending_approval_day_status_lifecycle.sql"
          install -m 0644 release/database/migrations/052_document_intelligence_runtime.sql "$CONTEXT/migrations/052_document_intelligence_runtime.sql"
          install -m 0644 release/database/migrations/053_intelligence_answer_orchestration.sql "$CONTEXT/migrations/053_intelligence_answer_orchestration.sql"
          (
            cd "$CONTEXT/migrations"
            sha256sum \
              051a_pending_approval_day_status_lifecycle.sql \
              052_document_intelligence_runtime.sql \
              053_intelligence_answer_orchestration.sql > SHA256SUMS
          )
          printf '%s\n' "$EXPECTED_RELEASE_COMMIT" > "$CONTEXT/release-commit"
          DIGEST="$(control/scripts/build-pr55-acr-image.sh \
            '${{ vars.AZURE_ACR_NAME }}' \
            "project-health-dashboard-migrations051a052053:verify-${EXPECTED_RELEASE_COMMIT}-${GITHUB_SHA:0:12}" \
            "$CONTEXT/Dockerfile" \
            "$CONTEXT")"
          [[ "$DIGEST" == sha256:* ]]
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-migrations051a052053@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify migrations 051A, 052, and 053 before API/web deployment
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          CURRENT_MAIN_MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
          CURRENT_MAIN_MIGRATION_JOB_NAME: cm3-${{ github.run_id }}-${{ github.run_attempt }}-p
          PROJECTPULSE_CURRENT_MAIN_MIGRATION_MODE: verify
        run: bash control/scripts/temp-run-current-main-migration-job.sh

      - name: Build, deploy, validate, and preserve rollback evidence
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: >-
          bash control/scripts/temp-run-current-main-test-deployment.sh
          control
          release
          "$EXPECTED_RELEASE_COMMIT"

      - name: Record deployment workflow evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p control/evidence
          cat > control/evidence/current-main-test-workflow.json <<JSON
          {
            "environment": "test",
            "releaseCommit": "$EXPECTED_RELEASE_COMMIT",
            "controlCommit": "${{ steps.guard.outputs.control_commit }}",
            "workflowRunId": "$GITHUB_RUN_ID",
            "workflowRunAttempt": "$GITHUB_RUN_ATTEMPT",
            "migrationVerifyImage": "${{ steps.migration.outputs.image }}",
            "migrationVerifyDigest": "${{ steps.migration.outputs.digest }}",
            "migrationVerification": "succeeded",
            "apiWebDeployment": "succeeded",
            "privateWorkerEnabled": false,
            "privateRagEnabled": false,
            "vectorIndexCreated": false,
            "privateModelConfigured": false,
            "providerCredentialsChanged": false,
            "productionChanged": false,
            "authenticatedUat": "required"
          }
          JSON
          echo 'CURRENT_MAIN_TEST_DEPLOYMENT_WORKFLOW=COMPLETE'

      - name: Upload deployment diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            control/evidence/
            ${{ runner.temp }}/current-main-289628-probes/
          if-no-files-found: warn
          retention-days: 30
