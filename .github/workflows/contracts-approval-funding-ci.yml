name: Contract approval and funding regression
on:
  pull_request:
    paths:
      - 'deployment/database/060c-*'
      - 'src/backend/ProjectTime.Api/Modules/Contract*'
      - 'src/backend/ProjectTime.Api/Modules/ProductionApprovalWorkModule.cs'
      - 'src/frontend/project-time-web/src/Contract*'
      - 'tests/contracts-approval-funding.test.mjs'
      - 'tests/contracts-release/**'
      - 'scripts/release-test/verify-module060-contract-funding.sql'
      - '.github/workflows/contracts-approval-funding-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source registration
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_HEAD_REF:-}" == 'codex/flowhive-save-schedule-approval-polish' ]]; then
            python3 tests/flowhive-save-release/scope.py
            python3 tests/flowhive-save-release/test_scope.py
          elif [[ "${GITHUB_HEAD_REF:-}" == 'codex/approval-routing-bulk-review' ]]; then
            python3 tests/combined-release/scope.py
            python3 tests/combined-release/test_scope.py
          elif [[ "${GITHUB_HEAD_REF:-}" == 'fix/security-audit-followup-20260929' ]]; then
            python3 tests/security-audit-followup/scope.py
            python3 tests/security-audit-followup/test_scope.py
          elif [[ "${GITHUB_HEAD_REF:-}" == 'fix/security-complete-20260929' ]]; then
            python3 tests/security-completion/scope.py
            python3 tests/security-completion/test_scope.py
          else
            python3 tests/contracts-release/scope.py
            python3 tests/contracts-release/test_scope.py
          fi
      - run: python3 tests/flowhive-migration-package.test.py
      - run: npm install --prefix /tmp/contract-test-runtime @electric-sql/pglite@0.5.8 --no-audit --no-fund
      - run: node tests/contracts-approval-funding.test.mjs
        env:
          PGLITE_MODULE: /tmp/contract-test-runtime/node_modules/@electric-sql/pglite/dist/index.js
