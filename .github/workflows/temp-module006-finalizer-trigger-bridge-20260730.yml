name: Temporary Module 006 Finalizer Trigger Bridge 2026-07-30

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: temp-module006-finalizer-trigger-bridge-20260730
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'tooling/run-module006-finalizer-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Check out current deployment controls
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          path: control

      - name: Check out current PR 276 source branch
        uses: actions/checkout@v4
        with:
          ref: feature/module-006-project-register-20260729
          fetch-depth: 0
          persist-credentials: true
          path: work

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/src/frontend/project-time-web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract the reviewed finalizer steps
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('control/.github/workflows/temp-module006-finalize-20260730.yml').read_text())
          steps = workflow['jobs']['finalize']['steps']
          wanted = {
              'Reconcile Module 006 onto current main': '/tmp/module006-reconcile.sh',
              'Validate exact Module 006 source': '/tmp/module006-validate.sh',
              'Push reconciled PR 276 branch': '/tmp/module006-push.sh',
          }
          found = set()
          for step in steps:
              name = step.get('name')
              if name not in wanted:
                  continue
              run = step.get('run')
              if not isinstance(run, str) or not run.strip():
                  raise SystemExit(f'Missing reviewed run block: {name}')
              path = Path(wanted[name])
              path.write_text('#!/usr/bin/env bash\n' + run)
              path.chmod(0o700)
              found.add(name)
          missing = set(wanted) - found
          if missing:
              raise SystemExit(f'Reviewed finalizer steps not found: {sorted(missing)}')

          reconcile_path = Path('/tmp/module006-reconcile.sh')
          reconcile = reconcile_path.read_text()
          anchor = 'fi\n\nmkdir -p docs/modules/module-006-toyota-hyundai-pipelines'
          replacement = (
              'fi\n\n'
              'git checkout origin/main -- \\\n'
              '  .github/workflows/group5-financial-operations-recovery-ci.yml \\\n'
              '  src/frontend/project-time-web/package.json \\\n'
              '  src/frontend/project-time-web/src/module-availability-registry.js \\\n'
              '  src/frontend/project-time-web/src/scoped-rbac-catalog-compatibility.js \\\n'
              '  src/frontend/project-time-web/scripts/validate-superadmin-sso-expense-module006-package.mjs\n\n'
              'mkdir -p docs/modules/module-006-toyota-hyundai-pipelines'
          )
          if anchor not in reconcile:
              raise SystemExit('Module 006 shared-file restoration anchor was not found.')
          reconcile_path.write_text(reconcile.replace(anchor, replacement, 1))
          PY
          bash -n /tmp/module006-reconcile.sh
          bash -n /tmp/module006-validate.sh
          bash -n /tmp/module006-push.sh
          echo 'MODULE006_FINALIZER_EXTRACTION=PASS'

      - name: Reconcile, validate, and push PR 276
        working-directory: work
        shell: bash
        env:
          TARGET_BRANCH: feature/module-006-project-register-20260729
        run: |
          set -Eeuo pipefail
          bash /tmp/module006-reconcile.sh
          python - <<'PY'
          from pathlib import Path
          import re

          validator = Path('src/frontend/project-time-web/scripts/validate-superadmin-sso-expense-module006-package.mjs')
          source = validator.read_text()
          html_marker = "  'Toyota &amp; Hyundai Pipelines',\n"
          legacy_description = "  'Toyota and Hyundai opportunity, intake, delivery, resourcing, expense, billing, and executive-readiness workflows.',\n"
          if html_marker not in source:
              raise SystemExit('Expected retired Module 006 HTML marker was not found in the cross-module validator.')
          if legacy_description not in source:
              raise SystemExit('Expected retired Module 006 description marker was not found in the cross-module validator.')
          source = source.replace(html_marker, "  \"route: 'toyota-hyundai-pipelines'\",\n", 1)
          source = source.replace(legacy_description, "  'aliases=psa-modules,project-register',\n", 1)
          validator.write_text(source)

          injector = Path('src/frontend/project-time-web/scripts/inject-module-006-toyota-hyundai-pipeline.mjs')
          injector_source = injector.read_text()
          pattern = r"const oldDefinition = `\s*\{[\s\S]*?permissions: \[[^\n]+\]\n\s*\},`;"
          replacement = "const oldDefinition = /\\{\\s*\\n\\s*route: 'psa-modules',[\\s\\S]*?\\n\\s*\\},/;"
          injector_source, count = re.subn(pattern, lambda _match: replacement, injector_source, count=1)
          if count != 1:
              raise SystemExit('Expected exact Module 006 legacy definition template was not found in the injector.')
          expected_guard = "if (!source.includes(oldDefinition)) throw new Error('Module 006 legacy registry block is missing.');"
          replacement_guard = "if (!oldDefinition.test(source) || !source.includes(\"title: 'PSA Modules'\")) throw new Error('Module 006 legacy registry block is missing.');"
          if expected_guard not in injector_source:
              raise SystemExit('Expected Module 006 injector guard was not found.')
          injector_source = injector_source.replace(expected_guard, replacement_guard, 1)
          injector.write_text(injector_source)
          PY
          git add \
            src/frontend/project-time-web/scripts/validate-superadmin-sso-expense-module006-package.mjs \
            src/frontend/project-time-web/scripts/inject-module-006-toyota-hyundai-pipeline.mjs
          git diff --cached --check
          git commit --amend --no-edit
          bash /tmp/module006-validate.sh
          bash /tmp/module006-push.sh

      - name: Publish bridge evidence
        shell: bash
        run: |
          {
            echo '## Module 006 finalizer trigger bridge'
            echo
            echo '- Source branch: feature/module-006-project-register-20260729'
            echo '- Current main reconciliation: completed'
            echo '- Shared integration files restored from current main before reviewed Module 006 changes: yes'
            echo '- Generated Module 006 legacy-block matching is formatting resilient: yes'
            echo '- Cross-module validator updated for the canonical Module 006 route and aliases: yes'
            echo '- Visible identity: Toyota & Hyundai Pipelines'
            echo '- Canonical route: #toyota-hyundai-pipelines'
            echo '- API Release build: passed'
            echo '- Complete frontend production build: passed'
            echo '- Web-container build: passed'
            echo '- Connected migration: none'
            echo '- Test deployment: none'
          } >> "$GITHUB_STEP_SUMMARY"
