name: Apply Celar Oracle Embedding Response Compatibility

on:
  push:
    branches:
      - fix/celar-oracle-embedding-response-compatibility-20260810
    paths:
      - '.github/workflows/apply-celar-oracle-embedding-response-compatibility.yml'
      - 'scripts/apply-celar-oracle-embedding-response-compatibility.py'
      - '.github/workflows/celar-ai-oracle-test-runtime-deploy.yml'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiPrivateEmbeddingClient.cs'
      - 'tests/CelarAiOracleExternalRuntimeTests/Program.cs'
      - 'tests/validate-celar-ai-oracle-test-runtime.mjs'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/apply-celar-oracle-embedding-response-compatibility.yml'
      - 'scripts/apply-celar-oracle-embedding-response-compatibility.py'
      - '.github/workflows/celar-ai-oracle-test-runtime-deploy.yml'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiPrivateEmbeddingClient.cs'
      - 'tests/CelarAiOracleExternalRuntimeTests/Program.cs'
      - 'tests/validate-celar-ai-oracle-test-runtime.mjs'

permissions:
  contents: write

concurrency:
  group: apply-celar-oracle-embedding-response-compatibility
  cancel-in-progress: false

jobs:
  apply:
    name: Patch, validate, and commit embedding compatibility
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'fix/celar-oracle-embedding-response-compatibility-20260810')
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out exact correction branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/celar-oracle-embedding-response-compatibility-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded compatibility corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-celar-oracle-embedding-response-compatibility.py
          git diff --check
          grep -Fq 'ParseVectorCollection' src/backend/ProjectTime.Api/Ai/PulseAiPrivateEmbeddingClient.cs
          grep -Fq 'CELAR_AI_ORACLE_EMBEDDING_RESPONSE_COMPATIBILITY=PASS' tests/CelarAiOracleExternalRuntimeTests/Program.cs
          grep -Fq 'oracle-embedding.json' .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          grep -Fq 'numeric_vector' .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          grep -Fq 'bash scripts/build-pr55-acr-image.sh' .github/workflows/celar-ai-oracle-test-runtime-deploy.yml

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Validate Oracle contracts and behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/validate-celar-ai-oracle-test-runtime.mjs
          node tests/validate-celar-ai-opencloud-deferred-runtime.mjs
          node src/frontend/project-time-web/scripts/validate-celar-ai-release-scoped-runtime.mjs
          dotnet run --project tests/CelarAiOracleExternalRuntimeTests/CelarAiOracleExternalRuntimeTests.csproj --configuration Release -p:ProjectPulseSourceRevision=1111111111111111111111111111111111111111
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          git diff --check

      - name: Commit validated compatibility and remove temporary executor
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/apply-celar-oracle-embedding-response-compatibility.yml \
            scripts/apply-celar-oracle-embedding-response-compatibility.py
          git add -A
          git diff --cached --check
          git config user.name 'Celar Oracle Test Automation'
          git config user.email 'celar-oracle-test-automation@users.noreply.github.com'
          git commit -m 'fix: accept Oracle embedding response variants safely'
          git push origin HEAD:fix/celar-oracle-embedding-response-compatibility-20260810
