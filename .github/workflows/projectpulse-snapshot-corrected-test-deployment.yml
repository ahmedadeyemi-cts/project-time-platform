name: Snapshot Corrected Module 081 and 082 Test Deployment

on:
  pull_request:
    paths:
      - '.github/workflows/projectpulse-snapshot-corrected-test-deployment.yml'

permissions:
  actions: read
  contents: read

jobs:
  snapshot:
    name: Snapshot exact protected Test deployment without mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_WORKFLOW: projectpulse-deploy-test.yml
      TARGET_CONTROL_COMMIT: af5fad6f4feaebe983caceb7a53b8d923d20d3f8

    steps:
      - name: Query exact push-triggered Test deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          RUNS="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?branch=main&event=push&per_page=100"
          )"
          TARGET="$(
            jq -c --arg sha "$TARGET_CONTROL_COMMIT" '
              [.workflow_runs[] | select(.head_sha == $sha and .event == "push")]
              | sort_by(.created_at)
              | reverse
              | .[0] // {}
            ' <<<"$RUNS"
          )"
          RUN_ID="$(jq -r '.id // empty' <<<"$TARGET")"
          [[ -n "$RUN_ID" ]] || {
            echo 'TARGET_RUN_ID=not_found'
            exit 1
          }
          echo "TARGET_RUN_ID=$RUN_ID"
          echo "TARGET_RUN_ATTEMPT=$(jq -r '.run_attempt // 0' <<<"$TARGET")"
          echo "TARGET_RUN_STATUS=$(jq -r '.status // "unknown"' <<<"$TARGET")"
          echo "TARGET_RUN_CONCLUSION=$(jq -r '.conclusion // "none"' <<<"$TARGET")"
          echo "TARGET_RUN_CREATED_AT=$(jq -r '.created_at // "none"' <<<"$TARGET")"
          echo "TARGET_RUN_UPDATED_AT=$(jq -r '.updated_at // "none"' <<<"$TARGET")"
          echo "TARGET_RUN_URL=$(jq -r '.html_url // "none"' <<<"$TARGET")"

          JOBS="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100"
          )"
          jq -r '.jobs[] | [.id, .name, .status, (.conclusion // "none")] | @tsv' <<<"$JOBS" \
            | sed 's/^/TARGET_JOB=/'
          jq -r '.jobs[] | .steps[]? | [.number, .name, .status, (.conclusion // "none")] | @tsv' <<<"$JOBS" \
            | sed 's/^/TARGET_STEP=/'

          ARTIFACTS="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100"
          )"
          jq -r '.artifacts[]? | [.id, .name, (.expired | tostring)] | @tsv' <<<"$ARTIFACTS" \
            | sed 's/^/TARGET_ARTIFACT=/'
          echo 'READ_ONLY_DEPLOYMENT_SNAPSHOT=PASSED'
