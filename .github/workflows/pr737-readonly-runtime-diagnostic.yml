name: PR737 Read-only Protected Test SOW Diagnostic

on:
  push:
    branches:
      - fix/shared-project-document-planning-20260819
    paths:
      - .github/workflows/pr737-readonly-runtime-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: test
    steps:
      - name: Read protected Test document runtime diagnostics
        shell: bash
        env:
          TEST_LOGIN_PASSWORD: ${{ secrets.PROJECTPULSE_M087_PASSWORD }}
        run: |
          set -Eeuo pipefail
          BASE='https://phd-west-test.onenecklab.com'
          USERNAME='project.team.coordinator@ussignal.local'
          DOC_A='3cddc0b5-7d42-4184-a588-2f234fff42e2'
          DOC_B='fedb155e-6b62-4f65-bf6c-850370de3e80'
          payload="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$payload" "$response"' EXIT
          jq -n --arg username "$USERNAME" --arg password "$TEST_LOGIN_PASSWORD" '{username:$username,password:$password}' > "$payload"
          status="$(curl -sS --max-time 60 -o "$response" -w '%{http_code}' \
            -H 'Content-Type: application/json' -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
            --data-binary @"$payload" "$BASE/api/auth/local/login")"
          [[ "$status" == 200 ]] || { echo "ERROR: diagnostic login HTTP=$status" >&2; exit 1; }
          SESSION="$(jq -r '.sessionToken // empty' "$response")"
          [[ ${#SESSION} -gt 20 ]] || { echo 'ERROR: diagnostic session missing' >&2; exit 1; }
          echo "::add-mask::$SESSION"
          unset TEST_LOGIN_PASSWORD

          get_json() {
            local path="$1" out="$2"
            local code
            code="$(curl -sS --max-time 60 -o "$out" -w '%{http_code}' \
              -H "Authorization: Bearer $SESSION" \
              -H "X-ProjectPulse-Session: $SESSION" \
              -H 'X-ProjectPulse-Module-Number: 011' \
              -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
              "$BASE$path")"
            [[ "$code" == 200 ]] || { echo "ERROR: GET $path HTTP=$code" >&2; cat "$out" >&2 || true; exit 1; }
          }

          state_a="$(mktemp)"; state_b="$(mktemp)"
          get_json "/api/celar-ai/v1/documents/$DOC_A/runtime-state" "$state_a"
          get_json "/api/celar-ai/v1/documents/$DOC_B/runtime-state" "$state_b"

          print_state() {
            local label="$1" file="$2"
            echo "=== $label ==="
            jq '{status,document:{documentId:.document.documentId,processingStatus:.document.processingStatus,errorCode:.document.errorCode,processingUpdatedAt:.document.processingUpdatedAt,versionCount:.document.versionCount,activeChunkCount:.document.activeChunkCount,recentJobs:(.document.recentJobs // [] | map({jobId,actualUserId,effectiveUserId,requestedPurpose,status,attemptCount,maximumAttempts,diagnosticCode,diagnosticMessage,requestedAt,startedAt,completedAt,updatedAt}))}}' "$file"
          }
          print_state 'DOCUMENT A RUNTIME STATE' "$state_a"
          print_state 'DOCUMENT B RUNTIME STATE' "$state_b"

          curl -sS --max-time 30 -o /dev/null \
            -X POST -H "Authorization: Bearer $SESSION" -H "X-ProjectPulse-Session: $SESSION" \
            -H 'X-ProjectPulse-Module-Number: 011' -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
            "$BASE/api/auth/session/logout" || true
