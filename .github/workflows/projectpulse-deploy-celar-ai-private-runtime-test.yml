name: ProjectPulse Deploy Celar AI OpenCloud Private Runtime Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact main commit to deploy
        required: true
        type: string
      confirmation:
        description: Enter DEPLOY-CELAR-AI-OPENCLOUD-RUNTIME-TO-TEST after OpenCloud is ready
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Activate and prove private Celar AI runtime
    if: github.ref == 'refs/heads/main'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRIVATE_INFERENCE_ENDPOINT_INPUT: ${{ vars.PROJECTPULSE_TEST_PRIVATE_INFERENCE_ENDPOINT || vars.PROJECTPULSE_PRIVATE_INFERENCE_ENDPOINT }}
      PRIVATE_INFERENCE_MODEL_INPUT: ${{ vars.PROJECTPULSE_TEST_PRIVATE_INFERENCE_MODEL || vars.PROJECTPULSE_PRIVATE_INFERENCE_MODEL }}
      PRIVATE_OCR_ENDPOINT_INPUT: ${{ vars.PROJECTPULSE_TEST_PRIVATE_OCR_ENDPOINT || vars.PROJECTPULSE_PRIVATE_OCR_ENDPOINT }}
      PRIVATE_OCR_MODEL_INPUT: ${{ vars.PROJECTPULSE_TEST_PRIVATE_OCR_MODEL || vars.PROJECTPULSE_PRIVATE_OCR_MODEL }}
      PRIVATE_EMBEDDING_ENDPOINT_INPUT: ${{ vars.PROJECTPULSE_TEST_PRIVATE_EMBEDDING_ENDPOINT || vars.PROJECTPULSE_PRIVATE_EMBEDDING_ENDPOINT }}
      PRIVATE_EMBEDDING_MODEL_INPUT: ${{ vars.PROJECTPULSE_TEST_PRIVATE_EMBEDDING_MODEL || vars.PROJECTPULSE_PRIVATE_EMBEDDING_MODEL }}
      PRIVATE_HOST_ALLOWLIST_INPUT: ${{ vars.PROJECTPULSE_TEST_PRIVATE_ENDPOINT_HOST_ALLOWLIST || vars.PROJECTPULSE_PRIVATE_ENDPOINT_HOST_ALLOWLIST }}
      CLAMAV_HOST_INPUT: ${{ vars.PROJECTPULSE_TEST_CLAMAV_HOST || vars.PROJECTPULSE_PULSE_AI_CLAMAV_HOST }}
      CLAMAV_PORT_INPUT: ${{ vars.PROJECTPULSE_TEST_CLAMAV_PORT || vars.PROJECTPULSE_PULSE_AI_CLAMAV_PORT || '3310' }}
      CLAMAV_SIGNATURE_INPUT: ${{ vars.PROJECTPULSE_TEST_CLAMAV_SIGNATURE_VERSION || vars.PROJECTPULSE_PULSE_AI_DOCUMENT_MALWARE_SIGNATURE_VERSION }}
      UPLOAD_ROOT_INPUT: ${{ vars.PROJECTPULSE_TEST_UPLOAD_ROOT || vars.PROJECTPULSE_UPLOAD_ROOT }}
      INFERENCE_SECRET_REF_INPUT: ${{ vars.PROJECTPULSE_TEST_PRIVATE_INFERENCE_SECRET_REF || 'celar-ai-private-inference-token' }}
      OCR_SECRET_REF_INPUT: ${{ vars.PROJECTPULSE_TEST_PRIVATE_OCR_SECRET_REF || 'celar-ai-private-ocr-token' }}
      EMBEDDING_SECRET_REF_INPUT: ${{ vars.PROJECTPULSE_TEST_PRIVATE_EMBEDDING_SECRET_REF || 'celar-ai-private-embedding-token' }}

    steps:
      - name: Check out exact release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact merged source
        id: release
        shell: bash
        env:
          DISPATCH_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          [[ "$SOURCE_COMMIT" == "$GITHUB_SHA" ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$DISPATCH_CONFIRMATION" == DEPLOY-CELAR-AI-OPENCLOUD-RUNTIME-TO-TEST ]]
            [[ "$DISPATCH_COMMIT" =~ ^[0-9a-f]{40}$ && "$DISPATCH_COMMIT" == "$SOURCE_COMMIT" ]]
          fi
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          test -f database/migrations/080_celar_ai_internal_data_intelligence.sql
          test -f database/migrations/081_celar_ai_private_runtime_activation.sql
          test -f scripts/release-test/apply-celar-ai-private-runtime-080-081.sh
          bash -n scripts/release-test/apply-celar-ai-private-runtime-080-081.sh
          bash -n tests/test-celar-ai-private-runtime-activation-migration-081.sh
          node src/frontend/project-time-web/scripts/validate-module-011-private-rag-orchestration.mjs
          node src/frontend/project-time-web/scripts/validate-celar-ai-release-scoped-runtime.mjs
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Sign in to the protected Test subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve database and private-runtime contracts
        id: contract
        shell: bash
        env:
          UAT_SESSION: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}
          INFERENCE_TOKEN: ${{ secrets.PROJECTPULSE_TEST_PRIVATE_INFERENCE_BEARER_TOKEN || secrets.PROJECTPULSE_PRIVATE_INFERENCE_BEARER_TOKEN }}
          OCR_TOKEN: ${{ secrets.PROJECTPULSE_TEST_PRIVATE_OCR_BEARER_TOKEN || secrets.PROJECTPULSE_PRIVATE_OCR_BEARER_TOKEN }}
          EMBEDDING_TOKEN: ${{ secrets.PROJECTPULSE_TEST_PRIVATE_EMBEDDING_BEARER_TOKEN || secrets.PROJECTPULSE_PRIVATE_EMBEDDING_BEARER_TOKEN }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          current_env() {
            jq -r --arg name "$1" '[.properties.template.containers[0].env[]? | select(.name == $name) | .value // empty] | if length == 1 then .[0] else empty end' <<<"$API_JSON"
          }
          current_secret_ref() {
            jq -r --arg name "$1" '[.properties.template.containers[0].env[]? | select(.name == $name) | .secretRef // empty] | if length == 1 then .[0] else empty end' <<<"$API_JSON"
          }
          prefer() { [[ -n "${1:-}" ]] && printf '%s' "$1" || printf '%s' "${2:-}"; }
          require_value() { [[ -n "${2:-}" ]] || fail "$1 is not configured in the Test environment or the protected API."; }

          CURRENT_SUBSCRIPTION="$(az account show --query id -o tsv --only-show-errors)"
          [[ "${CURRENT_SUBSCRIPTION,,}" == "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]] || fail 'Azure login is outside Test.'
          API_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          [[ "$(jq -r '.tags.environment // empty' <<<"$API_JSON")" == test ]] || fail 'The API is not tagged as Test.'
          [[ -n "$UAT_SESSION" ]] || fail 'PROJECTPULSE_TEST_UAT_SESSION is required for audited approval and UAT.'

          PRIVATE_INFERENCE_ENDPOINT="$(prefer "$PRIVATE_INFERENCE_ENDPOINT_INPUT" "$(current_env PROJECTPULSE_PRIVATE_INFERENCE_ENDPOINT)")"
          PRIVATE_INFERENCE_MODEL="$(prefer "$PRIVATE_INFERENCE_MODEL_INPUT" "$(current_env PROJECTPULSE_PRIVATE_INFERENCE_MODEL)")"
          PRIVATE_OCR_ENDPOINT="$(prefer "$PRIVATE_OCR_ENDPOINT_INPUT" "$(current_env PROJECTPULSE_PRIVATE_OCR_ENDPOINT)")"
          PRIVATE_OCR_MODEL="$(prefer "$PRIVATE_OCR_MODEL_INPUT" "$(current_env PROJECTPULSE_PRIVATE_OCR_MODEL)")"
          PRIVATE_EMBEDDING_ENDPOINT="$(prefer "$PRIVATE_EMBEDDING_ENDPOINT_INPUT" "$(current_env PROJECTPULSE_PRIVATE_EMBEDDING_ENDPOINT)")"
          PRIVATE_EMBEDDING_MODEL="$(prefer "$PRIVATE_EMBEDDING_MODEL_INPUT" "$(current_env PROJECTPULSE_PRIVATE_EMBEDDING_MODEL)")"
          PRIVATE_HOST_ALLOWLIST="$(prefer "$PRIVATE_HOST_ALLOWLIST_INPUT" "$(current_env PROJECTPULSE_PRIVATE_ENDPOINT_HOST_ALLOWLIST)")"
          CLAMAV_HOST="$(prefer "$CLAMAV_HOST_INPUT" "$(current_env PROJECTPULSE_PULSE_AI_CLAMAV_HOST)")"
          CLAMAV_PORT="$(prefer "$CLAMAV_PORT_INPUT" "$(current_env PROJECTPULSE_PULSE_AI_CLAMAV_PORT)")"
          CLAMAV_SIGNATURE="$(prefer "$CLAMAV_SIGNATURE_INPUT" "$(current_env PROJECTPULSE_PULSE_AI_DOCUMENT_MALWARE_SIGNATURE_VERSION)")"
          UPLOAD_ROOT="$(prefer "$UPLOAD_ROOT_INPUT" "$(current_env PROJECTPULSE_UPLOAD_ROOT)")"
          INFERENCE_SECRET_REF="$(prefer "$(current_secret_ref PROJECTPULSE_PRIVATE_INFERENCE_BEARER_TOKEN)" "$INFERENCE_SECRET_REF_INPUT")"
          OCR_SECRET_REF="$(prefer "$(current_secret_ref PROJECTPULSE_PRIVATE_OCR_BEARER_TOKEN)" "$OCR_SECRET_REF_INPUT")"
          EMBEDDING_SECRET_REF="$(prefer "$(current_secret_ref PROJECTPULSE_PRIVATE_EMBEDDING_BEARER_TOKEN)" "$EMBEDDING_SECRET_REF_INPUT")"

          for pair in \
            "private inference endpoint|$PRIVATE_INFERENCE_ENDPOINT" \
            "private inference model|$PRIVATE_INFERENCE_MODEL" \
            "private OCR endpoint|$PRIVATE_OCR_ENDPOINT" \
            "private OCR model|$PRIVATE_OCR_MODEL" \
            "private embedding endpoint|$PRIVATE_EMBEDDING_ENDPOINT" \
            "private embedding model|$PRIVATE_EMBEDDING_MODEL" \
            "private endpoint allowlist|$PRIVATE_HOST_ALLOWLIST" \
            "ClamAV host|$CLAMAV_HOST" \
            "ClamAV signature version|$CLAMAV_SIGNATURE" \
            "persistent upload root|$UPLOAD_ROOT"; do
            require_value "${pair%%|*}" "${pair#*|}"
          done
          [[ "$PRIVATE_INFERENCE_ENDPOINT" == https://* && "$PRIVATE_OCR_ENDPOINT" == https://* && "$PRIVATE_EMBEDDING_ENDPOINT" == https://* ]] || fail 'All private HTTP endpoints must use HTTPS.'
          [[ "$CLAMAV_PORT" =~ ^[0-9]{1,5}$ ]] && (( CLAMAV_PORT >= 1 && CLAMAV_PORT <= 65535 )) || fail 'ClamAV port is invalid.'
          [[ "$INFERENCE_SECRET_REF" =~ ^[a-z0-9][a-z0-9.-]{0,62}$ && "$OCR_SECRET_REF" =~ ^[a-z0-9][a-z0-9.-]{0,62}$ && "$EMBEDDING_SECRET_REF" =~ ^[a-z0-9][a-z0-9.-]{0,62}$ ]] || fail 'A private-service secret reference is invalid.'

          PRIVATE_HOST_ALLOWLIST="$(sed -E 's/[;[:space:]]+/,/g; s/^,+//; s/,+$//' <<<"$PRIVATE_HOST_ALLOWLIST")"
          MOUNT_NAME="$(jq -r --arg root "$UPLOAD_ROOT" '
            [.properties.template.containers[0].volumeMounts[]? | .mountPath as $mount |
              select($root == $mount or ($root | startswith($mount + "/"))) | .volumeName] |
              if length == 1 then .[0] else empty end
          ' <<<"$API_JSON")"
          [[ -n "$MOUNT_NAME" ]] || fail 'The upload root is not inside exactly one mounted Container Apps volume.'
          jq -e --arg name "$MOUNT_NAME" '
            [.properties.template.volumes[]? | select(.name == $name and .storageType == "AzureFile")] | length == 1
          ' <<<"$API_JSON" >/dev/null || fail 'The upload root is not backed by one AzureFile persistent volume.'

          SECRET_JSON="$(az containerapp secret list -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          secret_or_token() {
            local name="$1" token="$2" label="$3"
            if jq -e --arg name "$name" 'any(.[]; .name == $name)' <<<"$SECRET_JSON" >/dev/null; then return; fi
            [[ -n "$token" ]] || fail "$label secret $name does not exist and no protected GitHub secret was supplied."
          }
          secret_or_token "$INFERENCE_SECRET_REF" "$INFERENCE_TOKEN" 'Private inference'
          secret_or_token "$OCR_SECRET_REF" "$OCR_TOKEN" 'Private OCR'
          secret_or_token "$EMBEDDING_SECRET_REF" "$EMBEDDING_TOKEN" 'Private embedding'

          DATABASE_HOST="$(current_env PTP_DB_HOST)"; DATABASE_PORT="$(current_env PTP_DB_PORT)"
          DATABASE_NAME="$(current_env PTP_DB_NAME)"; DATABASE_USER="$(current_env PTP_DB_USER)"
          PASSWORD_SECRET_REF="$(current_secret_ref PTP_DB_PASSWORD)"
          [[ "$DATABASE_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}[A-Za-z0-9]$ && "$DATABASE_PORT" =~ ^[0-9]{1,5}$ && "$DATABASE_NAME" =~ ^[A-Za-z_][A-Za-z0-9_]{0,62}$ && "$DATABASE_USER" =~ ^[A-Za-z_][A-Za-z0-9_]{0,62}$ && -n "$PASSWORD_SECRET_REF" ]] || fail 'The protected database contract is incomplete.'
          KEY_VAULT_SECRET_URI="$(jq -r --arg name "$PASSWORD_SECRET_REF" '[.[] | select(.name == $name) | .keyVaultUrl // empty] | if length == 1 then .[0] else empty end' <<<"$SECRET_JSON")"
          MIGRATOR_IDENTITY="$(jq -r --arg name "$PASSWORD_SECRET_REF" '[.[] | select(.name == $name) | .identity // empty] | if length == 1 then .[0] else empty end' <<<"$SECRET_JSON")"
          [[ "$KEY_VAULT_SECRET_URI" =~ ^https://[a-z0-9-]+\.vault\.azure\.net/secrets/[A-Za-z0-9-]+(/[0-9A-Fa-f]{32})?$ ]] || fail 'The database password is not an exact Key Vault reference.'
          [[ "${MIGRATOR_IDENTITY,,}" =~ ^/subscriptions/[^/]+/resourcegroups/[^/]+/providers/microsoft\.managedidentity/userassignedidentities/[^/]+$ ]] || fail 'The migrator identity is invalid.'

          jq '.properties.template.containers[0].env // []' <<<"$API_JSON" > "$RUNNER_TEMP/private-runtime-before-env.json"
          printf '%s\n' "$(jq -r '.[].name' <<<"$SECRET_JSON")" > "$RUNNER_TEMP/private-runtime-before-secret-names"
          printf '%s\n' "$(jq -r '.properties.template.containers[0].image' <<<"$API_JSON")" > "$RUNNER_TEMP/private-runtime-before-api-image"
          az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.template.containers[0].image -o tsv --only-show-errors > "$RUNNER_TEMP/private-runtime-before-web-image"

          {
            printf 'PRIVATE_INFERENCE_ENDPOINT=%s\n' "$PRIVATE_INFERENCE_ENDPOINT"
            printf 'PRIVATE_INFERENCE_MODEL=%s\n' "$PRIVATE_INFERENCE_MODEL"
            printf 'PRIVATE_OCR_ENDPOINT=%s\n' "$PRIVATE_OCR_ENDPOINT"
            printf 'PRIVATE_OCR_MODEL=%s\n' "$PRIVATE_OCR_MODEL"
            printf 'PRIVATE_EMBEDDING_ENDPOINT=%s\n' "$PRIVATE_EMBEDDING_ENDPOINT"
            printf 'PRIVATE_EMBEDDING_MODEL=%s\n' "$PRIVATE_EMBEDDING_MODEL"
            printf 'PRIVATE_HOST_ALLOWLIST=%s\n' "$PRIVATE_HOST_ALLOWLIST"
            printf 'CLAMAV_HOST=%s\n' "$CLAMAV_HOST"
            printf 'CLAMAV_PORT=%s\n' "$CLAMAV_PORT"
            printf 'CLAMAV_SIGNATURE=%s\n' "$CLAMAV_SIGNATURE"
            printf 'UPLOAD_ROOT=%s\n' "$UPLOAD_ROOT"
            printf 'INFERENCE_SECRET_REF=%s\n' "$INFERENCE_SECRET_REF"
            printf 'OCR_SECRET_REF=%s\n' "$OCR_SECRET_REF"
            printf 'EMBEDDING_SECRET_REF=%s\n' "$EMBEDDING_SECRET_REF"
          } >> "$GITHUB_ENV"
          echo "migrator_identity=$MIGRATOR_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "key_vault_uri=${KEY_VAULT_SECRET_URI%%/secrets/*}" >> "$GITHUB_OUTPUT"
          echo "database_password_secret_name=${KEY_VAULT_SECRET_URI#*/secrets/}" >> "$GITHUB_OUTPUT"
          echo "database_host=$DATABASE_HOST" >> "$GITHUB_OUTPUT"
          echo "database_port=$DATABASE_PORT" >> "$GITHUB_OUTPUT"
          echo "database_name=$DATABASE_NAME" >> "$GITHUB_OUTPUT"
          echo "database_user=$DATABASE_USER" >> "$GITHUB_OUTPUT"

      - name: Build checksum-pinned migrations 080 and 081 image
        id: migration
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/celar-ai-080-081-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          install -m 0644 deployment/containers/pr55-migrator/Dockerfile "$CONTEXT/Dockerfile"
          install -m 0755 scripts/release-test/apply-celar-ai-private-runtime-080-081.sh "$CONTEXT/apply-pr55-test-migrations.sh"
          install -m 0644 database/migrations/080_celar_ai_internal_data_intelligence.sql database/migrations/081_celar_ai_private_runtime_activation.sql "$CONTEXT/migrations/"
          (cd "$CONTEXT/migrations" && sha256sum 080_celar_ai_internal_data_intelligence.sql 081_celar_ai_private_runtime_activation.sql > SHA256SUMS)
          printf '%s\n' '${{ steps.release.outputs.source_commit }}' > "$CONTEXT/release-commit"
          DIGEST="$(scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-celar-ai-080-081:${{ steps.release.outputs.source_commit }}-${GITHUB_RUN_ID}" "$CONTEXT/Dockerfile" "$CONTEXT")"
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-celar-ai-080-081@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Apply and verify migrations 080 and 081 inside the private Test network
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID: ${{ steps.contract.outputs.migrator_identity }}
          AZURE_KEY_VAULT_URI: ${{ steps.contract.outputs.key_vault_uri }}
          PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME: ${{ steps.contract.outputs.database_password_secret_name }}
          PROJECTPULSE_TEST_DATABASE_HOST: ${{ steps.contract.outputs.database_host }}
          PROJECTPULSE_TEST_DATABASE_PORT: ${{ steps.contract.outputs.database_port }}
          PROJECTPULSE_TEST_DATABASE_NAME: ${{ steps.contract.outputs.database_name }}
          PROJECTPULSE_TEST_DATABASE_USER: ${{ steps.contract.outputs.database_user }}
          MAIN_RELEASE_CONTROL_SHA: ${{ steps.release.outputs.source_commit }}
          MAIN_RELEASE_EXPECTED_RELEASE_COMMIT: ${{ steps.release.outputs.source_commit }}
          MAIN_RELEASE_MIGRATION_SCOPE: celar-ai-private-runtime-080-081-test
          MAIN_RELEASE_MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
        run: |
          set -Eeuo pipefail
          MAIN_RELEASE_MIGRATION_JOB_NAME="ca081-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-a" MAIN_RELEASE_MIGRATION_MODE=apply bash scripts/release-test/run-migration-job.sh
          MAIN_RELEASE_MIGRATION_JOB_NAME="ca081-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-v" MAIN_RELEASE_MIGRATION_MODE=verify bash scripts/release-test/run-migration-job.sh

      - name: Build immutable API and web images
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA='${{ steps.release.outputs.source_commit }}'
          API_DIGEST="$(scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-api:celar-private-$SHA" deployment/containers/api/Dockerfile .)"
          WEB_DIGEST="$(scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-web:celar-private-$SHA" deployment/containers/web/Dockerfile .)"
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-api@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-web@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Configure private service secrets and deploy API
        id: deploy_api
        shell: bash
        env:
          INFERENCE_TOKEN: ${{ secrets.PROJECTPULSE_TEST_PRIVATE_INFERENCE_BEARER_TOKEN || secrets.PROJECTPULSE_PRIVATE_INFERENCE_BEARER_TOKEN }}
          OCR_TOKEN: ${{ secrets.PROJECTPULSE_TEST_PRIVATE_OCR_BEARER_TOKEN || secrets.PROJECTPULSE_PRIVATE_OCR_BEARER_TOKEN }}
          EMBEDDING_TOKEN: ${{ secrets.PROJECTPULSE_TEST_PRIVATE_EMBEDDING_BEARER_TOKEN || secrets.PROJECTPULSE_PRIVATE_EMBEDDING_BEARER_TOKEN }}
        run: |
          set -Eeuo pipefail
          RESOURCE_GROUP='${{ vars.AZURE_RESOURCE_GROUP }}'; API_APP='${{ vars.AZURE_API_APP }}'
          : > "$RUNNER_TEMP/private-runtime-new-secrets"
          ensure_secret() {
            local name="$1" value="$2"
            if grep -Fxq "$name" "$RUNNER_TEMP/private-runtime-before-secret-names"; then return; fi
            [[ -n "$value" ]] || { echo "Missing protected value for $name" >&2; return 1; }
            az containerapp secret set -g "$RESOURCE_GROUP" -n "$API_APP" --secrets "$name=$value" --output none --only-show-errors
            printf '%s\n' "$name" >> "$RUNNER_TEMP/private-runtime-new-secrets"
          }
          ensure_secret "$INFERENCE_SECRET_REF" "$INFERENCE_TOKEN"
          ensure_secret "$OCR_SECRET_REF" "$OCR_TOKEN"
          ensure_secret "$EMBEDDING_SECRET_REF" "$EMBEDDING_TOKEN"

          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g "$RESOURCE_GROUP" -n "$API_APP" \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars \
              PROJECTPULSE_ENVIRONMENT=test \
              PROJECTPULSE_SOURCE_COMMIT='${{ steps.release.outputs.source_commit }}' \
              PROJECTPULSE_CELAR_AI_ENABLED=true \
              PROJECTPULSE_CELAR_AI_DEPLOYMENT_MANAGED=true \
              PROJECTPULSE_PULSE_AI_PRIVATE_RAG_ENABLED=true \
              PROJECTPULSE_PRIVATE_INFERENCE_REQUIRED_FOR_DOCUMENTS=true \
              PROJECTPULSE_PULSE_AI_RAG_REQUIRE_PRIVATE_MODEL=true \
              PROJECTPULSE_PRIVATE_INFERENCE_ENDPOINT="$PRIVATE_INFERENCE_ENDPOINT" \
              PROJECTPULSE_PRIVATE_INFERENCE_MODEL="$PRIVATE_INFERENCE_MODEL" \
              PROJECTPULSE_PRIVATE_INFERENCE_AUTH_MODE=bearer \
              PROJECTPULSE_PRIVATE_INFERENCE_BEARER_TOKEN="secretref:$INFERENCE_SECRET_REF" \
              PROJECTPULSE_PRIVATE_INFERENCE_BEARER_TOKEN_SECRET_REFERENCE="$INFERENCE_SECRET_REF" \
              PROJECTPULSE_PRIVATE_OCR_ENDPOINT="$PRIVATE_OCR_ENDPOINT" \
              PROJECTPULSE_PRIVATE_OCR_MODEL="$PRIVATE_OCR_MODEL" \
              PROJECTPULSE_PRIVATE_OCR_BEARER_TOKEN="secretref:$OCR_SECRET_REF" \
              PROJECTPULSE_PRIVATE_OCR_BEARER_TOKEN_SECRET_REFERENCE="$OCR_SECRET_REF" \
              PROJECTPULSE_PRIVATE_EMBEDDING_ENDPOINT="$PRIVATE_EMBEDDING_ENDPOINT" \
              PROJECTPULSE_PRIVATE_EMBEDDING_MODEL="$PRIVATE_EMBEDDING_MODEL" \
              PROJECTPULSE_PRIVATE_EMBEDDING_BEARER_TOKEN="secretref:$EMBEDDING_SECRET_REF" \
              PROJECTPULSE_PRIVATE_EMBEDDING_BEARER_TOKEN_SECRET_REFERENCE="$EMBEDDING_SECRET_REF" \
              PROJECTPULSE_PRIVATE_ENDPOINT_HOST_ALLOWLIST="$PRIVATE_HOST_ALLOWLIST" \
              PROJECTPULSE_PRIVATE_VECTOR_INDEX=projectpulse_postgresql_hybrid \
              PROJECTPULSE_PULSE_AI_DOCUMENT_MALWARE_SCANNER_MODE=clamav_tcp \
              PROJECTPULSE_PULSE_AI_CLAMAV_HOST="$CLAMAV_HOST" \
              PROJECTPULSE_PULSE_AI_CLAMAV_PORT="$CLAMAV_PORT" \
              PROJECTPULSE_PULSE_AI_CLAMAV_TIMEOUT_SECONDS=45 \
              PROJECTPULSE_PULSE_AI_DOCUMENT_MALWARE_SIGNATURE_VERSION="$CLAMAV_SIGNATURE" \
              PROJECTPULSE_PULSE_AI_DOCUMENT_MALWARE_SCAN_ATTESTED=true \
              PROJECTPULSE_PULSE_AI_DOCUMENT_MALWARE_SCAN_APPROVAL_REFERENCE="github-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              PROJECTPULSE_PULSE_AI_DOCUMENT_EXTRACTION_PREVIEW_ENABLED=true \
              PROJECTPULSE_PULSE_AI_PRIVATE_RUNTIME_WORKER_ENABLED=true \
              PROJECTPULSE_PULSE_AI_AUTO_QUEUE_ELIGIBLE_DOCUMENTS=true \
              PROJECTPULSE_PULSE_AI_DOCUMENT_SERVICE_PRINCIPAL_USER_ID=08100000-0000-0000-0000-000000000001 \
              PROJECTPULSE_UPLOAD_ROOT="$UPLOAD_ROOT" \
              PROJECTPULSE_UPLOAD_ROOT_SHARED_PERSISTENT=true \
            --revision-suffix "capr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
          REVISION="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.latestRevisionName -o tsv --only-show-errors)"
          bash scripts/wait-containerapp-ready-revision.sh "$RESOURCE_GROUP" "$API_APP" "$REVISION" '${{ steps.build.outputs.api_image }}' 60 10
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Prove private services, process and approve SOW evidence, and run FlowHive
        id: uat
        shell: bash
        env:
          UAT_SESSION: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          auth=(-H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" -H "X-Project-Pulse-Session: $UAT_SESSION" -H "X-Session-Token: $UAT_SESSION")
          get() { curl -fsS --max-time 45 -H 'Cache-Control: no-cache' "${auth[@]}" "$BASE$1"; }
          post() { curl -fsS --max-time 120 -H 'Cache-Control: no-cache' -H 'Content-Type: application/json' -H "Origin: $BASE" "${auth[@]}" -d "$2" "$BASE$1"; }

          for attempt in $(seq 1 36); do
            PIPELINE="$(get /api/celar-ai/v1/documents/pipeline/readiness || true)"
            RUNTIME="$(get /api/celar-ai/v1/documents/runtime/readiness || true)"
            if jq -e '
                .readiness.malwareScanAttested == true and
                .readiness.ocrEndpointConfigured == true and
                .readiness.privateEmbeddingEndpointConfigured == true and
                .readiness.privateVectorIndexConfigured == true and
                .readiness.supportedDocumentCount > 0
              ' <<<"$PIPELINE" >/dev/null 2>&1 \
              && jq -e '
                .readiness.workerEnabled == true and
                .readiness.automaticDocumentQueueEnabled == true and
                .readiness.documentServicePrincipalAuthorized == true and
                .readiness.uploadStorageProductionReady == true and
                .readiness.clamAvConfigured == true and
                .readiness.malwareScannerEndpointPrivate == true and
                .readiness.ocrConfigured == true and
                .readiness.ocrEndpointPrivate == true and
                .readiness.embeddingConfigured == true and
                .readiness.embeddingEndpointPrivate == true
              ' <<<"$RUNTIME" >/dev/null 2>&1; then break; fi
            [[ "$attempt" != 36 ]] || { jq '{status,readiness}' <<<"$PIPELINE" >&2 || true; jq '{status,readiness}' <<<"$RUNTIME" >&2 || true; exit 1; }
            sleep 10
          done

          PROBE="$(post /api/ai-configuration/private-model/test '{}')"
          jq -e '.status == "private_model_available" and .configured == true and .available == true' <<<"$PROBE" >/dev/null

          SUCCEEDED=''
          for attempt in $(seq 1 60); do
            JOBS="$(get '/api/celar-ai/v1/documents/runtime/jobs?status=succeeded&limit=200' || true)"
            SUCCEEDED="$(jq -c '[.jobs[]? | select((.documentCategory == "sow" or .documentCategory == "gsd") and (.sourceSha256 | length == 64))] | sort_by(.completedAt) | last // empty' <<<"$JOBS" 2>/dev/null || true)"
            [[ -n "$SUCCEEDED" ]] && break
            [[ "$attempt" != 60 ]] || { jq '{status,summary,jobs}' <<<"$JOBS" >&2 || true; exit 1; }
            sleep 10
          done

          DOCUMENT_ID="$(jq -r .documentId <<<"$SUCCEEDED")"
          PROJECT_ID="$(jq -r '.projectId // empty' <<<"$SUCCEEDED")"
          PROJECT_CODE="$(jq -r .projectCode <<<"$SUCCEEDED")"
          PROJECT_NAME="$(jq -r .projectName <<<"$SUCCEEDED")"
          STATE="$(get "/api/celar-ai/v1/documents/$DOCUMENT_ID/runtime-state")"
          VERSION_ID="$(jq -r '.document.activeVersionId // empty' <<<"$STATE")"
          SOURCE_SHA="$(jq -r '.document.activeVersionSourceSha256 // empty' <<<"$STATE")"
          [[ "$VERSION_ID" =~ ^[0-9a-fA-F-]{36}$ && "$SOURCE_SHA" =~ ^[0-9a-f]{64}$ ]]
          APPROVAL_PAYLOAD="$(jq -nc --arg sha "$SOURCE_SHA" '{reason:"Authorized Test activation for citation-ready SOW/FlowHive evidence",expectedSourceSha256:$sha,confirmation:"APPROVE-CELAR-AI-PRIVATE-DOCUMENT-VERSION"}')"
          APPROVAL="$(post "/api/celar-ai/v1/documents/$DOCUMENT_ID/versions/$VERSION_ID/approve" "$APPROVAL_PAYLOAD")"
          jq -e '.status == "document_version_approved" and .retrievalEligible == true' <<<"$APPROVAL" >/dev/null

          for attempt in $(seq 1 24); do
            RAG="$(get /api/celar-ai/v1/rag/readiness || true)"
            jq -e '.readiness.status == "private_rag_ready" and .readiness.retrievalReady == true and (.readiness.blockers | length == 0)' <<<"$RAG" >/dev/null 2>&1 && break
            [[ "$attempt" != 24 ]] || { jq '{status,readiness}' <<<"$RAG" >&2 || true; exit 1; }
            sleep 5
          done

          START_DATE="$(date -u +%F)"; END_DATE="$(date -u -d '+120 days' +%F)"
          FLOW_PAYLOAD="$(jq -nc --arg projectId "$PROJECT_ID" --arg code "$PROJECT_CODE" --arg name "$PROJECT_NAME" --arg start "$START_DATE" --arg end "$END_DATE" '{plan:{projectId:(if ($projectId|length)>0 then $projectId else null end),projectCode:$code,projectName:$name,planName:"Celar AI private-runtime activation proof",revisionLabel:"deployment-uat",projectStartDate:$start,projectEndDate:$end,tasks:[],dependencies:[],assignments:[]},requestedOutcome:"Create a detailed implementation plan grounded in the approved SOW Scope of Services.",detailLevel:"comprehensive",diagramType:"flowchart",allowSanitizedExternalFallback:false}')"
          FLOW="$(post /api/project-flowhive/ai/production-generate "$FLOW_PAYLOAD")"
          jq -e '
            (.status == "celar_ai_flowhive_review_draft_completed" or .status == "celar_ai_flowhive_review_draft_requires_correction") and
            .planningEvidence.privateSourceGroundedPlan == true and
            .planningEvidence.approvedSowCitationCount > 0 and
            .planningEvidence.scopeOfServicesCitationCount > 0 and
            (.citations | length > 0) and (.privatePlan.tasks | length > 0) and
            .reviewControls.persistencePerformed == false
          ' <<<"$FLOW" >/dev/null
          jq -n --arg documentId "$DOCUMENT_ID" --arg versionId "$VERSION_ID" --arg projectCode "$PROJECT_CODE" --arg flowStatus "$(jq -r .status <<<"$FLOW")" '{documentId:$documentId,versionId:$versionId,projectCode:$projectCode,privateModelProbe:"available",privateRag:"ready",flowHiveStatus:$flowStatus,citationCount:1}' > "$RUNNER_TEMP/celar-ai-private-runtime-uat.json"
          echo "project_code=$PROJECT_CODE" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify web UI
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --image '${{ steps.build.outputs.web_image }}' --revision-suffix "caprw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
          REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
          bash scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_WEB_APP }}' "$REVISION" '${{ steps.build.outputs.web_image }}' 60 10
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          READY=false
          for attempt in $(seq 1 24); do
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/?celar_private=$GITHUB_RUN_ID-$attempt" -o /tmp/celar-index || true
            JS="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/celar-index | head -1)"
            [[ -n "$JS" ]] || { sleep 5; continue; }
            case "$JS" in http*) URL="$JS";; /*) URL="$BASE$JS";; *) URL="$BASE/$JS";; esac
            curl -fsSL --max-time 45 -H 'Cache-Control: no-cache' "$URL?celar_private=$GITHUB_RUN_ID-$attempt" -o /tmp/celar-app.js || true
            if grep -Fq 'Private RAG readiness' /tmp/celar-app.js && ! grep -Fq 'String(value??"Not recorded")' /tmp/celar-app.js; then READY=true; break; fi
            sleep 5
          done
          [[ "$READY" == true ]]
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Publish deployment evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          jq -n \
            --arg releaseCommit '${{ steps.release.outputs.source_commit }}' \
            --arg migrationImage '${{ steps.migration.outputs.image }}' \
            --arg apiImage '${{ steps.build.outputs.api_image }}' \
            --arg webImage '${{ steps.build.outputs.web_image }}' \
            --arg apiRevision '${{ steps.deploy_api.outputs.revision }}' \
            --arg webRevision '${{ steps.deploy_web.outputs.revision }}' \
            --argjson uat "$(cat "$RUNNER_TEMP/celar-ai-private-runtime-uat.json")" \
            '{environment:"test",releaseCommit:$releaseCommit,migrations:["080","081"],migrationImage:$migrationImage,apiImage:$apiImage,webImage:$webImage,apiRevision:$apiRevision,webRevision:$webRevision,privateInference:"probed_available",privateMalwareScanning:"private_endpoint_verified_and_executed",privateOcr:"private_endpoint_verified",privateEmbedding:"private_endpoint_verified_and_executed",privateRag:"ready",flowHive:"sow_citation_grounded",uat:$uat}' > evidence/celar-ai-private-runtime-test.json

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: celar-ai-private-runtime-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/celar-ai-private-runtime-test.json
          retention-days: 30

      - name: Restore previous application configuration on failure
        if: ${{ failure() && steps.deploy_api.outputs.started == 'true' }}
        shell: bash
        run: |
          set +e
          RESOURCE_GROUP='${{ vars.AZURE_RESOURCE_GROUP }}'; API_APP='${{ vars.AZURE_API_APP }}'
          TOUCHED=(
            PROJECTPULSE_ENVIRONMENT PROJECTPULSE_SOURCE_COMMIT PROJECTPULSE_CELAR_AI_ENABLED PROJECTPULSE_CELAR_AI_DEPLOYMENT_MANAGED
            PROJECTPULSE_PULSE_AI_PRIVATE_RAG_ENABLED PROJECTPULSE_PRIVATE_INFERENCE_REQUIRED_FOR_DOCUMENTS PROJECTPULSE_PULSE_AI_RAG_REQUIRE_PRIVATE_MODEL
            PROJECTPULSE_PRIVATE_INFERENCE_ENDPOINT PROJECTPULSE_PRIVATE_INFERENCE_MODEL PROJECTPULSE_PRIVATE_INFERENCE_AUTH_MODE PROJECTPULSE_PRIVATE_INFERENCE_BEARER_TOKEN PROJECTPULSE_PRIVATE_INFERENCE_BEARER_TOKEN_SECRET_REFERENCE
            PROJECTPULSE_PRIVATE_OCR_ENDPOINT PROJECTPULSE_PRIVATE_OCR_MODEL PROJECTPULSE_PRIVATE_OCR_BEARER_TOKEN PROJECTPULSE_PRIVATE_OCR_BEARER_TOKEN_SECRET_REFERENCE
            PROJECTPULSE_PRIVATE_EMBEDDING_ENDPOINT PROJECTPULSE_PRIVATE_EMBEDDING_MODEL PROJECTPULSE_PRIVATE_EMBEDDING_BEARER_TOKEN PROJECTPULSE_PRIVATE_EMBEDDING_BEARER_TOKEN_SECRET_REFERENCE
            PROJECTPULSE_PRIVATE_ENDPOINT_HOST_ALLOWLIST PROJECTPULSE_PRIVATE_VECTOR_INDEX PROJECTPULSE_PULSE_AI_DOCUMENT_MALWARE_SCANNER_MODE PROJECTPULSE_PULSE_AI_CLAMAV_HOST PROJECTPULSE_PULSE_AI_CLAMAV_PORT PROJECTPULSE_PULSE_AI_CLAMAV_TIMEOUT_SECONDS
            PROJECTPULSE_PULSE_AI_DOCUMENT_MALWARE_SIGNATURE_VERSION PROJECTPULSE_PULSE_AI_DOCUMENT_MALWARE_SCAN_ATTESTED PROJECTPULSE_PULSE_AI_DOCUMENT_MALWARE_SCAN_APPROVAL_REFERENCE PROJECTPULSE_PULSE_AI_DOCUMENT_EXTRACTION_PREVIEW_ENABLED
            PROJECTPULSE_PULSE_AI_PRIVATE_RUNTIME_WORKER_ENABLED PROJECTPULSE_PULSE_AI_AUTO_QUEUE_ELIGIBLE_DOCUMENTS PROJECTPULSE_PULSE_AI_DOCUMENT_SERVICE_PRINCIPAL_USER_ID PROJECTPULSE_UPLOAD_ROOT PROJECTPULSE_UPLOAD_ROOT_SHARED_PERSISTENT
          )
          RESTORE=(); REMOVE=()
          for name in "${TOUCHED[@]}"; do
            row="$(jq -c --arg name "$name" '[.[] | select(.name == $name)] | if length == 1 then .[0] else empty end' "$RUNNER_TEMP/private-runtime-before-env.json")"
            if [[ -z "$row" ]]; then REMOVE+=("$name"); continue; fi
            secret="$(jq -r '.secretRef // empty' <<<"$row")"; value="$(jq -r '.value // empty' <<<"$row")"
            [[ -n "$secret" ]] && RESTORE+=("$name=secretref:$secret") || RESTORE+=("$name=$value")
          done
          OLD_API_IMAGE="$(cat "$RUNNER_TEMP/private-runtime-before-api-image")"
          UPDATE_ARGS=(-g "$RESOURCE_GROUP" -n "$API_APP" --image "$OLD_API_IMAGE" --revision-suffix "caprrb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors)
          (( ${#RESTORE[@]} > 0 )) && UPDATE_ARGS+=(--set-env-vars "${RESTORE[@]}")
          (( ${#REMOVE[@]} > 0 )) && UPDATE_ARGS+=(--remove-env-vars "${REMOVE[@]}")
          az containerapp update "${UPDATE_ARGS[@]}"
          if [[ -s "$RUNNER_TEMP/private-runtime-new-secrets" ]]; then
            mapfile -t NEW_SECRETS < "$RUNNER_TEMP/private-runtime-new-secrets"
            az containerapp secret remove -g "$RESOURCE_GROUP" -n "$API_APP" --secret-names "${NEW_SECRETS[@]}" --output none --only-show-errors
          fi
          if [[ '${{ steps.deploy_web.outputs.started }}' == true ]]; then
            OLD_WEB_IMAGE="$(cat "$RUNNER_TEMP/private-runtime-before-web-image")"
            az containerapp update -g "$RESOURCE_GROUP" -n '${{ vars.AZURE_WEB_APP }}' --image "$OLD_WEB_IMAGE" --revision-suffix "caprwrb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
          fi
