name: ProjectPulse Repository Security Posture

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectpulse-security-posture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security-posture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate repository security posture
        run: python3 scripts/security/validate-repository-security-posture.py

      - name: Confirm no tracked private-key or credential containers
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-files | grep -Eiq '(^|/)(id_rsa|id_ed25519)(\.pub)?$|\.(p12|pfx|kdbx|jks|key|tfstate)$'; then
            echo "A tracked credential-bearing file type was detected." >&2
            git ls-files | grep -Ei '(^|/)(id_rsa|id_ed25519)(\.pub)?$|\.(p12|pfx|kdbx|jks|key|tfstate)$' >&2
            exit 1
          fi
          echo "TRACKED_CREDENTIAL_FILE_SCAN=PASS"

      - name: Create temporary source snapshot for consolidated validation
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 630
        shell: bash
        run: |
          set -Eeuo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=bin --exclude=obj \
            -czf /tmp/project-time-platform-source.tar.gz .

      - name: Upload temporary source snapshot
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 630
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: celar-ai-source-snapshot-${{ github.event.pull_request.head.sha }}
          path: /tmp/project-time-platform-source.tar.gz
          if-no-files-found: error
          retention-days: 1
