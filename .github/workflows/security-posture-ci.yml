name: ProjectPulse Repository Security Posture

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectpulse-security-posture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security-posture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate repository security posture
        run: python3 scripts/security/validate-repository-security-posture.py

      - name: Install offline regression dependencies
        run: python3 -m pip install PyYAML==6.0.3

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Exercise security deployment and runtime boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/security-deployment-boundaries.test.py
          python3 tests/flowhive-installed-resolution.test.py
          python3 tests/flowhive-psa-installed-acceptance.test.py
          dotnet run --project tests/SecurityBoundaryTests/SecurityBoundaryTests.csproj
          bash -n deploy.sh scripts/verity/pin-digests.sh ops/projectpulse/scripts/projectpulse-backup.sh scripts/apply-admin-experience-008-009-test-migration.sh

      - name: Confirm no tracked private-key or credential containers
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-files | grep -Eiq '(^|/)(id_rsa|id_ed25519)(\.pub)?$|\.(p12|pfx|kdbx|jks|key|tfstate)$'; then
            echo "A tracked credential-bearing file type was detected." >&2
            git ls-files | grep -Ei '(^|/)(id_rsa|id_ed25519)(\.pub)?$|\.(p12|pfx|kdbx|jks|key|tfstate)$' >&2
            exit 1
          fi
          echo "TRACKED_CREDENTIAL_FILE_SCAN=PASS"
