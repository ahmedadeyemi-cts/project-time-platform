name: ProjectPulse Repository Security Posture

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectpulse-security-posture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security-posture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate repository security posture
        run: python3 scripts/security/validate-repository-security-posture.py

      - name: Install offline regression dependencies
        run: python3 -m pip install PyYAML==6.0.3 Pillow==11.3.0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Exercise security deployment and runtime boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/security-completion/ocr.test.py
          python3 tests/security-completion/gateway.test.py
          python3 tests/security-completion/test_scope.py
          python3 tests/security-deployment-boundaries.test.py
          python3 tests/security-release/test_controller_registration.py
          python3 tests/security-frontend-proxy.test.py
          python3 tests/flowhive-installed-resolution.test.py
          python3 tests/flowhive-psa-installed-acceptance.test.py
          node tests/security-output.test.mjs
          dotnet run --project tests/SecurityBoundaryTests/SecurityBoundaryTests.csproj
          dotnet run --project tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj
          dotnet run --project tests/FlowHiveExecutablePlanTests/FlowHiveExecutablePlanTests.csproj
          bash -n deploy.sh scripts/verity/pin-digests.sh ops/projectpulse/scripts/projectpulse-backup.sh scripts/apply-admin-experience-008-009-test-migration.sh

      - name: Exercise migration replay and bounded scheduling
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --prefix tests/security-completion
          node tests/security-completion/migrations.test.mjs

      - name: Start isolated authorization database
        shell: bash
        run: |
          set -Eeuo pipefail
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          CONNECTION="Host=127.0.0.1;Port=5432;Username=postgres;Password=$PASSWORD;Database=security_ci"
          echo "::add-mask::$CONNECTION"
          printf 'SECURITY_TEST_DB=%s\n' "$CONNECTION" >> "$GITHUB_ENV"
          export POSTGRES_PASSWORD="$PASSWORD"
          docker run -d --name security-ci --publish 127.0.0.1:5432:5432 --env POSTGRES_PASSWORD --env POSTGRES_DB=security_ci postgres:16
          for attempt in {1..30}; do
            if docker exec security-ci pg_isready -U postgres -d security_ci >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Exercise database identity and session boundaries
        run: dotnet run --no-build --project tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj

      - name: Verify atomic credential transition in isolated database
        run: |
          dotnet build tools/SecurityCredentialTransition
          dotnet run --project tests/SecurityCredentialTransitionTests -- tools/SecurityCredentialTransition/bin/Debug/net10.0/SecurityCredentialTransition.dll

      - name: Remove isolated authorization database
        if: always()
        run: docker rm -f security-ci >/dev/null 2>&1 || true

      - name: Confirm no tracked private-key or credential containers
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-files | grep -Eiq '(^|/)(id_rsa|id_ed25519)(\.pub)?$|\.(p12|pfx|kdbx|jks|key|tfstate)$'; then
            echo "A tracked credential-bearing file type was detected." >&2
            git ls-files | grep -Ei '(^|/)(id_rsa|id_ed25519)(\.pub)?$|\.(p12|pfx|kdbx|jks|key|tfstate)$' >&2
            exit 1
          fi
          echo "TRACKED_CREDENTIAL_FILE_SCAN=PASS"
