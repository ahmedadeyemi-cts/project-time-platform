name: Execute finalized View-As systemwide publisher

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: execute-view-as-systemwide-publisher-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.event.pull_request.head.ref == 'fix/view-as-module-navigation-continuity-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare and execute finalized reviewed repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/run-normalized-view-as-systemwide-patch.yml').read_text()
          start_marker = "      - name: Apply targeted reviewed source repair\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Validate focused systemwide contracts"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          shell_block = '\n'.join(lines) + '\n'
          python_start = shell_block.index("python3 - <<'PY'\n") + len("python3 - <<'PY'\n")
          python_end = shell_block.index("\nPY\nbash /tmp/apply-view-as-systemwide.sh", python_start)
          Path('/tmp/prepare-view-as-systemwide.py').write_text(shell_block[python_start:python_end] + '\n')
          PY

          python3 /tmp/prepare-view-as-systemwide.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/apply-view-as-systemwide.sh')
          lines = path.read_text().splitlines()
          corrected = []
          corrections = 0
          for line in lines:
              stripped = line.strip()
              trailing_comma = stripped.endswith('",')
              trailing_quote = stripped.endswith('"')
              if stripped.startswith('"') and (trailing_comma or trailing_quote):
                  end = -2 if trailing_comma else -1
                  content = stripped[1:end]
                  if '="' in content:
                      escaped = content.replace('"', '\\"')
                      indentation = line[:len(line) - len(line.lstrip())]
                      suffix = '",' if trailing_comma else '"'
                      line = indentation + '"' + escaped + suffix
                      corrections += 1
              corrected.append(line)
          if corrections < 8:
              raise SystemExit(f'Expected multiple JSX attribute literal corrections, found {corrections}.')
          path.write_text('\n'.join(corrected) + '\n')
          print(f'VIEW_AS_PUBLISHER_LITERAL_CORRECTIONS={corrections}')
          PY

          bash /tmp/apply-view-as-systemwide.sh

          python3 - <<'PY'
          from pathlib import Path

          validator = Path('src/frontend/project-time-web/scripts/validate-view-as-module-navigation.mjs')
          validator_text = validator.read_text()
          invalid_assertion = """assert(directory.includes('permissionPending: navigationState === 'loading''), 'Directory Open actions must pause during effective-user verification.');"""
          valid_assertion = """assert(directory.includes("permissionPending: navigationState === 'loading'"), 'Directory Open actions must pause during effective-user verification.');"""
          if validator_text.count(invalid_assertion) != 1:
              raise SystemExit('The expected View-As validator quote defect was not found exactly once.')
          validator.write_text(validator_text.replace(invalid_assertion, valid_assertion, 1))

          directory_validator = Path('src/frontend/project-time-web/scripts/validate-modules-directory-page.mjs')
          directory_text = directory_validator.read_text()
          invalid_token = """    'permissionPending: navigationState === 'loading'',"""
          valid_token = """    "permissionPending: navigationState === 'loading'","""
          if invalid_token in directory_text:
              if directory_text.count(invalid_token) != 1:
                  raise SystemExit('The Modules directory validator quote defect was not unique.')
              directory_text = directory_text.replace(invalid_token, valid_token, 1)
          directory_validator.write_text(directory_text)
          PY

      - name: Validate focused systemwide contracts
        working-directory: src/frontend/project-time-web
        run: |
          node --check src/module-navigation-access-policy.js
          node --check src/module-availability-bridge.js
          node --check scripts/validate-view-as-module-navigation.mjs
          node --check scripts/validate-modules-directory-page.mjs
          node scripts/validate-view-as-module-navigation.mjs
          node scripts/validate-dynamic-rbac-administration.mjs
          node scripts/validate-module-012-scoped-role-admin.mjs
          node scripts/validate-group-1-navigation-work-consolidation.mjs
          node scripts/validate-modules-directory-page.mjs

      - name: Build API Release
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release -p:ProjectPulseSourceRevision=1111111111111111111111111111111111111111

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: |
          npm ci
          npm run build

      - name: Validate exact source boundary
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess

          allowed = {
              'src/frontend/project-time-web/src/module-availability-bridge.js',
              'src/frontend/project-time-web/src/module-navigation-access-policy.js',
              'src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx',
              'src/frontend/project-time-web/src/module-availability.css',
              'src/frontend/project-time-web/scripts/validate-view-as-module-navigation.mjs',
              'src/frontend/project-time-web/scripts/validate-module-012-scoped-role-admin.mjs',
              'src/frontend/project-time-web/scripts/validate-group-1-navigation-work-consolidation.mjs',
              'src/frontend/project-time-web/scripts/validate-modules-directory-page.mjs',
              'docs/security/VIEW-AS-MODULE-NAVIGATION-CONTINUITY.md',
              '.github/workflows/augment-view-as-module-navigation-systemwide.yml',
              '.github/workflows/diagnose-view-as-systemwide-patch-anchor.yml',
              '.github/workflows/run-normalized-view-as-systemwide-patch.yml',
              '.github/workflows/execute-view-as-systemwide-publisher.yml',
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
              if len(line) >= 4
          }
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected:
              raise SystemExit(f'Unexpected files after validation: {sorted(unexpected)}')
          if missing:
              raise SystemExit(f'Expected repair files were not changed: {sorted(missing)}')
          PY

      - name: Commit validated source and remove temporary publishers
        shell: bash
        run: |
          rm .github/workflows/augment-view-as-module-navigation-systemwide.yml
          rm .github/workflows/diagnose-view-as-systemwide-patch-anchor.yml
          rm .github/workflows/run-normalized-view-as-systemwide-patch.yml
          rm .github/workflows/execute-view-as-systemwide-publisher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete systemwide View-As module navigation repair"
          git push origin HEAD:fix/view-as-module-navigation-continuity-20260808
