name: One-time PR 737 CI boundary repair

on:
  push:
    branches:
      - fix/shared-project-document-planning-20260819

permissions:
  contents: write

concurrency:
  group: pr737-ci-boundary-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ahmedadeyemi-cts/project-time-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/shared-project-document-planning-20260819
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded CI boundary repair
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "0ff276c052ad792e5d489b2a9f9c08b5c7f3c2c1"
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one replacement, found {count}')
              return updated

          module030_path = Path('.github/workflows/module030-analytics-center-ci.yml')
          module030 = module030_path.read_text()
          module030 = replace_once(
              module030,
              r'^      - name: Verify Module 030 ownership or run regression mode\n.*?(?=^      - name: Set up \.NET\n)',
              """      - name: Verify Module 030 ownership or run regression mode
        shell: bash
        run: bash scripts/ci/validate-module030-source-boundary.sh

""",
              'Module 030 source-boundary step',
          )
          module030 = replace_once(
              module030,
              r'^      - name: Validate compiled Analytics Center markers\n.*?(?=^      - name: Publish validation summary\n)',
              """      - name: Validate compiled Analytics Center markers
        working-directory: src/frontend/project-time-web
        shell: bash
        run: bash ../../../scripts/ci/validate-module030-compiled.sh

""",
              'Module 030 compiled-marker step',
          )
          module030_path.write_text(module030)

          celar_path = Path('.github/workflows/celar-ai-enterprise-platform-ci.yml')
          celar = celar_path.read_text()
          project_forge_needle = """          elif grep -Fxq 'src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs' <<<\"$CHANGED\"; then
"""
          flowhive_mode = """          elif [[ \"$HEAD_BRANCH\" == fix/shared-project-document-planning-* ]] && grep -Fxq '.github/shared-project-document-planning-governed-release-files.txt' <<<\"$CHANGED\"; then
            FLOWHIVE_RELEASE_MANIFEST='.github/shared-project-document-planning-governed-release-files.txt'
            ALLOWED_DATABASE='^(database/(migrations/(095_project_planning_collaboration_access|096_project_planning_document_authority)\\.sql|rollback/(095_project_planning_collaboration_access_rollback|096_project_planning_document_authority_rollback)\\.sql))$'
            for required in \\
              '.github/workflows/celar-ai-enterprise-platform-ci.yml' \\
              '.github/workflows/module030-analytics-center-ci.yml' \\
              '.github/workflows/projectpulse-deploy-test.yml' \\
              '.github/workflows/projectpulse-release-test-control-ci.yml' \\
              'database/migrations/095_project_planning_collaboration_access.sql' \\
              'database/migrations/096_project_planning_document_authority.sql' \\
              'database/rollback/095_project_planning_collaboration_access_rollback.sql' \\
              'database/rollback/096_project_planning_document_authority_rollback.sql' \\
              'tests/test-project-planning-collaboration-migration-095.sh' \\
              'tests/test-project-planning-document-authority-migration-096.sh'; do
              test -f \"$required\"
              grep -Fxq \"$required\" <<<\"$CHANGED\"
              grep -Fxq \"$required\" \"$FLOWHIVE_RELEASE_MANIFEST\"
            done
            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=FLOWHIVE_V2_SHARED_PLANNING' >> \"$GITHUB_ENV\"
"""
          if celar.count(project_forge_needle) != 1:
              raise SystemExit('Celar validation mode insertion point was not unique.')
          celar = celar.replace(project_forge_needle, flowhive_mode + project_forge_needle)

          prohibited_needle = """          if [[ -n \"$PROHIBITED\" ]]; then
"""
          protected_test_exception = """          if [[ \"$HEAD_BRANCH\" == fix/shared-project-document-planning-* ]]; then
            FLOWHIVE_RELEASE_MANIFEST='.github/shared-project-document-planning-governed-release-files.txt'
            CONTROLLER='.github/workflows/projectpulse-deploy-test.yml'
            CONTROLLER_VALIDATOR='.github/workflows/projectpulse-release-test-control-ci.yml'
            PROHIBITED=\"$(grep -Fvx \"$CONTROLLER\" <<<\"$PROHIBITED\" || true)\"
            for required in \"$FLOWHIVE_RELEASE_MANIFEST\" \"$CONTROLLER\" \"$CONTROLLER_VALIDATOR\"; do
              test -f \"$required\"
              grep -Fxq \"$required\" <<<\"$CHANGED\"
              grep -Fxq \"$required\" \"$FLOWHIVE_RELEASE_MANIFEST\"
            done
            grep -Fq 'workflow_dispatch:' \"$CONTROLLER\"
            grep -Fq 'environment: test' \"$CONTROLLER\"
            grep -Fq 'Only the authorized FlowHive V2 candidate branch may use pre-merge Protected-Test deployment.' \"$CONTROLLER\"
            grep -Fq 'PRODUCTION_MUTATION=NONE' \"$CONTROLLER\"
            grep -Fq 'group: projectpulse-deploy-test' \"$CONTROLLER\"
            grep -Fq 'queue: max' \"$CONTROLLER\"
            ! grep -Eq 'environment:[[:space:]]+production' \"$CONTROLLER\"
            echo 'CELAR_AI_FLOWHIVE_PROTECTED_TEST_BOUNDARY=PASSED'
          fi
"""
          if celar.count(prohibited_needle) != 1:
              raise SystemExit('Celar prohibited-boundary insertion point was not unique.')
          celar = celar.replace(prohibited_needle, protected_test_exception + prohibited_needle)
          celar_path.write_text(celar)

          manifest_path = Path('.github/shared-project-document-planning-governed-release-files.txt')
          manifest_entries = {line.strip() for line in manifest_path.read_text().splitlines() if line.strip()}
          manifest_entries.update({
              '.github/workflows/celar-ai-enterprise-platform-ci.yml',
              '.github/workflows/module030-analytics-center-ci.yml',
          })
          manifest_path.write_text('\n'.join(sorted(manifest_entries)) + '\n')

          Path('.github/workflows/zz-one-time-pr737-ci-boundary-repair.yml').unlink()
          PY
          git diff --check
          grep -Fq 'run: bash scripts/ci/validate-module030-source-boundary.sh' .github/workflows/module030-analytics-center-ci.yml
          grep -Fq 'run: bash ../../../scripts/ci/validate-module030-compiled.sh' .github/workflows/module030-analytics-center-ci.yml
          grep -Fq 'FLOWHIVE_V2_SHARED_PLANNING' .github/workflows/celar-ai-enterprise-platform-ci.yml
          grep -Fq 'CELAR_AI_FLOWHIVE_PROTECTED_TEST_BOUNDARY=PASSED' .github/workflows/celar-ai-enterprise-platform-ci.yml
          bash scripts/ci/validate-module030-source-boundary.sh

      - name: Publish permanent repair and remove controller
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/shared-project-document-planning-governed-release-files.txt \
            .github/workflows/celar-ai-enterprise-platform-ci.yml \
            .github/workflows/module030-analytics-center-ci.yml \
            .github/workflows/zz-one-time-pr737-ci-boundary-repair.yml
          git diff --cached --check
          git commit -m 'Fix FlowHive governed CI release boundaries'
          git push origin HEAD:fix/shared-project-document-planning-20260819
