name: Temporary Module 006 Finalizer 2026-07-30

on:
  pull_request:
    branches:
      - main
    types:
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: temp-module006-finalize-20260730
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor == 'ahmedadeyemi-cts' &&
      github.event.pull_request.number == 276 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/module-006-project-register-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact PR 276 head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Reconcile Module 006 onto current main
        shell: bash
        env:
          TARGET_BRANCH: feature/module-006-project-register-20260729
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main "$TARGET_BRANCH" --no-tags

          ORIGINAL_HEAD="$(git rev-parse HEAD)"
          mkdir -p /tmp/module006-source
          for file in \
            docs/modules/module-006-project-register/IMPLEMENTATION-PLAN.md \
            src/frontend/project-time-web/src/ProjectRegisterCenter.jsx \
            src/frontend/project-time-web/src/project-register-center.css; do
            mkdir -p "/tmp/module006-source/$(dirname "$file")"
            git show "$ORIGINAL_HEAD:$file" > "/tmp/module006-source/$file"
          done

          set +e
          git merge --no-edit origin/main
          MERGE_STATUS=$?
          set -e
          if [[ "$MERGE_STATUS" -ne 0 ]]; then
            mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
            printf 'Resolving Module 006 merge conflicts against current main:\n%s\n' "${CONFLICTS[*]:-none}"
            for path in "${CONFLICTS[@]}"; do
              git checkout --theirs -- "$path"
              git add "$path"
            done
          fi

          mkdir -p docs/modules/module-006-toyota-hyundai-pipelines
          cp /tmp/module006-source/docs/modules/module-006-project-register/IMPLEMENTATION-PLAN.md \
            docs/modules/module-006-toyota-hyundai-pipelines/IMPLEMENTATION-PLAN.md
          rm -rf docs/modules/module-006-project-register
          cp /tmp/module006-source/src/frontend/project-time-web/src/ProjectRegisterCenter.jsx \
            src/frontend/project-time-web/src/ProjectRegisterCenter.jsx
          cp /tmp/module006-source/src/frontend/project-time-web/src/project-register-center.css \
            src/frontend/project-time-web/src/project-register-center.css

          python - <<'PY'
          from pathlib import Path
          import json

          component = Path('src/frontend/project-time-web/src/ProjectRegisterCenter.jsx')
          text = component.read_text()
          replacements = {
              "Unable to load the Project Register.": "Unable to load Toyota & Hyundai Pipelines.",
              'data-module-name="Project Register"': 'data-module-name="Toyota & Hyundai Pipelines"',
              'data-canonical-route="project-register"': 'data-canonical-route="toyota-hyundai-pipelines"',
              'MODULE 006 · PROJECT OPERATIONS': 'MODULE 006 · GOVERNED PROJECT PIPELINE',
              '<h2>Project Register</h2>': '<h2>Toyota &amp; Hyundai Pipelines</h2>',
              'Search the authoritative ProjectPulse project inventory, separate active work from archived history,\n            and open the existing project-management workspace without creating a second project system.': 'Track Toyota and Hyundai delivery records through one governed project pipeline, separate active work from archived history, and open the authoritative project-management workspace without creating a second project system.',
              'The legacy <code>#psa-modules</code> link is being honored temporarily. The canonical Module 006 route is <code>#project-register</code>.': 'A compatibility Module 006 link was used. The canonical route is <code>#toyota-hyundai-pipelines</code>; <code>#psa-modules</code> and <code>#project-register</code> now redirect here.',
              'Project Register summary': 'Toyota & Hyundai Pipelines summary',
              'Project Register project detail': 'Toyota & Hyundai Pipelines project detail',
              'PROJECT REGISTER DETAIL': 'TOYOTA & HYUNDAI PIPELINES DETAIL',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Module 006 component marker not found: {old}')
              text = text.replace(old, new)

          load_effect = """  useEffect(() => {\n    load();\n  }, []);\n"""
          canonical_effect = """  useEffect(() => {\n    load();\n  }, []);\n\n  useEffect(() => {\n    if (legacyRoute && typeof window !== 'undefined' && window.location.hash !== '#toyota-hyundai-pipelines') {\n      window.history.replaceState(window.history.state, '', '#toyota-hyundai-pipelines');\n    }\n  }, [legacyRoute]);\n"""
          if load_effect not in text:
              raise SystemExit('Module 006 canonical-route effect anchor not found.')
          text = text.replace(load_effect, canonical_effect, 1)
          component.write_text(text)

          docs = Path('docs/modules/module-006-toyota-hyundai-pipelines/IMPLEMENTATION-PLAN.md')
          doc = docs.read_text()
          doc = doc.replace('Project Register', 'Toyota & Hyundai Pipelines')
          doc = doc.replace('#project-register', '#toyota-hyundai-pipelines')
          doc = doc.replace('project-register', 'toyota-hyundai-pipelines')
          docs.write_text(doc)

          registry = Path('src/frontend/project-time-web/src/module-availability-registry.js')
          source = registry.read_text()
          old = "Object.freeze({ moduleNumber: '006', route: 'psa-modules', displayName: 'Toyota & Hyundai Pipeline', group: 'Sales & Opportunities', description: 'Toyota and Hyundai opportunity, intake, delivery pipeline, resourcing, expense, billing, and executive readiness workspace.' })"
          new = "Object.freeze({ moduleNumber: '006', route: 'toyota-hyundai-pipelines', displayName: 'Toyota & Hyundai Pipelines', group: 'Sales & Opportunities', description: 'Governed Toyota and Hyundai project pipeline with active and archived delivery context, ownership, engineering assignments, SELL references, tasks, documents, financial context, and lifecycle evidence.' })"
          if old not in source:
              raise SystemExit('Current Module 006 registry entry was not found.')
          source = source.replace(old, new, 1)
          alias_anchor = "const ROUTE_ALIASES = Object.freeze({\n"
          aliases = "const ROUTE_ALIASES = Object.freeze({\n  'psa-modules': 'toyota-hyundai-pipelines',\n  'project-register': 'toyota-hyundai-pipelines',\n"
          if alias_anchor not in source:
              raise SystemExit('Module route alias anchor was not found.')
          source = source.replace(alias_anchor, aliases, 1)
          registry.write_text(source)

          compatibility = Path('src/frontend/project-time-web/src/scoped-rbac-catalog-compatibility.js')
          source = compatibility.read_text()
          source = source.replace("'006': 'Toyota & Hyundai Pipeline'", "'006': 'Toyota & Hyundai Pipelines'")
          compatibility.write_text(source)

          validator = Path('src/frontend/project-time-web/scripts/validate-superadmin-sso-expense-module006-package.mjs')
          source = validator.read_text()
          source = source.replace('Toyota & Hyundai Pipeline', 'Toyota & Hyundai Pipelines')
          source = source.replace('Toyota &amp; Hyundai Pipeline', 'Toyota &amp; Hyundai Pipelines')
          source = source.replace('MODULE_006_TOYOTA_HYUNDAI_PIPELINE_GENERATION=PASS', 'MODULE_006_TOYOTA_HYUNDAI_PIPELINES_GENERATION=PASS')
          source = source.replace('MODULE006_NAME=TOYOTA_AND_HYUNDAI_PIPELINE', 'MODULE006_NAME=TOYOTA_AND_HYUNDAI_PIPELINES')
          validator.write_text(source)

          package = Path('src/frontend/project-time-web/package.json')
          data = json.loads(package.read_text())
          scripts = data['scripts']
          scripts['validate:module006-pipelines'] = 'node ./scripts/validate-module-006-toyota-hyundai-pipelines.mjs'
          marker = 'npm run validate:superadmin-sso-expense-module006 && '
          if marker not in scripts['build']:
              raise SystemExit('Module 006 build-chain insertion marker was not found.')
          if 'npm run validate:module006-pipelines' not in scripts['build']:
              scripts['build'] = scripts['build'].replace(marker, marker + 'npm run validate:module006-pipelines && ', 1)
          package.write_text(json.dumps(data, indent=2) + '\n')
          PY

          cat > src/frontend/project-time-web/scripts/inject-module-006-toyota-hyundai-pipeline.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';

          const webRoot = path.resolve(path.dirname(new URL(import.meta.url).pathname), '..');
          const appPath = path.join(webRoot, 'src', 'App.Module001.g.jsx');
          if (!fs.existsSync(appPath)) throw new Error('Module 006 injection requires App.Module001.g.jsx.');
          let source = fs.readFileSync(appPath, 'utf8');

          const importAnchor = "import WorkRegisterCenter from './WorkRegisterCenter.jsx';";
          const centerImport = "import ProjectRegisterCenter from './ProjectRegisterCenter.jsx';";
          if (!source.includes(importAnchor)) throw new Error('Module 006 Work Register import anchor is missing.');
          if (!source.includes(centerImport)) source = source.replace(importAnchor, `${importAnchor}\n${centerImport}`);

          const oldDefinition = `  {
            route: 'psa-modules',
            href: '#psa-modules',
            title: 'PSA Modules',
            navLabel: 'MODULE 006',
            description: 'Review project intake, resource scheduling, expense management, and executive reporting workflows.',
            permissions: ['VIEW_PROJECT_INTAKE', 'VIEW_RESOURCE_SCHEDULING', 'VIEW_EXPENSES', 'VIEW_EXECUTIVE_REPORTING']
          },`;
          const newDefinition = `  {
            route: 'toyota-hyundai-pipelines',
            href: '#toyota-hyundai-pipelines',
            title: 'Toyota & Hyundai Pipelines',
            navLabel: 'MODULE 006',
            description: 'Track active and archived Toyota and Hyundai project delivery, ownership, engineering, SELL references, tasks, documents, financial context, and lifecycle evidence.',
            permissions: ['VIEW_PROJECT_WORKSPACE', 'VIEW_PROJECT_INTAKE', 'VIEW_RESOURCE_SCHEDULING', 'VIEW_EXPENSES', 'VIEW_EXECUTIVE_REPORTING', 'SYSTEM_ADMINISTRATION', 'MANAGE_ALL']
          },`;
          if (!source.includes(oldDefinition)) throw new Error('Module 006 legacy registry block is missing.');
          source = source.replace(oldDefinition, newDefinition);

          const oldGuide = "'psa-modules': 'Displays PSA workflow modules such as expense, invoice, project, and billing readiness areas as they are connected.'";
          const newGuide = "'toyota-hyundai-pipelines': 'Tracks the governed Toyota and Hyundai project pipeline with active, archived, ownership, task, document, SELL, financial, and audit context.',\n  'psa-modules': 'Compatibility address for Module 006; redirects to Toyota & Hyundai Pipelines.',\n  'project-register': 'Compatibility address for Module 006; redirects to Toyota & Hyundai Pipelines.'";
          if (!source.includes(oldGuide)) throw new Error('Module 006 legacy guide marker is missing.');
          source = source.replace(oldGuide, newGuide);

          const panelStart = "      {(activeRoute === 'dashboard') ? (\n<section id=\"psa-modules\"";
          const panelEnd = "\n\n\n      <section id=\"current-quarter-utilization\"";
          const start = source.indexOf(panelStart);
          const end = source.indexOf(panelEnd, start);
          if (start < 0 || end < 0) throw new Error('Module 006 legacy dashboard panel was not found.');
          const mount = `      {((activeRoute === 'toyota-hyundai-pipelines' || activeRoute === 'psa-modules' || activeRoute === 'project-register') && canViewPsaModules) ? (
            <section id="toyota-hyundai-pipelines" className="panel project-register-route-panel" data-module="006">
              <ProjectRegisterCenter legacyRoute={activeRoute !== 'toyota-hyundai-pipelines'} />
            </section>
          ) : null}`;
          source = source.slice(0, start) + mount + source.slice(end);

          for (const required of [
            centerImport,
            "route: 'toyota-hyundai-pipelines'",
            "href: '#toyota-hyundai-pipelines'",
            "title: 'Toyota & Hyundai Pipelines'",
            "activeRoute === 'toyota-hyundai-pipelines'",
            '<ProjectRegisterCenter legacyRoute={activeRoute !== \'toyota-hyundai-pipelines\'} />'
          ]) {
            if (!source.includes(required)) throw new Error(`Generated Module 006 source is missing: ${required}`);
          }
          if (source.includes("title: 'PSA Modules'") || source.includes('<section id="psa-modules"')) {
            throw new Error('Generated Module 006 source still exposes the retired PSA presentation.');
          }

          fs.writeFileSync(appPath, source, 'utf8');
          console.log('MODULE_006_TOYOTA_HYUNDAI_PIPELINES_GENERATION=PASS route=toyota-hyundai-pipelines aliases=psa-modules,project-register');
          EOF

          cat > src/frontend/project-time-web/scripts/validate-module-006-toyota-hyundai-pipelines.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const root = fileURLToPath(new URL('../../../../', import.meta.url));
          const read = (relative) => fs.readFileSync(path.join(root, relative), 'utf8');
          const exists = (relative) => fs.existsSync(path.join(root, relative));
          const component = read('src/frontend/project-time-web/src/ProjectRegisterCenter.jsx');
          const injector = read('src/frontend/project-time-web/scripts/inject-module-006-toyota-hyundai-pipeline.mjs');
          const registry = read('src/frontend/project-time-web/src/module-availability-registry.js');
          const compatibility = read('src/frontend/project-time-web/src/scoped-rbac-catalog-compatibility.js');
          const packageJson = read('src/frontend/project-time-web/package.json');

          const requireAll = (source, values, label) => values.forEach((value) => {
            if (!source.includes(value)) throw new Error(`${label} missing: ${value}`);
          });
          const rejectAll = (source, values, label) => values.forEach((value) => {
            if (source.includes(value)) throw new Error(`${label} contains forbidden marker: ${value}`);
          });

          requireAll(component, [
            'data-module="006"',
            'data-module-name="Toyota & Hyundai Pipelines"',
            'data-canonical-route="toyota-hyundai-pipelines"',
            'Toyota &amp; Hyundai Pipelines',
            '/api/work-register/overview',
            '/api/work-register/projects/${item.workId}/details',
            '/api/work-lifecycle/projects/${item.workId}',
            "window.history.replaceState(window.history.state, '', '#toyota-hyundai-pipelines')",
            'Archived / historical',
            'Immutable lifecycle and audit evidence'
          ], 'Module 006 workspace');
          rejectAll(component, ["method: 'POST'", "method: 'PUT'", "method: 'PATCH'", "method: 'DELETE'"], 'Module 006 read foundation');

          requireAll(injector, [
            "route: 'toyota-hyundai-pipelines'",
            "href: '#toyota-hyundai-pipelines'",
            "title: 'Toyota & Hyundai Pipelines'",
            "activeRoute === 'psa-modules'",
            "activeRoute === 'project-register'",
            'MODULE_006_TOYOTA_HYUNDAI_PIPELINES_GENERATION=PASS'
          ], 'Module 006 generation');
          requireAll(registry, [
            "moduleNumber: '006', route: 'toyota-hyundai-pipelines', displayName: 'Toyota & Hyundai Pipelines'",
            "'psa-modules': 'toyota-hyundai-pipelines'",
            "'project-register': 'toyota-hyundai-pipelines'"
          ], 'Module 006 registry');
          requireAll(compatibility, ["'006': 'Toyota & Hyundai Pipelines'"], 'Module 006 RBAC compatibility');
          requireAll(packageJson, ['validate:module006-pipelines', 'validate-module-006-toyota-hyundai-pipelines.mjs'], 'Module 006 build chain');

          if (exists('docs/modules/module-006-toyota-hyundai-pipelines/IMPLEMENTATION-PLAN.md')) {
            const doc = read('docs/modules/module-006-toyota-hyundai-pipelines/IMPLEMENTATION-PLAN.md');
            requireAll(doc, ['Toyota & Hyundai Pipelines', '#toyota-hyundai-pipelines'], 'Module 006 implementation plan');
          } else {
            console.log('MODULE_006_DOCUMENTATION_CHECK=SKIPPED_LEAN_WEB_CONTEXT');
          }

          const generated = 'src/frontend/project-time-web/src/App.Module001.g.jsx';
          if (exists(generated)) {
            requireAll(read(generated), [
              "route: 'toyota-hyundai-pipelines'",
              "title: 'Toyota & Hyundai Pipelines'",
              '<ProjectRegisterCenter legacyRoute={activeRoute !== \'toyota-hyundai-pipelines\'} />'
            ], 'Generated Module 006 app');
          }

          console.log('MODULE_006_TOYOTA_HYUNDAI_PIPELINES_CONTRACT=PASS');
          console.log('MODULE_006_CANONICAL_ROUTE=toyota-hyundai-pipelines');
          console.log('MODULE_006_COMPATIBILITY_ROUTES=psa-modules,project-register');
          EOF

          rm -f src/frontend/project-time-web/scripts/inject-module-006-project-register.mjs
          rm -f src/frontend/project-time-web/scripts/validate-module-006-project-register.mjs

          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'MODULE006_RECONCILIATION_ALREADY_CURRENT=YES'
          else
            git commit -m 'Finalize Module 006 Toyota and Hyundai Pipelines'
          fi

      - name: Validate exact Module 006 source
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          cd src/frontend/project-time-web
          npm ci --no-audit --no-fund
          node ./scripts/validate-module-006-toyota-hyundai-pipelines.mjs
          npm run validate:superadmin-sso-expense-module006
          npm run build
          cd ../../..
          docker build --file deployment/containers/web/Dockerfile --tag "projectpulse-module006:${GITHUB_SHA}" .
          git diff --check origin/main...HEAD
          echo 'MODULE006_EXACT_HEAD_VALIDATION=PASS'

      - name: Push reconciled PR 276 branch
        shell: bash
        env:
          TARGET_BRANCH: feature/module-006-project-register-20260729
        run: |
          set -Eeuo pipefail
          git push origin "HEAD:$TARGET_BRANCH"
          echo "MODULE006_RECONCILED_HEAD=$(git rev-parse HEAD)"

      - name: Publish evidence
        shell: bash
        run: |
          {
            echo '## Module 006 finalization'
            echo
            echo '- Visible name: Toyota & Hyundai Pipelines'
            echo '- Canonical route: #toyota-hyundai-pipelines'
            echo '- Compatibility routes: #psa-modules and #project-register'
            echo '- Authoritative data source: existing Work Register and lifecycle APIs'
            echo '- API Release build: passed'
            echo '- Frontend production build: passed'
            echo '- Web-container build: passed'
            echo '- Migration execution: none'
            echo '- Deployment: none'
          } >> "$GITHUB_STEP_SUMMARY"
