name: Apply Modules 081 and 082 Explicit IResult Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-modules-081-082-iresult-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-modules-081-082-explicit-iresult-fix
  cancel-in-progress: false

jobs:
  patch:
    name: Apply and validate exact route-result correction
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact fix branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/modules-081-082-explicit-iresult-20260809
          fetch-depth: 0

      - name: Apply bounded source and regression-test replacements
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          backend_files = [
              Path('src/backend/ProjectTime.Api/Modules/LabEquipmentTrackerModule.cs'),
              Path('src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs'),
          ]

          replacements = {
              'access': (
                  re.compile(r'(?m)^[\t ]*group\.MapGet\("/access", GetAccessAsync\);\r?\n'),
                  '        group.MapGet(\n'
                  '            "/access",\n'
                  '            (Func<HttpContext, Task<IResult>>)GetAccessAsync);\n'
              ),
              'summary': (
                  re.compile(r'(?m)^[\t ]*group\.MapGet\("/summary", GetSummaryAsync\);\r?\n'),
                  '        group.MapGet(\n'
                  '            "/summary",\n'
                  '            (Func<HttpContext, Task<IResult>>)GetSummaryAsync);\n'
              ),
          }

          for path in backend_files:
              text = path.read_text(encoding='utf-8')
              newline = '\r\n' if '\r\n' in text else '\n'
              for name, (pattern, replacement) in replacements.items():
                  if len(pattern.findall(text)) != 1:
                      raise SystemExit(
                          f'{path}: expected exactly one {name} registration target'
                      )
                  text = pattern.sub(
                      lambda _match, value=replacement: value.replace('\n', newline),
                      text,
                      count=1,
                  )
              path.write_text(text, encoding='utf-8', newline='')

          validator_files = [
              Path('src/frontend/project-time-web/scripts/validate-module-081-lab-equipment-tracker.mjs'),
              Path('src/frontend/project-time-web/scripts/validate-module-082-project-risk-register.mjs'),
          ]
          explicit_test = (
              "test('EXPLICIT_IRESULT_EXECUTION',"
              "backend.includes('(Func<HttpContext, Task<IResult>>)GetAccessAsync')"
              "&&backend.includes('(Func<HttpContext, Task<IResult>>)GetSummaryAsync')"
              "&&!backend.includes('MapGet(\\\"/access\\\", GetAccessAsync)')"
              "&&!backend.includes('MapGet(\\\"/summary\\\", GetSummaryAsync)'));"
          )

          for path in validator_files:
              text = path.read_text(encoding='utf-8')
              newline = '\r\n' if '\r\n' in text else '\n'
              marker = "test('RUNTIME_READINESS',"
              if explicit_test in text:
                  raise SystemExit(f'{path}: explicit-result validator already present')
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: expected one runtime-readiness marker')
              text = text.replace(marker, explicit_test + newline + marker, 1)
              path.write_text(text, encoding='utf-8', newline='')
          PY

          for file in \
            src/backend/ProjectTime.Api/Modules/LabEquipmentTrackerModule.cs \
            src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs; do
            grep -Fq '(Func<HttpContext, Task<IResult>>)GetAccessAsync' "$file"
            grep -Fq '(Func<HttpContext, Task<IResult>>)GetSummaryAsync' "$file"
            ! grep -Fq 'MapGet("/access", GetAccessAsync)' "$file"
            ! grep -Fq 'MapGet("/summary", GetSummaryAsync)' "$file"
          done

      - name: Validate framework result execution and module contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet run --project tests/ProjectTime.Api.RouteResultExecutionTests/ProjectTime.Api.RouteResultExecutionTests.csproj --configuration Release
          node src/frontend/project-time-web/scripts/validate-module-081-lab-equipment-tracker.mjs
          node src/frontend/project-time-web/scripts/validate-module-082-project-risk-register.mjs
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          git diff --check

      - name: Commit the reviewed fix and remove this one-time workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/apply-modules-081-082-iresult-fix.yml
          git add \
            src/backend/ProjectTime.Api/Modules/LabEquipmentTrackerModule.cs \
            src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs \
            src/frontend/project-time-web/scripts/validate-module-081-lab-equipment-tracker.mjs \
            src/frontend/project-time-web/scripts/validate-module-082-project-risk-register.mjs \
            .github/workflows/apply-modules-081-082-iresult-fix.yml
          git diff --cached --check
          git config user.name 'ProjectPulse Release Automation'
          git config user.email 'projectpulse-release-automation@users.noreply.github.com'
          git commit -m 'fix: execute Module 081 and 082 access results'
          git push origin HEAD:fix/modules-081-082-explicit-iresult-20260809
