name: Validate Microsoft Dual Connections

on:
  pull_request:
    paths:
      - 'database/migrations/046_microsoft_sso_connection_profiles.sql'
      - 'database/rollback/046_microsoft_sso_connection_profiles_rollback.sql'
      - 'src/backend/ProjectTime.Api/ProjectTime.Api.csproj'
      - 'src/backend/ProjectTime.Api/Modules/MicrosoftSsoConnectionProfilesModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/MicrosoftSsoRuntimeCompatibility.cs'
      - 'src/backend/ProjectTime.Api/Modules/GlobalMailConfigurationModule.cs'
      - 'src/frontend/project-time-web/src/MicrosoftIntegrationDualConnectionPortal.jsx'
      - 'src/frontend/project-time-web/src/microsoft-integration-dual-connections.css'
      - 'src/frontend/project-time-web/src/microsoft-sso-runtime-activation.js'
      - 'src/frontend/project-time-web/src/main.jsx'
      - 'src/frontend/project-time-web/scripts/validate-module-067-global-mail.mjs'
      - 'src/frontend/project-time-web/scripts/validate-microsoft-sso-runtime-wiring.mjs'
      - 'src/frontend/project-time-web/package.json'
      - 'tests/test-microsoft-sso-connection-migration-046.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build ProjectTime API and generated SSO handlers
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
      - name: Test migration 046 lifecycle and Graph carryover
        run: bash tests/test-microsoft-sso-connection-migration-046.sh
      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci
      - name: Validate Microsoft Integration dual connection contracts
        working-directory: src/frontend/project-time-web
        run: npm run validate:module067
      - name: Validate SSO runtime wiring and authority boundary
        working-directory: src/frontend/project-time-web
        run: npm run validate:microsoft-sso-runtime
      - name: Build frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build
