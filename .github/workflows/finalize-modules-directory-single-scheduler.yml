name: Finalize Modules Directory Single Scheduler

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/finalize-modules-directory-single-scheduler.yml'

permissions:
  contents: write

concurrency:
  group: finalize-modules-directory-single-scheduler-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/modules-directory-authority-starvation-20260818'
    name: Prevent re-entrant Modules authority retry chains
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Apply guarded non-reentrant scheduler repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gate_path = Path('src/frontend/project-time-web/src/background-request-role-gate.js')
          validator_path = Path('src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs')

          gate = gate_path.read_text()
          validator = validator_path.read_text()

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              return source.replace(old, new, 1)

          gate = replace_once(
              gate,
              """let moduleDirectoryAuthorityTimer = 0;
          let moduleDirectoryAuthorityAttempt = 0;
          let moduleDirectoryAuthoritySource = '';""",
              """let moduleDirectoryAuthorityTimer = 0;
          let moduleDirectoryAuthorityAttempt = 0;
          let moduleDirectoryAuthoritySource = '';
          let moduleDirectoryAuthorityActive = false;""",
              'scheduler state'
          )

          gate = replace_once(
              gate,
              """function clearModuleDirectoryAuthoritySchedule() {
            window.clearTimeout(moduleDirectoryAuthorityTimer);
            moduleDirectoryAuthorityTimer = 0;
            moduleDirectoryAuthorityAttempt = 0;
            moduleDirectoryAuthoritySource = '';
          }""",
              """function clearModuleDirectoryAuthoritySchedule() {
            window.clearTimeout(moduleDirectoryAuthorityTimer);
            moduleDirectoryAuthorityTimer = 0;
            moduleDirectoryAuthorityAttempt = 0;
            moduleDirectoryAuthoritySource = '';
            moduleDirectoryAuthorityActive = false;
            window.__projectPulseModuleDirectoryAuthorityScheduler = {
              contract: MODULE_DIRECTORY_SINGLE_FLIGHT_SCHEDULER_CONTRACT,
              active: false
            };
          }""",
              'scheduler clear contract'
          )

          gate = replace_once(
              gate,
              """function scheduleImmediateModulesAuthority(source) {
            moduleDirectoryAuthoritySource = source || moduleDirectoryAuthoritySource || 'module_directory_authority_retry';
            if (moduleDirectoryAuthorityTimer) return;

            moduleDirectoryAuthorityAttempt = 0;""",
              """function scheduleImmediateModulesAuthority(source) {
            moduleDirectoryAuthoritySource = source || moduleDirectoryAuthoritySource || 'module_directory_authority_retry';
            if (moduleDirectoryAuthorityActive) return;

            moduleDirectoryAuthorityActive = true;
            moduleDirectoryAuthorityAttempt = 0;""",
              'scheduler entry guard'
          )

          validator = replace_once(
              validator,
              """  'MODULE_DIRECTORY_SINGLE_FLIGHT_SCHEDULER_V3',
            'moduleDirectoryAuthorityTimer',
            '__projectPulsePermissionRefreshState',""",
              """  'MODULE_DIRECTORY_SINGLE_FLIGHT_SCHEDULER_V3',
            'moduleDirectoryAuthorityTimer',
            'moduleDirectoryAuthorityActive',
            'if (moduleDirectoryAuthorityActive) return;',
            '__projectPulsePermissionRefreshState',""",
              'scheduler validator contract'
          )

          gate_path.write_text(gate)
          validator_path.write_text(validator)
          PY

      - name: Validate focused Modules authority contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          (
            cd src/frontend/project-time-web
            node scripts/validate-modules-directory-page.mjs
          )
          git diff --check

      - name: Install, audit, and build complete frontend
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run build

      - name: Commit and push reviewed scheduler source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add \
            src/frontend/project-time-web/src/background-request-role-gate.js \
            src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          git diff --cached --quiet && {
            echo 'ERROR: Non-reentrant scheduler repair produced no source change.' >&2
            exit 1
          }
          git commit -m 'fix(modules): prevent re-entrant authority retry chains'
          git push origin HEAD:fix/modules-directory-authority-starvation-20260818
