name: Observe Celar AI Convergence Start

on:
  push:
    branches:
      - feature/ask-celar-ai-troubleshooting-defect-automation-20260810
    paths:
      - '.github/workflows/observe-celar-ai-convergence-start.yml'

permissions:
  issues: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish observer marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, pathlib
          pathlib.Path('/tmp/body.json').write_text(json.dumps({'body': 'Celar AI convergence observer started for the current PR #630 source head. No deployment or mutation outside the source branch occurred.'}))
          PY
          gh api -X POST repos/ahmedadeyemi-cts/project-time-platform/issues/630/comments --input /tmp/body.json >/dev/null
