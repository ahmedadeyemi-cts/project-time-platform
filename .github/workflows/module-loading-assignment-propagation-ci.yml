name: Validate Module Loading and Assignment Propagation

on:
  pull_request:
    paths:
      - 'database/migrations/092_module_loading_assignment_visibility_repair.sql'
      - 'database/migrations/093_assigned_work_canonical_visibility_repair.sql'
      - 'tests/test-module-catalog-owner-repair-migration-093.sh'
      - 'tests/validate-module-management-owner-drawer.mjs'
      - 'src/backend/ProjectTime.Api/Program.cs'
      - 'src/backend/ProjectTime.Api/Modules/Module001TimesheetEnhancementModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/Module001AEngineerTaskCloseoutModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/ModuleCatalogOwnershipModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectWorkspaceModule019Repair.cs'
      - 'src/frontend/project-time-web/src/App.jsx'
      - 'src/frontend/project-time-web/src/EngineerTaskCloseoutCenter.jsx'
      - 'src/frontend/project-time-web/src/ModuleManagementTableView.jsx'
      - 'src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx'
      - 'src/frontend/project-time-web/src/ProjectWorkspaceCenter.jsx'
      - 'src/frontend/project-time-web/src/module-directory-authority.js'
      - 'src/frontend/project-time-web/src/effective-role-authority.js'
      - 'src/frontend/project-time-web/src/background-request-role-gate.js'
      - 'src/frontend/project-time-web/src/ProductionOperationsPanel.jsx'
      - 'src/frontend/project-time-web/src/module001/PtcTimeStewardGate.jsx'
      - 'src/frontend/project-time-web/src/main.jsx'
      - 'src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs'
      - 'src/frontend/project-time-web/scripts/validate-modules-directory-page.mjs'
      - 'scripts/release-test/run-assigned-work-protected-test-uat.sh'
      - '.github/workflows/projectpulse-deploy-test.yml'
      - '.github/workflows/module-loading-assignment-propagation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pull-request merge context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Validate focused source contracts
        run: node src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs

      - name: Execute Migration 093 owner-catalog regression
        shell: bash
        run: bash tests/test-module-catalog-owner-repair-migration-093.sh

      - name: Validate protected-Test assigned-work UAT syntax
        shell: bash
        run: bash -n scripts/release-test/run-assigned-work-protected-test-uat.sh

      - name: Validate developer-only module-owner authority
        run: node tests/validate-module-management-owner-drawer.mjs

      - name: Build API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Build complete frontend
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Validate whitespace
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "$PR_BASE_SHA" && -n "$PR_HEAD_SHA" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            git diff --check HEAD^...HEAD
          fi
