name: PR737 Fix Identityless Document Queue

on:
  push:
    branches:
      - fix/shared-project-document-planning-20260819
    paths:
      - .github/workflows/pr737-fix-identityless-document-queue.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/shared-project-document-planning-20260819
          fetch-depth: 0
          persist-credentials: true

      - name: Apply identity-safe admission repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration = r'''-- ProjectPulse 097 — retire legacy identity-less project AI document queueing.
--
-- Migration 057 installed a database trigger that could enqueue private-document
-- processing with requested_by_user_id only, leaving actual_user_id and
-- effective_user_id NULL. The private worker correctly rejects those jobs as
-- authorization_identity_missing. FlowHive/Forge now own admission through
-- authenticated project-scoped queueing and the governed document service
-- principal, so the legacy trigger must be retired rather than bypassing the
-- worker's authorization boundary.

BEGIN;

DO $projectpulse097_prerequisites$
BEGIN
    IF NOT EXISTS (
        SELECT 1 FROM schema_migrations
        WHERE migration_id = '057_module_001_multi_timer_document_grounded_ai'
    ) THEN
        RAISE EXCEPTION 'Migration 097 requires migration 057 first.';
    END IF;
    IF NOT EXISTS (
        SELECT 1 FROM schema_migrations
        WHERE migration_id = '096_project_planning_document_authority'
    ) THEN
        RAISE EXCEPTION 'Migration 097 requires migration 096 first.';
    END IF;
END;
$projectpulse097_prerequisites$;

-- Retire the legacy data-plane queue authority. The current application uses
-- ProjectPlanningDocumentResolver for authenticated project planning and
-- PulseAiPrivateDocumentRuntimeRepository.EnqueueNextEligibleDocumentAsync for
-- the explicitly configured service principal.
DROP TRIGGER IF EXISTS trg_module001_057_queue_project_ai_document_insert
    ON project_intake_documents;
DROP TRIGGER IF EXISTS trg_module001_057_queue_project_ai_document_update
    ON project_intake_documents;
DROP FUNCTION IF EXISTS module001_057_queue_project_ai_document();

-- If a prior revision left an identity-less job active, make it terminal so it
-- cannot block an authenticated recovery job. Historical failed rows remain as
-- audit evidence and are not deleted or rewritten.
WITH retired AS (
    UPDATE pulse_ai_document_processing_jobs
       SET job_status = 'failed',
           completed_at = COALESCE(completed_at, NOW()),
           cancellation_requested = FALSE,
           lease_owner = '',
           lease_token = NULL,
           lease_heartbeat_at = NULL,
           lease_expires_at = NULL,
           diagnostic_code = 'legacy_identityless_queue_retired',
           diagnostic_message = 'Legacy Module 001 identity-less automatic queueing was retired; authenticated or service-principal admission is required.',
           updated_at = NOW()
     WHERE requested_purpose = 'project_ai_generation_grounding'
       AND actual_user_id IS NULL
       AND effective_user_id IS NULL
       AND job_status IN (
           'queued','scanning','extracting','awaiting_ocr','embedding',
           'indexing','retry_wait','cancel_requested'
       )
    RETURNING project_intake_document_id
)
UPDATE project_intake_documents document
   SET pulse_ai_processing_status = CASE
           WHEN document.pulse_ai_processing_status = 'ready' THEN 'ready'
           ELSE 'failed'
       END,
       pulse_ai_processing_error_code = CASE
           WHEN document.pulse_ai_processing_status = 'ready' THEN document.pulse_ai_processing_error_code
           ELSE 'legacy_identityless_queue_retired'
       END,
       pulse_ai_processing_updated_at = NOW()
 WHERE document.project_intake_document_id IN (
     SELECT project_intake_document_id FROM retired
 );

INSERT INTO schema_migrations (migration_id, description, applied_at)
VALUES (
    '097_project_planning_identity_safe_admission',
    'Retire legacy identity-less project AI document queueing and require governed authenticated or service-principal admission',
    NOW()
)
ON CONFLICT (migration_id) DO UPDATE
SET description = EXCLUDED.description,
    applied_at = EXCLUDED.applied_at;

COMMIT;
'''
          Path('database/migrations/097_project_planning_identity_safe_admission.sql').write_text(migration, encoding='utf-8')

          rollback = r'''-- Fail-safe rollback for ProjectPulse 097.
-- The retired Module 001 queue trigger is intentionally NOT restored because
-- restoring it would recreate identity-less private-document jobs. Application
-- image rollback does not require this trigger; governed admission remains the
-- only supported queue authority.

BEGIN;
DELETE FROM schema_migrations
WHERE migration_id = '097_project_planning_identity_safe_admission';
COMMIT;
'''
          Path('database/rollback/097_project_planning_identity_safe_admission_rollback.sql').write_text(rollback, encoding='utf-8')

          test = r'''#!/usr/bin/env bash
set -Eeuo pipefail
ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
CONTAINER="projectpulse-identity-safe-097-${GITHUB_RUN_ID:-local}-$$"
DB_USER=projectpulse
DB_NAME=projectpulse
DB_PASSWORD=projectpulse-test-only
cleanup() { docker rm -f "$CONTAINER" >/dev/null 2>&1 || true; }
trap cleanup EXIT
psql_exec() { docker exec -i -e PGPASSWORD="$DB_PASSWORD" "$CONTAINER" psql -X -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME" "$@"; }
value() { psql_exec -Atqc "$1" | tr -d '\r'; }
assert_eq() { local expected="$1" actual="$2" label="$3"; [[ "$actual" == "$expected" ]] || { echo "ASSERTION_FAILED $label expected=$expected actual=$actual" >&2; exit 1; }; echo "ASSERTION_PASSED $label=$actual"; }

docker run -d --name "$CONTAINER" -e POSTGRES_USER="$DB_USER" -e POSTGRES_PASSWORD="$DB_PASSWORD" -e POSTGRES_DB="$DB_NAME" -v "$ROOT:/workspace:ro" postgres:16-alpine >/dev/null
for _ in $(seq 1 90); do docker exec -e PGPASSWORD="$DB_PASSWORD" "$CONTAINER" psql -Atqc 'SELECT 1' -U "$DB_USER" -d "$DB_NAME" >/dev/null 2>&1 && break; sleep 1; done

psql_exec <<'SQL'
CREATE EXTENSION IF NOT EXISTS pgcrypto;
CREATE TABLE schema_migrations(migration_id text PRIMARY KEY, description text NOT NULL, applied_at timestamptz NOT NULL DEFAULT now());
INSERT INTO schema_migrations(migration_id,description) VALUES
('057_module_001_multi_timer_document_grounded_ai','test prerequisite'),
('096_project_planning_document_authority','test prerequisite');
CREATE TABLE project_intake_documents(
  project_intake_document_id uuid PRIMARY KEY,
  pulse_ai_processing_status text NOT NULL DEFAULT 'not_requested',
  pulse_ai_processing_error_code text NOT NULL DEFAULT '',
  pulse_ai_processing_updated_at timestamptz
);
CREATE TABLE pulse_ai_document_processing_jobs(
  pulse_ai_document_processing_job_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  project_intake_document_id uuid NOT NULL REFERENCES project_intake_documents(project_intake_document_id),
  requested_purpose text NOT NULL,
  actual_user_id uuid,
  effective_user_id uuid,
  job_status text NOT NULL,
  completed_at timestamptz,
  cancellation_requested boolean NOT NULL DEFAULT false,
  lease_owner text NOT NULL DEFAULT '',
  lease_token uuid,
  lease_heartbeat_at timestamptz,
  lease_expires_at timestamptz,
  diagnostic_code text NOT NULL DEFAULT '',
  diagnostic_message text NOT NULL DEFAULT '',
  updated_at timestamptz NOT NULL DEFAULT now()
);
CREATE OR REPLACE FUNCTION module001_057_queue_project_ai_document()
RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END; $$;
CREATE TRIGGER trg_module001_057_queue_project_ai_document_insert AFTER INSERT ON project_intake_documents FOR EACH ROW EXECUTE FUNCTION module001_057_queue_project_ai_document();
CREATE TRIGGER trg_module001_057_queue_project_ai_document_update AFTER UPDATE ON project_intake_documents FOR EACH ROW EXECUTE FUNCTION module001_057_queue_project_ai_document();
INSERT INTO project_intake_documents(project_intake_document_id,pulse_ai_processing_status) VALUES('97000000-0000-0000-0000-000000000001','queued');
INSERT INTO pulse_ai_document_processing_jobs(project_intake_document_id,requested_purpose,actual_user_id,effective_user_id,job_status,lease_owner,lease_token,lease_expires_at)
VALUES('97000000-0000-0000-0000-000000000001','project_ai_generation_grounding',NULL,NULL,'queued','legacy-worker',gen_random_uuid(),now()+interval '5 minutes');
SQL

psql_exec -f /workspace/database/migrations/097_project_planning_identity_safe_admission.sql >/dev/null
assert_eq 1 "$(value "SELECT COUNT(*) FROM schema_migrations WHERE migration_id='097_project_planning_identity_safe_admission';")" migration_registered
assert_eq 0 "$(value "SELECT COUNT(*) FROM pg_trigger WHERE tgrelid='project_intake_documents'::regclass AND tgname IN ('trg_module001_057_queue_project_ai_document_insert','trg_module001_057_queue_project_ai_document_update') AND NOT tgisinternal;")" legacy_queue_triggers_retired
assert_eq 0 "$(value "SELECT COUNT(*) FROM pg_proc WHERE proname='module001_057_queue_project_ai_document';")" legacy_queue_function_retired
assert_eq failed "$(value "SELECT job_status FROM pulse_ai_document_processing_jobs WHERE project_intake_document_id='97000000-0000-0000-0000-000000000001';")" identityless_active_job_terminalized
assert_eq legacy_identityless_queue_retired "$(value "SELECT diagnostic_code FROM pulse_ai_document_processing_jobs WHERE project_intake_document_id='97000000-0000-0000-0000-000000000001';")" retirement_diagnostic_recorded
assert_eq failed "$(value "SELECT pulse_ai_processing_status FROM project_intake_documents WHERE project_intake_document_id='97000000-0000-0000-0000-000000000001';")" document_recoverable_failed_state
psql_exec -f /workspace/database/migrations/097_project_planning_identity_safe_admission.sql >/dev/null
assert_eq 1 "$(value "SELECT COUNT(*) FROM schema_migrations WHERE migration_id='097_project_planning_identity_safe_admission';")" migration_reapply_idempotent
psql_exec -f /workspace/database/rollback/097_project_planning_identity_safe_admission_rollback.sql >/dev/null
assert_eq 0 "$(value "SELECT COUNT(*) FROM schema_migrations WHERE migration_id='097_project_planning_identity_safe_admission';")" rollback_unregisters_migration
assert_eq 0 "$(value "SELECT COUNT(*) FROM pg_trigger WHERE tgrelid='project_intake_documents'::regclass AND tgname LIKE 'trg_module001_057_queue_project_ai_document%' AND NOT tgisinternal;")" rollback_remains_fail_safe

echo 'PROJECT_PLANNING_IDENTITY_SAFE_ADMISSION_MIGRATION_097=PASS'
'''
          Path('tests/test-project-planning-identity-safe-admission-migration-097.sh').write_text(test, encoding='utf-8')

          # Package migration 097 with the existing protected-private-network 096 migration job.
          p = Path('scripts/release-test/build-and-run-project-planning-document-authority-migration-job.sh')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'MIGRATION_FILE="$ROOT/database/migrations/096_project_planning_document_authority.sql"\n',
              'MIGRATION_FILE="$ROOT/database/migrations/096_project_planning_document_authority.sql"\nIDENTITY_SAFE_MIGRATION_FILE="$ROOT/database/migrations/097_project_planning_identity_safe_admission.sql"\n')
          s = s.replace(
              '[[ -s "$MIGRATION_FILE" ]] || fail "Migration 096 source is missing."\n',
              '[[ -s "$MIGRATION_FILE" ]] || fail "Migration 096 source is missing."\n[[ -s "$IDENTITY_SAFE_MIGRATION_FILE" ]] || fail "Migration 097 source is missing."\n')
          s = s.replace(
              'install -m 0444 "$MIGRATION_FILE" "$CONTEXT/database/migrations/096_project_planning_document_authority.sql"\n',
              'install -m 0444 "$MIGRATION_FILE" "$CONTEXT/database/migrations/096_project_planning_document_authority.sql"\ninstall -m 0444 "$IDENTITY_SAFE_MIGRATION_FILE" "$CONTEXT/database/migrations/097_project_planning_identity_safe_admission.sql"\n')
          s = s.replace(
              'psql -X -v ON_ERROR_STOP=1 --file "$MIGRATION"\nverification=',
              'psql -X -v ON_ERROR_STOP=1 --file "$MIGRATION"\nIDENTITY_SAFE_MIGRATION="$ROOT/database/migrations/097_project_planning_identity_safe_admission.sql"\n[[ -f "$IDENTITY_SAFE_MIGRATION" ]] || { echo \'ERROR: Migration 097 source is missing from the immutable image.\' >&2; exit 1; }\npsql -X -v ON_ERROR_STOP=1 --file "$IDENTITY_SAFE_MIGRATION"\nverification=')
          s = s.replace(
              "  EXISTS(SELECT 1 FROM schema_migrations WHERE migration_id='096_project_planning_document_authority')::text || '|' ||\n",
              "  EXISTS(SELECT 1 FROM schema_migrations WHERE migration_id='096_project_planning_document_authority')::text || '|' ||\n  EXISTS(SELECT 1 FROM schema_migrations WHERE migration_id='097_project_planning_identity_safe_admission')::text || '|' ||\n")
          s = s.replace(
              "  EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='project_planning_document_authority' AND column_name='is_current')::text;",
              "  EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='project_planning_document_authority' AND column_name='is_current')::text || '|' ||\n  (NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgrelid='public.project_intake_documents'::regclass AND tgname IN ('trg_module001_057_queue_project_ai_document_insert','trg_module001_057_queue_project_ai_document_update') AND NOT tgisinternal))::text || '|' ||\n  (to_regprocedure('public.module001_057_queue_project_ai_document()') IS NULL)::text || '|' ||\n  (NOT EXISTS (SELECT 1 FROM pulse_ai_document_processing_jobs WHERE requested_purpose='project_ai_generation_grounding' AND actual_user_id IS NULL AND effective_user_id IS NULL AND job_status IN ('queued','scanning','extracting','awaiting_ocr','embedding','indexing','retry_wait','cancel_requested')))::text;")
          s = s.replace("[[ \"$verification\" == 'true|true|true|true|true|true|true' ]]", "[[ \"$verification\" == 'true|true|true|true|true|true|true|true|true|true|true' ]]")
          s = s.replace("echo 'MIGRATION_096=APPLIED_AND_VERIFIED'\nENTRYPOINT", "echo 'MIGRATION_096=APPLIED_AND_VERIFIED'\necho 'MIGRATION_097=APPLIED_AND_VERIFIED'\nENTRYPOINT")
          s = s.replace("echo 'MIGRATION_096=APPLIED_AND_VERIFIED'\n\nif [[ -n \"$EVIDENCE_ROOT\" ]]", "echo 'MIGRATION_096=APPLIED_AND_VERIFIED'\necho 'MIGRATION_097=APPLIED_AND_VERIFIED'\n\nif [[ -n \"$EVIDENCE_ROOT\" ]]")
          s = s.replace("'{status:\"applied_and_verified\",migration:\"096_project_planning_document_authority\",releaseCommit:$releaseCommit,image:$image,environment:\"protected-test\",privateNetworkJob:true,productionMutation:false}'", "'{status:\"applied_and_verified\",migrations:[\"096_project_planning_document_authority\",\"097_project_planning_identity_safe_admission\"],releaseCommit:$releaseCommit,image:$image,environment:\"protected-test\",privateNetworkJob:true,productionMutation:false}'")
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/release-test/run-project-planning-document-authority-migration-job.sh')
          s = p.read_text(encoding='utf-8').replace('096-project-planning-document-authority', '096-097-project-planning-document-authority')
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh')
          s = p.read_text(encoding='utf-8')
          s = s.replace("echo 'MIGRATION_096=APPLIED_AND_VERIFIED'", "echo 'MIGRATION_096=APPLIED_AND_VERIFIED'\necho 'MIGRATION_097=APPLIED_AND_VERIFIED'")
          p.write_text(s, encoding='utf-8')

          # Wire migration 097 through the guarded Protected-Test controller.
          p = Path('.github/workflows/projectpulse-deploy-test.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace("      - 'database/migrations/096_project_planning_document_authority.sql'\n", "      - 'database/migrations/096_project_planning_document_authority.sql'\n      - 'database/migrations/097_project_planning_identity_safe_admission.sql'\n")
          s = s.replace("      - 'database/rollback/096_project_planning_document_authority_rollback.sql'\n", "      - 'database/rollback/096_project_planning_document_authority_rollback.sql'\n      - 'database/rollback/097_project_planning_identity_safe_admission_rollback.sql'\n")
          s = s.replace("      - 'tests/test-project-planning-document-authority-migration-096.sh'\n", "      - 'tests/test-project-planning-document-authority-migration-096.sh'\n      - 'tests/test-project-planning-identity-safe-admission-migration-097.sh'\n")
          s = s.replace("            database/migrations/096_project_planning_document_authority.sql \\\n", "            database/migrations/096_project_planning_document_authority.sql \\\n            database/migrations/097_project_planning_identity_safe_admission.sql \\\n")
          s = s.replace("            database/rollback/096_project_planning_document_authority_rollback.sql \\\n", "            database/rollback/096_project_planning_document_authority_rollback.sql \\\n            database/rollback/097_project_planning_identity_safe_admission_rollback.sql \\\n")
          s = s.replace("            tests/test-project-planning-document-authority-migration-096.sh \\\n", "            tests/test-project-planning-document-authority-migration-096.sh \\\n            tests/test-project-planning-identity-safe-admission-migration-097.sh \\\n")
          s = s.replace("          bash tests/test-project-planning-document-authority-migration-096.sh\n", "          bash tests/test-project-planning-document-authority-migration-096.sh\n          bash tests/test-project-planning-identity-safe-admission-migration-097.sh\n")
          s = s.replace('Migrations 086, 088, 093, 094, 095, and 096', 'Migrations 086, 088, 093, 094, 095, 096, and 097')
          s = s.replace('"096_project_planning_document_authority"]', '"096_project_planning_document_authority","097_project_planning_identity_safe_admission"]')
          p.write_text(s, encoding='utf-8')

          # Strengthen shared release validation so the unsafe trigger cannot regress.
          p = Path('tests/validate-shared-project-document-planning.mjs')
          s = p.read_text(encoding='utf-8')
          anchor = "const runtimeVerifier = read('scripts/release-test/verify-runtime.mjs');\n"
          if anchor not in s:
              raise SystemExit('shared validator runtimeVerifier anchor missing')
          s = s.replace(anchor, anchor + "const identitySafeAdmission = read('database/migrations/097_project_planning_identity_safe_admission.sql');\n")
          needle = "  '096_project_planning_document_authority.sql',\n"
          if needle not in s:
              raise SystemExit('shared validator migration 096 marker missing')
          s = s.replace(needle, needle + "  '097_project_planning_identity_safe_admission.sql',\n")
          needle = "  'MIGRATION_096=APPLIED_AND_VERIFIED'\n"
          if needle not in s:
              raise SystemExit('shared validator migration 096 output marker missing')
          s = s.replace(needle, "  'MIGRATION_096=APPLIED_AND_VERIFIED',\n  'MIGRATION_097=APPLIED_AND_VERIFIED'\n")
          marker = "for (const token of [\n  'FLOWHIVE_AI_PLANNER_UAT=PASSED',"
          if marker not in s:
              raise SystemExit('shared validator UAT marker missing')
          safety = "for (const token of [\n  'DROP TRIGGER IF EXISTS trg_module001_057_queue_project_ai_document_insert',\n  'DROP TRIGGER IF EXISTS trg_module001_057_queue_project_ai_document_update',\n  'DROP FUNCTION IF EXISTS module001_057_queue_project_ai_document()',\n  \"legacy_identityless_queue_retired\",\n  \"actual_user_id IS NULL\",\n  \"effective_user_id IS NULL\"\n]) requireText(identitySafeAdmission, token, 'identity-safe project document admission');\n\n"
          s = s.replace(marker, safety + marker)
          p.write_text(s, encoding='utf-8')

          # Add new permanent files to the canonical governed PR manifest.
          p = Path('.github/shared-project-document-planning-governed-release-files.txt')
          entries = set(line for line in p.read_text(encoding='utf-8').splitlines() if line)
          entries.update({
              'database/migrations/097_project_planning_identity_safe_admission.sql',
              'database/rollback/097_project_planning_identity_safe_admission_rollback.sql',
              'tests/test-project-planning-identity-safe-admission-migration-097.sh',
          })
          p.write_text('\n'.join(sorted(entries)) + '\n', encoding='utf-8')
          PY

      - name: Validate identity-safe repair
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x tests/test-project-planning-identity-safe-admission-migration-097.sh
          bash tests/test-project-planning-identity-safe-admission-migration-097.sh
          node tests/validate-shared-project-document-planning.mjs
          bash -n scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          bash -n scripts/release-test/build-and-run-project-planning-document-authority-migration-job.sh
          bash -n scripts/release-test/run-project-planning-document-authority-migration-job.sh
          git diff --check
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Commit repair and remove temporary diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr737-fix-identityless-document-queue.yml
          git rm .github/workflows/pr737-readonly-runtime-diagnostic.yml
          git add \
            .github/shared-project-document-planning-governed-release-files.txt \
            .github/workflows/projectpulse-deploy-test.yml \
            database/migrations/097_project_planning_identity_safe_admission.sql \
            database/rollback/097_project_planning_identity_safe_admission_rollback.sql \
            scripts/release-test/build-and-run-project-planning-document-authority-migration-job.sh \
            scripts/release-test/run-project-planning-document-authority-migration-job.sh \
            scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh \
            tests/test-project-planning-identity-safe-admission-migration-097.sh \
            tests/validate-shared-project-document-planning.mjs
          git diff --cached --check
          git commit -m "fix: retire identityless project document queue"
          git push origin HEAD:fix/shared-project-document-planning-20260819
