name: Apply hash-verified Module 064 fixture corrections
on:
  push:
    branches: ['fix/module064-generation-sequence-20260921']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor == 'ahmedadeyemi-cts' && github.ref == 'refs/heads/fix/module064-generation-sequence-20260921'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply eight exact source changes without deployment access
        shell: bash
        run: |
          set -Eeuo pipefail
          branch='fix/module064-generation-sequence-20260921'
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$branch" ]]
          [[ "$(git rev-parse HEAD^)" == '875c716a80ee72151c14531364dcca0a18b47cd0' ]]
          [[ "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" == "$GITHUB_SHA" ]]
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          rows = json.loads(r'''[
          {"path":".github/module064-generation-sequence-files.txt","before":"7f5abf6c14e9ee86f43e8d4dc1dc4ba5e4d1b7f65126e1b2b4d12a2e9f90fcdf","after":"effe1d47c81e42acad19a4e7c53d1ff7406923f5881b8a08624bb43caada6545","edits":[{"start":11,"end":11,"text":"src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs\nsrc/frontend/project-time-web/scripts/validate-celar-ai-production-readiness.mjs\nsrc/frontend/project-time-web/scripts/validate-module-001-ai-task-grounding.mjs\n"}]},
          {"path":"src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs","before":"4d4fa7a1e344a3bf51258e4f7a9d694390706f379862a4293586d5da22b2c785","after":"f21b89a2762912f2d68b64c228f6e3a6c81347ac0b1044516594d22f8ddbcf5a","edits":[{"start":356,"end":357,"text":"    'var privatePositionVisited = false;',\n    'if (IsPrivateTarget(target)) privatePositionVisited = true;',\n    'if (requirePrivateTargetBeforeExternal && !savedSowOrder',\n    '&& !privatePositionVisited && !IsPrivateTarget(target)',\n"},{"start":362,"end":364,"text":"    'route.Targets.ToArray();',\n"},{"start":367,"end":369,"text":"  ])\n    && !centralRouteExecution.includes('\"deferred\"')\n    && !routeExecutionPolicy.includes('route.Targets.Where(')\n    && !routeExecutionPolicy.includes('.Concat(')\n    && containsAll(centralRouteExecution, [\n      'decisions.Add(new(target, \"skipped\", privateDocumentTargetMandatory',\n      '\"restricted_context_private_target_mandatory\"'\n    ]),\n  'Module 064 saved order is authoritative for every capability; private prerequisites skip ineligible saved positions rather than sorting or replaying providers; explicit closed-SOW approval and private-source protections remain enforced'\n"}]},
          {"path":"src/frontend/project-time-web/scripts/validate-module-001-ai-task-grounding.mjs","before":"5c046a88825114d01041d00901b21ff4dfbac87315a8b57a15d0f29211b8d556","after":"241107ef2d087ed79592b86375019327f3a9537be5e3403033f21fb6045a963c","edits":[{"start":403,"end":404,"text":"      'route.Targets.ToArray();',\n"},{"start":408,"end":408,"text":"    && containsAll(centralRoute, [\n      'if (requirePrivateTargetBeforeExternal && !savedSowOrder',\n      '&& !privatePositionVisited && !IsPrivateTarget(target)',\n      '\"private_document_private_target_mandatory\"'\n    ])\n    && !centralRoute.includes('\"deferred\"')\n    && !routeExecutionPolicy.includes('route.Targets.Where(')\n    && !routeExecutionPolicy.includes('.Concat(')\n"},{"start":409,"end":410,"text":"  'the central router owns persisted order; Timesheet privacy prerequisites skip ineligible saved slots without reordering or replay; only validated, approved SOW capsules receive the existing exception'\n"}]},
          {"path":"src/frontend/project-time-web/scripts/validate-celar-ai-production-readiness.mjs","before":"6a0bab82ce387363791816ddba90ad4f001bfecfe91aee7215504c058e975f57","after":"eab5850c1635c88368d102ac6746cff4624fa89c146510e6d21fc0bcd872f4f5","edits":[{"start":507,"end":508,"text":"    && routeExecutionPolicy.includes('route.Targets.ToArray();')\n"},{"start":510,"end":510,"text":"    && routing.includes('if (requirePrivateTargetBeforeExternal && !savedSowOrder')\n    && routing.includes('&& !privatePositionVisited && !IsPrivateTarget(target)')\n    && !routing.includes('\"deferred\"')\n    && !routeExecutionPolicy.includes('route.Targets.Where(')\n    && !routeExecutionPolicy.includes('.Concat(')\n"},{"start":513,"end":514,"text":"  'every request follows the saved Module 064 sequence; privacy-ineligible slots are skipped in place, without sorting or replay; audited SOW approval, closed capsules, privacy policy and revision-controlled saves remain enforced'\n"}]},
          {"path":"tests/FlowHiveDetailedPlannerTests/Module064SequenceTests.cs","before":"415ed08482fb39feb06458db2d150da2421f89b59c2ceafe6721a7a2abb11491","after":"cafbc0d038c3c9a09f4a850c490da9d49d200f01990bfb534c5119ca571ae86d","edits":[{"start":11,"end":12,"text":"        var flags = new[] { \"PROJECTPULSE_AI_ALLOW_SANITIZED_EXTERNAL_ESCALATION\", \"PROJECTPULSE_CELAR_AI_SANITIZED_EXTERNAL_FALLBACK_ENABLED\", \"PROJECTPULSE_PRIVATE_INFERENCE_REQUIRED_FOR_DOCUMENTS\" };\n"},{"start":24,"end":24,"text":"            foreach (var requirePrivateDocuments in new[] { false, true })\n"},{"start":25,"end":25,"text":"                Environment.SetEnvironmentVariable(\"PROJECTPULSE_PRIVATE_INFERENCE_REQUIRED_FOR_DOCUMENTS\",\n                    requirePrivateDocuments ? \"true\" : \"false\");\n"},{"start":54,"end":54,"text":"                var privatePrerequisite = restricted && requirePrivateDocuments;\n"},{"start":56,"end":58,"text":"                    && (!privatePrerequisite || index >= firstPrivate)).ToArray();\n                var diagnostic = $\"{definition.FeatureCode} privatePrerequisite={privatePrerequisite} expected={string.Join(\",\", expected)} actual={string.Join(\",\", calls)} decisions={string.Join(\";\", result.TargetDecisions!.Select(d => $\"{d.Target}:{d.Outcome}:{d.ReasonCode}\"))}\";\n                Check(calls.SequenceEqual(expected), \"every_capability_obeys_saved_sequence_\" + diagnostic);\n                Check(result.TargetDecisions.Select(decision => decision.Target).SequenceEqual(order),\n                    \"every_saved_slot_has_one_ordered_decision_\" + diagnostic);\n"},{"start":63,"end":64,"text":"                if (privatePrerequisite)\n"},{"start":65,"end":65,"text":"                else\n                    Check(result.SkippedProviders.Count == 0, \"no_private_prerequisite_means_no_reordering_or_unexplained_skips\");\n"}]},
          {"path":"tests/Module064RoutePersistenceTests/Program.cs","before":"a803d6ac641e76463b8517911240b172519a509336681857d582d2e842c5cb83","after":"153f980e6a029a8f3cafed8700a11e56452a790ab4f2f5d629930c1a47e0ad44","edits":[{"start":68,"end":68,"text":"        Check(oldSchemaRoute.Targets.SequenceEqual(new[] { \"celar_ai\", \"claude\", \"openai\", \"local_template\" }),\n            \"reading the old schema does not silently insert a newer provider\");\n        // Supply a valid current write shape so this checks the missing-schema\n        // gate, independently of legacy read compatibility and input validation.\n"},{"start":69,"end":70,"text":"            CelarAiCapabilityTargets.DefaultOrder, oldSchemaRoute.Revision, Guid.NewGuid(), sanitizedExternalGenerationApproved: true),\n"}]},
          {"path":"tests/flowhive-psa-admission.test.mjs","before":"5249b192b776e9987b8c0644c4ed6cd20daf3de3595ef5ee837aad5782efa822","after":"905de028a1205907aa4bd0c10cbe3da9979ce8bd50c87494e46e0d28a15d7e38","edits":[{"start":556,"end":556,"text":"    }\n    if (module064SequenceRepair) {\n      // The exact scope validator permits only the two observer-budget changes;\n      // every identity, approval, deployment and final acceptance gate is pinned.\n      execFileSync('python3', ['tests/module064-generation-sequence-scope.py']);\n      protectedPaths.splice(protectedPaths.indexOf('.github/workflows/flowhive-psa-installed-acceptance.yml'), 1);\n"}]},
          {"path":"tests/module064-generation-sequence-scope.py","before":"c0abd37acf031e3baaaf92fc7b2501f14667644bda9d8126dcb3cc0005b88b72","after":"64f9f3c4e520b248d912f484ad4ca6ff1a33311556657520914f4e87cd0c1268","edits":[{"start":58,"end":58,"text":"registrations.append(('tests/flowhive-psa-admission.test.mjs',\n    '    for (const path of protectedPaths) {',\n    \"    if (module064SequenceRepair) {\\n      // The exact scope validator permits only the two observer-budget changes;\\n      // every identity, approval, deployment and final acceptance gate is pinned.\\n      execFileSync('python3', ['tests/module064-generation-sequence-scope.py']);\\n      protectedPaths.splice(protectedPaths.indexOf('.github/workflows/flowhive-psa-installed-acceptance.yml'), 1);\\n    }\\n    for (const path of protectedPaths) {\"))\n"}]}
          ]''')
          expected = {
              '.github/module064-generation-sequence-files.txt',
              'src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs',
              'src/frontend/project-time-web/scripts/validate-celar-ai-production-readiness.mjs',
              'src/frontend/project-time-web/scripts/validate-module-001-ai-task-grounding.mjs',
              'tests/FlowHiveDetailedPlannerTests/Module064SequenceTests.cs',
              'tests/Module064RoutePersistenceTests/Program.cs',
              'tests/flowhive-psa-admission.test.mjs',
              'tests/module064-generation-sequence-scope.py'
          }
          assert len(rows) == len(expected) and {row['path'] for row in rows} == expected
          outputs = {}
          for row in rows:
              path = Path(row['path'])
              assert not path.is_symlink() and path.resolve().is_relative_to(Path.cwd())
              original = path.read_bytes()
              assert hashlib.sha256(original).hexdigest() == row['before'], f'Base changed: {path}'
              lines = original.decode().splitlines(keepends=True)
              last_end = 0
              for edit in row['edits']:
                  assert type(edit['start']) is int and type(edit['end']) is int
                  assert last_end <= edit['start'] <= edit['end'] <= len(lines)
                  last_end = edit['end']
              for edit in reversed(row['edits']):
                  lines[edit['start']:edit['end']] = edit['text'].splitlines(keepends=True)
              result = ''.join(lines).encode()
              assert hashlib.sha256(result).hexdigest() == row['after'], f'Output mismatch: {path}'
              outputs[path] = result
          for path, value in outputs.items():
              path.write_bytes(value)
              print(f'VERIFIED_SOURCE {path} {hashlib.sha256(value).hexdigest()}')
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          assert staged == expected
          assert not any(path.startswith('.github/workflows/') or path.startswith('database/') for path in staged)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
          [[ "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" == "$GITHUB_SHA" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Test exact Module 064 order with explicit privacy policy and preserve observer admission gates'
          git push origin "HEAD:refs/heads/$branch"
          echo 'SOURCE_FIXTURES_APPLIED=TRUE UAT_MUTATION=NONE PRODUCTION_MUTATION=NONE'
