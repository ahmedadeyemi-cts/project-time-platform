name: Pulse Protected Test Release - Enterprise Governance SQL Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectpulse-promote-enterprise-governance-test.yml'

permissions:
  id-token: write
  contents: read
  actions: write

concurrency:
  group: projectpulse-deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify the corrected enterprise governance release
    if: github.ref == 'refs/heads/main'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      REQUIRED_PR600_COMMIT: 1d1afbdc6b6e34190087287325806ed274c822c9
      REQUIRED_PR601_COMMIT: 75150206e40a6c2fb56d0c30baa608d64d1ed858
      REQUIRED_MODULE082_FIX_COMMIT: 99c54afd629444ae995f480ecc30e471d549fb2b
      EVIDENCE_DIR: /tmp/enterprise-governance-sqlfix-test-evidence

    steps:
      - name: Check out exact merged Test release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact source, Test-only scope, and no-migration boundary
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          [[ "$GITHUB_EVENT_NAME" == push ]] || fail 'This controller is push-triggered only.'
          [[ "$GITHUB_REF" == refs/heads/main ]] || fail 'Only main may be deployed.'
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          [[ "$RELEASE_COMMIT" == "$GITHUB_SHA" ]] || fail 'The checkout does not match the workflow commit.'
          git merge-base --is-ancestor "$REQUIRED_PR600_COMMIT" "$RELEASE_COMMIT" || fail 'PR #600 is not present in the release.'
          git merge-base --is-ancestor "$REQUIRED_PR601_COMMIT" "$RELEASE_COMMIT" || fail 'PR #601 is not present in the release.'
          git merge-base --is-ancestor "$REQUIRED_MODULE082_FIX_COMMIT" "$RELEASE_COMMIT" || fail 'The Module 082 SQL fix is not present in the release.'

          test -f src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs
          test -f src/backend/ProjectTime.Api/Modules/LabEquipmentTrackerModule.cs
          test -f src/backend/ProjectTime.Api/Modules/ProjectWorkspaceModule.cs
          test -f src/frontend/project-time-web/src/LabEquipmentTrackerCenter.jsx
          test -f src/frontend/project-time-web/src/BillingReadinessCenter.jsx
          test -f src/frontend/project-time-web/src/profile-settings-enterprise.css
          test -f src/frontend/project-time-web/src/pulse-shell-frontend-compatibility.js
          test -f src/backend/ProjectTime.Api/Ai/PulseAiExternalHttpsRuntimePolicy.cs
          test -f .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          test -f scripts/build-pr55-acr-image.sh
          test -f scripts/wait-containerapp-ready-revision.sh

          grep -Fq 'RiskSelect + "\n" + $"""' src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs
          ! grep -Fq 'RiskSelect + $"""' src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs
          grep -Fq 'reader.IsDBNull(47) ? string.Empty : reader.GetString(47)' src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs
          grep -Fq 'ListManagingTeamsAsync' src/backend/ProjectTime.Api/Modules/LabEquipmentTrackerModule.cs
          grep -Fq 'Bulk upload spreadsheet' src/frontend/project-time-web/src/LabEquipmentTrackerCenter.jsx
          grep -Fq 'Select managing team' src/frontend/project-time-web/src/LabEquipmentTrackerCenter.jsx
          grep -Fq 'degradedSources' src/frontend/project-time-web/src/BillingReadinessCenter.jsx
          grep -Fq 'ResolveProjectDocumentStoragePath' src/backend/ProjectTime.Api/Modules/ProjectWorkspaceModule.cs
          ! grep -Fq "@hide_closed_projects = FALSE OR LOWER(COALESCE(p.status" src/backend/ProjectTime.Api/Modules/ProjectWorkspaceModule.cs
          grep -Fq 'persistSignedInThemePreference' src/frontend/project-time-web/src/pulse-shell-frontend-compatibility.js
          grep -Fq 'profile-settings-backdrop' src/frontend/project-time-web/src/profile-settings-enterprise.css
          grep -Fq 'celarai.onenecklab.com' src/backend/ProjectTime.Api/Ai/PulseAiExternalHttpsRuntimePolicy.cs

          node src/frontend/project-time-web/scripts/validate-enterprise-ui-documents-governance.mjs
          node src/frontend/project-time-web/scripts/validate-module-081-lab-equipment-tracker.mjs
          node src/frontend/project-time-web/scripts/validate-module-082-project-risk-register.mjs
          node src/frontend/project-time-web/scripts/validate-pulse-rebrand.mjs
          node tests/validate-celar-ai-oracle-test-runtime.mjs

          install -d -m 0700 "$EVIDENCE_DIR"
          jq -n \
            --arg releaseCommit "$RELEASE_COMMIT" \
            --arg pr600 "$REQUIRED_PR600_COMMIT" \
            --arg pr601 "$REQUIRED_PR601_COMMIT" \
            --arg module082Fix "$REQUIRED_MODULE082_FIX_COMMIT" \
            '{
              environment:"test",
              releaseCommit:$releaseCommit,
              requiredPr600Commit:$pr600,
              requiredPr601Commit:$pr601,
              requiredModule082FixCommit:$module082Fix,
              migrationsApplied:[],
              productionMutation:false,
              oracleInfrastructureMutation:false
            }' > "$EVIDENCE_DIR/release-boundary.json"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'MIGRATIONS_APPLIED=NONE'
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'ORACLE_INFRASTRUCTURE_MUTATION=NONE'

      - name: Sign in to the protected Test subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Snapshot protected Test and validate the refreshed UAT session
        id: contract
        shell: bash
        env:
          UAT_SESSION: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) fail "Rollback image is outside the approved Test ACR: $image" ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv --only-show-errors)"
            [[ "$digest" == sha256:* ]] || fail "Could not resolve rollback digest for $image."
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          [[ -n "$UAT_SESSION" ]] || fail 'PROJECTPULSE_TEST_UAT_SESSION is required.'
          [[ "$(az account show --query id -o tsv --only-show-errors)" == '${{ vars.AZURE_SUBSCRIPTION_ID }}' ]] || fail 'Azure login is outside Test.'

          API_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          WEB_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' -o json --only-show-errors)"
          [[ "$(jq -r '.tags.environment // empty' <<<"$API_JSON")" == test ]] || fail 'The API target is not tagged Test.'
          [[ "$(jq -r '.tags.environment // empty' <<<"$WEB_JSON")" == test ]] || fail 'The web target is not tagged Test.'
          [[ "$(jq -r '.properties.configuration.activeRevisionsMode' <<<"$API_JSON" | tr '[:upper:]' '[:lower:]')" == single ]] || fail 'The API must use single-revision mode.'
          [[ "$(jq -r '.properties.configuration.activeRevisionsMode' <<<"$WEB_JSON" | tr '[:upper:]' '[:lower:]')" == single ]] || fail 'The web app must use single-revision mode.'

          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          [[ "$BASE" == https://phd-west-test.onenecklab.com ]] || fail 'The public origin is not protected Test.'
          STATUS="$(curl -sS --max-time 60 -o "$EVIDENCE_DIR/preflight-readiness.json" -w '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            -H "Authorization: Bearer $UAT_SESSION" \
            -H "X-ProjectPulse-Session: $UAT_SESSION" \
            -H 'X-ProjectPulse-Module-Number: 011' \
            "$BASE/api/celar-ai/v1/production/readiness")"
          [[ "$STATUS" == 200 ]] || fail "The refreshed Test UAT session failed validation with HTTP $STATUS."

          jq -c '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT")] | if length == 1 then .[0] else null end' <<<"$API_JSON" > "$EVIDENCE_DIR/source-marker-before.json"
          jq '[.properties.template.containers[0].env[]? | select(.name | test("^PROJECTPULSE_(PRIVATE_|PULSE_AI_PRIVATE_|PULSE_AI_DOCUMENT_|PULSE_AI_CLAMAV|CELAR_AI_EXTERNAL_HTTPS_|UPLOAD_ROOT)"))] | sort_by(.name)' <<<"$API_JSON" > "$EVIDENCE_DIR/private-runtime-before.json"

          echo "old_api_image=$(resolve_digest "$(jq -r '.properties.template.containers[0].image' <<<"$API_JSON")")" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$(resolve_digest "$(jq -r '.properties.template.containers[0].image' <<<"$WEB_JSON")")" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Build immutable corrected Test API and web images
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          API_DIGEST="$(bash scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-api:enterprise-governance-sqlfix-${GITHUB_SHA}-${GITHUB_RUN_ID}" deployment/containers/api/Dockerfile .)"
          WEB_DIGEST="$(bash scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-web:enterprise-governance-sqlfix-${GITHUB_SHA}-${GITHUB_RUN_ID}" deployment/containers/web/Dockerfile .)"
          [[ "$API_DIGEST" == sha256:* ]]
          [[ "$WEB_DIGEST" == sha256:* ]]
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-api@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-web@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy immutable corrected Test API image
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_SOURCE_COMMIT="$GITHUB_SHA" \
            --revision-suffix "egsqlapi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none --only-show-errors
          REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
          bash scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_API_APP }}' "$REVISION" '${{ steps.build.outputs.api_image }}' 60 10
          AFTER_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          SOURCE_AFTER="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$AFTER_JSON")"
          [[ "$SOURCE_AFTER" == "$GITHUB_SHA" ]]
          jq '[.properties.template.containers[0].env[]? | select(.name | test("^PROJECTPULSE_(PRIVATE_|PULSE_AI_PRIVATE_|PULSE_AI_DOCUMENT_|PULSE_AI_CLAMAV|CELAR_AI_EXTERNAL_HTTPS_|UPLOAD_ROOT)"))] | sort_by(.name)' <<<"$AFTER_JSON" > "$EVIDENCE_DIR/private-runtime-after-normal-deploy.json"
          diff -u "$EVIDENCE_DIR/private-runtime-before.json" "$EVIDENCE_DIR/private-runtime-after-normal-deploy.json"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy immutable corrected Test web image
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "egsqlweb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none --only-show-errors
          REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
          bash scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_WEB_APP }}' "$REVISION" '${{ steps.build.outputs.web_image }}' 60 10
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Run authenticated enterprise-governance Test UAT
        id: uat
        shell: bash
        env:
          UAT_SESSION: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}
          BASE: ${{ steps.contract.outputs.base }}
          API_REVISION: ${{ steps.deploy_api.outputs.revision }}
          WEB_REVISION: ${{ steps.deploy_web.outputs.revision }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          probe_json() {
            local label="$1" module="$2" path="$3" file="$4" status='000'
            local -a auth=(-H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" -H "X-ProjectPulse-Module-Number: $module")
            for attempt in $(seq 1 30); do
              status="$(curl -sS --max-time 60 -o "$file" -w '%{http_code}' -H 'Cache-Control: no-cache' "${auth[@]}" "$BASE$path" || true)"
              if [[ "$status" == 200 ]] && jq -e . "$file" >/dev/null 2>&1; then
                echo "$label passed on attempt $attempt."
                return 0
              fi
              echo "$label attempt $attempt returned HTTP $status."
              sleep 5
            done
            head -c 2048 "$file" >&2 || true
            fail "$label did not return valid HTTP 200 JSON."
          }

          READY=false
          for attempt in $(seq 1 36); do
            if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$BASE/health?enterprise_sqlfix=$GITHUB_RUN_ID-$attempt" > "$EVIDENCE_DIR/health.json"; then
              READY=true
              break
            fi
            sleep 5
          done
          [[ "$READY" == true ]] || fail 'The Test health endpoint did not become ready.'

          probe_json 'Module 081 access' 081 '/api/lab-equipment-tracker/access' "$EVIDENCE_DIR/module-081-access.json"
          jq -e '.module == "081" and .status == "ready" and .dataReady == true and .scope.isViewAs == false' "$EVIDENCE_DIR/module-081-access.json" >/dev/null

          probe_json 'Module 081 managing teams' 081 '/api/lab-equipment-tracker/teams' "$EVIDENCE_DIR/module-081-teams.json"
          jq -e '.module == "081" and ((.teams | type) == "array")' "$EVIDENCE_DIR/module-081-teams.json" >/dev/null

          probe_json 'Module 082 access' 082 '/api/project-risk-register/access' "$EVIDENCE_DIR/module-082-access.json"
          jq -e '.module == "082" and .status == "ready" and .dataReady == true and .scope.isViewAs == false' "$EVIDENCE_DIR/module-082-access.json" >/dev/null

          probe_json 'Module 082 risks' 082 '/api/project-risk-register/risks?limit=500' "$EVIDENCE_DIR/module-082-risks.json"
          jq -e '.module == "082" and ((.risks | type) == "array")' "$EVIDENCE_DIR/module-082-risks.json" >/dev/null

          probe_json 'Module 019 workspace' 019 '/api/project-workspace/overview' "$EVIDENCE_DIR/module-019-overview.json"
          jq -e '.module == "019" and ((.projects | type) == "array") and all(.projects[]?;
            ((.status // "" | ascii_downcase) != "closed") and
            ((.status // "" | ascii_downcase) != "completed") and
            ((.status // "" | ascii_downcase) != "cancelled") and
            ((.status // "" | ascii_downcase) != "canceled") and
            ((.status // "" | ascii_downcase) != "archived") and
            ((.status // "" | ascii_downcase) != "retired"))' "$EVIDENCE_DIR/module-019-overview.json" >/dev/null

          PORTAL="$EVIDENCE_DIR/test-portal.html"
          BUNDLE="$EVIDENCE_DIR/test-assets.txt"
          PORTAL_STATUS='000'
          for attempt in $(seq 1 30); do
            PORTAL_STATUS="$(curl -sS --max-time 60 -o "$PORTAL" -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/?enterprise_sqlfix=$GITHUB_RUN_ID-$attempt" || true)"
            [[ "$PORTAL_STATUS" == 200 ]] && break
            echo "Test portal attempt $attempt returned HTTP $PORTAL_STATUS."
            sleep 5
          done
          [[ "$PORTAL_STATUS" == 200 ]] || fail 'The Test portal did not return HTTP 200.'

          mapfile -t ASSETS < <(grep -oE '(src|href)="[^"]+\.(js|css)(\?[^"]*)?"' "$PORTAL" | sed -E 's/^(src|href)="([^"]+)"$/\2/' | sort -u)
          (( ${#ASSETS[@]} > 0 )) || fail 'The Test portal exposed no frontend assets.'
          : > "$BUNDLE"
          index=0
          for asset in "${ASSETS[@]}"; do
            case "$asset" in
              /assets/*)
                index=$((index + 1))
                asset_file="$EVIDENCE_DIR/asset-$index"
                asset_status='000'
                for attempt in $(seq 1 20); do
                  asset_status="$(curl -sS --max-time 90 -o "$asset_file" -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE$asset" || true)"
                  [[ "$asset_status" == 200 ]] && break
                  sleep 3
                done
                [[ "$asset_status" == 200 ]] || fail "Frontend asset failed: $asset"
                cat "$asset_file" >> "$BUNDLE"
                ;;
              *) fail "Unexpected frontend asset path: $asset" ;;
            esac
          done

          grep -Fq 'Bulk upload spreadsheet' "$BUNDLE" || fail 'Module 081 bulk upload is absent from the deployed bundle.'
          grep -Fq 'Select managing team' "$BUNDLE" || fail 'Module 081 managing-team selector is absent from the deployed bundle.'
          grep -Fq 'pulse-header-theme-switcher' "$BUNDLE" || fail 'The synchronized header theme switcher is absent.'
          grep -Fq 'profile-settings-backdrop' "$BUNDLE" || fail 'The enterprise profile/settings presentation is absent.'
          grep -Fq 'ptp-theme' "$BUNDLE" || fail 'The persistent user theme preference is absent.'

          jq -n \
            --arg releaseCommit "$GITHUB_SHA" \
            --arg apiRevision "$API_REVISION" \
            --arg webRevision "$WEB_REVISION" \
            --arg apiImage '${{ steps.build.outputs.api_image }}' \
            --arg webImage '${{ steps.build.outputs.web_image }}' \
            --argjson frontendAssetCount "${#ASSETS[@]}" \
            '{
              status:"passed",
              environment:"test",
              releaseCommit:$releaseCommit,
              apiRevision:$apiRevision,
              webRevision:$webRevision,
              apiImage:$apiImage,
              webImage:$webImage,
              frontendAssetCount:$frontendAssetCount,
              module019Ready:true,
              terminalProjectsHidden:true,
              module039SourceIsolationBuilt:true,
              module081Ready:true,
              module081TeamsReady:true,
              module082Ready:true,
              module082RisksReady:true,
              module082SqlTokenBoundaryFixed:true,
              profileThemeVerified:true,
              migrationsApplied:[],
              productionMutation:false
            }' > "$EVIDENCE_DIR/final-uat-summary.json"

      - name: Upload protected Test deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enterprise-governance-sqlfix-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/enterprise-governance-sqlfix-test-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Queue the protected Oracle Celar AI runtime activation
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run celar-ai-oracle-test-runtime-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_commit="$GITHUB_SHA" \
            -f approval_reference="ORACLE-TEST-ENTERPRISE-GOVERNANCE-SQLFIX-20260810" \
            -f confirmation="DEPLOY-CELAR-AI-ORACLE-RUNTIME-TO-TEST"
          echo 'ORACLE_RUNTIME_WORKFLOW_QUEUED=true'

      - name: Restore prior Test images and source marker on failure
        if: ${{ failure() && steps.contract.outcome == 'success' && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set +e
          SOURCE_ROW="$(cat "$EVIDENCE_DIR/source-marker-before.json" 2>/dev/null)"
          if [[ -n "$SOURCE_ROW" && "$SOURCE_ROW" != null ]]; then
            SOURCE_SECRET="$(jq -r '.secretRef // empty' <<<"$SOURCE_ROW")"
            SOURCE_VALUE="$(jq -r '.value // empty' <<<"$SOURCE_ROW")"
            if [[ -n "$SOURCE_SECRET" ]]; then SOURCE_ARG="PROJECTPULSE_SOURCE_COMMIT=secretref:$SOURCE_SECRET"; else SOURCE_ARG="PROJECTPULSE_SOURCE_COMMIT=$SOURCE_VALUE"; fi
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
              --image '${{ steps.contract.outputs.old_api_image }}' --set-env-vars "$SOURCE_ARG" \
              --revision-suffix "egsqlrbapi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
          else
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
              --image '${{ steps.contract.outputs.old_api_image }}' --remove-env-vars PROJECTPULSE_SOURCE_COMMIT \
              --revision-suffix "egsqlrbapi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
          fi
          API_ROLLBACK_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
          bash scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_API_APP }}' "$API_ROLLBACK_REVISION" '${{ steps.contract.outputs.old_api_image }}' 60 10

          if [[ '${{ steps.deploy_web.outputs.started }}' == true ]]; then
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
              --image '${{ steps.contract.outputs.old_web_image }}' \
              --revision-suffix "egsqlrbweb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
            WEB_ROLLBACK_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
            bash scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_WEB_APP }}' "$WEB_ROLLBACK_REVISION" '${{ steps.contract.outputs.old_web_image }}' 60 10
          fi
          jq -n '{status:"images_rolled_back",migrationExecution:false,productionMutation:false}' > "$EVIDENCE_DIR/rollback-summary.json"
          echo 'TEST_IMAGES_ROLLED_BACK=true'

      - name: Publish release summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Pulse protected Test enterprise-governance SQL-fix release'
            echo
            echo "- Release commit: \`$GITHUB_SHA\`"
            echo '- Environment: Test only'
            echo '- Migrations: none'
            echo '- Production changes: none'
            if [[ -f "$EVIDENCE_DIR/final-uat-summary.json" ]]; then
              echo '- Enterprise UAT: passed'
              echo '- Module 082 risks: passed'
              echo '- Oracle runtime activation: queued'
            else
              echo '- Enterprise UAT: failed or incomplete; inspect rollback and evidence'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
