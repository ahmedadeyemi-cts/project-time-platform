name: Pulse Test-Only Enterprise Governance Release 99c54afd

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectpulse-promote-enterprise-governance-test.yml'

permissions:
  id-token: write
  contents: read
  actions: write

concurrency:
  group: projectpulse-deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify fixed enterprise governance release
    if: github.ref == 'refs/heads/main'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TARGET_RELEASE_COMMIT: 99c54afd629444ae995f480ecc30e471d549fb2b
      REQUIRED_PR600_COMMIT: 1d1afbdc6b6e34190087287325806ed274c822c9
      REQUIRED_PR601_COMMIT: 75150206e40a6c2fb56d0c30baa608d64d1ed858
      REQUIRED_MODULE082_FIX_COMMIT: 13e906d4d1a1499f41b81c11c4298e0153d5a280
      EVIDENCE_DIR: /tmp/enterprise-governance-fixed-release-evidence

    steps:
      - name: Check out deployment controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact fixed application release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 99c54afd629444ae995f480ecc30e471d549fb2b
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact source, Test-only scope, and no-migration boundary
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          [[ "$GITHUB_EVENT_NAME" == push ]] || fail 'This controller is push-triggered only.'
          [[ "$GITHUB_REF" == refs/heads/main ]] || fail 'Only main may be deployed.'
          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          RELEASE_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == "$GITHUB_SHA" ]] || fail 'Control checkout does not match the workflow commit.'
          [[ "$RELEASE_COMMIT" == "$TARGET_RELEASE_COMMIT" ]] || fail 'Application checkout does not match the fixed release.'
          git -C control merge-base --is-ancestor "$TARGET_RELEASE_COMMIT" "$CONTROL_COMMIT" || fail 'The fixed release is not an ancestor of the controller.'
          git -C release merge-base --is-ancestor "$REQUIRED_PR600_COMMIT" "$RELEASE_COMMIT" || fail 'PR #600 is missing from the release.'
          git -C release merge-base --is-ancestor "$REQUIRED_PR601_COMMIT" "$RELEASE_COMMIT" || fail 'PR #601 is missing from the release.'
          git -C release merge-base --is-ancestor "$REQUIRED_MODULE082_FIX_COMMIT" "$RELEASE_COMMIT" || fail 'The Module 082 SQL correction is missing from the release.'

          test -f control/scripts/build-pr55-acr-image.sh
          test -f control/scripts/wait-containerapp-ready-revision.sh
          test -f control/.github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          test -f release/src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs
          test -f release/src/backend/ProjectTime.Api/Modules/LabEquipmentTrackerModule.cs
          test -f release/src/backend/ProjectTime.Api/Modules/ProjectWorkspaceModule.cs
          test -f release/src/frontend/project-time-web/src/BillingReadinessCenter.jsx
          test -f release/src/frontend/project-time-web/src/profile-settings-enterprise.css
          test -f release/src/frontend/project-time-web/src/pulse-shell-frontend-compatibility.js
          test -f release/src/backend/ProjectTime.Api/Ai/PulseAiExternalHttpsRuntimePolicy.cs

          grep -Fq 'RiskSelect + "\n" + $"""' release/src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs
          ! grep -Fq 'RiskSelect + $"""' release/src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs
          grep -Fq 'RISK_SQL_TOKEN_BOUNDARY' release/src/frontend/project-time-web/scripts/validate-module-082-project-risk-register.mjs
          grep -Fq 'reader.IsDBNull(47) ? string.Empty : reader.GetString(47)' release/src/backend/ProjectTime.Api/Modules/ProjectRiskRegisterModule.cs
          grep -Fq 'ListManagingTeamsAsync' release/src/backend/ProjectTime.Api/Modules/LabEquipmentTrackerModule.cs
          grep -Fq 'Bulk upload spreadsheet' release/src/frontend/project-time-web/src/LabEquipmentTrackerCenter.jsx
          grep -Fq 'Select managing team' release/src/frontend/project-time-web/src/LabEquipmentTrackerCenter.jsx
          grep -Fq 'ResolveProjectDocumentStoragePath' release/src/backend/ProjectTime.Api/Modules/ProjectWorkspaceModule.cs
          grep -Fq 'file_reconciliation_required' release/src/backend/ProjectTime.Api/Modules/ProjectWorkspaceModule.cs
          ! grep -Fq "@hide_closed_projects = FALSE OR LOWER(COALESCE(p.status" release/src/backend/ProjectTime.Api/Modules/ProjectWorkspaceModule.cs
          grep -Fq 'degradedSources' release/src/frontend/project-time-web/src/BillingReadinessCenter.jsx
          grep -Fq 'persistSignedInThemePreference' release/src/frontend/project-time-web/src/pulse-shell-frontend-compatibility.js
          grep -Fq 'profile-settings-backdrop' release/src/frontend/project-time-web/src/profile-settings-enterprise.css
          grep -Fq 'celarai.onenecklab.com' release/src/backend/ProjectTime.Api/Ai/PulseAiExternalHttpsRuntimePolicy.cs

          node release/src/frontend/project-time-web/scripts/validate-enterprise-ui-documents-governance.mjs
          node release/src/frontend/project-time-web/scripts/validate-module-081-lab-equipment-tracker.mjs
          node release/src/frontend/project-time-web/scripts/validate-module-082-project-risk-register.mjs
          (cd release && node tests/validate-celar-ai-oracle-test-runtime.mjs)

          install -d -m 0700 "$EVIDENCE_DIR"
          jq -n \
            --arg controlCommit "$CONTROL_COMMIT" \
            --arg releaseCommit "$RELEASE_COMMIT" \
            --arg pr600 "$REQUIRED_PR600_COMMIT" \
            --arg pr601 "$REQUIRED_PR601_COMMIT" \
            --arg module082Fix "$REQUIRED_MODULE082_FIX_COMMIT" \
            '{
              environment:"test",
              controlCommit:$controlCommit,
              releaseCommit:$releaseCommit,
              requiredPr600Commit:$pr600,
              requiredPr601Commit:$pr601,
              requiredModule082FixCommit:$module082Fix,
              migrationsApplied:[],
              productionMutation:false,
              oracleInfrastructureMutation:false
            }' > "$EVIDENCE_DIR/release-boundary.json"
          echo "control_commit=$CONTROL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'MIGRATIONS_APPLIED=NONE'
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'ORACLE_INFRASTRUCTURE_MUTATION=NONE'

      - name: Sign in to the protected Test subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Snapshot protected Test and validate refreshed UAT session
        id: contract
        shell: bash
        env:
          UAT_SESSION: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) fail "Image is outside the approved Test ACR: $image" ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv --only-show-errors)"
            [[ "$digest" == sha256:* ]] || fail "Could not resolve digest for $image."
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          [[ -n "$UAT_SESSION" ]] || fail 'PROJECTPULSE_TEST_UAT_SESSION is required.'
          [[ "$(az account show --query id -o tsv --only-show-errors)" == '${{ vars.AZURE_SUBSCRIPTION_ID }}' ]] || fail 'Azure login is outside Test.'
          API_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          WEB_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' -o json --only-show-errors)"
          [[ "$(jq -r '.tags.environment // empty' <<<"$API_JSON")" == test ]] || fail 'The API target is not tagged Test.'
          [[ "$(jq -r '.tags.environment // empty' <<<"$WEB_JSON")" == test ]] || fail 'The web target is not tagged Test.'
          [[ "$(jq -r '.properties.configuration.activeRevisionsMode' <<<"$API_JSON" | tr '[:upper:]' '[:lower:]')" == single ]] || fail 'The API must use single-revision mode.'
          [[ "$(jq -r '.properties.configuration.activeRevisionsMode' <<<"$WEB_JSON" | tr '[:upper:]' '[:lower:]')" == single ]] || fail 'The web app must use single-revision mode.'

          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          [[ "$BASE" == https://phd-west-test.onenecklab.com ]] || fail 'The public origin is not protected Test.'
          STATUS="$(curl -sS --max-time 60 -o "$EVIDENCE_DIR/preflight-readiness.json" -w '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            -H "Authorization: Bearer $UAT_SESSION" \
            -H "X-ProjectPulse-Session: $UAT_SESSION" \
            -H 'X-ProjectPulse-Module-Number: 011' \
            "$BASE/api/celar-ai/v1/production/readiness")"
          [[ "$STATUS" == 200 ]] || fail 'The refreshed Test UAT session is expired or unauthorized.'
          jq -e . "$EVIDENCE_DIR/preflight-readiness.json" >/dev/null

          OLD_SOURCE_COMMIT="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$API_JSON")"
          OLD_API_IMAGE="$(resolve_digest "$(jq -r '.properties.template.containers[0].image' <<<"$API_JSON")")"
          OLD_WEB_IMAGE="$(resolve_digest "$(jq -r '.properties.template.containers[0].image' <<<"$WEB_JSON")")"
          jq '[.properties.template.containers[0].env[]? | select(.name | test("^PROJECTPULSE_(PRIVATE_|PULSE_AI_PRIVATE_|PULSE_AI_DOCUMENT_|PULSE_AI_CLAMAV|CELAR_AI_EXTERNAL_HTTPS_|UPLOAD_ROOT)"))] | sort_by(.name)' <<<"$API_JSON" > "$EVIDENCE_DIR/private-runtime-before.json"

          {
            echo "base=$BASE"
            echo "old_source_commit=$OLD_SOURCE_COMMIT"
            echo "old_api_image=$OLD_API_IMAGE"
            echo "old_web_image=$OLD_WEB_IMAGE"
          } >> "$GITHUB_OUTPUT"

          jq -n \
            --arg base "$BASE" \
            --arg oldSourceCommit "$OLD_SOURCE_COMMIT" \
            --arg oldApiImage "$OLD_API_IMAGE" \
            --arg oldWebImage "$OLD_WEB_IMAGE" \
            '{base:$base,oldSourceCommit:$oldSourceCommit,oldApiImage:$oldApiImage,oldWebImage:$oldWebImage,uatSessionValidated:true}' \
            > "$EVIDENCE_DIR/test-contract.json"

      - name: Build immutable API and web images from the fixed release
        id: build
        shell: bash
        working-directory: release
        run: |
          set -Eeuo pipefail
          API_DIGEST="$(bash ../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-api:enterprise-fixed-$TARGET_RELEASE_COMMIT-${GITHUB_RUN_ID}" deployment/containers/api/Dockerfile .)"
          WEB_DIGEST="$(bash ../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-web:enterprise-fixed-$TARGET_RELEASE_COMMIT-${GITHUB_RUN_ID}" deployment/containers/web/Dockerfile .)"
          [[ "$API_DIGEST" == sha256:* ]]
          [[ "$WEB_DIGEST" == sha256:* ]]
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-api@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-web@$WEB_DIGEST" >> "$GITHUB_OUTPUT"
          jq -n --arg api "${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-api@$API_DIGEST" --arg web "${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-web@$WEB_DIGEST" '{apiImage:$api,webImage:$web}' > "$EVIDENCE_DIR/immutable-images.json"

      - name: Deploy immutable Test API image
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_SOURCE_COMMIT="$TARGET_RELEASE_COMMIT" \
            --revision-suffix "m82fixa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none --only-show-errors
          REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
          bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_API_APP }}' "$REVISION" '${{ steps.build.outputs.api_image }}' 60 10
          AFTER_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          SOURCE_AFTER="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$AFTER_JSON")"
          [[ "$SOURCE_AFTER" == "$TARGET_RELEASE_COMMIT" ]]
          jq '[.properties.template.containers[0].env[]? | select(.name | test("^PROJECTPULSE_(PRIVATE_|PULSE_AI_PRIVATE_|PULSE_AI_DOCUMENT_|PULSE_AI_CLAMAV|CELAR_AI_EXTERNAL_HTTPS_|UPLOAD_ROOT)"))] | sort_by(.name)' <<<"$AFTER_JSON" > "$EVIDENCE_DIR/private-runtime-after-normal-release.json"
          diff -u "$EVIDENCE_DIR/private-runtime-before.json" "$EVIDENCE_DIR/private-runtime-after-normal-release.json"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy immutable Test web image
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "m82fixw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none --only-show-errors
          REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
          bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_WEB_APP }}' "$REVISION" '${{ steps.build.outputs.web_image }}' 60 10
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Run authenticated enterprise-governance Test UAT
        id: uat
        shell: bash
        env:
          UAT_SESSION: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}
          BASE: ${{ steps.contract.outputs.base }}
          API_REVISION: ${{ steps.deploy_api.outputs.revision }}
          WEB_REVISION: ${{ steps.deploy_web.outputs.revision }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          require_json() {
            local file="$1" label="$2"
            [[ -s "$file" ]] || fail "$label returned an empty response body."
            jq -e . "$file" >/dev/null 2>&1 || { head -c 2048 "$file" >&2 || true; fail "$label returned invalid JSON."; }
          }
          auth019=(-H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" -H 'X-ProjectPulse-Module-Number: 019')
          auth039=(-H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" -H 'X-ProjectPulse-Module-Number: 039')
          auth081=(-H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" -H 'X-ProjectPulse-Module-Number: 081')
          auth082=(-H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" -H 'X-ProjectPulse-Module-Number: 082')

          READY=false
          for attempt in $(seq 1 42); do
            if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$BASE/health?module082fix=$GITHUB_RUN_ID-$attempt" > "$EVIDENCE_DIR/health.json"; then READY=true; break; fi
            sleep 10
          done
          [[ "$READY" == true ]] || fail 'The public Test health endpoint did not become ready.'

          M081_ACCESS_STATUS="$(curl -sS --max-time 90 -o "$EVIDENCE_DIR/module-081-access.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "${auth081[@]}" "$BASE/api/lab-equipment-tracker/access")"
          [[ "$M081_ACCESS_STATUS" == 200 ]] || { cat "$EVIDENCE_DIR/module-081-access.json" >&2 || true; fail 'Module 081 access failed.'; }
          require_json "$EVIDENCE_DIR/module-081-access.json" 'Module 081 access'
          jq -e '.module == "081" and .status == "ready" and .dataReady == true and .scope.isViewAs == false' "$EVIDENCE_DIR/module-081-access.json" >/dev/null || fail 'Module 081 is not ready.'

          M081_TEAMS_STATUS="$(curl -sS --max-time 90 -o "$EVIDENCE_DIR/module-081-teams.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "${auth081[@]}" "$BASE/api/lab-equipment-tracker/teams")"
          [[ "$M081_TEAMS_STATUS" == 200 ]] || { cat "$EVIDENCE_DIR/module-081-teams.json" >&2 || true; fail 'Module 081 managing-team directory failed.'; }
          require_json "$EVIDENCE_DIR/module-081-teams.json" 'Module 081 teams'
          jq -e '.module == "081" and (.teams | type == "array")' "$EVIDENCE_DIR/module-081-teams.json" >/dev/null || fail 'Module 081 team options are malformed.'

          M082_ACCESS_STATUS="$(curl -sS --max-time 90 -o "$EVIDENCE_DIR/module-082-access.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "${auth082[@]}" "$BASE/api/project-risk-register/access")"
          [[ "$M082_ACCESS_STATUS" == 200 ]] || { cat "$EVIDENCE_DIR/module-082-access.json" >&2 || true; fail 'Module 082 access failed.'; }
          require_json "$EVIDENCE_DIR/module-082-access.json" 'Module 082 access'
          jq -e '.module == "082" and .status == "ready" and .dataReady == true and .scope.isViewAs == false' "$EVIDENCE_DIR/module-082-access.json" >/dev/null || fail 'Module 082 is not ready.'

          M082_RISKS_STATUS="$(curl -sS --max-time 90 -o "$EVIDENCE_DIR/module-082-risks.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "${auth082[@]}" "$BASE/api/project-risk-register/risks?limit=5")"
          [[ "$M082_RISKS_STATUS" == 200 ]] || { cat "$EVIDENCE_DIR/module-082-risks.json" >&2 || true; fail "Module 082 risks returned HTTP $M082_RISKS_STATUS."; }
          require_json "$EVIDENCE_DIR/module-082-risks.json" 'Module 082 risks'
          jq -e '.module == "082" and (.risks | type == "array")' "$EVIDENCE_DIR/module-082-risks.json" >/dev/null || fail 'Module 082 risks response is malformed.'

          M019_STATUS="$(curl -sS --max-time 90 -o "$EVIDENCE_DIR/module-019-overview.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "${auth019[@]}" "$BASE/api/project-workspace/overview")"
          [[ "$M019_STATUS" == 200 ]] || { cat "$EVIDENCE_DIR/module-019-overview.json" >&2 || true; fail 'Module 019 overview failed.'; }
          require_json "$EVIDENCE_DIR/module-019-overview.json" 'Module 019 overview'
          jq -e 'if ((.projects? // []) | type) == "array" then all((.projects? // [])[]?; ((.status // "") | ascii_downcase) as $s | ($s != "closed" and $s != "completed" and $s != "cancelled" and $s != "canceled" and $s != "archived")) else true end' "$EVIDENCE_DIR/module-019-overview.json" >/dev/null || fail 'Module 019 still exposes a terminal project.'

          M039_STATUS="$(curl -sS --max-time 90 -o "$EVIDENCE_DIR/module-039-billing-candidates.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "${auth039[@]}" "$BASE/api/billing/candidates")"
          [[ "$M039_STATUS" == 200 ]] || { cat "$EVIDENCE_DIR/module-039-billing-candidates.json" >&2 || true; fail "Module 039 billing candidates returned HTTP $M039_STATUS."; }
          require_json "$EVIDENCE_DIR/module-039-billing-candidates.json" 'Module 039 billing candidates'

          PM_SUMMARY_STATUS="$(curl -sS --max-time 60 -o "$EVIDENCE_DIR/project-management-summary.json" -w '%{http_code}' -H 'Cache-Control: no-cache' -H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" "$BASE/api/project-management/summary")"
          printf '%s\n' "$PM_SUMMARY_STATUS" > "$EVIDENCE_DIR/project-management-summary.status"

          PORTAL_HTML="$EVIDENCE_DIR/test-portal.html"
          FRONTEND_BUNDLE="$EVIDENCE_DIR/test-portal-assets.txt"
          curl -fsS --max-time 60 -H 'Cache-Control: no-cache' "$BASE/?module082fix=$GITHUB_RUN_ID" > "$PORTAL_HTML"
          mapfile -t FRONTEND_ASSETS < <(grep -oE '(src|href)="[^"]+\.(js|css)(\?[^"]*)?"' "$PORTAL_HTML" | sed -E 's/^(src|href)="([^"]+)"$/\2/' | sort -u)
          (( ${#FRONTEND_ASSETS[@]} > 0 )) || fail 'The Test portal exposed no frontend assets.'
          : > "$FRONTEND_BUNDLE"
          for asset in "${FRONTEND_ASSETS[@]}"; do
            case "$asset" in
              /assets/*) curl -fsS --max-time 90 -H 'Cache-Control: no-cache' "$BASE$asset" >> "$FRONTEND_BUNDLE" ;;
              *) fail "Unexpected frontend asset path: $asset" ;;
            esac
          done
          grep -Fq 'pulse-header-theme-switcher' "$FRONTEND_BUNDLE" || fail 'The labeled Light/Dark header switcher is absent.'
          grep -Fq 'data-pulse-theme-choice' "$FRONTEND_BUNDLE" || fail 'The Light/Dark choices are absent.'
          grep -Fq 'ptp-theme' "$FRONTEND_BUNDLE" || fail 'The persistent appearance key is absent.'
          grep -Fq 'enterprise-top-bar' "$FRONTEND_BUNDLE" || fail 'The white enterprise top-bar authority is absent.'
          grep -Fq 'profile-settings-backdrop' "$FRONTEND_BUNDLE" || fail 'The enterprise profile/settings presentation is absent.'
          grep -Fq 'Bulk upload spreadsheet' "$FRONTEND_BUNDLE" || fail 'The Module 081 bulk-upload action is absent.'
          grep -Fq 'Select managing team' "$FRONTEND_BUNDLE" || fail 'The Module 081 managing-team selector is absent.'
          grep -Fq '/api/project-risk-register' "$FRONTEND_BUNDLE" || fail 'The Module 082 browser bridge is absent.'
          grep -Fq '/api/profile/preferences' "$FRONTEND_BUNDLE" || fail 'The synchronized profile appearance preference is absent.'
          grep -Fq 'file_reconciliation_required' "$FRONTEND_BUNDLE" || true

          jq -n \
            --arg releaseCommit "$TARGET_RELEASE_COMMIT" \
            --arg apiRevision "$API_REVISION" \
            --arg webRevision "$WEB_REVISION" \
            --arg apiImage '${{ steps.build.outputs.api_image }}' \
            --arg webImage '${{ steps.build.outputs.web_image }}' \
            --arg module081AccessHttp "$M081_ACCESS_STATUS" \
            --arg module081TeamsHttp "$M081_TEAMS_STATUS" \
            --arg module082AccessHttp "$M082_ACCESS_STATUS" \
            --arg module082RisksHttp "$M082_RISKS_STATUS" \
            --arg module019Http "$M019_STATUS" \
            --arg module039Http "$M039_STATUS" \
            --arg projectManagementSummaryHttp "$PM_SUMMARY_STATUS" \
            --argjson frontendAssetCount "${#FRONTEND_ASSETS[@]}" \
            '{
              status:"passed",
              releaseCommit:$releaseCommit,
              apiRevision:$apiRevision,
              webRevision:$webRevision,
              apiImage:$apiImage,
              webImage:$webImage,
              module081AccessHttp:$module081AccessHttp,
              module081TeamsHttp:$module081TeamsHttp,
              module082AccessHttp:$module082AccessHttp,
              module082RisksHttp:$module082RisksHttp,
              module019Http:$module019Http,
              module039Http:$module039Http,
              projectManagementSummaryHttp:$projectManagementSummaryHttp,
              frontendAssetCount:$frontendAssetCount,
              themeAndProfileVerified:true,
              module082SqlBoundaryVerified:true,
              migrationsApplied:[],
              productionMutation:false
            }' > "$EVIDENCE_DIR/final-uat-summary.json"

      - name: Queue protected Oracle Celar AI runtime activation
        id: oracle
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run celar-ai-oracle-test-runtime-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_commit="$GITHUB_SHA" \
            -f approval_reference="ORACLE-TEST-ENTERPRISE-609-20260810" \
            -f confirmation="DEPLOY-CELAR-AI-ORACLE-RUNTIME-TO-TEST"
          echo 'queued=true' >> "$GITHUB_OUTPUT"
          echo 'ORACLE_RUNTIME_WORKFLOW_QUEUED=true'

      - name: Restore prior Test images and source marker on failure
        if: ${{ failure() && steps.contract.outcome == 'success' && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ '${{ steps.deploy_api.outputs.started }}' == true ]]; then
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
              --image '${{ steps.contract.outputs.old_api_image }}' \
              --set-env-vars PROJECTPULSE_SOURCE_COMMIT='${{ steps.contract.outputs.old_source_commit }}' \
              --revision-suffix "m82fixrba-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --output none --only-show-errors
            API_ROLLBACK_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
            bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_API_APP }}' "$API_ROLLBACK_REVISION" '${{ steps.contract.outputs.old_api_image }}' 60 10
          fi
          if [[ '${{ steps.deploy_web.outputs.started }}' == true ]]; then
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
              --image '${{ steps.contract.outputs.old_web_image }}' \
              --revision-suffix "m82fixrbw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --output none --only-show-errors
            WEB_ROLLBACK_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
            bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_WEB_APP }}' "$WEB_ROLLBACK_REVISION" '${{ steps.contract.outputs.old_web_image }}' 60 10
          fi
          jq -n --arg oldSource '${{ steps.contract.outputs.old_source_commit }}' '{status:"rolled_back",oldSourceCommit:$oldSource,migrationsApplied:[],productionMutation:false}' > "$EVIDENCE_DIR/rollback-summary.json"
          echo 'TEST_IMAGES_ROLLED_BACK=TRUE'

      - name: Upload immutable Test release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enterprise-governance-fixed-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/enterprise-governance-fixed-release-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Pulse protected Test enterprise-governance release'
            echo
            echo "- Controller commit: \`$GITHUB_SHA\`"
            echo "- Application release: \`$TARGET_RELEASE_COMMIT\`"
            echo '- Environment: protected Test only'
            echo '- Migrations: none'
            echo '- Production changes: none'
            if [[ -f "$EVIDENCE_DIR/final-uat-summary.json" ]]; then
              echo '- Enterprise UAT: passed'
              echo '- Module 082 risks: HTTP 200 with valid JSON'
              echo '- Oracle Celar AI activation: queued'
            else
              echo '- Enterprise UAT: failed or incomplete; inspect evidence and rollback summary'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
