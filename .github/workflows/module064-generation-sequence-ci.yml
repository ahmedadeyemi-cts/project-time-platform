name: Module 064 generation sequence repair
on:
  push:
    branches: ['fix/module064-generation-sequence-20260921']
  pull_request:
    paths:
      - 'src/backend/ProjectTime.Api/Ai/**'
      - 'src/frontend/project-time-web/scripts/validate-module-064-shared-ai.mjs'
      - 'scripts/release-test/run-flowhive-psa-live-uat.py'
      - 'tests/DeepSeekProviderTests/**'
      - 'tests/FlowHiveSequentialTests/**'
      - 'tests/FlowHiveDetailedPlannerTests/**'
      - 'tests/Module064RoutePersistenceTests/**'
      - 'tests/module064-generation-sequence*'
      - '.github/module064-generation-sequence-files.txt'
      - '.github/workflows/module064-generation-sequence-ci.yml'
      - '.github/workflows/flowhive-psa-installed-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: module064-generation-sequence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-sequence
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact tracked source for branch-only repair diagnostics
        if: github.event_name == 'push'
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/module064-source.zip"
      - name: Upload tracked source without credentials or runtime state
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: module064-source-${{ github.run_id }}
          path: ${{ runner.temp }}/module064-source.zip
          retention-days: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser for boundary tests
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate exact application scope without changing release authority
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/module064-generation-sequence-20260921'
        run: python3 tests/module064-generation-sequence-scope.py
      - name: Verify sequential observer, privacy and shared routing source boundaries
        run: |
          python3 tests/module064-generation-sequence-scope.py --self-test
          python3 tests/module064-generation-sequence.test.py
          python3 tests/flowhive-psa-live-uat.test.py
          node src/frontend/project-time-web/scripts/validate-module-064-shared-ai.mjs
      - name: Build API
        run: dotnet build src/backend/ProjectTime.Api --configuration Release
      - name: Verify all-capability provider ordering, bounded phases and persisted routes
        env:
          MODULE025_TEST_DATABASE: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Username=postgres;Password=${{ github.run_id }}-${{ github.run_attempt }}-sequence;Database=postgres
          MODULE064_TEST_DATABASE_CONNECTION_STRING: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Username=postgres;Password=${{ github.run_id }}-${{ github.run_attempt }}-sequence;Database=postgres
        run: |
          set -Eeuo pipefail
          diagnostics="$RUNNER_TEMP/module064-test-diagnostics"
          mkdir -p "$diagnostics"
          failed=0
          for suite in DeepSeekProviderTests FlowHiveSequentialTests FlowHiveDetailedPlannerTests Module064RoutePersistenceTests; do
            if dotnet run --project "tests/$suite" --configuration Release -p:BuildProjectReferences=false > "$diagnostics/$suite.log" 2>&1; then
              echo "$suite: PASS" | tee -a "$diagnostics/results.txt"
            else
              code=$?
              failed=1
              echo "$suite: FAIL exit=$code" | tee -a "$diagnostics/results.txt"
            fi
            tail -n 15 "$diagnostics/$suite.log"
          done
          cat "$diagnostics/results.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: Retain isolated test failures for exact diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: module064-test-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/module064-test-diagnostics/
          if-no-files-found: ignore
          retention-days: 1
