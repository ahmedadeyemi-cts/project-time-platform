name: Validate Group 4 Project Notification Automation

on:
  push:
    branches:
      - 'feature/group-4-cost-routing-notification-schedules-*'
  pull_request:
    paths:
      - 'database/migrations/050_project_notification_routing_and_schedules.sql'
      - 'database/rollback/050_project_notification_routing_and_schedules_rollback.sql'
      - 'docs/modules/group-4-project-notifications/README.md'
      - 'src/backend/ProjectTime.Api/Modules/Module065ProjectNotificationDelivery.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectNotificationAutomationModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectNotificationAutomationService.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectNotificationContracts.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectNotificationEvaluator.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectNotificationFinancialSnapshotLoader.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectNotificationProcessingService.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectNotificationQuietHoursService.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectNotificationRepository.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectNotificationScheduler.cs'
      - 'src/backend/ProjectTime.Api/ProjectTime.Api.csproj'
      - 'src/frontend/project-time-web/package.json'
      - 'src/frontend/project-time-web/scripts/inject-group-4-project-notification-automation.mjs'
      - 'src/frontend/project-time-web/scripts/validate-group-4-project-notification-automation.mjs'
      - 'src/frontend/project-time-web/src/ProjectNotificationAutomationCenter.jsx'
      - 'src/frontend/project-time-web/src/project-notification-automation-center.css'
      - 'tests/test-project-notification-migration-050.sh'
      - '.github/workflows/group4-project-notification-automation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: group4-project-notification-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated Group 4 stacked source scope
        shell: bash
        run: |
          set -Eeuo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [[ "$BRANCH" != feature/group-4-cost-routing-notification-schedules-* ]]; then
            echo "GROUP_4_SOURCE_ISOLATION=REGRESSION_MODE branch=$BRANCH"
            exit 0
          fi

          BASE_BRANCH='feature/group-3-unified-project-financial-workspaces-20260728'
          git fetch origin "$BASE_BRANCH" main --no-tags
          CHANGED="$(git diff --name-only "origin/$BASE_BRANCH"...HEAD)"
          printf '%s\n' "$CHANGED"

          ALLOWED='^(\.github/workflows/group4-project-notification-automation-ci\.yml|database/migrations/050_project_notification_routing_and_schedules\.sql|database/rollback/050_project_notification_routing_and_schedules_rollback\.sql|docs/modules/group-4-project-notifications/README\.md|src/backend/ProjectTime.Api/Modules/(Module065ProjectNotificationDelivery|ProjectNotificationAutomationModule|ProjectNotificationAutomationService|ProjectNotificationContracts|ProjectNotificationEvaluator|ProjectNotificationFinancialSnapshotLoader|ProjectNotificationProcessingService|ProjectNotificationQuietHoursService|ProjectNotificationRepository|ProjectNotificationScheduler)\.cs|src/backend/ProjectTime.Api/ProjectTime.Api\.csproj|src/frontend/project-time-web/package\.json|src/frontend/project-time-web/scripts/(inject-group-4-project-notification-automation|validate-group-4-project-notification-automation)\.mjs|src/frontend/project-time-web/src/(ProjectNotificationAutomationCenter\.jsx|project-notification-automation-center\.css)|tests/test-project-notification-migration-050\.sh)$'
          UNEXPECTED="$(grep -Ev "$ALLOWED" <<<"$CHANGED" || true)"
          if [[ -n "$UNEXPECTED" ]]; then
            echo 'Unexpected Group 4 source scope:' >&2
            printf '%s\n' "$UNEXPECTED" >&2
            exit 1
          fi

          for protected in \
            '.github/workflows/projectpulse-deploy-runtime-direct-timer-recovery-test.yml' \
            '.github/workflows/validate-runtime-direct-timer-recovery-deployment.yml' \
            'scripts/validate-runtime-direct-timer-recovery-test-deployment.sh'; do
            if grep -Fxq "$protected" <<<"$CHANGED"; then
              echo "Protected deployment file changed: $protected" >&2
              exit 1
            fi
          done

          if grep -E '^(deployment/|\.github/workflows/projectpulse-deploy-|scripts/.*deploy|src/frontend/project-time-web/src/(App|main)\.|src/frontend/project-time-web/src/module-availability-registry\.js|src/frontend/project-time-web/src/.*Certify|src/frontend/project-time-web/src/.*certify|src/backend/ProjectTime.Api/Modules/Module038)' <<<"$CHANGED"; then
            echo 'Group 4 overlaps deployment, canonical App/registry sources, or Module 038 Certify layout.' >&2
            exit 1
          fi

          echo 'GROUP_4_SOURCE_ISOLATION=PASSED'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Check Group 4 JavaScript syntax
        run: |
          set -Eeuo pipefail
          node --check src/frontend/project-time-web/scripts/inject-group-4-project-notification-automation.mjs
          node --check src/frontend/project-time-web/scripts/validate-group-4-project-notification-automation.mjs

      - name: Test migration 050 apply idempotence permissions evidence and rollback
        id: migration_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bash tests/test-project-notification-migration-050.sh > group4-migration-050.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload migration 050 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group4-migration-050-${{ github.run_id }}-${{ github.run_attempt }}
          path: group4-migration-050.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce migration 050 result
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS='${{ steps.migration_test.outputs.exit_code }}'
          if [[ "$STATUS" != '0' ]]; then
            cat group4-migration-050.log >&2
            exit "$STATUS"
          fi
          cat group4-migration-050.log

      - name: Validate Group 4 source contract
        id: source_contract
        continue-on-error: true
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set +e
          node ./scripts/validate-group-4-project-notification-automation.mjs > group4-source-contract.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Group 4 source-contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group4-source-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/frontend/project-time-web/group4-source-contract.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Group 4 source-contract result
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS='${{ steps.source_contract.outputs.exit_code }}'
          if [[ "$STATUS" != '0' ]]; then
            cat src/frontend/project-time-web/group4-source-contract.log >&2
            exit "$STATUS"
          fi
          cat src/frontend/project-time-web/group4-source-contract.log

      - name: Build ProjectTime API
        id: api_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release > group4-api-build.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Group 4 API-build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group4-api-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: group4-api-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce API-build result
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS='${{ steps.api_build.outputs.exit_code }}'
          if [[ "$STATUS" != '0' ]]; then
            tail -n 220 group4-api-build.log >&2
            exit "$STATUS"
          fi
          tail -n 45 group4-api-build.log
          echo 'GROUP_4_API_BUILD=PASSED'

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate Group 3 and Module 065 dependencies
        working-directory: src/frontend/project-time-web
        run: |
          set -Eeuo pipefail
          npm run validate:group3-project-financial-workspaces
          npm run validate:module065
          npm run validate:microsoft-connection
          npm run validate:microsoft-sso-runtime
          npm run validate:group4-project-notifications

      - name: Build complete frontend production bundle
        id: frontend_build
        continue-on-error: true
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set +e
          npm run build > group4-frontend-build.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Group 4 frontend-build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group4-frontend-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/frontend/project-time-web/group4-frontend-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce frontend build and compiled markers
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS='${{ steps.frontend_build.outputs.exit_code }}'
          if [[ "$STATUS" != '0' ]]; then
            tail -n 220 group4-frontend-build.log >&2
            exit "$STATUS"
          fi

          cat dist/assets/*.js > /tmp/group4-project-notifications.js
          cat dist/assets/*.css > /tmp/group4-project-notifications.css
          for marker in \
            'Project Cost Alert Routing' \
            'Configurable Notification Schedules' \
            'Notification Delivery Monitor' \
            'Module 065 is the only mail-delivery authority' \
            'Automatically derived recipients' \
            'Recent delivery attempts' \
            '/api/project-notifications/routing-rules' \
            '/api/project-notifications/delivery-monitor'; do
            grep -Fq "$marker" /tmp/group4-project-notifications.js
          done
          for marker in \
            '.group4-notification-center' \
            '.group4-rule-grid' \
            '.group4-schedule-grid' \
            '.group4-table-wrap'; do
            grep -Fq "$marker" /tmp/group4-project-notifications.css
          done
          tail -n 45 group4-frontend-build.log
          echo 'GROUP_4_FRONTEND_BUILD=PASSED'
