name: PR467 Final Clean Publish Controller v2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr467-final-publish-controller-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: pr467-final-clean-publish
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/uat-modules-005-006-039-work-identifiers-20260803
  EXPECTED_BASE_SHA: 037c6d55a4382ab2be5f098a5c3ea3472efd029f
  PR_NUMBER: '467'

jobs:
  validate-clean-and-publish:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/uat-modules-005-006-039-work-identifiers-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Refresh to the authoritative remote branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin "$TARGET_BRANCH" main
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          echo "PR467_CONTROLLER_START_HEAD=$(git rev-parse HEAD)"

      - name: Remove all temporary PR467 controls from the candidate tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .github/pr467-payload
          rm -f \
            .github/pr467-implementation.patch.gz.b64 \
            .github/workflows/pr467-implementation-publisher.yml \
            .github/workflows/pr467-source-diagnostic.yml \
            .github/workflows/pr467-compile-diagnostic.yml \
            .github/workflows/pr467-csproj-line-fix.yml \
            .github/workflows/pr467-generated-duplicate-autofix.yml \
            .github/workflows/pr467-final-publish-controller.yml \
            .github/workflows/pr467-final-publish-controller-v2.yml \
            scripts/pr467_apply_module005.py \
            scripts/pr467_apply_module006.py \
            scripts/pr467_apply_module039.py \
            scripts/pr467_apply_work_ids.py \
            scripts/pr467_finalize_source.py
          git diff --check
          for path in \
            .github/pr467-payload \
            .github/pr467-implementation.patch.gz.b64 \
            .github/workflows/pr467-implementation-publisher.yml \
            .github/workflows/pr467-source-diagnostic.yml \
            .github/workflows/pr467-compile-diagnostic.yml \
            .github/workflows/pr467-csproj-line-fix.yml \
            .github/workflows/pr467-generated-duplicate-autofix.yml \
            .github/workflows/pr467-final-publish-controller.yml \
            .github/workflows/pr467-final-publish-controller-v2.yml; do
            test ! -e "$path"
          done
          echo 'PR467_TEMPORARY_CONTROLS_REMOVED=PASS'

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Restore API and repair the known generated request collision only when reproduced
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet restore src/backend/ProjectTime.Api/ProjectTime.Api.csproj
          set +e
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --no-restore > /tmp/pr467-initial-build.log 2>&1
          initial_status=$?
          set -e
          cat /tmp/pr467-initial-build.log
          if [[ "$initial_status" -eq 0 ]]; then
            echo 'PR467_INITIAL_API_BUILD=PASS'
            exit 0
          fi
          grep -F 'Pr467UatRepairMutationRequest' /tmp/pr467-initial-build.log

          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          TOKEN = 'Pr467UatRepairMutationRequest'

          def tracked_csharp() -> list[Path]:
              raw = subprocess.check_output(['git', 'ls-files', '-z'])
              return [
                  Path(item.decode())
                  for item in raw.split(b'\0')
                  if item and Path(item.decode()).suffix.lower() == '.cs'
              ]

          def split_params(value: str) -> list[str]:
              parts, current, depth = [], [], 0
              for char in value:
                  if char in '[(<':
                      depth += 1
                  elif char in '])>' and depth:
                      depth -= 1
                  if char == ',' and depth == 0:
                      parts.append(''.join(current).strip())
                      current = []
                  else:
                      current.append(char)
              tail = ''.join(current).strip()
              if tail:
                  parts.append(tail)
              return parts

          def param_type_name(param: str):
              value = re.sub(r'^\s*(?:\[[^\]]+\]\s*)+', '', param).strip()
              value = re.sub(r'\s*=.*$', '', value).strip()
              value = re.sub(r'^(?:in|out|ref|params)\s+', '', value).strip()
              match = re.match(r'(?P<type>.+?)\s+(?P<name>@?[A-Za-z_][A-Za-z0-9_]*)$', value)
              return (match.group('type').strip(), match.group('name').lstrip('@')) if match else None

          def matching_brace(text: str, opening: int) -> int:
              depth = 0
              string = None
              escape = False
              for index in range(opening, len(text)):
                  char = text[index]
                  if string:
                      if escape:
                          escape = False
                      elif char == '\\':
                          escape = True
                      elif char == string:
                          string = None
                      continue
                  if char in {'"', "'"}:
                      string = char
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return index
              raise RuntimeError('Unbalanced C# braces.')

          changed = []
          for path in tracked_csharp():
              text = path.read_text(errors='ignore')
              if TOKEN not in text:
                  continue

              # Remove repeated complete declarations after the first.
              type_pattern = re.compile(
                  r'(?m)^(?P<indent>\s*)(?:(?:public|internal|private|protected|sealed|abstract|partial|static)\s+)*(?:record(?:\s+(?:class|struct))?|class|struct)\s+'
                  + re.escape(TOKEN) + r'\b'
              )
              declarations = list(type_pattern.finditer(text))
              if len(declarations) > 1:
                  removals = []
                  for declaration in declarations[1:]:
                      brace = text.find('{', declaration.end())
                      semicolon = text.find(';', declaration.end())
                      if semicolon != -1 and (brace == -1 or semicolon < brace):
                          end = semicolon + 1
                      else:
                          end = matching_brace(text, brace) + 1
                      removals.append((declaration.start(), end))
                  for start, end in reversed(removals):
                      text = text[:start] + text[end:]

              # A positional record plus an explicit constructor creates CS0111.
              primary = re.compile(
                  r'(?P<prefix>(?:(?:public|internal|private|protected|sealed|abstract|partial)\s+)*record(?:\s+class)?\s+'
                  + re.escape(TOKEN) + r')\s*\((?P<params>.*?)\)\s*\{',
                  re.S,
              ).search(text)
              if primary:
                  opening = text.find('{', primary.start())
                  closing = matching_brace(text, opening)
                  body = text[opening + 1:closing]
                  explicit_ctor = re.search(r'\b' + re.escape(TOKEN) + r'\s*\(', body)
                  if explicit_ctor:
                      parsed = [param_type_name(item) for item in split_params(primary.group('params'))]
                      if not parsed or any(item is None for item in parsed):
                          raise RuntimeError(f'Could not parse {TOKEN} primary constructor in {path}.')
                      line_start = text.rfind('\n', 0, primary.start()) + 1
                      indent = re.match(r'\s*', text[line_start:primary.start()]).group(0)
                      member_indent = indent + '    '
                      properties = []
                      for type_name, name in parsed:
                          if not re.search(r'\b' + re.escape(name) + r'\s*\{', body):
                              properties.append(f'\n{member_indent}public {type_name} {name} {{ get; init; }}')
                      replacement = primary.group('prefix') + '\n' + indent + '{' + ''.join(properties)
                      text = text[:primary.start()] + replacement + text[primary.end():]

              original = path.read_text(errors='ignore')
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          print('PR467_REPAIRED_TRACKED_FILES=' + ','.join(changed))
          if not changed:
              matches = []
              for path in Path('src').rglob('*.cs'):
                  try:
                      if TOKEN in path.read_text(errors='ignore'):
                          matches.append(str(path))
                  except OSError:
                      pass
              print('PR467_ALL_TOKEN_FILES=' + ','.join(matches))
              raise SystemExit('The generated collision was reproduced, but no safe tracked-source repair was available.')
          PY
          git diff --check
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --no-restore
          echo 'PR467_GENERATED_REQUEST_COLLISION_REPAIRED=PASS'

      - name: Validate migration and focused PR467 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s database/migrations/067_uat_expense_lifecycle_work_identifiers.sql
          test -s database/rollback/067_uat_expense_lifecycle_work_identifiers_rollback.sql
          for prefix in PRO- SR- IQS- INT- PRES-; do
            grep -F "$prefix" database/migrations/067_uat_expense_lifecycle_work_identifiers.sql
          done
          python3 tests/validate-pr467-uat-repairs.py

      - name: Build API again and prove generated-source convergence
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --no-restore
          first="$(git diff --binary | sha256sum | awk '{print $1}')"
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --no-restore
          second="$(git diff --binary | sha256sum | awk '{print $1}')"
          [[ "$first" == "$second" ]]
          git diff --check
          echo 'PR467_API_BUILD_AND_GENERATOR=PASS'

      - name: Validate and build the complete frontend
        shell: bash
        working-directory: src/frontend/project-time-web
        run: |
          set -Eeuo pipefail
          npm ci
          node --check scripts/inject-module-006-toyota-hyundai-pipeline.mjs
          node --check scripts/inject-group-5-financial-operations-recovery.mjs
          node --check scripts/validate-module-005-project-expense-upload.mjs
          node --check scripts/validate-module-006-toyota-hyundai-pipelines.mjs
          node --check scripts/validate-group-5-financial-operations-recovery.mjs
          node --check scripts/validate-work-register-055c-055d.mjs
          node scripts/validate-module-005-project-expense-upload.mjs
          node scripts/validate-module-006-toyota-hyundai-pipelines.mjs
          node scripts/validate-group-5-financial-operations-recovery.mjs
          node scripts/validate-work-register-055c-055d.mjs
          npm run prebuild
          npm run prebuild
          npm run build
          git -C ../../.. diff --check
          echo 'PR467_COMPLETE_FRONTEND=PASS'

      - name: Validate clean repository security posture
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/security/validate-repository-security-posture.py
          git ls-files -z | xargs -0 -r grep -IlE 'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY' > /tmp/pr467-private-key-files || true
          test ! -s /tmp/pr467-private-key-files
          echo 'PR467_CLEAN_SECURITY_POSTURE=PASS'

      - name: Enforce the final source boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git diff --name-only "$EXPECTED_BASE_SHA" -- | sort > /tmp/pr467-final-files
          cat /tmp/pr467-final-files
          if grep -E '(^|/)(pr467-(payload|implementation|source-diagnostic|compile-diagnostic|csproj-line-fix|generated-duplicate-autofix|final-publish-controller)|pr467_apply_|pr467_finalize_)' /tmp/pr467-final-files; then
            echo 'A temporary PR467 control is still part of the final source boundary.' >&2
            exit 1
          fi
          if grep -E '^\.github/workflows/' /tmp/pr467-final-files; then
            echo 'No workflow change belongs in the final PR467 application boundary.' >&2
            exit 1
          fi
          count="$(git diff --name-only "$EXPECTED_BASE_SHA" -- | wc -l)"
          test "$count" -ge 20
          test "$count" -le 32
          echo "PR467_FINAL_SOURCE_BOUNDARY=PASS files=$count"

      - name: Commit the clean exact candidate
        id: clean
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ProjectPulse PR467 Finalizer'
          git config user.email 'projectpulse-pr467-finalizer@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup commit was required.'
          else
            git commit -m 'Finalize clean PR467 application source'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          clean_head="$(git rev-parse HEAD)"
          echo "head=$clean_head" >> "$GITHUB_OUTPUT"
          echo "PR467_CLEAN_HEAD=$clean_head"

      - name: Mark ready and merge the exact validated clean head
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_HEAD: ${{ steps.clean.outputs.head }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          [[ "$remote_head" == "$CLEAN_HEAD" ]]
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
          if ! gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$CLEAN_HEAD" --delete-branch=false; then
            echo 'Protected merge remained blocked after exact-head validation; using the explicitly authorized administrative merge.'
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --admin --match-head-commit "$CLEAN_HEAD" --delete-branch=false
          fi
          merged="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergedAt,mergeCommit --jq 'select(.mergedAt != null) | .mergeCommit.oid')"
          test -n "$merged"
          echo "PR467_MERGED_MAIN_SHA=$merged"

      - name: Emergency cleanup when validation fails
        if: failure()
        shell: bash
        run: |
          set -u
          git fetch origin "$TARGET_BRANCH" || true
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH" || exit 0
          rm -f \
            .github/workflows/pr467-final-publish-controller.yml \
            .github/workflows/pr467-final-publish-controller-v2.yml \
            .github/workflows/pr467-generated-duplicate-autofix.yml \
            .github/workflows/pr467-compile-diagnostic.yml \
            .github/workflows/pr467-csproj-line-fix.yml \
            .github/workflows/pr467-implementation-publisher.yml
          git config user.name 'ProjectPulse PR467 Cleanup'
          git config user.email 'projectpulse-pr467-cleanup@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary PR467 controls after blocked validation'
            git push origin "HEAD:$TARGET_BRANCH" || true
          fi
