name: Validate Global Session Invalidation Test Deployment

on:
  push:
    branches:
      - 'release/global-session-invalidation-web-test-*'
  pull_request:
    paths:
      - '.github/workflows/projectpulse-deploy-global-session-invalidation-test.yml'
      - '.github/workflows/validate-global-session-invalidation-test-deployment.yml'
      - 'scripts/validate-global-session-invalidation-test-deployment.sh'

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate guarded global session web-only deployment controls
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce deployment-control allowlist
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${CHANGED[@]}"

          ALLOWED=(
            '.github/workflows/projectpulse-deploy-global-session-invalidation-test.yml'
            '.github/workflows/validate-global-session-invalidation-test-deployment.yml'
            'scripts/validate-global-session-invalidation-test-deployment.sh'
          )

          [[ "${#CHANGED[@]}" -gt 0 ]] || {
            echo 'No deployment-control changes were found.' >&2
            exit 1
          }

          for changed in "${CHANGED[@]}"; do
            MATCH=false
            for allowed in "${ALLOWED[@]}"; do
              [[ "$changed" == "$allowed" ]] && MATCH=true
            done
            [[ "$MATCH" == true ]] || {
              echo "Unexpected changed file: $changed" >&2
              exit 1
            }
          done

          echo 'GLOBAL_SESSION_DEPLOYMENT_CONTROL_SCOPE=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Validate deployment-control contract
        shell: bash
        run: bash scripts/validate-global-session-invalidation-test-deployment.sh

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate global session lifecycle source
        working-directory: src/frontend/project-time-web
        run: npm run validate:global-session-invalidation

      - name: Build frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Publish exact-commit deployment-control status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          API_ROOT: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            STATE=success
            DESCRIPTION='Global session web-only deployment controls and frontend build passed.'
          else
            STATE=failure
            DESCRIPTION='Global session deployment-control validation failed.'
          fi

          PAYLOAD="$(jq -nc \
            --arg state "$STATE" \
            --arg context 'global-session-invalidation/deployment-controls' \
            --arg description "$DESCRIPTION" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$PAYLOAD" \
            "$API_ROOT/repos/$REPOSITORY/statuses/$COMMIT_SHA"
