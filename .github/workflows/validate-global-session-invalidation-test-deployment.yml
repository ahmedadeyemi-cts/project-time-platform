name: Validate Role Policy Audit Module 065 Test Deployment

on:
  push:
    branches:
      - 'release/role-policy-audit-module065-api-web-test-*'
  pull_request:
    paths:
      - '.github/workflows/projectpulse-deploy-global-session-invalidation-test.yml'
      - '.github/workflows/validate-global-session-invalidation-test-deployment.yml'
      - 'scripts/validate-global-session-invalidation-test-deployment.sh'

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate guarded role-policy audit and Module 065 controls
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce exact deployment-control scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          # DEPLOYMENT_CONCURRENCY_GOVERNANCE_SCOPE_START
          if [[ "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" == security/environment-deployment-concurrency-* ]]; then
            node scripts/validate-deployment-concurrency-governance.mjs --base-ref origin/main
            echo 'DEPLOYMENT_CONCURRENCY_GOVERNANCE_SCOPE=PASS'
            exit 0
          fi
          # DEPLOYMENT_CONCURRENCY_GOVERNANCE_SCOPE_END
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${CHANGED[@]}"

          ALLOWED=(
            '.github/workflows/projectpulse-deploy-global-session-invalidation-test.yml'
            '.github/workflows/validate-global-session-invalidation-test-deployment.yml'
            'scripts/validate-global-session-invalidation-test-deployment.sh'
          )

          [[ "${#CHANGED[@]}" -eq 3 ]] || {
            echo "Expected exactly three deployment-control files; found ${#CHANGED[@]}." >&2
            exit 1
          }

          for changed in "${CHANGED[@]}"; do
            MATCH=false
            for allowed in "${ALLOWED[@]}"; do
              [[ "$changed" == "$allowed" ]] && MATCH=true
            done
            [[ "$MATCH" == true ]] || {
              echo "Unexpected changed file: $changed" >&2
              exit 1
            }
          done

          echo 'ROLE_POLICY_AUDIT_MODULE065_DEPLOYMENT_SCOPE=PASS'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Validate deployment-control contract
        shell: bash
        run: bash scripts/validate-global-session-invalidation-test-deployment.sh

      - name: Validate release-root and rollback contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          WORKFLOW=.github/workflows/projectpulse-deploy-global-session-invalidation-test.yml
          grep -Fq 'cd release' "$WORKFLOW"
          grep -Fq 'test -d src/backend/ProjectTime.Api' "$WORKFLOW"
          grep -Fq 'CURRENT_API_IMAGE="$(resolve_digest "$RAW_API_IMAGE")"' "$WORKFLOW"
          grep -Fq 'CURRENT_WEB_IMAGE="$(resolve_digest "$RAW_WEB_IMAGE")"' "$WORKFLOW"
          grep -Fq '[[ -n "$CURRENT_API_IMAGE" && -n "$CURRENT_WEB_IMAGE" ]]' "$WORKFLOW"
          ! grep -Eq 'echo[[:space:]]+"current_(api|web)_image=\$\(resolve_digest' "$WORKFLOW"
          echo 'RELEASE_ROOT_AND_ROLLBACK_CONTRACT=PASS'

      - name: Build combined API source
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Execute role-assignment authorization tests
        run: >-
          dotnet run
          --project tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj
          --configuration Release

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate authoritative response recovery
        working-directory: src/frontend/project-time-web
        run: npm run validate:global-session-invalidation

      - name: Execute response recovery and theme runtime harness
        working-directory: src/frontend/project-time-web
        run: node scripts/test-authoritative-session-transport-theme-runtime.mjs

      - name: Validate Module 008 and Module 009
        working-directory: src/frontend/project-time-web
        run: npm run validate:modules008009

      - name: Validate Module 065 authoritative connection
        working-directory: src/frontend/project-time-web
        run: npm run validate:microsoft-connection

      - name: Validate Module 065 SSO runtime
        working-directory: src/frontend/project-time-web
        run: npm run validate:microsoft-sso-runtime

      - name: Build frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Publish exact-commit deployment-control status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          API_ROOT: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            STATE=success
            DESCRIPTION='Role-policy, audit, Module 065, release-root, and rollback checks passed.'
          else
            STATE=failure
            DESCRIPTION='Combined deployment-control validation failed.'
          fi

          PAYLOAD="$(jq -nc \
            --arg state "$STATE" \
            --arg context 'role-policy-audit-module065/deployment-controls' \
            --arg description "$DESCRIPTION" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$PAYLOAD" \
            "$API_ROOT/repos/$REPOSITORY/statuses/$COMMIT_SHA"
