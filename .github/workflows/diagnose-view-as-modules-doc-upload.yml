name: Extract exact runtime repair failures

on:
  push:
    branches:
      - diagnostic/view-as-modules-doc-upload-20260816
    paths:
      - .github/workflows/diagnose-view-as-modules-doc-upload.yml

permissions:
  actions: read
  contents: read

jobs:
  extract:
    name: Extract exact old boundary and current publication failures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ahmedadeyemi-cts/project-time-platform
    steps:
      - name: Check out diagnostic controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Download and isolate exact failures
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/runtime-repair-failure-evidence"
          mkdir -p "$OUT/current-status"

          gh run view 31917619184 \
            --repo "$REPOSITORY" \
            --job 95092065102 \
            --log > "$OUT/old-finalizer-job.log" 2>&1 || true
          gh run view 31917619184 \
            --repo "$REPOSITORY" \
            --log-failed > "$OUT/old-finalizer-failed.log" 2>&1 || true

          gh run view 31973671454 \
            --repo "$REPOSITORY" \
            --job 95229847452 \
            --log > "$OUT/current-publication-job.log" 2>&1 || true
          gh run view 31973671454 \
            --repo "$REPOSITORY" \
            --log-failed > "$OUT/current-publication-failed.log" 2>&1 || true

          gh run download 31973671454 \
            --repo "$REPOSITORY" \
            --name view-as-modules-055c-post-build-status-31973671454 \
            --dir "$OUT/current-status" > "$OUT/current-artifact-download.log" 2>&1 || true

          {
            echo '=== OLD FINALIZER EXACT BOUNDARY MATCHES ==='
            grep -nE \
              'Unexpected final source|Expected repair source missing|Expected exactly 10|PR697_PRESENTATION_FILES|FINAL_SOURCE_BOUNDARY|Guard PR 697 and exact final source boundary' \
              "$OUT/old-finalizer-job.log" "$OUT/old-finalizer-failed.log" || true
            echo
            echo '=== OLD FINALIZER FAILURE TAIL ==='
            tail -n 160 "$OUT/old-finalizer-failed.log" || true
            echo
            echo '=== CURRENT PUBLICATION FAILURE MARKERS ==='
            grep -nE \
              'ERROR:|fatal:|remote:|rejected|denied|permission|POST_BUILD_SOURCE_BOUNDARY|PRODUCT_REPAIR|Commit and push|Preserve exact reviewed source' \
              "$OUT/current-publication-job.log" "$OUT/current-publication-failed.log" || true
            echo
            echo '=== CURRENT PUBLICATION FAILURE TAIL ==='
            tail -n 200 "$OUT/current-publication-failed.log" || true
            echo
            echo '=== CURRENT POST-BUILD STATUS ARTIFACT ==='
            find "$OUT/current-status" -maxdepth 3 -type f -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; || true
            echo
            echo '=== ARTIFACT DOWNLOAD RESULT ==='
            cat "$OUT/current-artifact-download.log" || true
          } | tee "$OUT/exact-failure-summary.txt"

          test -s "$OUT/exact-failure-summary.txt"

      - name: Upload exact failure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-repair-exact-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-repair-failure-evidence
          if-no-files-found: error
          retention-days: 1
