name: Diagnose View-As, Modules, and document upload

on:
  push:
    branches:
      - diagnostic/view-as-modules-doc-upload-20260816
    paths:
      - .github/workflows/diagnose-view-as-modules-doc-upload.yml

permissions:
  contents: read

jobs:
  collect:
    name: Collect complete current source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Package complete source without Git metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./**/node_modules' \
            --exclude='./**/bin' \
            --exclude='./**/obj' \
            -czf "$RUNNER_TEMP/projectpulse-complete-source.tgz" .
          sha256sum "$RUNNER_TEMP/projectpulse-complete-source.tgz"

      - name: Upload complete source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: projectpulse-complete-source-${{ github.run_id }}
          path: ${{ runner.temp }}/projectpulse-complete-source.tgz
          if-no-files-found: error
          retention-days: 1
