name: Prepare validated Modules and 055C product commit

on:
  push:
    branches:
      - diagnostic/view-as-modules-doc-upload-20260816
    paths:
      - .github/workflows/diagnose-view-as-modules-doc-upload.yml

permissions:
  contents: write

concurrency:
  group: prepare-view-as-modules-055c-product-commit
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate source and prepare immutable Git objects
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/view-as-modules-055c-document-continuity-20260816
      EXPECTED_BASE: 1b60d1cda5fce24d99dd3850f2a65b1b27d7c374
      PATCH_SHA256: b0ad08bfe997e86f5b27e55ab6242c10871924c991c946e845c29e7e7d2ebfd1
    steps:
      - name: Check out temporary preparation controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Reconstruct exact current-main product repair
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          PATCH_GZ="$RUNNER_TEMP/view-as-modules-055c-product.patch.gz"
          PATCH_FILE="$RUNNER_TEMP/view-as-modules-055c-product.patch"
          WORKTREE="$RUNNER_TEMP/view-as-modules-055c-product"
          EVIDENCE="$RUNNER_TEMP/view-as-modules-055c-commit-evidence"
          mkdir -p "$EVIDENCE"

          cat .github/view-as-modules-055c-payload/chunk-*.b64 \
            | base64 --decode > "$PATCH_GZ"
          gzip --decompress --stdout "$PATCH_GZ" > "$PATCH_FILE"
          [[ "$(sha256sum "$PATCH_FILE" | awk '{print $1}')" == "$PATCH_SHA256" ]] \
            || fail 'The reconstructed product patch checksum does not match the reviewed patch.'

          git fetch origin main "$TARGET_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$EXPECTED_BASE" ]] \
            || fail 'main advanced after review; refusing to publish stale source.'
          [[ "$(git rev-parse "origin/$TARGET_BRANCH")" == "$EXPECTED_BASE" ]] \
            || fail 'The product branch changed after review; refusing to overwrite newer work.'

          git worktree add --detach "$WORKTREE" "origin/$TARGET_BRANCH"
          git -C "$WORKTREE" apply --check "$PATCH_FILE"
          git -C "$WORKTREE" apply "$PATCH_FILE"

          rm -rf \
            "$WORKTREE/.github/pr698-payload" \
            "$WORKTREE/.github/workflows/pr698-finalize.yml" \
            "$WORKTREE/.github/workflows/pr698-finalize-v2.yml" \
            "$WORKTREE/.github/workflows/pr698-finalize-v3.yml" \
            "$WORKTREE/.github/workflows/pr698-finalize-v4.yml" \
            "$WORKTREE/.github/workflows/pr698-trigger-finalize-v4.yml" \
            "$WORKTREE/.github/workflows/pr698-workspace-navigation-diagnostic.yml"

          cat > "$EVIDENCE/expected-paths.txt" <<'PATHS'
          .github/pr698-payload/chunk-000.b64
          .github/pr698-payload/chunk-001.b64
          .github/pr698-payload/chunk-002.b64
          .github/pr698-payload/chunk-003.b64
          .github/pr698-payload/chunk-004.b64
          .github/pr698-payload/chunk-005.b64
          .github/pr698-payload/chunk-006.b64
          .github/pr698-payload/chunk-007.b64
          .github/pr698-payload/chunk-008.b64
          .github/pr698-payload/chunk-009.b64
          .github/pr698-payload/chunk-010.b64
          .github/workflows/pr698-finalize-v2.yml
          .github/workflows/pr698-finalize-v3.yml
          .github/workflows/pr698-finalize-v4.yml
          .github/workflows/pr698-finalize.yml
          .github/workflows/pr698-trigger-finalize-v4.yml
          .github/workflows/pr698-workspace-navigation-diagnostic.yml
          .github/workflows/projectpulse-deploy-test.yml
          .github/workflows/view-as-modules-work-register-documents-ci.yml
          src/backend/ProjectTime.Api/Modules/ProjectManagementWorkRegisterScope.cs
          src/backend/ProjectTime.Api/Program.cs
          src/frontend/project-time-web/scripts/validate-view-as-modules-work-register-documents.mjs
          src/frontend/project-time-web/scripts/validate-workspace-navigation.mjs
          src/frontend/project-time-web/src/GlobalViewAsDrawer.jsx
          src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx
          src/frontend/project-time-web/src/PageContextGuide.jsx
          src/frontend/project-time-web/src/WorkRegisterCenter.jsx
          src/frontend/project-time-web/src/WorkspaceNavigationPortal.jsx
          src/frontend/project-time-web/src/module-directory-authority.js
          src/frontend/project-time-web/src/view-as-storage-compatibility.js
          src/frontend/project-time-web/src/work-register-document-integrity.js
          PATHS
          sed -i 's/^          //' "$EVIDENCE/expected-paths.txt"
          sort -o "$EVIDENCE/expected-paths.txt" "$EVIDENCE/expected-paths.txt"

          git -C "$WORKTREE" add -A
          git -C "$WORKTREE" diff --cached --name-only | sort > "$EVIDENCE/actual-paths.txt"
          diff -u "$EVIDENCE/expected-paths.txt" "$EVIDENCE/actual-paths.txt" \
            || fail 'The staged repair does not match the exact reviewed 31-path boundary.'
          [[ -z "$(git -C "$WORKTREE" diff --name-only)" ]] \
            || fail 'Unstaged source changes remain after exact staging.'
          git -C "$WORKTREE" diff --cached --check

          git -C "$WORKTREE" diff --exit-code "$EXPECTED_BASE" -- \
            .github/workflows/enterprise-ui-polish-ci.yml \
            src/frontend/project-time-web/scripts/validate-enterprise-ui-polish.mjs \
            src/frontend/project-time-web/src/assets/module-006-customer-brands.svg \
            src/frontend/project-time-web/src/enterprise-ui-polish.css \
            src/frontend/project-time-web/src/enterprise-ui-polish.js \
            src/frontend/project-time-web/src/main.jsx

          echo "worktree=$WORKTREE" >> "$GITHUB_OUTPUT"
          echo "evidence=$EVIDENCE" >> "$GITHUB_OUTPUT"
          echo 'EXACT_CURRENT_MAIN_PRODUCT_BOUNDARY=PASSED'
          echo 'PR697_PRESENTATION_FILES=UNCHANGED'

      - name: Run focused current and inherited repair validation
        shell: bash
        working-directory: ${{ steps.source.outputs.worktree }}
        run: |
          set -Eeuo pipefail
          node src/frontend/project-time-web/scripts/validate-view-as-modules-work-register-documents.mjs
          node src/frontend/project-time-web/scripts/validate-workspace-navigation.mjs
          node src/frontend/project-time-web/scripts/validate-global-view-as-drawer.mjs
          node src/frontend/project-time-web/scripts/validate-work-register-055c-055d.mjs
          node src/frontend/project-time-web/scripts/validate-project-workspace-document-download.mjs
          node src/frontend/project-time-web/scripts/validate-enterprise-ui-polish.mjs
          (
            cd src/frontend/project-time-web
            node scripts/validate-runtime-navigation-work-register-responsive.mjs
            node scripts/validate-modules-directory-page.mjs
            node scripts/validate-project-management-scope-approval-documents.mjs
          )
          python3 scripts/security/validate-repository-security-posture.py
          git diff --cached --check

      - name: Build complete API Release
        working-directory: ${{ steps.source.outputs.worktree }}
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --nologo

      - name: Audit and build complete frontend production bundle
        working-directory: ${{ steps.source.outputs.worktree }}/src/frontend/project-time-web
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run build

      - name: Verify post-build source and create immutable Git objects
        id: commit
        shell: bash
        working-directory: ${{ steps.source.outputs.worktree }}
        env:
          EVIDENCE: ${{ steps.source.outputs.evidence }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          [[ -z "$(git diff --name-only)" ]] || {
            git status --short >&2
            fail 'Validation or build mutated tracked source.'
          }
          git diff --cached --check

          test ! -e .github/pr698-payload
          test ! -e .github/workflows/pr698-finalize.yml
          test ! -e .github/workflows/pr698-finalize-v2.yml
          test ! -e .github/workflows/pr698-finalize-v3.yml
          test ! -e .github/workflows/pr698-finalize-v4.yml
          test ! -e .github/workflows/pr698-trigger-finalize-v4.yml
          test ! -e .github/workflows/pr698-workspace-navigation-diagnostic.yml

          : > "$EVIDENCE/tree-elements.ndjson"
          while IFS= read -r path; do
            if [[ -e "$path" ]]; then
              encoded="$(base64 -w0 "$path")"
              blob_sha="$(jq -n --arg content "$encoded" '{content:$content,encoding:"base64"}' \
                | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')"
              mode="$(git ls-files -s -- "$path" | awk 'NR==1 {print $1}')"
              [[ -n "$mode" ]] || mode=100644
              jq -cn --arg path "$path" --arg mode "$mode" --arg sha "$blob_sha" \
                '{path:$path,mode:$mode,type:"blob",sha:$sha}' >> "$EVIDENCE/tree-elements.ndjson"
            else
              jq -cn --arg path "$path" \
                '{path:$path,mode:"100644",type:"blob",sha:null}' >> "$EVIDENCE/tree-elements.ndjson"
            fi
          done < "$EVIDENCE/expected-paths.txt"

          jq -s '.' "$EVIDENCE/tree-elements.ndjson" > "$EVIDENCE/tree-elements.json"
          base_tree="$(git rev-parse "$EXPECTED_BASE^{tree}")"
          tree_sha="$(jq -n \
            --arg base_tree "$base_tree" \
            --slurpfile tree "$EVIDENCE/tree-elements.json" \
            '{base_tree:$base_tree,tree:$tree[0]}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')"

          commit_sha="$(jq -n \
            --arg message 'Fix View-As identity, Modules parity, and 055C document continuity' \
            --arg tree "$tree_sha" \
            --arg parent "$EXPECTED_BASE" \
            '{message:$message,tree:$tree,parents:[$parent]}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha')"

          printf '%s\n' "$EXPECTED_BASE" > "$EVIDENCE/base-sha.txt"
          printf '%s\n' "$tree_sha" > "$EVIDENCE/prepared-tree-sha.txt"
          printf '%s\n' "$commit_sha" > "$EVIDENCE/prepared-commit-sha.txt"
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit_sha" > "$EVIDENCE/prepared-commit.json"

          echo "prepared_commit=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "PREPARED_PRODUCT_COMMIT=$commit_sha"
          echo "PREPARED_PRODUCT_TREE=$tree_sha"
          echo 'POST_BUILD_SOURCE_BOUNDARY=PASSED'
          echo 'PRODUCT_REF_UPDATED=FALSE'

      - name: Upload immutable commit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: view-as-modules-055c-prepared-commit-${{ github.run_id }}
          path: ${{ steps.source.outputs.evidence }}
          if-no-files-found: error
          retention-days: 2
