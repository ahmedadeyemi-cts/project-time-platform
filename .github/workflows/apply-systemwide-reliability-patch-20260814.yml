name: Publish Final Systemwide CI Corrections 20260814 v2

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/apply-systemwide-reliability-patch-20260814.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out staging source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/systemwide-enterprise-reliability-20260814
          fetch-depth: 0
          persist-credentials: false

      - name: Stage patch scripts and check out exact PR head
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .github/reliability-patch/final-systemwide-ci-corrections.py "$RUNNER_TEMP/final-systemwide-ci-corrections.py"
          cp .github/reliability-patch/public-fact-conflict-correction.py "$RUNNER_TEMP/public-fact-conflict-correction.py"
          git checkout --detach 8b2aa5442bdb562447d9d7f44ffae7f87d0832af
          test "$(git rev-parse HEAD)" = '8b2aa5442bdb562447d9d7f44ffae7f87d0832af'

      - name: Apply exact public-fact and CI-boundary corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$RUNNER_TEMP/final-systemwide-ci-corrections.py"
          python3 "$RUNNER_TEMP/public-fact-conflict-correction.py"
          node --check tests/validate-celar-ai-pr630-consolidated.mjs
          git diff --check -- \
            src/backend/ProjectTime.Api/Ai/CelarAiAuthoritativePublicFactService.cs \
            tests/validate-celar-ai-pr630-consolidated.mjs \
            .github/workflows/module030-analytics-enterprise-experience-ci.yml \
            .github/workflows/celar-ai-production-platform-ci.yml
          grep -Fq 'recognizedCurrentPublicProfile' src/backend/ProjectTime.Api/Ai/CelarAiAuthoritativePublicFactService.cs
          grep -Fq '(?:President|Vice|Administration|White|House|The|First|United|States|His|Her|Majesty|Royal|Court)' src/backend/ProjectTime.Api/Ai/CelarAiAuthoritativePublicFactService.cs
          grep -Fq 'CELAR_PR630_SYSTEMWIDE_RELIABILITY_COMPATIBILITY=PASS' tests/validate-celar-ai-pr630-consolidated.mjs
          grep -Fq 'ANALYTICS_ENTERPRISE_SYSTEMWIDE_SOURCE_BOUNDARY=PASSED' .github/workflows/module030-analytics-enterprise-experience-ci.yml
          grep -Fq 'CELAR_AI_PRODUCTION_SOURCE_MODE=SYSTEMWIDE_RELIABILITY' .github/workflows/celar-ai-production-platform-ci.yml

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Run authoritative public-fact behavior tests
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet run --project tests/CelarAiAuthoritativePublicFactTests/CelarAiAuthoritativePublicFactTests.csproj --configuration Release

      - name: Run PR630 exact-branch regression contract
        shell: bash
        env:
          GITHUB_HEAD_REF: fix/systemwide-enterprise-reliability-final-20260814
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          node tests/validate-celar-ai-pr630-consolidated.mjs

      - name: Create exact Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          create_blob() {
            local file="$1"
            local payload response sha expected
            payload="$(jq -n --arg content "$(base64 -w0 "$file")" '{content:$content,encoding:"base64"}')"
            response="$(curl -fsS -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/git/blobs" \
              -d "$payload")"
            sha="$(jq -r '.sha // empty' <<<"$response")"
            expected="$(git hash-object "$file")"
            [[ "$sha" == "$expected" ]] || {
              echo "ERROR: GitHub blob SHA mismatch for $file." >&2
              exit 1
            }
            printf '%s\n' "$sha"
          }

          SERVICE_SHA="$(create_blob src/backend/ProjectTime.Api/Ai/CelarAiAuthoritativePublicFactService.cs)"
          WRAPPER_SHA="$(create_blob tests/validate-celar-ai-pr630-consolidated.mjs)"
          ANALYTICS_SHA="$(create_blob .github/workflows/module030-analytics-enterprise-experience-ci.yml)"
          PRODUCTION_SHA="$(create_blob .github/workflows/celar-ai-production-platform-ci.yml)"
          jq -n \
            --arg service "$SERVICE_SHA" \
            --arg wrapper "$WRAPPER_SHA" \
            --arg analytics "$ANALYTICS_SHA" \
            --arg production "$PRODUCTION_SHA" \
            '{service:{path:"src/backend/ProjectTime.Api/Ai/CelarAiAuthoritativePublicFactService.cs",sha:$service},wrapper:{path:"tests/validate-celar-ai-pr630-consolidated.mjs",sha:$wrapper},analytics:{path:".github/workflows/module030-analytics-enterprise-experience-ci.yml",sha:$analytics},production:{path:".github/workflows/celar-ai-production-platform-ci.yml",sha:$production}}' \
            > "$RUNNER_TEMP/final-systemwide-ci-blobs.json"
          cat "$RUNNER_TEMP/final-systemwide-ci-blobs.json"

      - name: Upload exact blob evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-systemwide-ci-blobs-20260814-v2
          path: ${{ runner.temp }}/final-systemwide-ci-blobs.json
          if-no-files-found: error
          retention-days: 1
