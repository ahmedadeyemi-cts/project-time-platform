name: Export Help Chat Workflow 20260814

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/apply-systemwide-reliability-patch-20260814.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/systemwide-enterprise-reliability-final-20260814
          fetch-depth: 0
          persist-credentials: false

      - name: Stage exact Help-chat workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s .github/workflows/pulse-ai-help-chat-usability-ci.yml
          mkdir -p "$RUNNER_TEMP/help-chat-workflow"
          cp .github/workflows/pulse-ai-help-chat-usability-ci.yml "$RUNNER_TEMP/help-chat-workflow/"
          sha256sum "$RUNNER_TEMP/help-chat-workflow/pulse-ai-help-chat-usability-ci.yml"

      - name: Upload exact Help-chat workflow
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ai-help-chat-usability-workflow-20260814
          path: ${{ runner.temp }}/help-chat-workflow
          if-no-files-found: error
          retention-days: 1
