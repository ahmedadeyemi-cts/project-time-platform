name: Publish Module 008 and 030 Regression Blobs 20260814

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/apply-systemwide-reliability-patch-20260814.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: cdf6b740023689157df4b625d95c3e37e5211281
          fetch-depth: 0
          persist-credentials: false

      - name: Apply exact CI regression boundaries and create Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OLD_008_B64: ZWxpZiBbWyAiJEJSQU5DSCIgPT0gZmVhdHVyZS9lbnRlcnByaXNlLW9wZXJhdGlvbnMtdXgtKiB8fCAiJEJSQU5DSCIgPT0gZml4L21vZHVsZXMtMDgxLTA4Mi10aGVtZS1yZWNvdmVyeS0qIF1dOyB0aGVu
          NEW_008_B64: ZWxpZiBbWyAiJEJSQU5DSCIgPT0gZmVhdHVyZS9lbnRlcnByaXNlLW9wZXJhdGlvbnMtdXgtKiB8fCAiJEJSQU5DSCIgPT0gZml4L21vZHVsZXMtMDgxLTA4Mi10aGVtZS1yZWNvdmVyeS0qIHx8ICIkQlJBTkNIIiA9PSBmaXgvc3lzdGVtd2lkZS1lbnRlcnByaXNlLXJlbGlhYmlsaXR5LWZpbmFsLSogXV07IHRoZW4=
          OLD_030_B64: 
          NEW_030_B64: 
        run: |
          set -Eeuo pipefail
          python3 -c 'import base64,os; from pathlib import Path; p=Path(".github/workflows/validate-global-session-invalidation.yml"); t=p.read_text(); old=base64.b64decode(os.environ["OLD_008_B64"]).decode(); new=base64.b64decode(os.environ["NEW_008_B64"]).decode(); assert t.count(old)==1, f"Module 008 anchor count={t.count(old)}"; p.write_text(t.replace(old,new,1))'
          python3 -c 'import base64,os; from pathlib import Path; p=Path(".github/workflows/module030-analytics-center-ci.yml"); t=p.read_text(); old=base64.b64decode(os.environ["OLD_030_B64"]).decode(); new=base64.b64decode(os.environ["NEW_030_B64"]).decode(); assert t.count(old)==1, f"Module 030 anchor count={t.count(old)}"; p.write_text(t.replace(old,new,1))'

          grep -Fq 'fix/systemwide-enterprise-reliability-final-*' .github/workflows/validate-global-session-invalidation.yml
          grep -Fq 'ANALYTICS_CENTER_SYSTEMWIDE_RELIABILITY_BOUNDARY=PASSED' .github/workflows/module030-analytics-center-ci.yml
          git diff --check -- \
            .github/workflows/validate-global-session-invalidation.yml \
            .github/workflows/module030-analytics-center-ci.yml

          create_blob() {
            local file="$1"
            local payload response sha expected
            payload="$(jq -n --arg content "$(base64 -w0 "$file")" '{content:$content,encoding:"base64"}')"
            response="$(curl -fsS -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/git/blobs" \
              -d "$payload")"
            sha="$(jq -r '.sha // empty' <<<"$response")"
            expected="$(git hash-object "$file")"
            [[ "$sha" == "$expected" ]] || {
              echo "ERROR: GitHub blob SHA mismatch for $file." >&2
              exit 1
            }
            printf '%s\n' "$sha"
          }

          MODULE008_SHA="$(create_blob .github/workflows/validate-global-session-invalidation.yml)"
          MODULE030_SHA="$(create_blob .github/workflows/module030-analytics-center-ci.yml)"
          jq -n --arg module008 "$MODULE008_SHA" --arg module030 "$MODULE030_SHA" \
            '{module008:{path:".github/workflows/validate-global-session-invalidation.yml",sha:$module008},module030:{path:".github/workflows/module030-analytics-center-ci.yml",sha:$module030}}' \
            > "$RUNNER_TEMP/module008-module030-blobs.json"
          cat "$RUNNER_TEMP/module008-module030-blobs.json"

      - name: Upload blob evidence
        uses: actions/upload-artifact@v4
        with:
          name: module008-module030-regression-blobs-20260814
          path: ${{ runner.temp }}/module008-module030-blobs.json
          if-no-files-found: error
          retention-days: 1
