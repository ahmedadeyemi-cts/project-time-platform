name: Publish Protected Test Image Build Repair Blob 20260814

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/apply-systemwide-reliability-patch-20260814.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact merged main release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 9b401613345ad489df8ffe390b5e99565a6b1b7e
          fetch-depth: 0
          persist-credentials: false

      - name: Patch image-build path handling and create Git blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          FILE='.github/workflows/systemwide-enterprise-reliability-test-deployment.yml'

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/systemwide-enterprise-reliability-test-deployment.yml')
          text = path.read_text()

          old_header = '''          ACR='${{ vars.AZURE_ACR_NAME }}'
          SHORT_RELEASE="${TARGET_RELEASE_COMMIT:0:12}"
          UNIQUE_TAG="rel-${SHORT_RELEASE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          resolve_digest() {
'''
          new_header = '''          ACR='${{ vars.AZURE_ACR_NAME }}'
          SHORT_RELEASE="${TARGET_RELEASE_COMMIT:0:12}"
          UNIQUE_TAG="rel-${SHORT_RELEASE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_ROOT="$(pwd -P)"
          BUILD_LOG="$EVIDENCE_DIR/image-build.log"

          install -d -m 0700 "$EVIDENCE_DIR"
          : > "$BUILD_LOG"
          [[ -n "$ACR" && "$ACR" =~ ^[A-Za-z0-9]+$ ]] || fail 'AZURE_ACR_NAME is missing or invalid.'
          for tool in az docker realpath tee; do
            command -v "$tool" >/dev/null 2>&1 || fail "Required image-build tool is unavailable: $tool"
          done
          for required in \
            deployment/containers/api/Dockerfile \
            deployment/containers/web/Dockerfile; do
            [[ -f "$required" ]] || fail "Image-build Dockerfile is missing: $required"
          done
          {
            echo "IMAGE_BUILD_RELEASE_ROOT=$RELEASE_ROOT"
            echo "IMAGE_BUILD_ACR=$ACR"
            echo "IMAGE_BUILD_UNIQUE_TAG=$UNIQUE_TAG"
          } | tee -a "$BUILD_LOG" >&2

          resolve_digest() {
'''
          if text.count(old_header) != 1:
              raise SystemExit(f'Expected one image-build header anchor; found {text.count(old_header)}.')
          text = text.replace(old_header, new_header, 1)

          old_function = '''          build_image() {
            local repository="$1" dockerfile="$2" context="$3" image="$repository:$UNIQUE_TAG" digest='' attempt
            for attempt in 1 2; do
              echo "ACR_BUILD_ATTEMPT=$attempt IMAGE=$image" >&2
              if az acr build --registry "$ACR" --image "$image" --file "$dockerfile" --timeout 3600 "$context" >&2; then
                digest="$(resolve_digest "$image" || true)"
                if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then printf '%s\\n' "$digest"; return 0; fi
              fi
              (( attempt < 2 )) && sleep $((attempt * 20))
            done
            echo "ACR cloud build failed twice; using authenticated local Docker fallback for $image." >&2
            az acr login --name "$ACR" --only-show-errors >&2
            local full_image="$ACR.azurecr.io/$image"
            docker build --file "$dockerfile" --tag "$full_image" "$context" >&2
            docker push "$full_image" >&2
            digest="$(resolve_digest "$image" || true)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "Fallback build did not publish an immutable digest for $image."
            printf '%s\\n' "$digest"
          }
'''
          new_function = '''          build_image() {
            local repository="$1" dockerfile="$2" context="$3" image="$repository:$UNIQUE_TAG"
            local digest='' attempt dockerfile_abs context_abs dockerfile_for_acr full_image

            dockerfile_abs="$(realpath "$dockerfile")" || fail "Could not resolve Dockerfile path: $dockerfile"
            context_abs="$(realpath "$context")" || fail "Could not resolve build context: $context"
            [[ -f "$dockerfile_abs" ]] || fail "Dockerfile is not a file: $dockerfile_abs"
            [[ -d "$context_abs" ]] || fail "Build context is not a directory: $context_abs"
            case "$dockerfile_abs" in
              "$context_abs"/*) dockerfile_for_acr="${dockerfile_abs#"$context_abs"/}" ;;
              *) fail "Dockerfile must be contained by its ACR build context: $dockerfile_abs outside $context_abs" ;;
            esac

            {
              echo "IMAGE_BUILD_REPOSITORY=$repository"
              echo "IMAGE_BUILD_CONTEXT=$context_abs"
              echo "IMAGE_BUILD_DOCKERFILE=$dockerfile_for_acr"
            } | tee -a "$BUILD_LOG" >&2

            for attempt in 1 2; do
              echo "ACR_BUILD_ATTEMPT=$attempt IMAGE=$image" | tee -a "$BUILD_LOG" >&2
              if az acr build \
                --registry "$ACR" \
                --image "$image" \
                --file "$dockerfile_for_acr" \
                --timeout 3600 \
                "$context_abs" 2>&1 | tee -a "$BUILD_LOG" >&2; then
                digest="$(resolve_digest "$image" || true)"
                if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  printf '%s\\n' "$digest"
                  return 0
                fi
                echo "ACR_BUILD_DIGEST_UNAVAILABLE IMAGE=$image ATTEMPT=$attempt" | tee -a "$BUILD_LOG" >&2
              fi
              (( attempt < 2 )) && sleep $((attempt * 20))
            done

            echo "ACR cloud build failed twice; using authenticated local Docker fallback for $image." | tee -a "$BUILD_LOG" >&2
            az acr login --name "$ACR" --only-show-errors 2>&1 | tee -a "$BUILD_LOG" >&2
            full_image="$ACR.azurecr.io/$image"
            docker build --file "$dockerfile_abs" --tag "$full_image" "$context_abs" 2>&1 | tee -a "$BUILD_LOG" >&2
            docker push "$full_image" 2>&1 | tee -a "$BUILD_LOG" >&2
            digest="$(resolve_digest "$image" || true)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "Fallback build did not publish an immutable digest for $image."
            printf '%s\\n' "$digest"
          }
'''
          if text.count(old_function) != 1:
              raise SystemExit(f'Expected one build_image function anchor; found {text.count(old_function)}.')
          text = text.replace(old_function, new_function, 1)

          path.write_text(text)
          PY

          grep -Fq 'IMAGE_BUILD_RELEASE_ROOT=' "$FILE"
          grep -Fq 'dockerfile_for_acr=' "$FILE"
          grep -Fq 'image-build.log' "$FILE"
          grep -Fq 'Dockerfile must be contained by its ACR build context' "$FILE"
          git diff --check -- "$FILE"

          PAYLOAD="$(jq -n --arg content "$(base64 -w0 "$FILE")" '{content:$content,encoding:"base64"}')"
          RESPONSE="$(curl -fsS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/git/blobs" \
            -d "$PAYLOAD")"
          BLOB_SHA="$(jq -r '.sha // empty' <<<"$RESPONSE")"
          EXPECTED_SHA="$(git hash-object "$FILE")"
          [[ "$BLOB_SHA" == "$EXPECTED_SHA" ]] || {
            echo 'ERROR: Protected-Test workflow blob SHA mismatch.' >&2
            exit 1
          }
          jq -n --arg path "$FILE" --arg sha "$BLOB_SHA" '{path:$path,sha:$sha}' \
            > "$RUNNER_TEMP/protected-test-image-build-workflow-blob.json"
          cat "$RUNNER_TEMP/protected-test-image-build-workflow-blob.json"

      - name: Upload workflow blob evidence
        uses: actions/upload-artifact@v4
        with:
          name: protected-test-image-build-workflow-blob-20260814
          path: ${{ runner.temp }}/protected-test-image-build-workflow-blob.json
          if-no-files-found: error
          retention-days: 1
