name: Publish FlowHive Validator Blob 20260814

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/apply-systemwide-reliability-patch-20260814.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 0537b456ae7011bcf28d16ad1658ad29b23d252d
          fetch-depth: 0
          persist-credentials: false

      - name: Reconcile the FlowHive phase-task source contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          FILE='src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs'
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs')
          text = path.read_text()
          old = "  frontend.includes('Add {phase.name} task') &&\n"
          new = (
              "  frontend.includes('function addTask(phaseWbs)') &&\n"
              "    frontend.includes('onClick={() => addTask(task.wbsNumber)}>Add task</button>') &&\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'Expected one stale FlowHive phase-button marker; found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1))
          PY

          node --check "$FILE"
          node "$FILE"
          git diff --check -- "$FILE"
          grep -Fq "frontend.includes('function addTask(phaseWbs)')" "$FILE"
          grep -Fq "frontend.includes('onClick={() => addTask(task.wbsNumber)}>Add task</button>')" "$FILE"

          PAYLOAD="$(jq -n --arg content "$(base64 -w0 "$FILE")" '{content:$content,encoding:"base64"}')"
          RESPONSE="$(curl -fsS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/git/blobs" \
            -d "$PAYLOAD")"
          BLOB_SHA="$(jq -r '.sha // empty' <<<"$RESPONSE")"
          EXPECTED_SHA="$(git hash-object "$FILE")"
          [[ "$BLOB_SHA" == "$EXPECTED_SHA" ]] || {
            echo 'ERROR: FlowHive validator blob SHA mismatch.' >&2
            exit 1
          }
          jq -n --arg path "$FILE" --arg sha "$BLOB_SHA" '{path:$path,sha:$sha}' \
            > "$RUNNER_TEMP/flowhive-validator-blob.json"
          cat "$RUNNER_TEMP/flowhive-validator-blob.json"

      - name: Upload FlowHive validator blob evidence
        uses: actions/upload-artifact@v4
        with:
          name: flowhive-validator-blob-20260814
          path: ${{ runner.temp }}/flowhive-validator-blob.json
          if-no-files-found: error
          retention-days: 1
