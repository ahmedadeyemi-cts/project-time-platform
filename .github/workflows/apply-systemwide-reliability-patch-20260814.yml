name: Publish Protected Test Image Build Repair Blob 20260814

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/apply-systemwide-reliability-patch-20260814.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact merged main release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 9b401613345ad489df8ffe390b5e99565a6b1b7e
          fetch-depth: 0
          persist-credentials: false

      - name: Patch image-build path handling and create Git blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          FILE='.github/workflows/systemwide-enterprise-reliability-test-deployment.yml'
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/patch-image-build.py"
          python3 "$RUNNER_TEMP/patch-image-build.py"

          grep -Fq 'IMAGE_BUILD_RELEASE_ROOT=' "$FILE"
          grep -Fq 'dockerfile_for_acr=' "$FILE"
          grep -Fq 'image-build.log' "$FILE"
          grep -Fq 'Dockerfile must be contained by its ACR build context' "$FILE"
          git diff --check -- "$FILE"

          PAYLOAD="$(jq -n --arg content "$(base64 -w0 "$FILE")" '{content:$content,encoding:"base64"}')"
          RESPONSE="$(curl -fsS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/git/blobs" \
            -d "$PAYLOAD")"
          BLOB_SHA="$(jq -r '.sha // empty' <<<"$RESPONSE")"
          EXPECTED_SHA="$(git hash-object "$FILE")"
          [[ "$BLOB_SHA" == "$EXPECTED_SHA" ]] || {
            echo 'ERROR: Protected-Test workflow blob SHA mismatch.' >&2
            exit 1
          }
          jq -n --arg path "$FILE" --arg sha "$BLOB_SHA" '{path:$path,sha:$sha}' \
            > "$RUNNER_TEMP/protected-test-image-build-workflow-blob.json"
          cat "$RUNNER_TEMP/protected-test-image-build-workflow-blob.json"

      - name: Upload workflow blob evidence
        uses: actions/upload-artifact@v4
        with:
          name: protected-test-image-build-workflow-blob-20260814
          path: ${{ runner.temp }}/protected-test-image-build-workflow-blob.json
          if-no-files-found: error
          retention-days: 1
