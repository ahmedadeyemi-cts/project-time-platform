name: Export Systemwide Enterprise Reliability Workflows 20260814

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/apply-systemwide-reliability-patch-20260814.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out staging branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rebuild exact reviewed patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/reliability-patch/part-* > "$RUNNER_TEMP/systemwide.patch.xz.b64"
          base64 --decode "$RUNNER_TEMP/systemwide.patch.xz.b64" > "$RUNNER_TEMP/systemwide.patch.xz"
          xz --decompress --stdout "$RUNNER_TEMP/systemwide.patch.xz" > "$RUNNER_TEMP/systemwide.patch"
          git fetch origin main
          git reset --hard origin/main
          git apply --check --whitespace=error-all "$RUNNER_TEMP/systemwide.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/systemwide.patch"
          test -s .github/workflows/systemwide-enterprise-reliability-ci.yml
          test -s .github/workflows/systemwide-enterprise-reliability-test-deployment.yml
          mkdir -p "$RUNNER_TEMP/reliability-workflows"
          cp .github/workflows/systemwide-enterprise-reliability-ci.yml "$RUNNER_TEMP/reliability-workflows/"
          cp .github/workflows/systemwide-enterprise-reliability-test-deployment.yml "$RUNNER_TEMP/reliability-workflows/"
          sha256sum "$RUNNER_TEMP/reliability-workflows/"*.yml

      - name: Upload exact workflow files
        uses: actions/upload-artifact@v4
        with:
          name: systemwide-enterprise-reliability-workflows-20260814
          path: ${{ runner.temp }}/reliability-workflows
          if-no-files-found: error
          retention-days: 1
