name: Diagnose Systemwide Reliability Frontend Build 20260814

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/apply-systemwide-reliability-patch-20260814.yml

permissions:
  contents: read

jobs:
  diagnose-frontend-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 0537b456ae7011bcf28d16ad1658ad29b23d252d
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Install exact frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Build frontend and publish concise evidence
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee "$RUNNER_TEMP/frontend-build.log"
          status=${PIPESTATUS[0]}
          echo '--- CONCISE_FRONTEND_BUILD_EVIDENCE_BEGIN ---'
          grep -Ei '(error|failed|failure|cannot|could not|syntaxerror|referenceerror|rolluperror|✗)' \
            "$RUNNER_TEMP/frontend-build.log" | tail -n 200 || true
          echo '--- CONCISE_FRONTEND_BUILD_EVIDENCE_END ---'
          exit "$status"

      - name: Upload full frontend build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemwide-reliability-frontend-build-log-20260814
          path: ${{ runner.temp }}/frontend-build.log
          if-no-files-found: error
          retention-days: 1
