name: Publish Module 008 and 030 Regression Blobs 20260814

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/apply-systemwide-reliability-patch-20260814.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: cdf6b740023689157df4b625d95c3e37e5211281
          fetch-depth: 0
          persist-credentials: false

      - name: Apply exact CI regression boundaries and create Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/module008-module030.patch"
          git apply --check --whitespace=error-all "$RUNNER_TEMP/module008-module030.patch"
          git apply --whitespace=error-all "$RUNNER_TEMP/module008-module030.patch"
          git diff --check -- \
            .github/workflows/validate-global-session-invalidation.yml \
            .github/workflows/module030-analytics-center-ci.yml

          create_blob() {
            local file="$1"
            local payload response sha expected
            payload="$(jq -n --arg content "$(base64 -w0 "$file")" '{content:$content,encoding:"base64"}')"
            response="$(curl -fsS -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/git/blobs" \
              -d "$payload")"
            sha="$(jq -r '.sha // empty' <<<"$response")"
            expected="$(git hash-object "$file")"
            [[ "$sha" == "$expected" ]] || exit 1
            printf '%s\n' "$sha"
          }

          MODULE008_SHA="$(create_blob .github/workflows/validate-global-session-invalidation.yml)"
          MODULE030_SHA="$(create_blob .github/workflows/module030-analytics-center-ci.yml)"
          jq -n --arg module008 "$MODULE008_SHA" --arg module030 "$MODULE030_SHA" \
            '{module008:{path:".github/workflows/validate-global-session-invalidation.yml",sha:$module008},module030:{path:".github/workflows/module030-analytics-center-ci.yml",sha:$module030}}' \
            > "$RUNNER_TEMP/module008-module030-blobs.json"
          cat "$RUNNER_TEMP/module008-module030-blobs.json"

      - name: Upload blob evidence
        uses: actions/upload-artifact@v4
        with:
          name: module008-module030-regression-blobs-20260814
          path: ${{ runner.temp }}/module008-module030-blobs.json
          if-no-files-found: error
          retention-days: 1
