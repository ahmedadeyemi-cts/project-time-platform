name: Diagnose Universal Answer Evidence Gate 20260814

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/apply-systemwide-reliability-patch-20260814.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 4746ee65bc4950de665904be8c1778741d72147a
          fetch-depth: 0
          persist-credentials: false

      - name: Print the failing live-public assessment
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE='tests/CelarAiUniversalAnswerReliabilityTests/Program.cs'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/CelarAiUniversalAnswerReliabilityTests/Program.cs')
          text = path.read_text()
          anchor = 'Require(livePublic.Assessment.Passed, "retrieval-time cited public answer passes");\n'
          diagnostic = '''Console.WriteLine("LIVE_PUBLIC_PLAN=" + JsonSerializer.Serialize(currentPublicPlan));
Console.WriteLine("LIVE_PUBLIC_ASSESSMENT=" + JsonSerializer.Serialize(livePublic.Assessment));
Console.WriteLine("LIVE_PUBLIC_RESULT=" + JsonSerializer.Serialize(livePublic.Result));
'''
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one live-public assertion; found {text.count(anchor)}.')
          path.write_text(text.replace(anchor, diagnostic + anchor, 1))
          PY
          git diff --check -- "$FILE"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Run diagnostic test
        shell: bash
        run: |
          set +e
          dotnet run --project tests/CelarAiUniversalAnswerReliabilityTests/CelarAiUniversalAnswerReliabilityTests.csproj --configuration Release 2>&1 | tee "$RUNNER_TEMP/universal-answer-diagnostic.log"
          status=${PIPESTATUS[0]}
          echo '--- LIVE_PUBLIC_DIAGNOSTIC_BEGIN ---'
          grep -E '^LIVE_PUBLIC_(PLAN|ASSESSMENT|RESULT)=' "$RUNNER_TEMP/universal-answer-diagnostic.log" || true
          echo '--- LIVE_PUBLIC_DIAGNOSTIC_END ---'
          exit "$status"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-answer-evidence-gate-diagnostic-20260814
          path: ${{ runner.temp }}/universal-answer-diagnostic.log
          if-no-files-found: error
          retention-days: 1
