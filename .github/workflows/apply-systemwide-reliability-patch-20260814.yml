name: Diagnose Systemwide Reliability API Build 20260814

on:
  push:
    branches:
      - fix/systemwide-enterprise-reliability-20260814
    paths:
      - .github/workflows/apply-systemwide-reliability-patch-20260814.yml

permissions:
  contents: read

jobs:
  diagnose-api-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: cdf6b740023689157df4b625d95c3e37e5211281
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Build API and publish concise compiler evidence
        shell: bash
        run: |
          set +e
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj \
            --configuration Release \
            --verbosity minimal \
            2>&1 | tee "$RUNNER_TEMP/api-build.log"
          status=${PIPESTATUS[0]}
          echo '--- CONCISE_COMPILER_EVIDENCE_BEGIN ---'
          grep -E '(^|: )(error (CS|MSB|NU)[0-9]*:|error:|Build FAILED\.|[0-9]+ Error\(s\))' \
            "$RUNNER_TEMP/api-build.log" | tail -n 120 || true
          echo '--- CONCISE_COMPILER_EVIDENCE_END ---'
          exit "$status"

      - name: Upload full API build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemwide-reliability-api-build-log-20260814
          path: ${{ runner.temp }}/api-build.log
          if-no-files-found: error
          retention-days: 1
