name: ProjectPulse CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectpulse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Validate repository security posture
        run: python3 scripts/security/validate-repository-security-posture.py

      - name: Restore API dependencies
        run: dotnet restore src/backend/ProjectTime.Api/ProjectTime.Api.csproj

      - name: Audit NuGet dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet list src/backend/ProjectTime.Api/ProjectTime.Api.csproj package \
            --vulnerable \
            --include-transitive \
            --no-restore | tee /tmp/projectpulse-nuget-vulnerabilities.log
          if grep -Eiq '(^|[[:space:]])(high|critical)([[:space:]]|$)' /tmp/projectpulse-nuget-vulnerabilities.log; then
            echo "High or critical NuGet vulnerability detected." >&2
            exit 1
          fi
          echo "NUGET_HIGH_CRITICAL_VULNERABILITIES=NONE"

      - name: Build API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --no-restore

      - name: Test scoped RBAC migration 040 apply and rollback
        shell: bash
        run: |
          set +e
          bash tests/test-scoped-rbac-migration-040.sh > /tmp/scoped-rbac-migration-040.log 2>&1
          status=$?
          cat /tmp/scoped-rbac-migration-040.log
          exit $status

      - name: Upload migration 040 diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scoped-rbac-migration-040-diagnostics
          path: /tmp/scoped-rbac-migration-040.log
          retention-days: 7

      - name: Test Module 001 migration 041 apply and rollback
        shell: bash
        run: |
          set +e
          bash tests/test-module-001-migration-041.sh > /tmp/module-001-migration-041.log 2>&1
          status=$?
          cat /tmp/module-001-migration-041.log
          exit $status

      - name: Upload Module 001 migration 041 diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-001-migration-041-diagnostics
          path: /tmp/module-001-migration-041.log
          retention-days: 7

      - name: Test PTC time steward migration 043 apply and rollback
        shell: bash
        run: |
          set +e
          bash tests/test-ptc-time-steward-migration-043.sh > /tmp/ptc-time-steward-migration-043.log 2>&1
          status=$?
          cat /tmp/ptc-time-steward-migration-043.log
          exit $status

      - name: Upload PTC migration 043 diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ptc-time-steward-migration-043-diagnostics
          path: /tmp/ptc-time-steward-migration-043.log
          retention-days: 7

      - name: Test Module 005 expense parser formats
        shell: bash
        run: |
          set +e
          dotnet run --project tests/Module005ExpenseParserTests/Module005ExpenseParserTests.csproj \
            --configuration Release > /tmp/module005-parser-tests.log 2>&1
          status=$?
          cat /tmp/module005-parser-tests.log
          exit $status

      - name: Upload Module 005 parser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module005-parser-test-diagnostics
          path: /tmp/module005-parser-tests.log
          retention-days: 7

      - name: Test Module 005 migration 044 and 044a apply and rollback
        shell: bash
        run: |
          set +e
          bash tests/test-project-expense-migration-044.sh > /tmp/project-expense-migration-044.log 2>&1
          status=$?
          cat /tmp/project-expense-migration-044.log
          exit $status

      - name: Upload Module 005 migration diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: project-expense-migration-044-diagnostics
          path: /tmp/project-expense-migration-044.log
          retention-days: 7

      - name: Test Work Register project authorization
        run: dotnet run --project tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj --configuration Release

      - name: Validate July 29 platform security remediation
        run: python3 scripts/validate-platform-security-remediation-20260729.py

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-fund

      - name: Audit npm dependencies
        working-directory: src/frontend/project-time-web
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set +e
          npm run build > /tmp/projectpulse-frontend-build.log 2>&1
          status=$?
          cat /tmp/projectpulse-frontend-build.log
          exit $status

      - name: Upload frontend build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: projectpulse-frontend-build-diagnostics
          path: /tmp/projectpulse-frontend-build.log
          retention-days: 7

      - name: Ensure validation did not mutate tracked source
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git diff --exit-code

      - name: Validate PR55 test deployment guard
        run: scripts/validate-pr55-test-deployment.sh

      - name: Validate dashboard hotfix test deployment guard
        run: bash scripts/validate-dashboard-hotfix-test-deployment.sh

      - name: Validate Modules page test deployment guard
        run: bash scripts/validate-modules-page-test-deployment.sh

      - name: Validate Approval Center hotfix test deployment guard
        run: bash scripts/validate-approval-access-hotfix-test-deployment.sh

      - name: Validate dashboard calendar test deployment guard
        run: bash scripts/validate-dashboard-calendar-test-deployment.sh

      - name: Validate Modules card-number test deployment guard
        run: bash scripts/validate-modules-card-numbers-test-deployment.sh

      - name: Validate scoped RBAC test deployment guard
        run: bash scripts/validate-scoped-rbac-test-deployment.sh

      - name: Validate Module 012/037 permission test deployment guard
        run: bash scripts/validate-module-012-037-permissions-test-deployment.sh

      - name: Validate combined permissions and PTC test deployment guard
        run: bash scripts/validate-intuitive-permissions-ptc-test-deployment.sh

      - name: Validate scoped RBAC catalog hotfix deployment guard
        run: bash scripts/validate-scoped-rbac-catalog-hotfix-test-deployment.sh

      - name: Validate Module 001 test deployment guard
        run: bash scripts/validate-module-001-test-deployment.sh

      - name: Validate Module 001 blank-page hotfix deployment guard
        run: bash scripts/validate-module-001-blank-page-hotfix-test-deployment.sh

      - name: Validate Module 001 timer hotfix deployment guard
        run: bash scripts/validate-module-001-timer-hotfix-test-deployment.sh

      - name: Validate Module 001 view-sync deployment guard
        run: bash scripts/validate-module-001-view-sync-test-deployment.sh

      - name: Validate simplified Module 001 deployment guard
        run: bash scripts/validate-module-001-simplified-timer-test-deployment.sh

      - name: Validate container definitions and web build context
        run: |
          test -f deployment/containers/api/Dockerfile
          test -f deployment/containers/web/Dockerfile
          docker build \
            --file deployment/containers/web/Dockerfile \
            --tag "projectpulse-web-ci:${GITHUB_SHA}" \
            .

      - name: Generate release manifest
        run: |
          mkdir -p artifacts
          cat > artifacts/release-manifest.json <<JSON
          {
            "commit": "${GITHUB_SHA}",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "runId": "${GITHUB_RUN_ID}",
            "artifactFormat": "oci"
          }
          JSON

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: projectpulse-release-manifest
          path: artifacts/release-manifest.json
