name: PR737 Final Protected Test Document Repair

on:
  push:
    branches:
      - fix/shared-project-document-planning-20260819
    paths:
      - .github/workflows/pr737-finish-protected-test-document-processing.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/shared-project-document-planning-20260819
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Apply exact Protected Test processing boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '' | base64 --decode > /tmp/pr737-repair.py
          python3 /tmp/pr737-repair.py

      - name: Prove interactive candidate mutations remain fenced
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -c 'from pathlib import Path; p=Path("src/frontend/project-time-web/scripts/validate-celar-ai-release-scoped-runtime.mjs"); s=p.read_text(); old="    && runtimeService.match(/RejectCandidateDataMutation/g)?.length >= 4\n"; new="    && runtimeService.includes(\"RejectCandidateDataMutation(\\\"Private document queue mutation\\\")\")\n    && runtimeService.includes(\"RejectCandidateDataMutation(\\\"Private document version approval\\\")\")\n    && runtimeService.includes(\"RejectCandidateDataMutation(\\\"Private document processing cancellation\\\")\")\n    && runtimeService.includes(\"RejectCandidateDataMutation(\\\"Private document processing retry\\\")\")\n"; assert s.count(old)==1, "candidate mutation count assertion not found exactly once"; p.write_text(s.replace(old,new,1))'

      - name: Validate focused repair
        shell: bash
        run: |
          set -Eeuo pipefail
          node src/frontend/project-time-web/scripts/validate-celar-ai-release-scoped-runtime.mjs
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr737-finish-protected-test-document-processing.yml
          git add src/backend/ProjectTime.Api/Ai/PulseAiProtectedTestCandidatePolicy.cs \
                  src/backend/ProjectTime.Api/Ai/PulseAiPrivateDocumentRuntimeWorker.cs \
                  src/backend/ProjectTime.Api/Ai/PulseAiPrivateDocumentRuntimeService.cs \
                  src/frontend/project-time-web/scripts/validate-celar-ai-release-scoped-runtime.mjs
          git diff --cached --check
          git commit -m "fix: allow exact protected test document processing"
          git push origin HEAD:fix/shared-project-document-planning-20260819
