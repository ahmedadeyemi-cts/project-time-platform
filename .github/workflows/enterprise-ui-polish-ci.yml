name: Enterprise UI and On-Call Follow-up CI

on:
  pull_request:
    paths:
      - '.github/workflows/enterprise-ui-polish-ci.yml'
      - 'src/frontend/project-time-web/scripts/inject-celar-ai-ask-operations.mjs'
      - 'src/frontend/project-time-web/scripts/validate-enterprise-ui-polish.mjs'
      - 'src/frontend/project-time-web/scripts/validate-module-071-oncall-scheduling.mjs'
      - 'src/frontend/project-time-web/scripts/validate-module-072-oneassist-routing-directory.mjs'
      - 'src/frontend/project-time-web/src/celar-ai-control-followup.css'
      - 'src/frontend/project-time-web/src/enterprise-ui-polish.js'
      - 'src/frontend/project-time-web/src/enterprise-ui-polish.css'
      - 'src/frontend/project-time-web/src/assets/module-006-customer-brands.svg'
      - 'src/frontend/project-time-web/src/main.jsx'
      - 'src/frontend/project-time-web/src/OnCallSchedulingCenter.jsx'
      - 'src/frontend/project-time-web/src/oncall-scheduling-center.css'
      - 'src/frontend/project-time-web/src/OneAssistRoutingDirectoryCenter.jsx'
      - 'src/backend/ProjectTime.Api/Modules/OnCallSchedulingModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/OneAssistRoutingDirectoryModule.cs'
      - 'docs/modules/module-071-oncall-scheduling/**'
      - 'docs/modules/module-072-oneassist-routing-directory/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-ui-oncall-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Appearance, Celar controls, On-Call access, and OneAssist boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard the source boundary
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/changed-files.txt
          cat > /tmp/allowed-files.txt <<'FILES'
          .github/workflows/enterprise-ui-polish-ci.yml
          docs/modules/module-071-oncall-scheduling/API-CONTRACT.md
          docs/modules/module-071-oncall-scheduling/AUTHORIZATION-MATRIX.md
          docs/modules/module-071-oncall-scheduling/README.md
          docs/modules/module-072-oneassist-routing-directory/API-CONTRACT.md
          docs/modules/module-072-oneassist-routing-directory/AUTHORIZATION-MATRIX.md
          docs/modules/module-072-oneassist-routing-directory/README.md
          src/backend/ProjectTime.Api/Modules/OnCallSchedulingModule.cs
          src/backend/ProjectTime.Api/Modules/OneAssistRoutingDirectoryModule.cs
          src/frontend/project-time-web/scripts/inject-celar-ai-ask-operations.mjs
          src/frontend/project-time-web/scripts/validate-enterprise-ui-polish.mjs
          src/frontend/project-time-web/scripts/validate-module-071-oncall-scheduling.mjs
          src/frontend/project-time-web/scripts/validate-module-072-oneassist-routing-directory.mjs
          src/frontend/project-time-web/src/OnCallSchedulingCenter.jsx
          src/frontend/project-time-web/src/OneAssistRoutingDirectoryCenter.jsx
          src/frontend/project-time-web/src/assets/module-006-customer-brands.svg
          src/frontend/project-time-web/src/celar-ai-control-followup.css
          src/frontend/project-time-web/src/enterprise-ui-polish.css
          src/frontend/project-time-web/src/enterprise-ui-polish.js
          src/frontend/project-time-web/src/main.jsx
          src/frontend/project-time-web/src/oncall-scheduling-center.css
          FILES
          sort -o /tmp/allowed-files.txt /tmp/allowed-files.txt
          unexpected="$(comm -23 /tmp/changed-files.txt /tmp/allowed-files.txt)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected source outside the approved PR #698 boundary:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          echo 'PR698_SOURCE_BOUNDARY=PASS'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci

      - name: Validate syntax and focused contracts
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -euo pipefail
          node --check ./src/enterprise-ui-polish.js
          node --check ./scripts/inject-celar-ai-ask-operations.mjs
          node --check ./scripts/validate-enterprise-ui-polish.mjs
          node --check ./scripts/validate-module-071-oncall-scheduling.mjs
          node --check ./scripts/validate-module-072-oneassist-routing-directory.mjs
          node ./scripts/validate-enterprise-ui-polish.mjs
          node ./scripts/validate-module-071-oncall-scheduling.mjs
          node ./scripts/validate-module-072-oneassist-routing-directory.mjs
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('src/assets/module-006-customer-brands.svg')
          print('MODULE_006_CUSTOMER_BRANDS_SVG=PASS')
          PY

      - name: Run complete frontend production build
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Ensure validation did not mutate tracked source
        shell: bash
        run: git diff --exit-code
