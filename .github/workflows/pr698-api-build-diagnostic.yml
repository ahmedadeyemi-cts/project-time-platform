name: PR 698 Trigger Final Validated Build

on:
  push:
    branches:
      - fix/classic-appearance-celar-controls-20260815
    paths:
      - '.github/workflows/pr698-api-build-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: pr698-trigger-final-validated-build
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/classic-appearance-celar-controls-20260815
          fetch-depth: 0

      - name: Trigger finalizer on the corrected branch and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PR 698 finalizer trigger'
          git config user.email 'pr698-finalizer-trigger@users.noreply.github.com'
          printf '\n# Triggered after shared navigation grant-contract convergence.\n' >> .github/workflows/pr698-finalize-v4.yml
          git rm .github/workflows/pr698-api-build-diagnostic.yml
          git add .github/workflows/pr698-finalize-v4.yml
          git diff --cached --check
          git commit -m 'ci: trigger corrected PR 698 final validation'
          git push origin HEAD:fix/classic-appearance-celar-controls-20260815
