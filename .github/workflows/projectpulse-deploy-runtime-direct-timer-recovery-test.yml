name: ProjectPulse Deploy Runtime Direct Timer Recovery Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified runtime and timer recovery release
        required: true
        default: 23e97e68f741bcfb27df4baf4b95397eda54fcb2
        type: string
      confirmation:
        description: Enter DEPLOY-RUNTIME-DIRECT-TIMER-RECOVERY-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-runtime-direct-timer-recovery-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded runtime direct and timer recovery web deployment
    environment: test
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_COMMIT: 23e97e68f741bcfb27df4baf4b95397eda54fcb2
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact verified release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and verified frontend release
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$WORKFLOW_SOURCE_REF" == 'refs/heads/main' ]] || { echo 'Dispatch this workflow from main.' >&2; exit 1; }
          [[ "$DISPATCH_CONFIRMATION" == 'DEPLOY-RUNTIME-DIRECT-TIMER-RECOVERY-TO-TEST' ]] || { echo 'Confirmation text does not match.' >&2; exit 1; }
          [[ "$DISPATCH_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_commit must be a complete SHA.' >&2; exit 1; }

          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == "$WORKFLOW_SOURCE_SHA" ]]
          [[ "$TARGET_COMMIT" == "$DISPATCH_RELEASE_COMMIT" ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || { echo 'Only the verified runtime-direct release may deploy.' >&2; exit 1; }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || { echo 'The release is not an ancestor of the deployment controls.' >&2; exit 1; }

          test -f release/src/frontend/project-time-web/src/runtime-data-compatibility.js
          test -f release/src/frontend/project-time-web/src/module001/Module001ActiveTimerRecoveryPortal.jsx
          test -f release/src/frontend/project-time-web/src/module001/module001-active-timer-recovery.css
          test -f release/src/frontend/project-time-web/src/certify-integration-center.css
          test -f release/src/frontend/project-time-web/src/main.jsx
          test -f release/src/frontend/project-time-web/scripts/validate-combined-modules-001-005-012-037-038.mjs
          test -f release/src/frontend/project-time-web/scripts/validate-module-001-timesheet-timer-mobile.mjs
          test -f release/src/frontend/project-time-web/scripts/validate-runtime-role-policy-ptc-data.mjs
          test -f release/src/frontend/project-time-web/scripts/validate-module-005-project-expense-upload.mjs
          test -f control/scripts/build-pr55-acr-image.sh

          grep -Fq 'projectpulse-critical-runtime-direct-2026-07-26' release/src/frontend/project-time-web/src/runtime-data-compatibility.js
          grep -Fq 'window.__projectPulseOriginalFetch' release/src/frontend/project-time-web/src/runtime-data-compatibility.js
          grep -Fq 'x-projectpulse-authoritative-path' release/src/frontend/project-time-web/src/runtime-data-compatibility.js
          grep -Fq 'direct authoritative response' release/src/frontend/project-time-web/src/runtime-data-compatibility.js
          grep -Fq "'/api/runtime/v2/timesheet/steward/users': '/api/timesheet/ptc/users'" release/src/frontend/project-time-web/src/runtime-data-compatibility.js
          grep -Fq 'allActiveUsersAllowed: true' release/src/frontend/project-time-web/src/runtime-data-compatibility.js

          grep -Fq '/api/timesheet/timers/active' release/src/frontend/project-time-web/src/module001/Module001ActiveTimerRecoveryPortal.jsx
          grep -Fq 'window.setInterval(load, 5000)' release/src/frontend/project-time-web/src/module001/Module001ActiveTimerRecoveryPortal.jsx
          grep -Fq 'window.setInterval(() => setClock(new Date()), 1000)' release/src/frontend/project-time-web/src/module001/Module001ActiveTimerRecoveryPortal.jsx
          grep -Fq 'Running timer recovered' release/src/frontend/project-time-web/src/module001/Module001ActiveTimerRecoveryPortal.jsx
          grep -Fq "description: timer.description || ''" release/src/frontend/project-time-web/src/module001/Module001ActiveTimerRecoveryPortal.jsx
          grep -Fq 'No work description is recorded.' release/src/frontend/project-time-web/src/module001/Module001ActiveTimerRecoveryPortal.jsx
          grep -Fq 'Stop timer' release/src/frontend/project-time-web/src/module001/Module001ActiveTimerRecoveryPortal.jsx
          grep -Fq 'Discard' release/src/frontend/project-time-web/src/module001/Module001ActiveTimerRecoveryPortal.jsx
          ! grep -Fq 'Open timer view' release/src/frontend/project-time-web/src/module001/Module001ActiveTimerRecoveryPortal.jsx
          ! grep -Fq 'Stopped from the active timer recovery surface.' release/src/frontend/project-time-web/src/module001/Module001ActiveTimerRecoveryPortal.jsx

          grep -Fq "import Module001ActiveTimerRecoveryPortal from './module001/Module001ActiveTimerRecoveryPortal.jsx';" release/src/frontend/project-time-web/src/main.jsx
          grep -Fq '<Module001ActiveTimerRecoveryPortal />' release/src/frontend/project-time-web/src/main.jsx
          grep -Fq 'main.app-shell.route-certify-integration .certify-integration-center' release/src/frontend/project-time-web/src/certify-integration-center.css
          grep -Fq 'max-height:calc(100dvh - 15rem)' release/src/frontend/project-time-web/src/certify-integration-center.css
          grep -Fq 'overflow-y:auto' release/src/frontend/project-time-web/src/certify-integration-center.css
          grep -Fq 'overscroll-behavior:contain' release/src/frontend/project-time-web/src/certify-integration-center.css

          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current immutable web image
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          [[ -n "$RAW_WEB" && "${WEB_MODE,,}" == single ]] || { echo 'The test web app must use single-revision mode and expose a current image.' >&2; exit 1; }

          REGISTRY='${{ vars.AZURE_ACR_NAME }}.azurecr.io/'
          case "$RAW_WEB" in
            "$REGISTRY"*@sha256:*) IMMUTABLE_WEB="$RAW_WEB" ;;
            "$REGISTRY"*:*)
              RELATIVE="${RAW_WEB#"$REGISTRY"}"
              REPOSITORY="${RELATIVE%:*}"
              DIGEST="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$RELATIVE" --query digest -o tsv)"
              [[ "$DIGEST" == sha256:* ]]
              IMMUTABLE_WEB="$REGISTRY$REPOSITORY@$DIGEST"
              ;;
            *) echo "Current web image is outside the approved ACR: $RAW_WEB" >&2; exit 1 ;;
          esac
          echo "old_web_image=$IMMUTABLE_WEB" >> "$GITHUB_OUTPUT"

      - name: Build immutable runtime-direct web image
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA='${{ steps.release.outputs.target_commit }}'
          WEB_REPO='project-health-dashboard-web'
          WEB_DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$WEB_REPO:runtime-direct-timer-recovery-$SHA" release/deployment/containers/web/Dockerfile release)"
          [[ "$WEB_DIGEST" == sha256:* ]]
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$WEB_REPO@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy runtime-direct web release
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "rtdir-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none

      - name: Validate served runtime, timer recovery, and Module 038 assets
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          READY=false
          mkdir -p /tmp/runtime-direct-validation

          for attempt in $(seq 1 36); do
            BUSTER="runtime-direct-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$attempt"
            STATUS="$(curl -sSL -H 'Cache-Control: no-cache, no-store' -o /tmp/runtime-direct-validation/index.html -w '%{http_code}' "$BASE/?release_check=$BUSTER" || true)"
            JS="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/runtime-direct-validation/index.html | head -1)"
            CSS="$(sed -nE 's/.*href="([^"]+\.css)".*/\1/p' /tmp/runtime-direct-validation/index.html | head -1)"

            if [[ "$STATUS" == 200 && -n "$JS" && -n "$CSS" ]]; then
              case "$JS" in http*) JS_URL="$JS" ;; /*) JS_URL="$BASE$JS" ;; *) JS_URL="$BASE/$JS" ;; esac
              case "$CSS" in http*) CSS_URL="$CSS" ;; /*) CSS_URL="$BASE$CSS" ;; *) CSS_URL="$BASE/$CSS" ;; esac
              curl -sSL -H 'Cache-Control: no-cache, no-store' -o /tmp/runtime-direct-validation/app.js "$JS_URL?release_check=$BUSTER" || true
              curl -sSL -H 'Cache-Control: no-cache, no-store' -o /tmp/runtime-direct-validation/app.css "$CSS_URL?release_check=$BUSTER" || true

              if grep -Fq 'projectpulse-critical-runtime-direct-2026-07-26' /tmp/runtime-direct-validation/app.js \
                && grep -Fq 'x-projectpulse-authoritative-path' /tmp/runtime-direct-validation/app.js \
                && grep -Fq '/api/runtime/v2/role-policy/summary' /tmp/runtime-direct-validation/app.js \
                && grep -Fq '/api/runtime/v2/role-policy/matrix' /tmp/runtime-direct-validation/app.js \
                && grep -Fq '/api/timesheet/ptc/users' /tmp/runtime-direct-validation/app.js \
                && grep -Fq '/api/timesheet/timers/active' /tmp/runtime-direct-validation/app.js \
                && grep -Fq 'Running timer recovered' /tmp/runtime-direct-validation/app.js \
                && grep -Fq 'No work description is recorded.' /tmp/runtime-direct-validation/app.js \
                && grep -Fq 'All active users' /tmp/runtime-direct-validation/app.js \
                && grep -Fq 'Stop timer' /tmp/runtime-direct-validation/app.js \
                && grep -Fq 'Test connection to unlock' /tmp/runtime-direct-validation/app.js \
                && grep -Fq 'overscroll-behavior:contain' /tmp/runtime-direct-validation/app.css \
                && grep -Fq 'max-height:calc(100dvh - 15rem)' /tmp/runtime-direct-validation/app.css; then
                READY=true
                break
              fi
            fi
            sleep 10
          done

          [[ "$READY" == true ]] || { echo 'The runtime-direct, timer-recovery, and Module 038 markers were not served.' >&2; exit 1; }
          ACTIVE_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_WEB" == '${{ steps.build.outputs.web_image }}' ]]
          echo 'RUNTIME_DIRECT_TIMER_RECOVERY_LIVE_WEB=READY'

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/runtime-direct-timer-recovery-test-deployment.json <<JSON
          {"environment":"test","releaseCommit":"${{ steps.release.outputs.target_commit }}","workflowCommit":"${{ github.sha }}","runId":"${{ github.run_id }}","runAttempt":"${{ github.run_attempt }}","modules":["001","012","037","038"],"deploymentType":"web-only","webImage":"${{ steps.build.outputs.web_image }}","previousWebImage":"${{ steps.before.outputs.old_web_image }}","runtimeTransport":"direct-authoritative","activeTimerRecovery":true,"module038BoundedScroll":true}
          JSON

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-direct-timer-recovery-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/runtime-direct-timer-recovery-test-deployment.json
          retention-days: 30

      - name: Roll back web image on failure
        if: ${{ failure() && steps.deploy_web.outputs.started == 'true' }}
        shell: bash
        run: |
          set +e
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.before.outputs.old_web_image }}' \
            --revision-suffix "rtdirrb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none
