name: Finalize PR 719 Module Directory, Ownership, and 001A Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-module-directory-owner-001a-pr.yml'
      - 'scripts/release-test/finalize-pr719-source.py'

permissions:
  contents: write

concurrency:
  group: finalize-pr719-source-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/module-directory-owner-001a-continuity-20260818'
    name: Publish final reviewed PR 719 source
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply guarded final source repair
        shell: bash
        run: |
          set -Eeuo pipefail

          ruby -ryaml -e '
            document = YAML.load_file(ARGV.fetch(0))
            step = document.fetch("jobs").fetch("publish").fetch("steps").find do |candidate|
              candidate["name"] == "Apply the reviewed source repair"
            end
            abort("Base PR 719 repair step was not found.") unless step && step["run"]
            File.write(ARGV.fetch(1), step.fetch("run"))
          ' .github/workflows/publish-pr719-module-directory-owner-001a.yml /tmp/pr719-base-repair.sh

          ruby -ryaml -e '
            document = YAML.load_file(ARGV.fetch(0))
            step = document.fetch("jobs").fetch("finalize").fetch("steps").find do |candidate|
              candidate["name"] == "Enforce developer Super Administrator owner eligibility"
            end
            abort("Developer-owner policy step was not found.") unless step && step["run"]
            File.write(ARGV.fetch(1), step.fetch("run"))
          ' .github/workflows/publish-pr719-finalize-pr.yml /tmp/pr719-developer-owner-policy.sh

          bash /tmp/pr719-base-repair.sh
          bash /tmp/pr719-developer-owner-policy.sh
          rm -f scripts/release-test/finalize-pr719-source.py

      - name: Validate final source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          node tests/validate-module-management-owner-drawer.mjs
          (
            cd src/frontend/project-time-web
            node scripts/validate-modules-directory-page.mjs
          )
          bash -n scripts/release-test/run-assigned-work-protected-test-uat.sh
          git diff --check

      - name: Commit and push final PR 719 source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add -A
          git diff --cached --quiet && {
            echo 'ERROR: PR 719 finalizer produced no source change.' >&2
            exit 1
          }
          git commit -m 'fix(modules): restore request visibility, owner truth, and fast directory hydration'
          git push origin HEAD:fix/module-directory-owner-001a-continuity-20260818
