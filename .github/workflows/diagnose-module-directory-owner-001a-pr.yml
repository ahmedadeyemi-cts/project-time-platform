name: Finalize PR 719 Module Directory, Ownership, and 001A Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-module-directory-owner-001a-pr.yml'
      - 'scripts/release-test/finalize-pr719-source.py'

permissions:
  contents: write

concurrency:
  group: finalize-pr719-source-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/module-directory-owner-001a-continuity-20260818'
    name: Publish final reviewed PR 719 source
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply guarded final source repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/release-test/finalize-pr719-source.py

      - name: Validate final source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          node tests/validate-module-management-owner-drawer.mjs
          (
            cd src/frontend/project-time-web
            node scripts/validate-modules-directory-page.mjs
          )
          bash -n scripts/release-test/run-assigned-work-protected-test-uat.sh
          git diff --check

      - name: Commit and push final PR 719 application source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'

          # GitHub's workflow token may publish ordinary source but cannot update
          # workflow files. Preserve the branch workflow files here; the reviewed
          # workflow delta and temporary-workflow cleanup are applied afterward
          # through the repository API.
          git restore --source=HEAD --staged --worktree .github/workflows

          git add -A
          git diff --cached --quiet && {
            echo 'ERROR: PR 719 finalizer produced no application source change.' >&2
            exit 1
          }
          git commit -m 'fix(modules): restore request visibility, owner truth, and fast directory hydration'
          git push origin HEAD:fix/module-directory-owner-001a-continuity-20260818
