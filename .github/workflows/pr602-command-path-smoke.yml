name: PR602 Command Path Smoke

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  smoke:
    if: github.event.issue.number == 602 && github.event.comment.body == '/ping-pr602-command-path'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: release/test-pr600-pr601-1d1afbdc-20260810
          fetch-depth: 0
          persist-credentials: true
      - shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github/pr602-command-smoke
          printf '%s\n' "$GITHUB_RUN_ID" > .github/pr602-command-smoke/run-id.txt
          git add .github/pr602-command-smoke/run-id.txt
          git config user.name 'Pulse Test Release Automation'
          git config user.email 'pulse-test-release-automation@users.noreply.github.com'
          git commit -m 'ci: prove PR602 comment command execution'
          git push origin HEAD:release/test-pr600-pr601-1d1afbdc-20260810
