name: ProjectPulse Deploy UAT SSO, Group 3, and Pulse AI Repair Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified UAT repair source release
        required: true
        default: b402f99130341995d692bb9f85fe195255c8ffb5
        type: string
      confirmation:
        description: Enter DEPLOY-UAT-SSO-GROUP3-PULSEAI-REPAIR-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-uat-sso-group3-label-repair-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded UAT repair API and web test deployment
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_RELEASE_COMMIT: b402f99130341995d692bb9f85fe195255c8ffb5
      SOURCE_BASELINE_COMMIT: 34f63946e80bd17ce9fa33c72ae2674f62081bae

    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v7
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact verified source release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 0

      - name: Guard workflow source and validate exact release
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$WORKFLOW_SOURCE_REF" == 'refs/heads/main' ]]
          [[ "$DISPATCH_CONFIRMATION" == 'DEPLOY-UAT-SSO-GROUP3-PULSEAI-REPAIR-TO-TEST' ]]
          [[ "$DISPATCH_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == "$WORKFLOW_SOURCE_SHA" ]]
          [[ "$TARGET_COMMIT" == "$DISPATCH_RELEASE_COMMIT" ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]]
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD

          CHANGED="$(git -C release diff --name-only "$SOURCE_BASELINE_COMMIT...$TARGET_COMMIT")"
          if grep -E '^database/(migrations|rollback)/' <<<"$CHANGED"; then
            echo 'This repair release is API/web only and must not carry a database migration.' >&2
            exit 1
          fi

          RECOVERY='release/src/backend/ProjectTime.Api/Modules/MicrosoftSsoStateOriginRecovery.cs'
          MIDDLEWARE='release/src/backend/ProjectTime.Api/Modules/GlobalMailConfigurationModule.cs'
          PROGRAM='release/src/backend/ProjectTime.Api/Program.cs'
          WORKSPACE='release/src/frontend/project-time-web/src/UnifiedProjectFinancialWorkspace.jsx'
          CSS='release/src/frontend/project-time-web/src/unified-project-financial-workspace.css'
          APP='release/src/frontend/project-time-web/src/App.jsx'
          HELP='release/src/frontend/project-time-web/src/HelpAssistant.jsx'
          RUNNER='control/scripts/run-uat-sso-group3-pulse-ai-repair-test-deployment.sh'

          for file in "$RECOVERY" "$MIDDLEWARE" "$PROGRAM" "$WORKSPACE" "$CSS" "$APP" "$HELP" "$RUNNER"; do
            test -f "$file"
          done

          for marker in \
            'FROM auth_sso_state' \
            'consumed_at IS NULL' \
            'expires_at > NOW()' \
            'stored_redirect_uri_internal_host_rejected' \
            'stored_redirect_uri_environment_mismatch'; do
            grep -Fq "$marker" "$RECOVERY"
          done
          grep -Fq 'MicrosoftSsoStateOriginRecovery.TryRecoverAsync' "$MIDDLEWARE"
          grep -Fq 'RETURNING nonce_token, requested_email, redirect_uri' "$PROGRAM"
          grep -Fq 'Project portfolio command center' "$WORKSPACE"
          grep -Fq 'Engineering assignments and project evidence' "$WORKSPACE"
          grep -Fq 'Customer, SELL, and delivery readiness' "$WORKSPACE"
          grep -Fq 'Projects, customers, SELL, and governed rates' "$WORKSPACE"
          grep -Fq '.group3-hero' "$CSS"
          grep -Fq 'Pulse AI' "$APP"
          grep -Fq 'Pulse AI' "$HELP"

          (cd release && dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release)
          (cd release/src/frontend/project-time-web && npm ci --no-audit --no-fund && npm run build)

          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'UAT_SSO_GROUP3_PULSE_AI_REPAIR_SOURCE_VALIDATION=PASS'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build, deploy, validate, and preserve rollback evidence
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: >-
          bash control/scripts/run-uat-sso-group3-pulse-ai-repair-test-deployment.sh
          control
          release
          '${{ steps.release.outputs.target_commit }}'

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-sso-group3-pulse-ai-repair-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            control/evidence/
            ${{ runner.temp }}/uat-sso-group3-pulse-ai-repair-probes/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload immutable deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uat-sso-group3-pulse-ai-repair-test-${{ github.run_id }}
          path: control/evidence/uat-sso-group3-pulse-ai-repair-test-deployment.json
          retention-days: 30
