name: Verify content-free UAT failure diagnostics
on:
  pull_request:
    paths:
      - 'scripts/security/publish-safe-uat-evidence.py'
      - 'scripts/security/safe_uat_diagnostics.py'
      - 'tests/uat-safe-diagnostics/**'
      - '.github/workflows/uat-safe-diagnostics-ci.yml'
permissions:
  contents: read
concurrency:
  group: uat-safe-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Verify diagnostic privacy, bounds and parity with unchanged acceptance
        run: python3 tests/uat-safe-diagnostics/test_diagnostics.py
      - name: Retain original evidence and deployment-boundary regressions
        run: python3 tests/security-deployment-boundaries.test.py
      - name: Verify repository posture and unchanged source after tests
        run: |
          python3 scripts/security/validate-repository-security-posture.py
          git diff --exit-code
