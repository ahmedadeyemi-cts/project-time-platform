name: Supervise PR 737 Migration 096 v2 release

on:
  push:
    branches:
      - ops/pr737-protected-uat-observer-20260823
    paths:
      - .github/workflows/supervise-pr737-migration096-v2-release.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: supervise-pr737-migration096-v2-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate, deploy, verify, and merge corrected PR 737
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_HEAD: d8441ae42f5acfa5efc89996e49e2cf041246820
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      OBSERVER_BRANCH: ops/pr737-protected-uat-observer-20260823
      EVIDENCE_DIR: /tmp/pr737-migration096-v2-release

    steps:
      - name: Wait for permanent Migration 096 repair candidate
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          install -d -m 0700 "$EVIDENCE_DIR"

          candidate=''
          for _ in $(seq 1 360); do
            pr="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/pulls/737")"
            state="$(jq -r '.state' <<<"$pr")"
            merged="$(jq -r '.merged' <<<"$pr")"
            branch="$(jq -r '.head.ref' <<<"$pr")"
            candidate="$(jq -r '.head.sha' <<<"$pr")"
            [[ "$state" == open && "$merged" == false && "$branch" == "$TARGET_BRANCH" ]] \
              || fail 'PR #737 is no longer the expected open candidate.'
            if [[ "$candidate" =~ ^[0-9a-f]{40}$ && "$candidate" != "$ORIGINAL_HEAD" ]]; then
              break
            fi

            repair_runs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/actions/workflows/repair-pr737-migration096-v2.yml/runs?branch=$OBSERVER_BRANCH&event=push&per_page=10")"
            repair_state="$(jq -r '[.workflow_runs[]] | sort_by(.created_at) | last | if . == null then "missing:" else "\(.status):\(.conclusion // ""):\(.id)" end' <<<"$repair_runs")"
            IFS=':' read -r repair_status repair_conclusion repair_id <<<"$repair_state"
            if [[ "$repair_status" == completed && "$repair_conclusion" != success ]]; then
              printf '%s\n' "$repair_runs" > "$EVIDENCE_DIR/repair-runs.json"
              fail "Migration 096 v2 repair failed in run $repair_id."
            fi
            sleep 10
          done
          [[ "$candidate" =~ ^[0-9a-f]{40}$ && "$candidate" != "$ORIGINAL_HEAD" ]] \
            || fail 'No permanent corrected PR candidate was published.'
          printf '%s\n' "$pr" > "$EVIDENCE_DIR/pr-candidate.json"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "MIGRATION_096_CORRECTED_CANDIDATE=$candidate"
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Wait for all exact-SHA release checks
        id: checks
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          required=(
            'ProjectPulse Repository Security Posture'
            'Validate Governed Protected-Test Release Controller'
            'ProjectPulse CI'
            'Validate UAT Functional Completion'
            'FlowHive Detailed Planner CI'
            'Validate Shared FlowHive and Project Forge Document Planning'
            'Validate Module 033 Project Forge'
            'Validate Module 030 Analytics Center'
            'Validate Module 030 Analytics Enterprise Experience'
            'Validate Celar AI Enterprise Platform Interface'
            'Validate Pulse AI Private Document Pipeline'
            'Validate Project Planning Collaboration Access'
            'System-wide Enterprise Reliability CI'
          )
          all_green=0
          for _ in $(seq 1 540); do
            runs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/actions/runs?head_sha=$CANDIDATE_SHA&event=pull_request&per_page=100")"
            all_green=1
            pending=()
            for name in "${required[@]}"; do
              value="$(jq -r --arg name "$name" '
                [.workflow_runs[] | select(.name == $name)] | sort_by(.created_at) | last
                | if . == null then "missing:" else "\(.status):\(.conclusion // ""):\(.id)" end
              ' <<<"$runs")"
              IFS=':' read -r status conclusion id <<<"$value"
              case "$status:$conclusion" in
                completed:success) ;;
                completed:*)
                  printf '%s\n' "$runs" > "$EVIDENCE_DIR/exact-sha-runs.json"
                  fail "Required exact-SHA check failed: $name ($value)"
                  ;;
                *) all_green=0; pending+=("$name=$value") ;;
              esac
            done
            (( all_green )) && break
            printf 'Exact-SHA checks pending: %s\n' "${pending[*]}"
            sleep 10
          done
          (( all_green )) || fail 'Exact-SHA release checks did not all reach success.'
          printf '%s\n' "$runs" > "$EVIDENCE_DIR/exact-sha-runs.json"
          echo 'PR_737_EXACT_SHA_CHECKS=GREEN'

      - name: Locate or dispatch exact Protected Test deployment
        id: deploy
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          deployment_id=''
          deployments="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/runs?event=workflow_dispatch&per_page=60")"
          deployment_id="$(jq -r --arg sha "$CANDIDATE_SHA" --arg branch "$TARGET_BRANCH" '
            [.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch)]
            | sort_by(.created_at) | last | .id // empty
          ' <<<"$deployments")"

          if [[ -z "$deployment_id" ]]; then
            payload="$(jq -nc --arg branch "$TARGET_BRANCH" --arg sha "$CANDIDATE_SHA" '{ref:$branch,inputs:{release_sha:$sha,release_branch:$branch}}')"
            status="$(curl --silent --show-error \
              --output "$EVIDENCE_DIR/dispatch-response.json" --write-out '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/dispatches")"
            [[ "$status" == 204 ]] || fail "Protected Test dispatch returned HTTP $status."
            for _ in $(seq 1 90); do
              deployments="$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/runs?event=workflow_dispatch&per_page=60")"
              deployment_id="$(jq -r --arg sha "$CANDIDATE_SHA" --arg branch "$TARGET_BRANCH" '
                [.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch)]
                | sort_by(.created_at) | last | .id // empty
              ' <<<"$deployments")"
              [[ -n "$deployment_id" ]] && break
              sleep 5
            done
          fi
          [[ "$deployment_id" =~ ^[0-9]+$ ]] || fail 'The corrected deployment run could not be located.'
          echo "run_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "PROTECTED_UAT_DEPLOYMENT_RUN=$deployment_id"

      - name: Wait for Protected Test deployment and authenticated UAT
        id: result
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          conclusion=''
          for _ in $(seq 1 1440); do
            run="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/actions/runs/$DEPLOYMENT_ID")"
            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
            [[ "$status" == completed ]] && break
            sleep 10
          done
          printf '%s\n' "$run" > "$EVIDENCE_DIR/deployment-run.json"
          jobs="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/actions/runs/$DEPLOYMENT_ID/jobs?per_page=100")"
          printf '%s\n' "$jobs" > "$EVIDENCE_DIR/deployment-jobs.json"
          [[ "$conclusion" == success ]] || fail "Protected Test deployment $DEPLOYMENT_ID failed with conclusion $conclusion."

          artifacts="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/actions/runs/$DEPLOYMENT_ID/artifacts")"
          artifact_url="$(jq -r '[.artifacts[] | select(.name | startswith("systemwide-enterprise-reliability-test-evidence-"))] | sort_by(.created_at) | last | .archive_download_url // empty' <<<"$artifacts")"
          [[ "$artifact_url" == https://api.github.com/* ]] || fail 'Protected Test evidence artifact is missing.'
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$artifact_url" --output "$EVIDENCE_DIR/deployment-evidence.zip"
          unzip -q "$EVIDENCE_DIR/deployment-evidence.zip" -d "$EVIDENCE_DIR/deployment-evidence"
          uat="$(find "$EVIDENCE_DIR/deployment-evidence" -type f -name uat-summary.json -print -quit)"
          migrations="$(find "$EVIDENCE_DIR/deployment-evidence" -type f -name migrations.json -print -quit)"
          [[ -s "$uat" && -s "$migrations" ]] || fail 'Required migration/UAT evidence is missing.'
          jq -e --arg sha "$CANDIDATE_SHA" '
            .status == "passed" and .sourceCommit == $sha and
            .migration086 == "applied_and_verified" and
            .migration088 == "applied_and_verified" and
            .migration093 == "applied_and_verified" and
            .migration094 == "applied_and_verified" and
            .migration095 == "applied_and_verified" and
            .migration096 == "applied_and_verified" and
            .flowHiveAiPlanner == true and
            .projectForgeAiPlanner == true and
            .flowHiveWorkingCopyOnly == true and
            .projectForgeReviewOnly == true and
            .planDesignImplementValidateRelease == true and
            .estimatesCompressed == false and
            .productionMutation == false
          ' "$uat" >/dev/null || fail 'Authenticated FlowHive/Forge UAT did not satisfy the release contract.'
          jq -e '.status == "applied_and_verified" and (.migrations | index("096_project_planning_document_authority") != null) and .productionMutation == false' "$migrations" >/dev/null \
            || fail 'Migration 096 was not verified in Protected Test.'
          echo 'PROTECTED_UAT_AUTHENTICATED_UAT=PASSED'
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Merge PR 737 after exact Protected UAT success
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          pr="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/pulls/737")"
          jq -e --arg sha "$CANDIDATE_SHA" '.state == "open" and .head.sha == $sha and .mergeable != false' <<<"$pr" >/dev/null \
            || fail 'PR #737 moved or is no longer mergeable.'
          payload="$(jq -nc --arg sha "$CANDIDATE_SHA" '{sha:$sha,merge_method:"merge",commit_title:"FlowHive V2 document-grounded planning (#737)"}')"
          code="$(curl --silent --show-error \
            --output "$EVIDENCE_DIR/merge.json" --write-out '%{http_code}' \
            --request PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$payload" "$API_ROOT/pulls/737/merge")"
          [[ "$code" == 200 ]] || { cat "$EVIDENCE_DIR/merge.json" >&2 || true; fail "PR merge returned HTTP $code."; }
          jq -e '.merged == true' "$EVIDENCE_DIR/merge.json" >/dev/null || fail 'GitHub did not confirm the merge.'
          comment="$(jq -nc --arg sha "$CANDIDATE_SHA" --arg run "$DEPLOYMENT_ID" '{body:("## FlowHive V2 passed Protected UAT and was merged\n\n- Exact candidate SHA: `"+$sha+"`\n- Protected Test deployment run: `"+$run+"`\n- Migrations 086, 088, 093, 094, 095, and 096: applied and verified\n- Authenticated FlowHive and Project Forge UAT: passed\n- Runtime/source SHA: verified\n- Production mutation: `NONE`")}')"
          curl --fail-with-body --silent --show-error --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$comment" "$API_ROOT/issues/737/comments" >/dev/null
          echo 'PR_737_MERGED=TRUE'
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr737-migration096-v2-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pr737-migration096-v2-release
          if-no-files-found: warn
          retention-days: 14
