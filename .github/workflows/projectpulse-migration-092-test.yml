name: Apply Module Loading and Assignment Migration 092 to Protected Test

on:
  pull_request:
    paths:
      - '.github/workflows/projectpulse-migration-092-test.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectpulse-migration-092-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate the one-time Migration 092 Test controller
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out pull-request merge context
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Validate exact source boundary and release contract
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          CONTROLLER='.github/workflows/projectpulse-migration-092-test.yml'
          EXPECTED_RELEASE='828994536b2df722b0cefb75b00a2a3c48305811'

          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          [[ "${#CHANGED[@]}" -eq 1 && "${CHANGED[0]}" == "$CONTROLLER" ]] || {
            printf 'Unexpected source outside the one-file Migration 092 controller boundary:\n%s\n' "${CHANGED[*]}" >&2
            exit 1
          }

          for required in \
            "$CONTROLLER" \
            database/migrations/086_module_066_flowhive_enterprise_pm.sql \
            database/migrations/088_systemwide_enterprise_reliability.sql \
            database/migrations/092_module_loading_assignment_visibility_repair.sql \
            scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh \
            src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs; do
            test -f "$required" || { echo "Missing required artifact: $required" >&2; exit 1; }
          done

          grep -Fq "APPLICATION_RELEASE_COMMIT: $EXPECTED_RELEASE" "$CONTROLLER"
          grep -Fq 'environment: test' "$CONTROLLER"
          grep -Fq 'group: projectpulse-deploy-test' "$CONTROLLER"
          grep -Fq 'database/migrations/092_module_loading_assignment_visibility_repair.sql' "$CONTROLLER"
          grep -Fq 'module-loading-assignment-092-test' "$CONTROLLER"
          grep -Fq 'PRODUCTION_MUTATION=NONE' "$CONTROLLER"
          grep -Fq "PUBLIC_URL is not the protected Test origin" "$CONTROLLER"

          bash -n scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          node src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          git diff --check "$BASE_SHA...$HEAD_SHA"
          echo 'MIGRATION_092_TEST_CONTROLLER=PASS'

  migrate:
    name: Build, apply, and verify Migration 092 in protected Test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: projectpulse-deploy-test
      cancel-in-progress: false
    env:
      APPLICATION_RELEASE_COMMIT: 828994536b2df722b0cefb75b00a2a3c48305811
      EVIDENCE_DIR: /tmp/module-loading-assignment-092-test-evidence
      MIGRATION_SCOPE: module-loading-assignment-092-test

    steps:
      - name: Check out the exact controller merge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Guard the one-time Test-only release boundary
        shell: bash
        working-directory: release
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          CONTROL_COMMIT="$(git rev-parse HEAD)"
          FIRST_PARENT="$(git rev-parse HEAD^1)"
          [[ "$GITHUB_REF" == refs/heads/main ]] || fail 'Only main may run the protected Test migration.'
          [[ "$CONTROL_COMMIT" == "$GITHUB_SHA" ]] || fail 'The controller checkout is not the exact merged commit.'
          [[ "$FIRST_PARENT" == "$APPLICATION_RELEASE_COMMIT" ]] || fail 'The controller was not merged directly after the approved application release.'
          git merge-base --is-ancestor "$APPLICATION_RELEASE_COMMIT" "$CONTROL_COMMIT" || fail 'The approved application release is not an ancestor of the controller.'

          for required in \
            database/migrations/086_module_066_flowhive_enterprise_pm.sql \
            database/migrations/088_systemwide_enterprise_reliability.sql \
            database/migrations/092_module_loading_assignment_visibility_repair.sql \
            scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh; do
            test -f "$required" || fail "Required release artifact is missing: $required"
          done

          bash -n scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          git diff --check
          install -d -m 0700 "$EVIDENCE_DIR"
          jq -n \
            --arg controllerCommit "$CONTROL_COMMIT" \
            --arg applicationRelease "$APPLICATION_RELEASE_COMMIT" \
            --arg migrationScope "$MIGRATION_SCOPE" \
            '{
              environment:"test",
              controllerCommit:$controllerCommit,
              applicationRelease:$applicationRelease,
              migrations:[
                "086_module_066_flowhive_enterprise_pm",
                "088_systemwide_enterprise_reliability",
                "092_module_loading_assignment_visibility_repair"
              ],
              migrationScope:$migrationScope,
              applicationImageMutation:false,
              productionMutation:false,
              privateRuntimeConfigurationMutation:false
            }' > "$EVIDENCE_DIR/release-boundary.json"
          echo 'ENVIRONMENT_SCOPE=PROTECTED_TEST_ONLY'
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Sign in to the protected Test subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the approved application release is active in Test
        id: contract
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          CURRENT_SUBSCRIPTION="$(az account show --query id -o tsv --only-show-errors)"
          [[ "${CURRENT_SUBSCRIPTION,,}" == "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]] || fail 'Azure login is outside the protected Test subscription.'

          API_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          [[ "$(jq -r '.tags.environment // empty' <<<"$API_JSON")" == test ]] || fail 'The API app is not tagged Test.'
          ACTIVE_SOURCE="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$API_JSON")"
          [[ "$ACTIVE_SOURCE" == "$APPLICATION_RELEASE_COMMIT" ]] || fail "Protected Test is not serving the approved application release: $ACTIVE_SOURCE"

          BASE='${{ vars.PUBLIC_URL }}'
          BASE="${BASE%/}"
          [[ "$BASE" == https://phd-west-test.onenecklab.com ]] || fail 'PUBLIC_URL is not the protected Test origin.'
          HEALTH_STATUS="$(curl -sS --max-time 60 -o "$EVIDENCE_DIR/pre-migration-health.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/health?migration092_preflight=$GITHUB_RUN_ID" || true)"
          [[ "$HEALTH_STATUS" == 200 ]] || fail "Protected Test health returned HTTP $HEALTH_STATUS before Migration 092."
          jq -e '.status == "healthy"' "$EVIDENCE_DIR/pre-migration-health.json" >/dev/null || fail 'Protected Test was not healthy before Migration 092.'

          jq -n \
            --arg base "$BASE" \
            --arg source "$ACTIVE_SOURCE" \
            --arg apiImage "$(jq -r '.properties.template.containers[0].image' <<<"$API_JSON")" \
            '{base:$base,sourceCommit:$source,apiImage:$apiImage,testTagValidated:true,preMigrationHealthValidated:true}' \
            > "$EVIDENCE_DIR/test-contract.json"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Build the immutable Migration 092 image
        id: build
        shell: bash
        working-directory: release
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          ACR='${{ vars.AZURE_ACR_NAME }}'
          [[ -n "$ACR" && "$ACR" =~ ^[A-Za-z0-9]+$ ]] || fail 'AZURE_ACR_NAME is missing or invalid.'

          SHORT_RELEASE="${APPLICATION_RELEASE_COMMIT:0:12}"
          UNIQUE_TAG="m092-${SHORT_RELEASE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE="project-health-dashboard-migration-092:${UNIQUE_TAG}"
          CONTEXT="$RUNNER_TEMP/module-loading-assignment-092-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/database/migrations"
          install -m 0644 database/migrations/086_module_066_flowhive_enterprise_pm.sql "$CONTEXT/database/migrations/086_module_066_flowhive_enterprise_pm.sql"
          install -m 0644 database/migrations/088_systemwide_enterprise_reliability.sql "$CONTEXT/database/migrations/088_systemwide_enterprise_reliability.sql"
          install -m 0644 database/migrations/092_module_loading_assignment_visibility_repair.sql "$CONTEXT/database/migrations/092_module_loading_assignment_visibility_repair.sql"
          printf '%s\n' "$APPLICATION_RELEASE_COMMIT" > "$CONTEXT/release-commit"

          cat > "$CONTEXT/entrypoint.sh" <<'ENTRYPOINT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOT=/opt/projectpulse/release
          EXPECTED="${MAIN_RELEASE_EXPECTED_RELEASE_COMMIT:-}"
          ACTUAL="$(cat "$ROOT/.projectpulse-release-commit")"
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ && "$ACTUAL" == "$EXPECTED" ]] || {
            echo 'ERROR: Migration image release identity mismatch.' >&2
            exit 1
          }

          for migration in \
            "$ROOT/database/migrations/086_module_066_flowhive_enterprise_pm.sql" \
            "$ROOT/database/migrations/088_systemwide_enterprise_reliability.sql" \
            "$ROOT/database/migrations/092_module_loading_assignment_visibility_repair.sql"; do
            [[ -f "$migration" ]] || { echo "ERROR: Missing migration $migration" >&2; exit 1; }
            psql -X -v ON_ERROR_STOP=1 --file "$migration"
          done

          verification="$(psql -X -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT
            EXISTS(SELECT 1 FROM schema_migrations WHERE migration_id='086_module_066_flowhive_enterprise_pm')::text || '|' ||
            EXISTS(SELECT 1 FROM schema_migrations WHERE migration_id='088_systemwide_enterprise_reliability')::text || '|' ||
            EXISTS(SELECT 1 FROM schema_migrations WHERE migration_id='092_module_loading_assignment_visibility_repair')::text || '|' ||
            (to_regprocedure('public.projectpulse092_sync_work_register_assignment()') IS NOT NULL)::text || '|' ||
            EXISTS(SELECT 1 FROM pg_trigger WHERE tgname='trg_projectpulse092_sync_work_register_assignment' AND NOT tgisinternal)::text || '|' ||
            EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='scoped_role_policy_modules' AND column_name='owner_user_id')::text || '|' ||
            EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='project_assignments' AND column_name='assignment_source')::text;
          SQL
          )"
          [[ "$verification" == 'true|true|true|true|true|true|true' ]] || {
            echo "ERROR: Migration 092 verification failed: $verification" >&2
            exit 1
          }
          echo 'MIGRATION_086=APPLIED_AND_VERIFIED'
          echo 'MIGRATION_088=APPLIED_AND_VERIFIED'
          echo 'MIGRATION_092=APPLIED_AND_VERIFIED'
          ENTRYPOINT
          chmod 0555 "$CONTEXT/entrypoint.sh"

          cat > "$CONTEXT/Dockerfile" <<'DOCKERFILE'
          FROM postgres:16-alpine
          RUN apk add --no-cache bash coreutils ca-certificates
          WORKDIR /opt/projectpulse/release
          COPY release-commit .projectpulse-release-commit
          COPY database/ database/
          COPY entrypoint.sh /usr/local/bin/projectpulse-migration-092
          RUN chmod 0555 /usr/local/bin/projectpulse-migration-092 \
              && chmod 0444 .projectpulse-release-commit database/migrations/*.sql
          ENTRYPOINT ["/usr/local/bin/projectpulse-migration-092"]
          DOCKERFILE

          DIGEST=''
          for attempt in 1 2; do
            if az acr build \
              --registry "$ACR" \
              --image "$IMAGE" \
              --file Dockerfile \
              --timeout 3600 \
              "$CONTEXT" --only-show-errors; then
              for resolve_attempt in $(seq 1 12); do
                DIGEST="$(az acr repository show --name "$ACR" --image "$IMAGE" --query digest -o tsv --only-show-errors 2>/dev/null || true)"
                [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] && break
                sleep 5
              done
              [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            fi
            (( attempt < 2 )) && sleep 20
          done
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail 'Migration 092 image did not publish an immutable digest.'

          MIGRATION_IMAGE="$ACR.azurecr.io/project-health-dashboard-migration-092@$DIGEST"
          echo "migration_image=$MIGRATION_IMAGE" >> "$GITHUB_OUTPUT"
          jq -n --arg image "$MIGRATION_IMAGE" --arg release "$APPLICATION_RELEASE_COMMIT" '{migrationImage:$image,applicationRelease:$release,immutableDigest:true}' > "$EVIDENCE_DIR/immutable-image.json"

      - name: Apply and verify Migrations 086, 088, and 092 inside the Test private network
        id: migration
        shell: bash
        working-directory: release
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          RELIABILITY_MIGRATION_IMAGE: ${{ steps.build.outputs.migration_image }}
          RELIABILITY_MIGRATION_JOB_NAME: m092-${{ github.run_id }}-${{ github.run_attempt }}
          AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID: ${{ vars.AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID }}
          AZURE_KEY_VAULT_URI: ${{ vars.AZURE_KEY_VAULT_URI }}
          PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME: ${{ vars.PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME }}
          PROJECTPULSE_TEST_DATABASE_HOST: ${{ vars.PROJECTPULSE_TEST_DATABASE_HOST }}
          PROJECTPULSE_TEST_DATABASE_PORT: ${{ vars.PROJECTPULSE_TEST_DATABASE_PORT }}
          PROJECTPULSE_TEST_DATABASE_NAME: ${{ vars.PROJECTPULSE_TEST_DATABASE_NAME }}
          PROJECTPULSE_TEST_DATABASE_USER: ${{ vars.PROJECTPULSE_TEST_DATABASE_USER }}
          RELIABILITY_CONTROL_SHA: ${{ github.sha }}
          RELIABILITY_RELEASE_COMMIT: 828994536b2df722b0cefb75b00a2a3c48305811
          RELIABILITY_MIGRATION_SCOPE: module-loading-assignment-092-test
        run: |
          set -Eeuo pipefail
          bash scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          jq -n \
            --arg image '${{ steps.build.outputs.migration_image }}' \
            --arg release "$APPLICATION_RELEASE_COMMIT" \
            '{
              status:"applied_and_verified",
              migrations:[
                "086_module_066_flowhive_enterprise_pm",
                "088_systemwide_enterprise_reliability",
                "092_module_loading_assignment_visibility_repair"
              ],
              image:$image,
              applicationRelease:$release,
              applicationImageMutation:false,
              productionMutation:false
            }' > "$EVIDENCE_DIR/migration-result.json"
          echo 'applied_and_verified=true' >> "$GITHUB_OUTPUT"

      - name: Verify protected Test remained healthy and pinned to the application release
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          BASE='${{ steps.contract.outputs.base }}'

          API_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          ACTIVE_SOURCE="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$API_JSON")"
          [[ "$ACTIVE_SOURCE" == "$APPLICATION_RELEASE_COMMIT" ]] || fail 'Migration 092 changed or lost the active application source marker.'

          HEALTH_STATUS="$(curl -sS --max-time 60 -o "$EVIDENCE_DIR/post-migration-health.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/health?migration092_verify=$GITHUB_RUN_ID" || true)"
          [[ "$HEALTH_STATUS" == 200 ]] || fail "Protected Test health returned HTTP $HEALTH_STATUS after Migration 092."
          jq -e '.status == "healthy"' "$EVIDENCE_DIR/post-migration-health.json" >/dev/null || fail 'Protected Test was not healthy after Migration 092.'

          jq -n \
            --arg source "$ACTIVE_SOURCE" \
            --arg apiImage "$(jq -r '.properties.template.containers[0].image' <<<"$API_JSON")" \
            '{status:"passed",sourceCommit:$source,apiImage:$apiImage,migration092:"applied_and_verified",applicationImageMutation:false,productionMutation:false}' \
            > "$EVIDENCE_DIR/final-verification.json"
          echo 'PROTECTED_TEST_MIGRATION_092=APPLIED_AND_VERIFIED'
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Upload Migration 092 protected-Test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: module-loading-assignment-092-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/module-loading-assignment-092-test-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Migration 092 protected-Test summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Module Loading and Assignment Migration 092 — Protected Test'
            echo
            echo "- Application release: \`$APPLICATION_RELEASE_COMMIT\`"
            echo "- Controller commit: \`$GITHUB_SHA\`"
            echo '- Environment: protected Test only'
            echo '- Target: https://phd-west-test.onenecklab.com'
            [[ -f "$EVIDENCE_DIR/migration-result.json" ]] && echo '- Migration 092: applied and verified' || echo '- Migration 092: not completed'
            [[ -f "$EVIDENCE_DIR/final-verification.json" ]] && echo '- Post-migration health and release pin: passed' || echo '- Post-migration health and release pin: not completed'
            echo '- Application image mutation: none'
            echo '- Production mutation: none'
            echo '- Oracle/private AI runtime mutation: none'
          } >> "$GITHUB_STEP_SUMMARY"
