name: Trigger UAT follow-up finalizer

on:
  push:
    branches:
      - fix/uat-followup-modules-005-006-039-055c-065-20260804
    paths:
      - '.github/workflows/uat-followup-trigger.yml'

permissions:
  contents: write

concurrency:
  group: uat-followup-trigger
  cancel-in-progress: false

jobs:
  trigger:
    if: github.event.head_commit.message == 'Trigger UAT follow-up source finalizer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Trigger the existing source finalizer
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '\n# Triggered from %s\n' "$GITHUB_SHA" >> .github/workflows/uat-followup-source-finalizer.yml
          rm .github/workflows/uat-followup-trigger.yml
          git config user.name 'Project Health Dashboard UAT Repair'
          git config user.email 'project-health-dashboard-uat@users.noreply.github.com'
          git add .github/workflows/uat-followup-source-finalizer.yml .github/workflows/uat-followup-trigger.yml
          git commit -m 'Install UAT follow-up source finalizer'
          git push origin HEAD:fix/uat-followup-modules-005-006-039-055c-065-20260804
