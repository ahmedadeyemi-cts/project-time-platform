name: Observe Enterprise Governance v2 Test Release

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/observe-enterprise-governance-v2.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: observe-enterprise-governance-v2-test-release
  cancel-in-progress: false

jobs:
  observe:
    name: Verify protected Test promotion and Oracle activation
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/observe-enterprise-governance-v2-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PROMOTION_WORKFLOW_PATH: .github/workflows/projectpulse-promote-enterprise-governance-test-v2.yml
      ORACLE_WORKFLOW_PATH: .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
      PROMOTION_ARTIFACT_PREFIX: enterprise-governance-promotion-v2-
      ORACLE_ARTIFACT_PREFIX: celar-ai-oracle-test-runtime-
      STATUS_PATH: docs/diagnostics/enterprise-governance-v2-test-verification.json

    steps:
      - name: Check out observer branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Locate, monitor, and retry the protected Test promotion once
        id: promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          locate_latest_run() {
            local event="$1" path="$2" runs id
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&event=$event&per_page=100")"
            id="$(jq -r --arg path "$path" --arg event "$event" '
              [.workflow_runs[]
                | select(.event == $event and ((.path | split("@")[0]) == $path))]
              | sort_by(.created_at) | reverse | .[0].id // empty
            ' <<<"$runs")"
            printf '%s\n' "$id"
          }

          wait_for_run() {
            local run_id="$1" label="$2" poll run status conclusion
            for poll in $(seq 1 600); do
              run="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
              status="$(jq -r '.status' <<<"$run")"
              echo "$label poll=$poll status=$status attempt=$(jq -r '.run_attempt' <<<"$run")"
              if [[ "$status" == completed ]]; then
                conclusion="$(jq -r '.conclusion // "unknown"' <<<"$run")"
                printf '%s\n' "$conclusion"
                return 0
              fi
              sleep 15
            done
            printf '%s\n' timed_out
          }

          RUN_ID=''
          for poll in $(seq 1 180); do
            RUN_ID="$(locate_latest_run push "$PROMOTION_WORKFLOW_PATH")"
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] && break
            echo "promotion lookup poll=$poll"
            sleep 10
          done
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'ERROR: protected Test promotion run was not found.' >&2; exit 1; }

          CONCLUSION="$(wait_for_run "$RUN_ID" promotion)"
          if [[ "$CONCLUSION" != success ]]; then
            echo "Promotion concluded $CONCLUSION; rerunning failed jobs once."
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"
            sleep 10
            CONCLUSION="$(wait_for_run "$RUN_ID" promotion-rerun)"
          fi

          RUN="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          JOBS="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100")"
          ARTIFACTS="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"
          ARTIFACT_NAME="$(jq -r --arg prefix "$PROMOTION_ARTIFACT_PREFIX" '[.artifacts[] | select(.expired == false and (.name | startswith($prefix)))] | sort_by(.created_at) | reverse | .[0].name // empty' <<<"$ARTIFACTS")"
          ARTIFACT_DIGEST="$(jq -r --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name)] | .[0].digest // empty' <<<"$ARTIFACTS")"

          jq -r '.jobs[] | [.name,.status,(.conclusion // "none")] | @tsv' <<<"$JOBS" | sed 's/^/PROMOTION_JOB=/'
          jq -r '.jobs[] | .steps[]? | [.number,.name,.status,(.conclusion // "none")] | @tsv' <<<"$JOBS" | sed 's/^/PROMOTION_STEP=/'
          echo "PROMOTION_RUN_URL=$(jq -r '.html_url' <<<"$RUN")"
          echo "PROMOTION_CONCLUSION=$CONCLUSION"
          echo "PROMOTION_ARTIFACT_NAME=${ARTIFACT_NAME:-none}"
          echo "PROMOTION_ARTIFACT_DIGEST=${ARTIFACT_DIGEST:-none}"

          [[ "$CONCLUSION" == success ]]
          [[ -n "$ARTIFACT_NAME" ]]
          [[ "$ARTIFACT_DIGEST" == sha256:* ]]

          {
            echo "run_id=$RUN_ID"
            echo "run_url=$(jq -r '.html_url' <<<"$RUN")"
            echo "run_attempt=$(jq -r '.run_attempt' <<<"$RUN")"
            echo "head_sha=$(jq -r '.head_sha' <<<"$RUN")"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "artifact_digest=$ARTIFACT_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Locate, monitor, and retry the Oracle Celar AI Test activation once
        id: oracle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          locate_latest_run() {
            local runs
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&event=workflow_dispatch&per_page=100")"
            jq -r --arg path "$ORACLE_WORKFLOW_PATH" '
              [.workflow_runs[] | select(.event == "workflow_dispatch" and ((.path | split("@")[0]) == $path))]
              | sort_by(.created_at) | reverse | .[0].id // empty
            ' <<<"$runs"
          }

          wait_for_run() {
            local run_id="$1" label="$2" poll run status conclusion
            for poll in $(seq 1 480); do
              run="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
              status="$(jq -r '.status' <<<"$run")"
              echo "$label poll=$poll status=$status attempt=$(jq -r '.run_attempt' <<<"$run")"
              if [[ "$status" == completed ]]; then
                conclusion="$(jq -r '.conclusion // "unknown"' <<<"$run")"
                printf '%s\n' "$conclusion"
                return 0
              fi
              sleep 15
            done
            printf '%s\n' timed_out
          }

          RUN_ID=''
          for poll in $(seq 1 180); do
            RUN_ID="$(locate_latest_run)"
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] && break
            echo "oracle lookup poll=$poll"
            sleep 10
          done
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'ERROR: Oracle Celar AI Test activation run was not found.' >&2; exit 1; }

          CONCLUSION="$(wait_for_run "$RUN_ID" oracle)"
          if [[ "$CONCLUSION" != success ]]; then
            echo "Oracle activation concluded $CONCLUSION; rerunning failed jobs once."
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"
            sleep 10
            CONCLUSION="$(wait_for_run "$RUN_ID" oracle-rerun)"
          fi

          RUN="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          JOBS="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100")"
          ARTIFACTS="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"
          ARTIFACT_NAME="$(jq -r --arg prefix "$ORACLE_ARTIFACT_PREFIX" '[.artifacts[] | select(.expired == false and (.name | startswith($prefix)))] | sort_by(.created_at) | reverse | .[0].name // empty' <<<"$ARTIFACTS")"
          ARTIFACT_DIGEST="$(jq -r --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name)] | .[0].digest // empty' <<<"$ARTIFACTS")"

          jq -r '.jobs[] | [.name,.status,(.conclusion // "none")] | @tsv' <<<"$JOBS" | sed 's/^/ORACLE_JOB=/'
          jq -r '.jobs[] | .steps[]? | [.number,.name,.status,(.conclusion // "none")] | @tsv' <<<"$JOBS" | sed 's/^/ORACLE_STEP=/'
          echo "ORACLE_RUN_URL=$(jq -r '.html_url' <<<"$RUN")"
          echo "ORACLE_CONCLUSION=$CONCLUSION"
          echo "ORACLE_ARTIFACT_NAME=${ARTIFACT_NAME:-none}"
          echo "ORACLE_ARTIFACT_DIGEST=${ARTIFACT_DIGEST:-none}"

          [[ "$CONCLUSION" == success ]]
          [[ -n "$ARTIFACT_NAME" ]]
          [[ "$ARTIFACT_DIGEST" == sha256:* ]]

          {
            echo "run_id=$RUN_ID"
            echo "run_url=$(jq -r '.html_url' <<<"$RUN")"
            echo "run_attempt=$(jq -r '.run_attempt' <<<"$RUN")"
            echo "head_sha=$(jq -r '.head_sha' <<<"$RUN")"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "artifact_digest=$ARTIFACT_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Record immutable observer evidence on the diagnostic branch
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d "$(dirname "$STATUS_PATH")"
          jq -n \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg promotionRunId '${{ steps.promotion.outputs.run_id }}' \
            --arg promotionRunUrl '${{ steps.promotion.outputs.run_url }}' \
            --arg promotionAttempt '${{ steps.promotion.outputs.run_attempt }}' \
            --arg promotionHeadSha '${{ steps.promotion.outputs.head_sha }}' \
            --arg promotionArtifact '${{ steps.promotion.outputs.artifact_name }}' \
            --arg promotionDigest '${{ steps.promotion.outputs.artifact_digest }}' \
            --arg oracleRunId '${{ steps.oracle.outputs.run_id }}' \
            --arg oracleRunUrl '${{ steps.oracle.outputs.run_url }}' \
            --arg oracleAttempt '${{ steps.oracle.outputs.run_attempt }}' \
            --arg oracleHeadSha '${{ steps.oracle.outputs.head_sha }}' \
            --arg oracleArtifact '${{ steps.oracle.outputs.artifact_name }}' \
            --arg oracleDigest '${{ steps.oracle.outputs.artifact_digest }}' \
            '{
              status:"passed",
              environment:"test",
              verifiedAt:$verifiedAt,
              promotion:{runId:$promotionRunId,runUrl:$promotionRunUrl,attempt:$promotionAttempt,headSha:$promotionHeadSha,artifact:$promotionArtifact,artifactDigest:$promotionDigest},
              oracleActivation:{runId:$oracleRunId,runUrl:$oracleRunUrl,attempt:$oracleAttempt,headSha:$oracleHeadSha,artifact:$oracleArtifact,artifactDigest:$oracleDigest},
              migrationsApplied:[],
              databaseMutation:false,
              productionMutation:false,
              infrastructureMutation:false,
              secretsChanged:false
            }' > "$STATUS_PATH"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STATUS_PATH"
          if git diff --cached --quiet; then
            echo 'Observer evidence already current.'
          else
            git commit -m 'docs: record protected Test enterprise governance verification'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Publish observer result
        shell: bash
        run: |
          echo 'ENTERPRISE_GOVERNANCE_TEST_PROMOTION=PASSED'
          echo 'ORACLE_CELAR_AI_TEST_ACTIVATION=PASSED'
          echo 'TEST_WEBSITE_READY_FOR_UAT=TRUE'
