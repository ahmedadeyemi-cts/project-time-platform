name: Patch PR 644 Module 011 Validation Contract

on:
  pull_request:
    paths:
      - '.github/workflows/patch-pr644-module011-validator.yml'

permissions:
  contents: write

concurrency:
  group: patch-pr644-module011-validator
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'fix/ask-celar-ai-public-questions-resilience-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/ask-celar-ai-public-questions-resilience-20260811
          fetch-depth: 0
          persist-credentials: true

      - name: Align Module 011 validation with the governed public-question contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs')
          text = path.read_text(encoding='utf-8')
          old = "    'PublicGeneralQuestion: plan.IntentCode == \"general_knowledge\"',\n"
          new = (
              "    'PublicGeneralQuestion: publicGeneralQuestion',\n"
              "    'PublicQuestion: publicGeneralQuestion ? question : null',\n"
              "    'PublicGeneralKnowledgeSystemInstruction',\n"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one legacy public-question marker, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('MODULE011_PUBLIC_QUESTION_VALIDATOR=UPDATED')
          PY

          node --check src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs
          node src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs
          git diff --check

      - name: Commit the permanent validator correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Pulse Celar AI Repair Automation'
          git config user.email 'pulse-celar-ai-repair@users.noreply.github.com'
          git add src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs
          git diff --cached --check
          git commit -m 'Align Module 011 validation with public-question routing'
          git push origin HEAD:fix/ask-celar-ai-public-questions-resilience-20260811
