name: Prepare Migration 093 Protected-Test Controller

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-protected-test-controller-source.yml'

permissions:
  contents: write

concurrency:
  group: prepare-migration-093-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/migration-093-protected-test-20260817'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact release branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: release/migration-093-protected-test-20260817
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and validate exact governed controller update
        shell: bash
        env:
          PATCH_GZIP_BASE64: 
        run: |
          set -Eeuo pipefail
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode | gzip --decompress > "$RUNNER_TEMP/prepare-migration093-controller.py"
          python3 "$RUNNER_TEMP/prepare-migration093-controller.py"
          rm -f .github/workflows/export-protected-test-controller-source.yml

          bash -n scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          node --check tests/validate-systemwide-enterprise-reliability.mjs
          node --check tests/validate-systemwide-image-build-controller.mjs
          node tests/validate-systemwide-image-build-controller.mjs
          node tests/validate-systemwide-enterprise-reliability.mjs
          node scripts/validate-deployment-concurrency-governance.mjs --repo-root "$GITHUB_WORKSPACE" --verify-repository
          python3 scripts/security/validate-repository-security-posture.py
          git diff --check

          git diff --name-only | LC_ALL=C sort -u > "$RUNNER_TEMP/changed-files"
          cat > "$RUNNER_TEMP/expected-files" <<'FILES'
          .github/workflows/export-protected-test-controller-source.yml
          .github/workflows/projectpulse-deploy-test.yml
          .github/workflows/projectpulse-release-test-control-ci.yml
          scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          tests/validate-systemwide-enterprise-reliability.mjs
          tests/validate-systemwide-image-build-controller.mjs
          FILES
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/expected-files"
          LC_ALL=C sort -u "$RUNNER_TEMP/expected-files" -o "$RUNNER_TEMP/expected-files"
          cmp "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"

      - name: Commit exact release-control changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'release(test): apply Migration 093 with PR #710'
          git push origin HEAD:release/migration-093-protected-test-20260817
