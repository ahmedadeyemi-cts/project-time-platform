name: Export Post-PR465 Live UAT Source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-post-pr465-live-uat-source.yml

permissions:
  contents: read

# Temporary read-only diagnostic. Close without merge after artifact capture.
jobs:
  pr470-diagnostics:
    if: github.event.pull_request.head.ref == 'diagnose/post-pr465-live-uat-source-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PR470_HEAD: e366b3abe9cccb7d783972fce20fa42ee0f3dc09
    steps:
      - name: Check out exact PR470 source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.PR470_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Capture complete API build output
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/pr470-diagnostics
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --verbosity diagnostic \
            > /tmp/pr470-diagnostics/api-build.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/pr470-diagnostics/api-build-exit-code.txt
          grep -E '(^|[ :])(error|warning) (CS|MSB|NETSDK)[0-9]+' /tmp/pr470-diagnostics/api-build.log \
            > /tmp/pr470-diagnostics/api-build-errors.txt || true
          tail -n 500 /tmp/pr470-diagnostics/api-build.log
          exit 0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Capture complete frontend and focused validator output
        shell: bash
        run: |
          set +e
          cd src/frontend/project-time-web
          npm ci --no-audit --no-fund > /tmp/pr470-diagnostics/npm-ci.log 2>&1
          npm_status=$?
          if [[ "$npm_status" -eq 0 ]]; then
            npm run build > /tmp/pr470-diagnostics/frontend-build.log 2>&1
            build_status=$?
          else
            build_status=99
          fi
          node ./scripts/validate-module-011-system-intelligence-package.mjs \
            > /tmp/pr470-diagnostics/system-intelligence-validator.log 2>&1
          validator_status=$?
          cd ../../..
          git status --short > /tmp/pr470-diagnostics/git-status.txt
          git diff --name-status > /tmp/pr470-diagnostics/git-diff-name-status.txt
          printf 'npm=%s\nfrontend_build=%s\nsystem_validator=%s\n' \
            "$npm_status" "$build_status" "$validator_status" \
            > /tmp/pr470-diagnostics/frontend-exit-codes.txt
          cat /tmp/pr470-diagnostics/frontend-build.log || true
          cat /tmp/pr470-diagnostics/system-intelligence-validator.log || true
          exit 0

      - name: Upload complete PR470 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr470-exact-failure-diagnostics-${{ github.run_id }}
          path: /tmp/pr470-diagnostics
          retention-days: 3
