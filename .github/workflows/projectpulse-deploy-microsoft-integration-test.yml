name: ProjectPulse Deploy Microsoft Integration 010 065 Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified Microsoft Integration source release
        required: true
        default: 13a7b2bddd76026421f833841daf79340c973e18
        type: string
      confirmation:
        description: Enter DEPLOY-MICROSOFT-INTEGRATION-010-065-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-microsoft-integration-010-065-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded Microsoft Integration 010 065 test deployment
    environment: test
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_COMMIT: 13a7b2bddd76026421f833841daf79340c973e18
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact verified release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and Microsoft Integration release
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$WORKFLOW_SOURCE_REF" == 'refs/heads/main' ]] || { echo 'Dispatch this workflow from main.' >&2; exit 1; }
          [[ "$DISPATCH_CONFIRMATION" == 'DEPLOY-MICROSOFT-INTEGRATION-010-065-TO-TEST' ]] || { echo 'Confirmation text does not match.' >&2; exit 1; }
          [[ "$DISPATCH_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_commit must be a complete SHA.' >&2; exit 1; }

          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == "$WORKFLOW_SOURCE_SHA" ]]
          [[ "$TARGET_COMMIT" == "$DISPATCH_RELEASE_COMMIT" ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || { echo 'Only the verified Microsoft Integration release may deploy.' >&2; exit 1; }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || { echo 'The source release is not an ancestor of the deployment controls.' >&2; exit 1; }

          test -f release/database/migrations/045_microsoft_integration_consolidation.sql
          test -f release/database/rollback/045_microsoft_integration_consolidation_rollback.sql
          test -f release/src/backend/ProjectTime.Api/Modules/AzureDirectoryImportModule.cs
          test -f release/src/backend/ProjectTime.Api/Modules/MicrosoftIntegrationModule.cs
          test -f release/src/backend/ProjectTime.Api/Modules/MicrosoftIntegrationSecurityCompatibility.cs
          test -f release/src/backend/ProjectTime.Api/Modules/GlobalMailConfigurationModule.cs
          test -f release/src/frontend/project-time-web/src/MicrosoftIntegrationPortal.jsx
          test -f release/src/frontend/project-time-web/src/microsoft-integration-compatibility.js
          test -f release/src/frontend/project-time-web/src/module-availability-registry.js
          test -f control/scripts/apply-microsoft-integration-test-migration.sh
          test -f control/scripts/run-microsoft-integration-test-migration-job.sh
          test -f control/scripts/wait-containerapp-ready-revision.sh
          test -f control/tests/test-microsoft-integration-migration-045.sh

          grep -Fq '045_microsoft_integration_consolidation' release/database/migrations/045_microsoft_integration_consolidation.sql
          grep -Fq 'microsoft_integration_client_secrets' release/database/migrations/045_microsoft_integration_consolidation.sql
          grep -Fq 'microsoft_integration_audit_events' release/database/migrations/045_microsoft_integration_consolidation.sql
          grep -Fq 'microsoft_integration_permission_aliases' release/database/migrations/045_microsoft_integration_consolidation.sql
          grep -Fq 'UseMicrosoftIntegrationSecurityCompatibility' release/src/backend/ProjectTime.Api/Modules/GlobalMailConfigurationModule.cs
          grep -Fq 'client_selected_import_role_not_allowed' release/src/backend/ProjectTime.Api/Modules/MicrosoftIntegrationSecurityCompatibility.cs
          grep -Fq 'governed_import_role_not_allowed' release/src/backend/ProjectTime.Api/Modules/MicrosoftIntegrationSecurityCompatibility.cs
          grep -Fq 'microsoft_integration_manage_access_required' release/src/backend/ProjectTime.Api/Modules/MicrosoftIntegrationSecurityCompatibility.cs
          grep -Fq 'HydrateEveryConfiguredTenantSecretAsync' release/src/backend/ProjectTime.Api/Modules/MicrosoftIntegrationSecurityCompatibility.cs
          grep -Fq '/api/microsoft-integration/directory-users/import-selected' release/src/backend/ProjectTime.Api/Modules/AzureDirectoryImportModule.cs
          grep -Fq '/api/microsoft-integration/overview' release/src/backend/ProjectTime.Api/Modules/MicrosoftIntegrationModule.cs
          grep -Fq '/api/microsoft-integration/client-secret' release/src/backend/ProjectTime.Api/Modules/MicrosoftIntegrationModule.cs
          grep -Fq '/api/microsoft-integration/test-connection' release/src/backend/ProjectTime.Api/Modules/MicrosoftIntegrationModule.cs
          grep -Fq 'Microsoft Integration' release/src/frontend/project-time-web/src/MicrosoftIntegrationPortal.jsx
          grep -Fq 'Preview and import Entra users' release/src/frontend/project-time-web/src/microsoft-integration-compatibility.js
          grep -Fq "moduleNumber: '065', route: 'entra-secret-administration', displayName: 'Microsoft Integration'" release/src/frontend/project-time-web/src/module-availability-registry.js
          ! grep -Fq "moduleNumber: '067'" release/src/frontend/project-time-web/src/module-availability-registry.js

          bash -n control/scripts/wait-containerapp-ready-revision.sh
          bash control/tests/test-microsoft-integration-migration-045.sh
          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          echo '::warning::A green run does not prove authenticated Entra import or Microsoft Graph credential testing. Signed-in UAT remains required.'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify live API database configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t ENV_NAMES < <(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            --query 'properties.template.containers[0].env[].name' -o tsv)
          printf '%s\n' "${ENV_NAMES[@]}" | sort -u > /tmp/microsoft-integration-api-env-names
          for name in PTP_DB_HOST PTP_DB_PORT PTP_DB_NAME PTP_DB_USER PTP_DB_PASSWORD; do
            grep -Fxq "$name" /tmp/microsoft-integration-api-env-names || { echo "Missing required API environment variable: $name" >&2; exit 1; }
          done
          echo 'MICROSOFT_INTEGRATION_DATABASE_CONFIGURATION=COMPLETE'

      - name: Load test database connection
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        run: bash control/scripts/export-pr55-test-database-url.sh

      - name: Capture current immutable API and web images
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          RAW_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          [[ -n "$RAW_API" && -n "$RAW_WEB" && "${API_MODE,,}" == single && "${WEB_MODE,,}" == single ]]

          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Image is outside approved ACR: $image" >&2; return 1 ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          echo "old_api_image=$(resolve_digest "$RAW_API")" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$(resolve_digest "$RAW_WEB")" >> "$GITHUB_OUTPUT"

      - name: Build immutable Microsoft Integration API and web images
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA='${{ steps.release.outputs.target_commit }}'
          API_REPO='project-health-dashboard-api'
          WEB_REPO='project-health-dashboard-web'
          API_DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$API_REPO:microsoft-integration-$SHA" release/deployment/containers/api/Dockerfile release)"
          WEB_DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$WEB_REPO:microsoft-integration-$SHA" release/deployment/containers/web/Dockerfile release)"
          [[ "$API_DIGEST" == sha256:* && "$WEB_DIGEST" == sha256:* ]]
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$API_REPO@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$WEB_REPO@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build checksum-pinned migration 045 image
        id: migration
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/microsoft-integration-migrator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          install -m 0644 control/deployment/containers/pr55-migrator/Dockerfile "$CONTEXT/Dockerfile"
          install -m 0755 control/scripts/apply-microsoft-integration-test-migration.sh "$CONTEXT/apply-pr55-test-migrations.sh"
          install -m 0644 release/database/migrations/045_microsoft_integration_consolidation.sql "$CONTEXT/migrations/045_microsoft_integration_consolidation.sql"
          (
            cd "$CONTEXT/migrations"
            sha256sum 045_microsoft_integration_consolidation.sql > SHA256SUMS
          )
          printf '%s\n' '${{ steps.release.outputs.target_commit }}' > "$CONTEXT/release-commit"
          DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-microsoft-integration-migrator:${{ steps.release.outputs.target_commit }}-${GITHUB_SHA:0:12}" "$CONTEXT/Dockerfile" "$CONTEXT")"
          [[ "$DIGEST" == sha256:* ]]
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-microsoft-integration-migrator@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Apply or verify migration 045 inside private network
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          MICROSOFT_INTEGRATION_MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
          MICROSOFT_INTEGRATION_MIGRATION_JOB_NAME: msint-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash control/scripts/run-microsoft-integration-test-migration-job.sh

      - name: Deploy Microsoft Integration API
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          API_SUFFIX="msintapi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CANDIDATE_API_REVISION="${{ vars.AZURE_API_APP }}--${API_SUFFIX}"
          echo 'started=true' >> "$GITHUB_OUTPUT"
          echo "candidate_api_revision=$CANDIDATE_API_REVISION" >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT='${{ steps.release.outputs.target_commit }}' \
            --revision-suffix "$API_SUFFIX" \
            --output none

      - name: Validate API startup and protected Microsoft Integration routes
        id: validate_api
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          DIAGNOSTICS=/tmp/microsoft-integration-api-validation
          mkdir -p "$DIAGNOSTICS"
          CANDIDATE_API_REVISION='${{ steps.deploy_api.outputs.candidate_api_revision }}'

          bash control/scripts/wait-containerapp-ready-revision.sh \
            '${{ vars.AZURE_RESOURCE_GROUP }}' \
            '${{ vars.AZURE_API_APP }}' \
            "$CANDIDATE_API_REVISION" \
            '${{ steps.build.outputs.api_image }}' \
            60 10

          request() {
            local name="$1" method="$2" url="$3" body="${4:-}" attempt="${5:-1}" separator='?'
            [[ "$url" == *\?* ]] && separator='&'
            local probe_url="${url}${separator}release_check=msint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            local args=(-sS -X "$method" -D "$DIAGNOSTICS/${name}.headers" -o "$DIAGNOSTICS/${name}.body" -w '%{http_code}' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache')
            if [[ -n "$body" ]]; then args+=(-H 'Content-Type: application/json' --data "$body"); fi
            curl "${args[@]}" "$probe_url" || true
          }

          content_type() {
            awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub(/\r/, ""); print $2}' "$1" 2>/dev/null | tail -1
          }

          wait_status() {
            local name="$1" method="$2" url="$3" expected="$4" body="${5:-}" status='' type=''
            for attempt in $(seq 1 36); do
              status="$(request "$name" "$method" "$url" "$body" "$attempt")"
              type="$(content_type "$DIAGNOSTICS/${name}.headers")"
              printf 'PROBE name=%s attempt=%s status=%s type=%s\n' "$name" "$attempt" "$status" "$type"
              if [[ ",$expected," == *",$status,"* && "$type" == application/json* ]]; then return 0; fi
              sleep 10
            done
            echo "$url did not reach expected status $expected with JSON content." >&2
            cat "$DIAGNOSTICS/${name}.body" >&2 || true
            return 1
          }

          wait_status health GET "$BASE/health" '200'
          wait_status version GET "$BASE/api/version" '200'
          wait_status overview GET "$BASE/api/microsoft-integration/overview" '401,403'
          wait_status legacy-configuration GET "$BASE/api/global-mail/configuration" '401,403'
          wait_status directory-import POST "$BASE/api/microsoft-integration/directory-users/import-selected" '401,403' '{}'
          wait_status client-secret PUT "$BASE/api/microsoft-integration/client-secret" '401,403' '{}'
          wait_status connection-test POST "$BASE/api/microsoft-integration/test-connection" '401,403' '{}'

          READY_API_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.latestReadyRevisionName' -o tsv)"
          [[ "$READY_API_REVISION" == "$CANDIDATE_API_REVISION" ]] || { echo "Unexpected ready API revision: $READY_API_REVISION" >&2; exit 1; }
          READY_API_IMAGE="$(az containerapp revision show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --revision "$READY_API_REVISION" --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$READY_API_IMAGE" == '${{ steps.build.outputs.api_image }}' ]]
          echo "ready_api_revision=$READY_API_REVISION" >> "$GITHUB_OUTPUT"
          echo "ready_api_image=$READY_API_IMAGE" >> "$GITHUB_OUTPUT"
          echo 'MICROSOFT_INTEGRATION_API_DEPLOYMENT_INTEGRITY=READY'
          echo 'AUTHENTICATED_MICROSOFT_INTEGRATION_UAT=REQUIRED'

      - name: Capture API validation diagnostics
        if: ${{ failure() && steps.deploy_api.outputs.started == 'true' }}
        shell: bash
        run: |
          set +e
          mkdir -p evidence/microsoft-integration-api-validation
          cp -R /tmp/microsoft-integration-api-validation/. evidence/microsoft-integration-api-validation/ 2>/dev/null || true
          az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --query '{latestRevisionName:properties.latestRevisionName,latestReadyRevisionName:properties.latestReadyRevisionName,configuredImage:properties.template.containers[0].image}' \
            -o json > evidence/microsoft-integration-api-validation/containerapp.json 2>&1 || true
          az containerapp revision list -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --query '[].{name:name,active:properties.active,trafficWeight:properties.trafficWeight,provisioningState:properties.provisioningState,healthState:properties.healthState,image:properties.template.containers[0].image}' \
            -o json > evidence/microsoft-integration-api-validation/revisions.json 2>&1 || true

      - name: Upload API validation diagnostics
        if: ${{ failure() && steps.deploy_api.outputs.started == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-integration-api-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/microsoft-integration-api-validation
          retention-days: 7

      - name: Deploy Microsoft Integration web
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          WEB_SUFFIX="msintweb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CANDIDATE_WEB_REVISION="${{ vars.AZURE_WEB_APP }}--${WEB_SUFFIX}"
          echo 'started=true' >> "$GITHUB_OUTPUT"
          echo "candidate_web_revision=$CANDIDATE_WEB_REVISION" >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "$WEB_SUFFIX" \
            --output none

      - name: Validate served Microsoft Integration assets and ready revision images
        id: validate_web
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          CANDIDATE_API_REVISION='${{ steps.deploy_api.outputs.candidate_api_revision }}'
          CANDIDATE_WEB_REVISION='${{ steps.deploy_web.outputs.candidate_web_revision }}'

          bash control/scripts/wait-containerapp-ready-revision.sh \
            '${{ vars.AZURE_RESOURCE_GROUP }}' \
            '${{ vars.AZURE_WEB_APP }}' \
            "$CANDIDATE_WEB_REVISION" \
            '${{ steps.build.outputs.web_image }}' \
            60 10

          READY=false
          for attempt in $(seq 1 36); do
            BUSTER="microsoft-integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$attempt"
            STATUS="$(curl -sSL -H 'Cache-Control: no-cache, no-store' -o /tmp/msint-index -w '%{http_code}' "$BASE/?release_check=$BUSTER" || true)"
            JS="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/msint-index | head -1)"
            CSS="$(sed -nE 's/.*href="([^"]+\.css)".*/\1/p' /tmp/msint-index | head -1)"
            if [[ "$STATUS" == 200 && -n "$JS" && -n "$CSS" ]]; then
              case "$JS" in http*) JS_URL="$JS" ;; /*) JS_URL="$BASE$JS" ;; *) JS_URL="$BASE/$JS" ;; esac
              case "$CSS" in http*) CSS_URL="$CSS" ;; /*) CSS_URL="$BASE$CSS" ;; *) CSS_URL="$BASE/$CSS" ;; esac
              curl -sSL -H 'Cache-Control: no-cache, no-store' -o /tmp/msint-app.js "$JS_URL?release_check=$BUSTER" || true
              curl -sSL -H 'Cache-Control: no-cache, no-store' -o /tmp/msint-app.css "$CSS_URL?release_check=$BUSTER" || true
              if grep -Fq 'Microsoft Integration' /tmp/msint-app.js \
                && grep -Fq 'Preview and import Entra users' /tmp/msint-app.js \
                && grep -Fq '/api/microsoft-integration/overview' /tmp/msint-app.js \
                && grep -Fq '/api/microsoft-integration/client-secret' /tmp/msint-app.js \
                && grep -Fq '/api/microsoft-integration/directory-users/import-selected' /tmp/msint-app.js \
                && grep -Fq 'Directory.Read.All' /tmp/msint-app.js \
                && grep -Fq 'Microsoft 365 / SMTP' /tmp/msint-app.js \
                && grep -Fq 'projectpulse-microsoft-integration-active' /tmp/msint-app.css; then
                READY=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$READY" == true ]] || { echo 'Microsoft Integration candidate assets were not served.' >&2; exit 1; }

          READY_API_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.latestReadyRevisionName' -o tsv)"
          READY_WEB_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.latestReadyRevisionName' -o tsv)"
          [[ "$READY_API_REVISION" == "$CANDIDATE_API_REVISION" ]] || { echo "Ready API revision changed unexpectedly: $READY_API_REVISION" >&2; exit 1; }
          [[ "$READY_WEB_REVISION" == "$CANDIDATE_WEB_REVISION" ]] || { echo "Ready web revision mismatch: $READY_WEB_REVISION" >&2; exit 1; }
          READY_API_IMAGE="$(az containerapp revision show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --revision "$READY_API_REVISION" --query 'properties.template.containers[0].image' -o tsv)"
          READY_WEB_IMAGE="$(az containerapp revision show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --revision "$READY_WEB_REVISION" --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$READY_API_IMAGE" == '${{ steps.build.outputs.api_image }}' ]] || { echo "Ready API revision image mismatch: $READY_API_REVISION $READY_API_IMAGE" >&2; exit 1; }
          [[ "$READY_WEB_IMAGE" == '${{ steps.build.outputs.web_image }}' ]] || { echo "Ready web revision image mismatch: $READY_WEB_REVISION $READY_WEB_IMAGE" >&2; exit 1; }
          echo "ready_api_revision=$READY_API_REVISION" >> "$GITHUB_OUTPUT"
          echo "ready_web_revision=$READY_WEB_REVISION" >> "$GITHUB_OUTPUT"
          echo "ready_api_image=$READY_API_IMAGE" >> "$GITHUB_OUTPUT"
          echo "ready_web_image=$READY_WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo 'MICROSOFT_INTEGRATION_CANDIDATE_ASSETS=DEPLOYED'
          echo 'AUTHENTICATED_ENTRA_IMPORT_AND_GRAPH_UAT=REQUIRED'

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/microsoft-integration-010-065-test-deployment.json <<JSON
          {"environment":"test","releaseCommit":"${{ steps.release.outputs.target_commit }}","workflowCommit":"${{ github.sha }}","runId":"${{ github.run_id }}","runAttempt":"${{ github.run_attempt }}","modules":["010","065"],"retiredModule":"067","migration":"045_microsoft_integration_consolidation","deploymentType":"migration-api-web","migrationImage":"${{ steps.migration.outputs.image }}","apiImage":"${{ steps.build.outputs.api_image }}","webImage":"${{ steps.build.outputs.web_image }}","readyApiRevision":"${{ steps.validate_web.outputs.ready_api_revision }}","readyWebRevision":"${{ steps.validate_web.outputs.ready_web_revision }}","readyApiImage":"${{ steps.validate_web.outputs.ready_api_image }}","readyWebImage":"${{ steps.validate_web.outputs.ready_web_image }}","previousApiImage":"${{ steps.before.outputs.old_api_image }}","previousWebImage":"${{ steps.before.outputs.old_web_image }}","deploymentIntegrity":"passed","authenticatedUatRequired":true,"functionalUatStatus":"pending-user-session-validation"}
          JSON

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-integration-010-065-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/microsoft-integration-010-065-test-deployment.json
          retention-days: 30

      - name: Roll back API and web images on failure
        if: ${{ failure() && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set +e
          if [[ '${{ steps.deploy_api.outputs.started }}' == 'true' ]]; then
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
              --image '${{ steps.before.outputs.old_api_image }}' \
              --revision-suffix "msintapirb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none
          fi
          if [[ '${{ steps.deploy_web.outputs.started }}' == 'true' ]]; then
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
              --image '${{ steps.before.outputs.old_web_image }}' \
              --revision-suffix "msintwebrb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none
          fi
