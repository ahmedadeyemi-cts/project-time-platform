name: Validate FlowHive PSA Protected Test admission
on:
  pull_request:
    paths:
      - '.github/flowhive-psa-*'
      - '.github/workflows/flowhive-psa-*'
      - '.github/workflows/projectpulse-deploy-test.yml'
      - 'scripts/release-test/*flowhive-psa*'
      - 'tests/flowhive-psa-*'
      - 'tests/flowhive-installed-resolution.test.py'
      - 'tests/validate-flowhive-pm-acceptance-scope.mjs'
      - 'scripts/release-test/check-flowhive-acceptance-inputs.py'
      - 'scripts/release-test/resolve-flowhive-installed-deployment.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: flowhive-psa-admission-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact control-only scope and negative admission tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTROL_BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          python -m pip install PyYAML==6.0.3
          if [[ "$GITHUB_HEAD_REF" == 'fix/flowhive-pm-acceptance-contract' ]]; then
            node tests/validate-flowhive-pm-acceptance-scope.mjs
          elif [[ "$GITHUB_HEAD_REF" == 'fix/sow-runtime-diagnostics-and-uat-isolation-20260906' ]]; then
            node tests/validate-sow-generation-uat-scope.mjs
          elif [[ "$GITHUB_HEAD_REF" == 'fix/flowhive-pr914-followup-20260911' ]]; then
            node tests/flowhive-psa-scope.mjs --allow-reviewed-superset
          elif [[ "$GITHUB_HEAD_REF" == 'feature/flowhive-enterprise-psa-revamp-20260906' || "$GITHUB_HEAD_REF" == 'feature/flowhive-psa-graphical-exports-20260908' || "$GITHUB_HEAD_REF" == 'release/flowhive-sow-successor-20260908' || "$GITHUB_HEAD_REF" == 'fix/flowhive-installed-pm-readiness-candidate-20260911' ]]; then
            node tests/flowhive-psa-scope.mjs
          elif [[ "$GITHUB_HEAD_REF" == 'control/flowhive-canonical-dispatch-20260911' ]]; then
            node --input-type=module -e "import fs from 'node:fs'; import { verifyController } from './tests/flowhive-psa-release-control.mjs'; verifyController(fs.readFileSync('.github/workflows/projectpulse-deploy-test.yml', 'utf8'));"
          else
            node tests/flowhive-psa-release-control.mjs
          fi
          node --test tests/flowhive-psa-admission.test.mjs
          python tests/flowhive-psa-live-uat.test.py
          python tests/flowhive-psa-installed-acceptance.test.py
          python tests/flowhive-installed-resolution.test.py
          node tests/validate-flowhive-pm-acceptance-scope.mjs --self-test
          python tests/flowhive-psa-release-workflow.test.py
          python -m py_compile \
            scripts/release-test/check-flowhive-acceptance-inputs.py \
            scripts/release-test/resolve-flowhive-installed-deployment.py \
            scripts/release-test/check-module025-installed-prerequisite.py \
            scripts/release-test/run-flowhive-my-role-browser.py \
            scripts/release-test/verify-flowhive-installed-identity.py
          bash -n scripts/release-test/apply-flowhive-psa-migrations.sh
          bash -n scripts/release-test/build-and-run-flowhive-psa-migrations.sh
          git diff --check
      # Live readiness is deliberately not a source-only PR result. The
      # owner-authorized admission workflow acquires the lock, rechecks the
      # live controller, and fails closed immediately before dispatch.
  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FLOWHIVE_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned candidate SHA
        id: candidate
        working-directory: control
        env:
          FEATURE_HEAD: ${{ github.event.pull_request.head.sha }}
          FEATURE_BRANCH: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          test -s .github/flowhive-psa-protected-test-candidate.json || { echo 'ERROR: trusted candidate approval file is missing.' >&2; exit 1; }
          if [[ "$FEATURE_BRANCH" == 'feature/flowhive-enterprise-psa-revamp-20260906' || "$FEATURE_BRANCH" == 'release/flowhive-sow-successor-20260908' ]]; then
            [[ "$FEATURE_HEAD" =~ ^[a-f0-9]{40}$ ]]
            echo "sha=$FEATURE_HEAD" >> "$GITHUB_OUTPUT"
            if [[ "$FEATURE_BRANCH" == 'release/flowhive-sow-successor-20260908' ]]; then
              echo 'staging=successor' >> "$GITHUB_OUTPUT"
            else
              echo 'staging=approved' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "sha=$(jq -er '.sha | select(test("^[a-f0-9]{40}$"))' .github/flowhive-psa-protected-test-candidate.json)" >> "$GITHUB_OUTPUT"
            echo 'staging=approved' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Start isolated PostgreSQL fixture
        id: fixture_database
        shell: bash
        env:
          FIXTURE_DATABASE: flowhive_migrations_test
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$FIXTURE_DATABASE" == flowhive_execution_test || "$FIXTURE_DATABASE" == flowhive_migrations_test ]]
          name="flowhive-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$name" =~ ^flowhive-ci-[0-9]+-[0-9]+$ ]]
          echo "CI_POSTGRES_CONTAINER=$name" >> "$GITHUB_ENV"
          env_file="$(mktemp "$RUNNER_TEMP/flowhive-postgres-XXXXXX")"
          trap 'rm -f -- "$env_file"' EXIT
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' ERR
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf 'POSTGRES_USER=flowhive\nPOSTGRES_DB=%s\nPOSTGRES_PASSWORD=%s\n' "$FIXTURE_DATABASE" "$password" > "$env_file"
          docker run --detach --rm --name "$name" --publish 127.0.0.1::5432 \
            --env-file "$env_file" --health-cmd "pg_isready -U flowhive -d $FIXTURE_DATABASE" \
            --health-interval 2s --health-timeout 2s --health-retries 30 postgres:16 >/dev/null
          health='starting'
          for attempt in {1..30}; do
            health="$(timeout 5s docker inspect --format '{{.State.Health.Status}}' "$name")"
            [[ "$health" != healthy ]] || break
            [[ "$health" != unhealthy ]] || exit 1
            sleep 2
          done
          [[ "$health" == healthy ]] || { echo 'CI PostgreSQL readiness expired.' >&2; exit 1; }
          address="$(timeout 5s docker port "$name" 5432/tcp)"
          [[ "$address" =~ ^127\.0\.0\.1:([0-9]{1,5})$ ]]
          port="${BASH_REMATCH[1]}"
          {
            printf 'PGHOST=127.0.0.1\nPGPORT=%s\nPGDATABASE=%s\nPGUSER=flowhive\nPGPASSWORD=%s\n' "$port" "$FIXTURE_DATABASE" "$password"
            printf 'FLOWHIVE_TEST_DB=Host=127.0.0.1;Port=%s;Database=%s;Username=flowhive;Password=%s\n' "$port" "$FIXTURE_DATABASE" "$password"
          } >> "$GITHUB_ENV"
          trap - ERR
      - name: Exercise selected release SQL and the real image entrypoint in disposable PostgreSQL
        working-directory: control
        env:
          FLOWHIVE_MIGRATION_STAGING: ${{ steps.candidate.outputs.staging }}
        run: |
          set -Eeuo pipefail
          sudo mkdir -p /opt/projectpulse/release
          sudo chown "$(id -u):$(id -g)" /opt/projectpulse/release
          python3 tests/flowhive-psa-migration-fixture.py
      - name: Remove isolated PostgreSQL fixture
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          name="${CI_POSTGRES_CONTAINER:-}"
          [[ -n "$name" ]] || exit 0
          [[ "$name" == "flowhive-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]
          docker rm -f "$name" >/dev/null
