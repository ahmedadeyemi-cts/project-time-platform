name: Validate FlowHive PSA Protected Test admission
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact candidate commit to validate'
        required: true
        type: string
      base_sha:
        description: 'Trusted main commit that must be an ancestor of the candidate'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/flowhive-psa-*'
      - '.github/workflows/flowhive-psa-*'
      - '.github/workflows/projectpulse-deploy-test.yml'
      - 'scripts/release-test/*flowhive-psa*'
      - 'tests/flowhive-psa-*'
      - 'tests/FlowHiveDetailedPlannerTests/**'
      - 'tests/flowhive-installed-resolution.test.py'
      - 'tests/validate-flowhive-pm-acceptance-scope.mjs'
      - 'scripts/release-test/check-flowhive-acceptance-inputs.py'
      - 'scripts/release-test/resolve-flowhive-installed-deployment.py'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagService.cs'
      - 'src/frontend/project-time-web/src/role-journeys/**'
      - 'src/frontend/project-time-web/scripts/role-journeys-vite-plugin.mjs'
      - 'src/frontend/project-time-web/tests/role-journeys.test.mjs'
permissions:
  contents: read
  actions: read
concurrency:
  group: flowhive-psa-admission-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact control-only scope and negative admission tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTROL_BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          python -m pip install PyYAML==6.0.3
          if [[ "$GITHUB_HEAD_REF" == 'fix/flowhive-pm-acceptance-contract' ]]; then
            node tests/validate-flowhive-pm-acceptance-scope.mjs
          elif [[ "$GITHUB_HEAD_REF" == 'fix/module025-scoped-test-deploy-20260916' ]]; then
            printf '%s\n' \
              '.github/workflows/flowhive-psa-release-control-ci.yml' \
              '.github/workflows/projectpulse-deploy-test.yml' \
              'scripts/release-test/validate-protected-test-controller-branches.sh' \
              'tests/flowhive-psa-admission.test.mjs' \
              'tests/flowhive-psa-release-workflow.test.py' \
              'tests/module025-scoped-deploy.test.py' \
              | LC_ALL=C sort -u > "$RUNNER_TEMP/module025-scoped-deploy-files"
            git diff --name-only "$BASE_SHA...HEAD" | LC_ALL=C sort -u > "$RUNNER_TEMP/module025-scoped-deploy-actual"
            cmp -s "$RUNNER_TEMP/module025-scoped-deploy-files" "$RUNNER_TEMP/module025-scoped-deploy-actual" || {
              echo 'Module 025 deployment correction differs from its exact file scope.' >&2
              diff -u "$RUNNER_TEMP/module025-scoped-deploy-files" "$RUNNER_TEMP/module025-scoped-deploy-actual" >&2 || true
              exit 1
            }
            python tests/module025-scoped-deploy.test.py
          elif [[ "$GITHUB_HEAD_REF" == 'fix/module025-generation-path-20260916' ]]; then
            printf '%s\n' \
              '.github/workflows/flowhive-psa-release-control-ci.yml' \
              'scripts/release-test/validate-protected-test-controller-branches.sh' \
              'src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagService.cs' \
              'tests/FlowHiveDetailedPlannerTests/Program.cs' \
              'tests/flowhive-psa-admission.test.mjs' \
              | LC_ALL=C sort -u > "$RUNNER_TEMP/module025-generation-files"
            git diff --name-only "$BASE_SHA...HEAD" | LC_ALL=C sort -u > "$RUNNER_TEMP/module025-generation-actual"
            cmp -s "$RUNNER_TEMP/module025-generation-files" "$RUNNER_TEMP/module025-generation-actual" || {
              echo 'Module 025 generation correction differs from its exact file scope.' >&2
              diff -u "$RUNNER_TEMP/module025-generation-files" "$RUNNER_TEMP/module025-generation-actual" >&2 || true
              exit 1
            }
          elif [[ "$GITHUB_HEAD_REF" == 'fix/module025-sa-review-confirm-20260916' ]]; then
            printf '%s\n' \
              '.github/workflows/flowhive-psa-release-control-ci.yml' \
              'scripts/release-test/run-module025-installed-sa-uat.py' \
              'tests/flowhive-psa-installed-acceptance.test.py' \
              'tests/flowhive-psa-admission.test.mjs' \
              | LC_ALL=C sort -u > "$RUNNER_TEMP/module025-review-confirm-files"
            git diff --name-only "$BASE_SHA...HEAD" | LC_ALL=C sort -u > "$RUNNER_TEMP/module025-review-confirm-actual"
            cmp -s "$RUNNER_TEMP/module025-review-confirm-files" "$RUNNER_TEMP/module025-review-confirm-actual" || {
              echo 'Module 025 verifier correction differs from its exact file scope.' >&2
              diff -u "$RUNNER_TEMP/module025-review-confirm-files" "$RUNNER_TEMP/module025-review-confirm-actual" >&2 || true
              exit 1
            }
          elif [[ "$GITHUB_HEAD_REF" == 'fix/sow-runtime-diagnostics-and-uat-isolation-20260906' ]]; then
            node tests/validate-sow-generation-uat-scope.mjs
          elif [[ "$GITHUB_HEAD_REF" == 'fix/flowhive-pr914-followup-20260911' ]]; then
            node tests/flowhive-psa-scope.mjs --allow-reviewed-superset
          elif [[ "$GITHUB_HEAD_REF" == 'feature/flowhive-enterprise-psa-revamp-20260906' || "$GITHUB_HEAD_REF" == 'feature/flowhive-psa-graphical-exports-20260908' || "$GITHUB_HEAD_REF" == 'release/flowhive-sow-successor-20260908' || "$GITHUB_HEAD_REF" == 'fix/flowhive-installed-pm-readiness-candidate-20260911' ]]; then
            node tests/flowhive-psa-scope.mjs
          elif [[ "$GITHUB_HEAD_REF" == 'fix/flowhive-planner-provider-budget-20260912' ]]; then
            node tests/flowhive-psa-scope.mjs --allow-reviewed-superset
          elif [[ "$GITHUB_HEAD_REF" == 'fix/flowhive-planner-compact-batch-20260913' ]]; then
