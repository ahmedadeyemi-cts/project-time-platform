      # Live readiness is deliberately not a source-only PR result. The
      # owner-authorized admission workflow acquires the lock, rechecks the
      # live controller, and fails closed immediately before dispatch.
  manual_validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Validate exact dispatched FlowHive candidate and release controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the exact requested candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Validate requested candidate, Module 025, systemwide, security, and concurrency controls
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || fail 'Manual validation must execute from trusted main.'
          [[ "$GITHUB_SHA" == "$BASE_SHA" ]] || fail 'Manual validation controller SHA does not match the requested trusted-main base.'
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'Requested release SHA is not a complete lowercase commit SHA.'
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'Requested base SHA is not a complete lowercase commit SHA.'
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || fail 'Manual validation did not check out the requested candidate SHA.'
          git cat-file -e "$BASE_SHA^{commit}" || fail 'Requested trusted-main base commit is unavailable.'
          git merge-base --is-ancestor "$BASE_SHA" HEAD || fail 'Requested trusted-main base is not an ancestor of the candidate.'

          node src/frontend/project-time-web/scripts/validate-module025-sow-register.mjs
          bash tests/test-module025-sow-sell-register-migration-106.sh
          node tests/validate-systemwide-enterprise-reliability.mjs
          node tests/validate-systemwide-image-build-controller.mjs
          node scripts/validate-deployment-concurrency-governance.mjs --repo-root "$GITHUB_WORKSPACE" --verify-repository
          python3 scripts/security/validate-repository-security-posture.py
          git diff --check "$BASE_SHA...HEAD"

          echo "FLOWHIVE_DISPATCH_CANDIDATE_SHA=$RELEASE_SHA"
          echo "FLOWHIVE_DISPATCH_BASE_SHA=$BASE_SHA"
          echo 'FLOWHIVE_DISPATCH_EXACT_CANDIDATE_VALIDATION=PASSED'
          echo 'MODULE025_SOW_MIGRATION_106=PASSED'
          echo 'SYSTEMWIDE_RELEASE_CONTROLS=PASSED'
          echo 'SECURITY_POSTURE=PASSED'
          echo 'DEPLOYMENT_CONCURRENCY=PASSED'
          echo 'PRODUCTION_MUTATION=NONE'
  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FLOWHIVE_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned candidate SHA
        id: candidate
        working-directory: control
        env:
          FEATURE_HEAD: ${{ github.event.pull_request.head.sha }}
          FEATURE_BRANCH: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          test -s .github/flowhive-psa-protected-test-candidate.json || { echo 'ERROR: trusted candidate approval file is missing.' >&2; exit 1; }
          if [[ "$FEATURE_BRANCH" == 'feature/flowhive-enterprise-psa-revamp-20260906' || "$FEATURE_BRANCH" == 'release/flowhive-sow-successor-20260908' || "$FEATURE_BRANCH" == 'fix/flowhive-planner-provider-budget-20260912' ]]; then
            [[ "$FEATURE_HEAD" =~ ^[a-f0-9]{40}$ ]]
            echo "sha=$FEATURE_HEAD" >> "$GITHUB_OUTPUT"
            if [[ "$FEATURE_BRANCH" == 'release/flowhive-sow-successor-20260908' ]]; then
              echo 'staging=successor' >> "$GITHUB_OUTPUT"
            else
              echo 'staging=approved' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "sha=$(jq -er '.sha | select(test("^[a-f0-9]{40}$"))' .github/flowhive-psa-protected-test-candidate.json)" >> "$GITHUB_OUTPUT"
            echo 'staging=approved' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Start isolated PostgreSQL fixture
        id: fixture_database
        shell: bash
        env:
          FIXTURE_DATABASE: flowhive_migrations_test
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$FIXTURE_DATABASE" == flowhive_execution_test || "$FIXTURE_DATABASE" == flowhive_migrations_test ]]
          name="flowhive-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$name" =~ ^flowhive-ci-[0-9]+-[0-9]+$ ]]
          echo "CI_POSTGRES_CONTAINER=$name" >> "$GITHUB_ENV"
          env_file="$(mktemp "$RUNNER_TEMP/flowhive-postgres-XXXXXX")"
          trap 'rm -f -- "$env_file"' EXIT
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' ERR
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf 'POSTGRES_USER=flowhive\nPOSTGRES_DB=%s\nPOSTGRES_PASSWORD=%s\n' "$FIXTURE_DATABASE" "$password" > "$env_file"
          docker run --detach --rm --name "$name" --publish 127.0.0.1::5432 \
            --env-file "$env_file" --health-cmd "pg_isready -U flowhive -d $FIXTURE_DATABASE" \
            --health-interval 2s --health-timeout 2s --health-retries 30 postgres:16 >/dev/null
          health='starting'
          for attempt in {1..30}; do
            health="$(timeout 5s docker inspect --format '{{.State.Health.Status}}' "$name")"
            [[ "$health" != healthy ]] || break
            [[ "$health" != unhealthy ]] || exit 1
            sleep 2
          done
          [[ "$health" == healthy ]] || { echo 'CI PostgreSQL readiness expired.' >&2; exit 1; }
          address="$(timeout 5s docker port "$name" 5432/tcp)"
          [[ "$address" =~ ^127\.0\.0\.1:([0-9]{1,5})$ ]]
          port="${BASH_REMATCH[1]}"
          {
            printf 'PGHOST=127.0.0.1\nPGPORT=%s\nPGDATABASE=%s\nPGUSER=flowhive\nPGPASSWORD=%s\n' "$port" "$FIXTURE_DATABASE" "$password"
            printf 'FLOWHIVE_TEST_DB=Host=127.0.0.1;Port=%s;Database=%s;Username=flowhive;Password=%s\n' "$port" "$FIXTURE_DATABASE" "$password"
          } >> "$GITHUB_ENV"
          trap - ERR
      - name: Exercise selected release SQL and the real image entrypoint in disposable PostgreSQL
        working-directory: control
        env:
          FLOWHIVE_MIGRATION_STAGING: ${{ steps.candidate.outputs.staging }}
        run: |
          set -Eeuo pipefail
          sudo mkdir -p /opt/projectpulse/release
          sudo chown "$(id -u):$(id -g)" /opt/projectpulse/release
          python3 tests/flowhive-psa-migration-fixture.py
      - name: Remove isolated PostgreSQL fixture
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          name="${CI_POSTGRES_CONTAINER:-}"
          [[ -n "$name" ]] || exit 0
          [[ "$name" == "flowhive-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]
          docker rm -f "$name" >/dev/null
