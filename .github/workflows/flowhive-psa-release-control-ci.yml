            grep -Ev '^[[:space:]]*(#|$)' .github/flowhive-planner-compact-batch-release-files.txt | LC_ALL=C sort -u > "$RUNNER_TEMP/flowhive-planner-compact-batch-files"
            git diff --name-only "$BASE_SHA...HEAD" | LC_ALL=C sort -u > "$RUNNER_TEMP/flowhive-planner-compact-batch-actual"
            cmp -s "$RUNNER_TEMP/flowhive-planner-compact-batch-files" "$RUNNER_TEMP/flowhive-planner-compact-batch-actual" || {
