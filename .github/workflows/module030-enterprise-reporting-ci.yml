name: Validate Module 030 Enterprise Reporting

on:
  push:
    branches:
      - 'feature/module-030-enterprise-reporting-*'
  pull_request:
    paths:
      - '.github/workflows/module030-enterprise-reporting-ci.yml'
      - 'database/migrations/054_enterprise_reporting_center.sql'
      - 'database/rollback/054_enterprise_reporting_center_rollback.sql'
      - 'docs/modules/module-030-enterprise-reporting/README.md'
      - 'src/backend/ProjectTime.Api/Modules/EnterpriseReporting*.cs'
      - 'src/backend/ProjectTime.Api/ProjectTime.Api.csproj'
      - 'src/frontend/project-time-web/package.json'
      - 'src/frontend/project-time-web/scripts/inject-enterprise-reporting-center.mjs'
      - 'src/frontend/project-time-web/scripts/validate-enterprise-reporting-center.mjs'
      - 'src/frontend/project-time-web/src/EnterpriseReportingCenter.jsx'
      - 'src/frontend/project-time-web/src/enterprise-reporting-center.css'
      - 'tests/test-enterprise-reporting-migration-054.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module030-enterprise-reporting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated Module 030 source scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$CHANGED"

          ALLOWED='^(\.github/workflows/module030-enterprise-reporting-ci\.yml|database/migrations/054_enterprise_reporting_center\.sql|database/rollback/054_enterprise_reporting_center_rollback\.sql|docs/modules/module-030-enterprise-reporting/README\.md|src/backend/ProjectTime.Api/Modules/EnterpriseReporting(Contracts|Catalog|Engine|SourceLoader|Repository|Module)\.cs|src/backend/ProjectTime.Api/ProjectTime.Api\.csproj|src/frontend/project-time-web/package\.json|src/frontend/project-time-web/scripts/(inject-enterprise-reporting-center|validate-enterprise-reporting-center)\.mjs|src/frontend/project-time-web/src/(EnterpriseReportingCenter\.jsx|enterprise-reporting-center\.css)|tests/test-enterprise-reporting-migration-054\.sh)$'
          UNEXPECTED="$(grep -Ev "$ALLOWED" <<<"$CHANGED" || true)"
          if [[ -n "$UNEXPECTED" ]]; then
            echo 'Unexpected Module 030 Enterprise Reporting source scope:' >&2
            printf '%s\n' "$UNEXPECTED" >&2
            exit 1
          fi

          for protected in \
            '.github/workflows/projectpulse-deploy-runtime-direct-timer-recovery-test.yml' \
            '.github/workflows/validate-runtime-direct-timer-recovery-deployment.yml' \
            'scripts/validate-runtime-direct-timer-recovery-test-deployment.sh'; do
            if grep -Fxq "$protected" <<<"$CHANGED"; then
              echo "Protected deployment file changed: $protected" >&2
              exit 1
            fi
          done

          if grep -E '^(deployment/|\.github/workflows/projectpulse-deploy-|scripts/.*deploy|src/frontend/project-time-web/src/(App|main)\.|src/frontend/project-time-web/src/module-availability-registry\.js)' <<<"$CHANGED"; then
            echo 'Module 030 source overlaps deployment or canonical generated integration files.' >&2
            exit 1
          fi

          git diff --check origin/main...HEAD
          echo 'ENTERPRISE_REPORTING_SOURCE_ISOLATION=PASSED'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Check JavaScript syntax
        run: |
          set -Eeuo pipefail
          node --check src/frontend/project-time-web/scripts/inject-enterprise-reporting-center.mjs
          node --check src/frontend/project-time-web/scripts/validate-enterprise-reporting-center.mjs

      - name: Test migration 054
        run: bash tests/test-enterprise-reporting-migration-054.sh

      - name: Validate source contract
        working-directory: src/frontend/project-time-web
        run: node ./scripts/validate-enterprise-reporting-center.mjs

      - name: Build ProjectTime API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate reporting dependencies
        working-directory: src/frontend/project-time-web
        run: |
          set -Eeuo pipefail
          npm run validate:group3-project-financial-workspaces
          npm run validate:group5-financial-operations
          npm run validate:group6-enterprise-presentation
          npm run validate:group7-ai-help-system-guide
          npm run validate:module005
          npm run validate:module069
          npm run validate:module071
          npm run validate:module072
          npm run validate:module075
          npm run validate:module076
          npm run validate:module077
          npm run validate:module078
          npm run validate:module079
          npm run validate:module080
          npm run validate:enterprise-reporting

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Validate compiled Module 030 markers
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          cat dist/assets/*.js > /tmp/module030-enterprise-reporting.js
          cat dist/assets/*.css > /tmp/module030-enterprise-reporting.css

          for marker in \
            'Enterprise Reporting Center' \
            'Choose a report first; only filters relevant to that report appear.' \
            'Engineer — self only' \
            'PM — own portfolio' \
            'Run and record' \
            'Source accountability' \
            '/api/enterprise-reporting/catalog' \
            '/api/enterprise-reporting/filter-options' \
            '/api/enterprise-reporting/run'; do
            grep -Fq "$marker" /tmp/module030-enterprise-reporting.js
          done

          for marker in \
            '.enterprise-reporting-center' \
            '.enterprise-reporting-catalog-grid' \
            '.enterprise-reporting-command-card' \
            '.enterprise-reporting-source-grid' \
            '.enterprise-reporting-history-list'; do
            grep -Fq "$marker" /tmp/module030-enterprise-reporting.css
          done

          echo 'ENTERPRISE_REPORTING_FRONTEND_BUILD=PASSED'
