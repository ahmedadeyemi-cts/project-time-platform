name: Validate Pulse AI Private RAG Orchestration

on:
  push:
    branches:
      - 'feature/module-011-private-rag-orchestration-*'
      - 'fix/pulse-ai-private-rag-post-merge-*'
  pull_request:
    paths:
      - '.github/workflows/pulse-ai-private-rag-orchestration-ci.yml'
      - '.github/workflows/pulse-ai-private-runtime-activation-ci.yml'
      - '.github/workflows/repair-pulse-ai-private-rag-post-merge-20260730.yml'
      - 'scripts/repair-pulse-ai-private-rag-post-merge-20260730.py'
      - 'database/migrations/053_intelligence_answer_orchestration.sql'
      - 'database/rollback/053_intelligence_answer_orchestration_rollback.sql'
      - 'tests/test-pulse-ai-private-rag-migration-053.sh'
      - 'docs/modules/module-011-pulse-ai/PRIVATE-RAG-ORCHESTRATION.md'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagContracts.cs'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagRepository.cs'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiPrivateRetrievalAuthorizationService.cs'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiPrivateRetrievalService.cs'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiPrivateModelClient.cs'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagService.cs'
      - 'src/backend/ProjectTime.Api/Ai/ProjectPulseAiServiceCollectionExtensions.cs'
      - 'src/backend/ProjectTime.Api/Modules/PulseAiPrivateRagModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/PulseAiPrivateRuntimeModule.cs'
      - 'src/backend/ProjectTime.Api/ProjectPulseAiTimeEntrySuggestionService.cs'
      - 'src/frontend/project-time-web/scripts/validate-module-011-private-rag-orchestration.mjs'
      - 'src/frontend/project-time-web/src/PulseAiPrivateRagWorkbench.jsx'
      - 'src/frontend/project-time-web/src/pulse-ai-private-rag-workbench.css'
      - 'src/frontend/project-time-web/src/WorkTaskBuilderPanel.jsx'

permissions:
  contents: read

concurrency:
  group: pulse-ai-private-rag-orchestration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify owned source scope or run regression mode
        shell: bash
        run: |
          set -Eeuo pipefail
          HEAD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          git fetch origin "$BASE_BRANCH" --no-tags
          BASE_REF="origin/$BASE_BRANCH"
          CHANGED="$(git diff --name-only "$BASE_REF"...HEAD)"
          printf '%s\n' "$CHANGED"

          for protected in \
            '.github/workflows/projectpulse-deploy-runtime-direct-timer-recovery-test.yml' \
            '.github/workflows/validate-runtime-direct-timer-recovery-deployment.yml' \
            'scripts/validate-runtime-direct-timer-recovery-test-deployment.sh'; do
            if grep -Fxq "$protected" <<<"$CHANGED"; then
              echo "Protected deployment file changed: $protected" >&2
              exit 1
            fi
          done

          if [[ "$HEAD_BRANCH" != feature/module-011-private-rag-orchestration-* \
             && "$HEAD_BRANCH" != fix/pulse-ai-private-rag-post-merge-* ]]; then
            git diff --check "$BASE_REF"...HEAD
            echo "PULSE_AI_PRIVATE_RAG_VALIDATION_MODE=REGRESSION branch=$HEAD_BRANCH"
            echo 'PULSE_AI_PRIVATE_RAG_SOURCE_ISOLATION=NOT_APPLICABLE'
            exit 0
          fi

          [[ "$(git merge-base "$BASE_REF" HEAD)" == "$(git rev-parse "$BASE_REF")" ]] || {
            echo "Private RAG branch is behind $BASE_REF." >&2
            exit 1
          }
          ALLOWED='^(\.github/workflows/(pulse-ai-private-rag-orchestration-ci|pulse-ai-private-runtime-activation-ci|repair-pulse-ai-private-rag-post-merge-20260730)\.yml|scripts/repair-pulse-ai-private-rag-post-merge-20260730\.py|database/migrations/053_intelligence_answer_orchestration\.sql|database/rollback/053_intelligence_answer_orchestration_rollback\.sql|tests/test-pulse-ai-private-rag-migration-053\.sh|docs/modules/module-011-pulse-ai/PRIVATE-RAG-ORCHESTRATION\.md|src/backend/ProjectTime\.Api/Ai/(PulseAiPrivateRagContracts|PulseAiPrivateRagRepository|PulseAiPrivateRetrievalAuthorizationService|PulseAiPrivateRetrievalService|PulseAiPrivateModelClient|PulseAiPrivateRagService|ProjectPulseAiServiceCollectionExtensions)\.cs|src/backend/ProjectTime\.Api/Modules/(PulseAiPrivateRagModule|PulseAiPrivateRuntimeModule)\.cs|src/backend/ProjectTime\.Api/ProjectPulseAiTimeEntrySuggestionService\.cs|src/frontend/project-time-web/scripts/validate-module-011-private-rag-orchestration\.mjs|src/frontend/project-time-web/src/(PulseAiPrivateRagWorkbench\.jsx|pulse-ai-private-rag-workbench\.css|WorkTaskBuilderPanel\.jsx))$'
          UNEXPECTED="$(grep -Ev "$ALLOWED" <<<"$CHANGED" || true)"
          if [[ -n "$UNEXPECTED" ]]; then
            echo 'Unexpected private RAG source scope:' >&2
            printf '%s\n' "$UNEXPECTED" >&2
            exit 1
          fi
          ! grep -E '^(deployment/|scripts/.*deploy|src/backend/ProjectTime\.Api/Ai/(ProjectPulseAiConfiguration|ProjectPulseAiRemoteProviders|ProjectPulseAiSecretStore)\.cs|src/backend/ProjectTime\.Api/Modules/AiProviderConfigurationModule\.cs|src/frontend/project-time-web/src/(AiProviderConfigurationCenter|PulseAiHelpChat|PulseAiHelpProductKnowledge|pulse-ai-help-chat-usability|pulse-ai-help-usability-bootstrap|pulse-ai-help-product-knowledge|main\.jsx))' <<<"$CHANGED"
          git diff --check "$BASE_REF"...HEAD
          echo "PULSE_AI_PRIVATE_RAG_BASE=$BASE_REF"
          echo 'PULSE_AI_PRIVATE_RAG_SOURCE_ISOLATION=PASSED'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Validate private RAG source contract
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check ./scripts/validate-module-011-private-rag-orchestration.mjs
          node ./scripts/validate-module-011-private-rag-orchestration.mjs

      - name: Test migrations 052 and 053
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x tests/test-pulse-ai-private-document-runtime-migration-052.sh
          chmod +x tests/test-pulse-ai-private-rag-migration-053.sh
          tests/test-pulse-ai-private-document-runtime-migration-052.sh
          tests/test-pulse-ai-private-rag-migration-053.sh

      - name: Validate preserved Pulse AI and FlowHive contracts
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          node ./scripts/validate-module-011-pulse-ai.mjs
          node ./scripts/validate-module-011-pulse-ai-deep-intelligence.mjs
          node ./scripts/validate-module-011-private-document-pipeline.mjs
          node ./scripts/validate-module-011-private-runtime-activation.mjs
          node ./scripts/validate-module-066-project-flowhive.mjs

      - name: Build ProjectTime API
        id: api_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release > pulse-ai-private-rag-api-build.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload API diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ai-private-rag-api-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: pulse-ai-private-rag-api-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce API build
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS='${{ steps.api_build.outputs.exit_code }}'
          tail -n 300 pulse-ai-private-rag-api-build.log
          if [[ "$STATUS" != '0' ]]; then exit "$STATUS"; fi
          grep -Fq '0 Error(s)' pulse-ai-private-rag-api-build.log
          echo 'PULSE_AI_PRIVATE_RAG_API_BUILD=PASSED'

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Build complete frontend production bundle
        id: frontend_build
        continue-on-error: true
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set +e
          npm run build > pulse-ai-private-rag-frontend-build.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ai-private-rag-frontend-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/frontend/project-time-web/pulse-ai-private-rag-frontend-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce frontend build and markers
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS='${{ steps.frontend_build.outputs.exit_code }}'
          tail -n 240 pulse-ai-private-rag-frontend-build.log
          if [[ "$STATUS" != '0' ]]; then exit "$STATUS"; fi
          cat dist/assets/*.js > /tmp/pulse-ai-private-rag.js
          cat dist/assets/*.css > /tmp/pulse-ai-private-rag.css
          for marker in \
            'Live Private RAG for Timesheet, Help/Search & FlowHive' \
            'Private RAG Readiness' \
            'Timesheet Suggestion' \
            'FlowHive Draft' \
            'Answer Audit & Feedback' \
            'Private source citations'; do
            grep -Fq "$marker" /tmp/pulse-ai-private-rag.js
          done
          grep -Fq '.pulse-ai-rag-workbench' /tmp/pulse-ai-private-rag.css
          grep -Fq '.pulse-ai-rag-citation-grid' /tmp/pulse-ai-private-rag.css
          echo 'PULSE_AI_PRIVATE_RAG_FRONTEND_BUILD=PASSED'

      - name: Validate production web container context
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build \
            --file deployment/containers/web/Dockerfile \
            --tag "projectpulse-private-rag:${GITHUB_SHA}" \
            .
          echo 'PULSE_AI_PRIVATE_RAG_WEB_CONTAINER_BUILD=PASSED'

      - name: Publish validation summary
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo '## Module 011 Pulse AI — Phase 011D repair'
            echo
            echo '- Current-main owned-source isolation or regression applicability: passed'
            echo '- Migrations 052 and 053 apply/rollback/reapply: passed'
            echo '- Authorization before ranking: passed'
            echo '- Prompt-assembly reauthorization: passed'
            echo '- Private endpoint-only model and embeddings: passed'
            echo '- Timesheet private-first and human-review controls: passed'
            echo '- FlowHive draft-only controls: passed'
            echo '- Detailed Help/Search and citation contract: passed'
            echo '- Answer audit and feedback controls: passed'
            echo '- Existing Module 011 and FlowHive contracts: passed'
            echo '- .NET 10 API build: passed'
            echo '- Complete frontend build: passed'
            echo '- Production web-container context: passed'
            echo '- Migration applied to Test/Production: no'
            echo '- Private model configured or called by source: no'
            echo '- Claude/OpenAI call: none'
            echo '- Module 064 change: none'
            echo '- Timesheet save/submit: none'
            echo '- FlowHive baseline or assignment: none'
            echo '- Azure, Entra, Container App, or deployment operation: none'
          } >> "$GITHUB_STEP_SUMMARY"
