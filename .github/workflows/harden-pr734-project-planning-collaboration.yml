name: Harden PR 734 Project Planning Collaboration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/harden-pr734-project-planning-collaboration.yml'
      - 'scripts/release-test/harden-pr734-source.py'

permissions:
  contents: write

concurrency:
  group: harden-pr734-project-planning-collaboration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/project-planning-collaboration-access-20260818'
    name: Harden and validate planning collaboration boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '10.0.x'

      - name: Apply guarded hardening repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/release-test/harden-pr734-source.py')
          source = path.read_text()
          source = source.replace(
              "const deployment = read('.github/workflows/projectpulse-deploy-test.yml');\nconst migrationRunner = read('scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh');",
              "const deployment = read('.github/workflows/project-planning-collaboration-deploy-test.yml');\nconst migrationRunner = read('scripts/release-test/run-project-planning-collaboration-migration-job.sh');"
          )
          source = source.replace(
              "requireText(migrationRunner, '086-088-093-095', 'private-network Migration 095 ownership tag');",
              "requireText(migrationRunner, '095-project-planning-collaboration', 'private-network Migration 095 ownership tag');"
          )
          source = source.replace(
              'DEPLOYMENT="$ROOT/.github/workflows/projectpulse-deploy-test.yml"',
              'DEPLOYMENT="$ROOT/.github/workflows/project-planning-collaboration-deploy-test.yml"'
          )
          source = source.replace(
              'RUNNER="$ROOT/scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh"',
              'RUNNER="$ROOT/scripts/release-test/run-project-planning-collaboration-migration-job.sh"'
          )
          source = source.replace(
              "grep -Fq '086-088-093-095' \"$RUNNER\"",
              "grep -Fq '095-project-planning-collaboration' \"$RUNNER\""
          )

          start_marker = '''# ---------------------------------------------------------------------------
          # Update the private-network runner tag and its permanent system-wide validator.
          # ---------------------------------------------------------------------------
          '''
          start = source.find(start_marker)
          end_marker = "Path('scripts/release-test/harden-pr734-source.py').unlink(missing_ok=True)"
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('PR 734 dedicated runner patch markers were not found.')

          replacement = '''# ---------------------------------------------------------------------------
          # Derive a dedicated private-network runner without changing the existing
          # 086/088/093 governed release controller.
          # ---------------------------------------------------------------------------
          existing_runner_path = 'scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh'
          dedicated_runner_path = 'scripts/release-test/run-project-planning-collaboration-migration-job.sh'
          dedicated_runner = read(existing_runner_path)
          dedicated_runner = replace_count(
              dedicated_runner,
              '086-088-093',
              '095-project-planning-collaboration',
              2,
              'dedicated Migration 095 image ownership tag'
          )
          dedicated_runner = dedicated_runner.replace(
              'systemwide-enterprise-reliability-test',
              'project-planning-collaboration-test'
          )
          write(dedicated_runner_path, dedicated_runner)
          Path(dedicated_runner_path).chmod(0o755)


          Path('scripts/release-test/harden-pr734-source.py').unlink(missing_ok=True)
          '''
          path.write_text(source[:start] + replacement + source[end + len(end_marker):])
          PY
          python3 scripts/release-test/harden-pr734-source.py

      - name: Validate focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/validate-project-planning-collaboration-access.mjs
          bash tests/test-project-planning-collaboration-migration-095.sh
          node tests/validate-systemwide-enterprise-reliability.mjs
          (
            cd src/frontend/project-time-web
            node scripts/validate-module-033-project-forge.mjs
            node scripts/validate-module-066-project-flowhive.mjs
          )
          bash -n scripts/release-test/run-project-planning-collaboration-migration-job.sh
          git diff --check

      - name: Build API
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install, audit, and build frontend
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run build

      - name: Commit and push reviewed source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'

          # GitHub's workflow token cannot update workflow files. Preserve the
          # temporary publisher and permanent Migration 095 controller.
          git restore --source=HEAD --staged --worktree .github/workflows

          git add -A
          git diff --cached --quiet && {
            echo 'ERROR: PR 734 hardening produced no source change.' >&2
            exit 1
          }
          git commit -m 'fix(planning): harden collaborator and stakeholder boundaries'
          git push origin HEAD:feature/project-planning-collaboration-access-20260818
