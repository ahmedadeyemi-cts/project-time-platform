name: Temporary PR 343 Security Review Fix V4

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-pr343-security-review-fix-v4
  cancel-in-progress: false

jobs:
  apply-validate-push:
    if: github.event.pull_request.head.ref == 'feature/module-011-celar-ai-runtime-rebrand-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact isolated trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = 'dff4993d965e3ba4919f49db746070e4968d1eae'
          test "$(git diff --name-only HEAD^...HEAD)" = '.github/workflows/temporary-pr343-review-fix-v3.yml'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Apply independent-review corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          profile_path = Path('src/backend/ProjectTime.Api/Ai/CelarAiBrandProfile.cs')
          profile = profile_path.read_text(encoding='utf-8')
          old = '            || value.Length <= 32;'
          new = '            || value.Equals("celar", StringComparison.OrdinalIgnoreCase);'
          if profile.count(old) != 1:
              raise SystemExit(f'identity routing anchor count={profile.count(old)}')
          profile_path.write_text(profile.replace(old, new, 1), encoding='utf-8')

          module_path = Path('src/backend/ProjectTime.Api/Modules/CelarAiBrandModule.cs')
          module = module_path.read_text(encoding='utf-8')

          class_anchor = 'public static class CelarAiBrandModule\n{\n'
          role_block = (
              'public static class CelarAiBrandModule\n{\n'
              '    private static readonly HashSet<string> Module064AdministratorRoles =\n'
              '        new(StringComparer.OrdinalIgnoreCase)\n'
              '        {\n'
              '            "SUPER_ADMINISTRATOR",\n'
              '            "SYSTEM_ADMINISTRATOR",\n'
              '            "ADMINISTRATOR"\n'
              '        };\n\n'
          )
          if module.count(class_anchor) != 1:
              raise SystemExit(f'class anchor count={module.count(class_anchor)}')
          module = module.replace(class_anchor, role_block, 1)

          provider_start = module.index('    private static async Task<IResult> GetProviderBridgeAsync(')
          provider_end = module.index('    private static async Task<IResult> ChatAsync(', provider_start)
          provider = module[provider_start:provider_end]
          private_marker = '        var privateOptions = PulseAiPrivateRagOptions.FromEnvironment();'
          if provider.count(private_marker) != 1:
              raise SystemExit(f'provider options anchor count={provider.count(private_marker)}')
          admin_guard = (
              '        var actualAccess = identities.Value.Actual == identities.Value.Effective\n'
              '            ? access\n'
              '            : await service.LoadAccessAsync(identities.Value.Actual, cancellationToken);\n'
              '        if (!actualAccess.IsActive\n'
              '            || !actualAccess.RoleCodes.Any(Module064AdministratorRoles.Contains))\n'
              '            return Forbidden("MODULE_064_ADMINISTRATOR");\n'
          )
          provider = provider.replace(private_marker, admin_guard + private_marker, 1)
          module = module[:provider_start] + provider + module[provider_end:]

          identity_branch_start = module.index('        if (CelarAiBrandProfile.IsIdentityQuestion(question))')
          identity_branch_end = module.index('        else\n', identity_branch_start)
          identity_branch = module[identity_branch_start:identity_branch_end]
          call_marker = '                repository,\n                cancellationToken);'
          if identity_branch.count(call_marker) != 1:
              raise SystemExit(f'identity call anchor count={identity_branch.count(call_marker)}')
          identity_branch = identity_branch.replace(
              call_marker,
              '                repository,\n                access.CanViewConversations,\n                cancellationToken);',
              1,
          )
          module = module[:identity_branch_start] + identity_branch + module[identity_branch_end:]

          method_start = module.index('    private static async Task<PulseAiSystemQuestionResult> CreateIdentityAnswerAsync(')
          body_start = module.index('    {\n', method_start)
          signature = module[method_start:body_start]
          signature_marker = '        PulseAiSystemIntelligenceRepository repository,\n        CancellationToken cancellationToken)\n'
          if signature.count(signature_marker) != 1:
              raise SystemExit(f'identity signature anchor count={signature.count(signature_marker)}')
          signature = signature.replace(
              signature_marker,
              '        PulseAiSystemIntelligenceRepository repository,\n        bool canViewConversations,\n        CancellationToken cancellationToken)\n',
              1,
          )
          module = module[:method_start] + signature + module[body_start:]

          persistence_marker = '        var mayPersist = actualUserId == effectiveUserId;'
          if module.count(persistence_marker) != 1:
              raise SystemExit(f'persistence anchor count={module.count(persistence_marker)}')
          module = module.replace(
              persistence_marker,
              '        var mayPersist = actualUserId == effectiveUserId && canViewConversations;',
              1,
          )
          module_path.write_text(module, encoding='utf-8')

          deep_path = Path('.github/workflows/deep-intelligence-read-contract-ci.yml')
          deep = deep_path.read_text(encoding='utf-8')
          branch_condition = '          if [[ "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" == feature/module-011-celar-ai-runtime-rebrand-* ]]; then'
          source_condition = (
              '          if [[ -f ./scripts/inject-celar-ai-runtime-rebrand.mjs ]] \\\n'
              "            && grep -Fq 'Celar AI Help & Search' ./scripts/inject-celar-ai-runtime-rebrand.mjs; then"
          )
          if deep.count(branch_condition) != 1:
              raise SystemExit(f'deep marker condition count={deep.count(branch_condition)}')
          deep_path.write_text(deep.replace(branch_condition, source_condition, 1), encoding='utf-8')
          PY

          git diff --check -- \
            .github/workflows/deep-intelligence-read-contract-ci.yml \
            src/backend/ProjectTime.Api/Ai/CelarAiBrandProfile.cs \
            src/backend/ProjectTime.Api/Modules/CelarAiBrandModule.cs
          grep -Fq 'value.Equals("celar", StringComparison.OrdinalIgnoreCase)' src/backend/ProjectTime.Api/Ai/CelarAiBrandProfile.cs
          ! grep -Fq 'value.Length <= 32' src/backend/ProjectTime.Api/Ai/CelarAiBrandProfile.cs
          grep -Fq 'actualAccess.RoleCodes.Any(Module064AdministratorRoles.Contains)' src/backend/ProjectTime.Api/Modules/CelarAiBrandModule.cs
          grep -Fq 'access.CanViewConversations' src/backend/ProjectTime.Api/Modules/CelarAiBrandModule.cs
          grep -Fq 'actualUserId == effectiveUserId && canViewConversations' src/backend/ProjectTime.Api/Modules/CelarAiBrandModule.cs
          grep -Fq "grep -Fq 'Celar AI Help & Search' ./scripts/inject-celar-ai-runtime-rebrand.mjs" .github/workflows/deep-intelligence-read-contract-ci.yml

      - name: Install dependencies and run deterministic production build
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run build
          echo 'PR343_REVIEW_FIX_FIRST_BUILD=PASSED'

      - name: Validate corrected Module 011 source contracts
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          node ./scripts/validate-celar-ai-runtime-rebrand.mjs
          node ./scripts/validate-module-011-pulse-ai.mjs
          node ./scripts/validate-pulse-ai-help-chat-usability.mjs
          node ./scripts/validate-module-011-system-intelligence-package.mjs
          node ./scripts/validate-module-011-pulse-ai-deep-intelligence.mjs
          node ./scripts/validate-module-011-private-document-pipeline.mjs
          echo 'PR343_REVIEW_FIX_SOURCE_CONTRACTS=PASSED'

      - name: Build API and repeat frontend build
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          cd src/frontend/project-time-web
          npm run build
          echo 'PR343_REVIEW_FIX_REPEAT_BUILD=PASSED'

      - name: Validate production web container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --file deployment/containers/web/Dockerfile --tag "projectpulse-pr343-review-v4:${GITHUB_SHA}" .
          echo 'PR343_REVIEW_FIX_WEB_CONTAINER=PASSED'

      - name: Commit and push validated corrections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET_BRANCH='feature/module-011-celar-ai-runtime-rebrand-20260730'
          SOURCE_SHA="$(git rev-parse HEAD)"
          git config user.name 'projectpulse-pr343-review-fix'
          git config user.email 'projectpulse-pr343-review-fix@users.noreply.github.com'
          git rm .github/workflows/temporary-pr343-review-fix-v3.yml
          git add \
            .github/workflows/deep-intelligence-read-contract-ci.yml \
            src/backend/ProjectTime.Api/Ai/CelarAiBrandProfile.cs \
            src/backend/ProjectTime.Api/Modules/CelarAiBrandModule.cs
          git diff --check --cached
          git commit -m 'Fix Celar AI authorization and CI review findings'
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "PR343_REVIEW_FIX_COMMIT=$(git rev-parse HEAD)"
