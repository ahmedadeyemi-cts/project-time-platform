name: Supervise PR 737 Protected UAT release

on:
  push:
    branches:
      - ops/pr737-protected-uat-observer-20260823
    paths:
      - '.github/workflows/pr737-protected-uat-release-supervisor.yml'

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr737-protected-uat-release-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '737'
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      EVIDENCE_DIR: /tmp/pr737-release-supervisor
    steps:
      - name: Verify permanent source and wait for exact-SHA gates
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          api_get() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$1"
          }
          install -d -m 0700 "$EVIDENCE_DIR"

          pr="$(api_get "$API_ROOT/pulls/$PR_NUMBER")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$pr")"
          HEAD_BRANCH="$(jq -r '.head.ref' <<<"$pr")"
          [[ "$(jq -r '.state' <<<"$pr")" == open ]]
          [[ "$(jq -r '.draft' <<<"$pr")" == false ]]
          [[ "$HEAD_BRANCH" == "$TARGET_BRANCH" ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

          fetch_text() {
            local path="$1"
            api_get "$API_ROOT/contents/$path?ref=$HEAD_SHA" | jq -r '.content' | tr -d '\n' | base64 --decode
          }
          migration080="$(fetch_text database/migrations/080_celar_ai_internal_data_intelligence.sql)"
          migration081="$(fetch_text database/migrations/081_celar_ai_private_runtime_activation.sql)"
          builder094="$(fetch_text scripts/release-test/build-and-run-flowhive-authority-migration-094-job.sh)"
          manifest="$(fetch_text .github/shared-project-document-planning-governed-release-files.txt)"
          for migration in "$migration080" "$migration081"; do
            grep -Fq 'ADD COLUMN IF NOT EXISTS is_active BOOLEAN' <<<"$migration"
            grep -Fq 'WHERE is_active IS NULL' <<<"$migration"
            grep -Fq 'ALTER COLUMN is_active SET NOT NULL' <<<"$migration"
          done
          grep -Fq '080_celar_ai_internal_data_intelligence.sql' <<<"$builder094"
          grep -Fq '081_celar_ai_private_runtime_activation.sql' <<<"$builder094"
          grep -Fxq 'database/migrations/080_celar_ai_internal_data_intelligence.sql' <<<"$manifest"
          grep -Fxq 'database/migrations/081_celar_ai_private_runtime_activation.sql' <<<"$manifest"
          echo "PERMANENT_PRIVATE_RUNTIME_PREREQUISITE_REPAIR=VERIFIED"

          required=(
            'ProjectPulse Repository Security Posture'
            'Validate Governed Protected-Test Release Controller'
            'ProjectPulse CI'
            'Validate UAT Functional Completion'
            'FlowHive Detailed Planner CI'
            'Validate Shared FlowHive and Project Forge Document Planning'
            'Validate Module 033 Project Forge'
            'Validate Module 030 Analytics Center'
            'Validate Module 030 Analytics Enterprise Experience'
            'Validate Celar AI Enterprise Platform Interface'
            'Validate Pulse AI Private Document Pipeline'
            'Validate Project Planning Collaboration Access'
            'System-wide Enterprise Reliability CI'
          )
          deadline=$((SECONDS + 10800))
          all_green=0
          while (( SECONDS < deadline )); do
            runs="$(api_get "$API_ROOT/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")"
            all_green=1
            pending=()
            for name in "${required[@]}"; do
              state="$(jq -r --arg name "$name" '[.workflow_runs[]|select(.name==$name)]|sort_by(.created_at)|last|if .==null then "missing:" else "\(.status):\(.conclusion // "")" end' <<<"$runs")"
              case "$state" in
                completed:success) ;;
                completed:*) fail "Required workflow failed: $name ($state)" ;;
                *) all_green=0; pending+=("$name=$state") ;;
              esac
            done
            (( all_green )) && break
            printf 'Waiting for exact-SHA gates: %s\n' "${pending[*]}"
            sleep 30
          done
          (( all_green )) || fail 'Exact-SHA required workflows did not reach green.'

          current="$(api_get "$API_ROOT/pulls/$PR_NUMBER")"
          [[ "$(jq -r '.head.sha' <<<"$current")" == "$HEAD_SHA" ]] || fail 'PR head moved after validation.'
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          jq -n --arg sha "$HEAD_SHA" --arg branch "$HEAD_BRANCH" '{candidateSha:$sha,candidateBranch:$branch,exactShaChecks:"passed",productionMutation:false}' > "$EVIDENCE_DIR/candidate.json"

      - name: Wait for exact Protected Test deployment and verify evidence
        id: deployment
        shell: bash
        env:
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          HEAD_BRANCH: ${{ steps.candidate.outputs.head_branch }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          api_get() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$1"
          }
          run_id=''
          deadline=$((SECONDS + 14400))
          while (( SECONDS < deadline )); do
            runs="$(api_get "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/runs?event=workflow_dispatch&per_page=100")"
            run_id="$(jq -r --arg sha "$HEAD_SHA" --arg branch "$HEAD_BRANCH" '[.workflow_runs[]|select(.head_sha==$sha and .head_branch==$branch)]|sort_by(.created_at)|last|.id // empty' <<<"$runs")"
            [[ -n "$run_id" ]] && break
            sleep 15
          done
          [[ -n "$run_id" ]] || fail 'Exact candidate deployment run was not found.'

          while (( SECONDS < deadline )); do
            run="$(api_get "$API_ROOT/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            [[ "$status" == completed ]] && break
            sleep 30
          done
          [[ "$status" == completed ]] || fail 'Protected Test deployment did not complete.'
          if [[ "$conclusion" != success ]]; then
            api_get "$API_ROOT/actions/runs/$run_id/jobs?per_page=100" > "$EVIDENCE_DIR/failed-deployment-jobs.json"
            curl --fail-with-body --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/actions/runs/$run_id/logs" --output "$EVIDENCE_DIR/failed-deployment-logs.zip" || true
            fail "Exact Protected Test deployment failed: run $run_id conclusion=$conclusion"
          fi

          artifacts="$(api_get "$API_ROOT/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_id="$(jq -r '[.artifacts[]|select(.name|startswith("systemwide-enterprise-reliability-test-evidence-"))]|sort_by(.created_at)|last|.id // empty' <<<"$artifacts")"
          [[ -n "$artifact_id" ]] || fail 'Protected Test evidence artifact is missing.'
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/actions/artifacts/$artifact_id/zip" --output "$EVIDENCE_DIR/deployment-evidence.zip"
          mkdir -p "$EVIDENCE_DIR/deployment"
          unzip -q "$EVIDENCE_DIR/deployment-evidence.zip" -d "$EVIDENCE_DIR/deployment"

          uat="$(find "$EVIDENCE_DIR/deployment" -type f -name uat-summary.json -print -quit)"
          migrations="$(find "$EVIDENCE_DIR/deployment" -type f -name migrations.json -print -quit)"
          boundary="$(find "$EVIDENCE_DIR/deployment" -type f -name release-boundary.json -print -quit)"
          [[ -s "$uat" && -s "$migrations" && -s "$boundary" ]] || fail 'Deployment evidence is incomplete.'
          jq -e --arg sha "$HEAD_SHA" '
            .status=="passed" and
            .sourceCommit==$sha and
            .flowHiveAiPlanner==true and
            .projectForgeAiPlanner==true and
            .flowHiveWorkingCopyOnly==true and
            .projectForgeReviewOnly==true and
            .planDesignImplementValidateRelease==true and
            .estimatesCompressed==false and
            .migration094=="applied_and_verified" and
            .migration095=="applied_and_verified" and
            .migration096=="applied_and_verified" and
            .productionMutation==false
          ' "$uat" >/dev/null
          jq -e '.status=="applied_and_verified" and (.migrations|index("094_flowhive_canonical_sow_authority"))!=null and (.migrations|index("095_project_planning_collaboration_access"))!=null and (.migrations|index("096_project_planning_document_authority"))!=null and .productionMutation==false' "$migrations" >/dev/null
          jq -e --arg sha "$HEAD_SHA" '.environment=="test" and .applicationRelease==$sha and .productionMutation==false' "$boundary" >/dev/null
          [[ ! -f "$EVIDENCE_DIR/deployment/rollback.json" ]] || fail 'Application rollback evidence exists; candidate is not releasable.'

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          jq -n --arg sha "$HEAD_SHA" --argjson runId "$run_id" '{status:"passed",candidateSha:$sha,deploymentRunId:$runId,migrations:["094","095","096"],authenticatedFlowHiveUat:true,authenticatedProjectForgeUat:true,runtimeShaVerified:true,productionMutation:false}' > "$EVIDENCE_DIR/release-decision.json"

      - name: Merge PR 737 after Protected UAT acceptance
        shell: bash
        env:
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          DEPLOYMENT_RUN_ID: ${{ steps.deployment.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          payload="$(jq -nc --arg sha "$HEAD_SHA" --arg msg "FlowHive V2 Protected UAT passed for $HEAD_SHA" '{sha:$sha,merge_method:"merge",commit_title:"FlowHive V2: document-grounded planning and shared Project Forge evidence (#737)",commit_message:$msg}')"
          code="$(curl --silent --show-error --output "$EVIDENCE_DIR/merge-response.json" --write-out '%{http_code}' \
            --request PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$payload" "$API_ROOT/pulls/$PR_NUMBER/merge")"
          [[ "$code" == 200 || "$code" == 201 ]] || { cat "$EVIDENCE_DIR/merge-response.json" >&2; exit 1; }
          jq -e '.merged==true' "$EVIDENCE_DIR/merge-response.json" >/dev/null
          comment="$(cat <<EOF
          ## FlowHive V2 is ready and merged after Protected-UAT acceptance

          - Candidate SHA: \`$HEAD_SHA\`
          - Protected Test deployment run: \`$DEPLOYMENT_RUN_ID\`
          - Migrations 094, 095, and 096: applied and verified
          - Authenticated FlowHive and Project Forge UAT: passed
          - Runtime SHA: verified against the candidate
          - Production mutation: **NONE**
          EOF
          )"
          jq -nc --arg body "$comment" '{body:$body}' > "$EVIDENCE_DIR/comment.json"
          curl --fail-with-body --silent --show-error \
            --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data @"$EVIDENCE_DIR/comment.json" "$API_ROOT/issues/$PR_NUMBER/comments" >/dev/null
          echo 'PR_737_MERGED_AFTER_PROTECTED_UAT=TRUE'
          echo 'PRODUCTION_MUTATION=NONE'
      - name: Upload supervisor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr737-protected-uat-release-supervisor-${{ github.run_id }}
          path: /tmp/pr737-release-supervisor
          if-no-files-found: warn
          retention-days: 7
