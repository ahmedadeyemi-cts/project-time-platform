name: Watch PR476 Test Deployment Completion

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/watch-pr476-test-deployment.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: watch-pr476-test-deployment
  cancel-in-progress: false

jobs:
  watch:
    if: github.event.head_commit.message == 'Watch PR476 Test deployment completion'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEPLOYMENT_WORKFLOW: deploy-pr476-uat-followup-test.yml
      DEPLOYMENT_HEAD: bc0753e7643a424b0c8a91cb55868a3ffd513aeb
      APPLICATION_SHA: e7a9071c8f165c9344c30b219dde804e9ec320c5
    steps:
      - name: Check out current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Locate and wait for the exact deployment run
        id: deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ID=''
          RUN_JSON=''
          for attempt in $(seq 1 60); do
            RUNS="$(gh run list --repo "$REPO" --workflow "$DEPLOYMENT_WORKFLOW" --branch main --event push --limit 20 --json databaseId,status,conclusion,headSha,url,createdAt,updatedAt)"
            RUN_JSON="$(jq -c --arg sha "$DEPLOYMENT_HEAD" '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | last // empty' <<<"$RUNS")"
            RUN_ID="$(jq -r '.databaseId // empty' <<<"$RUN_JSON")"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          [[ -n "$RUN_ID" ]] || { echo 'The exact PR476 Test deployment run was not found.' >&2; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_url=$(jq -r '.url' <<<"$RUN_JSON")" >> "$GITHUB_OUTPUT"
          echo "PR476_DEPLOYMENT_RUN_ID=$RUN_ID"

          for attempt in $(seq 1 240); do
            VIEW="$(gh run view "$RUN_ID" --repo "$REPO" --json status,conclusion,url,headSha,createdAt,updatedAt,jobs)"
            STATUS="$(jq -r '.status' <<<"$VIEW")"
            CONCLUSION="$(jq -r '.conclusion // empty' <<<"$VIEW")"
            printf 'PR476_DEPLOYMENT_POLL attempt=%s status=%s conclusion=%s\n' "$attempt" "$STATUS" "$CONCLUSION"
            if [[ "$STATUS" == completed ]]; then
              printf '%s\n' "$VIEW" > /tmp/pr476-deployment-run.json
              echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 30
          done
          test -s /tmp/pr476-deployment-run.json || { echo 'The deployment did not finish within the watcher window.' >&2; exit 1; }

      - name: Persist exact deployment evidence
        if: always() && steps.deployment.outputs.run_id != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ID='${{ steps.deployment.outputs.run_id }}'
          CONCLUSION='${{ steps.deployment.outputs.conclusion }}'
          RUN_URL='${{ steps.deployment.outputs.run_url }}'
          mkdir -p docs/deployment-evidence
          cp /tmp/pr476-deployment-run.json docs/deployment-evidence/pr476-test-deployment-run.json
          jq -r '.jobs[] | .name as $job | .steps[] | select(.conclusion != "success" and .conclusion != "skipped") | "- " + $job + " :: " + .name + " = " + (.conclusion // .status)' /tmp/pr476-deployment-run.json > /tmp/pr476-failed-steps || true
          cat > docs/deployment-evidence/PR476_TEST_DEPLOYMENT.md <<EOF
          # PR #476 Test Deployment Evidence

          - Application SHA: \`$APPLICATION_SHA\`
          - Deployment workflow head: \`$DEPLOYMENT_HEAD\`
          - Workflow run: \`$RUN_ID\`
          - Run URL: $RUN_URL
          - Conclusion: **$CONCLUSION**
          - Environment: Test
          - Production changed: No
          - Migration: \`068_module006_standalone_pipeline_management\`
          - Module 011: Deferred

          ## Non-successful steps

          $(cat /tmp/pr476-failed-steps)
          EOF
          sed -i 's/^          //' docs/deployment-evidence/PR476_TEST_DEPLOYMENT.md

          git config user.name 'Project Health Dashboard Release Evidence'
          git config user.email 'project-health-dashboard-release@users.noreply.github.com'
          git add docs/deployment-evidence/PR476_TEST_DEPLOYMENT.md docs/deployment-evidence/pr476-test-deployment-run.json
          git commit -m "Record PR476 Test deployment $CONCLUSION [skip ci]"
          git push origin HEAD:main

      - name: Enforce successful deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ steps.deployment.outputs.conclusion }}' == success ]] || {
            echo 'The PR476 Test deployment did not succeed.' >&2
            exit 1
          }
