name: Repair PR 737 Migration 096 Test compatibility

on:
  push:
    branches:
      - ops/pr737-protected-uat-observer-20260823
    paths:
      - .github/workflows/repair-pr737-migration096.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: repair-pr737-migration096
  cancel-in-progress: false

jobs:
  repair:
    name: Diagnose, repair, test, and publish Migration 096
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      EXPECTED_TARGET_HEAD: d8441ae42f5acfa5efc89996e49e2cf041246820
      FAILED_JOB_ID: '97293868836'
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      REPORT_DIR: /tmp/pr737-migration096-repair

    steps:
      - name: Check out repair tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: tooling
          persist-credentials: false

      - name: Check out exact PR candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_TARGET_HEAD }}
          path: release
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact failed deployment job log
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$REPORT_DIR"
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/actions/jobs/$FAILED_JOB_ID/logs" \
            --output "$REPORT_DIR/job-log.download"
          if file "$REPORT_DIR/job-log.download" | grep -qi 'zip archive'; then
            unzip -p "$REPORT_DIR/job-log.download" > "$REPORT_DIR/job.log"
          else
            cp "$REPORT_DIR/job-log.download" "$REPORT_DIR/job.log"
          fi
          grep -Fq 'column u.is_active does not exist' "$REPORT_DIR/job.log"
          echo 'MIGRATION_096_FAILED_LOG=VERIFIED'

      - name: Generate the fail-closed permanent repair
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git -C release rev-parse HEAD)" == "$EXPECTED_TARGET_HEAD" ]]
          python3 tooling/tools/repair_pr737_migration096.py \
            release \
            "$REPORT_DIR/job.log" \
            "$REPORT_DIR/repair-report.json"
          git -C release diff --check
          echo 'MIGRATION_096_SOURCE_REPAIR=GENERATED'

      - name: Run focused migration regressions
        shell: bash
        working-directory: release
        run: |
          set -Eeuo pipefail
          bash tests/test-project-planning-collaboration-migration-095.sh
          bash tests/test-project-planning-document-authority-migration-096.sh
          echo 'MIGRATION_095_096_REGRESSIONS=PASSED'

      - name: Publish the permanent PR repair
        shell: bash
        working-directory: release
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          [[ "$remote_head" == "$EXPECTED_TARGET_HEAD" ]] || {
            echo "ERROR: PR #737 moved from $EXPECTED_TARGET_HEAD to $remote_head." >&2
            exit 1
          }
          mapfile -t changed < <(git diff --name-only)
          (( ${#changed[@]} >= 1 && ${#changed[@]} <= 2 ))
          for path in "${changed[@]}"; do
            case "$path" in
              database/migrations/*.sql|tests/test-project-planning-document-authority-migration-096.sh) ;;
              *) echo "ERROR: Unexpected repaired path: $path" >&2; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${changed[@]}"
          git diff --cached --check
          git commit -m 'Fix Migration 096 Test identity-schema compatibility'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "MIGRATION_096_REPAIR_COMMIT=$(git rev-parse HEAD)"
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr737-migration096-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pr737-migration096-repair
          if-no-files-found: warn
          retention-days: 7
