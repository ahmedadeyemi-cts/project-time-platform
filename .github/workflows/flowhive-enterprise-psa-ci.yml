name: FlowHive Enterprise PSA CI

on:
  push:
    branches: ['feature/flowhive-enterprise-psa-revamp-20260906']
    paths: ['.github/workflows/flowhive-enterprise-psa-ci.yml']
  pull_request:
    paths:
      - 'src/backend/ProjectTime.Api/Modules/ProjectFlowHive*.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectPlanning*.cs'
      - 'src/backend/ProjectTime.Api/Modules/CelarAiProductionPlatformModule.cs'
      - 'src/frontend/project-time-web/src/*[Ff]low[Hh]ive*'
      - 'src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs'
      - 'tests/FlowHiveExecutablePlanTests/**'
      - 'tests/FlowHiveExecutionTests/**'
      - 'tests/flowhive-psa-*.mjs'
      - 'tests/flowhive-psa-*.py'
      - 'database/migrations/103_module_066_flowhive_enterprise_psa_revamp.sql'
      - 'database/migrations/104_flowhive_bounded_ai_execution.sql'
      - 'database/migrations/105_flowhive_reviewed_regeneration.sql'
      - 'database/rollback/105_flowhive_reviewed_regeneration_rollback.sql'
      - 'database/rollback/104_flowhive_bounded_ai_execution_rollback.sql'
      - '.github/workflows/flowhive-enterprise-psa-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowhive-enterprise-psa-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Archive tracked source and pinned integration history without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/flowhive-source-evidence
          git rev-parse HEAD > /tmp/flowhive-source-evidence/REVISION
          git archive --format=tar.gz HEAD > /tmp/flowhive-source-evidence/source.tar.gz
          git update-ref refs/heads/evidence-flowhive HEAD
          git update-ref refs/heads/evidence-main refs/remotes/origin/main
          git bundle create /tmp/flowhive-source-evidence/integration.bundle refs/heads/evidence-flowhive refs/heads/evidence-main
          git bundle verify /tmp/flowhive-source-evidence/integration.bundle
          cd /tmp/flowhive-source-evidence
          sha256sum source.tar.gz integration.bundle > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flowhive-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/flowhive-source-evidence/
          retention-days: 1
          if-no-files-found: error
  executable-wbs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute native WBS behavior regressions against the real API
        run: dotnet run --project tests/FlowHiveExecutablePlanTests/FlowHiveExecutablePlanTests.csproj --configuration Release
      - name: Preserve existing detailed-planner and Module 025 regressions
        env:
          FLOWHIVE_EXPORT_EVIDENCE_DIR: ${{ runner.temp }}/flowhive-export-evidence
        run: dotnet run --project tests/FlowHiveDetailedPlannerTests/FlowHiveDetailedPlannerTests.csproj --configuration Release
      - name: Render and retain synthetic branded PDF evidence
        shell: bash
        env:
          FLOWHIVE_EXPORT_EVIDENCE_DIR: ${{ runner.temp }}/flowhive-export-evidence
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          shopt -s nullglob
          pdfs=("$FLOWHIVE_EXPORT_EVIDENCE_DIR"/*.pdf)
          [[ "${#pdfs[@]}" -eq 6 ]]
          mkdir -p "$FLOWHIVE_EXPORT_EVIDENCE_DIR/rendered"
          for pdf in "${pdfs[@]}"; do
            pdfinfo "$pdf" >/dev/null
            text_path="$FLOWHIVE_EXPORT_EVIDENCE_DIR/$(basename "$pdf" .pdf).txt"
            pdftotext "$pdf" "$text_path"
            python3 - "$text_path" <<'PY'
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              text = " ".join(stream.read().split())
          assert "US Signal Project FlowHive" in text
          assert "US SIGNAL PROJECT DELIVERY ARTIFACT" in text
          assert "München - 東京 delivery plan" in text
          assert "Café's quoted delivery description" in text
          assert "final acceptance phrase." in text
          PY
            pdftoppm -png -r 144 "$pdf" "$FLOWHIVE_EXPORT_EVIDENCE_DIR/rendered/$(basename "$pdf" .pdf)"
          done
          gantt_text="$FLOWHIVE_EXPORT_EVIDENCE_DIR/gantt.txt"
          monthly_text="$FLOWHIVE_EXPORT_EVIDENCE_DIR/monthly-calendar.txt"
          grep -Fq 'Task details appendix' "$gantt_text"
          grep -Fq 'GANTT-MISSING-START' "$gantt_text"
          grep -Fq 'GANTT-REVERSED' "$gantt_text"
          grep -Fq 'dates were not swapped' "$gantt_text"
          grep -Fq 'Task details appendix' "$monthly_text"
          grep -Fq 'CAL-MISSING-START' "$monthly_text"
          grep -Fq 'CAL-REVERSED' "$monthly_text"
          grep -Fq '+5 more' "$monthly_text"
          rendered=("$FLOWHIVE_EXPORT_EVIDENCE_DIR/rendered"/*.png)
          [[ "${#rendered[@]}" -ge 12 ]]
          for page in "${rendered[@]}"; do
            [[ -s "$page" ]]
            python3 - "$page" <<'PY'
          import struct
          import sys

          path = sys.argv[1]
          with open(path, "rb") as stream:
              signature = stream.read(8)
              length = struct.unpack(">I", stream.read(4))[0]
              chunk = stream.read(4)
              width, height = struct.unpack(">II", stream.read(8))
          assert signature == b"\x89PNG\r\n\x1a\n"
          assert chunk == b"IHDR" and width >= 1000 and height >= 700
          PY
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flowhive-export-pdf-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/flowhive-export-evidence/
          retention-days: 7
          if-no-files-found: error
  execution-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start isolated PostgreSQL fixture
        id: fixture_database
        shell: bash
        env:
          FIXTURE_DATABASE: flowhive_execution_test
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$FIXTURE_DATABASE" == flowhive_execution_test || "$FIXTURE_DATABASE" == flowhive_migrations_test ]]
          name="flowhive-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$name" =~ ^flowhive-ci-[0-9]+-[0-9]+$ ]]
          echo "CI_POSTGRES_CONTAINER=$name" >> "$GITHUB_ENV"
          env_file="$(mktemp "$RUNNER_TEMP/flowhive-postgres-XXXXXX")"
          trap 'rm -f -- "$env_file"' EXIT
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' ERR
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf 'POSTGRES_USER=flowhive\nPOSTGRES_DB=%s\nPOSTGRES_PASSWORD=%s\n' "$FIXTURE_DATABASE" "$password" > "$env_file"
          docker run --detach --rm --name "$name" --publish 127.0.0.1::5432 \
            --env-file "$env_file" --health-cmd "pg_isready -U flowhive -d $FIXTURE_DATABASE" \
            --health-interval 2s --health-timeout 2s --health-retries 30 postgres:16 >/dev/null
          health='starting'
          for attempt in {1..30}; do
            health="$(timeout 5s docker inspect --format '{{.State.Health.Status}}' "$name")"
            [[ "$health" != healthy ]] || break
            [[ "$health" != unhealthy ]] || exit 1
            sleep 2
          done
          [[ "$health" == healthy ]] || { echo 'CI PostgreSQL readiness expired.' >&2; exit 1; }
          address="$(timeout 5s docker port "$name" 5432/tcp)"
          [[ "$address" =~ ^127\.0\.0\.1:([0-9]{1,5})$ ]]
          port="${BASH_REMATCH[1]}"
          {
            printf 'PGHOST=127.0.0.1\nPGPORT=%s\nPGDATABASE=%s\nPGUSER=flowhive\nPGPASSWORD=%s\n' "$port" "$FIXTURE_DATABASE" "$password"
            printf 'FLOWHIVE_TEST_DB=Host=127.0.0.1;Port=%s;Database=%s;Username=flowhive;Password=%s\n' "$port" "$FIXTURE_DATABASE" "$password"
          } >> "$GITHUB_ENV"
          trap - ERR
      - name: Execute real database deadline, cancellation and concurrent-save regressions
        run: dotnet run --project tests/FlowHiveExecutionTests/FlowHiveExecutionTests.csproj --configuration Release
      - name: Remove isolated PostgreSQL fixture
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          name="${CI_POSTGRES_CONTAINER:-}"
          [[ -n "$name" ]] || exit 0
          [[ "$name" == "flowhive-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]
          docker rm -f "$name" >/dev/null
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json
      - name: Test resumable observation, identity fencing and bounded network requests
        run: node --test tests/flowhive-psa-*.test.mjs
      - name: Install locked frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci
      - name: Build the application
        working-directory: src/frontend/project-time-web
        run: npm run build
  planner-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test WBS geometry in light and dark desktop and mobile layouts
        run: python tests/flowhive-psa-planner-layout.py
  planner-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser and frontend dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          (cd src/frontend/project-time-web && npm ci)
      - name: Build actual React component fixture
        env:
          FLOWHIVE_TEST_BUNDLE: /tmp/flowhive-react-test
        run: node tests/flowhive-psa-browser-bundle.mjs
      - name: Execute edited-date, saved-readback and identity-race regressions
        env:
          FLOWHIVE_OFFLINE_BUNDLE: /tmp/flowhive-react-test
        run: python tests/flowhive-psa-react-browser.py
      - name: Build and exercise the actual reviewed-regeneration UI
        run: |
          node tests/flowhive-psa-review-browser-bundle.mjs
          python tests/flowhive-psa-review-browser.py
