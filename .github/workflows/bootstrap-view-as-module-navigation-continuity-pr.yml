name: Build View-As module navigation continuity repair from PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: view-as-module-navigation-continuity-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.event.pull_request.head.ref == 'fix/view-as-module-navigation-continuity-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Extract and apply reviewed source repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/bootstrap-view-as-module-navigation-continuity.yml').read_text()
          start_marker = "      - name: Apply shared View-As navigation repair\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Validate focused View-As and RBAC contracts"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-view-as-navigation.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-view-as-navigation.sh

      - name: Align Module 012 validation with shared navigation policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/project-time-web/scripts/validate-module-012-scoped-role-admin.mjs')
          text = path.read_text()

          anchor = """const [
            ui, model, compatibility, navigation, main, backend, dynamicBackend, registrar,
            writes, persistence, evaluator, css, dynamicCss, project
          ] = await Promise.all([
            text(paths.ui), text(paths.model), text(paths.compatibility), text(paths.navigation), text(paths.main),
            optionalText(paths.backend), optionalText(paths.dynamicBackend), optionalText(paths.registrar), optionalText(paths.writes),
            optionalText(paths.persistence), optionalText(paths.evaluator), text(paths.css), text(paths.dynamicCss), optionalText(paths.project)
          ]);
          """
          addition = anchor + "\nconst navigationPolicy = await text('src/frontend/project-time-web/src/module-navigation-access-policy.js');\n"
          if text.count(anchor) != 1:
              raise SystemExit('Module 012 validator source-loading anchor was not unique.')
          text = text.replace(anchor, addition, 1)

          for obsolete in [
              "  \"actionCode || '').toUpperCase() === 'MODULE_ACCESS'\",\n",
              "  \"grantEffect || '').toUpperCase() === 'DENY'\",\n",
          ]:
              if text.count(obsolete) != 1:
                  raise SystemExit(f'Module 012 obsolete navigation assertion was not unique: {obsolete!r}')
              text = text.replace(obsolete, '', 1)

          marker = """requireAll(compatibility, [
          """
          shared_policy_contract = """requireAll(navigationPolicy, [
            "canonicalRoleCode(grant?.actionCode ?? grant?.ActionCode) !== 'MODULE_ACCESS'",
            "effect === 'DENY'",
            'explicitDeniedModuleNumbers.add(moduleCode)',
            'inactiveDynamicModuleNumbers',
            'legacyFallbackModuleNumbers',
            'unregisteredLegacyModuleNumbers',
            'actualSessionPermanentFullControl'
          ], 'Shared View-As module navigation policy');

          """
          if text.count(marker) != 1:
              raise SystemExit('Module 012 compatibility assertion marker was not unique.')
          text = text.replace(marker, shared_policy_contract + marker, 1)
          path.write_text(text)
          PY

      - name: Validate focused View-As and RBAC contracts
        working-directory: src/frontend/project-time-web
        run: |
          node --check src/module-navigation-access-policy.js
          node --check src/module-availability-bridge.js
          node --check scripts/validate-view-as-module-navigation.mjs
          node scripts/validate-view-as-module-navigation.mjs
          node scripts/validate-dynamic-rbac-administration.mjs
          node scripts/validate-module-012-scoped-role-admin.mjs
          node scripts/validate-group-1-navigation-work-consolidation.mjs

      - name: Build API Release
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release -p:ProjectPulseSourceRevision=1111111111111111111111111111111111111111

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: |
          npm ci
          npm run build

      - name: Validate exact source boundary
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/frontend/project-time-web/src/module-availability-bridge.js',
              'src/frontend/project-time-web/src/module-navigation-access-policy.js',
              'src/frontend/project-time-web/scripts/validate-view-as-module-navigation.mjs',
              'src/frontend/project-time-web/scripts/validate-dynamic-rbac-administration.mjs',
              'src/frontend/project-time-web/scripts/validate-module-012-scoped-role-admin.mjs',
              'src/frontend/project-time-web/scripts/validate-group-1-navigation-work-consolidation.mjs',
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
              if len(line) >= 4
          }
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected:
              raise SystemExit(f'Unexpected files after validation: {sorted(unexpected)}')
          if missing:
              raise SystemExit(f'Expected repair files were not changed: {sorted(missing)}')
          PY

      - name: Commit validated source and remove temporary publishers
        shell: bash
        run: |
          rm .github/workflows/bootstrap-view-as-module-navigation-continuity.yml
          rm .github/workflows/bootstrap-view-as-module-navigation-continuity-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix View-As module navigation continuity"
          git push origin HEAD:fix/view-as-module-navigation-continuity-20260808
