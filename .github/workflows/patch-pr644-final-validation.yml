name: Patch PR 644 Final Validation Contracts

on:
  pull_request:
    paths:
      - '.github/workflows/patch-pr644-final-validation.yml'

permissions:
  contents: write

concurrency:
  group: patch-pr644-final-validation
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'fix/ask-celar-ai-public-questions-resilience-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/ask-celar-ai-public-questions-resilience-20260811
          fetch-depth: 0
          persist-credentials: true

      - name: Patch narrow enterprise and Module 011 validation contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          enterprise = '.github/workflows/celar-ai-enterprise-platform-ci.yml'
          replace_once(
              enterprise,
              "      - '.github/workflows/celar-ai-enterprise-platform-ci.yml'\n",
              "      - '.github/workflows/celar-ai-enterprise-platform-ci.yml'\n"
              "      - '.github/workflows/celar-ai-ask-operations-ci.yml'\n"
              "      - 'database/migrations/084_module_076_celar_ai_defect_operations.sql'\n"
              "      - 'database/rollback/084_module_076_celar_ai_defect_operations_rollback.sql'\n"
              "      - 'tests/test-module-076-celar-ai-defect-operations-migration-084.sh'\n"
              "      - 'tests/validate-celar-ai-public-question-resilience.mjs'\n")
          replace_once(
              enterprise,
              "          elif grep -Fxq 'src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs' <<<\"$CHANGED\"; then\n",
              "          elif [[ \"$HEAD_BRANCH\" == fix/ask-celar-ai-public-questions-resilience-* ]]; then\n"
              "            ALLOWED_DATABASE='^(database/migrations/084_module_076_celar_ai_defect_operations\\.sql|database/rollback/084_module_076_celar_ai_defect_operations_rollback\\.sql)$'\n"
              "            test -f database/migrations/084_module_076_celar_ai_defect_operations.sql\n"
              "            test -f database/rollback/084_module_076_celar_ai_defect_operations_rollback.sql\n"
              "            test -f tests/test-module-076-celar-ai-defect-operations-migration-084.sh\n"
              "            test -f tests/validate-celar-ai-public-question-resilience.mjs\n"
              "            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=MODULE_076_CELAR_AI_DEFECT_OPERATIONS' >> \"$GITHUB_ENV\"\n"
              "          elif grep -Fxq 'src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs' <<<\"$CHANGED\"; then\n")
          replace_once(
              enterprise,
              "          PROHIBITED=\"$(grep -E '^(deployment/|scripts/.*deploy|\\.github/workflows/projectpulse-deploy-|src/backend/ProjectTime\\.Api/Ai/(ProjectPulseAiConfiguration|ProjectPulseAiRemoteProviders|ProjectPulseAiSecretStore)\\.cs|src/backend/ProjectTime\\.Api/Modules/AiProviderConfigurationModule\\.cs)' <<<\"$CHANGED\" || true)\"\n"
              "          if [[ \"$HEAD_BRANCH\" == security/celar-ai-production-readiness-* ]]; then\n",
              "          PROHIBITED=\"$(grep -E '^(deployment/|scripts/.*deploy|\\.github/workflows/projectpulse-deploy-|src/backend/ProjectTime\\.Api/Ai/(ProjectPulseAiConfiguration|ProjectPulseAiRemoteProviders|ProjectPulseAiSecretStore)\\.cs|src/backend/ProjectTime\\.Api/Modules/AiProviderConfigurationModule\\.cs)' <<<\"$CHANGED\" || true)\"\n"
              "          if [[ \"$HEAD_BRANCH\" == fix/ask-celar-ai-public-questions-resilience-* ]]; then\n"
              "            PROHIBITED=\"$(grep -Fvx '.github/workflows/celar-ai-ask-operations-ci.yml' <<<\"$PROHIBITED\" || true)\"\n"
              "            grep -Fxq '.github/workflows/celar-ai-ask-operations-ci.yml' <<<\"$CHANGED\"\n"
              "            grep -Fxq 'tests/validate-celar-ai-public-question-resilience.mjs' <<<\"$CHANGED\"\n"
              "          fi\n"
              "          if [[ \"$HEAD_BRANCH\" == security/celar-ai-production-readiness-* ]]; then\n")

          module011 = 'src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs'
          replace_once(
              module011,
              "    'PublicGeneralQuestion: plan.IntentCode == \"general_knowledge\"',\n",
              "    'PublicGeneralQuestion: publicGeneralQuestion',\n"
              "    'PublicQuestion: publicGeneralQuestion ? question : null',\n"
              "    'PublicGeneralKnowledgeSystemInstruction',\n")

          print('PR644_FINAL_VALIDATION_PATCH=APPLIED')
          PY

      - name: Validate patched files
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs
          node tests/validate-celar-ai-public-question-resilience.mjs
          grep -Fq 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=MODULE_076_CELAR_AI_DEFECT_OPERATIONS' .github/workflows/celar-ai-enterprise-platform-ci.yml
          git diff --check

      - name: Commit permanent validation corrections and remove patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/patch-pr644-final-validation.yml
          git config user.name 'Pulse Celar AI Repair Automation'
          git config user.email 'pulse-celar-ai-repair@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align final Celar AI public-question validation contracts'
          git push origin HEAD:fix/ask-celar-ai-public-questions-resilience-20260811
