name: Verify installed core API security boundaries
on:
  pull_request:
    paths:
      - '.github/workflows/security-installed-core-read-boundaries.yml'
      - 'scripts/security/verify-core-installed-read-boundaries.py'
      - 'tests/security-core-installed-boundaries.test.py'
  workflow_dispatch:
    inputs:
      deployment_run_id:
        description: Successful native protected Test core deployment to verify
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 tests/security-core-installed-boundaries.test.py
      - run: python3 tests/security-installed-read-boundaries.test.py
  installed:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: test
    concurrency:
      group: projectpulse-deploy-test
      cancel-in-progress: false
    env:
      DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
      EVIDENCE_DIR: ${{ github.workspace }}/core-security-private
      SAFE_EVIDENCE_DIR: ${{ github.workspace }}/core-security-safe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate native release and test read-only security boundaries
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_LOGIN_PASSWORD: ${{ secrets.PROJECTPULSE_M087_PASSWORD }}
        run: |
          umask 077
          python3 scripts/security/verify-core-installed-read-boundaries.py
      - name: Publish content-free security results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-installed-security-${{ github.run_id }}
          path: ${{ github.workspace }}/core-security-safe/*.json
          if-no-files-found: ignore
          retention-days: 7
