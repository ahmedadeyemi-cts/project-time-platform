name: Apply reviewed FlowHive source patch
on:
  push:
    branches: ['feature/flowhive-enterprise-psa-revamp-20260906']
    paths: ['.github/flowhive-reviewed-source.patch']
permissions:
  contents: write
concurrency:
  group: flowhive-reviewed-source-apply-872
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'ahmedadeyemi-cts/project-time-platform' && github.ref == 'refs/heads/feature/flowhive-enterprise-psa-revamp-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source hashes and apply scoped text edits
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, re, subprocess, zlib
          request = pathlib.Path('.github/flowhive-reviewed-source.patch')
          if request.stat().st_size > 1500000:
              raise SystemExit('Edit package exceeds limit')
          packed=base64.b64decode(request.read_bytes().strip(),validate=True)
          decoder=zlib.decompressobj(16+zlib.MAX_WBITS)
          payload=decoder.decompress(packed,1500001)
          if len(payload)>1500000 or not decoder.eof or decoder.unused_data:
              raise SystemExit('Invalid bounded edit package')
          changes = json.loads(payload)
          if not isinstance(changes, list) or not 1 <= len(changes) <= 80:
              raise SystemExit('Invalid edit package')
          patterns = [
              r'src/backend/ProjectTime\.Api/Modules/ProjectFlowHive[A-Za-z0-9]*\.cs',
              r'src/backend/ProjectTime\.Api/Modules/ProjectPlanning(AiOrchestrator|DocumentResolver)\.cs',
              r'src/backend/ProjectTime\.Api/Modules/CelarAiProductionPlatformModule\.cs',
              r'src/backend/ProjectTime\.Api/Ai/ProjectFlowHive[A-Za-z0-9]*\.cs',
              r'src/frontend/project-time-web/src/(ProjectFlowHive[A-Za-z0-9]*\.jsx|(?:flowhive-|project-flowhive-|use-flowhive-)[A-Za-z0-9.-]+)',
              r'database/(migrations|rollback)/(103_module_066_flowhive_enterprise_psa_revamp|104_flowhive_bounded_ai_execution)(?:_rollback)?\.sql',
              r'tests/(FlowHive[A-Za-z0-9]+/[A-Za-z0-9._-]+|flowhive-psa-[A-Za-z0-9._-]+)',
              r'docs/modules/module-066-project-flowhive/[A-Za-z0-9._-]+'
          ]
          prepared = {}
          for change in changes:
              name = change['path']
              path = pathlib.Path(name)
              if '..' in path.parts or name in prepared or not any(re.fullmatch(p,name) for p in patterns):
                  raise SystemExit('Out-of-scope or duplicate path: '+name)
              if path.is_symlink() or any(p.is_symlink() for p in path.parents):
                  raise SystemExit('Symbolic link is not permitted')
              before = path.read_bytes() if path.exists() else None
              digest = hashlib.sha256(before).hexdigest() if before is not None else None
              if digest != change['before']:
                  raise SystemExit('Source changed; refusing overwrite: '+name)
              text = (before or b'').decode('utf-8')
              boundary = len(text)
              for edit in sorted(change['edits'], key=lambda e:e['offset'], reverse=True):
                  offset, count = edit['offset'], edit['delete']
                  if not isinstance(offset,int) or not isinstance(count,int) or offset<0 or count<0 or offset+count>boundary:
                      raise SystemExit('Invalid or overlapping edit')
                  text = text[:offset]+edit['text']+text[offset+count:]
                  boundary=offset
              data=text.encode('utf-8')
              if hashlib.sha256(data).hexdigest()!=change['after']:
                  raise SystemExit('Postimage checksum mismatch: '+name)
              prepared[name]=data
          for name,data in prepared.items():
              path=pathlib.Path(name)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          subprocess.run(['git','add','--',*prepared],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('Verified source files:',len(prepared))
          PY
      - name: Commit on the same feature branch without force or deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          branch='feature/flowhive-enterprise-psa-revamp-20260906'
          expected="$(git rev-parse HEAD)"
          actual="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$actual" = "$expected" || { echo 'Branch advanced; refusing to overwrite another change.'; exit 1; }
          git rm .github/flowhive-reviewed-source.patch
          git config user.name 'FlowHive source automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(flowhive): apply hash-verified PSA implementation batch'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
