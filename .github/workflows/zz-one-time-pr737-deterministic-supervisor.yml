name: One-time PR 737 deterministic supervisor

on:
  push:
    branches:
      - fix/shared-project-document-planning-20260819
    paths:
      - .github/workflows/zz-one-time-pr737-deterministic-supervisor.yml

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: pr737-deterministic-supervisor
  cancel-in-progress: true

jobs:
  supervise:
    if: github.event.head_commit.message == 'Start isolated PR 737 deterministic supervisor'
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ahmedadeyemi-cts/project-time-platform
      PR_NUMBER: '737'
      BRANCH_NAME: fix/shared-project-document-planning-20260819
      DEPLOY_WORKFLOW: projectpulse-deploy-test.yml
      EVIDENCE_ROOT: docs/architecture/pr737-evidence
    steps:
      - name: Check out supervisor event
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Cancel stale controllers and execute the deterministic finalizer once
        shell: bash
        run: |
          set -Eeuo pipefail

          workflows=(
            zz-one-time-pr737-validation-boundary-repair.yml
            zz-one-time-pr737-repair-and-protected-uat.yml
            zz-one-time-pr737-recovery.yml
            zz-one-time-pr737-deterministic-finalizer.yml
          )

          for workflow in "${workflows[@]}"; do
            gh run list \
              --repo "$REPOSITORY" \
              --workflow "$workflow" \
              --branch "$BRANCH_NAME" \
              --limit 30 \
              --json databaseId,status 2>/dev/null \
              | jq -r '.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending") | .databaseId' \
              | while read -r run_id; do
                  [[ -z "$run_id" || "$run_id" == "$GITHUB_RUN_ID" ]] && continue
                  gh run cancel "$run_id" --repo "$REPOSITORY" || true
                done
          done

          for _ in $(seq 1 30); do
            active=0
            for workflow in "${workflows[@]}"; do
              count="$(gh run list \
                --repo "$REPOSITORY" \
                --workflow "$workflow" \
                --branch "$BRANCH_NAME" \
                --limit 30 \
                --json status 2>/dev/null \
                | jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length' 2>/dev/null || echo 0)"
              active=$((active + count))
            done
            [[ $active -eq 0 ]] && break
            sleep 2
          done

          git fetch origin "$BRANCH_NAME" main
          git reset --hard "origin/$BRANCH_NAME"

          finalizer='.github/workflows/zz-one-time-pr737-deterministic-finalizer.yml'
          supervisor='.github/workflows/zz-one-time-pr737-deterministic-supervisor.yml'
          if [[ ! -f "$finalizer" ]]; then
            if [[ -f "$EVIDENCE_ROOT/04-protected-uat-passed.md" ]]; then
              gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "PR #${PR_NUMBER} deterministic supervisor found the Protected UAT success marker already published. No duplicate deployment was started. Production mutation: NONE."
              exit 0
            fi
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "PR #${PR_NUMBER} deterministic supervisor could not find the finalizer workflow after resetting to the latest branch head, and the Protected UAT success marker is absent. No Production action was taken."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/zz-one-time-pr737-deterministic-finalizer.yml')
          lines = source.read_text().splitlines()
          step_name = '      - name: Repair, validate, publish, and deploy to Protected UAT/Test'
          try:
              step_index = lines.index(step_name)
          except ValueError as exc:
              raise SystemExit('Deterministic finalizer execution step was not found') from exc

          run_index = None
          for index in range(step_index + 1, len(lines)):
              stripped = lines[index].strip()
              if stripped.startswith('- name:') and index > step_index + 1:
                  break
              if stripped == 'run: |':
                  run_index = index
                  break
          if run_index is None:
              raise SystemExit('Deterministic finalizer multiline run block was not found')

          run_indent = len(lines[run_index]) - len(lines[run_index].lstrip())
          content_indent = run_indent + 2
          script_lines = []
          for line in lines[run_index + 1:]:
              if line.strip():
                  leading = len(line) - len(line.lstrip())
                  if leading < content_indent:
                      break
                  script_lines.append(line[content_indent:])
              else:
                  script_lines.append('')

          if not script_lines or not any('bounded-source-repair' in line for line in script_lines):
              raise SystemExit('Extracted deterministic finalizer script failed integrity validation')

          target = Path('/tmp/pr737-deterministic-finalizer.sh')
          target.write_text('\n'.join(script_lines) + '\n')
          target.chmod(0o700)
          print(f'EXTRACTED_FINALIZER_LINES={len(script_lines)}')
          PY

          rm -f "$supervisor"
          bash /tmp/pr737-deterministic-finalizer.sh
