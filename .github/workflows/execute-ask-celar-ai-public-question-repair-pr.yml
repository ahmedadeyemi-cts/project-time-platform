name: Execute Ask Celar AI Public Question Repair

on:
  pull_request:
    paths:
      - '.github/workflows/apply-ask-celar-ai-public-question-resilience.yml'
      - '.github/workflows/execute-ask-celar-ai-public-question-repair-pr.yml'

permissions:
  contents: write

concurrency:
  group: execute-ask-celar-ai-public-question-repair
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'fix/ask-celar-ai-public-questions-resilience-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/ask-celar-ai-public-questions-resilience-20260811
          fetch-depth: 0
          persist-credentials: true

      - name: Execute bounded patch embedded in the reviewed controller
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('.github/workflows/apply-ask-celar-ai-public-question-resilience.yml')
          text = controller.read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          script = text[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )

          # The original controller used global exact replacements for a few
          # private-generation statements that also occur in probe methods.
          # Remove that one block and apply the same reviewed change only inside
          # CelarAiPrivateGenerationTarget.GenerateAsync below.
          routing_start = script.index("\nrouting = 'src/backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs'\n")
          routing_end = script.index("\ntests = 'tests/CelarAiInternalDataTests/Program.cs'\n", routing_start)
          script = script[:routing_start] + '\n' + script[routing_end:]

          namespace = {'__name__': '__main__'}
          exec(compile(script, str(controller), 'exec'), namespace)

          registry = Path('src/backend/ProjectTime.Api/Ai/CelarAiPublicEntityRegistry.cs')
          registry_content = registry.read_text(encoding='utf-8')
          registry_old = 'flowhive|project\\s+forge|our|my'
          registry_new = 'flowhive|project\\s+forge|project|our|my'
          registry_count = registry_content.count(registry_old)
          if registry_count != 1:
              raise SystemExit(
                  f'public entity internal-project guard: expected one replacement, found {registry_count}')
          registry.write_text(
              registry_content.replace(registry_old, registry_new, 1),
              encoding='utf-8')
          print('CELAR_PUBLIC_INTERNAL_PROJECT_GUARD=APPLIED')

          routing = Path('src/backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs')
          content = routing.read_text(encoding='utf-8')

          def one(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one replacement, found {count}')
              return value.replace(old, new, 1)

          content = one(
              content,
              '''public sealed class CelarAiPrivateGenerationTarget\n{\n    private const string PrivateReadinessPhrase = "CELAR PRIVATE MODEL READY";\n''',
              '''public sealed class CelarAiPrivateGenerationTarget\n{\n    private const string PrivateReadinessPhrase = "CELAR PRIVATE MODEL READY";\n    private const int DefaultHelpAssistantGenerationTimeoutSeconds = 75;\n    private const int MinimumHelpAssistantGenerationTimeoutSeconds = 20;\n    private const int MaximumHelpAssistantGenerationTimeoutSeconds = 180;\n''',
              'private generation constants')

          method_start = content.index(
              '    public async Task<ProjectPulseAiProviderResult> GenerateAsync(',
              content.index('public sealed class CelarAiPrivateGenerationTarget'))
          method_end = content.index(
              '    public async Task<ProjectPulseAiProbeResult> ProbeAsync(',
              method_start)
          method = content[method_start:method_end]

          method = one(
              method,
              '''        try\n        {\n            using var message = new HttpRequestMessage(HttpMethod.Post, endpoint)\n''',
              '''        using var boundedGeneration = CancellationTokenSource.CreateLinkedTokenSource(cancellationToken);\n        if (string.Equals(\n                request.Feature,\n                CelarAiCapabilityCatalog.HelpAssistant,\n                StringComparison.OrdinalIgnoreCase))\n        {\n            boundedGeneration.CancelAfter(TimeSpan.FromSeconds(EnvironmentInteger(\n                "PROJECTPULSE_CELAR_AI_HELP_GENERATION_TIMEOUT_SECONDS",\n                DefaultHelpAssistantGenerationTimeoutSeconds,\n                MinimumHelpAssistantGenerationTimeoutSeconds,\n                MaximumHelpAssistantGenerationTimeoutSeconds)));\n        }\n        var generationToken = boundedGeneration.Token;\n\n        try\n        {\n            using var message = new HttpRequestMessage(HttpMethod.Post, endpoint)\n''',
              'private generation timeout scope')
          method = one(
              method,
              '            using var response = await client.SendAsync(message, HttpCompletionOption.ResponseHeadersRead, cancellationToken);\n',
              '            using var response = await client.SendAsync(message, HttpCompletionOption.ResponseHeadersRead, generationToken);\n',
              'private generation send token')
          method = one(
              method,
              '''                        response,\n                        cancellationToken))\n''',
              '''                        response,\n                        generationToken))\n''',
              'private generation refusal token')
          method = one(
              method,
              '''            using var json = await PulseAiPrivateModelResponsePolicy.ReadBoundedJsonAsync(\n                response.Content,\n                cancellationToken);\n''',
              '''            using var json = await PulseAiPrivateModelResponsePolicy.ReadBoundedJsonAsync(\n                response.Content,\n                generationToken);\n''',
              'private generation response token')
          method = one(
              method,
              '''        catch (OperationCanceledException) when (cancellationToken.IsCancellationRequested)\n        {\n            throw;\n        }\n        catch (Exception exception)\n        {\n            _logger.LogWarning(\n                exception,\n                "Celar AI private generation failed without logging prompt, endpoint, token, or source content. Feature={Feature}",\n                request.Feature);\n            return Unavailable("celar_ai_private_transport_failure");\n        }\n    }\n\n''',
              '''        catch (OperationCanceledException) when (!cancellationToken.IsCancellationRequested)\n        {\n            _logger.LogWarning(\n                "Celar AI private generation reached its bounded timeout without logging prompt, endpoint, token, or source content. Feature={Feature}",\n                request.Feature);\n            return Unavailable("celar_ai_private_generation_timeout");\n        }\n        catch (OperationCanceledException) when (cancellationToken.IsCancellationRequested)\n        {\n            throw;\n        }\n        catch (Exception exception)\n        {\n            _logger.LogWarning(\n                exception,\n                "Celar AI private generation failed without logging prompt, endpoint, token, or source content. Feature={Feature}",\n                request.Feature);\n            return Unavailable("celar_ai_private_transport_failure");\n        }\n    }\n\n''',
              'private generation timeout catch')

          content = content[:method_start] + method + content[method_end:]
          content = one(
              content,
              '    private static string ReadContent(JsonElement root)\n',
              '''    private static int EnvironmentInteger(\n        string name,\n        int fallback,\n        int minimum,\n        int maximum) =>\n        int.TryParse(Environment.GetEnvironmentVariable(name), out var value)\n            ? Math.Clamp(value, minimum, maximum)\n            : fallback;\n\n    private static string ReadContent(JsonElement root)\n''',
              'private generation environment integer')
          routing.write_text(content, encoding='utf-8')
          print('CELAR_PRIVATE_GENERATION_METHOD_SCOPED_PATCH=APPLIED')
          PY

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Validate focused routing and static contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/validate-celar-ai-public-question-resilience.mjs
          dotnet run --project tests/CelarAiInternalDataTests/CelarAiInternalDataTests.csproj --configuration Release -p:ProjectPulseSourceRevision=1111111111111111111111111111111111111111
          git diff --check

      - name: Commit permanent repair and remove temporary controllers
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/apply-ask-celar-ai-public-question-resilience.yml \
            .github/workflows/execute-ask-celar-ai-public-question-repair-pr.yml
          git diff --check
          git config user.name 'Pulse Celar AI Repair Automation'
          git config user.email 'pulse-celar-ai-repair@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Ask Celar AI public questions and final validation gates'
          git push origin HEAD:fix/ask-celar-ai-public-questions-resilience-20260811
