name: Prepare exact FlowHive controller trigger-safety object
on:
  push:
    branches: ['tooling/flowhive-psa-controller-object-20260906']
    paths: ['.github/workflows/flowhive-psa-controller-object.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'ahmedadeyemi-cts/project-time-platform' && github.actor == 'ahmedadeyemi-cts'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare reviewed immutable blob only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          data=pathlib.Path('.github/workflows/projectpulse-deploy-test.yml').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='cd50f216877e4ae2c7493dfa578dd5a18a93407c06faebbeb4b736475c985b66'
          old="      - '.github/workflows/projectpulse-deploy-test.yml'\n"
          text=data.decode()
          assert text.count(old)==1
          text=text.replace(old,'      # Controller-only changes are reviewed separately; deploy applications\n      # through the exact owner-authorized workflow_dispatch path.\n',1)
          after=text.encode()
          assert hashlib.sha256(after).hexdigest()=='beed7ee641864524bf8598322f558b41c5dde0b6a8c9b8e6aa0243fee143919a'
          body=json.dumps({'content':text,'encoding':'utf-8'}).encode()
          request=urllib.request.Request('https://api.github.com/repos/ahmedadeyemi-cts/project-time-platform/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=30) as response:result=json.load(response)
          assert result['sha']=='e84f5399aeee80c1328b0456d7ab6c564fbab305'
          print('VERIFIED_CONTROLLER_BLOB='+result['sha'])
          print('REF_UPDATES=0 ENVIRONMENT_MUTATIONS=0')
          PY
