name: Validate Ask Celar AI Universal Answer Reliability

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/celar-ai-universal-answer-reliability-ci.yml'
      - 'src/backend/ProjectTime.Api/Ai/CelarAiUniversal*.cs'
      - 'src/backend/ProjectTime.Api/Ai/CelarAiDeterministicIntentPolicy.cs'
      - 'src/backend/ProjectTime.Api/Ai/CelarAiExecutionGovernance.cs'
      - 'src/backend/ProjectTime.Api/Modules/CelarAiUniversalAnswerReliabilityModule.cs'
      - 'src/backend/ProjectTime.Api/Directory.Build.targets'
      - 'src/backend/ProjectTime.Api/build/generate-celar-ai-universal-answer-reliability.awk'
      - 'src/frontend/project-time-web/src/CelarAiAnswerReliabilityWorkbench.jsx'
      - 'src/frontend/project-time-web/src/celar-ai-answer-reliability-workbench.css'
      - 'src/frontend/project-time-web/scripts/inject-celar-ai-universal-answer-reliability.mjs'
      - 'tests/CelarAiUniversalAnswerReliabilityTests/**'
      - 'tests/celar-ai-universal-answer-evaluation-cases.json'
      - 'tests/validate-celar-ai-pr630-consolidated.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celar-ai-universal-answer-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate planning, evidence gates, privacy, API, and UI
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Validate consolidated source and evidence contracts
        run: node tests/validate-celar-ai-pr630-consolidated.mjs

      - name: Run deterministic reliability tests
        run: dotnet run --project tests/CelarAiUniversalAnswerReliabilityTests/CelarAiUniversalAnswerReliabilityTests.csproj --configuration Release

      - name: Build complete API
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Build complete frontend
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Ensure validation restored tracked source
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git diff --exit-code

      - name: Publish source-only summary
        run: |
          echo 'CELAR_AI_UNIVERSAL_ANSWER_RELIABILITY=SOURCE_VALIDATED'
          echo 'CELAR_AI_UNIVERSAL_ANSWER_EVALUATION_CASES=120'
          echo 'CELAR_AI_UNIVERSAL_ANSWER_TEST_DEPLOYMENTS=0'
          echo 'CELAR_AI_UNIVERSAL_ANSWER_PRODUCTION_MUTATIONS=0'
