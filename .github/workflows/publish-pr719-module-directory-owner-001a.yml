          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}: {old[:120]!r}')
              write(path, source.replace(old, new, 1))

          def replace_section(path, start, end, replacement):
              source = read(path)
              start_index = source.find(start)
              if start_index < 0:
                  raise SystemExit(f'{path}: start marker not found: {start[:120]!r}')
              if source.find(start, start_index + 1) >= 0:
                  raise SystemExit(f'{path}: start marker is not unique: {start[:120]!r}')
              end_index = source.find(end, start_index + len(start))
              if end_index < 0:
                  raise SystemExit(f'{path}: end marker not found: {end[:120]!r}')
              write(path, source[:start_index] + replacement + source[end_index:])

