  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out exact source branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/module-directory-owner-001a-continuity-20260818
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the reviewed source repair
        shell: bash
        run: |
          set -Eeuo pipefail
