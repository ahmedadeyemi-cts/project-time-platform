name: Publish PR 719 Module Directory and 001A Repair

on:
  push:
    branches:
      - fix/module-directory-owner-001a-continuity-20260818
    paths:
      - '.github/workflows/publish-pr719-module-directory-owner-001a.yml'

permissions:
  contents: write

concurrency:
  group: publish-pr719-module-directory-owner-001a
  cancel-in-progress: false

