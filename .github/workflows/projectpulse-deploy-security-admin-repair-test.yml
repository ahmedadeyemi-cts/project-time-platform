name: ProjectPulse Deploy Security and Admin Repair Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified source release containing the security and Module 013 repairs
        required: true
        default: 845fb2d90affd808d2ec06175afcffa04863abe0
        type: string
      confirmation:
        description: Enter DEPLOY-SECURITY-ADMIN-REPAIR-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-security-admin-repair-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded security, role-policy, Microsoft, CRM, and Module 013 test deployment
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_RELEASE_COMMIT: 845fb2d90affd808d2ec06175afcffa04863abe0

    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact repaired source release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and validate exact repaired release
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$WORKFLOW_SOURCE_REF" == 'refs/heads/main' ]] || {
            echo 'Dispatch this workflow from main.' >&2
            exit 1
          }
          [[ "$DISPATCH_CONFIRMATION" == 'DEPLOY-SECURITY-ADMIN-REPAIR-TO-TEST' ]] || {
            echo 'The deployment confirmation text does not match.' >&2
            exit 1
          }
          [[ "$DISPATCH_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release_commit must be a complete 40-character SHA.' >&2
            exit 1
          }

          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == "$WORKFLOW_SOURCE_SHA" ]]
          [[ "$TARGET_COMMIT" == "$DISPATCH_RELEASE_COMMIT" ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || {
            echo 'Only the verified security and admin repair source release may deploy.' >&2
            exit 1
          }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || {
            echo 'The source release is not an ancestor of the deployment controls.' >&2
            exit 1
          }

          ROLE_TRANSPORT='release/src/frontend/project-time-web/src/role-policy-authoritative-transport.js'
          PUBLIC_ORIGIN='release/src/backend/ProjectTime.Api/Modules/ProjectPulsePublicOriginCompatibility.cs'
          REGISTRAR='release/src/backend/ProjectTime.Api/Modules/GlobalMailConfigurationModule.cs'
          NGINX='release/deployment/containers/web/default.conf.template'
          MODULE013='release/src/frontend/project-time-web/src/ServiceControlCenter.jsx'
          MODULE026='release/src/backend/ProjectTime.Api/Modules/CrmErpIntegrationModule.cs'

          for required in \
            "$ROLE_TRANSPORT" "$PUBLIC_ORIGIN" "$REGISTRAR" "$NGINX" "$MODULE013" "$MODULE026" \
            release/src/backend/ProjectTime.Api/ProjectTime.Api.csproj \
            release/tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj \
            release/tests/test-projectpulse-api-startup.sh \
            release/src/frontend/project-time-web/scripts/validate-security-role-policy-public-origin.mjs \
            release/src/frontend/project-time-web/scripts/validate-admin-runtime-stability.mjs \
            release/src/frontend/project-time-web/scripts/validate-microsoft-integration-authoritative-connection.mjs \
            release/src/frontend/project-time-web/scripts/validate-microsoft-sso-runtime-wiring.mjs \
            release/src/frontend/project-time-web/scripts/validate-group-2a-provider-neutral-platform-operations.mjs \
            release/src/frontend/project-time-web/scripts/validate-global-view-as-drawer.mjs \
            control/scripts/build-pr55-acr-image.sh \
            control/scripts/wait-containerapp-ready-revision.sh \
            control/scripts/run-security-admin-repair-test-deployment.sh; do
            test -f "$required"
          done

          grep -Fq 'projectpulse-role-policy-authoritative-v3' "$ROLE_TRANSPORT"
          grep -Fq "requiredCollections: ['actions', 'scopes']" "$ROLE_TRANSPORT"
          grep -Fq "requiredCollections: ['roles', 'modules', 'grants']" "$ROLE_TRANSPORT"
          grep -Fq '/api/runtime/v2/role-policy/catalog' "$ROLE_TRANSPORT"
          grep -Fq '/api/runtime/v2/role-policy/matrix' "$ROLE_TRANSPORT"
          grep -Fq "if (requestMethod(input, init) !== 'GET')" "$ROLE_TRANSPORT"

          grep -Fq 'UseProjectPulsePublicOriginCompatibility' "$REGISTRAR"
          grep -Fq 'trusted_public_origin_unavailable' "$REGISTRAR"
          grep -Fq 'trusted_forwarded_origin' "$PUBLIC_ORIGIN"
          grep -Fq '.onenecklab.com' "$PUBLIC_ORIGIN"
          grep -Fq '.ussignal.com' "$PUBLIC_ORIGIN"
          grep -Fq 'EnsureCrmErpEncryptionKey' "$PUBLIC_ORIGIN"
          grep -Fq 'ProjectPulse-CRM-ERP-Integration:' "$PUBLIC_ORIGIN"
          grep -Fq 'CryptographicOperations.ZeroMemory' "$PUBLIC_ORIGIN"

          grep -Fq 'map $http_x_forwarded_proto $projectpulse_forwarded_proto' "$NGINX"
          grep -Fq 'proxy_set_header X-Forwarded-Proto $projectpulse_forwarded_proto;' "$NGINX"
          ! grep -Fq 'proxy_set_header X-Forwarded-Proto $scheme;' "$NGINX"

          grep -Fq 'const [volumeExpanded, setVolumeExpanded] = useState(false)' "$MODULE013"
          grep -Fq 'data-module-013-volume-control="collapsed-by-default"' "$MODULE013"
          grep -Fq 'aria-expanded={volumeExpanded}' "$MODULE013"
          grep -Fq 'hidden={!volumeExpanded}' "$MODULE013"
          grep -Fq 'Show volume details' "$MODULE013"
          grep -Fq 'Hide volume details' "$MODULE013"

          grep -Fq 'MapPut("/providers/{providerKey}/credential"' "$MODULE026"
          grep -Fq 'IsViewAs(context)' "$MODULE026"
          grep -Fq 'credentialsAreWriteOnly = true' "$MODULE026"
          grep -Fq 'encryptedStoreRequired = true' "$MODULE026"

          (
            cd release
            dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
            dotnet run \
              --project tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj \
              --configuration Release
            bash tests/test-projectpulse-api-startup.sh
          )

          (
            cd release/src/frontend/project-time-web
            npm ci --no-audit --no-fund
            node scripts/validate-security-role-policy-public-origin.mjs
            node scripts/validate-admin-runtime-stability.mjs
            node scripts/validate-microsoft-integration-authoritative-connection.mjs
            node scripts/validate-microsoft-sso-runtime-wiring.mjs
            node scripts/validate-group-2a-provider-neutral-platform-operations.mjs
            node scripts/validate-global-view-as-drawer.mjs
            npm run validate:module026
            npm run validate:modules021026
            npm run build
          )

          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'SECURITY_ADMIN_REPAIR_SOURCE_VALIDATION=PASS'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build, deploy, validate, and preserve rollback evidence
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: >-
          bash control/scripts/run-security-admin-repair-test-deployment.sh
          control
          release
          '${{ steps.release.outputs.target_commit }}'

      - name: Upload immutable deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: security-admin-repair-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: control/evidence/security-admin-repair-test-deployment.json
          retention-days: 30
