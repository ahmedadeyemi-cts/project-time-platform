name: PR1151 and PR1152 exact UAT supersession checks
on:
  pull_request:
    paths:
      - '.github/workflows/pr1151-uat-supersession-ci.yml'
      - '.github/workflows/module025-protected-uat-control.yml'
      - 'scripts/release-test/verify-pr1151-uat-supersession.py'
      - 'scripts/release-test/validate-protected-test-controller-branches.sh'
      - 'tests/pr1151-uat-supersession-scope.py'
      - 'tests/test-pr1151-uat-supersession.py'
      - 'tests/pr1140-uat-recovery-scope.py'
permissions:
  contents: read
concurrency:
  group: pr1151-uat-supersession-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact repair and frozen deployment authority
        if: github.head_ref == 'fix/pr1151-uat-orphan-20260923'
        run: python3 tests/pr1151-uat-supersession-scope.py
      - name: Exercise new and retained negative cases without live access
        run: |
          python3 tests/test-pr1151-uat-supersession.py -v
          python3 tests/test-pr1139-uat-recovery.py -v
          python3 tests/test-pr1140-uat-recovery.py -v
          python3 tests/test-pr1140-migration-retry-recovery.py -v
          if [[ "$GITHUB_HEAD_REF" != 'fix/flowhive-protected-uat-idempotent-20260927' && "$GITHUB_HEAD_REF" != 'fix/flowhive-phase-semantics-delete-plan-20260927' && "$GITHUB_HEAD_REF" != 'feature/flowhive-enterprise-pm-ux-notifications-20260927' && "$GITHUB_HEAD_REF" != 'fix/flowhive-live-normalize-and-replace-invalid-ai-draft-20260927' && "$GITHUB_HEAD_REF" != 'fix/flowhive-unified-phase-contract-uat-20260927' ]]; then node tests/module025-deployment-startup-recovery.test.mjs; fi
          node tests/validate-systemwide-image-build-controller.mjs
      - name: Require untouched Test and production deployment code and source stability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_HEAD_REF" == 'codex/flowhive-save-schedule-approval-polish' ]]; then
            python3 tests/flowhive-save-release/scope.py
            python3 tests/flowhive-save-release/test_scope.py
          elif [[ "$GITHUB_HEAD_REF" == 'codex/approval-routing-bulk-review' ]]; then
            python3 tests/combined-release/scope.py
            python3 tests/combined-release/test_scope.py
          elif [[ "$GITHUB_HEAD_REF" == 'feature/pulse-services-cutover-laya-20260930' ]]; then
            python3 tests/pulse-services-release/scope.py
            python3 tests/pulse-services-release/test_scope.py
          elif [[ "$GITHUB_HEAD_REF" == 'feature/pulse-documents-integration-20260930' ]]; then
            python3 tests/pulse-document-integration/scope.py
            python3 tests/pulse-document-integration/test_scope.py
          elif [[ "$GITHUB_HEAD_REF" == 'fix/uat-provider-answer-contract-20260930' ]]; then
            python3 tests/uat-provider-answer/scope.py
            python3 tests/uat-provider-answer/test_scope.py
          elif [[ "$GITHUB_HEAD_REF" == 'fix/security-audit-followup-20260929' ]]; then
            python3 tests/security-audit-followup/scope.py
            python3 tests/security-audit-followup/test_scope.py
          elif [[ "$GITHUB_HEAD_REF" == 'fix/security-uat-acceptance-20260929' ]]; then
            python3 tests/security-uat-acceptance/scope.py
            python3 tests/security-uat-acceptance/test_scope.py
          elif [[ "$GITHUB_HEAD_REF" == 'fix/security-uat-followup-20260929' ]]; then
            python3 tests/security-uat-followup/scope.py
            python3 tests/security-uat-followup/test_scope.py
          elif [[ "$GITHUB_HEAD_REF" == 'fix/security-complete-20260929' ]]; then
            python3 tests/security-completion/scope.py
            python3 tests/security-completion/test_scope.py
          elif [[ "$GITHUB_HEAD_REF" == 'fix/security-team-findings-20260928' ]]; then
            python3 tests/security-release/scope.py
            python3 tests/security-release/test_scope.py
          elif [[ "$GITHUB_HEAD_REF" == 'codex/module060-approval-contract-funding' ]]; then
            python3 tests/contracts-release/scope.py
            python3 tests/contracts-release/test_scope.py
          elif [[ "$GITHUB_HEAD_REF" == 'feature/module065-email-teams-notification-parity-20260928' ]]; then
            python3 tests/notification-parity/release_scope.py
            python3 tests/notification-parity/test_release_scope.py
          elif [[ "$GITHUB_HEAD_REF" == 'fix/enterprise-ux-consistency-20260928' ]]; then
            python3 tests/enterprise-ux-release-scope.py
            git diff --exit-code "$BASE_SHA" HEAD -- database .github/workflows/projectpulse-deploy-test.yml .github/workflows/projectpulse-deploy-production.yml
          elif [[ "$GITHUB_HEAD_REF" == 'fix/flowhive-unified-phase-contract-uat-20260927' ]]; then
            git diff --exit-code "$BASE_SHA" HEAD -- database .github/workflows/projectpulse-deploy-test.yml .github/workflows/projectpulse-deploy-production.yml
          elif [[ "$GITHUB_HEAD_REF" == 'fix/flowhive-live-normalize-and-replace-invalid-ai-draft-20260927' ]]; then
            git diff --exit-code "$BASE_SHA" HEAD -- database .github/workflows/projectpulse-deploy-test.yml .github/workflows/projectpulse-deploy-production.yml
          elif [[ "$GITHUB_HEAD_REF" == 'feature/flowhive-enterprise-pm-ux-notifications-20260927' ]]; then
            git diff --exit-code "$BASE_SHA" HEAD -- database .github/workflows/projectpulse-deploy-test.yml .github/workflows/projectpulse-deploy-production.yml
          elif [[ "$GITHUB_HEAD_REF" == 'fix/flowhive-phase-semantics-delete-plan-20260927' ]]; then
            git diff --exit-code "$BASE_SHA" HEAD -- database .github/workflows/projectpulse-deploy-test.yml .github/workflows/projectpulse-deploy-production.yml
          elif [[ "$GITHUB_HEAD_REF" == 'fix/flowhive-protected-uat-idempotent-20260927' ]]; then
            python3 tests/flowhive-protected-uat-idempotent-scope.py
            git diff --exit-code "$BASE_SHA" HEAD -- src database .github/workflows/projectpulse-deploy-production.yml
          elif [[ "$GITHUB_HEAD_REF" == 'control/pr1153-source-registration-20260923' ]]; then
            python3 tests/laya/release-registration.py --control
            git diff --exit-code "$BASE_SHA" HEAD -- src .github/workflows/projectpulse-deploy-production.yml
            git diff --exit-code
          else
            git diff --exit-code "$BASE_SHA" HEAD -- src database .github/workflows/projectpulse-deploy-test.yml .github/workflows/projectpulse-deploy-production.yml
            git diff --exit-code
            git diff --check "$BASE_SHA" HEAD
          fi
          git diff --check "$BASE_SHA" HEAD
