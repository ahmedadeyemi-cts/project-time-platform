name: Validate Celar AI Enterprise Platform Interface

on:
  push:
    branches:
      - feature/celar-ai-enterprise-platform-interface-20260801
  pull_request:
    paths:
      - '.github/workflows/celar-ai-enterprise-platform-ci.yml'
      - 'database/migrations/061_celar_ai_capability_routing.sql'
      - 'database/rollback/061_celar_ai_capability_routing_rollback.sql'
      - 'database/migrations/071_ai_runtime_production_hardening.sql'
      - 'database/rollback/071_ai_runtime_production_hardening_rollback.sql'
      - 'database/migrations/072_celar_ai_conversation_attachments.sql'
      - 'database/rollback/072_celar_ai_conversation_attachments_rollback.sql'
      - 'database/migrations/073_module_033_project_forge_interactive.sql'
      - 'database/rollback/073_module_033_project_forge_interactive_rollback.sql'
      - 'docs/modules/module-011-pulse-ai/CELAR-AI-ENTERPRISE-PLATFORM-INTERFACE.md'
      - 'docs/modules/module-064-ai-provider-configuration/CELAR-AI-CAPABILITY-ROUTING.md'
      - 'docs/modules/module-064-ai-provider-configuration/celar-ai-default-capability-routes.json'
      - 'src/backend/ProjectTime.Api/Directory.Build.targets'
      - 'src/backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs'
      - 'src/backend/ProjectTime.Api/Ai/ProjectPulseAiEncryptionKeyRing.cs'
      - 'src/backend/ProjectTime.Api/Ai/ProjectPulseAiEncryptionRotationService.cs'
      - 'src/backend/ProjectTime.Api/Ai/ProjectPulseAiSecretStore.cs'
      - 'src/backend/ProjectTime.Api/Ai/CelarAiEnterprisePlatformContracts.cs'
      - 'src/backend/ProjectTime.Api/Ai/CelarAiEnterprisePlatformService.cs'
      - 'src/backend/ProjectTime.Api/Ai/CelarAiExternalReasoningService.cs'
      - 'src/backend/ProjectTime.Api/Ai/CelarAiPeopleAndGuidanceService.cs'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiEscalationSanitizer.cs'
      - 'src/backend/ProjectTime.Api/Ai/ProjectPulseAiServiceCollectionExtensions.cs'
      - 'src/backend/ProjectTime.Api/Modules/CelarAiBrandModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/CelarAiCapabilityRoutingModule.cs'
      - 'src/backend/ProjectTime.Api/Modules/CelarAiEnterprisePlatformModule.cs'
      - 'src/frontend/project-time-web/scripts/inject-celar-ai-capability-routing.mjs'
      - 'src/frontend/project-time-web/scripts/inject-celar-ai-contextual-chat-workspace.mjs'
      - 'src/frontend/project-time-web/scripts/inject-celar-ai-enterprise-chat-context.mjs'
      - 'src/frontend/project-time-web/scripts/inject-celar-ai-runtime-rebrand.mjs'
      - 'src/frontend/project-time-web/scripts/validate-celar-ai-enterprise-platform.mjs'
      - 'src/frontend/project-time-web/src/CelarAiArchitectureOverview.jsx'
      - 'src/frontend/project-time-web/src/CelarAiCapabilityRoutingPanel.jsx'
      - 'src/frontend/project-time-web/src/CelarAiEnterprisePlatform.jsx'
      - 'src/frontend/project-time-web/src/CelarAiSolutionComposer.jsx'
      - 'src/frontend/project-time-web/src/WorkTaskBuilderPanel.jsx'
      - 'src/frontend/project-time-web/src/celar-ai-architecture-overview.css'
      - 'src/frontend/project-time-web/src/celar-ai-capability-routing-panel.css'
      - 'src/frontend/project-time-web/src/celar-ai-contextual-chat.css'
      - 'src/frontend/project-time-web/src/celar-ai-enterprise-chat-context.css'
      - 'src/frontend/project-time-web/src/celar-ai-enterprise-platform.css'
      - 'src/frontend/project-time-web/src/celar-ai-solution-composer.css'

permissions:
  contents: read

concurrency:
  group: celar-ai-enterprise-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: projectpulse
          POSTGRES_PASSWORD: projectpulse
          POSTGRES_DB: projectpulse_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectpulse -d projectpulse_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify isolated source and protected boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          HEAD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch origin "$BASE_BRANCH" --no-tags
          BASE="$(git merge-base "origin/$BASE_BRANCH" HEAD)"
          test -n "$BASE"
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          printf '%s\n' "$CHANGED"
          test -n "$CHANGED"

          if [[ "$HEAD_BRANCH" == security/celar-ai-production-readiness-* ]]; then
            ALLOWED_DATABASE='^(database/migrations/071_ai_runtime_production_hardening\.sql|database/rollback/071_ai_runtime_production_hardening_rollback\.sql)$'
            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=PRODUCTION_HARDENING' >> "$GITHUB_ENV"
          elif [[ "$HEAD_BRANCH" == release/consolidated-enterprise-validation-* ]]; then
            ALLOWED_DATABASE='^(database/(migrations/(061_celar_ai_capability_routing|062_super_administrator_permanent_full_control|063_project_management_billing_role_access_repair|064_module_065_enterprise_notification_orchestration)\.sql|rollback/(061_celar_ai_capability_routing_rollback|062_super_administrator_permanent_full_control_rollback|063_project_management_billing_role_access_repair_rollback|064_module_065_enterprise_notification_orchestration_rollback)\.sql))$'
            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=CONSOLIDATED_RELEASE' >> "$GITHUB_ENV"
          elif [[ "$HEAD_BRANCH" == feature/celar-ai-unified-chat-routing-attachments-* ]]; then
            ALLOWED_DATABASE='^(database/migrations/072_celar_ai_conversation_attachments\.sql|database/rollback/072_celar_ai_conversation_attachments_rollback\.sql)$'
            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=UNIFIED_CHAT_ATTACHMENTS' >> "$GITHUB_ENV"
          elif [[ "$HEAD_BRANCH" == feature/celar-ai-flowhive-production-* ]]; then
            ALLOWED_DATABASE='^(database/migrations/074_module_066_project_flowhive_production\.sql|database/rollback/074_module_066_project_flowhive_production_rollback\.sql)$'
            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=FLOWHIVE_PRODUCTION' >> "$GITHUB_ENV"
          elif [[ "$HEAD_BRANCH" == feature/module-066-flowhive-ai-planner-* ]]; then
            ALLOWED_DATABASE='^(database/migrations/079_coordinated_runtime_ai_document_rbac_repair\.sql|database/rollback/079_coordinated_runtime_ai_document_rbac_repair_rollback\.sql)$'
            test -f tests/test-coordinated-document-bridge-migration-079.sh
            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=COORDINATED_FLOWHIVE_DOCUMENT_BRIDGE' >> "$GITHUB_ENV"
          elif [[ "$HEAD_BRANCH" == feature/celar-ai-internal-data-intelligence-* ]]; then
            ALLOWED_DATABASE='^(database/migrations/(080_celar_ai_internal_data_intelligence|081_celar_ai_private_runtime_activation)\.sql|database/rollback/(080_celar_ai_internal_data_intelligence_rollback|081_celar_ai_private_runtime_activation_rollback)\.sql)$'
            test -f tests/test-celar-ai-internal-data-migration-080.sh
            test -f tests/test-celar-ai-private-runtime-activation-migration-081.sh
            test -f .github/workflows/projectpulse-deploy-celar-ai-private-runtime-test.yml
            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=PRIVATE_RUNTIME_INTERNAL_DATA' >> "$GITHUB_ENV"
          elif grep -Fxq 'src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs' <<<"$CHANGED"; then
            # Module 033 owns its review-first Project Forge persistence while
            # consuming the governed Celar AI capability router. Permit only
            # that module's guarded base and interactive migration pairs.
            ALLOWED_DATABASE='^(database/migrations/(070_module_033_project_forge|073_module_033_project_forge_interactive)\.sql|database/rollback/(070_module_033_project_forge_rollback|073_module_033_project_forge_interactive_rollback)\.sql)$'
            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=MODULE_033_PROJECT_FORGE' >> "$GITHUB_ENV"
          elif grep -Fxq 'tests/test-uat-functional-completion-contract.sh' <<<"$CHANGED"; then
            # A UAT functional-completion package owns only the immutable project-number
            # migration. Celar AI is validated as a consumer because its private
            # document resolvers accept current project numbers and retained aliases.
            ALLOWED_DATABASE='^(database/migrations/066_immutable_project_numbers\.sql|database/rollback/066_immutable_project_numbers_rollback\.sql)$'
            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=UAT_FUNCTIONAL_COMPLETION' >> "$GITHUB_ENV"
          else
            ALLOWED_DATABASE='^(database/migrations/061_celar_ai_capability_routing\.sql|database/rollback/061_celar_ai_capability_routing_rollback\.sql)$'
            echo 'CELAR_AI_ENTERPRISE_VALIDATION_MODE=OWNED_SOURCE' >> "$GITHUB_ENV"
          fi

          DISALLOWED_DATABASE="$(grep '^database/' <<<"$CHANGED" | grep -Ev "$ALLOWED_DATABASE" || true)"
          if [[ -n "$DISALLOWED_DATABASE" ]]; then
            echo 'The Celar AI enterprise package changed an unapproved database file for this validation mode:' >&2
            printf '%s\n' "$DISALLOWED_DATABASE" >&2
            exit 1
          fi

          PROHIBITED="$(grep -E '^(deployment/|scripts/.*deploy|\.github/workflows/projectpulse-deploy-|src/backend/ProjectTime\.Api/Ai/(ProjectPulseAiConfiguration|ProjectPulseAiRemoteProviders|ProjectPulseAiSecretStore)\.cs|src/backend/ProjectTime\.Api/Modules/AiProviderConfigurationModule\.cs)' <<<"$CHANGED" || true)"
          if [[ "$HEAD_BRANCH" == security/celar-ai-production-readiness-* ]]; then
            PROHIBITED="$(grep -Fvx \
              -e 'src/backend/ProjectTime.Api/Ai/ProjectPulseAiSecretStore.cs' \
              -e 'src/backend/ProjectTime.Api/Modules/AiProviderConfigurationModule.cs' \
              <<<"$PROHIBITED" || true)"
            test -f .github/workflows/celar-ai-production-hardening-ci.yml
            test -f database/migrations/071_ai_runtime_production_hardening.sql
            test -f database/rollback/071_ai_runtime_production_hardening_rollback.sql
            test -f src/frontend/project-time-web/scripts/validate-celar-ai-production-readiness.mjs
          fi
          if [[ "$HEAD_BRANCH" == release/consolidated-enterprise-validation-* ]]; then
            PROHIBITED="$(grep -Fvx 'deployment/containers/web/Dockerfile' <<<"$PROHIBITED" || true)"
          fi
          if [[ "$HEAD_BRANCH" == feature/celar-ai-flowhive-production-* ]]; then
            PROHIBITED="$(grep -Fvx 'src/backend/ProjectTime.Api/Modules/AiProviderConfigurationModule.cs' <<<"$PROHIBITED" || true)"
          fi
          if [[ "$HEAD_BRANCH" == feature/celar-ai-internal-data-intelligence-* ]]; then
            PROHIBITED="$(grep -Fvx \
              '.github/workflows/projectpulse-deploy-celar-ai-private-runtime-test.yml' \
              <<<"$PROHIBITED" || true)"
          elif [[ "$HEAD_BRANCH" == fix/timesheet-ai-opencloud-deferred-release-* ]]; then
            PROHIBITED="$(grep -Fvx \
              -e '.github/workflows/projectpulse-deploy-celar-ai-private-runtime-test.yml' \
              -e 'deployment/environments/opencloud-template.yml' \
              -e 'deployment/podman/README.md' \
              -e 'deployment/podman/compose.yml' \
              -e 'deployment/podman/private-runtime.env.example' \
              <<<"$PROHIBITED" || true)"
            for required in \
              '.github/workflows/projectpulse-deploy-celar-ai-private-runtime-test.yml' \
              'deployment/environments/opencloud-template.yml' \
              'deployment/podman/README.md' \
              'deployment/podman/compose.yml' \
              'deployment/podman/private-runtime.env.example' \
              'tests/validate-celar-ai-opencloud-deferred-runtime.mjs'; do
              test -f "$required"
              grep -Fxq "$required" <<<"$CHANGED"
            done
            grep -Fq 'workflow_dispatch:' .github/workflows/projectpulse-deploy-celar-ai-private-runtime-test.yml
            grep -Fq 'DEPLOY-CELAR-AI-OPENCLOUD-RUNTIME-TO-TEST' .github/workflows/projectpulse-deploy-celar-ai-private-runtime-test.yml
            ! grep -Eq '^[[:space:]]{2}push:' .github/workflows/projectpulse-deploy-celar-ai-private-runtime-test.yml
            grep -Fq 'status: deferred-until-opencloud' deployment/environments/opencloud-template.yml
          elif [[ "$HEAD_BRANCH" == release/test-b1335bd2-timesheet-ai-* ]]; then
            CONTROLLER='.github/workflows/projectpulse-deploy-test.yml'
            CONTROLLER_VALIDATOR='.github/workflows/projectpulse-release-test-control-ci.yml'
            PRIVATE_RUNTIME='.github/workflows/projectpulse-deploy-celar-ai-private-runtime-test.yml'
            HISTORICAL_HOTFIX='.github/workflows/projectpulse-deploy-modules-runtime-hotfix-test.yml'
            MIGRATOR='scripts/release-test/apply-celar-ai-internal-data-080.sh'
            DEFERRAL_TEST='tests/validate-celar-ai-opencloud-deferred-runtime.mjs'
            PROHIBITED="$(grep -Fvx \
              -e "$CONTROLLER" \
              -e "$CONTROLLER_VALIDATOR" \
              -e "$PRIVATE_RUNTIME" \
              -e "$HISTORICAL_HOTFIX" \
              <<<"$PROHIBITED" || true)"
            for required in "$CONTROLLER" "$CONTROLLER_VALIDATOR" "$PRIVATE_RUNTIME" "$HISTORICAL_HOTFIX" "$MIGRATOR" "$DEFERRAL_TEST"; do
              test -f "$required"
              grep -Fxq "$required" <<<"$CHANGED"
            done
            grep -Fq 'b1335bd2426d061f85498ace7c7b2a70c3b5bdc6' "$CONTROLLER"
            grep -Fq '080_celar_ai_internal_data_intelligence.sql' "$CONTROLLER"
            grep -Fq 'currentDescription:"Working on training"' "$CONTROLLER"
            grep -Fq 'group: projectpulse-deploy-test' "$CONTROLLER"
            grep -Fq 'queue: max' "$CONTROLLER"
            ! grep -Fq '081_celar_ai_private_runtime_activation' "$CONTROLLER"
            grep -Fq 'PRIVATE_RUNTIME_MIGRATION_081=ABSENT' "$MIGRATOR"
            for deferred in "$PRIVATE_RUNTIME" "$HISTORICAL_HOTFIX"; do
              ! grep -Eq 'azure/[l]ogin@' "$deferred"
              ! grep -Fq 'environment: test' "$deferred"
              ! grep -Eq 'id-token:[[:space:]]+[w]rite' "$deferred"
              ! grep -Eq '^[[:space:]]{2}push:' "$deferred"
            done
          fi
          if [[ -n "$PROHIBITED" ]]; then
            echo 'The Celar AI enterprise interface overlaps a prohibited deployment or provider-secret surface:' >&2
            printf '%s\n' "$PROHIBITED" >&2
            exit 1
          fi

          for protected in \
            '.github/workflows/projectpulse-deploy-runtime-direct-timer-recovery-test.yml' \
            '.github/workflows/validate-runtime-direct-timer-recovery-deployment.yml' \
            'scripts/validate-runtime-direct-timer-recovery-test-deployment.sh'; do
            if grep -Fxq "$protected" <<<"$CHANGED"; then
              echo "Protected deployment file changed: $protected" >&2
              exit 1
            fi
          done

          git diff --check "$BASE"...HEAD
          echo "CELAR_AI_ENTERPRISE_BASE=$BASE"
          echo "CELAR_AI_ENTERPRISE_HEAD=$(git rev-parse HEAD)"
          echo 'CELAR_AI_ENTERPRISE_SOURCE_ISOLATION=PASSED'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Validate migration 061 apply, repeat, rollback, and reapply
        env:
          PGPASSWORD: projectpulse
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U projectpulse -d projectpulse_validation && break
            sleep 2
          done
          PSQL=(psql -h 127.0.0.1 -p 5432 -U projectpulse -d projectpulse_validation -v ON_ERROR_STOP=1)
          "${PSQL[@]}" -f database/migrations/061_celar_ai_capability_routing.sql
          "${PSQL[@]}" -f database/migrations/061_celar_ai_capability_routing.sql
          "${PSQL[@]}" -Atqc "
            SELECT CASE WHEN
              to_regclass('public.ai_capability_routes') IS NOT NULL AND
              to_regclass('public.ai_capability_route_audit') IS NOT NULL AND
              to_regclass('public.ai_private_model_profiles') IS NOT NULL AND
              to_regclass('public.ai_private_model_profile_audit') IS NOT NULL AND
              (SELECT count(*) FROM ai_capability_routes) = 7 AND
              NOT EXISTS (
                SELECT 1 FROM ai_capability_routes
                WHERE route_targets <> '[\"celar_ai\",\"claude\",\"openai\",\"local_template\"]'::jsonb
              )
            THEN 'PASSED' ELSE 'FAILED' END;" | grep -Fxq PASSED
          "${PSQL[@]}" -f database/rollback/061_celar_ai_capability_routing_rollback.sql
          "${PSQL[@]}" -Atqc "
            SELECT CASE WHEN
              to_regclass('public.ai_capability_routes') IS NULL AND
              to_regclass('public.ai_private_model_profiles') IS NULL
            THEN 'PASSED' ELSE 'FAILED' END;" | grep -Fxq PASSED
          "${PSQL[@]}" -f database/migrations/061_celar_ai_capability_routing.sql
          echo 'CELAR_AI_MIGRATION_061=PASSED'

      - name: Validate enterprise source contract and injectors
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check ./scripts/inject-celar-ai-capability-routing.mjs
          node --check ./scripts/inject-celar-ai-contextual-chat-workspace.mjs
          node --check ./scripts/inject-celar-ai-enterprise-chat-context.mjs
          node --check ./scripts/inject-celar-ai-runtime-rebrand.mjs
          node --check ./scripts/validate-celar-ai-enterprise-platform.mjs
          node ./scripts/validate-celar-ai-enterprise-platform.mjs
          grep -Fq 'celar_ai' ../../backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs
          grep -Fq 'Governed local template must remain the final fallback' ../../backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs
          grep -Fq 'MapCelarAiCapabilityRoutingEndpoints' ../../backend/ProjectTime.Api/Modules/CelarAiCapabilityRoutingModule.cs
          grep -Fq 'endpointReturned = false' ../../backend/ProjectTime.Api/Modules/CelarAiCapabilityRoutingModule.cs
          grep -Fq 'tokenReturned = false' ../../backend/ProjectTime.Api/Modules/CelarAiCapabilityRoutingModule.cs
          echo 'CELAR_AI_CAPABILITY_ROUTING_SOURCE_CONTRACT=PASSED'

      - name: Build ProjectTime API
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release | tee celar-ai-enterprise-api-build.log
          grep -Fq '0 Error(s)' celar-ai-enterprise-api-build.log
          GENERATED="$(find src/backend/ProjectTime.Api -maxdepth 8 -name CelarAiBrandModule.g.cs -print -quit)"
          PEOPLE="$(find src/backend/ProjectTime.Api -maxdepth 8 -name CelarAiPeopleAndGuidanceService.g.cs -print -quit)"
          ROUTING="$(find src/backend/ProjectTime.Api -maxdepth 8 -name CelarAiCapabilityRouting.g.cs -print -quit)"
          TIMESHEET="$(find src/backend/ProjectTime.Api -maxdepth 8 -name ProjectPulseAiTimeEntrySuggestionService.g.cs -print -quit)"
          EXTERNAL="$(find src/backend/ProjectTime.Api -maxdepth 8 -name CelarAiExternalReasoningService.g.cs -print -quit)"
          test -n "$GENERATED" -a -n "$PEOPLE" -a -n "$ROUTING" -a -n "$TIMESHEET" -a -n "$EXTERNAL"
          grep -Fq 'MapCelarAiEnterprisePlatformEndpoints' "$GENERATED"
          grep -Fq 'persistence.EffectiveUserId' "$PEOPLE"
          grep -Fq 'privateResult' "$ROUTING"
          grep -Fq 'CelarAiCapabilityRouter' "$TIMESHEET"
          grep -Fq 'ResolveTimesheetFeature' "$TIMESHEET"
          grep -Fq 'GenerateExternalAsync' "$EXTERNAL"
          echo 'CELAR_AI_ENTERPRISE_API_BUILD=PASSED'

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Build complete production frontend
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build | tee celar-ai-enterprise-frontend-build.log
          test -s dist/index.html
          cat dist/assets/*.js > /tmp/celar-enterprise.js
          cat dist/assets/*.css > /tmp/celar-enterprise.css
          for marker in \
            'Celar AI Enterprise Platform' \
            'Celar AI Architecture Overview' \
            'Created by Dr. Ahmed Adeyemi' \
            '/api/celar-ai/v1/compose' \
            'Generate review draft' \
            'Download SVG' \
            'Fresh chat — no previous conversation context' \
            'Add project, person/team, or date context' \
            'Private-first targets and capability routing' \
            '/api/ai-configuration/routes' \
            '/api/ai-configuration/private-model/settings' \
            '/api/ai-configuration/consumers' \
            'Primary, secondary, tertiary, and final fallback'; do
            grep -Fq "$marker" /tmp/celar-enterprise.js
          done
          for marker in \
            '.celar-ai-enterprise-platform' \
            '.celar-ai-architecture-overview' \
            '.celar-ai-solution-composer' \
            '.celar-ai-question-context' \
            '.celar-ai-routing' \
            'resize:both'; do
            grep -Fq "$marker" /tmp/celar-enterprise.css
          done
          echo 'CELAR_AI_ENTERPRISE_FRONTEND_BUILD=PASSED'

      - name: Build production web-container context
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build \
            --file deployment/containers/web/Dockerfile \
            --tag celar-ai-enterprise-web:${{ github.run_id }}-${{ github.run_attempt }} \
            .
          echo 'CELAR_AI_ENTERPRISE_WEB_CONTAINER=PASSED'

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Celar AI Enterprise Platform validation'
            echo
            echo "- Exact head: \`${GITHUB_SHA}\`"
            echo "- Validation mode: ${CELAR_AI_ENTERPRISE_VALIDATION_MODE:-UNKNOWN}"
            echo '- Architecture: US Signal private-first diagram with Dr. Ahmed Adeyemi attribution'
            echo '- Module 064: editable primary, secondary, tertiary, and required local fallback routes'
            echo '- Default route: Celar AI -> Claude -> OpenAI -> Governed local template'
            echo '- Consolidated releases may change only the static web-container Dockerfile; deployment and secret controls remain prohibited.'
            echo '- Migration 061 source: validated apply/repeat/rollback/reapply; not applied to Test or Production'
            echo '- Deployment performed: no'
            echo '- Provider secret changed: no'
            echo '- State-changing business action: no'
          } >> "$GITHUB_STEP_SUMMARY"
