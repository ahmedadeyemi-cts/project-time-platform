name: Package Assigned-Work Repair Sources

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-module001-source-pr.yml'

permissions:
  contents: read

concurrency:
  group: package-assigned-work-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/jason-assigned-work-runtime-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Collect exact repair sources
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/assigned-work-repair-sources"
          install -d -m 0700 "$OUT"
          files=(
            src/backend/ProjectTime.Api/Program.cs
            src/backend/ProjectTime.Api/Modules/Module001AEngineerTaskCloseoutModule.cs
            src/backend/ProjectTime.Api/Modules/Module001ResultExecutionCompatibility.cs
            src/backend/ProjectTime.Api/Modules/Module001TimesheetEnhancementModule.cs
            src/backend/ProjectTime.Api/Modules/ProjectWorkspaceModule019Repair.cs
            src/frontend/project-time-web/src/App.jsx
            src/frontend/project-time-web/src/ProjectWorkspaceCenter.jsx
            src/frontend/project-time-web/scripts/generate-module-001-integrated-app.mjs
            src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
            src/frontend/project-time-web/scripts/validate-role-permission-timesheet-stabilization.mjs
            src/frontend/project-time-web/package.json
            .github/workflows/module-loading-assignment-propagation-ci.yml
            .github/workflows/projectpulse-deploy-test.yml
            scripts/release-test/run-utilization-role-scoping-protected-test-uat.sh
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "Missing source: $file" >&2; exit 1; }
            install -D -m 0600 "$file" "$OUT/$file"
          done
          git rev-parse HEAD > "$OUT/source-head.txt"
          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/sha256sums.txt"

      - name: Upload exact repair sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assigned-work-repair-sources
          path: ${{ runner.temp }}/assigned-work-repair-sources
          if-no-files-found: error
          retention-days: 1
