name: Prepare Assigned-Work Repair Blobs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-module001-source-pr.yml'

permissions:
  contents: write

concurrency:
  group: prepare-assigned-work-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/jason-assigned-work-runtime-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Apply and validate final assigned-work repair
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$PR_HEAD_SHA" ]] || {
            echo 'ERROR: Checkout does not match the exact PR head.' >&2
            exit 1
          }

          python3 scripts/tmp/finalize_assigned_work_repair.py

          rm -f \
            .github/workflows/diagnose-available-tasks-source-pr.yml \
            .github/workflows/diagnose-jason-assigned-work-runtime-pr.yml \
            .github/workflows/diagnose-jason-assigned-work-runtime.yml \
            .github/workflows/diagnose-module001-source-pr.yml \
            .github/workflows/finalize-assigned-work-repair.yml \
            scripts/tmp/finalize_assigned_work_repair.py

          bash -n scripts/release-test/run-assigned-work-protected-test-uat.sh
          node src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          node tests/validate-systemwide-image-build-controller.mjs
          node tests/validate-systemwide-enterprise-reliability.mjs
          node scripts/validate-deployment-concurrency-governance.mjs --repo-root "$GITHUB_WORKSPACE" --verify-repository
          python3 scripts/security/validate-repository-security-posture.py
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          (
            cd src/frontend/project-time-web
            npm ci --no-audit --no-fund
            npm run build
          )
          git diff --check

      - name: Create immutable Git blobs for reviewed files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          create_blob() {
            local path="$1" response
            response="$(jq -Rs '{content: ., encoding: "utf-8"}' < "$path" | \
              curl --fail-with-body --silent --show-error \
                -X POST \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                --data-binary @- \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs")"
            jq -er '.sha' <<<"$response"
          }

          PROGRAM_SHA="$(create_blob src/backend/ProjectTime.Api/Program.cs)"
          CLOSEOUT_SHA="$(create_blob src/backend/ProjectTime.Api/Modules/Module001AEngineerTaskCloseoutModule.cs)"
          APP_SHA="$(create_blob src/frontend/project-time-web/src/App.jsx)"
          VALIDATOR_SHA="$(create_blob src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs)"
          FOCUSED_SHA="$(create_blob .github/workflows/module-loading-assignment-propagation-ci.yml)"
          CONTROLLER_SHA="$(create_blob .github/workflows/projectpulse-deploy-test.yml)"
          UAT_SHA="$(create_blob scripts/release-test/run-assigned-work-protected-test-uat.sh)"

          jq -n \
            --arg headSha "$PR_HEAD_SHA" \
            --arg program "$PROGRAM_SHA" \
            --arg closeout "$CLOSEOUT_SHA" \
            --arg app "$APP_SHA" \
            --arg validator "$VALIDATOR_SHA" \
            --arg focused "$FOCUSED_SHA" \
            --arg controller "$CONTROLLER_SHA" \
            --arg uat "$UAT_SHA" \
            '{
              headSha:$headSha,
              files:[
                {path:"src/backend/ProjectTime.Api/Program.cs",sha:$program,mode:"100644"},
                {path:"src/backend/ProjectTime.Api/Modules/Module001AEngineerTaskCloseoutModule.cs",sha:$closeout,mode:"100644"},
                {path:"src/frontend/project-time-web/src/App.jsx",sha:$app,mode:"100644"},
                {path:"src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs",sha:$validator,mode:"100644"},
                {path:".github/workflows/module-loading-assignment-propagation-ci.yml",sha:$focused,mode:"100644"},
                {path:".github/workflows/projectpulse-deploy-test.yml",sha:$controller,mode:"100644"},
                {path:"scripts/release-test/run-assigned-work-protected-test-uat.sh",sha:$uat,mode:"100755"}
              ],
              deletions:[
                ".github/workflows/diagnose-available-tasks-source-pr.yml",
                ".github/workflows/diagnose-jason-assigned-work-runtime-pr.yml",
                ".github/workflows/diagnose-jason-assigned-work-runtime.yml",
                ".github/workflows/diagnose-module001-source-pr.yml",
                ".github/workflows/finalize-assigned-work-repair.yml",
                "scripts/tmp/finalize_assigned_work_repair.py"
              ]
            }' > "$RUNNER_TEMP/assigned-work-repair-blobs.json"

          jq . "$RUNNER_TEMP/assigned-work-repair-blobs.json"

      - name: Upload immutable blob manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assigned-work-repair-blobs
          path: ${{ runner.temp }}/assigned-work-repair-blobs.json
          if-no-files-found: error
          retention-days: 1
