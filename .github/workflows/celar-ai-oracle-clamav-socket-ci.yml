name: Validate Oracle Celar ClamAV Socket Activation

on:
  pull_request:
    paths:
      - 'deployment/oracle-celar/deploy.sh'
      - 'deployment/oracle-celar/bootstrap.sh'
      - 'deployment/oracle-celar/systemd/clamav-daemon.socket.d/**'
      - 'deployment/oracle-celar/systemd/celar-gitops.service'
      - 'deployment/oracle-celar/systemd/celar-ollama-update.service'
      - '.github/workflows/celar-ai-oracle-clamav-socket-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Validate shell and runtime recovery contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOY=deployment/oracle-celar/deploy.sh
          BOOTSTRAP=deployment/oracle-celar/bootstrap.sh
          DROPIN=deployment/oracle-celar/systemd/clamav-daemon.socket.d/10-celar-tcp.conf
          GITOPS_UNIT=deployment/oracle-celar/systemd/celar-gitops.service
          UPDATE_UNIT=deployment/oracle-celar/systemd/celar-ollama-update.service

          bash -n "$DEPLOY"
          bash -n "$BOOTSTRAP"
          test -s "$DROPIN"
          grep -Fxq '[Socket]' "$DROPIN"
          grep -Fxq 'ListenStream=127.0.0.1:3310' "$DROPIN"

          grep -Fq "CLAMAV_SOCKET_DROPIN_DIR='/etc/systemd/system/clamav-daemon.socket.d'" "$DEPLOY"
          grep -Fq 'install -m 0644 "$ROOT/systemd/clamav-daemon.socket.d/10-celar-tcp.conf" "$CLAMAV_SOCKET_DROPIN"' "$DEPLOY"
          grep -Fq 'systemctl enable clamav-freshclam clamav-daemon clamav-daemon.socket' "$DEPLOY"
          grep -Fq 'systemctl stop clamav-daemon.service clamav-daemon.socket' "$DEPLOY"
          grep -Fq 'systemctl start clamav-daemon.socket' "$DEPLOY"
          grep -Fq 'systemctl start clamav-daemon.service' "$DEPLOY"
          grep -Fq "printf 'zPING\\0' | nc -N -w 3" "$DEPLOY"
          grep -Fq "fail 'ClamAV localhost TCP socket did not become ready on 127.0.0.1:3310.'" "$DEPLOY"

          grep -Fq 'systemctl enable --now celar-backup.timer celar-ollama-update.timer' "$DEPLOY"
          grep -Fq 'systemctl enable celar-gitops.timer' "$DEPLOY"
          if grep -Fq 'enable --now celar-gitops.timer' "$DEPLOY"; then
            echo 'deploy.sh must not start GitOps before bootstrap records the applied tree.' >&2
            exit 1
          fi

          grep -Fq 'systemctl stop celar-gitops.timer' "$BOOTSTRAP"
          grep -Fq 'while systemctl is-active --quiet celar-gitops.service' "$BOOTSTRAP"
          grep -Fq 'gitops-applied-tree' "$BOOTSTRAP"
          grep -Fq 'systemctl enable --now celar-gitops.timer' "$BOOTSTRAP"

          python3 - "$BOOTSTRAP" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          stop = text.index('systemctl stop celar-gitops.timer')
          deploy = text.index('bash "$SOURCE_DIR/deployment/oracle-celar/deploy.sh"')
          record = text.index('gitops-applied-tree')
          start = text.index('systemctl enable --now celar-gitops.timer')
          if not stop < deploy < record < start:
              raise SystemExit('Bootstrap GitOps timer ordering is unsafe.')
          print('BOOTSTRAP_GITOPS_TIMER_ORDER=PASS')
          PY

          # Ollama CLI currently requires HOME. systemd system services do not
          # guarantee that variable, so both automated mutation paths must set it.
          grep -Fxq 'Environment=HOME=/root' "$GITOPS_UNIT"
          grep -Fxq 'Environment=HOME=/root' "$UPDATE_UNIT"
          grep -Fq 'ExecStart=/opt/celar-ai/deploy/gitops.sh' "$GITOPS_UNIT"
          grep -Fq 'ExecStart=/opt/celar-ai/deploy/ollama-update.sh' "$UPDATE_UNIT"

          if grep -Fq 'ListenStream=0.0.0.0:3310' "$DROPIN"; then
            echo 'ClamAV TCP must never bind publicly.' >&2
            exit 1
          fi

          git diff --check
