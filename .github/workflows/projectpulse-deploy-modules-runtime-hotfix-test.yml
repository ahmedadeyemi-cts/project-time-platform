name: ProjectPulse Deploy PR 552 Coordinated Runtime and Migration 079 Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact merged PR 552 application commit
        required: true
        default: e3d68ddcac51ba7f2eb46f71d7930daa2da38b58
        type: string
      confirmation:
        description: Enter DEPLOY-PR552-COORDINATED-RUNTIME-MIGRATION-079-TO-TEST
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/projectpulse-deploy-modules-runtime-hotfix-test.yml
      - src/backend/ProjectTime.Api/Modules/EnterpriseGovernanceAccess.cs
      - src/backend/ProjectTime.Api/Modules/EnterpriseNotificationRepository.cs
      - src/backend/ProjectTime.Api/Modules/LabEquipmentTrackerModule.cs
      - src/frontend/project-time-web/src/App.jsx
      - src/frontend/project-time-web/scripts/validate-module-001a-engineer-request-closeout.mjs
      - src/frontend/project-time-web/scripts/validate-module-081-lab-equipment-tracker.mjs
      - scripts/release-test/apply-079.sh
      - scripts/release-test/run-migration-job.sh

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded PR 552 application and migration 079 release
    if: github.ref == 'refs/heads/main'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_RELEASE_COMMIT: e3d68ddcac51ba7f2eb46f71d7930daa2da38b58

    steps:
      - name: Check out deployment controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          # Retain the complete graph needed by the release-boundary ancestry guard.
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact hotfix release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_commit || 'e3d68ddcac51ba7f2eb46f71d7930daa2da38b58' }}
          path: release
          fetch-depth: 1
          persist-credentials: false

      - name: Guard exact source and coordinated release boundary
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == '${{ github.sha }}' ]]
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$DISPATCH_CONFIRMATION" == DEPLOY-PR552-COORDINATED-RUNTIME-MIGRATION-079-TO-TEST ]] || {
              echo 'Confirmation text does not match.' >&2
              exit 1
            }
            [[ "$DISPATCH_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'release_commit must be a complete lowercase SHA.' >&2
              exit 1
            }
            [[ "$TARGET_COMMIT" == "$DISPATCH_RELEASE_COMMIT" ]]
          elif [[ "$EVENT_NAME" != push ]]; then
            echo "Unsupported trigger: $EVENT_NAME" >&2
            exit 1
          fi
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || {
            echo 'Only the exact merged PR 552 application commit may deploy.' >&2
            exit 1
          }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" "$CONTROL_COMMIT" || {
            echo 'The reviewed PR 552 application commit is not an ancestor of the deployment controls.' >&2
            exit 1
          }

          test -f release/database/migrations/076_module_081_lab_equipment_tracker.sql
          test -f release/database/migrations/077_module_082_enterprise_project_risk_register.sql
          test -f release/database/migrations/078_module_001a_engineer_request_closeout.sql
          test -f release/database/migrations/079_coordinated_runtime_ai_document_rbac_repair.sql
          test -f release/src/frontend/project-time-web/src/EngineerTaskCloseoutCenter.jsx
          test -f release/src/frontend/project-time-web/src/LabEquipmentTrackerCenter.jsx
          test -f release/src/frontend/project-time-web/src/ProjectRiskRegisterCenter.jsx
          test -f release/src/frontend/project-time-web/src/ProjectFlowHiveCenter.jsx
          test -f release/src/frontend/project-time-web/src/ProjectForgeCenter.jsx
          test -f control/scripts/release-test/apply-079.sh
          test -f control/scripts/release-test/run-migration-job.sh

          grep -Fq '<EngineerTaskCloseoutCenter authSession={authSession} />' release/src/frontend/project-time-web/src/App.jsx
          grep -Fq 'const results = await Promise.allSettled([' release/src/frontend/project-time-web/src/App.jsx
          grep -Fq "'customer-delivery-acceptance'," release/src/frontend/project-time-web/src/App.jsx
          grep -Fq "'engineer-task-closeout'," release/src/frontend/project-time-web/src/App.jsx
          grep -Fq "'lab-equipment-tracker'," release/src/frontend/project-time-web/src/App.jsx
          grep -Fq "'X-Project-Pulse-Session': token" release/src/frontend/project-time-web/src/EngineerTaskCloseoutCenter.jsx
          grep -Fq 'const PAGE_SIZE = 20;' release/src/frontend/project-time-web/src/EngineerTaskCloseoutCenter.jsx
          grep -Fq 'Promise.allSettled' release/src/frontend/project-time-web/src/LabEquipmentTrackerCenter.jsx
          grep -Fq "queryPath('/actions',projectScope)" release/src/frontend/project-time-web/src/ProjectRiskRegisterCenter.jsx
          ! grep -Fq '`/actions?projectId=${filters.projectId}`' release/src/frontend/project-time-web/src/ProjectRiskRegisterCenter.jsx
          grep -Fq 'LabFullAccessRoles' release/src/backend/ProjectTime.Api/Modules/EnterpriseGovernanceAccess.cs
          grep -Fq 'LabEngineerRoles' release/src/backend/ProjectTime.Api/Modules/EnterpriseGovernanceAccess.cs
          grep -Fq 'CanImportLabEquipment => CanManageLabEquipment' release/src/backend/ProjectTime.Api/Modules/EnterpriseGovernanceAccess.cs
          grep -Fq 'await using (var reader = await command.ExecuteReaderAsync(cancellationToken))' release/src/backend/ProjectTime.Api/Modules/EnterpriseNotificationRepository.cs
          ! grep -Fq 'FROM projectpulse_team_scope_assignments' release/src/backend/ProjectTime.Api/Modules/LabEquipmentTrackerModule.cs

          node release/src/frontend/project-time-web/scripts/validate-module-001a-engineer-request-closeout.mjs
          node release/src/frontend/project-time-web/scripts/validate-module-081-lab-equipment-tracker.mjs
          node release/src/frontend/project-time-web/scripts/validate-module-082-project-risk-register.mjs
          node release/src/frontend/project-time-web/scripts/validate-module-001-timesheet-timer-mobile.mjs
          node release/src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs
          bash -n control/scripts/release-test/apply-079.sh
          bash -n control/scripts/release-test/run-migration-job.sh
          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          echo "control_commit=$CONTROL_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'DATABASE_MUTATION=MIGRATION_079_APPLY_AND_VERIFY'

      - name: Sign in to the protected Test subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve protected Test database migration contract
        id: migration_contract
        shell: bash
        run: |
          set -Eeuo pipefail
          normalize() { case "${1:-}" in ""|None|null) return 1 ;; *) printf '%s\n' "$1" ;; esac; }
          CURRENT_SUBSCRIPTION="$(az account show --query id -o tsv --only-show-errors)"
          [[ "${CURRENT_SUBSCRIPTION,,}" == "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]] || {
            echo 'Azure login is outside the protected Test subscription.' >&2
            exit 1
          }
          API_JSON="$(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          [[ "$(jq -r '.tags.environment // empty' <<<"$API_JSON")" == test ]] || {
            echo 'The protected API resource is not tagged as Test.' >&2
            exit 1
          }
          DATABASE_HOST="$(jq -r '.properties.template.containers[0].env[] | select(.name == "PTP_DB_HOST") | .value // empty' <<<"$API_JSON")"
          DATABASE_PORT="$(jq -r '.properties.template.containers[0].env[] | select(.name == "PTP_DB_PORT") | .value // empty' <<<"$API_JSON")"
          DATABASE_NAME="$(jq -r '.properties.template.containers[0].env[] | select(.name == "PTP_DB_NAME") | .value // empty' <<<"$API_JSON")"
          DATABASE_USER="$(jq -r '.properties.template.containers[0].env[] | select(.name == "PTP_DB_USER") | .value // empty' <<<"$API_JSON")"
          [[ "$DATABASE_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}[A-Za-z0-9]$ ]]
          [[ "$DATABASE_PORT" =~ ^[0-9]{1,5}$ ]] && (( DATABASE_PORT >= 1 && DATABASE_PORT <= 65535 ))
          [[ "$DATABASE_NAME" =~ ^[A-Za-z_][A-Za-z0-9_]{0,62}$ ]]
          [[ "$DATABASE_USER" =~ ^[A-Za-z_][A-Za-z0-9_]{0,62}$ ]]
          PASSWORD_SECRET_REF="$(jq -r '
            [.properties.template.containers[0].env[] |
              select(.name == "PTP_DB_PASSWORD") | .secretRef // empty] |
              map(select(length > 0)) | unique | if length == 1 then .[0] else empty end
          ' <<<"$API_JSON")"
          normalize "$PASSWORD_SECRET_REF" >/dev/null || {
            echo 'The protected Test API has no single canonical database password secret.' >&2
            exit 1
          }
          API_SECRETS_JSON="$(az containerapp secret list \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          KEY_VAULT_SECRET_URI="$(jq -r --arg name "$PASSWORD_SECRET_REF" '
            [.[] | select(.name == $name) | .keyVaultUrl // empty] |
            if length == 1 then .[0] else empty end
          ' <<<"$API_SECRETS_JSON")"
          MIGRATOR_IDENTITY="$(jq -r --arg name "$PASSWORD_SECRET_REF" '
            [.[] | select(.name == $name) | .identity // empty] |
            if length == 1 then .[0] else empty end
          ' <<<"$API_SECRETS_JSON")"
          [[ "$KEY_VAULT_SECRET_URI" =~ ^https://[a-z0-9-]+\.vault\.azure\.net/secrets/[A-Za-z0-9-]+(/[0-9A-Fa-f]{32})?$ ]]
          MIGRATOR_IDENTITY_LOWER="${MIGRATOR_IDENTITY,,}"
          [[ "$MIGRATOR_IDENTITY_LOWER" =~ ^/subscriptions/[^/]+/resourcegroups/[^/]+/providers/microsoft\.managedidentity/userassignedidentities/[^/]+$ ]]
          jq -e --arg identity "$MIGRATOR_IDENTITY" '
            (.identity.userAssignedIdentities // {}) | keys |
            map(ascii_downcase) | index($identity | ascii_downcase) != null
          ' <<<"$API_JSON" >/dev/null
          UAMI_SUBSCRIPTION="${MIGRATOR_IDENTITY#*/subscriptions/}"
          UAMI_SUBSCRIPTION="${UAMI_SUBSCRIPTION%%/*}"
          [[ "${UAMI_SUBSCRIPTION,,}" == "${CURRENT_SUBSCRIPTION,,}" ]]
          ACTUAL_UAMI_ID="$(az identity show --ids "$MIGRATOR_IDENTITY" --query id -o tsv --only-show-errors)"
          [[ "${ACTUAL_UAMI_ID,,}" == "${MIGRATOR_IDENTITY,,}" ]]
          KEY_VAULT_URI="${KEY_VAULT_SECRET_URI%%/secrets/*}"
          DATABASE_PASSWORD_SECRET_NAME="${KEY_VAULT_SECRET_URI#*/secrets/}"
          echo "migrator_identity=$MIGRATOR_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "key_vault_uri=$KEY_VAULT_URI" >> "$GITHUB_OUTPUT"
          echo "database_password_secret_name=$DATABASE_PASSWORD_SECRET_NAME" >> "$GITHUB_OUTPUT"
          echo "database_host=$DATABASE_HOST" >> "$GITHUB_OUTPUT"
          echo "database_port=$DATABASE_PORT" >> "$GITHUB_OUTPUT"
          echo "database_name=$DATABASE_NAME" >> "$GITHUB_OUTPUT"
          echo "database_user=$DATABASE_USER" >> "$GITHUB_OUTPUT"
          echo 'COORDINATED_MIGRATION_079_PROTECTED_TEST_CONTRACT=PASSED'

      - name: Build checksum-pinned migration 079 image
        id: migration
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/coordinated-migration-079-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          install -m 0644 control/deployment/containers/pr55-migrator/Dockerfile "$CONTEXT/Dockerfile"
          install -m 0755 control/scripts/release-test/apply-079.sh "$CONTEXT/apply-pr55-test-migrations.sh"
          install -m 0644 release/database/migrations/079_coordinated_runtime_ai_document_rbac_repair.sql \
            "$CONTEXT/migrations/079_coordinated_runtime_ai_document_rbac_repair.sql"
          (
            cd "$CONTEXT/migrations"
            sha256sum 079_coordinated_runtime_ai_document_rbac_repair.sql > SHA256SUMS
          )
          printf '%s\n' '${{ steps.release.outputs.target_commit }}' > "$CONTEXT/release-commit"
          DIGEST="$(control/scripts/build-pr55-acr-image.sh \
            '${{ vars.AZURE_ACR_NAME }}' \
            "project-health-dashboard-coordinated-079-migrator:${{ steps.release.outputs.target_commit }}-${GITHUB_RUN_ID}" \
            "$CONTEXT/Dockerfile" "$CONTEXT")"
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-coordinated-079-migrator@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Apply migration 079 inside the private Test network
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID: ${{ steps.migration_contract.outputs.migrator_identity }}
          AZURE_KEY_VAULT_URI: ${{ steps.migration_contract.outputs.key_vault_uri }}
          PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME: ${{ steps.migration_contract.outputs.database_password_secret_name }}
          PROJECTPULSE_TEST_DATABASE_HOST: ${{ steps.migration_contract.outputs.database_host }}
          PROJECTPULSE_TEST_DATABASE_PORT: ${{ steps.migration_contract.outputs.database_port }}
          PROJECTPULSE_TEST_DATABASE_NAME: ${{ steps.migration_contract.outputs.database_name }}
          PROJECTPULSE_TEST_DATABASE_USER: ${{ steps.migration_contract.outputs.database_user }}
          MAIN_RELEASE_CONTROL_SHA: ${{ steps.release.outputs.control_commit }}
          MAIN_RELEASE_EXPECTED_RELEASE_COMMIT: ${{ steps.release.outputs.target_commit }}
          MAIN_RELEASE_MIGRATION_SCOPE: pr552-coordinated-runtime-079-test
          MAIN_RELEASE_MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
          MAIN_RELEASE_MIGRATION_JOB_NAME: m079-${{ github.run_id }}-${{ github.run_attempt }}-a
          MAIN_RELEASE_MIGRATION_MODE: apply
        run: bash control/scripts/release-test/run-migration-job.sh

      - name: Reverify migration 079 without writes
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID: ${{ steps.migration_contract.outputs.migrator_identity }}
          AZURE_KEY_VAULT_URI: ${{ steps.migration_contract.outputs.key_vault_uri }}
          PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME: ${{ steps.migration_contract.outputs.database_password_secret_name }}
          PROJECTPULSE_TEST_DATABASE_HOST: ${{ steps.migration_contract.outputs.database_host }}
          PROJECTPULSE_TEST_DATABASE_PORT: ${{ steps.migration_contract.outputs.database_port }}
          PROJECTPULSE_TEST_DATABASE_NAME: ${{ steps.migration_contract.outputs.database_name }}
          PROJECTPULSE_TEST_DATABASE_USER: ${{ steps.migration_contract.outputs.database_user }}
          MAIN_RELEASE_CONTROL_SHA: ${{ steps.release.outputs.control_commit }}
          MAIN_RELEASE_EXPECTED_RELEASE_COMMIT: ${{ steps.release.outputs.target_commit }}
          MAIN_RELEASE_MIGRATION_SCOPE: pr552-coordinated-runtime-079-test
          MAIN_RELEASE_MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
          MAIN_RELEASE_MIGRATION_JOB_NAME: m079-${{ github.run_id }}-${{ github.run_attempt }}-v
          MAIN_RELEASE_MIGRATION_MODE: verify
        run: bash control/scripts/release-test/run-migration-job.sh

      - name: Capture current immutable images
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          RAW_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors)"
          [[ -n "$RAW_API" && -n "$RAW_WEB" && "${API_MODE,,}" == single && "${WEB_MODE,,}" == single ]]
          OLD_API_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
          OLD_WEB_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
          [[ -n "$OLD_API_REVISION" && -n "$OLD_WEB_REVISION" ]]

          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Image is outside the approved ACR: $image" >&2; return 1 ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv --only-show-errors)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          echo "old_api_image=$(resolve_digest "$RAW_API")" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$(resolve_digest "$RAW_WEB")" >> "$GITHUB_OUTPUT"
          echo "old_api_revision=$OLD_API_REVISION" >> "$GITHUB_OUTPUT"
          echo "old_web_revision=$OLD_WEB_REVISION" >> "$GITHUB_OUTPUT"

      - name: Build immutable API and web images
        id: build
        working-directory: release
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA='${{ steps.release.outputs.target_commit }}'
          API_REPO=project-health-dashboard-api
          WEB_REPO=project-health-dashboard-web
          API_DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$API_REPO:modules-runtime-hotfix-$SHA" deployment/containers/api/Dockerfile .)"
          WEB_DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$WEB_REPO:modules-runtime-hotfix-$SHA" deployment/containers/web/Dockerfile .)"
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$API_REPO@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$WEB_REPO@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy hotfix API
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT='${{ steps.release.outputs.target_commit }}' \
            --revision-suffix "mrhapi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
          REVISION=''
          for attempt in $(seq 1 30); do
            REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
            [[ -n "$REVISION" && "$REVISION" != '${{ steps.before.outputs.old_api_revision }}' ]] && break
            sleep 2
          done
          [[ -n "$REVISION" && "$REVISION" != '${{ steps.before.outputs.old_api_revision }}' ]]
          bash control/scripts/wait-containerapp-ready-revision.sh \
            '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_API_APP }}' "$REVISION" '${{ steps.build.outputs.api_image }}' 45 10
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Verify database-backed and protected API routes
        shell: bash
        env:
          UAT_SESSION: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          wait_status() {
            local path="$1" expected="$2" status=''
            for attempt in $(seq 1 24); do
              status="$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o /tmp/hotfix-api-body -w '%{http_code}' "$BASE$path" || true)"
              if [[ ",$expected," == *",$status,"* ]]; then return 0; fi
              sleep 5
            done
            echo "$path returned $status; expected $expected" >&2
            cat /tmp/hotfix-api-body >&2 || true
            return 1
          }
          wait_status /health 200
          wait_status /api/version 200
          wait_status '/api/holidays?year=2026' 200,401,403
          wait_status '/api/assignments/available-tasks?weekStart=2026-08-02' 401,403
          wait_status /api/engineer-task-closeout/overview 401,403
          wait_status /api/lab-equipment-tracker/summary 401,403
          wait_status /api/project-risk-register/summary 401,403
          wait_status /api/project-risk-register/actions 401,403
          wait_status /api/project-flowhive/readiness 401,403
          wait_status /api/project-forge/readiness 401,403,404

          if [[ -n "$UAT_SESSION" ]]; then
            auth_status() {
              local path="$1" status
              status="$(curl -sS --max-time 30 -o /tmp/hotfix-uat-body -w '%{http_code}' \
                -H "Authorization: Bearer $UAT_SESSION" \
                -H "X-ProjectPulse-Session: $UAT_SESSION" \
                -H "X-Project-Pulse-Session: $UAT_SESSION" \
                -H "X-Session-Token: $UAT_SESSION" "$BASE$path")"
              [[ "$status" == 200 ]] || { echo "Authenticated $path returned $status" >&2; cat /tmp/hotfix-uat-body >&2; return 1; }
            }
            auth_status '/api/assignments/available-tasks?weekStart=2026-08-02'
            auth_status /api/engineer-task-closeout/overview
            auth_status /api/lab-equipment-tracker/summary
            auth_status /api/project-risk-register/summary
            auth_status /api/project-risk-register/actions
            echo 'AUTHENTICATED_MODULE_UAT=PASSED'
          else
            echo '::warning::PROJECTPULSE_TEST_UAT_SESSION is not configured; authenticated module UAT remains required.'
          fi

      - name: Deploy hotfix web
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "mrhweb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
          REVISION=''
          for attempt in $(seq 1 30); do
            REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
            [[ -n "$REVISION" && "$REVISION" != '${{ steps.before.outputs.old_web_revision }}' ]] && break
            sleep 2
          done
          [[ -n "$REVISION" && "$REVISION" != '${{ steps.before.outputs.old_web_revision }}' ]]
          bash control/scripts/wait-containerapp-ready-revision.sh \
            '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_WEB_APP }}' "$REVISION" '${{ steps.build.outputs.web_image }}' 45 10
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Verify served hotfix assets and exact images
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"; READY=false
          for attempt in $(seq 1 24); do
            BUSTER="modules-runtime-hotfix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$attempt"
            STATUS="$(curl -sSL --max-time 25 -H 'Cache-Control: no-cache' -o /tmp/hotfix-index -w '%{http_code}' "$BASE/?release_check=$BUSTER" || true)"
            JS="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/hotfix-index | head -1)"
            if [[ "$STATUS" == 200 && -n "$JS" ]]; then
              case "$JS" in http*) URL="$JS";; /*) URL="$BASE$JS";; *) URL="$BASE/$JS";; esac
              curl -sSL --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/hotfix-app.js "$URL?release_check=$BUSTER" || true
              if grep -Fq '/api/engineer-task-closeout/overview' /tmp/hotfix-app.js \
                && grep -Fq 'allSettled' /tmp/hotfix-app.js \
                && grep -Fq 'X-Project-Pulse-Session' /tmp/hotfix-app.js \
                && grep -Fq ' task pages' /tmp/hotfix-app.js \
                && grep -Fq '/api/lab-equipment-tracker' /tmp/hotfix-app.js \
                && grep -Fq 'CSV / XLSX' /tmp/hotfix-app.js \
                && grep -Fq '/api/project-risk-register' /tmp/hotfix-app.js \
                && grep -Fq '/api/project-flowhive/ai/production-generate' /tmp/hotfix-app.js \
                && grep -Fq 'uncited generic template is never substituted' /tmp/hotfix-app.js \
                && grep -Fq '/api/project-forge/projects/' /tmp/hotfix-app.js; then
                READY=true
                break
              fi
            fi
            sleep 5
          done
          [[ "$READY" == true ]] || { echo 'Corrected module assets were not served.' >&2; exit 1; }
          ACTIVE_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query properties.template.containers[0].image -o tsv --only-show-errors)"
          ACTIVE_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.template.containers[0].image -o tsv --only-show-errors)"
          [[ "$ACTIVE_API" == '${{ steps.build.outputs.api_image }}' ]]
          [[ "$ACTIVE_WEB" == '${{ steps.build.outputs.web_image }}' ]]

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/modules-runtime-hotfix-test.json <<JSON
          {"environment":"test","releaseCommit":"${{ steps.release.outputs.target_commit }}","controlCommit":"${{ steps.release.outputs.control_commit }}","runId":"${{ github.run_id }}","modules":["001","001A","004","005","006","019","033","055C","055D","064","066","081","082"],"databaseMutation":true,"migrationAppliedAndVerified":["079"],"migrationImage":"${{ steps.migration.outputs.image }}","apiImage":"${{ steps.build.outputs.api_image }}","webImage":"${{ steps.build.outputs.web_image }}","apiRevision":"${{ steps.deploy_api.outputs.revision }}","webRevision":"${{ steps.deploy_web.outputs.revision }}","previousApiImage":"${{ steps.before.outputs.old_api_image }}","previousWebImage":"${{ steps.before.outputs.old_web_image }}","publicAndProtectedRoutes":"passed","servedAssets":"passed"}
          JSON

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modules-runtime-hotfix-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/modules-runtime-hotfix-test.json
          retention-days: 30

      - name: Restore previous application images on failure
        if: ${{ failure() && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set +e
          if [[ '${{ steps.deploy_api.outputs.started }}' == true ]]; then
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
              --image '${{ steps.before.outputs.old_api_image }}' --revision-suffix "mrhapirb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none
          fi
          if [[ '${{ steps.deploy_web.outputs.started }}' == true ]]; then
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
              --image '${{ steps.before.outputs.old_web_image }}' --revision-suffix "mrhwebrb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none
          fi
