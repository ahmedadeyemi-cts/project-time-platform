name: Publish PR 737 live repair state

on:
  push:
    branches:
      - ops/pr737-protected-uat-observer-20260823
    paths:
      - .github/workflows/publish-pr737-live-state.yml

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: publish-pr737-live-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_HEAD: d8441ae42f5acfa5efc89996e49e2cf041246820
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      OBSERVER_BRANCH: ops/pr737-protected-uat-observer-20260823

    steps:
      - name: Check out observer branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ops/pr737-protected-uat-observer-20260823
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve and publish current state marker
        shell: bash
        run: |
          set -Eeuo pipefail
          api() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$1"
          }

          pr="$(api "$API_ROOT/pulls/737")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          pr_state="$(jq -r '.state' <<<"$pr")"
          merged="$(jq -r '.merged' <<<"$pr")"

          repair_runs="$(api "$API_ROOT/actions/workflows/repair-pr737-migration096.yml/runs?branch=$OBSERVER_BRANCH&event=push&per_page=10")"
          repair_status="$(jq -r '[.workflow_runs[]] | sort_by(.created_at) | last | .status // "missing"' <<<"$repair_runs")"
          repair_conclusion="$(jq -r '[.workflow_runs[]] | sort_by(.created_at) | last | .conclusion // ""' <<<"$repair_runs")"
          repair_run_id="$(jq -r '[.workflow_runs[]] | sort_by(.created_at) | last | .id // ""' <<<"$repair_runs")"

          supervisor_runs="$(api "$API_ROOT/actions/workflows/supervise-pr737-migration096-release.yml/runs?branch=$OBSERVER_BRANCH&event=push&per_page=10")"
          supervisor_status="$(jq -r '[.workflow_runs[]] | sort_by(.created_at) | last | .status // "missing"' <<<"$supervisor_runs")"
          supervisor_conclusion="$(jq -r '[.workflow_runs[]] | sort_by(.created_at) | last | .conclusion // ""' <<<"$supervisor_runs")"
          supervisor_run_id="$(jq -r '[.workflow_runs[]] | sort_by(.created_at) | last | .id // ""' <<<"$supervisor_runs")"

          deployment_status='missing'
          deployment_conclusion=''
          deployment_run_id=''
          if [[ "$head_sha" != "$ORIGINAL_HEAD" ]]; then
            deployments="$(api "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/runs?event=workflow_dispatch&per_page=50")"
            deployment_status="$(jq -r --arg sha "$head_sha" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .status // "missing"' <<<"$deployments")"
            deployment_conclusion="$(jq -r --arg sha "$head_sha" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .conclusion // ""' <<<"$deployments")"
            deployment_run_id="$(jq -r --arg sha "$head_sha" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .id // ""' <<<"$deployments")"
          fi

          state='repair-running'
          if [[ "$merged" == true ]]; then
            state='merged'
          elif [[ "$deployment_status" == completed && "$deployment_conclusion" == success ]]; then
            state='deployment-success'
          elif [[ "$deployment_status" == completed && "$deployment_conclusion" != success ]]; then
            state='deployment-failed'
          elif [[ "$deployment_status" == queued || "$deployment_status" == in_progress || "$deployment_status" == pending ]]; then
            state='deployment-running'
          elif [[ "$head_sha" != "$ORIGINAL_HEAD" ]]; then
            state='repair-published'
          elif [[ "$repair_status" == completed && "$repair_conclusion" == success ]]; then
            state='repair-success-awaiting-publication'
          elif [[ "$repair_status" == completed && "$repair_conclusion" != success ]]; then
            state='repair-failed'
          fi

          mkdir -p docs/architecture/pr737-live-state
          rm -f docs/architecture/pr737-live-state/*.marker
          printf '%s\n' "$state" > "docs/architecture/pr737-live-state/$state.marker"
          jq -n \
            --arg state "$state" \
            --arg headSha "$head_sha" \
            --arg prState "$pr_state" \
            --argjson merged "$merged" \
            --arg repairStatus "$repair_status" \
            --arg repairConclusion "$repair_conclusion" \
            --arg repairRunId "$repair_run_id" \
            --arg supervisorStatus "$supervisor_status" \
            --arg supervisorConclusion "$supervisor_conclusion" \
            --arg supervisorRunId "$supervisor_run_id" \
            --arg deploymentStatus "$deployment_status" \
            --arg deploymentConclusion "$deployment_conclusion" \
            --arg deploymentRunId "$deployment_run_id" \
            '{state:$state,headSha:$headSha,prState:$prState,merged:$merged,repair:{status:$repairStatus,conclusion:$repairConclusion,runId:$repairRunId},supervisor:{status:$supervisorStatus,conclusion:$supervisorConclusion,runId:$supervisorRunId},deployment:{status:$deploymentStatus,conclusion:$deploymentConclusion,runId:$deploymentRunId},productionMutation:false}' \
            > docs/architecture/pr737-live-state/state.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/architecture/pr737-live-state
          if ! git diff --cached --quiet; then
            git commit -m "Record PR 737 live state: $state"
            git push origin HEAD:"refs/heads/$OBSERVER_BRANCH"
          fi
          cat docs/architecture/pr737-live-state/state.json
