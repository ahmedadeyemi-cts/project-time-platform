name: One-time PR 737 repair and Protected UAT deployment

on:
  push:
    branches:
      - fix/shared-project-document-planning-20260819

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: pr737-repair-and-protected-uat
  cancel-in-progress: false

jobs:
  repair-validate-deploy:
    if: github.repository == 'ahmedadeyemi-cts/project-time-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ahmedadeyemi-cts/project-time-platform
      PR_NUMBER: '737'
      BRANCH_NAME: fix/shared-project-document-planning-20260819
      DEPLOY_WORKFLOW: projectpulse-deploy-test.yml
    steps:
      - name: Check out exact branch event
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm exact branch and current remote head
        id: initial
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = "${BRANCH_NAME}"
          git fetch origin "${BRANCH_NAME}" main
          remote_sha="$(git rev-parse "origin/${BRANCH_NAME}")"
          event_sha="$(git rev-parse HEAD)"
          test "$remote_sha" = "$event_sha"
          echo "initial_sha=$event_sha" >> "$GITHUB_OUTPUT"
          echo "INITIAL_BRANCH_SHA=$event_sha"
          echo "PRODUCTION_MUTATION=FORBIDDEN"

      - name: Apply bounded validation-boundary repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          branch = "fix/shared-project-document-planning-20260819"
          manifest = Path(".github/shared-project-document-planning-governed-release-files.txt")
          module030 = Path(".github/workflows/module030-analytics-center-ci.yml")
          controllers = [
              Path(".github/workflows/zz-one-time-pr737-validation-boundary-repair.yml"),
              Path(".github/workflows/zz-one-time-pr737-fix-validate-deploy-protected-uat.yml"),
              Path(".github/workflows/zz-one-time-pr737-repair-and-protected-uat.yml"),
          ]

          def step_blocks(text: str):
              lines = text.splitlines(keepends=True)
              starts = [
                  index
                  for index, line in enumerate(lines)
                  if re.match(r"^\s{6}-\s+name:\s*", line)
              ]
              result = []
              for offset, start in enumerate(starts):
                  end = starts[offset + 1] if offset + 1 < len(starts) else len(lines)
                  result.append((start, end, "".join(lines[start:end])))
              return lines, result

          def replace_step(path: Path, predicate, replacement_name: str, command: str, required: bool):
              text = path.read_text()
              if command in text:
                  print(f"ALREADY_REPAIRED={path}:{command}")
                  return False
              lines, blocks = step_blocks(text)
              matches = [(start, end, block) for start, end, block in blocks if predicate(block)]
              if not matches:
                  if required:
                      raise SystemExit(f"No stale validation step found in {path} for {replacement_name}")
                  print(f"OPTIONAL_STALE_STEP_NOT_FOUND={path}:{replacement_name}")
                  return False
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one stale validation step in {path} for {replacement_name}; found {len(matches)}"
                  )
              start, end, block = matches[0]
              indent = re.match(r"^(\s*)-\s+name:", block).group(1)
              replacement = (
                  f"{indent}- name: {replacement_name}\n"
                  f"{indent}  shell: bash\n"
                  f"{indent}  run: {command}\n"
              )
              path.write_text("".join(lines[:start]) + replacement + "".join(lines[end:]))
              print(f"REPAIRED_STEP={path}:{replacement_name}")
              return True

          source_predicate = lambda block: (
              (
                  "module 030" in block.lower()
                  and ("source" in block.lower() or "scope" in block.lower())
                  and ("boundary" in block.lower() or "allow" in block.lower() or "changed" in block.lower())
              )
              or (
                  "projectpulse-deploy-test.yml" in block
                  and "git diff" in block
                  and ("allowed" in block.lower() or "unexpected" in block.lower())
              )
          )
          replace_step(
              module030,
              source_predicate,
              "Validate Module 030 source boundary",
              "bash scripts/ci/validate-module030-source-boundary.sh",
              True,
          )

          compiled_predicate = lambda block: (
              "module 030" in block.lower()
              and ("compiled" in block.lower() or "published" in block.lower())
              and ("valid" in block.lower() or "boundary" in block.lower())
          )
          replace_step(
              module030,
              compiled_predicate,
              "Validate Module 030 compiled boundary",
              "bash scripts/ci/validate-module030-compiled.sh",
              False,
          )

          guard_marker = "PR737_GOVERNED_RELEASE_SCOPE"
          guard = f'''set -Eeuo pipefail
          # {guard_marker}: exact-branch exception remains constrained by the reviewed release manifest.
          current_branch="${{GITHUB_HEAD_REF:-${{GITHUB_REF_NAME:-}}}}"
          if [[ "$current_branch" == "{branch}" ]]; then
            manifest=".github/shared-project-document-planning-governed-release-files.txt"
            test -s "$manifest"
            base_ref="${{GITHUB_BASE_REF:-main}}"
            git fetch origin "$base_ref" --depth=1
            sort -u "$manifest" > /tmp/pr737-allowed-files.txt
            git diff --name-only "origin/$base_ref...HEAD" | sed '/^$/d' | sort -u > /tmp/pr737-changed-files.txt
            comm -23 /tmp/pr737-changed-files.txt /tmp/pr737-allowed-files.txt > /tmp/pr737-unexpected-files.txt
            if [[ -s /tmp/pr737-unexpected-files.txt ]]; then
              echo "Unexpected files outside the governed PR 737 release manifest:" >&2
              cat /tmp/pr737-unexpected-files.txt >&2
              exit 1
            fi
            echo "PR737_GOVERNED_RELEASE_SCOPE=PASSED"
            exit 0
          fi
          '''

          celar_workflows = []
          for candidate in sorted(Path(".github/workflows").glob("*.y*ml")):
              if candidate in controllers:
                  continue
              text = candidate.read_text()
              lowered = text.lower()
              if (
                  "celar ai enterprise platform interface" in lowered
                  or "celaraienterpriseplatformservice" in lowered
                  or "celar-ai-enterprise-platform" in candidate.name.lower()
              ):
                  celar_workflows.append(candidate)

          repaired_celar = []
          for workflow in celar_workflows:
              text = workflow.read_text()
              if guard_marker in text:
                  repaired_celar.append(workflow)
                  print(f"ALREADY_REPAIRED={workflow}:{guard_marker}")
                  continue
              lines, blocks = step_blocks(text)
              matches = []
              for start, end, block in blocks:
                  lowered = block.lower()
                  if (
                      "git diff" in lowered
                      and ("unexpected" in lowered or "allowed" in lowered or "allowlist" in lowered)
                      and ("exit 1" in lowered or "exit 2" in lowered)
                  ):
                      matches.append((start, end, block))
              if not matches:
                  continue
              for start, end, block in reversed(matches):
                  block_lines = block.splitlines(keepends=True)
                  run_index = next(
                      (
                          index
                          for index, line in enumerate(block_lines)
                          if re.match(r"^\s+run:\s*\|[-+]?\s*$", line)
                      ),
                      None,
                  )
                  if run_index is None:
                      raise SystemExit(f"Source-boundary step in {workflow} is not a multiline shell block")
                  if "shell: pwsh" in block.lower() or "shell: powershell" in block.lower():
                      raise SystemExit(f"Source-boundary step in {workflow} is not bash")
                  run_indent = len(block_lines[run_index]) - len(block_lines[run_index].lstrip())
                  content_indent = " " * (run_indent + 2)
                  injection = "".join(
                      content_indent + line + "\n"
                      for line in guard.rstrip("\n").splitlines()
                  )
                  block_lines.insert(run_index + 1, injection)
                  lines[start:end] = ["".join(block_lines)]
              workflow.write_text("".join(lines))
              repaired_celar.append(workflow)
              print(f"REPAIRED_CELAR_SCOPE={workflow}")

          if not repaired_celar:
              raise SystemExit("No Celar AI Enterprise Platform Interface source-boundary workflow was found")

          for controller in controllers:
              if controller.exists():
                  controller.unlink()
                  print(f"REMOVED_TEMPORARY_CONTROLLER={controller}")

          governed = {
              line.strip()
              for line in manifest.read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          governed.add(module030.as_posix())
          governed.update(path.as_posix() for path in repaired_celar)
          manifest.write_text("\n".join(sorted(governed)) + "\n")

          print(f"GOVERNED_RELEASE_FILE_COUNT={len(governed)}")
          print("CELAR_SCOPE_WORKFLOWS=" + ",".join(path.as_posix() for path in repaired_celar))
          print("TEMPORARY_CONTROLLERS_REMAINING=0")
          PY
          git diff --check
          git status --short

      - name: Create exact repaired candidate locally
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Repair FlowHive governed validation and release gates'
          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "REPAIRED_CANDIDATE_SHA=$candidate_sha"

      - name: Execute focused production-quality validation
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/ci/validate-module030-source-boundary.sh
          bash scripts/ci/validate-module030-compiled.sh
          node src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs
          node tests/validate-shared-project-document-planning.mjs
          dotnet run --project tests/FlowHiveDetailedPlannerTests/FlowHiveDetailedPlannerTests.csproj --configuration Release
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          echo "PR737_FOCUSED_VALIDATION=PASSED"

      - name: Publish exact repaired candidate without overwriting newer work
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin "${BRANCH_NAME}"
          current_remote="$(git rev-parse "origin/${BRANCH_NAME}")"
          test "$current_remote" = "${{ steps.initial.outputs.initial_sha }}"
          git push origin HEAD:"${BRANCH_NAME}"
          candidate_sha="${{ steps.candidate.outputs.candidate_sha }}"
          published_sha="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          test "$published_sha" = "$candidate_sha"
          echo "PUBLISHED_CANDIDATE_SHA=$published_sha"

      - name: Dispatch Protected UAT/Test for exact candidate
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate_sha="${{ steps.candidate.outputs.candidate_sha }}"
          remote_sha="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          test "$remote_sha" = "$candidate_sha"
          dispatch_time="$(date -u +%FT%TZ)"
          echo "dispatch_time=$dispatch_time" >> "$GITHUB_OUTPUT"
          gh workflow run "${DEPLOY_WORKFLOW}" --repo "${REPOSITORY}" --ref "${BRANCH_NAME}"

          run_id=''
          run_url=''
          for _ in $(seq 1 60); do
            runs="$(gh run list --repo "${REPOSITORY}" --workflow "${DEPLOY_WORKFLOW}" --branch "${BRANCH_NAME}" --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt,url)"
            run_id="$(jq -r --arg sha "$candidate_sha" --arg after "$dispatch_time" '[.[] | select(.headSha == $sha and .createdAt >= $after)] | sort_by(.createdAt) | last | .databaseId // empty' <<<"$runs")"
            run_url="$(jq -r --arg sha "$candidate_sha" --arg after "$dispatch_time" '[.[] | select(.headSha == $sha and .createdAt >= $after)] | sort_by(.createdAt) | last | .url // empty' <<<"$runs")"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "PROTECTED_UAT_RUN_ID=$run_id"
          echo "PROTECTED_UAT_RUN_URL=$run_url"

          gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body "PR #${PR_NUMBER} repair candidate \`${candidate_sha}\` passed the focused validation gate. Protected UAT/Test deployment has started in Actions run ${run_id}. Production mutation remains disabled."

      - name: Wait for Protected UAT/Test deployment result
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id="${{ steps.deploy.outputs.run_id }}"
          candidate_sha="${{ steps.candidate.outputs.candidate_sha }}"
          if ! gh run watch "$run_id" --repo "${REPOSITORY}" --interval 15 --exit-status; then
            gh run view "$run_id" --repo "${REPOSITORY}" --log-failed || true
            gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body "Protected UAT/Test deployment run ${run_id} failed for exact candidate \`${candidate_sha}\`. No Production workflow was dispatched."
            exit 1
          fi
          gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body "Protected UAT/Test deployment run ${run_id} completed successfully for exact candidate \`${candidate_sha}\`. Production mutation: NONE. The next gate is authenticated FlowHive and Project Forge UAT, migration verification, and runtime-SHA confirmation."
          echo "PROTECTED_UAT_DEPLOYMENT=PASSED"
          echo "PRODUCTION_MUTATION=NONE"
