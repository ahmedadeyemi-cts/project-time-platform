name: Apply Platform Security Remediation 2026-07-29

on:
  push:
    branches:
      - security/platform-findings-remediation-20260729
    paths:
      - .github/workflows/apply-platform-security-remediation-20260729.yml
      - scripts/security/apply-platform-security-remediation-20260729.py
      - src/backend/ProjectTime.Api/Modules/SecurityHardeningModule.cs
      - ops/projectpulse/scripts/projectpulse-send-backup-email.py
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/apply-platform-security-remediation-20260729.yml
      - scripts/security/apply-platform-security-remediation-20260729.py
      - src/backend/ProjectTime.Api/Modules/SecurityHardeningModule.cs
      - ops/projectpulse/scripts/projectpulse-send-backup-email.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: platform-security-remediation-20260729
  cancel-in-progress: false

jobs:
  apply-validate-and-commit:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.head_ref == 'security/platform-findings-remediation-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_BRANCH: security/platform-findings-remediation-20260729

    steps:
      - name: Check out isolated security branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify branch boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test "$GITHUB_HEAD_REF" = "$TARGET_BRANCH"
          else
            test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          fi
          test -s scripts/security/apply-platform-security-remediation-20260729.py
          test -s src/backend/ProjectTime.Api/Modules/SecurityHardeningModule.cs
          test -s ops/projectpulse/scripts/projectpulse-send-backup-email.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic source remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/security/apply-platform-security-remediation-20260729.py')
          text = path.read_text(encoding='utf-8')

          broad_upload_check = '        \'var storedFileName = $"{documentType}_\',\n'
          scoped_upload_check = '        \'var storedFileName = $"{documentType}_{Guid.NewGuid():N}{Path.GetExtension(safeOriginalFileName)}";\',\n'
          if broad_upload_check in text:
              text = text.replace(broad_upload_check, scoped_upload_check, 1)

          first_widget_only_check = '    forbidden=(\'href="${escapeHtml(item.actionUrl)}"\',),\n'
          if first_widget_only_check in text:
              text = text.replace(first_widget_only_check, '    forbidden=(),\n', 1)

          broad_temp_check = 'require(CF_GUARD, required=("projectpulse-019m-cf.XXXXXX",), forbidden=("/tmp/projectpulse-019m-cf-",))'
          scoped_temp_check = 'require(CF_GUARD, required=("projectpulse-019m-cf.XXXXXX",), forbidden=("/tmp/projectpulse-019m-cf-api", "/tmp/projectpulse-019m-cf-registry.json", "/tmp/projectpulse-019m-cf-engineer-denial.json"))'
          if broad_temp_check in text:
              text = text.replace(broad_temp_check, scoped_temp_check, 1)

          path.write_text(text, encoding='utf-8')
          print('SECURITY_REMEDIATION_POSTCONDITIONS=SCOPED')
          PY

          python -m py_compile scripts/security/apply-platform-security-remediation-20260729.py
          python scripts/security/apply-platform-security-remediation-20260729.py

          python - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/project-time-web/index.html')
          html = path.read_text(encoding='utf-8')
          topbar_anchor = '<script id="projectpulse-022d-topbar-notification-dropdown">'

          if topbar_anchor not in html:
              raise RuntimeError('Topbar notification script anchor was not found.')

          before, topbar = html.split(topbar_anchor, 1)
          marker = 'const projectPulse022DTopbarSafeActionUrl'

          if marker not in topbar:
              insert_after = '  const isViewAs = () => !!getViewAsUserId();\n\n'
              helper = '''  const projectPulse022DTopbarSafeActionUrl = (value) => {
            const candidate = String(value || "").trim();
            if (!candidate) return "";

            if (
              candidate.startsWith("/")
              && !candidate.startsWith("//")
              && !candidate.includes(String.fromCharCode(92))
              && !Array.from(candidate).some((character) => character.charCodeAt(0) < 32)
            ) {
              return candidate;
            }

            try {
              const parsed = new URL(candidate);
              if (parsed.protocol === "https:" && !parsed.username && !parsed.password) {
                return parsed.href;
              }
            } catch (_) {
              return "";
            }

            return "";
          };

          '''

              if insert_after not in topbar:
                  raise RuntimeError('Topbar action URL helper insertion point was not found.')
              topbar = topbar.replace(insert_after, insert_after + helper, 1)

          vulnerable_link = '${item.actionUrl ? `<a class="projectpulse-022d-topbar-action" href="${escapeHtml(item.actionUrl)}">Open related page</a>` : ""}'
          safe_link = '${projectPulse022DTopbarSafeActionUrl(item.actionUrl) ? `<a class="projectpulse-022d-topbar-action" href="${escapeHtml(projectPulse022DTopbarSafeActionUrl(item.actionUrl))}" rel="noopener noreferrer">Open related page</a>` : ""}'

          if vulnerable_link in topbar:
              topbar = topbar.replace(vulnerable_link, safe_link, 1)

          html = before + topbar_anchor + topbar

          if 'href="${escapeHtml(item.actionUrl)}"' in html:
              raise RuntimeError('An unvalidated notification action URL renderer remains.')
          if marker not in html:
              raise RuntimeError('Topbar action URL allowlist helper was not installed.')

          path.write_text(html, encoding='utf-8')
          print('SECURITY_NOTIFICATION_ACTION_URL_RENDERERS=HARDENED')
          PY

          git diff --check

      - name: Validate hardened Python and shell sources
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            deployment/rocky-linux/import-company-holidays.py \
            deployment/rocky-linux/serve-frontend-public-restricted.py \
            ops/projectpulse/scripts/projectpulse-send-backup-email.py
          bash -n ops/projectpulse/scripts/projectpulse-sync-status-export.sh
          bash -n ops/projectpulse/scripts/projectpulse-restore-validation-export.sh
          bash -n scripts/021-release-smoke.sh
          bash -n scripts/validate-019m-bl-through-bu-production-hardening.sh
          bash -n scripts/validate-019m-az-through-bj.sh
          bash -n scripts/validate-019m-cf-production-wording-compatibility-guard.sh

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build backend and run authorization regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet restore src/backend/ProjectTime.Api/ProjectTime.Api.csproj
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --no-restore
          dotnet run \
            --project tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj \
            --configuration Release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Build frontend
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run build

      - name: Commit validated source remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/security/apply-platform-security-remediation-20260729.py \
            src/backend/ProjectTime.Api/Program.cs \
            src/backend/ProjectTime.Api/Modules/SecurityHardeningModule.cs \
            src/frontend/project-time-web/index.html \
            src/frontend/project-time-web/src/WorkRegisterCenter.jsx \
            ops/projectpulse/scripts/projectpulse-sync-status-export.sh \
            ops/projectpulse/scripts/projectpulse-restore-validation-export.sh \
            deployment/rocky-linux/import-company-holidays.py \
            deployment/rocky-linux/serve-frontend-public-restricted.py \
            scripts/021-release-smoke.sh \
            scripts/validate-019m-bl-through-bu-production-hardening.sh \
            scripts/validate-019m-az-through-bj.sh \
            scripts/validate-019m-cf-production-wording-compatibility-guard.sh

          if git diff --cached --quiet; then
            echo 'SECURITY_REMEDIATION_ALREADY_CURRENT=YES'
            exit 0
          fi

          git diff --cached --check
          git commit -m 'Remediate platform security findings [security-source-applied]'
          git push origin "HEAD:$TARGET_BRANCH"
          echo 'SECURITY_REMEDIATION_SOURCE_COMMITTED=YES'
