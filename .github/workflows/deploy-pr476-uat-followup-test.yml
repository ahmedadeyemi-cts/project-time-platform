name: Deploy PR476 UAT Follow-up to Test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pr476-uat-followup-test.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-pr476-uat-followup-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy PR476 UAT follow-up to Test'
    name: Apply Migration 068 and deploy exact PR476 release to Test
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_SHA: e7a9071c8f165c9344c30b219dde804e9ec320c5
      MIGRATION_ID: 068_module006_standalone_pipeline_management
    steps:
      - name: Check out deployment control
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact application release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: e7a9071c8f165c9344c30b219dde804e9ec320c5
          path: release
          fetch-depth: 1
          persist-credentials: false

      - name: Guard exact Test-only release
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          CONTROL_SHA="$(git -C control rev-parse HEAD)"
          TARGET_SHA="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_SHA" == "$GITHUB_SHA" ]]
          [[ "$TARGET_SHA" == "$RELEASE_SHA" ]]
          git -C control merge-base --is-ancestor "$RELEASE_SHA" HEAD

          CHANGED_AFTER_RELEASE="$(git -C control diff --name-only "$RELEASE_SHA"...HEAD)"
          printf '%s\n' "$CHANGED_AFTER_RELEASE"
          [[ "$CHANGED_AFTER_RELEASE" == '.github/workflows/deploy-pr476-uat-followup-test.yml' ]] || {
            echo 'Deployment control main contains application changes after the exact PR476 release.' >&2
            exit 1
          }

          test -f release/database/migrations/068_module006_standalone_pipeline_management.sql
          test -f release/database/rollback/068_module006_standalone_pipeline_management_rollback.sql
          test -f release/src/backend/ProjectTime.Api/Modules/Module006StandalonePipelineModule.cs
          test -f release/src/backend/ProjectTime.Api/Modules/Module006StandaloneTaskModule.cs
          test -f release/src/frontend/project-time-web/src/ProjectRegisterCenter.jsx
          test -f release/src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx
          test -f release/src/frontend/project-time-web/src/FinancialOperationsRecoveryWorkspace.jsx
          test -f release/src/frontend/project-time-web/src/ProjectAllocationInfoPanel.jsx
          test -f release/src/frontend/project-time-web/src/WorkRegisterCenter.jsx
          test -f release/tests/validate-uat-followup-modules.py

          grep -Fq 'MapModule006StandalonePipelineEndpoints' release/src/backend/ProjectTime.Api/Modules/Module006StandalonePipelineModule.cs
          grep -Fq 'MapModule006StandaloneTaskEndpoints' release/src/backend/ProjectTime.Api/Modules/Module006StandaloneTaskModule.cs
          grep -Fq 'linkedToModule055C = false' release/src/backend/ProjectTime.Api/Modules/Module006StandalonePipelineModule.cs
          grep -Fq 'module006-standalone-pipeline-v1' release/src/frontend/project-time-web/src/ProjectRegisterCenter.jsx
          grep -Fq 'MODULE_065_REACT_OWNED_OPEN_ACTION' release/src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx
          grep -Fq 'canRetry = false, compact = false' release/src/frontend/project-time-web/src/FinancialOperationsRecoveryWorkspace.jsx
          grep -Fq 'Lifecycle controls are temporarily unavailable' release/src/frontend/project-time-web/src/ProjectAllocationInfoPanel.jsx
          grep -Fq 'data-pr467-row-work-identifier' release/src/frontend/project-time-web/src/WorkRegisterCenter.jsx
          python3 release/tests/validate-uat-followup-modules.py
          python3 release/scripts/security/validate-repository-security-posture.py
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo 'PR476_RELEASE_GUARD=PASS environment=test production=false'

      - name: Test Migration 068 apply, immutability, rollback, and reapply
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTAINER="pr476-migration-068-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$CONTAINER" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run --detach --rm \
            --name "$CONTAINER" \
            -e POSTGRES_USER=projectpulse \
            -e POSTGRES_PASSWORD=projectpulse-test-only \
            -e POSTGRES_DB=projectpulse \
            -v "$GITHUB_WORKSPACE/release:/workspace:ro" \
            postgres:16-alpine >/dev/null

          psql_exec() {
            docker exec -i -e PGPASSWORD=projectpulse-test-only "$CONTAINER" \
              psql -v ON_ERROR_STOP=1 -U projectpulse -d projectpulse "$@"
          }
          value() { psql_exec -Atqc "$1" | tr -d '\r'; }
          assert_eq() {
            [[ "$1" == "$2" ]] || { echo "ASSERTION_FAILED $3 expected=$1 actual=$2" >&2; exit 1; }
            echo "ASSERTION_PASSED $3=$2"
          }
          expect_failure() {
            local sql="$1" expected="$2" label="$3" log="/tmp/pr476-$3.log"
            if psql_exec -c "$sql" >"$log" 2>&1; then
              echo "ASSERTION_FAILED $label unexpectedly_succeeded" >&2
              exit 1
            fi
            grep -Fq "$expected" "$log" || { cat "$log" >&2; exit 1; }
            echo "ASSERTION_PASSED $label"
          }

          for attempt in $(seq 1 60); do
            if psql_exec -Atqc 'SELECT 1;' >/dev/null 2>&1; then break; fi
            [[ "$attempt" != 60 ]] || { docker logs "$CONTAINER" >&2; exit 1; }
            sleep 1
          done

          psql_exec <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE TABLE schema_migrations (
            migration_id TEXT PRIMARY KEY,
            description TEXT NOT NULL DEFAULT '',
            applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE TABLE app_users (
            user_id UUID PRIMARY KEY,
            email TEXT NOT NULL UNIQUE,
            display_name TEXT NOT NULL,
            is_active BOOLEAN NOT NULL DEFAULT TRUE
          );
          INSERT INTO app_users(user_id,email,display_name) VALUES
            ('10000000-0000-0000-0000-000000000001','admin@example.test','Administrator');
          SQL

          psql_exec -f /workspace/database/migrations/068_module006_standalone_pipeline_management.sql >/dev/null
          psql_exec -f /workspace/database/migrations/068_module006_standalone_pipeline_management.sql >/dev/null
          assert_eq 1 "$(value "SELECT COUNT(*) FROM schema_migrations WHERE migration_id='068_module006_standalone_pipeline_management';")" migration_registered_once
          assert_eq 4 "$(value "SELECT COUNT(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('module006_pipeline_records','module006_pipeline_updates','module006_pipeline_tasks','module006_pipeline_task_events');")" tables_created

          psql_exec <<'SQL'
          INSERT INTO module006_pipeline_records (
            module006_pipeline_record_id,source_project_code,source_kind,customer,business_unit,
            uss_owner,project_name,quote_text,estimated_value,status,lifecycle,revision,is_archived,
            created_by_user_id,updated_by_user_id
          ) VALUES (
            '20000000-0000-0000-0000-000000000001','P.TEST','manual','Toyota','Test','Owner',
            'Migration Test','Q-TEST',1,'On Track','active',1,FALSE,
            '10000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001'
          );
          INSERT INTO module006_pipeline_updates (
            module006_pipeline_record_id,note_text,status,created_by_user_id
          ) VALUES (
            '20000000-0000-0000-0000-000000000001','Append-only project update','On Track',
            '10000000-0000-0000-0000-000000000001'
          );
          INSERT INTO module006_pipeline_tasks (
            module006_pipeline_task_id,module006_pipeline_record_id,task_title,task_status,
            created_by_user_id,updated_by_user_id
          ) VALUES (
            '30000000-0000-0000-0000-000000000001','20000000-0000-0000-0000-000000000001',
            'Standalone task','not_started','10000000-0000-0000-0000-000000000001',
            '10000000-0000-0000-0000-000000000001'
          );
          INSERT INTO module006_pipeline_task_events (
            module006_pipeline_task_id,event_type,note_text,task_status,created_by_user_id
          ) VALUES (
            '30000000-0000-0000-0000-000000000001','created','Task created','not_started',
            '10000000-0000-0000-0000-000000000001'
          );
          SQL
          expect_failure "UPDATE module006_pipeline_updates SET note_text='changed';" 'append-only' immutable_project_update
          expect_failure "DELETE FROM module006_pipeline_task_events;" 'append-only' immutable_task_event

          psql_exec -f /workspace/database/rollback/068_module006_standalone_pipeline_management_rollback.sql >/dev/null
          assert_eq '' "$(value "SELECT COALESCE(to_regclass('public.module006_pipeline_records')::text,'');")" rollback_removed_records
          assert_eq 0 "$(value "SELECT COUNT(*) FROM schema_migrations WHERE migration_id='068_module006_standalone_pipeline_management';")" rollback_removed_registration
          psql_exec -f /workspace/database/migrations/068_module006_standalone_pipeline_management.sql >/dev/null
          assert_eq 1 "$(value "SELECT COUNT(*) FROM schema_migrations WHERE migration_id='068_module006_standalone_pipeline_management';")" safe_reapply
          echo 'MIGRATION_068_LIFECYCLE=PASS'

      - name: Azure login for Test
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Test database and Container Apps configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t ENV_NAMES < <(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            --query 'properties.template.containers[0].env[].name' -o tsv)
          printf '%s\n' "${ENV_NAMES[@]}" | sort -u > /tmp/pr476-api-env-names
          for name in PTP_DB_HOST PTP_DB_PORT PTP_DB_NAME PTP_DB_USER PTP_DB_PASSWORD; do
            grep -Fxq "$name" /tmp/pr476-api-env-names || { echo "Missing required Test API variable: $name" >&2; exit 1; }
          done
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          [[ "${API_MODE,,}" == single && "${WEB_MODE,,}" == single ]]
          echo 'PR476_TEST_CONFIGURATION=PASS'

      - name: Load private Test database connection
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        run: bash control/scripts/export-pr55-test-database-url.sh

      - name: Capture immutable rollback images
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          RAW_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Image is outside approved ACR: $image" >&2; return 1 ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }
          echo "old_api_image=$(resolve_digest "$RAW_API")" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$(resolve_digest "$RAW_WEB")" >> "$GITHUB_OUTPUT"

      - name: Build exact immutable API and web images
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          API_REPO='project-health-dashboard-api'
          WEB_REPO='project-health-dashboard-web'
          API_DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$API_REPO:uat476-$RELEASE_SHA" release/deployment/containers/api/Dockerfile release)"
          WEB_DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$WEB_REPO:uat476-$RELEASE_SHA" release/deployment/containers/web/Dockerfile release)"
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$API_REPO@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$WEB_REPO@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build checksum-pinned Migration 068 image
        id: migration
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/pr476-migrator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          install -m 0644 control/deployment/containers/pr55-migrator/Dockerfile "$CONTEXT/Dockerfile"
          install -m 0644 release/database/migrations/068_module006_standalone_pipeline_management.sql "$CONTEXT/migrations/068_module006_standalone_pipeline_management.sql"
          printf '%s\n' "$RELEASE_SHA" > "$CONTEXT/release-commit"
          (cd "$CONTEXT/migrations" && sha256sum 068_module006_standalone_pipeline_management.sql > SHA256SUMS)
          cat > "$CONTEXT/apply-pr55-test-migrations.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOT="${1:?release root required}"
          EXPECTED='e7a9071c8f165c9344c30b219dde804e9ec320c5'
          DB_URL="${PROJECTPULSE_TEST_DATABASE_URL:?Test database URL is required}"
          [[ "$(cat "$ROOT/.projectpulse-release-commit")" == "$EXPECTED" ]]
          (cd "$ROOT/database/migrations" && sha256sum -c SHA256SUMS)
          value() { psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc "$1" | tr -d '\r'; }
          [[ "$(value "SELECT COUNT(*) FROM schema_migrations WHERE migration_id='067_uat_expense_lifecycle_work_identifiers';")" == 1 ]] || {
            echo 'Migration 067 prerequisite is not registered in Test.' >&2
            exit 1
          }
          USERS_BEFORE="$(value 'SELECT COUNT(*) FROM app_users;')"
          PROJECTS_BEFORE="$(value "SELECT CASE WHEN to_regclass('public.projects') IS NULL THEN 0 ELSE (SELECT COUNT(*) FROM projects) END;")"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$ROOT/database/migrations/068_module006_standalone_pipeline_management.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$ROOT/database/migrations/068_module006_standalone_pipeline_management.sql"
          [[ "$(value "SELECT COUNT(*) FROM schema_migrations WHERE migration_id='068_module006_standalone_pipeline_management';")" == 1 ]]
          [[ "$(value "SELECT COUNT(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('module006_pipeline_records','module006_pipeline_updates','module006_pipeline_tasks','module006_pipeline_task_events');")" == 4 ]]
          [[ "$(value "SELECT COUNT(*) FROM pg_trigger WHERE NOT tgisinternal AND tgname IN ('trg_module006_pipeline_updates_immutable','trg_module006_pipeline_task_events_immutable');")" == 2 ]]
          [[ "$(value "SELECT COUNT(*) FROM module006_pipeline_records;")" == 0 ]]
          [[ "$(value "SELECT COUNT(*) FROM module006_pipeline_tasks;")" == 0 ]]
          [[ "$(value 'SELECT COUNT(*) FROM app_users;')" == "$USERS_BEFORE" ]]
          [[ "$(value "SELECT CASE WHEN to_regclass('public.projects') IS NULL THEN 0 ELSE (SELECT COUNT(*) FROM projects) END;")" == "$PROJECTS_BEFORE" ]]
          echo 'MIGRATION_068_TEST_DATABASE=APPLIED_AND_VERIFIED'
          SCRIPT
          chmod 0555 "$CONTEXT/apply-pr55-test-migrations.sh"
          DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-uat476-migrator:${RELEASE_SHA}-${GITHUB_RUN_ID}" "$CONTEXT/Dockerfile" "$CONTEXT")"
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-uat476-migrator@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Apply Migration 068 inside the Test private network
        shell: bash
        env:
          MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
        run: |
          set -Eeuo pipefail
          RESOURCE_GROUP='${{ vars.AZURE_RESOURCE_GROUP }}'
          API_APP='${{ vars.AZURE_API_APP }}'
          ACR_NAME='${{ vars.AZURE_ACR_NAME }}'
          JOB_NAME="uat476-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DATABASE_URL="$PROJECTPULSE_TEST_DATABASE_URL"
          [[ "$MIGRATION_IMAGE" == "$ACR_NAME.azurecr.io/"*@sha256:* ]]
          [[ "$JOB_NAME" =~ ^[a-z][a-z0-9-]{0,30}[a-z0-9]$ ]]
          printf '::add-mask::%s\n' "${DATABASE_URL//%/%25}"

          ENVIRONMENT_ID="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.managedEnvironmentId -o tsv)"
          [[ -n "$ENVIRONMENT_ID" && "$ENVIRONMENT_ID" != null ]]
          ACR_TOKEN="$(az acr login --name "$ACR_NAME" --expose-token --query accessToken -o tsv)"
          printf '::add-mask::%s\n' "${ACR_TOKEN//%/%25}"
          JOB_CREATED=0
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            unset DATABASE_URL ACR_TOKEN
            if (( JOB_CREATED == 1 )); then
              az containerapp job delete -g "$RESOURCE_GROUP" -n "$JOB_NAME" --yes --output none --only-show-errors || true
            fi
            exit "$status"
          }
          trap cleanup EXIT INT TERM

          az containerapp job create \
            -g "$RESOURCE_GROUP" \
            -n "$JOB_NAME" \
            --environment "$ENVIRONMENT_ID" \
            --trigger-type Manual \
            --replica-timeout 1200 \
            --replica-retry-limit 0 \
            --replica-completion-count 1 \
            --parallelism 1 \
            --image "$MIGRATION_IMAGE" \
            --cpu 0.25 \
            --memory 0.5Gi \
            --registry-server "$ACR_NAME.azurecr.io" \
            --registry-username 00000000-0000-0000-0000-000000000000 \
            --registry-password "$ACR_TOKEN" \
            --secrets "projectpulse-db-url=$DATABASE_URL" \
            --env-vars PROJECTPULSE_TEST_DATABASE_URL=secretref:projectpulse-db-url \
            --tags projectpulse-scope=pr476-test projectpulse-release="$RELEASE_SHA" \
            --output none --only-show-errors
          JOB_CREATED=1
          unset DATABASE_URL ACR_TOKEN
          EXECUTION="$(az containerapp job start -g "$RESOURCE_GROUP" -n "$JOB_NAME" --query name -o tsv --only-show-errors)"
          [[ -n "$EXECUTION" ]]
          for attempt in $(seq 1 120); do
            STATUS="$(az containerapp job execution list -g "$RESOURCE_GROUP" -n "$JOB_NAME" --query "[?name=='$EXECUTION'].properties.status | [0]" -o tsv --only-show-errors)"
            case "$STATUS" in
              Succeeded) echo 'MIGRATION_068_PRIVATE_JOB=Succeeded'; exit 0 ;;
              Failed|Canceled)
                az containerapp job logs show -g "$RESOURCE_GROUP" -n "$JOB_NAME" --execution "$EXECUTION" --container "$JOB_NAME" --tail 250 --only-show-errors >&2 || true
                exit 1
                ;;
            esac
            sleep 5
          done
          az containerapp job logs show -g "$RESOURCE_GROUP" -n "$JOB_NAME" --execution "$EXECUTION" --container "$JOB_NAME" --tail 250 --only-show-errors >&2 || true
          exit 1

      - name: Deploy exact API image
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT="$RELEASE_SHA" \
            --revision-suffix "u476api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none

      - name: Validate API health and new protected routes
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          probe() {
            local path="$1" expected="$2" status=''
            for attempt in $(seq 1 36); do
              status="$(curl -sS -o "/tmp/pr476-${path//\//-}.body" -w '%{http_code}' \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "$BASE$path?release_check=pr476-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" || true)"
              if [[ ",$expected," == *",$status,"* ]]; then return 0; fi
              sleep 10
            done
            echo "$path did not reach expected HTTP status $expected; last=$status" >&2
            cat "/tmp/pr476-${path//\//-}.body" >&2 || true
            return 1
          }
          probe /health 200
          probe /api/version 200
          probe /api/public/project-expenses/readiness 200
          probe /api/module-006/pipeline 401,403
          probe /api/module-006/tasks 401,403
          probe /api/project-expenses/uploads/lifecycle 401,403
          ACTIVE_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_API" == '${{ steps.build.outputs.api_image }}' ]]
          SOURCE_COMMIT="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query "properties.template.containers[0].env[?name=='PROJECTPULSE_SOURCE_COMMIT'].value | [0]" -o tsv)"
          [[ "$SOURCE_COMMIT" == "$RELEASE_SHA" ]]
          echo 'PR476_LIVE_API=READY'

      - name: Deploy exact web image
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "u476web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none

      - name: Validate exact served UAT assets
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          READY=false
          for attempt in $(seq 1 36); do
            BUSTER="pr476-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            STATUS="$(curl -sSL -H 'Cache-Control: no-cache' -o /tmp/pr476-index -w '%{http_code}' "$BASE/?release_check=$BUSTER" || true)"
            if [[ "$STATUS" == 200 ]]; then
              rm -f /tmp/pr476-app.js /tmp/pr476-app.css
              while read -r asset; do
                [[ -n "$asset" ]] || continue
                case "$asset" in http*) url="$asset" ;; /*) url="$BASE$asset" ;; *) url="$BASE/$asset" ;; esac
                curl -sSL -H 'Cache-Control: no-cache' "$url?release_check=$BUSTER" >> /tmp/pr476-app.js || true
              done < <(grep -oE 'src="[^"]+\.js"' /tmp/pr476-index | sed -E 's/^src="|"$//g')
              while read -r asset; do
                [[ -n "$asset" ]] || continue
                case "$asset" in http*) url="$asset" ;; /*) url="$BASE$asset" ;; *) url="$BASE/$asset" ;; esac
                curl -sSL -H 'Cache-Control: no-cache' "$url?release_check=$BUSTER" >> /tmp/pr476-app.css || true
              done < <(grep -oE 'href="[^"]+\.css"' /tmp/pr476-index | sed -E 's/^href="|"$//g')
              if grep -Fq 'Standalone authority' /tmp/pr476-app.js \
                && grep -Fq 'Add New Project' /tmp/pr476-app.js \
                && grep -Fq 'Create New Task' /tmp/pr476-app.js \
                && grep -Fq 'Lifecycle controls are temporarily unavailable' /tmp/pr476-app.js \
                && grep -Fq 'Copy ID' /tmp/pr476-app.js \
                && grep -Fq 'entra-secret-administration' /tmp/pr476-app.js \
                && grep -Fq '.module006-independence-banner' /tmp/pr476-app.css \
                && grep -Fq '.work-register-row-identifier' /tmp/pr476-app.css \
                && grep -Fq '.modules-directory-open-button' /tmp/pr476-app.css; then
                READY=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$READY" == true ]] || { echo 'The exact PR476 browser assets were not served.' >&2; exit 1; }
          ACTIVE_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_WEB" == '${{ steps.build.outputs.web_image }}' ]]
          echo 'PR476_LIVE_WEB=READY'

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          API_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query properties.latestReadyRevisionName -o tsv)"
          WEB_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.latestReadyRevisionName -o tsv)"
          cat > evidence/pr476-uat-followup-test-deployment.json <<JSON
          {
            "environment": "test",
            "productionChanged": false,
            "releaseCommit": "$RELEASE_SHA",
            "workflowCommit": "$GITHUB_SHA",
            "migration": "$MIGRATION_ID",
            "migrationImage": "${{ steps.migration.outputs.image }}",
            "apiImage": "${{ steps.build.outputs.api_image }}",
            "webImage": "${{ steps.build.outputs.web_image }}",
            "previousApiImage": "${{ steps.before.outputs.old_api_image }}",
            "previousWebImage": "${{ steps.before.outputs.old_web_image }}",
            "apiRevision": "$API_REVISION",
            "webRevision": "$WEB_REVISION",
            "runId": "$GITHUB_RUN_ID",
            "runAttempt": "$GITHUB_RUN_ATTEMPT",
            "modules": ["005", "006", "039", "055C", "065"],
            "module011Deferred": true,
            "emailSent": false
          }
          JSON

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr476-uat-followup-test-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/pr476-uat-followup-test-deployment.json
          retention-days: 30

      - name: Roll back application images on deployment failure
        if: ${{ failure() && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set +e
          if [[ '${{ steps.deploy_api.outputs.started }}' == 'true' ]]; then
            az containerapp update \
              -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
              -n '${{ vars.AZURE_API_APP }}' \
              --image '${{ steps.before.outputs.old_api_image }}' \
              --revision-suffix "u476arb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --output none
          fi
          if [[ '${{ steps.deploy_web.outputs.started }}' == 'true' ]]; then
            az containerapp update \
              -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
              -n '${{ vars.AZURE_WEB_APP }}' \
              --image '${{ steps.before.outputs.old_web_image }}' \
              --revision-suffix "u476wrb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --output none
          fi
          echo 'PR476_APPLICATION_ROLLBACK=ATTEMPTED'

      - name: Publish release summary
        if: always()
        shell: bash
        run: |
          {
            echo '## PR #476 UAT follow-up Test release'
            echo
            echo "- Exact application SHA: $RELEASE_SHA"
            echo "- Migration: $MIGRATION_ID"
            echo '- Environment: Test only'
            echo '- Production changed: No'
            echo '- Email sent: No'
            echo '- Module 011: Deferred'
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
