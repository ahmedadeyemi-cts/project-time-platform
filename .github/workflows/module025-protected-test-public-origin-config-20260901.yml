name: Module 025 Protected-Test Public Origin Config 20260901

on:
  push:
    branches:
      - uat/module025-live-20260901
    paths:
      - '.github/workflows/module025-protected-test-public-origin-config-20260901.yml'

permissions:
  id-token: write
  contents: read

jobs:
  configure:
    name: Verify Module 025 repaired Protected-Test runtime
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Sign in to Protected-Test subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify source and governed public origin
        shell: bash
        env:
          EXPECTED_SOURCE: f7c86b45cff09741dd022c0e80bc1e6ad7d5c80b
          EXPECTED_PUBLIC_URL: https://phd-west-test.onenecklab.com
        run: |
          set -Eeuo pipefail
          current_subscription="$(az account show --query id -o tsv --only-show-errors)"
          [[ "${current_subscription,,}" == "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]]
          api="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          source="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$api")"
          public_url="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_PUBLIC_URL") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$api")"
          image="$(jq -r '.properties.template.containers[0].image // empty' <<<"$api")"
          revision="$(jq -r '.properties.latestRevisionName // empty' <<<"$api")"
          [[ "$source" == "$EXPECTED_SOURCE" ]]
          [[ "$public_url" == "$EXPECTED_PUBLIC_URL" ]]
          [[ "$image" == *@sha256:* ]]
          health_status="$(curl -sS --max-time 60 -o /tmp/health.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$EXPECTED_PUBLIC_URL/health?m025-generation-repair=$GITHUB_RUN_ID" || true)"
          [[ "$health_status" == 200 ]]
          jq -e '.status == "healthy"' /tmp/health.json >/dev/null
          echo "MODULE025_RUNTIME=READY"
          echo "SOURCE_COMMIT=$source"
          echo "PUBLIC_ORIGIN=$public_url"
          echo "API_REVISION=$revision"
          echo "PRODUCTION_MUTATION=NONE"

      - name: Sign out
        if: always()
        run: az logout || true
