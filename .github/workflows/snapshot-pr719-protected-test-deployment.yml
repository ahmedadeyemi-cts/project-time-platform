name: Snapshot PR 719 Protected-Test Deployment

on:
  push:
    branches:
      - fix/module-directory-owner-001a-continuity-20260818
    paths:
      - '.github/workflows/snapshot-pr719-protected-test-deployment.yml'

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ea80bc011804f793f688a721f5f1c3a6f3893b61
      EVIDENCE_PATH: .github/pr719-deployment-observer/current-status.json
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out observer branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/module-directory-owner-001a-continuity-20260818
          fetch-depth: 0
          persist-credentials: true

      - name: Capture exact deployment status
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d "$(dirname "$EVIDENCE_PATH")"
          runs="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/projectpulse-deploy-test.yml/runs" \
            -f branch=main -f event=push -f per_page=50)"
          run_json="$(jq -c --arg sha "$TARGET_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha and .event == "push")]
            | sort_by(.created_at) | reverse | .[0] // null
          ' <<<"$runs")"
          [[ "$run_json" != null ]] || {
            jq -n --arg targetSha "$TARGET_SHA" --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{targetSha:$targetSha,observedAt:$observedAt,found:false}' > "$EVIDENCE_PATH"
          }
          if [[ "$run_json" != null ]]; then
            run_id="$(jq -r '.id' <<<"$run_json")"
            jobs_json="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
              -f filter=latest -f per_page=100)"
            jq -n \
              --arg targetSha "$TARGET_SHA" \
              --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson run "$run_json" \
              --argjson jobs "$jobs_json" \
              '{
                targetSha:$targetSha,
                observedAt:$observedAt,
                found:true,
                run:{
                  id:$run.id,
                  name:$run.name,
                  status:$run.status,
                  conclusion:$run.conclusion,
                  headSha:$run.head_sha,
                  headBranch:$run.head_branch,
                  runNumber:$run.run_number,
                  runAttempt:$run.run_attempt,
                  createdAt:$run.created_at,
                  updatedAt:$run.updated_at,
                  htmlUrl:$run.html_url
                },
                jobs:[
                  $jobs.jobs[] | {
                    id,
                    name,
                    status,
                    conclusion,
                    startedAt:.started_at,
                    completedAt:.completed_at,
                    steps:[.steps[]? | {number,name,status,conclusion}]
                  }
                ]
              }' > "$EVIDENCE_PATH"
          fi
          jq . "$EVIDENCE_PATH"

      - name: Publish sanitized snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add "$EVIDENCE_PATH"
          git diff --cached --quiet && exit 0
          git commit -m 'ops: snapshot PR 719 protected-Test deployment status'
          git push origin HEAD:fix/module-directory-owner-001a-continuity-20260818
