name: Patch PR 644 Public Question Privacy Validator

on:
  pull_request:
    paths:
      - '.github/workflows/patch-pr644-external-deidentification-validator.yml'

permissions:
  contents: write

concurrency:
  group: patch-pr644-public-question-privacy-validator
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'fix/ask-celar-ai-public-questions-resilience-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/ask-celar-ai-public-questions-resilience-20260811
          fetch-depth: 0
          persist-credentials: true

      - name: Align privacy validation with governed public-only private routing
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''    'PublicGeneralQuestion: plan.IntentCode == "general_knowledge"',
    'PublicQuestion: plan.IntentCode == "general_knowledge"',
'''
          new = '''    'var publicGeneralQuestion = plan.IntentCode == "general_knowledge"',
    'SystemPrompt: publicGeneralQuestion',
    'UserPrompt: publicGeneralQuestion ? question : privatePrompt',
    'MaxOutputTokens: publicGeneralQuestion',
    'PublicGeneralQuestion: publicGeneralQuestion',
    'PublicQuestion: publicGeneralQuestion ? question : null',
    'This general-knowledge answer used only the public question through the private Celar AI runtime.',
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one legacy public-question privacy marker block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('CELAR_PUBLIC_QUESTION_PRIVACY_VALIDATOR=UPDATED')
          PY

          node src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs
          git diff --check

      - name: Commit permanent validator correction and remove patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/patch-pr644-external-deidentification-validator.yml
          git config user.name 'Pulse Celar AI Repair Automation'
          git config user.email 'pulse-celar-ai-repair@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align public-question privacy validation with governed routing'
          git push origin HEAD:fix/ask-celar-ai-public-questions-resilience-20260811
