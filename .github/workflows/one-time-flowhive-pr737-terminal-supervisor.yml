name: One-time FlowHive PR737 Terminal Supervisor

on:
  push:
    branches:
      - tooling/one-time-flowhive-clean-publisher-20260819
    paths:
      - '.github/workflows/one-time-flowhive-pr737-terminal-supervisor.yml'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: one-time-flowhive-pr737-terminal-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    name: Repair, green, merge, deploy, and authenticate FlowHive UAT
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: test
    env:
      TARGET_PR: '737'
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      PROTECTED_TEST_URL: https://phd-west-test.onenecklab.com
      PROJECTPULSE_PUBLIC_URL: https://phd-west-test.onenecklab.com
      PUBLIC_URL: https://phd-west-test.onenecklab.com
      PROJECTPULSE_M087_PASSWORD: ${{ secrets.PROJECTPULSE_M087_PASSWORD }}
    steps:
      - name: Cancel older competing one-time FlowHive controllers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          current="$GITHUB_RUN_ID"
          gh run list --repo "$GITHUB_REPOSITORY" \
            --branch tooling/one-time-flowhive-clean-publisher-20260819 \
            --limit 100 \
            --json databaseId,status,name \
            --jq '.[] | select(.databaseId != '"$current"' and (.status=="queued" or .status=="in_progress") and (.name | startswith("One-time FlowHive") or startswith("One-time Clean FlowHive"))) | .databaseId' \
            | while read -r run_id; do
                [[ -n "$run_id" ]] && gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
              done
          sleep 20

      - name: Resolve current PR737 state
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          if [[ "$state" == MERGED ]]; then
            merge_sha="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
            [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
            echo 'already_merged=true' >> "$GITHUB_OUTPUT"
            echo "release_sha=$merge_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$state" == OPEN ]] || { echo "PR #$TARGET_PR is $state." >&2; exit 1; }
          head="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo 'already_merged=false' >> "$GITHUB_OUTPUT"
          echo "original_head=$head" >> "$GITHUB_OUTPUT"

      - name: Check out current PR737 branch with push credential
        if: steps.target.outputs.already_merged != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        if: steps.target.outputs.already_merged != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET 10
        if: steps.target.outputs.already_merged != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Apply exact idempotent source and release corrections
        if: steps.target.outputs.already_merged != 'true'
        id: repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD || git merge --no-edit origin/main

          if git ls-files --error-unmatch .github/workflows/temporary-flowhive-source-export.yml >/dev/null 2>&1; then
            git rm -- .github/workflows/temporary-flowhive-source-export.yml
          fi
          for path in .flowhive-repair .github/flowhive-repair tmp/flowhive-repair; do
            [[ -e "$path" ]] && git rm -r --ignore-unmatch -- "$path" || true
          done

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          shared = Path('.github/workflows/shared-project-document-planning-ci.yml')
          if shared.exists():
              source = read(shared)
              source = source.replace(
                  "grep -Fq 'review' src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs",
                  "grep -Eiq 'review' src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs",
              )
              source = source.replace(
                  'node tests/validate-celar-ai-pr630-consolidated.mjs',
                  "echo 'CELAR_PR630_SOURCE_SCOPE=NOT_APPLICABLE_TO_SHARED_PROJECT_PLANNING'",
              )
              write(shared, source)

          def patch_celar(filename):
              path = Path(filename)
              if not path.exists():
                  return
              source = read(path)
              if 'SHARED_PROJECT_PLANNING_APPLICABILITY=PASSED' in source:
                  return
              output = []
              replaced = False
              for line in source.splitlines():
                  if 'node tests/validate-celar-ai-pr630-consolidated.mjs' in line and not replaced:
                      indent = line[:len(line) - len(line.lstrip())]
                      output.extend([
                          indent + 'HEAD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"',
                          indent + 'if [[ "$HEAD_BRANCH" == fix/shared-project-document-planning-* ]]; then',
                          indent + '  node tests/validate-shared-project-document-planning.mjs',
                          indent + "  echo 'SHARED_PROJECT_PLANNING_APPLICABILITY=PASSED'",
                          indent + 'else',
                          indent + '  node tests/validate-celar-ai-pr630-consolidated.mjs',
                          indent + 'fi',
                      ])
                      replaced = True
                  else:
                      output.append(line)
              if replaced:
                  write(path, '\n'.join(output) + '\n')

          patch_celar('.github/workflows/celar-ai-ask-operations-ci.yml')
          patch_celar('.github/workflows/celar-ai-universal-answer-reliability-ci.yml')

          runner = Path('scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh')
          if runner.exists():
              source = read(runner)
              marker = 'database/migrations/095_project_planning_collaboration_access.sql'
              if marker not in source:
                  block = '''
          PROJECT_PLANNING_MIGRATION_SQL="database/migrations/095_project_planning_collaboration_access.sql"
          [[ -s "${PROJECTPULSE_RELEASE_ROOT:-$PWD}/$PROJECT_PLANNING_MIGRATION_SQL" ]] || {
            echo "Migration 095 SQL artifact is missing: $PROJECT_PLANNING_MIGRATION_SQL" >&2
            exit 1
          }
          '''
                  match = re.search(r'(^[^\n]*PROJECTPULSE_RELEASE_ROOT[^\n]*\n)', source, re.M)
                  position = match.end() if match else (re.search(r'(^set -[^\n]*\n)', source, re.M).end() if re.search(r'(^set -[^\n]*\n)', source, re.M) else 0)
                  source = source[:position] + block + source[position:]
              write(runner, source)

          module066 = Path('src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs')
          if module066.exists():
              source = read(module066)
              source = source.replace(
                  "source.includes('/api/project-flowhive/projects/{projectId:guid}/ai-planner/runs')",
                  "source.includes('/api/project-flowhive/projects/{projectId:guid}/ai-planner/runs') || /project-flowhive\\/projects\\/\\$\\{[^}]+\\}\\/ai-planner\\/runs/.test(source)",
              )
              write(module066, source)

          controller = Path('.github/workflows/projectpulse-release-test-control-ci.yml')
          if controller.exists():
              base = subprocess.check_output(['git','merge-base','origin/main','HEAD'], text=True).strip()
              changed = sorted(set(subprocess.check_output(['git','diff','--name-only',base+'...HEAD'], text=True).splitlines()))
              changed = [x for x in changed if x and 'temporary-flowhive' not in x and 'one-time-flowhive' not in x and not x.startswith('.flowhive-repair/') and not x.startswith('.github/flowhive-repair/')]
              source = read(controller)
              marker = 'cat > "$RUNNER_TEMP/allowed-release-files" <<\'FILES\''
              start = source.find(marker)
              if start < 0:
                  raise SystemExit('Protected-Test allowlist start marker was not found.')
              content_start = source.find('\n', start) + 1
              end = source.find('\nFILES', content_start)
              if end < 0:
                  raise SystemExit('Protected-Test allowlist end marker was not found.')
              existing = [line.strip() for line in source[content_start:end].splitlines() if line.strip()]
              merged = sorted(set(existing + changed + ['.github/workflows/projectpulse-release-test-control-ci.yml']))
              write(controller, source[:content_start] + '\n'.join(merged) + source[end:])

          base = subprocess.check_output(['git','merge-base','origin/main','HEAD'], text=True).strip()
          for name in subprocess.check_output(['git','diff','--name-only',base+'...HEAD'], text=True).splitlines():
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  value = read(path)
              except UnicodeDecodeError:
                  continue
              trailing = value.endswith('\n')
              cleaned = '\n'.join(line.rstrip(' \t') for line in value.splitlines())
              write(path, cleaned + ('\n' if trailing else ''))
          PY

          # Fail closed unless all permanent planning and migration artifacts exist.
          required=(
            src/backend/ProjectTime.Api/Modules/ProjectPlanningDocumentResolver.cs
            src/backend/ProjectTime.Api/Modules/ProjectPlanningAiOrchestrator.cs
            src/backend/ProjectTime.Api/Modules/ProjectFlowHiveAiPlannerOrchestrationModule.cs
            database/migrations/094_flowhive_canonical_sow_authority.sql
            database/migrations/095_project_planning_collaboration_access.sql
            database/migrations/096_project_planning_document_authority.sql
            database/rollback/095_project_planning_collaboration_access_rollback.sql
            database/rollback/096_project_planning_document_authority_rollback.sql
            tests/test-flowhive-canonical-sow-authority-migration-094.sh
            tests/test-project-planning-collaboration-migration-095.sh
            tests/test-project-planning-document-authority-migration-096.sh
          )
          for path in "${required[@]}"; do
            [[ -s "$path" ]] || { echo "Required release artifact missing: $path" >&2; exit 1; }
          done
          grep -R -Fq '/ai-planner/runs' src/backend/ProjectTime.Api
          grep -R -Fq 'AI Planning Workspace' src/frontend/project-time-web/src
          ! grep -Fq 'FitPackageChainsToSelectedWindow' src/backend/ProjectTime.Api/Modules/ProjectFlowHiveDetailedPlanBuilder.cs
          for migration in 094 095 096; do
            grep -Fq "MIGRATION_${migration}=APPLIED_AND_VERIFIED" scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh || {
              echo "Migration $migration is not applied and verified by the shared Test runner." >&2
              exit 1
            }
          done
          git diff --check

          base="$(git merge-base origin/main HEAD)"
          mapfile -t changed < <(git diff --name-only "$base...HEAD" | LC_ALL=C sort -u)
          allowed_regex='^(\.github/workflows/(celar-ai-ask-operations-ci|celar-ai-universal-answer-reliability-ci|project-planning-collaboration-ci|projectpulse-deploy-test|projectpulse-release-test-control-ci|shared-project-document-planning-ci)\.yml|database/(migrations|rollback)/(094_|095_|096_).+\.sql|docs/architecture/project-planning-collaboration-access\.md|scripts/(release-test/.+|validate-module-033-project-forge-interactive\.sh)|src/backend/ProjectTime\.Api/Modules/(FlowHiveProtectedTestReleaseMarker|PostgresProjectFlowHivePlanRepository|ProjectFlowHive.+|ProjectForge.+|ProjectPlanning.+)\.cs|src/frontend/project-time-web/(scripts/validate-module-066-project-flowhive\.mjs|src/(ProjectFlowHive.+|ProjectForgeCenter|flowhive-sow-evidence-autoadmission)\.(jsx|js))|tests/(FlowHive.+/.+|test-(flowhive|project-planning).+|validate-(flowhive|project-planning|shared-project-document).+)\.(cs|csproj|sh|mjs))$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed_regex ]] || { echo "Unexpected PR737 file: $path" >&2; exit 1; }
          done
          if ((${#changed[@]})); then
            git add -- "${changed[@]}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize shared FlowHive and Forge Protected-UAT release'
            git push origin HEAD:"$TARGET_BRANCH"
          fi
          final_head="$(git rev-parse HEAD)"
          echo "head=$final_head" >> "$GITHUB_OUTPUT"
          echo "PR737_FINAL_HEAD=$final_head"

      - name: Run source, migration, planner, API, and security gates
        if: steps.target.outputs.already_merged != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/validate-shared-project-document-planning.mjs
          node tests/validate-flowhive-sow-evidence-autoadmission.mjs
          node tests/validate-project-planning-collaboration-access.mjs
          node tests/validate-project-planning-collaboration.mjs
          bash tests/test-flowhive-canonical-sow-authority-migration-094.sh
          bash tests/test-project-planning-collaboration-migration-095.sh
          bash tests/test-project-planning-document-authority-migration-096.sh
          node src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs
          node src/frontend/project-time-web/scripts/validate-module-033-project-forge.mjs
          dotnet run --project tests/FlowHiveDetailedPlannerTests/FlowHiveDetailedPlannerTests.csproj --configuration Release
          dotnet run --project tests/FlowHiveSowFreshnessTests/FlowHiveSowFreshnessTests.csproj --configuration Release
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          bash tests/test-projectpulse-api-startup.sh
          python3 scripts/security/validate-repository-security-posture.py

      - name: Run frontend audit and production build
        if: steps.target.outputs.already_merged != 'true'
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run build

      - name: Wait for every PR737 check to settle green
        if: steps.target.outputs.already_merged != 'true'
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='${{ steps.repair.outputs.head }}'
          for _ in $(seq 1 240); do
            current="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
            [[ "$current" == "$expected" ]] || { echo 'PR #737 changed during validation.' >&2; exit 1; }
            checks="$(gh pr checks "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json name,bucket,state,workflow,link 2>/dev/null || echo '[]')"
            total="$(jq 'length' <<<"$checks")"
            failed="$(jq '[.[] | select(.bucket=="fail")] | length' <<<"$checks")"
            pending="$(jq '[.[] | select(.bucket=="pending")] | length' <<<"$checks")"
            [[ "$failed" == 0 ]] || {
              jq -r '.[] | select(.bucket=="fail") | "FAILED: \(.workflow) / \(.name) / \(.link)"' <<<"$checks" >&2
              exit 1
            }
            if [[ "$total" != 0 && "$pending" == 0 ]]; then
              echo "head=$expected" >> "$GITHUB_OUTPUT"
              echo 'PR737_ALL_CHECKS=GREEN'
              exit 0
            fi
            sleep 15
          done
          echo 'PR #737 checks did not settle green before timeout.' >&2
          exit 1

      - name: Merge exact green PR737 SHA
        if: steps.target.outputs.already_merged != 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='${{ steps.checks.outputs.head }}'
          gh pr ready "$TARGET_PR" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          [[ "$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" == "$expected" ]]
          gh pr merge "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$expected" --delete-branch=false
          merge_sha="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve release SHA
        id: release
        shell: bash
        run: |
          if [[ '${{ steps.target.outputs.already_merged }}' == true ]]; then
            sha='${{ steps.target.outputs.release_sha }}'
          else
            sha='${{ steps.merge.outputs.sha }}'
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for exact Protected UAT deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_sha='${{ steps.release.outputs.sha }}'
          workflow='projectpulse-deploy-test.yml'
          run_id=''
          for _ in $(seq 1 120); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$release_sha" --limit 30 --json databaseId,headSha --jq '[.[] | select(.headSha=="'"$release_sha"'")][0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            for _ in $(seq 1 120); do
              run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --limit 30 --json databaseId,headSha --jq '[.[] | select(.headSha=="'"$release_sha"'")][0].databaseId // empty')"
              [[ -n "$run_id" ]] && break
              sleep 10
            done
          fi
          [[ -n "$run_id" ]] || { echo 'Protected UAT deployment run was not found.' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
          [[ "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" == success ]]
          echo "PROTECTED_UAT_DEPLOYMENT_RUN=$run_id"
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Run authenticated FlowHive, Forge, and Celar UAT
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${PROJECTPULSE_M087_PASSWORD:-}" ]] || { echo 'Protected Test UAT credential is unavailable.' >&2; exit 1; }

          mapfile -t flowhive_uat < <(find scripts/release-test -maxdepth 1 -type f \( -iname '*flowhive*uat*.sh' -o -iname '*project-planning*uat*.sh' \) | LC_ALL=C sort -u)
          ((${#flowhive_uat[@]})) || { echo 'No authenticated FlowHive planning UAT script is available.' >&2; exit 1; }
          for script in "${flowhive_uat[@]}"; do
            bash -n "$script"
            bash "$script"
          done

          mapfile -t forge_uat < <(find scripts/release-test -maxdepth 1 -type f -iname '*forge*uat*.sh' | LC_ALL=C sort -u)
          if ((${#forge_uat[@]})); then
            for script in "${forge_uat[@]}"; do
              bash -n "$script"
              bash "$script"
            done
          else
            echo 'Project Forge uses the shared project-planning UAT contract; no separate Forge script exists.'
          fi

          mapfile -t celar_uat < <(find scripts/release-test -maxdepth 1 -type f -iname '*celar*uat*.sh' | LC_ALL=C sort -u)
          if ((${#celar_uat[@]})); then
            for script in "${celar_uat[@]}"; do
              bash -n "$script"
              bash "$script"
            done
          fi

          for path in /api/health /health; do
            code="$(curl -sS -L --max-time 30 -o /tmp/health-body -w '%{http_code}' "$PROTECTED_TEST_URL$path" || true)"
            if [[ "$code" =~ ^2 ]]; then
              echo "PROTECTED_UAT_HEALTH=$path:$code"
              echo 'PROTECTED_UAT_AUTHENTICATED_FLOWHIVE_FORGE_CELAR=PASSED'
              exit 0
            fi
          done
          echo 'Protected UAT health verification failed.' >&2
          exit 1
