name: Module 065 Apply Migration 126 to Protected UAT

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact merged main commit containing migration 126
        required: true
        type: string
      confirmation:
        description: Enter APPLY-MODULE065-MIGRATION-126-TO-PROTECTED-UAT
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-test
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify Module 065 migration 126
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out migration control
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact merged release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact merged main migration source
        id: guard
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$CONFIRMATION" == APPLY-MODULE065-MIGRATION-126-TO-PROTECTED-UAT ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C control rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git -C release rev-parse HEAD)" == "$RELEASE_COMMIT" ]]
          git -C control fetch --no-tags origin main
          [[ "$(git -C control rev-parse origin/main)" == "$GITHUB_SHA" ]]
          git -C control merge-base --is-ancestor "$RELEASE_COMMIT" "$GITHUB_SHA"
          test -f release/database/migrations/126_module065_power_automate_teams_delivery.sql
          grep -Fq "'126_module065_power_automate_teams_delivery'" release/database/migrations/126_module065_power_automate_teams_delivery.sql
          grep -Fq 'ADD COLUMN IF NOT EXISTS delivery_mode' release/database/migrations/126_module065_power_automate_teams_delivery.sql
          grep -Fq 'ADD COLUMN IF NOT EXISTS workflow_trigger_url' release/database/migrations/126_module065_power_automate_teams_delivery.sql
          grep -Fq 'ADD COLUMN IF NOT EXISTS workflow_audience' release/database/migrations/126_module065_power_automate_teams_delivery.sql
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'MODULE065_MIGRATION126_SOURCE_GUARD=PASS'

      - name: Sign in to Protected UAT subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build immutable migration 126 image
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/module065-m126-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/database/migrations"
          install -m 0644 release/database/migrations/126_module065_power_automate_teams_delivery.sql "$CONTEXT/database/migrations/126_module065_power_automate_teams_delivery.sql"
          printf '%s\n' '${{ steps.guard.outputs.release_commit }}' > "$CONTEXT/release-commit"
          cat > "$CONTEXT/entrypoint.sh" <<'ENTRYPOINT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOT=/opt/projectpulse/release
          EXPECTED="${MAIN_RELEASE_EXPECTED_RELEASE_COMMIT:-}"
          MODE="${MAIN_RELEASE_MIGRATION_MODE:-verify}"
          ACTUAL="$(cat "$ROOT/.projectpulse-release-commit")"
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ && "$ACTUAL" == "$EXPECTED" ]]
          [[ "$MODE" == apply || "$MODE" == verify ]]
          if [[ "$MODE" == apply ]]; then
            psql -X -v ON_ERROR_STOP=1 --file "$ROOT/database/migrations/126_module065_power_automate_teams_delivery.sql"
          fi
          result="$(psql -X -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT (
            EXISTS(SELECT 1 FROM schema_migrations WHERE migration_id='126_module065_power_automate_teams_delivery')
            AND EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='module065_teams_configuration' AND column_name='delivery_mode')
            AND EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='module065_teams_configuration' AND column_name='workflow_trigger_url')
            AND EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='module065_teams_configuration' AND column_name='workflow_audience')
          )::text;
          SQL
          )"
          [[ "$result" == true ]]
          echo "MODULE065_MIGRATION126_STATUS=VERIFIED mode=$MODE"
          ENTRYPOINT
          chmod 0555 "$CONTEXT/entrypoint.sh"
          cat > "$CONTEXT/Dockerfile" <<'DOCKERFILE'
          FROM postgres:16-alpine
          RUN apk add --no-cache bash ca-certificates
          WORKDIR /opt/projectpulse/release
          COPY release-commit .projectpulse-release-commit
          COPY database/ database/
          COPY entrypoint.sh /usr/local/bin/module065-migration126
          RUN chmod 0555 /usr/local/bin/module065-migration126 && chmod 0444 .projectpulse-release-commit database/migrations/*.sql
          ENTRYPOINT ["/usr/local/bin/module065-migration126"]
          DOCKERFILE
          IMAGE_TAG="project-health-dashboard-module065-m126:${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$IMAGE_TAG" "$CONTEXT/Dockerfile" "$CONTEXT")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-module065-m126@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Apply migration 126 in Test private network
        shell: bash
        working-directory: control
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          MAIN_RELEASE_MIGRATION_IMAGE: ${{ steps.image.outputs.image }}
          MAIN_RELEASE_MIGRATION_JOB_NAME: m065-126-${{ github.run_id }}-a
          MAIN_RELEASE_MIGRATION_MODE: apply
          MAIN_RELEASE_EXPECTED_RELEASE_COMMIT: ${{ steps.guard.outputs.release_commit }}
          MAIN_RELEASE_MIGRATION_SCOPE: module065-power-automate-126-test
          AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID: ${{ vars.AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID }}
          AZURE_KEY_VAULT_URI: ${{ vars.AZURE_KEY_VAULT_URI }}
          PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME: ${{ vars.PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME }}
          PROJECTPULSE_TEST_DATABASE_HOST: ${{ vars.PROJECTPULSE_TEST_DATABASE_HOST }}
          PROJECTPULSE_TEST_DATABASE_PORT: ${{ vars.PROJECTPULSE_TEST_DATABASE_PORT }}
          PROJECTPULSE_TEST_DATABASE_NAME: ${{ vars.PROJECTPULSE_TEST_DATABASE_NAME }}
          PROJECTPULSE_TEST_DATABASE_USER: ${{ vars.PROJECTPULSE_TEST_DATABASE_USER }}
          MAIN_RELEASE_CONTROL_SHA: ${{ github.sha }}
        run: bash scripts/release-test/run-migration-job.sh

      - name: Reverify migration 126 without writes
        shell: bash
        working-directory: control
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          MAIN_RELEASE_MIGRATION_IMAGE: ${{ steps.image.outputs.image }}
          MAIN_RELEASE_MIGRATION_JOB_NAME: m065-126-${{ github.run_id }}-v
          MAIN_RELEASE_MIGRATION_MODE: verify
          MAIN_RELEASE_EXPECTED_RELEASE_COMMIT: ${{ steps.guard.outputs.release_commit }}
          MAIN_RELEASE_MIGRATION_SCOPE: module065-power-automate-126-test
          AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID: ${{ vars.AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID }}
          AZURE_KEY_VAULT_URI: ${{ vars.AZURE_KEY_VAULT_URI }}
          PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME: ${{ vars.PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME }}
          PROJECTPULSE_TEST_DATABASE_HOST: ${{ vars.PROJECTPULSE_TEST_DATABASE_HOST }}
          PROJECTPULSE_TEST_DATABASE_PORT: ${{ vars.PROJECTPULSE_TEST_DATABASE_PORT }}
          PROJECTPULSE_TEST_DATABASE_NAME: ${{ vars.PROJECTPULSE_TEST_DATABASE_NAME }}
          PROJECTPULSE_TEST_DATABASE_USER: ${{ vars.PROJECTPULSE_TEST_DATABASE_USER }}
          MAIN_RELEASE_CONTROL_SHA: ${{ github.sha }}
        run: bash scripts/release-test/run-migration-job.sh

      - name: Publish migration 126 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/module065-m126-evidence"
          jq -n             --arg releaseCommit '${{ steps.guard.outputs.release_commit }}'             --arg workflowCommit "$GITHUB_SHA"             --arg migrationImage '${{ steps.image.outputs.image }}'             --arg migrationDigest '${{ steps.image.outputs.digest }}'             --arg runId "$GITHUB_RUN_ID"             '{environment:"test",releaseCommit:$releaseCommit,workflowCommit:$workflowCommit,migrationId:"126_module065_power_automate_teams_delivery",migrationImage:$migrationImage,migrationDigest:$migrationDigest,runId:$runId,applyVerified:true,verifyOnlyVerified:true,apiWebDeployment:false,productionMutation:false,microsoftTenantMutation:false}'             > "$RUNNER_TEMP/module065-m126-evidence/migration126.json"

      - name: Upload migration 126 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: module065-migration126-protected-uat-${{ github.run_id }}
          path: ${{ runner.temp }}/module065-m126-evidence/migration126.json
          retention-days: 14
