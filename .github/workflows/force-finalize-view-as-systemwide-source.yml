name: Force-finalize validated View-As systemwide source

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: force-finalize-view-as-systemwide-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.event.pull_request.head.ref == 'fix/view-as-module-navigation-continuity-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Apply the finalized reviewed source repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/execute-view-as-systemwide-publisher.yml').read_text()
          start_marker = "      - name: Prepare and execute finalized reviewed repair\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Validate focused systemwide contracts"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-final-view-as-source.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-final-view-as-source.sh

      - name: Validate all shared View-As navigation contracts
        working-directory: src/frontend/project-time-web
        run: |
          node --check src/module-navigation-access-policy.js
          node --check src/module-availability-bridge.js
          node --check scripts/validate-view-as-module-navigation.mjs
          node --check scripts/validate-modules-directory-page.mjs
          node scripts/validate-view-as-module-navigation.mjs
          node scripts/validate-dynamic-rbac-administration.mjs
          node scripts/validate-module-012-scoped-role-admin.mjs
          node scripts/validate-group-1-navigation-work-consolidation.mjs
          node scripts/validate-modules-directory-page.mjs

      - name: Build API Release
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release -p:ProjectPulseSourceRevision=1111111111111111111111111111111111111111

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: |
          npm ci
          npm run build

      - name: Validate candidate source boundary
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess

          source = {
              'src/frontend/project-time-web/src/module-availability-bridge.js',
              'src/frontend/project-time-web/src/module-navigation-access-policy.js',
              'src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx',
              'src/frontend/project-time-web/src/module-availability.css',
              'src/frontend/project-time-web/scripts/validate-view-as-module-navigation.mjs',
              'src/frontend/project-time-web/scripts/validate-dynamic-rbac-administration.mjs',
              'src/frontend/project-time-web/scripts/validate-module-012-scoped-role-admin.mjs',
              'src/frontend/project-time-web/scripts/validate-group-1-navigation-work-consolidation.mjs',
              'src/frontend/project-time-web/scripts/validate-modules-directory-page.mjs',
              'docs/security/VIEW-AS-MODULE-NAVIGATION-CONTINUITY.md',
          }
          temporary = {
              '.github/workflows/augment-view-as-module-navigation-systemwide.yml',
              '.github/workflows/diagnose-view-as-systemwide-patch-anchor.yml',
              '.github/workflows/run-normalized-view-as-systemwide-patch.yml',
              '.github/workflows/execute-view-as-systemwide-publisher.yml',
              '.github/workflows/finalize-view-as-systemwide-source.yml',
              '.github/workflows/force-finalize-view-as-systemwide-source.yml',
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
              if len(line) >= 4
          }
          unexpected = changed - source - temporary
          missing = source - changed
          if unexpected:
              raise SystemExit(f'Unexpected candidate files: {sorted(unexpected)}')
          if missing:
              raise SystemExit(f'Expected repair files were not changed: {sorted(missing)}')
          print(f'VIEW_AS_CANDIDATE_SOURCE_FILE_COUNT={len(source)}')
          PY

      - name: Force-remove temporary publishers and commit validated source
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/augment-view-as-module-navigation-systemwide.yml \
            .github/workflows/diagnose-view-as-systemwide-patch-anchor.yml \
            .github/workflows/run-normalized-view-as-systemwide-patch.yml \
            .github/workflows/execute-view-as-systemwide-publisher.yml \
            .github/workflows/finalize-view-as-systemwide-source.yml \
            .github/workflows/force-finalize-view-as-systemwide-source.yml

          git add -A
          git diff --cached --check
          python3 - <<'PY'
          import subprocess

          source = {
              'src/frontend/project-time-web/src/module-availability-bridge.js',
              'src/frontend/project-time-web/src/module-navigation-access-policy.js',
              'src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx',
              'src/frontend/project-time-web/src/module-availability.css',
              'src/frontend/project-time-web/scripts/validate-view-as-module-navigation.mjs',
              'src/frontend/project-time-web/scripts/validate-dynamic-rbac-administration.mjs',
              'src/frontend/project-time-web/scripts/validate-module-012-scoped-role-admin.mjs',
              'src/frontend/project-time-web/scripts/validate-group-1-navigation-work-consolidation.mjs',
              'src/frontend/project-time-web/scripts/validate-modules-directory-page.mjs',
              'docs/security/VIEW-AS-MODULE-NAVIGATION-CONTINUITY.md',
          }
          temporary = {
              '.github/workflows/augment-view-as-module-navigation-systemwide.yml',
              '.github/workflows/diagnose-view-as-systemwide-patch-anchor.yml',
              '.github/workflows/run-normalized-view-as-systemwide-patch.yml',
              '.github/workflows/execute-view-as-systemwide-publisher.yml',
              '.github/workflows/finalize-view-as-systemwide-source.yml',
              '.github/workflows/force-finalize-view-as-systemwide-source.yml',
          }
          staged = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          unexpected = staged - source - temporary
          missing = source - staged
          if unexpected:
              raise SystemExit(f'Unexpected staged files: {sorted(unexpected)}')
          if missing:
              raise SystemExit(f'Validated repair files missing from staged commit: {sorted(missing)}')
          print(f'VIEW_AS_FINAL_RETAINED_SOURCE_FILE_COUNT={len(source)}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete systemwide View-As module navigation repair"
          git push origin HEAD:fix/view-as-module-navigation-continuity-20260808
