name: Repair PR 630 Resolved Clarification Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/repair-pr630-resolved-clarification.yml

permissions:
  contents: write

concurrency:
  group: repair-pr630-resolved-clarification
  cancel-in-progress: false

jobs:
  repair:
    name: Preserve fail-closed clarification semantics and remove this workflow
    if: >-
      github.event.pull_request.number == 630 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/ask-celar-ai-troubleshooting-defect-automation-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: 2bac2f49ef8e931328f07247e58cd151f43c04c6
      HEAD_BRANCH: feature/ask-celar-ai-troubleshooting-defect-automation-20260810
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact repository, branch, and parent
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == 'ahmedadeyemi-cts/project-time-platform' ]]
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT" ]]
          [[ "$(git rev-parse HEAD)" == '${{ github.event.pull_request.head.sha }}' ]]

      - name: Resolve pre-retrieval clarifications only after evidence succeeds
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/backend/ProjectTime.Api/Ai/CelarAiUniversalAnswerReliability.cs')
          text = source.read_text(encoding='utf-8')
          old = '''        if (plan.ClarificationsToRequest.Count > 0)
        {
            findings.Add(Review(
                "clarification_recommended",
                "The planner identified missing scope that could change the answer.",
                "Ask the listed clarification when authoritative resolution cannot be completed safely."));
        }'''
          new = '''        // Planner clarifications are pre-retrieval safeguards. Once the
        // required authoritative evidence has been retrieved, cited, and has
        // passed every blocker-class gate, that evidence has resolved the
        // missing scope and must not keep an otherwise verified answer in a
        // review-required state. Missing, stale, unauthorized, or incomplete
        // evidence still retains the clarification review.
        if (plan.ClarificationsToRequest.Count > 0
            && (successfulSources.Length == 0
                || findings.Any(finding => finding.Severity == "blocker")))
        {
            findings.Add(Review(
                "clarification_recommended",
                "The planner identified missing scope that could change the answer and authoritative evidence did not fully resolve it.",
                "Ask the listed clarification when authoritative resolution cannot be completed safely."));
        }'''
          if text.count(old) != 1:
              raise SystemExit(f'{source}: expected one clarification gate, found {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -- .github/workflows/repair-pr630-resolved-clarification.yml
          git diff --check
          git diff --exit-code -- . ':!src/backend/ProjectTime.Api/Ai/CelarAiUniversalAnswerReliability.cs' ':!.github/workflows/repair-pr630-resolved-clarification.yml'

      - name: Commit bounded reliability correction to PR 630
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add -- \
            src/backend/ProjectTime.Api/Ai/CelarAiUniversalAnswerReliability.cs \
            .github/workflows/repair-pr630-resolved-clarification.yml
          git commit -m 'Resolve document clarification after authorized evidence succeeds'
          git push origin "HEAD:${HEAD_BRANCH}"
