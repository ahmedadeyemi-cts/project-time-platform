name: Observe PR 737 Protected UAT deployment

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/pr737-protected-uat-observer.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: pr737-protected-uat-observer-current
  cancel-in-progress: true

env:
  API_ROOT: https://api.github.com/repos/${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  TARGET_SHA: 437e9b25fc2827c849ec8188cdca8b4a4fee2cfe
  TARGET_BRANCH: fix/shared-project-document-planning-20260819

jobs:
  locate:
    name: Locate exact Protected Test run
    if: >-
      github.event.pull_request.number == 739 &&
      github.event.pull_request.head.ref == 'ops/pr737-protected-uat-observer-20260823' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      run_id: ${{ steps.locate.outputs.run_id }}
    steps:
      - name: Locate exact workflow-dispatch run
        id: locate
        shell: bash
        run: |
          set -Eeuo pipefail
          api_get() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }
          run_id=''
          for _ in $(seq 1 180); do
            runs="$(api_get "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/runs?event=workflow_dispatch&per_page=100")"
            run_id="$(
              jq -r --arg sha "$TARGET_SHA" --arg branch "$TARGET_BRANCH" '
                [.workflow_runs[]
                  | select(.head_sha == $sha)
                  | select(.head_branch == $branch)
                  | select(.event == "workflow_dispatch")]
                | sort_by(.created_at)
                | last
                | .id // empty
              ' <<<"$runs"
            )"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          [[ -n "$run_id" ]] || { echo 'Exact deployment run not found.' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "PROTECTED_UAT_DEPLOYMENT_RUN_ID=$run_id"
          echo "PROTECTED_UAT_DEPLOYMENT_SHA=$TARGET_SHA"
          echo 'PRODUCTION_MUTATION=NONE'

  monitor:
    name: Monitor exact Protected Test run
    needs: locate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUN_ID: ${{ needs.locate.outputs.run_id }}
      OUTPUT_DIR: /tmp/pr737-protected-uat-current
    steps:
      - name: Monitor exact deployment to terminal state
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          install -d -m 0700 "$OUTPUT_DIR"
          api_get() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }
          printf '%s\n' "$RUN_ID" > "$OUTPUT_DIR/run-id.txt"
          for _ in $(seq 1 480); do
            api_get "$API_ROOT/actions/runs/$RUN_ID" > "$OUTPUT_DIR/run.json"
            api_get "$API_ROOT/actions/runs/$RUN_ID/jobs?per_page=100" > "$OUTPUT_DIR/jobs.json"
            status="$(jq -r '.status' "$OUTPUT_DIR/run.json")"
            conclusion="$(jq -r '.conclusion // ""' "$OUTPUT_DIR/run.json")"
            printf 'PROTECTED_UAT_DEPLOYMENT_RUN_ID=%s\n' "$RUN_ID"
            printf 'PROTECTED_UAT_DEPLOYMENT_STATUS=%s\n' "$status"
            printf 'PROTECTED_UAT_DEPLOYMENT_CONCLUSION=%s\n' "$conclusion"
            printf 'PROTECTED_UAT_DEPLOYMENT_SHA=%s\n' "$TARGET_SHA"
            printf 'PRODUCTION_MUTATION=NONE\n'
            [[ "$status" == 'completed' ]] && break
            sleep 15
          done
          [[ "$(jq -r '.status' "$OUTPUT_DIR/run.json")" == 'completed' ]] \
            || fail 'Protected Test deployment did not reach a terminal state.'
          api_get "$API_ROOT/actions/runs/$RUN_ID/artifacts?per_page=100" > "$OUTPUT_DIR/artifacts.json"
          conclusion="$(jq -r '.conclusion // ""' "$OUTPUT_DIR/run.json")"
          [[ "$conclusion" == 'success' ]] || fail "Protected Test deployment concluded $conclusion."
          echo 'PROTECTED_UAT_DEPLOYMENT=SUCCEEDED'
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Upload observer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr737-protected-uat-current-${{ github.run_id }}
          path: /tmp/pr737-protected-uat-current
          if-no-files-found: warn
          retention-days: 3
