name: Observe PR 737 Protected UAT deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pr737-protected-uat-observer.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: pr737-protected-uat-observer
  cancel-in-progress: true

jobs:
  observe:
    name: Locate exact Protected Test deployment run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 2ec3bcb67069a51b2139d5b0060b0772afdc06d1
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      OUTPUT_DIR: /tmp/pr737-protected-uat-observer

    steps:
      - name: Locate exact workflow-dispatch run
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          install -d -m 0700 "$OUTPUT_DIR"

          run_id=''
          for _ in $(seq 1 90); do
            runs="$(
              curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/runs?event=workflow_dispatch&per_page=100"
            )"
            run_id="$(
              jq -r --arg sha "$TARGET_SHA" --arg branch "$TARGET_BRANCH" '
                [.workflow_runs[]
                  | select(.head_sha == $sha)
                  | select(.head_branch == $branch)
                  | select(.event == "workflow_dispatch")]
                | sort_by(.created_at)
                | last
                | .id // empty
              ' <<<"$runs"
            )"
            if [[ -n "$run_id" ]]; then
              jq --argjson id "$run_id" '.workflow_runs[] | select(.id == $id)' \
                <<<"$runs" > "$OUTPUT_DIR/run.json"
              break
            fi
            sleep 10
          done
          [[ -n "$run_id" ]] || fail 'The exact Protected Test deployment run was not found.'

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/actions/runs/$run_id/jobs?per_page=100" \
            > "$OUTPUT_DIR/jobs.json"

          jq -e --arg sha "$TARGET_SHA" --arg branch "$TARGET_BRANCH" '
            .head_sha == $sha and
            .head_branch == $branch and
            .event == "workflow_dispatch"
          ' "$OUTPUT_DIR/run.json" >/dev/null \
            || fail 'The located deployment is not the exact governed candidate.'

          status="$(jq -r '.status' "$OUTPUT_DIR/run.json")"
          conclusion="$(jq -r '.conclusion // ""' "$OUTPUT_DIR/run.json")"
          printf 'PROTECTED_UAT_DEPLOYMENT_RUN_ID=%s\n' "$run_id"
          printf 'PROTECTED_UAT_DEPLOYMENT_STATUS=%s\n' "$status"
          printf 'PROTECTED_UAT_DEPLOYMENT_CONCLUSION=%s\n' "$conclusion"
          printf 'PROTECTED_UAT_DEPLOYMENT_SHA=%s\n' "$TARGET_SHA"
          printf 'PRODUCTION_MUTATION=NONE\n'

      - name: Upload observer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr737-protected-uat-observer-${{ github.run_id }}
          path: /tmp/pr737-protected-uat-observer
          if-no-files-found: error
          retention-days: 3
