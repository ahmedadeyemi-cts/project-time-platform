name: Repair PR 737 private-runtime migration prerequisites

on:
  push:
    branches:
      - ops/pr737-protected-uat-observer-20260823
    paths:
      - '.github/workflows/pr737-protected-uat-observer.yml'

permissions:
  contents: write

concurrency:
  group: pr737-private-runtime-prerequisite-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Publish permanent 080, 081, and 094 repair
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      EXPECTED_HEAD: 2ec3bcb67069a51b2139d5b0060b0772afdc06d1

    steps:
      - name: Check out exact reviewed PR candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 2ec3bcb67069a51b2139d5b0060b0772afdc06d1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded permanent migration repair
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]]

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              source = path.read_text(encoding='utf-8')
              if source.count(old) != 1:
                  raise SystemExit(f'Expected exactly one patch boundary in {path_name}: {old[:120]!r}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          drift_repair = """-- Older Protected-Test databases can predate the canonical app_users active flag.
          -- Restore that canonical column before any server-owned identity query uses it.
          ALTER TABLE app_users
              ADD COLUMN IF NOT EXISTS is_active BOOLEAN;
          UPDATE app_users
             SET is_active = TRUE
           WHERE is_active IS NULL;
          ALTER TABLE app_users
              ALTER COLUMN is_active SET DEFAULT TRUE;
          ALTER TABLE app_users
              ALTER COLUMN is_active SET NOT NULL;

          """

          replace_once(
              'database/migrations/080_celar_ai_internal_data_intelligence.sql',
              "$celar_ai_internal_data_prerequisites$;\n\nCREATE TABLE IF NOT EXISTS celar_ai_identity_aliases (",
              "$celar_ai_internal_data_prerequisites$;\n\n" + drift_repair + "CREATE TABLE IF NOT EXISTS celar_ai_identity_aliases ("
          )
          replace_once(
              'database/migrations/081_celar_ai_private_runtime_activation.sql',
              "$celar_ai_private_runtime_prerequisites$;\n\nCREATE TABLE IF NOT EXISTS celar_ai_private_runtime_profiles (",
              "$celar_ai_private_runtime_prerequisites$;\n\n" + drift_repair + "CREATE TABLE IF NOT EXISTS celar_ai_private_runtime_profiles ("
          )

          for test_path in (
              'tests/test-celar-ai-internal-data-migration-080.sh',
              'tests/test-celar-ai-private-runtime-activation-migration-081.sh',
          ):
              replace_once(
                  test_path,
                  "    department TEXT NOT NULL DEFAULT '',\n    is_active BOOLEAN NOT NULL DEFAULT TRUE,\n    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),",
                  "    department TEXT NOT NULL DEFAULT '',\n    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),"
              )

          replace_once(
              'tests/test-celar-ai-internal-data-migration-080.sh',
              "psql_exec -f \"$MIGRATION_CONTAINER\" >/dev/null\nassert_eq 1 \"$(value \"SELECT COUNT(*) FROM schema_migrations WHERE migration_id='080_celar_ai_internal_data_intelligence';\")\" migration_registered",
              "psql_exec -f \"$MIGRATION_CONTAINER\" >/dev/null\nassert_eq is_active \"$(value \"SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name='app_users' AND column_name='is_active';\")\" app_users_active_column_restored\nassert_eq 0 \"$(value \"SELECT COUNT(*) FROM app_users WHERE is_active IS DISTINCT FROM TRUE;\")\" app_users_active_values_backfilled\nassert_eq 1 \"$(value \"SELECT COUNT(*) FROM schema_migrations WHERE migration_id='080_celar_ai_internal_data_intelligence';\")\" migration_registered"
          )
          replace_once(
              'tests/test-celar-ai-private-runtime-activation-migration-081.sh',
              "psql_exec -f \"$MIGRATION_CONTAINER\" >/dev/null\nassert_eq 1 \"$(value \"SELECT COUNT(*) FROM schema_migrations WHERE migration_id='081_celar_ai_private_runtime_activation';\")\" migration_registered",
              "psql_exec -f \"$MIGRATION_CONTAINER\" >/dev/null\nassert_eq is_active \"$(value \"SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name='app_users' AND column_name='is_active';\")\" app_users_active_column_restored\nassert_eq 0 \"$(value \"SELECT COUNT(*) FROM app_users WHERE is_active IS DISTINCT FROM TRUE;\")\" app_users_active_values_backfilled\nassert_eq 1 \"$(value \"SELECT COUNT(*) FROM schema_migrations WHERE migration_id='081_celar_ai_private_runtime_activation';\")\" migration_registered"
          )

          builder = 'scripts/release-test/build-and-run-flowhive-authority-migration-094-job.sh'
          replace_once(
              builder,
              'MIGRATION_FILE="$ROOT/database/migrations/094_flowhive_canonical_sow_authority.sql"\nMIGRATION_RUNNER="$ROOT/scripts/release-test/run-flowhive-authority-migration-094-job.sh"',
              'MIGRATION_080_FILE="$ROOT/database/migrations/080_celar_ai_internal_data_intelligence.sql"\nMIGRATION_081_FILE="$ROOT/database/migrations/081_celar_ai_private_runtime_activation.sql"\nMIGRATION_FILE="$ROOT/database/migrations/094_flowhive_canonical_sow_authority.sql"\nMIGRATION_RUNNER="$ROOT/scripts/release-test/run-flowhive-authority-migration-094-job.sh"'
          )
          replace_once(
              builder,
              '[[ -s "$MIGRATION_FILE" ]] || fail "Migration 094 source is missing."\n[[ -s "$MIGRATION_RUNNER" ]] || fail "Migration 094 runner is missing."',
              '[[ -s "$MIGRATION_080_FILE" ]] || fail "Migration 080 source is missing."\n[[ -s "$MIGRATION_081_FILE" ]] || fail "Migration 081 source is missing."\n[[ -s "$MIGRATION_FILE" ]] || fail "Migration 094 source is missing."\n[[ -s "$MIGRATION_RUNNER" ]] || fail "Migration 094 runner is missing."'
          )
          replace_once(
              builder,
              'install -d -m 0700 "$CONTEXT/database/migrations"\ninstall -m 0444 "$MIGRATION_FILE" "$CONTEXT/database/migrations/094_flowhive_canonical_sow_authority.sql"',
              'install -d -m 0700 "$CONTEXT/database/migrations"\ninstall -m 0444 "$MIGRATION_080_FILE" "$CONTEXT/database/migrations/080_celar_ai_internal_data_intelligence.sql"\ninstall -m 0444 "$MIGRATION_081_FILE" "$CONTEXT/database/migrations/081_celar_ai_private_runtime_activation.sql"\ninstall -m 0444 "$MIGRATION_FILE" "$CONTEXT/database/migrations/094_flowhive_canonical_sow_authority.sql"'
          )
          replace_once(
              builder,
              'psql -X -v ON_ERROR_STOP=1 --file "$ROOT/database/migrations/094_flowhive_canonical_sow_authority.sql"',
              'psql -X -v ON_ERROR_STOP=1 --file "$ROOT/database/migrations/080_celar_ai_internal_data_intelligence.sql"\npsql -X -v ON_ERROR_STOP=1 --file "$ROOT/database/migrations/081_celar_ai_private_runtime_activation.sql"\npsql -X -v ON_ERROR_STOP=1 --file "$ROOT/database/migrations/094_flowhive_canonical_sow_authority.sql"'
          )
          replace_once(
              builder,
              "SELECT\n  EXISTS(SELECT 1 FROM schema_migrations WHERE migration_id='094_flowhive_canonical_sow_authority')::text || '|' ||\n  (to_regclass('public.module094_flowhive_sow_authority_evidence') IS NOT NULL)::text || '|' ||\n  (to_regprocedure('public.projectpulse094_reconcile_ready_work_register_sow(uuid)') IS NOT NULL)::text;",
              "SELECT\n  EXISTS(SELECT 1 FROM schema_migrations WHERE migration_id='080_celar_ai_internal_data_intelligence')::text || '|' ||\n  EXISTS(SELECT 1 FROM schema_migrations WHERE migration_id='081_celar_ai_private_runtime_activation')::text || '|' ||\n  EXISTS(SELECT 1 FROM schema_migrations WHERE migration_id='094_flowhive_canonical_sow_authority')::text || '|' ||\n  (to_regclass('public.module094_flowhive_sow_authority_evidence') IS NOT NULL)::text || '|' ||\n  (to_regprocedure('public.projectpulse094_reconcile_ready_work_register_sow(uuid)') IS NOT NULL)::text;"
          )
          replace_once(
              builder,
              "[[ \"$verification\" == 'true|true|true' ]] || {",
              "[[ \"$verification\" == 'true|true|true|true|true' ]] || {"
          )

          validator = Path('tests/validate-systemwide-image-build-controller.mjs')
          validator_text = validator.read_text(encoding='utf-8')
          boundary = "const bashScript = ["
          if validator_text.count(boundary) != 1:
              raise SystemExit('Image-controller validator insertion boundary changed.')
          addition = r"""const privateRuntimeMigrations = [
            'database/migrations/080_celar_ai_internal_data_intelligence.sql',
            'database/migrations/081_celar_ai_private_runtime_activation.sql'
          ];
          for (const migrationPath of privateRuntimeMigrations) {
            const migration = fs.readFileSync(migrationPath, 'utf8');
            assert.match(migration, /ALTER TABLE app_users[\s\S]*ADD COLUMN IF NOT EXISTS is_active BOOLEAN/);
            assert.match(migration, /UPDATE app_users[\s\S]*SET is_active = TRUE[\s\S]*WHERE is_active IS NULL/);
            assert.match(migration, /ALTER COLUMN is_active SET NOT NULL/);
          }

          const flowHiveAuthorityBuilder = fs.readFileSync(
            'scripts/release-test/build-and-run-flowhive-authority-migration-094-job.sh',
            'utf8'
          );
          assert.match(flowHiveAuthorityBuilder, /080_celar_ai_internal_data_intelligence\.sql/);
          assert.match(flowHiveAuthorityBuilder, /081_celar_ai_private_runtime_activation\.sql/);
          assert.match(flowHiveAuthorityBuilder, /psql -X -v ON_ERROR_STOP=1 --file "\$ROOT\/database\/migrations\/080_celar_ai_internal_data_intelligence\.sql"/);
          assert.match(flowHiveAuthorityBuilder, /psql -X -v ON_ERROR_STOP=1 --file "\$ROOT\/database\/migrations\/081_celar_ai_private_runtime_activation\.sql"/);

          """
          validator.write_text(validator_text.replace(boundary, addition + boundary, 1), encoding='utf-8')

          manifest = Path('.github/shared-project-document-planning-governed-release-files.txt')
          entries = {line.strip() for line in manifest.read_text(encoding='utf-8').splitlines() if line.strip()}
          entries.update({
              'database/migrations/080_celar_ai_internal_data_intelligence.sql',
              'database/migrations/081_celar_ai_private_runtime_activation.sql',
              'tests/test-celar-ai-internal-data-migration-080.sh',
              'tests/test-celar-ai-private-runtime-activation-migration-081.sh',
          })
          manifest.write_text('\n'.join(sorted(entries)) + '\n', encoding='utf-8')
          PY

          bash -n scripts/release-test/build-and-run-flowhive-authority-migration-094-job.sh
          node --check tests/validate-systemwide-image-build-controller.mjs
          node tests/validate-systemwide-image-build-controller.mjs
          bash tests/test-celar-ai-internal-data-migration-080.sh
          bash tests/test-celar-ai-private-runtime-activation-migration-081.sh
          bash tests/test-flowhive-canonical-sow-authority-migration-094.sh
          git diff --check

      - name: Publish one permanent source commit to PR 737
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_paths="$(cat <<'PATHS'
          .github/shared-project-document-planning-governed-release-files.txt
          database/migrations/080_celar_ai_internal_data_intelligence.sql
          database/migrations/081_celar_ai_private_runtime_activation.sql
          scripts/release-test/build-and-run-flowhive-authority-migration-094-job.sh
          tests/test-celar-ai-internal-data-migration-080.sh
          tests/test-celar-ai-private-runtime-activation-migration-081.sh
          tests/validate-systemwide-image-build-controller.mjs
          PATHS
          )"
          actual_paths="$(git diff --name-only | sort)"
          [[ "$actual_paths" == "$expected_paths" ]] || {
            echo "Unexpected repair paths:" >&2
            printf '%s\n' "$actual_paths" >&2
            exit 1
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/shared-project-document-planning-governed-release-files.txt \
            database/migrations/080_celar_ai_internal_data_intelligence.sql \
            database/migrations/081_celar_ai_private_runtime_activation.sql \
            scripts/release-test/build-and-run-flowhive-authority-migration-094-job.sh \
            tests/test-celar-ai-internal-data-migration-080.sh \
            tests/test-celar-ai-private-runtime-activation-migration-081.sh \
            tests/validate-systemwide-image-build-controller.mjs
          git diff --cached --check
          git commit -m 'Repair Protected Test private-runtime migration prerequisites'

          git fetch --no-tags origin "$TARGET_BRANCH"
          [[ "$(git rev-parse "origin/$TARGET_BRANCH")" == "$EXPECTED_HEAD" ]] || {
            echo 'PR 737 moved while the repair was validating.' >&2
            exit 1
          }
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "PERMANENT_REPAIR_COMMIT=$(git rev-parse HEAD)"
          echo 'PRODUCTION_MUTATION=NONE'
