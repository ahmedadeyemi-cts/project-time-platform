          for obsolete in [
              '.github/workflows/repair-celar-ai-operations-source.yml',
              '.github/workflows/repair-celar-ai-operations-source-v2.yml',
              'tests/validate-celar-ai-ask-operations.mjs'
          ]:
              Path(obsolete).unlink(missing_ok=True)
          PY

          node --check src/frontend/project-time-web/scripts/inject-celar-ai-ask-operations.mjs
          node --check tests/validate-celar-ai-universal-answer-reliability.mjs
          node --check tests/validate-celar-ai-ask-operations-source.mjs
          git diff --check

