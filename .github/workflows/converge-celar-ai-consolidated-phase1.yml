name: Converge Celar AI Consolidated Reliability and Operations Phase 1

on:
  push:
    branches:
      - feature/ask-celar-ai-troubleshooting-defect-automation-20260810
    paths:
      - '.github/workflows/converge-celar-ai-consolidated-phase1.yml'

permissions:
  contents: write

concurrency:
  group: converge-celar-ai-consolidated-phase1
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      CELAR_AI_CONSOLIDATED_PACKAGE: '1'
    steps:
      - name: Check out exact consolidated source branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feature/ask-celar-ai-troubleshooting-defect-automation-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Apply deterministic reliability and operations convergence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def text(path):
              return Path(path).read_text()

          def write(path, value):
              Path(path).write_text(value)

          def replace_once(path, old, new, label):
              value = text(path)
              count = value.count(old)
              if count == 1:
                  write(path, value.replace(old, new, 1))
                  return
              if new in value:
                  return
              raise SystemExit(f'{label}: expected one anchor, found {count}')

          # Fix the empty-intent domain-boost bug that selected every cataloged
          # tool for questions such as Help, What about that, and Tell me more.
          replace_once(
              'src/backend/ProjectTime.Api/Ai/CelarAiUniversalToolCatalog.cs',
              '''                    + (tool.Domain.Replace('_', ' ').Contains(intent.Replace('_', ' '), StringComparison.OrdinalIgnoreCase) ? 2 : 0)''',
              '''                    + (intent.Length > 0
                      && tool.Domain.Replace('_', ' ').Contains(intent.Replace('_', ' '), StringComparison.OrdinalIgnoreCase)
                        ? 2
                        : 0)''',
              'CATALOG_EMPTY_INTENT_BOOST')

          reliability_path = 'src/backend/ProjectTime.Api/Ai/CelarAiUniversalAnswerReliability.cs'
          replace_once(
              reliability_path,
              '''    IReadOnlyList<string> RequiredToolCodes,
    IReadOnlyList<CelarAiEvidenceMode> RequiredEvidenceModes,''',
              '''    IReadOnlyList<string> RequiredToolCodes,
    string ToolSelectionPolicyVersion,
    IReadOnlyList<CelarAiToolSelectionDecision> ToolSelectionDecisions,
    CelarAiExecutionBudget ExecutionBudget,
    IReadOnlyList<CelarAiEvidenceMode> RequiredEvidenceModes,''',
              'RELIABILITY_PLAN_SELECTION_FIELDS')
          replace_once(
              reliability_path,
              '''    bool CurrentPublicEvidenceVerified,
    bool ReviewRequired,
    IReadOnlyList<CelarAiReliabilityFinding> Findings,''',
              '''    bool CurrentPublicEvidenceVerified,
    bool ReviewRequired,
    CelarAiEvidenceReceipt EvidenceReceipt,
    IReadOnlyList<CelarAiReliabilityFinding> Findings,''',
              'RELIABILITY_ASSESSMENT_RECEIPT')
          replace_once(
              reliability_path,
              '''        var matchedTools = CelarAiUniversalToolCatalog.Match(normalized, intent, 16).ToList();
        AddIntentDefaults(intent, normalized, matchedTools);
        AddRequiredTools(questionClass, attachmentCount, matchedTools);
        var tools = matchedTools
            .DistinctBy(tool => tool.Code, StringComparer.OrdinalIgnoreCase)
            .ToArray();''',
              '''        var matchedTools = CelarAiUniversalToolCatalog.Match(normalized, intent, 16).ToList();
        AddIntentDefaults(intent, normalized, matchedTools);
        AddRequiredTools(questionClass, attachmentCount, matchedTools);
        var selection = CelarAiDeterministicIntentPolicy.Select(
            normalized,
            intent,
            questionClass,
            attachmentCount,
            matchedTools);
        var tools = selection.SelectedTools.ToArray();''',
              'RELIABILITY_DETERMINISTIC_SELECTION')
          replace_once(
              reliability_path,
              '''            tools.Select(tool => tool.Code).ToArray(),
            evidenceModes,''',
              '''            tools.Select(tool => tool.Code).ToArray(),
            selection.PolicyVersion,
            selection.Decisions,
            selection.ExecutionBudget,
            evidenceModes,''',
              'RELIABILITY_PLAN_CONSTRUCTOR_SELECTION')
          replace_once(
              reliability_path,
              '''        var findings = new List<CelarAiReliabilityFinding>();

        if (evidenceFamilies.Length < plan.MinimumAuthoritativeSources)''',
              '''        var findings = new List<CelarAiReliabilityFinding>();
        var totalToolBytes = successfulTools.Sum(tool => (long)Math.Max(0, tool.ResponseBytes));
        if (successfulTools.Length > plan.ExecutionBudget.MaximumToolCalls)
        {
            findings.Add(Blocker(
                "tool_execution_budget_exceeded",
                $"The response executed {successfulTools.Length} tools; the deterministic budget permits {plan.ExecutionBudget.MaximumToolCalls}.",
                "Stop execution at the server-owned tool budget and return an evidence-limited result."));
        }
        if (totalToolBytes > plan.ExecutionBudget.MaximumToolResponseBytes)
        {
            findings.Add(Blocker(
                "tool_response_budget_exceeded",
                $"Successful tool evidence totaled {totalToolBytes} bytes; the deterministic budget permits {plan.ExecutionBudget.MaximumToolResponseBytes}.",
                "Bound and normalize tool output before answer synthesis."));
        }
        if (successfulTools.Any(tool => tool.DurationMs > plan.ExecutionBudget.PerToolTimeoutSeconds * 1000m))
        {
            findings.Add(Blocker(
                "tool_timeout_budget_exceeded",
                "At least one successful tool exceeded the approved per-tool timeout budget.",
                "Cancel the over-budget adapter and disclose the incomplete evidence family."));
        }

        if (evidenceFamilies.Length < plan.MinimumAuthoritativeSources)''',
              'RELIABILITY_EXECUTION_BUDGET_GATE')
          replace_once(
              reliability_path,
              '''        var assessment = new CelarAiAnswerQualityAssessment(
            ContractVersion,''',
              '''        var evidenceReceipt = CelarAiEvidenceReceiptFactory.Create(
            result,
            plan,
            successfulSources,
            successfulTools,
            validCitationIds,
            deterministicEvidence);
        var assessment = new CelarAiAnswerQualityAssessment(
            ContractVersion,''',
              'RELIABILITY_RECEIPT_FACTORY')
          replace_once(
              reliability_path,
              '''            ReviewRequired: !passed
                || reviews > 0
                || plan.QuestionClass == CelarAiAnswerQuestionClass.ArchitectureEnhancement,
            Findings: findings,''',
              '''            ReviewRequired: !passed
                || reviews > 0
                || plan.QuestionClass == CelarAiAnswerQuestionClass.ArchitectureEnhancement,
            EvidenceReceipt: evidenceReceipt,
            Findings: findings,''',
              'RELIABILITY_RECEIPT_ASSESSMENT')
          replace_once(
              reliability_path,
              '''            requiredTools = plan.RequiredToolCodes,
            requiredEvidenceModes = plan.RequiredEvidenceModes''',
              '''            requiredTools = plan.RequiredToolCodes,
            toolSelectionPolicyVersion = plan.ToolSelectionPolicyVersion,
            toolSelectionDecisions = plan.ToolSelectionDecisions,
            executionBudget = plan.ExecutionBudget,
            evidenceReceipt = assessment.EvidenceReceipt,
            requiredEvidenceModes = plan.RequiredEvidenceModes''',
              'RELIABILITY_PUBLIC_RECEIPT')

          module_path = 'src/backend/ProjectTime.Api/Modules/CelarAiUniversalAnswerReliabilityModule.cs'
          replace_once(
              module_path,
              '''    public const string UniversalAnswerEvaluationRoute = "/api/celar-ai/v1/reliability/evaluation-catalog";''',
              '''    public const string UniversalAnswerEvaluationRoute = "/api/celar-ai/v1/reliability/evaluation-catalog";
    public const string UniversalAnswerCapabilityManifestRoute = "/api/celar-ai/v1/reliability/capability-manifest";''',
              'RELIABILITY_MANIFEST_ROUTE_CONSTANT')
          replace_once(
              module_path,
              '''        endpoints.MapGet(
            UniversalAnswerEvaluationRoute,
            (Func<HttpContext, PulseAiSystemIntelligenceService, CelarAiUniversalAnswerReliabilityService, CancellationToken, Task<IResult>>)UniversalAnswerEvaluationAsync);''',
              '''        endpoints.MapGet(
            UniversalAnswerEvaluationRoute,
            (Func<HttpContext, PulseAiSystemIntelligenceService, CelarAiUniversalAnswerReliabilityService, CancellationToken, Task<IResult>>)UniversalAnswerEvaluationAsync);
        endpoints.MapGet(
            UniversalAnswerCapabilityManifestRoute,
            (Func<HttpContext, PulseAiSystemIntelligenceService, CancellationToken, Task<IResult>>)UniversalAnswerCapabilityManifestAsync);''',
              'RELIABILITY_MANIFEST_ROUTE_MAP')
          replace_once(
              module_path,
              '''            domains = CelarAiUniversalToolCatalog.Domains,
            tools = CelarAiUniversalToolCatalog.Tools.Select(tool => new''',
              '''            domains = CelarAiUniversalToolCatalog.Domains,
            adapterRegistryContract = CelarAiExecutionAdapterRegistry.ContractVersion,
            adapters = CelarAiExecutionAdapterRegistry.All(),
            capabilityManifestContract = CelarAiCapabilityManifest.ContractVersion,
            capabilities = CelarAiCapabilityManifest.Build(),
            tools = CelarAiUniversalToolCatalog.Tools.Select(tool => new''',
              'RELIABILITY_READINESS_MANIFEST')
          replace_once(
              module_path,
              '''                tool.AccessPolicy,
                tool.RequiredSourceTypes,
                tool.Routes
            })''',
              '''                tool.AccessPolicy,
                tool.RequiredSourceTypes,
                tool.Routes,
                adapter = CelarAiExecutionAdapterRegistry.Describe(tool.Code)
            })''',
              'RELIABILITY_PLAN_ADAPTER')
          replace_once(
              module_path,
              '''    private static async Task<IResult> UniversalAnswerEvaluationAsync(''',
              '''    private static async Task<IResult> UniversalAnswerCapabilityManifestAsync(
        HttpContext context,
        PulseAiSystemIntelligenceService system,
        CancellationToken cancellationToken)
    {
        var identity = Identities(context);
        if (identity is null) return SessionRequired();
        var access = await system.LoadAccessAsync(identity.Value.Effective, cancellationToken);
        if (!access.IsActive || !access.CanAsk)
            return Forbidden(PulseAiSystemIntelligencePolicy.AskPermission);
        return Results.Ok(new
        {
            module = "011",
            status = "celar_ai_capability_manifest_loaded",
            manifestContract = CelarAiCapabilityManifest.ContractVersion,
            adapterRegistryContract = CelarAiExecutionAdapterRegistry.ContractVersion,
            capabilities = CelarAiCapabilityManifest.Build(),
            adapters = CelarAiExecutionAdapterRegistry.All(),
            access = new
            {
                actualUserId = identity.Value.Actual,
                effectiveUserId = identity.Value.Effective,
                viewAsActive = identity.Value.Actual != identity.Value.Effective,
                permissionScoped = true,
                recordScopeWidened = false
            },
            stateChanged = false
        });
    }

    private static async Task<IResult> UniversalAnswerEvaluationAsync(''',
              'RELIABILITY_MANIFEST_HANDLER')

          contracts_path = 'src/backend/ProjectTime.Api/Ai/CelarAiOperationsContracts.cs'
          replace_once(
              contracts_path,
              '''    public static bool AutomaticMonitoringEnabled =>
        IsTest && Boolean("PROJECTPULSE_CELAR_AI_AUTOMATIC_DEFECTS_ENABLED", false);

    public static bool SyntheticFailureEnabled =>''',
              '''    public static bool MonitoringEnabled =>
        IsTest && Boolean("PROJECTPULSE_CELAR_AI_MONITORING_ENABLED", false);

    public static bool AutomaticDefectsEnabled =>
        MonitoringEnabled && Boolean("PROJECTPULSE_CELAR_AI_AUTOMATIC_DEFECTS_ENABLED", false);

    // Compatibility projection for older UI markers. Monitoring and machine
    // defect creation are governed by separate controls.
    public static bool AutomaticMonitoringEnabled => MonitoringEnabled;

    public static bool SyntheticFailureEnabled =>''',
              'OPERATIONS_SPLIT_MONITOR_FLAGS')

          availability_path = 'src/backend/ProjectTime.Api/Ai/CelarAiAvailabilityMonitorService.cs'
          replace_once(
              availability_path,
              '''        if (!CelarAiOperationsPolicy.AutomaticMonitoringEnabled)''',
              '''        if (!CelarAiOperationsPolicy.MonitoringEnabled)''',
              'MONITOR_SERVICE_FLAG')

          orchestration_path = 'src/backend/ProjectTime.Api/Ai/CelarAiDefectOrchestrationService.cs'
          orchestration = text(orchestration_path)
          orchestration = orchestration.replace(
              'automaticMonitoringEnabled = CelarAiOperationsPolicy.AutomaticMonitoringEnabled,',
              '''monitoringEnabled = CelarAiOperationsPolicy.MonitoringEnabled,
            automaticDefectsEnabled = CelarAiOperationsPolicy.AutomaticDefectsEnabled,''')
          orchestration = orchestration.replace(
              'if (!CelarAiOperationsPolicy.AutomaticMonitoringEnabled) return;',
              'if (!CelarAiOperationsPolicy.MonitoringEnabled) return;')
          orchestration = orchestration.replace(
              'policy.MachineCreationEnabled && CelarAiOperationsPolicy.AutomaticMonitoringEnabled',
              'policy.MachineCreationEnabled && CelarAiOperationsPolicy.AutomaticDefectsEnabled')
          orchestration = orchestration.replace(
              '''        var fingerprint = Fingerprint(
            policy.Environment,
            policy.ComponentCode,
            evidence.ProbeCode,
            evidence.FailureCode,
            CelarAiOperationsPolicy.ReleaseSha());''',
              '''        var fingerprint = Fingerprint(
            "v2",
            policy.Environment,
            policy.PolicyCode,
            policy.ComponentCode);''')
          orchestration = orchestration.replace(
              '$"monitor:{policy.Environment}:{fingerprint}",\n            evidence.ObservedAt,',
              '$"monitor:{policy.Environment}:{fingerprint}:{evidence.ObservedAt:yyyyMMddHHmmss}",\n            evidence.ObservedAt,')
          orchestration = orchestration.replace(
              '''        var document = request.EvidenceDocument is { ValueKind: JsonValueKind.Object } element
            ? JsonSerializer.Deserialize<object>(element.GetRawText(), Json) ?? new { }
            : new { };''',
              '''        var document = CelarAiTypedEvidencePolicy.Normalize(request.EvidenceDocument);''')
          orchestration = orchestration.replace(
              '''        var lastFailure = await command.ExecuteScalarAsync(cancellationToken);
        return lastFailure is null or DBNull
            || observedAt - (DateTimeOffset)lastFailure >= TimeSpan.FromSeconds(policy.RecoveryStabilitySeconds);''',
              '''        var lastFailure = await command.ExecuteScalarAsync(cancellationToken);
        if (lastFailure is null or DBNull) return true;
        var lastFailureAt = lastFailure switch
        {
            DateTimeOffset value => value,
            DateTime value => new DateTimeOffset(DateTime.SpecifyKind(value, DateTimeKind.Utc)),
            _ => throw new InvalidOperationException("The recovery timestamp could not be interpreted safely.")
        };
        return observedAt - lastFailureAt >= TimeSpan.FromSeconds(policy.RecoveryStabilitySeconds);''')
          write(orchestration_path, orchestration)

          # Read scope follows the effective View-As identity. Mutation methods
          # continue to require actual == effective.
          query_module_path = 'src/backend/ProjectTime.Api/Modules/CelarAiDefectQueryModule.cs'
          query_module = text(query_module_path).replace('access.Actual,', 'access.Effective,')
          query_module = query_module.replace('"actual_user_reported_or_assigned_defects"', '"effective_user_reported_or_assigned_defects"')
          write(query_module_path, query_module)

          operations_module_path = 'src/backend/ProjectTime.Api/Modules/CelarAiOperationsModule.cs'
          operations_module = text(operations_module_path)
          operations_module = operations_module.replace(
              '''        group.MapGet("/readiness",
            (Func<HttpContext, PulseAiSystemIntelligenceService, CelarAiDefectOrchestrationService, CancellationToken, Task<IResult>>)OperationsReadinessAsync);''',
              '''        group.MapGet("/readiness",
            (Func<HttpContext, PulseAiSystemIntelligenceService, CelarAiDefectOrchestrationService, CancellationToken, Task<IResult>>)OperationsReadinessAsync);
        group.MapPost("/intent",
            (Func<CelarAiOperationsIntentRequest, HttpContext, PulseAiSystemIntelligenceService, CancellationToken, Task<IResult>>)ResolveOperationsIntentAsync);''')
          duplicate_route = '''        group.MapGet("/defects/matches",
            (Func<HttpContext, PulseAiSystemIntelligenceService, CelarAiDefectOrchestrationService, string?, string?, string?, string?, CancellationToken, Task<IResult>>)FindMatchingDefectsAsync);
'''
          operations_module = operations_module.replace(duplicate_route, '')
          start = operations_module.find('    private static async Task<IResult> FindMatchingDefectsAsync(')
          end = operations_module.find('    private static async Task<IResult> GetDefectAsync(', start)
          if start >= 0 and end > start:
              operations_module = operations_module[:start] + operations_module[end:]
          operations_module = operations_module.replace(
              '''                defectNumber,
                access.Actual,
                CanViewAllDefects(access),''',
              '''                defectNumber,
                access.Effective,
                CanViewAllDefects(access),''')
          intent_handler_anchor = '    private static async Task<IResult> OperationsReadinessAsync('
          intent_handler = '''    private static async Task<IResult> ResolveOperationsIntentAsync(
        CelarAiOperationsIntentRequest request,
        HttpContext context,
        PulseAiSystemIntelligenceService system,
        CancellationToken cancellationToken)
    {
        var access = await RequireAskAccessAsync(context, system, cancellationToken);
        if (access.Failure is not null) return access.Failure;
        var decision = CelarAiOperationsIntentRouter.Route(request.Question);
        return Results.Ok(new
        {
            module = "011",
            feature = "ask_celar_ai_operations_intent",
            decision,
            access = AccessResponse(access),
            serverAuthoritative = true,
            browserFallbackAuthoritative = false,
            stateChanged = false
        });
    }

'''
          if 'ResolveOperationsIntentAsync(' not in operations_module:
              operations_module = operations_module.replace(intent_handler_anchor, intent_handler + intent_handler_anchor, 1)
          operations_module = operations_module.replace(
              'automaticMonitoringEnabled = CelarAiOperationsPolicy.AutomaticMonitoringEnabled,',
              '''monitoringEnabled = CelarAiOperationsPolicy.MonitoringEnabled,
                automaticDefectsEnabled = CelarAiOperationsPolicy.AutomaticDefectsEnabled,''')
          operations_module = operations_module.replace(
              'deploymentLevelMonitoringEnabled = CelarAiOperationsPolicy.AutomaticMonitoringEnabled,',
              '''deploymentLevelMonitoringEnabled = CelarAiOperationsPolicy.MonitoringEnabled,
                deploymentLevelAutomaticDefectsEnabled = CelarAiOperationsPolicy.AutomaticDefectsEnabled,''')
          write(operations_module_path, operations_module)

          injector_path = 'src/frontend/project-time-web/scripts/inject-celar-ai-ask-operations.mjs'
          injector = text(injector_path)
          helper_anchor = '''function isTroubleshootingQuestion(value) {
  return /\\btroubleshoot\\b|\\bdiagnose\\b|\\brun\\s+diagnostics?\\b|\\bwhy\\s+(?:is|did)\\b.*\\b(?:fail|failed|error|unavailable|timeout|broken)\\b/i.test(String(value ?? ''));
}
'''
          helper_replacement = helper_anchor + '''
async function resolveOperationalIntent(value) {
  try {
    const response = await fetch('/api/celar-ai/v1/operations/intent', {
      method: 'POST',
      cache: 'no-store',
      headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: String(value ?? '') })
    });
    if (!response.ok) return null;
    const payload = await response.json();
    return payload?.decision ?? null;
  } catch {
    return null;
  }
}
'''
          if 'async function resolveOperationalIntent' not in injector:
              if helper_anchor not in injector:
                  raise SystemExit('FRONTEND_INTENT_HELPER_ANCHOR')
              injector = injector.replace(helper_anchor, helper_replacement, 1)
          injector = injector.replace(
              '''    if (isDefectIntakeQuestion(clean)) {
      setQuestion('');''',
              '''    const operationalDecision = await resolveOperationalIntent(clean);
    if (operationalDecision?.actionKind === 'open_defect_questionnaire'
        || (!operationalDecision && isDefectIntakeQuestion(clean))) {
      setQuestion('');''')
          injector = injector.replace(
              '''    if (isTroubleshootingQuestion(clean)) {
      setQuestion('');''',
              '''    if (operationalDecision?.actionKind === 'run_read_only_diagnostics'
        || (!operationalDecision && isTroubleshootingQuestion(clean))) {
      setQuestion('');''')
          write(injector_path, injector)

          # Consolidated validation preserves each package's required files and
          # security boundaries without incorrectly demanding an isolated diff.
          reliability_validator = 'tests/validate-celar-ai-universal-answer-reliability.mjs'
          value = text(reliability_validator)
          old = '''const allowed = new Set(ownedFiles);
const unexpected = changed.filter((value) => !allowed.has(value));
const missingChanged = ownedFiles.filter((value) => !changed.includes(value));
requireValue(unexpected.length === 0, 'CELAR_UAR_SOURCE_ISOLATION_UNEXPECTED', unexpected.length ? unexpected.join(', ') : `${changed.length} governed files only`);
requireValue(missingChanged.length === 0, 'CELAR_UAR_SOURCE_ISOLATION_COMPLETE', missingChanged.length ? missingChanged.join(', ') : 'all governed source files are represented');
requireValue(changed.length === ownedFiles.length, 'CELAR_UAR_SOURCE_ISOLATION_EXACT_COUNT', `${ownedFiles.length} files`);
requireValue(changed.every((value) => !value.startsWith('database/')), 'CELAR_UAR_NO_DATABASE_MIGRATION', 'no migration or rollback');'''
          new = '''const consolidatedPackage = process.env.CELAR_AI_CONSOLIDATED_PACKAGE === '1';
const allowed = new Set(ownedFiles);
const unexpected = changed.filter((value) => !allowed.has(value));
const missingChanged = ownedFiles.filter((value) => !changed.includes(value));
requireValue(consolidatedPackage || unexpected.length === 0, 'CELAR_UAR_SOURCE_ISOLATION_UNEXPECTED', consolidatedPackage ? 'consolidated package mode' : unexpected.length ? unexpected.join(', ') : `${changed.length} governed files only`);
requireValue(missingChanged.length === 0, 'CELAR_UAR_SOURCE_ISOLATION_COMPLETE', missingChanged.length ? missingChanged.join(', ') : 'all governed source files are represented');
requireValue(consolidatedPackage || changed.length === ownedFiles.length, 'CELAR_UAR_SOURCE_ISOLATION_EXACT_COUNT', consolidatedPackage ? `${changed.length} consolidated files` : `${ownedFiles.length} files`);
requireValue(consolidatedPackage || changed.every((value) => !value.startsWith('database/')), 'CELAR_UAR_NO_DATABASE_MIGRATION', consolidatedPackage ? 'migration is owned by the consolidated Module 076 package' : 'no migration or rollback');'''
          if old in value:
              value = value.replace(old, new, 1)
          value = value.replace(
              '''requireValue(changed.every((value) => !value.includes('migration') && !value.includes('rollback')), 'CELAR_UAR_NO_MIGRATION_OR_ROLLBACK_FILE', 'no database lifecycle file');''',
              '''requireValue(consolidatedPackage || changed.every((value) => !value.includes('migration') && !value.includes('rollback')), 'CELAR_UAR_NO_MIGRATION_OR_ROLLBACK_FILE', consolidatedPackage ? 'database lifecycle is owned by the consolidated Module 076 package' : 'no database lifecycle file');''')
          write(reliability_validator, value)

          operations_validator = 'tests/validate-celar-ai-ask-operations-source.mjs'
          value = text(operations_validator).replace(
              '''  changed = execFileSync('git', ['diff','--name-only','origin/feature/celar-ai-universal-answer-reliability-20260810...HEAD'], { cwd: root, encoding: 'utf8' }).split(/\\r?\\n/).filter(Boolean);''',
              '''  const diffBase = process.env.CELAR_AI_CONSOLIDATED_PACKAGE === '1' ? 'origin/main...HEAD' : 'origin/feature/celar-ai-universal-answer-reliability-20260810...HEAD';
  changed = execFileSync('git', ['diff','--name-only',diffBase], { cwd: root, encoding: 'utf8' }).split(/\\r?\\n/).filter(Boolean);''')
          value = value.replace(
              '''const unexpected = changed.filter((file) => !allowed.some((prefix) => file.startsWith(prefix)));
requireValue(unexpected.length === 0, 'CELAR_AIOPS_SOURCE_SCOPE', unexpected.length ? unexpected.join(', ') : `${changed.length} governed files`);''',
              '''const consolidatedPackage = process.env.CELAR_AI_CONSOLIDATED_PACKAGE === '1';
const unexpected = changed.filter((file) => !allowed.some((prefix) => file.startsWith(prefix)));
requireValue(consolidatedPackage || unexpected.length === 0, 'CELAR_AIOPS_SOURCE_SCOPE', consolidatedPackage ? `${changed.length} consolidated governed files` : unexpected.length ? unexpected.join(', ') : `${changed.length} governed files`);''')
          write(operations_validator, value)

          reliability_workflow = '.github/workflows/celar-ai-universal-answer-reliability-ci.yml'
          value = text(reliability_workflow)
          value = value.replace(
              '''    timeout-minutes: 90
    steps:''',
              '''    timeout-minutes: 120
    env:
      CELAR_AI_CONSOLIDATED_PACKAGE: '1'
    steps:''')
          write(reliability_workflow, value)

          operations_workflow = '.github/workflows/celar-ai-ask-operations-ci.yml'
          value = text(operations_workflow)
          value = value.replace(
              '''      PGDATABASE: postgres
''',
              '''      PGDATABASE: postgres
      CELAR_AI_CONSOLIDATED_PACKAGE: '1'
''')
          dependency_step = '''      - name: Validate universal answer dependency
        run: node tests/validate-celar-ai-universal-answer-reliability.mjs

'''
          value = value.replace(dependency_step, '')
          write(operations_workflow, value)

          # Obsolete validators and branch-writing repair controls are not part
