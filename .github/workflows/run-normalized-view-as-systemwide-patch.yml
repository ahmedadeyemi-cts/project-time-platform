name: Run targeted systemwide View-As navigation repair

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: targeted-view-as-module-navigation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.event.pull_request.head.ref == 'fix/view-as-module-navigation-continuity-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Apply targeted reviewed source repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/augment-view-as-module-navigation-systemwide.yml').read_text()
          start_marker = "      - name: Apply complete systemwide repair\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Validate focused systemwide contracts"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          script = '\n'.join(lines) + '\n'

          # Replace the one malformed directory-ownership function carrier with
          # exact source lines, leaving the validated core policy untouched.
          malformed_start = "replace_once(\n    bridge,\n    '''  function restoreModulesDirectoryAction(element) {"
          following_marker = "path = root / bridge"
          call_start = script.index(malformed_start)
          call_end = script.index(following_marker, call_start)
          targeted_restore = '''bridge_path = root / bridge
          bridge_text = bridge_path.read_text()
          restore_old = "\\n".join([
              "  function restoreModulesDirectoryAction(element) {",
              "    if (!isModulesDirectoryOwned(element)) return false;",
              "    element.hidden = false;",
              "    element.removeAttribute('hidden');",
              "    element.removeAttribute('aria-hidden');",
              "    element.removeAttribute(HIDDEN_ATTRIBUTE);",
              "    element.removeAttribute('data-module-availability-hidden');",
              "    return true;",
              "  }",
          ])
          restore_new = "\\n".join([
              "  function leaveModulesDirectoryToReact(element) {",
              "    // The directory consumes the published effective-user navigation state",
              "    // and owns its card/action DOM. The bridge must never force an Open",
              "    // action visible after React has classified it as denied or pending.",
              "    return isModulesDirectoryOwned(element);",
              "  }",
          ])
          restore_count = bridge_text.count(restore_old)
          if restore_count != 1:
              raise SystemExit(f'module-availability-bridge.js: restore function count={restore_count}')
          bridge_path.write_text(bridge_text.replace(restore_old, restore_new, 1))

          '''
          script = script[:call_start] + targeted_restore + script[call_end:]

          # The route helper and public route API literals begin inside an IIFE.
          # Their continuation lines need the IIFE's two-space indentation.
          helper_insert = "insert_before_once(bridge, '  function enforceRouteBoundary() {\\n', route_helpers)"
          helper_normalized = '''route_helper_lines = route_helpers.splitlines(keepends=True)
          route_helpers = route_helper_lines[0] + ''.join(
              ('  ' + line) if line.strip() else line
              for line in route_helper_lines[1:]
          )
          insert_before_once(bridge, '  function enforceRouteBoundary() {\\n', route_helpers)'''
          if script.count(helper_insert) != 1:
              raise SystemExit(f'route helper insertion marker count={script.count(helper_insert)}')
          script = script.replace(helper_insert, helper_normalized, 1)

          route_api_insert = "insert_before_once(bridge, '  async function refreshPermissions() {\\n', route_api)"
          route_api_normalized = '''route_api_lines = route_api.splitlines(keepends=True)
          route_api = route_api_lines[0] + ''.join(
              ('  ' + line) if line.strip() else line
              for line in route_api_lines[1:]
          )
          insert_before_once(bridge, '  async function refreshPermissions() {\\n', route_api)'''
          if script.count(route_api_insert) != 1:
              raise SystemExit(f'route API insertion marker count={script.count(route_api_insert)}')
          script = script.replace(route_api_insert, route_api_normalized, 1)

          # Replace the silent Dashboard redirect function with exact source
          # lines instead of relying on the malformed nested literal.
          enforce_start_marker = "replace_once(\n    bridge,\n    '''  function enforceRouteBoundary() {"
          enforce_next_marker = "replace_once(\n    bridge,\n    \"      deniedModuleNumbers:"
          enforce_start = script.index(enforce_start_marker)
          enforce_end = script.index(enforce_next_marker, enforce_start)
          targeted_enforce = '''bridge_path = root / bridge
          bridge_text = bridge_path.read_text()
          enforce_old = "\\n".join([
              "  function enforceRouteBoundary() {",
              "    if (permissionEvidenceState === 'loading') return;",
              "    const rawRoute = rawModuleRoute(window.location.hash || '#dashboard') || 'dashboard';",
              "    const retired = retiredModuleForRoute(rawRoute);",
              "    if (retired) {",
              "      window.sessionStorage.setItem(RETIRED_ROUTE_NOTICE_KEY, 'true');",
              "      if (rawRoute !== 'work-register') window.location.replace('#work-register');",
              "      return;",
              "    }",
              "",
              "    const currentModule = moduleForRoute(rawRoute);",
              "    if (currentModule && deniedModuleNumbers.has(currentModule.moduleNumber.toUpperCase())) {",
              "      window.location.hash = '#dashboard';",
              "      window.dispatchEvent(new CustomEvent('projectpulse:permission-route-denied', {",
              "        detail: { moduleNumber: currentModule.moduleNumber, route: currentModule.route }",
              "      }));",
              "    }",
              "  }",
          ])
          enforce_new = "\\n".join([
              "  function enforceRouteBoundary() {",
              "    if (permissionEvidenceState === 'loading') return;",
              "    const rawRoute = rawModuleRoute(window.location.hash || '#dashboard') || 'dashboard';",
              "    const retired = retiredModuleForRoute(rawRoute);",
              "    if (retired) {",
              "      removeRouteAccessNotice();",
              "      window.sessionStorage.setItem(RETIRED_ROUTE_NOTICE_KEY, 'true');",
              "      if (rawRoute !== 'work-register') window.location.replace('#work-register');",
              "      return;",
              "    }",
              "",
              "    const currentModule = moduleForRoute(rawRoute);",
              "    if (!currentModule) {",
              "      removeRouteAccessNotice();",
              "      return;",
              "    }",
              "    const decision = moduleAccessDecision(currentModule);",
              "    if (decision.allowed) {",
              "      removeRouteAccessNotice();",
              "      return;",
              "    }",
              "    showRouteAccessNotice(currentModule, decision);",
              "    publishRouteDenied(currentModule, decision);",
              "  }",
          ])
          enforce_count = bridge_text.count(enforce_old)
          if enforce_count != 1:
              raise SystemExit(f'module-availability-bridge.js: enforce function count={enforce_count}')
          bridge_path.write_text(bridge_text.replace(enforce_old, enforce_new, 1))

          '''
          script = script[:enforce_start] + targeted_enforce + script[enforce_end:]

          script = script.replace(
              'raise SystemExit(f"{relative}: expected one replacement target, found {count}")',
              'raise SystemExit(f"{relative}: expected one replacement target, found {count}; marker={old.splitlines()[0]!r}")'
          )
          script = script.replace(
              'raise SystemExit(f"{relative}: expected one insertion marker, found {count}")',
              'raise SystemExit(f"{relative}: expected one insertion marker, found {count}; marker={marker.splitlines()[0]!r}")'
          )
          Path('/tmp/apply-view-as-systemwide.sh').write_text(script)
          PY
          bash /tmp/apply-view-as-systemwide.sh

      - name: Validate focused systemwide contracts
        working-directory: src/frontend/project-time-web
        run: |
          node --check src/module-navigation-access-policy.js
          node --check src/module-availability-bridge.js
          node --check scripts/validate-view-as-module-navigation.mjs
          node scripts/validate-view-as-module-navigation.mjs
          node scripts/validate-dynamic-rbac-administration.mjs
          node scripts/validate-module-012-scoped-role-admin.mjs
          node scripts/validate-group-1-navigation-work-consolidation.mjs
          node scripts/validate-modules-directory-page.mjs

      - name: Build API Release
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release -p:ProjectPulseSourceRevision=1111111111111111111111111111111111111111

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: |
          npm ci
          npm run build

      - name: Validate exact source boundary
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess

          allowed = {
              'src/frontend/project-time-web/src/module-availability-bridge.js',
              'src/frontend/project-time-web/src/module-navigation-access-policy.js',
              'src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx',
              'src/frontend/project-time-web/src/module-availability.css',
              'src/frontend/project-time-web/scripts/validate-view-as-module-navigation.mjs',
              'src/frontend/project-time-web/scripts/validate-module-012-scoped-role-admin.mjs',
              'src/frontend/project-time-web/scripts/validate-group-1-navigation-work-consolidation.mjs',
              'src/frontend/project-time-web/scripts/validate-modules-directory-page.mjs',
              'docs/security/VIEW-AS-MODULE-NAVIGATION-CONTINUITY.md',
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
              if len(line) >= 4
          }
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected:
              raise SystemExit(f'Unexpected files after validation: {sorted(unexpected)}')
          if missing:
              raise SystemExit(f'Expected repair files were not changed: {sorted(missing)}')
          PY

      - name: Commit validated source and remove temporary publishers
        shell: bash
        run: |
          rm .github/workflows/augment-view-as-module-navigation-systemwide.yml
          rm .github/workflows/diagnose-view-as-systemwide-patch-anchor.yml
          rm .github/workflows/run-normalized-view-as-systemwide-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete systemwide View-As module navigation repair"
          git push origin HEAD:fix/view-as-module-navigation-continuity-20260808
