name: Temporary Security PR 285 Final Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/security285-integration-trigger

permissions:
  contents: write

concurrency:
  group: projectpulse-security285-final-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor == 'ahmedadeyemi-cts'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_BRANCH: security/platform-findings-remediation-20260729

    steps:
      - name: Check out exact trigger
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: trigger
          fetch-depth: 1
          persist-credentials: false

      - name: Read exact expected security head
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE='trigger/.github/security285-integration-trigger'
          test -f "$FILE"
          EXPECTED_HEAD="$(sed -n 's/^expected_head=//p' "$FILE" | tail -1)"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(sed -n 's/^operation=//p' "$FILE" | tail -1)" == security285 ]]
          echo "expected_head=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"

      - name: Check out security branch
        uses: actions/checkout@v5
        with:
          ref: security/platform-findings-remediation-20260729
          path: repo
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repo/src/frontend/project-time-web/package-lock.json

      - name: Reconcile and make Work Register document visibility explicit
        working-directory: repo
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.request.outputs.expected_head }}
        run: |
          set -Eeuo pipefail
          git config user.name 'ProjectPulse Source Integration'
          git config user.email 'projectpulse-integration@users.noreply.github.com'
          git fetch origin main "$TARGET_BRANCH" --no-tags
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]] || {
            echo "Security branch moved. Expected $EXPECTED_HEAD but found $(git rev-parse HEAD)." >&2
            exit 1
          }
          git merge --no-ff origin/main -m 'Reconcile PR #285 with current main'

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/backend/ProjectTime.Api/Modules/SecurityHardeningModule.cs')
          text = path.read_text()
          old = '''        if (access.CanManageAllWorkRegisterDocuments)
                  {
                      return true;
                  }

                  var isProjectManager = await IsProjectManagerAsync(connection, actorUserId, projectId);'''
          new = '''        // The most restricted document class is available only to PTC/admin
                  // organization-wide document managers. Project Managers and assigned
                  // engineers never inherit this visibility through project membership.
                  if (visibility == "ptc_admin_only")
                  {
                      return access.CanManageAllWorkRegisterDocuments;
                  }

                  if (access.CanManageAllWorkRegisterDocuments)
                  {
                      return true;
                  }

                  var isProjectManager = await IsProjectManagerAsync(connection, actorUserId, projectId);'''
          if 'visibility == "ptc_admin_only"' not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected Work Register document scope block exactly once; found {text.count(old)}.')
              text = text.replace(old, new, 1)
          for marker in ('CanAccessWorkRegisterDocumentAsync', 'pm_ptc_admin', 'ptc_admin_only'):
              if marker not in text:
                  raise SystemExit(f'Missing security document-scope marker: {marker}')
          path.write_text(text)
          PY

          git add src/backend/ProjectTime.Api/Modules/SecurityHardeningModule.cs
          git diff --cached --check
          git commit -m 'Make restricted Work Register document visibility explicit'

      - name: Run complete security and application validation
        working-directory: repo
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate-platform-security-remediation-20260729.py
          python3 -m py_compile \
            scripts/security/finalize-role-audit-legacy-20260729.py \
            scripts/security/finalize-role-audit-user-admin-20260729.py \
            scripts/security/finalize-role-audit-bulk-20260729.py \
            scripts/security/finalize-safe-project-document-storage-20260730.py
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          dotnet run --project tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj --configuration Release
          pushd src/frontend/project-time-web >/dev/null
          npm ci --no-audit --no-fund
          npm run build
          popd >/dev/null
          docker build -f deployment/containers/web/Dockerfile .
          git diff --check origin/main...HEAD

      - name: Push validated security branch
        working-directory: repo
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin "HEAD:$TARGET_BRANCH"
          echo "SECURITY285_RECONCILED_HEAD=$(git rev-parse HEAD)"
