name: Temporary Module 025 Protected-Test Live UAT

on:
  push:
    branches:
      - uat/module025-live-20260901

permissions:
  contents: write

jobs:
  module025-live-uat:
    name: Patch Module 025 generation persistence repair
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/module025-generation-persistence-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and validate repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/patch-module025-generation-persistence-20260901.py
          rm scripts/patch-module025-generation-persistence-20260901.py
          git diff --check
          grep -Fq 'await using (var snapshotConnection = writable.Connection!)' src/backend/ProjectTime.Api/Modules/Module025SowGsdModule.cs
          grep -Fq 'var persistence = await LoadWritableStateAsync' src/backend/ProjectTime.Api/Modules/Module025SowGsdModule.cs
          grep -Fq 'module025_generation_persistence_unavailable' src/backend/ProjectTime.Api/Modules/Module025SowGsdModule.cs
          grep -Fq 'if (latest.Revision != current.Revision)' src/backend/ProjectTime.Api/Modules/Module025SowGsdModule.cs

      - name: Commit repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Module 025 generation persistence lifetime'
          git push origin HEAD:fix/module025-generation-persistence-20260901
