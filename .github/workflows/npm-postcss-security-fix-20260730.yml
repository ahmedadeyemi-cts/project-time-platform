name: Repair Frontend Build Supply Chain 2026-07-30

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/npm-postcss-security-fix-20260730.yml
      - scripts/security/validate-repository-security-posture.py
      - src/frontend/project-time-web/package.json
      - src/frontend/project-time-web/package-lock.json

permissions:
  contents: write

concurrency:
  group: projectpulse-frontend-supply-chain-repair-20260730
  cancel-in-progress: false

jobs:
  repair-lock:
    if: >-
      github.actor == 'ahmedadeyemi-cts' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/repository-posture-baseline-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: security/repository-posture-baseline-20260730
      FRONTEND_ROOT: src/frontend/project-time-web
      PATCHED_POSTCSS_VERSION: 8.5.18
      PATCHED_VITE_VERSION: 8.2.0
      PATCHED_REACT_PLUGIN_VERSION: 6.0.2

    steps:
      - name: Check out exact security branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Guard exact branch and repair scope
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_HEAD_REF" == "$TARGET_BRANCH" ]]
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          test -s "$FRONTEND_ROOT/package.json"
          test -s "$FRONTEND_ROOT/package-lock.json"
          python3 scripts/security/validate-repository-security-posture.py

      - name: Upgrade the vulnerable frontend build chain
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install \
            --save-prod \
            --save-exact \
            --package-lock-only \
            --ignore-scripts \
            "@vitejs/plugin-react@$PATCHED_REACT_PLUGIN_VERSION"
          npm install \
            --save-dev \
            --save-exact \
            --package-lock-only \
            --ignore-scripts \
            "vite@$PATCHED_VITE_VERSION" \
            "postcss@$PATCHED_POSTCSS_VERSION"
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          npm run build

      - name: Validate exact package-only change
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          mapfile -t CHANGED < <(git diff --name-only | sort)
          diff -u \
            <(printf '%s\n' \
              'src/frontend/project-time-web/package-lock.json' \
              'src/frontend/project-time-web/package.json') \
            <(printf '%s\n' "${CHANGED[@]}")
          grep -Fq '"@vitejs/plugin-react": "6.0.2"' "$FRONTEND_ROOT/package.json"
          grep -Fq '"postcss": "8.5.18"' "$FRONTEND_ROOT/package.json"
          grep -Fq '"vite": "8.2.0"' "$FRONTEND_ROOT/package.json"
          grep -Fq '"version": "8.5.18"' "$FRONTEND_ROOT/package-lock.json"
          grep -Fq '"version": "8.2.0"' "$FRONTEND_ROOT/package-lock.json"
          echo "FRONTEND_SUPPLY_CHAIN_REPAIR=PASS"

      - name: Commit the validated dependency repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/frontend/project-time-web/package.json \
            src/frontend/project-time-web/package-lock.json
          if git diff --cached --quiet; then
            echo "FRONTEND_SUPPLY_CHAIN_ALREADY_CURRENT=YES"
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Upgrade vulnerable frontend build dependencies'
          git push origin "HEAD:$TARGET_BRANCH"
          echo "FRONTEND_SUPPLY_CHAIN_PUSHED=YES"
