name: Validate Module 064 Automatic Provider Health

on:
  push:
    branches:
      - 'fix/module-064-automatic-provider-health-routing-*'
  pull_request:
    paths:
      - 'src/backend/ProjectTime.Api/Ai/ProjectPulseAiHealthRegistry.cs'
      - 'src/backend/ProjectTime.Api/Ai/ProjectPulseAiHealthMonitor.cs'
      - 'src/backend/ProjectTime.Api/Ai/ProjectPulseAiRouter.cs'
      - 'src/backend/ProjectTime.Api/Ai/ProjectPulseAiSecretStore.cs'
      - 'src/backend/ProjectTime.Api/Modules/AiProviderConfigurationModule.cs'
      - 'src/frontend/project-time-web/package.json'
      - 'src/frontend/project-time-web/package-lock.json'
      - 'src/frontend/project-time-web/src/App.jsx'
      - 'src/frontend/project-time-web/src/AiProviderConfigurationCenter.jsx'
      - 'src/frontend/project-time-web/src/ai-provider-configuration-center.css'
      - 'src/frontend/project-time-web/scripts/validate-module-064-shared-ai.mjs'
      - '.github/workflows/module064-automatic-provider-health-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module064-automatic-provider-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify Module 064 ownership, consolidated release, or regression applicability
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          git fetch origin "$BASE_BRANCH" --no-tags
          CHANGED="$(git diff --name-only "origin/$BASE_BRANCH"...HEAD)"
          printf '%s\n' "$CHANGED"

          HEAD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          OWNED_BRANCH='false'
          CENTRAL_SECURITY_BRANCH='false'
          CONSOLIDATED_RELEASE_BRANCH='false'
          if [[ "$HEAD_BRANCH" == fix/module-064-automatic-provider-health-routing-* ]]; then
            OWNED_BRANCH='true'
          elif [[ "$HEAD_BRANCH" == security/repository-posture-* ]]; then
            CENTRAL_SECURITY_BRANCH='true'
          elif [[ "$HEAD_BRANCH" == release/consolidated-enterprise-validation-* ]]; then
            CONSOLIDATED_RELEASE_BRANCH='true'
          fi

          ALLOWED='^(\.github/workflows/module064-automatic-provider-health-ci\.yml|src/backend/ProjectTime.Api/Ai/ProjectPulseAiHealthRegistry\.cs|src/backend/ProjectTime.Api/Ai/ProjectPulseAiHealthMonitor\.cs|src/backend/ProjectTime.Api/Ai/ProjectPulseAiRouter\.cs|src/backend/ProjectTime.Api/Ai/ProjectPulseAiSecretStore\.cs|src/backend/ProjectTime.Api/Modules/AiProviderConfigurationModule\.cs|src/frontend/project-time-web/package(-lock)?\.json|src/frontend/project-time-web/src/AiProviderConfigurationCenter\.jsx|src/frontend/project-time-web/src/ai-provider-configuration-center\.css|src/frontend/project-time-web/scripts/validate-module-064-shared-ai\.mjs)$'
          MODULE064_RUNTIME_OWNED='^(src/backend/ProjectTime.Api/Ai/ProjectPulseAiHealthRegistry\.cs|src/backend/ProjectTime.Api/Ai/ProjectPulseAiHealthMonitor\.cs|src/backend/ProjectTime.Api/Ai/ProjectPulseAiRouter\.cs|src/backend/ProjectTime.Api/Ai/ProjectPulseAiSecretStore\.cs|src/backend/ProjectTime.Api/Modules/AiProviderConfigurationModule\.cs|src/frontend/project-time-web/src/AiProviderConfigurationCenter\.jsx|src/frontend/project-time-web/src/ai-provider-configuration-center\.css|src/frontend/project-time-web/scripts/validate-module-064-shared-ai\.mjs)$'
          CENTRAL_MODULE064_CONVERGENCE='^src/frontend/project-time-web/src/AiProviderConfigurationCenter\.jsx$'

          if [[ "$OWNED_BRANCH" == 'true' ]]; then
            UNEXPECTED="$(grep -Ev "$ALLOWED" <<<"$CHANGED" || true)"
            if [[ -n "$UNEXPECTED" ]]; then
              echo 'Unexpected Module 064 source scope:' >&2
              printf '%s\n' "$UNEXPECTED" >&2
              exit 1
            fi

            if grep -E '^(database/|deployment/azure/|\.github/workflows/projectpulse-deploy-|src/backend/ProjectTime.Api/Modules/(Microsoft|CustomerDirectory|CrmErp)|src/frontend/project-time-web/src/(Microsoft|CrmErp|CustomerDirectory))' <<<"$CHANGED"; then
              echo 'Module 064 overlaps a database, deployment, Microsoft, CRM, or customer-directory surface.' >&2
              exit 1
            fi

            echo 'MODULE_064_VALIDATION_MODE=OWNED_SOURCE' >> "$GITHUB_ENV"
            echo 'MODULE_064_SOURCE_ISOLATION=PASSED'
          elif [[ "$CENTRAL_SECURITY_BRANCH" == 'true' ]]; then
            DIRECT_MODULE064="$(grep -E "$MODULE064_RUNTIME_OWNED" <<<"$CHANGED" || true)"
            UNAPPROVED_MODULE064="$(grep -Ev "$CENTRAL_MODULE064_CONVERGENCE" <<<"$DIRECT_MODULE064" || true)"
            if [[ -n "$UNAPPROVED_MODULE064" ]]; then
              echo 'The central security posture branch changed Module 064 source outside the reviewed canonical-source convergence boundary:' >&2
              printf '%s\n' "$UNAPPROVED_MODULE064" >&2
              exit 1
            fi

            echo 'MODULE_064_VALIDATION_MODE=CENTRAL_SECURITY_CONVERGENCE' >> "$GITHUB_ENV"
            echo 'MODULE_064_CENTRAL_SECURITY_CONVERGENCE=PASSED'
          elif [[ "$CONSOLIDATED_RELEASE_BRANCH" == 'true' ]]; then
            DIRECT_MODULE064="$(grep -E "$MODULE064_RUNTIME_OWNED" <<<"$CHANGED" || true)"
            UNAPPROVED_MODULE064="$(grep -Ev "$CENTRAL_MODULE064_CONVERGENCE" <<<"$DIRECT_MODULE064" || true)"
            if [[ -n "$UNAPPROVED_MODULE064" ]]; then
              echo 'The consolidated release changed Module 064 automatic-health source outside the reviewed convergence boundary:' >&2
              printf '%s\n' "$UNAPPROVED_MODULE064" >&2
              exit 1
            fi

            DISALLOWED_SCOPE="$(grep -E '^(deployment/azure/|scripts/.*deploy|\.github/workflows/projectpulse-deploy-|src/backend/ProjectTime.Api/Modules/(Microsoft|CustomerDirectory|CrmErp)|src/frontend/project-time-web/src/(Microsoft|CrmErp|CustomerDirectory))' <<<"$CHANGED" || true)"
            if [[ -n "$DISALLOWED_SCOPE" ]]; then
              echo 'The consolidated Module 064 validation overlaps an unauthorized deployment, Microsoft, CRM, or customer-directory surface:' >&2
              printf '%s\n' "$DISALLOWED_SCOPE" >&2
              exit 1
            fi

            test -f docs/releases/2026-08-02-consolidated-enterprise-validation.md
            test -f database/migrations/061_celar_ai_capability_routing.sql
            echo 'MODULE_064_VALIDATION_MODE=CONSOLIDATED_RELEASE' >> "$GITHUB_ENV"
            echo 'MODULE_064_CONSOLIDATED_RELEASE=PASSED'
          else
            DIRECT_MODULE064="$(grep -E "$MODULE064_RUNTIME_OWNED" <<<"$CHANGED" || true)"
            if [[ -n "$DIRECT_MODULE064" ]]; then
              echo 'Module 064-owned runtime source may only be changed from the isolated Module 064 branch family:' >&2
              printf '%s\n' "$DIRECT_MODULE064" >&2
              exit 1
            fi

            echo 'MODULE_064_VALIDATION_MODE=REGRESSION' >> "$GITHUB_ENV"
            echo 'MODULE_064_REGRESSION_APPLICABILITY=PASSED'
          fi

          git diff --check "origin/$BASE_BRANCH"...HEAD

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Validate automatic health source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          REGISTRY='src/backend/ProjectTime.Api/Ai/ProjectPulseAiHealthRegistry.cs'
          MONITOR='src/backend/ProjectTime.Api/Ai/ProjectPulseAiHealthMonitor.cs'
          ROUTER='src/backend/ProjectTime.Api/Ai/ProjectPulseAiRouter.cs'
          STORE='src/backend/ProjectTime.Api/Ai/ProjectPulseAiSecretStore.cs'
          MODULE='src/backend/ProjectTime.Api/Modules/AiProviderConfigurationModule.cs'
          CENTER='src/frontend/project-time-web/src/AiProviderConfigurationCenter.jsx'

          grep -Fq 'ShouldProbe' "$REGISTRY"
          grep -Fq 'MarkProbeStarted' "$REGISTRY"
          grep -Fq 'state.ProbeStatus = "checking"' "$REGISTRY"
          grep -Fq 'var liveConfiguration = _configuration.Provider(provider.Code)' "$MONITOR"
          grep -Fq '_health.ApplyConfiguration(liveConfiguration)' "$MONITOR"
          grep -Fq '_health.ShouldProbe(provider.Code, maximumAge, force)' "$MONITOR"
          grep -Fq '_health.ApplyConfiguration(_configuration.Provider(providerCode))' "$ROUTER"
          grep -Fq 'ProjectPulseAiHealthRegistry health' "$STORE"
          grep -Fq 'await coordinator.RefreshAsync(false, stoppingToken)' "$STORE"
          grep -Fq 'healthCheckedAutomatically = true' "$MODULE"
          grep -Fq 'secret_replaced_and_verified' "$MODULE"
          grep -Fq 'AUTOMATIC_HEALTH_POLL_LIMIT = 10' "$CENTER"
          grep -Fq 'Automatic provider health is active.' "$CENTER"

          if grep -Eq 'fetch\([^)]*(api\.anthropic\.com|api\.openai\.com)' "$CENTER"; then
            echo 'The browser must not probe AI providers directly.' >&2
            exit 1
          fi

          echo 'MODULE_064_STARTUP_HEALTH=PASSED'
          echo 'MODULE_064_PERIODIC_HEALTH=PASSED'
          echo 'MODULE_064_REPLICA_HEALTH=PASSED'
          echo 'MODULE_064_ROUTER_RECONCILIATION=PASSED'
          echo 'MODULE_064_FRONTEND_POLLING=BOUNDED_BACKEND_ONLY'
          echo 'MODULE_064_PROVIDER_CALLS_PERFORMED=0'

      - name: Build ProjectTime API
        id: api_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release > module064-api-build.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload API build diagnostics
        if: always() && steps.api_build.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module064-api-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: module064-api-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce API build result
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS='${{ steps.api_build.outputs.exit_code }}'
          if [[ "$STATUS" != '0' ]]; then
            tail -n 160 module064-api-build.log >&2
            exit "$STATUS"
          fi
          tail -n 50 module064-api-build.log
          echo 'MODULE_064_API_BUILD=PASSED'

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate Module 064 contract
        working-directory: src/frontend/project-time-web
        run: npm run validate:module064

      - name: Build complete frontend production bundle
        id: frontend_build
        continue-on-error: true
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set +e
          npm run build > module064-frontend-build.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload frontend build diagnostics
        if: always() && steps.frontend_build.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module064-frontend-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/frontend/project-time-web/module064-frontend-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce frontend build result and deterministic generated-source convergence
        if: steps.frontend_build.outcome != 'skipped'
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS='${{ steps.frontend_build.outputs.exit_code }}'
          if [[ "$STATUS" != '0' ]]; then
            tail -n 160 module064-frontend-build.log >&2
            exit "$STATUS"
          fi

          git -C ../../.. diff --check
          git -C ../../.. add -A
          trap 'git -C ../../.. reset --mixed >/dev/null 2>&1 || true' EXIT
          npm run prebuild
          git -C ../../.. diff --check
          git -C ../../.. diff --exit-code
          git -C ../../.. reset --mixed
          trap - EXIT

          tail -n 50 module064-frontend-build.log
          echo 'MODULE_064_GENERATED_SOURCE_CONVERGENCE=PASSED'
          echo 'MODULE_064_FRONTEND_BUILD=PASSED'
          echo "MODULE_064_VALIDATION_MODE=${MODULE_064_VALIDATION_MODE:-UNKNOWN}"
