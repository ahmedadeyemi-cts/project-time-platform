name: Temporary PR 323 Security Review Fix

on:
  pull_request:
    types: [synchronize, reopened]
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr323-security-review-fix.yml'

permissions:
  contents: write

concurrency:
  group: temporary-pr323-security-review-fix
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.pull_request.number == 323 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/module-011-system-intelligence-troubleshooting-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out PR #323 source branch
        uses: actions/checkout@v4
        with:
          ref: feature/module-011-system-intelligence-troubleshooting-20260730
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact independent-review corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .github/scripts/pr323_security_review_fix.py
          python .github/scripts/pr323_security_review_fix.py
          git diff --check

      - name: Validate authorization and trusted-origin source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs
          node src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs
          grep -Fq 'PROJECTPULSE_PULSE_AI_SYSTEM_TOOL_BASE_URI' src/backend/ProjectTime.Api/Ai/PulseAiSystemToolExecutor.cs
          ! grep -Fq 'context.Request.Host.Host' src/backend/ProjectTime.Api/Ai/PulseAiSystemToolExecutor.cs
          grep -Fq 'AllowAutoRedirect = false' src/backend/ProjectTime.Api/Ai/ProjectPulseAiServiceCollectionExtensions.cs
          grep -Fq 'request.IncludeApiInventory && access.CanViewApis' src/backend/ProjectTime.Api/Ai/PulseAiSystemIntelligenceService.cs
          grep -Fq 'var persistenceAuthorized = actualUserId == effectiveUserId' src/backend/ProjectTime.Api/Ai/PulseAiSystemIntelligenceService.cs
          cmp \
            docs/modules/module-011-pulse-ai/SYSTEM-INTELLIGENCE-AND-TROUBLESHOOTING.md \
            src/frontend/project-time-web/container-context/docs/modules/module-011-pulse-ai/SYSTEM-INTELLIGENCE-AND-TROUBLESHOOTING.md
          echo 'PR323_SECURITY_REVIEW_SOURCE_CONTRACT=PASS'

      - name: Build corrected API
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          echo 'PR323_SECURITY_REVIEW_API_BUILD=PASS'

      - name: Remove temporary tooling and push corrected source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/temporary-pr323-security-review-fix.yml
          rm .github/scripts/pr323_security_review_fix.py
          git config user.name 'projectpulse-security-finalizer'
          git config user.email 'projectpulse-security-finalizer@users.noreply.github.com'
          git add -A
          git commit -m 'Fix PR #323 authorization, persistence, and trusted tool origin'
          git push origin HEAD:feature/module-011-system-intelligence-troubleshooting-20260730
          echo "PR323_SECURITY_REVIEW_CORRECTED_HEAD=$(git rev-parse HEAD)"
