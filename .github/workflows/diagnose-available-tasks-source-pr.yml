name: Diagnose Available Tasks Source on PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-available-tasks-source-pr.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-available-tasks-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extract:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/jason-assigned-work-runtime-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Extract available-task source windows
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/available-task-source"
          install -d -m 0700 "$OUT"
          python3 - <<'PY'
          from pathlib import Path

          terms = [
              '/api/assignments/available-tasks',
              'available-tasks',
              'AvailableTasks',
              'LoadAvailable',
              'timeEntrySection',
              'workTaskCategory',
              'serviceRequestNumber'
          ]
          candidates = list(Path('src/backend/ProjectTime.Api').rglob('*.cs')) + [
              Path('src/frontend/project-time-web/src/App.jsx'),
              Path('src/frontend/project-time-web/src/App.Module001.g.jsx')
          ]
          chunks = []
          for path in candidates:
              if not path.exists():
                  continue
              lines = path.read_text(errors='replace').splitlines()
              matches = []
              for index, line in enumerate(lines):
                  if any(term in line for term in terms):
                      matches.append(index)
              if not matches:
                  continue
              chunks.append(f'===== FILE {path} =====')
              emitted = set()
              for index in matches:
                  start = max(0, index - 45)
                  end = min(len(lines), index + 100)
                  key = (start, end)
                  if key in emitted:
                      continue
                  emitted.add(key)
                  chunks.append(f'--- LINES {start + 1}-{end} ---')
                  chunks.extend(f'{number + 1:06d}: {lines[number]}' for number in range(start, end))
          output = Path('/tmp/available-task-source.txt')
          output.write_text('\n'.join(chunks) + '\n')
          PY
          cp /tmp/available-task-source.txt "$OUT/source-excerpts.txt"
          grep -nE 'available-tasks|AvailableTasks|timeEntrySection|serviceRequestNumber' "$OUT/source-excerpts.txt" | head -n 300

      - name: Upload source excerpts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: available-task-source-excerpts
          path: ${{ runner.temp }}/available-task-source
          if-no-files-found: error
          retention-days: 1
