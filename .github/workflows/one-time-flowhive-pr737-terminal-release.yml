name: One-time FlowHive PR737 Terminal Protected-UAT Release

on:
  push:
    branches:
      - tooling/one-time-flowhive-clean-publisher-20260819
    paths:
      - '.github/workflows/one-time-flowhive-pr737-terminal-release.yml'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: one-time-flowhive-pr737-terminal-protected-uat-release
  cancel-in-progress: false

jobs:
  terminal-release:
    name: Repair current PR737, require green SHA, deploy Protected UAT
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TARGET_PR: '737'
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      PROTECTED_TEST_URL: https://phd-west-test.onenecklab.com
    steps:
      - name: Allow prior one-time publishers to settle
        shell: bash
        run: sleep 300

      - name: Resolve current PR737 state
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          if [[ "$state" == MERGED ]]; then
            merge_sha="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
            [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Merged PR has no merge SHA.' >&2; exit 1; }
            echo 'already_merged=true' >> "$GITHUB_OUTPUT"
            echo "release_sha=$merge_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$state" == OPEN ]] || { echo "PR #$TARGET_PR is $state." >&2; exit 1; }
          head="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo 'PR #737 head is invalid.' >&2; exit 1; }
          echo 'already_merged=false' >> "$GITHUB_OUTPUT"
          echo "original_head=$head" >> "$GITHUB_OUTPUT"

      - name: Check out current PR737 branch with push credential
        if: steps.target.outputs.already_merged != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        if: steps.target.outputs.already_merged != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET 10
        if: steps.target.outputs.already_merged != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Apply exact idempotent release corrections
        if: steps.target.outputs.already_merged != 'true'
        id: repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$main_sha" HEAD || git merge --no-edit origin/main

          # Remove the exporter and every temporary reconstruction artifact from
          # the application PR. These files are never authorized for main.
          if git ls-files --error-unmatch .github/workflows/temporary-flowhive-source-export.yml >/dev/null 2>&1; then
            git rm -- .github/workflows/temporary-flowhive-source-export.yml
          fi
          for path in .flowhive-repair .github/flowhive-repair tmp/flowhive-repair; do
            if [[ -e "$path" ]]; then
              git rm -r --ignore-unmatch -- "$path"
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          # Shared FlowHive/Forge contract: semantic checks are case-insensitive
          # and Celar's unrelated historical changed-file allowlist is not used
          # as the shared project-planning applicability gate.
          path = Path('.github/workflows/shared-project-document-planning-ci.yml')
          if path.exists():
              source = read(path)
              source = source.replace(
                  "grep -Fq 'review' src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs",
                  "grep -Eiq 'review' src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs",
              )
              source = source.replace(
                  'node tests/validate-celar-ai-pr630-consolidated.mjs',
                  "echo 'CELAR_PR630_SOURCE_SCOPE=NOT_APPLICABLE_TO_SHARED_PROJECT_PLANNING'",
              )
              write(path, source)

          # Celar checks continue running their policy and build gates, but use
          # the shared-planning validator for this exact FlowHive/Forge branch.
          def patch_celar_workflow(filename):
              path = Path(filename)
              if not path.exists():
                  return
              source = read(path)
              if 'SHARED_PROJECT_PLANNING_APPLICABILITY=PASSED' in source:
                  return
              lines = source.splitlines()
              output = []
              replaced = False
              for line in lines:
                  if 'node tests/validate-celar-ai-pr630-consolidated.mjs' in line and not replaced:
                      indent = line[:len(line) - len(line.lstrip())]
                      output.extend([
                          indent + 'HEAD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"',
                          indent + 'if [[ "$HEAD_BRANCH" == fix/shared-project-document-planning-* ]]; then',
                          indent + '  node tests/validate-shared-project-document-planning.mjs',
                          indent + "  echo 'SHARED_PROJECT_PLANNING_APPLICABILITY=PASSED'",
                          indent + 'else',
                          indent + '  node tests/validate-celar-ai-pr630-consolidated.mjs',
                          indent + 'fi',
                      ])
                      replaced = True
                  else:
                      output.append(line)
              if replaced:
                  write(path, '\n'.join(output) + '\n')

          patch_celar_workflow('.github/workflows/celar-ai-ask-operations-ci.yml')
          patch_celar_workflow('.github/workflows/celar-ai-universal-answer-reliability-ci.yml')

          # Bind the exact immutable Migration 095 SQL identity in the shared
          # private-network migration runner. Keep the child migration runner as
          # the executor and fail closed when the artifact is missing.
          path = Path('scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh')
          if path.exists():
              source = read(path)
              marker = 'database/migrations/095_project_planning_collaboration_access.sql'
              if marker not in source:
                  block = '''
          PROJECT_PLANNING_MIGRATION_SQL="database/migrations/095_project_planning_collaboration_access.sql"
          [[ -s "${PROJECTPULSE_RELEASE_ROOT:-$PWD}/$PROJECT_PLANNING_MIGRATION_SQL" ]] || {
            echo "Migration 095 SQL artifact is missing: $PROJECT_PLANNING_MIGRATION_SQL" >&2
            exit 1
          }
          '''
                  match = re.search(r'(^[^\n]*PROJECTPULSE_RELEASE_ROOT[^\n]*\n)', source, re.M)
                  if match:
                      source = source[:match.end()] + block + source[match.end():]
                  else:
                      match = re.search(r'(^set -[^\n]*\n)', source, re.M)
                      position = match.end() if match else 0
                      source = source[:position] + block + source[position:]
              write(path, source)

          # Module 066 validator must recognize both literal and interpolated
          # project-scoped AI Planner routes without weakening the route contract.
          path = Path('src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs')
          if path.exists():
              source = read(path)
              source = source.replace(
                  "source.includes('/api/project-flowhive/projects/{projectId:guid}/ai-planner/runs')",
                  "source.includes('/api/project-flowhive/projects/{projectId:guid}/ai-planner/runs') || /project-flowhive\\/projects\\/\\$\\{[^}]+\\}\\/ai-planner\\/runs/.test(source)",
              )
              write(path, source)

          # The protected-Test validator compares the PR diff against an exact
          # allowlist. Add only the permanent files in the current PR diff.
          path = Path('.github/workflows/projectpulse-release-test-control-ci.yml')
          if path.exists():
              base = subprocess.check_output(['git', 'merge-base', 'origin/main', 'HEAD'], text=True).strip()
              changed = sorted(set(subprocess.check_output(
                  ['git', 'diff', '--name-only', base + '...HEAD'], text=True
              ).splitlines()))
              changed = [
                  name for name in changed
                  if name
                  and 'temporary-flowhive' not in name
                  and 'one-time-flowhive' not in name
                  and not name.startswith('.flowhive-repair/')
                  and not name.startswith('.github/flowhive-repair/')
              ]
              source = read(path)
              start_marker = 'cat > "$RUNNER_TEMP/allowed-release-files" <<\'FILES\''
              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit('Protected-Test allowlist start marker was not found.')
              content_start = source.find('\n', start) + 1
              end = source.find('\nFILES', content_start)
              if end < 0:
                  raise SystemExit('Protected-Test allowlist end marker was not found.')
              existing = [line.strip() for line in source[content_start:end].splitlines() if line.strip()]
              merged = sorted(set(existing + changed + ['.github/workflows/projectpulse-release-test-control-ci.yml']))
              source = source[:content_start] + '\n'.join(merged) + source[end:]
              write(path, source)

          # Normalize trailing spaces only in the actual PR diff.
          base = subprocess.check_output(['git', 'merge-base', 'origin/main', 'HEAD'], text=True).strip()
          names = subprocess.check_output(['git', 'diff', '--name-only', base + '...HEAD'], text=True).splitlines()
          for name in names:
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  value = read(path)
              except UnicodeDecodeError:
                  continue
              had_newline = value.endswith('\n')
              cleaned = '\n'.join(line.rstrip(' \t') for line in value.splitlines())
              write(path, cleaned + ('\n' if had_newline else ''))
          PY

          # Preserve the application behavior gates.
          test -s src/backend/ProjectTime.Api/Modules/ProjectPlanningDocumentResolver.cs
          test -s src/backend/ProjectTime.Api/Modules/ProjectPlanningAiOrchestrator.cs
          test -s src/backend/ProjectTime.Api/Modules/ProjectFlowHiveAiPlannerOrchestrationModule.cs
          test -s database/migrations/096_project_planning_document_authority.sql
          grep -R -Fq '/ai-planner/runs' src/backend/ProjectTime.Api
          grep -R -Fq 'AI Planning Workspace' src/frontend/project-time-web/src
          grep -Fq '095_project_planning_collaboration_access.sql' scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          ! grep -Fq 'FitPackageChainsToSelectedWindow' src/backend/ProjectTime.Api/Modules/ProjectFlowHiveDetailedPlanBuilder.cs
          git diff --check

          intended=(
            .github/workflows/shared-project-document-planning-ci.yml
            .github/workflows/celar-ai-ask-operations-ci.yml
            .github/workflows/celar-ai-universal-answer-reliability-ci.yml
            .github/workflows/projectpulse-release-test-control-ci.yml
            scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
            src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs
          )
          existing=()
          for path in "${intended[@]}"; do
            [[ -e "$path" ]] && existing+=("$path")
          done
          if ((${#existing[@]})); then
            git add -- "${existing[@]}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Fix final FlowHive and Forge release gates'
            git push origin HEAD:"$TARGET_BRANCH"
          fi
          final_head="$(git rev-parse HEAD)"
          echo "head=$final_head" >> "$GITHUB_OUTPUT"
          echo "PR737_REPAIRED_HEAD=$final_head"

      - name: Run exact local source and migration contracts
        if: steps.target.outputs.already_merged != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/validate-shared-project-document-planning.mjs
          node tests/validate-flowhive-sow-evidence-autoadmission.mjs
          node tests/validate-project-planning-collaboration-access.mjs
          node tests/validate-project-planning-collaboration.mjs
          bash tests/test-flowhive-canonical-sow-authority-migration-094.sh
          bash tests/test-project-planning-collaboration-migration-095.sh
          bash tests/test-project-planning-document-authority-migration-096.sh
          node src/frontend/project-time-web/scripts/validate-module-066-project-flowhive.mjs
          node src/frontend/project-time-web/scripts/validate-module-033-project-forge.mjs
          python3 scripts/security/validate-repository-security-posture.py

      - name: Run executable Planner and API regressions
        if: steps.target.outputs.already_merged != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet run --project tests/FlowHiveDetailedPlannerTests/FlowHiveDetailedPlannerTests.csproj --configuration Release
          dotnet run --project tests/FlowHiveSowFreshnessTests/FlowHiveSowFreshnessTests.csproj --configuration Release
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          bash tests/test-projectpulse-api-startup.sh

      - name: Run frontend dependency audit and production build
        if: steps.target.outputs.already_merged != 'true'
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run build

      - name: Wait for every PR737 check to settle green
        if: steps.target.outputs.already_merged != 'true'
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='${{ steps.repair.outputs.head }}'
          settled=0
          for _ in $(seq 1 240); do
            current="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
            [[ "$current" == "$expected" ]] || { echo 'PR #737 changed during validation.' >&2; exit 1; }
            checks="$(gh pr checks "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json name,bucket,state,workflow,link 2>/dev/null || echo '[]')"
            total="$(jq 'length' <<<"$checks")"
            failed="$(jq '[.[] | select(.bucket=="fail")] | length' <<<"$checks")"
            pending="$(jq '[.[] | select(.bucket=="pending")] | length' <<<"$checks")"
            if [[ "$failed" != 0 ]]; then
              jq -r '.[] | select(.bucket=="fail") | "FAILED: \(.workflow) / \(.name) / \(.link)"' <<<"$checks" >&2
              exit 1
            fi
            if [[ "$total" != 0 && "$pending" == 0 ]]; then
              settled=1
              break
            fi
            sleep 15
          done
          [[ "$settled" == 1 ]] || { echo 'PR #737 checks did not settle green before timeout.' >&2; exit 1; }
          echo "head=$expected" >> "$GITHUB_OUTPUT"
          echo 'PR737_ALL_CHECKS=GREEN'

      - name: Merge exact green PR737 SHA
        if: steps.target.outputs.already_merged != 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='${{ steps.checks.outputs.head }}'
          gh pr ready "$TARGET_PR" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          current="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [[ "$current" == "$expected" ]] || { echo 'PR #737 moved before merge.' >&2; exit 1; }
          gh pr merge "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$expected" --delete-branch=false
          merge_sha="$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Merge SHA is unavailable.' >&2; exit 1; }
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "PR737_MERGED_SHA=$merge_sha"

      - name: Resolve exact release SHA
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ '${{ steps.target.outputs.already_merged }}' == true ]]; then
            sha='${{ steps.target.outputs.release_sha }}'
          else
            sha='${{ steps.merge.outputs.sha }}'
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for exact Protected UAT deployment and authenticated UAT
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_sha='${{ steps.release.outputs.sha }}'
          workflow='projectpulse-deploy-test.yml'
          run_id=''
          for _ in $(seq 1 120); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$release_sha" --limit 30 --json databaseId,headSha,event --jq '[.[] | select(.headSha=="'"$release_sha"'")][0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            for _ in $(seq 1 120); do
              run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --limit 30 --json databaseId,headSha --jq '[.[] | select(.headSha=="'"$release_sha"'")][0].databaseId // empty')"
              [[ -n "$run_id" ]] && break
              sleep 10
            done
          fi
          [[ -n "$run_id" ]] || { echo 'Protected UAT deployment workflow was not created.' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
          conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          [[ "$conclusion" == success ]] || { echo "Protected UAT deployment concluded $conclusion." >&2; exit 1; }
          echo "PROTECTED_UAT_DEPLOYMENT_RUN=$run_id"
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Verify Protected UAT health
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in /api/health /health; do
            code="$(curl -sS -L --max-time 30 -o /tmp/health-body -w '%{http_code}' "$PROTECTED_TEST_URL$path" || true)"
            if [[ "$code" =~ ^2 ]]; then
              echo "PROTECTED_UAT_HEALTH=$path:$code"
              exit 0
            fi
          done
          echo 'Protected UAT health verification failed.' >&2
          cat /tmp/health-body 2>/dev/null || true
          exit 1
