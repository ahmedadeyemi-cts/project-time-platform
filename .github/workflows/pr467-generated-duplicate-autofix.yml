name: PR467 Generated Duplicate Auto-Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr467-generated-duplicate-autofix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr467-generated-duplicate-autofix
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/uat-modules-005-006-039-work-identifiers-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Restore and reproduce generated-source failure
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet restore src/backend/ProjectTime.Api/ProjectTime.Api.csproj
          set +e
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --no-restore > /tmp/pr467-before.log 2>&1
          before_status=$?
          set -e
          cat /tmp/pr467-before.log
          echo "PR467_INITIAL_BUILD_EXIT_CODE=$before_status"
          git status --short
          grep -R -n --include='*.cs' --include='*.csproj' --include='*.props' --include='*.targets' 'Pr467UatRepairMutationRequest' src . 2>/dev/null || true

      - name: Repair duplicate generated request declaration at its tracked source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          ROOT = Path('.')
          TOKEN = 'Pr467UatRepairMutationRequest'

          def tracked_files() -> list[Path]:
              raw = subprocess.check_output(['git', 'ls-files', '-z'])
              paths = []
              for item in raw.split(b'\0'):
                  if not item:
                      continue
                  path = Path(item.decode())
                  if path.suffix.lower() in {'.cs', '.csproj', '.props', '.targets'}:
                      paths.append(path)
              return paths

          def split_params(value: str) -> list[str]:
              result, current = [], []
              depth = 0
              pairs = {'(': ')', '[': ']', '<': '>'}
              closers = set(pairs.values())
              for ch in value:
                  if ch in pairs:
                      depth += 1
                  elif ch in closers and depth:
                      depth -= 1
                  if ch == ',' and depth == 0:
                      result.append(''.join(current).strip())
                      current = []
                  else:
                      current.append(ch)
              tail = ''.join(current).strip()
              if tail:
                  result.append(tail)
              return result

          def property_from_param(param: str) -> tuple[str, str] | None:
              cleaned = re.sub(r'^\s*(?:\[[^\]]+\]\s*)+', '', param).strip()
              cleaned = re.sub(r'\s*=.*$', '', cleaned).strip()
              cleaned = re.sub(r'^(?:in|out|ref|params)\s+', '', cleaned).strip()
              match = re.match(r'(?P<type>.+?)\s+(?P<name>@?[A-Za-z_][A-Za-z0-9_]*)$', cleaned)
              if not match:
                  return None
              return match.group('type').strip(), match.group('name').lstrip('@')

          def matching_brace(text: str, start: int) -> int:
              depth = 0
              in_string = False
              quote = ''
              escape = False
              i = start
              while i < len(text):
                  ch = text[i]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          in_string = False
                  else:
                      if ch in {'"', "'"}:
                          in_string = True
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return i
                  i += 1
              raise RuntimeError('Unbalanced C# braces while repairing PR467 request type.')

          def remove_duplicate_type_blocks(text: str) -> tuple[str, bool]:
              pattern = re.compile(
                  r'(?m)^(?P<indent>\s*)(?P<decl>(?:(?:public|internal|private|protected|sealed|abstract|partial|static)\s+)*(?:record(?:\s+(?:class|struct))?|class|struct)\s+'
                  + re.escape(TOKEN)
                  + r'\b)'
              )
              matches = list(pattern.finditer(text))
              if len(matches) <= 1:
                  return text, False
              removals = []
              for match in matches[1:]:
                  brace = text.find('{', match.end())
                  semicolon = text.find(';', match.end())
                  if semicolon != -1 and (brace == -1 or semicolon < brace):
                      end = semicolon + 1
                  elif brace != -1:
                      end = matching_brace(text, brace) + 1
                      while end < len(text) and text[end] in ' \t\r\n':
                          end += 1
                  else:
                      raise RuntimeError('Could not determine duplicate request type boundary.')
                  removals.append((match.start(), end))
              for start, end in reversed(removals):
                  text = text[:start] + text[end:]
              return text, True

          def remove_primary_constructor_collision(text: str) -> tuple[str, bool]:
              declaration = re.compile(
                  r'(?P<prefix>(?:(?:public|internal|private|protected|sealed|abstract|partial)\s+)*record(?:\s+class)?\s+'
                  + re.escape(TOKEN)
                  + r')\s*\((?P<params>.*?)\)\s*(?P<open>\{)',
                  re.S,
              )
              match = declaration.search(text)
              if not match:
                  return text, False
              params = split_params(match.group('params'))
              parsed = [property_from_param(param) for param in params]
              if not parsed or any(item is None for item in parsed):
                  return text, False
              parsed_pairs = [item for item in parsed if item is not None]

              body_start = match.end('open')
              body_end = matching_brace(text, match.start('open'))
              body = text[body_start:body_end]
              ctor_pattern = re.compile(r'\b' + re.escape(TOKEN) + r'\s*\((?P<params>.*?)\)', re.S)
              ctor_matches = list(ctor_pattern.finditer(body))
              if not ctor_matches:
                  return text, False

              indent_match = re.search(r'(?m)^(\s*)' + re.escape(match.group('prefix')), text[match.start():match.end()])
              base_indent = indent_match.group(1) if indent_match else ''
              member_indent = base_indent + '    '
              existing_names = set(re.findall(r'\b(?:get|init|set)\s*;', body))
              del existing_names
              properties = []
              for type_name, name in parsed_pairs:
                  if re.search(r'\b' + re.escape(name) + r'\s*\{', body):
                      continue
                  properties.append(f'\n{member_indent}public {type_name} {name} {{ get; init; }}')
              properties_text = ''.join(properties)
              replacement = match.group('prefix') + '\n' + base_indent + '{' + properties_text
              new_text = text[:match.start()] + replacement + text[match.end():]
              return new_text, True

          repaired = []
          inspected = []

          for path in tracked_files():
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              if TOKEN not in text:
                  continue
              inspected.append(str(path))
              updated, changed_duplicate = remove_duplicate_type_blocks(text)
              updated, changed_ctor = remove_primary_constructor_collision(updated)
              if updated != text:
                  path.write_text(updated)
                  repaired.append(str(path))

          # A failed build can cause repository targets to materialize generated code
          # into a tracked .cs file. Scan those files again after the first pass.
          for path in tracked_files():
              if str(path) in repaired:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              if TOKEN not in text:
                  continue
              updated, changed_duplicate = remove_duplicate_type_blocks(text)
              updated, changed_ctor = remove_primary_constructor_collision(updated)
              if updated != text:
                  path.write_text(updated)
                  repaired.append(str(path))

          print('PR467_TRACKED_TOKEN_FILES=' + ','.join(inspected))
          print('PR467_REPAIRED_FILES=' + ','.join(repaired))
          if not repaired:
              # Give the next step a full generated-source map rather than making
              # an ungrounded edit.
              generated = []
              for path in ROOT.rglob('*.cs'):
                  if any(part in {'.git', 'bin'} for part in path.parts):
                      continue
                  try:
                      text = path.read_text(errors='ignore')
                  except OSError:
                      continue
                  if TOKEN in text:
                      generated.append(str(path))
              print('PR467_GENERATED_TOKEN_FILES=' + ','.join(generated))
              raise SystemExit('No safely repairable tracked duplicate declaration was found.')
          PY
          git diff --check
          git diff -- src/backend/ProjectTime.Api src/backend/ProjectTime.Api/ProjectTime.Api.csproj

      - name: Prove API compilation and generator convergence
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --no-restore
          git diff --check
          first_diff="$(git diff --binary | sha256sum | awk '{print $1}')"
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release --no-restore
          second_diff="$(git diff --binary | sha256sum | awk '{print $1}')"
          [[ "$first_diff" == "$second_diff" ]]
          echo 'PR467_API_GENERATOR_CONVERGENCE=PASS'

      - name: Run focused frontend and source validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/validate-pr467-uat-repairs.py
          cd src/frontend/project-time-web
          node --check scripts/inject-module-006-toyota-hyundai-pipeline.mjs
          node --check scripts/inject-group-5-financial-operations-recovery.mjs
          node --check scripts/validate-module-005-project-expense-upload.mjs
          node --check scripts/validate-module-006-toyota-hyundai-pipelines.mjs
          node --check scripts/validate-group-5-financial-operations-recovery.mjs
          node --check scripts/validate-work-register-055c-055d.mjs
          node scripts/validate-module-005-project-expense-upload.mjs
          node scripts/validate-module-006-toyota-hyundai-pipelines.mjs
          node scripts/validate-group-5-financial-operations-recovery.mjs
          node scripts/validate-work-register-055c-055d.mjs
          npm run prebuild
          git -C ../../.. diff --check
          npm run prebuild
          git -C ../../.. diff --check

      - name: Remove temporary diagnostics and publish corrected source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/pr467-generated-duplicate-autofix.yml \
            .github/workflows/pr467-compile-diagnostic.yml \
            .github/workflows/pr467-csproj-line-fix.yml \
            .github/workflows/pr467-implementation-publisher.yml
          git diff --check
          git config user.name 'ProjectPulse PR467 Repair'
          git config user.email 'projectpulse-pr467-repair@users.noreply.github.com'
          git add -A
          git commit -m 'Fix PR467 generated request compilation and remove temporary controls'
          git push origin HEAD:fix/uat-modules-005-006-039-work-identifiers-20260803
          echo "PR467_REPAIRED_HEAD=$(git rev-parse HEAD)"
