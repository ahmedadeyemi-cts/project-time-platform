name: Fix Current-Main Test Release Shellcheck

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/fix-current-main-release-shellcheck.yml'
      - '.github/workflows/projectpulse-promote-enterprise-governance-test-v2.yml'

permissions:
  contents: write

concurrency:
  group: fix-current-main-release-shellcheck
  cancel-in-progress: true

jobs:
  patch:
    name: Replace the ambiguous database-port guard and self-remove
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/promote-enterprise-governance-images-v2-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact release branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: release/promote-enterprise-governance-images-v2-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded correction and remove temporary finalizer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/projectpulse-promote-enterprise-governance-test-v2.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          [[ "$DATABASE_PORT" =~ ^[0-9]{1,5}$ ]] && (( DATABASE_PORT >= 1 && DATABASE_PORT <= 65535 )) || fail 'Database port is invalid.'
          '''
          new = '''          if ! [[ "$DATABASE_PORT" =~ ^[0-9]{1,5}$ ]] || (( DATABASE_PORT < 1 || DATABASE_PORT > 65535 )); then
            fail 'Database port is invalid.'
          fi
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one database-port guard, found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/fix-current-main-release-shellcheck.yml
          grep -Fq 'DATABASE_PORT < 1 || DATABASE_PORT > 65535' \
            .github/workflows/projectpulse-promote-enterprise-governance-test-v2.yml
          git diff --check

      - name: Commit corrected permanent controller
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'Pulse Enterprise Automation'
          git config user.email 'pulse-enterprise-automation@users.noreply.github.com'
          git commit -m 'ci: make current-main Test database guard explicit'
          git push origin HEAD:release/promote-enterprise-governance-images-v2-20260810
