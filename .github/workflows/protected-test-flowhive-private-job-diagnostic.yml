name: Capture Protected Test FlowHive Private Job Diagnostic

on:
  push:
    branches:
      - fix/shared-project-document-planning-20260819
    paths:
      - '.github/workflows/protected-test-flowhive-private-job-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-test-flowhive-private-job-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    name: Read bounded private document job evidence
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: ${{ vars.PUBLIC_URL }}
      TEST_LOGIN_PASSWORD: ${{ secrets.PROJECTPULSE_M087_PASSWORD }}
      PROJECT_ID: 0ea25cb8-1a7f-4baf-ba7b-2dd76215be49
    steps:
      - name: Query safe Protected Test private-job metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          BASE="${BASE%/}"
          [[ "$BASE" == 'https://phd-west-test.onenecklab.com' ]] \
            || fail 'Configured origin is not Protected Test.'
          [[ ${#TEST_LOGIN_PASSWORD} -ge 12 ]] \
            || fail 'Protected Test login credential is unavailable.'

          login_response="$(mktemp)"
          payload="$(mktemp)"
          trap 'rm -f "$login_response" "$payload"' EXIT
          chmod 0600 "$login_response" "$payload"
          jq -n \
            --arg username 'project.team.coordinator@ussignal.local' \
            --arg password "$TEST_LOGIN_PASSWORD" \
            '{username:$username,password:$password}' > "$payload"

          login_status="$(curl -sS --http1.1 --connect-timeout 20 --max-time 90 \
            -o "$login_response" -w '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            -H 'Content-Type: application/json' \
            -H "Origin: $BASE" \
            -H 'Sec-Fetch-Site: same-origin' \
            --data-binary @"$payload" \
            "$BASE/api/auth/local/login" || true)"
          [[ "$login_status" == 200 ]] || fail "Protected Test login returned HTTP $login_status."

          session="$(jq -r '.sessionToken // empty' "$login_response")"
          [[ -n "$session" ]] || fail 'Protected Test login did not return a session token.'
          echo "::add-mask::$session"

          jobs_response="$(mktemp)"
          jobs_status="$(curl -sS --http1.1 --connect-timeout 20 --max-time 90 \
            -o "$jobs_response" -w '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            -H "Authorization: Bearer $session" \
            -H "X-ProjectPulse-Session: $session" \
            -H 'X-ProjectPulse-Module-Number: 011' \
            -H "Origin: $BASE" \
            -H 'Sec-Fetch-Site: same-origin' \
            "$BASE/api/celar-ai/v1/documents/runtime/jobs?limit=500" || true)"
          [[ "$jobs_status" == 200 ]] || {
            rm -f "$jobs_response"
            fail "Private runtime jobs endpoint returned HTTP $jobs_status."
          }

          jq -e . "$jobs_response" >/dev/null \
            || fail 'Private runtime jobs endpoint did not return JSON.'

          echo 'FLOWHIVE_PRIVATE_JOB_DIAGNOSTIC_BEGIN'
          jq -c --arg projectId "$PROJECT_ID" '
            [
              .jobs[]?
              | select((.projectId | tostring) == $projectId)
              | select(
                  ((.documentCategory // "") | ascii_downcase) == "sow"
                  or ((.originalFileName // "") | ascii_downcase | contains("sow"))
                )
              | {
                  jobId,
                  documentId,
                  projectId,
                  originalFileName,
                  documentCategory,
                  requestedPurpose,
                  status,
                  attemptCount,
                  maximumAttempts,
                  extractionMethod,
                  malwareScanner,
                  ocrProvider,
                  embeddingModel,
                  embeddingDimension,
                  indexProvider,
                  diagnosticCode,
                  diagnosticMessage,
                  requestedAt,
                  startedAt,
                  completedAt,
                  updatedAt
                }
            ]
            | sort_by(.requestedAt)
          ' "$jobs_response"
          echo 'FLOWHIVE_PRIVATE_JOB_DIAGNOSTIC_END'

          matched="$(jq --arg projectId "$PROJECT_ID" '[.jobs[]? | select((.projectId | tostring) == $projectId) | select(((.documentCategory // "") | ascii_downcase) == "sow" or ((.originalFileName // "") | ascii_downcase | contains("sow")))] | length' "$jobs_response")"
          rm -f "$jobs_response"
          (( matched > 0 )) || fail 'No protected-Test FlowHive SOW processing jobs were visible to the governed diagnostic identity.'

          echo 'PRODUCTION_MUTATION=NONE'
          echo 'DOCUMENT_CONTENT_RETURNED=false'
          echo 'STORAGE_PATH_RETURNED=false'
          echo 'EMBEDDING_VECTOR_RETURNED=false'
