name: Capture Protected Test FlowHive Private Job Diagnostic

on:
  push:
    branches:
      - fix/shared-project-document-planning-20260819
    paths:
      - '.github/workflows/protected-test-flowhive-private-job-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-test-flowhive-private-job-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    name: Read bounded private document job evidence
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: ${{ vars.PUBLIC_URL }}
      TEST_LOGIN_PASSWORD: ${{ secrets.PROJECTPULSE_M087_PASSWORD }}
      ORACLE_RUNTIME_TOKEN: ${{ secrets.PROJECTPULSE_TEST_CELAR_AI_ORACLE_RUNTIME_TOKEN }}
      ORACLE_RUNTIME_HOST: celarai.onenecklab.com
      ORACLE_RUNTIME_IP: 129.213.82.144
      ORACLE_MALWARE_SCAN_ENDPOINT: https://celarai.onenecklab.com/v1/scan
      PROJECT_ID: 0ea25cb8-1a7f-4baf-ba7b-2dd76215be49
    steps:
      - name: Query safe Protected Test private-job metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          BASE="${BASE%/}"
          [[ "$BASE" == 'https://phd-west-test.onenecklab.com' ]] \
            || fail 'Configured origin is not Protected Test.'
          [[ ${#TEST_LOGIN_PASSWORD} -ge 12 ]] \
            || fail 'Protected Test login credential is unavailable.'

          login_response="$(mktemp)"
          payload="$(mktemp)"
          trap 'rm -f "$login_response" "$payload"' EXIT
          chmod 0600 "$login_response" "$payload"
          jq -n \
            --arg username 'project.team.coordinator@ussignal.local' \
            --arg password "$TEST_LOGIN_PASSWORD" \
            '{username:$username,password:$password}' > "$payload"

          login_status="$(curl -sS --http1.1 --connect-timeout 20 --max-time 90 \
            -o "$login_response" -w '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            -H 'Content-Type: application/json' \
            -H "Origin: $BASE" \
            -H 'Sec-Fetch-Site: same-origin' \
            --data-binary @"$payload" \
            "$BASE/api/auth/local/login" || true)"
          [[ "$login_status" == 200 ]] || fail "Protected Test login returned HTTP $login_status."

          session="$(jq -r '.sessionToken // empty' "$login_response")"
          [[ -n "$session" ]] || fail 'Protected Test login did not return a session token.'
          echo "::add-mask::$session"

          jobs_response="$(mktemp)"
          jobs_status="$(curl -sS --http1.1 --connect-timeout 20 --max-time 90 \
            -o "$jobs_response" -w '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            -H "Authorization: Bearer $session" \
            -H "X-ProjectPulse-Session: $session" \
            -H 'X-ProjectPulse-Module-Number: 011' \
            -H "Origin: $BASE" \
            -H 'Sec-Fetch-Site: same-origin' \
            "$BASE/api/celar-ai/v1/documents/runtime/jobs?limit=500" || true)"
          [[ "$jobs_status" == 200 ]] || {
            rm -f "$jobs_response"
            fail "Private runtime jobs endpoint returned HTTP $jobs_status."
          }

          jq -e . "$jobs_response" >/dev/null \
            || fail 'Private runtime jobs endpoint did not return JSON.'

          echo 'FLOWHIVE_PRIVATE_JOB_DIAGNOSTIC_BEGIN'
          jq -c --arg projectId "$PROJECT_ID" '
            [
              .jobs[]?
              | select((.projectId | tostring) == $projectId)
              | select(
                  ((.documentCategory // "") | ascii_downcase) == "sow"
                  or ((.originalFileName // "") | ascii_downcase | contains("sow"))
                )
              | {
                  jobId,
                  documentId,
                  projectId,
                  originalFileName,
                  documentCategory,
                  requestedPurpose,
                  status,
                  attemptCount,
                  maximumAttempts,
                  extractionMethod,
                  malwareScanner,
                  ocrProvider,
                  embeddingModel,
                  embeddingDimension,
                  indexProvider,
                  diagnosticCode,
                  diagnosticMessage,
                  requestedAt,
                  startedAt,
                  completedAt,
                  updatedAt
                }
            ]
            | sort_by(.requestedAt)
          ' "$jobs_response"
          echo 'FLOWHIVE_PRIVATE_JOB_DIAGNOSTIC_END'

          matched="$(jq --arg projectId "$PROJECT_ID" '[.jobs[]? | select((.projectId | tostring) == $projectId) | select(((.documentCategory // "") | ascii_downcase) == "sow" or ((.originalFileName // "") | ascii_downcase | contains("sow")))] | length' "$jobs_response")"
          rm -f "$jobs_response"
          (( matched > 0 )) || fail 'No protected-Test FlowHive SOW processing jobs were visible to the governed diagnostic identity.'

          echo 'PRODUCTION_MUTATION=NONE'
          echo 'DOCUMENT_CONTENT_RETURNED=false'
          echo 'STORAGE_PATH_RETURNED=false'
          echo 'EMBEDDING_VECTOR_RETURNED=false'

      - name: Probe bounded Oracle malware gateway contract with harmless fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          [[ ${#ORACLE_RUNTIME_TOKEN} -ge 32 ]] \
            || fail 'Protected Test Oracle runtime token is unavailable.'
          mapfile -t resolved < <(getent ahostsv4 "$ORACLE_RUNTIME_HOST" | awk '{print $1}' | sort -u)
          (( ${#resolved[@]} == 1 )) \
            || fail 'Oracle runtime DNS must resolve to exactly one IPv4 address.'
          [[ "${resolved[0]}" == "$ORACLE_RUNTIME_IP" ]] \
            || fail 'Oracle runtime DNS does not match the approved Protected Test IPv4 pin.'

          fixture="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$fixture" "$response"' EXIT
          chmod 0600 "$fixture" "$response"
          printf 'FlowHive Protected Test harmless malware gateway contract probe.\n' > "$fixture"
          expected_size="$(wc -c < "$fixture" | tr -d '[:space:]')"

          http_status="$(curl -sS --http1.1 --connect-timeout 20 --max-time 180 \
            --resolve "$ORACLE_RUNTIME_HOST:443:$ORACLE_RUNTIME_IP" \
            -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer $ORACLE_RUNTIME_TOKEN" \
            -H 'X-Pulse-AI-Privacy-Boundary: private_pulse_runtime_only' \
            -H 'X-Pulse-AI-Feature: private_document_malware_scan' \
            -H 'X-Pulse-AI-External-Escalation: false' \
            -F "file=@$fixture;filename=flowhive-protected-test-probe.txt;type=application/octet-stream" \
            "$ORACLE_MALWARE_SCAN_ENDPOINT" || true)"

          json_valid=false
          if jq -e . "$response" >/dev/null 2>&1; then
            json_valid=true
          fi

          echo 'ORACLE_MALWARE_GATEWAY_DIAGNOSTIC_BEGIN'
          if [[ "$json_valid" == true ]]; then
            jq -c --arg httpStatus "$http_status" --argjson expectedSize "$expected_size" '
              {
                httpStatus:$httpStatus,
                jsonValid:true,
                status:(.status // null),
                clean:(if (.clean | type) == "boolean" then .clean else null end),
                scanner:(.scanner // null),
                sizeBytesPresent:has("sizeBytes"),
                sizeBytes:(if (.sizeBytes | type) == "number" then .sizeBytes else null end),
                expectedSize:$expectedSize,
                sizeMatches:((.sizeBytes | type) == "number" and .sizeBytes == $expectedSize),
                signaturePresent:((.signature // "") | tostring | length > 0),
                rawResponseReturned:false,
                documentContentReturned:false
              }
            ' "$response"
          else
            jq -nc --arg httpStatus "$http_status" --argjson expectedSize "$expected_size" '{
              httpStatus:$httpStatus,
              jsonValid:false,
              status:null,
              clean:null,
              scanner:null,
              sizeBytesPresent:false,
              sizeBytes:null,
              expectedSize:$expectedSize,
              sizeMatches:false,
              signaturePresent:false,
              rawResponseReturned:false,
              documentContentReturned:false
            }'
          fi
          echo 'ORACLE_MALWARE_GATEWAY_DIAGNOSTIC_END'

          unset ORACLE_RUNTIME_TOKEN
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'ORACLE_INFRASTRUCTURE_MUTATION=NONE'
          echo 'SOW_DOCUMENT_SENT_TO_ORACLE=false'
