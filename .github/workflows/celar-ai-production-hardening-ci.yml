name: Validate Celar AI Production Hardening

on:
  push:
    branches:
      - 'security/celar-ai-production-readiness-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: celar-ai-production-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      applicable: ${{ steps.scope.outputs.applicable }}
    steps:
      - name: Check out exact source for classification
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify and verify exact production-hardening source scope
        id: scope
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          HEAD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          case "$HEAD_BRANCH" in
            security/celar-ai-production-readiness-access-continuity-*)
              SCOPE_LABEL='all-user Ask Celar AI and administrator access continuity'
              SCOPE_MARKER='EXACT_11_ACCESS_CONTINUITY_FILES'
              SOURCE_MANIFEST="$(cat <<'EOF'
          .github/workflows/celar-ai-production-hardening-ci.yml
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagContracts.cs
          src/backend/ProjectTime.Api/Ai/PulseAiSystemIntelligenceContracts.cs
          src/backend/ProjectTime.Api/Modules/AiProviderConfigurationModule.cs
          src/backend/ProjectTime.Api/Modules/CelarAiBrandModule.cs
          src/backend/ProjectTime.Api/Modules/CelarAiCapabilityRoutingModule.cs
          src/backend/ProjectTime.Api/Modules/CelarAiConversationAttachmentModule.cs
          src/backend/ProjectTime.Api/Modules/CelarAiProductionPlatformModule.cs
          src/frontend/project-time-web/scripts/validate-celar-ai-production-readiness.mjs
          src/frontend/project-time-web/scripts/validate-celar-ai-unified-chat-attachments.mjs
          src/frontend/project-time-web/scripts/validate-module-064-shared-ai.mjs
          EOF
          )"
              ;;
            security/celar-ai-production-readiness-knowledge-fabric-*)
              SCOPE_LABEL='knowledge fabric and comprehensive project planning'
              SCOPE_MARKER='EXACT_24_KNOWLEDGE_FABRIC_FILES'
              SOURCE_MANIFEST="$(cat <<'EOF'
          .github/workflows/celar-ai-production-hardening-ci.yml
          .github/workflows/pulse-ai-help-chat-usability-ci.yml
          src/backend/ProjectTime.Api/Ai/CelarAiEnterprisePlatformContracts.cs
          src/backend/ProjectTime.Api/Ai/CelarAiEnterprisePlatformService.cs
          src/backend/ProjectTime.Api/Ai/CelarAiKnowledgeFabricService.cs
          src/backend/ProjectTime.Api/Ai/ProjectPulseAiServiceCollectionExtensions.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateDocumentRuntimeRepository.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateDocumentRuntimeService.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateModelClient.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagContracts.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagService.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRuntimeContracts.cs
          src/backend/ProjectTime.Api/Ai/PulseAiProductKnowledgeCatalog.cs
          src/backend/ProjectTime.Api/Ai/PulseAiSystemKnowledgeCatalog.cs
          src/backend/ProjectTime.Api/Modules/CelarAiCapabilityRoutingModule.cs
          src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs
          src/frontend/project-time-web/scripts/validate-celar-ai-enterprise-platform.mjs
          src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs
          src/frontend/project-time-web/scripts/validate-celar-ai-production-readiness.mjs
          src/frontend/project-time-web/scripts/validate-module-033-project-forge.mjs
          src/frontend/project-time-web/src/CelarAiCapabilityRoutingPanel.jsx
          src/frontend/project-time-web/src/ProjectForgeCenter.jsx
          src/frontend/project-time-web/src/celar-ai-capability-routing-panel.css
          src/frontend/project-time-web/src/project-forge-center.css
          EOF
          )"
              ;;
            security/celar-ai-production-readiness-universal-routing-*)
              SCOPE_LABEL='universal answer-first routing'
              SCOPE_MARKER='EXACT_16_UNIVERSAL_ROUTING_FILES'
              SOURCE_MANIFEST="$(cat <<'EOF'
          .github/workflows/celar-ai-production-hardening-ci.yml
          src/backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs
          src/backend/ProjectTime.Api/Ai/PulseAiEscalationSanitizer.cs
          src/backend/ProjectTime.Api/Ai/PulseAiSystemIntelligenceContracts.cs
          src/backend/ProjectTime.Api/Ai/PulseAiSystemIntelligenceService.cs
          src/backend/ProjectTime.Api/Ai/PulseAiSystemKnowledgeCatalog.cs
          src/backend/ProjectTime.Api/Modules/CelarAiCapabilityRoutingModule.cs
          src/backend/ProjectTime.Api/Modules/CelarAiProductionPlatformModule.cs
          src/backend/ProjectTime.Api/ProjectPulseAiTimeEntrySuggestionService.cs
          src/frontend/project-time-web/scripts/inject-celar-ai-contextual-chat-workspace.mjs
          src/frontend/project-time-web/scripts/inject-celar-ai-production-platform.mjs
          src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs
          src/frontend/project-time-web/scripts/validate-celar-ai-unified-chat-attachments.mjs
          src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs
          src/frontend/project-time-web/src/HelpAssistant.jsx
          src/frontend/project-time-web/src/pulse-ai-system-chat.css
          EOF
          )"
              ;;
            security/celar-ai-production-readiness-routing-store-resilience-*)
              SCOPE_LABEL='routing-store startup resilience'
              SCOPE_MARKER='EXACT_3_ROUTING_STORE_RESILIENCE_FILES'
              SOURCE_MANIFEST="$(cat <<'EOF'
          .github/workflows/celar-ai-production-hardening-ci.yml
          src/backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs
          tests/CelarAiProductionHardeningTests/ReleaseRuntimeBehavior.cs
          EOF
          )"
              ;;
            security/celar-ai-production-readiness-startup-resilience-*)
              SCOPE_LABEL='production startup resilience'
              SCOPE_MARKER='EXACT_3_STARTUP_RESILIENCE_FILES'
              SOURCE_MANIFEST="$(cat <<'EOF'
          .github/workflows/celar-ai-production-hardening-ci.yml
          src/backend/ProjectTime.Api/Ai/ProjectPulseAiHealthMonitor.cs
          src/backend/ProjectTime.Api/Ai/ProjectPulseAiSecretStore.cs
          EOF
          )"
              ;;
            security/celar-ai-production-readiness-*)
              SCOPE_LABEL='security production-hardening'
              SCOPE_MARKER='EXACT_45_SOURCE_FILES'
              SOURCE_MANIFEST="$(cat <<'EOF'
          .github/workflows/celar-ai-production-hardening-ci.yml
          .github/workflows/celar-ai-production-platform-ci.yml
          .github/workflows/pulse-ai-help-chat-usability-ci.yml
          docs/modules/module-064-ai-provider-configuration/CELAR-AI-PRODUCTION-HARDENING.md
          src/backend/ProjectTime.Api/Program.cs
          src/backend/ProjectTime.Api/Program.ScopedRbac.g.cs
          src/backend/ProjectTime.Api/ProjectTime.Api.csproj
          src/backend/ProjectTime.Api/PulseAiDocumentGroundingService.g.cs
          src/backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs
          src/backend/ProjectTime.Api/Ai/ProjectPulseAiCandidateRequestFence.cs
          src/backend/ProjectTime.Api/Ai/ProjectPulseAiDatabaseConnection.cs
          src/backend/ProjectTime.Api/Ai/ProjectPulseAiEncryptionRotationService.cs
          src/backend/ProjectTime.Api/Ai/ProjectPulseAiHealthMonitor.cs
          src/backend/ProjectTime.Api/Ai/ProjectPulseAiReleaseRuntimePolicy.cs
          src/backend/ProjectTime.Api/Ai/ProjectPulseAiSecretStore.cs
          src/backend/ProjectTime.Api/Ai/ProjectPulseAiServiceCollectionExtensions.cs
          src/backend/ProjectTime.Api/Ai/ProjectPulseAiTimesheetContextResolver.cs
          src/backend/ProjectTime.Api/Ai/ProjectPulseUploadStorage.cs
          src/backend/ProjectTime.Api/Ai/PulseAiDocumentGroundingService.cs
          src/backend/ProjectTime.Api/Ai/PulseAiImmutableDocumentSnapshot.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateMalwareScanner.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateDocumentPipelineService.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateDocumentRuntimeRepository.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateDocumentRuntimeService.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateDocumentRuntimeWorker.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagRepository.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRetrievalAuthorizationService.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRuntimeContracts.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRuntimeSourceResolver.cs
          src/backend/ProjectTime.Api/Ai/PulseAiSystemIntelligenceRepository.cs
          src/backend/ProjectTime.Api/Modules/AiProviderConfigurationModule.cs
          src/backend/ProjectTime.Api/Modules/CelarAiCapabilityRoutingModule.cs
          src/backend/ProjectTime.Api/Modules/CelarAiProductionPlatformModule.cs
          src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs
          src/backend/ProjectTime.Api/Modules/PulseAiPrivateRagModule.cs
          src/backend/ProjectTime.Api/Modules/PulseAiPrivateRuntimeModule.cs
          src/backend/ProjectTime.Api/Modules/PulseAiSystemIntelligenceModule.cs
          src/frontend/project-time-web/scripts/validate-celar-ai-production-readiness.mjs
          src/frontend/project-time-web/scripts/validate-celar-ai-release-scoped-runtime.mjs
          src/frontend/project-time-web/scripts/validate-module-011-pulse-ai-deep-intelligence.mjs
          src/frontend/project-time-web/src/CelarAiCapabilityRoutingPanel.jsx
          src/frontend/project-time-web/package.json
          tests/CelarAiProductionHardeningTests/CelarAiProductionHardeningTests.csproj
          tests/CelarAiProductionHardeningTests/Program.cs
          tests/CelarAiProductionHardeningTests/ReleaseRuntimeBehavior.cs
          EOF
          )"
              ;;
            feature/celar-ai-unified-chat-routing-attachments-*)
              SCOPE_LABEL='unified-chat regression'
              SCOPE_MARKER='EXACT_51_UNIFIED_CHAT_SOURCE_FILES'
              SOURCE_MANIFEST="$(cat <<'EOF'
          .github/workflows/celar-ai-enterprise-platform-ci.yml
          .github/workflows/celar-ai-production-hardening-ci.yml
          .github/workflows/celar-ai-production-platform-ci.yml
          .github/workflows/pulse-ai-help-chat-usability-ci.yml
          database/migrations/072_celar_ai_conversation_attachments.sql
          database/rollback/072_celar_ai_conversation_attachments_rollback.sql
          src/backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs
          src/backend/ProjectTime.Api/Ai/CelarAiConversationAttachmentContracts.cs
          src/backend/ProjectTime.Api/Ai/CelarAiConversationAttachmentRepository.cs
          src/backend/ProjectTime.Api/Ai/CelarAiConversationAttachmentRetentionWorker.cs
          src/backend/ProjectTime.Api/Ai/CelarAiConversationAttachmentService.cs
          src/backend/ProjectTime.Api/Ai/ProjectPulseAiServiceCollectionExtensions.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateDocumentRuntimeRepository.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateDocumentRuntimeService.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagContracts.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagRepository.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRagService.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRetrievalAuthorizationService.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRetrievalService.cs
          src/backend/ProjectTime.Api/Ai/PulseAiPrivateRuntimeSourceResolver.cs
          src/backend/ProjectTime.Api/Ai/PulseAiSystemIntelligenceContracts.cs
          src/backend/ProjectTime.Api/Ai/PulseAiSystemIntelligenceRepository.cs
          src/backend/ProjectTime.Api/Ai/PulseAiSystemIntelligenceService.cs
          src/backend/ProjectTime.Api/Directory.Build.targets
          src/backend/ProjectTime.Api/Modules/CelarAiBrandModule.cs
          src/backend/ProjectTime.Api/Modules/CelarAiConversationAttachmentModule.cs
          src/backend/ProjectTime.Api/Modules/CelarAiProductionPlatformModule.cs
          src/backend/ProjectTime.Api/Modules/ProjectIntakeModule.cs
          src/backend/ProjectTime.Api/Modules/ProjectWorkspaceModule.cs
          src/backend/ProjectTime.Api/Modules/PulseAiPrivateRagModule.cs
          src/backend/ProjectTime.Api/Modules/SecurityHardeningModule.cs
          src/frontend/project-time-web/package.json
          src/frontend/project-time-web/scripts/inject-celar-ai-contextual-chat-workspace.mjs
          src/frontend/project-time-web/scripts/inject-celar-ai-enterprise-chat-context.mjs
          src/frontend/project-time-web/scripts/inject-celar-ai-production-platform.mjs
          src/frontend/project-time-web/scripts/inject-module-006-toyota-hyundai-pipeline.mjs
          src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs
          src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs
          src/frontend/project-time-web/scripts/validate-celar-ai-unified-chat-attachments.mjs
          src/frontend/project-time-web/scripts/validate-module-011-pulse-ai-deep-intelligence.mjs
          src/frontend/project-time-web/scripts/validate-module-059-global.mjs
          src/frontend/project-time-web/src/App.jsx
          src/frontend/project-time-web/src/CelarAiProductionPlatform.jsx
          src/frontend/project-time-web/src/HelpAssistant.jsx
          src/frontend/project-time-web/src/PulseAiPrivateRagWorkbench.jsx
          src/frontend/project-time-web/src/WorkTaskBuilderPanel.jsx
          src/frontend/project-time-web/src/celar-ai-contextual-chat.css
          src/frontend/project-time-web/src/celar-ai-production-platform.css
          src/frontend/project-time-web/src/pulse-ai-help-chat-usability.js
          tests/test-celar-ai-conversation-attachments-migration-072.sh
          tests/test-uat-functional-completion-contract.sh
          EOF
          )"
              ;;
            *)
              echo 'applicable=false' >> "$GITHUB_OUTPUT"
              echo 'CELAR_AI_PRODUCTION_HARDENING=NOT_APPLICABLE'
              exit 0
              ;;
          esac

          echo 'applicable=true' >> "$GITHUB_OUTPUT"
          git fetch origin "$BASE_BRANCH" --no-tags
          DIFF_RANGE="origin/$BASE_BRANCH...HEAD"
          CHANGED="$(git diff --name-only --no-renames "$DIFF_RANGE" | LC_ALL=C sort -u)"
          test -n "$CHANGED"
          MISSING_SOURCE="$(comm -23 <(printf '%s\n' "$SOURCE_MANIFEST" | LC_ALL=C sort -u) <(printf '%s\n' "$CHANGED"))"
          UNEXPECTED="$(comm -23 <(printf '%s\n' "$CHANGED") <(printf '%s\n' "$SOURCE_MANIFEST" | LC_ALL=C sort -u))"
          if [[ -n "$MISSING_SOURCE" || -n "$UNEXPECTED" ]]; then
            echo "The $SCOPE_LABEL branch must contain its exact reviewed source manifest and no out-of-scope paths." >&2
            [[ -z "$MISSING_SOURCE" ]] || { echo 'Missing source files:' >&2; printf '%s\n' "$MISSING_SOURCE" >&2; }
            [[ -z "$UNEXPECTED" ]] || { echo 'Unexpected files:' >&2; printf '%s\n' "$UNEXPECTED" >&2; }
            exit 1
          fi
          while IFS=$'\t' read -r status file; do
            [[ "$status" == A || "$status" == M ]] || {
              echo "Unsafe diff status rejected: $status $file" >&2
              exit 1
            }
            [[ "$(git ls-tree HEAD -- "$file" | awk '{print $1}')" == 100644 ]] || {
              echo "Non-regular or executable file mode rejected: $file" >&2
              exit 1
            }
          done < <(git diff --name-status --no-renames "$DIFF_RANGE")
          git diff --check "$DIFF_RANGE"
          case "$SCOPE_MARKER" in
            EXACT_11_ACCESS_CONTINUITY_FILES)
              echo 'CELAR_AI_PRODUCTION_HARDENING_SCOPE=EXACT_11_ACCESS_CONTINUITY_FILES'
              ;;
            EXACT_24_KNOWLEDGE_FABRIC_FILES)
              echo 'CELAR_AI_PRODUCTION_HARDENING_SCOPE=EXACT_24_KNOWLEDGE_FABRIC_FILES'
              ;;
            EXACT_16_UNIVERSAL_ROUTING_FILES)
              echo 'CELAR_AI_PRODUCTION_HARDENING_SCOPE=EXACT_16_UNIVERSAL_ROUTING_FILES'
              ;;
            EXACT_3_ROUTING_STORE_RESILIENCE_FILES)
              echo 'CELAR_AI_PRODUCTION_HARDENING_SCOPE=EXACT_3_ROUTING_STORE_RESILIENCE_FILES'
              ;;
            EXACT_3_STARTUP_RESILIENCE_FILES)
              echo 'CELAR_AI_PRODUCTION_HARDENING_SCOPE=EXACT_3_STARTUP_RESILIENCE_FILES'
              ;;
            EXACT_45_SOURCE_FILES)
              echo 'CELAR_AI_PRODUCTION_HARDENING_SCOPE=EXACT_45_SOURCE_FILES'
              ;;
            *)
              echo 'CELAR_AI_PRODUCTION_HARDENING_SCOPE=EXACT_51_UNIFIED_CHAT_SOURCE_FILES'
              ;;
          esac

  validate:
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: projectpulse
          POSTGRES_PASSWORD: projectpulse
          POSTGRES_DB: projectpulse_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectpulse -d projectpulse_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify tracked generated sources from canonical transforms
        shell: bash
        run: |
          set -Eeuo pipefail
          TEMP_ROOT="$(mktemp -d)"
          awk 'BEGIN { print "#nullable enable"; inserted=0 } /^[[:space:]]*app\.Run\(\);[[:space:]]*$/ && inserted==0 { print "app.UsePlatformOperationsTelemetry();"; print "app.MapPlatformOperationsEndpoints();"; print "app.MapPlatformProductionResilienceEndpoints();"; print "app.MapProjectFinancialTruthEndpoints();"; print "app.UseProjectNotificationCloseoutCompatibility();"; print "app.MapProjectNotificationAutomationEndpoints();"; print "app.MapFinancialOperationsRecoveryEndpoints();"; print "app.MapEnterpriseReportingEndpoints();"; print "app.MapAnalyticsCenterEndpoints();"; print "app.MapAdminAuditHistoryEndpoints();"; print "app.MapUserAdministrationTeamScopeEndpoints();"; print "app.UseModuleAvailabilityEnforcement();"; print "app.UseSecurityContextAuthorityConvergence();"; print "app.MapModuleAvailabilityEndpoints();"; print "app.MapModuleAvailabilityOverrideEndpoints();"; print "app.MapClientDiagnosticEndpoints();"; print "app.MapPulseAiDeepIntelligenceEndpoints();"; print "app.MapPulseAiPrivateDocumentPipelineEndpoints();"; print "app.MapPulseAiSystemIntelligenceEndpoints();"; print "app.MapCelarAiBrandEndpoints();"; print "app.MapScopedRolePolicyEndpoints();"; print "app.UsePtcTimeStewardRoleBoundary();"; print "app.UseModule001ResultExecutionCompatibility();"; print "app.MapModule001TimeStewardV2Endpoints();"; print "app.MapModule001TimesheetEnhancementEndpoints();"; print "app.MapModule001TimerTargetEndpoints();"; print "app.MapModule001MultiTimerEndpoints();"; print "app.MapModule001PtcTimesheetManagementEndpoints();"; print "app.MapRuntimeDataCompatibilityEndpoints();"; print "app.MapCombinedModuleRuntimeEndpoints();"; print "app.MapCombinedModulePublicReadinessEndpoint();"; print "app.UseProjectExpenseBillingReadinessContinuitySafe();"; print "app.MapModule005ProjectExpenseUploadEndpointsSafe();"; print "app.MapModule005ProjectExpenseBillingAcknowledgementEndpoints();"; print "app.MapModule038CertifyConnectionEndpoints();"; print "app.MapEntraSecretExpirationGovernanceEndpoints();"; print "app.UseEntraSecretExpirationGovernance();"; print "app.MapCrmErpOAuthPersistenceEndpoints();"; print "app.MapPr467UatRepairEndpoints();"; print "app.MapModule006StandalonePipelineEndpoints();"; print "app.MapModule006StandaloneTaskEndpoints();"; print "app.UseCrmErpOAuthPersistence();"; inserted=1 } { print } END { if (inserted==0) exit 42 }' \
            src/backend/ProjectTime.Api/Program.cs > "$TEMP_ROOT/Program.ScopedRbac.g.cs"
          sed -i \
            -e 's/PROJECTPULSE_ENTRA_TENANT_ID/PROJECTPULSE_SSO_TENANT_ID/g' \
            -e 's/PROJECTPULSE_ENTRA_CLIENT_ID/PROJECTPULSE_SSO_CLIENT_ID/g' \
            -e 's/PROJECTPULSE_ENTRA_REDIRECT_URI/PROJECTPULSE_SSO_REDIRECT_URI/g' \
            -e 's/PROJECTPULSE_ENTRA_CLIENT_SECRET/PROJECTPULSE_SSO_CLIENT_SECRET/g' \
            "$TEMP_ROOT/Program.ScopedRbac.g.cs"
          cmp "$TEMP_ROOT/Program.ScopedRbac.g.cs" src/backend/ProjectTime.Api/Program.ScopedRbac.g.cs

          sed -e 's/roles: access.RoleCodes,/roles: access.RoleCodes.OrderBy(value => value).ToArray(),/' \
            src/backend/ProjectTime.Api/Ai/PulseAiDocumentGroundingService.cs \
            > "$TEMP_ROOT/PulseAiDocumentGroundingService.g.cs"
          cmp "$TEMP_ROOT/PulseAiDocumentGroundingService.g.cs" \
            src/backend/ProjectTime.Api/PulseAiDocumentGroundingService.g.cs
          echo 'CELAR_AI_TRACKED_GENERATED_SOURCE_CONVERGENCE=PASSED'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Validate Migration 071 lifecycle and business-row invariants
        env:
          PGPASSWORD: projectpulse
        shell: bash
        run: |
          set -Eeuo pipefail
          PSQL=(psql -h 127.0.0.1 -p 5432 -U projectpulse -d projectpulse_validation -v ON_ERROR_STOP=1)
          for attempt in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U projectpulse -d projectpulse_validation && break
            sleep 2
          done
          "${PSQL[@]}" -f tests/fixtures/celar-ai-production-hardening-prerequisites.sql
          "${PSQL[@]}" -f database/migrations/052_document_intelligence_runtime.sql
          "${PSQL[@]}" -f database/migrations/053_intelligence_answer_orchestration.sql
          "${PSQL[@]}" -f database/migrations/061_celar_ai_capability_routing.sql
          "${PSQL[@]}" -f database/migrations/052_document_intelligence_runtime.sql
          "${PSQL[@]}" -f database/migrations/053_intelligence_answer_orchestration.sql
          "${PSQL[@]}" -f database/migrations/061_celar_ai_capability_routing.sql
          "${PSQL[@]}" <<'SQL'
          INSERT INTO pulse_ai_document_processing_jobs
            (project_intake_document_id, project_id, actual_user_id,
             effective_user_id, requested_by_user_id, job_status,
             lease_owner, correlation_id)
          VALUES
            ('50000000-0000-0000-0000-000000000001',
             '30000000-0000-0000-0000-000000000001',
             '10000000-0000-0000-0000-000000000001',
             '10000000-0000-0000-0000-000000000001',
             '10000000-0000-0000-0000-000000000001',
             'queued', 'ci-before-071', 'celar-production-hardening-ci');
          INSERT INTO ai_capability_routes
            (feature_code, route_targets, external_context_policy, revision)
          VALUES
            ('sentinel_hardening', '["celar_ai","claude","openai","local_template"]'::jsonb, 'sanitized_generic_only', 1);
          SQL
          BEFORE_PROJECT="$("${PSQL[@]}" -Atqc "SELECT md5(row_to_json(value)::text) FROM (SELECT project_id, project_code, project_name FROM projects WHERE project_id='30000000-0000-0000-0000-000000000001') value;")"
          BEFORE_DOCUMENT="$("${PSQL[@]}" -Atqc "SELECT md5(row_to_json(value)::text) FROM (SELECT project_intake_document_id, project_id, document_category, storage_path, is_active FROM project_intake_documents WHERE project_intake_document_id='50000000-0000-0000-0000-000000000001') value;")"
          BEFORE_JOB="$("${PSQL[@]}" -Atqc "SELECT md5(row_to_json(value)::text) FROM (SELECT project_intake_document_id, project_id, job_status, lease_owner, correlation_id FROM pulse_ai_document_processing_jobs WHERE correlation_id='celar-production-hardening-ci') value;")"
          BEFORE_PROVIDER_SECRET="$("${PSQL[@]}" -Atqc "SELECT md5(row_to_json(value)::text) FROM (SELECT provider_code, encode(ciphertext,'hex') ciphertext, encode(nonce,'hex') nonce, encode(tag,'hex') tag, version, rotated_at, rotated_by FROM ai_provider_secrets WHERE provider_code='claude') value;")"
          BEFORE_PROVIDER_SETTING="$("${PSQL[@]}" -Atqc "SELECT md5(row_to_json(value)::text) FROM (SELECT provider_code, model, updated_at, updated_by FROM ai_provider_settings WHERE provider_code='claude') value;")"
          "${PSQL[@]}" -f database/migrations/071_ai_runtime_production_hardening.sql
          "${PSQL[@]}" -f database/migrations/071_ai_runtime_production_hardening.sql
          AFTER_PROJECT="$("${PSQL[@]}" -Atqc "SELECT md5(row_to_json(value)::text) FROM (SELECT project_id, project_code, project_name FROM projects WHERE project_id='30000000-0000-0000-0000-000000000001') value;")"
          AFTER_DOCUMENT="$("${PSQL[@]}" -Atqc "SELECT md5(row_to_json(value)::text) FROM (SELECT project_intake_document_id, project_id, document_category, storage_path, is_active FROM project_intake_documents WHERE project_intake_document_id='50000000-0000-0000-0000-000000000001') value;")"
          AFTER_JOB="$("${PSQL[@]}" -Atqc "SELECT md5(row_to_json(value)::text) FROM (SELECT project_intake_document_id, project_id, job_status, lease_owner, correlation_id FROM pulse_ai_document_processing_jobs WHERE correlation_id='celar-production-hardening-ci') value;")"
          AFTER_PROVIDER_SECRET="$("${PSQL[@]}" -Atqc "SELECT md5(row_to_json(value)::text) FROM (SELECT provider_code, encode(ciphertext,'hex') ciphertext, encode(nonce,'hex') nonce, encode(tag,'hex') tag, version, rotated_at, rotated_by FROM ai_provider_secrets WHERE provider_code='claude') value;")"
          AFTER_PROVIDER_SETTING="$("${PSQL[@]}" -Atqc "SELECT md5(row_to_json(value)::text) FROM (SELECT provider_code, model, updated_at, updated_by FROM ai_provider_settings WHERE provider_code='claude') value;")"
          test -n "$BEFORE_PROJECT" && test "$BEFORE_PROJECT" = "$AFTER_PROJECT"
