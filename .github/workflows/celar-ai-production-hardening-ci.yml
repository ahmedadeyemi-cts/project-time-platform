          test -n "$BEFORE_JOB" && test "$BEFORE_JOB" = "$AFTER_JOB"
          test -n "$BEFORE_PROVIDER_SECRET" && test "$BEFORE_PROVIDER_SECRET" = "$AFTER_PROVIDER_SECRET"
          test -n "$BEFORE_PROVIDER_SETTING" && test "$BEFORE_PROVIDER_SETTING" = "$AFTER_PROVIDER_SETTING"
          "${PSQL[@]}" -Atqc "
            SELECT CASE WHEN
              (SELECT count(*) FROM schema_migrations WHERE migration_id = '052_pulse_ai_private_document_runtime') = 1
              AND (SELECT count(*) FROM schema_migrations WHERE migration_id = '053_pulse_ai_private_rag_orchestration') = 1
              AND (SELECT count(*) FROM schema_migrations WHERE migration_id = '061_celar_ai_capability_routing') = 1
              AND (SELECT count(*) FROM schema_migrations WHERE migration_id = '071_ai_runtime_production_hardening') = 1
              AND to_regclass('public.ai_provider_probe_evidence') IS NOT NULL
              AND EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='ai_provider_secrets' AND column_name='encryption_key_id')
              AND EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='pulse_ai_document_processing_jobs' AND column_name='lease_token')
              AND EXISTS (SELECT 1 FROM ai_capability_routes WHERE feature_code='sentinel_hardening')
              AND EXISTS (SELECT 1 FROM ai_provider_secrets WHERE provider_code='claude' AND encryption_key_id='legacy-v1')
              AND EXISTS (SELECT 1 FROM ai_provider_settings WHERE provider_code='claude' AND enabled=TRUE)
              AND (SELECT count(*) FROM pg_constraint WHERE conrelid='public.ai_provider_secrets'::regclass AND conname IN ('ck_ai_provider_secret_nonce_length','ck_ai_provider_secret_tag_length')) = 2
              AND (SELECT count(*) FROM pg_constraint WHERE conname='ck_ai_provider_secrets_provider_code' AND conrelid='public.ai_provider_secrets'::regclass) = 1
              AND (SELECT count(*) FROM pg_constraint WHERE conname='ck_ai_provider_settings_provider_code' AND conrelid='public.ai_provider_settings'::regclass) = 1
              AND (SELECT count(*) FROM pg_constraint WHERE conrelid='public.ai_private_model_profiles'::regclass AND conname IN ('ck_ai_private_profile_endpoint_nonce_length','ck_ai_private_profile_endpoint_tag_length','ck_ai_private_profile_token_nonce_length','ck_ai_private_profile_token_tag_length')) = 4
            THEN 'PASSED' ELSE 'FAILED' END;" | grep -Fxq PASSED
          "${PSQL[@]}" -c "DELETE FROM ai_provider_secrets WHERE provider_code='claude' AND version='legacy-ci';"
          "${PSQL[@]}" -c "INSERT INTO ai_provider_probe_evidence(provider_code, environment_code, profile_revision, available, diagnostic_code, replica_id, tested_at, expires_at) VALUES ('celar_ai','ci',1,true,'ok','ci',NOW(),NOW()+INTERVAL '15 minutes');"
          if "${PSQL[@]}" -f database/rollback/071_ai_runtime_production_hardening_rollback.sql; then
