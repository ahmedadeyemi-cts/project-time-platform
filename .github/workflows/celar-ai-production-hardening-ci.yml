            ('ci', 'ci_rotation_evidence', 1, 'ci-v1',
             '10000000-0000-0000-0000-000000000001');
          SQL
          if "${PSQL[@]}" -f database/rollback/071_ai_runtime_production_hardening_rollback.sql; then
            echo 'Guarded rollback unexpectedly discarded key-rotation audit evidence.' >&2
            exit 1
          fi
