          "${PSQL[@]}" -f database/rollback/071_ai_runtime_production_hardening_rollback.sql
          "${PSQL[@]}" -Atqc "SELECT CASE WHEN to_regclass('public.ai_provider_probe_evidence') IS NULL AND EXISTS (SELECT 1 FROM ai_capability_routes WHERE feature_code='sentinel_hardening') THEN 'PASSED' ELSE 'FAILED' END;" | grep -Fxq PASSED
          "${PSQL[@]}" -f database/migrations/071_ai_runtime_production_hardening.sql
          echo 'CELAR_AI_MIGRATION_071_LIFECYCLE=PASSED'

