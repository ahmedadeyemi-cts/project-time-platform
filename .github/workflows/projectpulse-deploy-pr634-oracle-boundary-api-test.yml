name: Deploy PR 634 Oracle Boundary API to Protected Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/projectpulse-deploy-pr634-oracle-boundary-api-test.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectpulse-deploy-pr634-oracle-boundary-api-test.yml'

permissions:
  contents: read

concurrency:
  group: projectpulse-deploy-test
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_RELEASE_COMMIT: 1b667086dbaffff61890ce36d5680dadc8349bfa
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact API-only Test controller
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$TARGET_RELEASE_COMMIT" HEAD
          test -f scripts/build-pr55-acr-image.sh
          test -f scripts/wait-containerapp-ready-revision.sh
          test -f .github/workflows/celar-ai-oracle-test-runtime-activation-v2.yml
          grep -Fq 'environment: test' .github/workflows/projectpulse-deploy-pr634-oracle-boundary-api-test.yml
          grep -Fq 'MIGRATIONS_APPLIED=NONE' .github/workflows/projectpulse-deploy-pr634-oracle-boundary-api-test.yml
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/projectpulse-deploy-pr634-oracle-boundary-api-test.yml').read_text()
          assert 'deployment/containers/' + 'api/Dockerfile .' in workflow
          assert 'deployment/containers/' + 'web/Dockerfile' not in workflow
          source = Path('src/backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs').read_text()
          block = source[source.index('public sealed class CelarAiPrivateGenerationTarget'):source.index('public sealed record CelarAiPrivateProbeAttestation')]
          for marker in ('X-Pulse-AI-Privacy-Boundary','PulseAiPrivateRagPolicy.PrivacyBoundary','X-Pulse-AI-Feature','X-Pulse-AI-Correlation-Id','X-Pulse-AI-External-Escalation'):
              assert block.count(marker) == 2, marker
          assert 'X-Celar-AI-Private-Boundary' not in block
          assert 'X-Celar-AI-Feature' not in block
          print('PR634_CANONICAL_PRIVATE_BOUNDARY=PASS')
          PY
          node tests/validate-celar-ai-oracle-test-runtime.mjs
          git diff --check
          echo 'MIGRATIONS_APPLIED=NONE'
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'ORACLE_INFRASTRUCTURE_MUTATION=NONE'
      - name: Actionlint
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 4 --retry-all-errors -o "$RUNNER_TEMP/actionlint.tgz" \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -verbose \
            .github/workflows/projectpulse-deploy-pr634-oracle-boundary-api-test.yml \
            .github/workflows/celar-ai-oracle-test-runtime-activation-v2.yml

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
      actions: write
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_RELEASE_COMMIT: 1b667086dbaffff61890ce36d5680dadc8349bfa
      EVIDENCE_DIR: /tmp/pr634-oracle-boundary-api-test
    steps:
      - name: Check out controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact PR 634 release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 1b667086dbaffff61890ce36d5680dadc8349bfa
          path: release
          fetch-depth: 0
          persist-credentials: false
      - name: Guard exact source and Test-only scope
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git -C control rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git -C release rev-parse HEAD)" == "$TARGET_RELEASE_COMMIT" ]]
          git -C control merge-base --is-ancestor "$TARGET_RELEASE_COMMIT" "$GITHUB_SHA"
          test -f control/scripts/build-pr55-acr-image.sh
          test -f control/scripts/wait-containerapp-ready-revision.sh
          test -f control/.github/workflows/celar-ai-oracle-test-runtime-activation-v2.yml
          (cd release && node tests/validate-celar-ai-oracle-test-runtime.mjs)
          install -d -m 0700 "$EVIDENCE_DIR"
          jq -n --arg control "$GITHUB_SHA" --arg release "$TARGET_RELEASE_COMMIT" \
            '{environment:"test",controllerCommit:$control,releaseCommit:$release,scope:"api_only",migrations:[],productionMutation:false,oracleInfrastructureMutation:false}' \
            > "$EVIDENCE_DIR/boundary.json"
          echo 'MIGRATIONS_APPLIED=NONE'
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'ORACLE_INFRASTRUCTURE_MUTATION=NONE'
      - name: Azure Test login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Snapshot Test and validate UAT session
        id: before
        shell: bash
        env:
          UAT_SESSION: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          [[ -n "$UAT_SESSION" ]] || fail 'PROJECTPULSE_TEST_UAT_SESSION is required.'
          [[ "$(az account show --query id -o tsv --only-show-errors)" == '${{ vars.AZURE_SUBSCRIPTION_ID }}' ]] || fail 'Wrong subscription.'
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          [[ "$BASE" == https://phd-west-test.onenecklab.com ]] || fail 'Wrong Test origin.'
          APP="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          [[ "$(jq -r '.tags.environment // empty' <<<"$APP")" == test ]] || fail 'API is not Test.'
          [[ "$(jq -r '.properties.configuration.activeRevisionsMode' <<<"$APP" | tr '[:upper:]' '[:lower:]')" == single ]] || fail 'API is not single-revision.'
          STATUS="$(curl -sS --max-time 60 -o "$EVIDENCE_DIR/preflight.json" -w '%{http_code}' \
            -H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" \
            -H 'X-ProjectPulse-Module-Number: 011' -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
            "$BASE/api/celar-ai/v1/production/readiness" || true)"
          [[ "$STATUS" == 200 ]] || fail "UAT session returned HTTP $STATUS."
          IMAGE="$(jq -r '.properties.template.containers[0].image' <<<"$APP")"
          [[ "$IMAGE" == '${{ vars.AZURE_ACR_NAME }}.azurecr.io/'*@sha256:* ]] || fail 'Rollback image is not digest-pinned in the Test ACR.'
          SOURCE="$(jq -r '[.properties.template.containers[0].env[]? | select(.name=="PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length==1 then .[0] else empty end' <<<"$APP")"
          {
            echo "base=$BASE"
            echo "image=$IMAGE"
            echo "source=$SOURCE"
          } >> "$GITHUB_OUTPUT"
          jq -n --arg base "$BASE" --arg image "$IMAGE" --arg source "$SOURCE" \
            '{base:$base,previousApiImage:$image,previousSourceCommit:$source,uatSessionValidated:true}' > "$EVIDENCE_DIR/before.json"
      - name: Build immutable API image
        id: build
        shell: bash
        working-directory: release
        run: |
          set -Eeuo pipefail
          DIGEST="$(bash ../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' \
            "project-health-dashboard-api:pr634-oracle-boundary-$TARGET_RELEASE_COMMIT-${GITHUB_RUN_ID}" \
            deployment/containers/api/Dockerfile .)"
          [[ "$DIGEST" == sha256:* ]]
          IMAGE='${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-api@'"$DIGEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          jq -n --arg image "$IMAGE" '{apiImage:$image,webImageBuilt:false}' > "$EVIDENCE_DIR/image.json"
      - name: Deploy exact API image
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.image }}' --set-env-vars PROJECTPULSE_SOURCE_COMMIT="$TARGET_RELEASE_COMMIT" \
            --revision-suffix "pr634api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
          REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
          bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_API_APP }}' \
            "$REVISION" '${{ steps.build.outputs.image }}' 60 10
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - name: Authenticated API UAT
        id: uat
        shell: bash
        env:
          BASE: ${{ steps.before.outputs.base }}
          UAT_SESSION: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          for attempt in $(seq 1 36); do
            curl -fsS --max-time 30 "$BASE/health?pr634=$GITHUB_RUN_ID-$attempt" > "$EVIDENCE_DIR/health.json" && break
            sleep 5
          done
          jq -e . "$EVIDENCE_DIR/health.json" >/dev/null
          AUTH=(-H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" \
            -H 'X-ProjectPulse-Module-Number: 064' -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin')
          STATUS="$(curl -sS --max-time 90 -o "$EVIDENCE_DIR/private-model-before-activation.json" -w '%{http_code}' \
            "${AUTH[@]}" "$BASE/api/ai-configuration/private-model" || true)"
          [[ "$STATUS" == 200 ]] || fail "Module 064 profile returned HTTP $STATUS."
          jq -e '.endpointReturned == false and .tokenReturned == false' "$EVIDENCE_DIR/private-model-before-activation.json" >/dev/null
          APP="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          SOURCE="$(jq -r '[.properties.template.containers[0].env[]? | select(.name=="PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length==1 then .[0] else empty end' <<<"$APP")"
          [[ "$SOURCE" == "$TARGET_RELEASE_COMMIT" ]] || fail 'Source marker mismatch.'
          echo 'passed=true' >> "$GITHUB_OUTPUT"
          jq -n --arg source "$SOURCE" --arg revision '${{ steps.deploy.outputs.revision }}' \
            '{status:"passed",sourceCommit:$source,apiRevision:$revision,privateValuesReturned:false}' > "$EVIDENCE_DIR/uat.json"
      - name: Queue Oracle activation v2
        id: activation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          WORKFLOW='celar-ai-oracle-test-runtime-activation-v2.yml'
          START="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main \
            -f release_commit="$TARGET_RELEASE_COMMIT" \
            -f approval_reference='ORACLE-TEST-PR634-CANONICAL-BOUNDARY-20260811' \
            -f confirmation='ACTIVATE-CELAR-AI-ORACLE-ON-TEST'
          RUN_ID=''
          for _attempt in $(seq 1 30); do
            RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=20" \
              | jq -r --arg start "$START" '.workflow_runs | map(select(.created_at >= $start)) | sort_by(.created_at) | reverse | .[0].id // empty')"
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] && break
            sleep 3
          done
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          {
            echo 'queued=true'
            echo "run_id=$RUN_ID"
            echo "run_url=$URL"
          } >> "$GITHUB_OUTPUT"
          jq -n --arg id "$RUN_ID" --arg url "$URL" --arg release "$TARGET_RELEASE_COMMIT" \
            '{status:"queued",runId:($id|tonumber),runUrl:$url,releaseCommit:$release}' > "$EVIDENCE_DIR/activation.json"
      - name: Roll back API on pre-activation failure
        if: failure() && steps.deploy.outputs.started == 'true' && steps.activation.outputs.queued != 'true'
        shell: bash
        run: |
          set +e
          OLD_IMAGE='${{ steps.before.outputs.image }}'
          OLD_SOURCE='${{ steps.before.outputs.source }}'
          ARGS=(-g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --image "$OLD_IMAGE" \
            --revision-suffix "pr634rb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors)
          if [[ -n "$OLD_SOURCE" ]]; then
            ARGS+=(--set-env-vars PROJECTPULSE_SOURCE_COMMIT="$OLD_SOURCE")
          else
            ARGS+=(--remove-env-vars PROJECTPULSE_SOURCE_COMMIT)
          fi
          az containerapp update "${ARGS[@]}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr634-oracle-boundary-api-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pr634-oracle-boundary-api-test
          if-no-files-found: warn
          retention-days: 30
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## PR #634 protected-Test API release'
            echo "- Release: \`$TARGET_RELEASE_COMMIT\`"
            echo '- Scope: API only; no web image'
            echo '- Migrations: none'
            echo '- Production: untouched'
            echo '- Oracle infrastructure: untouched'
            echo "- UAT passed: ${{ steps.uat.outputs.passed || 'false' }}"
            echo "- Activation run: ${{ steps.activation.outputs.run_url || 'not queued' }}"
          } >> "$GITHUB_STEP_SUMMARY"
