name: Module 025 Service Scope and generated overview
on:
  push:
    branches: ['feature/module025-service-scope-20260921']
  pull_request:
    paths:
      - 'src/backend/ProjectTime.Api/**'
      - 'src/frontend/project-time-web/src/module025/**'
      - 'src/frontend/project-time-web/src/CelarAiCapabilityRoutingPanel.jsx'
      - 'database/migrations/124_module025_service_scope.sql'
      - 'scripts/release-test/verify-module025-service-scope.sql'
      - 'scripts/release-test/build-and-run-project-planning-document-authority-migration-job.sh'
      - 'tests/Module025ServiceScopeTests/**'
      - 'tests/service-scope/**'
      - '.github/workflows/module025-service-scope-ci.yml'
permissions:
  contents: read
concurrency:
  group: module025-service-scope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-diagnostics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/module025-service-scope-20260921'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive tracked source and exact merge inputs only
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/scope-source"
          git archive HEAD -o "$RUNNER_TEMP/scope-source/pr-source.zip"
          git archive dc7297037c77a711276c7a36cd0048b4b54c6035 -o "$RUNNER_TEMP/scope-source/main-source.zip"
          git archive e858712038d29dc611fb27db28b96e43aef164a0 -o "$RUNNER_TEMP/scope-source/base-source.zip"
          git log -1 --format='%H %T %P' HEAD > "$RUNNER_TEMP/scope-source/pr-identity.txt"
          git log -1 --format='%H %T %P' dc7297037c77a711276c7a36cd0048b4b54c6035 > "$RUNNER_TEMP/scope-source/main-identity.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-scope-source-${{ github.run_id }}
          path: ${{ runner.temp }}/scope-source
          retention-days: 1
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-scope-tests
        ports: ['5432/tcp']
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Validate exact Service Scope feature boundary
        if: github.event_name == 'pull_request'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: python3 tests/service-scope/release_scope.py
      - name: Verify source boundaries and provider feedback
        run: |
          python3 tests/service-scope/source_boundaries.py
          python3 tests/service-scope/release_scope.py --self-test
          node --test tests/service-scope/generation-feedback.test.mjs
          bash -n scripts/release-test/build-and-run-project-planning-document-authority-migration-job.sh
      - name: Build API
        run: dotnet build src/backend/ProjectTime.Api --configuration Release
      - name: Verify real router, complete scope payload and PostgreSQL persistence
        env:
          MODULE025_SCOPE_TEST_DATABASE: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Username=postgres;Password=${{ github.run_id }}-${{ github.run_attempt }}-scope-tests;Database=postgres
        run: |
          set -o pipefail
          dotnet run --project tests/Module025ServiceScopeTests --configuration Release -p:BuildProjectReferences=false 2>&1 | tee "$RUNNER_TEMP/service-scope-tests.log"
      - name: Retain isolated test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-scope-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/service-scope-tests.log
          retention-days: 1
      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --ignore-scripts
      - name: Build complete frontend with required source generation and validation
        working-directory: src/frontend/project-time-web
        run: npm run build
      - name: Restore generated frontend sources after validation
        if: always()
        run: node src/frontend/project-time-web/scripts/restore-celar-ai-production-sources.mjs
      - name: Verify generated builds preserve tracked source
        run: git diff --exit-code
