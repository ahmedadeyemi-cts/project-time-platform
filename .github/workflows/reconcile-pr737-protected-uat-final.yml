name: Reconcile PR 737 through Protected UAT completion

on:
  push:
    branches:
      - ops/pr737-protected-uat-observer-20260823
    paths:
      - .github/workflows/reconcile-pr737-protected-uat-final.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: reconcile-pr737-protected-uat-final
  cancel-in-progress: false

jobs:
  reconcile:
    name: Repair, validate, deploy, verify, and merge PR 737
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_HEAD: d8441ae42f5acfa5efc89996e49e2cf041246820
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      FAILED_JOB_ID: '97293868836'
      EVIDENCE_DIR: /tmp/pr737-final-reconciler

    steps:
      - name: Check out isolated repair tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ops/pr737-protected-uat-observer-20260823
          path: tooling
          persist-credentials: false

      - name: Check out current PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/shared-project-document-planning-20260819
          path: release
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve or publish permanent corrected candidate
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          install -d -m 0700 "$EVIDENCE_DIR"

          pr="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/pulls/737")"
          state="$(jq -r '.state' <<<"$pr")"
          merged="$(jq -r '.merged' <<<"$pr")"
          branch="$(jq -r '.head.ref' <<<"$pr")"
          head="$(jq -r '.head.sha' <<<"$pr")"
          [[ "$branch" == "$TARGET_BRANCH" ]] || fail 'PR #737 head branch changed.'

          if [[ "$merged" == true ]]; then
            echo "sha=$head" >> "$GITHUB_OUTPUT"
            echo 'already_merged=true' >> "$GITHUB_OUTPUT"
            echo 'PR_737_ALREADY_MERGED=TRUE'
            exit 0
          fi
          [[ "$state" == open && "$head" =~ ^[0-9a-f]{40}$ ]] || fail 'PR #737 is not an open exact candidate.'

          if [[ "$head" == "$ORIGINAL_HEAD" ]]; then
            # Give the focused repair workflows a bounded opportunity to publish
            # their permanent candidate before applying the same exact repair here.
            for _ in $(seq 1 90); do
              sleep 10
              pr="$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$API_ROOT/pulls/737")"
              head="$(jq -r '.head.sha' <<<"$pr")"
              [[ "$head" != "$ORIGINAL_HEAD" ]] && break
            done
          fi

          if [[ "$head" == "$ORIGINAL_HEAD" ]]; then
            [[ "$(git -C release rev-parse HEAD)" == "$ORIGINAL_HEAD" ]] || fail 'Local repair checkout is not the original failed candidate.'
            curl --fail-with-body --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/actions/jobs/$FAILED_JOB_ID/logs" \
              --output "$EVIDENCE_DIR/job-log.download"
            if file "$EVIDENCE_DIR/job-log.download" | grep -qi 'zip archive'; then
              unzip -p "$EVIDENCE_DIR/job-log.download" > "$EVIDENCE_DIR/job.log"
            else
              cp "$EVIDENCE_DIR/job-log.download" "$EVIDENCE_DIR/job.log"
            fi
            grep -Fq 'column u.is_active does not exist' "$EVIDENCE_DIR/job.log" \
              || fail 'The exact Migration 096 database failure was not reproduced from the deployment log.'

            python3 tooling/tools/repair_pr737_migration096_v2.py \
              release "$EVIDENCE_DIR/job.log" "$EVIDENCE_DIR/repair-report.json" "$ORIGINAL_HEAD"
            (
              cd release
              bash tests/test-project-planning-collaboration-migration-095.sh
              bash tests/test-project-planning-document-authority-migration-096.sh
              node tests/validate-shared-project-document-planning.mjs
              node tests/validate-project-planning-collaboration-access.mjs
              node tests/validate-project-planning-collaboration.mjs
              git diff --check
            )
            remote_head="$(git -C release ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
            [[ "$remote_head" == "$ORIGINAL_HEAD" ]] || fail "PR #737 moved during fallback repair: $remote_head"
            git -C release config user.name 'github-actions[bot]'
            git -C release config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C release add -- \
              database/migrations/096_project_planning_document_authority.sql \
              tests/test-project-planning-document-authority-migration-096.sh
            git -C release diff --cached --check
            git -C release commit -m 'Fix Migration 096 historical identity predicate'
            git -C release push origin "HEAD:refs/heads/$TARGET_BRANCH"
            head="$(git -C release rev-parse HEAD)"
          fi

          [[ "$head" =~ ^[0-9a-f]{40}$ && "$head" != "$ORIGINAL_HEAD" ]] \
            || fail 'A permanent corrected candidate was not published.'
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          echo 'already_merged=false' >> "$GITHUB_OUTPUT"
          echo "PR_737_CORRECTED_CANDIDATE=$head"
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Wait for exact-SHA governed release gates
        if: steps.candidate.outputs.already_merged != 'true'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          required=(
            'ProjectPulse Repository Security Posture'
            'Validate Governed Protected-Test Release Controller'
            'ProjectPulse CI'
            'Validate UAT Functional Completion'
            'FlowHive Detailed Planner CI'
            'Validate Shared FlowHive and Project Forge Document Planning'
            'Validate Module 033 Project Forge'
            'Validate Module 030 Analytics Center'
            'Validate Module 030 Analytics Enterprise Experience'
            'Validate Celar AI Enterprise Platform Interface'
            'Validate Pulse AI Private Document Pipeline'
            'Validate Project Planning Collaboration Access'
            'System-wide Enterprise Reliability CI'
          )
          all_green=0
          for _ in $(seq 1 540); do
            runs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/actions/runs?head_sha=$CANDIDATE_SHA&event=pull_request&per_page=100")"
            all_green=1
            pending=()
            for name in "${required[@]}"; do
              value="$(jq -r --arg name "$name" '
                [.workflow_runs[] | select(.name == $name)] | sort_by(.created_at) | last
                | if . == null then "missing:" else "\(.status):\(.conclusion // ""):\(.id)" end
              ' <<<"$runs")"
              IFS=':' read -r status conclusion id <<<"$value"
              case "$status:$conclusion" in
                completed:success) ;;
                completed:*)
                  printf '%s\n' "$runs" > "$EVIDENCE_DIR/exact-sha-runs.json"
                  fail "Required exact-SHA workflow failed: $name ($value)"
                  ;;
                *) all_green=0; pending+=("$name=$value") ;;
              esac
            done
            (( all_green )) && break
            printf 'Waiting for exact-SHA release gates: %s\n' "${pending[*]}"
            sleep 10
          done
          (( all_green )) || fail 'Exact-SHA release gates did not all become green.'
          printf '%s\n' "$runs" > "$EVIDENCE_DIR/exact-sha-runs.json"
          echo 'PR_737_EXACT_SHA_GATES=PASSED'

      - name: Locate or dispatch exact candidate to Protected Test
        if: steps.candidate.outputs.already_merged != 'true'
        id: deployment
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          deployment_id=''
          for _ in $(seq 1 90); do
            runs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/runs?event=workflow_dispatch&per_page=60")"
            deployment_id="$(jq -r --arg sha "$CANDIDATE_SHA" --arg branch "$TARGET_BRANCH" '
              [.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch)]
              | sort_by(.created_at) | last | .id // empty
            ' <<<"$runs")"
            [[ -n "$deployment_id" ]] && break
            sleep 5
          done

          if [[ -z "$deployment_id" ]]; then
            payload="$(jq -nc --arg branch "$TARGET_BRANCH" --arg sha "$CANDIDATE_SHA" '{ref:$branch,inputs:{release_sha:$sha,release_branch:$branch}}')"
            code="$(curl --silent --show-error \
              --output "$EVIDENCE_DIR/dispatch-response.json" --write-out '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$payload" "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/dispatches")"
            [[ "$code" == 204 ]] || fail "Protected Test dispatch returned HTTP $code."
            for _ in $(seq 1 90); do
              runs="$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/runs?event=workflow_dispatch&per_page=60")"
              deployment_id="$(jq -r --arg sha "$CANDIDATE_SHA" --arg branch "$TARGET_BRANCH" '
                [.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch)]
                | sort_by(.created_at) | last | .id // empty
              ' <<<"$runs")"
              [[ -n "$deployment_id" ]] && break
              sleep 5
            done
          fi
          [[ "$deployment_id" =~ ^[0-9]+$ ]] || fail 'Corrected Protected Test deployment run was not located.'
          echo "run_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "PROTECTED_UAT_DEPLOYMENT_RUN=$deployment_id"

      - name: Verify successful Protected Test deployment evidence
        if: steps.candidate.outputs.already_merged != 'true'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          conclusion=''
          for _ in $(seq 1 1440); do
            run="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/actions/runs/$DEPLOYMENT_ID")"
            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
            [[ "$status" == completed ]] && break
            sleep 10
          done
          printf '%s\n' "$run" > "$EVIDENCE_DIR/deployment-run.json"
          jobs="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/actions/runs/$DEPLOYMENT_ID/jobs?per_page=100")"
          printf '%s\n' "$jobs" > "$EVIDENCE_DIR/deployment-jobs.json"
          [[ "$conclusion" == success ]] || fail "Protected Test deployment $DEPLOYMENT_ID failed with conclusion $conclusion."

          artifacts="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/actions/runs/$DEPLOYMENT_ID/artifacts")"
          url="$(jq -r '[.artifacts[] | select(.name | startswith("systemwide-enterprise-reliability-test-evidence-"))] | sort_by(.created_at) | last | .archive_download_url // empty' <<<"$artifacts")"
          [[ "$url" == https://api.github.com/* ]] || fail 'Protected Test evidence artifact is missing.'
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$url" --output "$EVIDENCE_DIR/deployment-evidence.zip"
          unzip -q "$EVIDENCE_DIR/deployment-evidence.zip" -d "$EVIDENCE_DIR/deployment-evidence"
          uat="$(find "$EVIDENCE_DIR/deployment-evidence" -type f -name uat-summary.json -print -quit)"
          migrations="$(find "$EVIDENCE_DIR/deployment-evidence" -type f -name migrations.json -print -quit)"
          [[ -s "$uat" && -s "$migrations" ]] || fail 'Migration or authenticated UAT evidence is missing.'
          jq -e --arg sha "$CANDIDATE_SHA" '
            .status == "passed" and .sourceCommit == $sha and
            .migration086 == "applied_and_verified" and
            .migration088 == "applied_and_verified" and
            .migration093 == "applied_and_verified" and
            .migration094 == "applied_and_verified" and
            .migration095 == "applied_and_verified" and
            .migration096 == "applied_and_verified" and
            .flowHiveAiPlanner == true and .projectForgeAiPlanner == true and
            .flowHiveWorkingCopyOnly == true and .projectForgeReviewOnly == true and
            .planDesignImplementValidateRelease == true and
            .estimatesCompressed == false and .productionMutation == false
          ' "$uat" >/dev/null || fail 'Authenticated FlowHive/Forge UAT evidence failed the release contract.'
          jq -e '.status == "applied_and_verified" and (.migrations | index("096_project_planning_document_authority") != null) and .productionMutation == false' "$migrations" >/dev/null \
            || fail 'Migration 096 is not verified in Protected Test.'
          echo 'PROTECTED_UAT_DEPLOYMENT_AND_AUTHENTICATED_UAT=PASSED'
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Merge PR 737 after successful Protected UAT
        if: steps.candidate.outputs.already_merged != 'true'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          pr="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/pulls/737")"
          jq -e --arg sha "$CANDIDATE_SHA" '.state == "open" and .head.sha == $sha and .mergeable != false' <<<"$pr" >/dev/null \
            || fail 'PR #737 moved or is no longer mergeable after Protected UAT.'
          payload="$(jq -nc --arg sha "$CANDIDATE_SHA" '{sha:$sha,merge_method:"merge",commit_title:"FlowHive V2 document-grounded planning (#737)"}')"
          code="$(curl --silent --show-error --output "$EVIDENCE_DIR/merge.json" --write-out '%{http_code}' \
            --request PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$payload" "$API_ROOT/pulls/737/merge")"
          [[ "$code" == 200 ]] || { cat "$EVIDENCE_DIR/merge.json" >&2 || true; fail "PR #737 merge returned HTTP $code."; }
          jq -e '.merged == true' "$EVIDENCE_DIR/merge.json" >/dev/null || fail 'GitHub did not confirm PR #737 merge.'
          comment="$(jq -nc --arg sha "$CANDIDATE_SHA" --arg run "$DEPLOYMENT_ID" '{body:("## FlowHive V2 passed Protected UAT and was merged\n\n- Exact candidate SHA: `"+$sha+"`\n- Protected Test deployment run: `"+$run+"`\n- Migrations 086, 088, 093, 094, 095, and 096: applied and verified\n- Authenticated FlowHive and Project Forge UAT: passed\n- Runtime/source SHA: verified\n- Production mutation: `NONE`")}')"
          curl --fail-with-body --silent --show-error --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$comment" "$API_ROOT/issues/737/comments" >/dev/null
          echo 'PR_737_MERGED_AFTER_PROTECTED_UAT=TRUE'
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Upload final reconciler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr737-final-reconciler-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pr737-final-reconciler
          if-no-files-found: warn
          retention-days: 14
