name: Verify Module 001B in Protected Test

on:
  workflow_run:
    workflows:
      - Deploy System-wide Enterprise Reliability and Utilization to Protected Test
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-test
  queue: max
  cancel-in-progress: false

jobs:
  verify-module001b:
    name: Apply Migration 098 and verify Module 001B
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_RELEASE_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      EVIDENCE_DIR: /tmp/module001b-protected-test-evidence

    steps:
      - name: Check out exact deployed release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TARGET_RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact main release and Module 001B artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          [[ "$TARGET_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail 'Target release is not an exact commit SHA.'
          [[ "$(git rev-parse HEAD)" == "$TARGET_RELEASE_COMMIT" ]] || fail 'Checkout does not match the deployed release SHA.'
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$TARGET_RELEASE_COMMIT" origin/main || fail 'Target release is not on main.'
          for required in \
            database/migrations/098_module001b_role_catalog_registration.sql \
            scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh \
            src/backend/ProjectTime.Api/Modules/Module001BTimeReallocationModule.cs \
            src/backend/ProjectTime.Api/Modules/PtcTimeStewardRoleBoundary.cs \
            src/frontend/project-time-web/src/module001b/Module001BTimeReallocationPortal.jsx; do
            [[ -f "$required" ]] || fail "Required Module 001B artifact is missing: $required"
          done
          grep -Fq "'001B'" database/migrations/098_module001b_role_catalog_registration.sql
          grep -Fq 'submissionStatePreserved = true' src/backend/ProjectTime.Api/Modules/Module001BTimeReallocationModule.cs
          grep -Fq 'StatusCodes.Status410Gone' src/backend/ProjectTime.Api/Modules/PtcTimeStewardRoleBoundary.cs
          bash -n scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          install -d -m 0700 "$EVIDENCE_DIR"
          printf '%s\n' "$TARGET_RELEASE_COMMIT" > "$EVIDENCE_DIR/release-commit.txt"

      - name: Sign in to protected Test subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm deployed Test API is the exact release
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          SUBSCRIPTION="$(az account show --query id -o tsv --only-show-errors)"
          [[ "${SUBSCRIPTION,,}" == "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]] || fail 'Azure login is outside protected Test.'
          API_JSON="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_API_APP" -o json --only-show-errors)"
          [[ "$(jq -r '.tags.environment // empty' <<<"$API_JSON")" == test ]] || fail 'API app is not tagged Test.'
          ACTIVE_SOURCE="$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT") | .value // empty] | if length == 1 then .[0] else empty end' <<<"$API_JSON")"
          [[ "$ACTIVE_SOURCE" == "$TARGET_RELEASE_COMMIT" ]] || fail "Protected Test API is not the exact release: $ACTIVE_SOURCE"
          jq -n --arg release "$ACTIVE_SOURCE" '{environment:"test",activeSourceCommit:$release,productionMutation:false}' > "$EVIDENCE_DIR/deployed-release.json"

      - name: Build immutable Migration 098 image
        id: migration_image
        shell: bash
        env:
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          ACR="$AZURE_ACR_NAME"
          [[ -n "$ACR" && "$ACR" =~ ^[A-Za-z0-9]+$ ]] || fail 'AZURE_ACR_NAME is missing or invalid.'
          CTX="$RUNNER_TEMP/module001b-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CTX/database/migrations"
          install -m 0644 database/migrations/098_module001b_role_catalog_registration.sql "$CTX/database/migrations/098_module001b_role_catalog_registration.sql"
          printf '%s\n' "$TARGET_RELEASE_COMMIT" > "$CTX/release-commit"

          cat > "$CTX/entrypoint.sh" <<'ENTRYPOINT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOT=/opt/projectpulse/release
          EXPECTED="${MAIN_RELEASE_EXPECTED_RELEASE_COMMIT:-}"
          ACTUAL="$(cat "$ROOT/.projectpulse-release-commit")"
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ && "$ACTUAL" == "$EXPECTED" ]] || {
            echo 'ERROR: Module 001B migration image release identity mismatch.' >&2
            exit 1
          }
          psql -X -v ON_ERROR_STOP=1 --file "$ROOT/database/migrations/098_module001b_role_catalog_registration.sql"
          verification="$(psql -X -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT
            EXISTS(
              SELECT 1 FROM schema_migrations
              WHERE migration_id = '098_module001b_role_catalog_registration'
            )::text || '|' ||
            EXISTS(
              SELECT 1
              FROM scoped_role_policy_modules
              WHERE upper(module_code) = '001B'
                AND module_name = 'Time Reallocation & Corrections'
                AND route_scope = 'time-reallocation'
                AND current_state = 'Installed'
                AND is_active = TRUE
            )::text;
          SQL
          )"
          [[ "$verification" == 'true|true' ]] || {
            echo "ERROR: Module 001B Migration 098 verification failed: $verification" >&2
            exit 1
          }
          echo 'MIGRATION_098_MODULE001B=APPLIED_AND_VERIFIED'
          ENTRYPOINT
          chmod 0555 "$CTX/entrypoint.sh"

          cat > "$CTX/Dockerfile" <<'DOCKERFILE'
          FROM postgres:16-alpine
          RUN apk add --no-cache bash coreutils ca-certificates
          WORKDIR /opt/projectpulse/release
          COPY release-commit .projectpulse-release-commit
          COPY database/ database/
          COPY entrypoint.sh /usr/local/bin/module001b-migrate
          RUN chmod 0555 /usr/local/bin/module001b-migrate \
              && chmod 0444 .projectpulse-release-commit database/migrations/*.sql
          ENTRYPOINT ["/usr/local/bin/module001b-migrate"]
          DOCKERFILE

          SHORT_RELEASE="${TARGET_RELEASE_COMMIT:0:12}"
          IMAGE="project-health-dashboard-module001b-migrator:m1b-${SHORT_RELEASE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az acr build --registry "$ACR" --image "$IMAGE" --file "$CTX/Dockerfile" --timeout 1800 "$CTX" --only-show-errors

          DIGEST=''
          for attempt in $(seq 1 12); do
            DIGEST="$(az acr repository show --name "$ACR" --image "$IMAGE" --query digest -o tsv --only-show-errors 2>/dev/null || true)"
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            (( attempt < 12 )) && sleep 5
          done
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail 'Could not resolve immutable Migration 098 image digest.'
          IMMUTABLE_IMAGE="$ACR.azurecr.io/${IMAGE%:*}@$DIGEST"
          echo "image=$IMMUTABLE_IMAGE" >> "$GITHUB_OUTPUT"
          jq -n --arg image "$IMMUTABLE_IMAGE" '{migration:"098_module001b_role_catalog_registration",image:$image,productionMutation:false}' > "$EVIDENCE_DIR/migration-image.json"

      - name: Apply and verify Migration 098 inside Test private network
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          RELIABILITY_MIGRATION_IMAGE: ${{ steps.migration_image.outputs.image }}
          RELIABILITY_MIGRATION_JOB_NAME: m1b-${{ github.run_id }}-${{ github.run_attempt }}
          AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID: ${{ vars.AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID }}
          AZURE_KEY_VAULT_URI: ${{ vars.AZURE_KEY_VAULT_URI }}
          PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME: ${{ vars.PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME }}
          PROJECTPULSE_TEST_DATABASE_HOST: ${{ vars.PROJECTPULSE_TEST_DATABASE_HOST }}
          PROJECTPULSE_TEST_DATABASE_PORT: ${{ vars.PROJECTPULSE_TEST_DATABASE_PORT }}
          PROJECTPULSE_TEST_DATABASE_NAME: ${{ vars.PROJECTPULSE_TEST_DATABASE_NAME }}
          PROJECTPULSE_TEST_DATABASE_USER: ${{ vars.PROJECTPULSE_TEST_DATABASE_USER }}
          RELIABILITY_CONTROL_SHA: ${{ env.TARGET_RELEASE_COMMIT }}
          RELIABILITY_RELEASE_COMMIT: ${{ env.TARGET_RELEASE_COMMIT }}
          RELIABILITY_MIGRATION_SCOPE: module001b-time-reallocation-test
        run: |
          set -Eeuo pipefail
          bash scripts/release-test/run-systemwide-enterprise-reliability-migrations-job.sh
          jq -n --arg image '${{ steps.migration_image.outputs.image }}' --arg release "$TARGET_RELEASE_COMMIT" '{status:"applied_and_verified",migration:"098_module001b_role_catalog_registration",releaseCommit:$release,image:$image,environment:"test",productionMutation:false}' > "$EVIDENCE_DIR/migration-098.json"

      - name: Verify Module 001B authenticated access contract
        shell: bash
        env:
          TEST_LOGIN_PASSWORD: ${{ secrets.PROJECTPULSE_M087_PASSWORD }}
          BASE: ${{ vars.PUBLIC_URL }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          BASE="${BASE%/}"
          [[ "$BASE" == https://phd-west-test.onenecklab.com ]] || fail 'Configured public origin is not protected Test.'
          [[ ${#TEST_LOGIN_PASSWORD} -ge 12 ]] || fail 'Protected Test login secret is unavailable.'

          READY=false
          for attempt in $(seq 1 24); do
            STATUS="$(curl -sS --max-time 30 -o "$EVIDENCE_DIR/health.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/health?module001b=$GITHUB_RUN_ID-$attempt" || true)"
            if [[ "$STATUS" == 200 ]] && jq -e '.status == "healthy"' "$EVIDENCE_DIR/health.json" >/dev/null 2>&1; then READY=true; break; fi
            sleep 5
          done
          [[ "$READY" == true ]] || fail 'Protected Test did not remain healthy for Module 001B verification.'

          login() {
            local username="$1" output="$2" payload
            payload="$(mktemp)"
            chmod 0600 "$payload" "$output"
            jq -n --arg username "$username" --arg password "$TEST_LOGIN_PASSWORD" '{username:$username,password:$password}' > "$payload"
            local status
            status="$(curl -sS --max-time 90 -o "$output" -w '%{http_code}' \
              -H 'Cache-Control: no-cache' -H 'Content-Type: application/json' \
              -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
              --data-binary @"$payload" "$BASE/api/auth/local/login" || true)"
            rm -f "$payload"
            printf '%s\n' "$status"
          }

          api_get() {
            local session="$1" path="$2" output="$3"
            curl -sS --max-time 90 -o "$output" -w '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              -H "Authorization: Bearer $session" \
              -H "X-ProjectPulse-Session: $session" \
              -H 'X-ProjectPulse-Module-Number: 001B' \
              -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
              "$BASE$path" || true
          }

          login_and_session() {
            local username="$1" response status session
            response="$(mktemp)"
            status="$(login "$username" "$response")"
            [[ "$status" == 200 ]] || fail "Protected Test login failed for $username with HTTP $status."
            session="$(jq -r '.sessionToken // empty' "$response")"
            rm -f "$response"
            [[ -n "$session" ]] || fail "Protected Test login did not return a session for $username."
            echo "::add-mask::$session" >&2
            printf '%s\n' "$session"
          }

          COORDINATOR_SESSION="$(login_and_session 'project.team.coordinator@ussignal.local')"
          ENGINEER_SESSION="$(login_and_session 'demo.engineer@ussignal.local')"
          PROJECT_MANAGER_SESSION="$(login_and_session 'heather.schrock@ussignal.local')"

          CAPABILITIES="$EVIDENCE_DIR/module001b-capabilities.json"
          COORDINATOR_STATUS="$(api_get "$COORDINATOR_SESSION" '/api/runtime/timesheet/steward/001b/reallocation/capabilities' "$CAPABILITIES")"
          [[ "$COORDINATOR_STATUS" == 200 ]] || fail "PTC Module 001B capabilities returned HTTP $COORDINATOR_STATUS."
          jq -e '
            .module == "001B"
            and .displayName == "Time Reallocation & Corrections"
            and .allocationOnly == true
            and .workerEditable == false
            and .workDateEditable == false
            and .workedTimeEditable == false
            and .submissionStatePreserved == true
            and .unsubmitRequired == false
            and .workerResubmissionRequired == false
            and .managerApprovalRequired == false
            and .projectManagerApprovalRequired == false
            and ((.allowedRoles // []) | sort == ["Project Team Coordinator","Super Administrator"])
            and ((.supportedDestinations // []) | length == 3)
          ' "$CAPABILITIES" >/dev/null || fail 'PTC Module 001B capability contract is incorrect.'

          ENGINEER_OUTPUT="$EVIDENCE_DIR/module001b-engineer-denied.json"
          ENGINEER_STATUS="$(api_get "$ENGINEER_SESSION" '/api/runtime/timesheet/steward/001b/reallocation/capabilities' "$ENGINEER_OUTPUT")"
          [[ "$ENGINEER_STATUS" == 403 ]] || fail "Engineer Module 001B access was not denied; HTTP $ENGINEER_STATUS."
          jq -e '.status == "time_steward_role_required"' "$ENGINEER_OUTPUT" >/dev/null || fail 'Engineer denial did not use the strict time-steward role boundary.'

          PM_OUTPUT="$EVIDENCE_DIR/module001b-pm-denied.json"
          PM_STATUS="$(api_get "$PROJECT_MANAGER_SESSION" '/api/runtime/timesheet/steward/001b/reallocation/capabilities' "$PM_OUTPUT")"
          [[ "$PM_STATUS" == 403 ]] || fail "Project Manager Module 001B access was not denied; HTTP $PM_STATUS."
          jq -e '.status == "time_steward_role_required"' "$PM_OUTPUT" >/dev/null || fail 'Project Manager denial did not use the strict time-steward role boundary.'

          HTML="$RUNNER_TEMP/module001b-index.html"
          BUNDLE="$RUNNER_TEMP/module001b-assets.txt"
          curl -fsS --max-time 90 -H 'Cache-Control: no-cache, no-store' "$BASE/?module001b_release=$GITHUB_RUN_ID" -o "$HTML"
          : > "$BUNDLE"
          mapfile -t ASSETS < <(grep -oE '(src|href)="[^"]+\.(js|css)(\?[^"]*)?"' "$HTML" | sed -E 's/^(src|href)="([^"]+)"$/\2/' | sort -u)
          (( ${#ASSETS[@]} > 0 )) || fail 'Protected Test page exposed no compiled assets.'
          for asset in "${ASSETS[@]}"; do
            case "$asset" in
              /assets/*) curl -fsS --max-time 90 -H 'Cache-Control: no-cache, no-store' "$BASE$asset" >> "$BUNDLE" ;;
            esac
          done
          for marker in \
            'Time Reallocation & Corrections' \
            'Create new billable / non-billable task' \
            'Submitted and approved time stays in its current status.' \
            '/api/runtime/timesheet/steward/001b/reallocation/entries/'; do
            grep -Fq "$marker" "$BUNDLE" || fail "Protected Test bundle is missing Module 001B marker: $marker"
          done

          jq -n \
            --arg release "$TARGET_RELEASE_COMMIT" \
            --argjson coordinatorStatus "$COORDINATOR_STATUS" \
            --argjson engineerStatus "$ENGINEER_STATUS" \
            --argjson projectManagerStatus "$PM_STATUS" \
            '{releaseCommit:$release,environment:"test",ptcCapabilitiesHttp:$coordinatorStatus,engineerDeniedHttp:$engineerStatus,projectManagerDeniedHttp:$projectManagerStatus,statusPreserved:true,noReapproval:true,compiledBundleVerified:true,productionMutation:false}' \
            > "$EVIDENCE_DIR/module001b-uat.json"

          for session in "$COORDINATOR_SESSION" "$ENGINEER_SESSION" "$PROJECT_MANAGER_SESSION"; do
            curl -sS --max-time 60 -o /dev/null \
              -X POST -H "Authorization: Bearer $session" -H "X-ProjectPulse-Session: $session" \
              -H 'X-ProjectPulse-Module-Number: 001B' \
              -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' \
              "$BASE/api/auth/session/logout" || true
          done
          unset TEST_LOGIN_PASSWORD COORDINATOR_SESSION ENGINEER_SESSION PROJECT_MANAGER_SESSION
          echo 'MODULE001B_PROTECTED_TEST_POSTDEPLOY=PASS'
