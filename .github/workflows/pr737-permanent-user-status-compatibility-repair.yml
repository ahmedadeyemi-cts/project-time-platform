name: PR 737 permanent migration user-status compatibility repair

on:
  push:
    branches:
      - ops/pr737-protected-uat-observer-20260823
    paths:
      - .github/workflows/pr737-permanent-user-status-compatibility-repair.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: pr737-permanent-user-status-compatibility-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: fix/shared-project-document-planning-20260819
      EXPECTED_HEAD: 2ec3bcb67069a51b2139d5b0060b0772afdc06d1
      FAILED_DEPLOYMENT_RUN: '32690749354'
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact permanent candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnose completed migration failure
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          [[ "$remote_head" == "$EXPECTED_HEAD" ]] || {
            echo "ERROR: PR #737 moved from the reviewed head: $remote_head" >&2
            exit 1
          }

          evidence="$RUNNER_TEMP/pr737-migration-failure"
          install -d -m 0700 "$evidence"
          curl --fail-with-body --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/actions/runs/$FAILED_DEPLOYMENT_RUN/logs" \
            --output "$evidence/logs.zip"
          unzip -q "$evidence/logs.zip" -d "$evidence/logs"
          grep -RinE -C 8 \
            'does not exist|undefined column|u\.is_active|ERROR:|psql:|migration.*fail|containerapp job.*failed|Dockerfile.*(missing|not found)' \
            "$evidence/logs" > "$evidence/diagnostic.txt" || true
          sed -n '1,500p' "$evidence/diagnostic.txt"

      - name: Apply permanent schema-compatible repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          migration = Path('database/migrations/095_project_planning_collaboration_access.sql')
          rollback = Path('database/rollback/095_project_planning_collaboration_access_rollback.sql')
          test = Path('tests/test-project-planning-collaboration-migration-095.sh')
          runner = Path('scripts/release-test/run-project-planning-collaboration-migration-job.sh')

          source = migration.read_text(encoding='utf-8')
          helper_name = 'projectpulse095_user_record_is_active'
          helper = r'''
-- app_users has existed in more than one supported schema shape.  Access
-- reconciliation must not bind to an optional physical column such as
-- app_users.is_active.  Evaluate the whole row as JSON so optional account
-- status fields can be honored without making migration 095 fail to compile
-- when a field is absent.  When no account-status field exists, presence in
-- the canonical app_users relation remains the identity authority.
CREATE OR REPLACE FUNCTION projectpulse095_user_record_is_active(user_record JSONB)
RETURNS BOOLEAN
LANGUAGE SQL
IMMUTABLE
PARALLEL SAFE
AS $projectpulse095_user_record_is_active_body$
SELECT CASE
    WHEN user_record IS NULL THEN FALSE
    WHEN user_record ? 'is_active' THEN
        LOWER(COALESCE(user_record->>'is_active','')) IN ('true','t','1','yes','on')
    WHEN user_record ? 'account_enabled' THEN
        LOWER(COALESCE(user_record->>'account_enabled','')) IN ('true','t','1','yes','on')
    WHEN user_record ? 'is_enabled' THEN
        LOWER(COALESCE(user_record->>'is_enabled','')) IN ('true','t','1','yes','on')
    WHEN user_record ? 'enabled' THEN
        LOWER(COALESCE(user_record->>'enabled','')) IN ('true','t','1','yes','on')
    WHEN user_record ? 'status' THEN
        LOWER(TRIM(COALESCE(user_record->>'status',''))) IN ('active','enabled','current')
    WHEN user_record ? 'disabled_at' OR user_record ? 'deleted_at' THEN
        NULLIF(TRIM(COALESCE(user_record->>'disabled_at','')), '') IS NULL
        AND NULLIF(TRIM(COALESCE(user_record->>'deleted_at','')), '') IS NULL
    ELSE TRUE
END;
$projectpulse095_user_record_is_active_body$;
'''.strip()

          if helper_name not in source:
              marker = 'BEGIN;\n'
              if source.count(marker) != 1:
                  raise SystemExit('Migration 095 BEGIN boundary was not found exactly once.')
              source = source.replace(marker, marker + '\n' + helper + '\n\n', 1)

          direct_count = len(re.findall(r'\bu\.is_active\b', source))
          source = re.sub(
              r'\bu\.is_active\b',
              'projectpulse095_user_record_is_active(to_jsonb(u))',
              source,
          )
          if re.search(r'\bu\.is_active\b', source):
              raise SystemExit('A direct u.is_active dependency remains in Migration 095.')
          if direct_count == 0 and helper_name in migration.read_text(encoding='utf-8'):
              raise SystemExit('The compatibility repair was already present; refusing a duplicate repair commit.')
          migration.write_text(source, encoding='utf-8')

          rollback_source = rollback.read_text(encoding='utf-8')
          drop = 'DROP FUNCTION IF EXISTS projectpulse095_user_record_is_active(JSONB);'
          if drop not in rollback_source:
              commit_matches = list(re.finditer(r'(?m)^COMMIT;\s*$', rollback_source))
              if len(commit_matches) != 1:
                  raise SystemExit('Migration 095 rollback COMMIT boundary was not found exactly once.')
              index = commit_matches[0].start()
              rollback_source = rollback_source[:index] + drop + '\n\n' + rollback_source[index:]
              rollback.write_text(rollback_source, encoding='utf-8')

          test_source = test.read_text(encoding='utf-8')
          static_gate = '''
# Protected Test app_users does not require an is_active physical column.
if grep -Eq '\\bu\\.is_active\\b' "$ROOT/database/migrations/095_project_planning_collaboration_access.sql"; then
  echo 'ASSERTION_FAILED migration_095_direct_app_users_is_active_dependency=true' >&2
  exit 1
fi
grep -Fq 'projectpulse095_user_record_is_active(to_jsonb(u))' \
  "$ROOT/database/migrations/095_project_planning_collaboration_access.sql" \
  || { echo 'ASSERTION_FAILED migration_095_user_status_compatibility_missing=true' >&2; exit 1; }
echo 'ASSERTION_PASSED migration_095_user_status_compatibility=true'
'''.strip()
          if 'migration_095_user_status_compatibility=true' not in test_source:
              anchor = 'for required in \\\n'
              if anchor not in test_source:
                  raise SystemExit('Migration 095 test artifact boundary was not found.')
              test_source = test_source.replace(anchor, static_gate + '\n\n' + anchor, 1)
              test.write_text(test_source, encoding='utf-8')

          runner_source = runner.read_text(encoding='utf-8')
          if 'project-planning-collaboration-migration-job.log' not in runner_source:
              old = '''az containerapp job logs show -g "$RESOURCE_GROUP" -n "$JOB_NAME" \\
  --execution "$EXECUTION_NAME" --container "$JOB_NAME" --tail 250 --only-show-errors >&2 || true
fail "The protected Test project-planning collaboration migration job did not succeed."'''
              new = '''if [[ -n "${EVIDENCE_DIR:-}" ]]; then
  install -d -m 0700 "$EVIDENCE_DIR"
  az containerapp job logs show -g "$RESOURCE_GROUP" -n "$JOB_NAME" \\
    --execution "$EXECUTION_NAME" --container "$JOB_NAME" --tail 500 --only-show-errors \\
    > "$EVIDENCE_DIR/project-planning-collaboration-migration-job.log" 2>&1 || true
fi
az containerapp job logs show -g "$RESOURCE_GROUP" -n "$JOB_NAME" \\
  --execution "$EXECUTION_NAME" --container "$JOB_NAME" --tail 500 --only-show-errors >&2 || true
fail "The protected Test project-planning collaboration migration job did not succeed."'''
              if old not in runner_source:
                  raise SystemExit('Migration 095 failure-log boundary was not found exactly.')
              runner.write_text(runner_source.replace(old, new, 1), encoding='utf-8')

          changed = [
              migration,
              rollback,
              test,
              runner,
          ]
          for path in changed:
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f'Repair produced a missing or empty file: {path}')
          print(f'MIGRATION_095_DIRECT_USER_STATUS_REFERENCES_REPLACED={direct_count}')
          print('MIGRATION_095_SCHEMA_COMPATIBILITY_REPAIR=READY')
          PY
          git diff --check

      - name: Run focused migration regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/test-project-planning-collaboration-migration-095.sh
          bash tests/test-project-planning-document-authority-migration-096.sh
          node tests/validate-project-planning-collaboration.mjs
          node tests/validate-project-planning-collaboration-access.mjs
          node tests/validate-shared-project-document-planning.mjs
          bash -n scripts/release-test/run-project-planning-collaboration-migration-job.sh
          git diff --check

      - name: Publish permanent repair to PR 737
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          [[ "$remote_head" == "$EXPECTED_HEAD" ]] || {
            echo "ERROR: PR #737 moved during repair: $remote_head" >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            database/migrations/095_project_planning_collaboration_access.sql \
            database/rollback/095_project_planning_collaboration_access_rollback.sql \
            tests/test-project-planning-collaboration-migration-095.sh \
            scripts/release-test/run-project-planning-collaboration-migration-job.sh
          git diff --cached --check
          git commit -m 'Make project planning migration compatible with Test user schema'
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "PR737_PERMANENT_REPAIR_SHA=$(git rev-parse HEAD)"
          echo 'PRODUCTION_MUTATION=NONE'
