name: Validate Deployment Concurrency Governance

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/validate-deployment-concurrency-governance.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/validate-deployment-concurrency-governance.mjs'

permissions:
  contents: read

concurrency:
  group: deployment-concurrency-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Enforce one environment-wide deployment lock
        run: node scripts/validate-deployment-concurrency-governance.mjs
