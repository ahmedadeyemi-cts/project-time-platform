name: Guarded FlowHive Bundle Marker Repair

on:
  push:
    branches:
      - fix/protected-test-flowhive-bundle-marker-20260815
    paths:
      - '.github/workflows/temporary-flowhive-bundle-marker-repair-20260815.yml'

permissions:
  contents: read

jobs:
  repair:
    name: Validate and package FlowHive marker repair
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STATUS_FILE: /tmp/flowhive-marker-publisher-status.log
      PACKAGE_ROOT: /tmp/flowhive-marker-repair
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/protected-test-flowhive-bundle-marker-20260815
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Initialize diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo 'FLOWHIVE_BUNDLE_MARKER_REPAIR=STARTED'
            echo "TRIGGER_SHA=$GITHUB_SHA"
            echo 'PRODUCTION_MUTATION=NONE'
            echo 'TEST_MUTATION=NONE'
            echo 'SECRET_ACCESS=NONE'
          } > "$STATUS_FILE"

      - name: Apply focused two-file repair
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "STAGE=apply RESULT=FAIL EXIT_CODE=%s LINE=%s COMMAND=%q\n" "$rc" "$LINENO" "$BASH_COMMAND" >> "$STATUS_FILE"; exit "$rc"' ERR
          echo 'STAGE=apply RESULT=STARTED' >> "$STATUS_FILE"

          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo 'ERROR: Checkout does not match the exact triggering commit.' >&2
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/projectpulse-deploy-test.yml')
          source = workflow.read_text(encoding='utf-8')
          old = "'FlowHive enterprise workspace is not ready'"
          new = "'FlowHive enterprise controls are temporarily unavailable.'"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'workflow FlowHive marker: expected one stale marker, found {count}')
          workflow.write_text(source.replace(old, new, 1), encoding='utf-8')

          validator = Path('tests/validate-systemwide-enterprise-reliability.mjs')
          source = validator.read_text(encoding='utf-8')
          anchor = "rejectText(deployment, \"'Customer from Customer Directory'\", 'stale case-sensitive customer-selector marker');\n"
          insert = (
              anchor
              + "requireText(deployment, \"'FlowHive enterprise controls are temporarily unavailable.'\", 'deployed FlowHive degraded-state marker');\n"
              + "rejectText(deployment, \"'FlowHive enterprise workspace is not ready'\", 'stale FlowHive bundle marker');\n"
          )
          count = source.count(anchor)
          if count != 1:
              raise SystemExit(f'validator marker anchor: expected one match, found {count}')
          validator.write_text(source.replace(anchor, insert, 1), encoding='utf-8')
          PY

          git diff --check
          echo 'STAGE=apply RESULT=PASS' >> "$STATUS_FILE"

      - name: Run focused source validators
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "STAGE=source_validation RESULT=FAIL EXIT_CODE=%s LINE=%s COMMAND=%q\n" "$rc" "$LINENO" "$BASH_COMMAND" >> "$STATUS_FILE"; exit "$rc"' ERR
          echo 'STAGE=source_validation RESULT=STARTED' >> "$STATUS_FILE"
          node tests/validate-systemwide-enterprise-reliability.mjs
          node tests/validate-systemwide-image-build-controller.mjs
          node tests/validate-utilization-role-scoping.mjs
          echo 'STAGE=source_validation RESULT=PASS' >> "$STATUS_FILE"

      - name: Build production frontend and prove every bundle marker
        shell: bash
        working-directory: src/frontend/project-time-web
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "STAGE=frontend_build RESULT=FAIL EXIT_CODE=%s LINE=%s COMMAND=%q\n" "$rc" "$LINENO" "$BASH_COMMAND" >> "$STATUS_FILE"; exit "$rc"' ERR
          echo 'STAGE=frontend_build RESULT=STARTED' >> "$STATUS_FILE"

          npm ci --no-audit --no-fund
          npm run build

          BUNDLE="$RUNNER_TEMP/protected-test-frontend-bundle.txt"
          find dist/assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | xargs -0 cat > "$BUNDLE"
          for marker in \
            'pulse-display-utility-dock' \
            'Evidence score' \
            'Project Cost Alerts' \
            'Data incomplete' \
            'Select or type a customer' \
            'FlowHive enterprise controls are temporarily unavailable.' \
            'Login, logout & sessions'; do
            if grep -Fq "$marker" "$BUNDLE"; then
              printf 'FRONTEND_MARKER=PASS VALUE=%s\n' "$marker" | tee -a "$STATUS_FILE"
            else
              printf 'FRONTEND_MARKER=FAIL VALUE=%s\n' "$marker" | tee -a "$STATUS_FILE" >&2
              exit 1
            fi
          done

          echo 'STAGE=frontend_build RESULT=PASS' >> "$STATUS_FILE"

      - name: Verify net scope and package validated files
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "STAGE=package RESULT=FAIL EXIT_CODE=%s LINE=%s COMMAND=%q\n" "$rc" "$LINENO" "$BASH_COMMAND" >> "$STATUS_FILE"; exit "$rc"' ERR
          echo 'STAGE=package RESULT=STARTED' >> "$STATUS_FILE"

          git diff --check
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            '.github/workflows/projectpulse-deploy-test.yml'
            'tests/validate-systemwide-enterprise-reliability.mjs'
          )
          [[ "${changed[*]}" == "${expected[*]}" ]] || {
            echo 'ERROR: Working-tree scope is not the approved two-file repair.' >&2
            printf 'CHANGED_FILES=%s\n' "${changed[*]}" >> "$STATUS_FILE"
            exit 1
          }

          install -d -m 0700 \
            "$PACKAGE_ROOT/.github/workflows" \
            "$PACKAGE_ROOT/tests"
          cp .github/workflows/projectpulse-deploy-test.yml \
            "$PACKAGE_ROOT/.github/workflows/projectpulse-deploy-test.yml"
          cp tests/validate-systemwide-enterprise-reliability.mjs \
            "$PACKAGE_ROOT/tests/validate-systemwide-enterprise-reliability.mjs"
          sha256sum \
            "$PACKAGE_ROOT/.github/workflows/projectpulse-deploy-test.yml" \
            "$PACKAGE_ROOT/tests/validate-systemwide-enterprise-reliability.mjs" \
            > "$PACKAGE_ROOT/SHA256SUMS"

          echo 'STAGE=package RESULT=PASS' >> "$STATUS_FILE"
          echo 'FLOWHIVE_BUNDLE_MARKER_REPAIR=VALIDATED' >> "$STATUS_FILE"

      - name: Upload validated two-file repair
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-flowhive-marker-repair-${{ github.run_id }}
          path: /tmp/flowhive-marker-repair
          if-no-files-found: error
          retention-days: 2

      - name: Upload redacted diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flowhive-marker-repair-diagnostics-${{ github.run_id }}
          path: /tmp/flowhive-marker-publisher-status.log
          if-no-files-found: warn
          retention-days: 2
