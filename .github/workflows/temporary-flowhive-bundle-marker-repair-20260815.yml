name: Guarded FlowHive Bundle Marker Repair

on:
  push:
    branches:
      - fix/protected-test-flowhive-bundle-marker-20260815
    paths:
      - '.github/workflows/temporary-flowhive-bundle-marker-repair-20260815.yml'

permissions:
  contents: write

jobs:
  repair:
    name: Repair, validate, and publish FlowHive marker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/protected-test-flowhive-bundle-marker-20260815
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Apply focused repair, validate, and publish
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo 'ERROR: Checkout does not match the exact triggering commit.' >&2
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/projectpulse-deploy-test.yml')
          source = workflow.read_text(encoding='utf-8')
          old = "            'FlowHive enterprise workspace is not ready' \\\n"
          new = "            'FlowHive enterprise controls are temporarily unavailable.' \\\n"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'workflow FlowHive marker: expected one stale marker, found {count}')
          workflow.write_text(source.replace(old, new, 1), encoding='utf-8')

          validator = Path('tests/validate-systemwide-enterprise-reliability.mjs')
          source = validator.read_text(encoding='utf-8')
          anchor = "rejectText(deployment, \"'Customer from Customer Directory'\", 'stale case-sensitive customer-selector marker');\n"
          insert = (
              anchor
              + "requireText(deployment, \"'FlowHive enterprise controls are temporarily unavailable.'\", 'deployed FlowHive degraded-state marker');\n"
              + "rejectText(deployment, \"'FlowHive enterprise workspace is not ready'\", 'stale FlowHive bundle marker');\n"
          )
          count = source.count(anchor)
          if count != 1:
              raise SystemExit(f'validator marker anchor: expected one match, found {count}')
          validator.write_text(source.replace(anchor, insert, 1), encoding='utf-8')
          PY

          node tests/validate-systemwide-enterprise-reliability.mjs
          node tests/validate-systemwide-image-build-controller.mjs
          node tests/validate-utilization-role-scoping.mjs

          pushd src/frontend/project-time-web >/dev/null
          npm ci --no-audit --no-fund
          npm run build
          BUNDLE="$RUNNER_TEMP/protected-test-frontend-bundle.txt"
          find dist/assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | xargs -0 cat > "$BUNDLE"
          for marker in \
            'pulse-display-utility-dock' \
            'Evidence score' \
            'Project Cost Alerts' \
            'Data incomplete' \
            'Select or type a customer' \
            'FlowHive enterprise controls are temporarily unavailable.' \
            'Login, logout & sessions'; do
            grep -Fq "$marker" "$BUNDLE" || {
              echo "ERROR: Production frontend bundle is missing marker: $marker" >&2
              exit 1
            }
            echo "FRONTEND_MARKER=PASS value=$marker"
          done
          popd >/dev/null

          git diff --check
          git rm -- .github/workflows/temporary-flowhive-bundle-marker-repair-20260815.yml
          git add -- \
            .github/workflows/projectpulse-deploy-test.yml \
            tests/validate-systemwide-enterprise-reliability.mjs

          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/projectpulse-deploy-test.yml'
            'tests/validate-systemwide-enterprise-reliability.mjs'
          )
          [[ "${changed[*]}" == "${expected[*]}" ]] || {
            echo 'ERROR: Staged scope is not the approved two-file repair.' >&2
            printf 'Changed: %s\n' "${changed[*]}" >&2
            exit 1
          }

          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align protected-Test FlowHive degraded-state marker'
          git push origin HEAD:refs/heads/fix/protected-test-flowhive-bundle-marker-20260815

          echo 'FLOWHIVE_BUNDLE_MARKER_REPAIR=PASS'
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'APPLICATION_SOURCE_CHANGE=NONE'
          echo 'MIGRATION_CHANGE=NONE'
