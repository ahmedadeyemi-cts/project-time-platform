name: Prepare Oracle activation v2 same-origin correction

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/patch-oracle-activation-v2-same-origin.yml'

permissions:
  contents: read

concurrency:
  group: prepare-oracle-activation-v2-same-origin
  cancel-in-progress: true

jobs:
  prepare:
    name: Build exact corrected activation workflow artifact
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/celar-oracle-activation-v2-same-origin-20260811'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/celar-oracle-activation-v2-same-origin-20260811
          fetch-depth: 0
          persist-credentials: false

      - name: Patch only the Module 064 UAT browser-origin header
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/celar-ai-oracle-test-runtime-activation-v2.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          AUTH_064=(-H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" -H 'X-ProjectPulse-Module-Number: 064' -H "Origin: $BASE" -H 'Cache-Control: no-cache')'''
          new = '''          AUTH_064=(-H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" -H 'X-ProjectPulse-Module-Number: 064' -H "Origin: $BASE" -H 'Sec-Fetch-Site: same-origin' -H 'Cache-Control: no-cache')'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Module 064 UAT header row, found {count}.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          grep -Fq -- "-H 'Sec-Fetch-Site: same-origin'" .github/workflows/celar-ai-oracle-test-runtime-activation-v2.yml
          grep -Fq 'requireSameOrigin: true' src/backend/ProjectTime.Api/Modules/CelarAiCapabilityRoutingModule.cs
          grep -Fq 'Sec-Fetch-Site' src/backend/ProjectTime.Api/Modules/CelarAiCapabilityRoutingModule.cs
          git diff --check
          git diff --numstat -- .github/workflows/celar-ai-oracle-test-runtime-activation-v2.yml | grep -Eq '^1[[:space:]]+1[[:space:]]+'

      - name: Upload exact corrected workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corrected-oracle-activation-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/workflows/celar-ai-oracle-test-runtime-activation-v2.yml
          if-no-files-found: error
          retention-days: 2

      - name: Publish bounded preparation summary
        shell: bash
        run: |
          {
            echo '## Oracle activation-v2 same-origin correction prepared'
            echo
            echo '- Changed workflow: `celar-ai-oracle-test-runtime-activation-v2.yml`'
            echo '- Functional change: one same-origin browser metadata header'
            echo '- API authorization changes: none'
            echo '- Test mutation: none'
            echo '- Production mutation: none'
          } >> "$GITHUB_STEP_SUMMARY"
