name: Module Surface Contrast CI

on:
  pull_request:
    paths:
      - '.github/workflows/module-surface-contrast-ci.yml'
      - 'src/frontend/project-time-web/src/**'
      - 'src/frontend/project-time-web/scripts/*surface*'
      - 'src/frontend/project-time-web/package*.json'
      - 'src/frontend/project-time-web/vite.config.js'

permissions:
  contents: read

concurrency:
  group: module-surface-contrast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  surfaces:
    name: Module surfaces (${{ matrix.browser }}, ${{ matrix.layout }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        layout: [table, enterprise, classic]
    env:
      SURFACE_TYPESCRIPT_MODULE: ${{ runner.temp }}/surface-tools/node_modules/typescript/lib/typescript.js
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build the complete frontend without source drift
        run: |
          npm ci --prefix src/frontend/project-time-web
          npm run build --prefix src/frontend/project-time-web
          git diff --exit-code
      - name: Install isolated source-parser and browser-test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/surface-tools" --ignore-scripts --no-audit --no-fund typescript@5.8.3
          python3 -m venv "$RUNNER_TEMP/surface-venv"
          "$RUNNER_TEMP/surface-venv/bin/pip" install playwright==1.55.0 Pillow==11.3.0
          "$RUNNER_TEMP/surface-venv/bin/python" -m playwright install --with-deps '${{ matrix.browser }}'
      - name: Derive fixtures and preserve source provenance
        working-directory: src/frontend/project-time-web
        run: |
          mkdir -p "$RUNNER_TEMP/module-surface-evidence"
          node --check scripts/generate-module-surface-fixtures.cjs
          "$RUNNER_TEMP/surface-venv/bin/python" -m py_compile scripts/validate-module-surface-contrast.py
          node scripts/generate-module-surface-fixtures.cjs "$PWD" "$RUNNER_TEMP/module-surface-evidence/fixtures.json"
          git rev-parse HEAD > "$RUNNER_TEMP/module-surface-evidence/checkout.txt"
          sha256sum src/enterprise/enterprise-owned-surface-contrast.css scripts/generate-module-surface-fixtures.cjs scripts/validate-module-surface-contrast.py > "$RUNNER_TEMP/module-surface-evidence/source-sha256.txt"
      - name: Verify every source-derived module fixture in both theme ownership modes
        working-directory: src/frontend/project-time-web
        run: |
          "$RUNNER_TEMP/surface-venv/bin/python" scripts/validate-module-surface-contrast.py \
            --fixtures "$RUNNER_TEMP/module-surface-evidence/fixtures.json" \
            --browsers '${{ matrix.browser }}' --layouts '${{ matrix.layout }}' \
            --output "$RUNNER_TEMP/module-surface-evidence/desktop"
      - name: Verify the reported On-Call and OEM surfaces at compact width
        working-directory: src/frontend/project-time-web
        run: |
          "$RUNNER_TEMP/surface-venv/bin/python" scripts/validate-module-surface-contrast.py \
            --fixtures "$RUNNER_TEMP/module-surface-evidence/fixtures.json" \
            --browsers '${{ matrix.browser }}' --layouts '${{ matrix.layout }}' \
            --filter 'OnCallSchedulingCenter|OemVendorDirectoryCenter' --width 800 \
            --output "$RUNNER_TEMP/module-surface-evidence/compact"
          git diff --exit-code
      - name: Retain measurements, uncovered text, source inventory and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: module-surface-contrast-${{ matrix.browser }}-${{ matrix.layout }}-${{ github.run_id }}
          path: ${{ runner.temp }}/module-surface-evidence
          if-no-files-found: warn
          retention-days: 7
