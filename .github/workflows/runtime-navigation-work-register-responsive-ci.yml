name: Runtime Navigation, Work Register, and Responsive Workspace CI

on:
  pull_request:
    paths:
      - '.github/workflows/runtime-navigation-work-register-responsive-ci.yml'
      - '.github/workflows/projectpulse-deploy-test.yml'
      - 'src/backend/ProjectTime.Api/Modules/ProjectManagementWorkRegisterScope.cs'
      - 'src/frontend/project-time-web/scripts/validate-runtime-navigation-work-register-responsive.mjs'
      - 'src/frontend/project-time-web/src/App.jsx'
      - 'src/frontend/project-time-web/src/ApprovalMailbox.jsx'
      - 'src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx'
      - 'src/frontend/project-time-web/src/approval-access-navigation-compatibility.js'
      - 'src/frontend/project-time-web/src/module-directory-authority.js'
      - 'src/frontend/project-time-web/src/unified-project-financial-workspace.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-navigation-work-register-responsive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate modules, 055C, optional APIs, and responsive metrics
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard the focused source boundary
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort -u > /tmp/runtime-repair-changed.txt

          cat > /tmp/runtime-repair-signatures.txt <<'EOF'
          .github/pr698-payload/chunk-000.b64
          database/migrations/091_module_management_owner_storage_repair.sql
          src/backend/ProjectTime.Api/Modules/ProjectManagementWorkRegisterScope.cs
          src/frontend/project-time-web/scripts/validate-runtime-navigation-work-register-responsive.mjs
          src/frontend/project-time-web/src/ApprovalMailbox.jsx
          src/frontend/project-time-web/src/ModuleManagementTableView.jsx
          src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx
          src/frontend/project-time-web/src/WorkspaceNavigationPortal.jsx
          src/frontend/project-time-web/src/approval-access-navigation-compatibility.js
          src/frontend/project-time-web/src/unified-project-financial-workspace.css
          src/frontend/project-time-web/src/work-register-document-integrity.js
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/runtime-repair-signatures.txt
          LC_ALL=C sort -u /tmp/runtime-repair-signatures.txt -o /tmp/runtime-repair-signatures.txt
          package_specific="$(comm -12 /tmp/runtime-repair-changed.txt /tmp/runtime-repair-signatures.txt)"
          if [[ -z "$package_specific" ]]; then
            echo 'RUNTIME_REPAIR_SOURCE_BOUNDARY=SKIPPED_SHARED_DEPENDENCY_REGRESSION'
            echo 'The full focused validator and production builds will still run.'
            exit 0
          fi
          printf 'RUNTIME_REPAIR_PACKAGE_SOURCE_DETECTED:\n%s\n' "$package_specific"

          cat > /tmp/runtime-repair-allowed.txt <<'EOF'
          .github/workflows/projectpulse-deploy-test.yml
          .github/workflows/runtime-navigation-work-register-responsive-ci.yml
          src/backend/ProjectTime.Api/Modules/ProjectManagementWorkRegisterScope.cs
          src/frontend/project-time-web/scripts/validate-runtime-navigation-work-register-responsive.mjs
          src/frontend/project-time-web/src/App.jsx
          src/frontend/project-time-web/src/ApprovalMailbox.jsx
          src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx
          src/frontend/project-time-web/src/approval-access-navigation-compatibility.js
          src/frontend/project-time-web/src/module-directory-authority.js
          src/frontend/project-time-web/src/unified-project-financial-workspace.css
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/runtime-repair-allowed.txt
          LC_ALL=C sort -u /tmp/runtime-repair-allowed.txt -o /tmp/runtime-repair-allowed.txt

          cat > /tmp/runtime-repair-combined-reviewed.txt <<'EOF'
          .github/pr698-payload/chunk-000.b64
          .github/pr698-payload/chunk-001.b64
          .github/pr698-payload/chunk-002.b64
          .github/pr698-payload/chunk-003.b64
          .github/pr698-payload/chunk-004.b64
          .github/pr698-payload/chunk-005.b64
          .github/pr698-payload/chunk-006.b64
          .github/pr698-payload/chunk-007.b64
          .github/pr698-payload/chunk-008.b64
          .github/pr698-payload/chunk-009.b64
          .github/pr698-payload/chunk-010.b64
          .github/workflows/module-management-owner-drawer-ci.yml
          .github/workflows/pr698-finalize-v2.yml
          .github/workflows/pr698-finalize-v3.yml
          .github/workflows/pr698-finalize-v4.yml
          .github/workflows/pr698-finalize.yml
          .github/workflows/pr698-trigger-finalize-v4.yml
          .github/workflows/pr698-workspace-navigation-diagnostic.yml
          .github/workflows/runtime-navigation-work-register-responsive-ci.yml
          database/migrations/091_module_management_owner_storage_repair.sql
          database/rollback/091_module_management_owner_storage_repair_rollback.sql
          src/backend/ProjectTime.Api/Modules/ProjectManagementWorkRegisterScope.cs
          src/backend/ProjectTime.Api/Program.cs
          src/frontend/project-time-web/scripts/validate-view-as-modules-work-register-documents.mjs
          src/frontend/project-time-web/scripts/validate-workspace-navigation.mjs
          src/frontend/project-time-web/src/GlobalViewAsDrawer.jsx
          src/frontend/project-time-web/src/ModuleManagementTableView.jsx
          src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx
          src/frontend/project-time-web/src/PageContextGuide.jsx
          src/frontend/project-time-web/src/WorkRegisterCenter.jsx
          src/frontend/project-time-web/src/WorkspaceNavigationPortal.jsx
          src/frontend/project-time-web/src/module-directory-authority.js
          src/frontend/project-time-web/src/module-management-table.css
          src/frontend/project-time-web/src/view-as-storage-compatibility.js
          src/frontend/project-time-web/src/work-register-document-integrity.js
          tests/validate-module-management-owner-drawer.mjs
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/runtime-repair-combined-reviewed.txt
          LC_ALL=C sort -u /tmp/runtime-repair-combined-reviewed.txt -o /tmp/runtime-repair-combined-reviewed.txt

          cat > /tmp/runtime-repair-pr719-reviewed.txt <<'EOF'
          .github/workflows/module-loading-assignment-propagation-ci.yml
          .github/workflows/module-management-owner-drawer-ci.yml
          .github/workflows/projectpulse-release-test-control-ci.yml
          .github/workflows/runtime-navigation-work-register-responsive-ci.yml
          scripts/release-test/run-assigned-work-protected-test-uat.sh
          src/backend/ProjectTime.Api/Modules/Module001AEngineerTaskCloseoutModule.cs
          src/backend/ProjectTime.Api/Modules/ModuleCatalogOwnershipModule.cs
          src/frontend/project-time-web/scripts/validate-module-loading-assignment-propagation.mjs
          src/frontend/project-time-web/scripts/validate-modules-directory-page.mjs
          src/frontend/project-time-web/src/EngineerTaskCloseoutCenter.jsx
          src/frontend/project-time-web/src/ModuleManagementTableView.jsx
          src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx
          src/frontend/project-time-web/src/background-request-role-gate.js
          tests/validate-module-management-owner-drawer.mjs
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/runtime-repair-pr719-reviewed.txt
          LC_ALL=C sort -u /tmp/runtime-repair-pr719-reviewed.txt -o /tmp/runtime-repair-pr719-reviewed.txt

          if cmp -s /tmp/runtime-repair-changed.txt /tmp/runtime-repair-combined-reviewed.txt; then
            echo 'COMBINED_REPAIR_EXACT_SOURCE_BOUNDARY=PASS'
          elif cmp -s /tmp/runtime-repair-changed.txt /tmp/runtime-repair-pr719-reviewed.txt; then
            echo 'PR719_RUNTIME_COMBINED_SOURCE_BOUNDARY=PASS'
          else
            unexpected="$(comm -23 /tmp/runtime-repair-changed.txt /tmp/runtime-repair-allowed.txt)"
            [[ -z "$unexpected" ]] || {
              printf 'Unexpected source:\n%s\n' "$unexpected" >&2
              exit 1
            }
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci

      - name: Validate focused runtime contract
        working-directory: src/frontend/project-time-web
        run: |
          node ./scripts/validate-runtime-navigation-work-register-responsive.mjs
          node ./scripts/validate-enterprise-ui-polish.mjs

      - name: Build API Release
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj -c Release

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Preserve PR 697 presentation package and clean source
        shell: bash
        run: |
          set -Eeuo pipefail
          node src/frontend/project-time-web/scripts/validate-enterprise-ui-polish.mjs
          git diff --check
          git diff --exit-code
