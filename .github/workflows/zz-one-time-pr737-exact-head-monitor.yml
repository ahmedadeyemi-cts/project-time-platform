name: One-time PR 737 exact-head validation and Test monitor

on:
  push:
    branches:
      - fix/shared-project-document-planning-20260819
    paths:
      - .github/workflows/zz-one-time-pr737-exact-head-monitor.yml

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: pr737-exact-head-monitor
  cancel-in-progress: true

jobs:
  monitor:
    if: github.event.head_commit.message == 'Start PR 737 exact-head validation monitor'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ahmedadeyemi-cts/project-time-platform
      PR_NUMBER: '737'
      EXPECTED_HEAD_BRANCH: fix/shared-project-document-planning-20260819
      EVIDENCE_BRANCH: ops/pr737-check-monitor-20260823
      EVIDENCE_ROOT: docs/architecture/pr737-monitor
      TRIGGER_PATH: docs/architecture/pr737-protected-uat-ci-trigger.md
      DEPLOY_WORKFLOW: projectpulse-deploy-test.yml
    steps:
      - name: Check out the exact monitor event
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create a clean PR head and monitor it from isolated evidence branch
        shell: bash
        run: |
          set -Eeuo pipefail

          self_path='.github/workflows/zz-one-time-pr737-exact-head-monitor.yml'
          evidence_ready=0
          stage='initialization'
          clean_sha=''
          checked_sha=''
          deployment_run_id=''
          deployment_run_url=''

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          comment() {
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$1" || true
          }

          publish_evidence() {
            local filename="$1"
            local title="$2"
            local body="$3"
            mkdir -p "$EVIDENCE_ROOT"
            cat > "$EVIDENCE_ROOT/$filename" <<EOF
          # $title

          $body

          Monitor run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Production mutation: **NONE**.
          EOF
            git add "$EVIDENCE_ROOT/$filename"
            if ! git diff --cached --quiet; then
              git commit -m "chore(pr737-monitor): ${filename%.md}"
              git push origin "HEAD:${EVIDENCE_BRANCH}"
            fi
          }

          terminal_failure() {
            local rc=$?
            set +e
            if [[ $evidence_ready -eq 1 ]]; then
              publish_evidence \
                'monitor-failed.md' \
                'PR #737 exact-head monitor failed' \
                "Stage: \`${stage}\`. Exit code: \`${rc}\`. Clean PR SHA: \`${clean_sha:-unavailable}\`. Checked SHA: \`${checked_sha:-unavailable}\`. Deployment run ID: \`${deployment_run_id:-not-created}\`."
            fi
            comment "PR #${PR_NUMBER} exact-head monitor stopped at **${stage}** with exit code ${rc}. Clean SHA: \`${clean_sha:-unavailable}\`; checked SHA: \`${checked_sha:-unavailable}\`; deployment run: ${deployment_run_id:-not-created}. Production mutation: NONE. Monitor: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            exit "$rc"
          }
          trap terminal_failure ERR

          stage='clean-head-publication'
          test "$GITHUB_REF_NAME" = "$EXPECTED_HEAD_BRANCH"
          git fetch origin "$EXPECTED_HEAD_BRANCH" main
          event_sha="$(git rev-parse HEAD)"
          test "$event_sha" = "$(git rev-parse "origin/$EXPECTED_HEAD_BRANCH")"
          test -f "$self_path"
          rm "$self_path"
          git add "$self_path"
          git commit -m 'Remove temporary PR 737 exact-head monitor controller'
          clean_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${EXPECTED_HEAD_BRANCH}"
          test "$clean_sha" = "$(git ls-remote origin "refs/heads/${EXPECTED_HEAD_BRANCH}" | awk '{print $1}')"

          stage='evidence-branch-publication'
          git switch -C pr737-monitor-evidence "$clean_sha"
          git push --force origin "HEAD:${EVIDENCE_BRANCH}"
          evidence_ready=1
          publish_evidence \
            'monitor-ready.md' \
            'PR #737 exact-head monitor is ready' \
            "The temporary controller was removed. Clean PR head: \`${clean_sha}\`. Waiting for a connector-authenticated update to \`${TRIGGER_PATH}\` before evaluating the complete check suite."
          comment "PR #${PR_NUMBER} exact-head monitor is ready. Temporary controller removed; clean PR head is \`${clean_sha}\`. A connector-authenticated update to \`${TRIGGER_PATH}\` can now trigger the complete suite without leaving monitoring code on the PR branch."

          stage='connector-trigger-wait'
          trigger_sha=''
          for _ in $(seq 1 80); do
            current_sha="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq '.headRefOid')"
            if [[ -n "$current_sha" && "$current_sha" != "$clean_sha" ]]; then
              trigger_sha="$current_sha"
              break
            fi
            sleep 5
          done
          test -n "$trigger_sha"
          git fetch origin "$EXPECTED_HEAD_BRANCH"
          test "$trigger_sha" = "$(git rev-parse "origin/$EXPECTED_HEAD_BRANCH")"
          changed_paths="$(git diff --name-only "$clean_sha" "$trigger_sha" | sed '/^$/d')"
          test "$changed_paths" = "$TRIGGER_PATH"
          checked_sha="$trigger_sha"
          publish_evidence \
            'connector-trigger-detected.md' \
            'PR #737 connector-authenticated full-suite trigger detected' \
            "Exact candidate SHA: \`${checked_sha}\`. The only change after the clean handoff was \`${TRIGGER_PATH}\`."
          comment "PR #${PR_NUMBER} complete-suite trigger detected. Exact candidate SHA: \`${checked_sha}\`; sole handoff change: \`${TRIGGER_PATH}\`. Waiting for all latest checks to settle."

          actions_snapshot() {
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPOSITORY}/actions/runs?head_sha=${checked_sha}&per_page=100" \
              | jq '{
                  latest: (
                    [.workflow_runs[]]
                    | sort_by(.workflow_id, .run_number, .run_attempt)
                    | group_by(.workflow_id)
                    | map(max_by(.run_number, .run_attempt))
                  )
                }'
          }

          checks_snapshot() {
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPOSITORY}/commits/${checked_sha}/check-runs?filter=latest&per_page=100" \
              | jq '{checks: [.check_runs[] | {id,name,status,conclusion,details_url,started_at,completed_at}]}'
          }

          statuses_snapshot() {
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPOSITORY}/commits/${checked_sha}/status" \
              | jq '{state,total_count,statuses: [.statuses[] | {id,context,state,target_url}]}'
          }

          combined_snapshot() {
            jq -n \
              --argjson actions "$(actions_snapshot)" \
              --argjson checks "$(checks_snapshot)" \
              --argjson statuses "$(statuses_snapshot)" \
              '{actions:$actions,checks:$checks,statuses:$statuses}'
          }

          wait_for_terminal_suite() {
            local last_signature=''
            local stable=0
            local snapshot=''
            local action_count=0
            local check_count=0
            local pending=0
            for _ in $(seq 1 300); do
              snapshot="$(combined_snapshot)"
              action_count="$(jq '.actions.latest | length' <<<"$snapshot")"
              check_count="$(jq '.checks.checks | length' <<<"$snapshot")"
              pending="$(jq '[.actions.latest[] | select(.status != "completed")] | length' <<<"$snapshot")"
              pending=$((pending + $(jq '[.checks.checks[] | select(.status != "completed")] | length' <<<"$snapshot")))
              if [[ "$(jq -r '.statuses.state' <<<"$snapshot")" == 'pending' ]]; then
                pending=$((pending + 1))
              fi
              signature="$(jq -c '{a:[.actions.latest[]|{id,status,conclusion,run_attempt}],c:[.checks.checks[]|{id,status,conclusion}],s:.statuses.state}' <<<"$snapshot")"
              if [[ "$action_count" -gt 0 && "$check_count" -gt 0 && "$pending" -eq 0 && "$signature" == "$last_signature" ]]; then
                stable=$((stable + 1))
              else
                stable=0
              fi
              if [[ "$action_count" -gt 0 && "$check_count" -gt 0 && "$pending" -eq 0 && "$stable" -ge 3 ]]; then
                printf '%s' "$snapshot"
                return 0
              fi
              last_signature="$signature"
              sleep 15
            done
            return 1
          }

          stage='complete-suite-validation'
          suite="$(wait_for_terminal_suite)"

          action_failures="$(jq -c '[.actions.latest[] | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")]' <<<"$suite")"
          action_failure_count="$(jq 'length' <<<"$action_failures")"
          check_failure_count="$(jq '[.checks.checks[] | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")] | length' <<<"$suite")"
          status_state="$(jq -r '.statuses.state' <<<"$suite")"

          if [[ "$action_failure_count" -gt 0 ]]; then
            retry_names="$(jq -r '[.[] | (.name + " (run " + (.id|tostring) + ")")] | join(", ")' <<<"$action_failures")"
            comment "PR #${PR_NUMBER} exact-head suite found failed Actions runs on \`${checked_sha}\`: ${retry_names}. One failed-job rerun is being attempted before declaring a persistent failure."
            jq -r '.[].id' <<<"$action_failures" | while read -r run_id; do
              [[ -z "$run_id" ]] && continue
              gh run rerun "$run_id" --repo "$REPOSITORY" --failed || gh run rerun "$run_id" --repo "$REPOSITORY" || true
            done
            sleep 10
            suite="$(wait_for_terminal_suite)"
            action_failures="$(jq -c '[.actions.latest[] | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")]' <<<"$suite")"
            action_failure_count="$(jq 'length' <<<"$action_failures")"
            check_failure_count="$(jq '[.checks.checks[] | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")] | length' <<<"$suite")"
            status_state="$(jq -r '.statuses.state' <<<"$suite")"
          fi

          if [[ "$action_failure_count" -gt 0 || "$check_failure_count" -gt 0 || "$status_state" == 'failure' || "$status_state" == 'error' ]]; then
            action_names="$(jq -r '[.actions.latest[] | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped") | (.name + " [" + (.conclusion // "unknown") + "] run " + (.id|tostring))] | join("; ")' <<<"$suite")"
            check_names="$(jq -r '[.checks.checks[] | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped") | (.name + " [" + (.conclusion // "unknown") + "]")] | unique | join("; ")' <<<"$suite")"
            printf '%s\n' "$suite" > "$EVIDENCE_ROOT/complete-suite-failed.json"
            publish_evidence \
              'complete-suite-failed.md' \
              'PR #737 complete exact-head suite failed' \
              "Exact SHA: \`${checked_sha}\`. Failed Actions: ${action_names:-none}. Failed checks: ${check_names:-none}. Combined status: \`${status_state}\`."
            comment "PR #${PR_NUMBER} complete exact-head suite is **not green** on \`${checked_sha}\` after one rerun attempt. Failed Actions: ${action_names:-none}. Failed checks: ${check_names:-none}. Combined status: ${status_state}. No deployment of this SHA and no Production action occurred."
            trap - ERR
            exit 2
          fi

          latest_pr_sha="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$latest_pr_sha" = "$checked_sha"
          action_count="$(jq '.actions.latest | length' <<<"$suite")"
          check_count="$(jq '.checks.checks | length' <<<"$suite")"
          publish_evidence \
            'complete-suite-green.md' \
            'PR #737 complete exact-head suite passed' \
            "Exact green SHA: \`${checked_sha}\`. Latest Actions workflows: \`${action_count}\`. Latest check runs: \`${check_count}\`. Combined status: \`${status_state}\`."
          comment "PR #${PR_NUMBER} complete exact-head suite is green on \`${checked_sha}\`: ${action_count} latest Actions workflows, ${check_count} latest check runs, combined status ${status_state}. Dispatching this exact SHA to Protected UAT/Test. Production mutation: NONE."

          stage='exact-head-protected-uat-dispatch'
          dispatch_time="$(date -u +%FT%TZ)"
          gh workflow run "$DEPLOY_WORKFLOW" --repo "$REPOSITORY" --ref "$EXPECTED_HEAD_BRANCH"
          for _ in $(seq 1 90); do
            candidates="$(gh run list --repo "$REPOSITORY" --workflow "$DEPLOY_WORKFLOW" --branch "$EXPECTED_HEAD_BRANCH" --event workflow_dispatch --limit 30 --json databaseId,headSha,createdAt,url)"
            deployment_run_id="$(jq -r --arg sha "$checked_sha" --arg after "$dispatch_time" '[.[] | select(.headSha == $sha and .createdAt >= $after)] | sort_by(.createdAt) | last | .databaseId // empty' <<<"$candidates")"
            deployment_run_url="$(jq -r --arg sha "$checked_sha" --arg after "$dispatch_time" '[.[] | select(.headSha == $sha and .createdAt >= $after)] | sort_by(.createdAt) | last | .url // empty' <<<"$candidates")"
            [[ -n "$deployment_run_id" ]] && break
            sleep 5
          done
          test -n "$deployment_run_id"
          publish_evidence \
            'exact-head-test-dispatched.md' \
            'PR #737 exact green SHA dispatched to Protected UAT/Test' \
            "Exact SHA: \`${checked_sha}\`. Deployment run: ${deployment_run_url} (ID \`${deployment_run_id}\`)."
          comment "PR #${PR_NUMBER} exact green SHA \`${checked_sha}\` dispatched to Protected UAT/Test. Run: ${deployment_run_url}; ID: \`${deployment_run_id}\`. Production mutation: NONE."

          stage='exact-head-protected-uat-deployment'
          if ! gh run watch "$deployment_run_id" --repo "$REPOSITORY" --interval 15 --exit-status; then
            gh run view "$deployment_run_id" --repo "$REPOSITORY" --log-failed || true
            publish_evidence \
              'exact-head-test-failed.md' \
              'PR #737 exact-head Protected UAT/Test deployment failed' \
              "Exact SHA: \`${checked_sha}\`. Failed deployment run: ${deployment_run_url} (ID \`${deployment_run_id}\`)."
            comment "PR #${PR_NUMBER} exact green SHA \`${checked_sha}\` failed during Protected UAT/Test deployment run ${deployment_run_id}. Production mutation: NONE."
            trap - ERR
            exit 3
          fi

          publish_evidence \
            'exact-head-test-passed.md' \
            'PR #737 exact green SHA deployed successfully to Protected UAT/Test' \
            "Exact checked and deployed SHA: \`${checked_sha}\`. Successful deployment run: ${deployment_run_url} (ID \`${deployment_run_id}\`)."
          comment "PR #${PR_NUMBER} exact green SHA \`${checked_sha}\` deployed successfully to Protected UAT/Test in run ${deployment_run_id}. Production mutation: NONE. Remaining work: authenticated FlowHive/Project Forge UAT, migration verification, and runtime-SHA confirmation."

          trap - ERR
          echo "PR737_EXACT_HEAD_SUITE=PASSED"
          echo "PR737_EXACT_HEAD_SHA=$checked_sha"
          echo "PR737_PROTECTED_UAT_RUN_ID=$deployment_run_id"
          echo "PRODUCTION_MUTATION=NONE"
