name: Dispatch Exact Candidate Push to Protected Test

on:
  push:
    branches:
      - fix/shared-project-document-planning-20260819

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: protected-uat-candidate-push-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch exact PR head to Protected Test controller
    if: >-
      github.repository == 'ahmedadeyemi-cts/project-time-platform' &&
      github.ref == 'refs/heads/fix/shared-project-document-planning-20260819' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.ref_name }}
      HEAD_SHA: ${{ github.sha }}
      PR_NUMBER: '737'

    steps:
      - name: Require exact governed PR head
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'Candidate SHA is invalid.'
          [[ "$HEAD_BRANCH" == 'fix/shared-project-document-planning-20260819' ]] \
            || fail 'Candidate branch is outside the authorized FlowHive V2 release branch.'

          pr_json="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/pulls/$PR_NUMBER"
          )"

          jq -e \
            --arg sha "$HEAD_SHA" \
            --arg branch "$HEAD_BRANCH" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg owner "$GITHUB_REPOSITORY_OWNER" \
            '.state == "open"
             and .draft == false
             and .base.ref == "main"
             and .head.ref == $branch
             and .head.sha == $sha
             and .head.repo.full_name == $repository
             and .base.repo.full_name == $repository
             and .user.login == $owner' \
            <<<"$pr_json" >/dev/null \
            || fail 'PR #737 is not the exact open governed candidate for this push.'

          echo "PROTECTED_UAT_PUSH_PR_HEAD_VERIFIED=$HEAD_SHA"
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Dispatch exact candidate through existing Protected Test controller
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }

          existing="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/runs?per_page=50"
          )"

          if jq -e --arg sha "$HEAD_SHA" '
            .workflow_runs[]?
            | select(.head_sha == $sha)
            | select(
                .status == "queued"
                or .status == "in_progress"
                or (.status == "completed" and .conclusion == "success")
              )
          ' <<<"$existing" >/dev/null; then
            echo "PROTECTED_UAT_PUSH_DISPATCH=ALREADY_PRESENT"
            echo 'PRODUCTION_MUTATION=NONE'
            exit 0
          fi

          payload="$(
            jq -nc \
              --arg ref "$HEAD_BRANCH" \
              --arg sha "$HEAD_SHA" \
              '{ref:$ref,inputs:{release_sha:$sha,release_branch:$ref}}'
          )"

          http_status="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/protected-uat-push-dispatch-response.json" \
              --write-out '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$API_ROOT/actions/workflows/projectpulse-deploy-test.yml/dispatches"
          )"

          if [[ "$http_status" != '204' ]]; then
            cat "$RUNNER_TEMP/protected-uat-push-dispatch-response.json" >&2 || true
            fail "Protected-Test controller dispatch failed with HTTP $http_status."
          fi

          echo 'PROTECTED_UAT_PUSH_DISPATCH=ACCEPTED'
          echo "PROTECTED_UAT_RELEASE_SHA=$HEAD_SHA"
          echo "PROTECTED_UAT_RELEASE_BRANCH=$HEAD_BRANCH"
          echo 'PRODUCTION_MUTATION=NONE'
