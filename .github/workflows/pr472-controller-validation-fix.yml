name: PR472 One-Time Controller Validation Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr472-controller-validation-fix.yml'

permissions:
  contents: write

concurrency:
  group: pr472-controller-validation-fix
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.head_ref == 'release-controls/pr467-test-a536e33b-20260804' &&
      github.actor == 'ahmedadeyemi-cts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact controller branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Correct file-existence validation and remove this workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/projectpulse-pr467-one-time-test-release-controller.yml')
          source = path.read_text()
          old_apply = "          grep -Fq '067_uat_expense_lifecycle_work_identifiers.sql' \"$(git rev-parse --show-toplevel)/database/migrations/067_uat_expense_lifecycle_work_identifiers.sql\""
          old_rollback = "          grep -Fq '067_uat_expense_lifecycle_work_identifiers_rollback.sql' \"$(git rev-parse --show-toplevel)/database/rollback/067_uat_expense_lifecycle_work_identifiers_rollback.sql\""
          new_apply = "          test -s \"$(git rev-parse --show-toplevel)/database/migrations/067_uat_expense_lifecycle_work_identifiers.sql\""
          new_rollback = "          test -s \"$(git rev-parse --show-toplevel)/database/rollback/067_uat_expense_lifecycle_work_identifiers_rollback.sql\""
          if source.count(old_apply) != 1 or source.count(old_rollback) != 1:
              raise SystemExit('The exact PR472 validation anchors were not found once.')
          path.write_text(source.replace(old_apply, new_apply).replace(old_rollback, new_rollback))
          PY
          rm .github/workflows/pr472-controller-validation-fix.yml
          git diff --check
          grep -Fq 'test -s "$(git rev-parse --show-toplevel)/database/migrations/067_uat_expense_lifecycle_work_identifiers.sql"' .github/workflows/projectpulse-pr467-one-time-test-release-controller.yml
          test ! -e .github/workflows/pr472-controller-validation-fix.yml

      - name: Commit corrected clean controller branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ProjectPulse PR472 Controller Repair'
          git config user.email 'projectpulse-pr472-controller-repair@users.noreply.github.com'
          git add .github/workflows/projectpulse-pr467-one-time-test-release-controller.yml .github/workflows/pr472-controller-validation-fix.yml
          git commit -m 'Fix PR467 controller migration file validation'
          git push origin HEAD:release-controls/pr467-test-a536e33b-20260804
