name: Observe PR 639 Final Test Release and Oracle Activation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/observe-pr639-final-release.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: observe-pr639-final-release
  cancel-in-progress: true

jobs:
  observe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/observe-pr639-final-release-20260811'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CONTROLLER_COMMIT: ba4d4f7fe0ae784b3f9d781f2c739ff4a26112a5
      APPLICATION_RELEASE: b204b002286d2a9fe2958073c7d0a99168d75401
      DEPLOYMENT_WORKFLOW: deploy-pr639-readiness-api-test.yml
      ACTIVATION_WORKFLOW: celar-ai-oracle-test-runtime-activation-v2.yml
      EVIDENCE_DIR: /tmp/pr639-final-release-observer
    steps:
      - name: Observe exact deployment and activation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          install -d -m 0700 "$EVIDENCE_DIR"

          find_run() {
            local workflow="$1" event="$2" head_sha="$3" not_before="$4"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=$event&per_page=50" \
              | jq -r --arg sha "$head_sha" --arg notBefore "$not_before" '
                  .workflow_runs
                  | map(select(.created_at >= $notBefore))
                  | map(select(($sha == "") or (.head_sha == $sha)))
                  | sort_by(.created_at)
                  | last
                  | .id // empty'
          }

          wait_for_run() {
            local workflow="$1" event="$2" head_sha="$3" not_before="$4" run_id=''
            for poll in $(seq 1 120); do
              run_id="$(find_run "$workflow" "$event" "$head_sha" "$not_before")"
              if [[ "$run_id" =~ ^[0-9]+$ ]]; then
                printf '%s' "$run_id"
                return 0
              fi
              echo "WAIT_RUN workflow=$workflow poll=$poll" >&2
              sleep 10
            done
            return 1
          }

          wait_terminal() {
            local run_id="$1" output="$2" status=''
            for poll in $(seq 1 540); do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$output"
              status="$(jq -r '.status // empty' "$output")"
              if [[ "$status" == completed ]]; then
                return 0
              fi
              echo "WAIT_TERMINAL run=$run_id status=$status poll=$poll" >&2
              sleep 10
            done
            return 1
          }

          DEPLOYMENT_RUN_ID="$(wait_for_run "$DEPLOYMENT_WORKFLOW" push "$CONTROLLER_COMMIT" '2026-08-11T05:39:45Z')" \
            || fail 'The exact PR #640 deployment run was not found.'
          wait_terminal "$DEPLOYMENT_RUN_ID" "$EVIDENCE_DIR/deployment-run.json" \
            || fail 'The deployment run did not reach a terminal state.'
          DEPLOYMENT_CONCLUSION="$(jq -r '.conclusion // empty' "$EVIDENCE_DIR/deployment-run.json")"
          DEPLOYMENT_CREATED_AT="$(jq -r '.created_at' "$EVIDENCE_DIR/deployment-run.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOYMENT_RUN_ID/artifacts" \
            | jq '[.artifacts[] | {id,name,sizeInBytes:.size_in_bytes,digest,expired,createdAt:.created_at,expiresAt:.expires_at}]' \
            > "$EVIDENCE_DIR/deployment-artifacts.json"

          ACTIVATION_RUN_ID=''
          ACTIVATION_CONCLUSION='not_started'
          if [[ "$DEPLOYMENT_CONCLUSION" == success ]]; then
            ACTIVATION_RUN_ID="$(wait_for_run "$ACTIVATION_WORKFLOW" workflow_dispatch '' "$DEPLOYMENT_CREATED_AT")" \
              || fail 'Oracle activation v2 was not found after the successful deployment.'
            wait_terminal "$ACTIVATION_RUN_ID" "$EVIDENCE_DIR/activation-run.json" \
              || fail 'Oracle activation v2 did not reach a terminal state.'
            ACTIVATION_CONCLUSION="$(jq -r '.conclusion // empty' "$EVIDENCE_DIR/activation-run.json")"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACTIVATION_RUN_ID/artifacts" \
              | jq '[.artifacts[] | {id,name,sizeInBytes:.size_in_bytes,digest,expired,createdAt:.created_at,expiresAt:.expires_at}]' \
              > "$EVIDENCE_DIR/activation-artifacts.json"
          else
            printf '[]\n' > "$EVIDENCE_DIR/activation-artifacts.json"
          fi

          jq -n \
            --arg observedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg controllerCommit "$CONTROLLER_COMMIT" \
            --arg applicationRelease "$APPLICATION_RELEASE" \
            --arg deploymentRunId "$DEPLOYMENT_RUN_ID" \
            --arg deploymentConclusion "$DEPLOYMENT_CONCLUSION" \
            --arg deploymentUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$DEPLOYMENT_RUN_ID" \
            --arg activationRunId "$ACTIVATION_RUN_ID" \
            --arg activationConclusion "$ACTIVATION_CONCLUSION" \
            --arg activationUrl "$(if [[ -n "$ACTIVATION_RUN_ID" ]]; then printf '%s/%s/actions/runs/%s' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$ACTIVATION_RUN_ID"; fi)" \
            --slurpfile deploymentArtifacts "$EVIDENCE_DIR/deployment-artifacts.json" \
            --slurpfile activationArtifacts "$EVIDENCE_DIR/activation-artifacts.json" \
            '{
              environment:"test",
              observedAt:$observedAt,
              controllerCommit:$controllerCommit,
              applicationReleaseCommit:$applicationRelease,
              deployment:{runId:($deploymentRunId|tonumber),runUrl:$deploymentUrl,conclusion:$deploymentConclusion,artifacts:$deploymentArtifacts[0]},
              activation:{runId:(if $activationRunId == "" then null else ($activationRunId|tonumber) end),runUrl:(if $activationUrl == "" then null else $activationUrl end),conclusion:$activationConclusion,artifacts:$activationArtifacts[0]},
              observerMutation:false,
              testMutationByObserver:false,
              productionMutation:false,
              secretValuesRead:false
            }' > "$EVIDENCE_DIR/observer-summary.json"

          echo "DEPLOYMENT_RUN_ID=$DEPLOYMENT_RUN_ID"
          echo "DEPLOYMENT_CONCLUSION=$DEPLOYMENT_CONCLUSION"
          echo "ACTIVATION_RUN_ID=${ACTIVATION_RUN_ID:-none}"
          echo "ACTIVATION_CONCLUSION=$ACTIVATION_CONCLUSION"
          echo 'OBSERVER_MUTATION=NONE'
          echo 'PRODUCTION_MUTATION=NONE'

          [[ "$DEPLOYMENT_CONCLUSION" == success ]]
          [[ "$ACTIVATION_CONCLUSION" == success ]]

      - name: Upload immutable observer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr639-final-release-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pr639-final-release-observer
          if-no-files-found: warn
          retention-days: 14

      - name: Publish observer summary
        if: always()
        shell: bash
        run: |
          {
            echo '## PR #639 protected-Test final release observer'
            echo '- Read-only GitHub Actions observation'
            echo '- Test mutation by observer: none'
            echo '- Production mutation: none'
            if [[ -f "$EVIDENCE_DIR/observer-summary.json" ]]; then
              jq -r '"- Deployment run: " + (.deployment.runUrl // "not found") + " — " + (.deployment.conclusion // "unknown")' "$EVIDENCE_DIR/observer-summary.json"
              jq -r '"- Activation run: " + (.activation.runUrl // "not found") + " — " + (.activation.conclusion // "unknown")' "$EVIDENCE_DIR/observer-summary.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
