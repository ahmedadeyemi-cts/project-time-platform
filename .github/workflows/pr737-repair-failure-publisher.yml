name: Publish PR 737 repair failure extract

on:
  push:
    branches:
      - ops/pr737-protected-uat-observer-20260823
    paths:
      - '.github/workflows/pr737-repair-failure-publisher.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: pr737-repair-failure-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: '32692073985'
    steps:
      - name: Check out observer branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ops/pr737-protected-uat-observer-20260823
          fetch-depth: 0
          persist-credentials: true
      - name: Publish exact repair failure extract
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/actions/runs/$FAILED_RUN_ID/logs" \
            --output "$work/logs.zip"
          unzip -q "$work/logs.zip" -d "$work/logs"
          log_file="$(find "$work/logs" -type f -name '*Publish permanent 080, 081, and 094 repair*.txt' -print -quit)"
          [[ -n "$log_file" && -s "$log_file" ]]
          mkdir -p docs/pr737-observer
          {
            echo '# PR 737 private-runtime repair validation failure'
            echo
            echo "Run: $FAILED_RUN_ID"
            echo
            echo '```text'
            grep -nEi -C 35 'Expected exactly one|ASSERTION_FAILED|AssertionError|ERROR:|##\[error\]|failed|failure|not found|does not exist|mismatch|unexpected' "$log_file" | tail -1000 || true
            echo '```'
          } > docs/pr737-observer/repair-failure.md
          sed -E -i \
            -e 's/(Authorization: Bearer )[A-Za-z0-9._~+\/-]+/\1[REDACTED]/g' \
            -e 's/(PGPASSWORD=)[^[:space:]]+/\1[REDACTED]/g' \
            -e 's/(password[=:])[[:space:]]*[^[:space:]]+/\1[REDACTED]/Ig' \
            docs/pr737-observer/repair-failure.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/pr737-observer/repair-failure.md
          git commit -m 'Publish PR 737 repair failure evidence'
          git push origin HEAD:ops/pr737-protected-uat-observer-20260823
