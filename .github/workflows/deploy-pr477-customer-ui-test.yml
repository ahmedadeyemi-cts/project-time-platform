name: Deploy PR477 Customer and UI Polish to Test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pr477-customer-ui-test.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-pr477-customer-ui-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy PR477 customer and UI polish to Test'
    name: Apply Migration 069 and deploy exact PR477 release to Test
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_SHA: 6f2b5ef459e1a8efa234a9efb1dc14e1fc56379b
      MIGRATION_ID: 069_module006_customer_pipeline_expansion
    steps:
      - name: Check out deployment control
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact application release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: release
          fetch-depth: 1
          persist-credentials: false

      - name: Guard exact Test-only release
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          CONTROL_SHA="$(git -C control rev-parse HEAD)"
          TARGET_SHA="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_SHA" == "$GITHUB_SHA" ]]
          [[ "$TARGET_SHA" == "$RELEASE_SHA" ]]
          git -C control merge-base --is-ancestor "$RELEASE_SHA" HEAD

          CHANGED_AFTER_RELEASE="$(git -C control diff --name-only "$RELEASE_SHA"...HEAD)"
          printf '%s\n' "$CHANGED_AFTER_RELEASE"
          [[ "$CHANGED_AFTER_RELEASE" == '.github/workflows/deploy-pr477-customer-ui-test.yml' ]] || {
            echo 'Deployment control main contains application changes after the exact PR477 release.' >&2
            exit 1
          }

          test -f release/database/migrations/069_module006_customer_pipeline_expansion.sql
          test -f release/database/rollback/069_module006_customer_pipeline_expansion_rollback.sql
          test -f release/database/migrations/068_module006_standalone_pipeline_management.sql
          test -f release/src/backend/ProjectTime.Api/Modules/Module006StandalonePipelineModule.cs
          test -f release/src/backend/ProjectTime.Api/Modules/Module006StandaloneTaskModule.cs
          test -f release/src/frontend/project-time-web/src/ProjectRegisterCenter.jsx
          test -f release/src/frontend/project-time-web/src/project-register-center.css
          test -f release/src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx
          test -f release/src/frontend/project-time-web/src/module-availability.css
          test -f release/src/frontend/project-time-web/src/intuitive-more-menu.css
          test -f release/src/frontend/project-time-web/src/project-expense-upload.css
          test -f release/src/frontend/project-time-web/src/module-availability-bridge.js
          test -f release/src/frontend/project-time-web/brand/USSNavyStacked.png
          test -f release/src/frontend/project-time-web/brand/ussignal.png
          test -f release/src/backend/ProjectTime.Api/Assets/Branding/USSNavyStacked.png
          test -f release/src/frontend/project-time-web/scripts/validate-module-006-toyota-hyundai-pipelines.mjs
          test -f release/src/frontend/project-time-web/src/FinancialOperationsRecoveryWorkspace.jsx
          test -f release/src/frontend/project-time-web/src/ProjectAllocationInfoPanel.jsx
          test -f release/src/frontend/project-time-web/src/WorkRegisterCenter.jsx
          test -f release/tests/test-module-006-customer-expansion-migration-069.sh
          test -f release/tests/validate-uat-followup-modules.py

          grep -Fq 'MapModule006StandalonePipelineEndpoints' release/src/backend/ProjectTime.Api/Modules/Module006StandalonePipelineModule.cs
          grep -Fq 'MapModule006StandaloneTaskEndpoints' release/src/backend/ProjectTime.Api/Modules/Module006StandaloneTaskModule.cs
          grep -Fq 'linkedToModule055C = false' release/src/backend/ProjectTime.Api/Modules/Module006StandalonePipelineModule.cs
          grep -Fq 'customerEntryMode = "extensible"' release/src/backend/ProjectTime.Api/Modules/Module006StandalonePipelineModule.cs
          grep -Fq '069_module006_customer_pipeline_expansion' release/src/backend/ProjectTime.Api/Modules/Module006StandalonePipelineModule.cs
          grep -Fq 'module006-standalone-pipeline-v1' release/src/frontend/project-time-web/src/ProjectRegisterCenter.jsx
          grep -Fq '<th className="project-register-status-column">Status</th>' release/src/frontend/project-time-web/src/ProjectRegisterCenter.jsx
          grep -Fq '<td className="project-register-status-column"><span className={`project-register-state ${record.isArchived ? '\''historical'\'' : '\''active'\''}`}>{record.isArchived ? '\''Historical'\'' : labelize(record.status || '\''Active'\'')}</span></td>' release/src/frontend/project-time-web/src/ProjectRegisterCenter.jsx
          ! grep -Fq '</span><small>{labelize(record.status)}</small>' release/src/frontend/project-time-web/src/ProjectRegisterCenter.jsx
          grep -Fq '.project-register-table .project-register-status-column' release/src/frontend/project-time-web/src/project-register-center.css
          grep -Fq 'white-space: nowrap;' release/src/frontend/project-time-web/src/project-register-center.css
          grep -Fq 'MODULE_065_REACT_OWNED_OPEN_ACTION' release/src/frontend/project-time-web/src/ModulesDirectoryPortal.jsx
          grep -Fq '.modules-directory-card-actions > button.modules-directory-open-button' release/src/frontend/project-time-web/src/module-availability.css
          grep -Fq '.enterprise-more-dropdown.projectpulse-more-intuitive' release/src/frontend/project-time-web/src/intuitive-more-menu.css
          grep -Fq "const permissionReady = permissionEvidenceState === 'ready';" release/src/frontend/project-time-web/src/module-availability-bridge.js
          grep -Fq '.expense-actions .primary-action' release/src/frontend/project-time-web/src/project-expense-upload.css
          grep -Fq 'canRetry = false, compact = false' release/src/frontend/project-time-web/src/FinancialOperationsRecoveryWorkspace.jsx
          grep -Fq 'Lifecycle controls are temporarily unavailable' release/src/frontend/project-time-web/src/ProjectAllocationInfoPanel.jsx
          grep -Fq 'data-pr467-row-work-identifier' release/src/frontend/project-time-web/src/WorkRegisterCenter.jsx
          cmp -s release/src/backend/ProjectTime.Api/Assets/Branding/USSNavyStacked.png release/src/frontend/project-time-web/brand/USSNavyStacked.png
          cmp -s release/src/backend/ProjectTime.Api/Assets/Branding/USSNavyStacked.png release/src/frontend/project-time-web/brand/ussignal.png
          node release/src/frontend/project-time-web/scripts/validate-module-006-toyota-hyundai-pipelines.mjs
          python3 release/tests/validate-uat-followup-modules.py
          python3 release/scripts/security/validate-repository-security-posture.py
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo 'PR477_RELEASE_GUARD=PASS environment=test production=false'

      - name: Test Migration 068 and 069 apply, validation, guarded rollback, and reapply
        shell: bash
        run: bash release/tests/test-module-006-customer-expansion-migration-069.sh

      - name: Azure login for Test
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Test database and Container Apps configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t ENV_NAMES < <(az containerapp show \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            --query 'properties.template.containers[0].env[].name' -o tsv)
          printf '%s\n' "${ENV_NAMES[@]}" | sort -u > /tmp/pr477-api-env-names
          for name in PTP_DB_HOST PTP_DB_PORT PTP_DB_NAME PTP_DB_USER PTP_DB_PASSWORD; do
            grep -Fxq "$name" /tmp/pr477-api-env-names || { echo "Missing required Test API variable: $name" >&2; exit 1; }
          done
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          [[ "${API_MODE,,}" == single && "${WEB_MODE,,}" == single ]]
          echo 'PR477_TEST_CONFIGURATION=PASS'

      - name: Load private Test database connection
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        run: bash control/scripts/export-pr55-test-database-url.sh

      - name: Capture immutable rollback images
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          RAW_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Image is outside approved ACR: $image" >&2; return 1 ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }
          echo "old_api_image=$(resolve_digest "$RAW_API")" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$(resolve_digest "$RAW_WEB")" >> "$GITHUB_OUTPUT"

      - name: Build exact immutable API and web images
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          API_REPO='project-health-dashboard-api'
          WEB_REPO='project-health-dashboard-web'
          API_DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$API_REPO:uat477-$RELEASE_SHA" release/deployment/containers/api/Dockerfile release)"
          WEB_DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$WEB_REPO:uat477-$RELEASE_SHA" release/deployment/containers/web/Dockerfile release)"
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$API_REPO@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$WEB_REPO@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build checksum-pinned Migration 069 image
        id: migration
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/pr477-migrator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          install -m 0644 control/deployment/containers/pr55-migrator/Dockerfile "$CONTEXT/Dockerfile"
          install -m 0644 release/database/migrations/069_module006_customer_pipeline_expansion.sql "$CONTEXT/migrations/069_module006_customer_pipeline_expansion.sql"
          printf '%s\n' "$RELEASE_SHA" > "$CONTEXT/release-commit"
          (cd "$CONTEXT/migrations" && sha256sum 069_module006_customer_pipeline_expansion.sql > SHA256SUMS)
          cat > "$CONTEXT/apply-pr55-test-migrations.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOT="${1:?release root required}"
          EXPECTED="${PROJECTPULSE_EXPECTED_RELEASE_SHA:?Expected release SHA is required}"
          DB_URL="${PROJECTPULSE_TEST_DATABASE_URL:?Test database URL is required}"
          [[ "$(cat "$ROOT/.projectpulse-release-commit")" == "$EXPECTED" ]]
          (cd "$ROOT/database/migrations" && sha256sum -c SHA256SUMS)
          value() { psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc "$1" | tr -d '\r'; }
          table_hash() {
            local table="$1" key="$2"
            value "SELECT md5(COALESCE(string_agg(row_to_json(t)::text, E'\\n' ORDER BY $key), '')) FROM $table AS t;"
          }
          [[ "$(value "SELECT COUNT(*) FROM schema_migrations WHERE migration_id='068_module006_standalone_pipeline_management';")" == 1 ]] || {
            echo 'Migration 068 prerequisite is not registered in Test.' >&2
            exit 1
          }
          [[ "$(value "SELECT COUNT(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('module006_pipeline_records','module006_pipeline_updates','module006_pipeline_tasks','module006_pipeline_task_events');")" == 4 ]]
          INVALID_CUSTOMERS="$(value "SELECT COUNT(*) FROM module006_pipeline_records WHERE customer <> btrim(customer) OR char_length(customer) NOT BETWEEN 2 AND 120 OR customer ~ '[[:cntrl:]]';")"
          [[ "$INVALID_CUSTOMERS" == 0 ]] || {
            echo "Migration 069 preflight found $INVALID_CUSTOMERS invalid existing customer value(s); no database change was attempted." >&2
            exit 1
          }
          USERS_BEFORE="$(value 'SELECT COUNT(*) FROM app_users;')"
          PROJECTS_BEFORE="$(value "SELECT CASE WHEN to_regclass('public.projects') IS NULL THEN 0 ELSE (SELECT COUNT(*) FROM projects) END;")"
          RECORDS_BEFORE="$(value 'SELECT COUNT(*) FROM module006_pipeline_records;')"
          UPDATES_BEFORE="$(value 'SELECT COUNT(*) FROM module006_pipeline_updates;')"
          TASKS_BEFORE="$(value 'SELECT COUNT(*) FROM module006_pipeline_tasks;')"
          EVENTS_BEFORE="$(value 'SELECT COUNT(*) FROM module006_pipeline_task_events;')"
          RECORDS_HASH_BEFORE="$(table_hash module006_pipeline_records module006_pipeline_record_id)"
          UPDATES_HASH_BEFORE="$(table_hash module006_pipeline_updates module006_pipeline_update_id)"
          TASKS_HASH_BEFORE="$(table_hash module006_pipeline_tasks module006_pipeline_task_id)"
          EVENTS_HASH_BEFORE="$(table_hash module006_pipeline_task_events module006_pipeline_task_event_id)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$ROOT/database/migrations/069_module006_customer_pipeline_expansion.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$ROOT/database/migrations/069_module006_customer_pipeline_expansion.sql"
          [[ "$(value "SELECT COUNT(*) FROM schema_migrations WHERE migration_id='069_module006_customer_pipeline_expansion';")" == 1 ]]
          [[ "$(value "SELECT COUNT(*) FROM pg_constraint WHERE conrelid='module006_pipeline_records'::regclass AND conname='ck_module006_pipeline_records_customer_name' AND convalidated;")" == 1 ]]
          [[ "$(value "SELECT COUNT(*) FROM pg_constraint WHERE conrelid='module006_pipeline_records'::regclass AND conname='module006_pipeline_records_customer_check';")" == 0 ]]
          [[ "$(value "SELECT COUNT(*) FROM pg_indexes WHERE schemaname='public' AND tablename='module006_pipeline_records' AND indexname='ix_module006_pipeline_records_customer_name';")" == 1 ]]
          CUSTOMER_CONSTRAINT="$(value "SELECT pg_get_constraintdef(oid) FROM pg_constraint WHERE conrelid='module006_pipeline_records'::regclass AND conname='ck_module006_pipeline_records_customer_name';")"
          [[ "$CUSTOMER_CONSTRAINT" == *'btrim(customer)'* ]]
          [[ "$CUSTOMER_CONSTRAINT" == *'char_length(customer)'* ]]
          [[ "$(value "SELECT COUNT(*) FROM pg_trigger WHERE NOT tgisinternal AND tgname IN ('trg_module006_pipeline_updates_immutable','trg_module006_pipeline_task_events_immutable');")" == 2 ]]
          [[ "$(value 'SELECT COUNT(*) FROM module006_pipeline_records;')" == "$RECORDS_BEFORE" ]]
          [[ "$(value 'SELECT COUNT(*) FROM module006_pipeline_updates;')" == "$UPDATES_BEFORE" ]]
          [[ "$(value 'SELECT COUNT(*) FROM module006_pipeline_tasks;')" == "$TASKS_BEFORE" ]]
          [[ "$(value 'SELECT COUNT(*) FROM module006_pipeline_task_events;')" == "$EVENTS_BEFORE" ]]
          [[ "$(table_hash module006_pipeline_records module006_pipeline_record_id)" == "$RECORDS_HASH_BEFORE" ]]
          [[ "$(table_hash module006_pipeline_updates module006_pipeline_update_id)" == "$UPDATES_HASH_BEFORE" ]]
          [[ "$(table_hash module006_pipeline_tasks module006_pipeline_task_id)" == "$TASKS_HASH_BEFORE" ]]
          [[ "$(table_hash module006_pipeline_task_events module006_pipeline_task_event_id)" == "$EVENTS_HASH_BEFORE" ]]
          [[ "$(value 'SELECT COUNT(*) FROM app_users;')" == "$USERS_BEFORE" ]]
          [[ "$(value "SELECT CASE WHEN to_regclass('public.projects') IS NULL THEN 0 ELSE (SELECT COUNT(*) FROM projects) END;")" == "$PROJECTS_BEFORE" ]]
          echo 'MIGRATION_069_TEST_DATABASE=APPLIED_AND_VERIFIED prerequisite=068 rows_unchanged=true hashes_unchanged=true constraint=validated index=present'
          SCRIPT
          chmod 0555 "$CONTEXT/apply-pr55-test-migrations.sh"
          DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-uat477-migrator:${RELEASE_SHA}-${GITHUB_RUN_ID}" "$CONTEXT/Dockerfile" "$CONTEXT")"
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-uat477-migrator@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Apply Migration 069 inside the Test private network
        shell: bash
        env:
          MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
        run: |
          set -Eeuo pipefail
          RESOURCE_GROUP='${{ vars.AZURE_RESOURCE_GROUP }}'
          API_APP='${{ vars.AZURE_API_APP }}'
          ACR_NAME='${{ vars.AZURE_ACR_NAME }}'
          JOB_NAME="uat477-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DATABASE_URL="$PROJECTPULSE_TEST_DATABASE_URL"
          [[ "$MIGRATION_IMAGE" == "$ACR_NAME.azurecr.io/"*@sha256:* ]]
          [[ "$JOB_NAME" =~ ^[a-z][a-z0-9-]{0,30}[a-z0-9]$ ]]
          printf '::add-mask::%s\n' "${DATABASE_URL//%/%25}"

          ENVIRONMENT_ID="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.managedEnvironmentId -o tsv)"
          [[ -n "$ENVIRONMENT_ID" && "$ENVIRONMENT_ID" != null ]]
          ACR_TOKEN="$(az acr login --name "$ACR_NAME" --expose-token --query accessToken -o tsv)"
          printf '::add-mask::%s\n' "${ACR_TOKEN//%/%25}"
          JOB_CREATED=0
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            unset DATABASE_URL ACR_TOKEN
            if (( JOB_CREATED == 1 )); then
              az containerapp job delete -g "$RESOURCE_GROUP" -n "$JOB_NAME" --yes --output none --only-show-errors || true
            fi
            exit "$status"
          }
          trap cleanup EXIT INT TERM

          az containerapp job create \
            -g "$RESOURCE_GROUP" \
            -n "$JOB_NAME" \
            --environment "$ENVIRONMENT_ID" \
            --trigger-type Manual \
            --replica-timeout 1200 \
            --replica-retry-limit 0 \
            --replica-completion-count 1 \
            --parallelism 1 \
            --image "$MIGRATION_IMAGE" \
            --cpu 0.25 \
            --memory 0.5Gi \
            --registry-server "$ACR_NAME.azurecr.io" \
            --registry-username 00000000-0000-0000-0000-000000000000 \
            --registry-password "$ACR_TOKEN" \
            --secrets "projectpulse-db-url=$DATABASE_URL" \
            --env-vars PROJECTPULSE_TEST_DATABASE_URL=secretref:projectpulse-db-url PROJECTPULSE_EXPECTED_RELEASE_SHA="$RELEASE_SHA" \
            --tags projectpulse-scope=pr477-test projectpulse-release="$RELEASE_SHA" \
            --output none --only-show-errors
          JOB_CREATED=1
          unset DATABASE_URL ACR_TOKEN
          EXECUTION="$(az containerapp job start -g "$RESOURCE_GROUP" -n "$JOB_NAME" --query name -o tsv --only-show-errors)"
          [[ -n "$EXECUTION" ]]
          for attempt in $(seq 1 120); do
            STATUS="$(az containerapp job execution list -g "$RESOURCE_GROUP" -n "$JOB_NAME" --query "[?name=='$EXECUTION'].properties.status | [0]" -o tsv --only-show-errors)"
            case "$STATUS" in
              Succeeded) echo 'MIGRATION_069_PRIVATE_JOB=Succeeded'; exit 0 ;;
              Failed|Canceled)
                az containerapp job logs show -g "$RESOURCE_GROUP" -n "$JOB_NAME" --execution "$EXECUTION" --container "$JOB_NAME" --tail 250 --only-show-errors >&2 || true
                exit 1
                ;;
            esac
            sleep 5
          done
          az containerapp job logs show -g "$RESOURCE_GROUP" -n "$JOB_NAME" --execution "$EXECUTION" --container "$JOB_NAME" --tail 250 --only-show-errors >&2 || true
          exit 1

      - name: Deploy exact API image
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT="$RELEASE_SHA" \
            --revision-suffix "u477api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none

      - name: Validate API health and new protected routes
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          probe() {
            local path="$1" expected="$2" status=''
            for attempt in $(seq 1 36); do
              status="$(curl -sS -o "/tmp/pr477-${path//\//-}.body" -w '%{http_code}' \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "$BASE$path?release_check=pr477-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" || true)"
              if [[ ",$expected," == *",$status,"* ]]; then return 0; fi
              sleep 10
            done
            echo "$path did not reach expected HTTP status $expected; last=$status" >&2
            cat "/tmp/pr477-${path//\//-}.body" >&2 || true
            return 1
          }
          probe /health 200
          probe /api/version 200
          probe /api/public/project-expenses/readiness 200
          probe /api/module-006/pipeline 401,403
          probe /api/module-006/tasks 401,403
          probe /api/project-expenses/uploads/lifecycle 401,403
          ACTIVE_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_API" == '${{ steps.build.outputs.api_image }}' ]]
          SOURCE_COMMIT="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query "properties.template.containers[0].env[?name=='PROJECTPULSE_SOURCE_COMMIT'].value | [0]" -o tsv)"
          [[ "$SOURCE_COMMIT" == "$RELEASE_SHA" ]]
          echo 'PR477_LIVE_API=READY'

      - name: Deploy exact web image
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "u477web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none

      - name: Validate exact served UAT assets
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          READY=false
          for attempt in $(seq 1 36); do
            BUSTER="pr477-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            STATUS="$(curl -sSL -H 'Cache-Control: no-cache' -o /tmp/pr477-index -w '%{http_code}' "$BASE/?release_check=$BUSTER" || true)"
            if [[ "$STATUS" == 200 ]]; then
              rm -f /tmp/pr477-app.js /tmp/pr477-app.css
              while read -r asset; do
                [[ -n "$asset" ]] || continue
                case "$asset" in http*) url="$asset" ;; /*) url="$BASE$asset" ;; *) url="$BASE/$asset" ;; esac
                curl -sSL -H 'Cache-Control: no-cache' "$url?release_check=$BUSTER" >> /tmp/pr477-app.js || true
              done < <(grep -oE 'src="[^"]+\.js"' /tmp/pr477-index | sed -E 's/^src="|"$//g')
              while read -r asset; do
                [[ -n "$asset" ]] || continue
                case "$asset" in http*) url="$asset" ;; /*) url="$BASE$asset" ;; *) url="$BASE/$asset" ;; esac
                curl -sSL -H 'Cache-Control: no-cache' "$url?release_check=$BUSTER" >> /tmp/pr477-app.css || true
              done < <(grep -oE 'href="[^"]+\.css"' /tmp/pr477-index | sed -E 's/^href="|"$//g')
              if grep -Fq 'Standalone authority' /tmp/pr477-app.js \
                && grep -Fq 'Add New Project' /tmp/pr477-app.js \
                && grep -Fq 'Create New Task' /tmp/pr477-app.js \
                && grep -Fq 'All customers' /tmp/pr477-app.js \
                && grep -Fq 'Create a standalone pipeline record for any customer.' /tmp/pr477-app.js \
                && grep -Fq 'Accept as PM' /tmp/pr477-app.js \
                && grep -Fq 'Project Expense Upload' /tmp/pr477-app.js \
                && grep -Fq 'Open pages available to the current effective user' /tmp/pr477-app.js \
                && grep -Fq 'Lifecycle controls are temporarily unavailable' /tmp/pr477-app.js \
                && grep -Fq 'Copy ID' /tmp/pr477-app.js \
                && grep -Fq 'entra-secret-administration' /tmp/pr477-app.js \
                && grep -Eq '/assets/ussignal-[A-Za-z0-9_-]+\.png' /tmp/pr477-app.js \
                && grep -Fq '.module006-independence-banner' /tmp/pr477-app.css \
                && grep -Fq '.project-register-status-column' /tmp/pr477-app.css \
                && grep -Fq '.expense-actions .primary-action' /tmp/pr477-app.css \
                && grep -Fq '.projectpulse-more-intuitive' /tmp/pr477-app.css \
                && grep -Fq '.brand-logo-image' /tmp/pr477-app.css \
                && grep -Fq '.work-register-row-identifier' /tmp/pr477-app.css \
                && grep -Fq '.modules-directory-open-button' /tmp/pr477-app.css; then
                READY=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$READY" == true ]] || { echo 'The exact PR477 browser assets were not served.' >&2; exit 1; }
          STACKED_LOGO_ASSET="$(grep -oE '/assets/ussignal-[A-Za-z0-9_-]+\.png' /tmp/pr477-app.js | sed -n '1p')"
          [[ -n "$STACKED_LOGO_ASSET" ]]
          curl -sSLo /tmp/pr477-stacked-logo "$BASE$STACKED_LOGO_ASSET?release_check=$BUSTER"
          cmp -s release/src/backend/ProjectTime.Api/Assets/Branding/USSNavyStacked.png /tmp/pr477-stacked-logo
          ACTIVE_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
          [[ "$ACTIVE_WEB" == '${{ steps.build.outputs.web_image }}' ]]
          echo 'PR477_LIVE_WEB=READY module006_customers=extensible status_header=nowrap status_indicator=single module005=ready module065=matched more_menu=permission_scoped stacked_logo=approved'

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          API_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query properties.latestReadyRevisionName -o tsv)"
          WEB_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.latestReadyRevisionName -o tsv)"
          STACKED_LOGO_SHA256="$(sha256sum release/src/frontend/project-time-web/brand/USSNavyStacked.png | awk '{print $1}')"
          cat > evidence/pr477-customer-ui-test-deployment.json <<JSON
          {
            "environment": "test",
            "productionChanged": false,
            "releaseCommit": "$RELEASE_SHA",
            "workflowCommit": "$GITHUB_SHA",
            "migration": "$MIGRATION_ID",
            "migrationImage": "${{ steps.migration.outputs.image }}",
            "apiImage": "${{ steps.build.outputs.api_image }}",
            "webImage": "${{ steps.build.outputs.web_image }}",
            "previousApiImage": "${{ steps.before.outputs.old_api_image }}",
            "previousWebImage": "${{ steps.before.outputs.old_web_image }}",
            "apiRevision": "$API_REVISION",
            "webRevision": "$WEB_REVISION",
            "stackedLogoSha256": "$STACKED_LOGO_SHA256",
            "runId": "$GITHUB_RUN_ID",
            "runAttempt": "$GITHUB_RUN_ATTEMPT",
            "modules": ["005", "006", "039", "055C", "065"],
            "features": ["module006-extensible-customers", "module006-nowrap-status-header", "module006-single-status-indicator", "module005-enterprise-upload-history", "module065-matched-open-action", "permission-scoped-more-menu", "approved-stacked-us-signal-logo"],
            "module011Deferred": true,
            "emailSent": false
          }
          JSON

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr477-customer-ui-test-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/pr477-customer-ui-test-deployment.json
          retention-days: 30

      - name: Roll back application images on deployment failure
        if: ${{ failure() && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set +e
          ROLLBACK_FAILED=0
          API_ROLLED_BACK=false
          WEB_ROLLED_BACK=false
          if [[ '${{ steps.deploy_api.outputs.started }}' == 'true' ]]; then
            ACTIVE_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
            if [[ "$ACTIVE_API" == '${{ steps.build.outputs.api_image }}' ]]; then
              az containerapp update \
                -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
                -n '${{ vars.AZURE_API_APP }}' \
                --image '${{ steps.before.outputs.old_api_image }}' \
                --revision-suffix "u477arb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                --output none || ROLLBACK_FAILED=1
              API_ROLLED_BACK=true
            else
              echo "PR477_API_ROLLBACK=SKIPPED active_image_changed"
            fi
          fi
          if [[ '${{ steps.deploy_web.outputs.started }}' == 'true' ]]; then
            ACTIVE_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
            if [[ "$ACTIVE_WEB" == '${{ steps.build.outputs.web_image }}' ]]; then
              az containerapp update \
                -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
                -n '${{ vars.AZURE_WEB_APP }}' \
                --image '${{ steps.before.outputs.old_web_image }}' \
                --revision-suffix "u477wrb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                --output none || ROLLBACK_FAILED=1
              WEB_ROLLED_BACK=true
            else
              echo "PR477_WEB_ROLLBACK=SKIPPED active_image_changed"
            fi
          fi
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          if [[ "$API_ROLLED_BACK" == true ]]; then
            API_READY=false
            for attempt in $(seq 1 36); do
              ACTIVE_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
              STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/health?rollback_check=pr477-${GITHUB_RUN_ID}-${attempt}" || true)"
              if [[ "$ACTIVE_API" == '${{ steps.before.outputs.old_api_image }}' && "$STATUS" == 200 ]]; then API_READY=true; break; fi
              sleep 10
            done
            [[ "$API_READY" == true ]] || ROLLBACK_FAILED=1
          fi
          if [[ "$WEB_ROLLED_BACK" == true ]]; then
            WEB_READY=false
            for attempt in $(seq 1 36); do
              ACTIVE_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv)"
              STATUS="$(curl -sSL -o /dev/null -w '%{http_code}' "$BASE/?rollback_check=pr477-${GITHUB_RUN_ID}-${attempt}" || true)"
              if [[ "$ACTIVE_WEB" == '${{ steps.before.outputs.old_web_image }}' && "$STATUS" == 200 ]]; then WEB_READY=true; break; fi
              sleep 10
            done
            [[ "$WEB_READY" == true ]] || ROLLBACK_FAILED=1
          fi
          echo "PR477_APPLICATION_ROLLBACK=COMPLETE api=$API_ROLLED_BACK web=$WEB_ROLLED_BACK verified=$((1 - ROLLBACK_FAILED))"
          exit "$ROLLBACK_FAILED"

      - name: Publish release summary
        if: always()
        shell: bash
        run: |
          {
            echo '## PR #477 customer and UI polish Test release'
            echo
            echo "- Exact application SHA: $RELEASE_SHA"
            echo "- Migration: $MIGRATION_ID"
            echo '- Environment: Test only'
            echo '- Production changed: No'
            echo '- Email sent: No'
            echo '- Module 011: Deferred'
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
