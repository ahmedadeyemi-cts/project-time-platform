name: Publish Validated Oracle In-Process Profile Diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-oracle-inprocess-profile-diagnostic.yml'
      - 'scripts/patch-oracle-inprocess-profile-diagnostic.py'

permissions:
  contents: read

concurrency:
  group: publish-oracle-inprocess-profile-diagnostic
  cancel-in-progress: true

jobs:
  publish:
    name: Patch, validate, and publish workflow artifact
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/oracle-inprocess-profile-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact diagnostic branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: diagnostic/oracle-inprocess-profile-20260810
          fetch-depth: 0
          persist-credentials: false

      - name: Apply and validate bounded workflow diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/patch-oracle-inprocess-profile-diagnostic.py
          python3 scripts/patch-oracle-inprocess-profile-diagnostic.py

          grep -Fq 'ORACLE_INPROCESS_PROFILE_DIAGNOSTIC=CAPTURED' \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          grep -Fq 'oracle-private-model-profile-sanitized.json' \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          grep -Fq 'oracle-private-model-probe-sanitized.json' \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          grep -Fq 'privateModelProfile:($privateModelProfile[0] // {})' \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          grep -Fq 'privateModelProbe:($privateModelProbe[0] // {})' \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          ! grep -Fq 'cat "$PROFILE_RAW"' \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          ! grep -Fq 'cat "$PROBE_RAW"' \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          git diff --check

          curl -fsSL --retry 4 --retry-all-errors \
            -o "$RUNNER_TEMP/actionlint.tar.gz" \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -verbose \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml

          node tests/validate-celar-ai-oracle-test-runtime.mjs
          install -d -m 0700 "$RUNNER_TEMP/oracle-diagnostic-workflow"
          install -m 0600 \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml \
            "$RUNNER_TEMP/oracle-diagnostic-workflow/celar-ai-oracle-test-runtime-deploy.yml"
          sha256sum \
            "$RUNNER_TEMP/oracle-diagnostic-workflow/celar-ai-oracle-test-runtime-deploy.yml" \
            > "$RUNNER_TEMP/oracle-diagnostic-workflow/SHA256SUMS"
          echo 'ORACLE_DIAGNOSTIC_WORKFLOW_ARTIFACT=VALIDATED'

      - name: Upload validated workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-oracle-inprocess-profile-workflow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oracle-diagnostic-workflow
          if-no-files-found: error
          retention-days: 3
