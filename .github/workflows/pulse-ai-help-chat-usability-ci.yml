name: Validate Pulse AI Help Chat Usability

on:
  push:
    branches:
      - 'fix/module-011-help-chat-usability-*'
  pull_request:
    paths:
      - '.github/workflows/pulse-ai-help-chat-usability-ci.yml'
      - '.github/workflows/group5-financial-operations-recovery-ci.yml'
      - 'src/frontend/project-time-web/package.json'
      - 'src/frontend/project-time-web/package-lock.json'
      - 'src/frontend/project-time-web/src/pulse-ai-help-chat-usability.js'
      - 'src/frontend/project-time-web/src/pulse-ai-help-chat-usability.css'
      - 'src/frontend/project-time-web/src/main.jsx'
      - 'src/frontend/project-time-web/src/HelpAssistant.jsx'
      - 'src/frontend/project-time-web/scripts/validate-pulse-ai-help-chat-usability.mjs'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiProductKnowledgeCatalog.cs'
      - 'src/backend/ProjectTime.Api/Ai/PulseAiQuestionPlanner.cs'
      - 'src/backend/ProjectTime.Api/ProjectTime.Api.csproj'

permissions:
  contents: read

concurrency:
  group: pulse-ai-help-chat-usability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify owned Help-chat scope or regression applicability
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          git fetch origin "$BASE_BRANCH" --no-tags
          CHANGED="$(git diff --name-only "origin/$BASE_BRANCH"...HEAD)"
          printf '%s\n' "$CHANGED"

          HEAD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          OWNED_BRANCH='false'
          CENTRAL_SECURITY_BRANCH='false'
          if [[ "$HEAD_BRANCH" == fix/module-011-help-chat-usability-* ]]; then
            OWNED_BRANCH='true'
          elif [[ "$HEAD_BRANCH" == security/repository-posture-* ]]; then
            CENTRAL_SECURITY_BRANCH='true'
          fi

          ALLOWED='^(\.github/workflows/(pulse-ai-help-chat-usability-ci|group5-financial-operations-recovery-ci)\.yml|src/frontend/project-time-web/package(-lock)?\.json|src/frontend/project-time-web/src/(pulse-ai-help-chat-usability\.js|pulse-ai-help-chat-usability\.css|main\.jsx|HelpAssistant\.jsx)|src/frontend/project-time-web/scripts/validate-pulse-ai-help-chat-usability\.mjs|src/backend/ProjectTime\.Api/Ai/(PulseAiProductKnowledgeCatalog|PulseAiQuestionPlanner)\.cs|src/backend/ProjectTime\.Api/ProjectTime\.Api\.csproj)$'
          HELP_RUNTIME_OWNED='^(src/frontend/project-time-web/src/(pulse-ai-help-chat-usability\.js|pulse-ai-help-chat-usability\.css|HelpAssistant\.jsx)|src/frontend/project-time-web/scripts/validate-pulse-ai-help-chat-usability\.mjs|src/backend/ProjectTime\.Api/Ai/(PulseAiProductKnowledgeCatalog|PulseAiQuestionPlanner)\.cs)$'
          CENTRAL_HELP_CONVERGENCE='^src/frontend/project-time-web/src/HelpAssistant\.jsx$'

          if [[ "$OWNED_BRANCH" == 'true' ]]; then
            UNEXPECTED="$(grep -Ev "$ALLOWED" <<<"$CHANGED" || true)"
            if [[ -n "$UNEXPECTED" ]]; then
              echo 'Unexpected Pulse AI Help chat hotfix scope:' >&2
              printf '%s\n' "$UNEXPECTED" >&2
              exit 1
            fi

            if grep -E '^(database/|deployment/|scripts/.*deploy|\.github/workflows/projectpulse-deploy-)' <<<"$CHANGED"; then
              echo 'The Help chat hotfix cannot include a migration or deployment operation.' >&2
              exit 1
            fi

            echo 'PULSE_AI_HELP_CHAT_VALIDATION_MODE=OWNED_SOURCE' >> "$GITHUB_ENV"
            echo 'PULSE_AI_HELP_CHAT_SOURCE_ISOLATION=PASSED'
          elif [[ "$CENTRAL_SECURITY_BRANCH" == 'true' ]]; then
            DIRECT_HELP_CHANGES="$(grep -E "$HELP_RUNTIME_OWNED" <<<"$CHANGED" || true)"
            UNAPPROVED_HELP="$(grep -Ev "$CENTRAL_HELP_CONVERGENCE" <<<"$DIRECT_HELP_CHANGES" || true)"
            if [[ -n "$UNAPPROVED_HELP" ]]; then
              echo 'The central security posture branch changed Help-chat source outside the reviewed canonical-source convergence boundary:' >&2
              printf '%s\n' "$UNAPPROVED_HELP" >&2
              exit 1
            fi

            echo 'PULSE_AI_HELP_CHAT_VALIDATION_MODE=CENTRAL_SECURITY_CONVERGENCE' >> "$GITHUB_ENV"
            echo 'PULSE_AI_HELP_CHAT_CENTRAL_SECURITY_CONVERGENCE=PASSED'
          else
            DIRECT_HELP_CHANGES="$(grep -E "$HELP_RUNTIME_OWNED" <<<"$CHANGED" || true)"
            if [[ -n "$DIRECT_HELP_CHANGES" ]]; then
              echo 'Pulse AI Help-chat runtime source may only be changed from the isolated Help-chat branch family:' >&2
              printf '%s\n' "$DIRECT_HELP_CHANGES" >&2
              exit 1
            fi

            echo 'PULSE_AI_HELP_CHAT_VALIDATION_MODE=REGRESSION' >> "$GITHUB_ENV"
            echo 'PULSE_AI_HELP_CHAT_REGRESSION_APPLICABILITY=PASSED'
          fi

          grep -Fq 'GROUP_5_VALIDATION_MODE=REGRESSION' .github/workflows/group5-financial-operations-recovery-ci.yml
          grep -Fq 'GROUP5_RUNTIME_OWNED' .github/workflows/group5-financial-operations-recovery-ci.yml
          git diff --check "origin/$BASE_BRANCH"...HEAD
          echo 'GROUP_5_REGRESSION_APPLICABILITY_CORRECTION=PASSED'

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Validate source contract
        working-directory: src/frontend/project-time-web
        run: |
          node --check ./scripts/validate-pulse-ai-help-chat-usability.mjs
          node --check ./src/pulse-ai-help-chat-usability.js
          node ./scripts/validate-pulse-ai-help-chat-usability.mjs

      - name: Build ProjectTime API
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          GENERATED="$(find src/backend/ProjectTime.Api -maxdepth 6 -name PulseAiQuestionPlanner.g.cs -print -quit)"
          test -n "$GENERATED"
          grep -Fq 'PulseAiProductKnowledgeCatalog.Find(normalized) ?? FindKnowledgeAnswer(normalized)' "$GENERATED"
          echo "PULSE_AI_HELP_CHAT_GENERATED_PLANNER=$GENERATED"
          echo 'PULSE_AI_HELP_CHAT_API_BUILD=PASSED'

      - name: Build complete frontend production bundle
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run build
          cat dist/assets/*.js > /tmp/pulse-ai-help-chat.js
          cat dist/assets/*.css > /tmp/pulse-ai-help-chat.css
          grep -Fq 'pulse-ai-help-chat-usability-v1' /tmp/pulse-ai-help-chat.js
          grep -Fq 'Enter sends' /tmp/pulse-ai-help-chat.js
          grep -Fq 'Shift+Enter adds a line' /tmp/pulse-ai-help-chat.js
          grep -Fq '.pulse-ai-help-keyboard-hint' /tmp/pulse-ai-help-chat.css
          grep -Fq 'overscroll-behavior:contain' /tmp/pulse-ai-help-chat.css
          git -C ../../.. diff --check
          git -C ../../.. diff --exit-code
          echo 'PULSE_AI_HELP_CHAT_FRONTEND_BUILD=PASSED'

      - name: Validate web container build context
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build \
            --file deployment/containers/web/Dockerfile \
            --tag "projectpulse-help-chat:${GITHUB_SHA}" \
            .
          echo 'PULSE_AI_HELP_CHAT_WEB_CONTAINER_BUILD=PASSED'

      - name: Publish validation summary
        shell: bash
        run: |
          {
            echo '## Pulse AI Help Chat Usability'
            echo
            echo '- Conversation scrolling: restored'
            echo '- Enter submits: enabled'
            echo '- Shift+Enter newline: preserved'
            echo '- Escape closes: enabled'
            echo '- Direct Pulse AI purpose answer: enabled'
            echo "- Validation mode: ${PULSE_AI_HELP_CHAT_VALIDATION_MODE:-UNKNOWN}"
            echo '- Group 5 unrelated-PR regression mode: preserved'
            echo '- API build: passed'
            echo '- Complete frontend build: passed'
            echo '- Web container build: passed'
            echo '- Database migration: none'
            echo '- Provider call added: none'
            echo '- Deployment performed: none'
          } >> "$GITHUB_STEP_SUMMARY"
