name: Diagnose Project Planning Collaboration Access

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-project-planning-collaboration-pr.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-project-planning-collaboration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/project-planning-collaboration-access-20260818'
    name: Inspect current planning authorization source
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Print guarded access source excerpts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = {
              'FLOWHIVE_CORE': Path('src/backend/ProjectTime.Api/Modules/ProjectFlowHiveModule.cs'),
              'FLOWHIVE_ENTERPRISE': Path('src/backend/ProjectTime.Api/Modules/ProjectFlowHiveEnterpriseModule.cs'),
              'PROJECT_FORGE': Path('src/backend/ProjectTime.Api/Modules/ProjectForgeModule.cs'),
              'FLOWHIVE_UI': Path('src/frontend/project-time-web/src/ProjectFlowHiveCenter.jsx'),
              'FORGE_UI': Path('src/frontend/project-time-web/src/ProjectForgeCenter.jsx'),
          }

          method_names = {
              'FLOWHIVE_CORE': ['LoadAccessContextAsync', 'GetPortfolioAsync', 'WriteActor'],
              'FLOWHIVE_ENTERPRISE': ['OpenAuthorizedAsync', 'LoadProjectAccessAsync', 'SaveWorkingCopyAsync'],
              'PROJECT_FORGE': ['LoadAccessAsync', 'CanAccessProjectAsync', 'AddAccessParameters', 'GetBootstrapAsync', 'CreatePlanAsync', 'UpdatePlanAsync', 'AdoptPlanAsync'],
          }

          def extract_block(source: str, marker: str) -> str:
              marker_index = source.find(marker)
              if marker_index < 0:
                  return f'NOT_FOUND: {marker}'
              signature_start = source.rfind('\n', 0, marker_index) + 1
              brace = source.find('{', marker_index)
              if brace < 0:
                  return source[signature_start:marker_index + 500]
              depth = 0
              in_string = False
              verbatim = False
              quote = ''
              i = brace
              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''
                  if in_string:
                      if verbatim:
                          if ch == '"' and nxt == '"':
                              i += 2
                              continue
                          if ch == '"':
                              in_string = False
                      else:
                          if ch == '\\':
                              i += 2
                              continue
                          if ch == quote:
                              in_string = False
                      i += 1
                      continue
                  if ch == '@' and nxt == '"':
                      in_string = True
                      verbatim = True
                      quote = '"'
                      i += 2
                      continue
                  if ch in ('"', "'"):
                      in_string = True
                      verbatim = False
                      quote = ch
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return source[signature_start:i + 1]
                  i += 1
              return source[signature_start:brace + 4000]

          for label, path in targets.items():
              print(f'\n===== {label}: {path} =====')
              if not path.exists():
                  print('FILE_NOT_FOUND')
                  continue
              source = path.read_text()
              if label in method_names:
                  for method in method_names[label]:
                      print(f'\n--- {method} ---')
                      print(extract_block(source, method)[:22000])
              else:
                  for pattern in [
                      r'canManage.{0,160}',
                      r'canEdit.{0,160}',
                      r'canShare.{0,160}',
                      r'access\?\..{0,160}',
                      r'projectManager.{0,160}',
                  ]:
                      matches = re.findall(pattern, source, flags=re.I | re.S)
                      if matches:
                          print(f'\n--- pattern {pattern} ---')
                          for match in matches[:30]:
                              print(match.replace('\n', ' ')[:500])

          forge = targets['PROJECT_FORGE'].read_text()
          for token in ['record ProjectForgeAccess', 'sealed record ProjectForgeAccess', 'ProjectsSql', 'TasksSql', 'AssignmentsSql']:
              print(f'\n===== PROJECT_FORGE_TOKEN {token} =====')
              print(extract_block(forge, token)[:26000])

          enterprise = targets['FLOWHIVE_ENTERPRISE'].read_text()
          for token in ['record ProjectFlowHiveEnterpriseAccess', 'sealed record ProjectFlowHiveEnterpriseAccess', 'record AccessContext', 'sealed record AccessContext']:
              if token in enterprise:
                  print(f'\n===== FLOWHIVE_ENTERPRISE_TOKEN {token} =====')
                  print(extract_block(enterprise, token)[:18000])

          print('\n===== TEAM_SCOPE_REFERENCES =====')
          roots = [Path('src/backend'), Path('database/migrations')]
          needles = re.compile(r'(engineering_team|team_member|lead_user_id|manager_user_id|reports_to|supervisor_user_id)', re.I)
          count = 0
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.cs', '.sql'}:
                      continue
                  for number, line in enumerate(path.read_text(errors='ignore').splitlines(), 1):
                      if needles.search(line):
                          print(f'{path}:{number}:{line.strip()}')
                          count += 1
                          if count >= 300:
                              raise SystemExit(0)
          PY
