name: Publish Corrected Test Controller Base Tree

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-test-controller-b0aedc70.yml'

permissions:
  contents: write

concurrency:
  group: publish-corrected-test-controller-base-tree
  cancel-in-progress: false

jobs:
  publish:
    name: Record the validated branch tree for authorized publication
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact release-controller branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: release/test-modules-081-082-theme-b0aedc70-20260809
          fetch-depth: 0

      - name: Publish the current tree identifier as a non-workflow artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p .projectpulse-release-artifacts
          printf '%s\n' "$TREE_SHA" \
            > .projectpulse-release-artifacts/base-tree-sha.txt
          git add .projectpulse-release-artifacts/base-tree-sha.txt
          git diff --cached --check
          git config user.name 'ProjectPulse Release Automation'
          git config user.email 'projectpulse-release-automation@users.noreply.github.com'
          git commit -m 'chore: record corrected Test controller base tree'
          git push origin HEAD:release/test-modules-081-082-theme-b0aedc70-20260809
