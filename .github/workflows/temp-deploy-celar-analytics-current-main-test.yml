name: Temporary Deploy Celar AI and Analytics Current Main to Test

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/deploy-celar-analytics-current-main-test-trigger'

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-celar-analytics-current-main-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == 'ahmedadeyemi-cts'
    name: Apply migrations 054 and 055 and deploy exact current main to Test
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EXPECTED_RELEASE_COMMIT: 1722b6476845e23ab5d6fc63b630420dcbf9a97c
      EXPECTED_TRIGGER_BRANCH: release/run-celar-analytics-current-main-test-20260731
      REQUIRED_CONFIRMATION: DEPLOY-CELAR-ANALYTICS-1722B647-TO-TEST

    steps:
      - name: Check out exact deployment trigger
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: trigger
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact deployment controls
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact cumulative source release
        uses: actions/checkout@v5
        with:
          ref: 1722b6476845e23ab5d6fc63b630420dcbf9a97c
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Guard trigger, control scope, and exact source release
        id: guard
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$BASE_REF" == main ]]
          [[ "$HEAD_REF" == "$EXPECTED_TRIGGER_BRANCH" ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C control rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ "$(git -C release rev-parse HEAD)" == "$EXPECTED_RELEASE_COMMIT" ]]

          TRIGGER_FILE='trigger/.github/deploy-celar-analytics-current-main-test-trigger'
          test -f "$TRIGGER_FILE"
          [[ "$(sed -n 's/^operation=//p' "$TRIGGER_FILE" | tail -1)" == apply-migrations-and-deploy ]]
          [[ "$(sed -n 's/^release_commit=//p' "$TRIGGER_FILE" | tail -1)" == "$EXPECTED_RELEASE_COMMIT" ]]
          [[ "$(sed -n 's/^migrations=//p' "$TRIGGER_FILE" | tail -1)" == 054,055 ]]
          [[ "$(sed -n 's/^confirmation=//p' "$TRIGGER_FILE" | tail -1)" == "$REQUIRED_CONFIRMATION" ]]

          mapfile -t TRIGGER_CHANGED < <(git -C trigger diff --name-only "$BASE_SHA...HEAD" | sort)
          diff -u \
            <(printf '%s\n' '.github/deploy-celar-analytics-current-main-test-trigger') \
            <(printf '%s\n' "${TRIGGER_CHANGED[@]}")

          git -C control merge-base --is-ancestor "$EXPECTED_RELEASE_COMMIT" HEAD
          mapfile -t CONTROL_CHANGED < <(git -C control diff --name-only "$EXPECTED_RELEASE_COMMIT...HEAD" | sort)
          cat > /tmp/expected-celar-analytics-control-files.txt <<'FILES'
          .github/workflows/temp-deploy-celar-analytics-current-main-test.yml
          scripts/temp-apply-celar-analytics-migrations-test.sh
          scripts/temp-run-celar-analytics-current-main-test-deployment.sh
          scripts/temp-run-celar-analytics-migration-job.sh
          FILES
          sed -i 's/^[[:space:]]*//' /tmp/expected-celar-analytics-control-files.txt
          sort -o /tmp/expected-celar-analytics-control-files.txt /tmp/expected-celar-analytics-control-files.txt
          diff -u /tmp/expected-celar-analytics-control-files.txt <(printf '%s\n' "${CONTROL_CHANGED[@]}")

          for file in \
            release/database/migrations/054_pulse_ai_system_intelligence_conversations.sql \
            release/database/migrations/055_analytics_center.sql \
            release/database/rollback/054_pulse_ai_system_intelligence_conversations_rollback.sql \
            release/database/rollback/055_analytics_center_rollback.sql \
            release/tests/test-pulse-ai-system-intelligence-migration-054.sh \
            release/tests/test-analytics-center-migration-055.sh \
            release/src/backend/ProjectTime.Api/Modules/PulseAiSystemIntelligenceModule.cs \
            release/src/backend/ProjectTime.Api/Modules/CelarAiBrandModule.cs \
            release/src/backend/ProjectTime.Api/Modules/AnalyticsCenterModule.cs \
            release/src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs \
            release/src/frontend/project-time-web/scripts/validate-module-011-system-intelligence-package.mjs \
            release/src/frontend/project-time-web/scripts/validate-analytics-center.mjs \
            release/src/frontend/project-time-web/src/CelarAiProviderBridgePanel.jsx \
            release/src/frontend/project-time-web/src/AnalyticsCenter.jsx \
            release/deployment/containers/api/Dockerfile \
            release/deployment/containers/web/Dockerfile \
            control/deployment/containers/pr55-migrator/Dockerfile \
            control/scripts/build-pr55-acr-image.sh \
            control/scripts/export-pr55-test-database-url.sh \
            control/scripts/wait-containerapp-ready-revision.sh \
            control/scripts/temp-apply-celar-analytics-migrations-test.sh \
            control/scripts/temp-run-celar-analytics-current-main-test-deployment.sh \
            control/scripts/temp-run-celar-analytics-migration-job.sh; do
            test -f "$file"
          done

          bash -n control/scripts/temp-apply-celar-analytics-migrations-test.sh
          bash -n control/scripts/temp-run-celar-analytics-migration-job.sh
          bash -n control/scripts/temp-run-celar-analytics-current-main-test-deployment.sh
          git -C control diff --check "$EXPECTED_RELEASE_COMMIT...HEAD"
          echo "control_commit=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo 'CELAR_ANALYTICS_DEPLOYMENT_GUARD=PASS'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: release/src/frontend/project-time-web/package-lock.json

      - name: Rebuild and revalidate exact source before Azure changes
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x \
            release/tests/test-pulse-ai-system-intelligence-migration-054.sh \
            release/tests/test-analytics-center-migration-055.sh
          release/tests/test-pulse-ai-system-intelligence-migration-054.sh
          release/tests/test-analytics-center-migration-055.sh

          dotnet build release/src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
          GENERATED="$(find release/src/backend/ProjectTime.Api -maxdepth 8 -name Program.ScopedRbac.g.cs -print -quit)"
          test -n "$GENERATED"
          grep -Fq 'app.MapPulseAiSystemIntelligenceEndpoints();' "$GENERATED"
          grep -Fq 'app.MapCelarAiBrandEndpoints();' "$GENERATED"
          grep -Fq 'app.MapAnalyticsCenterEndpoints();' "$GENERATED"

          pushd release/src/frontend/project-time-web >/dev/null
          node --check ./scripts/inject-celar-ai-runtime-rebrand.mjs
          node --check ./scripts/inject-analytics-center.mjs
          node --check ./scripts/validate-celar-ai-runtime-rebrand.mjs
          node --check ./scripts/validate-analytics-center.mjs
          node ./scripts/validate-module-011-pulse-ai.mjs
          node ./scripts/validate-pulse-ai-help-chat-usability.mjs
          node ./scripts/validate-module-011-system-intelligence-package.mjs
          node ./scripts/inject-pulse-ai-system-chat-group7-compatibility.mjs
          node ./scripts/inject-celar-ai-runtime-rebrand.mjs
          node ./scripts/validate-celar-ai-runtime-rebrand.mjs
          node ./scripts/validate-analytics-center.mjs
          npm ci --no-audit --no-fund
          npm run validate:group7-ai-help-system-guide
          npm run validate:analytics-center
          npm run build

          cat dist/assets/*.js > /tmp/celar-analytics-runtime.js
          cat dist/assets/*.css > /tmp/celar-analytics-runtime.css
          for marker in \
            'Ask Celar AI' \
            'Celar AI Workbench' \
            'Speed of light. Speed of delivery.' \
            '/api/celar-ai/v1/chat' \
            'Private intelligence and governed provider routing' \
            'Analytics Center' \
            'Select report' \
            'All customers' \
            'All projects' \
            'All engineers' \
            'Preview report' \
            'Run & save' \
            '/api/analytics/catalog' \
            '/api/analytics/filter-options'; do
            grep -Fq "$marker" /tmp/celar-analytics-runtime.js
          done
          for marker in \
            '.celar-ai-provider-bridge' \
            '.celar-ai-provider-bridge__route-grid' \
            '.analytics-center' \
            '.analytics-report-cards' \
            '.analytics-filter-grid' \
            '.analytics-history-list'; do
            grep -Fq "$marker" /tmp/celar-analytics-runtime.css
          done
          ! grep -Fq 'selectedEngineerSummaryText' /tmp/celar-analytics-runtime.js
          popd >/dev/null

          docker build \
            --file release/deployment/containers/web/Dockerfile \
            --tag "projectpulse-celar-analytics:${EXPECTED_RELEASE_COMMIT}" \
            release
          echo 'CELAR_ANALYTICS_PRE_DEPLOYMENT_REVALIDATION=PASS'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Load Test database connection from the current API Container App
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        run: bash control/scripts/export-pr55-test-database-url.sh

      - name: Build checksum-pinned migrations 054 and 055 image
        id: migration
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/celar-analytics-migrations-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          install -m 0644 control/deployment/containers/pr55-migrator/Dockerfile "$CONTEXT/Dockerfile"
          install -m 0755 control/scripts/temp-apply-celar-analytics-migrations-test.sh "$CONTEXT/apply-pr55-test-migrations.sh"
          install -m 0644 release/database/migrations/054_pulse_ai_system_intelligence_conversations.sql "$CONTEXT/migrations/054_pulse_ai_system_intelligence_conversations.sql"
          install -m 0644 release/database/migrations/055_analytics_center.sql "$CONTEXT/migrations/055_analytics_center.sql"
          (
            cd "$CONTEXT/migrations"
            sha256sum \
              054_pulse_ai_system_intelligence_conversations.sql \
              055_analytics_center.sql > SHA256SUMS
          )
          printf '%s\n' "$EXPECTED_RELEASE_COMMIT" > "$CONTEXT/release-commit"
          DIGEST="$(control/scripts/build-pr55-acr-image.sh \
            '${{ vars.AZURE_ACR_NAME }}' \
            "project-health-dashboard-migrations054055:${EXPECTED_RELEASE_COMMIT}-${GITHUB_SHA:0:12}" \
            "$CONTEXT/Dockerfile" \
            "$CONTEXT")"
          [[ "$DIGEST" == sha256:* ]]
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-migrations054055@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Apply migrations 054 and 055 inside the Test private network
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          CELAR_ANALYTICS_MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
          CELAR_ANALYTICS_MIGRATION_JOB_NAME: ca55-${{ github.run_id }}-${{ github.run_attempt }}-a
          CELAR_ANALYTICS_MIGRATION_LOG_DIR: ${{ runner.temp }}/celar-analytics-migration-logs
          PROJECTPULSE_CELAR_ANALYTICS_MIGRATION_MODE: apply
        run: bash control/scripts/temp-run-celar-analytics-migration-job.sh

      - name: Reverify migrations 054 and 055 without database writes
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          CELAR_ANALYTICS_MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
          CELAR_ANALYTICS_MIGRATION_JOB_NAME: ca55-${{ github.run_id }}-${{ github.run_attempt }}-v
          CELAR_ANALYTICS_MIGRATION_LOG_DIR: ${{ runner.temp }}/celar-analytics-migration-logs
          PROJECTPULSE_CELAR_ANALYTICS_MIGRATION_MODE: verify
        run: bash control/scripts/temp-run-celar-analytics-migration-job.sh

      - name: Build, deploy, validate, and preserve rollback evidence
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: >-
          bash control/scripts/temp-run-celar-analytics-current-main-test-deployment.sh
          control
          release
          "$EXPECTED_RELEASE_COMMIT"

      - name: Record immutable workflow evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p control/evidence
          cat > control/evidence/celar-analytics-current-main-test-workflow.json <<JSON
          {
            "environment": "test",
            "releaseCommit": "$EXPECTED_RELEASE_COMMIT",
            "controlCommit": "${{ steps.guard.outputs.control_commit }}",
            "workflowRunId": "$GITHUB_RUN_ID",
            "workflowRunAttempt": "$GITHUB_RUN_ATTEMPT",
            "migrationIds": [
              "054_pulse_ai_system_intelligence_conversations",
              "055_analytics_center"
            ],
            "migrationImage": "${{ steps.migration.outputs.image }}",
            "migrationDigest": "${{ steps.migration.outputs.digest }}",
            "migrationApply": "succeeded",
            "migrationVerifyOnly": "succeeded",
            "apiWebDeployment": "succeeded",
            "celarAiIncluded": true,
            "analyticsCenterIncluded": true,
            "providerCredentialsChanged": false,
            "privateModelConfigured": false,
            "productionChanged": false,
            "authenticatedUat": "required"
          }
          JSON
          echo 'CELAR_ANALYTICS_CURRENT_MAIN_TEST_WORKFLOW=COMPLETE'

      - name: Upload migration and deployment diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celar-analytics-current-main-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            control/evidence/
            ${{ runner.temp }}/celar-analytics-migration-logs/
            ${{ runner.temp }}/celar-analytics-1722b647-probes/
          if-no-files-found: warn
          retention-days: 30
