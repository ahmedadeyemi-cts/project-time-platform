name: Sync PR477 Generated Launch Source

on:
  push:
    branches:
      - uat/module006-customer-enterprise-ui-polish
    paths:
      - '.github/workflows/pr477-sync-generated-launch-source.yml'

permissions:
  contents: write

concurrency:
  group: sync-pr477-generated-launch-source
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.head_commit.message == 'Sync PR477 generated launch source'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_PARENT_SHA: 149c2ef4c6664204535a796aa67666280892b44d
      TARGET_BRANCH: uat/module006-customer-enterprise-ui-polish
    steps:
      - name: Check out exact branch control commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard one-time source synchronization boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/$TARGET_BRANCH" ]]
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT_SHA" ]]
          [[ "$(git diff --name-only HEAD^ HEAD)" == '.github/workflows/pr477-sync-generated-launch-source.yml' ]]
          echo 'PR477_GENERATED_SOURCE_CONTROL=PASS'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Generate the canonical launch-path sources
        shell: bash
        run: |
          set -Eeuo pipefail
          cd src/frontend/project-time-web
          npm ci
          sed -i "s#import usSignalLogoUrl from '../brand/ussignal.png';#import usSignalLogoUrl from '../brand/USSNavyStacked.png';#" src/App.jsx
          grep -Fq "import usSignalLogoUrl from '../brand/USSNavyStacked.png';" src/App.jsx
          npm run prebuild
          node ./scripts/inject-celar-ai-runtime-rebrand.mjs
          grep -Fq "import usSignalLogoUrl from '../brand/USSNavyStacked.png';" src/App.Module001.g.jsx
          grep -Fq 'PROJECTPULSE_REACT_OWNED_MORE_MENU' src/App.Module001.g.jsx
          grep -Fq 'MODULE_006_CUSTOMER_EXPANSION_START' scripts/inject-module-006-toyota-hyundai-pipeline.mjs

      - name: Commit only canonical and generated launch sources
        shell: bash
        run: |
          set -Eeuo pipefail
          git add src/frontend/project-time-web/src/App.jsx
          git add -f \
            src/frontend/project-time-web/src/App.Module001.g.jsx \
            src/frontend/project-time-web/src/SystemUserGuide.Module001.g.jsx

          mapfile -t CHANGED < <(git diff --cached --name-only | sort)
          printf 'PR477_GENERATED_SOURCE_CHANGED=%s\n' "${CHANGED[*]}"
          test "${#CHANGED[@]}" -ge 2
          for path in "${CHANGED[@]}"; do
            case "$path" in
              src/frontend/project-time-web/src/App.jsx|\
              src/frontend/project-time-web/src/App.Module001.g.jsx|\
              src/frontend/project-time-web/src/SystemUserGuide.Module001.g.jsx) ;;
              *) echo "Unexpected generated-source change: $path" >&2; exit 1 ;;
            esac
          done

          git config user.name 'Project Health Dashboard Source Convergence'
          git config user.email 'project-health-dashboard-source@users.noreply.github.com'
          git commit -m 'Commit PR477 generated launch source'
          git push origin "HEAD:$TARGET_BRANCH"
          echo 'PR477_GENERATED_SOURCE_SYNC=PASS'
