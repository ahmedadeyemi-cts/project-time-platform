name: ProjectPulse Deploy Super Admin, SSO, Expense Billing, and Module 006 Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified Super Administrator, SSO, expense billing, Module 006, and Module 003 source release
        required: true
        default: 185a0030dbc96813c8cd46498668ca289805a4d7
        type: string
      confirmation:
        description: Enter DEPLOY-SUPERADMIN-SSO-EXPENSE-MODULE006-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-test
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded Super Administrator, SSO, expense billing, Module 006, API, and web test deployment
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_RELEASE_COMMIT: 185a0030dbc96813c8cd46498668ca289805a4d7

    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact verified source release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 1

      - name: Guard workflow source and validate exact release
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$WORKFLOW_SOURCE_REF" == 'refs/heads/main' ]] || {
            echo 'Dispatch this workflow from main.' >&2
            exit 1
          }
          [[ "$DISPATCH_CONFIRMATION" == 'DEPLOY-SUPERADMIN-SSO-EXPENSE-MODULE006-TO-TEST' ]] || {
            echo 'The deployment confirmation text does not match.' >&2
            exit 1
          }
          [[ "$DISPATCH_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release_commit must be a complete 40-character SHA.' >&2
            exit 1
          }

          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == "$WORKFLOW_SOURCE_SHA" ]]
          [[ "$TARGET_COMMIT" == "$DISPATCH_RELEASE_COMMIT" ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]] || {
            echo 'Only the verified Super Administrator, SSO, expense billing, Module 006, and Module 003 release may deploy.' >&2
            exit 1
          }
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD || {
            echo 'The source release is not an ancestor of the deployment controls.' >&2
            exit 1
          }

          ACTUAL_AUTHORITY='release/src/backend/ProjectTime.Api/Modules/ProjectPulseActualSessionAuthority.cs'
          SCOPED_BRIDGE='release/src/backend/ProjectTime.Api/Modules/ScopedRolePolicyAuthorizationBridge.cs'
          GOVERNED_AUTH='release/src/backend/ProjectTime.Api/Modules/GovernedOperationsReadModule.cs'
          MODULE026='release/src/backend/ProjectTime.Api/Modules/CrmErpAdministrationExperience.cs'
          GLOBAL_MAIL='release/src/backend/ProjectTime.Api/Modules/GlobalMailConfigurationModule.cs'
          PUBLIC_ORIGIN='release/src/backend/ProjectTime.Api/Modules/ProjectPulsePublicOriginCompatibility.cs'
          SSO_ACTIVATION='release/src/backend/ProjectTime.Api/Modules/MicrosoftSsoInteractiveStartActivation.cs'
          EXPENSE_ACK='release/src/backend/ProjectTime.Api/Modules/Module005ProjectExpenseBillingAcknowledgement.cs'
          EXPENSE_CONTINUITY='release/src/backend/ProjectTime.Api/Modules/Module005ProjectExpenseBillingContinuitySafe.cs'
          PROJECT='release/src/backend/ProjectTime.Api/ProjectTime.Api.csproj'
          EXPENSE_PORTAL='release/src/frontend/project-time-web/src/ProjectExpenseCrossModulePortal.jsx'
          EXPENSE_CSS='release/src/frontend/project-time-web/src/project-expense-cross-module.css'
          MODULE_REGISTRY='release/src/frontend/project-time-web/src/module-availability-registry.js'
          MODULE006_GENERATOR='release/src/frontend/project-time-web/scripts/inject-module-006-toyota-hyundai-pipeline.mjs'
          RBAC_COMPAT='release/src/frontend/project-time-web/src/scoped-rbac-catalog-compatibility.js'
          UTILIZATION='release/src/frontend/project-time-web/src/EngineeringTeamLeadUtilizationPanel.jsx'
          UTILIZATION_CSS='release/src/frontend/project-time-web/src/engineering-team-lead-utilization.css'

          for required in \
            "$ACTUAL_AUTHORITY" "$SCOPED_BRIDGE" "$GOVERNED_AUTH" "$MODULE026" \
            "$GLOBAL_MAIL" "$PUBLIC_ORIGIN" "$SSO_ACTIVATION" \
            "$EXPENSE_ACK" "$EXPENSE_CONTINUITY" "$PROJECT" \
            "$EXPENSE_PORTAL" "$EXPENSE_CSS" "$MODULE_REGISTRY" \
            "$MODULE006_GENERATOR" "$RBAC_COMPAT" "$UTILIZATION" "$UTILIZATION_CSS" \
            release/tests/ProjectTime.Api.RouteResultExecutionTests/ProjectTime.Api.RouteResultExecutionTests.csproj \
            release/tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj \
            release/tests/test-projectpulse-api-startup.sh \
            release/src/frontend/project-time-web/scripts/validate-superadmin-sso-expense-module006-package.mjs \
            release/src/frontend/project-time-web/scripts/validate-module-005-project-expense-upload.mjs \
            release/src/frontend/project-time-web/scripts/validate-module-026-crm-erp-integrations.mjs \
            release/src/frontend/project-time-web/scripts/validate-modules-003-004-rolling-years.mjs \
            release/src/frontend/project-time-web/scripts/validate-microsoft-integration-authoritative-connection.mjs \
            release/src/frontend/project-time-web/scripts/validate-microsoft-sso-runtime-wiring.mjs \
            release/src/frontend/project-time-web/scripts/validate-dynamic-rbac-administration.mjs \
            release/src/frontend/project-time-web/scripts/validate-group-2a-provider-neutral-platform-operations.mjs \
            control/scripts/run-superadmin-sso-expense-module006-test-deployment.sh; do
            test -f "$required"
          done

          grep -Fq 'SUPER_ADMINISTRATOR' "$ACTUAL_AUTHORITY"
          grep -Fq 'ProjectPulseActualUserId' "$ACTUAL_AUTHORITY"
          grep -Fq 'if (IsViewAs(context)) return false;' "$ACTUAL_AUTHORITY"
          grep -Fq 'assignment.is_active = TRUE' "$ACTUAL_AUTHORITY"
          grep -Fq 'ProjectPulseActualSessionAuthority.IsSuperAdministratorAsync' "$SCOPED_BRIDGE"
          grep -Fq 'Super Administrator has permanent organization-wide Full Control in their own session.' "$SCOPED_BRIDGE"
          grep -Fq 'ProjectPulseActualSessionAuthority.IsSuperAdministratorAsync' "$GOVERNED_AUTH"
          grep -Fq 'actual_session_super_administrator' "$GOVERNED_AUTH"
          grep -Fq 'canManage = authority.Allowed' "$MODULE026"
          grep -Fq 'manageAuthoritySource = authority.Source' "$MODULE026"
          grep -Fq 'viewAsTransfersMutationAuthority = false' "$MODULE026"

          grep -Fq 'app.UseProjectPulsePublicOriginCompatibility();' "$GLOBAL_MAIL"
          grep -Fq 'app.UseMicrosoftPublicSsoOriginCompatibility();' "$GLOBAL_MAIL"
          grep -Fq 'private const string InteractiveSsoPrefix = "/api/auth/sso/"' "$GLOBAL_MAIL"
          grep -Fq 'path.StartsWith("/api/auth/sso/"' "$PUBLIC_ORIGIN"
          grep -Fq 'ForwardedValues(request.Headers["X-Forwarded-Host"].ToString())' "$PUBLIC_ORIGIN"
          grep -Fq 'trusted_forwarded_origin' "$PUBLIC_ORIGIN"
          ! grep -Fq '.azurecontainerapps.io' "$PUBLIC_ORIGIN"
          grep -Fq 'ExpectedRedirect(context, environmentMode, profile)' "$SSO_ACTIVATION"
          grep -Fq 'trusted_public_origin_unavailable' "$SSO_ACTIVATION"
          grep -Fq 'stored_environment_profile' "$SSO_ACTIVATION"
          ! grep -Fq 'return $"{context.Request.Scheme}://{context.Request.Host}{CallbackPath}";' "$SSO_ACTIVATION"

          grep -Fq '/api/project-expenses/projects/{projectId:guid}/billing-context' "$EXPENSE_ACK"
          grep -Fq '/api/project-expenses/projects/{projectId:guid}/billing-acknowledgement' "$EXPENSE_ACK"
          grep -Fq 'upload.is_current = TRUE' "$EXPENSE_ACK"
          grep -Fq 'upload.deleted_at IS NULL' "$EXPENSE_ACK"
          grep -Fq 'expense-only-pass-through' "$EXPENSE_ACK"
          grep -Fq 'expense-included-fixed-price' "$EXPENSE_ACK"
          grep -Fq "SET review_status = 'blocked'" "$EXPENSE_ACK"
          grep -Fq 'UseProjectExpenseBillingReadinessContinuitySafe' "$EXPENSE_CONTINUITY"
          grep -Fq '!ProjectPulseActualSessionAuthority.IsViewAs(context)' "$EXPENSE_CONTINUITY"
          grep -Fq 'app.UseProjectExpenseBillingReadinessContinuitySafe();' "$PROJECT"
          grep -Fq 'app.MapModule005ProjectExpenseBillingAcknowledgementEndpoints();' "$PROJECT"

          grep -Fq 'const [open, setOpen] = useState(false)' "$EXPENSE_PORTAL"
          grep -Fq 'data-project-expense-cross-module="non-invasive-v2"' "$EXPENSE_PORTAL"
          grep -Fq 'Choose a project only when expense context is needed' "$EXPENSE_PORTAL"
          grep -Fq '/billing-acknowledgement' "$EXPENSE_PORTAL"
          ! grep -Fq "result.projects?.[0]?.projectId" "$EXPENSE_PORTAL"
          grep -Fq '.expense-cross-module-shell.is-open' "$EXPENSE_CSS"
          grep -Fq '.expense-cross-module-launcher' "$EXPENSE_CSS"

          grep -Fq "displayName: 'Toyota & Hyundai Pipeline'" "$MODULE_REGISTRY"
          grep -Fq "group: 'Sales & Opportunities'" "$MODULE_REGISTRY"
          grep -Fq 'MODULE_006_TOYOTA_HYUNDAI_PIPELINE_GENERATION=PASS' "$MODULE006_GENERATOR"
          grep -Fq "'006': 'Toyota & Hyundai Pipeline'" "$RBAC_COMPAT"
          grep -Fq '<table className="engineering-utilization-table">' "$UTILIZATION"
          grep -Fq '<th scope="col">Annual utilization</th>' "$UTILIZATION"
          grep -Fq '.engineering-utilization-table-wrap' "$UTILIZATION_CSS"
          grep -Fq 'position: sticky' "$UTILIZATION_CSS"

          (
            cd release
            dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release
            dotnet run \
              --project tests/ProjectTime.Api.RouteResultExecutionTests/ProjectTime.Api.RouteResultExecutionTests.csproj \
              --configuration Release
            dotnet run \
              --project tests/ProjectTime.Api.AuthorizationTests/ProjectTime.Api.AuthorizationTests.csproj \
              --configuration Release
            bash tests/test-projectpulse-api-startup.sh
          )

          (
            cd release/src/frontend/project-time-web
            npm ci --no-audit --no-fund
            npm run validate:superadmin-sso-expense-module006
            npm run validate:module005
            npm run validate:module026
            npm run validate:modules021026
            npm run validate:modules003004-rolling-years
            npm run validate:microsoft-connection
            npm run validate:microsoft-sso-runtime
            npm run validate:dynamic-rbac
            node scripts/validate-group-1-navigation-work-consolidation.mjs
            node scripts/validate-group-2a-provider-neutral-platform-operations.mjs
            npm run build

            cat dist/assets/*.js > /tmp/superadmin-sso-expense-module006-local.js
            cat dist/assets/*.css > /tmp/superadmin-sso-expense-module006-local.css
            for marker in \
              'Edit connection' \
              'Add CRM platform' \
              '/billing-context' \
              '/billing-acknowledgement' \
              'non-invasive-v2' \
              'Toyota & Hyundai Pipeline' \
              'engineering-utilization-manager-table' \
              '/api/rbac/v1/bootstrap' \
              '/api/platform-operations/overview'; do
              grep -Fq "$marker" /tmp/superadmin-sso-expense-module006-local.js
            done
            for marker in \
              '.expense-cross-module-launcher' \
              '.expense-cross-module-shell.is-open' \
              '.expense-cross-acknowledgement' \
              '.engineering-utilization-table-wrap' \
              '.projectpulse-more-intuitive-name'; do
              grep -Fq "$marker" /tmp/superadmin-sso-expense-module006-local.css
            done
          )

          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'SUPERADMIN_SSO_EXPENSE_MODULE006_SOURCE_VALIDATION=PASS'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build, deploy, validate, and preserve rollback evidence
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: >-
          bash control/scripts/run-superadmin-sso-expense-module006-test-deployment.sh
          control
          release
          '${{ steps.release.outputs.target_commit }}'

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superadmin-sso-expense-module006-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            control/evidence/
            ${{ runner.temp }}/superadmin-sso-expense-module006-probes/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload immutable deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: superadmin-sso-expense-module006-test-${{ github.run_id }}
          path: control/evidence/superadmin-sso-expense-module006-test-deployment.json
          retention-days: 30
