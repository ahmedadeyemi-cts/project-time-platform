name: Bootstrap encrypted Migration 087 Test envelope

on:
  push:
    branches:
      - security/m087-test-envelope-bootstrap-20260813
    paths:
      - .github/workflows/publish-pulse-ai-architecture-v1-1.yml

permissions:
  contents: write

concurrency:
  group: m087-test-envelope-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Generate public envelope key without exposing Test secrets
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/security/m087-test-envelope-bootstrap-20260813'
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: security/m087-test-envelope-bootstrap-20260813
      ENVELOPE_KEY: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}

    steps:
      - name: Check out exact bootstrap branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Generate and protect the one-time RSA envelope
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/$TARGET_BRANCH" ]] || fail 'Unauthorized bootstrap branch.'
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || fail 'Bootstrap checkout is not the exact triggering commit.'
          [[ -n "$ENVELOPE_KEY" ]] || fail 'The protected Test envelope key is unavailable.'
          command -v openssl >/dev/null || fail 'OpenSSL is required.'

          umask 077
          ROOT='.release-security/m087'
          WORK="$RUNNER_TEMP/m087-envelope"
          install -d -m 0700 "$ROOT" "$WORK"

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out "$WORK/private.pem" \
            >/dev/null 2>&1
          openssl pkey \
            -in "$WORK/private.pem" \
            -pubout \
            -out "$ROOT/public.pem"
          openssl enc \
            -aes-256-cbc \
            -salt \
            -pbkdf2 \
            -iter 600000 \
            -in "$WORK/private.pem" \
            -out "$ROOT/private.pem.enc" \
            -pass env:ENVELOPE_KEY

          unset ENVELOPE_KEY
          rm -f "$WORK/private.pem"
          rmdir "$WORK"
          chmod 0644 "$ROOT/public.pem" "$ROOT/private.pem.enc"
          openssl pkey -pubin -in "$ROOT/public.pem" -noout
          [[ -s "$ROOT/private.pem.enc" ]] || fail 'Encrypted private envelope was not created.'
          ! find "$ROOT" -type f -name 'private.pem' -print -quit | grep -q . \
            || fail 'Unencrypted private key material remains.'

      - name: Restore the permanent publisher and commit only encrypted artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          git show origin/main:.github/workflows/publish-pulse-ai-architecture-v1-1.yml \
            > .github/workflows/publish-pulse-ai-architecture-v1-1.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/publish-pulse-ai-architecture-v1-1.yml \
            .release-security/m087/public.pem \
            .release-security/m087/private.pem.enc

          mapfile -t changed < <(git diff --cached --name-only | sort)
          [[ ${#changed[@]} -eq 3 ]] || {
            printf 'Unexpected staged file: %s\n' "${changed[@]}" >&2
            exit 1
          }
          [[ "${changed[0]}" == '.github/workflows/publish-pulse-ai-architecture-v1-1.yml' ]]
          [[ "${changed[1]}" == '.release-security/m087/private.pem.enc' ]]
          [[ "${changed[2]}" == '.release-security/m087/public.pem' ]]
          git diff --cached --check
          git commit -m 'Generate encrypted Migration 087 Test credential envelope'
          git push origin "HEAD:$TARGET_BRANCH"
