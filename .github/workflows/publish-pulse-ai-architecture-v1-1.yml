# Temporary, narrowly gated ordinary-blob publisher for PR #393.
# The original architecture publisher is restored after the repair is merged.
name: Publish workflow-convergence marker-scope blobs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: workflow-convergence-marker-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.number == 393 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Generate verified ordinary snapshots
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_BRANCH" == 'fix/remaining-release-train-specialized-workflow-convergence-20260801-dependency-applicability' ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD_SHA" ]]

          python3 .github/scripts/publish_workflow_convergence_blobs.py
          git diff --check

          mkdir -p .github/generated
          cp .github/workflows/celar-ai-runtime-rebrand-ci.yml \
             .github/generated/celar-ai-runtime-rebrand-ci.workflow-convergence.yml.txt
          cp .github/workflows/pulse-ai-system-intelligence-ci.yml \
             .github/generated/pulse-ai-system-intelligence-ci.workflow-convergence.yml.txt
          sha256sum .github/generated/*.txt \
            > .github/generated/workflow-convergence-marker-scope.SHA256SUMS
          printf '%s\n' "$EXPECTED_HEAD_SHA" \
            > .github/generated/workflow-convergence-marker-scope.source-sha

          # The Actions token never writes workflow paths. It restores them before
          # committing and pushes only ordinary files under .github/generated.
          git checkout -- \
            .github/workflows/celar-ai-runtime-rebrand-ci.yml \
            .github/workflows/pulse-ai-system-intelligence-ci.yml
          git diff --check

      - name: Commit ordinary snapshot blobs only
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/generated/

          mapfile -t CHANGED < <(git diff --cached --name-only | LC_ALL=C sort)
          EXPECTED=(
            '.github/generated/celar-ai-runtime-rebrand-ci.workflow-convergence.yml.txt'
            '.github/generated/pulse-ai-system-intelligence-ci.workflow-convergence.yml.txt'
            '.github/generated/workflow-convergence-marker-scope.SHA256SUMS'
            '.github/generated/workflow-convergence-marker-scope.source-sha'
          )
          printf '%s\n' "${CHANGED[@]}"
          [[ "${#CHANGED[@]}" == "${#EXPECTED[@]}" ]]
          diff -u \
            <(printf '%s\n' "${EXPECTED[@]}") \
            <(printf '%s\n' "${CHANGED[@]}")

          git commit -m 'CI: publish verified workflow-convergence marker-scope blobs'
          git push origin "HEAD:${TARGET_BRANCH}"
