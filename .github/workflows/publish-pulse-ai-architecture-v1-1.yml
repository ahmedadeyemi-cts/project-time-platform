# One-time, narrowly gated lockfile generator for PR #392.
# The original architecture publisher is restored immediately after reconciliation.
name: Reconcile Vite React plugin lockfile for PR 392

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/frontend/project-time-web/package.json'
      - 'src/frontend/project-time-web/package-lock.json'

permissions:
  contents: write

concurrency:
  group: pr-392-vite-plugin-lockfile-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.number == 392 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dependencies/vite-plugin-react-6.0.4-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: dependencies/vite-plugin-react-6.0.4-20260801
      WEB_ROOT: src/frontend/project-time-web

    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Enforce exact dependency-reconciliation boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_HEAD_REF" == "$TARGET_BRANCH" ]]
          [[ "$(git rev-parse HEAD)" == '${{ github.event.pull_request.head.sha }}' ]]
          git fetch origin main --no-tags
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = 'src/frontend/project-time-web/package.json'

          node - <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('src/frontend/project-time-web/package.json', 'utf8'));
          if (packageJson.devDependencies['@vitejs/plugin-react'] !== '6.0.4') {
            throw new Error('package.json must pin @vitejs/plugin-react 6.0.4');
          }
          if (!['8.5.18', '8.5.25'].includes(packageJson.devDependencies.postcss)) {
            throw new Error(`unexpected PostCSS starting version: ${packageJson.devDependencies.postcss}`);
          }
          NODE

      - name: Carry forward PostCSS and generate the combined npm lockfile
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm pkg set 'devDependencies.postcss=8.5.25'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high

      - name: Verify exact generated dependency state
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('src/frontend/project-time-web/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('src/frontend/project-time-web/package-lock.json', 'utf8'));
          const root = lock.packages[''];
          const plugin = lock.packages['node_modules/@vitejs/plugin-react'];

          const expected = [
            [packageJson.devDependencies['@vitejs/plugin-react'], '6.0.4', 'package.json plugin'],
            [packageJson.devDependencies.postcss, '8.5.25', 'package.json PostCSS'],
            [root.devDependencies['@vitejs/plugin-react'], '6.0.4', 'lock root plugin'],
            [root.devDependencies.postcss, '8.5.25', 'lock root PostCSS'],
            [plugin.version, '6.0.4', 'installed plugin'],
            [plugin.dependencies['@rolldown/pluginutils'], '^1.0.1', 'pluginutils range'],
          ];
          for (const [actual, wanted, label] of expected) {
            if (actual !== wanted) throw new Error(`${label}: expected ${wanted}, got ${actual}`);
          }
          if (!plugin.resolved.endsWith('/plugin-react-6.0.4.tgz')) {
            throw new Error(`unexpected plugin tarball: ${plugin.resolved}`);
          }
          NODE

          git diff --check
          mapfile -t CHANGED < <(git diff --name-only | LC_ALL=C sort)
          printf '%s\n' "${CHANGED[@]}"
          [[ "${#CHANGED[@]}" == 2 ]]
          [[ "${CHANGED[0]}" == 'src/frontend/project-time-web/package-lock.json' ]]
          [[ "${CHANGED[1]}" == 'src/frontend/project-time-web/package.json' ]]

      - name: Commit the reconciled dependency files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/frontend/project-time-web/package.json \
            src/frontend/project-time-web/package-lock.json
          mapfile -t STAGED < <(git diff --cached --name-only | LC_ALL=C sort)
          printf '%s\n' "${STAGED[@]}"
          [[ "${#STAGED[@]}" == 2 ]]
          [[ "${STAGED[0]}" == 'src/frontend/project-time-web/package-lock.json' ]]
          [[ "${STAGED[1]}" == 'src/frontend/project-time-web/package.json' ]]
          git commit -m 'Dependencies: reconcile Vite React plugin 6.0.4 with PostCSS 8.5.25'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo 'VITE_PLUGIN_LOCKFILE_RECONCILIATION=PASSED'
