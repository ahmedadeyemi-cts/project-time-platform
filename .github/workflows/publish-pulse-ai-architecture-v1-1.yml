name: PR436 Canonical Frontend Output Repair

on:
  push:
    branches:
      - release/consolidated-enterprise-validation-20260802
    paths:
      - .github/workflows/publish-pulse-ai-architecture-v1-1.yml
      - src/frontend/project-time-web/src/AiProviderConfigurationCenter.jsx
      - src/frontend/project-time-web/src/HelpAssistant.jsx
      - src/frontend/project-time-web/src/PulseAiCenter.jsx
      - src/frontend/project-time-web/src/PulseAiMissionControl.jsx
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr436-canonical-frontend-output-repair
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: release/consolidated-enterprise-validation-20260802

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact branch
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/$TARGET_BRANCH" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-fund

      - name: Run exact production build
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Verify and commit only deterministic canonical outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(cat <<'EOF'
          src/frontend/project-time-web/src/AiProviderConfigurationCenter.jsx
          src/frontend/project-time-web/src/HelpAssistant.jsx
          src/frontend/project-time-web/src/PulseAiCenter.jsx
          src/frontend/project-time-web/src/PulseAiMissionControl.jsx
          EOF
          )"
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$expected" | sed 's/^[[:space:]]*//' | sed '/^$/d' | LC_ALL=C sort)"

          if [[ "$actual" != "$expected" ]]; then
            echo 'The production build changed an unexpected file set.' >&2
            echo 'Expected:' >&2
            printf '%s\n' "$expected" >&2
            echo 'Actual:' >&2
            printf '%s\n' "$actual" >&2
            git status --short >&2
            git diff --stat >&2
            exit 1
          fi

          git diff --check
          git add -- \
            src/frontend/project-time-web/src/AiProviderConfigurationCenter.jsx \
            src/frontend/project-time-web/src/HelpAssistant.jsx \
            src/frontend/project-time-web/src/PulseAiCenter.jsx \
            src/frontend/project-time-web/src/PulseAiMissionControl.jsx
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(celar-ai): commit canonical frontend build outputs'
          git push origin "HEAD:$TARGET_BRANCH"
          echo 'PR436_CANONICAL_FRONTEND_OUTPUTS_PUBLISHED=YES'
