name: Apply Release Migrations 098 and 099 to Protected Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectpulse-release-migrations-098-099-test.yml'
      - 'scripts/release-test/build-and-run-release-migrations-098-099-job.sh'
      - 'scripts/release-test/run-project-planning-collaboration-migration-job.sh'
      - 'database/migrations/098_module_management_owner_storage_reconciliation.sql'
      - 'database/migrations/098_customer_directory_source_authority.sql'
      - 'database/migrations/099_module025_sow_gsd_workspace.sql'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-release-migrations-098-099-test
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify protected Test release migrations 098 and 099
    if: github.ref == 'refs/heads/main'
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EVIDENCE_DIR: /tmp/projectpulse-release-migrations-098-099-evidence

    steps:
      - name: Check out exact main release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact Protected-Test migration source
        id: guard
        shell: bash
        working-directory: release
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          [[ "$RELEASE_COMMIT" == "$GITHUB_SHA" ]] || fail 'Checkout is not the exact main release commit.'
          [[ "$GITHUB_REF" == refs/heads/main ]] || fail 'Release migrations may run only from main.'
          for required in \
            database/migrations/098_module_management_owner_storage_reconciliation.sql \
            database/migrations/098_customer_directory_source_authority.sql \
            database/migrations/099_module025_sow_gsd_workspace.sql \
            scripts/release-test/build-and-run-release-migrations-098-099-job.sh \
            scripts/release-test/run-project-planning-collaboration-migration-job.sh; do
            [[ -s "$required" ]] || fail "Required release migration artifact is missing: $required"
          done
          bash -n scripts/release-test/build-and-run-release-migrations-098-099-job.sh
          bash -n scripts/release-test/run-project-planning-collaboration-migration-job.sh
          grep -Fq '098_module_management_owner_storage_reconciliation' database/migrations/098_module_management_owner_storage_reconciliation.sql
          grep -Fq '098_customer_directory_source_authority' database/migrations/098_customer_directory_source_authority.sql
          grep -Fq 'module025_sow_gsd_engagements' database/migrations/099_module025_sow_gsd_workspace.sql
          install -d -m 0700 "$EVIDENCE_DIR"
          printf '%s\n' "$RELEASE_COMMIT" > "$EVIDENCE_DIR/release-commit.txt"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'ENVIRONMENT_SCOPE=PROTECTED_TEST_ONLY'
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Sign in to protected Test subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply and verify release migrations 098 and 099 inside Test private network
        shell: bash
        working-directory: release
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID: ${{ vars.AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID }}
          AZURE_KEY_VAULT_URI: ${{ vars.AZURE_KEY_VAULT_URI }}
          PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME: ${{ vars.PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME }}
          PROJECTPULSE_TEST_DATABASE_HOST: ${{ vars.PROJECTPULSE_TEST_DATABASE_HOST }}
          PROJECTPULSE_TEST_DATABASE_PORT: ${{ vars.PROJECTPULSE_TEST_DATABASE_PORT }}
          PROJECTPULSE_TEST_DATABASE_NAME: ${{ vars.PROJECTPULSE_TEST_DATABASE_NAME }}
          PROJECTPULSE_TEST_DATABASE_USER: ${{ vars.PROJECTPULSE_TEST_DATABASE_USER }}
          RELIABILITY_CONTROL_SHA: ${{ github.sha }}
          RELIABILITY_RELEASE_COMMIT: ${{ steps.guard.outputs.release_commit }}
        run: |
          set -Eeuo pipefail
          PROJECTPULSE_RELEASE_ROOT="$(pwd -P)" \
            bash scripts/release-test/build-and-run-release-migrations-098-099-job.sh
          test -s "$EVIDENCE_DIR/migrations-098-099.json"
          jq -e '
            .status == "applied_and_verified"
            and .environment == "protected-test"
            and .privateNetworkJob == true
            and .productionMutation == false
            and (.migrations == [
              "098_module_management_owner_storage_reconciliation",
              "098_customer_directory_source_authority",
              "099_module025_sow_gsd_workspace"
            ])
          ' "$EVIDENCE_DIR/migrations-098-099.json" >/dev/null
          echo 'PROTECTED_TEST_RELEASE_MIGRATIONS_098_099=APPLIED_AND_VERIFIED'
          echo 'PRODUCTION_MUTATION=NONE'
