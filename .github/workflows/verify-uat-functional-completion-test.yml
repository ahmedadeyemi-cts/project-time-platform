name: Verify UAT Functional Completion Test Release

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-uat-functional-completion-test.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: verify-uat-functional-completion-test
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/uat-functional-completion-test-0bb15f67-20260803'
    name: Independently verify exact Test API, web, and public artifacts
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_RELEASE_COMMIT: 0bb15f6736c4fb8feee1f83f144c9fbde5e563d0
      EXPECTED_VERIFY_BRANCH: verify/uat-functional-completion-test-0bb15f67-20260803
      VERIFY_WORKFLOW: .github/workflows/verify-uat-functional-completion-test.yml
      EXPECTED_API_IMAGE: acrphdtest7825cc.azurecr.io/project-health-dashboard-api@sha256:e3cb16597fa4bd8fb01462c24ea3a7d7e2c5c6ca126f6305173cb1c1c298c0b2
      EXPECTED_WEB_IMAGE: acrphdtest7825cc.azurecr.io/project-health-dashboard-web@sha256:284ebfddd6c508169bc9d9d77657b84735c1ca08f54127697a3d7ed64cc9e2d0
      EXPECTED_MIGRATOR_IMAGE: acrphdtest7825cc.azurecr.io/project-health-dashboard-uat-migrator@sha256:00e4f1533cf592f0f833f9a87d771cc895280e0a00b04f8ca2074db35af9cd15

    steps:
      - name: Check out exact verification control
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: verify-control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact merged release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 0bb15f6736c4fb8feee1f83f144c9fbde5e563d0
          path: release
          fetch-depth: 1
          persist-credentials: false

      - name: Guard read-only verifier and exact release
        id: guard
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ github.event.pull_request.base.ref }}' == 'main' ]]
          [[ '${{ github.event.pull_request.head.ref }}' == "$EXPECTED_VERIFY_BRANCH" ]]
          [[ '${{ github.event.pull_request.head.repo.full_name }}' == '${{ github.repository }}' ]]

          CONTROL_HEAD="$(git -C verify-control rev-parse HEAD)"
          RELEASE_HEAD="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_HEAD" == '${{ github.event.pull_request.head.sha }}' ]]
          [[ "$RELEASE_HEAD" == "$EXPECTED_RELEASE_COMMIT" ]]
          git -C verify-control fetch origin main --no-tags
          [[ "$(git -C verify-control rev-parse origin/main)" == "$EXPECTED_RELEASE_COMMIT" ]]
          git -C verify-control merge-base --is-ancestor "$EXPECTED_RELEASE_COMMIT" HEAD
          [[ "$(git -C verify-control diff --name-only "$EXPECTED_RELEASE_COMMIT"...HEAD)" == "$VERIFY_WORKFLOW" ]]
          git -C verify-control diff --check "$EXPECTED_RELEASE_COMMIT"...HEAD

          grep -Fq 'Engineer Project Over / Under Budget Report' release/src/backend/ProjectTime.Api/Modules/EnterpriseReportingCatalog.cs
          grep -Fq 'Utilization Over / Under Report by Engineer' release/src/backend/ProjectTime.Api/Modules/EnterpriseReportingCatalog.cs
          grep -Fq 'Engineer Vacation / PTO Used Report' release/src/backend/ProjectTime.Api/Modules/EnterpriseReportingCatalog.cs
          grep -Fq 'Overview & Architecture' release/src/frontend/project-time-web/src/WorkTaskBuilderPanel.jsx
          grep -Fq 'What you need to do now' release/src/frontend/project-time-web/src/ProjectCloseoutCenter.jsx
          grep -Fq 'SEND MODULE 065 TEST' release/src/frontend/project-time-web/src/MicrosoftMailTransportReadinessPanel.jsx
          grep -Fq '066_immutable_project_numbers' release/database/migrations/066_immutable_project_numbers.sql
          bash release/tests/test-uat-functional-completion-contract.sh

          echo "control_commit=$CONTROL_HEAD" >> "$GITHUB_OUTPUT"
          echo 'UAT_COMPLETION_READ_ONLY_GUARD=PASSED'

      - name: Sign in to Azure Test through OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify exact Container Apps templates and active revisions
        id: revisions
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          API_APP: ${{ vars.AZURE_API_APP }}
          WEB_APP: ${{ vars.AZURE_WEB_APP }}
        run: |
          set -Eeuo pipefail
          API_IMAGE="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          WEB_IMAGE="$(az containerapp show -g "$RESOURCE_GROUP" -n "$WEB_APP" --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          API_SOURCE="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query "properties.template.containers[0].env[?name=='PROJECTPULSE_SOURCE_COMMIT'].value | [0]" -o tsv --only-show-errors)"
          API_MODE="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors)"
          WEB_MODE="$(az containerapp show -g "$RESOURCE_GROUP" -n "$WEB_APP" --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors)"
          API_LATEST_READY="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query 'properties.latestReadyRevisionName' -o tsv --only-show-errors)"
          WEB_LATEST_READY="$(az containerapp show -g "$RESOURCE_GROUP" -n "$WEB_APP" --query 'properties.latestReadyRevisionName' -o tsv --only-show-errors)"

          [[ "$API_IMAGE" == "$EXPECTED_API_IMAGE" ]]
          [[ "$WEB_IMAGE" == "$EXPECTED_WEB_IMAGE" ]]
          [[ "$API_SOURCE" == "$EXPECTED_RELEASE_COMMIT" ]]
          [[ "${API_MODE,,}" == single && "${WEB_MODE,,}" == single ]]
          [[ -n "$API_LATEST_READY" && "$API_LATEST_READY" != null ]]
          [[ -n "$WEB_LATEST_READY" && "$WEB_LATEST_READY" != null ]]

          az containerapp revision list -g "$RESOURCE_GROUP" -n "$API_APP" -o json --only-show-errors > /tmp/api-revisions.json
          az containerapp revision list -g "$RESOURCE_GROUP" -n "$WEB_APP" -o json --only-show-errors > /tmp/web-revisions.json

          EXPECTED_IMAGE="$EXPECTED_API_IMAGE" APP_KIND=api LATEST_READY="$API_LATEST_READY" \
            python3 - <<'PY' > /tmp/api-selected.env
          import json, os, sys
          kind = os.environ['APP_KIND']
          expected = os.environ['EXPECTED_IMAGE']
          latest = os.environ['LATEST_READY']
          with open(f'/tmp/{kind}-revisions.json', encoding='utf-8') as handle:
              revisions = json.load(handle)
          matches = []
          for revision in revisions:
              props = revision.get('properties') or {}
              containers = ((props.get('template') or {}).get('containers') or [])
              image = containers[0].get('image') if containers else ''
              if image != expected:
                  continue
              matches.append({
                  'name': revision.get('name') or '',
                  'active': bool(props.get('active')),
                  'health': str(props.get('healthState') or ''),
                  'provisioning': str(props.get('provisioningState') or ''),
                  'traffic': props.get('trafficWeight'),
                  'created': str(props.get('createdTime') or '')
              })
          eligible = [m for m in matches if m['active'] and m['health'].lower() == 'healthy' and m['provisioning'].lower() == 'provisioned']
          if not eligible:
              print(f'No active healthy provisioned {kind} revision serves {expected}', file=sys.stderr)
              print(json.dumps(matches, indent=2), file=sys.stderr)
              raise SystemExit(1)
          selected = sorted(eligible, key=lambda item: item['created'])[-1]
          if selected['name'] != latest:
              print(f"{kind} latestReadyRevisionName={latest} but selected exact revision={selected['name']}", file=sys.stderr)
              raise SystemExit(1)
          if selected['traffic'] not in (100, 100.0, None):
              print(f"{kind} exact revision traffic={selected['traffic']}", file=sys.stderr)
              raise SystemExit(1)
          prefix = kind
          print(f'{prefix}_revision={selected["name"]}')
          print(f'{prefix}_health={selected["health"]}')
          print(f'{prefix}_provisioning={selected["provisioning"]}')
          print(f'{prefix}_traffic={selected["traffic"] if selected["traffic"] is not None else "single"}')
          PY

          EXPECTED_IMAGE="$EXPECTED_WEB_IMAGE" APP_KIND=web LATEST_READY="$WEB_LATEST_READY" \
            python3 - <<'PY' > /tmp/web-selected.env
          import json, os, sys
          kind = os.environ['APP_KIND']
          expected = os.environ['EXPECTED_IMAGE']
          latest = os.environ['LATEST_READY']
          with open(f'/tmp/{kind}-revisions.json', encoding='utf-8') as handle:
              revisions = json.load(handle)
          matches = []
          for revision in revisions:
              props = revision.get('properties') or {}
              containers = ((props.get('template') or {}).get('containers') or [])
              image = containers[0].get('image') if containers else ''
              if image != expected:
                  continue
              matches.append({
                  'name': revision.get('name') or '',
                  'active': bool(props.get('active')),
                  'health': str(props.get('healthState') or ''),
                  'provisioning': str(props.get('provisioningState') or ''),
                  'traffic': props.get('trafficWeight'),
                  'created': str(props.get('createdTime') or '')
              })
          eligible = [m for m in matches if m['active'] and m['health'].lower() == 'healthy' and m['provisioning'].lower() == 'provisioned']
          if not eligible:
              print(f'No active healthy provisioned {kind} revision serves {expected}', file=sys.stderr)
              print(json.dumps(matches, indent=2), file=sys.stderr)
              raise SystemExit(1)
          selected = sorted(eligible, key=lambda item: item['created'])[-1]
          if selected['name'] != latest:
              print(f"{kind} latestReadyRevisionName={latest} but selected exact revision={selected['name']}", file=sys.stderr)
              raise SystemExit(1)
          if selected['traffic'] not in (100, 100.0, None):
              print(f"{kind} exact revision traffic={selected['traffic']}", file=sys.stderr)
              raise SystemExit(1)
          prefix = kind
          print(f'{prefix}_revision={selected["name"]}')
          print(f'{prefix}_health={selected["health"]}')
          print(f'{prefix}_provisioning={selected["provisioning"]}')
          print(f'{prefix}_traffic={selected["traffic"] if selected["traffic"] is not None else "single"}')
          PY

          cat /tmp/api-selected.env /tmp/web-selected.env | tee -a "$GITHUB_OUTPUT"
          echo "api_image=$API_IMAGE" >> "$GITHUB_OUTPUT"
          echo "web_image=$WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo "api_source=$API_SOURCE" >> "$GITHUB_OUTPUT"
          echo 'UAT_COMPLETION_EXACT_ACTIVE_REVISIONS=PASSED'

      - name: Verify public API readiness and authorization boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          check_status() {
            local path="$1"
            local expected="$2"
            local status
            status="$(curl -sS -o /tmp/uat-verify-api-response -w '%{http_code}' "$BASE$path")"
            [[ "$status" == "$expected" ]] || {
              echo "$path returned $status; expected $expected" >&2
              exit 1
            }
            echo "PUBLIC_API_STATUS_${path//[^A-Za-z0-9]/_}=$status"
          }
          check_status '/health' '200'
          check_status '/api/version' '200'
          check_status '/api/enterprise-notifications/runtime/readiness' '401'
          check_status '/api/work-lifecycle/dashboard' '401'
          check_status '/api/celar-ai/v1/platform/readiness' '401'
          check_status '/api/financial-operations/modules/040' '401'
          check_status '/api/financial-operations/reports/catalog' '401'
          check_status '/api/integrations/026/providers' '401'
          check_status '/api/entra-secret-expiration/profile' '401'
          echo 'UAT_COMPLETION_PUBLIC_API_BOUNDARIES=PASSED'

      - name: Verify public web bytes match the immutable ACR image
        id: web_bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          PUBLIC_BASE='${{ vars.PUBLIC_URL }}'; PUBLIC_BASE="${PUBLIC_BASE%/}"
          az acr login --name '${{ vars.AZURE_ACR_NAME }}' --only-show-errors
          docker pull "$EXPECTED_WEB_IMAGE" >/dev/null
          CONTAINER_ID="$(docker create "$EXPECTED_WEB_IMAGE")"
          cleanup_container() { docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true; }
          trap cleanup_container EXIT

          rm -rf /tmp/uat-verify-candidate
          mkdir -p /tmp/uat-verify-candidate
          docker cp "$CONTAINER_ID:/usr/share/nginx/html/." /tmp/uat-verify-candidate/
          CANDIDATE_INDEX=/tmp/uat-verify-candidate/index.html
          test -s "$CANDIDATE_INDEX"
          CANDIDATE_JS_REF="$(grep -oE 'src="[^"]+\.js[^"]*"' "$CANDIDATE_INDEX" | head -1 | cut -d'"' -f2)"
          CANDIDATE_JS_PATH="${CANDIDATE_JS_REF%%\?*}"
          CANDIDATE_JS_PATH="${CANDIDATE_JS_PATH#/}"
          test -s "/tmp/uat-verify-candidate/$CANDIDATE_JS_PATH"

          CANDIDATE_INDEX_SHA="$(sha256sum "$CANDIDATE_INDEX" | awk '{print $1}')"
          CANDIDATE_JS_SHA="$(sha256sum "/tmp/uat-verify-candidate/$CANDIDATE_JS_PATH" | awk '{print $1}')"
          BUSTER="uat-independent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STATUS="$(curl -sSL -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
            -o /tmp/uat-verify-public-index.html -w '%{http_code}' "$PUBLIC_BASE/?release_check=$BUSTER")"
          [[ "$STATUS" == 200 && -s /tmp/uat-verify-public-index.html ]]
          PUBLIC_INDEX_SHA="$(sha256sum /tmp/uat-verify-public-index.html | awk '{print $1}')"
          PUBLIC_JS_REF="$(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/uat-verify-public-index.html | head -1 | cut -d'"' -f2)"
          [[ "$PUBLIC_INDEX_SHA" == "$CANDIDATE_INDEX_SHA" ]]
          [[ "$PUBLIC_JS_REF" == "$CANDIDATE_JS_REF" ]]

          case "$PUBLIC_JS_REF" in
            http*) PUBLIC_JS_URL="$PUBLIC_JS_REF" ;;
            /*) PUBLIC_JS_URL="$PUBLIC_BASE$PUBLIC_JS_REF" ;;
            *) PUBLIC_JS_URL="$PUBLIC_BASE/$PUBLIC_JS_REF" ;;
          esac
          JS_STATUS="$(curl -sSL -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
            -o /tmp/uat-verify-public-app.js -w '%{http_code}' "$PUBLIC_JS_URL")"
          [[ "$JS_STATUS" == 200 && -s /tmp/uat-verify-public-app.js ]]
          PUBLIC_JS_SHA="$(sha256sum /tmp/uat-verify-public-app.js | awk '{print $1}')"
          [[ "$PUBLIC_JS_SHA" == "$CANDIDATE_JS_SHA" ]]

          echo "index_sha256=$PUBLIC_INDEX_SHA" >> "$GITHUB_OUTPUT"
          echo "js_sha256=$PUBLIC_JS_SHA" >> "$GITHUB_OUTPUT"
          echo "js_ref=$PUBLIC_JS_REF" >> "$GITHUB_OUTPUT"
          echo 'UAT_COMPLETION_PUBLIC_WEB_BYTES=PASSED'

      - name: Write independent verification evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cat > evidence/uat-functional-completion-test-verification.json <<JSON
          {
            "environment": "test",
            "verificationType": "independent-read-only",
            "releaseCommit": "$EXPECTED_RELEASE_COMMIT",
            "verificationControlCommit": "${{ steps.guard.outputs.control_commit }}",
            "workflowRunId": "${{ github.run_id }}",
            "sourcePullRequests": [447],
            "deploymentWorkflowRunId": "30780201176",
            "migrationsVerifiedByDeployment": ["060", "061", "062", "063", "064", "065", "066"],
            "migrationImage": "$EXPECTED_MIGRATOR_IMAGE",
            "apiImage": "${{ steps.revisions.outputs.api_image }}",
            "apiSourceCommit": "${{ steps.revisions.outputs.api_source }}",
            "apiRevision": "${{ steps.revisions.outputs.api_revision }}",
            "apiHealth": "${{ steps.revisions.outputs.api_health }}",
            "apiProvisioning": "${{ steps.revisions.outputs.api_provisioning }}",
            "apiTraffic": "${{ steps.revisions.outputs.api_traffic }}",
            "webImage": "${{ steps.revisions.outputs.web_image }}",
            "webRevision": "${{ steps.revisions.outputs.web_revision }}",
            "webHealth": "${{ steps.revisions.outputs.web_health }}",
            "webProvisioning": "${{ steps.revisions.outputs.web_provisioning }}",
            "webTraffic": "${{ steps.revisions.outputs.web_traffic }}",
            "publicIndexSha256": "${{ steps.web_bytes.outputs.index_sha256 }}",
            "publicJavaScriptSha256": "${{ steps.web_bytes.outputs.js_sha256 }}",
            "publicJavaScriptReference": "${{ steps.web_bytes.outputs.js_ref }}",
            "activeRevisionMode": "Single",
            "productionDeployment": false,
            "emailSent": false,
            "azureMutationPerformed": false,
            "databaseMutationPerformed": false
          }
          JSON
          sha256sum evidence/uat-functional-completion-test-verification.json > evidence/SHA256SUMS
          cat evidence/uat-functional-completion-test-verification.json

      - name: Upload independent verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uat-functional-completion-test-verification-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Sign out of Azure
        if: always()
        shell: bash
        run: az logout || true
