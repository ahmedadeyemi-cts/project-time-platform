name: Role Journey Visual Checks
on:
  pull_request:
    paths:
      - 'src/frontend/project-time-web/src/role-journeys/**'
      - 'src/frontend/project-time-web/src/role-permission-model.js'
      - 'src/frontend/project-time-web/src/module-availability-*.js'
      - 'src/frontend/project-time-web/src/module-directory-authority.js'
      - 'src/frontend/project-time-web/src/effective-role-authority.js'
      - 'src/frontend/project-time-web/tests/role-journey*.mjs'
      - 'src/frontend/project-time-web/scripts/role-journeys-vite-plugin.mjs'
      - 'scripts/release-test/run-flowhive-my-role-browser.py'
      - 'tests/role-journey-browser-contract.test.py'
      - '.github/workflows/role-journey-visual-checks.yml'
permissions:
  contents: read
concurrency:
  group: role-journey-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  role-journey-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify role isolation, workflow coverage and route contracts
        working-directory: src/frontend/project-time-web
        run: node --test tests/role-journeys.test.mjs tests/role-journey-access.test.mjs tests/role-journey-experience.test.mjs
      - name: Verify installed browser selector and fail-closed role readiness
        run: |
          python3 tests/role-journey-browser-contract.test.py
          python3 -m py_compile scripts/release-test/run-flowhive-my-role-browser.py
