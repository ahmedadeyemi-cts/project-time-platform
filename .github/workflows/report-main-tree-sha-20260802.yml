name: Report Exact Main Tree SHA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/report-main-tree-sha-20260802.yml'

permissions:
  contents: read

jobs:
  report:
    if: github.event.pull_request.head.ref == 'diagnose/live-uat-reflection-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Report commit and tree
        run: |
          echo "BASE_COMMIT=$(git rev-parse HEAD)"
          echo "BASE_TREE=$(git rev-parse 'HEAD^{tree}')"
