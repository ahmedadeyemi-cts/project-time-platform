name: Validate Admin Experience 008 009 Test Deployment

on:
  push:
    branches:
      - 'release/modules-008-009-admin-experience-test-*'
  pull_request:
    paths:
      - '.github/workflows/projectpulse-deploy-admin-experience-008-009-test.yml'
      - '.github/workflows/validate-admin-experience-008-009-test-deployment.yml'
      - 'scripts/apply-admin-experience-008-009-test-migration.sh'
      - 'scripts/run-admin-experience-008-009-test-migration-job.sh'
      - 'scripts/validate-admin-experience-008-009-test-deployment.sh'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate guarded Modules 008 and 009 deployment controls
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projectpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PROJECTPULSE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/projectpulse_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce deployment-control-only scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          # DEPLOYMENT_CONCURRENCY_GOVERNANCE_SCOPE_START
          if [[ "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" == security/environment-deployment-concurrency-* ]]; then
            node scripts/validate-deployment-concurrency-governance.mjs --base-ref origin/main
            echo 'DEPLOYMENT_CONCURRENCY_GOVERNANCE_SCOPE=PASS'
            exit 0
          fi
          # DEPLOYMENT_CONCURRENCY_GOVERNANCE_SCOPE_END
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD | sort)
          printf '%s\n' "${CHANGED[@]}"
          EXPECTED=(
            '.github/workflows/projectpulse-deploy-admin-experience-008-009-test.yml'
            '.github/workflows/validate-admin-experience-008-009-test-deployment.yml'
            'scripts/apply-admin-experience-008-009-test-migration.sh'
            'scripts/run-admin-experience-008-009-test-migration-job.sh'
            'scripts/validate-admin-experience-008-009-test-deployment.sh'
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          [[ "${#CHANGED[@]}" == "${#EXPECTED_SORTED[@]}" ]] || { echo 'Deployment-control PR must change exactly five files.' >&2; exit 1; }
          diff -u <(printf '%s\n' "${EXPECTED_SORTED[@]}") <(printf '%s\n' "${CHANGED[@]}")
          echo 'ADMIN_EXPERIENCE_DEPLOYMENT_SCOPE=PASS'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Validate guarded deployment contract
        id: deployment_guard
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validate-admin-experience-008-009-test-deployment.sh 2>&1 \
            | tee /tmp/admin-experience-deployment-guard.log

      - name: Upload deployment guard diagnostics
        if: ${{ failure() && steps.deployment_guard.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: admin-experience-deployment-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/admin-experience-deployment-guard.log
          retention-days: 7

      - name: Test migration 048 apply, invariants, and guarded rollback
        shell: bash
        run: bash tests/test-admin-experience-migration-048.sh

      - name: Build API release
        run: dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        run: npm ci --no-audit --no-fund

      - name: Validate Modules 008 and 009 source contract
        working-directory: src/frontend/project-time-web
        run: npm run validate:modules008009

      - name: Build frontend production bundle
        working-directory: src/frontend/project-time-web
        run: npm run build

      - name: Publish exact-commit deployment-control status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          API_ROOT: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            STATE=success
            DESCRIPTION='Modules 008/009 deployment controls and full targeted validation passed.'
          else
            STATE=failure
            DESCRIPTION='Modules 008/009 deployment-control validation failed.'
          fi
          PAYLOAD="$(jq -nc \
            --arg state "$STATE" \
            --arg context 'admin-experience-008-009/deployment-controls' \
            --arg description "$DESCRIPTION" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$PAYLOAD" \
            "$API_ROOT/repos/$REPOSITORY/statuses/$COMMIT_SHA"
