name: One-time Dispatch Complete PR737 Release

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  actions: write
  contents: read

concurrency:
  group: one-time-dispatch-complete-pr737-release
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.pull_request.number == 736
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch the registered terminal release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/one-time-complete-flowhive-pr737.yml/dispatches" \
            -f ref='tooling/one-time-flowhive-clean-publisher-20260819'
          echo 'FLOWHIVE_PR737_TERMINAL_WORKFLOW_DISPATCHED=TRUE'
          echo 'PRODUCTION_MUTATION=NONE'
