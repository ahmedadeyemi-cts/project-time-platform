name: One-time Dispatch and Observe Complete PR737 Release

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: one-time-dispatch-observe-complete-pr737-release
  cancel-in-progress: false

jobs:
  dispatch-observe:
    if: github.event.pull_request.number == 736
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Dispatch and record the new terminal release run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/actions/workflows/one-time-complete-flowhive-pr737.yml/runs?event=workflow_dispatch&per_page=10"
          before="$(gh api "$endpoint" --jq '.workflow_runs[0].id // 0')"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/one-time-complete-flowhive-pr737.yml/dispatches" \
            -f ref='tooling/one-time-flowhive-clean-publisher-20260819'

          run_id=''
          status=''
          conclusion=''
          head_sha=''
          created_at=''
          for attempt in $(seq 1 30); do
            json="$(gh api "$endpoint")"
            candidate="$(jq -r '.workflow_runs[0].id // 0' <<<"$json")"
            if [[ "$candidate" != '0' && "$candidate" != "$before" ]]; then
              run_id="$candidate"
              status="$(jq -r '.workflow_runs[0].status // empty' <<<"$json")"
              conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$json")"
              head_sha="$(jq -r '.workflow_runs[0].head_sha // empty' <<<"$json")"
              created_at="$(jq -r '.workflow_runs[0].created_at // empty' <<<"$json")"
              break
            fi
            sleep 2
          done
          test -n "$run_id"

          body=$(cat <<EOF
          <!-- flowhive-pr737-terminal-observer -->
          Terminal release run: ${run_id}
          Status: ${status}
          Conclusion: ${conclusion:-pending}
          Head SHA: ${head_sha}
          Created: ${created_at}
          Production mutation: NONE
          EOF
          )
          gh pr comment 736 --repo "$GITHUB_REPOSITORY" --body "$body"
          printf 'TERMINAL_RUN_ID=%s\nTERMINAL_STATUS=%s\nTERMINAL_CONCLUSION=%s\n' "$run_id" "$status" "${conclusion:-pending}"
