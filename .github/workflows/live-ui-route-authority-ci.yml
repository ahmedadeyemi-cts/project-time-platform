name: Validate Live UI Route Authority

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/live-ui-route-authority-ci.yml'
      - 'src/frontend/project-time-web/scripts/inject-celar-ai-enterprise-chat-context.mjs'
      - 'src/frontend/project-time-web/scripts/inject-live-ui-route-authority.mjs'
      - 'src/frontend/project-time-web/scripts/validate-live-ui-route-authority.mjs'
      - 'src/frontend/project-time-web/src/legacy-analytics-overlay-authority.js'
      - 'src/frontend/project-time-web/src/view-as-storage-compatibility.js'
      - 'src/frontend/project-time-web/src/main.jsx'
      - 'src/frontend/project-time-web/src/MicrosoftMailTransportReadinessPanel.jsx'
      - 'src/frontend/project-time-web/src/MicrosoftIntegrationDualConnectionPortal.jsx'
      - 'src/frontend/project-time-web/src/AnalyticsCenter.jsx'
      - 'src/frontend/project-time-web/src/CelarAiEnterprisePlatform.jsx'
      - 'src/frontend/project-time-web/src/CelarAiArchitectureOverview.jsx'
      - 'src/frontend/project-time-web/src/PageContextGuide.jsx'
      - 'src/frontend/project-time-web/src/module-availability-bridge.js'
      - 'src/backend/ProjectTime.Api/ProjectTime.Api.csproj'
      - 'src/backend/ProjectTime.Api/Modules/SecurityContextAuthorityConvergence.cs'
      - 'src/backend/ProjectTime.Api/Modules/ProjectPulseActualSessionAuthority.cs'
      - 'tests/test-live-authenticated-route-authority.sh'

permissions:
  contents: read

concurrency:
  group: live-ui-route-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate authoritative live UI routes
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact checkout and base ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          HEAD="$(git rev-parse HEAD)"
          [[ "$HEAD" == '${{ github.event.pull_request.head.sha }}' ]]

          git fetch origin '${{ github.event.pull_request.base.ref }}' --no-tags
          BASE="$(git rev-parse 'origin/${{ github.event.pull_request.base.ref }}')"
          git merge-base --is-ancestor "$BASE" "$HEAD"

          git diff --name-only "$BASE"..."$HEAD"
          test -f src/frontend/project-time-web/scripts/inject-live-ui-route-authority.mjs
          test -f src/frontend/project-time-web/scripts/validate-live-ui-route-authority.mjs
          test -f src/frontend/project-time-web/src/legacy-analytics-overlay-authority.js
          test -f src/frontend/project-time-web/src/view-as-storage-compatibility.js
          test -f src/frontend/project-time-web/src/MicrosoftIntegrationDualConnectionPortal.jsx
          echo "LIVE_UI_EXACT_HEAD=$HEAD"
          echo "LIVE_UI_BASE_SHA=$BASE"
          echo 'LIVE_UI_CHECKOUT_GUARD=PASSED'

      - name: Validate repository security posture
        shell: bash
        run: python3 scripts/security/validate-repository-security-posture.py

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build ProjectTime API
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release | tee live-ui-authority-api-build.log
          grep -Fq '0 Error(s)' live-ui-authority-api-build.log
          echo 'LIVE_UI_AUTHORITY_API_BUILD=PASSED'

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/project-time-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend/project-time-web
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build complete frontend
        working-directory: src/frontend/project-time-web
        shell: bash
        run: npm run build

      - name: Validate runtime ownership and route authority
        working-directory: src/frontend/project-time-web
        shell: bash
        run: node ./scripts/validate-live-ui-route-authority.mjs

      - name: Prove the production bundle suppresses the retired Analytics overlay
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          INDEX='dist/index.html'
          test -s "$INDEX"
          JS_REL="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' "$INDEX" | head -1)"
          [[ -n "$JS_REL" ]]
          JS="dist/${JS_REL#/}"
          test -s "$JS"
          grep -Fq 'MODULE_030_NATIVE_REACT_ROUTE' "$JS"
          grep -Fq 'projectpulse-030-shell' "$JS"
          grep -Fq 'projectpulse-030-reporting-card' "$JS"
          grep -Fq 'MutationObserver' "$JS"
          grep -Fq 'projectpulse:route-canonicalized' "$JS"
          echo 'LIVE_UI_LEGACY_ANALYTICS_OVERLAY=PERMANENTLY_SUPPRESSED'

      - name: Prove the generated runtime mounts the new interfaces
        working-directory: src/frontend/project-time-web
        shell: bash
        run: |
          set -Eeuo pipefail
          APP='src/App.Module001.g.jsx'
          test -s "$APP"
          grep -Fq '<AnalyticsCenter authSession={authSession} />' "$APP"
          grep -Fq '<CrmErpIntegrationCenter />' "$APP"
          grep -Fq '<WorkTaskBuilderPanel />' "$APP"
          grep -Fq '<ProjectCloseoutCenter />' "$APP"
          grep -Fq "'celar-ai': 'work-task-builder'" "$APP"
          grep -Fq "'crm-erp': 'crm-integration'" "$APP"
          grep -Fq 'actualSessionHasPermanentFullControl' "$APP"
          grep -Fq "'SUPER_ADMINISTRATOR'" "$APP"
          grep -Fq 'const actualSessionHasPermanentFullControl = !actualSessionIsViewAs' "$APP"
          ! grep -Fq '<FinancialOperationsRecoveryWorkspace moduleCode="040"' "$APP"
          echo 'LIVE_UI_GENERATED_RUNTIME=PASSED'

      - name: Confirm validation did not mutate tracked source
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! git diff --quiet; then
            echo 'The live UI build mutated tracked source:' >&2
            git diff --stat >&2
            git diff --name-only >&2
            exit 1
          fi
          echo 'LIVE_UI_TRACKED_SOURCE_MUTATION=0'

      - name: Build production web container
        shell: bash
        run: docker build --file deployment/containers/web/Dockerfile --tag projectpulse-live-ui-route-authority:${{ github.sha }} .
