name: ProjectPulse Deploy Group 2B, Group 3, Module 064, and Pulse AI Foundation Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified cumulative source release
        required: true
        default: 7db5a59fd5bd0850b6ea496a6d4e0d8ca0e02a0d
        type: string
      confirmation:
        description: Enter DEPLOY-GROUP2B-GROUP3-MODULE064-PULSEAI-FOUNDATION-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-test
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded cumulative API and web test deployment
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_RELEASE_COMMIT: 7db5a59fd5bd0850b6ea496a6d4e0d8ca0e02a0d
      SOURCE_BASELINE_COMMIT: 185a0030dbc96813c8cd46498668ca289805a4d7

    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact verified source release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 0

      - name: Guard workflow source and validate exact release
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$WORKFLOW_SOURCE_REF" == 'refs/heads/main' ]]
          [[ "$DISPATCH_CONFIRMATION" == 'DEPLOY-GROUP2B-GROUP3-MODULE064-PULSEAI-FOUNDATION-TO-TEST' ]]
          [[ "$DISPATCH_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == "$WORKFLOW_SOURCE_SHA" ]]
          [[ "$TARGET_COMMIT" == "$DISPATCH_RELEASE_COMMIT" ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]]
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD

          CHANGED="$(git -C release diff --name-only "$SOURCE_BASELINE_COMMIT...$TARGET_COMMIT")"
          if grep -E '^database/(migrations|rollback)/' <<<"$CHANGED"; then
            echo 'This cumulative release is API/web only and must not carry a database migration.' >&2
            exit 1
          fi

          PROJECT='release/src/backend/ProjectTime.Api/ProjectTime.Api.csproj'
          PACKAGE='release/src/frontend/project-time-web/package.json'
          GROUP2B='release/src/backend/ProjectTime.Api/Modules/PlatformProductionResilienceModule.cs'
          GROUP3='release/src/backend/ProjectTime.Api/Modules/ProjectFinancialTruthModule.cs'
          HEALTH='release/src/backend/ProjectTime.Api/Ai/ProjectPulseAiHealthRegistry.cs'
          PULSE='release/src/frontend/project-time-web/src/PulseAiCenter.jsx'
          MISSION='release/src/frontend/project-time-web/src/PulseAiMissionControl.jsx'
          for file in "$PROJECT" "$PACKAGE" "$GROUP2B" "$GROUP3" "$HEALTH" "$PULSE" "$MISSION" \
            release/src/frontend/project-time-web/scripts/validate-group-2b-provider-neutral-production-resilience.mjs \
            release/src/frontend/project-time-web/scripts/validate-group-3-project-financial-workspaces.mjs \
            release/src/frontend/project-time-web/scripts/validate-module-064-shared-ai.mjs \
            release/src/frontend/project-time-web/scripts/validate-module-011-pulse-ai.mjs \
            control/scripts/run-group2b-group3-module064-pulse-ai-foundation-test-deployment.sh; do
            test -f "$file"
          done

          [[ "$(grep -Fc 'app.MapPlatformProductionResilienceEndpoints();' "$PROJECT")" -eq 1 ]]
          [[ "$(grep -Fc 'app.MapProjectFinancialTruthEndpoints();' "$PROJECT")" -eq 1 ]]
          [[ "$(grep -Fc 'validate:group2b-production-resilience' "$PACKAGE")" -ge 2 ]]
          [[ "$(grep -Fc 'validate:group3-project-financial-workspaces' "$PACKAGE")" -ge 2 ]]
          [[ "$(grep -Fc 'validate:module011' "$PACKAGE")" -ge 2 ]]
          [[ "$(grep -Fc 'validate:module064' "$PACKAGE")" -ge 2 ]]
          grep -Fq '/api/system/backup-dr/production-planning' "$GROUP2B"
          grep -Fq '/api/project-financials/portfolio' "$GROUP3"
          grep -Fq 'checking' "$HEALTH"
          grep -Fq 'Knowledge & RAG' "$PULSE"
          grep -Fq 'Pulse AI' "$MISSION"

          (cd release && dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release)
          (cd release/src/frontend/project-time-web && npm ci --no-audit --no-fund && npm run build)

          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'GROUP2B_GROUP3_MODULE064_PULSE_AI_FOUNDATION_SOURCE_VALIDATION=PASS'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build, deploy, validate, and preserve rollback evidence
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: >-
          bash control/scripts/run-group2b-group3-module064-pulse-ai-foundation-test-deployment.sh
          control
          release
          '${{ steps.release.outputs.target_commit }}'

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group2b-group3-module064-pulse-ai-foundation-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            control/evidence/
            ${{ runner.temp }}/group2b-group3-module064-pulse-ai-foundation-probes/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload immutable deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: group2b-group3-module064-pulse-ai-foundation-test-${{ github.run_id }}
          path: control/evidence/group2b-group3-module064-pulse-ai-foundation-test-deployment.json
          retention-days: 30
