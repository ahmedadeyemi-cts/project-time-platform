name: Validate Microsoft Integration Test Deployment Control

on:
  pull_request:
    paths:
      - '.github/workflows/projectpulse-deploy-microsoft-integration-test.yml'
      - '.github/workflows/validate-microsoft-integration-test-deployment.yml'
      - 'scripts/apply-microsoft-integration-test-migration.sh'
      - 'scripts/run-microsoft-integration-test-migration-job.sh'
      - 'scripts/wait-containerapp-ready-revision.sh'
      - 'scripts/validate-microsoft-integration-test-deployment.sh'
      - 'tests/test-microsoft-integration-migration-045.sh'
      - 'tests/test-microsoft-sso-connection-migration-046.sh'
      - 'tests/test-microsoft-integration-connection-carryover-047.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Microsoft Integration Connection deployment controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate guarded deployment contract
        shell: bash
        run: bash scripts/validate-microsoft-integration-test-deployment.sh

      - name: Test migrations 045 046 and 047 independently
        shell: bash
        run: |
          set +e
          bash tests/test-microsoft-integration-migration-045.sh > /tmp/microsoft-integration-migration-045.log 2>&1
          status_045=$?
          cat /tmp/microsoft-integration-migration-045.log
          bash tests/test-microsoft-sso-connection-migration-046.sh > /tmp/microsoft-integration-migration-046.log 2>&1
          status_046=$?
          cat /tmp/microsoft-integration-migration-046.log
          bash tests/test-microsoft-integration-connection-carryover-047.sh > /tmp/microsoft-integration-migration-047.log 2>&1
          status_047=$?
          cat /tmp/microsoft-integration-migration-047.log
          if (( status_045 != 0 || status_046 != 0 || status_047 != 0 )); then exit 1; fi

      - name: Upload migration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: microsoft-integration-connection-migration-diagnostics
          path: |
            /tmp/microsoft-integration-migration-045.log
            /tmp/microsoft-integration-migration-046.log
            /tmp/microsoft-integration-migration-047.log
          retention-days: 7
