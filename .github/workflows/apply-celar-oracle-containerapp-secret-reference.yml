name: Apply Celar Oracle Container Apps Secret Reference Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-celar-oracle-containerapp-secret-reference.yml'
      - 'scripts/patch-celar-oracle-containerapp-secret-reference.py'
      - '.github/workflows/celar-ai-oracle-test-runtime-deploy.yml'
      - 'src/backend/ProjectTime.Api/Ai/ProjectPulseAiReleaseRuntimePolicy.cs'
      - 'tests/CelarAiOracleExternalRuntimeTests/Program.cs'
      - 'tests/CelarAiProductionHardeningTests/ReleaseRuntimeBehavior.cs'
      - 'tests/validate-celar-ai-oracle-test-runtime.mjs'

permissions:
  contents: write

concurrency:
  group: apply-celar-oracle-containerapp-secret-reference
  cancel-in-progress: true

jobs:
  finalize:
    name: Validate and publish the permanent Oracle correction as repository blobs
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/celar-oracle-containerapp-secret-reference-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact correction branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/celar-oracle-containerapp-secret-reference-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Guard one-time blob publication
        id: guard
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f .github/celar-ai-oracle-test-runtime-deploy.patched.yml ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Validated Oracle workflow blob is already published.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the bounded secret-reference correction
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/patch-celar-oracle-containerapp-secret-reference.py
          python3 scripts/patch-celar-oracle-containerapp-secret-reference.py

          grep -Fq 'github-environment://test/celar-ai-oracle-runtime-token@$TARGET_RELEASE_COMMIT' \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          grep -Fq 'PROJECTPULSE_PRIVATE_INFERENCE_BEARER_TOKEN="secretref:$TOKEN_SECRET_NAME"' \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          ! grep -Fq 'TOKEN_REFERENCE="secretref://' \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml
          grep -Fq 'github-environment://' \
            src/backend/ProjectTime.Api/Ai/ProjectPulseAiReleaseRuntimePolicy.cs
          git diff --check

      - name: Install checksum-pinned actionlint
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 4 --retry-all-errors \
            -o "$RUNNER_TEMP/actionlint.tar.gz" \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -verbose \
            .github/workflows/celar-ai-oracle-test-runtime-deploy.yml

      - name: Validate Oracle and release-runtime contracts
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet run \
            --project tests/CelarAiOracleExternalRuntimeTests/CelarAiOracleExternalRuntimeTests.csproj \
            --configuration Release
          node tests/validate-celar-ai-oracle-test-runtime.mjs
          node src/frontend/project-time-web/scripts/validate-celar-ai-release-scoped-runtime.mjs
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj --configuration Release

      - name: Validate intended permanent repository posture
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .github/workflows/celar-ai-oracle-test-runtime-deploy.yml \
            .github/celar-ai-oracle-test-runtime-deploy.patched.yml

          rm -f \
            .github/workflows/apply-celar-oracle-containerapp-secret-reference.yml \
            scripts/patch-celar-oracle-containerapp-secret-reference.py
          python3 scripts/security/validate-repository-security-posture.py
          git diff --check

          git checkout -- \
            .github/workflows/apply-celar-oracle-containerapp-secret-reference.yml \
            scripts/patch-celar-oracle-containerapp-secret-reference.py

      - name: Publish four permanent source files and the exact corrected workflow blob
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git add \
            .github/celar-ai-oracle-test-runtime-deploy.patched.yml \
            src/backend/ProjectTime.Api/Ai/ProjectPulseAiReleaseRuntimePolicy.cs \
            tests/CelarAiOracleExternalRuntimeTests/Program.cs \
            tests/CelarAiProductionHardeningTests/ReleaseRuntimeBehavior.cs \
            tests/validate-celar-ai-oracle-test-runtime.mjs
          git diff --cached --check
          git config user.name 'Pulse Enterprise Automation'
          git config user.email 'pulse-enterprise-automation@users.noreply.github.com'
          git commit -m 'fix: publish validated Oracle token provenance source'
          git push origin HEAD:fix/celar-oracle-containerapp-secret-reference-20260810
