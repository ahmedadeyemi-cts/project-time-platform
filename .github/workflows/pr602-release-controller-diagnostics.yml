name: PR602 Release Controller Diagnostics

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.issue.number == 602 && github.event.comment.body == '/diagnose-pr602-release-controller'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: release/test-pr600-pr601-1d1afbdc-20260810
          fetch-depth: 0
          persist-credentials: true
      - shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path('.github/workflows/projectpulse-deploy-test.yml').read_text(encoding='utf-8')
          old_full = 'b0aedc706c3fe33b97b91a1b0074a20578c82b64'
          old_short = 'b0aedc70'
          report = {
              'old_full_count': source.count(old_full),
              'old_short_count': source.count(old_short),
              'workflow_name_count': source.count('name: ProjectPulse Test-Only Module 081/082 and Theme Recovery b0aedc70'),
              'permissions_anchor_count': source.count('permissions:\n  id-token: write\n  contents: read'),
              'rollback_anchor_count': source.count('\n      - name: Restore prior images and source marker on failure\n'),
              'oracle_queue_count': source.count('Queue protected Oracle runtime activation'),
              'target_release_line_count': source.count('TARGET_RELEASE_COMMIT:'),
              'production_environment_count': source.count('environment: production'),
              'line_count': len(source.splitlines()),
          }
          out = Path('.github/pr602-command-smoke/release-controller-diagnostics.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY
          git add .github/pr602-command-smoke/release-controller-diagnostics.json
          git config user.name 'Pulse Test Release Automation'
          git config user.email 'pulse-test-release-automation@users.noreply.github.com'
          git commit -m 'ci: capture PR602 release-controller anchors'
          git push origin HEAD:release/test-pr600-pr601-1d1afbdc-20260810
