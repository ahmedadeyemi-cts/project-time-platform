name: Module 025 CI repair

on:
  push:
    branches:
      - feature/module025-sow-gsd-workspace-20260830

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Module 025 CI repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          backend = Path('src/backend/ProjectTime.Api/Modules/SowGsdWorkspaceModule.cs')
          text = backend.read_text()
          old = 'document.ToString(SaveOptions.DisableFormatting)'
          new = 'document.ToString(System.Xml.Linq.SaveOptions.DisableFormatting)'
          assert text.count(old) == 1, f'expected one SaveOptions ambiguity, found {text.count(old)}'
          backend.write_text(text.replace(old, new))

          router = Path('src/frontend/project-time-web/src/enterprise/SalesDeliveryWorkflowCenter.jsx')
          router.write_text("""import LegacySalesDeliveryWorkflowCenter from './LegacySalesDeliveryWorkflowCenter';
          import SowGsdWorkspace from './SowGsdWorkspace';
          import './sales-delivery-workflow-center.css';

          export const MODULE025_DIRECTORY_FALLBACK = Object.freeze({
            customerEndpoint: '/api/customers/overview',
            opportunityEndpoint: '/api/opportunities?scope=all',
            customerPrompt: 'Select or type a customer',
            opportunityPrompt: 'Select or type an opportunity'
          });

          export default function SalesDeliveryWorkflowCenter({ module }) {
            if (module === '025') {
              return <section className=\"sales-delivery-workflow-center\" data-module={module}><SowGsdWorkspace directoryFallback={MODULE025_DIRECTORY_FALLBACK} /></section>;
            }
            return <LegacySalesDeliveryWorkflowCenter module={module} />;
          }
          """)

          frontend = Path('src/frontend/project-time-web/src/enterprise/SowGsdWorkspace.jsx')
          text = frontend.read_text()
          old_sig = 'export default function SowGsdWorkspace() {'
          new_sig = 'export default function SowGsdWorkspace({ directoryFallback = {} }) {'
          assert text.count(old_sig) == 1, f'workspace signature count={text.count(old_sig)}'
          text = text.replace(old_sig, new_sig)

          old_state = "const [options, setOptions] = useState({ loading: true, customers: [], accountExecutives: [], resalePeople: [], solutionArchitects: [], access: {} });"
          new_state = "const [options, setOptions] = useState({ loading: true, customers: [], opportunities: [], directoryWarnings: [], accountExecutives: [], resalePeople: [], solutionArchitects: [], access: {} });"
          assert text.count(old_state) == 1, f'options state count={text.count(old_state)}'
          text = text.replace(old_state, new_state)

          old_effect = """  useEffect(() => {
    let active = true;
    request('/api/sow-gsd/v1/options').then((body) => {
      if (!active) return;
      setOptions({ loading: false, ...body });
      setOwnerFilter(body?.access?.canSelectSolutionArchitect ? '' : body?.access?.effectiveUserId || '');
      setWorkspace((current) => current.workspaceId ? current : emptyWorkspace(body?.access?.effectiveUserId || '', Boolean(body?.access?.canCreate)));
    }).catch((error) => {
      if (active) { setOptions((current) => ({ ...current, loading: false })); setMessage({ error: true, text: error.message }); }
    });
    return () => { active = false; };
  }, []);
"""
          new_effect = """  useEffect(() => {
    let active = true;
    const customerDirectory = directoryFallback.customerEndpoint
      ? request(directoryFallback.customerEndpoint)
      : Promise.resolve({ customers: [] });
    const opportunityDirectory = directoryFallback.opportunityEndpoint
      ? request(directoryFallback.opportunityEndpoint)
      : Promise.resolve({ opportunities: [] });

    Promise.allSettled([
      request('/api/sow-gsd/v1/options'),
      customerDirectory,
      opportunityDirectory
    ]).then(([optionsResult, customersResult, opportunitiesResult]) => {
      if (!active) return;
      if (optionsResult.status === 'rejected') throw optionsResult.reason;

      const body = optionsResult.value || {};
      const fallbackCustomers = customersResult.status === 'fulfilled'
        ? (customersResult.value?.customers || []).map((customer) => ({
            clientId: customer.clientId || customer.id || '',
            clientName: customer.clientName || customer.name || '',
            clientCode: customer.clientCode || customer.code || ''
          })).filter((customer) => customer.clientId && customer.clientName)
        : [];
      const opportunities = opportunitiesResult.status === 'fulfilled'
        ? (opportunitiesResult.value?.opportunities || [])
        : [];
      const directoryWarnings = [];
      if (customersResult.status === 'rejected') directoryWarnings.push(`Customer Directory: ${customersResult.reason?.message || 'unavailable'}`);
      if (opportunitiesResult.status === 'rejected') directoryWarnings.push(`Opportunities: ${opportunitiesResult.reason?.message || 'unavailable'}`);

      setOptions({
        loading: false,
        ...body,
        customers: (body.customers || []).length ? body.customers : fallbackCustomers,
        opportunities,
        directoryWarnings
      });
      setOwnerFilter(body?.access?.canSelectSolutionArchitect ? '' : body?.access?.effectiveUserId || '');
      setWorkspace((current) => current.workspaceId ? current : emptyWorkspace(body?.access?.effectiveUserId || '', Boolean(body?.access?.canCreate)));
    }).catch((error) => {
      if (active) { setOptions((current) => ({ ...current, loading: false })); setMessage({ error: true, text: error.message }); }
    });
    return () => { active = false; };
  }, [directoryFallback.customerEndpoint, directoryFallback.opportunityEndpoint]);
"""
          assert text.count(old_effect) == 1, f'options effect count={text.count(old_effect)}'
          text = text.replace(old_effect, new_effect)

          old_opportunity = """          <label>Opportunity reference<input disabled={disabled} value={workspace.opportunityReference || ''} onChange={(event) => setWorkspace((current) => ({ ...current, opportunityReference: event.target.value }))} /></label>"""
          new_opportunity = """          <label>Opportunity reference<input disabled={disabled} list=\"sow-gsd-opportunity-directory\" value={workspace.opportunityReference || ''} onChange={(event) => { const value = event.target.value; const match = (options.opportunities || []).find((item) => String(item.externalOpportunityId || item.topic || '').toLowerCase() === value.toLowerCase()); setWorkspace((current) => ({ ...current, opportunityReference: value, projectCode: current.projectCode || match?.externalOpportunityId || '', projectName: current.projectName || match?.topic || '', customerName: match?.accountName || current.customerName, customerId: match?.clientId || current.customerId, customerSource: match?.clientId ? 'DIRECTORY' : current.customerSource })); }} placeholder={options.loading ? 'Loading opportunities…' : (directoryFallback.opportunityPrompt || 'Select or type an opportunity')} /><datalist id=\"sow-gsd-opportunity-directory\">{(options.opportunities || []).map((opportunity) => <option key={opportunity.opportunityId || opportunity.externalOpportunityId || opportunity.topic} value={opportunity.externalOpportunityId || opportunity.topic}>{opportunity.topic || opportunity.externalOpportunityId}{opportunity.accountName ? ` · ${opportunity.accountName}` : ''}</option>)}</datalist><small>Select an authorized opportunity or type a new reference.</small></label>"""
          assert text.count(old_opportunity) == 1, f'opportunity control count={text.count(old_opportunity)}'
          text = text.replace(old_opportunity, new_opportunity)

          old_grid_end = """          <label className=\"is-wide\">Service Overview<textarea disabled={disabled} rows=\"9\" value={workspace.serviceOverview} onChange={(event) => setWorkspace((current) => ({ ...current, serviceOverview: event.target.value }))} placeholder=\"Describe the customer objective, technologies, locations, quantities, known versions, integrations, constraints, deliverables, exclusions, assumptions, access requirements, target outcome, and other verified scope details. Missing facts can remain open questions.\" /><small>Be specific. Celar AI will use this text to create detailed Plan, Design, Implement, Validate, and Release activities and estimate the phase LOE.</small></label>
        </div>
"""
          new_grid_end = """          <label className=\"is-wide\">Service Overview<textarea disabled={disabled} rows=\"9\" value={workspace.serviceOverview} onChange={(event) => setWorkspace((current) => ({ ...current, serviceOverview: event.target.value }))} placeholder=\"Describe the customer objective, technologies, locations, quantities, known versions, integrations, constraints, deliverables, exclusions, assumptions, access requirements, target outcome, and other verified scope details. Missing facts can remain open questions.\" /><small>Be specific. Celar AI will use this text to create detailed Plan, Design, Implement, Validate, and Release activities and estimate the phase LOE.</small></label>
        </div>
        {options.directoryWarnings?.length ? <div className=\"sales-delivery-result is-error\"><strong>Directory source status</strong>{options.directoryWarnings.join(' · ')} You can still enter the customer manually and type an opportunity reference.</div> : null}
"""
          assert text.count(old_grid_end) == 1, f'service overview block count={text.count(old_grid_end)}'
          text = text.replace(old_grid_end, new_grid_end)
          frontend.write_text(text)
          PY

          rm -f .github/workflows/module025-ci-repair.yml

          grep -Fq 'System.Xml.Linq.SaveOptions.DisableFormatting' src/backend/ProjectTime.Api/Modules/SowGsdWorkspaceModule.cs
          grep -Fq '/api/customers/overview' src/frontend/project-time-web/src/enterprise/SalesDeliveryWorkflowCenter.jsx
          grep -Fq '/api/opportunities?scope=all' src/frontend/project-time-web/src/enterprise/SalesDeliveryWorkflowCenter.jsx
          grep -Fq 'Select or type a customer' src/frontend/project-time-web/src/enterprise/SalesDeliveryWorkflowCenter.jsx
          grep -Fq 'Select or type an opportunity' src/frontend/project-time-web/src/enterprise/SalesDeliveryWorkflowCenter.jsx
          grep -Fq 'directoryFallback.customerEndpoint' src/frontend/project-time-web/src/enterprise/SowGsdWorkspace.jsx
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(module025): repair CI compatibility contracts'
          git push origin "HEAD:${GITHUB_REF_NAME}"
