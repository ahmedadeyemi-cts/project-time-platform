name: Validate Microsoft Preview Mail Runtime Test Deployment

on:
  pull_request:
    paths:
      - '.github/workflows/projectpulse-deploy-microsoft-preview-mail-runtime-test.yml'
      - '.github/workflows/validate-microsoft-preview-mail-runtime-test-deployment.yml'
      - 'scripts/validate-microsoft-preview-mail-runtime-test-deployment.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Microsoft Preview mail-runtime deployment controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate guarded no-migration API/web deployment contract
        shell: bash
        run: bash scripts/validate-microsoft-preview-mail-runtime-test-deployment.sh
