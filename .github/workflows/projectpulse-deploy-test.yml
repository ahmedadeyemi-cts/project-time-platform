name: ProjectPulse Final UAT Functional Completion Test Deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/projectpulse-deploy-test.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-uat-functional-completion-test
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'deploy/uat-functional-completion-test-0bb15f67-20260803'
    name: Verify migrations 060-066 and deploy exact PR 447 release to Test
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_RELEASE_COMMIT: 0bb15f6736c4fb8feee1f83f144c9fbde5e563d0
      EXPECTED_CONTROL_BRANCH: deploy/uat-functional-completion-test-0bb15f67-20260803
      CONTROL_WORKFLOW: .github/workflows/projectpulse-deploy-test.yml
      EXPECTED_API_IMAGE: acrphdtest7825cc.azurecr.io/project-health-dashboard-api@sha256:e3cb16597fa4bd8fb01462c24ea3a7d7e2c5c6ca126f6305173cb1c1c298c0b2
      EXPECTED_WEB_IMAGE: acrphdtest7825cc.azurecr.io/project-health-dashboard-web@sha256:284ebfddd6c508169bc9d9d77657b84735c1ca08f54127697a3d7ed64cc9e2d0
      EXPECTED_MIGRATOR_IMAGE: acrphdtest7825cc.azurecr.io/project-health-dashboard-uat-migrator@sha256:00e4f1533cf592f0f833f9a87d771cc895280e0a00b04f8ca2074db35af9cd15

    steps:
      - name: Check out exact deployment control
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact merged release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 0bb15f6736c4fb8feee1f83f144c9fbde5e563d0
          path: release
          fetch-depth: 1
          persist-credentials: false

      - name: Guard exact release and one-file Test activation
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ github.event.pull_request.base.ref }}' == 'main' ]]
          [[ '${{ github.event.pull_request.head.ref }}' == "$EXPECTED_CONTROL_BRANCH" ]]
          [[ '${{ github.event.pull_request.head.repo.full_name }}' == '${{ github.repository }}' ]]

          CONTROL_HEAD="$(git -C control rev-parse HEAD)"
          RELEASE_HEAD="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_HEAD" == '${{ github.event.pull_request.head.sha }}' ]]
          [[ "$RELEASE_HEAD" == "$EXPECTED_RELEASE_COMMIT" ]]
          git -C control fetch origin main --no-tags
          [[ "$(git -C control rev-parse origin/main)" == "$EXPECTED_RELEASE_COMMIT" ]]
          git -C control merge-base --is-ancestor "$EXPECTED_RELEASE_COMMIT" HEAD
          [[ "$(git -C control diff --name-only "$EXPECTED_RELEASE_COMMIT"...HEAD)" == "$CONTROL_WORKFLOW" ]]
          git -C control diff --check "$EXPECTED_RELEASE_COMMIT"...HEAD

          [[ "$EXPECTED_API_IMAGE" == '${{ vars.AZURE_ACR_NAME }}.azurecr.io/'*@sha256:* ]]
          [[ "$EXPECTED_WEB_IMAGE" == '${{ vars.AZURE_ACR_NAME }}.azurecr.io/'*@sha256:* ]]
          [[ "$EXPECTED_MIGRATOR_IMAGE" == '${{ vars.AZURE_ACR_NAME }}.azurecr.io/'*@sha256:* ]]

          for migration in \
            060_analytics_center_enterprise_experience.sql \
            061_celar_ai_capability_routing.sql \
            062_super_administrator_permanent_full_control.sql \
            063_project_management_billing_role_access_repair.sql \
            064_module_065_enterprise_notification_orchestration.sql \
            065_enterprise_notification_runtime_completion.sql \
            066_immutable_project_numbers.sql; do
            test -f "release/database/migrations/$migration"
          done

          grep -Fq 'Engineer Project Over / Under Budget Report' release/src/backend/ProjectTime.Api/Modules/EnterpriseReportingCatalog.cs
          grep -Fq 'Utilization Over / Under Report by Engineer' release/src/backend/ProjectTime.Api/Modules/EnterpriseReportingCatalog.cs
          grep -Fq 'Engineer Vacation / PTO Used Report' release/src/backend/ProjectTime.Api/Modules/EnterpriseReportingCatalog.cs
          grep -Fq 'Overview & Architecture' release/src/frontend/project-time-web/src/WorkTaskBuilderPanel.jsx
          grep -Fq 'What you need to do now' release/src/frontend/project-time-web/src/ProjectCloseoutCenter.jsx
          grep -Fq 'SEND MODULE 065 TEST' release/src/frontend/project-time-web/src/MicrosoftMailTransportReadinessPanel.jsx
          bash release/tests/test-uat-functional-completion-contract.sh
          bash -n release/tests/test-immutable-project-numbers-migration-066.sh

          echo "target_commit=$RELEASE_HEAD" >> "$GITHUB_OUTPUT"
          echo "control_commit=$CONTROL_HEAD" >> "$GITHUB_OUTPUT"
          echo 'UAT_COMPLETION_RELEASE_GUARD=PASSED'

      - name: Sign in to Azure Test through OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Load Test database connection from the authoritative API configuration
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        shell: bash
        run: bash release/scripts/export-pr55-test-database-url.sh

      - name: Confirm immutable candidate artifacts exist
        shell: bash
        run: |
          set -Eeuo pipefail
          for image in "$EXPECTED_API_IMAGE" "$EXPECTED_WEB_IMAGE" "$EXPECTED_MIGRATOR_IMAGE"; do
            relative="${image#${{ vars.AZURE_ACR_NAME }}.azurecr.io/}"
            repository="${relative%@sha256:*}"
            digest="sha256:${relative##*@sha256:}"
            observed="$(az acr repository show-manifests \
              --name '${{ vars.AZURE_ACR_NAME }}' \
              --repository "$repository" \
              --query "[?digest=='$digest'].digest | [0]" \
              -o tsv --only-show-errors)"
            [[ "$observed" == "$digest" ]]
            echo "IMMUTABLE_ARTIFACT_PRESENT=$repository@$digest"
          done

      - name: Extract expected web artifacts from the immutable candidate image
        id: candidate_web
        shell: bash
        run: |
          set -Eeuo pipefail
          az acr login --name '${{ vars.AZURE_ACR_NAME }}' --only-show-errors
          docker pull "$EXPECTED_WEB_IMAGE" >/dev/null
          CONTAINER_ID="$(docker create "$EXPECTED_WEB_IMAGE")"
          cleanup_container() {
            docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true
          }
          trap cleanup_container EXIT

          rm -rf /tmp/uat-candidate-html
          mkdir -p /tmp/uat-candidate-html
          docker cp "$CONTAINER_ID:/usr/share/nginx/html/." /tmp/uat-candidate-html/
          test -s /tmp/uat-candidate-html/index.html

          CANDIDATE_JS_REF="$(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/uat-candidate-html/index.html | head -1 | cut -d'"' -f2)"
          [[ -n "$CANDIDATE_JS_REF" ]]
          CANDIDATE_JS_PATH="${CANDIDATE_JS_REF%%\?*}"
          CANDIDATE_JS_PATH="${CANDIDATE_JS_PATH#/}"
          test -s "/tmp/uat-candidate-html/$CANDIDATE_JS_PATH"

          INDEX_SHA="$(sha256sum /tmp/uat-candidate-html/index.html | awk '{print $1}')"
          JS_SHA="$(sha256sum "/tmp/uat-candidate-html/$CANDIDATE_JS_PATH" | awk '{print $1}')"
          [[ "$INDEX_SHA" =~ ^[0-9a-f]{64}$ && "$JS_SHA" =~ ^[0-9a-f]{64}$ ]]

          echo "index_sha256=$INDEX_SHA" >> "$GITHUB_OUTPUT"
          echo "js_sha256=$JS_SHA" >> "$GITHUB_OUTPUT"
          echo "js_ref=$CANDIDATE_JS_REF" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_WEB_INDEX_SHA256=$INDEX_SHA"
          echo "CANDIDATE_WEB_JS_SHA256=$JS_SHA"
          echo "CANDIDATE_WEB_JS_REF=$CANDIDATE_JS_REF"

      - name: Capture current rollback release
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          RAW_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          [[ "$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors | tr '[:upper:]' '[:lower:]')" == single ]]
          [[ "$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors | tr '[:upper:]' '[:lower:]')" == single ]]

          resolve_digest() {
            local image="$1"
            local registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/'
            local relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Unexpected non-ACR image: $image" >&2; return 1 ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv --only-show-errors)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          OLD_API="$(resolve_digest "$RAW_API")"
          OLD_WEB="$(resolve_digest "$RAW_WEB")"
          OLD_API_SOURCE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query "properties.template.containers[0].env[?name=='PROJECTPULSE_SOURCE_COMMIT'].value | [0]" -o tsv --only-show-errors)"
          echo "old_api_image=$OLD_API" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$OLD_WEB" >> "$GITHUB_OUTPUT"
          echo "old_api_source=$OLD_API_SOURCE" >> "$GITHUB_OUTPUT"
          echo "old_api_revision=$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.latestReadyRevisionName' -o tsv --only-show-errors)" >> "$GITHUB_OUTPUT"
          echo "old_web_revision=$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.latestReadyRevisionName' -o tsv --only-show-errors)" >> "$GITHUB_OUTPUT"

      - name: Idempotently reapply and verify migrations 060-066
        id: migrate
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: |
          set -Eeuo pipefail
          : "${PROJECTPULSE_TEST_DATABASE_URL:?PROJECTPULSE_TEST_DATABASE_URL is required}"
          echo "::add-mask::$PROJECTPULSE_TEST_DATABASE_URL"
          JOB_NAME="uat-r4-${GITHUB_RUN_ID}"
          ENVIRONMENT_ID="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_API_APP" --query properties.managedEnvironmentId -o tsv --only-show-errors)"
          [[ -n "$ENVIRONMENT_ID" && "$ENVIRONMENT_ID" != null ]]
          ACR_TOKEN="$(az acr login --name "$AZURE_ACR_NAME" --expose-token --query accessToken -o tsv --only-show-errors)"
          [[ -n "$ACR_TOKEN" ]]
          echo "::add-mask::$ACR_TOKEN"
          JOB_CREATED=0
          cleanup_job() {
            local status=$?
            trap - EXIT INT TERM
            unset ACR_TOKEN PROJECTPULSE_TEST_DATABASE_URL
            if (( JOB_CREATED == 1 )); then
              az containerapp job delete -g "$AZURE_RESOURCE_GROUP" -n "$JOB_NAME" --yes --output none --only-show-errors || true
            fi
            exit "$status"
          }
          trap cleanup_job EXIT INT TERM

          az containerapp job create \
            -g "$AZURE_RESOURCE_GROUP" -n "$JOB_NAME" \
            --environment "$ENVIRONMENT_ID" \
            --trigger-type Manual --replica-timeout 1800 --replica-retry-limit 0 \
            --replica-completion-count 1 --parallelism 1 \
            --image "$EXPECTED_MIGRATOR_IMAGE" --cpu 0.25 --memory 0.5Gi \
            --registry-server "$AZURE_ACR_NAME.azurecr.io" \
            --registry-username '00000000-0000-0000-0000-000000000000' \
            --registry-password "$ACR_TOKEN" \
            --secrets "uat-db-url=$PROJECTPULSE_TEST_DATABASE_URL" \
            --env-vars PROJECTPULSE_TEST_DATABASE_URL=secretref:uat-db-url \
            --tags projectpulse-scope=uat-functional-completion-final projectpulse-release="$EXPECTED_RELEASE_COMMIT" \
            --output none --only-show-errors
          JOB_CREATED=1
          unset ACR_TOKEN PROJECTPULSE_TEST_DATABASE_URL

          EXECUTION_NAME="$(az containerapp job start -g "$AZURE_RESOURCE_GROUP" -n "$JOB_NAME" --query name -o tsv --only-show-errors)"
          [[ -n "$EXECUTION_NAME" && "$EXECUTION_NAME" != null ]]
          echo "execution_name=$EXECUTION_NAME" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 180); do
            STATUS="$(az containerapp job execution list -g "$AZURE_RESOURCE_GROUP" -n "$JOB_NAME" --query "[?name=='$EXECUTION_NAME'].properties.status | [0]" -o tsv --only-show-errors)"
            case "$STATUS" in
              Succeeded) echo 'UAT_COMPLETION_MIGRATIONS_060_066=VERIFIED'; exit 0 ;;
              Failed|Canceled) break ;;
            esac
            sleep 5
          done
          az containerapp job logs show -g "$AZURE_RESOURCE_GROUP" -n "$JOB_NAME" --execution "$EXECUTION_NAME" --container "$JOB_NAME" --tail 300 --only-show-errors >&2 || true
          exit 1

      - name: Deploy exact immutable API image
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image "$EXPECTED_API_IMAGE" \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT="$EXPECTED_RELEASE_COMMIT" \
            --revision-suffix "uatr4api-${GITHUB_RUN_ID}" --output none --only-show-errors

      - name: Validate exact API image, source, and public boundaries
        id: validate_api
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          for attempt in $(seq 1 90); do
            ACTIVE_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
            ACTIVE_SOURCE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query "properties.template.containers[0].env[?name=='PROJECTPULSE_SOURCE_COMMIT'].value | [0]" -o tsv --only-show-errors)"
            API_READY_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.latestReadyRevisionName' -o tsv --only-show-errors)"
            if [[ "$ACTIVE_API" == "$EXPECTED_API_IMAGE" && "$ACTIVE_SOURCE" == "$EXPECTED_RELEASE_COMMIT" && -n "$API_READY_REVISION" && "$API_READY_REVISION" != null ]]; then break; fi
            sleep 5
          done
          [[ "$ACTIVE_API" == "$EXPECTED_API_IMAGE" ]]
          [[ "$ACTIVE_SOURCE" == "$EXPECTED_RELEASE_COMMIT" ]]
          [[ -n "$API_READY_REVISION" && "$API_READY_REVISION" != null ]]
          [[ "$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors | tr '[:upper:]' '[:lower:]')" == single ]]

          wait_status() {
            local url="$1"
            local expected="$2"
            local status=''
            for attempt in $(seq 1 60); do
              status="$(curl -sS -o /tmp/uat-r4-api-response -w '%{http_code}' "$url" || true)"
              if [[ ",$expected," == *",$status,"* ]]; then return 0; fi
              sleep 5
            done
            echo "$url returned $status; expected $expected" >&2
            return 1
          }
          wait_status "$BASE/health" '200'
          wait_status "$BASE/api/version" '200'
          wait_status "$BASE/api/enterprise-notifications/runtime/readiness" '401'
          wait_status "$BASE/api/work-lifecycle/dashboard" '401'
          wait_status "$BASE/api/celar-ai/v1/platform/readiness" '401'
          wait_status "$BASE/api/financial-operations/modules/040" '401'
          wait_status "$BASE/api/financial-operations/reports/catalog" '401'
          wait_status "$BASE/api/integrations/026/providers" '401'
          wait_status "$BASE/api/entra-secret-expiration/profile" '401'
          echo "ready_revision=$API_READY_REVISION" >> "$GITHUB_OUTPUT"
          echo 'UAT_COMPLETION_TEST_API=PASSED'

      - name: Deploy exact immutable web image
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image "$EXPECTED_WEB_IMAGE" \
            --revision-suffix "uatr4web-${GITHUB_RUN_ID}" --output none --only-show-errors

      - name: Validate public Test serves the exact immutable candidate web artifacts
        id: validate_web
        shell: bash
        env:
          CANDIDATE_INDEX_SHA: ${{ steps.candidate_web.outputs.index_sha256 }}
          CANDIDATE_JS_SHA: ${{ steps.candidate_web.outputs.js_sha256 }}
          CANDIDATE_JS_REF: ${{ steps.candidate_web.outputs.js_ref }}
        run: |
          set -Eeuo pipefail
          PUBLIC_BASE='${{ vars.PUBLIC_URL }}'; PUBLIC_BASE="${PUBLIC_BASE%/}"

          for attempt in $(seq 1 90); do
            ACTIVE_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
            WEB_READY_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.latestReadyRevisionName' -o tsv --only-show-errors)"
            if [[ "$ACTIVE_WEB" == "$EXPECTED_WEB_IMAGE" && -n "$WEB_READY_REVISION" && "$WEB_READY_REVISION" != null ]]; then break; fi
            sleep 5
          done
          [[ "$ACTIVE_WEB" == "$EXPECTED_WEB_IMAGE" ]]
          [[ -n "$WEB_READY_REVISION" && "$WEB_READY_REVISION" != null ]]
          [[ "$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors | tr '[:upper:]' '[:lower:]')" == single ]]

          READY=false
          PUBLIC_INDEX_SHA=''
          PUBLIC_JS_SHA=''
          PUBLIC_JS_REF=''
          for attempt in $(seq 1 120); do
            BUSTER="uat-r4-${GITHUB_RUN_ID}-${attempt}"
            STATUS="$(curl -sSL \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              -o /tmp/uat-r4-public-index.html \
              -w '%{http_code}' \
              "$PUBLIC_BASE/?release_check=$BUSTER" || true)"
            if [[ "$STATUS" == 200 && -s /tmp/uat-r4-public-index.html ]]; then
              PUBLIC_INDEX_SHA="$(sha256sum /tmp/uat-r4-public-index.html | awk '{print $1}')"
              PUBLIC_JS_REF="$(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/uat-r4-public-index.html | head -1 | cut -d'"' -f2 || true)"
              if [[ "$PUBLIC_INDEX_SHA" == "$CANDIDATE_INDEX_SHA" && "$PUBLIC_JS_REF" == "$CANDIDATE_JS_REF" ]]; then
                case "$PUBLIC_JS_REF" in
                  http*) PUBLIC_JS_URL="$PUBLIC_JS_REF" ;;
                  /*) PUBLIC_JS_URL="$PUBLIC_BASE$PUBLIC_JS_REF" ;;
                  *) PUBLIC_JS_URL="$PUBLIC_BASE/$PUBLIC_JS_REF" ;;
                esac
                JS_STATUS="$(curl -sSL \
                  -H 'Cache-Control: no-cache, no-store, max-age=0' \
                  -H 'Pragma: no-cache' \
                  -o /tmp/uat-r4-public-app.js \
                  -w '%{http_code}' \
                  "$PUBLIC_JS_URL" || true)"
                if [[ "$JS_STATUS" == 200 && -s /tmp/uat-r4-public-app.js ]]; then
                  PUBLIC_JS_SHA="$(sha256sum /tmp/uat-r4-public-app.js | awk '{print $1}')"
                  if [[ "$PUBLIC_JS_SHA" == "$CANDIDATE_JS_SHA" ]]; then
                    READY=true
                    break
                  fi
                fi
              fi
            fi
            sleep 5
          done

          [[ "$READY" == true ]] || {
            echo "Public Test did not converge to the immutable candidate artifacts." >&2
            echo "candidate_index=$CANDIDATE_INDEX_SHA public_index=$PUBLIC_INDEX_SHA" >&2
            echo "candidate_js_ref=$CANDIDATE_JS_REF public_js_ref=$PUBLIC_JS_REF" >&2
            echo "candidate_js=$CANDIDATE_JS_SHA public_js=$PUBLIC_JS_SHA" >&2
            exit 1
          }

          [[ "$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)" == "$EXPECTED_API_IMAGE" ]]
          [[ "$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query "properties.template.containers[0].env[?name=='PROJECTPULSE_SOURCE_COMMIT'].value | [0]" -o tsv --only-show-errors)" == "$EXPECTED_RELEASE_COMMIT" ]]
          [[ "$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)" == "$EXPECTED_WEB_IMAGE" ]]

          echo "ready_revision=$WEB_READY_REVISION" >> "$GITHUB_OUTPUT"
          echo "public_index_sha256=$PUBLIC_INDEX_SHA" >> "$GITHUB_OUTPUT"
          echo "public_js_sha256=$PUBLIC_JS_SHA" >> "$GITHUB_OUTPUT"
          echo "public_js_ref=$PUBLIC_JS_REF" >> "$GITHUB_OUTPUT"
          echo 'UAT_COMPLETION_PUBLIC_WEB_EXACT_ARTIFACT=PASSED'

      - name: Write immutable Test deployment evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cat > evidence/uat-functional-completion-test-deployment.json <<JSON
          {
            "environment": "test",
            "releaseCommit": "${{ steps.release.outputs.target_commit }}",
            "controlCommit": "${{ steps.release.outputs.control_commit }}",
            "workflowRunId": "${{ github.run_id }}",
            "priorAttempts": ["30778613442", "30779634966", "30779876660"],
            "sourcePullRequests": [447],
            "migrations": ["060", "061", "062", "063", "064", "065", "066"],
            "migrationStatus": "idempotently-reapplied-and-verified",
            "migrationImage": "$EXPECTED_MIGRATOR_IMAGE",
            "migrationExecution": "${{ steps.migrate.outputs.execution_name }}",
            "apiImage": "$EXPECTED_API_IMAGE",
            "webImage": "$EXPECTED_WEB_IMAGE",
            "apiReadyRevision": "${{ steps.validate_api.outputs.ready_revision }}",
            "webReadyRevision": "${{ steps.validate_web.outputs.ready_revision }}",
            "candidateIndexSha256": "${{ steps.candidate_web.outputs.index_sha256 }}",
            "publicIndexSha256": "${{ steps.validate_web.outputs.public_index_sha256 }}",
            "candidateJavaScriptSha256": "${{ steps.candidate_web.outputs.js_sha256 }}",
            "publicJavaScriptSha256": "${{ steps.validate_web.outputs.public_js_sha256 }}",
            "publicJavaScriptReference": "${{ steps.validate_web.outputs.public_js_ref }}",
            "previousApiImage": "${{ steps.before.outputs.old_api_image }}",
            "previousWebImage": "${{ steps.before.outputs.old_web_image }}",
            "previousApiRevision": "${{ steps.before.outputs.old_api_revision }}",
            "previousWebRevision": "${{ steps.before.outputs.old_web_revision }}",
            "previousApiSource": "${{ steps.before.outputs.old_api_source }}",
            "activeRevisionMode": "Single",
            "productionDeployment": false,
            "emailSent": false,
            "automaticDatabaseRollback": false
          }
          JSON
          sha256sum evidence/uat-functional-completion-test-deployment.json > evidence/SHA256SUMS
          cat evidence/uat-functional-completion-test-deployment.json

      - name: Upload Test deployment evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uat-functional-completion-test-deployment-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Restore previous API and web images on rollout failure
        if: ${{ failure() && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set +e
          echo 'Migrations 060-066 are additive and are not automatically rolled back.'
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.before.outputs.old_api_image }}' \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT='${{ steps.before.outputs.old_api_source }}' \
            --revision-suffix "uatr4apirb-${GITHUB_RUN_ID}" --output none --only-show-errors || true
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.before.outputs.old_web_image }}' \
            --revision-suffix "uatr4webrb-${GITHUB_RUN_ID}" --output none --only-show-errors || true

      - name: Sign out of Azure
        if: always()
        shell: bash
        run: az logout || true
