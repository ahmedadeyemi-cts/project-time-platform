name: ProjectPulse Deploy PR436 Consolidated Test

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/projectpulse-deploy-test.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-pr436-consolidated-test
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'deploy/pr436-consolidated-test-8ef1a85f-20260802'
    name: Apply migrations 060-064 and deploy exact PR436 merge to Test
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_RELEASE_COMMIT: 8ef1a85f9d808e32e0acee5bdf605dd93083c960
      EXPECTED_CONTROL_BRANCH: deploy/pr436-consolidated-test-8ef1a85f-20260802
      CONTROL_WORKFLOW: .github/workflows/projectpulse-deploy-test.yml

    steps:
      - name: Check out exact deployment control
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact merged PR436 release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 8ef1a85f9d808e32e0acee5bdf605dd93083c960
          path: release
          fetch-depth: 1
          persist-credentials: false

      - name: Guard control branch, exact main release, and Test-only scope
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ github.event.pull_request.base.ref }}' == 'main' ]]
          [[ '${{ github.event.pull_request.head.ref }}' == "$EXPECTED_CONTROL_BRANCH" ]]
          [[ '${{ github.event.pull_request.head.repo.full_name }}' == '${{ github.repository }}' ]]

          CONTROL_HEAD="$(git -C control rev-parse HEAD)"
          RELEASE_HEAD="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_HEAD" == '${{ github.event.pull_request.head.sha }}' ]]
          [[ "$RELEASE_HEAD" == "$EXPECTED_RELEASE_COMMIT" ]]

          git -C control fetch origin main --no-tags
          CURRENT_MAIN="$(git -C control rev-parse origin/main)"
          [[ "$CURRENT_MAIN" == "$EXPECTED_RELEASE_COMMIT" ]] || {
            echo "main moved from the validated PR436 merge: $CURRENT_MAIN" >&2
            exit 1
          }
          git -C control merge-base --is-ancestor "$EXPECTED_RELEASE_COMMIT" HEAD

          CHANGED="$(git -C control diff --name-only "$EXPECTED_RELEASE_COMMIT"...HEAD)"
          printf '%s\n' "$CHANGED"
          [[ "$CHANGED" == "$CONTROL_WORKFLOW" ]] || {
            echo 'The activation PR must contain only the one-time Test deployment workflow.' >&2
            exit 1
          }

          for migration in 060 061 062 063 064; do
            test -f "release/database/migrations/${migration}_"*.sql
          done
          test -f release/deployment/containers/api/Dockerfile
          test -f release/deployment/containers/web/Dockerfile
          test -f release/scripts/export-pr55-test-database-url.sh
          test -f release/scripts/build-pr55-acr-image.sh
          test -f release/docs/releases/2026-08-02-consolidated-enterprise-validation.md

          ! grep -R -nE 'production|prod' "$CONTROL_WORKFLOW" \
            | grep -Ev 'Production deployment|Production remains|not Production|No Production|Production operation' || true

          echo "target_commit=$RELEASE_HEAD" >> "$GITHUB_OUTPUT"
          echo "control_commit=$CONTROL_HEAD" >> "$GITHUB_OUTPUT"
          echo 'PR436_TEST_RELEASE_GUARD=PASSED'

      - name: Sign in to Azure Test through OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Load Test database connection from the authoritative API configuration
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        shell: bash
        run: bash release/scripts/export-pr55-test-database-url.sh

      - name: Capture current immutable API and web release
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          RAW_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors)"
          [[ -n "$RAW_API" && -n "$RAW_WEB" ]]
          [[ "${API_MODE,,}" == single && "${WEB_MODE,,}" == single ]]

          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) echo "Unexpected non-ACR image: $image" >&2; return 1 ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv --only-show-errors)"
            [[ "$digest" == sha256:* ]]
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          OLD_API="$(resolve_digest "$RAW_API")"
          OLD_WEB="$(resolve_digest "$RAW_WEB")"
          OLD_API_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.latestReadyRevisionName' -o tsv --only-show-errors)"
          OLD_WEB_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.latestReadyRevisionName' -o tsv --only-show-errors)"
          OLD_API_SOURCE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query "properties.template.containers[0].env[?name=='PROJECTPULSE_SOURCE_COMMIT'].value | [0]" -o tsv --only-show-errors)"

          echo "old_api_image=$OLD_API" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$OLD_WEB" >> "$GITHUB_OUTPUT"
          echo "old_api_revision=$OLD_API_REVISION" >> "$GITHUB_OUTPUT"
          echo "old_web_revision=$OLD_WEB_REVISION" >> "$GITHUB_OUTPUT"
          echo "old_api_source=$OLD_API_SOURCE" >> "$GITHUB_OUTPUT"
          echo 'PR436_PREVIOUS_RELEASE_CAPTURED=YES'

      - name: Build immutable API and web images from the exact PR436 merge
        id: build
        working-directory: release
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA='${{ steps.release.outputs.target_commit }}'
          API_REPO='project-health-dashboard-api'
          WEB_REPO='project-health-dashboard-web'
          API_DIGEST="$(scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$API_REPO:pr436-$SHA" deployment/containers/api/Dockerfile .)"
          WEB_DIGEST="$(scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "$WEB_REPO:pr436-$SHA" deployment/containers/web/Dockerfile .)"
          [[ "$API_DIGEST" == sha256:* && "$WEB_DIGEST" == sha256:* ]]
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$API_REPO@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/$WEB_REPO@$WEB_DIGEST" >> "$GITHUB_OUTPUT"
          echo "api_digest=$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_digest=$WEB_DIGEST" >> "$GITHUB_OUTPUT"
          echo 'PR436_IMMUTABLE_IMAGES_BUILT=YES'

      - name: Build checksum-pinned migrations 060-064 image
        id: migration_image
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/pr436-migrator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          for migration in \
            060_analytics_center_enterprise_experience.sql \
            061_celar_ai_capability_routing.sql \
            062_super_administrator_permanent_full_control.sql \
            063_project_management_billing_role_access_repair.sql \
            064_module_065_enterprise_notification_orchestration.sql; do
            install -m 0644 "release/database/migrations/$migration" "$CONTEXT/migrations/$migration"
          done
          (
            cd "$CONTEXT/migrations"
            sha256sum \
              060_analytics_center_enterprise_experience.sql \
              061_celar_ai_capability_routing.sql \
              062_super_administrator_permanent_full_control.sql \
              063_project_management_billing_role_access_repair.sql \
              064_module_065_enterprise_notification_orchestration.sql \
              > SHA256SUMS
          )
          cat > "$CONTEXT/apply.sh" <<'SCRIPT'
          #!/bin/sh
          set -eu
          EXPECTED_RELEASE='8ef1a85f9d808e32e0acee5bdf605dd93083c960'
          [ "$(cat /release-commit)" = "$EXPECTED_RELEASE" ]
          : "${PROJECTPULSE_TEST_DATABASE_URL:?PROJECTPULSE_TEST_DATABASE_URL is required}"
          cd /migrations
          sha256sum -c SHA256SUMS
          for migration in \
            060_analytics_center_enterprise_experience.sql \
            061_celar_ai_capability_routing.sql \
            062_super_administrator_permanent_full_control.sql \
            063_project_management_billing_role_access_repair.sql \
            064_module_065_enterprise_notification_orchestration.sql; do
            echo "PR436_MIGRATION_APPLY=$migration"
            psql "$PROJECTPULSE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "/migrations/$migration"
          done
          psql "$PROJECTPULSE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            SELECT CASE WHEN NOT EXISTS (
              SELECT required.migration_id
              FROM (VALUES
                ('060_analytics_center_enterprise_experience'),
                ('061_celar_ai_capability_routing'),
                ('062_super_administrator_permanent_full_control'),
                ('063_project_management_billing_role_access_repair'),
                ('064_module_065_enterprise_notification_orchestration')
              ) required(migration_id)
              LEFT JOIN schema_migrations applied
                ON applied.migration_id = required.migration_id
              WHERE applied.migration_id IS NULL
            ) THEN 'PR436_MIGRATIONS_060_064=VERIFIED'
            ELSE 'PR436_MIGRATIONS_060_064=MISSING' END;" \
            | grep -Fxq 'PR436_MIGRATIONS_060_064=VERIFIED'
          echo 'PR436_MIGRATIONS_060_064=VERIFIED'
          SCRIPT
          chmod 0555 "$CONTEXT/apply.sh"
          printf '%s\n' '${{ steps.release.outputs.target_commit }}' > "$CONTEXT/release-commit"
          cat > "$CONTEXT/Dockerfile" <<'DOCKERFILE'
          FROM postgres:16-alpine
          COPY migrations /migrations
          COPY apply.sh /apply.sh
          COPY release-commit /release-commit
          RUN chmod 0555 /apply.sh && chmod -R a-w /migrations /release-commit
          ENTRYPOINT ["/apply.sh"]
          DOCKERFILE
          DIGEST="$(release/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-pr436-migrator:${{ steps.release.outputs.target_commit }}-${GITHUB_RUN_ID}" "$CONTEXT/Dockerfile" "$CONTEXT")"
          [[ "$DIGEST" == sha256:* ]]
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-pr436-migrator@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo 'PR436_MIGRATION_IMAGE_BUILT=YES'

      - name: Apply and verify migrations 060-064 inside the private Test network
        id: migrate
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          MIGRATION_IMAGE: ${{ steps.migration_image.outputs.image }}
        run: |
          set -Eeuo pipefail
          : "${PROJECTPULSE_TEST_DATABASE_URL:?PROJECTPULSE_TEST_DATABASE_URL is required}"
          echo "::add-mask::$PROJECTPULSE_TEST_DATABASE_URL"
          JOB_NAME="p436-mig-${GITHUB_RUN_ID}"
          [[ "$JOB_NAME" =~ ^[a-z][a-z0-9-]{0,30}[a-z0-9]$ ]]
          [[ "$MIGRATION_IMAGE" == "$AZURE_ACR_NAME.azurecr.io/"*@sha256:* ]]
          ENVIRONMENT_ID="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_API_APP" --query properties.managedEnvironmentId -o tsv --only-show-errors)"
          [[ -n "$ENVIRONMENT_ID" && "$ENVIRONMENT_ID" != null ]]
          if az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "$JOB_NAME" --output none --only-show-errors 2>/dev/null; then
            echo "Guarded migration job already exists: $JOB_NAME" >&2
            exit 1
          fi

          ACR_TOKEN="$(az acr login --name "$AZURE_ACR_NAME" --expose-token --query accessToken -o tsv --only-show-errors)"
          [[ -n "$ACR_TOKEN" ]]
          echo "::add-mask::$ACR_TOKEN"
          JOB_CREATED=0
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            unset ACR_TOKEN PROJECTPULSE_TEST_DATABASE_URL
            if (( JOB_CREATED == 1 )); then
              az containerapp job delete -g "$AZURE_RESOURCE_GROUP" -n "$JOB_NAME" --yes --output none --only-show-errors || true
            fi
            exit "$status"
          }
          trap cleanup EXIT INT TERM

          az containerapp job create \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$JOB_NAME" \
            --environment "$ENVIRONMENT_ID" \
            --trigger-type Manual \
            --replica-timeout 1800 \
            --replica-retry-limit 0 \
            --replica-completion-count 1 \
            --parallelism 1 \
            --image "$MIGRATION_IMAGE" \
            --cpu 0.25 \
            --memory 0.5Gi \
            --registry-server "$AZURE_ACR_NAME.azurecr.io" \
            --registry-username '00000000-0000-0000-0000-000000000000' \
            --registry-password "$ACR_TOKEN" \
            --secrets "pr436-db-url=$PROJECTPULSE_TEST_DATABASE_URL" \
            --env-vars PROJECTPULSE_TEST_DATABASE_URL=secretref:pr436-db-url \
            --tags projectpulse-scope=pr436-test-migrations projectpulse-release='${{ steps.release.outputs.target_commit }}' \
            --output none \
            --only-show-errors
          JOB_CREATED=1
          unset ACR_TOKEN PROJECTPULSE_TEST_DATABASE_URL

          EXECUTION_NAME="$(az containerapp job start -g "$AZURE_RESOURCE_GROUP" -n "$JOB_NAME" --query name -o tsv --only-show-errors)"
          [[ -n "$EXECUTION_NAME" && "$EXECUTION_NAME" != null ]]
          echo "execution_name=$EXECUTION_NAME" >> "$GITHUB_OUTPUT"
          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

          STATUS=''
          for attempt in $(seq 1 180); do
            STATUS="$(az containerapp job execution list -g "$AZURE_RESOURCE_GROUP" -n "$JOB_NAME" --query "[?name=='$EXECUTION_NAME'].properties.status | [0]" -o tsv --only-show-errors)"
            case "$STATUS" in
              Succeeded)
                echo 'PR436_MIGRATION_JOB_STATUS=Succeeded'
                exit 0
                ;;
              Failed|Canceled)
                echo "PR436_MIGRATION_JOB_STATUS=$STATUS" >&2
                break
                ;;
            esac
            sleep 5
          done
          az containerapp job logs show -g "$AZURE_RESOURCE_GROUP" -n "$JOB_NAME" --execution "$EXECUTION_NAME" --container "$JOB_NAME" --tail 300 --only-show-errors >&2 || true
          exit 1

      - name: Deploy immutable API image
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT='${{ steps.release.outputs.target_commit }}' \
            --revision-suffix "p436api-${GITHUB_RUN_ID}" \
            --output none \
            --only-show-errors

      - name: Validate API readiness, authorization boundaries, image, and source marker
        id: validate_api
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          wait_status() {
            local url="$1" expected="$2" status=''
            for attempt in $(seq 1 45); do
              status="$(curl -sS -o /tmp/pr436-response -w '%{http_code}' "$url" || true)"
              if [[ ",$expected," == *",$status,"* ]]; then return 0; fi
              sleep 10
            done
            echo "$url returned $status; expected $expected" >&2
            cat /tmp/pr436-response >&2 || true
            return 1
          }
          wait_status "$BASE/health" '200'
          wait_status "$BASE/api/version" '200'
          wait_status "$BASE/api/celar-ai/v1/platform/readiness" '401'
          wait_status "$BASE/api/financial-operations/modules/040" '401'
          wait_status "$BASE/api/entra-secret-expiration/profile" '401'
          wait_status "$BASE/api/module-availability" '401'

          ACTIVE_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          ACTIVE_SOURCE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query "properties.template.containers[0].env[?name=='PROJECTPULSE_SOURCE_COMMIT'].value | [0]" -o tsv --only-show-errors)"
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors)"
          API_READY_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.latestReadyRevisionName' -o tsv --only-show-errors)"
          [[ "$ACTIVE_API" == '${{ steps.build.outputs.api_image }}' ]]
          [[ "$ACTIVE_SOURCE" == '${{ steps.release.outputs.target_commit }}' ]]
          [[ "${API_MODE,,}" == single ]]
          [[ -n "$API_READY_REVISION" && "$API_READY_REVISION" != null ]]
          echo "ready_revision=$API_READY_REVISION" >> "$GITHUB_OUTPUT"
          echo 'PR436_TEST_API_VALIDATION=PASSED'

      - name: Deploy immutable web image
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "p436web-${GITHUB_RUN_ID}" \
            --output none \
            --only-show-errors

      - name: Validate served web, enterprise markers, immutable images, and ready revisions
        id: validate_web
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          READY=false
          for attempt in $(seq 1 45); do
            BUSTER="pr436-${GITHUB_RUN_ID}-$attempt"
            STATUS="$(curl -sSL -H 'Cache-Control: no-cache' -o /tmp/pr436-index.html -w '%{http_code}' "$BASE/?release_check=$BUSTER" || true)"
            JS="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' /tmp/pr436-index.html | head -1)"
            if [[ "$STATUS" == 200 && -n "$JS" ]]; then
              case "$JS" in
                http*) JS_URL="$JS" ;;
                /*) JS_URL="$BASE$JS" ;;
                *) JS_URL="$BASE/$JS" ;;
              esac
              curl -sSL -H 'Cache-Control: no-cache' -o /tmp/pr436-app.js "$JS_URL?release_check=$BUSTER" || true
              if grep -Fq 'Created by Dr. Ahmed Adeyemi' /tmp/pr436-app.js \
                && grep -Fq 'Analytics Center' /tmp/pr436-app.js \
                && grep -Fq 'What you need to do now' /tmp/pr436-app.js \
                && grep -Fq 'Qualifications & Certifications' /tmp/pr436-app.js; then
                READY=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$READY" == true ]] || {
            echo 'The consolidated PR436 web markers were not served from Test.' >&2
            exit 1
          }

          ACTIVE_API="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          ACTIVE_WEB="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          API_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors)"
          WEB_MODE="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.configuration.activeRevisionsMode' -o tsv --only-show-errors)"
          WEB_READY_REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query 'properties.latestReadyRevisionName' -o tsv --only-show-errors)"
          [[ "$ACTIVE_API" == '${{ steps.build.outputs.api_image }}' ]]
          [[ "$ACTIVE_WEB" == '${{ steps.build.outputs.web_image }}' ]]
          [[ "${API_MODE,,}" == single && "${WEB_MODE,,}" == single ]]
          [[ -n "$WEB_READY_REVISION" && "$WEB_READY_REVISION" != null ]]
          echo "ready_revision=$WEB_READY_REVISION" >> "$GITHUB_OUTPUT"
          echo 'PR436_TEST_WEB_VALIDATION=PASSED'

      - name: Write immutable Test deployment evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cat > evidence/pr436-consolidated-test-deployment.json <<JSON
          {
            "environment": "test",
            "releaseCommit": "${{ steps.release.outputs.target_commit }}",
            "controlCommit": "${{ steps.release.outputs.control_commit }}",
            "workflowRunId": "${{ github.run_id }}",
            "migrations": [
              "060_analytics_center_enterprise_experience",
              "061_celar_ai_capability_routing",
              "062_super_administrator_permanent_full_control",
              "063_project_management_billing_role_access_repair",
              "064_module_065_enterprise_notification_orchestration"
            ],
            "migrationStatus": "applied-and-verified",
            "migrationImage": "${{ steps.migration_image.outputs.image }}",
            "migrationExecution": "${{ steps.migrate.outputs.execution_name }}",
            "apiImage": "${{ steps.build.outputs.api_image }}",
            "webImage": "${{ steps.build.outputs.web_image }}",
            "apiReadyRevision": "${{ steps.validate_api.outputs.ready_revision }}",
            "webReadyRevision": "${{ steps.validate_web.outputs.ready_revision }}",
            "previousApiImage": "${{ steps.before.outputs.old_api_image }}",
            "previousWebImage": "${{ steps.before.outputs.old_web_image }}",
            "previousApiRevision": "${{ steps.before.outputs.old_api_revision }}",
            "previousWebRevision": "${{ steps.before.outputs.old_web_revision }}",
            "previousApiSource": "${{ steps.before.outputs.old_api_source }}",
            "activeRevisionMode": "Single",
            "productionDeployment": false,
            "automaticDatabaseRollback": false
          }
          JSON
          sha256sum evidence/pr436-consolidated-test-deployment.json > evidence/SHA256SUMS
          cat evidence/pr436-consolidated-test-deployment.json

      - name: Upload Test deployment evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr436-consolidated-test-deployment-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Roll back API and web images on deployment failure
        if: ${{ failure() && (steps.deploy_api.outputs.started == 'true' || steps.deploy_web.outputs.started == 'true') }}
        shell: bash
        run: |
          set +e
          echo 'Migrations 060-064 are additive and are not automatically rolled back.'
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.before.outputs.old_api_image }}' \
            --set-env-vars PROJECTPULSE_ENVIRONMENT=test PROJECTPULSE_SOURCE_COMMIT='${{ steps.before.outputs.old_api_source }}' \
            --revision-suffix "p436apirb-${GITHUB_RUN_ID}" \
            --output none \
            --only-show-errors || true
          az containerapp update \
            -g '${{ vars.AZURE_RESOURCE_GROUP }}' \
            -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.before.outputs.old_web_image }}' \
            --revision-suffix "p436webrb-${GITHUB_RUN_ID}" \
            --output none \
            --only-show-errors || true

      - name: Sign out of Azure
        if: always()
        shell: bash
        run: az logout || true
