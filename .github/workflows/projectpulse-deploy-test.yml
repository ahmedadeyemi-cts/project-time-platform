name: ProjectPulse Test-Only Timesheet AI Release b1335bd2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectpulse-deploy-test.yml'
      - '.github/workflows/projectpulse-deploy-celar-ai-private-runtime-test.yml'
      - '.github/workflows/projectpulse-deploy-modules-runtime-hotfix-test.yml'
      - 'scripts/release-test/apply-celar-ai-internal-data-080.sh'

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-deploy-test
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy b1335bd2 with migration 080 and Timesheet AI UAT
    if: github.ref == 'refs/heads/main'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_RELEASE_COMMIT: b1335bd2426d061f85498ace7c7b2a70c3b5bdc6

    steps:
      - name: Check out deployment controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact application release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: b1335bd2426d061f85498ace7c7b2a70c3b5bdc6
          path: release
          fetch-depth: 1
          persist-credentials: false

      - name: Guard the exact application and migration boundary
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ github.event_name }}' == push ]]
          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          RELEASE_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == '${{ github.sha }}' ]]
          [[ "$RELEASE_COMMIT" == "$TARGET_RELEASE_COMMIT" ]]
          git -C control merge-base --is-ancestor "$RELEASE_COMMIT" "$CONTROL_COMMIT"

          test -f release/database/migrations/080_celar_ai_internal_data_intelligence.sql
          test -f release/src/backend/ProjectTime.Api/ProjectPulseAiTimeEntrySuggestionService.cs
          test -f release/src/backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs
          test -f release/src/frontend/project-time-web/src/module001/TimesheetAiDescriptionAssistant.jsx
          test -f control/scripts/release-test/apply-celar-ai-internal-data-080.sh
          test -f control/scripts/release-test/run-migration-job.sh
          test -f control/scripts/build-pr55-acr-image.sh
          test -f control/scripts/wait-containerapp-ready-revision.sh

          bash -n control/scripts/release-test/apply-celar-ai-internal-data-080.sh
          bash -n control/scripts/release-test/run-migration-job.sh
          grep -Fq 'TimesheetActivityTrainingProfessionalDevelopment' release/src/backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs
          grep -Fq 'var externalPrompt = fixedCapsule.Capsule' release/src/backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs
          grep -Fq 'Why the AI suggestion did not complete' release/src/frontend/project-time-web/src/module001/TimesheetAiDescriptionAssistant.jsx
          node release/src/frontend/project-time-web/scripts/validate-module-001-ai-task-grounding.mjs

          echo "control_commit=$CONTROL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'MIGRATION_SCOPE=080_ONLY'
          echo 'OPEN_CLOUD_PRIVATE_RUNTIME=DEFERRED'

      - name: Sign in to the protected Test subscription
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve protected Test contracts and prove UAT session
        id: contract
        shell: bash
        env:
          UAT_SESSION: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}
        run: |
          set -Eeuo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          current_env() {
            jq -r --arg name "$1" '[.properties.template.containers[0].env[]? | select(.name == $name) | .value // empty] | if length == 1 then .[0] else empty end' <<<"$API_JSON"
          }
          current_secret_ref() {
            jq -r --arg name "$1" '[.properties.template.containers[0].env[]? | select(.name == $name) | .secretRef // empty] | if length == 1 then .[0] else empty end' <<<"$API_JSON"
          }
          resolve_digest() {
            local image="$1" registry='${{ vars.AZURE_ACR_NAME }}.azurecr.io/' relative repository digest
            case "$image" in
              "$registry"*@sha256:*) printf '%s\n' "$image"; return ;;
              "$registry"*:*) ;;
              *) fail "Rollback image is outside the approved ACR: $image" ;;
            esac
            relative="${image#"$registry"}"
            repository="${relative%:*}"
            digest="$(az acr repository show --name '${{ vars.AZURE_ACR_NAME }}' --image "$relative" --query digest -o tsv --only-show-errors)"
            [[ "$digest" == sha256:* ]] || fail "Could not resolve rollback digest for $image."
            printf '%s%s@%s\n' "$registry" "$repository" "$digest"
          }

          CURRENT_SUBSCRIPTION="$(az account show --query id -o tsv --only-show-errors)"
          [[ "${CURRENT_SUBSCRIPTION,,}" == "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]] || fail 'Azure login is outside Test.'
          API_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          WEB_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' -o json --only-show-errors)"
          [[ "$(jq -r '.tags.environment // empty' <<<"$API_JSON")" == test ]] || fail 'The API is not tagged as Test.'
          [[ "$(jq -r '.tags.environment // empty' <<<"$WEB_JSON")" == test ]] || fail 'The web app is not tagged as Test.'
          [[ "$(jq -r '.properties.configuration.activeRevisionsMode' <<<"$API_JSON" | tr '[:upper:]' '[:lower:]')" == single ]] || fail 'The API is not in single-revision mode.'
          [[ "$(jq -r '.properties.configuration.activeRevisionsMode' <<<"$WEB_JSON" | tr '[:upper:]' '[:lower:]')" == single ]] || fail 'The web app is not in single-revision mode.'
          [[ -n "$UAT_SESSION" ]] || fail 'PROJECTPULSE_TEST_UAT_SESSION is required.'

          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          [[ "$BASE" == https://phd-west-test.onenecklab.com ]] || fail 'The public origin is not the protected Test site.'
          CATEGORIES="$(curl -fsS --max-time 45 -H 'Cache-Control: no-cache' -H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" -H 'X-ProjectPulse-Module-Number: 001' "$BASE/api/non-project-time-categories")" || fail 'The Test UAT session is expired or unauthorized.'
          jq -e 'any(.categories[]?; ((.name // "") + " " + (.code // "")) | test("training"; "i"))' <<<"$CATEGORIES" >/dev/null || fail 'The active Training category is unavailable.'

          DATABASE_HOST="$(current_env PTP_DB_HOST)"
          DATABASE_PORT="$(current_env PTP_DB_PORT)"
          DATABASE_NAME="$(current_env PTP_DB_NAME)"
          DATABASE_USER="$(current_env PTP_DB_USER)"
          PASSWORD_SECRET_REF="$(current_secret_ref PTP_DB_PASSWORD)"
          [[ "$DATABASE_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}[A-Za-z0-9]$ ]]
          [[ "$DATABASE_PORT" =~ ^[0-9]{1,5}$ ]] && (( DATABASE_PORT >= 1 && DATABASE_PORT <= 65535 ))
          [[ "$DATABASE_NAME" =~ ^[A-Za-z_][A-Za-z0-9_]{0,62}$ ]]
          [[ "$DATABASE_USER" =~ ^[A-Za-z_][A-Za-z0-9_]{0,62}$ ]]
          [[ -n "$PASSWORD_SECRET_REF" ]] || fail 'The database password secret reference is absent.'

          SECRET_JSON="$(az containerapp secret list -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          KEY_VAULT_SECRET_URI="$(jq -r --arg name "$PASSWORD_SECRET_REF" '[.[] | select(.name == $name) | .keyVaultUrl // empty] | if length == 1 then .[0] else empty end' <<<"$SECRET_JSON")"
          MIGRATOR_IDENTITY="$(jq -r --arg name "$PASSWORD_SECRET_REF" '[.[] | select(.name == $name) | .identity // empty] | if length == 1 then .[0] else empty end' <<<"$SECRET_JSON")"
          [[ "$KEY_VAULT_SECRET_URI" =~ ^https://[a-z0-9-]+\.vault\.azure\.net/secrets/[A-Za-z0-9-]+(/[0-9A-Fa-f]{32})?$ ]] || fail 'The database password is not an exact Key Vault reference.'
          [[ "${MIGRATOR_IDENTITY,,}" =~ ^/subscriptions/[^/]+/resourcegroups/[^/]+/providers/microsoft\.managedidentity/userassignedidentities/[^/]+$ ]] || fail 'The migrator identity is invalid.'
          jq -e --arg identity "$MIGRATOR_IDENTITY" '(.identity.userAssignedIdentities // {}) | keys | map(ascii_downcase) | index($identity | ascii_downcase) != null' <<<"$API_JSON" >/dev/null || fail 'The migrator identity is not assigned to the Test API.'

          jq '[.properties.template.containers[0].env[]? | select(.name | test("^PROJECTPULSE_(PRIVATE_|PULSE_AI_PRIVATE_|PULSE_AI_DOCUMENT_|PULSE_AI_CLAMAV|UPLOAD_ROOT)"))] | sort_by(.name)' <<<"$API_JSON" > "$RUNNER_TEMP/private-runtime-before.json"
          jq -c '[.properties.template.containers[0].env[]? | select(.name == "PROJECTPULSE_SOURCE_COMMIT")] | if length == 1 then .[0] else null end' <<<"$API_JSON" > "$RUNNER_TEMP/source-commit-before.json"

          RAW_API_IMAGE="$(jq -r '.properties.template.containers[0].image' <<<"$API_JSON")"
          RAW_WEB_IMAGE="$(jq -r '.properties.template.containers[0].image' <<<"$WEB_JSON")"
          OLD_API_IMAGE="$(resolve_digest "$RAW_API_IMAGE")"
          OLD_WEB_IMAGE="$(resolve_digest "$RAW_WEB_IMAGE")"
          echo "old_api_image=$OLD_API_IMAGE" >> "$GITHUB_OUTPUT"
          echo "old_web_image=$OLD_WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo "migrator_identity=$MIGRATOR_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "key_vault_uri=${KEY_VAULT_SECRET_URI%%/secrets/*}" >> "$GITHUB_OUTPUT"
          echo "database_password_secret_name=${KEY_VAULT_SECRET_URI#*/secrets/}" >> "$GITHUB_OUTPUT"
          echo "database_host=$DATABASE_HOST" >> "$GITHUB_OUTPUT"
          echo "database_port=$DATABASE_PORT" >> "$GITHUB_OUTPUT"
          echo "database_name=$DATABASE_NAME" >> "$GITHUB_OUTPUT"
          echo "database_user=$DATABASE_USER" >> "$GITHUB_OUTPUT"

      - name: Build checksum-pinned migration 080 image
        id: migration
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/celar-ai-080-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          install -m 0644 control/deployment/containers/pr55-migrator/Dockerfile "$CONTEXT/Dockerfile"
          install -m 0755 control/scripts/release-test/apply-celar-ai-internal-data-080.sh "$CONTEXT/apply-pr55-test-migrations.sh"
          install -m 0644 release/database/migrations/080_celar_ai_internal_data_intelligence.sql "$CONTEXT/migrations/080_celar_ai_internal_data_intelligence.sql"
          (cd "$CONTEXT/migrations" && sha256sum 080_celar_ai_internal_data_intelligence.sql > SHA256SUMS)
          printf '%s\n' "$TARGET_RELEASE_COMMIT" > "$CONTEXT/release-commit"
          DIGEST="$(control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-celar-ai-080:$TARGET_RELEASE_COMMIT-${GITHUB_RUN_ID}" "$CONTEXT/Dockerfile" "$CONTEXT")"
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-celar-ai-080@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Apply and verify migration 080 inside the private Test network
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CELAR_MIGRATOR_IDENTITY_RESOURCE_ID: ${{ steps.contract.outputs.migrator_identity }}
          AZURE_KEY_VAULT_URI: ${{ steps.contract.outputs.key_vault_uri }}
          PROJECTPULSE_DATABASE_PASSWORD_SECRET_NAME: ${{ steps.contract.outputs.database_password_secret_name }}
          PROJECTPULSE_TEST_DATABASE_HOST: ${{ steps.contract.outputs.database_host }}
          PROJECTPULSE_TEST_DATABASE_PORT: ${{ steps.contract.outputs.database_port }}
          PROJECTPULSE_TEST_DATABASE_NAME: ${{ steps.contract.outputs.database_name }}
          PROJECTPULSE_TEST_DATABASE_USER: ${{ steps.contract.outputs.database_user }}
          MAIN_RELEASE_CONTROL_SHA: ${{ steps.release.outputs.control_commit }}
          MAIN_RELEASE_EXPECTED_RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          MAIN_RELEASE_MIGRATION_SCOPE: celar-ai-internal-data-080-b1335bd2-test
          MAIN_RELEASE_MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
        run: |
          set -Eeuo pipefail
          MAIN_RELEASE_MIGRATION_JOB_NAME="ca080-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-a" MAIN_RELEASE_MIGRATION_MODE=apply bash control/scripts/release-test/run-migration-job.sh
          MAIN_RELEASE_MIGRATION_JOB_NAME="ca080-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-v" MAIN_RELEASE_MIGRATION_MODE=verify bash control/scripts/release-test/run-migration-job.sh

      - name: Build immutable API and web images from b1335bd2
        id: build
        shell: bash
        working-directory: release
        run: |
          set -Eeuo pipefail
          API_DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-api:timesheet-ai-$TARGET_RELEASE_COMMIT-${GITHUB_RUN_ID}" deployment/containers/api/Dockerfile .)"
          WEB_DIGEST="$(../control/scripts/build-pr55-acr-image.sh '${{ vars.AZURE_ACR_NAME }}' "project-health-dashboard-web:timesheet-ai-$TARGET_RELEASE_COMMIT-${GITHUB_RUN_ID}" deployment/containers/web/Dockerfile .)"
          echo "api_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-api@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-web@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy API image without private-runtime activation
        id: deploy_api
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' \
            --image '${{ steps.build.outputs.api_image }}' \
            --set-env-vars PROJECTPULSE_SOURCE_COMMIT="$TARGET_RELEASE_COMMIT" \
            --revision-suffix "tsai-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none --only-show-errors
          REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
          bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_API_APP }}' "$REVISION" '${{ steps.build.outputs.api_image }}' 60 10
          AFTER_JSON="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' -o json --only-show-errors)"
          jq '[.properties.template.containers[0].env[]? | select(.name | test("^PROJECTPULSE_(PRIVATE_|PULSE_AI_PRIVATE_|PULSE_AI_DOCUMENT_|PULSE_AI_CLAMAV|UPLOAD_ROOT)"))] | sort_by(.name)' <<<"$AFTER_JSON" > "$RUNNER_TEMP/private-runtime-after.json"
          diff -u "$RUNNER_TEMP/private-runtime-before.json" "$RUNNER_TEMP/private-runtime-after.json"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy web image
        id: deploy_web
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' \
            --image '${{ steps.build.outputs.web_image }}' \
            --revision-suffix "tsaiw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none --only-show-errors
          REVISION="$(az containerapp show -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --query properties.latestRevisionName -o tsv --only-show-errors)"
          bash control/scripts/wait-containerapp-ready-revision.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_WEB_APP }}' "$REVISION" '${{ steps.build.outputs.web_image }}' 60 10
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Prove exact release and Timesheet AI Working on training behavior
        id: uat
        shell: bash
        env:
          UAT_SESSION: ${{ secrets.PROJECTPULSE_TEST_UAT_SESSION }}
        run: |
          set -Eeuo pipefail
          BASE='${{ vars.PUBLIC_URL }}'; BASE="${BASE%/}"
          auth=(-H "Authorization: Bearer $UAT_SESSION" -H "X-ProjectPulse-Session: $UAT_SESSION" -H 'X-ProjectPulse-Module-Number: 001')

          READY=false
          for attempt in $(seq 1 36); do
            STAMP="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$BASE/release.json?release=$GITHUB_RUN_ID-$attempt" || true)"
            if jq -e --arg sha "$TARGET_RELEASE_COMMIT" '.sourceSha == $sha' <<<"$STAMP" >/dev/null 2>&1 \
              && curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$BASE/health" >/dev/null; then
              READY=true
              break
            fi
            sleep 10
          done
          [[ "$READY" == true ]]

          CATEGORIES="$(curl -fsS --max-time 45 -H 'Cache-Control: no-cache' "${auth[@]}" "$BASE/api/non-project-time-categories")"
          CATEGORY="$(jq -c '[.categories[]? | select(((.name // "") + " " + (.code // "")) | test("training"; "i"))] | first // empty' <<<"$CATEGORIES")"
          [[ -n "$CATEGORY" ]]
          CATEGORY_ID="$(jq -r .id <<<"$CATEGORY")"
          CATEGORY_NAME="$(jq -r .name <<<"$CATEGORY")"
          CATEGORY_CODE="$(jq -r '.code // ""' <<<"$CATEGORY")"
          PAYLOAD="$(jq -nc --arg id "$CATEGORY_ID" --arg name "$CATEGORY_NAME" --arg code "$CATEGORY_CODE" '{workDate:(now|strftime("%Y-%m-%d")),timeEntryId:null,assignmentId:null,projectId:null,taskId:null,nonProjectTimeCategoryId:$id,timeType:"regular",rowType:"nonProject",rowLabel:$name,customerName:null,projectName:null,projectCode:null,taskName:null,taskCode:null,categoryCode:$code,hours:0.5,currentDescription:"Working on training"}')"
          RESPONSE_FILE="$RUNNER_TEMP/timesheet-working-on-training.json"
          HTTP_STATUS="$(curl -sS --max-time 120 -o "$RESPONSE_FILE" -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'Content-Type: application/json' -H "Origin: $BASE" "${auth[@]}" -d "$PAYLOAD" "$BASE/api/timesheets/ai-description-suggestions")"
          [[ "$HTTP_STATUS" == 200 ]] || { jq '{status,error,warning,targetDecisions}' "$RESPONSE_FILE" >&2 || true; exit 1; }
          jq -e '
            .status == "ai_suggestion_generated" and
            ((.provider // "") | ascii_downcase) as $provider |
            ($provider == "celar_ai" or $provider == "claude" or $provider == "openai") and
            ((.suggestion // "") | length) >= 90 and
            ((.suggestion // "") | contains("[REDACTED_") | not) and
            any(.targetDecisions[]?; ((.target // "") | ascii_downcase) == $provider and ((.outcome // "") | ascii_downcase) == "used")
          ' "$RESPONSE_FILE" >/dev/null
          jq '{status,provider,suggestionLength:(.suggestion|length),successfulTarget:(.targetDecisions[]? | select((.outcome|ascii_downcase)=="used") | {target,outcome,reasonCode})}' "$RESPONSE_FILE" > "$RUNNER_TEMP/timesheet-ai-uat-evidence.json"
          echo "provider=$(jq -r .provider "$RESPONSE_FILE")" >> "$GITHUB_OUTPUT"

      - name: Publish deployment evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          jq -n \
            --arg releaseCommit "$TARGET_RELEASE_COMMIT" \
            --arg controlCommit '${{ steps.release.outputs.control_commit }}' \
            --arg migrationImage '${{ steps.migration.outputs.image }}' \
            --arg apiImage '${{ steps.build.outputs.api_image }}' \
            --arg webImage '${{ steps.build.outputs.web_image }}' \
            --arg apiRevision '${{ steps.deploy_api.outputs.revision }}' \
            --arg webRevision '${{ steps.deploy_web.outputs.revision }}' \
            --argjson timesheetUat "$(cat "$RUNNER_TEMP/timesheet-ai-uat-evidence.json")" \
            '{environment:"test",releaseCommit:$releaseCommit,controlCommit:$controlCommit,migrationsApplied:["080"],migration081:"not_applied",openCloudPrivateRuntime:"deferred",privateRuntimeConfigurationChanged:false,migrationImage:$migrationImage,apiImage:$apiImage,webImage:$webImage,apiRevision:$apiRevision,webRevision:$webRevision,timesheetWorkingOnTraining:$timesheetUat}' \
            > evidence/timesheet-ai-b1335bd2-test-deployment.json

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timesheet-ai-b1335bd2-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/timesheet-ai-b1335bd2-test-deployment.json
          retention-days: 30

      - name: Restore prior images and source marker on failure
        if: ${{ failure() && steps.deploy_api.outputs.started == 'true' }}
        shell: bash
        run: |
          set +e
          SOURCE_ROW="$(cat "$RUNNER_TEMP/source-commit-before.json" 2>/dev/null)"
          if [[ -n "$SOURCE_ROW" && "$SOURCE_ROW" != null ]]; then
            SOURCE_SECRET="$(jq -r '.secretRef // empty' <<<"$SOURCE_ROW")"
            SOURCE_VALUE="$(jq -r '.value // empty' <<<"$SOURCE_ROW")"
            [[ -n "$SOURCE_SECRET" ]] && SOURCE_ARG="PROJECTPULSE_SOURCE_COMMIT=secretref:$SOURCE_SECRET" || SOURCE_ARG="PROJECTPULSE_SOURCE_COMMIT=$SOURCE_VALUE"
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --image '${{ steps.contract.outputs.old_api_image }}' --set-env-vars "$SOURCE_ARG" --revision-suffix "tsairb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
          else
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_API_APP }}' --image '${{ steps.contract.outputs.old_api_image }}' --remove-env-vars PROJECTPULSE_SOURCE_COMMIT --revision-suffix "tsairb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
          fi
          if [[ '${{ steps.deploy_web.outputs.started }}' == true ]]; then
            az containerapp update -g '${{ vars.AZURE_RESOURCE_GROUP }}' -n '${{ vars.AZURE_WEB_APP }}' --image '${{ steps.contract.outputs.old_web_image }}' --revision-suffix "tsaiwrb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output none --only-show-errors
          fi
