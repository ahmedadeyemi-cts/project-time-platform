name: ProjectPulse Apply Group 4 Migration 050 to Test

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact verified Group 4 source release
        required: true
        default: 24fb92d751726b1bab66c11d902c0b2571701b23
        type: string
      confirmation:
        description: Enter APPLY-GROUP4-MIGRATION-050-TO-TEST
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: projectpulse-group4-migration-050-test
  cancel-in-progress: false

jobs:
  migrate:
    name: Guarded Group 4 migration 050 Test operation
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_RELEASE_COMMIT: 24fb92d751726b1bab66c11d902c0b2571701b23
      SOURCE_BASELINE_COMMIT: e2b514e4820e0956a6328db97c74e41dd59fd662

    steps:
      - name: Check out migration controls
        uses: actions/checkout@v5
        with:
          path: control
          fetch-depth: 0

      - name: Check out exact Group 4 source release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_commit }}
          path: release
          fetch-depth: 0

      - name: Guard workflow source and exact migration release
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$WORKFLOW_SOURCE_REF" == 'refs/heads/main' ]]
          [[ "$DISPATCH_CONFIRMATION" == 'APPLY-GROUP4-MIGRATION-050-TO-TEST' ]]
          [[ "$DISPATCH_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]

          CONTROL_COMMIT="$(git -C control rev-parse HEAD)"
          TARGET_COMMIT="$(git -C release rev-parse HEAD)"
          [[ "$CONTROL_COMMIT" == "$WORKFLOW_SOURCE_SHA" ]]
          [[ "$TARGET_COMMIT" == "$DISPATCH_RELEASE_COMMIT" ]]
          [[ "$TARGET_COMMIT" == "$EXPECTED_RELEASE_COMMIT" ]]
          git -C control merge-base --is-ancestor "$TARGET_COMMIT" HEAD

          test -f release/database/migrations/050_project_notification_routing_and_schedules.sql
          test -f release/database/rollback/050_project_notification_routing_and_schedules_rollback.sql
          test -f release/tests/test-project-notification-migration-050.sh
          test -f control/scripts/apply-group4-migration-050-test.sh
          test -f control/scripts/run-group4-migration-050-test-job.sh

          mapfile -t DATABASE_CHANGED < <(
            git -C release diff --name-only "$SOURCE_BASELINE_COMMIT...$TARGET_COMMIT" |
              grep '^database/' |
              sort
          )
          cat > /tmp/expected-db.txt <<'EOF'
          database/migrations/050_project_notification_routing_and_schedules.sql
          database/rollback/050_project_notification_routing_and_schedules_rollback.sql
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/expected-db.txt
          sort -o /tmp/expected-db.txt /tmp/expected-db.txt
          diff -u /tmp/expected-db.txt <(printf '%s\n' "${DATABASE_CHANGED[@]}")

          grep -Fq "'050_project_notification_routing_and_schedules'" release/database/migrations/050_project_notification_routing_and_schedules.sql
          grep -Fq "migration_id = '050_project_notification_routing_and_schedules'" release/database/rollback/050_project_notification_routing_and_schedules_rollback.sql
          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'GROUP4_MIGRATION_050_RELEASE_GUARD=PASS'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Load Test database connection
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
        run: bash control/scripts/export-pr55-test-database-url.sh

      - name: Build checksum-pinned migration 050 image
        id: migration
        shell: bash
        run: |
          set -Eeuo pipefail
          CONTEXT="$RUNNER_TEMP/group4-migration-050-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$CONTEXT/migrations"
          install -m 0644 control/deployment/containers/pr55-migrator/Dockerfile "$CONTEXT/Dockerfile"
          install -m 0755 control/scripts/apply-group4-migration-050-test.sh "$CONTEXT/apply-pr55-test-migrations.sh"
          install -m 0644 release/database/migrations/050_project_notification_routing_and_schedules.sql "$CONTEXT/migrations/050_project_notification_routing_and_schedules.sql"
          (
            cd "$CONTEXT/migrations"
            sha256sum 050_project_notification_routing_and_schedules.sql > SHA256SUMS
          )
          printf '%s\n' '${{ steps.release.outputs.target_commit }}' > "$CONTEXT/release-commit"
          DIGEST="$(control/scripts/build-pr55-acr-image.sh \
            '${{ vars.AZURE_ACR_NAME }}' \
            "project-health-dashboard-group4-migration050:${{ steps.release.outputs.target_commit }}-${GITHUB_SHA:0:12}" \
            "$CONTEXT/Dockerfile" \
            "$CONTEXT")"
          [[ "$DIGEST" == sha256:* ]]
          echo "image=${{ vars.AZURE_ACR_NAME }}.azurecr.io/project-health-dashboard-group4-migration050@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Apply or verify migration 050 inside private network
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          GROUP4_MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
          GROUP4_MIGRATION_JOB_NAME: g4m50-${{ github.run_id }}-${{ github.run_attempt }}-a
          GROUP4_MIGRATION_MODE: apply
        run: bash control/scripts/run-group4-migration-050-test-job.sh

      - name: Reverify migration 050 without database writes
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          GROUP4_MIGRATION_IMAGE: ${{ steps.migration.outputs.image }}
          GROUP4_MIGRATION_JOB_NAME: g4m50-${{ github.run_id }}-${{ github.run_attempt }}-v
          GROUP4_MIGRATION_MODE: verify
        run: bash control/scripts/run-group4-migration-050-test-job.sh

      - name: Write immutable migration evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p control/evidence
          cat > control/evidence/group4-migration-050-test.json <<JSON
          {
            "environment": "test",
            "releaseCommit": "${{ steps.release.outputs.target_commit }}",
            "workflowCommit": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "migrationId": "050_project_notification_routing_and_schedules",
            "migrationImage": "${{ steps.migration.outputs.image }}",
            "migrationDigest": "${{ steps.migration.outputs.digest }}",
            "databaseMigration": true,
            "applyOrVerifyJob": "succeeded",
            "verifyOnlyJob": "succeeded",
            "operationalCountsPreserved": true,
            "immutableEvidenceTriggersVerified": true,
            "apiWebDeployment": false,
            "emailSent": false,
            "microsoftGraphCalled": false,
            "credentialValuesChanged": false,
            "productionChanged": false,
            "manualRollbackSource": "database/rollback/050_project_notification_routing_and_schedules_rollback.sql"
          }
          JSON

      - name: Upload immutable migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: group4-migration-050-test-${{ github.run_id }}
          path: control/evidence/group4-migration-050-test.json
          retention-days: 30
