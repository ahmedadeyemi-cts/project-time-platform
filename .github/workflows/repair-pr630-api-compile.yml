name: Repair PR 630 API Compile Contracts

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/repair-pr630-api-compile.yml

permissions:
  contents: write

concurrency:
  group: repair-pr630-api-compile
  cancel-in-progress: false

jobs:
  repair:
    name: Apply bounded compiler corrections and remove this workflow
    if: >-
      github.event.pull_request.number == 630 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/ask-celar-ai-troubleshooting-defect-automation-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: 90a483fdff6271184e8b9a05782c2813605b4e2f
      HEAD_BRANCH: feature/ask-celar-ai-troubleshooting-defect-automation-20260810
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact repository, branch, and parent
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == 'ahmedadeyemi-cts/project-time-platform' ]]
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT" ]]
          [[ "$(git rev-parse HEAD)" == '${{ github.event.pull_request.head.sha }}' ]]

      - name: Correct the three compiler failures
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          exact_replacements = {
              Path('src/backend/ProjectTime.Api/Ai/CelarAiDefectOrchestrationService.cs'): (
                  'endpointCheck.Allowed',
                  'endpointCheck.Approved',
              ),
              Path('src/backend/ProjectTime.Api/Ai/CelarAiRealProbeService.cs'): (
                  'endpointCheck.Allowed',
                  'endpointCheck.Approved',
              ),
          }
          for file, (old, new) in exact_replacements.items():
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{file}: expected exactly one {old!r}, found {text.count(old)}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          governance = Path('src/backend/ProjectTime.Api/Ai/CelarAiExecutionGovernance.cs')
          text = governance.read_text(encoding='utf-8')
          start_marker = '        var values = element.EnumerateArray().Take(25)'
          end_marker = '        return values;'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit(f'{governance}: ref-capturing array start was not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit(f'{governance}: ref-capturing array end was not found')
          end += len(end_marker)
          existing = text[start:end]
          required_fragments = (
              '.Select(item => Read(item, depth + 1, ref propertyCount))',
              'if (element.GetArrayLength() > 25)',
              'Evidence metadata arrays are limited to 25 values.',
          )
          if not all(fragment in existing for fragment in required_fragments):
              raise SystemExit(f'{governance}: the bounded array block did not match the expected contract')
          replacement = '''        if (element.GetArrayLength() > 25)
              throw new InvalidOperationException("Evidence metadata arrays are limited to 25 values.");

          var values = new List<object?>(element.GetArrayLength());
          foreach (var item in element.EnumerateArray())
              values.Add(Read(item, depth + 1, ref propertyCount));
          return values;'''
          governance.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          rm -- .github/workflows/repair-pr630-api-compile.yml
          git diff --check
          git diff --exit-code -- . ':!src/backend/ProjectTime.Api/Ai/CelarAiDefectOrchestrationService.cs' ':!src/backend/ProjectTime.Api/Ai/CelarAiRealProbeService.cs' ':!src/backend/ProjectTime.Api/Ai/CelarAiExecutionGovernance.cs' ':!.github/workflows/repair-pr630-api-compile.yml'

      - name: Commit bounded corrections to PR 630
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ahmedadeyemi-cts'
          git config user.email 'ahmedadeyemi@gmail.com'
          git add -- \
            src/backend/ProjectTime.Api/Ai/CelarAiDefectOrchestrationService.cs \
            src/backend/ProjectTime.Api/Ai/CelarAiRealProbeService.cs \
            src/backend/ProjectTime.Api/Ai/CelarAiExecutionGovernance.cs \
            .github/workflows/repair-pr630-api-compile.yml
          git commit -m 'Fix Ask Celar AI API compile contracts'
          git push origin "HEAD:${HEAD_BRANCH}"
