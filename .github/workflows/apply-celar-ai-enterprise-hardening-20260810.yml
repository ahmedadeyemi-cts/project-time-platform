name: Apply Celar AI Enterprise Runtime Routing and Theme Hardening

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/apply-celar-ai-enterprise-hardening-20260810.mjs
      - .github/workflows/apply-celar-ai-enterprise-hardening-20260810.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: celar-ai-enterprise-hardening-20260810
  cancel-in-progress: false

jobs:
  apply:
    name: Apply, build, validate, and commit the enterprise correction
    if: github.event.pull_request.head.ref == 'fix/celar-ai-enterprise-runtime-routing-theme-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the exact correction branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard the source-only branch boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_EVENT_NAME" == pull_request ]]
          [[ "$GITHUB_HEAD_REF" == fix/celar-ai-enterprise-runtime-routing-theme-20260810 ]]
          test -f tools/apply-celar-ai-enterprise-hardening-20260810.mjs
          test -f .github/workflows/apply-celar-ai-enterprise-hardening-20260810.yml
          echo 'DEPLOYMENT_EXECUTED=NONE'
          echo 'MIGRATIONS_APPLIED=NONE'
          echo 'SECRET_VALUES_READ=NONE'
          echo 'PRODUCTION_MUTATION=NONE'

      - name: Detect whether the validated source is already committed
        id: mode
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f src/backend/ProjectTime.Api/Ai/CelarAiPublicEntityRegistry.cs ]] \
            && [[ -f src/frontend/project-time-web/src/enterprise-theme-completion.css ]] \
            && grep -Fq "import './enterprise-theme-completion.css';" src/frontend/project-time-web/src/main.jsx; then
            echo 'already_applied=true' >> "$GITHUB_OUTPUT"
            echo 'CELAR_AI_ENTERPRISE_HARDENING_SOURCE=ALREADY_COMMITTED'
          else
            echo 'already_applied=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the bounded source correction
        if: steps.mode.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -i \
            -e 's/nonAnswerCodeCount !== 3/nonAnswerCodeCount !== 2/' \
            -e 's/expected 3 remaining uses/expected 2 remaining uses/' \
            tools/apply-celar-ai-enterprise-hardening-20260810.mjs
          python3 - <<'PY'
          from pathlib import Path

          patch = Path('tools/apply-celar-ai-enterprise-hardening-20260810.mjs')
          source = patch.read_text(encoding='utf-8')
          old = """  `import './enterprise-contrast-guard.css';\\n`,
            `import './enterprise-contrast-guard.css';\\nimport './enterprise-theme-completion.css';\\n`,"""
          new = """  `import './enterprise-contrast-guard.css';\\n`,
            `import './enterprise-theme-completion.css';\\nimport './enterprise-contrast-guard.css';\\n`,"""
          if source.count(old) != 1:
              raise SystemExit('Theme import-order patch was not exact.')
          patch.write_text(source.replace(old, new), encoding='utf-8')
          PY
          node tools/apply-celar-ai-enterprise-hardening-20260810.mjs
          node src/frontend/project-time-web/scripts/validate-celar-ai-enterprise-hardening.mjs
          git diff --check

      - name: Compile the backend
        if: steps.mode.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet restore src/backend/ProjectTime.Api/ProjectTime.Api.csproj
          dotnet build src/backend/ProjectTime.Api/ProjectTime.Api.csproj -c Release --no-restore

      - name: Build the complete frontend
        if: steps.mode.outputs.already_applied != 'true'
        shell: bash
        working-directory: src/frontend/project-time-web
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          npm ci
          set +e
          npm run build > "$RUNNER_TEMP/celar-ai-frontend-build.log" 2>&1
          BUILD_STATUS=$?
          set -e
          if (( BUILD_STATUS != 0 )); then
            {
              echo '### Celar AI enterprise-hardening frontend build diagnostic'
              echo
              echo 'The complete frontend build failed. The final bounded log lines are shown below; no secret, environment, endpoint, token, or customer data is included.'
              echo
              echo '```text'
              tail -n 180 "$RUNNER_TEMP/celar-ai-frontend-build.log"
              echo '```'
            } > "$RUNNER_TEMP/celar-ai-frontend-build-comment.md"
            cat "$RUNNER_TEMP/celar-ai-frontend-build-comment.md"
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/celar-ai-frontend-build-comment.md"
            exit "$BUILD_STATUS"
          fi
          tail -n 40 "$RUNNER_TEMP/celar-ai-frontend-build.log"

      - name: Re-run focused enterprise validation
        if: steps.mode.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          node src/frontend/project-time-web/scripts/validate-celar-ai-enterprise-hardening.mjs
          node src/frontend/project-time-web/scripts/validate-celar-ai-external-deidentification.mjs
          node src/frontend/project-time-web/scripts/validate-celar-ai-production-readiness.mjs
          node src/frontend/project-time-web/scripts/validate-celar-ai-runtime-rebrand.mjs

      - name: Publish the validated Oracle workflow handoff
        if: steps.mode.outputs.already_applied != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          gzip -c .github/workflows/celar-ai-oracle-test-runtime-deploy.yml \
            | base64 -w0 > "$RUNNER_TEMP/celar-ai-oracle-workflow.gz.b64"
          {
            echo '<!-- CELAR_AI_ORACLE_WORKFLOW_GZIP_BASE64_START -->'
            cat "$RUNNER_TEMP/celar-ai-oracle-workflow.gz.b64"
            echo
            echo '<!-- CELAR_AI_ORACLE_WORKFLOW_GZIP_BASE64_END -->'
          } > "$RUNNER_TEMP/celar-ai-oracle-workflow-handoff.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/celar-ai-oracle-workflow-handoff.md"
          echo 'ORACLE_WORKFLOW_HANDOFF=SANITIZED_SOURCE_ONLY'

      - name: Commit and push the validated application source
        if: steps.mode.outputs.already_applied != 'true'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git add \
            src/backend/ProjectTime.Api/Ai/CelarAiPublicEntityRegistry.cs \
            src/backend/ProjectTime.Api/Ai/PulseAiSystemKnowledgeCatalog.cs \
            src/backend/ProjectTime.Api/Ai/CelarAiCapabilityRouting.cs \
            src/frontend/project-time-web/src/main.jsx \
            src/frontend/project-time-web/src/enterprise-theme-completion.css \
            src/frontend/project-time-web/src/CelarAiCapabilityRoutingPanel.jsx \
            src/frontend/project-time-web/scripts/validate-celar-ai-enterprise-hardening.mjs \
            docs/modules/module-011-pulse-ai/CELAR-AI-ENTERPRISE-QUESTION-ROUTING.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No application source changes were produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete Celar AI runtime routing and theme hardening'
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Publish completion boundary
        if: steps.mode.outputs.already_applied != 'true'
        shell: bash
        run: |
          echo 'CELAR_AI_ENTERPRISE_HARDENING_SOURCE=COMMITTED'
          echo 'ORACLE_WORKFLOW_UPDATE=PENDING_CONNECTOR_HANDOFF'
          echo 'DEPLOYMENT_EXECUTED=NONE'
          echo 'MIGRATIONS_APPLIED=NONE'
          echo 'PRODUCTION_MUTATION=NONE'
